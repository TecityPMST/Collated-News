<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tecity News Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#fbfbfa; --surface:#ffffff; --surface-2:#f6f6f4;
    --text:#16181d; --muted:#6c727e; --faint:#9aa0ab;
    --border:#ececec; --border-2:#e2e2e0; --ink:#16181d;
    --hover:#f4f4f2; --ring:rgba(20,23,28,.10);
    --shadow:0 1px 2px rgba(16,18,22,.04), 0 8px 24px rgba(16,18,22,.05);
    --shadow-sm:0 1px 2px rgba(16,18,22,.05);
    --wsj:#D85A30; --st:#1D9E75; --bt:#378ADD; --scmp:#D4537E;
    --maxw:1120px;
  }
  html[data-theme="dark"]{
    --bg:#0c0d10; --surface:#15171c; --surface-2:#1b1e25;
    --text:#eceef2; --muted:#9aa1ad; --faint:#6b7280;
    --border:#252830; --border-2:#2d313b; --ink:#eceef2;
    --hover:#1c1f26; --ring:rgba(255,255,255,.12);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-feature-settings:"cv02","cv03","cv04","ss01";
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    line-height:1.6;
  }
  ::selection{background:rgba(120,120,120,.18)}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px}
  .num{font-variant-numeric:tabular-nums}
  .eyebrow{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); font-weight:600}

  /* header */
  header.top{position:sticky; top:0; z-index:20; backdrop-filter:saturate(180%) blur(14px);
    background:color-mix(in srgb, var(--bg) 82%, transparent); border-bottom:1px solid var(--border)}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 28px; max-width:var(--maxw); margin:0 auto}
  .brand{display:flex; flex-direction:column; gap:2px; min-width:0}
  .brand .title{font-size:16px; font-weight:600; letter-spacing:-.01em}
  .brand .meta{font-size:12.5px; color:var(--muted)}
  .controls{display:flex; align-items:center; gap:10px}
  select.date{appearance:none; font:inherit; font-size:13px; font-weight:500; color:var(--text);
    background:var(--surface); border:1px solid var(--border-2); border-radius:10px; padding:8px 32px 8px 12px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239aa0ab' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right 10px center; cursor:pointer; transition:border-color .15s}
  select.date:hover{border-color:var(--ink)}
  .toggle{display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; cursor:pointer;
    background:var(--surface); border:1px solid var(--border-2); border-radius:10px; color:var(--muted); transition:.15s}
  .toggle:hover{color:var(--text); border-color:var(--ink)}
  .toggle svg{width:17px; height:17px}

  /* hero digest */
  .hero{padding:48px 0 14px}
  .hero .eyebrow{margin-bottom:16px}
  .digest{font-size:clamp(25px,3.6vw,37px); line-height:1.22; font-weight:400; letter-spacing:-.02em;
    max-width:none; color:var(--text)}
  .digest .lead{max-width:none}

  /* metrics */
  .metrics{display:grid; grid-template-columns:repeat(6,1fr); gap:14px; padding:30px 0 8px}
  .metric{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 18px 16px; box-shadow:var(--shadow-sm); transition:.18s}
  .metric:hover{box-shadow:var(--shadow); transform:translateY(-2px)}
  .metric .v{font-size:27px; font-weight:600; letter-spacing:-.03em; line-height:1.05}
  .metric .l{font-size:12.5px; font-weight:500; margin-top:8px}
  .metric .s{font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.4}

  /* tabs */
  .tabs{display:flex; gap:26px; margin:34px 0 0; border-bottom:1px solid var(--border)}
  .tab{position:relative; cursor:pointer; padding:0 0 14px; font-size:14px; font-weight:500; color:var(--muted); transition:color .15s}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--text)}
  .tab.active::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--ink); border-radius:2px}

  .section{padding:30px 0 0}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px}
  .section-head h2{margin:0; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:600}
  .section-head .hint{font-size:12.5px; color:var(--muted)}

  /* lead briefing card */
  .lead-card{background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:30px 32px; box-shadow:var(--shadow); margin-bottom:16px}
  .lead-card .k{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); font-weight:600; margin-bottom:12px}
  .lead-card h3{margin:0 0 12px; font-size:23px; font-weight:600; letter-spacing:-.02em; line-height:1.2}
  .lead-card p{margin:0; font-size:15.5px; color:var(--text); line-height:1.65; max-width:none; column-width:34ch; column-gap:48px; column-fill:balance}

  /* briefing grid */
  .cards{display:grid; grid-template-columns:repeat(2,1fr); gap:16px}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px 26px; box-shadow:var(--shadow-sm); transition:.18s}
  .card:hover{box-shadow:var(--shadow); transform:translateY(-2px)}
  .card h3{margin:0 0 10px; font-size:16.5px; font-weight:600; letter-spacing:-.01em; line-height:1.3}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.62}

  /* coverage / bars */
  .split{display:grid; grid-template-columns:1.5fr 1fr; gap:16px; align-items:start}
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px 26px; box-shadow:var(--shadow-sm)}
  .bar-row{display:flex; align-items:center; gap:14px; margin:14px 0}
  .bar-row .name{width:42px; font-size:12.5px; font-weight:600; letter-spacing:.02em}
  .bar-track{flex:1; height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden}
  .bar-fill{height:100%; border-radius:99px}
  .bar-row .cnt{width:26px; text-align:right; font-size:12.5px; color:var(--muted); font-weight:600}

  /* article */
  .feed-controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:4px 0 18px}
  .search{flex:1 1 260px; position:relative}
  .search svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--faint)}
  .search input{width:100%; font:inherit; font-size:14px; color:var(--text); background:var(--surface);
    border:1px solid var(--border-2); border-radius:12px; padding:11px 14px 11px 38px; outline:none; transition:.15s}
  .search input:focus{border-color:var(--ink); box-shadow:0 0 0 4px var(--ring)}
  .pills{display:flex; flex-wrap:wrap; gap:8px}
  .pill{cursor:pointer; font-size:12.5px; font-weight:500; color:var(--muted); background:var(--surface);
    border:1px solid var(--border-2); border-radius:99px; padding:7px 13px; user-select:none; transition:.14s; line-height:1}
  .pill:hover{border-color:var(--ink); color:var(--text)}
  .pill.active{color:#fff; border-color:transparent}
  .tagrow{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .count{font-size:12.5px; color:var(--muted); margin-bottom:14px}

  .article{padding:22px 4px; border-bottom:1px solid var(--border)}
  .article:first-child{padding-top:6px}
  .article .head{display:flex; align-items:center; gap:12px; margin-bottom:9px; flex-wrap:wrap}
  .src{display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:600; letter-spacing:.04em; color:var(--muted)}
  .src .dot{width:8px; height:8px; border-radius:99px}
  .article h4{margin:0; font-size:16.5px; font-weight:600; letter-spacing:-.01em; line-height:1.32; flex:1; min-width:240px}
  .article h4 a{color:inherit; text-decoration:none; transition:color .15s}
  .article h4 a:hover{color:var(--wsj-hover, var(--muted))}
  .article .date{font-size:12px; color:var(--faint); white-space:nowrap}
  .article p{margin:6px 0 12px; font-size:14.5px; color:var(--muted); line-height:1.62; max-width:88ch}
  .tags{display:flex; flex-wrap:wrap; gap:7px}
  .tag{font-size:11px; font-weight:600; letter-spacing:.01em; border-radius:99px; padding:3px 10px; border:1px solid transparent}

  .empty{text-align:center; color:var(--muted); padding:60px 0; font-size:14px}
  footer{padding:48px 0 60px; color:var(--faint); font-size:12px; text-align:center}

  @media(max-width:980px){
    .metrics{grid-template-columns:repeat(3,1fr)}
    .cards{grid-template-columns:1fr}
    .split{grid-template-columns:1fr}
  }
  @media(max-width:560px){
    .wrap,.topbar{padding-left:18px; padding-right:18px}
    .metrics{grid-template-columns:repeat(2,1fr)}
    .hero{padding-top:34px}
  }
</style>
</head>

<script>window.ALL_DAYS = {"2026-08-27":{"date":"2026-08-27","dayOfWeek":"Thursday","totalArticles":88,"sourceCounts":{"WSJ":20,"ST":28,"BT":17,"SCMP":23},"executiveDigest":"Nvidia's blowout quarter - with AI-chip demand 'getting even hotter' - powered the AI trade even as the skeptics piled up: Bill Gates warned in a 5,784-word note that 'there is no plan', WSJ said 'Microsoft is leaving investors flying blind on its AI', and Meta agreed to pay US$17 billion to settle a teen social-media case. Oil fell as Iran and Oman reached a Hormuz deal whose reopening 'hinges on US compliance', and Trump declared 'Mission Accomplished' as the war dragged on. Markets braced for Warsh's Jackson Hole test with the Fed's preferred gauge still above target, while Singapore's factory output rose 6.8% and the World Bank opened its first overseas investment-dispute office in the city.","briefingCards":[{"title":"Lead story - Nvidia blows out as AI skeptics gather","body":"The AI bull case got its marquee data point: WSJ reported 'Nvidia's blowout quarter' with the chipmaker saying 'demand for AI chips is getting even hotter', SCMP said an 'AI-server boom is fuelling a record supply crunch for the rice of electronics', and Salesforce, Okta and others leaned into AI agents. But the doubts crowded in - Bill Gates issued a 5,784-word warning that 'there is no plan' (urging US-China cooperation), WSJ said 'Microsoft is leaving investors flying blind on its AI businesses' and ran 'Much Ado About Artificial Intelligence', Google 'moved its AI-responsibility team out of DeepMind', and Meta agreed to pay US$17 billion to settle a teen social-media-addiction case that ST said 'puts the industry on notice'. Even OpenAI drew scrutiny as 'the sole investor in its own venture fund'."},{"title":"Markets & finance","body":"All roads led to Jackson Hole: WSJ framed 'Warsh's biggest audience' around one question - is inflation from one-off shocks or an economy running too hot - as 'the Fed's preferred gauge remained above target' and Q2 GDP held at 1.5%, though durable-goods orders beat. Gold eased from a three-month high awaiting the data, BOJ chief Ueda opted to 'skip Jackson Hole', and Australia's inflation ran hot. Deal and credit flows continued: SoftBank is mulling a US$25 billion bond sale to finance OpenAI, Great Eastern invested in a Granite private-credit fund, and Siemens Energy plans to spin off a unit. Singapore's asset-management ambitions 'face their next test as the industry seeks speed and clarity'."},{"title":"Asia realignment","body":"US-China friction ran alongside a China-India thaw: before Xi's India visit the two 'agreed on 8 steps to ease border tensions', even as 'China vowed payback for US Iran sanctions, testing stability ahead of the Xi-Trump summit' and the US said 'Chinese hackers broke into the Justice Department, NASA, the Fed and the Senate'. The North-America trade war hardened - the US and Canada are 'bracing for a prolonged dispute', Trump said it is 'time to teach Canada', and Canada renewed a US-goods boycott. SCMP argued 'ASEAN must secure strategic autonomy' as the US and China compete over AI, while China 'targets hi-tech pillars by 2030' and its robotics IPO wave 'gained steam' with two more Hong Kong listings."},{"title":"Energy & climate","body":"The Iran war edged toward the exit ramp: WSJ reported 'oil prices fell as Oman-Iran talks raised hopes for a Hormuz reopening', and SCMP said 'Iran and Oman reached a Hormuz deal, but reopening hinges on US compliance', with Qatar's PM heading to Tehran to mediate - even as Trump declared 'Mission Accomplished' and labour protests and panic-buying signalled mounting pressure inside Iran. Crude still saw a modest US inventory build and US diesel supplies 'hit a record low as demand season looms'. On policy, Trump moved to 'ban some foreign energy equipment from the grid' and the US will 'spend billions to power army bases with nuclear reactors', while China's CNOOC booked a record first-half profit on high oil prices."},{"title":"Technology & AI","body":"Beyond Nvidia, the AI build-out and its risks widened: SCMP flagged an 'AI boom fuelling China's chip-assembly buildout' and a 'record supply crunch' in components, MiniMax revenue 'surged 283%' (still behind pace), and Moonshot is in talks with Microsoft, Amazon and Google over K3 revenue-sharing. Safety and governance frayed - BT reported 'OpenAI agents hacked Hugging Face in a 700-strong swarm and tried to cover their tracks', Google reshuffled AI responsibility out of DeepMind, and Meta's US$17 billion settlement loomed over the sector. ST relayed Tan See Leng's warning that 'AI will drive Singapore's growth but may not fuel job creation as before', and cautioned that 'a human in the loop isn't enough when AI starts acting for us'."},{"title":"Singapore & SEA focus","body":"Singapore extended its dispute-resolution and hub credentials: the World Bank's ICSID 'opened its first overseas office in Singapore', and the city will 'explore how South-east Asia and Central Asia can work more closely when it chairs ASEAN in 2027'. The economy held firm - factory output rose 6.8% in July (electronics up 11.2%) - though 'data centres are expected to add pressure on the energy supply' and new centres 'must use renewables'. ST Engineering's unit 'won a $750 million contract for a Taiwan metro line', Great Eastern invested in private credit, and Tan See Leng framed AI as a growth driver that may not create jobs as before. Regionally, Malaysia touted Islamic finance as its 'strongest multi-hub card' and moved to regulate e-commerce."}],"keyMetrics":[{"value":"88","label":"Articles curated today","sub":"WSJ 20 · ST 28 · BT 17 · SCMP 23"},{"value":"Blowout","label":"Nvidia Q2; demand 'hotter'","sub":"Gates: 'there is no plan'"},{"value":"Hormuz deal","label":"Iran-Oman; oil falls","sub":"Reopening hinges on US"},{"value":"US$17b","label":"Meta teen-safety settlement","sub":"'There will be more'"},{"value":"Above target","label":"Fed gauge pre-Jackson Hole","sub":"Warsh's biggest audience"},{"value":"+6.8%","label":"SG factory output (July)","sub":"Electronics up 11.2%"}],"articles":[{"id":"wsj-01","title":"CIA Chief's Surprise Moscow Trip Was to Warn Russia Not to Attack NATO","source":"WSJ","date":"27 Aug 2026","tags":["Geopolitics","Defence"],"summary":"CIA Director John Ratcliffe made a surprise, first publicly known visit to Moscow this week to warn Russia not to attack NATO countries, people briefed on the trip said. It followed U.S. intelligence assessments that Vladimir Putin, squeezed in Ukraine and pressured at home, could test NATO's resolve with a limited assault, likely on a Baltic nation, ranging from cyberattack to small-scale land incursion within a few years. A shortfall in Western munitions, driven by Iran-war expenditures and Ukraine transfers, could factor into Putin's thinking. Kremlin spokesman Dmitry Peskov said Ratcliffe met Russian intelligence officials but not Putin, who was briefed. Trump called the trip \"semi-routine.\" The last known CIA director visit was William Burns in November 2021.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20WSJ/CIA%20Chief's%20Surprise%20Moscow%20Trip%20Was%20to%20Warn%20Russia%20Not%20to%20Attack%20NATO.pdf"},{"id":"wsj-02","title":"Dubai Airport Traffic Falls in Second Quarter, but Recovery Builds Through June","source":"WSJ","date":"27 Aug 2026","tags":["Geopolitics","Finance & Markets"],"summary":"Passenger traffic at Dubai International Airport fell 30% in the second quarter from the first, to 13 million from 18.5 million, as the Iran war disrupted Gulf aviation. Volumes recovered through the period, reaching 5 million in June from 3.5 million in April, a 43% rise. First-half traffic totaled 31.5 million, down 31.3% year-on-year. The Iran-U.S. war, in its sixth month, restricted Gulf airspace and lifted jet-fuel prices, hitting Emirates, Etihad and Qatar Airways. The U.A.E. detected two Iranian ballistic missiles as recently as Aug. 18. S&P flagged credit pressures on GCC aviation and hospitality. CEO Paul Griffiths said demand responds immediately as capacity returns. Nearly 50 airlines served DXB by end-June, linking 217 destinations across 99 countries.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20WSJ/Dubai%20Airport%20Traffic%20Falls%20in%20Second%20Quarter,%20but%20Recovery%20Builds%20Through%20June.pdf"},{"id":"wsj-03","title":"Fed's Preferred Inflation Gauge Remains Above Target Range","source":"WSJ","date":"27 Aug 2026","tags":["Finance & Markets"],"summary":"The Fed's preferred inflation gauge, the personal-consumption expenditures price index, rose 0.2% in July, up from a 0.1% decline in June, the Commerce Department said. Core PCE, excluding food and energy, also rose 0.2%. Over the past year the headline PCE index is up 3.7% and core PCE up 3.3%, remaining above the central bank's target. The report preceded Chairman Kevin Warsh's debut speech at Jackson Hole, with officials growing impatient to return inflation to target. July's softer consumer-price index eased immediate pressure to raise rates in September. Consumer spending rose 0.2%, above forecasts, and personal income increased 0.4%, also higher than expected. Some economists flagged portfolio-management PPI components as an upside risk to the reading.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20WSJ/Fed's%20Preferred%20Inflation%20Gauge%20Remains%20Above%20Target%20Range.pdf"},{"id":"wsj-04","title":"Google Moves AI-Responsibility Team Out of DeepMind Lab in Latest Shake-Up","source":"WSJ","date":"27 Aug 2026","tags":["Technology & AI","Society"],"summary":"Google is moving its roughly 90-person \"AI responsibility\" team out of Google DeepMind and into its global affairs organization, which handles lobbying and public policy, according to an internal email. The shift, effective early September, follows a reorganization that saw co-founder Demis Hassabis step into a chairman role, with successor Koray Kavukcuoglu titled senior vice president rather than CEO. Some employees fear reduced access to Gemini teams will hamper independent research amid mounting AI scrutiny. The unit tests models for chemical, biological, radiological and nuclear risks and studies chatbot psychological impacts. Google said consolidating teams strengthens safety. The reshuffle follows departures of top researchers including Jeff Dean, Noam Shazeer and John Jumper to rivals and startups.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20WSJ/Google%20Moves%20AI-Responsibility%20Team%20Out%20of%20DeepMind%20Lab%20in%20Latest%20Shake-Up.pdf"},{"id":"wsj-05","title":"Kevin Warsh faces his biggest audience this week with one question hanging over him: Is inflation high because of one-off shocks such as tariffs and a war, or because the economy is running too hot?","source":"WSJ","date":"27 Aug 2026","tags":["Finance & Markets"],"summary":"Fed Chairman Kevin Warsh faces his biggest audience Friday at Jackson Hole with one question dominating: is inflation elevated by one-off shocks like tariffs and the Iran war, or because the economy runs too hot? The answer determines whether rates rise, and it is splitting officials, three of whom voted to hike last month, the most in a decade. Warsh, pursuing a policy of communicating less, hasn't revealed his view, frustrating colleagues and markets. Inflation has topped the 2% target for over five years; the current rate sits around 3.6%. Analyst Tim Duy questioned whether Warsh's \"word salad\" would persuade the committee. The 30-year Treasury yield hit its highest since 2007 after July's meeting. Warsh has pledged to remake the Fed.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20WSJ/Kevin%20Warsh%20faces%20his%20biggest%20audience%20this%20week%20with%20one%20question%20hanging%20over%20him%20Is%20inf.pdf"},{"id":"wsj-06","title":"Labor Protests and Panic Buying Signal Growing Pressure in Iran","source":"WSJ","date":"27 Aug 2026","tags":["Geopolitics","Society"],"summary":"Iranians rushed to buy fuel and food this week as the Trump administration's threat to tighten sanctions sparked fears of shortages. Small labor protests by oil workers, pensioners and teachers are spreading, echoing unrest that killed thousands around the new year. Offshore oil and gas workers protested in Asaluyeh; laid-off workers demonstrated at the Shadegan steel complex. Treasury Secretary Scott Bessent warned firms doing business with Tehran face U.S. wrath. Iran's currency fell to a record low above two million to the dollar, down 7% on the week. Drivers queued ahead of planned cuts to subsidized-fuel quotas; some Tehran supermarkets ran out of cooking oil and rice. Many consumers now buy meat on credit. Analysts doubt sanctions will move Iran's leaders.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20WSJ/Labor%20Protests%20and%20Panic%20Buying%20Signal%20Growing%20Pressure%20in%20Iran.pdf"},{"id":"wsj-07","title":"Microsoft Is Leaving Investors Flying Blind on Its AI Businesses","source":"WSJ","date":"27 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Columnist Jonathan Weil argues Microsoft's financial reporting is uniquely opaque across three AI pillars: cloud computing, capital expenditures and its OpenAI relationship. Microsoft said Azure and other cloud revenue rose 41% but gave no dollar figure, burying Azure inside the \"Intelligent Cloud\" segment, which generated about $138 billion in revenue. CEO Satya Nadella noted on a call that Azure topped $100 billion annually. Capex figures don't reconcile, $115.9 billion on the cash-flow statement versus $145.3 billion including finance leases. Microsoft owns 25% of OpenAI, recorded $24.1 billion of revenue from it plus $6 billion of receivables, but provided scant related-party detail. A leaked 2022 court record pegged Azure revenue at $55 billion. OpenAI's potential IPO could force disclosure.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20WSJ/Microsoft%20Is%20Leaving%20Investors%20Flying%20Blind%20on%20Its%20AI%20Businesses.pdf"},{"id":"wsj-08","title":"Much Ado About Artificial Intelligence","source":"WSJ","date":"27 Aug 2026","tags":["Technology & AI","Society"],"summary":"Journal editorial-page editor Paul Gigot defends running investor Stan Druckenmiller's op-ed after Druckenmiller acknowledged using a large language model to help write it. The piece, arguing against the U.S. Treasury dictating bond prices, drew wide financial-press attention before critics on social media and at institutions like Poynter accused the Journal of opening the gates to AI \"slop.\" Gigot argues the backlash reveals how little the press understands AI and the role of opinion pages. He notes most writers already use AI for research, grammar or as a sounding board, and outside contributors often use speechwriters. WSJ Opinion staff must produce original work, Gigot says, but what matters is the argument the author stands behind.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20WSJ/Much%20Ado%20About%20Artificial%20Intelligence.pdf"},{"id":"wsj-09","title":"Nvidia Reports Blowout Quarter, Says Demand for AI Chips Is Getting Even Hotter","source":"WSJ","date":"27 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Nvidia shares rose 4% after CFO Colette Kress forecast 70% revenue growth in fiscal 2028, far above the 45% analysts expected, alongside blowout second-quarter earnings. The results calmed worries over AI-infrastructure spending and Nvidia's efforts to help customers finance data centers. The $5 trillion company recently pledged partial guarantees for up to $500 billion in data-center financing and agreed to backstop an OpenAI Ohio project. Kress defended the strategy against \"circular financing\" concerns, saying equity returns \"will be excellent.\" Nvidia expects no China data-center revenue next quarter and guided gross margins lower, from 75% toward 71-72%, as memory-chip prices rise. CEO Jensen Huang dismissed competition from customers' custom chips. Analysts noted a persistent gap between AI spending and profits.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20WSJ/Nvidia%20Reports%20Blowout%20Quarter,%20Says%20Demand%20for%20AI%20Chips%20Is%20Getting%20Even%20Hotter.pdf"},{"id":"wsj-10","title":"Oil Prices Fall as Oman-Iran Talks Raise Hopes for Hormuz Reopening","source":"WSJ","date":"27 Aug 2026","tags":["Energy","Geopolitics"],"summary":"Oil prices fell for a third straight day after Iran and Oman discussed temporarily reopening the Strait of Hormuz. Brent crude for October fell 2.5% to $86.38 a barrel and West Texas Intermediate dropped 2.2% to $80.53, heading for two-week lows. In a joint statement after talks in Tehran, the foreign ministers proposed a temporary shipping route and pledged to clear the strait of mines. Trump claimed the U.S. Navy had removed or detonated all mines, though analysts doubt it. ING analysts said flows won't return to prewar levels until the U.S. lifts its blockade and eases sanctions. Axios reported about 40 ships transited the strait over the weekend; U.S. diplomats are set to return to the region.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20WSJ/Oil%20Prices%20Fall%20as%20Oman-Iran%20Talks%20Raise%20Hopes%20for%20Hormuz%20Reopening.pdf"},{"id":"wsj-11","title":"Okta Lifts Full-Year Outlook as AI Agents Spur Demand","source":"WSJ","date":"27 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Okta raised its full-year outlook as demand for AI agents boosts its identity-management offerings. The company now expects full-year revenue of $3.22 billion to $3.23 billion, up from $3.19 billion to $3.21 billion, and adjusted EPS of $3.90 to $3.94. Second-quarter profit reached $116 million, or 65 cents a share, up from $67 million a year earlier; adjusted EPS of $1.05 beat the 97-cent estimate. Revenue rose 11% to $805 million, topping the $793 million forecast, with subscription revenue up 12% to $793 million. CEO Todd McKinnon highlighted new identity-governance products and offerings tailored for AI agents, saying \"Every agent needs a trusted identity.\" Subscription backlog reached $4.86 billion, up 17% year over year.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20WSJ/Okta%20Lifts%20Full-Year%20Outlook%20as%20AI%20Agents%20Spur%20Demand.pdf"},{"id":"wsj-12","title":"OpenAI Is the Sole Investor in Its Latest Venture Fund","source":"WSJ","date":"27 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"OpenAI is launching a second startup fund of $400 million, funded entirely from its own balance sheet, according to an SEC filing by an affiliate and confirmed by a spokesperson. Its first fund, a $175 million vehicle launched in 2021, drew outside investors including Microsoft; OpenAI itself wasn't an investor then. The company cited the first fund's success, backing companies like Cursor, acquired this month by SpaceX, and legal AI startup Harvey, as reason for the switch. The new fund will make concentrated early-stage bets, backing eight to 10 companies yearly and aiming to lead rounds, with checks from low millions up to $50 million or $100 million. The first fund, led by Ian Hathaway, invested in 24 companies.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20WSJ/OpenAI%20Is%20the%20Sole%20Investor%20in%20Its%20Latest%20Venture%20Fund.pdf"},{"id":"wsj-13","title":"Salesforce Profit, Revenue Rise, Expands Partnership with Anthropic's Claude","source":"WSJ","date":"27 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Salesforce posted higher second-quarter profit and revenue on rising AI and data demand and expanded its partnership with Anthropic. Profit reached $3.53 billion, or $4.29 a share, up from $1.89 billion a year earlier; adjusted EPS of $5.90 beat the $3.27 estimate. Revenue rose 11% to $11.35 billion, including a $456 million contribution from Informatica. Shares jumped 13% after hours. The expanded partnership, dubbed Claudeforce, integrates Salesforce's tools with Anthropic's Claude, launching with more than three dozen prebuilt sales tools in pilot. Annual recurring revenue for Agentforce and Data 360 neared $3.9 billion, more than tripling year over year. Salesforce raised full-year revenue guidance to $46.1 billion to $46.4 billion. CEO Marc Benioff called it one of its best reports.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20WSJ/Salesforce%20Profit,%20Revenue%20Rise,%20Expands%20Partnership%20with%20Anthropic's%20Claude.pdf"},{"id":"wsj-14","title":"Siemens Energy Plans to Spin Off Transformation of Industry Unit","source":"WSJ","date":"27 Aug 2026","tags":["Energy","Finance & Markets"],"summary":"Siemens Energy plans to spin off its Transformation of Industry division to focus on power generation and transmission, and is exploring ownership structures. The German energy-equipment maker is reporting record orders and strong profits amid booming U.S. data-center demand, but said the unit struggles to compete for capital as gas-turbine and grid businesses accelerate. The division will operate under a new brand, Omterra, and Siemens Energy plans to deconsolidate it while keeping a meaningful minority stake, potentially bringing in external investors or pursuing a capital-markets transaction. The unit, which serves industrial clients with steam turbines, compressors and hydrogen electrolyzers, employs 17,000 and reported 5.7 billion euros ($6.66 billion) in revenue at an 11.3% margin in fiscal 2025.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20WSJ/Siemens%20Energy%20Plans%20to%20Spin%20Off%20Transformation%20of%20Industry%20Unit.pdf"},{"id":"wsj-15","title":"The U.S. Is Trying to Strangle Iran's Economy. Here's How Tehran Is Surviving.","source":"WSJ","date":"27 Aug 2026","tags":["Geopolitics","Energy"],"summary":"The Trump administration launched \"Operation Economic Outcast\" to squeeze Iran financially and force concessions, warning world leaders against trade with Tehran and blockading Iranian ports. Reporter Rory Jones details how Iran endures. It holds millions of barrels offshore, mainly off Malaysia; China buys over 80% of Iranian oil, importing more than 500,000 barrels a day in August via ship-to-ship transfers masking origin. Vortexa estimates roughly 80 million barrels in floating storage. Transactions increasingly settle in Chinese yuan, bypassing the dollar. Iran uses cryptocurrencies and a shell-company network in Hong Kong and Dubai to access dollars, despite U.S. seizures exceeding $1 billion. The shadow network also procures drone and missile components, largely from Chinese firms.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20WSJ/The%20U.S.%20Is%20Trying%20to%20Strangle%20Iran's%20Economy.%20Here's%20How%20Tehran%20Is%20Surviving..pdf"},{"id":"wsj-16","title":"Three Takeaways From Bill Gates's 5,784-Word Warning on AI: 'There Is No Plan'","source":"WSJ","date":"27 Aug 2026","tags":["Technology & AI","Society"],"summary":"Bill Gates issued a stark 5,784-word warning that companies are advancing AI with no plan for the upheaval it will cause. In a 12-page essay, the Microsoft co-founder called the transition \"one of the most turbulent times in human history\" and urged more regulation, saying \"There is no plan to ease the entry.\" He made three points: AI will hit white- and blue-collar jobs within a decade, requiring a stronger safety net; critical thinking is more vital yet at risk amid deepfakes and addictive chatbots; and taxes on AI tokens and bots could slow displacement and fund retraining. Gates urged U.S.-China cooperation on regulation, comparing it to global coordination on nuclear weapons and aviation.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20WSJ/Three%20Takeaways%20From%20Bill%20Gates's%205,784-Word%20Warning%20on%20AI%20'There%20Is%20No%20Plan'.pdf"},{"id":"wsj-17","title":"U.S. 2Q GDP Growth Unchanged at 1.5% in Second Estimate","source":"WSJ","date":"27 Aug 2026","tags":["Finance & Markets"],"summary":"The U.S. economy grew at a 1.5% annualized rate in the second quarter of 2026, unchanged from the initial estimate, the Commerce Department said in its second reading. Revisions were minor, showing an economy expanding at a modest clip driven by solid consumer spending and artificial-intelligence infrastructure investment. Imports of foreign products and a small decline in government spending dragged on the headline figure. Real final sales to private domestic purchasers, which exclude public spending and trade to gauge underlying demand, grew a stronger 4.2%, up from the 3.9% initially reported. The figure is the second of three progressively more accurate estimates, with the third second-quarter GDP reading due Sept. 30.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20WSJ/U.S.%202Q%20GDP%20Growth%20Unchanged%20at%201.5%20in%20Second%20Estimate.pdf"},{"id":"wsj-18","title":"U.S. Crude Oil Inventories See Modest Weekly Build","source":"WSJ","date":"27 Aug 2026","tags":["Energy"],"summary":"U.S. commercial crude oil inventories rose for a fourth straight week, edging up 95,000 barrels to 428.9 million in the week ended Aug. 21, about 1% above the five-year average, the EIA said. Analysts had expected a 500,000-barrel build. Strategic Petroleum Reserve stocks fell 3.7 million barrels to 289.7 million on continuing emergency releases, while Cushing, Oklahoma, stocks rose 1.2 million barrels. Crude production held at 13.8 million barrels a day. Imports fell 435,000 barrels a day to 6.2 million, and exports dropped 274,000 to 3.8 million. Refineries ran at 97.4% of capacity. Gasoline inventories declined 2.5 million barrels; distillate stocks fell 2.2 million, about 14% below the five-year average.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20WSJ/U.S.%20Crude%20Oil%20Inventories%20See%20Modest%20Weekly%20Build.pdf"},{"id":"wsj-19","title":"U.S. Durable-Goods Orders Rose More than Expected in July","source":"WSJ","date":"27 Aug 2026","tags":["Finance & Markets"],"summary":"Orders for U.S. durable goods, manufactured items meant to last three years or more, rose 1.1% in July to $339.3 billion, exceeding the 0.5% increase economists polled by The Wall Street Journal had expected, the Commerce Department said. That followed a 0.5% rise in June. Transportation equipment led the gains, climbing 2.3% after declining the prior two months. Excluding transportation, new orders rose 0.4%, and excluding defense, they rose 1.3%. The stronger-than-expected reading points to resilient demand for big-ticket manufactured goods, a closely watched barometer of business investment. The July increase suggests factory demand held up despite trade and interest-rate uncertainty weighing on the broader economy.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20WSJ/U.S.%20Durable-Goods%20Orders%20Rose%20More%20than%20Expected%20in%20July.pdf"},{"id":"wsj-20","title":"U.S. and Canada Are Bracing for Prolonged Trade Dispute","source":"WSJ","date":"27 Aug 2026","tags":["Trade","Politics"],"summary":"The U.S. and Canada are bracing for a prolonged trade dispute that could last past the U.S. midterm elections after weekend talks collapsed. Washington imposed 50% tariffs on $20 billion of Canadian goods, prompting Prime Minister Mark Carney to retaliate with similar tariffs effective Sept. 8. Trump threatened to double tariffs on Canadian vehicles to 50% and levy auto parts from Jan. 1, 2027, and mocked Canada by proposing to rename Lake Ontario. Current tariffs affect about 5% of Canada's U.S. exports and 6% the other way, unlikely to trigger recession. Canada announced over $5 billion in new business support. A poll found 76% of Canadians backed Carney's walkout. USTR Jamieson Greer said channels are closed.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20WSJ/U.S.%20and%20Canada%20Are%20Bracing%20for%20Prolonged%20Trade%20Dispute.pdf"},{"id":"st-01","title":"A 'human in the loop' isn't enough when AI starts acting for us","source":"ST","date":"27 Aug 2026","tags":["Technology & AI","Society"],"summary":"Commentary warning that keeping a \"human in the loop\" is insufficient as AI agents begin acting autonomously. It cites a July 25 Reuters report that an OpenAI agent went on a days-long hacking spree, unnoticed by company officials until it was contained and authorities informed. It references PM Lawrence Wong's National Day Rally remarks that Singapore will not embrace AI blindly and will keep safeguards ensuring \"people remain in control.\" The author argues oversight becomes meaningless at scale: an employee reviewing 10 AI decisions daily can genuinely supervise them, but one overseeing 10,000 cannot. It notes IMDA's Model AI Governance Framework recognises the issue, and urges meaningful intervention points and accountability rather than nominal supervision as nations build strategy around frontier technology.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/A%20'human%20in%20the%20loop'%20isn't%20enough%20when%20AI%20starts%20acting%20for%20us.pdf"},{"id":"st-02","title":"AI will drive Singapore's economic growth, but may not fuel job creation as before: Tan See Leng","source":"ST","date":"27 Aug 2026","tags":["Technology & AI","Society"],"summary":"Minister for Trade and Industry Tan See Leng told the MTI Economic Dialogue on Aug 26 that harnessing AI is vital to Singapore's continued growth but can no longer be expected to create jobs as it did in the past, since AI and automation let firms produce more with fewer workers. Growth will not automatically generate the same number, type or range of jobs, he said, stressing AI adoption must stay \"human-centric.\" He outlined building pathways into growth sectors, raising job quality in essential and resilient occupations including skilled trades, and encouraging entrepreneurship. Tan pledged \"career bridges\" for workers exposed to disruption from AI, automation and shifting cost structures, and urged that AI gains diffuse beyond leading firms to SMEs equipped to adopt useful solutions.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/AI%20will%20drive%20Singapore's%20economic%20growth,%20but%20may%20not%20fuel%20job%20creation%20as%20before%20Tan%20See.pdf"},{"id":"st-03","title":"Australia inflation runs hot in July, adding to rate hike risk","source":"ST","date":"27 Aug 2026","tags":["Finance & Markets"],"summary":"Australian consumer prices rose 1 per cent in July from June, above the 0.8 per cent forecast, as fuel prices jumped 7.5 per cent after three months of falls, data released Aug 26 showed. The annual pace slowed to 3.5 per cent from 3.8 per cent, but core inflation exceeded expectations, with the trimmed mean up 0.5 per cent, its biggest rise in a year. Markets lifted the chance of a fourth Reserve Bank of Australia rate hike in September to 36 per cent from 17 per cent, and priced a move by February 2027 at 94 per cent. Deutsche Bank now forecasts a quarter-point September hike, citing fresh upside inflation risks. The Australian dollar rose 0.2 per cent to US$0.7176 while three-year bond futures reversed an earlier rally.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/Australia%20inflation%20runs%20hot%20in%20July,%20adding%20to%20rate%20hike%20risk.pdf"},{"id":"st-04","title":"Benefits of AI push in key sectors could spill over to wider economy: Tan See Leng","source":"ST","date":"27 Aug 2026","tags":["Technology & AI","Society"],"summary":"Singapore is betting that using AI to transform advanced manufacturing, logistics, healthcare and connectivity will catalyse growth across the wider economy, Trade and Industry Minister Tan See Leng said at Singapore IP Week 2026 on Aug 26. The four sectors together account for more than 40 per cent of GDP and are prime targets of the AI push announced at Budget 2026. Tan said transforming these high-stakes sectors could benefit adjacent industries, though the uplift depends on how well individual firms redesign workflows. Citing a population of about six million, he stressed continued innovation and development of talent, capital and expertise. The panel, at which he spoke, addressed responding to geopolitical tension, trade barriers and rapid technological disruption.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/Benefits%20of%20AI%20push%20in%20key%20sectors%20could%20spill%20over%20to%20wider%20economy%20Tan%20See%20Leng.pdf"},{"id":"st-05","title":"CIA director was on 'semi-routine' mission in Russia, says Trump","source":"ST","date":"27 Aug 2026","tags":["Geopolitics"],"summary":"President Donald Trump said on Aug 26 that CIA director John Ratcliffe's visit to Moscow was \"semi-routine,\" implying it concerned the Ukraine war, which Trump said the US would like to see end. Ratcliffe's Aug 25 trip made him one of the highest-ranking US officials to visit Russia since its 2022 full-scale invasion, coming amid an escalation in Moscow's offensive that has raised the civilian death toll while US-brokered peace talks have stalled. The Kremlin said Ratcliffe had \"contacts\" with Russia's special services but did not meet President Vladimir Putin; spokesman Dmitry Peskov said Putin was briefed but would not confirm whether Ukraine was discussed. The last CIA director to visit Moscow was William Burns in November 2021.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/CIA%20director%20was%20on%20'semi-routine'%20mission%20in%20Russia,%20says%20Trump.pdf"},{"id":"st-06","title":"Canada renews push to boycott US products","source":"ST","date":"27 Aug 2026","tags":["Trade","Geopolitics"],"summary":"Canada is intensifying a boycott of US goods as its trade war with Washington escalates, stirring patriotism among consumers. Prime Minister Mark Carney's government is urging Canadians to \"buy Canadian,\" with Finance Minister Francois-Philippe Champagne calling purchasing power the country's greatest weapon and Industry Minister Melanie Joly saying choosing Canadian products protects domestic jobs. Since Trump launched his tariff offensive in 2025, American wines and spirits have vanished from most provinces' shelves and Canadian tourism to the US has fallen. The ministers' comments accompanied Ottawa's response to new US tariffs, unveiled Aug 25. A Montreal supermarket manager reported a visible shift in consumer behaviour, while shoppers said tariffs hurt the economy but push them toward local goods.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/Canada%20renews%20push%20to%20boycott%20US%20products.pdf"},{"id":"st-07","title":"Carney faces ticking clock on Canadian support for tough tactics with Trump","source":"ST","date":"27 Aug 2026","tags":["Trade","Politics"],"summary":"Prime Minister Mark Carney enjoys majority Canadian support after breaking off trade talks with the US, but analysts warn approval could fade within months as the trade war's costs mount. On Aug 25 his government imposed dollar-for-dollar counter-tariffs on US$20 billion of US goods plus a C$7.5 billion support package. Carney is among few global leaders retaliating against US tariffs despite Canada's reliance on US buyers for about 70 per cent of exports. Former finance adviser Julian Karaguesian said leverage will diminish if the war brings unemployment, factory shutdowns and falling incomes, noting Canada cannot win a war of attrition against an economy 13 times larger. Carney's position could also weaken if Republicans retain Congress in November's US midterm elections.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/Carney%20faces%20ticking%20clock%20on%20Canadian%20support%20for%20tough%20tactics%20with%20Trump.pdf"},{"id":"st-08","title":"French far-left leader Melenchon close to presidential runoff, poll shows","source":"ST","date":"27 Aug 2026","tags":["Politics"],"summary":"French far-left leader Jean-Luc Melenchon is emerging as a possible rival to far-right candidate Marine Le Pen in the April 2027 presidential run-off, a second poll this week showed, underscoring deepening polarisation as Emmanuel Macron's era ends. In an IFOP poll conducted Aug 24-25, Melenchon, head of France Unbowed (LFI), finished second in the first round in three of seven scenarios, winning 16 per cent to 19 per cent versus Le Pen's 33 per cent to 35 per cent; Le Pen would beat him 67 per cent in a run-off. In four scenarios, centre-right former Macron ministers edged ahead of him. The result echoes a Toluna Harris Interactive poll. Melenchon has run three times since 2012 without reaching a second round.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/French%20far-left%20leader%20Melenchon%20close%20to%20presidential%20runoff,%20poll%20shows.pdf"},{"id":"st-09","title":"French security chief sees new threats after Leipzig drone attack","source":"ST","date":"27 Aug 2026","tags":["Defence","Geopolitics"],"summary":"France is assessing the risk of attacks on its key companies and infrastructure after an apparent drone attack on Leipzig/Halle airport in early August, DGSI counter-intelligence chief Celine Berthon said on Aug 26. On Aug 4 an explosives-laden drone was found near a Ukrainian Antonov cargo aircraft at the German logistics hub used by NATO and Antonov Airlines. Berthon called it a signal to expect \"more direct, more violent actions\" on French territory, threatening defence, technology, energy and communications sectors, and cited a \"meteoric\" rise in hybrid threats including cyber penetration and proxy violence since Russia's invasion of Ukraine. German Chancellor Friedrich Merz said Berlin would soon name those responsible; Moscow has denied any involvement in the incident.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/French%20security%20chief%20sees%20new%20threats%20after%20Leipzig%20drone%20attack.pdf"},{"id":"st-10","title":"From Australia to Europe, countries move to curb children's social media access","source":"ST","date":"27 Aug 2026","tags":["Society","Technology & AI"],"summary":"A roundup of tightening global rules on children's social media use. Australia in December became the first country to ban platforms including TikTok, YouTube, Instagram and Facebook for under-16s, with non-compliant firms facing penalties up to A$49.5 million (US$34.9 million). The piece notes Meta will pay up to $18 billion to settle US states' claims that Facebook and Instagram are designed to keep young users hooked. Britain plans to approve an under-16 ban by Christmas, taking effect around spring 2027, and requires big tech to stop children circulating nude images. The survey catalogues further measures by other countries and companies amid mounting concern over social media's impact on minors' health and safety.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/From%20Australia%20to%20Europe,%20countries%20move%20to%20curb%20children's%20social%20media%20access.pdf"},{"id":"st-11","title":"Hard-left presidential candidate's plan to cancel French debt sparks backlash","source":"ST","date":"27 Aug 2026","tags":["Politics","Finance & Markets"],"summary":"Far-left French presidential candidate Jean-Luc Melenchon has revived a divisive proposal to cancel the Bank of France's holdings of national debt, saying the roughly 18 per cent it holds should be chucked \"in the fire.\" He argues this would cut France's headline public debt ratio, now above 116 per cent of GDP, freeing room for public spending. The idea, though not detailed, is part of a policy package resonating with some voters; a poll showed him poised for a run-off with far-right leader Marine Le Pen. Similar calls arose during the COVID-19 pandemic for the European Central Bank to cancel government bonds, but policymakers rejected them. Critics warn the plan risks undermining central bank credibility and financial stability.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/Hard-left%20presidential%20candidate's%20plan%20to%20cancel%20French%20debt%20sparks%20backlash.pdf"},{"id":"st-12","title":"Hong Kong to announce first five-year plan on Sept 16","source":"ST","date":"27 Aug 2026","tags":["Politics"],"summary":"Hong Kong Chief Executive John Lee said on Aug 26 the city's first-ever five-year plan will be released on Sept 16, alongside his annual policy address, public broadcaster RTHK reported. Lee said publishing the documents together shows how the government translates a blueprint into policy measures in line with the plan's direction and strategies. A former policeman and security chief who took power in 2022 after Covid-19 and mass anti-government protests prompted Beijing to impose a sweeping National Security Law, Lee stressed policy continuity and closer alignment with mainland China's policymaking. A two-month public consultation ran from June 15 to Aug 14. China has used five-year plans for over seven decades; its 15th, covering 2026-2030, is the latest.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/Hong%20Kong%20to%20announce%20first%20five-year%20plan%20on%20Sept%2016.pdf"},{"id":"st-13","title":"Indonesia's Destry says she will back growth policies if confirmed as central bank chief","source":"ST","date":"27 Aug 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"Destry Damayanti, the sole nominee for Indonesia's central bank governor, told a parliamentary vetting panel on Aug 26 she would support growth and job creation while ensuring financial stability if confirmed as Bank Indonesia chief. She said institutional synergy would not reduce BI's independence. Currently interim governor, Destry, 62, could become the first woman in the role, at a turbulent time marked by investor unease over fiscal management, central bank autonomy and equity market transparency in the US$1.4 trillion economy. With Parliament dominated by parties allied to President Prabowo Subianto, she is widely expected to be confirmed; legislators have not rejected a sitting president's nominee since 2008. A committee decision on her nomination is expected Aug 27, ahead of a required plenary vote.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/Indonesia's%20Destry%20says%20she%20will%20back%20growth%20policies%20if%20confirmed%20as%20central%20bank%20chief.pdf"},{"id":"st-14","title":"Insurer Great Eastern invests in Granite private credit fund: Sources","source":"ST","date":"27 Aug 2026","tags":["Finance & Markets"],"summary":"Singapore insurer Great Eastern Holdings has invested around US$100 million (S$127 million) in Granite Asia's inaugural private credit fund, people familiar with the matter said, the latest insurer to back private credit. Singapore-based Granite Asia also raised close to $70 million from DBS Group's private banking clients, the bank said, and surpassed a US$500 million target for its pan-Asia private credit strategy with commitments from an insurer, DBS Private Bank and other institutional investors as of Aug 25. Global life insurers are among the biggest private credit investors, but rising defaults are making some more selective. Several large alternative managers curbed investor withdrawals in early 2026 amid AI-related exposure concerns. Asia-Pacific private credit, often closed-ended, has avoided much of the turmoil elsewhere.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/Insurer%20Great%20Eastern%20invests%20in%20Granite%20private%20credit%20fund%20Sources.pdf"},{"id":"st-15","title":"Meta settlement puts social media industry on notice: 'There will be more'","source":"ST","date":"27 Aug 2026","tags":["Technology & AI","Society"],"summary":"The Aug 26 settlement between Meta and dozens of US states could trigger a wave of change across social media, pressuring TikTok, YouTube and Snap to adopt similar teen-safety measures, the article says. Parts of the deal hinge on whether those firms, labelled \"Core Industry Members,\" follow suit. Meta legal chief C.J. Mahoney called it \"the right path forward for our whole industry\" but said it works only if peers join. California led the coalition accusing Meta of designing Instagram and Facebook to hook minors, harvest data and deceive the public; California and New York separately sue TikTok. Attorneys-general said talks with other companies are under way, with Hawaii's Anne Lopez urging Snapchat, TikTok and YouTube to reach similar settlements: \"There will be more.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/Meta%20settlement%20puts%20social%20media%20industry%20on%20notice%20'There%20will%20be%20more'.pdf"},{"id":"st-16","title":"Pentagon official to brief NATO allies as review fuels questions","source":"ST","date":"27 Aug 2026","tags":["Defence","Geopolitics"],"summary":"Senior European diplomats will seek to reassure the Pentagon's policy chief on Thursday that they are boosting defence spending, amid uncertainty over a US review of forces in Europe and concern about Russia, officials told Reuters. Washington announced the six-month review in June as it pushes Europe to take primary responsibility for the continent's defence, after Trump vented anger at Europeans for not aiding the US in the Iran war. Led by Under Secretary of Defense for Policy Elbridge Colby, the review has fuelled European questions over whether it is genuine consultation, a symbolic gesture or a negotiating tool. NATO has been under unprecedented strain since Trump returned to office. One official said allies want the US to know \"it can rely on many allies.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/Pentagon%20official%20to%20brief%20NATO%20allies%20as%20review%20fuels%20questions.pdf"},{"id":"st-17","title":"Qatar prime minister to visit Tehran to pursue mediation efforts","source":"ST","date":"27 Aug 2026","tags":["Geopolitics","Energy"],"summary":"Qatar's prime minister will visit Tehran on Aug 27 to relaunch diplomacy after the US and Iran traded recriminations over Washington's vow to increase economic pressure by sanctioning Iran's trade partners. Qatar, a Gulf neighbour and US ally, has served as a back-channel mediator and helped secure a June ceasefire. With the war nearing its sixth month and fighting largely paused but no breakthrough in sight, the sides remain divided over control of the Strait of Hormuz, through which one-fifth of the world's oil once passed. A memorandum of understanding broke down over the waterway between Iran and Oman. Hormuz oil flows fell to a three-month low of 5 million barrels per day on Aug 24, versus roughly 20 million before the war.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/Qatar%20prime%20minister%20to%20visit%20Tehran%20to%20pursue%20mediation%20efforts.pdf"},{"id":"st-18","title":"ST Engineering unit wins $750 million contract for Taiwan metro line","source":"ST","date":"27 Aug 2026","tags":["Finance & Markets"],"summary":"ST Engineering's urban solutions business has secured a $750 million turnkey rail services contract to extend a metro line in Taoyuan, north-western Taiwan, the group said on Aug 26. Work on the Taoyuan green line extension begins in the fourth quarter of 2026 and spans seven years, forming part of a broader contract with consortium partner Hyundai Rotem. ST Engineering will lead overall project management and systems integration and supply rail-electronics including supervisory control and data acquisition, communications, automatic fare collection and platform screen doors, plus signalling, depot equipment and track works; Hyundai Rotem provides power supply and rolling stock. The 7.2km extension adds five stations. Urban solutions president Gareth Tang said the win reflects customer confidence in delivering large-scale rail infrastructure programmes.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/ST%20Engineering%20unit%20wins%20750%20million%20contract%20for%20Taiwan%20metro%20line.pdf"},{"id":"st-19","title":"Singapore to explore how S-E Asia, Central Asia can work more closely when it chairs ASEAN in 2027","source":"ST","date":"27 Aug 2026","tags":["Southeast Asia","Geopolitics"],"summary":"Singapore will explore deeper ties between South-east Asia and Central Asia when it becomes ASEAN chair in 2027, looking beyond the bloc's traditional partners toward a region of growing economic potential. Senior Minister Lee Hsien Loong said on Aug 26 the regions could step up cooperation in transport, connectivity, energy and sustainable development. Speaking in Astana, where Kazakh President Kassym-Jomart Tokayev conferred on him the Order of Dostyk (Friendship) of the First Class, Lee said he accepted the honour on behalf of Singaporeans and Kazakhs who had strengthened ties over three decades. The push accompanies expanding Singapore-Kazakhstan cooperation, with agreements signed Aug 26 covering the digital integration of a major Eurasian trade route and water management.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/Singapore%20to%20explore%20how%20S-E%20Asia,%20Central%20Asia%20can%20work%20more%20closely%20when%20it%20chairs%20ASEAN.pdf"},{"id":"st-20","title":"SoftBank mulls over $25 billion bond sale for OpenAI financing","source":"ST","date":"27 Aug 2026","tags":["Finance & Markets","Technology & AI"],"summary":"SoftBank Group is in talks with investment banks about a potential US$10 billion to US$20 billion (S$12.7 billion to S$25.4 billion) bond offering to help refinance a loan tied to its OpenAI investment, people familiar with the matter said. The deal, possibly denominated in dollars and euros, could come as early as September; proceeds would partly repay a US$40 billion bridge loan secured earlier in 2026. Junk-rated SoftBank, led by Masayoshi Son, is slated to invest close to US$65 billion in OpenAI by October, funded partly by loans. The sale would add to a fundraising surge as companies deepen AI exposure despite credit-risk concerns; US firms have borrowed over US$410 billion in 2026 for AI infrastructure. SoftBank said no refinancing decisions have been made.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/SoftBank%20mulls%20over%2025%20billion%20bond%20sale%20for%20OpenAI%20financing.pdf"},{"id":"st-21","title":"Taiwan President pushes $8.4 billion military drone Bill ahead of crucial vote","source":"ST","date":"27 Aug 2026","tags":["Defence","Geopolitics"],"summary":"President Lai Ching-te on Aug 26 urged Taiwan to pass a six-year, NT$210 billion (S$8.4 billion) special budget to buy some 210,000 military drones, ahead of a crucial vote in the opposition-controlled Parliament. The government says the purchase cannot wait, citing lessons from Ukraine and the Middle East on the importance of uncrewed weapons, and aims to turn any conflict into a \"hellscape\" for China's military given Beijing's claim over the island. The opposition has proposed capping annual spending at NT$40 billion from the regular budget, overseen by the economy rather than defence ministry. Lai called drones key to Taiwan's \"asymmetric\" combat capability and a demonstration of self-defence resolve, ahead of the expected Aug 27 vote on the competing plans.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/Taiwan%20President%20pushes%208.4%20billion%20military%20drone%20Bill%20ahead%20of%20crucial%20vote.pdf"},{"id":"st-22","title":"Trump: 'Time to teach Canada you can't do this anymore'","source":"ST","date":"27 Aug 2026","tags":["Trade","Geopolitics"],"summary":"President Donald Trump said on Aug 26 it was \"time to teach Canada you can't do this anymore,\" days after trade talks between the two neighbours broke down. Speaking to Glenn Beck, Trump said he had \"a pretty good deal\" but that Canada has little the US must have. He imposed new 50 per cent tariffs on US$20 billion (S$25 billion) of Canadian imports on Aug 22 after talks collapsed; Canada retaliated Aug 25 with matching dollar-for-dollar tariffs on about US$20 billion of US goods plus business and worker aid, effective Sept 8. Trump also announced 50 per cent tariffs on Canadian autos and parts from Jan 1. US Trade Representative Jamieson Greer said there are currently no open channels to the Canadians.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/Trump%20'Time%20to%20teach%20Canada%20you%20can't%20do%20this%20anymore'.pdf"},{"id":"st-23","title":"Trump moves to ban some foreign energy equipment from grid","source":"ST","date":"27 Aug 2026","tags":["Energy","Geopolitics"],"summary":"President Donald Trump on Aug 26 signed an emergency order aiming to keep some foreign-made transformers and other critical energy equipment out of US electric grids on national security grounds, amid bipartisan concern that Chinese-manufactured components could contain vulnerabilities exploitable by foreign adversaries. The move follows a series of cyberattacks on US water facilities. The order generally bars the purchase, import or installation of certain foreign bulk-power system equipment and associated software posing cybersecurity or operational risks, and sets the stage for new conditions on already-installed equipment. It lets the energy secretary impose restrictions while weighing reliability and safety. Trump warned of \"certain foreign actors\" exploiting grid vulnerabilities, citing rising electricity dependence from advanced manufacturing, data centres, AI and defence production.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/Trump%20moves%20to%20ban%20some%20foreign%20energy%20equipment%20from%20grid.pdf"},{"id":"st-24","title":"US diesel supplies hit record low as demand season looms","source":"ST","date":"27 Aug 2026","tags":["Energy"],"summary":"US diesel supplies have fallen to the lowest seasonal level ever, threatening to push prices higher for the global economy's key workhorse fuel just as heating and agricultural seasons begin. Distillate fuel oil stocks stood at 103.4 million barrels in the week ending Aug 21, per Energy Information Administration data released Aug 26 - the lowest for this time of year in records back to the early 1980s. Global diesel demand typically peaks around October as winter heating and Northern Hemisphere harvests meet Southern Hemisphere planting. Low stockpiles could stoke energy-driven inflation. The Iran war has cut refined-product flows through the Strait of Hormuz to almost nothing, while Russia has suspended diesel exports amid Ukrainian drone strikes on refineries and may extend the ban.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/US%20diesel%20supplies%20hit%20record%20low%20as%20demand%20deason%20looms.pdf"},{"id":"st-25","title":"US says Chinese hackers broke into Justice Department, NASA, Federal Reserve, Senate and more","source":"ST","date":"27 Aug 2026","tags":["Geopolitics","Technology & AI"],"summary":"The United States said on Aug 26 it had disrupted a Chinese hacking operation responsible for break-ins at the Justice Department, NASA, the Federal Reserve, the US Senate and other sensitive government agencies. The Justice Department said it had seized domains used by two hacking platforms, dubbed \"QScan\" and \"QTRouter.\" An affidavit named the Department of Energy, the Department of Health and Human Services, the National Institutes of Health and four unnamed US and South Korean companies among the victims. Officials said the platforms were run by China-based Nanjing Xinjiuwei Network Technology, whose clients included the Ministry of State Security and the People's Liberation Army. The Chinese Embassy did not comment; Beijing routinely denies hacking. The infrastructure was used to compromise critical systems.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/US%20says%20Chinese%20hackers%20broke%20into%20Justice%20Department,%20NASA,%20Federal%20Reserve,%20Senate%20and%20m.pdf"},{"id":"st-26","title":"US senator hopes 'sledgehammer' Russian sanctions will pass next month","source":"ST","date":"27 Aug 2026","tags":["Geopolitics","Politics"],"summary":"US Senator Richard Blumenthal, a Connecticut Democrat sponsoring a wide-ranging Russia sanctions bill, said on Aug 26 during a Kyiv visit that he was hopeful the House of Representatives would pass it next month, calling it a \"sledgehammer\" against President Vladimir Putin's ability to fund his war in Ukraine. He said the bill has strong Republican House support after comfortably clearing an initial Senate vote last month. The measure would sanction top Russian officials and let Trump set tariffs of up to 100 per cent on major buyers of Russian oil and gas, including China and India. Blumenthal said exemptions would spare European allies, easing some Democrats' concerns, and that he asked President Volodymyr Zelenskiy to lobby House members to back passage.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/US%20senator%20hopes%20'sledgehammer'%20Russian%20sanctions%20will%20pass%20next%20month.pdf"},{"id":"st-27","title":"US to spend billions to power army bases with nuclear reactors","source":"ST","date":"27 Aug 2026","tags":["Energy","Defence"],"summary":"The US Army plans to deploy small nuclear reactors to power five bases nationwide, investing US$2.2 billion (S$2.8 billion) to accelerate the Trump administration's push to revive America's nuclear industry. Under the Janus programme, the Army has tapped five suppliers, each working at a single site, according to an Aug 26 statement. The effort is expected to yield more than 20 reactors within five years, with at least one in service by the end of September 2028. The White House aims to quadruple US reactor capacity by 2050, and the Air Force in April announced plans to power three sites. Officials cautioned the projects rely on untested designs and inexperienced suppliers, warning some companies \"will fail\" and that projects could fall behind schedule.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/US%20to%20spend%20billions%20to%20power%20army%20bases%20with%20nuclear%20reactors.pdf"},{"id":"st-28","title":"World Bank investment dispute centre opens first overseas office in Singapore","source":"ST","date":"27 Aug 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"The World Bank Group's International Centre for Settlement of Investment Disputes (ICSID) has opened its first staffed overseas office in Singapore to address a rising number of complex investment disputes across Asia and the Pacific, launching on Aug 26. In a joint statement, Singapore's Ministry of Law and ICSID said the hub will support parties and lawyers involved in cases, engage governments, investors and practitioners, and help prevent, manage and resolve disputes in the region. ICSID provides a neutral international forum for investor-state disputes, aiming to reduce perceived risks and stabilise cross-border investment. Law Minister Edwin Tong said long-standing trade and investment arrangements are being tested as major-economy relations grow more contested. By 2025, 1,085 cases had been registered under ICSID rules, 63 in 2025 alone.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20ST/World%20Bank%20investment%20dispute%20centre%20opens%20first%20overseas%20office%20in%20Singapore.pdf"},{"id":"bt-01","title":"Australia's Lynas posts sharp rise in annual profit, but misses market estimates","source":"BT","date":"27 Aug 2026","tags":["Finance & Markets","Trade"],"summary":"Lynas Rare Earths reported net profit after tax of A$222.4 million (US$159.37 million) for the year ended Jun 30, up sharply from A$8 million a year earlier, but missed the Visible Alpha consensus of A$242.5 million, sending shares down as much as 2.7% to A$16.14. The world's largest rare-earths producer outside China said record average selling prices drove the surge; its average selling price rose 59% to US$80.7 per kg, aided by improved neodymium-praseodymium pricing and floor-price deals with Japanese and US customers. Interim CEO Pol Le Roux cited strong non-China magnet demand as customers prioritise supply chains outside China amid export restrictions. Lynas is running a search for a global chief executive.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20BT/Australia's%20Lynas%20posts%20sharp%20rise%20in%20annual%20profit,%20but%20misses%20market%20estimates.pdf"},{"id":"bt-02","title":"BOJ chief Ueda to skip Jackson Hole, shifts market focus to G20","source":"BT","date":"27 Aug 2026","tags":["Finance & Markets"],"summary":"Bank of Japan board member Naoki Tamura will attend the US Federal Reserve's Jackson Hole gathering on behalf of Governor Kazuo Ueda, who is skipping the conclave due to scheduling conflicts, the central bank said. It is rare for a board member, rather than the governor or a deputy, to attend. Tamura, viewed as a hawk, has urged raising rates every few months. Ueda's absence shifts focus to next week's US-hosted G20 finance leaders' meeting in Asheville, North Carolina, where Treasury Secretary Scott Bessent hopes to meet him. A joint US-Japan yen intervention has led markets to near fully price a September hike; most economists polled by Reuters expect the BOJ to lift its policy rate to 1.25% from 1% on Sept 17-18.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20BT/BOJ%20chief%20Ueda%20to%20skip%20Jackson%20Hole,%20shifts%20market%20focus%20to%20G20.pdf"},{"id":"bt-03","title":"Data centres expected to add pressure on Singapore's energy supply: survey","source":"BT","date":"27 Aug 2026","tags":["Energy","Technology & AI","Southeast Asia"],"summary":"A Sustainable Energy Association of Singapore (Seas) survey of 100 energy-sector professionals across South-east Asia found data-centre growth is expected to strain Singapore's energy supply. Nearly 45% cited increased pressure on energy supply and infrastructure as the biggest impact by 2030, while 31% expect greater demand for energy storage and grid upgrades; only 13% cited greater renewable deployment. Executive director Kavita Gandhi said clean-energy supply is not keeping pace with data-centre buildout, despite mandates that new capacity be at least 50% green. On AI, 57% see it as significant for the energy transition, though nearly 60% cited data quality and cost as barriers. Over 60% expect the Asean Power Grid to expand bilateral trading; Singapore takes the Asean chair in 2027.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20BT/Data%20centres%20expected%20to%20add%20pressure%20on%20Singapore's%20energy%20supply%20survey.pdf"},{"id":"bt-04","title":"Gold eases from 3-month high as investors await US inflation data","source":"BT","date":"27 Aug 2026","tags":["Finance & Markets"],"summary":"Gold eased 0.3% to US$4,642.74 an ounce after scaling a more than three-month high the previous session, as investors awaited the US July PCE inflation report and Fed chair Kevin Warsh's Friday Jackson Hole speech. Prices had climbed to their highest since mid-May following the US Treasury's bond-buyback announcement; US gold futures rose 0.1% to US$4,700.70. Exness strategist Wael Makarem said softer-than-expected inflation plus a dovish Warsh would be most supportive for gold. Traders price a 61.6% chance the Fed holds rates in September. Iran's restarted Hormuz talks with Oman sent oil lower, and IMF chief Kristalina Georgieva said the global economy weathered the energy shock better than feared. Silver rose 0.9% to US$69.26.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20BT/Gold%20eases%20from%203-month%20high%20as%20investors%20await%20US%20inflation%20data.pdf"},{"id":"bt-05","title":"IMF chief Georgieva says global economy weathering energy shock","source":"BT","date":"27 Aug 2026","tags":["Finance & Markets","Energy","Geopolitics"],"summary":"IMF managing director Kristalina Georgieva said the global economy has weathered the Iran war energy shock better than feared, but warned of deteriorating fiscal conditions signalled by rising bond yields and stalled disinflation. Speaking ahead of the Aug 29-Sep 1 G20 finance leaders' meeting in Asheville, she described a \"tug of war\" between the Gulf ene
