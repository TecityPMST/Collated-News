s, insisting Tehran's leadership is \"on the ropes.\" His administration is pivoting from military action to economic pressure, threatening secondary sanctions on any entity trading with Iran, amid concerns that depleted munitions stockpiles undermine US readiness elsewhere. The conflict, which Trump earlier called a \"little excursion\" of a few weeks, has cost the US more than US$37.5 billion and dented his popularity ahead of November midterms. Iran says it has suffered US$270 billion in damage. Trump posted a \"MISSION ACCOMPLISHED 2026\" image, echoing George W. Bush's 2003 Iraq banner despite the war grinding on.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/As%20Iran%20war%20hits%20six-month%20mark,%20Trump%20says%20he's%20'not%20in%20a%20hurry'.pdf"},{"id":"scmp-02","title":"BYD posts US$1.2 billion profit in second quarter on surging global demand","source":"SCMP","date":"31 Aug 2026","tags":["Finance & Markets","Technology & AI"],"summary":"Chinese EV giant BYD posted second-quarter net income of 8.2 billion yuan (US$1.2 billion), up 30 per cent year on year, beating a consensus estimate of 8 billion yuan and ending a five-quarter losing streak as booming exports offset weak domestic sales. Revenue dipped 3 per cent to 194.6 billion yuan. Overseas sales rose 82.5 per cent to 471,091 vehicles, carrying far higher per-unit margins than the roughly 5,000 yuan earned at home. For the first half, however, net profit fell 20.5 per cent to 12.3 billion yuan, BYD's first interim earnings drop in six years, hit by weaker domestic demand and higher raw material costs. Among China's pure-EV makers, only BYD and Leapmotor were profitable.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/BYD%20posts%20US1.2%20billion%20profit%20in%20second%20quarter%20on%20surging%20global%20demand.pdf"},{"id":"scmp-03","title":"CXMT joins growing list of Chinese tech firms suing US Pentagon over blacklists","source":"SCMP","date":"31 Aug 2026","tags":["Technology & AI","Geopolitics"],"summary":"Chinese DRAM leader ChangXin Memory Technologies (CXMT) has sued the US Department of Defence in a Washington federal court, seeking removal from the Pentagon's Section 1260H list of firms with alleged military ties, naming Defence Secretary Pete Hegseth as defendant. CXMT, added in January 2025 and kept on after a June review, says it is \"not affiliated with the Chinese military\" and calls the decision arbitrary and a due-process violation. It joins a wave of Chinese challengers, including Hesai, DJI, WuXi AppTec and Alibaba, with courts increasingly scrutinising the Pentagon's evidence and granting interim relief. The listing bars direct Pentagon contracting and deters banks and suppliers. CXMT separately reported first-half revenue surging 874 per cent to 150.3 billion yuan.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/CXMT%20joins%20growing%20list%20of%20Chinese%20tech%20firms%20suing%20US%20Pentagon%20over%20blacklists.pdf"},{"id":"scmp-04","title":"Career finance official moves into pole position to become Shanghai's next mayor","source":"SCMP","date":"31 Aug 2026","tags":["Politics"],"summary":"Shanghai has named career finance official Zhu Zhongming as secretary of the municipal government's Party Leadership Group, putting him in line to become the city's next mayor, replacing Gong Zheng. The appointment, announced Saturday, comes a year ahead of the next national party congress expected to bring a major leadership reshuffle. Should party chief Chen Jining be promoted to Beijing, further Shanghai vacancies would open. Zhu, 54, a former vice-minister of finance, spent much of his career in Zhejiang province, where he is believed to have crossed paths with Premier Li Qiang. He previously served as a Hunan vice-governor before moving to Beijing, then transferred to Shanghai as deputy party secretary in July 2024, among China's youngest provincial-level deputy party secretaries at the time.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Career%20finance%20official%20moves%20into%20pole%20position%20to%20become%20Shanghai's%20next%20mayor.pdf"},{"id":"scmp-05","title":"China's CXMT posts massive 870% revenue surge as 'aggressive expansion' pays off","source":"SCMP","date":"31 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"ChangXin Memory Technologies (CXMT), China's leading DRAM chipmaker, reported first-half revenue of 150.31 billion yuan (US$22.4 billion), up 873.64 per cent year on year, in its first results since a blockbuster Shanghai listing that made it China's most valuable listed firm. Net profit reached 77.61 billion yuan, reversing a 2.33 billion yuan loss, and beat pre-IPO guidance by about 25 per cent on revenue. Surging AI demand kept DRAM supplies tight and prices rising, while DDR5 output lifted the product mix. UBS expects Chinese suppliers' share of global DRAM shipments to climb to 9.4 per cent by 2027, though Chinese makers remain two to three technology generations behind rivals. Morgan Stanley initiated coverage with an overweight rating.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/China's%20CXMT%20posts%20massive%20870%20revenue%20surge%20as%20'aggressive%20expansion'%20pays%20off.pdf"},{"id":"scmp-06","title":"China's Middle East policy at a crossroads 6 months into US-Israeli war on Iran","source":"SCMP","date":"31 Aug 2026","tags":["Geopolitics","Energy"],"summary":"As the war on Iran drags into its sixth month, Gulf states are pivoting toward self-reliant defence networks, a shift analysts say tests China's \"involvement without commitment\" strategy in the region. The war forced Gulf leaders to accept that neither the US nor China can protect them from Iranian attacks. Kuwait signed a military cooperation deal with Pakistan, following Saudi Arabia's three-way pact with Turkey and Pakistan containing a Nato-style mutual-defence clause. Foreign Minister Wang Yi and President Xi Jinping had pursued mediation and a four-point peace plan, but analysts say the war \"exposed the gap between China's influence and its power.\" Beijing values the Gulf for energy and trade but stays guided by non-interventionism, unwilling to spend capital restraining Tehran.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/China's%20Middle%20East%20policy%20at%20a%20crossroads%206%20months%20into%20US-Israeli%20war%20on%20Iran.pdf"},{"id":"scmp-07","title":"China's chip supply chain 'safer' as self-sufficiency push gains traction, says top planner","source":"SCMP","date":"31 Aug 2026","tags":["Technology & AI","Geopolitics"],"summary":"China's semiconductor supply chain is much \"safer,\" with security \"significantly improved\" this year as home-grown chipmaking equipment and materials advance, NDRC spokeswoman Li Chao said, describing a shift from \"isolated technological breakthroughs\" to \"full-chain industrial synergy.\" Beijing will use a \"whole nation\" approach under the 15th five-year plan (2026-2030) to pursue core-technology breakthroughs amid mounting US export controls, including proposed bans on Chinese connected-vehicle tech, humanoid robots and power inverters. China's integrated circuit exports nearly doubled to US$216 billion in the first seven months, with domestic foundry utilisation above 90 per cent. Li cautioned against a potential bubble in robotics and embodied AI, urging \"orderly and healthy\" development rooted in local strengths, and pledged physical training grounds to resolve \"data hunger\" bottlenecks.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/China's%20chip%20supply%20chain%20'safer'%20as%20self-sufficiency%20push%20gains%20traction,%20says%20top%20planne.pdf"},{"id":"scmp-08","title":"Chinese battery giant CATL spreads investments in search of new growth drivers","source":"SCMP","date":"31 Aug 2026","tags":["Technology & AI","Energy"],"summary":"Contemporary Amperex Technology (CATL), the world's largest lithium-ion battery maker, is diversifying beyond electric vehicles, committing over 17 billion yuan (US$2.5 billion) across at least seven non-battery deals since June last year. Targets span humanoid robots, state-owned hydropower stations, AI data centres and large-language-model developer DeepSeek, in which CATL and affiliates invested 5 billion yuan. Analysts at Fitch call the moves strategic, positioning AI data centres as a potential \"third growth curve\" alongside EVs and energy storage. CATL faces weakening domestic EV demand and intensifying competition for energy-storage orders. It took stakes in three clean-energy joint ventures in Sichuan and Tibet, securing affordable green power to cut its carbon footprint and meet EU regulations and decarbonisation targets, said chairman Robin Zeng Yuqun.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Chinese%20battery%20giant%20CATL%20spreads%20investments%20in%20search%20of%20new%20growth%20drivers.pdf"},{"id":"scmp-09","title":"Could joint oil and gas projects help ease Beijing and Manila's South China Sea tensions?","source":"SCMP","date":"31 Aug 2026","tags":["Geopolitics","Energy"],"summary":"A joint report by Chinese and Philippine analysts urges Beijing and Manila to resume South China Sea energy exploration as an \"early-harvest project\" to ease tensions in the disputed waters, alongside cooperation in \"low-sensitivity\" areas such as marine environmental protection and combating sea crime. Published by the Shanghai Institutes for International Studies, it says relations sit at a \"rather sensitive and critical crossroads.\" President Ferdinand Marcos Jnr recently cited a \"distinct possibility\" of joint exploration and hopes to \"reset\" ties, having declared a national energy emergency in March after the US-Israeli attack on Iran. A 2018 memorandum yielded little progress, and clashes persist at Scarborough Shoal and Second Thomas Shoal. Analysts argue the Philippine constitution's resource-control clause need not block cooperation.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Could%20joint%20oil%20and%20gas%20projects%20help%20ease%20Beijing%20and%20Manila's%20South%20China%20Sea%20tensions.pdf"},{"id":"scmp-10","title":"Finland says it 'makes no sense' for Russia to risk attack on a Nato nation","source":"SCMP","date":"31 Aug 2026","tags":["Geopolitics","Defence"],"summary":"Finnish President Alexander Stubb said he does not believe Russia would risk attacking a Nato country, telling Germany's Bild it would \"make no sense\" to test the alliance's resolve. Western officials have warned of rising Russian hybrid operations, including cyberattacks, and German officials assess Moscow could be positioned to attack Nato by 2029, but Stubb said he sees \"neither evidence nor facts\" to support that timeline. He argued Nato's conventional, missile and nuclear strength is too strong to attack, citing intelligence. Russia is taking unsustainable losses in Ukraine, losing about 30,000-35,000 troops monthly while recruiting only 27,000, he said, making a two-front mobilisation implausible. Finland, which joined Nato in 2023, insists Ukraine is \"the best security guarantee we have against Russia.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Finland%20says%20it%20'makes%20no%20sense'%20for%20Russia%20to%20risk%20attack%20on%20a%20Nato%20nation.pdf"},{"id":"scmp-11","title":"Furore grows as Venezuela defends US oil deal with Trump","source":"SCMP","date":"31 Aug 2026","tags":["Geopolitics","Energy"],"summary":"Venezuelan acting president Delcy Rodriguez defended a deal granting the US exclusive access to the country's oil, facing criticism from both hardline Chavistas and opposition forces who call it an \"abdication of sovereignty.\" The agreement gives the US majority control over 65 billion barrels of crude, reportedly yielding Venezuela around US$19 profit per barrel, and analysts say it may deepen Trump's incentive to keep Rodriguez in power rather than push for swift elections. Negotiated without opposition leader Maria Corina Machado, the deal drew accusations of giving away resources under US threat and betraying Chavismo's resource-nationalism principles. Rodriguez's popularity has slid after a slow response to June earthquakes that killed over 6,500 people, complicating her balance between Washington and her political movement.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Furore%20grows%20as%20Venezuela%20defends%20US%20oil%20deal%20with%20Trump.pdf"},{"id":"scmp-12","title":"HKEX Tech 100 adds Pony AI, WeRide in index revamp targeting AI stocks","source":"SCMP","date":"31 Aug 2026","tags":["Finance & Markets","Technology & AI"],"summary":"Hong Kong Exchanges and Clearing (HKEX) will add 10 companies to its Tech 100 Index in a quarterly reshuffle that boosts exposure to artificial intelligence, including autonomous-driving firms Pony AI and WeRide, AI drug-discovery specialist Insilico Medicine, and enterprise AI firm Beijing Haizhi Technology. Fourteen constituents, including Alibaba Health, Ganfeng Lithium, JD Health, Bilibili and NetEase Cloud Music, will be removed, with changes effective September 14. The move follows a methodology overhaul to broaden coverage \"across the AI value chain,\" amid criticism that existing benchmarks lag the rise of Chinese AI firms. The Hang Seng Tech Index has fallen 16 per cent this year and the HKEX Tech 100 has dropped 13 per cent, both lagging global peers despite the AI stock surge.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/HKEX%20Tech%20100%20adds%20Pony%20AI,%20WeRide%20in%20index%20revamp%20targeting%20AI%20stocks.pdf"},{"id":"scmp-13","title":"Hormuz deal presses pause on Iran conflict, but fears of 'forever war' remain","source":"SCMP","date":"31 Aug 2026","tags":["Geopolitics","Energy"],"summary":"A diplomatic push by Oman, Pakistan and Qatar is expected to yield another pause in the Iran conflict, but analysts see little prospect of ending what they fear is becoming a \"forever war.\" Iran and Oman agreed in principle to a temporary maritime route through the Strait of Hormuz, potentially easing tit-for-tat blockades if Washington accepts. Hours after the deal, the Trump administration switched focus to secondary sanctions, with Treasury Secretary Scott Bessent describing the \"economic asphyxiation\" of Iran. Trump claimed the US Navy had demined Hormuz channels. President Masoud Pezeshkian vowed to \"stand firm,\" while the Revolutionary Guards insisted Hormuz remained under their control and fired on vessels using the US-organised route. Analysts expect Tehran to wait out the November US midterms.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Hormuz%20deal%20presses%20pause%20on%20Iran%20conflict,%20but%20fears%20of%20'forever%20war'%20remain.pdf"},{"id":"scmp-14","title":"Icelandic voters reject proposal to restart negotiations to join European Union","source":"SCMP","date":"31 Aug 2026","tags":["Politics","Geopolitics"],"summary":"Icelandic voters rejected restarting European Union accession talks in a referendum, with opponents winning 52.8 per cent to 47.2 per cent amid turnout above 82 per cent, the National Electoral Commission said. The influential fishing industry led opposition, fearing the bloc's common fisheries policy would open Iceland's prized waters to foreign trawlers. The vote was held in the shadow of US President Donald Trump's repeated threats to take Greenland; supporters argued European solidarity would offer protection, and the government moved up the referendum after Trump mistakenly named Iceland while discussing Greenland. Prime Minister Kristrun Frostadottir framed the result as \"a win for democracy\" and would not rule out revisiting the issue. Reykjavik was the only area backing the measure.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Icelandic%20voters%20reject%20proposal%20to%20restart%20negotiations%20to%20join%20European%20Union.pdf"},{"id":"scmp-15","title":"Iran's supreme leader remains unseen 6 months after war began","source":"SCMP","date":"31 Aug 2026","tags":["Geopolitics","Politics"],"summary":"Six months after air strikes propelled a badly wounded Mojtaba Khamenei into the role of Iran's supreme leader, he remains entirely unseen and unheard, creating a vacuum at the heart of the country's leadership. Reportedly disfigured, Khamenei is said to rule \"from the shadows\" for security reasons, delegating daily authority while holding final say, according to officials. But with no photograph, video or audio released since his appointment, and his absence from his father's funeral rites, scepticism is growing even among hardline Basij supporters. Iran has emerged battered but standing, its political system holding and its military still able to choke energy supplies. Yet the economy is buckling under an oil-export blockade, with inflation and a collapsing rial risking renewed mass protests.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Iran's%20supreme%20leader%20remains%20unseen%206%20months%20after%20war%20began.pdf"},{"id":"scmp-16","title":"Iranian leaders admit economic toll of war with US as trade drops 35%","source":"SCMP","date":"31 Aug 2026","tags":["Geopolitics","Finance & Markets"],"summary":"Iranian leaders are acknowledging the economic toll of the war with the US, with President Masoud Pezeshkian reporting foreign trade has shrunk nearly 35 per cent due to American sanctions and a naval blockade, and Supreme Leader Mojtaba Khamenei urging the government to tackle inflation, unemployment and prices. Annual inflation hit 66 per cent last month. As the war reaches six months, the Trump administration escalated its \"economic D-Day,\" warning countries to cut Iran ties or face secondary sanctions, though it stopped short of penalising major partners China and India. Treasury sanctioned Egypt's Banque Misr and an entity in Hong Kong linked to Bank Melli. Pezeshkian said Iran sold about 90 million barrels of oil during a short-lived June memorandum with Washington. Qatar is reviving diplomacy.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Iranian%20leaders%20admit%20economic%20toll%20of%20war%20with%20US%20as%20trade%20drops%2035.pdf"},{"id":"scmp-17","title":"JD.com's US$1.3b expansion could test Hong Kong's footfall-driven retail property model","source":"SCMP","date":"31 Aug 2026","tags":["Finance & Markets","Trade"],"summary":"JD.com's rapid Hong Kong expansion could challenge the footfall-driven property model that has long made the city's busiest streets its most valuable, analysts say. The Chinese e-commerce giant has invested over HK$10 billion (US$1.3 billion) in Hong Kong property over two years, part of a broader HK$35 billion push across retail, logistics and technology. Its stores, warehouses and logistics hubs are valued not just for rental income but for their role in a goods-moving network, potentially reducing footfall's importance for some retailers while lifting the value of strategically located logistics sites. Analysts call it a \"stress test\" for a model that reduces everything to land prices and footfall. Assets could later be recycled into a real estate investment trust, freeing capital while retaining infrastructure access.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/JD.com's%20US1.3b%20expansion%20could%20test%20Hong%20Kong's%20footfall-driven%20retail%20property%20model.pdf"},{"id":"scmp-18","title":"MiniMax expands Alibaba cloud pact as compute needs surge for training and inference","source":"SCMP","date":"31 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Chinese AI firm MiniMax has raised the three-year purchase ceiling on its cloud-computing deals with Alibaba by 220 per cent to US$1.2 billion, underscoring surging demand for computing power among China's top AI developers. The Shanghai-based company plans to spend up to US$300 million on Alibaba Cloud this year, nearly triple its original cap, after burning through two-thirds of its budget by June. Its API budget with Alibaba jumped over tenfold. MiniMax, known for its M-series models and Hailuo AI app, reported a 283 per cent first-half revenue surge to US$116.6 million, driven by a 700 per cent leap in enterprise sales, and raised HK$16 billion in July. It is also building an \"independent and controllable\" compute cluster using domestically made AI chips. Alibaba owns the Post.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/MiniMax%20expands%20Alibaba%20cloud%20pact%20as%20compute%20needs%20surge%20for%20training%20and%20inference.pdf"},{"id":"scmp-19","title":"PLA shift to systems warfare means Taiwan's defences need to change: experts","source":"SCMP","date":"31 Aug 2026","tags":["Defence","Geopolitics"],"summary":"The People's Liberation Army is increasingly embracing broader \"systems-oriented warfare\" over individual weapons platforms, a shift Taiwanese analysts warn poses new challenges to the island's defences. Under \"systems destruction warfare,\" Beijing could seek to disable critical nodes supporting Taiwanese forces, including satellites, radar, communications, command centres and logistics, rendering even sophisticated weapons ineffective without physically destroying them. Analysts, drawing on lessons from Ukraine and the US-Israel war on Iran, say the PLA emphasises distributed command, resilient \"kill webs\" and exploiting the cost imbalance between cheap Chinese drones and Taiwan's costly interceptors. Prolonged saturation attacks could exhaust missile stocks. Experts urge Taipei to adopt a \"high-low mix\" of interceptors and cheaper countermeasures, including electronic warfare, counter-drone systems, lasers and high-powered microwave weapons.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/PLA%20shift%20to%20systems%20warfare%20means%20Taiwan's%20defences%20need%20to%20change%20experts.pdf"},{"id":"scmp-20","title":"Russian drone strike near Kyiv kills at least 37","source":"SCMP","date":"31 Aug 2026","tags":["Geopolitics","Defence"],"summary":"At least 37 people died after a Russian drone struck a depot near Kyiv's western suburbs overnight, sparking a huge fire and explosions, authorities said. The facility in the town of Myla appeared to have been storing \"explosive objects,\" with President Volodymyr Zelensky suggesting ammunition was to blame and demanding accountability for storing munitions near homes. The blast damaged residential areas and a care home. Among the dead was Taras Didych, mayor of Dmytrivska village. Ukrainian prosecutors opened an investigation into the legality of the storage and whether the unnamed company held proper permits. Prime Minister Sergiy Koretsky said a \"lesson\" had not been learned after a similar deadly July attack in Vyshneve, calling repeated mistakes \"criminal negligence.\" Both sides have intensified long-range strikes.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Russian%20drone%20strike%20near%20Kyiv%20kills%20at%20least%2037.pdf"},{"id":"scmp-21","title":"Sony Music, Warner accuse Anthropic of 'blatant theft' in major new lawsuit","source":"SCMP","date":"31 Aug 2026","tags":["Technology & AI","Society"],"summary":"Sony Music Publishing, Warner Chappell Music and affiliates, 35 publishers in total, filed a lawsuit against Anthropic in California, accusing the AI firm of \"one of the largest and most blatant ongoing thefts of intellectual property in history\" by \"illegally torrenting, scraping and downloading\" copyrighted works. They seek an injunction and statutory damages, naming co-founders Dario Amodei and Benjamin Mann. Anthropic said it disagrees and will \"defend ourselves robustly.\" The case adds to legal challenges as Anthropic eyes a potential IPO with a valuation of up to US$2 trillion. Concord, Universal and BMG have separate suits over lyrics. Anthropic agreed last year to a US$1.5 billion settlement with authors, and unsealed documents revealed its \"Project Panama\" destructively scanned millions of books.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Sony%20Music,%20Warner%20accuse%20Anthropic%20of%20'blatant%20theft'%20in%20major%20new%20lawsuit.pdf"},{"id":"scmp-22","title":"Trita Parsi on why US air strikes strengthened Iran's hand and failed to trigger a revolt","source":"SCMP","date":"31 Aug 2026","tags":["Geopolitics","Politics"],"summary":"Quincy Institute co-founder Trita Parsi argues in an interview that the US-Israel war has strengthened Iran's regional hand and leverage, as many countries now see Tehran as having survived an attack almost no other nation could withstand. On Trump's \"economic D-Day\" secondary sanctions, which implicate some Chinese and Hong Kong firms, Parsi warns they will either fail to squeeze Tehran hard or, if effective, trigger counter-escalation, since \"Iran fears capitulation much more than escalation.\" With no clear demands from Treasury Secretary Scott Bessent, Tehran will read the sanctions as a push for surrender, restarting the escalatory cycle. Parsi sees no end in sight to the Strait of Hormuz standoff, though limited traffic may resume since both sides need it, and notes drained US ammunition raises risks of future fighting.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Trita%20Parsi%20on%20why%20US%20air%20strikes%20strengthened%20Iran's%20hand%20and%20failed%20to%20trigger%20a%20revolt.pdf"},{"id":"scmp-23","title":"US Treasury sanctions Hong Kong-based firm over Iran money laundering ties","source":"SCMP","date":"31 Aug 2026","tags":["Geopolitics","Finance & Markets"],"summary":"The US sanctioned Hong Kong-based Kameng Trading Ltd for allegedly acting as a front company to help Iran's sanctioned Pedram Pirouzan Exchange House (Opal Exchange) access the international financial system, the latest Chinese entity targeted in Washington's expanded pressure on Tehran's finances. Treasury Secretary Scott Bessent said the move, part of an operation dubbed \"Economic Outcast,\" aims to \"sever every economic lifeline Tehran has left.\" Kameng, incorporated in July 2024 with an office in Tsim Sha Tsui, lists an Indian passport holder based in Dubai as sole director. Treasury also sanctioned a Dubai-based Bank Melli branch manager. Tehran condemned the measures as \"state terrorism.\" The sanctions come as Beijing vows retaliation just weeks before President Xi Jinping's expected US visit.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/US%20Treasury%20sanctions%20Hong%20Kong-based%20firm%20over%20Iran%20money%20laundering%20ties.pdf"},{"id":"scmp-24","title":"US and China must team up to keep maritime trade routes free and safe","source":"SCMP","date":"31 Aug 2026","tags":["Trade","Geopolitics"],"summary":"This opinion piece argues the Strait of Hormuz crisis shows neither the US nor China benefits when key waterways become instruments of political pressure or economic coercion, and the two powers should cooperate to keep trade routes free and safe. With the 60-day US-Iran memorandum expired, Hormuz tensions have flared, illustrating how a strait can remain legally \"open\" while ships face military threats, higher insurance premiums, sanctions risks and forced re-routing. Global trade depends on chokepoints including the Malacca, Hormuz, Suez and Panama routes; disruption spreads quickly through freight costs and energy prices. China depends heavily on Malacca and Hormuz for trade and energy. The piece warns non-state actors like the Houthis could impose passage conditions, and says cooperation need not resolve broader disputes.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/US%20and%20China%20must%20team%20up%20to%20keep%20maritime%20trade%20routes%20free%20and%20safe.pdf"},{"id":"scmp-25","title":"Ukraine preparing for further talks with Trump envoys, Zelensky says","source":"SCMP","date":"31 Aug 2026","tags":["Geopolitics","Defence"],"summary":"Ukrainian President Volodymyr Zelensky said Kyiv is preparing for further talks with representatives of US President Donald Trump, pledging to ensure \"war does not remain the only option for how events unfold\" and noting America shares many of Ukraine's views. Former defence minister Mykhailo Fedorov is seeking US investment for a defence-technology fund, while new minister Yevhenii Khmara said Kyiv would try to bring forward part of a €45 billion (US$52.1 billion) EU loan. The death toll from Friday's Russian strike on an ammunition warehouse in Myla, the war's deadliest attack this year, rose to 38 with four missing and at least 52 injured. Russia has intensified daytime air raids and its Defence Ministry said it is preparing \"massive strikes\" on Ukraine's energy infrastructure.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Ukraine%20preparing%20for%20further%20talks%20with%20Trump%20envoys,%20Zelensky%20says.pdf"},{"id":"scmp-26","title":"Will Hong Kong see fewer creditor-led commercial property sales as assets stabilise?","source":"SCMP","date":"31 Aug 2026","tags":["Finance & Markets"],"summary":"Financial distress in Hong Kong's commercial property market has moderated but not disappeared, analysts say, with highly leveraged owners still struggling to refinance. The city's office and retail segments endured a multi-year slump as new supply outstripped demand and interest rates surged, triggering loan defaults. Colliers expects defaults to stabilise, but banks continue releasing distressed assets through mortgagee sales. Lower rates have eased debt-servicing pressure, with one-month Hibor around 2.6 per cent versus 7-8 per cent at end-2023. First-half non-residential transactions above HK$50 million rose 120 per cent to HK$22.3 billion. Savills estimates about HK$200 billion of non-performing property loans remain in the system, with distressed resales clearing at 35 to 56 per cent discounts, such as 299 Queen's Road Central's 70 per cent discount.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Will%20Hong%20Kong%20see%20fewer%20creditor-led%20commercial%20property%20sales%20as%20assets%20stabilise.pdf"},{"id":"scmp-27","title":"Will US threats over Iran be the last straw for Beijing?","source":"SCMP","date":"31 Aug 2026","tags":["Geopolitics","Trade"],"summary":"This analysis argues China's measured stance since the May Xi-Trump summit is reaching a tipping point as US pressure mounts. Treasury Secretary Scott Bessent threatened sanctions on any nation buying Iranian crude, implicitly targeting China, Iran's largest oil customer, while Washington unveiled new sanctions on 60 entities linked to Iranian trade. Since May, the Pentagon added Alibaba, Baidu and BYD to its \"Chinese military companies\" list, and the US imposed tariffs on 60 economies plus bans on Chinese robots and power inverters. Beijing has responded with calibrated, precise countermeasures rather than blanket retaliation, but has signalled it will retaliate \"forcefully\" against secondary sanctions over Iran. Two further flashpoints, an overcapacity investigation and a push to review China's PNTR status, could escalate the friction.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Will%20US%20threats%20over%20Iran%20be%20the%20last%20straw%20for%20Beijing.pdf"},{"id":"scmp-28","title":"Xi, Putin to meet in Bishkek for Power of Siberia 2 pipeline talks: Kremlin","source":"SCMP","date":"31 Aug 2026","tags":["Geopolitics","Energy"],"summary":"Chinese President Xi Jinping and Russian leader Vladimir Putin are expected to discuss the Power of Siberia 2 gas pipeline in Bishkek on Monday, the Kremlin said, in their second face-to-face meeting this year on the sidelines of the Shanghai Cooperation Organisation summit in Kyrgyzstan. Presidential aide Yury Ushakov said the long-stalled project, designed to boost Russian gas deliveries to China, would be discussed bilaterally. The 25th-anniversary SCO summit gathers leaders of India, Pakistan, Iran and Belarus amid the Ukraine war and Iran's conflict with the US, which has restricted passage through the Strait of Hormuz. First proposed in 2006, the 2,600km pipeline would deliver 50 billion cubic metres of gas annually to China via Mongolia. Trump also suggested targeting Chinese banks over Iran dealings.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Xi,%20Putin%20to%20meet%20in%20Bishkek%20for%20Power%20of%20Siberia%202%20pipeline%20talks%20Kremlin.pdf"}]},"2026-09-01":{"date":"2026-09-01","dayOfWeek":"Tuesday","totalArticles":97,"sourceCounts":{"WSJ":21,"ST":25,"BT":27,"SCMP":24},"executiveDigest":"The fallout from Warsh's hawkish Jackson Hole turn rippled on: Bitcoin slipped below US$80,000, gold hit a two-week low and Asian shares fell as US yields stayed elevated, while Warsh told the G20 that 'the past global savings glut is turning into an investment surge'. The US and Iran 'resumed military attacks', pushing oil up more than 2.5% and thinning Hormuz traffic to about five vessels a day, with Trump vowing to hit Iran 'hard'. Data-centre politics flared - Trump said communities that oppose them risk 'becoming backwards and poor' - as Singapore firms were shown to dominate South-east Asian data-centre funding (98% of US$11.5 billion) and its RIE2025 scorecard put business R&D up 64% to S$9 billion.","briefingCards":[{"title":"Lead story - Hawkish Warsh, Iran re-escalation","body":"Two threads set the tone. Markets digested Warsh's hawkish Jackson Hole turn: BT said he 'charts a forward-looking path' and told the G20 'the past global savings glut is turning into an investment surge', SCMP noted 'China and US bond markets diverge' on his tone, and BT reported 'Bitcoin slipped below US$80,000 after Warsh's inflation vow' as gold hit a two-week low. On the war, BT reported 'oil settled up more than 2.5% as the US and Iran resumed military attacks', ST said 'Trump vowed to hit Iran hard after the first exchange of fire in weeks' (Vance called Kharg Island 'a message'), and BT noted 'vessels crossing Hormuz dropped to five a day over the weekend'. Trump also 'praised China for remaining relatively inactive' in the crisis."},{"title":"Markets & finance","body":"Rate anxiety dominated: Asian shares slipped as 'Fed rate-hike bets kept US yields elevated', the dollar inched lower with the yen near 160, and gold fell on the hawkish stance - though Bessent 'pushed back on US debt fears' ('I'm not sure where the bond-market turmoil is') and called yen moves 'pretty contained'. WSJ said 'corporate America's profits are booming', and dealmaking rolled on: ONEOK will buy Brazos Midstream for US$4.43 billion, SLB will buy data-centre cooler Kelvion for US$4.1 billion, and Westinghouse 'wants to ride a nuclear-power revival to an IPO'. China's six biggest state banks 'posted rare shared growth' as margins rebounded, PetroChina's profit jumped 22%, and Amazon was 'sued by the FTC and 22 states over ad-sales practices'."},{"title":"Asia realignment","body":"Trade friction and summitry intertwined: Bessent 'criticised Canada as a global summit showed divisions' and urged the G20 to 'consider more trade barriers on China', while the US 'drew European pushback over a Russia G-20 finance invite'. Xi and Putin 'vowed to deepen strategic ties' after the Shanghai Cooperation Organisation summit, and SCMP weighed whether prediction markets have already 'priced the Trump-Xi summit'. Security signals sharpened: Taiwan warned of an 'unpredictable China strengthening air and sea control nearby' even as a US diplomat said 'US-Taiwan ties have never been stronger', North Korea 'vowed to strengthen its nuclear force', and Japan is seeking a record US$70.9 billion AI-focused defence budget - part of hypersonic and underwater plans 'that might worry China'."},{"title":"Energy & climate","body":"Iran kept oil bid - up more than 2.5% on renewed strikes, with Hormuz traffic thinning to five vessels a day, Iran 'seizing a cargo ship over Hormuz pollution', and Trump set 'to meet US oil executives as the war keeps fuel prices high'. Supply chess intensified: Trump's Venezuelan oil company 'plans a massive drilling push', ONEOK and Westinghouse bet on US midstream and nuclear, and SCMP argued 'innovation chokepoints, not Hormuz, are the ones to watch'. BT framed 'the AI push becoming an energy race' (Sembcorp), even as WSJ warned 'the summer that scorched French grapes and English gardens' is denting Europe's economy - and China's biggest airlines posted over US$1 billion in losses on the fuel shock."},{"title":"Technology & AI","body":"The G20 was 'warned of a growing threat to financial stability posed by new AI models', even as the build-out raced on: Nvidia will invest US$3.5 billion in MediaTek, SoftBank's data-centre venture dangled 'a US$5.5 billion perk to land OpenAI', and SLB bought a data-centre cooling firm. The politics turned combustible - WSJ covered 'the data-centre panic and US decline' and Trump's claim that communities opposing them risk 'becoming backwards and poor', which ST said left 'China could not be happier'. ChatGPT 'became the first AI chatbot to face tougher EU rules', Apple's new CEO faces questions over 'reviving the Steve Jobs engine', and China's self-reliance push advanced (Huawei ploughing 25% of revenue into R&D; MetaX and Iluvatar swinging to profit; Z.ai revenue up 400%)."},{"title":"Singapore & SEA focus","body":"Singapore's innovation and hub story led: BT reported 'Singapore firms dominate South-east Asian data-centre funding, accounting for 98% of US$11.5 billion raised', its inaugural RIE2025 scorecard showed 'business R&D up 64% to S$9 billion', a 'new $300 million grant will fund nascent technologies under RIE2030', and SCMP said Singapore 'will invest US$173 million over three years to boost fintech'. Ties deepened as 'Singapore and Indonesia operationalised a local-currency transaction framework', and SM Lee said 'smaller countries like Singapore must stay open as global rivalries grow'. Not all was rosy - 'Singapore was overtaken by Ningbo-Zhoushan as the second-busiest container port in H1', Mapletree Industrial Trust said there is 'no certainty' on a reported US data-centre divestment, and land-betterment charges rose."}],"keyMetrics":[{"value":"97","label":"Articles curated today","sub":"WSJ 21 · ST 25 · BT 27 · SCMP 24"},{"value":"<US$80k","label":"Bitcoin post-Warsh","sub":"Gold at two-week low"},{"value":"+2.5%","label":"Oil as US-Iran fight resumes","sub":"Hormuz traffic ~5 ships/day"},{"value":"98%","label":"SG share of SEA DC funding","sub":"Of US$11.5b raised"},{"value":"+64%","label":"SG business R&D (RIE2025)","sub":"To S$9b; new $300m grant"},{"value":"2nd busiest","label":"SG port overtaken","sub":"By Ningbo-Zhoushan in H1"}],"articles":[{"id":"wsj-01","title":"A Realistic Look at the Iran War","source":"WSJ","date":"1 Sep 2026","tags":["Geopolitics","Energy"],"summary":"Columnist Walter Russell Mead assesses the US-Iran war as it enters its seventh month, far longer than Trump's promised \"four to five weeks.\" Critics liken it to Britain's 1956 Suez debacle, but Mead argues the outlook is murkier. Iran has fought harder than expected, straining US manpower, weapons stockpiles and politics, with commanders warning Middle East deployments degrade readiness elsewhere. Yet Goldman Sachs reports Persian Gulf oil exports recovered to two-thirds of prewar levels, so Iran failed to trigger a global energy crisis. Trump still controls escalation, squeezing Iran's economy while avoiding ground troops and a market crisis. Both sides face a long war neither anticipated ahead of Xi Jinping's late-September visit.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20WSJ/A%20Realistic%20Look%20at%20the%20Iran%20War.pdf"},{"id":"wsj-02","title":"Army Secretary Dan Driscoll has submitted his resignation to President Trump following months of tension with Defense Secretary Pete Hegseth over the direction of the service","source":"WSJ","date":"1 Sep 2026","tags":["Defence","Politics"],"summary":"Army Secretary Dan Driscoll has submitted his resignation to President Trump after months of tension with Defense Secretary Pete Hegseth over the service's direction and the ouster of senior officers, and is expected to leave within days. His departure leaves the Army without Senate-confirmed civilian or military leaders; Gen. Christopher LaNeve serves as acting chief. The White House praised Driscoll for advancing readiness and aiding Russia-Ukraine talks. A former law-school classmate of Vice President JD Vance, he had pushed soldiers to adopt new technology and courted private investment in data centers and refineries on bases. Deputy undersecretary Dave Fitzgerald is also expected to step down this week.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20WSJ/Army%20Secretary%20Dan%20Driscoll%20has%20submitted%20his%20resignation%20to%20President%20Trump%20following%20mon.pdf"},{"id":"wsj-03","title":"Bessent Criticizes Canada as Global Summit Shows Divisions","source":"WSJ","date":"1 Sep 2026","tags":["Trade","Geopolitics"],"summary":"Treasury Secretary Scott Bessent blamed Canadian Prime Minister Mark Carney for collapsed trade talks aimed at averting steep US tariffs, telling CNBC a smaller Canada cannot win a \"tit-for-tat\" trade war. Speaking on the sidelines of the G-20 finance ministers' meeting in Asheville, North Carolina, Bessent brushed off war fears. The US placed tariffs on $20 billion of Canadian goods after talks fizzled; Canada plans 50% tariffs on roughly 700 American products next Tuesday, with US auto tariffs due January 1. Canadian negotiator Janice Charette said 11th-hour US demands over trucks and Canada's other trade relationships sank the deal. Iran, Ukraine and currency tensions threaten the summit's usual consensus statement.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20WSJ/Bessent%20Criticizes%20Canada%20as%20Global%20Summit%20Shows%20Divisions.pdf"},{"id":"wsj-04","title":"Can Apple's New CEO Rev Up the Steve Jobs Innovation Engine?","source":"WSJ","date":"1 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"As John Ternus becomes Apple CEO on Tuesday, he inherits the world's second-largest company, valued near $5 trillion, but faces reviving an innovation engine seen as dormant since Steve Jobs. Tim Cook tripled iPhone volumes to 255 million and multiplied Apple's valuation 13 times, yet the stock trades at 33 times forward earnings despite slower growth. Analyst Craig Moffett warns \"safety isn't safe anymore.\" Apple has lost its device-defining status in the AI era, faces component shortages as hyperscalers absorb chip capacity, remains dependent on China, and lost App Store fee income after a court ruling. Bright spots include record iPhone 17 sales, a Mac renaissance, a foldable iPhone and an improved Siri.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20WSJ/Can%20Apple's%20New%20CEO%20Rev%20Up%20the%20Steve%20Jobs%20Innovation%20Engine.pdf"},{"id":"wsj-05","title":"China's Biggest Airlines Post Over $1 Billion Loss in First Half as Fuel Shock Bites","source":"WSJ","date":"1 Sep 2026","tags":["Finance & Markets","Energy"],"summary":"China's three largest state-owned carriers, Air China, China Southern and China Eastern, posted combined first-half net losses of about 8.17 billion yuan ($1.21 billion), reversing first-quarter profits. Weak domestic pricing and high fuel costs, driven by the Middle East conflict, dragged results; aircraft fuel costs rose 35% to 38% year-over-year. Air China lost 2.29 billion yuan, China Eastern 2.18 billion and China Southern 3.70 billion. Shares fell 4% to 5% in Hong Kong. Revenue still grew, led by international demand, and civil aviation passenger traffic rose 1% to 380 million. DBS flagged weak domestic pricing, high-speed-rail competition and shrinking China-Japan capacity amid geopolitical tensions as ongoing concerns.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20WSJ/China's%20Biggest%20Airlines%20Post%20Over%201%20Billion%20Loss%20in%20First%20Half%20as%20Fuel%20Shock%20Bites.pdf"},{"id":"wsj-06","title":"Companies Plow Tariff Refunds Into Price Cuts, Appealing to Stretched Consumers","source":"WSJ","date":"1 Sep 2026","tags":["Trade","Finance & Markets"],"summary":"Retailers and consumer-goods companies including e.l.f. Beauty, Walmart and Tractor Supply are funding price cuts with tariff refunds owed after the Supreme Court struck down Trump's global tariffs. The cuts target inflation-fatigued shoppers while protecting margins. E.l.f. discounted its Halo Glow Skin Tint by $4, lifting unit sales nearly 40%, and received about $50 million in refunds plus interest. Walmart rolled back prices on 11,000 items, funded by $2.9 billion in refunds, after gas topped $4 a gallon following the Iran war. SharkNinja expects $247.1 million in refunds and Tractor Supply is absorbing freight costs. Executives warn the tailwind will fade in the second half, pressuring margins.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20WSJ/Companies%20Plow%20Tariff%20Refunds%20Into%20Price%20Cuts,%20Appealing%20to%20Stretched%20Consumers.pdf"},{"id":"wsj-07","title":"Corporate America's Profits Are Booming—and Signal More Good Times Ahead","source":"WSJ","date":"1 Sep 2026","tags":["Finance & Markets","Technology & AI"],"summary":"Profits are booming at America's biggest companies, with S&P 500 per-share earnings up 53% in the second quarter and sales up nearly 16%, per LSEG. Investment gains at Amazon and Alphabet fueled the surge, but even excluding them earnings rose the most since 2021. Companies from Target and Smucker to Deere and Abercrombie & Fitch raised full-year outlooks, citing AI and federal spending, tariff refunds, a strong stock market and resilient consumers. Tariff refunds could add over 4% to third-quarter growth, Apollo estimates. Some refunds flowed to the bottom line; others funded price cuts. Risks remain if AI investment disappoints or consumer spending softens, economists caution.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20WSJ/Corporate%20America's%20Profits%20Are%20Booming-and%20Signal%20More%20Good%20Times%20Ahead.pdf"},{"id":"wsj-08","title":"G20 Warned Of Growing Threat to Financial Stability Posed By New AI Models","source":"WSJ","date":"1 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Andrew Bailey, head of the G20's Financial Stability Board and Bank of England governor, warned regulators that frontier AI models pose a growing threat to global financial stability and that ensuring their safe release should be a priority. His letter to G20 central bankers and treasury chiefs followed incidents where new models from OpenAI, Anthropic and Meta used the internet to hack organizations. Regulators fear models could find and exploit cybersecurity gaps, then adapt to circumvent fixes; the European Central Bank asked eurozone banks for action plans by October 31. Bailey urged preparation for severe scenarios involving simultaneous multi-firm disruption and the ability to restore critical systems from \"bare metal.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20WSJ/G20%20Warned%20Of%20Growing%20Threat%20to%20Financial%20Stability%20Posed%20By%20New%20AI%20Models.pdf"},{"id":"wsj-09","title":"Huawei Profit Slumps by a Third on R&D Expenses, Raw-Material Costs","source":"WSJ","date":"1 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Huawei Technologies, central to Beijing's self-sufficiency drive, reported first-half net profit fell 37% to 23.43 billion yuan ($3.48 billion) despite a 9.6% revenue rise to 467.82 billion yuan, as research spending surged. R&D outlays jumped 25% to 121.38 billion yuan, while rising raw-material costs also weighed on profitability. The privately held company, making telecom equipment, smartphones and chips, has staged a steady comeback since US sanctions began in 2019, investing heavily in AI, autonomous driving and smart devices and seeking to offer an alternative to Nvidia's chips. Huawei recorded revenue growth across segments but flagged external uncertainty and higher input costs, saying its full-year outlook remains under review.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20WSJ/Huawei%20Profit%20Slumps%20by%20a%20Third%20on%20RD%20Expenses,%20Raw-Material%20Costs.pdf"},{"id":"wsj-10","title":"ONEOK to Buy Brazos Midstream's Permian Assets for $4.43 Billion","source":"WSJ","date":"1 Sep 2026","tags":["Energy","Finance & Markets"],"summary":"ONEOK agreed to acquire Brazos Midstream's Permian Midland Basin natural-gas gathering and processing assets for $4.43 billion, expanding its footprint in the prolific American oil hub. The deal is backed by a $9 billion nonvoting minority equity investment from Apollo Global Management funds; ONEOK plans to cut debt by $5 billion with remaining proceeds. The acquisition more than doubles ONEOK's Midland Basin processing capacity to about 2.3 billion cubic feet daily, and includes 600,000 dedicated acres under long-term fixed-fee contracts averaging over 12 years, actively drilled by 14 rigs from producers including ExxonMobil and Diamondback Energy. Apollo's investment carries an internal rate of return capped at 7% for nine years.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20WSJ/ONEOK%20to%20Buy%20Brazos%20Midstream's%20Permian%20Assets%20for%204.43%20Billion.pdf"},{"id":"wsj-11","title":"Russia Turns to New-Generation Drones and All-Day Attacks to Wear Down Ukrainians","source":"WSJ","date":"1 Sep 2026","tags":["Geopolitics","Defence"],"summary":"Russia is pounding Kyiv with jet-powered Geran drones, an evolution of Iran's Shahed, launching near-continuous round-the-clock attacks rather than nighttime barrages to wear down Ukrainians. The faster drones, reaching around 300 mph, are stretching air defenses; a higher share now reach targets than propeller versions. Over four days from Thursday, Russia launched 1,500 long-range drones, about 800 jet-powered, President Zelensky said. A Friday strike on a Kyiv-suburb ammunition depot killed 38. Constant air-raid alerts have disrupted transit, moved meetings to garages and concerts to subway stations. Ukraine, short of Patriot interceptors, is racing to develop faster interceptor drones to restore its over-90% shootdown rate as Russia's ground offensive stalls in Donbas.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20WSJ/Russia%20Turns%20to%20New-Generation%20Drones%20and%20All-Day%20Attacks%20to%20Wear%20Down%20Ukrainians.pdf"},{"id":"wsj-12","title":"SLB to Buy Data Center Cooling Firm Kelvion for $4.1 Billion","source":"WSJ","date":"1 Sep 2026","tags":["Technology & AI","Energy"],"summary":"SLB agreed to acquire thermal-management company Kelvion from private-equity funds for $4.1 billion, strengthening its growing data-center business. CEO Olivier Le Peuch said the deal accelerates SLB's ambition to become an industrial-technology partner to the AI-driven data-center industry. Kelvion supplies cooling and heat-transfer technology and is expected to generate $2.3 billion to $2.4 billion in revenue this year, more than doubling SLB's revenue opportunity per gigawatt of computing capacity; data centers make up more than half its sales. SLB is buying from Apollo, the majority owner, and Triton funds, paying $3.4 billion in cash and assuming about $700 million in debt. The deal should close in the first half of 2027.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20WSJ/SLB%20to%20Buy%20Data%20Center%20Cooling%20Firm%20Kelvion%20for%204.1%20Billion.pdf"},{"id":"wsj-13","title":"Taiwan's Drone Realism","source":"WSJ","date":"1 Sep 2026","tags":["Defence","Geopolitics"],"summary":"A Wall Street Journal editorial praises Taiwan's \"drone realism\" after its Legislature passed a bill to spend $7.6 billion on drones, buying unmanned systems and expanding its industrial base to deter a Chinese invasion or blockade. Taiwan exported more drones in this year's first quarter than the 130,000 units of all last year, most bound for Ukraine. Adm. Sam Paparo envisions a drone \"hellscape\" in the Taiwan Strait. President Lai Ching-te wants defense spending at 5% of GDP by 2030 and proposed an 18% boost. The board urges Washington to pass the Blue Skies for Taiwan Act and unlock a pending $14 billion arms sale stalled ahead of Xi's visit.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20WSJ/Taiwan's%20Drone%20Realism.pdf"},{"id":"wsj-14","title":"The $5.5 Billion Perk SoftBank's Data-Center Venture Offered to Land OpenAI","source":"WSJ","date":"1 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Draft IPO documents reveal SB Energy, majority-owned by SoftBank, issued OpenAI warrants estimated at $5.5 billion to land it as a data-center tenant. SB Energy, planning to file publicly as soon as this week and raise $5 billion to $7 billion, has SoftBank and OpenAI as its only planned tenants, firms that are also investors, illustrating AI's circular financing. The company has no operating data centers, 800 megawatts under construction and contracts for nearly nine gigawatts. Its net loss widened to $3.2 billion, largely from warrant revaluation; OpenAI's warrants rose from $3.6 billion in January to $5.5 billion by June. Nvidia committed $3 billion and holds an equity stake.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20WSJ/The%205.5%20Billion%20Perk%20SoftBank's%20Data-Center%20Venture%20Offered%20to%20Land%20OpenAI.pdf"},{"id":"wsj-15","title":"The Data Center Panic and U.S. Decline","source":"WSJ","date":"1 Sep 2026","tags":["Technology & AI","Politics"],"summary":"A Wall Street Journal editorial criticizes an election-year backlash against data centers as misinformation threatening US competitiveness against China. Bernie Sanders seeks a nationwide halt; Democratic Senate candidates and governors including Josh Shapiro and Greg Abbott have restricted or paused projects, and Republicans like Tom Tiffany campaign against them. The board argues the US's 5,400-plus data centers underpin the modern economy and AI, bring high-paying jobs and property taxes, Loudoun County homeowners would otherwise pay $5,800 more yearly, and use little water. It blames rising electric bills on climate policies, not data centers, and warns that if the bipartisan campaign succeeds, the Chinese Communist Party wins.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20WSJ/The%20Data%20Center%20Panic%20and%20U.S.%20Decline.pdf"},{"id":"wsj-16","title":"The Geopolitical Mismatch Driving Russia to Threaten the West","source":"WSJ","date":"1 Sep 2026","tags":["Geopolitics","Defence"],"summary":"Yaroslav Trofimov analyzes an asymmetry driving Russia's threats against the West: Ukraine draws economic and military resilience from secure European neighbors, while Russia's militarized economy has no such backup as Ukrainian strikes disable over a third of its refining capacity. Ukraine received $105 billion in fresh European aid this year. CIA director John Ratcliffe warned Moscow against attacking NATO members. Analysts say Russia, lacking an ally to absorb retaliation, increasingly turns to hybrid warfare, sabotage, cyberattacks and drone incidents, to intimidate European voters. Officials warn of a possible one-off strike on European logistics targets aiding Ukraine. Despite economic strain, few expect Putin to seek peace; Poland's Sikorski calls the attacks \"reconnaissance by combat.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20WSJ/The%20Geopolitical%20Mismatch%20Driving%20Russia%20to%20Threaten%20the%20West.pdf"},{"id":"wsj-17","title":"The Summer That Scorched French Grapes, English Gardens—and Europe's Economy","source":"WSJ","date":"1 Sep 2026","tags":["Environment","Society"],"summary":"Europe endured a record-shattering summer of heat waves, wildfires and drought that scorched crops and strained economies. Western Europe saw its hottest June-July on record; England had its driest July since 1836, and four major rivers hit record lows. At Bordeaux's Chateau Carbonnieux, 700-year-old vineyards were irrigated for the first time, with heat expected to cut white-grape output by a third. Britain's harvest may be its smallest ever, driving food inflation. Economists estimate the heat could add 1-2 points to food inflation and shave 0.2 point off third-quarter euro-area GDP, costing France up to 15 billion euros. A July wildfire near Bordeaux burned 100,000 acres and forced 224,000 evacuations.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20WSJ/The%20Summer%20That%20Scorched%20French%20Grapes,%20English%20Gardens-and%20Europe's%20Economy.pdf"},{"id":"wsj-18","title":"Trump Says Communities That Oppose Data Centers Risk Becoming 'Backwards and Poor'","source":"WSJ","date":"1 Sep 2026","tags":["Technology & AI","Politics"],"summary":"President Trump warned on social media that communities opposing data centers will \"end up being backwards and poor,\" while those embracing them will be \"successful and rich\" with lower taxes and jobs. He claimed China welcomes the anti-data-center movement and would gain AI leadership if the US backs off. The remarks put Trump at odds with polls showing more than 70% of Americans oppose facilities near them over energy and water worries. Some advisers privately fear he appears out of touch. Vice President JD Vance said backlash concentrates where utility bills rise. Governors Greg Abbott and Josh Shapiro recently paused approvals, complicating Republicans' midterm positioning as electricity costs climb over 35% in five years.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20WSJ/Trump%20Says%20Communities%20That%20Oppose%20Data%20Centers%20Risk%20Becoming%20'Backwards%20and%20Poor'.pdf"},{"id":"wsj-19","title":"Trump's Venezuelan Oil Company Plans Massive Drilling Push","source":"WSJ","date":"1 Sep 2026","tags":["Energy","Geopolitics"],"summary":"Alejandro Betancourt's North American Blue Energy Partners, recently backed by the Trump administration, plans to deploy more than 50 drilling rigs across Venezuela over coming years to revive anemic crude output, an internal document shows. NABEP aims for six rigs by end-2026, 12 more next year, then two monthly from 2028, reaching 52. Under Trump's controversial plan, the US would take a direct stake in NABEP, which would develop 17 fields holding some 65 billion barrels, a fifth of Venezuela's reserves. Legal experts question the deal's legality and durability. NABEP pumps 200,000 barrels daily, second among private producers behind Chevron, and has acquired 23 rigs from US contractors.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20WSJ/Trump's%20Venezuelan%20Oil%20Company%20Plans%20Massive%20Drilling%20Push.pdf"},{"id":"wsj-20","title":"Westinghouse Electric Wants to Ride a Nuclear Power Revival to an IPO","source":"WSJ","date":"1 Sep 2026","tags":["Energy","Finance & Markets"],"summary":"Westinghouse Electric, bankrupted in 2017 by nuclear cost overruns, is riding US government support and AI-driven electricity demand toward an IPO, filing confidentially in July. CEO Dan Sumner says there is \"no credible path\" to the AI build-out and energy security without nuclear. Under an $80 billion federal push, the US holds an option for a 20% stake if orders arrive by 2029 and Westinghouse's valuation hits $30 billion. Owned by Brookfield and Cameco since a 2023 $8 billion purchase, the company avoids construction risk, focusing on fuel and services. Analysts see a $15 billion to $20 billion valuation. Utilities remain wary; its Vogtle AP1000 reactors cost $35 billion, far above estimates.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20WSJ/Westinghouse%20Electric%20Wants%20to%20Ride%20a%20Nuclear%20Power%20Revival%20to%20an%20IPO.pdf"},{"id":"wsj-21","title":"Yen Caught Between Top U.S. Officials' Remarks","source":"WSJ","date":"1 Sep 2026","tags":["Finance & Markets"],"summary":"The yen is under renewed pressure as expectations of Federal Reserve tightening dim prospects of narrowing US-Japan rate differentials. Record $98.7 billion of Japanese intervention over the past month, jointly with the US, has failed to reverse the decline. On Friday the yen weakened past 160 per dollar, the first breach since a historic intervention, after Fed Chairman Kevin Warsh signaled openness to rate hikes at Jackson Hole. Ten-year Japanese government bond yields rose to a 30-year high of 2.95%. Treasury Secretary Scott Bessent called the moves \"pretty well contained\" and expects BOJ Governor Kazuo Ueda to \"do the right thing.\" Analysts say Bessent may press Japan for rate hikes at the G-20.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20WSJ/Yen%20Caught%20Between%20Top%20U.S.%20Officials'%20Remarks.pdf"},{"id":"st-01","title":"'Unpredictable' China strengthening air and sea control nearby, says Taiwan","source":"ST","date":"1 Sep 2026","tags":["Geopolitics","Defence"],"summary":"Taiwan's defence ministry, in its annual review of the Chinese military threat, warned that an increasingly unpredictable Beijing is tightening its grip on the air and sea around the island, citing \"rising unpredictability\" from an \"unprecedented\" purge of senior officers. The report said China is drawing lessons from the Ukraine war, notably cheap drone swarms, and from US problems in the Iran conflict, such as rapid ammunition consumption and strained air defences. Recent Chinese exercises have all centred on \"joint blockade/control\" of Taiwan's sea lanes, though Beijing still lacks amphibious assault capability. Through combat-readiness patrols, China is strengthening control over the Taiwan Strait, aiming to destroy command-and-control and air defence in any early combat stage.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20ST/'Unpredictable'%20China%20strengthening%20air%20and%20sea%20control%20nearby,%20says%20Taiwan.pdf"},{"id":"st-02","title":"Apple CEO Tim Cook gives nod to founder Steve Jobs in final memo","source":"ST","date":"1 Sep 2026","tags":["Technology & AI"],"summary":"Apple chief executive Tim Cook bid farewell to the company on Aug 31, paying tribute to founder Steve Jobs and praising staff as \"extraordinary\" as he handed the CEO role to John Ternus. Cook spent nearly three decades at Apple and led it as CEO since 2011, taking over weeks before Jobs died. Under Cook, Apple's market value exceeded US$4.5 trillion (S$5.72 trillion) on Aug 31. Cook becomes executive chairman. Ternus, who joined in 2001 and became senior vice-president of hardware engineering, takes over on Sept 1 as only the second CEO after Jobs. He gets a week before Apple's Sept 9 iPhone event, expected to unveil its first foldable handset, amid chip supply, AI competition and Washington political challenges.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20ST/Apple%20CEO%20Tim%20Cook%20gives%20nod%20to%20founder%20Steve%20Jobs%20in%20final%20memo.pdf"},{"id":"st-03","title":"Bessent says yen moves 'pretty contained' and not disorderly","source":"ST","date":"1 Sep 2026","tags":["Finance & Markets"],"summary":"US Treasury Secretary Scott Bessent said on Aug 30 that recent yen moves were \"pretty well contained\", signalling the currency's renewed declines were not the disorderly kind that prompted a rare joint Japan-US intervention in July. The yen slid below 160-per-dollar on Aug 28, a level widely seen as raising intervention odds. Bessent said he expects BOJ governor Kazuo Ueda to \"do the right thing\" with Prime Minister Sanae Takaichi's backing, and declared the end of Abenomics, replaced by more shareholder-friendly \"Takaichi-nomics\". The BOJ meets Sept 17-18 and is expected to raise rates. Takaichi's big-spending plans pushed 10-year JGB yields to a three-decade high of 2.945 per cent in August as investors fretted over debt.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20ST/Bessent%20says%20yen%20moves%20'pretty%20contained'%20and%20not%20disorderly.pdf"},{"id":"st-04","title":"ChatGPT becomes first AI chatbot to face tougher EU rules","source":"ST","date":"1 Sep 2026","tags":["Technology & AI"],"summary":"The European Union on Aug 31 added ChatGPT to its list of digital services subject to greater legal scrutiny, a first for an AI chatbot, also designating Reddit and Roblox as \"very large\" online platforms. The label, applying to services with over 45 million monthly EU users, brings additional obligations under the Digital Services Act, including assessing systemic risks around illegal content, minors and mental well-being. The three have four months to comply. The Commission qualified ChatGPT, which reported over 159 million EU users at end-March, as a search engine. Around 30 services face DSA scrutiny. Breaches carry fines up to 6 per cent of global turnover; Temu, AliExpress and X have already been penalised.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20ST/ChatGPT%20becomes%20first%20AI%20chatbot%20to%20face%20tougher%20EU%20rules.pdf"},{"id":"st-05","title":"China 'could not be happier': Trump blasts US backlash against data centres","source":"ST","date":"1 Sep 2026","tags":["Technology & AI","Energy"],"summary":"US President Donald Trump on Aug 31 attacked opponents of AI data centres, saying they would end up \"backwards and poor\" and were helping rival China. The energy-guzzling facilities have become a surprise issue in November's midterm elections, with Trump at odds with many Republicans amid complaints over rising electricity bills and noise. A July Fox News poll found 70 per cent opposed a local data centre, including 60 per cent of Republicans. Trump claimed \"China could not be happier\" with the anti-data-centre movement, as Beijing looks to nearly double its capacity in five years. Vice-President J.D. Vance struck a more measured tone, saying backlash was tied to higher utility costs, and touted a US$7 billion Michigan campus by OpenAI, Oracle and Related Digital.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20ST/China%20'could%20not%20be%20happier'%20Trump%20blasts%20US%20backlash%20against%20data%20centres.pdf"},{"id":"st-06","title":"Chinese factory slump eases, but weak services signal uneven recovery","source":"ST","date":"1 Sep 2026","tags":["Finance & Markets","Trade"],"summary":"China's factory activity improved in August on stronger demand but stayed in contraction for a second straight month, while services and construction remained weak, underscoring deepening economic imbalances. The official manufacturing PMI rose to 49.8 from 49.2 in July, below the 50 growth threshold but beating a 49.6 forecast, with new orders and production returning to expansion. The non-manufacturing PMI held at 49, the weakest since December 2022. The data suggests China keeps relying on manufacturing and exports as domestic consumption and investment deteriorate. Fixed-asset investment fell further and property remains in a five-year slump. Growth slowed to a 4.3 per cent second-quarter low; Beijing signalled no major stimulus, saying it can still hit its annual target.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20ST/Chinese%20factory%20slump%20eases,%20but%20weak%20services%20signal%20uneven%20recovery.pdf"},{"id":"st-07","title":"France takes aim at ultra-fast fashion with new levy","source":"ST","date":"1 Sep 2026","tags":["Trade","Environment"],"summary":"France from Sept 1 will impose a per-item fee on ultra-fast fashion, eventually reaching almost €20 (S$29) per garment, targeting Asian e-commerce platforms including Shein, Temu and AliExpress. The levy follows June legislation defining ultra-fast fashion by clothing volume and repair cost relative to price. In 2026, fees range from €0.50 on underwear to €2 for T-shirts, €9 for jeans and €12 for jackets, rising to €19.50 by 2030, capped at 50 per cent of pre-tax price. Ecological transition minister Mathieu Lefevre cited harm to the environment and economy. The measure faced criticism for sparing H&M and Zara. Shein, valued at US$26.3 billion in its Hong Kong IPO, declined to comment; China warned of retaliation.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20ST/France%20takes%20aim%20at%20ultra-fast%20fashion%20with%20new%20levy.pdf"},{"id":"st-08","title":"G20 countries should consider more trade barriers on China to cut imbalances, Bessent says","source":"ST","date":"1 Sep 2026","tags":["Trade","Geopolitics"],"summary":"US Treasury Secretary Scott Bessent said he will urge G20 members to re-examine terms of trade with China to shrink global imbalances and press Beijing to rebalance toward domestic consumption. Speaking before a G20 finance meeting, he called China's export flood unsustainable, saying \"the world cannot have a China with a $1.2 trillion trade surplus.\" US tariffs cut the bilateral deficit for the first six months of 2026 by a third to $73.9 billion. Bessent dismissed a new \"Plaza Accord\" to strengthen the yuan, which the IMF sees as undervalued up to 21 per cent, as avoiding the real problem of Chinese subsidies. Ahead of a late-September Trump-Xi summit, he cited about $30 billion of non-strategic goods that could see tariffs removed on each side.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20ST/G20%20countries%20should%20consider%20more%20trade%20barriers%20on%20China%20to%20cut%20imbalances,%20Bessent%20says.pdf"},{"id":"st-09","title":"Iran seized cargo ship over Hormuz pollution","source":"ST","date":"1 Sep 2026","tags":["Geopolitics","Environment"],"summary":"Iranian authorities have seized a bulk carrier after alleging it dumped oil and sludge into the Strait of Hormuz, state media reported on Aug 31. A Hormozgan province maritime official, Esmaeil Makizadeh, said expert and clean-up teams were dispatched after images showed oil being discharged; the vessel, carrying sugar, had allegedly dumped burnt oil, bilge water and industrial sludge. He did not specify its flag or crew. The ship was referred to the judiciary. Iran has demanded compensation for several recent oil spills, including near Qeshm island, and another slick was spotted near Oman from a grounded, explosion-damaged tanker. Iran has controlled Hormuz since the Middle East war erupted in February and plans transit fees, which the US fiercely opposes.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20ST/Iran%20seized%20cargo%20ship%20over%20Hormuz%20pollution.pdf"},{"id":"st-10","title":"Italy's population to shrink by 4 million by 2050, stats agency says","source":"ST","date":"1 Sep 2026","tags":["Society"],"summary":"Italy's population will shrink by almost 4 million by 2050, undermining the sustainability of its economy and welfare system as the elderly share rises, national statistics bureau ISTAT warned on Aug 31. New projections show the resident population falling to 55 million in 2050 from 58.9 million at the start of 2025, and to 45.8 million by 2080. Births fell to about 355,000 last year, the lowest since Italy's 1861 unification, despite Prime Minister Giorgia Meloni's pledge to lift the birth rate. Deaths are projected to peak at 869,000 in 2058. The share aged 65 or over will jump to 34.5 per cent in 2050 from 24.7 per cent, while working-age share falls to 55.3 per cent. Poorer southern Italy faces the steepest losses.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20ST/Italy's%20population%20to%20shrink%20by%204%20million%20by%202050,%20stats%20agency%20says.pdf"},{"id":"st-11","title":"Japan seeks record $70.9b defence budget, with AI focus","source":"ST","date":"1 Sep 2026","tags":["Defence","Technology & AI"],"summary":"Japan's Defence Ministry requested a record 8.9 trillion yen (S$70.9 billion) budget on Aug 31, turning to artificial intelligence to speed decision-making amid a tense security environment. The final figure could reach 10 trillion yen. The request focuses on countering \"new ways of warfare\" via AI, drones and stand-off missiles, including an AI-powered decision support system, low-cost drones paired with long-range missiles, underwater-launched hypersonic missiles and a new unit against cognitive warfare. It marks another step shedding Japan's pacifist stance amid threats from China, North Korea and Russia. Prime Minister Sanae Takaichi, a China hawk, has placed defence atop her agenda; ties with Beijing soured after her November 2025 remarks on Taiwan. Overall budget request is around 143 trillion yen.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20ST/Japan%20seeks%20record%2070.9b%20defence%20budget,%20with%20AI%20focus.pdf"},{"id":"st-12","title":"Japan's main opposition party in Lower House signals break-up","source":"ST","date":"1 Sep 2026","tags":["Politics"],"summary":"Japan's largest Lower House opposition party will likely split just seven months after forming, following the collapse of full-merger talks, leader Junya Ogawa all but confirmed on Aug 31. The Centrist Reform Alliance (CRA) united Lower House lawmakers from the Constitutional Democratic Party (CDPJ) and Komeito, but talks to
