 an \"open-source model routing library\" that automatically selects models for AI agent tasks. Executive Kari Briski said both help enterprises cut AI token costs and protect proprietary data, since routers send routine tasks to cheaper, smaller models while balancing quality, latency and cost. Open models let firms self-train on their own data and guard intellectual property. The release came a day after Meta unveiled its open model Muse Glimmer. The article's radar notes Anthropic is courting investors for a potential record IPO valued at $965 billion, targeting a September or October debut.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Nvidia%20Releases%20New%20Open%20Model.pdf"}, {"id": "wsj-11", "title": "Reserve Bank of Australia Holds Rates Steady but Remains Worried About Inflation", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Finance & Markets"], "summary": "The Reserve Bank of Australia left its official cash rate unchanged at 4.35% on Tuesday, in line with expectations, after three increases earlier this year. The nine-member board voted unanimously to hold, saying it remains focused on ensuring high inflation does not become embedded and warning inflation is still too high. It does not expect inflation to return near its target midpoint until late 2027, citing upside risks. Weaker second-quarter inflation gave scope to pause, while falling housing prices weigh on spending; ANZ expects capital-city home prices to fall more than 10%. The RBA flagged Middle East war keeping oil and commodity prices elevated. BlackRock Australia anticipates one further rate increase this year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Reserve%20Bank%20of%20Australia%20Holds%20Rates%20Steady%20but%20Remains%20Worried%20About%20Inflation.pdf"}, {"id": "wsj-12", "title": "Samsung SDI Buys GM's Stake in U.S. Battery JV", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Energy", "Finance & Markets"], "summary": "Samsung SDI has acquired General Motors' 49.99% stake in SynergyCells, a $3.5 billion U.S. battery joint venture, ending the partnership amid sluggish electric-vehicle demand. The South Korean battery maker said Tuesday it will use the plant in New Carlisle, Indiana, under construction since 2024, to make batteries for energy storage systems and other high-tech applications rather than EVs. Global automakers and battery makers have scaled back U.S. plans given weak demand and the Trump administration's elimination of EV incentives. Samsung SDI said it and GM will continue a strategic partnership on next-generation prismatic batteries. The plant, originally designed for 27 gigawatt hours of EV batteries annually, could be repurposed for the fast-growing U.S. storage market.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Samsung%20SDI%20Buys%20GM's%20Stake%20in%20U.S.%20Battery%20JV.pdf"}, {"id": "wsj-13", "title": "Super Micro Computer Fourth-Quarter Profit Surges as Gross Margin Improves", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Super Micro Computer reported surging fiscal fourth-quarter profit and nearly doubled sales, crediting a better customer and product mix for improved margins. Gross margin reached 17.5%, above its 15% to 17% forecast. Profit was $1.17 billion, or $1.62 a share, versus $195.2 million a year earlier; adjusted earnings of $1.70 beat the 92-cent estimate. Net sales rose to $11.12 billion from $5.76 billion, at the lower end of guidance because of customer delays in power, cooling and networking. Shares jumped 8.6% to $34.33 after hours. CEO Charles Liang said the company booked over $60 billion in new orders and record backlog, forecasting fiscal 2027 net sales of $65 billion to $72 billion, well above analyst estimates.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Super%20Micro%20Computer%20Fourth-Quarter%20Profit%20Surges%20as%20Gross%20Margin%20Improves.pdf"}, {"id": "wsj-14", "title": "Top German General Says Russia Is Probing NATO Defenses With Hybrid Attacks", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Germany's top military officer, Gen. Carsten Breuer, said Russia is systematically using drones to probe European air defenses for weaknesses within an intensifying gray-zone campaign. \"Hybrid attacks are taking place every day in NATO countries,\" he told the Journal, warning Russia is shifting its economy and military to prepare for wider conflict with the West. The assessment underpins Germany's first military strategy since World War II, asserting broader European security leadership. Breuer noted a disarmed explosive-laden drone near a Ukrainian cargo plane and a July Russian cruise missile crash in Poland. Berlin plans 30 billion euros for space assets by 2030 and will produce Tomahawk missiles. Breuer is a candidate to chair NATO's military committee.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Top%20German%20General%20Says%20Russia%20Is%20Probing%20NATO%20Defenses%20With%20Hybrid%20Attacks.pdf"}, {"id": "wsj-15", "title": "U.S. Fires on Ship Breaking Its Blockade of Iran", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "U.S. forces fired on a Panama-flagged ship attempting to run the American blockade of Iranian ports early Tuesday, the military said, escalating enforcement as Washington squeezes Tehran economically. A Navy MH-60 helicopter fired two Hellfire missiles into the engine room of the M/V Vela Nova after its crew ignored warnings while crossing the Gulf of Oman toward an Iranian port. Central Command said the ship is no longer transiting to Iran; all 17 crew were accounted for with no immediate casualties. In June, three Indian sailors were killed enforcing the blockade. Control of the Strait of Hormuz, carrying about a fifth of global oil, remains central to stalled de-escalation talks. Trump reimposed the blockade in July.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/U.S.%20Fires%20on%20Ship%20Breaking%20Its%20Blockade%20of%20Iran.pdf"}, {"id": "wsj-16", "title": "U.S. Small Business Confidence Rose Last Month", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Finance & Markets"], "summary": "Confidence among U.S. small businesses rose in July as hiring plans improved, the National Federation of Independent Business said Tuesday. Its small-business optimism index climbed to 99.8, the highest since August 2025, beating economists' expected reading of 97. Small businesses account for nearly half of private-sector jobs and are often more sensitive to price swings, higher interest rates and uncertainty. A seasonally adjusted net 20% of owners plan to add jobs over the next three months, up 9 points from June and the highest hiring-plan level since October 2022. Both actual and planned price increases dropped notably, and reports of inflation as the top problem fell for the first time this year. Labor quality was the leading concern.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/U.S.%20Small%20Business%20Confidence%20Rose%20Last%20Month.pdf"}, {"id": "wsj-17", "title": "Who's Really Holding Up the Gaza Deal?", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "The WSJ editorial board argues Hamas, not Israel, is blocking progress on a Gaza deal, noting that in the past 10 months no Hamas terrorist has surrendered a weapon. Israel held fire for seven days after a meeting between Board of Peace director Nickolay Mladenov and Prime Minister Netanyahu, until a Hamas sniper drew return fire Tuesday. As Israel's October election nears, Netanyahu wants to look firm on security. A senior U.S. official said Washington understands his political needs provided he reins in strikes. The board voices reservations about a 15-point road map departing from the 2025 Trump plan, warning provisions on demilitarization and disarmament could let Hamas game a sector-by-sector approach.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Who's%20Really%20Holding%20Up%20the%20Gaza%20Deal.pdf"}, {"id": "wsj-18", "title": "Why Open-Weight AI Models Matter and Meta Benefits from Them", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Technology & AI"], "summary": "Meta chief Mark Zuckerberg on Monday called Meta's open-weight AI models \"open source AI\" in a 6,500-word essay, pledging more releases and citing national-security importance. The WSJ argues the label is misleading: none of the models are truly open-source. Open-source software exposes full source code for anyone to use, modify and improve collaboratively. Open-weight models differ; the training code and methods stay hidden, so users cannot see, retrain or add data, though they can adjust the numerical weights to specialize or alter behavior. Such modification can be useful or harmful if bad actors remove safeguards. Because Meta controls training and capabilities, it remains best positioned to benefit, keeping open-weight models closely tied to the company rather than a community.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Why%20Open-Weight%20AI%20Models%20Matter%20and%20Meta%20Benefits%20from%20Them.pdf"}, {"id": "wsj-19", "title": "Why the Real Oil Squeeze Is Happening in Refineries", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Energy", "Finance & Markets"], "summary": "The bigger squeeze in energy markets is downstream in refineries, where disruptions from the Iran war, Ukrainian attacks on Russian energy infrastructure and China's fuel-export restrictions have pulled millions of barrels of refined products off global markets. Refining margins have surged; the U.S. 3-2-1 crack spread topped $70 last month versus its typical teens, while average U.S. gasoline reached $4 a gallon from $3.16 a year ago. With Strait of Hormuz flows unlikely to normalize soon and Gulf refinery repairs taking months, tightness could persist. Refiners have secured enough crude via reshuffled trade flows and reserve releases, but plants running above 90-95% utilization leave little spare capacity, so a single outage could hit supply disproportionately.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Why%20the%20Real%20Oil%20Squeeze%20Is%20Happening%20in%20Refineries.pdf"}, {"id": "wsj-20", "title": "Will the Yen Need Saving Again Soon?", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Finance & Markets"], "summary": "The WSJ editorial board warns that recent joint Tokyo-Washington intervention to stabilize the yen has not held, with the currency resuming a downward march. A key error was the Bank of Japan's late-July decision to hold short-term rates steady; its policy rate is negative in inflation-adjusted terms, and the gap with higher foreign rates pressures the yen. A July BOJ summary hints at rate increases \"faster than market expectations.\" But politicians worry higher rates raise costs of servicing government debt near 230% of GDP. Prime Minister Sanae Takaichi asked Governor Kazuo Ueda to step up bond purchases after pushing a record 122.3 trillion yen budget. The board says reforms and normal policy are needed to avoid further rescues.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Will%20the%20Yen%20Need%20Saving%20Again%20Soon.pdf"}, {"id": "st-01", "title": "Australia, Vietnam boost ties in hedge against China in a world 'becoming more uncertain'", "source": "ST", "date": "12 Aug 2026", "tags": ["Geopolitics", "Southeast Asia", "Trade"], "summary": "Australia and Vietnam committed on Aug 11 to strengthen military cooperation and expand trade, deepening ties amid shared concerns over China's assertiveness. Visiting Vietnamese President To Lam and PM Anthony Albanese announced a new deal to safeguard supply chains for critical minerals, clean energy and superconductors. Two-way trade has soared from A$14.6 billion in 2020 to over A$30 billion in 2025, fuelled by Australian iron ore, coal and education, and Vietnamese manufactures. Analysts said both nations are hedging against China's military clout and US-China economic coercion, though Australia's US alliance and Vietnam's non-aligned stance cap the partnership. VietJet will fly Ho Chi Minh City to western Sydney from January 2027; RMIT will build a Hanoi campus.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Australia,%20Vietnam%20boost%20ties%20in%20hedge%20against%20China%20in%20a%20world%20'becoming%20more%20uncertain'.pdf"}, {"id": "st-02", "title": "China hits US pecans with 54% levies before Xi-Trump summit", "source": "ST", "date": "12 Aug 2026", "tags": ["Trade", "Geopolitics"], "summary": "China ordered steep anti-dumping deposits on pecan imports from the US and Mexico, adding trade friction weeks before an expected September summit between Donald Trump and Xi Jinping. From Aug 11, US pecan importers must pay a 54.3 per cent deposit, while Mexican rates range from 17.8 to 51.6 per cent. The Commerce Ministry cited provisional findings that pecans were sold at unfairly low prices. The impact is limited: US pecan shipments to China fell to US$6.9 million in the first four months of 2026 from US$77.2 million two years earlier, as China shifted to South African supply. The probe began September 2025; American pecans already faced 10 per cent tariffs from March 2025.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/China%20hits%20US%20pecans%20with%2054%20levies%20before%20Xi-Trump%20summit.pdf"}, {"id": "st-03", "title": "China missile test deepens Pacific divide over growing militarisation", "source": "ST", "date": "12 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "China's July test of a nuclear-capable missile into the Pacific, its first known ballistic launch there since September 2024, exposed limits to Pacific leaders' \"Ocean of Peace\" ambitions. Fired hours after Fiji and Australia signed a landmark defence treaty, the test drew individual alarm but no collective condemnation from Pacific Islands foreign ministers meeting in Suva. Papua New Guinea called it \"totally inappropriate\"; China said it was conducted safely. Kiribati and Nauru, which switched recognition from Taiwan, opposed a joint statement, and New Zealand's Winston Peters blamed foreign influence for the impasse. The launch capped a year of intensified US-China military activity across the contested region. Leaders meet in Palau in three weeks.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/China%20missile%20test%20deepens%20Pacific%20divide%20over%20growing%20militarisation.pdf"}, {"id": "st-04", "title": "Europe's hot summer stunts Austrian crops, prompts rush to slaughterhouse", "source": "ST", "date": "12 Aug 2026", "tags": ["Environment", "Society"], "summary": "Europe's scorching summer is hurting agriculture even in water-rich Austria, where heat has stunted crops and forced cattle down from parched Alpine pastures for early slaughter. Dairy farmer Johann Fessl said weeks without rain left shortages of water and grass, raising feed costs and lengthening slaughterhouse waiting lists, with some talking of emergency slaughters. AgrarMarkt Austria expects the grain harvest to be 19 per cent smaller this year. Corn yields collapsed, and greenhouse tomato growers near Linz reported widespread blossom-end rot rendering fruit unsellable. The persistent heat and lack of precipitation reflect a wider European climate stress on food production. One silver lining: growers said carrots are thriving exceptionally because of the heat.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Europe's%20hot%20summer%20stunts%20Austrian%20crops,%20prompts%20rush%20to%20slaughterhouse.pdf"}, {"id": "st-05", "title": "How China became the world's great oil power", "source": "ST", "date": "12 Aug 2026", "tags": ["Energy", "Geopolitics", "Finance & Markets"], "summary": "The Iran war caused petroleum history's largest supply shock, yet oil never hit the US$150 many predicted, partly thanks to Beijing. Between February and June, China halved crude imports by 5.5 million barrels a day, enough to shave US$30 or more off Brent, experts reckon. It used three levers: drawing down brimming stockpiles, curbing refined-product exports, and suppressing domestic demand as fuel prices rose and commuters switched to metros and EVs. Refinery runs fell sharply; petrochemical makers substituted coal and ethane for Gulf feedstocks. GDP still grew 4.3 per cent in Q2. Analysts dub China \"the new OPEC,\" though its finite stocks mean it cannot ration imports indefinitely like the cartel can cut output.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/How%20China%20became%20the%20world's%20great%20oil%20power.pdf"}, {"id": "st-06", "title": "Intel raises US$20 billion from expanded stock sale", "source": "ST", "date": "12 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Intel raised US$20 billion from an upsized share offering on Aug 11, funding the costly build-out of its chip contract-manufacturing business by cashing in on a stock surge. Priced at US$95 a share, a 2.6 per cent discount, the sale beat its initial US$15 billion target. Intel shares have nearly trebled in 2026, outperforming AMD, Nvidia and the Philadelphia Semiconductor Index. AI-agent demand for CPUs pushed Intel to lift 2026 capex guidance to US$20 billion, and it committed to high-volume 14A production in 2028, with Tesla an early customer. Trump said Apple would make processors with Intel, though unconfirmed. JPMorgan, Goldman Sachs, Morgan Stanley and Citigroup are joint book-runners. An analyst said the raise makes \"perfect sense.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Intel%20raises%20US20%20billion%20from%20expanded%20stock%20sale.pdf"}, {"id": "st-07", "title": "Low levels of river Rhine begin to disrupt German industry", "source": "ST", "date": "12 Aug 2026", "tags": ["Environment", "Trade", "Energy"], "summary": "German companies reported growing disruption as record-low Rhine water levels curb one of Europe's main freight arteries after weeks of drought. Chemicals maker Covestro declared force majeure on polyether polyols used in mattresses and insulation, unable to fully offset lost barge capacity with trucks and trains. Evonik's Marl park saw hampered production; utilities Uniper and EnBW reported lower hydroelectric output; steelmaker Salzgitter shifted coal to rail from Rotterdam. Industry body VCI warned \"alarm bells are ringing loudly.\" Up to 150 trucks are needed to replace one barge. Agricultural trader RWZ, which normally ships 50,000 tonnes in July-August, moved under 10 per cent this year, warning conditions become \"catastrophic\" if levels do not recover by October.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Low%20levels%20of%20river%20Rhine%20begin%20to%20disrupt%20German%20industry.pdf"}, {"id": "st-08", "title": "Malaysia renews 10-year energy plan, targeting savings of around $27.5 billion", "source": "ST", "date": "12 Aug 2026", "tags": ["Energy", "Southeast Asia", "Environment"], "summary": "Malaysia on Aug 11 renewed its National Energy Efficiency Action Plan through 2035, targeting savings of about US$21.5 billion (S$27.5 billion) and an 11.6 per cent cut in energy demand. The plan projects cumulative savings of 815,382 terajoules versus business-as-usual, equal to a 26.1 million-tonne reduction in CO2-equivalent emissions. The first NEEAP (2016-2025) delivered 60,886 gigawatt-hours in electricity savings, worth roughly RM16.1 billion, exceeding target. Power demand is set to rise sharply as Malaysia becomes South-east Asia's fastest-growing data-centre hub, drawing investment from Amazon and Microsoft. A 2023 law requires the biggest energy consumers to adopt power-saving measures, supporting pledges to cut emissions 45 per cent by 2030 and reach net-zero by 2050.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Malaysia%20renews%2010-year%20energy%20plan,%20targeting%20savings%20of%20around%2027.5%20billion.pdf"}, {"id": "st-09", "title": "Mecca defence accord underscores West Asia's shifting geopolitical sands", "source": "ST", "date": "12 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Ravi Velloor analyses the Mecca Joint Defence Agreement, signed Aug 7 by Saudi Arabia, Turkey and Pakistan, which stipulates that an attack on one is an attack on all, echoing NATO's Article 5. The three Sunni powers combine Saudi wealth, Turkey's military-industrial base and Pakistan's nuclear arsenal; Egypt participated but skipped the final day, and Qatar helped broker alignment. Velloor argues it likely carries tacit US endorsement, marks a breakout for Pakistani diplomacy, and reflects Saudi fears of encirclement and hedging against American retrenchment. Israel and the UAE are made uneasy, with Turkey eyeing Egypt's inclusion. The accord looks formidable but riddled with ambiguity over whether members would fight for one another in a real conflict.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Mecca%20defence%20accord%20underscores%20West%20Asia's%20shifting%20geopolitical%20sands.pdf"}, {"id": "st-10", "title": "North Korea fired a ballistic missile, South Korean military says", "source": "ST", "date": "12 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "North Korea fired a ballistic missile on Aug 12 toward the sea off the Korean Peninsula's east coast, South Korean and Japanese authorities said, days before major US-South Korea joint drills. The missile flew about 700 km, reaching a maximum altitude near 90 km, and landed outside Japan's exclusive economic zone. Seoul's Office of National Security convened an emergency meeting, urging Pyongyang to halt launches violating UN resolutions; Japan lodged a strong protest via Beijing. The launch followed an Aug 6 firing and precedes Aug 17-27 exercises Pyongyang routinely denounces. On Aug 11 North Korea condemned Japan's defence white paper. Zelensky said Russia used a North Korean missile in an Aug 11 strike killing seven Ukrainian steel workers.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/North%20Korea%20fired%20a%20ballistic%20missile,%20South%20Korean%20military%20says.pdf"}, {"id": "st-11", "title": "Norway wealth fund manager says fund collapse not impossible", "source": "ST", "date": "12 Aug 2026", "tags": ["Finance & Markets"], "summary": "The manager of Norway's US$2 trillion sovereign wealth fund, the world's largest, warned on Aug 11 that its collapse is possible and not wholly improbable given global tensions. Nicolai Tangen, CEO of Norges Bank Investment Management, said the fund's extraordinary growth, partly luck, cannot be expected to continue, noting \"fortunes always end up disappearing,\" citing Spain and Britain. Fuelled by oil and gas revenues, the fund has grown from under 2 billion kroner in 1996 to over 22 trillion kroner today, invested in global equities, bonds and property. Among risks, Tangen cited nuclear war, biological terrorism, and a burst \"AI bubble\" combined with US-China trade war, which he said could wipe out at least 80 per cent of stock investments.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Norway%20wealth%20fund%20manager%20says%20fund%20collapse%20not%20impossible.pdf"}, {"id": "st-12", "title": "OCBC opens up platinum, palladium trading on its app to retail investors", "source": "ST", "date": "12 Aug 2026", "tags": ["Finance & Markets", "Society"], "summary": "OCBC expanded precious-metals trading on its mobile app, letting retail investors trade platinum and palladium bullion from Aug 11 with a minimum of 0.01 ounce, about $23 and $18 respectively. The move builds on digital gold and silver features launched in 2021 and democratises assets once reserved for affluent clients. OCBC Group Research is bullish, forecasting platinum above US$2,000 and palladium above US$1,500 by the first half of 2027; prices stood at US$1,833 and US$1,389 at end-June 2026. The metals are industrial-driven, tied to autos, hydrogen and emissions systems, giving diverging price paths from gold. Wealth head Tan Siew Lee flagged their high-beta risk. App gold and silver customers rose 2.5 times year on year in 2025.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/OCBC%20opens%20up%20platinum,%20palladium%20trading%20on%20its%20app%20to%20retail%20investors.pdf"}, {"id": "st-13", "title": "Pakistan says US, Iran close to deal despite Trump rhetoric", "source": "ST", "date": "12 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "Pakistan's defence minister Khawaja Asif said the US and Iran are \"close to some sort of arrangement\" over the Strait of Hormuz, saying things are \"shaping up in favour of peace,\" even as both sides hardened positions. Al Jazeera reported Iran-Oman talks on reopening the waterway had advanced. Oil erased gains on the comments. The optimism followed Trump's tougher stance on Aug 10 demanding Iran pay reparations for those killed, responding to Iranian demands for compensation over a lapsed June interim deal. Brent traded near US$87.50 a barrel; European diesel futures surged over 10 per cent amid refinery attacks in Libya and Russia. Supertanker rates on the Mideast-to-China route neared US$500,000 a day, more than double pre-war levels.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Pakistan%20says%20US,%20Iran%20close%20to%20deal%20despite%20Trump%20rhetoric.pdf"}, {"id": "st-14", "title": "Romania destroys drones drifting near major offshore gas project in the Black Sea", "source": "ST", "date": "12 Aug 2026", "tags": ["Defence", "Energy"], "summary": "Romanian army divers destroyed two Gerbera-type drones drifting in the country's Black Sea exclusive economic zone near the Neptun Deep offshore gas project, Defence Minister Radu Miruta said on Aug 11. A civilian vessel spotted the drones; Ukraine confirmed they were not its own. Authorities opted for controlled destruction by detonation to protect the shipping lane and platform works. The NATO state, sharing a 614-km border with Ukraine, has faced repeated Russian drone incursions, downing three with F-16s in July. NATO members Romania, Bulgaria and Turkey have neutralised over 150 Black Sea mines and agreed to expand a joint mine-clearing task force to protect critical infrastructure. Neptun Deep, owned by OMV Petrom and Romgaz, is due onstream in 2027, making Romania the EU's largest gas producer.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Romania%20destroys%20drones%20drifting%20near%20major%20offshore%20gas%20project%20in%20the%20Black%20Sea.pdf"}, {"id": "st-15", "title": "S'pore banks Q2 earnings: DBS, OCBC shares could go higher; asset quality concerns resurface at UOB", "source": "ST", "date": "12 Aug 2026", "tags": ["Finance & Markets"], "summary": "DBS and OCBC shares hit fresh highs and could climb further after strong second-quarter results, while asset-quality concerns weighed on UOB, analysts said. Wealth and fee income offset margin pressure. DBS peaked at $77.97 and OCBC at $31.56 on Aug 11; both raised full-year targets, with RHB lifting DBS's target to $81.20 and OCBC's to $32.85. UOB fell 2.63 per cent to $42.16 after flagging a large non-performing asset tied to a Greater China property account; new NPAs hit $902 million, up 90 per cent year on year. Citi downgraded UOB to \"sell,\" though RHB upgraded it to \"buy.\" Saxo's Charu Chanana said Singapore banks are becoming regional wealth platforms rather than pure interest-rate proxies. UOB is selling its asset-management arm to Allianz for $555 million.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/S'pore%20banks%20Q2%20earnings%20DBS,%20OCBC%20shares%20could%20go%20higher%20asset%20quality%20concerns%20resurface%20at%20UOB.pdf"}, {"id": "st-16", "title": "S'pore firms ink new deals in Liaoning as China's rust belt seeks economic turnaround", "source": "ST", "date": "12 Aug 2026", "tags": ["Southeast Asia", "Trade", "Technology & AI"], "summary": "Six new deals spanning healthcare, research and technology were signed by Singapore entities in China's Liaoning province during an Aug 11 trade meeting, as the north-eastern rust belt seeks to revive its slowing, greying economy. Minister Masagos Zulkifli co-chaired the 11th Singapore-Liaoning Economic and Trade Council with Governor Wang Xinwei; the council, formed 2003, last met in 2019. Bilateral trade hit 11.84 billion yuan in 2025, up 28.6 per cent, and grew 45.5 per cent year on year in the first half of 2026. Deals included Aoxin Q&M's 35 million yuan Shenyang dental hospital, data-centre and carbon-fibre projects. ComfortDelGro eyes a phased robotaxi rollout, PSA is optimising Dalian port operations, and Singapore is positioned as a \"trusted gateway\" for Liaoning firms going global.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/S'pore%20firms%20ink%20new%20deals%20in%20Liaoning%20as%20China's%20rust%20belt%20seeks%20economic%20turnaround.pdf"}, {"id": "st-17", "title": "Singapore Exchange eyes single-stock ETFs, tie-ups for growth", "source": "ST", "date": "12 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Singapore Exchange is exploring a broader suite of ETFs, including possible single-stock and leveraged products, and deeper cross-market partnerships to cement its position as South-east Asia's key multi-asset exchange, CEO Loh Boon Chye said. SGX offers 53 ETFs with over $21 billion in assets, launched its first physical gold ETF in March, and will list an active iEdge Singapore Next 50 ETF in September. Singapore equities have hit record highs in 2026 as banks draw investors seeking shelter from geopolitical tensions and AI-trade volatility; SGX shares are up nearly 50 per cent this year. Net income for the year to June rose 7.8 per cent to $698 million. SGX has tied up with Nasdaq and the Thai bourse, and has over 50 IPOs in its pipeline.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Singapore%20Exchange%20eyes%20single-stock%20ETFs,%20tie-ups%20for%20growth.pdf"}, {"id": "st-18", "title": "Strait of Hormuz to stay closed unless US meets Iran's conditions, Iran official says", "source": "ST", "date": "12 Aug 2026", "tags": ["Geopolitics", "Energy", "Defence"], "summary": "The Strait of Hormuz will stay closed until the US changes behaviour and accepts Iran's conditions to end the war, Iran's newly appointed Supreme National Security Council secretary Mohsen Rezaei said on Aug 11, the strongest signal yet that any Iran-Oman transit deal would not immediately reopen it. Tehran demands the US lift its naval blockade, release frozen assets, pay war damages and end regional attacks. Oil futures extended gains. Trump countered by demanding Iran pay compensation over 50 years and calling Tehran \"devious negotiators,\" while Pakistan's Khawaja Asif said the sides were nearing an arrangement. New shipping attacks killed four crew on a cargo vessel in Bab el-Mandeb, and a container ship was hit off Pakistan in a suspected US strike enforcing the blockade.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Strait%20of%20Hormuz%20to%20stay%20closed%20unless%20US%20meets%20Iran's%20conditions,%20Iran%20official%20says.pdf"}, {"id": "st-19", "title": "Talk of private and resale HDB markets decoupling could spark buyer frenzy", "source": "ST", "date": "12 Aug 2026", "tags": ["Society", "Finance & Markets"], "summary": "NUS professor Sing Tien Foo argues that the recent divergence between resale HDB and private housing price indexes does not signal structural decoupling, despite fears it could spark fear-driven buying. HDB resale prices fell 0.3 per cent, a third straight quarterly decline, while URA's private index rose 0.5 per cent. Nearly a third of surveyed veterans believe the markets are decoupling, but two decades of data show cointegration, with segments linked through overlapping buyer pools and household upgrading and downgrading. Private growth was led by landed and Core Central Region homes. Sing warns fear-based buying pushes households beyond their means; average holding periods have fallen sharply without higher returns. He urges decisions based on affordability, not fear of missing out, citing China's property correction.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Talk%20of%20private%20and%20resale%20HDB%20markets%20decoupling%20could%20spark%20buyer%20frenzy.pdf"}, {"id": "st-20", "title": "Tech stock sell-off tests AI hype, but is not end of infrastructure story", "source": "ST", "date": "12 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "July's tech retreat, the Nasdaq's worst July in 20 years with a 3.2 per cent drop, signalled investors are no longer betting tech will keep rallying, as institutions unwound exposure over the mismatch between earnings and capital spending. Analysts say the AI infrastructure build-up continues, with TrendForce estimating top-nine cloud providers' 2026 spending will surge 90 per cent to US$886.7 billion and hit US$1.3 trillion in 2027. Morgan Stanley's Mike Wilson said markets no longer reward AI \"on faith alone.\" AI-related debt has swelled, with hidden liabilities near US$1.65 trillion. SpaceX shares fell despite beating estimates on heavy AI capex, while Amazon and Microsoft rallied. Singapore, heavily exposed via Micron and others, has a large stake in the cycle's durability.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Tech%20stock%20sell-off%20tests%20AI%20hype,%20but%20is%20not%20end%20of%20infrastructure%20story.pdf"}, {"id": "st-21", "title": "Thailand preparing to use military ties as leverage in US talks", "source": "ST", "date": "12 Aug 2026", "tags": ["Trade", "Defence", "Southeast Asia"], "summary": "Thailand plans to warn the Trump administration that steep US tariffs could force it to scale back military cooperation, including the Cobra Gold exercises, an official said. The position would feature in a counter-proposal as reciprocal-trade talks resume later in August. Thailand, which ran a US$51.4 billion trade surplus with the US in 2025, faces a 12.5 per cent Section 301 tariff and is seeking to cap the rate at 19 per cent, offering to eliminate tariffs on US beef, lamb and alcohol. Thailand is one of two US treaty allies in South-east Asia alongside the Philippines. A defence spokesman said he could not confirm the plan, suggesting talks would enhance cooperation. Cobra Gold's 2025 edition drew 8,000 personnel from 30 countries.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Thailand%20preparing%20to%20use%20military%20ties%20as%20leverage%20in%20US%20talks.pdf"}, {"id": "st-22", "title": "The US ammo crunch is a global disaster", "source": "ST", "date": "12 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Bloomberg columnist Andreas Kluth argues the US has depleted \"virtually all\" its global stockpile of high-precision offensive missiles, including ATACMS, PrSM and Tomahawks, during the unwinnable Iran war Trump launched. The Center for Strategic and International Studies estimates two-thirds of Patriots and nearly half of THAAD interceptors are used up. Joint Chiefs chairman Dan Caine warned of the risk before the February attack but was ignored; replenishment will take years. The scarcity constrains Trump's escalation options against Iran and weakens US deterrence globally, from Taiwan and Korea to NATO and Ukraine, which had hoped to buy more American arms. Kluth writes that Washington, once a \"hyperpower,\" now looks diminished, \"almost out of breath and out of ammo,\" calling it a self-inflicted global disaster.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/The%20US%20ammo%20crunch%20is%20a%20global%20disaster.pdf"}, {"id": "st-23", "title": "Zelensky: Ukraine has given US negotiators proposals for ending the war with Russia", "source": "ST", "date": "12 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "President Volodymyr Zelensky said on Aug 11 that Ukraine handed US negotiators proposals for a plan to end the war with Russia, and warned Moscow would use its September parliamentary election as a pretext for new mobilisation. Speaking in his nightly address, he offered no details but urged the US to strengthen Ukrainian air defence and pressure Russia toward ending rather than prolonging the war. US negotiators Steve Witkoff and Jared Kushner last visited Moscow in January and have not been to Kyiv. Russia insists any settlement require Ukraine cede four claimed regions. Zelensky said intelligence showed Russia plans to mobilise several hundred thousand more troops after its \"pseudo-election.\" Russia's Supreme Court barred the anti-war Yabloko party from the vote.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Zelensky%20Ukraine%20has%20given%20US%20negotiators%20proposals%20for%20ending%20the%20war%20with%20Russia.pdf"}, {"id": "bt-01", "title": "AI boom prompts economists to lift 2026 growth forecasts beyond MTI's upgraded 4.5-5.5% range", "source": "BT", "date": "12 Aug 2026", "tags": ["Southeast Asia", "Technology & AI", "Finance & Markets"], "summary": "Private-sector economists raised full-year Singapore growth forecasts after MTI lifted its official range to 4.5-5.5%, from 2-4%, following a 6.1% H1 expansion. Q2 GDP grew a revised 5.9% year on year, with manufacturing output surging 12.5% on AI-related semiconductor demand. DBS moved to 5%, Maybank to 5.2%, UOB to 5%, while Nomura was most bullish at 5.7%, above MTI's range; RHB held at 4.5%. Economists cited two offsetting forces: a stronger-than-expected AI investment boom and milder-than-feared Middle East impact, though some warned of concentrated, non-broad-based growth and a possible AI-investment correction. Regional peers Taiwan, South Korea and much of South-east Asia also upgraded forecasts on the same export tailwind.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/AI%20boom%20prompts%20economists%20to%20lift%202026%20growth%20forecasts%20beyond%20MTI's%20upgraded%204.5-5.5%20range.pdf"}, {"id": "bt-02", "title": "Australia's July business conditions improve, sentiment fragile", "source": "BT", "date": "12 Aug 2026", "tags": ["Finance & Markets"], "summary": "Australian business conditions improved marginally in July while confidence stayed fragile, a National Australia Bank survey showed, with firms citing cost pressures as renewed Gulf tensions pushed oil prices higher. NAB's business conditions index rose one point to +4, below its +7 long-run trend, while confidence held at -6, well below February levels before the US-Israeli war on Iran began. NAB said elevated uncertainty continued to weigh on confidence, warning of \"continued pressure on margins.\" Transport and utilities drove rises in final prices and purchase costs. Employment and profitability picked up, sales were steady, and capacity utilisation jumped to 83%. The Reserve Bank of Australia was widely expected to hold rates at 4.35% after three hikes this year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Australia's%20July%20business%20conditions%20improve,%20sentiment%20fragile.pdf"}, {"id": "bt-03", "title": "Bank of Korea deputy governor signals more rate hikes on inflation risk", "source": "BT", "date": "12 Aug 2026", "tags": ["Finance & Markets"], "summary": "The Bank of Korea will likely need to raise rates further as strong growth feeds underlying inflation, outgoing senior deputy governor Ryoo Sangdai said, though a stabilising won and softer Kospi give policymakers some flexibility. He said weight will fall on whether core inflation stays elevated, growth momentum holds, and financial stability. His comments reinforce a tightening bias ahead of the Aug 27 meeting. The BOK raised its benchmark to 2.75% in July, its first hike since 2023. Headline inflation cooled to 2.8% in July but stayed above target; core edged up to 2.6%. Ryoo said inflation could persist above the 2% target as the semiconductor boom lifts wages, adding: \"The scale of the increase may not be large, but it could be persistent.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Bank%20of%20Korea%20deputy%20governor%20signals%20more%20rate%20hikes%20on%20inflation%20risk.pdf"}, {"id": "bt-04", "title": "Banking veteran Hsieh Fu Hua appointed deputy chairman and director of CapitaLand Investment", "source": "BT", "date": "12 Aug 2026", "tags": ["Finance & Markets"], "summary": "Banking veteran Hsieh Fu Hua, 75, has been appointed deputy chairman and non-executive independent director of CapitaLand Investment (CLI), effective Aug 12. He will also sit on the group's executive, sustainability, executive resource and compensation, and nominating committees. CLI said his appointment, as it \"accelerates its growth ambitions\" as a global real asset manager, broadens board experience across financial markets, investment management and governance. Chairman Miguel Ko cited his strategic insight and boardroom experience. Hsieh is co-founder and adviser to PrimePartners Group and chairman of GXS Bank, a GIC board director, and chairman of the National University of Singapore and WWF Singapore. He previously led Singapore Exchange, served as Temasek president, and chaired UOB, Tiger Airways and Eastspring. CLI's board will comprise 12 directors, nine independent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Banking%20veteran%20Hsieh%20Fu%20Hua%20appointed%20deputy%20chairman%20and%20director%20of%20CapitaLand%20Investment.pdf"}, {"id": "bt-05", "title": "Beijing's offshore trust tax changes could affect wealth hubs including Singapore", "source": "BT", "date": "12 Aug 2026", "tags": ["Finance & Markets", "Society"], "summary": "China's new Jul 24 rules to tax offshore trusts could have widespread implications for wealth hubs such as Singapore, experts say. Offshore trusts have long served wealthy Chinese families for cross-border asset protection and succession. Within two weeks, Caixin reported tax bureaus levying income tax on insurance-policy returns. The rules sit alongside existing CRS reporting and Controlled Foreign Corporation rules, with authorities cross-checking self-reported figures against automatic account data. Lawyers said residence, not location, now triggers tax, so clients spending significant time in China may be caught even with compliant Singapore structures. Most advisers expect clients to review rather than unwind trusts. Banks including DBS, Bank of Singapore and UOB reported no significant outflows and remain bullish on Singapore's wealth-hub position.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Beijing's%20offshore%20trust%20tax%20changes%20could%20affect%20wealth%20hubs%20including%20Singapore.pdf"}, {"id": "bt-06", "title": "China's car sales extend slide as shift accelerates to overseas markets", "source": "BT", "date": "12 Aug 2026", "tags": ["Trade", "Finance & Markets"], "summary": "China's car sales fell for a 10th straight month in July, though the pace eased, contrasting with surging exports as automakers expand abroad to escape cut-throat home competition. Domestic sales slid 21.1% year on year to 1.47 million vehicles, while exports rose 88.2% to 923,000, China Passenger Car Association data showed. EV and plug-in hybrid exports jumped 147.8%. Over January-July, domestic passenger sales fell 20.5%, about 2.65 million fewer vehicles. CPCA's Cui Dongshu blamed elevated fuel prices and weak entry-level demand. Automakers are pushing into Europe, South-east Asia, Latin America and the Middle East, and tapping idle foreign factories; Geely will build EV SUVs at a Ford plant in Spain. BYD's overseas shipments lifted global sales; margin pressure may persist in H2.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/China's%20car%20sales%20extend%20slide%20as%20shift%20accelerates%20to%20overseas%20markets.pdf"}, {"id": "bt-07", "title": "Has the Iran war damaged US economic credibility?", "source": "BT", "date": "12 Aug 2026", "tags": ["Geopolitics", "Finance & Markets"], "summary": "Evidence from 2026 suggests US economic credibility is strained rather than broken after the Iran war, which began on Feb 28. Growth had already slowed, expanding just 1.4% annualised in Q4 2025, and analysts estimate the conflict could shave 0.3 percentage point off 2026 GDP, cutting growth to 1.8%. Petrol prices have risen over US$1 a gallon, and spending has held up mainly because wealthier households keep consuming. Economists warned the deeper risk lies in tariff policy, assertive foreign policy and fiscal pressures rather than the war itself. Counter-intuitively, the war reinforced the US dollar's safe-haven role as gold, the franc, yen and bonds stumbled; foreign Treasury demand held up. Structural advantages persist, though fiscal strain and Fed pressure will outlast the ceasefire.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Has%20the%20Iran%20war%20damaged%20US%20economic%20credibility.pdf"}, {"id": "bt-08", "title": "Hong Kong's low-tax lure is getting a reality check", "source": "BT", "date": "12 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "Hong Kong's competitiveness as a financial centre faces two opposing forces reshaping its US$5.4 trillion asset-management industry, now the world's largest cross-border wealth hub. The city is expected to approve landmark tax reform wiping effective taxes on qualified carried interest and performance fees to zero, applied retroactively from April 2025 and covering commodities and crypto. That is accelerating hedge-fund expansion, lifting office rents and luxury retail. But Beijing's cross-border tax crackdown, enforcing a 20% overseas capital-gains levy via CRS and taxing offshore trusts, threatens private wealth managers as mainland clients may face bills or pull money. Investment banking and prime brokerage could benefit while private wealth suffers. Mainland flows still make up 59% of cross-border wealth, making the tax reform crucial.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Hong%20Kong's%20low-tax%20lure%20is%20getting%20a%20reality%20check.pdf"}, {"id": "bt-09", "title": "Keppel unit's telco subsea cable network receives facilities-based operator licence from IMDA", "source": "BT", "date": "12 Aug 2026", "tags": ["Technology & AI", "Southeast Asia"], "summary": "Keppel Kruger Holdings, a wholly owned subsidiary of Keppel's connectivity division, has been granted a facilities-based operator licence by Singapore's Infocomm Media Development Authority, allowing it to own, operate and maintain telecommunications infrastructure and provide services tied to the Kruger Cable System. The international subsea fibre-optic network, developed by Keppel, is expected to connect Singapore, Malaysia, Bangladesh, India and Oman (Salalah), with branches across South Asia. It will land at Tuas on Singapore's western side, sharing the beach manhole used by Keppel's Bifrost Cable System. Connectivity CEO Manjot Singh Mann said the system furthers Keppel's subsea strategy as AI drives \"unprecedented demand\" for resilient international connectivity. Keppel plans to mobilise third-party capital through its private infrastructure fund, with an investment decision expected by end-2026.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Keppel%20unit's%20telco%20subsea%20cable%20network%20receives%20facilities-based%20operator%20licence%20from%20IMDA.pdf"}, {"id": "bt-10", "title": "Kioxia says investment vehicle for SK Hynix is top shareholder", "source": "BT", "date": "12 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Kioxia's biggest shareholder is now an investment vehicle holding shares claimed by rival SK Hynix. The flash-memory maker's former parent Toshiba trimmed its stake to about 14.12%, from 14.48%, as at Aug 3, Kioxia said. That makes BCPE Pangea Cayman2, set up by Bain Capital, the top shareholder with 14.19%. South Korea's SK Hynix holds bonds convertible into \"substantially all\" of BCPE Pangea Cayman2's voting rights, according to Kioxia's annual report, which explicitly lists SK Hynix's claim as a risk factor representing a possible conflict of interest. SK Hynix joined the Bain Capital-led consortium that acquired Kioxia in 2018 and pledged to keep its stake at or below 15% of voting rights until 2028, unless Kioxia agrees to a larger holding.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Kioxia%20says%20investment%20vehicle%20for%20SK%20Hynix%20is%20top%20shareholder.pdf"}, {"id": "bt-11", "title": "Malaysia's June industrial production up 6.5%, below forecast", "source": "BT", "date": "12 Aug 2026", "tags": ["Southeast Asia", "Trade"], "summary": "Malaysia's industrial production index rose 6.5% year on year in June, below expectations, government data showed. Economists in a Reuters poll of 11 respondents had forecast a 7% expansion in factory output. May's reading was revised slightly upwards to 8.5%, from an originally reported 8.4%.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Malaysia's%20June%20industrial%20production%20up%206.5,%20below%20forecast.pdf"}, {"id": "bt-12", "title": "Malaysia's SD Guthrie sees El Niño impacting 2027-28 palm oil output", "source": "BT", "date": "12 Aug 2026", "tags": ["Environment", "Southeast Asia", "Energy"], "summary": "Malaysia's SD Guthrie, one of the world's largest palm oil producers, expects production to be hit in 2027 and 2028 as El Niño brings drier, hotter weather, though 2026 output should stay largely unaffected given a 12-to-16-month lag, CEO Mohd Haris Mohd Arshad said. The company posted April-June net profit of RM987 million, nearly double a year earlier, though revenue fell to RM4.94 billion from RM5.17 billion. Performance was underpinned by industrial development and downstream gains offsetting a weaker upstream business, cushioned by higher crude palm oil and palm kernel prices. Tightening supplies and resilient demand, boosted by Indonesia's B50 biodiesel mandate and firm crude prices, should keep CPO elevated. Benchmark CPO has climbed 18% to RM4,723 a ton this year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Malaysia's%20SD%20Guthrie%20sees%20El%20Nino%20impacting%202027-28%20palm%20oil%20output.pdf"}, {"id": "bt-13", "title": "Non-stop flights to emerging markets would boost Singapore economy: MTI report", "source": "BT", "date": "12 Aug 2026", "tags": ["Southeast Asia", "Trade"], "summary": "Stronger air links to developing markets could add a healthy tailwind to Singapore's economy, according to simulations in a Ministry of Trade and Industry report. Introducing non-stop flights to regions such as Latin America, Africa and Central Asia would boost investment and trade access, and improve Singapore's hub status via more passenger and cargo transfers. Changi Airport aims to connect to 200 cities by the mid-2030s, up from 170. Economists estimated that axing a stopover to a similar-sized economy within 7,500 km could yield S$200 million more in annual foreign direct investment, S$520 million in investment abroad, and S$225 million in economic value added, with wider gains in productivity, employment and wages. New links to North America and Europe would also yield significant gains, subject to aircraft availability and commercial viability.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Non-stop%20flights%20to%20emerging%20markets%20would%20boost%20Singapore%20economy%20MTI%20report.pdf"}, {"id": "bt-14", "title": "Oil prices continue climb on US-Iran deal doubts; stocks retreat", "source": "BT", "date": "12 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "Oil prices rose on Wednesday morning as doubts over a US-Iran peace deal and fresh ship attacks fuelled Middle East supply concerns, even as industry data showed US crude inventories expanding. Brent gained 0.81% to US$89.63 a barrel while WTI climbed 0.85% to US$83.91, both after settling more than US$1 higher on Tuesday at their highest since Jul 31. The US and Yemen's Houthis reported separate attacks in the Strait of Hormuz and Bab el-Mandeb. Iranian security official Mohsen Rezaei said Hormuz would stay closed unless the US met Iran's conditions. Hormuz traffic dropped to six vessels on Monday versus a pre-war average of 125 to 140. API data reportedly showed crude stocks rose 9.1 million barrels. The EIA expects 600,000 bpd of disruptions through end-2027.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Oil%20prices%20continue%20climb%20on%20US-Iran%20deal%20doubts%20stocks%20retreat.pdf"}, {"id": "bt-15", "title": "Resilient Europe turns into a winning bet for money managers", "source": "BT", "date": "12 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "European markets are charging ahead in 2026, defying forecasts that the Iran war would tip the region into stagflation. The Stoxx Europe 600 has rallied about 12%, with German, Italian and French benchmarks at records, German bonds outperforming Treasuries and the euro near a two-month high. Investors are drawn by the best earnings season in nearly four years, MSCI Europe posting a 17% jump in Q2 profits, and momentum cool enough not to trouble the ECB. A basket of European AI adopters rose 14% versus 4% for US hyperscalers. European equities saw their strongest inflows in a decade excluding 2021. Bond investors favour the ECB's more predictable path over the Fed's. Skeptics cite 26% higher oil, elusive Hormuz reopening and French and Italian election risks next year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Resilient%20Europe%20turns%20into%20a%20winning%20bet%20for%20money%20managers.pdf"}, {"id": "bt-16", "title": "Revenue, employment improve with business AI use: MTI report", "source": "BT", "date": "12 Aug 2026", "tags": ["Technology & AI", "Society"], "summary": "Workplace AI adoption is linked to quick revenue and employment gains but not yet higher productivity and profit, a Ministry of Trade and Industry study found. Singapore businesses saw revenue rise 16% and employment 8% one year after adopting AI, with net job growth offsetting some losses, said IMDA senior economist Sarah Liu, the report's author. Gains mainly benefited higher-income, mid-career workers earning S$7,000-S$10,000 monthly and aged 35 to 44, plus higher-skilled Employment Pass holders. Roughly 8% of firms were identified as AI users, concentrated in infocomm, electronics, professional services and finance. Finance and insurance posted the largest gains, revenue up 21% and profit up 73%. No statistically significant productivity or profit lift emerged in the first four years, likely pending complementary investments. Experts see medium-term uplift as agentic AI spreads.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Revenue,%20employment%20improve%20with%20business%20AI%20use%20MTI%20report.pdf"}, {"id": "bt-17", "title": "ST Engineering shares fall as much as 4.7% after reporting softer Q2 orders", "source": "BT", "date": "12 Aug 2026", "tags": ["Defence", "Finance & Markets"], "summary": "Shares of ST Engineering fell as much as 4.7% on Tuesday after the defence and engineering group reported a year-on-year drop in Q2 order wins. It secured S$2.9 billion in new contracts in Q2 2026, a 38.3% drop from S$4.7 billion a year earlier, with commercial aerospace at S$1.2 billion, defence and public security S$1.2 billion, and urban solutions and satcom S$500 million, all down from year-ago levels. The counter fell to S$9.83 early on before ending 1.2% lower at S$10.20. Citi analyst Luis Hilado attributed the softness to contract-completion timing, said underlying demand remained healthy, and kept a S$10.65 target. Singapore's High Court separately rejected a bid to bring unit ST Engineering Aerospace Systems into a trademark infringement suit over allegedly counterfeit aircraft components.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/ST%20Engineering%20shares%20fall%20as%20much%20as%204.7%20after%20reporting%20softer%20Q2%20orders.pdf"}, {"id": "bt-18", "title": "Swiss parliament panel fails to reach deal on UBS capital rules", "source": "BT", "date": "12 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "A Swiss parliamentary committee failed on Tuesday to agree on proposed new banking regulations for UBS, as some lawmakers pushed to soften tougher rules drafted after Credit Suisse's collapse. The draft Bill would require UBS to hold about US$20 billion in additional Common Equity Tier-1 capital to help prevent another crisis and protect taxpayers, but UBS argues the requirement is excessive and would undermine competitiveness. At its heart is a proposal for UBS to fully capitalise foreign subsidiaries, up from 60% currently, using CET1 alone. The upper-house committee discussed allowing cheaper Additional Tier 1 capital and strengthening AT1 instruments with a higher trigger point. No deal was reached; it reconvenes on Aug 31, aiming for an upper-house vote in September.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Swiss%20parliament%20panel%20fails%20to%20reach%20deal%20on%20UBS%20capital%20rules.pdf"}, {"id": "bt-19", "title": "US existing home sales post second straight monthly decline in July", "source": "BT", "date": "12 Aug 2026", "tags": ["Finance & Markets"], "summary": "US existing home sales fell for a second straight month in July, with any rebound likely limited by higher mortgage rates and tight supply. Sales dropped 1.7% to a seasonally adjusted annual rate of 4.06 million units, slightly above the 4.05 million forecast. Last month's closings reflected contracts signed in May and June as mortgage rates resumed rising; the 30-year fixed rate has jumped 71 basis points since the war began in February, averaging 6.69% last week, the highest since July 2025. Higher rates also deter homeowners with sub-5% mortgages from selling. Inventory fell 1.9% to 1.54 million units, a 4.6-month supply. The median price rose 2% to US$434,100; first-time buyers made up 29% of sales, below the 40% seen as healthy.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/US%20existing%20home%20sales%20post%20second%20straight%20monthly%20decline%20in%20July.pdf"}, {"id": "bt-20", "title": "US officials work to close supply chain gaps as foreign investment grows", "source": "BT", "date": "12 Aug 2026", "tags": ["Trade", "Politics"], "summary": "US officials said they are working closely with foreign investors to identify gaps in the manufacturing supply chain and help small and medium businesses scale up as foreign investment surges. Treasury Assistant Secretary Chris Pilkerton and Small Business Administrator Kelly Loeffler said President Trump's tariffs and deregulation were fuelling investment, but components must also be available. Speaking at a Philadelphia shipyard acquired by Hanwha, whose CEO David Kim pledged US$5 billion and up to 10,000 jobs, Pilkerton described a new pilot \"Strategic Vendor Programme\" to strengthen domestic supply chains. Treasury also launched a website and \"Known Investor Programme\" to make CFIUS reviews faster and more transparent. Loeffler said the SBA provided about US$3 billion for manufacturers in 2025, including US$32 million for shipbuilders.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/US%20officials%20work%20to%20close%20supply%20chain%20gaps%20as%20foreign%20investment%20grows.pdf"}, {"id": "bt-21", "title": "Who is Destry Damayanti, the first woman set to lead Indonesia's central bank?", "source": "BT", "date": "12 Aug 2026", "tags": ["Southeast Asia", "Finance & Markets", "Politics"], "summary": "President Prabowo Subianto nominated Bank Indonesia senior deputy governor Destry Damayanti to lead the central bank, the sole candidate to succeed Perry Warjiyo, whose sudden July resignation rattled markets. If confirmed after parliamentary scrutiny, she would be the first woman to head BI. Destry, 63, is a veteran economist and central banker with an economics degree from the University of Indonesia and a master's from Cornell, prior roles as chief economist at Bank Mandiri and at the Deposit Insurance Corporation, and BI experience since 2019. Her nomination was submitted on Aug 10, with a fit-and-proper test on Aug 13 and plenary vote expected Aug 14. The rupiah strengthened 0.75% to 17,750 per dollar. Analysts see policy continuity; her priorities include supporting the rupiah amid Prabowo's 8% growth target.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Who%20is%20Destry%20Damayanti,%20the%20first%20woman%20set%20to%20lead%20Indonesia's%20central%20bank.pdf"}, {"id": "bt-22", "title": "Yen inches towards key level of 160 per US dollar as intervention concerns mount", "source": "BT", "date": "12 Aug 2026", "tags": ["Finance & Markets"], "summary": "The yen edged closer to a key level against the US dollar, raising concerns over renewed Japanese intervention. It ended little changed after falling as much as 0.1% to touch 159.39 per dollar on Tuesday, with traders bracing for the 160 level that has historically capped yen weakness. Mizuho's Masayuki Nakajima warned a decisive break above 160 could intensify intervention concerns. The yen had its worst day since mid-February on Monday, weakening 1%, walking back gains from Japan and the US's first coordinated intervention since 1998, which had lifted it from near 164 to a peak of 155. Wide US-Japan rate differentials, fiscal worries and geopolitical uncertainty continue to weigh. Analysts said sustained strength ultimately requires a more hawkish BOJ.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Yen%20inches%20towards%20key%20level%20of%20160%20per%20US%20dollar%20as%20intervention%20concerns%20mount.pdf"}, {"id": "scmp-01", "title": "'Islamic Nato'? Why Pakistan's new defence pact has India on edge", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "A tripartite Mecca Joint Defence Agreement signed Friday by Pakistan, Saudi Arabia and Turkey treats an armed attack on one signatory as an attack on all, following a September Saudi-Pakistan bilateral pact. Pakistani Defence Minister Khawaja Muhammad Asif floated it as a model for a wider Nato-like Islamic alliance, unsettling New Delhi. Analysts say the bloc could evolve incrementally into an identity-based grouping extending into the Indian Ocean, especially if Bangladesh, exploring JF-17 jet purchases, or the Maldives aligns. Former Indian army vice-chief Satinder Kumar Saini called it \"more about political signalling.\" Others note Pakistan's reliance on IMF bailouts, where the US is the largest contributor, will make Islamabad cautious about upsetting Washington.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/'Islamic%20Nato'%20Why%20Pakistan's%20new%20defence%20pact%20has%20India%20on%20edge.pdf"}, {"id": "scmp-02", "title": "Alibaba says modular design delivers AI data centres in 100 days at 10% lower cost", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Technology & AI"], "summary": "Alibaba says its proprietary CUBE 5.0 modular architecture can deliver large-scale AI data centres in just 100 days, versus standard domestic timelines of six to 12 months and 12 to 18 months in the US, while cutting construction costs 10 per cent, state-backed China Securities Journal reported. Alibaba Cloud expects to more than double modular delivery efficiency this year. Unveiled in 2024, CUBE 5.0 lifted modularity across power, cooling, security, management and fire protection from 30 to 90 per cent, with components prefabricated in factories and assembled on-site. Piloted in Ulanqab and Zhongwei, it is certified for European and Southeast Asian roll-out. The push forms part of Alibaba's 380 billion yuan (US$56.3 billion) AI capex commitment; it recently opened data centres in France. Alibaba owns the SCMP.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/Alibaba%20says%20modular%20design%20delivers%20AI%20data%20centres%20in%20100%20days%20at%2010%20lower%20cost.pdf"}, {"id": "scmp-03", "title": "Alibaba tests paid AI appetite with US$30 annual office-assistant subscription", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Technology & AI"], "summary": "Alibaba is testing willingness to pay for AI, launching three paid membership tiers for the office assistant in its Qwen app, with annual plans ranging from 200 yuan (US$29.60) to 1,499 yuan for the flagship version, per Apple's App Store. Users can buy extra video-generation credits priced between 26 and 968 yuan; the core Qwen chatbot stays free. Running large language models and multi-modal agents at scale demands vast computing resources, making monetisation critical to offsetting rising infrastructure costs. Alibaba is expanding Qwen into a broader agent ecosystem, letting third-party developers integrate tools across phones, PCs and smart glasses spanning over 10 sectors. The strategy mirrors OpenAI and Anthropic, plus domestic rivals Moonshot AI and Z.ai. Alibaba owns the SCMP.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/Alibaba%20tests%20paid%20AI%20appetite%20with%20US30%20annual%20office-assistant%20subscription.pdf"}, {"id": "scmp-04", "title": "Beyond the numbers: why China's carrier force won't copy the US model", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Defence experts argue China's carrier force is developing a doctrine distinct from the US model, complementing land-based air power, anti-ship missiles and rocket forces rather than projecting power far from home. The Pentagon last year estimated Beijing would field nine carriers by 2035, but the IISS says quieter shifts in pilot recruitment, command and fleet integration matter more. All known Chinese carrier commanders come from surface warfare, not naval aviation, and share authority with political commissars. Strike power is spread across escorts, submarines and missile forces rather than concentrated in the air wing. Analysts Brendan Mulvaney and Christopher Sharman expect carriers deployed on a conflict's periphery, supporting counter-intervention deep in the western Pacific and Indian Ocean, not spearheading a Taiwan assault.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/Beyond%20the%20numbers%20why%20China's%20carrier%20force%20won't%20copy%20the%20US%20model.pdf"}, {"id": "scmp-05", "title": "China detains Japanese executives in dual-use technology export probe: report", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Geopolitics", "Trade"], "summary": "China has detained several Japanese nationals, including executives of firms with China offices, for allegedly violating export restrictions on dual-use goods, Japanese newspaper The Mainichi reported, citing sources. Some were held on entry to secure cooperation with inquiries. Dual-use items span goods with civilian and military applications, including critical minerals for drones and semiconductors. The detentions follow earlier crackdowns, including two workers seized in Dalian in May over rare-earth allegations. Beijing's foreign ministry did not confirm the cases but said authorities \"handled criminal cases in accordance with the law.\" Ties worsened after Japanese PM Sanae Takaichi said a Taiwan attack could prompt military intervention. China has added Japanese entities to export-control lists; its rare-earth exports to Japan fell 51 per cent in the first half.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/China%20detains%20Japanese%20executives%20in%20dual-use%20technology%20export%20probe%20report.pdf"}, {"id": "scmp-06", "title": "China is pitching its AI models to Europe, but is it enough to avoid 2-horse race with US?", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "As the US and China consolidate AI dominance, attention turns to whether Europe can form a distinct third pole, or \"G3,\" or stay in Washington's orbit. The 2026 Global AI Innovation Index put the US at 78.44 points and China at 60.49, with third-placed Britain far behind on 39.99. Beijing is pitching open-source models like DeepSeek to European capitals as cost-effective alternatives to US tech, with ambassadors courting Britain and the EU. Analyst Cui Hongjian sees a forming \"G2\" but longer-term room for a G3, urging Europe to adopt China-compatible infrastructure. Siemens already uses DeepSeek and Z.ai. Skeptics say a genuine third pole requires owning the full stack of chips, cloud and energy; without faster compute investment, Europe risks becoming a passenger.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/China%20is%20pitching%20its%20AI%20models%20to%20Europe,%20but%20is%20it%20enough%20to%20avoid%202-horse%20race%20with%20US.pdf"}, {"id": "scmp-07", "title": "China says US tried to buy its super magnet that has '40% higher' performance", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "Chinese state media says the US Department of Energy's Brookhaven National Laboratory, which once \"monopolised\" superconducting-magnet technology, contacted the Institute of High Energy Physics in May last year hoping to buy a Chinese-made combined superconducting magnet used in the Beijing Electron-Positron Collider's latest upgrade. Researcher Zhu Yingshun said the device, developed over 13 years, performs \"40 per cent higher\" than American products. There is no indication the US lab acquired it. Combined magnets perform multiple magnetic functions simultaneously; collider magnets use niobium and titanium rather than export-controlled rare earths. The 2021-completed upgrade achieved full equipment localisation and tripled peak luminosity. The collider recently offered the strongest evidence yet for the glueball particle and has found 32 new particles since 2009.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/China%20says%20US%20tried%20to%20buy%20its%20super%20magnet%20that%20has%20'40%20higher'%20performance.pdf"}, {"id": "scmp-08", "title": "China's economic problems have been diagnosed. Will policymakers act?", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "Two establishment economists argue China's economy has been \"running cold\" for three years, rejecting the popular \"K-shaped\" framing of strong tech offsetting weak demand. At Renmin University forums, Tsinghua's Li Daokui put real unemployment at 10.2 per cent, or 24 million chronically underemployed, and noted fixed-asset investment fell 4.1 per cent early this year, a contraction previously seen only in 1961 and 1967. Former official Liu Shijin urged transferring 20 trillion yuan (US$3 trillion) of state capital to social security and lifting consumption above 60 per cent. Second-quarter GDP grew just 4.3 per cent, below target. The July 30 Politburo acknowledged difficulties but kept large-scale stimulus off the table, relying on \"AI Plus\" initiatives while firms build capacity abroad.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/China's%20economic%20problems%20have%20been%20diagnosed.%20Will%20policymakers%20act.pdf"}, {"id": "scmp-09", "title": "China's hypersonic weapons can be guided by the stars if GPS fails: report", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Defence", "Technology & AI"], "summary": "A project led by the Guangdong Aerospace Research Academy, which passed final expert review Monday, has developed celestial navigation letting hypersonic weapons steer by the stars when GPS or BeiDou is jammed or fails. Celestial navigation is self-contained and immune to electromagnetic interference, serving as a final backup paired with inertial systems. The challenge: at Mach 5-plus, friction creates a plasma sheath exceeding 1,000 degrees Celsius that bends starlight and emits blinding infrared. Researchers built radiation databases and simulation software with spectral resolution of 0.12 nanometres, enabling a prototype star sensor. Star-pattern recognition exceeded 99 per cent in clean conditions and stayed above 80 per cent under interference, with accuracy better than 5 arcseconds. The technology also has civilian combustion-diagnostics uses.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tec
