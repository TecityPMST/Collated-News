Aug%202026/26%20Aug%20WSJ/World%20Trade%20Flows%20Continue%20Recovery%20in%20June.pdf"},{"id":"wsj-18","title":"Zohran Mamdani Is Turning His Fire on Amazon","source":"WSJ","date":"26 Aug 2026","tags":["Politics","Society"],"summary":"New York City's socialist mayor Zohran Mamdani, who won a historic November victory on a pro-worker platform, is clashing with Amazon. He backed the Delivery Protection Act, requiring warehouse operators to obtain city licenses meeting safety and employment rules and to directly hire couriers now employed by subcontractors. Amazon says the bill puts over 5,000 delivery jobs at risk and has threatened to relocate warehouses. Mamdani also announced over $9 million in idling fines and sent cease-and-desist orders over illegal e-bikes. Amazon contributed around $5 million to a campaign fighting the legislation. Recalling Amazon's abandoned 2019 NYC headquarters, consultants say Mamdani's fight with the \"most recognizable delivery entity\" reflects national ambitions.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20WSJ/Zohran%20Mamdani%20Is%20Turning%20His%20Fire%20on%20Amazon.pdf"},{"id":"st-01","title":"Apple unveils new Mac Mini, Mac Studio with major chip upgrades","source":"ST","date":"26 Aug 2026","tags":["Technology & AI"],"summary":"Apple unveiled upgraded Mac mini and Mac Studio desktops with major processor gains. The Mac mini now starts at US$899 (S$1,140), powered by the new M6 chip or an M5 Pro; the Studio uses either the M5 Max (US$2,499) or new M5 Ultra (US$5,499), which fully configured can hit US$18,299. Both preorder from Aug 25, ship Sept 22, and run macOS 27 Golden Gate. The M6 has a 12-core CPU and 12-core GPU offering 4x faster AI performance, plus Wi-Fi 7 and Bluetooth 6. The Mac was earlier stung by an AI-driven memory-chip shortage; Apple scrapped the US$599 base in May. CEO Tim Cook hands over to John Ternus in September, ahead of a Sept 9 iPhone event.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20ST/Apple%20unveils%20new%20Mac%20Mini,%20Mac%20Studio%20with%20major%20chip%20upgrades.pdf"},{"id":"st-02","title":"Germany to say who is behind attempted airport drone attack soon","source":"ST","date":"26 Aug 2026","tags":["Defence","Geopolitics"],"summary":"Chancellor Friedrich Merz said on Aug 25 that Germany would soon name who was responsible for an attempted drone attack on Leipzig/Halle airport earlier in August, a cargo and military logistics hub used by NATO and Ukraine's Antonov Airlines. Security sources cited by local media suspect Russian intelligence, though Berlin has made no direct accusation. On Aug 4, an explosives-laden drone was found near a Ukrainian Antonov cargo aircraft; investigators suspect a second drone collided with a DHL plane. Ten days later a third drone and about 50g of suspected military explosive hexogen were discovered west of the airport, broadcasters NDR, WDR and the Sueddeutsche Zeitung reported. Moscow denies involvement.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20ST/Germany%20to%20say%20who%20is%20behind%20attempted%20airport%20drone%20attack%20soon.pdf"},{"id":"st-03","title":"Guangzhou Knowledge City to work with SUSS and SIT on healthcare and AI","source":"ST","date":"26 Aug 2026","tags":["Southeast Asia","Technology & AI"],"summary":"The China-Singapore Guangzhou Knowledge City (CSGKC) signed three partnership agreements with Singapore institutions to deepen cooperation in healthcare, AI and talent. Announced on Aug 25 at the 16th Singapore-Guangdong Collaboration Council meeting, the pacts involve SUSS, SIT and Business China. SIT will partner on smart healthcare technologies, robotics and care delivery; SUSS will focus on senior care via its Aged+ Living Labs; Business China will expand institutional networks. Established in 2010 in Guangzhou's Huangpu District, CSGKC houses an International Biomedicine Innovation Park with firms including Akeso and BeOne Medicines, plus 40-plus biopharma projects and seven hospitals. It also plans an International Hub for Innovative Healthcare modelled on Singapore's HealthCity Novena.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20ST/Guangzhou%20Knowledge%20City%20to%20work%20with%20SUSS%20and%20SIT%20on%20healthcare%20and%20AI.pdf"},{"id":"st-04","title":"IMF's Georgieva says global economy weathering energy shock, sees fiscal concerns","source":"ST","date":"26 Aug 2026","tags":["Finance & Markets","Energy"],"summary":"IMF managing director Kristalina Georgieva said on Aug 25 the global economy has weathered the Iran-war energy shock better than feared, but flagged deteriorating fiscal conditions, rising bond yields and stalled disinflation. Speaking ahead of a G20 finance leaders meeting in Asheville, North Carolina, she described a \"tug of war\" between the Gulf energy supply shock and growth tailwinds from an AI investment boom spreading beyond US borders. Risks are more balanced than in April but still tilted downside due to fiscal pressures and possible tight monetary policy. Factors cushioning the Strait of Hormuz closure include reserve drawdowns, non-Gulf supply increases, weaker demand, more renewables and a shift back to coal.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20ST/IMF's%20Georgieva%20says%20global%20economy%20weathering%20energy%20shock,%20sees%20fiscal%20concerns.pdf"},{"id":"st-05","title":"Indonesia, Malaysia, S'pore commit to keep Malacca, Singapore straits free, open, safe","source":"ST","date":"26 Aug 2026","tags":["Southeast Asia","Trade"],"summary":"Indonesia, Malaysia and Singapore on Aug 25 committed to keep the Malacca and Singapore straits free, open and safe. Transport Minister Jeffrey Siow said more than 50 navigational aids now guide ships, with virtual aids recently deployed, and AI is being used to anticipate traffic hot spots and warn of collisions. Regional guidelines for ships in distress are due within the year, and Singapore is proposing steps to tackle rising container-ship cargo fires. Siow noted Strait of Hormuz traffic has fallen to under a tenth of pre-war levels. Speaking at the 17th Co-operation Forum (over 300 delegates from 125-plus countries), officials stressed the waterway carries nearly a quarter of global seaborne trade.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20ST/Indonesia,%20Malaysia,%20S'pore%20commit%20to%20keep%20Malacca,%20Singapore%20straits%20free,%20open,%20safe.pdf"},{"id":"st-06","title":"Iran and Oman discuss temporary Hormuz corridor as impasse with US drags on","source":"ST","date":"26 Aug 2026","tags":["Geopolitics","Energy"],"summary":"Iran said it restarted talks with Oman to manage the Strait of Hormuz amid heightened US economic pressure. On Aug 25 the two discussed a \"joint temporary navigational corridor\" and agreed to clear the strait of mines; Trump repeated that all mines had been cleared. The waterway handled a fifth of global oil and LNG shipments before the war began in February, but most shipping has since shut down and passage remains perilous, with a tanker struck near Oman's Ash Shishah on Aug 25. The US Secret Service flagged an Iranian state-TV video discussing a plot to assassinate Barron Trump. Washington is returning staff to some Middle East missions; oil fell for a second day as traders shrugged off new US sanctions threats.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20ST/Iran%20and%20Oman%20discuss%20temporary%20Hormuz%20corridor%20as%20impasse%20with%20US%20drags%20on.pdf"},{"id":"st-07","title":"Iraq may show how US can squeeze Iran's trade partners","source":"ST","date":"26 Aug 2026","tags":["Geopolitics","Finance & Markets"],"summary":"Iraq illustrates how the US could push countries trading with Iran out of the dollar-based financial system. Washington has sanctioned many Iraqi banks accused of dealing with Tehran while avoiding economy-crippling measures against the strategic ally. Trump warned any country giving Iran an economic lifeline faces severe consequences, potentially framing China, the UAE, Turkey, India, Pakistan and Oman; Treasury Secretary Scott Bessent announced an \"economic onslaught.\" Since 2003 the US has held effective control over Iraq's oil revenue via the New York Fed. Iraq-Iran trade topped US$10 billion in 2025, and Iraq pays Iran US$4-5 billion yearly for gas. Analysts say Iraq's vulnerability stems from dependence on the US-led financial architecture.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20ST/Iraq%20may%20show%20how%20US%20can%20squeeze%20Iran's%20trade%20partners.pdf"},{"id":"st-08","title":"Japan Inc seeks new hedges for a long era of yen weakness","source":"ST","date":"26 Aug 2026","tags":["Finance & Markets"],"summary":"Japanese firms are seeking new hedges against persistent yen weakness after imports grew costlier, with the currency having lost over 30 per cent against the dollar in five years despite interventions in 2022, 2024 and 2026. Supermarket operator Takara MC's CEO Taku Ueno negotiates longer contracts to lock in prices; others turn to futures, forwards and options. The yen hit a near 40-year low near 164 in July before intervention, last trading around 159. Driving the decline are low rates and debt worries under PM Sanae Takaichi. Nitori estimates each one-yen rise cuts profit by about two billion yen. Daiwa and Bank of America report booming hedging demand, with some clients locking rates for five to 10 years.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20ST/Japan%20Inc%20seeks%20new%20hedges%20for%20a%20long%20era%20of%20yen%20weakness.pdf"},{"id":"st-09","title":"Japan eyes blockchain for instant stock, government bond settlement: Report","source":"ST","date":"26 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Japan is preparing payment infrastructure to enable instantaneous settlement of stock and Japanese government bond (JGB) transactions using blockchain, the Nikkei reported on Aug 26. The Financial Services Agency, Ministry of Finance, Bank of Japan and financial institutions will launch a study group this summer, aiming to formulate a development plan around early 2027 at the earliest. The plan would cover blockchain design, division of responsibilities and a road map, with operations potentially running in the early 2030s. The system could extend to international remittances. Currently, stock trades settle two days after execution and JGBs the next day; real-time settlement would let investors reinvest sale proceeds almost simultaneously.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20ST/Japan%20eyes%20blockchain%20for%20instant%20stock,%20government%20bond%20settlement%20Report.pdf"},{"id":"st-10","title":"Japan's only high speed trader Dharmacapital moves to Singapore","source":"ST","date":"26 Aug 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"Japan's high-frequency trader Dharmacapital moved all its staff to Singapore earlier in August, leaving Tokyo with no such firms operating locally. Japan's high tax rate versus hubs like Singapore and Hong Kong partly drove the decision, one source said, though CEO Akiyoshi Shiotani cited better access to global markets and stressed Japan remains its most important market. Of 53 high-frequency trading units in Japanese markets, Dharmacapital was the only one based in Tokyo per the FSA's July list; peers such as Citadel Securities, Virtu Financial and Jane Street trade from Singapore or Hong Kong. Singapore in August proposed tax exemptions for fund managers. Market-makers have accounted for over 30 per cent of Tokyo Stock Exchange trading value since 2024.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20ST/Japan's%20only%20high%20speed%20trader%20Dharmacapital%20moves%20to%20Singapore.pdf"},{"id":"st-11","title":"S'pore and Vietnam agree to deepen leadership exchanges, expand tech cooperation","source":"ST","date":"26 Aug 2026","tags":["Southeast Asia","Politics"],"summary":"Singapore and Vietnam agreed to deepen leadership exchanges and expand technology cooperation, formalised at the first Singapore-Vietnam Strategic Dialogue on Aug 25. The two exchanged an agreement on study visits for senior Vietnamese officials and a joint statement on technology connectivity. Coordinating Minister Chan Chun Sing co-chaired with Vietnam's Tran Cam Tu; the dialogue follows the 2025 elevation of ties to a Comprehensive Strategic Partnership, Singapore's first with an ASEAN state. Chan outlined developing \"pi-shaped\" leaders with depth and breadth, while Tu sought to learn from Singapore's governance. Both agreed to cooperate on responsible AI development and cross-border data flows. Singapore's study-visit programme for CPV officials, running since 2011, was renewed to 2029.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20ST/S'pore%20and%20Vietnam%20agree%20to%20deepen%20leadership%20exchanges,%20expand%20tech%20cooperation.pdf"},{"id":"st-12","title":"Satellite images hint at China adding radar 'eyes' near emerging South China Sea base","source":"ST","date":"26 Aug 2026","tags":["Defence","Geopolitics"],"summary":"New installations have been sighted on Yagong Island near Antelope Reef in the Paracels, where analysts believe China is building its largest military base, per satellite imagery reviewed by Reuters. Commercial provider Vantor, which imaged the site on Aug 17, said structures resemble military radar/early warning facilities and are likely tied to Antelope Reef, where China completed the first construction phase. The Antelope images showed an artificial island nearly 6km long with a possible runway. China has occupied the Paracels since seizing them from South Vietnam in 1974 and says the base meets civilian needs. Analysts including Singapore-based Collin Koh call the Yagong site most likely a radar station, strengthening China's hold on the northern trade waterway near any Taiwan conflict.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20ST/Satellite%20images%20hint%20at%20China%20adding%20radar%20'eyes'%20near%20emerging%20South%20China%20Sea%20base.pdf"},{"id":"st-13","title":"Singapore will bid to host international tribunal for investor-state disputes: Edwin Tong","source":"ST","date":"26 Aug 2026","tags":["Politics","Trade"],"summary":"Singapore is bidding to host the proposed Multilateral Investment Tribunal to settle disputes between foreign investors and states, Law Minister Edwin Tong announced on Aug 25. Being negotiated by UNCITRAL member states, the tribunal responds to strain on the rules-based order and existing investor-state dispute settlement (ISDS), marked by inconsistent decisions and questions over arbitrator independence. More than half of known treaty-based investor-state cases since 1987 arose in the last decade. Tong said Singapore offers a neutral, rule-of-law jurisdiction and would anchor the bid with a tribunal building and financial contributions. He also announced a Centre for Arbitration and International Dispute Resolution with NUS, led by Professor Stavros Brekoulakis. The event was part of Singapore Convention Week.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20ST/Singapore%20will%20bid%20to%20host%20international%20tribunal%20for%20investor-state%20disputes%20Edwin%20Tong.pdf"},{"id":"st-14","title":"South Korea's SK Hynix union members reject wage agreement in vote","source":"ST","date":"26 Aug 2026","tags":["Technology & AI","Society"],"summary":"SK Hynix union members narrowly rejected a tentative wage agreement on Aug 25, with 50.08 per cent of 15,045 voters against, a margin of just 25 votes, a source said. The deal included a 6.3 per cent wage increase and a revised profit-sharing scheme paying 40 per cent of bonuses in cash and 60 per cent in company shares. The world's second-largest memory chipmaker has profited from booming high-bandwidth memory (HBM) demand for AI, but workers objected to receiving more than half of bonuses in volatile stock; SK Hynix shares hit a record in June before slumping. Samsung struck a performance-pay deal in May allocating 10.5 per cent of chip operating profit. SK Hynix shares fell 4.9 per cent versus a 2.2 per cent KOSPI decline.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20ST/South%20Korea's%20SK%20Hynix%20union%20members%20reject%20wage%20agreement%20in%20vote.pdf"},{"id":"st-15","title":"Stocks rise and oil slips as traders eye Iran threat, Nvidia results","source":"ST","date":"26 Aug 2026","tags":["Finance & Markets","Energy"],"summary":"Stocks rose and oil dipped on Aug 25 as investors assessed a US plan for the \"economic asphyxiation\" of Iran and awaited Nvidia earnings. With the war in its sixth month, Treasury Secretary Scott Bessent declared an \"economic D-Day,\" threatening countries that trade with Iran and targeting its digital assets, tech, gold, aviation and shipping sectors. Both oil contracts fell more than 2 per cent as the move suggested the US would hold off on military action. Seoul, Tokyo, Hong Kong, Shanghai and Singapore rose. Investors also eyed Nvidia, a bellwether for the AI boom, plus Salesforce and Marvell, and Jackson Hole where Fed chief Kevin Warsh speaks. The Canadian dollar firmed after Trump vowed to double vehicle tariffs on Canada.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20ST/Stocks%20rise%20and%20oil%20slips%20as%20traders%20eye%20Iran%20threat,%20Nvidia%20results.pdf"},{"id":"st-16","title":"Temu-owner PDD revenue misses estimates, profit falls on 'intense' China competition","source":"ST","date":"26 Aug 2026","tags":["Technology & AI","Trade"],"summary":"PDD Holdings reported a fall in second-quarter profit on Aug 24 and revenue that missed estimates amid fierce China competition and overseas regulatory pressure. Revenue rose 8 per cent to 112.36 billion yuan (S$21.2 billion), below the 116.35 billion yuan expected; net income fell 12 per cent to 27.2 billion yuan, though adjusted per-ADS earnings beat. PDD competes with Alibaba, JD.com and Douyin as weak consumer confidence fuels a price war. Executives called competition \"intense.\" Temu faces scrutiny in the US and Europe after losing duty-free treatment for low-value parcels and facing a new EU parcel fee from July. Co-CEO Chen Lei warned of slower fulfilment and higher costs eroding Temu's price advantage. PDD shares rose 2.3 per cent.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20ST/Temu-owner%20PDD%20revenue%20misses%20estimates,%20profit%20falls%20on%20'intense'%20China%20competition.pdf"},{"id":"st-17","title":"The geese stop flying: Why some Asian nations can't take off","source":"ST","date":"26 Aug 2026","tags":["Trade","Southeast Asia"],"summary":"Vikram Khanna argues the \"flying geese\" model of Asian development is collapsing as China refuses to vacate labour-intensive manufacturing. Chinese goods on Temu undercut South-east Asian traders in incense, light bulbs, toys and furniture. Despite wages reaching about US$10,000 a year, China retains 29.6 per cent of world apparel and 43.3 per cent of textile exports, upgrading selectively via clustering, an undervalued yuan and state support amid a \"second China shock.\" Indonesia's textile sector lost an estimated 250,000 jobs since 2021. China also disrupts distribution: platforms like Temu, exploiting de minimis thresholds, delete local importers and retailers. Governments including Indonesia, Vietnam, Singapore and Malaysia have curbed low-value imports, but developing economies face a double bind.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20ST/The%20geese%20stop%20flying%20Why%20some%20Asian%20nations%20can't%20take%20off.pdf"},{"id":"st-18","title":"The war on data centres is a bit fake","source":"ST","date":"26 Aug 2026","tags":["Technology & AI","Politics"],"summary":"This Economist piece argues political opposition to US data centres is largely theatrical. After Kevin O'Leary announced a huge Utah project dismissed as \"vapourware gigawatts,\" Utah lawmakers forced a scale-back and lost primaries. Voters see data centres as ugly and power-hungry, yet the stock market bets heavily on their construction. Politicians target speculative \"wildcatters\" while still wanting real projects built; Pennsylvania's Josh Shapiro squashed proposals that were unlikely anyway, and New York, Virginia and Texas measures leave the boom largely intact. Texas alone has 474GW of grid-connection requests against 90GW peak demand. About 10 per cent of the pipeline has been delayed or cancelled over the past year, with chip and worker constraints worrying developers more than politics.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20ST/The%20war%20on%20data%20centres%20is%20a%20bit%20fake.pdf"},{"id":"st-19","title":"Trump says Strait of Hormuz has been demined, warns Iran not to plant more","source":"ST","date":"26 Aug 2026","tags":["Geopolitics","Energy"],"summary":"US President Donald Trump said on Aug 25 that all mines had been detonated or removed from international waters of the Strait of Hormuz, warning that any ship or boat placing new mines would be destroyed. In a Truth Social post, Trump said the US, via its Space Force, was watching \"every square inch\" of the strait and declared a \"Zero Tolerance policy on mine placement.\" The US and Iran have not struck each other's militaries for weeks, but attacks on vessels have continued as the two sides vie for control of the passage. Oil transits through the strait were at five million barrels per day on Aug 24 per shiptracker Vortexa, down from more than 20 million before the war, or about one of every five barrels consumed worldwide.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20ST/Trump%20says%20Strait%20of%20Hormuz%20has%20been%20demined,%20warns%20Iran%20not%20to%20plant%20more.pdf"},{"id":"st-20","title":"Trump sends Saudi nuclear deal to Congress but says Riyadh must recognise Israel","source":"ST","date":"26 Aug 2026","tags":["Geopolitics","Energy"],"summary":"President Trump sent Congress a proposed US-Saudi civil nuclear energy agreement while insisting it will only proceed if the kingdom normalises relations with Israel, a US administration official told Reuters on Aug 25. Reached in July, the deal would let US firms export civilian nuclear technology; it was submitted on Aug 24, with Congress having 90 session days to consider it. The president's condition is that Saudi Arabia joins the Abraham Accords, the 2020-21 normalisation deals involving the UAE, Bahrain, Morocco and Sudan. Riyadh has demanded an irreversible path to a Palestinian state before recognising Israel, a stance hardened by the October 2023 Gaza war. The 30-year deal calls for AP1000 reactors, benefiting Westinghouse, owned by Cameco and Brookfield.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20ST/Trump%20sends%20Saudi%20nuclear%20deal%20to%20Congress%20but%20says%20Riyadh%20must%20recognise%20Israel.pdf"},{"id":"st-21","title":"US lawmakers urge Trump to ban Americans from aiding Chinese security agencies","source":"ST","date":"26 Aug 2026","tags":["Geopolitics","Technology & AI"],"summary":"Republican and Democratic lawmakers urged the Trump administration to bar US citizens and businesses from supporting Chinese and Russian civilian intelligence and security agencies. A 2018 law banned support for foreign military intelligence but left civilian-led bodies exempt, and rules implementing a 2022 measure remain unfinalised, leaving \"glaring loopholes,\" Senators Ron Wyden and John Cornyn wrote to Commerce Secretary Howard Lutnick. Foreign agencies can still hire US consultants and buy advanced surveillance, cyber and AI technology. The letter comes amid bipartisan pressure ahead of a Washington visit by Chinese President Xi Jinping next month. The administration's decision to let Nvidia sell advanced AI chips to China drew fire from both parties.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20ST/US%20lawmakers%20urge%20Trump%20to%20ban%20Americans%20from%20aiding%20Chinese%20security%20agencies.pdf"},{"id":"st-22","title":"US military transport plane lands in Moscow, Kremlin says it has no information yet","source":"ST","date":"26 Aug 2026","tags":["Geopolitics","Defence"],"summary":"A US military transport plane landed at Moscow's Vnukovo airport on Tuesday, data from Flightradar24 showed. The large Boeing Globemaster, US tail number 07-7181, flew direct from Riga, Latvia, landing around 0700 GMT; Reuters could not verify any cargo or passengers. The Kremlin said it had no information on the plane, which had arrived in Riga on Aug 23 from the Camp Springs airbase near Washington. The last direct US-registered jet flight to Russia from Europe was in January, carrying envoys Steven Witkoff and Jared Kushner for Ukraine peace talks with Vladimir Putin. The Kremlin said last week there was no information on another Kushner-Witkoff visit, as US-Russia talks on Ukraine have largely stalled amid the war in Iran.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20ST/US%20military%20transport%20plane%20lands%20in%20Moscow,%20Kremlin%20says%20it%20has%20no%20information%20yet.pdf"},{"id":"st-23","title":"US spy chief visits Russia for meetings, media reports","source":"ST","date":"26 Aug 2026","tags":["Geopolitics","Defence"],"summary":"CIA Director John Ratcliffe travelled to Moscow on Tuesday for meetings with Russian officials, US media reported citing unnamed sources. It would be the first known visit to the Russian capital by a US spy chief since predecessor William Burns met Putin in November 2021, three months before Russia's invasion of Ukraine. CBS News and Axios reported the trip; the CIA declined comment and Kremlin spokesman Dmitry Peskov said Putin did not plan to meet Ratcliffe. The US last week asked Ukraine not to launch air strikes near Moscow and St Petersburg on Monday-Wednesday because a senior US official's plane would fly to Russia. Russia, which maintains close ties with Iran, denies aiding Tehran and says it is ready to help resolve the US-Iran conflict.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20ST/US%20spy%20chief%20visits%20Russia%20for%20meetings,%20media%20reports.pdf"},{"id":"st-24","title":"Ukraine needs changes to avoid losing war, ousted defence minister Mykhailo Fedorov says","source":"ST","date":"26 Aug 2026","tags":["Defence","Politics"],"summary":"Ousted defence minister Mykhailo Fedorov told Reuters Ukraine appears to be slowly losing the war against Russia, warning Kyiv has only months to make decisions to turn the tide. Fedorov, 35, a young reformer whose July dismissal sparked protests, cited a lack of overall vision, failure to innovate, corruption and patronage. Russia is hitting factories with dozens of ballistic missiles monthly as Ukraine's interceptors run low, while Kyiv strikes Russian refineries causing fuel shortages. He urged AI-guided autonomous drones, cheap interceptors and a domestic ballistic missile programme, saying the state runs at \"5 per cent effectiveness.\" Fedorov disputed Zelensky's claim that front-loaded spending left a US$27 billion budget hole, and controversially called for wartime elections.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20ST/Ukraine%20needs%20changes%20to%20avoid%20losing%20war,%20ousted%20defence%20minister%20Mykhailo%20Fedorov%20says.pdf"},{"id":"bt-01","title":"Alibaba's US$10 billion share sale does not stun just Michael Burry","source":"BT","date":"26 Aug 2026","tags":["Finance & Markets","Technology & AI"],"summary":"Alibaba's HK$80 billion (US$10.2 billion) share placement, Hong Kong's biggest follow-on offering on record, is drawing scepticism across the city's finance circles. Michael Burry, of \"The Big Short\" fame, publicly criticised the deal, revealing he had shifted his entire Alibaba position into rival JD.com and said the e-commerce giant's shares would need to halve before he became interested again. \"I cannot bless share issuances,\" the American investor wrote on X. The record fundraising is sowing discomfort among Hong Kong investors, reflecting broader unease about dilution and valuations for Chinese technology stocks even as capital-markets activity in the territory rebounds. The deal's scale underscores both Alibaba's ambitions and mounting investor wariness.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20BT/Alibaba's%20US10%20billion%20share%20sale%20does%20not%20stun%20just%20Michael%20Burry.pdf"},{"id":"bt-02","title":"Bitcoin rises above US$80,000 as soft US dollar, debasement fears boost momentum","source":"BT","date":"26 Aug 2026","tags":["Finance & Markets","Technology & AI"],"summary":"Bitcoin rose above US$80,000 on Aug 25 to a more-than-three-month high, last trading at US$80,323 after touching US$81,238, its strongest since mid-May. A softer US dollar, spurred by Treasury Secretary Scott Bessent's moves to calm the bond market, revived crypto momentum. The token has climbed 16 per cent since President Trump urged Congress to pass clearer cryptocurrency rules, and is up 28 per cent in August, its best month since November 2024. The Treasury's plan to buy back more long-dated bonds to cap long-end yields stoked \"debasement trade\" fears, pushing investors into physical and digital assets. Gold also hit a three-month high. Analysts see a sustained break opening a path towards US$95,000 to US$100,000.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20BT/Bitcoin%20rises%20above%20US80,000%20as%20soft%20US%20dollar,%20debasement%20fears%20boost%20momentum.pdf"},{"id":"bt-03","title":"Cheering DBS' stellar performance and Temasek's dominance in economy, stock market","source":"BT","date":"26 Aug 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"This commentary celebrates DBS Group Holdings' strong run and Temasek's broad presence in Singapore's economy. DBS, the Republic's largest company by market capitalisation, posted a record Q2 net profit of S$3.08 billion, up 9 per cent and beating consensus, and raised full-year guidance on wealth-management momentum. First-half ROE hit 17.5 per cent, quarterly dividend rose to S$0.81, and its shares reached S$76.40, up 36 per cent from end-2025. The writer argues DBS's success benefits local shareholders, retirees, employees and the wider equity market, and that gains flow to Singaporeans via Temasek rather than tycoon families as with OCBC and UOB. Temasek returns fund government spending through the NIRC. He contends thriving state-linked firms create rather than remove opportunities for SMEs. The writer owns DBS shares.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20BT/Cheering%20DBS'%20stellar%20performance%20and%20Temasek's%20dominance%20in%20economy,%20stock%20market.pdf"},{"id":"bt-04","title":"China robot maker Unitree's shares slump 45% after fivefold IPO surge, sparking bubble fears in sector","source":"BT","date":"26 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Shares of Unitree, China's best-known humanoid robot maker, have slumped roughly 45 per cent over three sessions since a more-than-fivefold jump on their Aug 19 Shanghai debut, triggering bubble worries and questions about the IPO system. The company's valuation soared to US$66 billion before shedding US$30 billion, raising doubts that AI and robotics enthusiasm has outpaced fundamentals. Unitree's first-quarter adjusted net profit fell 53 per cent to 40 million yuan, and it has had little commercial success beyond viral demonstrations. Analysts blamed China's price-distorting listing mechanism, restricted short-selling and \"regulatory paternalism\" for pump-and-dump dynamics that burn retail investors. Its fast-tracked Star Market listing signalled state backing, echoing memory chipmaker CXMT's 466 per cent debut. Only 21 firms listed in Shanghai in 2026's first seven months versus 104 in Hong Kong.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20BT/China%20robot%20maker%20Unitree's%20shares%20slump%2045%20after%20fivefold%20IPO%20surge,%20sparking%20bubble%20fear.pdf"},{"id":"bt-05","title":"China's property slowdown echoes Japan's","source":"BT","date":"26 Aug 2026","tags":["Finance & Markets","Geopolitics"],"summary":"China's property sector, nearly a third of aggregate demand, is in its sixth year of contraction with no bottoming in sight. Sales have collapsed about 65 per cent from the 2020 peak and construction is at its lowest since 2000, with residential sales down 16.2 per cent year-to-date through May. This commentary likens the slump to Japan's 1990s bust, noting durable oversupply prolongs the pain. Chinese households hold nearly 70 per cent of wealth in housing, making consumption highly sensitive; Rogoff and Yang estimate a 40 per cent price fall could cut consumption 2 to 4 per cent of GDP. Unlike Japan, China's vulnerabilities sit in local governments and LGFVs, and record exports and leadership in EVs, renewables and AI offer buffers. But faster ageing, a weaker safety net and OECD growth forecasts slowing to 3.5 per cent by 2030 point to a longer, grinding adjustment. The writer is CIO Asia at Pictet Wealth Management.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20BT/China's%20property%20slowdown%20echoes%20Japan's.pdf"},{"id":"bt-06","title":"ECB set for September rate hike with no appetite to signal more: sources","source":"BT","date":"26 Aug 2026","tags":["Finance & Markets","Energy"],"summary":"European Central Bank policymakers are ready to raise interest rates at their Sept 9-10 meeting to contain the side-effects of the Iran war, but have little appetite to signal further tightening, three sources told Reuters. With inflation near 3 per cent, the Iran conflict ongoing and the euro-zone economy resilient, governors favour lifting the policy rate to 2.5 per cent from 2.25 per cent, the second hike after June's first increase in nearly three years. Policymakers cited rising natural gas and petrol prices as key inflation drivers, and pointed to better-than-expected output and business surveys. A hike, already built into June projections, would signal resolve to avoid a repeat of the post-Ukraine inflation surge. Long-term inflation expectations remain anchored at 2 per cent, so no further guidance is planned, though markets price one or two more hikes.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20BT/ECB%20set%20for%20September%20rate%20hike%20with%20no%20appetite%20to%20signal%20more%20sources.pdf"},{"id":"bt-07","title":"Four Fed bank boards wanted rate hike, minutes show","source":"BT","date":"26 Aug 2026","tags":["Finance & Markets","Politics"],"summary":"Directors at four of the Federal Reserve's 12 regional banks voted to raise the discount rate charged on emergency loans in the days before the US central bank's July meeting, minutes released on Aug 25 showed. The recommendations, overruled when policymakers voted 9-3 to hold the policy rate at their Jul 28-29 meeting, offer a window into how contested that decision was. Boards at the Dallas, Cleveland and Minneapolis Fed, whose presidents had dissented, plus the Kansas City Fed, favoured a quarter-point primary credit rate increase. Fed bank directors do not set policy but meet regularly with their presidents, who say directors' views help shape their outlooks. The discount rate is ultimately set by the Fed Board to match the top of the policy target range, held at 3.5 to 3.75 per cent since December.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20BT/Four%20Fed%20bank%20boards%20wanted%20rate%20hike,%20minutes%20show.pdf"},{"id":"bt-08","title":"German economy grew faster than estimated in second quarter","source":"BT","date":"26 Aug 2026","tags":["Finance & Markets","Trade"],"summary":"Germany's economy grew faster than initially estimated in the second quarter, with GDP rising 0.3 per cent between April and June, up from a preliminary 0.2 per cent, as trade sustained a long-awaited revival. Net exports drove the gain, climbing 0.2 per cent, while private consumption and government spending each rose 0.1 per cent and capital investment unexpectedly fell 0.2 per cent. It marked the first three-quarter growth streak since the pandemic's end, with Q1 revised up to 0.4 per cent. The upturn also reflects government spending on infrastructure and defence, plus Chancellor Friedrich Merz's tax, pension and bureaucracy reforms. Higher energy prices, Middle East fighting and record-low Rhine water levels weigh on activity. KfW raised its 2026 growth forecast to 1.1 per cent from 0.7 per cent, though it warned Rhine disruptions may stall third-quarter momentum.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20BT/German%20economy%20grew%20faster%20than%20estimated%20in%20second%20quarter.pdf"},{"id":"bt-09","title":"South Korea vows to turn Trump overtures into North Korea talks","source":"BT","date":"26 Aug 2026","tags":["Geopolitics","Defence"],"summary":"South Korea and the US agreed to maintain close coordination on reviving dialogue with North Korea, days after Pyongyang rebuffed President Trump's overtures and launched short-range ballistic missiles. In a Monday call, Foreign Minister Cho Hyun told Secretary of State Marco Rubio that Seoul would work to ensure Trump's messages lead to renewed US-North Korea discussions and peace on the peninsula. The officials pledged a strong combined defence posture while easing tensions and addressing the nuclear issue, and discussed tariffs, a bilateral investment pact and shipbuilding. Trump, who expects to meet Kim Jong Un in 2026, has scaled back some joint drills to preserve diplomacy; Kim Yo Jong dismissed his overtures. Cho also expressed willingness to make a \"practical contribution\" towards restoring free navigation through the Strait of Hormuz. The two agreed to meet in person soon.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20BT/South%20Korea%20vows%20to%20turn%20Trump%20overtures%20into%20North%20Korea%20talks.pdf"},{"id":"bt-10","title":"US consumer confidence hits seven-month low on worsening outlook","source":"BT","date":"26 Aug 2026","tags":["Finance & Markets","Politics"],"summary":"US consumer confidence fell in August to its lowest level since the start of the year, as households turned gloomier on business conditions and the labour market. The Conference Board's gauge slipped 0.8 points to 89.4 after a downward prior-month revision, missing the 90.2 median estimate. High gasoline prices, broader cost-of-living pressures and slower hiring weighed, following July retail sales that fell the most in over a year. Present conditions rose to a four-month high, but expectations for the next six months dropped to the lowest since January. The survey period, Aug 3-16, saw pump prices above US$4 a gallon as renewed US-Iran hostilities lifted oil, and Washington announced new pressure on Teheran. A separate University of Michigan sentiment measure also fell. Commerce Department data on July spending and inflation was due Wednesday.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20BT/US%20consumer%20confidence%20hits%20seven-month%20low%20on%20worsening%20outlook.pdf"},{"id":"scmp-01","title":"'Normal stability': US-China Track 1.5 talks offer formula for ties","source":"SCMP","date":"26 Aug 2026","tags":["Geopolitics","Politics"],"summary":"At the third US-China Track 1.5 Dialogue on Tuesday, Liu Haixing, head of the Communist Party's International Department, urged both powers to pursue \"normal stability with controllable disagreements,\" reject zero-sum games and expand shared interests. The unofficial mechanism, established in 2023, gathered around 40 Chinese and foreign representatives from local government, think tanks, universities and the US business community. The US delegation, led by Asia Society co-chairman John Thornton and including Kevin Rudd, Sean Stein and Craig Allen, called bilateral ties a \"unique juncture\" and hailed the Xi-Trump rapport as the relationship's \"most vital\" component. Talks spanned trade, healthcare, AI and food security. The dialogue precedes Xi Jinping's planned US state visit, his first since 2015.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/'Normal%20stability'%20US-China%20Track%201.5%20talks%20offer%20formula%20for%20ties.pdf"},{"id":"scmp-02","title":"As China's humanoid robots make strides, practical use is the next frontier","source":"SCMP","date":"26 Aug 2026","tags":["Technology & AI"],"summary":"This commentary argues China leads humanoid robotics but must now pivot from spectacle to practical deployment. The second World Humanoid Robot Games at Beijing's National Speed Skating Oval featured over 2,000 robots across 51 events, with Tien Kung machines running 400 metres in 38.15 seconds and 100 metres in 9.39 seconds, beating human records including Usain Bolt's. Hong Kong hosted the Asia-Pacific Broadcasting Union Robocon 2026. Chaotic robot football matches underscored that development remains early and error-prone. As competition shifts from remote control to full autonomy, high-speed 5G-advanced networks become indispensable, while combining movement with on-board AI computing strains battery technology. Huawei executive David Li noted this energy bottleneck is driving change. Real value lies in integrating machines into daily life.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/As%20China's%20humanoid%20robots%20make%20strides,%20practical%20use%20is%20the%20next%20frontier.pdf"},{"id":"scmp-03","title":"Asian shipper pays record US$5.3 million for Panama Canal access","source":"SCMP","date":"26 Aug 2026","tags":["Trade","Energy"],"summary":"South Korea-based SK Gas Ltd agreed to pay a record US$5.3 million to secure a Panama Canal transit slot on September 1, people familiar said, breaking the previous US$4.6 million high set earlier this month. The fee, set through the canal authority's auction, lets the liquefied petroleum gas tanker G. Spirit travel northbound. Demand to pass the waterway has soared since the Iran war upended global trade routes, with wait times reaching 11 days for vessels arriving without reservations, per Argus Media. The authority is tightening slot numbers and cargo limits from September amid likely drought. Recent auctions reflect \"significantly stronger demand,\" far above the pre-February median of around US$55,000. A brewing El Nino threatens the canal's freshwater levels.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/Asian%20shipper%20pays%20record%20US5.3%20million%20for%20Panama%20Canal%20access.pdf"},{"id":"scmp-04","title":"Can Taiwan's new F-16s level the playing field against the PLA's J-20 stealth fighters?","source":"SCMP","date":"26 Aug 2026","tags":["Defence","Geopolitics"],"summary":"Taiwan's first two US-made F-16 Block 70 fighter jets are expected to arrive within days, with analysts saying the upgraded aircraft could improve Taipei's odds against the PLA's fifth-generation J-20 stealth fighters. The jets are the first deliveries under a long-delayed NT$247.3 billion (US$7.76 billion) deal for 66 aircraft. Numbered 6727 and 6728, they left South Carolina on August 17, stopped in Hawaii and Guam, and are bound for Chihhang Air Base in Taitung, though typhoons could delay arrival. Lockheed Martin is building 46 single-seat and 10 twin-seat F-16V Block 70s, running two shifts to clear a backlog. The programme has slipped repeatedly since Washington's 2019 approval, due to relocation, Covid-19, software and flight-testing issues. Defence Minister Wellington Koo concedes the original target is unmet.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/Can%20Taiwan's%20new%20F-16s%20level%20the%20playing%20field%20against%20the%20PLA's%20J-20%20stealth%20fighters.pdf"},{"id":"scmp-05","title":"Canada hits US goods with tariffs of up to 50% as trade war escalates","source":"SCMP","date":"26 Aug 2026","tags":["Trade","Geopolitics"],"summary":"Canada announced retaliatory tariffs of up to 50% on US$19.94 billion (C$27.6 billion) of American goods on Tuesday, escalating its trade war with Washington days after negotiations collapsed and the Trump administration imposed sweeping new duties. Effective September 8, the tariffs apply to over 700 categories at 15, 25 or 50% rates, covering steel, aluminium, agricultural equipment, appliances, clothing, cheese, seafood, cosmetics and electronics. Existing steel and aluminium tariffs double from 25 to 50%; vehicle counter-tariffs stay at 25%. Finance Minister Francois-Philippe Champagne said measures match US duties \"dollar for dollar, rate for rate.\" Ottawa unveiled US$5.42 billion in loans and worker aid, having provided over US$21.7 billion in tariff support since 2025. Washington had hit US$20 billion of Canadian goods using Section 338.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/Canada%20hits%20US%20goods%20with%20tariffs%20of%20up%20to%2050%20as%20trade%20war%20escalates.pdf"},{"id":"scmp-06","title":"China seeks public tips on procurement violations as PLA Rocket Force probe continues","source":"SCMP","date":"26 Aug 2026","tags":["Defence","Politics"],"summary":"China has called for public reports of suspected procurement corruption in the People's Liberation Army Rocket Force (PLARF) as an anti-corruption campaign into the strategic missile branch continues. A Monday notice on the PLA's procurement website invites suppliers, bidding agencies, evaluation experts and military personnel to report violations across goods, services, construction and medical supplies, spanning all procurement stages. Reports are accepted by phone and post until November 30, 2026, with no time limit on when violations occurred. Similar appeals targeted the Air Force in December 2025 and Cyberspace Force in August 2024. The campaign accompanies a sweeping purge that removed five of seven Central Military Commission members. All four PLARF commanders since 2015 have faced investigations, including first commander Wei Fenghe.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/China%20seeks%20public%20tips%20on%20procurement%20violations%20as%20PLA%20Rocket%20Force%20probe%20continues.pdf"},{"id":"scmp-07","title":"China taps high-altitude winds for power generation by flying craft to 4,000m","source":"SCMP","date":"26 Aug 2026","tags":["Energy","Technology & AI"],"summary":"China has flown an airborne wind energy system to 4,000 metres (13,123 feet) and generated electricity from the sky, in what state broadcaster CCTV called a world first. The prototype S4000 craft completed a full cycle - ascent, station-keeping, power generation and recovery - at a northwestern China test site. Roughly the length of a Boeing 747 and resembling a helium-filled airship, it carries lightweight turbines to harness stronger high-altitude winds, sending power to the ground via a tether, and can relocate quickly to remote areas. Developed by Beijing start-up Sawes Energy Technology with Tsinghua University and the Chinese Academy of Sciences, earlier S1500 and S2000 models drew nearly 500 million yuan (US$74.3 million) in orders. At 9,000 metres, systems could generate power at 0.03 yuan per kilowatt-hour.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/China%20taps%20high-altitude%20winds%20for%20power%20generation%20by%20flying%20craft%20to%204,000m.pdf"},{"id":"scmp-08","title":"China's J-16s face off against Egypt's Rafales in combat drills as Iran war rumbles on","source":"SCMP","date":"26 Aug 2026","tags":["Defence","Geopolitics"],"summary":"Chinese J-16 fighter jets conducted combat training with Egyptian counterparts in the second China-Egypt \"Eagles of Civilisation\" joint air force exercise, launched Saturday and running until early next month, against the backdrop of the US-Iran war. The PLA Air Force deployed J-16 fighters, YU-20 tankers, KJ-500 early-warning aircraft and Z-20 helicopters, flying more than 6,000km over nine hours across four countries to reach Egypt, where they landed August 21 after aerial refuelling. On the first training day, J-16s conducted one-on-one and two-on-two close- and medium-range combat drills against French-made Rafales - the J-16's first deployment outside China. CCTV said the exercise tested long-range force projection and rapid deployment. Egypt maintains neutrality in the conflict; China has urged a sustained ceasefire.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/China's%20J-16s%20face%20off%20against%20Egypt's%20Rafales%20in%20combat%20drills%20as%20Iran%20war%20rumbles%20on.pdf"},{"id":"scmp-09","title":"China's anti-corruption legal framework is about to extend beyond its borders","source":"SCMP","date":"26 Aug 2026","tags":["Politics"],"summary":"China's top legislature has reviewed a draft Anti-Cross-Border Corruption Law during the 24th session of the Standing Committee of the 14th National People's Congress, expanding Beijing's anti-graft framework beyond its borders. Submitted Tuesday for its first reading, the bill - six chapters and 47 articles - establishes principles, scope and national positioning, and codifies a decade of practices to close jurisdictional loopholes, target offshore financial crimes, ease evidence collection, and enable fugitive repatriation and asset recovery. It obliges domestic firms operating abroad to adopt rigorous compliance standards. State agency Xinhua called it vital to protect national interests and promote compliant overseas business. NPC Standing Committee Chairman Zhao Leji had earlier emphasised enacting it. The text is not yet public, part of Xi Jinping's wide-ranging campaign.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/China's%20anti-corruption%20legal%20framework%20is%20about%20to%20extend%20beyond%20its%20borders.pdf"},{"id":"scmp-10","title":"Could Mecca defence pact be first step to new Middle East order?","source":"SCMP","date":"26 Aug 2026","tags":["Geopolitics","Defence"],"summary":"This commentary examines whether the Mecca security pact between Saudi Arabia, Turkey and Pakistan - which treats an attack on one as an attack on all - could herald a new Middle East order shaped by regional states. The real message, it argues, targets Washington: if being a US ally offers no immunity, there is little point waiting for American security guarantees. Notably, neither Trump nor Beijing issued a formal statement, casting doubt on Trump's social-media claim of being \"very happy.\" The three nations' needs appear complementary - wealthy but militarily weak Saudi Arabia, ambitious Turkey and nuclear-armed Pakistan seeking finance - cemented by Sunni faith. Yet Pakistan and Turkey are not strictly Middle Eastern, and major powers, including a protective US posture toward Israel, will not walk away.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/Could%20Mecca%20defence%20pact%20be%20first%20step%20to%20new%20Middle%20East%20order.pdf"},{"id":"scmp-11","title":"DeepSeek leads surge in low-cost Chinese open-weight models on US platform","source":"SCMP","date":"26 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Usage of Chinese open-weight AI models hit a record high on US developer platform Vercel, driven largely by DeepSeek's latest lightweight model, as demand for Anthropic's costly Fable 5 stalls. Open-weight models accounted for 54% of token volume on Vercel's AI Gateway on Tuesday, surpassing proprietary models' 46%, and peaked at 62% Saturday - up sharply from 28% on June 24. DeepSeek-V4-Flash was the most-used model, with Chinese models dominating the top five, including StepFun's Step 3.7 Flash and Zhipu's GLM-5.2; OpenAI's GPT-5.6 Luna ranked third. Analysts said developers increasingly choose cheaper open models for production and autonomous agents. Customizability raised security concerns, with TeamT5 reporting Beijing-linked groups using DeepSeek to automate tasks and develop malware.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/DeepSeek%20leads%20surge%20in%20low-cost%20Chinese%20open-weight%20models%20on%20US%20platform.pdf"},{"id":"scmp-12","title":"Divergent results for Apple suppliers highlight memory price squeeze ahead of new iPhone","source":"SCMP","date":"26 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Two major Chinese Apple suppliers posted divergent first-half results, underscoring how soaring memory prices are squeezing profits ahead of new iPhone releases. Lens Technology, a smartphone glass-screen maker, saw net income nearly halve to 577 million yuan (US$85.8 million) as revenue fell 12.4% to 28.9 billion yuan, blaming memory costs and forced production cutbacks at its Xiangtan factory. Lens is banking on ultra-thin glass and 3D covers for an upcoming foldable device with Apple to lift second-half sales. Rising memory prices, driven by AI demand, are expected to cut global smartphone shipments 14% this year, though foldables may rise 21% on Apple's autumn entrance, per Counterpoint. By contrast, Luxshare Precision's revenue surged 40% to 174.5 billion yuan by diversifying beyond smartphones.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/Divergent%20results%20for%20Apple%20suppliers%20highlight%20memory%20price%20squeeze%20ahead%20of%20new%20iPhone.pdf"},{"id":"scmp-13","title":"For states, being part of everything doesn't mean being part of nothing","source":"SCMP","date":"26 Aug 2026","tags":["Geopolitics","Politics"],"summary":"This commentary responds to reports that the Trump administration plans to pressure dozens of countries to choose sides in the US-China AI race, warning that those joining Beijing's cooperation framework would be excluded from the US-led coalition - \"to be part of everything is to be part of nothing.\" The author argues the number of institutions a country joins reveals little about its reliability; the opposite of commitment is breach, not multiplicity. It distinguishes obligation-based exclusivity, where two specific duties genuinely conflict (a customs union, incompatible military commitments, classified-system access), from identity-based exclusivity, where a country becomes suspect merely for joining a rival forum. The first protects cooperation; the second protects the dominance of whoever designed the club. Countries like Singapore and Vietnam belong to both RCEP and CPTPP.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/For%20states,%20being%20part%20of%20everything%20doesn't%20mean%20being%20part%20of%20nothing.pdf"},{"id":"scmp-14","title":"Gold strategy: how a Chinese vault network could bolster yuan's role","source":"SCMP","date":"26 Aug 2026","tags":["Finance & Markets"],"summary":"China is building a global network of gold vaults and accelerating central-bank reserve buying to promote the yuan's international role, an S&P Global Ratings report said Tuesday. By anchoring yuan trades to gold through Hong Kong and new vaults, Beijing adds convertibility to its currency. S&P's Charles Chang said convertibility to tradeable gold changes the picture for renminbi users. China's first offshore gold delivery vault launched in Hong Kong last year with Bank of China (Hong Kong) as operator, alongside two new yuan-denominated gold contracts. Candidate cities include Singapore, Kuala Lumpur, Dubai, Riyadh and Moscow. Firms like Zijin Mining and Shandong Gold should expand fast after Beijing reclassified gold as a \"strategic mineral\" in 2025. China's reserves reached 76.08 million ounces, a 21st straight month of accumulation.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/Gold%20strategy%20how%20a%20Chinese%20vault%20network%20could%20bolster%20yuan's%20role.pdf"},{"id":"scmp-15","title":"Hong Kong exports jump 50.7% in July, driven by growth in AI-related electronics","source":"SCMP","date":"26 Aug 2026","tags":["Trade","Technology & AI"],"summary":"Hong Kong's exports surged 50.7% year on year in July, driven by \"impressive growth\" in AI-related electronic products, with the government expecting robust demand to continue despite geopolitical risks. Provisional figures showed exports jumped to a record HK$672.5 billion (US$86.2 billion), following a 53.4% rise in June - the fourth-highest growth in recent decades. Imports rose 41% to HK$677.4 billion, leaving a HK$4.9 billion trade deficit. Exports to Asia grew 54.6%, with a 95.7% jump to Taiwan, 77.7% to Vietnam and 63.1% to Thailand; exports to the United States rose 92.9%. Electrical machinery and office/data-processing machines led gains, with office-machine exports surging 106.5% to HK$54.3 billion. Officials warned of Middle East risks and rising protectionism.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/Hong%20Kong%20exports%20jump%2050.7%20in%20July,%20driven%20by%20growth%20in%20AI-related%20electronics.pdf"},{"id":"scmp-16","title":"Hong Kong's property, financial markets face test under cross-border anti-corruption law","source":"SCMP","date":"26 Aug 2026","tags":["Finance & Markets","Politics"],"summary":"China's deliberation on a sweeping cross-border anti-corruption law may ripple through Hong Kong's financial and property markets as Beijing seeks harsher punishments and broadens scrutiny of wealth transferred overseas. The draft was submitted Tuesday to the national legislature's standing committee. Lawyer Karen Cheung of HFW said high-value assets - luxury goods, prime property, and complex corporate and trust structures - may face closer scrutiny when relevant to mainland investigations. For decades Hong Kong drew affluent mainlanders building wealth through listings and acquisitions. The law follows a tax crackdown on offshore trusts that hit AIA shares. China punished 983,000 officials for corruption last year, three times the 2013 number of senior officials penalised. The financial sector is a key focus, with ex-CSRC chairman Yi Huiman investigated.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/Hong%20Kong's%20property,%20financial%20markets%20face%20test%20under%20cross-border%20anti-corruption%20law.pdf"},{"id":"scmp-17","title":"Hottest ocean temperature recorded as 'super' El Nino forms","source":"SCMP","date":"26 Aug 2026","tags":["Environment"],"summary":"Scientists recorded the highest temperature ever measured in the world's oceans as climate change combined with a powerful El Nino in the tropical Pacific. The global average sea-surface temperature hit a record 21.1 degrees Celsius (70 Fahrenheit) on August 22, according to Europe's Copernicus agency, which has tracked the metric daily since 1979, beating the previous 21.09-degree record from March 2024. Copernicus's Samantha Burgess said El Nino is adding heat atop decades of human-driven warming, raising risks to marine ecosystems and coastal communities. Higher temperatures fuel sea-level rise, intensify storms and reduce oceans' capacity to absorb carbon dioxide. The August record is alarming because temperatures usually peak in March-April. Britain's Adam Scaife forecast the biggest El Nino in over a century, peaking above 3 degrees.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/Hottest%20ocean%20temperature%20recorded%20as%20'super'%20El%20Nino%20forms.pdf"},{"id":"scmp-18","title":"Jack Ma buys HK$600 million of Alibaba shares, signalling AI confidence: sources","source":"SCMP","date":"26 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Alibaba founder Jack Ma bought more than HK$600 million of the company's Hong Kong-listed shares on consecutive days, signalling confidence in its long-term AI prospects, people familiar said. Chairman Joe Tsai and CEO Eddie Wu Yongming spent a cumulative HK$202 million over two days, with Tsai buying about HK$82 million Tuesday after HK$80 million Monday, and Wu adding roughly HK$40 million. The purchases followed a new share issuance announced Sunday - Alibaba's first since its 2019 Hong Kong listing - one of the biggest fundraisings by a Chinese firm dedicated to AI. The placement met its HK$80 billion benchmark within hours, drew US$28 billion in demand nearly three times oversubscribed, including US$6 billion from sovereign wealth funds. Shares rose 1.5% to HK$114.20.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/Jack%20Ma%20buys%20HK600%20million%20of%20Alibaba%20shares,%20signalling%20AI%20confidence%20sources.pdf"},{"id":"scmp-19","title":"No immunity: how Xi's anti-corruption fighters are zeroing in on fresh targets","source":"SCMP","date":"26 Aug 2026","tags":["Politics"],"summary":"In the second part of an SCMP data project on Xi Jinping's anti-graft campaign, William Zheng examines how it now targets officials once thought shielded - retired cadres, local bosses and even investigators themselves. An SCMP tally of senior officials targeted between 2013 and 2025 found 60% were taken down while in regional government roles, reflecting a focus outside the capital, with a median age of 60, the usual deputy-provincial retirement age. The analysis covered officials pursued by the Communist Party's Central Commission for Discipline Inspection, mostly \"centrally managed cadres\" at deputy-ministerial rank or above under the Central Organisation Department. The drive first peaked in 2014, when 40 senior officials were ensnared, and agencies increasingly net officials long after retirement.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/No%20immunity%20how%20Xi's%20anti-corruption%20fighters%20are%20zeroing%20in%20on%20fresh%20targets.pdf"},{"id":"scmp-20","title":"Singapore's island merger plan fuels nuclear power speculation","source":"SCMP","date":"26 Aug 2026","tags":["Southeast Asia","Energy"],"summary":"Singapore's plan to merge several islands off its southwest coast into a new hub for industry, defence and \"new power generation infrastructure\" has fuelled speculation it could one day host a nuclear power plant. The city state is studying advanced nuclear technologies, including small modular reactors, for a long-term net-zero system, but has not decided whether or where to deploy nuclear. Prime Minister Lawrence Wong said during the National Day Rally that Singapore would, over coming decades, merge Bukom, Sudong, Semakau and smaller islands, similar to Jurong Island, to support advanced manufacturing, military uses and new power generation. Singapore aims for net-zero emissions by 2050 and will undergo an IAEA Integrated Nuclear Infrastructure Review in 2027. Experts call nuclear one of several options amid severe space constraints.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/Singapore's%20island%20merger%20plan%20fuels%20nuclear%20power%20speculation.pdf"},{"id":"scmp-21","title":"Super-rich losing millions as some Hong Kong trophy homes sell at painful discounts","source":"SCMP","date":"26 Aug 2026","tags":["Finance & Markets","Society"],"summary":"Hong Kong has seen a string of cut-price deals for super-luxury homes as financially pressured owners accept steep losses to exit the market, even as trophy-home demand stays strong. A Bel-Air house in Pok Fu Lam sold for HK$138 million (US$17.6 million), about HK$37 million below its 2018 purchase price - a more than 20% loss. At The Morgan on Conduit Road, a nearly 4,000 sq ft home sold for HK$190 million, 45% below the HK$344 million paid in 2018. A Mount Nicholson duplex fetched about HK$550 million, down 7.3% from HK$593 million in 2017. Deloitte's Glen Ho noted fewer bank-owned luxury homes selling at a loss this year, with the residential market more stable than the commercial sector as buyers returned in the first half.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/Super-rich%20losing%20millions%20as%20some%20Hong%20Kong%20trophy%20homes%20sell%20at%20painful%20discounts.pdf"},{"id":"scmp-22","title":"Trump says China is driving anger at US data centres. These residents disagree","source":"SCMP","date":"26 Aug 2026","tags":["Technology & AI","Society"],"summary":"US President Donald Trump and Republican lawmakers attribute community pushback against data centres to Chinese influence, but residents near an AI facility in Sterling, Virginia, disagree. Lindsay Shaw describes constant industrial hum, blazing security lights, diesel fumes and eight gas turbines added to power the centre while it awaits grid connection. She and neighbours say concerns stem from direct experience - noise, emissions and broken promises - not Chinese propaganda; much opposition predates the allegations. Several US tech-industry-linked reports claim Beijing manipulates US AI and technology debates, but they do not establish that China created or meaningfully drove local pushback. The article highlights a distinction in the politicised US-China AI race: foreign actors may exploit genuine domestic grievances without creating them.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/Trump%20says%20China%20is%20driving%20anger%20at%20US%20data%20centres.%20These%20residents%20disagree.pdf"},{"id":"scmp-23","title":"US 'economic asphyxiation' of Iran sends Tehranites queuing for petrol","source":"SCMP","date":"26 Aug 2026","tags":["Geopolitics","Energy"],"summary":"Long queues formed at Tehran petrol stations Tuesday after the United States announced fresh sanctions aimed at pressuring Iran, six months into a war that has stalemated militarily with peace talks stalled and most traffic through the Strait of Hormuz blocked. US Treasury Secretary Scott Bessent outlined plans for the \"economic asphyxiation\" of Iran, vowing to \"sever every economic lifeline\" of the regime. Though leaders shrug off sanctions endured for decades, residents fear the pinch amid sky-high inflation that fuelled an anti-government protest movement peaking in January, met by a crackdown rights groups say killed thousands. Some Tehranites warn fresh economic pressure could spark renewed protests. Iran's recent executions drew Trump's condemnation; Bessent warned uncooperative countries would \"share in the isolation.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/US%20'economic%20asphyxiation'%20of%20Iran%20sends%20Tehranites%20queuing%20for%20petrol.pdf"},{"id":"scmp-24","title":"US Treasury bond buy-back reinforces gold debasement trade as Jackson Hole meeting looms","source":"SCMP","date":"26 Aug 2026","tags":["Finance & Markets"],"summary":"The US Treasury's decision to boost buy-backs of long-maturity bonds is strengthening the gold debasement trade as banks turn bullish ahead of the Federal Reserve's Jackson Hole meeting. Gold hit a three-month high of US$4,698 an ounce Tuesday, extending a 5.1% weekly gain after Treasury Secretary Scott Bessent unveiled a repurchase programme likely to exceed US$4 billion, reviving fiscal-stress and dollar-debasement concerns. Morgan Stanley predicted gold reaching US$5,000 by 2027, while Citigroup raised its three-month target to US$4,800. A dovish tone from Fed chair Kevin Warsh at Jackson Hole would add impetus. ING's Ewa Manthey said larger buy-backs refocused attention on government borrowing and fiscal credibility. US federal debt has topped US$40 trillion. Gold has whipsawed this year amid the oil shock.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/US%20Treasury%20bond%20buy-back%20reinforces%20gold%20debasement%20trade%20as%20Jackson%20Hole%20meeting%20looms.pdf"},{"id":"scmp-25","title":"US admits defeat in China minerals race. Can Brazil turn panic into processing power?","source":"SCMP","date":"26 Aug 2026","tags":["Trade","Geopolitics"],"summary":"Brazilian Mines and Energy Minister Alexandre Silveira revealed that Donald Trump and his team conceded during May White House talks that the United States had lost the critical minerals race to China, covering electrification, mineral separation and the defence industry. As the US pours billions into Brazilian mines - including a major investment in a rare earth mine - Brasilia insists it will not remain a mere raw-ore exporter, pushing to bring foreign capital into domestic processing. Brazil holds the world's second-largest rare earth reserves and one operating mine, while China controls about 91% of global separation and refining and 94% of magnet production, per the IEA. ICMM CEO Rohitesh Dhawan warned losing 30% of magnet supply would wipe US$600 billion, or 2.2% of US GDP, off overnight.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/US%20admits%20defeat%20in%20China%20minerals%20race.%20Can%20Brazil%20turn%20panic%20into%20processing%20power.pdf"},{"id":"scmp-26","title":"US starts returning staff to Middle East missions after Iran war evacuations, sources say","source":"SCMP","date":"26 Aug 2026","tags":["Geopolitics","Defence"],"summary":"The Trump administration is starting to return staff to some Middle East diplomatic missions evacuated or downsized amid tensions with Iran, two people familiar told Reuters, signalling Washington sees lower near-term escalation risk. Posts in Lebanon, Israel, Saudi Arabia and Baghdad are among those where staff will return, with family members allowed back in Riyadh. Some embassies will initially operate at no more than 85% of authorised staffing. The US pulled staff after joint US-Israeli strikes on Iran began February 28; missions in Saudi Arabia and Kuwait came under fire. Heavy fighting has subsided, though a US naval blockade persists and the Strait of Hormuz remains shut. Per the New York Times, posts in Iraq, Kuwait and Bahrain would be capped at 75%.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/US%20starts%20returning%20staff%20to%20Middle%20East%20missions%20after%20Iran%20war%20evacuations,%20sources%20say.pdf"},{"id":"scmp-27","title":"US troops a liability for some Kuwaitis amid Iran fury: 'we're paying the price'","source":"SCMP","date":"26 Aug 2026","tags":["Geopolitics","Defence"],"summary":"Some Kuwaitis increasingly view US troops as a liability rather than an asset six months into the US-Iran war, as their presence puts Kuwait in Tehran's line of fire. Since the conflict erupted in late February with US-Israeli strikes on Iran, Iran and its allies have hammered Kuwait with recurrent barrages targeting civilian infrastructure, water desalination plants, energy installations and bases hosting American troops. Iran's closure of the Strait of Hormuz has strained oil-reliant Kuwait economically. Political analyst Ghanim Alsulaimani, who still backs the US, said Iran aims to use Gulf states as a theatre to pressure Washington. Others, speaking anonymously amid limited free expression, question the foreign troop presence and Trump's decision to continue the war: \"we're paying the price.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/US%20troops%20a%20liability%20for%20some%20Kuwaitis%20amid%20Iran%20fury%20'we're%20paying%20the%20price'.pdf"},{"id":"scmp-28","title":"Why was China's response to North Korea's latest missile launches so muted?","source":"SCMP","date":"26 Aug 2026","tags":["Geopolitics","Defence"],"summary":"China's muted response to North Korea's latest missile launches - more than 10 short-range ballistic missiles fired just hours after Foreign Minister Wang Yi left Seoul - underscores how Beijing prioritises Pyongyang's stability over near-term denuclearisation, analysts say. South Korea and Japan condemned the launch as a provocation, but China's foreign ministry said only that it had \"noted the reports.\" During his two-day Seoul visit, his first in nearly five years, Wang urged South Korea to pursue \"genuine strategic autonomy,\" avoid taking sides between China and the US, and seek \"peaceful coexistence\" with the North, while calling on Washington to abandon its \"hostile policy.\" Analyst Lee Seong-hyon said the trip aided diplomatic stabilisation but could not substitute for sovereign deterrence. Beijing systematically omits \"denuclearisation\" from readouts.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20SCMP/Why%20was%20China's%20response%20to%20North%20Korea's%20latest%20missile%20launches%20so%20muted.pdf"}]},"2026-08-27":{"date":"2026-08-27","dayOfWeek":"Thursday","totalArticles":88,"sourceCounts":{"WSJ":20,"ST":28,"BT":17,"SCMP":23},"executiveDigest":"Nvidia's blowout quarter - with AI-chip demand 'getting even hotter' - powered the AI trade even as the skeptics piled up: Bill Gates warned in a 5,784-word note that 'there is no plan', WSJ said 'Microsoft is leaving investors flying blind on its AI', and Meta agreed to pay US$17 billion to settle a teen social-media case. Oil fell as Iran and Oman reached a Hormuz deal whose reopening 'hinges on US compliance', and Trump declared 'Mission Accomplished' as the war dragged on. Markets braced for Warsh's Jackson Hole test with the Fed's preferred gauge stil
