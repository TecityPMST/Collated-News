Environment"], "summary": "Bougainville President Ishmael Toroama condemned an attack on a mining camp at Panguna and said his government would press ahead with plans to reopen the long-shuttered copper mine despite opposition. The Panguna mine, once among the world's biggest open-pit copper operations, has been closed for nearly three decades after conflict that devastated the autonomous Papua New Guinea region. Personnel were assaulted and equipment destroyed at the camp, Toroama's office said, without detailing injuries. Police and community leaders are working to identify suspects. The reopening is politically and economically significant as Bougainville pursues independence, with supporters citing jobs and revenue, but it remains contentious over landowner consent, environmental safeguards and benefit-sharing. Toroama said the incident would not weaken the government's resolve.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20ST/Attack%20hits%20Panguna%20camp%20as%20Bougainville%20backs%20copper%20mine%20restart.pdf"}, {"id": "st-14sep-04", "title": "BRICS nations call for 'maximum restraint' in shadow of worsening Mid-East war", "source": "ST", "date": "14 Sep 2026", "tags": ["Geopolitics", "Energy"], "summary": "The 11-nation BRICS group, including China, Russia, Iran and India, called for \"maximum restraint\" in the Middle East at a New Delhi summit on Sept 12, issuing a joint statement after overcoming divisions. The statement condemned attacks on civilian infrastructure and IAEA-safeguarded nuclear facilities and stressed maintaining trade, supply chains and energy flows. Host India's Prime Minister Narendra Modi steered rivals toward consensus despite competing positions; Chinese President Xi Jinping said the war served no one's interests. The summit drew Xi, Putin and Iran's Pezeshkian. It came as oil prices surged near US$110 amid supply worries and Saudi Arabia closed a key pipeline. The declaration marked a diplomatic win for Modi balancing ties with Iran, the UAE, US and Israel.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20ST/BRICS%20nations%20call%20for%20'maximum%20restraint'%20in%20shadow%20of%20worsening%20Mid-East%20war.pdf"}, {"id": "st-14sep-06", "title": "For China, a mock AI attack on WeChat signals a dangerous new era", "source": "ST", "date": "14 Sep 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "A tool built with artificial intelligence by a small California security firm, Calif, showed it could breach millions of WeChat accounts within hours, alarming Chinese analysts because the app is woven into daily communications, government services and payments for 1.4 billion monthly users. Named WeWorm, it could hijack an account, call contacts and spread phone-to-phone without anyone answering. One Fudan University scholar likened it to \"a new kind of nuclear weapon.\" The discovery adds urgency to expected Sept 24 talks between Trump and Xi on AI security and trade. It follows an Anthropic report describing misuse of its Claude models, including by a Chinese arms maker. Experts warn AI is blurring the line between cyber offence and defence.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20ST/For%20China%2C%20a%20mock%20AI%20attack%20on%20WeChat%20signals%20a%20dangerous%20new%20era.pdf"}, {"id": "st-14sep-07", "title": "French must come first, far-right leader Marine Le Pen says at presidential campaign launch", "source": "ST", "date": "14 Sep 2026", "tags": ["Politics", "Society"], "summary": "Far-right leader Marine Le Pen, a frontrunner for the French presidency, launched her fourth presidential bid on Sept 13 in her stronghold of Henin-Beaumont, defending her long-held principle of \"national priority.\" Speaking seven months before the polls to around 2,000 supporters, Le Pen, 58, said French people would \"have priority in their own country,\" regardless of skin colour, religion or origin, with preferential access to social housing. She pledged to boost housing supply and scrap various environmental regulations. Polls show her well ahead in a first round, giving her a strong chance at the Elysee in 2027. She did not address recent controversies, including reported differences with party head Jordan Bardella, or her graft conviction now under appeal.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20ST/French%20must%20come%20first%2C%20far-right%20leader%20Marine%20Le%20Pen%20says%20at%20presidential%20campaign%20launc.pdf"}, {"id": "st-14sep-08", "title": "Hong Kong homes flattened for $36b high-tech hub", "source": "ST", "date": "14 Sep 2026", "tags": ["Technology & AI", "Society"], "summary": "An area roughly a third of Hong Kong, including villages, wetlands and farmland, is being converted into the \"Northern Metropolis,\" an ambitious high-tech hub aimed at deepening integration with mainland China. Touted as a \"new economic engine\" for around 2.5 million residents and 650,000 jobs, it will link Hong Kong with Macau and nine Greater Bay Area cities. But residents like 71-year-old Chan Yuk Tong face losing ancestral homes, and environmental groups warn of destruction to wildlife and communities. The government says it will cost at least HK$224 billion (S$36.2 billion), with S&P estimating over HK$360 billion, projecting 13 per cent of GDP over 20 years. At least 25 villages will be demolished. Critics question its scale and Hong Kong's tech relevance versus Shenzhen.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20ST/Hong%20Kong%20homes%20flattened%20for%2036b%20high-tech%20hub.pdf"}, {"id": "st-14sep-09", "title": "Hormuz meeting with Iran and Gulf nations postponed, Oman says", "source": "ST", "date": "14 Sep 2026", "tags": ["Geopolitics", "Energy"], "summary": "A meeting planned for Sept 14 between Iran and several Gulf nations on creating a temporary shipping lane through the Strait of Hormuz has been postponed, Oman's foreign minister Badr Albusaidi said, citing \"the interests of consensus.\" Iran said the delay came at the request of regional countries. Tehran had planned to unveil a shipping-lane agreement after diplomatic activity, but it remained unclear which nations would attend; Bahrain ruled out participating, citing Iranian-backed attacks. Brent crude has topped US$105 a barrel amid renewed tensions. US Energy Secretary Chris Wright downplayed the deal's chances, estimating 10 million barrels a day still transit Hormuz. Saudi Aramco shares fell after the kingdom closed its East-West pipeline due to drone attacks by Iraq-based militants.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20ST/Hormuz%20meeting%20with%20Iran%20and%20Gulf%20nations%20postponed%2C%20Oman%20says.pdf"}, {"id": "st-14sep-10", "title": "Houthis' Yemen advance leaves Gulf states with uncomfortable choice", "source": "ST", "date": "14 Sep 2026", "tags": ["Geopolitics", "Energy"], "summary": "The Houthi capture of Yemen's Red Sea coastline is reshaping the Gulf's balance of power, strengthening Iran's hand and confronting Saudi Arabia with a difficult choice: absorb mounting costs or seek accommodation with Tehran. By securing a position overlooking Bab el-Mandeb, the Iran-aligned group threatens Saudi oil exports rerouted from the Strait of Hormuz. Analysts say Tehran and the Houthis aim to raise oil prices and force Gulf states to negotiate. Riyadh closed the pipeline carrying rerouted crude on Sept 11 after an attack. Trump reportedly refused a Saudi request to strike the Houthis. A postponed Oman meeting underscored disagreements. Analysts say geography makes Iran an unavoidable player, potentially pushing Gulf states toward parallel diplomacy less dependent on Washington.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20ST/Houthis'%20Yemen%20advance%20leaves%20Gulf%20states%20with%20uncomfortable%20choice.pdf"}, {"id": "st-14sep-11", "title": "Inside the snowballing conversations at AI companies about a doomsday", "source": "ST", "date": "14 Sep 2026", "tags": ["Technology & AI", "Society"], "summary": "The public resignation of Anthropic researcher Jacob Coxon, who said AI firms were \"gambling with our lives,\" has triggered snowballing internal conversations at leading AI companies about existential risks. Employees at Anthropic, OpenAI, Meta and Google convened in chats and private dinners, with some urging executives to pause development until proper safeguards exist. The tensions expose competing priorities: Anthropic and OpenAI plan blockbuster IPOs and fear falling behind Chinese rivals or facing antitrust scrutiny if they coordinate slowdowns. OpenAI's Sam Altman said he was willing to decelerate alongside rivals; Anthropic's Dario Amodei published an essay urging prudence. Some researchers put the chance AI could \"kill all humans\" within a decade above 10 per cent. The outpouring has drawn bipartisan Congressional attention.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20ST/Inside%20the%20snowballing%20conversations%20at%20AI%20companies%20about%20a%20doomsday.pdf"}, {"id": "st-14sep-12", "title": "Lithuania closes Vilnius airport, NATO summons jets in response to possible drone", "source": "ST", "date": "14 Sep 2026", "tags": ["Defence", "Geopolitics"], "summary": "Lithuania closed Vilnius airport on Sept 13 and NATO summoned at least one fighter jet in response to a possible sighting of a drone in Lithuanian airspace, the country's National Crisis Management Centre said. The air alert was lifted and the airport reopened after about an hour. A jet was summoned from Siauliai in northern Lithuania, where the Italian air force is currently based as part of the NATO Baltic Air Defence mission. Countries along NATO's eastern edge have reported a series of drones straying into their airspace, linked to the conflict stemming from Russia's 2022 full-scale invasion of Ukraine. The Vilnius marathon, taking place in the capital at the time, was not interrupted, organisers said.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20ST/Lithuania%20closes%20Vilnius%20airport%2C%20NATO%20summons%20jets%20in%20response%20to%20possible%20drone.pdf"}, {"id": "st-14sep-13", "title": "North Korea held live-fire drills involving artillery and missiles, KCNA says", "source": "ST", "date": "14 Sep 2026", "tags": ["Defence", "Geopolitics"], "summary": "North Korea held a live-fire drill to test long-range artillery and missile units of its army, state media KCNA reported on Sept 14. The \"joint firepower attack drill\" on Sept 12 involved five army units and tested several weapon systems, including various attack drones, tactical cruise missiles, tactical ballistic missiles and large-calibre multiple rocket launchers. KCNA, citing an artillery director, said the drill would boost troop morale and improve capabilities to \"completely collapse the enemy\" whenever ordered. South Korea's Joint Chiefs of Staff said on Sept 12 that North Korea fired several short-range ballistic missiles toward the sea off its east coast. That was followed by a joint military exercise among South Korea, Japan and the United States.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20ST/North%20Korea%20held%20live-fire%20drills%20involving%20artillery%20and%20missiles%2C%20KCNA%20says.pdf"}, {"id": "st-14sep-14", "title": "Russia hits Ukrainian-Polish border area, Kyiv says", "source": "ST", "date": "14 Sep 2026", "tags": ["Defence", "Geopolitics"], "summary": "A Russian drone struck near the Ukrainian-Polish border in the small town of Yahodyn overnight, Ukraine's Foreign Minister Andrii Sybiha said on Sept 13. He corrected an earlier statement that the drone hit the border crossing itself. \"Russia's barbaric strikes at the Ukraine-Poland border in Yahodyn are not just a continuation of its attacks on our state borders,\" Sybiha said, calling it \"Putin's terror knocking directly on the doors of the EU and NATO.\" A Polish border guard spokeswoman said the attack site was 800 metres from the Polish border, and the crossing was temporarily closed. Ukrainian Railways said a drone struck a passenger train locomotive 2km from the border in Volyn region; no one was injured. The crossings deliver much allied aid.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20ST/Russia%20hits%20Ukrainian-Polish%20border%20area%2C%20Kyiv%20says.pdf"}, {"id": "st-14sep-15", "title": "Saudi pipeline outage threatens loss of 4% of global oil supply", "source": "ST", "date": "14 Sep 2026", "tags": ["Energy", "Finance & Markets"], "summary": "Saudi Arabia will run out of oil stocks for export within days unless it restarts its major east-west pipeline to the Red Sea, risking a loss of up to 4 per cent of global supply, buyers and traders told Reuters. Drone attacks forced the pipeline's shutdown on Sept 11, with repair estimates ranging from days to five or six weeks. The route has spared Saudi Arabia from the wartime Strait of Hormuz shutdown by rerouting around 4 million barrels per day to Yanbu, which now has stocks for just five to seven days. A further decline would worsen a supply crunch that has pushed fuel prices to record highs and US bond yields to post-2008 levels. Saudi output fell to a three-decade low in August.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20ST/Saudi%20pipeline%20outage%20threatens%20loss%20of%204%20of%20global%20oil%20supply.pdf"}, {"id": "st-14sep-16", "title": "Singapore PC prices surge as growing AI infrastructure competes for components", "source": "ST", "date": "14 Sep 2026", "tags": ["Technology & AI", "Society"], "summary": "Consumers buying a new PC in Singapore face sticker shock, with IDC data showing average prices surged up to 40 per cent in the second quarter of 2026 from a year earlier, driven by component shortages. Computer memory, storage and graphics cards are in short supply as global data-centre expansion for AI consumes the bulk of these components. Regular laptop prices rose 26 per cent to $1,650 and gaming desktops jumped 39 per cent to nearly $1,860. A severe RAM shortage, dubbed \"RAMageddon,\" is the biggest driver, with 32GB DDR5 RAM nearly quadrupling in price at Sim Lim Square. IDC expects prices to stay high through 2027. Retailers reported PC sales down 20 to 80 per cent, with meaningful relief unlikely before 2028.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20ST/Singapore%20PC%20prices%20surge%20as%20growing%20AI%20infrastructure%20competes%20for%20components.pdf"}, {"id": "st-14sep-17", "title": "Singapore's great mall makeover: Will investors reap the rewards?", "source": "ST", "date": "14 Sep 2026", "tags": ["Finance & Markets", "Society"], "summary": "Singapore's shopping malls are being reinvented, with Orchard Road making room for offices and suburban malls undergoing facelifts and tenant revamps, adding pickleball courts, climbing walls and F&B anchors. These changes matter to real estate investment trusts (REITs) that own local malls and their investors. Department stores are fading as anchors, with Metro closing its last two stores and Isetan shrinking. REIT managers cite strong rental reversions, but analysts warn higher rents may not translate into larger dividends as costly refurbishments and rising borrowing costs absorb gains. CICT, FCT and Lendlease reported positive reversions, with major asset enhancements underway including Causeway Point. Analysts caution distribution per unit growth may lag, and REITs face headwinds if the Fed raises rates.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20ST/Singapore's%20great%20mall%20makeover%20Will%20investors%20reap%20the%20rewards.pdf"}, {"id": "st-14sep-18", "title": "South Korea aims to finalise details of US investment plan this week, minister says", "source": "ST", "date": "14 Sep 2026", "tags": ["Trade", "Geopolitics"], "summary": "South Korea will hold further talks with the United States to finalise details of Seoul's proposed US$350 billion (S$443.56 billion) investment commitment to the US, Industry Minister Kim Jung-kwan said on Sept 13. Speaking to reporters after returning from the US, Kim said a US$200 billion ceiling for strategic investments, part of the broader commitment, including a US$20 billion annual cap, had already been agreed and would not change. He said the two sides were close on many issues but several matters remained unresolved, with this week's talks to be held by video conference. Kim declined to elaborate on specific projects, saying it was difficult to discuss concrete deals before negotiations concluded. He had met US Commerce Secretary Howard Lutnick last week.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20ST/South%20Korea%20aims%20to%20finalise%20details%20of%20US%20investment%20plan%20this%20week%2C%20minister%20says.pdf"}, {"id": "st-14sep-19", "title": "South Korea's expanded espionage law takes effect amid push to protect chip technology", "source": "ST", "date": "14 Sep 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "South Korea's expanded espionage law took effect on Sept 13, broadening espionage offences beyond acts involving North Korea to include all foreign countries, as Seoul seeks to protect key technologies amid intensifying competition in semiconductors and other strategic industries. The National Assembly passed the revised Criminal Act on Feb 26 after years of criticism that existing laws could not punish technology and industrial espionage involving non-North Korean actors. The amendment creates a new offence carrying a minimum three-year sentence. The National Intelligence Service said it would strengthen protection of technologies such as semiconductors, displays, batteries and AI. The change follows cases including the 2025 indictment of five former Samsung employees accused of transferring DRAM chip technology to Chinese memory maker CXMT. China urged a non-discriminatory business environment.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20ST/South%20Korea's%20expanded%20espionage%20law%20takes%20effect%20amid%20push%20to%20protect%20chip%20technology.pdf"}, {"id": "st-14sep-20", "title": "Trump says 'very negative forces' raising exaggerated concerns over AI", "source": "ST", "date": "14 Sep 2026", "tags": ["Technology & AI", "Politics"], "summary": "US President Donald Trump on Sept 13 likened critics of artificial intelligence to \"very negative forces\" raising scenarios that will not happen, and said he wanted the US to remain the industry leader. \"We're leading China in AI... whoever wins AI wins,\" he told reporters at his Ireland golf course when asked if the industry should slow down or be regulated. His comments came after two Anthropic researchers warned the technology could lead to human extinction. Trump's administration has largely embraced AI firms, which have poured money into the midterm campaign; Elon Musk's America PAC has spent millions backing Republicans. Anthropic CEO Dario Amodei outlined a framework to pace development, endorsed by Musk and OpenAI's Sam Altman. Resigned researcher Jacob Coxon urged international coordination.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20ST/Trump%20says%20'very%20negative%20forces'%20raising%20exaggerated%20concerns%20over%20AI.pdf"}, {"id": "st-14sep-21", "title": "Trump tells Ukraine's Zelenskiy to stop hitting Russian diesel", "source": "ST", "date": "14 Sep 2026", "tags": ["Energy", "Geopolitics"], "summary": "US President Donald Trump on Sept 13 called on Ukrainian President Volodymyr Zelensky to stop targeting Russian diesel infrastructure, saying the attacks were causing a fuel shortage that is \"hurting the world.\" A wave of long-distance Ukrainian drone attacks on Russian oil refineries has reduced fuel production and triggered gasoline shortages across Russia. Ukraine says refineries are legitimate military targets. Speaking at the Irish Open, Trump said \"there are plenty of other targets. Don't hit diesel fuel.\" The US national average diesel price rose above US$6 a gallon for the first time. Trump attributed the global shortage to the Russia-Ukraine war rather than the Middle East. Russia has downgraded its oil output forecast to a 17-year low and revised its fuel export outlook.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20ST/Trump%20tells%20Ukraine's%20Zelenskiy%20to%20stop%20hitting%20Russian%20diesel.pdf"}, {"id": "st-14sep-22", "title": "Ukraine preparing for war-ending talks to resume in October, Zelensky aide says", "source": "ST", "date": "14 Sep 2026", "tags": ["Geopolitics", "Defence"], "summary": "Ukrainian President Volodymyr Zelensky's chief of staff Kyrylo Budanov was quoted on Sept 12 as saying Kyiv is preparing for the resumption in October of three-sided talks aimed at ending the more than 4½-year war with Russia. Budanov, speaking on the sidelines of a Kyiv conference, said Ukraine was readying for new talks involving Russia and the United States. His comments came days after US envoys Steve Witkoff and Jared Kushner held talks in both Moscow and Kyiv, their first Moscow visit since February. Zelensky said the envoys presented \"very decent, worthwhile ideas\" and suggested a new meeting could be hosted by Turkey, the UAE or Switzerland. The Kremlin did not rule out resuming talks but said it was too early to say when. Donbas remains a key issue.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20ST/Ukraine%20preparing%20for%20war-ending%20talks%20to%20resume%20in%20October%2C%20Zelensky%20aide%20says.pdf"}, {"id": "st-14sep-23", "title": "Yemen's Houthis say Saudi Arabia launched over 50 strikes against them in 24 hours", "source": "ST", "date": "14 Sep 2026", "tags": ["Defence", "Energy"], "summary": "Yemen's Houthis said on Sept 13 that Saudi Arabia had launched more than 50 strikes against their positions in 24 hours, after the Iran-backed group claimed a rare drone and missile attack on a military base in the kingdom. The Houthis have been fighting Saudi-backed government forces since Yemen's civil war reignited in July, when the group declared a maritime blockade on Saudi Arabia. Recent clashes followed an offensive that captured Yemen's Red Sea coast, cementing the group's hold on the Bab al-Mandab Strait, a vital artery for Saudi oil exports with Hormuz closed. Military spokesman Yahya Saree cited 58 airstrikes in 24 hours. Fighting has displaced nearly 86,000 people. Axios reported the Saudi crown prince twice asked Trump to strike the Houthis, but was rejected.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20ST/Yemen's%20Houthis%20say%20Saudi%20Arabia%20launched%20over%2050%20strikes%20against%20them%20in%2024%20hours.pdf"}, {"id": "bt-14sep-01", "title": "‘Ill-advised moment’: OpenAI’s Altman rules out 2026 IPO amid AI safety fears", "source": "BT", "date": "14 Sep 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "OpenAI chief executive Sam Altman told Fortune the company will not pursue an initial public offering in 2026, calling this year an “ill-advised moment” and saying a listing will wait until 2027 as the firm focuses on AI safety. His comments came alongside a rare joint call by Altman, Anthropic CEO Dario Amodei and xAI’s Elon Musk to slow the pace of AI model development amid escalating risks. Altman said it is “unacceptable” to take even a small chance of “killing everybody” by the end of the decade. The remarks follow the resignation of an Anthropic researcher over safety fears. OpenAI filed confidentially for an IPO in June; Anthropic’s planned listing may top SpaceX’s record US$86.2 billion offering.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20BT/'Ill-advised%20moment'%20OpenAI's%20Altman%20rules%20out%202026%20IPO%20amid%20AI%20safety%20fears.pdf"}, {"id": "bt-14sep-02", "title": "AI slowdown calls from Anthropic, OpenAI may weigh on chip stocks, but rally seen intact", "source": "BT", "date": "14 Sep 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "AI executives’ calls to slow technology development are likely to pressure chipmaker and supply-chain stocks in the near term but should have limited long-term impact as computing infrastructure spending stays strong, analysts say. Semiconductor and AI-linked shares may bear the brunt of any sell-off as investors weigh whether a more cautious approach will crimp earnings. Fund managers including Allspring’s Gary Tan and Global X’s Billy Leung argue slower development could extend timelines and aid monetisation of existing infrastructure. The Nasdaq 100 has fallen over 4% from June’s record, a US chip gauge has slumped 14% and Asian tech has slid nearly 8%. Saxo’s Charu Chanana said safeguards could boost cybersecurity investment. SK Hynix perpetual contracts fell about 2.5%.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20BT/AI%20slowdown%20calls%20from%20Anthropic,%20OpenAI%20may%20weigh%20on%20chip%20stocks,%20but%20rally%20seen%20intact.pdf"}, {"id": "bt-14sep-03", "title": "All eyes on US Fed chair Warsh as rate-hike fever spreads across G7 central banks", "source": "BT", "date": "14 Sep 2026", "tags": ["Finance & Markets", "Politics"], "summary": "Central banks across much of the Group of Seven face a pivotal week as mounting inflation risks pressure them to raise interest rates. Three decisions—starting with the US Federal Reserve on Sep 16, followed by the UK and Japan—could reshape global monetary policy. The US is most closely watched after a higher-than-expected core inflation reading stoked bets that Fed chair Kevin Warsh will hike, likely defying President Trump. The Bank of Japan is widely expected to raise rates after strong wage data, while a Bank of England move is not anticipated this week. Oil above US$100 and a reigniting Middle East war add price pressure. The ECB tightened last week, and the Bank of Canada is also leaning hawkish.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20BT/All%20eyes%20on%20US%20Fed%20chair%20Warsh%20as%20rate-hike%20fever%20spreads%20across%20G7%20central%20banks.pdf"}, {"id": "bt-14sep-04", "title": "Anthropic CEO urges slower AI development as Altman, Musk rally behind call", "source": "BT", "date": "14 Sep 2026", "tags": ["Technology & AI", "Society"], "summary": "Leaders of the world’s biggest AI platforms said it is time to slow development of their most advanced models, citing escalating risks. Anthropic CEO Dario Amodei issued a blog post pledging new safety steps such as third-party evaluators and urging an industry-wide downshift; OpenAI’s Sam Altman and xAI’s Elon Musk backed the call, while Google DeepMind’s Demis Hassabis said the direction is correct. Amodei cited AI’s self-improvement and an incident where AI agents breached a third-party website. He said pacing means aligning and safeguarding models, not halting progress, and would require antitrust exemptions and cooperation with China. Concerns intensified after an Anthropic researcher resigned over existential fears. Anthropic and OpenAI have both filed confidentially to go public.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20BT/Anthropic%20CEO%20urges%20slower%20AI%20development%20as%20Altman,%20Musk%20rally%20behind%20call.pdf"}, {"id": "bt-14sep-05", "title": "Anthropic said to choose Nasdaq for potential October IPO: report", "source": "BT", "date": "14 Sep 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Anthropic has picked Nasdaq as the venue for a potential record-setting initial public offering that could take place as soon as October, according to a person familiar with the matter. The Claude chatbot maker is seeking to raise as much as or more than SpaceX. A Nasdaq listing would add to a strong year for the exchange, which hosted SpaceX’s US$86.3 billion offering in June and SK Hynix’s US$26.5 billion July debut. The news came as Anthropic’s Dario Amodei, OpenAI’s Sam Altman and Elon Musk called to slow AI development. US listings have raised US$160.6 billion this year, the most since 2021. Anthropic is on track for annualised revenue above US$65 billion.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20BT/Anthropic%20said%20to%20choose%20Nasdaq%20for%20potential%20October%20IPO%20report.pdf"}, {"id": "bt-14sep-06", "title": "Australia vows to bolster resilience of telco networks after outage at Singtel-owned Optus", "source": "BT", "date": "14 Sep 2026", "tags": ["Technology & AI", "Society"], "summary": "Australia’s government pledged to bolster the resilience of the country’s telecommunications networks after an outage at Optus, the No 2 carrier owned by Singtel, disrupted users in three states and some emergency services calls. The 76-minute technical glitch on Sep 11 affected voice calling services in parts of Victoria, South Australia, Tasmania and the Northern Territory, with some customers experiencing intermittent call dropouts. Communications Minister Anika Wells said no infrastructure is fully resilient but systems must be made as robust as possible. The outage followed a 2025 network issue linked to two deaths. Optus apologised, and the government called the incident deeply concerning. Optus was fined A$12 million in 2024 and suffered a 2022 cyberattack affecting 9.5 million Australians.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20BT/Australia%20vows%20to%20bolster%20resilience%20of%20telco%20networks%20after%20outage%20at%20Singtel-owned%20Optus.pdf"}, {"id": "bt-14sep-07", "title": "BOJ set to raise rates at Sep 17-18 meeting, but offer few clues on how high they could go", "source": "BT", "date": "14 Sep 2026", "tags": ["Finance & Markets", "Politics"], "summary": "The Bank of Japan is set to raise interest rates at its Sep 17-18 meeting, most likely by 25 basis points to 1.25%, a level unseen in 31 years, and may signal faster future tightening if price pressures build, four sources said. A hike just three months after June’s move suggests a quicker pace. Many at the central bank see conditions in place for further increases as the economy recovers and inflation builds. Analysts polled by Reuters expect rates to reach 1.5% by end-March 2027 and 1.75% in the second quarter. Governor Kazuo Ueda is expected to avoid committing to a terminal rate. Wholesale inflation hit 7.6% in August, while a Brent crude spike above US$100 raises fresh inflation fears.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20BT/BOJ%20set%20to%20raise%20rates%20at%20Sep%2017-18%20meeting,%20but%20offer%20few%20clues%20on%20how%20high%20they%20could%20go.pdf"}, {"id": "bt-14sep-08", "title": "DBS wants to be ‘Asian bank for Asians’ rather than global bank: CEO Tan Su Shan", "source": "BT", "date": "14 Sep 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "DBS, South-east Asia’s largest bank, will pursue growth within Asia rather than become a global bank, chief executive Tan Su Shan said at a Singapore Press Club fireside chat. She identified wealth management, capital markets and trade as regional bright spots, saying Asia has “a strong hand” with growing capital markets and strong AI adoption. Tan said DBS wants to be “an Asian bank for Asians” rather than a global player like Citi or HSBC. The bank has come a long way in wealth management but trails UBS, and is targeting S$1 trillion in assets under management by 2030. She acknowledged US capital markets are hard to beat and urged Asia to build more liquid markets, deepen regional connectivity, and remain rooted in Singapore and Hong Kong.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20BT/DBS%20wants%20to%20be%20'Asian%20bank%20for%20Asians'%20rather%20than%20global%20bank%20CEO%20Tan%20Su%20Shan.pdf"}, {"id": "bt-14sep-09", "title": "DeepSeek’s low-cost model deals fresh blow to rivals OpenAI, Z.AI; hits memory makers", "source": "BT", "date": "14 Sep 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "DeepSeek rolled out an AI model that charges as little as a fraction of a cent per million tokens, intensifying a price battle with rivals from Anthropic to Z.AI. The Chinese startup’s V4.1 Flash, unveiled Sep 10, claims to outperform mainstays such as Moonshot’s Kimi K3 while offering a steep discount. Shares in MiniMax and Z.AI fell more than 8% in Hong Kong, and Alibaba slid over 2%. The model trims KV cache, reducing high-bandwidth memory needs and raising concerns about chip demand; Samsung Electronics and SK Hynix shares dipped more than 3%. Analysts said the news may cause short-term sentiment pressure rather than a lasting sell-off, and cheaper AI could ultimately drive greater usage and semiconductor demand over the longer term.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20BT/DeepSeek's%20low-cost%20model%20deals%20fresh%20blow%20to%20rivals%20OpenAI,%20Z.AI%20hits%20memory%20makers.pdf"}, {"id": "bt-14sep-10", "title": "ECB’s hawkish stance prompts calls for further rate hikes", "source": "BT", "date": "14 Sep 2026", "tags": ["Finance & Markets", "Energy"], "summary": "Goldman Sachs, Citigroup and Barclays forecast the European Central Bank will tighten policy further as a renewed surge in energy prices threatens to keep inflation above target. The ECB raised policy rates by 25 basis points on Thursday, as expected, and projected inflation staying above 2% for an extended period. The six-month Middle East conflict and renewed US-Iran hostilities have pushed crude above US$100 a barrel. All three banks expect another hike in December, with Citi seeing a further increase in March 2027. Traders price a 93.9% chance of a quarter-point December hike, according to LSEG data. The ECB, which meets again on Oct 29, does not expect inflation to return to target until late 2027. Attention now turns to Fed and BOJ meetings.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20BT/ECB's%20hawkish%20stance%20prompts%20calls%20for%20further%20rate%20hikes.pdf"}, {"id": "bt-14sep-11", "title": "Economists see Fed defying expectations for rate hikes", "source": "BT", "date": "14 Sep 2026", "tags": ["Finance & Markets", "Politics"], "summary": "A majority of economists expect the Federal Reserve to hold interest rates steady at its September meeting and through the end of 2027, even as market odds for a hike have risen, according to a Bloomberg survey. Just 13 of 48 respondents anticipated a rate increase this month, citing tempering inflation and the proximity of US midterm elections. That contrasts with investors, who see a 70% chance of a hike, reflecting uncertainty under Fed chair Kevin Warsh. Inflation accelerated earlier in the year on energy, tariffs and AI investment but has moderated. Economists said the August CPI report could prove decisive. If the Fed holds, the same three July dissenters are expected to dissent again; a hike would likely draw dissents from Bowman, Williams and Waller.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20BT/Economists%20see%20Fed%20defying%20expectations%20for%20rate%20hikes.pdf"}, {"id": "bt-14sep-12", "title": "Hormuz shipping traffic falls to single digits, data shows", "source": "BT", "date": "14 Sep 2026", "tags": ["Energy", "Geopolitics"], "summary": "Vessel transits at the Strait of Hormuz fell to seven on Sep 10 from 11 the previous day, preliminary shiptracking data from Kpler showed, well below the 10-day average of 15. Of the seven vessels, two Panamax ships exited—one carrying fertiliser, the other in ballast—while five entered, including vessels laden with dry bulk, steel, grains and dirty petroleum products. The figures exclude ships crossing with transponders switched off. Before the Iran war began on Feb 28, the strait typically handled about 125 large commercial vessels daily, roughly 20% of the world’s crude oil and LNG supply. A US blockade has halted Iranian crude exports since mid-July. In the Red Sea, Houthis seized Yemen’s port of Mocha and advanced toward strategic islands.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20BT/Hormuz%20shipping%20traffic%20falls%20to%20single%20digits,%20data%20shows.pdf"}, {"id": "bt-14sep-13", "title": "New attacks in Hormuz and Saudi test nerves as war’s spread worsens oil disruption", "source": "BT", "date": "14 Sep 2026", "tags": ["Geopolitics", "Energy"], "summary": "New strikes on Saudi Arabia and on ships in the Gulf tested nerves across the Middle East as an attack on a Saudi oil pipeline and an advance by Yemen’s Houthis threatened to worsen disruption to global energy supplies. The British agency UKMTO said a vessel was struck by a projectile in the Strait of Hormuz, causing a fire, while Iran said one person was killed aboard an Iranian vessel. Friday drone strikes knocked out the 1,200-km east-west pipeline that bypasses Hormuz; Riyadh has enough stored oil to sustain exports for only five to seven days, with up to 4% of global supply at risk. US diesel hit a record above US$6.20 a gallon. Planned talks in Oman were postponed, and the Houthi advance poses a new dilemma for Washington.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20BT/New%20attacks%20in%20Hormuz%20and%20Saudi%20test%20nerves%20as%20war's%20spread%20worsens%20oil%20disruption.pdf"}, {"id": "bt-14sep-14", "title": "Nvidia in talks to invest in Anthropic’s mega IPO: sources", "source": "BT", "date": "14 Sep 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Anthropic is in talks to bring Nvidia in as an anchor investor in what could be the largest IPO in history, two sources told Reuters. The AI startup is seeking to raise as much as US$100 billion at a valuation of around US$2 trillion, with Nvidia considering investing up to US$10 billion. The plans remain under discussion. Nvidia’s involvement would give Anthropic an early strategic backer and deepen ties between the chipmaker and a major customer. Anthropic relies heavily on Nvidia GPUs while diversifying suppliers, and counts Amazon and Google among backers. The company raised US$65 billion in May at a US$965 billion valuation, with annualised revenue above US$65 billion. The listing is expected to complete before the November US midterm elections.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20BT/Nvidia%20in%20talks%20to%20invest%20in%20Anthropic's%20mega%20IPO%20sources.pdf"}, {"id": "bt-14sep-15", "title": "OCBC tops Forbes ‘World’s Top Performing Banks’ list, DBS in second", "source": "BT", "date": "14 Sep 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "OCBC and DBS took the top two places among global banks in the inaugural “World’s Top Performing Banks” list developed by Forbes and Statista. The ranking evaluated banks with more than US$3 billion in assets across profitability, growth and earnings quality, capital and funding resilience, and asset quality and efficiency, weighted at 30%, 20%, 25% and 25% respectively. Metrics included net interest margin, deposit growth, loan-to-deposit ratio and credit quality. Tier 1 global banks such as OCBC and DBS had more than US$500 billion in total assets. A total of 500 banks from 89 countries made the list across six tiers, with the two Singapore lenders ranking above JPMorganChase (fifth) and China Merchants Bank (fourth). Twenty-six banks hailed from mainland China and 17 from India.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20BT/OCBC%20tops%20Forbes%20'World's%20Top%20Performing%20Banks'%20list,%20DBS%20in%20second.pdf"}, {"id": "bt-14sep-16", "title": "Oil falls but heads for 8% weekly gain on tight supply; US diesel hits record", "source": "BT", "date": "14 Sep 2026", "tags": ["Energy", "Geopolitics"], "summary": "Oil prices fell on Friday but remained on course for a weekly gain of more than 8%, while US diesel hit a record high as attacks along Middle East shipping routes stoked fears of prolonged supply disruptions. Brent crude futures were down US$3.10, or 2.9%, at US$104.53 a barrel, while WTI fell US$2.23 to US$100.25; both had earlier hit their highest since mid-May. Prices reversed after the Financial Times reported foreign ministers were seeking a temporary deal with Iran over Hormuz shipping. Analysts noted a damaged pumping station on Saudi Arabia’s East-West Pipeline. Diesel was hit by Gulf shipping constraints and Ukrainian attacks on Russian refineries. Commerzbank raised its year-end Brent forecast to US$85 from US$75.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20BT/Oil%20falls%20but%20head%20for%208%20weekly%20gain%20on%20tight%20supply%20US%20diesel%20hits%20record.pdf"}, {"id": "bt-14sep-17", "title": "Oil prices jump more than 2% after new strikes on Saudi, Strait of Hormuz", "source": "BT", "date": "14 Sep 2026", "tags": ["Energy", "Geopolitics"], "summary": "Oil prices jumped more than 2% on Monday after new Houthi strikes on Saudi Arabia and Iranian attacks on ships in the Gulf compounded supply concerns following the closure of a key Saudi oil pipeline. Brent crude futures rose US$2.90, or 2.77%, to US$107.51 a barrel, while WTI rose US$2.27 to US$102.32; prices had initially climbed more than 3% at the open. Saudi state media showed damage from a Houthi attack on Jazan province, and a vessel was struck in the Strait of Hormuz. The East-West pipeline, shut Friday by a drone strike from Iraq, threatens up to 4% of global supply, while Houthi gains near Perim Island tighten control of the Bab el-Mandeb. A scheduled Oman meeting between Gulf states and Iran was postponed.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20BT/Oil%20prices%20jump%20more%20than%202%20after%20new%20strikes%20on%20Saudi,%20Strait%20of%20Hormuz.pdf"}, {"id": "bt-14sep-18", "title": "SGX securities trading value climbs 35% on year in August on retail buying, STI rally", "source": "BT", "date": "14 Sep 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "The securities daily average value on the Singapore Exchange jumped 35% year on year in August to S$2.2 billion, driven by robust retail interest in real estate investment trusts and small- to mid-cap stocks alongside a record-breaking rally in the Straits Times Index. Total securities market turnover rose 29% to S$43.3 billion. Retail participation grew 22% month on month in Reits and 11% in small and mid-cap counters. Overall derivatives activity pulled back slightly, with traded volume down 1%, though equity futures showed strength and FX derivatives volume rose 47%. The STI closed the month at a record 5,755.36, up 35% year on year, outperforming Asean peers. STI ETFs notched an 18th straight month of net inflows, bringing assets to S$5.8 billion.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20BT/SGX%20securities%20trading%20value%20climbs%2035%20on%20year%20in%20August%20on%20retail%20buying,%20STI%20rally.pdf"}, {"id": "bt-14sep-19", "title": "Singapore data centre Reits chase Japan deals as power crunch raises stakes", "source": "BT", "date": "14 Sep 2026", "tags": ["Southeast Asia", "Technology & AI"], "summary": "Singapore-listed data centre real estate investment trusts are stepping up bets on Japan as surging demand for computing capacity intensifies competition for scarce power-ready assets. Keppel DC Reit proposed to acquire two Tokyo data centres, raising Japan’s rental income contribution to 23% from 9%, while Digital Core Reit agreed to lift its stake in an Osaka facility. Analysts said Japan offers scale, market maturity, lower risk and deeper liquidity, with power availability now among the most valuable attributes of an asset. Japan has more than 1.8 gigawatts of operational capacity and a 6.6% vacancy rate. However, grid constraints, higher interest rates and compressed cap rates could weigh on returns and limit expansion, particularly in Greater Tokyo, making buyers increasingly selective.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20BT/Singapore%20data%20centre%20Reits%20chase%20Japan%20deals%20as%20power%20crunch%20raises%20stakes.pdf"}, {"id": "bt-14sep-20", "title": "South Korea bets free AI can loosen ChatGPT’s grip", "source": "BT", "date": "14 Sep 2026", "tags": ["Technology & AI", "Society"], "summary": "South Korea is attempting an unprecedented “AI for All” programme that would give each of its 52 million citizens free, unlimited access to generative AI, with SK Telecom, KT and Kakao leading three consortia. The government offered 512 Nvidia B200 chips and operating subsidies in exchange for building services primarily on domestically developed models. SK Telecom is routing AI through mobile infrastructure with a phone-call interface for older users; KT is embedding AI into daily services; Kakao is leveraging KakaoTalk’s 50 million users. The goal is to make domestic models a daily habit before foreign ones like ChatGPT cement their lead, supporting demand for Korean chips. Beta testing begins in October 2026, with the harder test coming when subsidies end.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20BT/South%20Korea%20bets%20free%20AI%20can%20loosen%20ChatGPT's%20grip.pdf"}, {"id": "bt-14sep-21", "title": "SpaceX’s Nasdaq-100 weight set to more than double in rebalance", "source": "BT", "date": "14 Sep 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "SpaceX is set to receive a larger weighting in the Nasdaq 100 later in September, a change that could trigger billions of dollars of buying by passive funds tied to the benchmark. Its weighting is expected to rise to about 2.82% from roughly 1.28%, based on pro forma data from Nasdaq’s Global Index Watch. The relatively small initial weighting dated to its July addition, when most shares were still locked up. As lock-ups expire, more shares become available for trading, increasing the company’s free float and index weight. An earlier feared sell-off from expiring lock-ups did not materialise as insiders largely held their stakes. Roughly US$1.7 trillion in assets tracked the Nasdaq 100 at the end of the second quarter, including the US$481 billion Invesco QQQ Trust.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20BT/SpaceX's%20Nasdaq-100%20weight%20set%20to%20more%20than%20double%20in%20rebalance.pdf"}, {"id": "bt-14sep-22", "title": "Speculators turn bullish on yen for first time since February on BOJ rate-hike bets", "source": "BT", "date": "14 Sep 2026", "tags": ["Finance & Markets", "Trade"], "summary": "Speculators turned to a net long position on the yen for the first time since February, data showed, signalling growing momentum behind Japan’s currency. US Commodity Futures Trading Commission data showed net non-commercial positions of 10,796 long contracts in the week to Sep 8, a reversal from net shorts of 92,227 the prior week and the first long reading since Feb 24. The yen has surged in September on expectations for an accelerated schedule of Bank of Japan rate hikes and potential repatriation of assets by local investors. The dollar-yen rate reached 152.89 on Sep 8, the strongest since Feb 17. A years-long weakening trend had accelerated under Prime Minister Sanae Takaichi before a July intervention by Tokyo and Washington bolstered the currency from a four-decade low.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20BT/Speculators%20turn%20bullish%20on%20yen%20for%20first%20time%20since%20February%20on%20BOJ%20rate-hike%20bets.pdf"}, {"id": "bt-14sep-23", "title": "US limits air defence time slots for tankers sailing through Hormuz, FT reports", "source": "BT", "date": "14 Sep 2026", "tags": ["Geopolitics", "Energy"], "summary": "The United States has asked tankers travelling through the Strait of Hormuz to sail only at specific times to guarantee military protection, after Iran stepped up attacks on ships travelling at night, the Financial Times reported. Washington has been offering air-based defence since May to ships wanting to sail via a route hugging the Omani coast on the strait’s southern side. The period during which ships would be protected was cut to two specific time slots daily around the start of September, the FT reported, citing e-mails sent by the US naval co-ordination centre to maritime advisers. The move underscores the growing risks to shipping through the strategic waterway amid the escalating conflict.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20BT/US%20limits%20air%20defence%20time%20slots%20for%20tankers%20sailing%20through%20Hormuz,%20FT%20reports.pdf"}, {"id": "scmp-14sep-01", "title": "AI fight shadows final preparations for Xi Jinping's White House visit to meet Donald Trump", "source": "SCMP", "date": "14 Sep 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "Rising tensions over artificial intelligence are shaping the final run-up to Chinese President Xi Jinping's US visit to meet Donald Trump. Washington and Beijing are weighing folding a long-awaited intergovernmental AI dialogue into a broader economic meeting led by Treasury Secretary Scott Bessent and Vice-Premier He Lifeng, days before the summit. Some fear a merged track would downgrade risk-reduction talks on military and nuclear-related AI in favour of tariffs, chips and export controls. The move follows US accusations that Chinese firms including DeepSeek, Moonshot and Alibaba conducted industrial-scale model distillation, claims Beijing rejects as groundless. Analysts said AI security may be the sole area of overlap, with both sides managing red lines and internal opposition.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20SCMP/AI%20fight%20shadows%20final%20preparations%20for%20Xi%20Jinping's%20White%20House%20visit%20to%20meet%20Donald%20Trum.pdf"}, {"id": "scmp-14sep-02", "title": "Ant to let AI agents shop via 10 digital wallets, from AlipayHK to Starryblu to KakaoPay", "source": "SCMP", "date": "14 Sep 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Ant International, the overseas affiliate of Ant Group, open-sourced its Agentic Mobile Protocol (AMP) on GitHub, positioning it as a potential global standard for how autonomous AI agents securely pay for goods. Built onto its Alipay+ cross-border network, AMP initially connects 10 major Asian digital wallets, including Alipay, AlipayHK, Singapore's Starryblu, and South Korea's KakaoPay and Toss, serving 1.5 billion accounts. Ant also announced a know-your-agent identity framework with Visa and Mastercard. Features include AgentSafePay, offering merchants a money-back guarantee on agent-initiated transactions, and permission boundaries to keep consumers in control. Ant International, spun off in 2024, raised about US$1.2 billion in July to fund international growth.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20SCMP/Ant%20to%20let%20AI%20agents%20shop%20via%2010%20digital%20wallets,%20from%20AlipayHK%20to%20Starryblu%20to%20KakaoPay.pdf"}, {"id": "scmp-14sep-03", "title": "Beijing freezes plant approvals for energy-storage batteries amid overcapacity fears", "source": "SCMP", "date": "14 Sep 2026", "tags": ["Energy", "Technology & AI"], "summary": "Beijing has frozen new approvals for energy-storage battery production facilities since May amid worries about overcapacity and cut-throat price competition, industry officials said. Regulators led by the Ministry of Industry and Information Technology intervened to curb a construction spree despite rising demand from renewable-energy projects. The temporary ban could be lifted if supply and demand rebalanced. Data showed more than 100 battery factories cleared approvals in the first seven months of 2026, with combined annual capacity of 2,600 gigawatt-hours requiring 447 billion yuan of investment, a 48 per cent jump over 2025 output. China dominates the global ESS battery market with over 80 per cent share. Officials described the curbs as informal 'window guidance' to avoid 'involution'.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20SCMP/Beijing%20freezes%20plant%20approvals%20for%20energy-storage%20batteries%20amid%20overcapacity%20fears.pdf"}, {"id": "scmp-14sep-04", "title": "Beijing pushes AI-assisted chip design as part of self-sufficiency drive", "source": "SCMP", "date": "14 Sep 2026", "tags": ["Technology & AI", "Politics"], "summary": "Beijing is pushing AI-assisted chip design to bolster semiconductor self-sufficiency, with domestic firms integrating artificial intelligence into design software. Empyrean Technology, China's top electronic design automation (EDA) toolmaker, has cut a circuit layout task from four weeks to one using AI-optimised algorithms and agentic tools, chairman Liu Weiping said. He described a 'paradigm shift' from 'humans operating tools' to 'humans commanding agents', shifting the business model towards token-based consumption. A MIIT action plan published Friday called for deeper AI-software integration, targeting the high end of the global value chain by 2030. Developing domestic EDA is a priority as the global market is dominated by Synopsys, Cadence and Siemens. US leader Cadence has also introduced its own autonomous agentic design tools.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20SCMP/Beijing%20pushes%20AI-assisted%20chip%20design%20as%20part%20of%20self-sufficiency%20drive.pdf"}, {"id": "scmp-14sep-05", "title": "Brics members find common ground on AI, trade and alternative payment expansion", "source": "SCMP", "date": "14 Sep 2026", "tags": ["Geopolitics", "Trade", "Technology & AI"], "summary": "Brics members agreed in New Delhi to expand trade and payments in local currencies to counter US pressure, while bridging some of their biggest diplomatic splits. Chinese President Xi Jinping used his summit address to criticise US policies and proposed an 'AI-empowered new industrialisation' initiative, inviting members to join his World Artificial Intelligence Cooperation Organisation, seen as an answer to Washington's Pax Silica Initiative. The bloc's Payment Task Force studied cross-border interoperability, though the declaration stressed 'no one-size-fits-all approach'. Xi urged members to oppose protectionism, unilateralism and 'small yards with high fences', and defend the UN and WTO. Members unanimously adopted the 45-page New Delhi Declaration. China assumes the rotating chair next year; the bloc now covers nearly half the global population.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20SCMP/Brics%20members%20find%20common%20ground%20on%20AI,%20trade%20and%20alternative%20payment%20expansion.pdf"}, {"id": "scmp-14sep-06", "title": "Brics summit ends with Xi's AI offer, Modi's warning on critical minerals as weapons", "source": "SCMP", "date": "14 Sep 2026", "tags": ["Geopolitics", "Trade", "Technology & AI"], "summary": "Xi Jinping concluded his India trip with an offer to help Brics members develop open-source AI and smart manufacturing, and to train young talent in advanced technology. Host Narendra Modi warned against weaponising technology and critical minerals, exposing internal friction, analysts said. The summit produced a united front against US tariffs, sanctions and 'America first' pressure, but disagreements over minerals revealed unity's limits. Xi's offer touches core areas of US-China rivalry, since supply chains for magnets, batteries and chips run heavily through China, while the US gatekeeps advanced chips. India cited past experience of Chinese supply pressure after the 2020 border clash and 2025 rare-earth curbs. Despite Trump's tariff threats, the bloc pushed local-currency settlement, though members remain divided on de-dollarisation.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20SCMP/Brics%20summit%20ends%20with%20Xi's%20AI%20offer,%20Modi's%20warning%20on%20critical%20minerals%20as%20weapons.pdf"}, {"id": "scmp-14sep-07", "title": "China urges US to 'stop all spying' or face retaliation, slams 'gangster logic'", "source": "SCMP", "date": "14 Sep 2026", "tags": ["Geopolitics", "Technology & AI"], "summary": "China's Ministry of Commerce urged the United States to 'immediately stop all espionage activities' targeting Chinese companies, warning it had 'firm resolve and abundant means' to retaliate. The statement responded to CIA deputy director Michael Ellis, who defended expanded intelligence work on China's AI, semiconductor and biotechnology sectors, calling Chinese firms 'legitimate targets'. Beijing accused Washington of exposing its 'gangster logic of hegemony' and applying a 'blatant double standard', noting a 2014 US directive barring intelligence use for commercial advantage. The retort comes two weeks before Xi Jinping's Washington visit, where AI and advanced technology top the agenda. US officials have separately accused China of orchestrating strategic theft of commercial and technological secrets, claims Beijing calls baseless Cold War slander.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20SCMP/China%20urges%20US%20to%20'stop%20all%20spying'%20or%20face%20retaliation,%20slams%20'gangster%20logic'.pdf"}, {"id": "scmp-14sep-08", "title": "China's anti-corruption law is going global. What does it mean for overseas firms?", "source": "SCMP", "date": "14 Sep 2026", "tags": ["Politics", "Trade", "Southeast Asia"], "summary": "China's draft Anti-Cross-Border Corruption Law, submitted to the top legislature in late August, is as much a shield against foreign interference as a tool against illicit financial flows, analysts say. It sets out ways to block extraterritorial investigations and retaliate against foreign enforcement, while creating a mechanism to police overseas assets. Modelled partly on the US Foreign Corrupt Practices Act and Britain's Bribery Act, it is more politically integrated, covering SOEs, asset tracing and blocking measures. Articles 6 and 26 target perceived US extraterritoriality and bar unauthorised foreign investigations in China. Analysts warn multinationals and Chinese firms in hubs like Singapore face data-compliance dilemmas, asset-restraint conflicts and competing investigations, as Beijing takes a tougher line even as US enforcement wanes under Trump.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20SCMP/China's%20anti-corruption%20law%20is%20going%20global.%20What%20does%20it%20mean%20for%20overseas%20firms.pdf"}, {"id": "scmp-14sep-09", "title": "Chinese AI firms shunned US delegation over sanctions fears, commission says", "source": "SCMP", "date": "14 Sep 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "A US congressional advisory body said leading Chinese AI firms declined to meet its members during a July Beijing visit, fearing that engagement could expose them to US sanctions or the entities list. US-China Economic and Security Review Commission chairman Randy Schriver said requested meetings with companies including Alibaba and DeepSeek in Hangzhou were not permitted, calling the reluctance telling given officials' confidence about AI. The bipartisan delegation made the commission's first China trip in seven years as a fact-finding mission. Members underscored the value of the upcoming AI dialogue between Washington and Beijing, with Schriver 'moderately optimistic'. Treasury Secretary Scott Bessent is expected to lead US talks on AI governance ahead of Xi Jinping's visit, though the two sides remain divided over the discussions' scope.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20SCMP/Chinese%20AI%20firms%20shunned%20US%20delegation%20over%20sanctions%20fears,%20commission%20says.pdf"}, {"id": "scmp-14sep-10", "title": "Chinese optical transceiver makers dodge US ban for now as FCC updates rules", "source": "SCMP", "date": "14 Sep 2026", "tags": ["Technology & AI", "Trade"], "summary": "The US Federal Communications Commission finalised updated equipment-authorisation rules that, for now, spare Chinese optical transceivers from a potential ban, easing market anxiety. The rule tightens requirements for devices containing components from firms on the Covered List but did not target optical transceivers, calming speculation after an August Reuters report on possible curbs. Shares of Zhongji Innolight and Eoptolink rose. Optical transceivers are increasingly central to AI infrastructure as clusters expand and optical links become necessary; the global optical interconnect market is projected to grow from US$24.8 billion in 2025 to US$111 billion by 2030. Chinese firms supplied nearly two-thirds of transceivers by volume in 2025, favouring near-packaged optics while US leaders like Nvidia and Broadcom push co-packaged optics. High-end laser chips remain reliant on overseas suppliers.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20SCMP/Chinese%20optical%20transceiver%20makers%20dodge%20US%20ban%20for%20now%20as%20FCC%20updates%20rules.pdf"}, {"id": "scmp-14sep-11", "title": "Chinese researchers extend future memory endurance 100-fold in semiconductor advance", "source": "SCMP", "date": "14 Sep 2026", "tags": ["Technology & AI"], "summary": "Chinese researchers have developed a way to make an emerging type of memory chip far more durable, potentially overcoming a key reliability barrier for high-performance computing and future AI systems. The team demonstrated more than 10 billion writing cycles in wurtzite ferroelectrics such as aluminium scandium nitride (AlScN), roughly 100 times the endurance previously achieved. Led by scientists at Xidian University with City University of Hong Kong and Fudan University, the work was published Thursday in the journal Science. Existing AlScN devices typically failed after about 100 million cycles due to the accumulation of nitrogen vacancies that let electricity leak through. By designing a layered structure that confined vacancy movement, the researchers slowed deterioration. The findings, still at laboratory stage, point towards dense, low-power memory chips.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20SCMP/Chinese%20researchers%20extend%20future%20memory%20endurance%20100-fold%20in%20semiconductor%20advance.pdf"}, {"id": "scmp-14sep-12", "title": "Enflame shares soar 179% in Shanghai debut as Nvidia challenger taps investor fever for AI", "source": "SCMP", "date": "14 Sep 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Enflame Technology, a major Chinese challenger to Nvidia, saw its shares surge 179 per cent on its Shanghai trading debut on Friday, giving the Tencent-backed AI chipmaker a market value of 170.9 billion yuan (US$25.5 billion). The stock opened at 410 yuan versus a 142.18 yuan issue price and rose as much as 234 per cent intraday. Enflame raised about 6.12 billion yuan; its retail IPO tranche was oversubscribed 4,073 times. The debut reflects strong investor appetite for domestic AI chip champions amid US export restrictions, with Enflame the last of China's 'four little dragons' to list. Backers include Tencent, GigaDevice, Xiaomi and ZTE. Enflame uses domain-specific architecture and remains unprofitable, but expects revenue to jump up to 455 per cent and profitability by 2026 or 2027.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20SCMP/Enflame%20shares%20soar%20179%20in%20Shanghai%20debut%20as%20Nvidia%20challenger%20taps%20investor%20fever%20for%20AI.pdf"}, {"id": "scmp-14sep-13", "title": "Houthis hit Saudi base amid renewed fighting with Yemen government forces", "source": "SCMP", "date": "14 Sep 2026", "tags": ["Defence", "Energy"], "summary": "Houthi fighters said they used drones and missiles to strike a military base in southern Saudi Arabia as renewed fighting with Yemen's government forces displaced growing numbers of civilians. The rebels targeted the Sharurah base, while Riyadh-backed government forces said they struck Houthi positions in the Red Sea city of Mocha and the Taiz region. Axios reported Saudi Crown Prince Mohammed bin Salman twice asked Donald Trump to strike the Houthis, but was rejected. The clashes follow a Houthi offensive that captured the remainder of Yemen's Red Sea coast and strategic islands, cementing their hold on the Bab el-Mandab Strait, now a key oil-export route after Iran's Hormuz blockade. The UN said 76,000 people had fled since July, and renewed fighting has killed more than 500.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20SCMP/Houthis%20hit%20Saudi%20base%20amid%20renewed%20fighting%20with%20Yemen%20government%20forces.pdf"}, {"id": "scmp-14sep-14", "title": "Iran, UAE leaders discuss de-escalation as oil supply worries spike", "source": "SCMP", "date": "14 Sep 2026", "tags": ["Geopolitics", "Energy"], "summary": "Iranian President Masoud Pezeshkian and Abu Dhabi's crown prince met on the sidelines of the Brics summit in New Delhi, the highest-level Iran-UAE meeting since the Iran war began. The talks came as oil-supply worries spiked after Saudi Arabia shut its key East-West pipeline following a drone attack. The two sides discussed supporting de-escalation and regional stability. Relations had ruptured after Iran launched ballistic missile and drone attacks on the UAE, damaging energy infrastructure and ports, prompting Abu Dhabi to impose an indefinite embargo suspending all trade and financial transactions with Tehran. The UAE, Iran's second-largest trading partner after China, had been an indispensable commercial hub. India helped bridge the divergence to secure adoption of the joint Delhi Declaration, which condemned unilateral coercive measures.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20SCMP/Iran,%20UAE%20leaders%20discuss%20de-escalation%20as%20oil%20supply%20worries%20spike.pdf"}, {"id": "scmp-14sep-15", "title": "J.D. Vance group courted Brazil's Flavio Bolsonaro over anti-China rare earth deal: report", "source": "SCMP", "date": "14 Sep 2026", "tags": ["Geopolitics", "Trade", "Politics"], "summary": "A campaign document belonging to Flavio Bolsonaro, a right-wing front-runner in Brazil's presidential election, offered Washington a rare-earths supply chain designed to weaken China's grip, local outlet Amado Mundo reported. The 22-page English-language presentation, dated March 19, was drafted by Bolsonaro ally Andre Marinho and presented to the Rockbridge Network, a conservative donor group founded by J.D. Vance in 2019. Marinho confirmed writing it but said it was never shown to US officials. The plan pledged to stop selling raw ore abroad, avoid dependence on Chinese processing and align with Washington, drawing up to US$100 billion into Brazil's mines. Brazil holds the world's second-largest rare-earth reserves. The report revived questions over whether US-linked funding could jeopardise Bolsonaro's candidacy before the October 4 vote.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20SCMP/J.D.%20Vance%20group%20courted%20Brazil's%20Flavio%20Bolsonaro%20over%20anti-China%20rare%20earth%20deal%20report.pdf"}, {"id": "scmp-14sep-16", "title": "Moonshot, DeepSeek secretly routed user requests to Claude, Anthropic claims", "source": "SCMP", "date": "14 Sep 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "American AI company Anthropic accused Chinese rivals DeepSeek and Moonshot of covertly routing customer requests to its Claude models, then presenting the responses as their own output. The allegations, in a 154-page report released Thursday, mark an escalation in US criticism of China's AI practices, following claims by three US agencies that six Chinese companies conducted industrial-scale theft of US model outputs 'likely with Chinese government awareness'. Anthropic said Moonshot routed 300,000 requests over 10 days through 5,380 fraudulent accounts, exposing sensitive data including a user apparently affiliated with the PLA analysing CCTV footage. It accused five other firms, including Alibaba, Z.ai, Xiaomi and MiniMax, of 'illicit' distillation. Beijing rejected the accusations as attempts to suppress its AI industry. Alibaba owns the South China Morning Post.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20SCMP/Moonshot,%20DeepSeek%20secretly%20routed%20user%20requests%20to%20Claude,%20Anthropic%20claims.pdf"}, {"id": "scmp-14sep-17", "title": "Russia says Ukraine attacked trucks supplying fuel to Zaporizhzhia nuclear plant", "source": "SCMP", "date": "14 Sep 2026", "tags": ["Defence", "Energy"], "summary": "The head of Russia's state nuclear energy corporation, Alexei Likhachev, accused Ukraine of attacking diesel fuel trucks near the Russian-held Zaporizhzhia nuclear power plant, killing two Russian servicemen and injuring others. He said the strikes hit close to the perimeter of the plant, Europe's largest with six reactors, which was seized by Russian forces early in the war. Fuel is critical because diesel generators keep reactors cool when external power links fail; both links were down for nearly three weeks in August and September. Ukraine has demanded Russia abandon the station and return it to Kyiv, a demand Moscow rejects; the plant currently generates no electricity. The IAEA has stationed a permanent observer team there and has acted as an intermediary to arrange repairs and restore power.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20SCMP/Russia%20says%20Ukraine%20attacked%20trucks%20supplying%20fuel%20to%20Zaporizhzhia%20nuclear%20plant.pdf"}, {"id": "scmp-14sep-18", "title": "Seeking cash for AI, China's Z.ai eyes new US$5b fundraising push after July share sale", "source": "SCMP", "date": "14 Sep 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Z.ai, the Hong Kong-listed Chinese AI model developer also known as Zhipu AI, is seeking to raise about US$5 billion to fund its AI push, according to a Sunday filing. The company plans a HK$15.7 billion (US$2 billion) placement of roughly 21.97 million new H shares at HK$714 each, plus a 20.14 billion yuan (US$3 billion) convertible-bond sale. The move follows a July placement that raised HK$31.4 billion, as a lock-up period expires. Z.ai is also pursuing a Shanghai Star Market listing. Revenue for the six months to June rose 400 per cent to 953.89 million yuan, and annual recurring revenue reached US$1.6 billion by end-August, though losses persist. Its repeated capital raising underscores the heavy costs of developing frontier AI models amid intensifying competition.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20SCMP/Seeking%20cash%20for%20AI,%20China's%20Z.ai%20eyes%20new%20US5b%20fundraising%20push%20after%20July%20share%20sale.pdf"}, {"id": "scmp-14sep-19", "title": "Senior Western figures at Ukraine station before Russia train strike, rail operator says", "source": "SCMP", "date": "14 Sep 2026", "tags": ["Defence", "Geopolitics"], "summary": "Ukraine's state railway operator said top Western figures, including former UK prime minister Boris Johnson and ex-CIA director David Petraeus, were at the western Yagodyn station just before Russia struck a Warsaw-bound train. Ukrzaliznytsia said a diplomatic train carrying security advisers from several EU states and former European leaders was at the station, while Petraeus was on another train present at the moment of the attack. Passengers were evacuated and nobody was harmed. Poland's foreign minister said 'Putin escalates', and Prime Minister Donald Tusk convened a crisis team. A drone also struck about 1km from Poland's border; Polish F-16s monitored the situation but airspace was not violated. Moscow confirmed strikes on rail infrastructure it said transported military goods from Europe.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20SCMP/Senior%20Western%20figures%20at%20Ukraine%20station%20before%20Russia%20train%20strike,%20rail%20operator%20says.pdf"}, {"id": "scmp-14sep-20", "title": "The US and China are racing to build 'self-improving AI'. Here's what's at stake", "source": "SCMP", "date": "14 Sep 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "The US and China have entered a new phase of AI rivalry, using AI to build better AI, with both sides viewing recursive self-improvement (RSI) as a potential game-changer. RSI envisions AI systems that train themselves autonomously, creating an accelerating feedback loop. OpenAI said it aims to build an automated AI researcher, and Chinese firm Z.ai described its next GLM-6 model as heading towards 'self-evolution'. Analysts say the US remains ahead, citing work by Anthropic, Google DeepMind and OpenAI, though neither country has demonstrated fully autonomous self-improvement. Chinese labs including DeepSeek and MiniMax are pursuing 'self-evolution' but experts caution these fall short of true recursive loops. The race has sparked safety warnings, with resignations and Beijing officials flagging 'extreme out-of-control risks' from misaligned models.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/14%20Sep%202026/14%20Sep%20SCMP/The%20US%20and%20China%20are%20racing%20to%20build%20'self-
