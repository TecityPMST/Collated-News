, "Geopolitics"], "summary": "TASS, citing a report by Fitch unit BMI, says US efforts to get India to stop buying Russian oil and to open its market to US farm products remain the main obstacles to a US-India trade deal. BMI expects the two sides eventually to conclude a narrow interim deal but sees a near-term breakthrough as unlikely, noting Middle East disruption has reinforced India's incentive to keep alternative energy sources. Russian oil made up about 50.8% of India's oil imports in July 2026, and India's effective tariff rate on US goods is 13.6%, well below the roughly 35% set in February, according to the report. The US goods trade deficit with India stood at US$58.42 billion in 2025.", "url": "https://tass.com/economy/2199347"}, {"id": "tass-09oct-13", "title": "Talks between Tehran, Washington ongoing — Iranian foreign minister", "source": "TASS", "date": "09 Oct 2026", "tags": ["Geopolitics"], "summary": "Iranian Foreign Minister Abbas Araghchi said indirect dialogue with the US is continuing, with the sides exchanging written messages through intermediaries, TASS reports, citing the Tasnim news agency. Araghchi said Tehran had put forward its proposal, the so-called seven-day plan, and Iranian representatives heard the US side's views on it. He said Iran is studying the US position and expects to respond within the next few days.", "url": "https://tass.com/world/2199321"}, {"id": "tass-09oct-14", "title": "US helped transport over 1.25 billion barrels of oil via Strait of Hormuz — CENTCOM", "source": "TASS", "date": "09 Oct 2026", "tags": ["Energy", "Defence", "Geopolitics"], "summary": "US Central Command said on X that US forces have supported the shipment of over 1.25 billion barrels of crude oil from Gulf partners and through the Strait of Hormuz in recent months, TASS reports. TASS recounts that the US and Israel launched a war against Iran on Feb 28, that a June memorandum envisaged a ceasefire on all fronts including Lebanon, and that the US resumed large-scale attacks overnight to July 8, accusing Iran of breaching the Hormuz terms. According to TASS, the Trump administration has recently signalled a shift from large-scale force to economic pressure through sanctions.", "url": "https://tass.com/world/2199595"}, {"id": "tass-09oct-15", "title": "Witkoff plans to discuss Ukrainian settlement in Moscow in late October — Axios", "source": "TASS", "date": "09 Oct 2026", "tags": ["Geopolitics", "Politics"], "summary": "TASS, citing Axios and its sources, reports that US President Donald Trump's envoys Steve Witkoff and Jared Kushner plan to visit Moscow in late October to discuss a Ukraine settlement. According to the sources, the administration hopes for a diplomatic breakthrough before the Nov 3 US congressional midterm elections and before winter. Axios reported that on Oct 8 Witkoff and Kushner presented their proposals to Trump and received instructions ahead of talks with a Ukrainian delegation in Miami, expected to last two days.", "url": "https://tass.com/world/2199603"}, {"id": "xinhua-09oct-01", "title": "Australian rare earths project begins construction", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Technology & AI", "Trade"], "summary": "According to Xinhua, the Australian government announced on Oct 8 that construction has begun on the Arafura Rare Earths Nolans Project in the Northern Territory, backed by A$1.2 billion (about US$850 million) in federal investment. The project, about 135 km north of Alice Springs, is expected to supply 4% to 5% of global rare earths demand, according to a joint statement by three Australian ministers cited by Xinhua. The government said the project would strengthen Australia's economic and national security by supplying critical materials for clean energy technologies and the defence industry.", "url": "https://english.news.cn/20261008/1963ec6e4d2b4f7da69ef575e77fbe8f/c.html"}, {"id": "xinhua-09oct-02", "title": "Australian rents stagnate as tenants hit affordability ceiling: report", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Society", "Finance & Markets"], "summary": "Median rent growth in Australia's capital cities stalled in the September quarter as tenants hit an affordability ceiling, Xinhua reports, citing a quarterly report released on Oct 8 by property marketplace Domain. Median asking rent for capital-city houses was A$700 a week in September, unchanged from June, while unit rents rose 1.5% to A$690; in Sydney, house asking rents fell 0.6% and unit rents were flat. Domain chief residential economist Nicola Powell said rents are absorbing a greater share of household incomes and smaller investors could be forced to sell if they cannot raise rents to offset holding costs. Xinhua notes Australia's central bank raised the cash rate at the end of September for the fourth time in 2026, to a 15-year high of 4.60%.", "url": "https://english.news.cn/20261008/cadf967b93ca4118bf5f20c943da1459/c.html"}, {"id": "xinhua-09oct-03", "title": "China Focus: China remains committed to letting market play decisive role in determining exchange rate: central bank", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "The People's Bank of China (PBOC) said in a statement on Oct 8 that China remains committed to letting market forces play a decisive role in setting the RMB exchange rate under its managed floating regime, Xinhua reports. The PBOC said the RMB has strengthened 23% against the US dollar since the 2005 reform, from 8.27 to around 6.7 per dollar, and by about 9% since 2025, while its BIS nominal effective rate is up over 50%. The bank said China has \"no need or intent\" to gain advantage through devaluation, and called citing idiosyncratic models as official evidence of RMB undervaluation a misuse of those findings. Huafu Securities chief economist Guan Tao said factors favouring a stronger RMB have the upper hand in the short term.", "url": "https://english.news.cn/20261008/f5024951b8954d30b5bcd0674031d9d3/c.html"}, {"id": "xinhua-09oct-04", "title": "China proposes new labor protections for gig workers", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Society", "Politics"], "summary": "China's Ministry of Human Resources and Social Security on Oct 8 released draft measures to protect workers in new forms of employment, inviting public feedback until Nov 8, Xinhua reports. If adopted, the rules would bring under labour-law protection workers managed by enterprises whose arrangements do not fully meet the criteria for a labour relationship, the first time China has done so through departmental rules. The draft covers basic labour rights, regulation of labour rules and algorithms, employment arrangements, dispute resolution and legal liabilities. Xinhua puts the number of workers in new forms of employment, including delivery riders and ride-hailing drivers, at about 84 million.", "url": "https://english.news.cn/20261008/43ff73f257e340f494ac0a7e1a5b9aaf/c.html"}, {"id": "xinhua-09oct-05", "title": "China unveils plan to expand, improve rehabilitation, nursing care services", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Society", "Technology & AI"], "summary": "China on Oct 8 unveiled an implementation plan by the National Health Commission and the National Development and Reform Commission to expand medical rehabilitation and nursing care services, Xinhua reports. Populous, rapidly ageing cities with growing demand are expected to have at least one public rehabilitation hospital and one public nursing care facility by 2030, with targets of about 0.48 beds per 1,000 people and 0.7 rehabilitation physicians and 1.6 therapists per 10,000 people. The plan prioritises prefecture-level cities with more than 1 million urban residents, calls for expanded university and vocational training, and encourages rehabilitation robots, smart wearables and other AI tools.", "url": "https://english.news.cn/20261008/45f343aabe7a4fad9ced11ffecfca521/c.html"}, {"id": "xinhua-09oct-06", "title": "China's highway NEV charging volume posts strong growth over National Day holiday", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Energy", "Technology & AI"], "summary": "China's highway new energy vehicle (NEV) charging volume reached 163 million kilowatt-hours over the Oct 1-7 National Day holiday, averaging 23.26 million kWh a day, up 51.42% year on year, according to National Energy Administration data reported by Xinhua. Official data cited by Xinhua show NEV ownership at 48.97 million, or 13.19% of all vehicles, with NEVs nearly half of new registrations in the first half of 2026. According to Xinhua, China has more than 24 million charging connectors and about 89,000 facilities at expressway service areas, which added around 11,000 high-power units from January to August. Xinhua says that by 2030 charging facilities are expected to exceed 40 million, including about 300,000 high-power units.", "url": "https://english.news.cn/20261008/561649bf4ed6411a80a5ffe99d841190/c.html"}, {"id": "xinhua-09oct-07", "title": "Chinese vice premier holds video call with British chancellor of the exchequer on economic, financial cooperation", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Geopolitics", "Finance & Markets"], "summary": "Chinese Vice Premier He Lifeng held a video call on Oct 8 with British Chancellor of the Exchequer John Healey on strengthening economic and financial cooperation, Xinhua reports. According to Xinhua, He, who leads the Chinese side of the China-UK Economic and Financial Dialogue, said the two sides should implement the consensus reached by their leaders, respect each other's core interests and promote stable bilateral economic relations. Healey, the British head of the dialogue, said Britain is willing to enhance economic and financial dialogue and cooperation with China, Xinhua reports.", "url": "https://english.news.cn/20261008/0d688fc67cdb445e8bbc0e304f14113c/c.html"}, {"id": "xinhua-09oct-08", "title": "Economic Watch: Holiday travel, spending boom mirror vitality of China's vast market", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Society"], "summary": "A Xinhua \"Economic Watch\" analysis says the Oct 1-7 National Day holiday showed the resilience of China's holiday economy, citing Ministry of Transport data of 2.14 billion cross-regional trips, averaging 306 million a day. Official data cited show average daily service-sector sales up 19.5% year on year, with tourism and entertainment up 23.6%, while the consumer goods trade-in programme drove 33.48 billion yuan in sales in the first six days. Xinhua cites Qunar data showing long-haul flight bookings up over 40% and county hotel bookings up 32%, and immigration data of 682,000 foreign entrants, up 5.4%. The NDRC said this year's trade-in bond allocation totals 250 billion yuan.", "url": "https://english.news.cn/20261008/5fca0e89d4a047918eda92117c3a5ecc/c.html"}, {"id": "xinhua-09oct-09", "title": "European Commission backs Italy's bid for defense, energy spending flexibility", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Politics", "Defence", "Energy"], "summary": "The European Commission has backed Italy's request for flexibility under EU fiscal rules to raise defence and energy security spending, a Commission spokesperson said on Oct 8, Xinhua reports. Italy filed on Sept 11, becoming the 19th EU member to seek activation of the national escape clause; the spokesperson said activation \"does not endanger fiscal sustainability over the medium term\" for Italy. The request now goes to the Council of the EU, which has one month to give final approval. The clause allows extra defence spending of up to 1.5% of GDP a year over 2025-2028, and energy security spending up to 0.3% of GDP a year within that ceiling.", "url": "https://english.news.cn/20261008/ba131c0ec1b1489cbf72c40e1b80f00a/c.html"}, {"id": "xinhua-09oct-10", "title": "French president's diplomatic adviser to come to China for China-France Strategic Dialogue", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Geopolitics"], "summary": "French presidential diplomatic adviser Emmanuel Bonne will be in China from Oct 9 to 13, a Chinese foreign ministry spokesperson announced on Oct 8, Xinhua reports. Wang Yi, a member of the Political Bureau of the Communist Party of China Central Committee and director of the Office of the Central Commission for Foreign Affairs, will hold a new round of the China-France Strategic Dialogue with Bonne, the spokesperson said.", "url": "https://english.news.cn/20261008/b4e74939b0f84fd4937628e17aae012b/c.html"}, {"id": "xinhua-09oct-11", "title": "German gov't raises 2026 growth forecast to 1.3 pct", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Politics"], "summary": "The German government on Oct 8 raised its 2026 growth forecast to 1.3% from 0.5%, citing stronger-than-expected resilience despite higher energy prices and geopolitical uncertainty, Xinhua reports. Economy Minister Katherina Reiche said exports and government consumption drove growth in the first half, while energy-driven inflation keeps private consumption subdued; growth is forecast to slow to 1.1% in 2027 and 0.6% in 2028, depending heavily on the Middle East and Ukraine. DIHK chief executive Helena Melnikov warned the recovery, driven by EU exports and debt-financed spending, could be short-lived without reforms, saying \"This upswing comes at a high cost\".", "url": "https://english.news.cn/20261008/e2e318085a2141af8172a02b5ca0e730/c.html"}, {"id": "xinhua-09oct-12", "title": "Japan bankruptcies hit 13-year high in April-Sept. period", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Society"], "summary": "Japanese corporate bankruptcies hit a 13-year high for the April-September period, credit research firm Tokyo Shoko Research said on Oct 8, according to Xinhua. It counted 5,373 failures with liabilities of at least 10 million yen, up 3.9% year on year and the most for a fiscal first half since 2013, while total liabilities rose 23.5% to 856.1 billion yen, the first annual increase in four years. Labour-shortage-related failures rose 17.1% to a first-half record 240, and price-related failures rose 17.8% to 436. The firm expects higher borrowing costs from Bank of Japan rate hikes to show up in bankruptcies in the second half of the fiscal year.", "url": "https://english.news.cn/20261008/428635784c504f6cb0a2c70cac39bc6a/c.html"}, {"id": "xinhua-09oct-13", "title": "Japan logs 4.06 trln yen current account surplus in August", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Trade"], "summary": "Japan posted a current account surplus of 4.06 trillion yen (about US$25.7 billion) in August, up 12.0% year on year, according to preliminary Finance Ministry data reported by Xinhua on Oct 8. The goods trade balance swung to a 687.7 billion yen deficit from a 113.8 billion yen surplus a year earlier, owing to higher imports of crude oil and other commodities, with exports up 16.9% to 9.86 trillion yen and imports up 26.7% to 10.55 trillion yen. Primary income from overseas investments rose 21.6% to 5.13 trillion yen.", "url": "https://english.news.cn/20261008/b381e3791e37452a89fdba52824bf216/c.html"}, {"id": "xinhua-09oct-14", "title": "U.S. military ordered to prepare for possible Iran strikes ahead of midterm elections: report", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Geopolitics", "Defence", "Politics"], "summary": "Xinhua, citing an Axios report on Oct 7 that quoted US officials, says the Pentagon instructed US Central Command several days earlier to complete preparations for resuming major combat operations in Iran. US and Israeli sources told Axios the strikes could come before the Nov 3 US midterm elections and possibly before Israel's elections a week earlier, and could include massive bombing of Iranian energy, infrastructure and nuclear facilities. Xinhua adds that the Iran war has pushed up gas prices and that a Reuters/Ipsos poll released Oct 5 put President Donald Trump's approval at a record-low 32%.", "url": "https://english.news.cn/20261008/4efa49c5c8ee4f66a9d3f67fd6c62237/c.html"}]}, "2026-10-12": {"date": "2026-10-12", "dayOfWeek": "Monday", "totalArticles": 107, "sourceCounts": {"WSJ": 17, "ST": 20, "BT": 24, "SCMP": 20, "TASS": 8, "XINHUA": 18}, "executiveDigest": "Washington's weekend turn on Russia and Ukraine dominated the pack. On Oct 9 President Trump announced a deal for Russian diesel, with the Treasury temporarily easing sanctions; by his count Russia would ship over 300,000 tonnes immediately, 500,000 in November and 1 million thereafter (ST, Xinhua). On Oct 10 he said it was time for Ukraine to get a new president (WSJ, ST), and on Oct 11 he announced an energy ceasefire that Moscow did not confirm and that Zelensky said Russia breached the same day (ST). Seven senators, four of them Republicans, called the diesel deal illegal (ST); TASS carries Treasury Secretary Bessent saying no sanctions law bars it. In the Gulf, a Houthi strike on Riyadh's main airport on Oct 10 killed at least 12 (WSJ), Iran's Mohsen Rezaei called the US reply to Tehran's seven Hormuz conditions 'insufficient' (ST), and the IRGC says three tankers using an 'unauthorized' route hit mines, as Xinhua and TASS relay. Bond markets stayed under strain: Pimco's Dan Ivascyn told the FT the 10-year Treasury yield, at 5.29%, could reach 6% (BT), and forecasters polled by the WSJ see it ending 2026 at 5.1% (WSJ). In Taiwan, Lai Ching-te said a record NT$1.1 trillion defence budget is meant to deter war (ST); Xinhua quotes China's defence ministry calling him a 'threat to peace'. At home, OCBC, DBS and UOB fell 5% to 8.4% over the week and the STI lost 4.1% (BT), while ST Engineering opened its S$170 million Changi Creek hangar (BT).", "briefingCards": [{"title": "Lead story - Trump pairs a Russian diesel deal with pressure on Kyiv and a surprise energy ceasefire", "body": "President Trump announced on Oct 9 that he is working with Vladimir Putin to release Russian diesel, starting with about 13.5 million barrels of cargoes from October, as the White House tries to cut fuel prices before the November midterms; the Treasury issued a waiver for previously sanctioned Russian fuel (BT). In his own posts Trump said Russia would supply over 300,000 tonnes immediately, 500,000 tonnes in November and 1 million tonnes thereafter, later followed by 3 million tonnes (Xinhua). An ST analysis by Jonathan Eyal argues this month's volumes barely cover one day of US diesel needs and that the deal makes Washington reliant on the refineries Ukraine has been striking (ST). On Oct 10 Trump said it was time for Ukraine to get a new president and pressed Kyiv to stop hitting Russian refineries (WSJ); the Financial Times reported, citing European officials, that the US threatened to cut intelligence sharing and the Purl weapons-procurement mechanism (ST). On Oct 11 Trump announced an energy ceasefire 'effective immediately'; Moscow did not comment and Zelensky said Russia struck power plants in Kyiv and Kharkiv the same day (ST). Zelensky told ABC he would hold elections if Putin agreed to a 60-day ceasefire (ST). Pushback came quickly: seven senators, four of them Republicans, urged Trump to reverse course, saying the deal breaches a 2022 ban on Russian energy imports (ST); British Prime Minister Andy Burnham pledged 'complete solidarity' with Zelensky (ST); and Australia said it will keep its ban on Russian fuel (SCMP). The agencies give Moscow's side. TASS carries Bessent telling Fox News the administration has full legal authority and that the deal is good for Americans, and quotes Deputy Prime Minister Alexander Novak as saying Russia will lift its diesel export ban early. Xinhua reports a 1.5-hour Putin-Trump call on Oct 9, with Kremlin aide Yury Ushakov saying Kyiv's drone attacks ruled out an immediate restart of trilateral talks. TASS also relays EU defence commissioner Andrius Kubilius urging the EU to stop relying on the US over Ukraine, and a Russian senator saying Trump's call to replace Zelensky reflects Ukrainian opinion."}, {"title": "Markets & finance - Bond yields stay near two-decade highs as rate-hike bets ease", "body": "Pimco chief investment officer Dan Ivascyn told the Financial Times the 10-year Treasury yield could hit 6% for the first time since 2000, driven by oil-fuelled inflation and US debt worries; the yield was at 5.29%, up almost 120 basis points this year, after reaching 5.34% last week (BT). The WSJ's survey of 71 forecasters sees the 10-year ending 2026 at 5.1%, up from 4.4% in July, puts the chance of recession at 24% and expects CPI inflation of 3.5% in December (WSJ). Yet tighter financial conditions have led traders to cut hike bets across eight major economies to 539 basis points from 717 in September, with average global government bond yields above 4%, the highest since 2000 (BT). Cleveland Fed President Beth Hammack told the WSJ the Fed, which hiked to 3.75%-4% last month, needs to go higher still (WSJ). In an ST commentary, Vikram Khanna draws on a fireside chat between President Tharman Shanmugaratnam and the IMF's Kristalina Georgieva to argue that bond markets are now the main fiscal discipline on big debtors (ST). A Xinhua 'Economic Watch' analysis says high US yields could strain Europe through borrowing costs and a stronger dollar (Xinhua). The University of Michigan's sentiment index fell to 46.3 in October, near May's record low (WSJ), and Trump ordered Fed governor Lisa Cook to a Nov 5 White House hearing on mortgage-fraud allegations she denies (WSJ). In equities, Valero, Marathon and Phillips 66 closed at records on Oct 8 as war-driven refining margins point to bumper earnings (WSJ), while Korea's Kospi has lost 22% since its first-half rally and foreign funds have pulled US$131 billion this year (BT). China is becoming a source of cheap funding, with more than 40% of 2026 panda bond proceeds approved for offshore use (BT). The IMF and World Bank meet in Bangkok this week; World Bank president Ajay Banga said the bank is in talks with 30 to 40 countries on crisis aid and could provide up to US$100 billion (BT)."}, {"title": "Asia realignment - Taiwan's National Day speech, a Shenzhen summit in view and an EU-China hybrid deal", "body": "In his Oct 10 National Day speech, Taiwan President Lai Ching-te said a record NT$1.1 trillion defence budget for 2027 is meant 'not to provoke; rather, it is to deter war' and welcomed US-China dialogue (ST); analysts told the SCMP he avoided some earlier contentious phrasing (SCMP). Xinhua quotes defence ministry spokesperson Chen Xi as saying the speech shows Lai is a 'threat to peace' and that PLA drills around the island aim to deter separatism (Xinhua). Washington called Chinese maritime actions off Taiwan's east coast 'deeply destabilising', after Reuters reported the first known sighting there of a Chinese militia boat (ST), and a US$14 billion arms package still awaits Trump's approval (ST, SCMP). The WSJ reports that state-linked Chinese academics have claimed the Philippines' Batanes Islands, which overlook the Bashi Channel, calling it a new grey-zone move that Manila rejects (WSJ). Diplomacy continues alongside: Bessent may skip the Apec finance ministers' meeting in Hong Kong on Oct 20-21 to prepare for Trump's Nov 18-19 Shenzhen visit, sources told the SCMP, with the trade truce due to expire on Jan 10 (SCMP). Xinhua quotes Chen as saying the Chinese military is ready to work with the US side to manage differences, while the same spokesperson told Japan its 'neo-militarism' threatens the post-war order (Xinhua). In Tokyo, an ST analysis carried by BT says PM Sanae Takaichi is signalling an end to reflation after Trump complained about the weak yen (BT), and Xinhua reports the Cabinet approved a two-year cut in the food consumption tax to 1% (Xinhua). On Europe, BT reports that China and the EU reached a 16-point consensus late on Oct 9, with the EU saying China agreed to slash hybrid car exports; Xinhua's account stresses exploring tariff cuts within WTO rules and says the vehicle talks helped prevent further escalation. Moscow is also courting Beijing: Putin aide Nikolai Patrushev sought Chinese shipbuilding partners for new Russian yards (SCMP), while South Korea completed its first commercial Arctic round trip to Europe along Russia's coast (ST)."}, {"title": "Energy & climate - Hormuz stays shut as the Houthis widen attacks on Saudi Arabia", "body": "Iran's Supreme National Security Council secretary Mohsen Rezaei said the US response to Tehran's seven conditions for reopening the Strait of Hormuz was 'insufficient' (ST); Xinhua, citing his Press TV interview, adds that he threatened US cables, data centres and AI facilities in the region, including the UAE, if the US attacks again. The IRGC says three tankers that used what it calls an 'unauthorized' route hit mines and caught fire, and warns that ships crossing with navigation systems off will be treated as hostile (TASS, Xinhua); Xinhua also relays its claim to have hit the LPG carrier NV Sunshine. US Central Command said a fighter jet disabled the cargo vessel Ocean Molica as it tried to run the blockade (ST). TASS quotes Iran's deputy foreign minister as saying an Iran-Oman agreement on routes does not mean the strait will reopen immediately. Around Saudi Arabia, a Houthi strike on Riyadh's King Khalid International Airport on Oct 10 killed at least 12 people, the deadliest attack in the kingdom in more than a decade (WSJ); Trump said of joining Saudi strikes, 'We may' (BT). Singapore Airlines postponed its Riyadh launch until March (WSJ), and TASS relays Houthi claims of strikes on Aramco facilities at Shedgum and Tanajib. Shipping costs are biting: a VLCC from the US Gulf to China for November hit US$80 million, about US$40 a barrel, pricing US crude out of Asia (BT), while US refiners are 'printing money' on wide margins as 12.1% of global refining capacity was offline in September (WSJ). Ahead of the IMF-World Bank meetings, Banga warned that diesel and fertiliser prices and a looming 'super' El Nino are hitting at once, and G7 countries agreed to release 100 million barrels of diesel and crude (BT). Xinhua reports UNCTAD now sees 2.6% global growth in 2026, citing the energy shock. Asean deputy secretary-general Satvinder Singh said higher oil and gas prices would raise the region's energy import bill by close to US$200 billion next year (BT)."}, {"title": "Technology & AI - Calls for an AI 'emergency brake' as the compute scramble reshapes Silicon Valley", "body": "Microsoft CEO Satya Nadella said companies should treat powerful AI models as potential insider threats and build an 'emergency brake' to stop agentic models mid-task (ST); the administration's new Super Intelligence Force told developers on Oct 9 to report and resolve security incidents (ST), and Trump ordered agencies to say 'Super Intelligence' instead of AI (SCMP). The hunt for computing power is upending Silicon Valley: Anthropic's lease of more than 300 megawatts from SpaceX was later revealed to be worth up to US$45 billion, and one-year H100 rental prices are up 60%, according to SemiAnalysis (WSJ). SpaceX agreed to pay about US$8 billion for 800-megahertz spectrum to become a wireless carrier, people familiar said, and AT&T, Verizon and T-Mobile shares fell more than 6% after hours (WSJ). Deal talk continued, with the WSJ reporting Amazon in talks to buy Decart AI for around US$7 billion (BT) and Nvidia in early talks to invest more in, or supply compute to, Reflection AI (BT). A WSJ analysis notes Nvidia now says it will return free cash flow 'net of strategic uses', and calculates that treating its equity investments like capex would have halved its first-half free cash flow (WSJ), and a WSJ opinion column by Andy Kessler argues the data-center boom will end as models get cheaper and move onto devices (WSJ). On China, an SCMP explainer weighs Anthropic's claim that Chinese firms, including Moonshot, ran industrial-scale distillation of Claude through accounts largely based in Singapore and Japan (SCMP). Beijing issued guidelines, cited by Xinhua, to curb tech bubbles and keep AI 'safe, reliable and controllable' (BT); state funds injected 6.2 billion yuan into Hua Hong Group to push mature-node chips (SCMP); and Chinese optical chip stocks slid on fears of US curbs (SCMP). An ST analysis argues Beijing shares Washington's worries about frontier AI but rejects US framing (ST), and a Korean security firm linked AI-assisted attacks on South Korean banks to a Chinese DDoS-for-hire group, while stressing the links do not prove who did it (ST)."}, {"title": "Singapore & SEA focus - Local banks slide, Changi Creek opens and Malaysia's election-ready budget", "body": "OCBC fell 8.4% over the week to S$29, DBS 5% to S$73.36 and UOB 7.3% to S$39.96, while the STI lost 4.1% to 5,401.89; Citi downgraded OCBC to 'sell', and a BT column argues the slide reflects a global repricing of bank risk rather than local fundamentals (BT). ST Engineering opened its S$170 million Changi Creek airframe MRO facility, adding 40% to its Singapore wide-body capacity and more than 500 jobs by end-2027 (BT). MAS managing director Chia Der Jiun warned that AI agents executing digital-asset trades raise liquidity and collateral risks (BT). On energy, Shell and SLNG unloaded Singapore's first bio-LNG cargo meeting EU sustainability standards, and work began on SLNG's third jetty (BT). Asean's Satvinder Singh said sustainability and the digital economy agreement will lead Singapore's 2027 Asean chairmanship (BT), and a BT interactive says the Asean Power Grid needs US$27 billion of interconnectors by 2040 (BT). CCS is seeking views on Eneos Apac's purchase of Chevron Singapore (BT), and an ST feature says auctions of properties seized in the S$3 billion money-laundering case have drawn few buyers (ST). Japan's Sumitomo Bakelite will add chip-packaging materials lines in Singapore from end-fiscal 2028 (SCMP). In Malaysia, Prime Minister Anwar Ibrahim's RM510 billion Budget 2027 raises the minimum wage 17.6% to RM2,000 and targets a 3.3% deficit; economist Yeah Kim Leng told BT it gives him the runway for an early election (BT), and the government sees palm output edging down in 2027 (BT). Indonesia is weighing a freeze on new semi-finished nickel smelters, a risk for Chinese investors, who by one US think-tank's estimate account for about 75% of its nickel refining (SCMP). In the Philippines, Manila is pushing back against Chinese academics' claim to the Batanes Islands and chased away a Chinese survey ship (WSJ). The IMF-World Bank annual meetings open in Bangkok this week (BT, ST)."}], "keyMetrics": [{"value": "107", "label": "Articles curated today", "sub": "WSJ 17 · ST 20 · BT 24 · SCMP 20 · TASS 8 · Xinhua 18"}, {"value": "300,000 t", "label": "Russian diesel, first tranche", "sub": "Then 500,000 t in November and 1 million t thereafter, per Trump (Xinhua)"}, {"value": "5.29%", "label": "US 10-year Treasury yield", "sub": "Up almost 120bp this year; Pimco sees 6% as possible (BT)"}, {"value": "US$80M", "label": "VLCC charter, US Gulf to China", "sub": "About US$40 a barrel vs US$8.60 before the war (BT)"}, {"value": "5,401.89", "label": "STI, week to Oct 9", "sub": "-4.1%; OCBC -8.4%, UOB -7.3%, DBS -5% (BT)"}, {"value": "46.3", "label": "Michigan consumer sentiment, Oct", "sub": "Down from 48.1; record low is 44.8, set in May (WSJ)"}], "articles": [{"id": "wsj-12oct-01", "title": "American Oil Refiners Are Printing Money as Wars Shrink Global Energy Supplies", "source": "WSJ", "date": "12 Oct 2026", "tags": ["Energy", "Finance & Markets"], "summary": "America's largest independent refiners, including Valero Energy, Marathon Petroleum and Phillips 66, are set for bumper third-quarter earnings as the Iran war, crippled Middle East refineries and Ukrainian drone strikes on Russian plants widen crack spreads, while China and other Asian countries curb fuel exports. JPMorgan projects Valero's pretax earnings at US$8.95 billion, up 50% quarter on quarter and 24% above its mid-2022 record, and Piper Sandler sees Marathon's per-share earnings rising more than sevenfold year on year. US diesel recently hit a record US$6.53 a gallon, and 12.1% of global refining capacity was offline in September, according to Industrial Info Resources. The three stocks have more than doubled in 2026, but refiners are reluctant to invest in new capacity for a windfall they see as temporary.", "url": "https://www.wsj.com/business/energy-oil/american-oil-refiners-are-printing-money-as-wars-shrink-global-energy-supplies-c9240231"}, {"id": "wsj-12oct-02", "title": "At Least 12 Killed, Hundreds Injured at Saudi Airport in Houthi Strikes", "source": "WSJ", "date": "12 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "A Houthi missile attack on Riyadh's King Khalid International Airport on Oct 10 killed at least 12 people in the deadliest attack in Saudi Arabia in more than a decade, and injured more than 300, according to the kingdom's civil aviation authority. Missiles hit Terminals 3 and 4, causing extensive damage; the dead included one American, four Saudis, a Palestinian and residents from Bangladesh, Egypt, Jordan, Syria and Sudan. Saudi-led coalition spokesman Major General Turki Al-Malki called it a war crime and said coalition forces would respond, while President Trump said the US could join Saudi strikes on the Houthis. The airport is closed while damage is assessed, and the WSJ says the Future Investment Initiative summit in Riyadh at month-end will be a major test.", "url": "https://www.wsj.com/world/middle-east/iran-backed-houthis-hit-saudi-capitals-airport-in-damaging-new-attack-d4c12236"}, {"id": "wsj-12oct-03", "title": "China’s Next ‘Gray Zone’ Target: An Island Chain Critical to U.S. Defense of Taiwan", "source": "WSJ", "date": "12 Oct 2026", "tags": ["Geopolitics", "Defence", "Southeast Asia"], "summary": "State-linked Chinese academics have claimed the Philippines' Batanes Islands belong to China, a claim trumpeted by Chinese state media that analysts see as a new \"gray zone\" move against islands critical to any US defence of Taiwan. At a June seminar in Guangzhou, the scholars called the Batanes a geographic extension of Taiwan, according to a Jinan University school statement; the Philippine defence minister called this ludicrous and the National Historical Commission issued a detailed rebuttal. The islands, 100 miles southeast of Taiwan, overlook the Bashi Channel, and the US recently deployed mobile missile systems to them. In recent days the Philippine coast guard chased away a Chinese marine-survey ship backed by the Chinese coast guard, while China's embassy said it was operating in waters under China's jurisdiction.", "url": "https://www.wsj.com/world/asia/chinas-next-gray-zone-target-an-island-chain-critical-to-u-s-defense-of-taiwan-f4233818"}, {"id": "wsj-12oct-04", "title": "Consumer Sentiment Drops, per Michigan Survey", "source": "WSJ", "date": "12 Oct 2026", "tags": ["Finance & Markets", "Society"], "summary": "The University of Michigan's consumer sentiment index fell to 46.3 in its preliminary October reading from 48.1 in September, data published on Oct 9 showed, a bigger drop than the 48 economists surveyed by the WSJ had expected. The reading is close to the record low of 44.8 set in May, and if sustained in the end-of-month reading October would be the second-lowest level on record. Survey director Joanne Hsu said frustration over the cost of living continues to mount; the Journal said soaring fuel costs from the war with Iran are the latest strain. Inflation expectations rose for both the near and longer term, though actual spending remains buoyant and unemployment was 4.2% in September.", "url": "https://www.wsj.com/economy/consumers/consumer-sentiment-drops-per-michigan-survey-ea8fae7c"}, {"id": "wsj-12oct-05", "title": "For Walmart, Replacing Humans With Robots Is a Multibillion-Dollar Struggle", "source": "WSJ", "date": "12 Oct 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Walmart's decadelong, multibillion-dollar push to automate its warehouses is hitting technical snags, with Rob Montgomery, head of supply-chain operations for Walmart U.S., describing \"peak complexity\" as it retrofits most of its roughly 200 US supply-chain buildings without taking them out of service. Problems include shipping boxes too big for automated systems, breakdowns of Symbotic's shuttle robots (about 5% under repair recently, down from under 10% last year) and oversize items such as dog-food bags. By August more than 65% of stores received some automated freight and over 50% of e-commerce inventory moved through automated systems, close to targets set in 2023. Walmart expects automation spending to peak this year and next and will eventually need fewer warehouse workers, but executives expect no layoffs given high turnover.", "url": "https://www.wsj.com/business/logistics/walmart-automation-robots-warehouses-65f016b2"}, {"id": "wsj-12oct-06", "title": "Heard on the Street: Lennar and KB Home both say they are facing tougher competition from regular owners who are more motivated to sell", "source": "WSJ", "date": "12 Oct 2026", "tags": ["Finance & Markets", "Society"], "summary": "A WSJ Heard on the Street column by Carol Ryan argues home builders face a looming price war with existing-home owners who, with mortgage rates above 7%, are becoming more willing to cut prices. Lennar's average sale price in its west region fell US$44,000, or 7%, year on year in the three months through August, and KB Home cut the midpoint of its fourth-quarter average-price estimate to US$480,000 from US$500,000. Redfin data show 21% of sellers cut asking prices in the four weeks to Sept 20, while Realtor.com puts September inventory just 5% below 2019 levels. The column says costly rate buydowns have pushed Lennar's gross margin to 15.8%, and that Berkshire Hathaway's builder bets are a long-term play, not a sign of imminent recovery.", "url": "https://www.wsj.com/economy/housing/homhome-prices-sellers-mortgage-ratese-sellers-are-starting-to-blink-on-prices-thats-bad-for-builders-9512512f"}, {"id": "wsj-12oct-07", "title": "Houthis Bombard Saudi Air Links in Effort to Cut Kingdom Off From Rest of World", "source": "WSJ", "date": "12 Oct 2026", "tags": ["Geopolitics", "Finance & Markets"], "summary": "Yemen's Iran-backed Houthis are targeting Saudi Arabia's air links, with missile attacks on Riyadh's King Khalid International Airport and southern cities threatening business travel and tourism as the conference season begins. The Oct 8 strike on the Riyadh airport killed three, including a Saudia pilot, and destroyed a passenger jet; the airport closed again on Oct 9, and Singapore Airlines postponed the launch of its Riyadh flights until March. Dragonfly said it was at least the fifth strike on a Saudi airport this month and the kingdom appears to be struggling to intercept the attacks. People familiar with the matter say Saudi leaders won't cancel the Future Investment Initiative summit but worry about the economy and interceptor supplies, while the Trump administration has declined to intervene directly.", "url": "https://www.wsj.com/world/middle-east/houthis-bombard-saudi-air-links-in-effort-to-cut-kingdom-off-from-rest-of-world-1f8f55f9"}, {"id": "wsj-12oct-08", "title": "How a Binance ‘High-Value Customer’ Established a Financial Lifeline for Iran", "source": "WSJ", "date": "12 Oct 2026", "tags": ["Geopolitics", "Finance & Markets"], "summary": "An 80-page Binance report prepared in April for the UAE's financial intelligence unit, viewed by the WSJ, details how a network run by Iranian financier Babak Zanjani used 21 trading accounts on the exchange to move money linked to the IRGC. At least US$67 million flowed from two accounts to IRGC-connected wallets, and Zanjani's network made US$850 million in total transactions on Binance, mostly via his crypto firm Zedcex, whose account alone made almost US$830 million. The first account flagged belonged to a \"high-value customer\", Tajik associate Sukhrob Oimakhmadov, who received more than US$10 million from wallets Israel's Defense Ministry identified as IRGC's. Binance says it blocked the accounts by late 2025, removed the last in May, and that equating trading volume with funds reaching the IRGC is misleading.", "url": "https://www.wsj.com/world/middle-east/how-a-binance-high-value-customer-established-a-financial-lifeline-for-iran-43bdd88e"}, {"id": "wsj-12oct-09", "title": "How the AI Boom Ends", "source": "WSJ", "date": "12 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "In a WSJ opinion column, Andy Kessler argues the AI data-center boom will probably end as models become roughly 10 times cheaper and migrate to PCs and phones, though he says he cannot tell when. He cites OpenRouter pricing of US$1 to US$2 per million input tokens for some OpenAI and Anthropic models against 6 to 12 cents for Chinese open-weight models such as Z.ai's GLM and Alibaba's Qwen, and says American labs' market share fell from 70% last year to 30%. He points to compressed models that fit on high-end smartphones and Qualcomm's new Snapdragon NPU, which could run a 30-billion-parameter model in 3GB of memory. Kessler warns collapsing prices could set off data-center halts and debt defaults, asking whether 2027 will see peak data center.", "url": "https://www.wsj.com/opinion/how-the-ai-boom-ends-0d9d47e7"}, {"id": "wsj-12oct-10", "title": "Nvidia’s Subtle Change to How It Counts Cash Flow Has Big Implications for Buybacks", "source": "WSJ", "date": "12 Oct 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "A WSJ analysis by Jonathan Weil argues Nvidia has subtly endorsed counting strategic equity investments against free cash flow, after its Sept 28 presentation said it would return excess free cash flow \"net of strategic uses\" through buybacks and dividends. Nvidia raised its buyback programme by US$150 billion to a total authorisation of US$235 billion and holds stakes in 13 public and 229 private AI-ecosystem companies. It reported first-half free cash flow of US$69.9 billion, but treating net equity investments of US$35.2 billion as capex would halve that to US$34.7 billion, and adjusting for stock-award cash costs leaves about US$21.7 billion, per a WSJ analysis. Weil says Microsoft, Amazon and Alphabet should follow Nvidia in separating debt and equity investments in cash-flow statements.", "url": "https://www.wsj.com/finance/investing/nvidias-subtle-change-to-how-it-counts-cash-flow-has-big-implications-for-buybacks-8fb1fc0e"}, {"id": "wsj-12oct-11", "title": "SpaceX Makes Big Play to Become a Wireless Carrier", "source": "WSJ", "date": "12 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "SpaceX agreed to buy US cellular spectrum licences in the 800-megahertz band from investment firm Grain Management for about US$8 billion in cash, according to people familiar with the matter, its biggest move yet into a wireless market dominated by traditional telecom companies. The licences are tailored for tower-based service and could help Starlink reach places satellites can't, such as inside buildings, once the FCC approves the purchase. AT&T, Verizon and T-Mobile shares all fell more than 6% in post-close trading, while SpaceX shares rose about 3% to US$165.10. The deal follows FCC approval this week of SpaceX's bid to launch up to 15,000 mobile-service satellites and last year's roughly US$17 billion EchoStar spectrum deal.", "url": "https://www.wsj.com/business/telecom/spacex-makes-big-play-to-become-a-wireless-carrier-a90b2a1b"}, {"id": "wsj-12oct-12", "title": "The Desperate Hunt for AI Computing Power Is Upending Silicon Valley", "source": "WSJ", "date": "12 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "A scramble for scarce AI computing power is reshaping Silicon Valley, pushing rivals into alliances and fuelling internal fights over allocation. Anthropic agreed in May to lease more than 300 megawatts of computing power from Elon Musk's SpaceX, in a deal later revealed to be worth up to US$45 billion, after co-founder Tom Brown visited xAI in late March to broker it, according to people familiar with the matter. Google's Noam Shazeer, rehired in 2024 for US$2.7 billion, left for OpenAI after his team's compute was cut. One-year rental prices for Nvidia H100 computing have risen 60% in a year, per SemiAnalysis, and cloud providers now demand multiyear contracts with upfront payments often as high as 30%, squeezing startups.", "url": "https://www.wsj.com/tech/ai/ai-computing-power-demand-a63da9b9"}, {"id": "wsj-12oct-13", "title": "The Sleepy Insurance Product That Came to Power Private Credit’s Ascent", "source": "WSJ", "date": "12 Oct 2026", "tags": ["Finance & Markets", "Society"], "summary": "Private-asset managers such as Apollo and Brookfield have tapped American household savings through indexed annuities, which helped power their private lending to risky companies. The products promise market-linked gains with no loss, but insurers can change terms: Florida professor Sabrina Elliott's US$40,000 Aviva annuity, later owned by Apollo-backed Athene, had its market-linked share cut from 60% to 45%, returning 3.7% a year over 12 years versus 13% for the S&P 500. Indexed annuities account for nearly US$200 billion in reserves at asset manager-owned insurers, per AM Best, and sales rose to US$128 billion in 2025 from US$96 billion in 2023. Critics cite high agent commissions and misleading pitches; Athene says the annuity performed exceptionally well.", "url": "https://www.wsj.com/finance/the-sleepy-insurance-product-that-came-to-power-private-credits-ascent-e9586fa3"}, {"id": "wsj-12oct-14", "title": "Trump Announces White House Hearing to Investigate Fed’s Lisa Cook", "source": "WSJ", "date": "12 Oct 2026", "tags": ["Politics", "Finance & Markets"], "summary": "President Trump has directed Federal Reserve governor Lisa Cook to appear on Nov 5 at a closed-door White House hearing where a committee of his appointees, including National Economic Council director Kevin Hassett, will examine mortgage-fraud allegations she has denied. The presidential memorandum, dated Oct 7, says the committee will recommend whether there is cause to remove her, an apparent bid to satisfy the Supreme Court's finding that she could not be fired without minimal procedural protections. The hearing falls a day before Cook and the administration must give US District Judge Jia Cobb a joint proposal on her lawsuit. Cook's lawyers Abbe Lowell and Norm Eisen said they have \"grave doubts\" the hearing is legitimate.", "url": "https://www.wsj.com/economy/central-banking/trump-announces-committee-to-investigate-fed-governor-lisa-cook-bcd509fa"}, {"id": "wsj-12oct-15", "title": "Trump Calls On Ukraine to Stop Hitting Russian Refineries—and Replace Zelensky", "source": "WSJ", "date": "12 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "President Trump on Oct 10 called on Ukraine to replace Volodymyr Zelensky and pressed Kyiv to stop striking Russian oil refineries, blaming the strikes for high diesel prices, a day after announcing a deal with Vladimir Putin to supply Russian diesel to the US and world markets. At a Miami meeting on Oct 9, US negotiators Jared Kushner and Steve Witkoff urged Ukrainian officials to halt the strikes, citing US assistance including intelligence sharing, four people familiar with the conversation said; a US official denied any threat was made. Ukraine says it will keep hitting refineries unless Russia stops bombing its energy infrastructure, a mutual pause Putin has rejected. The diesel deal drew bipartisan criticism, with Sen. Jeanne Shaheen saying it violates a 2022 law.", "url": "https://www.wsj.com/world/trump-calls-on-ukraine-to-stop-hitting-russian-refineriesand-replace-zelensky-cc9bada8"}, {"id": "wsj-12oct-16", "title": "When companies stop driving a hard bargain, Cleveland Fed President Beth Hammack starts worrying", "source": "WSJ", "date": "12 Oct 2026", "tags": ["Finance & Markets", "Trade"], "summary": "In a WSJ interview, Cleveland Fed President Beth Hammack said strong demand and pricing power she hears about across her district mean the Fed, which raised its benchmark rate last month to a range of 3.75% to 4%, needs to go higher still. After touring manufacturer Jergens, whose aerospace orders are surging and whose customers pay premiums for speed, she said the economy \"does not look like an economy that has restraint\". Hammack, who dissented in favour of a hike in July, called most colleagues' view of inflation returning to the 2% target in 2029 far too long and favours smaller, more frequent adjustments. She conceded higher rates will not materially slow data-center demand and said rising bond yields complement, but do not substitute for, Fed action.", "url": "https://www.wsj.com/finance/investing/beth-hammack-cleveland-fed-inflation-7751c731"}, {"id": "wsj-12oct-17", "title": "Why Economists Think Higher Bond Yields Are Here to Stay", "source": "WSJ", "date": "12 Oct 2026", "tags": ["Finance & Markets", "Politics"], "summary": "The WSJ's latest survey of 71 forecasters, conducted Oct 2-7, finds economists expect higher long-term US yields to persist, with the 10-year Treasury yield seen ending 2026 at 5.1%, up from 4.4% in July's survey, and at 4.78% at end-2027. They cite improving growth, new inflationary pressures and fiscal concerns, and now see 2026 GDP growth of 2.4%, up from 2.1%, CPI inflation of 3.5% in December easing to 2.3% by end-2027, and a 24% chance of recession. Decision Economics' Allen Sinai sees the 10-year yield rising to nearly 6% next year. Of 52 respondents on the midterms, 48% said inflation risks will be greatest if Republicans keep both houses of Congress.", "url": "https://www.wsj.com/finance/investing/economists-bond-yields-forecast-aaa2ff5c"}, {"id": "st-12oct-01", "title": "AI-powered attacks on South Korean financial sectors linked to Chinese DDoS group: Report", "source": "ST", "date": "12 Oct 2026", "tags": ["Technology & AI", "Finance & Markets", "Geopolitics"], "summary": "A recent series of AI-backed cyberattacks on South Korean banks may be linked to Vitas, a Chinese group that carries out DDoS attacks for hire, according to an Oct 11 report by Seoul-based cybersecurity firm Logpresso. Logpresso said the Telegram account \"YY520CN\", tied to the bank hacks, was listed as a moderator of Vitas's GodNet online community in Sept 2024, building on an earlier October CrowdStrike report that matched Telegram and GitHub records with infostealer data. The firm stressed the account links alone do not establish who carried out the hacks, and the phone-number owner linked to YY520CN denied involvement. South Korean investigators suspect the attacker combined AI models including DeepSeek with ARTEX, a Chinese-made penetration-testing tool, to hit seven financial institutions; ARTEX's developer has since halted public updates.", "url": "https://www.straitstimes.com/asia/east-asia/ai-powered-attacks-on-south-korean-financial-sectors-linked-to-chinese-ddos-group-report"}, {"id": "st-12oct-02", "title": "Britain’s Burnham reiterates ‘complete solidarity’ with Zelensky after Trump clash", "source": "ST", "date": "12 Oct 2026", "tags": ["Geopolitics", "Politics"], "summary": "British Prime Minister Andy Burnham told Ukrainian President Volodymyr Zelensky in a call on Oct 10 that he had his \"complete solidarity\", after Zelensky clashed with US President Donald Trump over a US move to ease sanctions on Russian diesel. According to a Downing Street readout, the leaders discussed maintaining pressure on Russia, with Burnham saying the UK would keep strengthening sanctions, building on new UK designations against Russian targets announced this week. The two agreed to meet in person in the coming days. Trump and Zelensky traded barbs on Oct 10 as Russian strikes on Ukraine killed at least 21 people, including four children.", "url": "https://www.straitstimes.com/world/europe/britains-burnham-reiterates-complete-solidarity-for-zelensky-after-trump-clash"}, {"id": "st-12oct-03", "title": "Chile's Codelco reports mudslide at El Teniente mine; three workers affected", "source": "ST", "date": "12 Oct 2026", "tags": ["Finance & Markets", "Environment"], "summary": "Chile's state-owned copper miner Codelco said on Oct 11 that a mudslide had struck the open-pit operation at its El Teniente mine, affecting three workers. One worker was rescued and taken to a medical facility, while the other two had been located and rescue efforts were under way, the company said, without specifying their conditions. Codelco attributed the landslide to heavy rainfall in central Chile. It gave no details on the status of operations at the mine after the incident.", "url": "https://www.straitstimes.com/world/chiles-codelco-reports-mudslide-at-el-teniente-mine-three-workers-affected"}, {"id": "st-12oct-04", "title": "China is ready to address AI risks, just not on US terms", "source": "ST", "date": "12 Oct 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "In an ST analysis, Lim Min Zhang argues Beijing shares Washington's technical anxiety over frontier AI but rejects the Western political framing of the technology, and that both must bridge the divide to prevent catastrophic risks. On Sept 14 China's Foreign Ministry rebuked an essay by Anthropic CEO Dario Amodei while the same day updating its AI Safety Governance Framework 3.0, which warns recursive self-improvement could exceed human control. The writer says US safety efforts rest on corporate self-policing, while China's mandatory model filing since 2023 targets political control rather than frontier risk. He sees an opening in the AI dialogue agreed by Donald Trump and Xi Jinping at their September Washington summit, including a proposed AI crisis hotline.", "url": "https://www.straitstimes.com/opinion/china-is-ready-to-address-ai-risks-just-not-on-us-terms"}, {"id": "st-12oct-05", "title": "Deutsche Bank chief warns German election results worrying foreign investors", "source": "ST", "date": "12 Oct 2026", "tags": ["Politics", "Finance & Markets"], "summary": "Deutsche Bank chief executive Christian Sewing warned in a Bild interview that gains by far-right and far-left parties in September state elections could drive foreign investors away from Germany. The AfD narrowly missed an absolute majority in Saxony-Anhalt and two weeks later took first place in Mecklenburg-Western Pomerania, while the Left Party won its biggest victory in Berlin on a pledge to expropriate residential property companies' holdings. Sewing said investors do not distinguish between a state government and Germany as a whole, calling the trend \"a significant risk to Germany\". He urged Chancellor Friedrich Merz's government to press on with reforms to revive the economy.", "url": "https://www.straitstimes.com/world/europe/deutsche-bank-chief-warns-german-election-results-worrying-foreign-investors"}, {"id": "st-12oct-06", "title": "Iran says US response to its proposal to reopen Hormuz was 'insufficient'", "source": "ST", "date": "12 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "Iran's security chief Mohsen Rezaei, Secretary of the Supreme National Security Council, said the US response to Iran's seven conditions for reopening the Strait of Hormuz was \"insufficient\", state media quoted him as saying on Oct 11. Iran's proposal, presented during the UN General Assembly, would reopen the waterway and restore normal passage within seven days if the conditions were met; the US replied via Qatari intermediaries. Rezaei said Washington had accepted some conditions while others remained unclear, and that the strait would not open to the US nor talks take place until all are met. The strait carried a fifth of the world's oil and LNG before the war that began in late February with US and Israeli attacks on Iran.", "url": "https://www.straitstimes.com/world/middle-east/iran-says-us-response-to-its-proposal-to-reopen-hormuz-was-insufficient"}, {"id": "st-12oct-07", "title": "Microsoft CEO Nadella calls for ‘emergency brake’ on advanced AI", "source": "ST", "date": "12 Oct 2026", "tags": ["Technology & AI"], "summary": "Microsoft CEO Satya Nadella said in an Oct 10 post on X that companies should treat powerful AI models as potential insider threats, assume they could be compromised and build an \"emergency brake\" to pause or shut down agentic models mid-task. His recommendations include not relying on a single model for critical decisions, keeping tamper-proof records of agents' actions, independent audits and disclosure of major AI failures. The comments follow a spate of incidents disclosed by Anthropic and OpenAI, from an Anthropic model submitting a false tip in a police homicide case to hacks of third-party websites. The Trump administration's new AI task force, the Super Intelligence Force, said on Oct 9 developers must report and resolve security incidents or face unspecified consequences.", "url": "https://www.straitstimes.com/world/microsoft-ceo-nadella-calls-for-emergency-brake-on-advanced-ai"}, {"id": "st-12oct-08", "title": "More properties going under the hammer, but don’t expect dirt-cheap buys", "source": "ST", "date": "12 Oct 2026", "tags": ["Southeast Asia", "Society", "Finance & Markets"], "summary": "Singapore's property auction market is expanding but buyers should not expect bargains, an ST feature says, citing September's auctions of 25 high-end properties seized in the S$3 billion money laundering case. Only four condominiums, two each at Martin Modern and Wallich Residence, sold at the SRI auction on Sept 23, while separate Edmund Tie and Knight Frank auctions made no sales as reserve prices went unmet. Auction listings rose for a fifth straight quarter to 157 in the second quarter, and more than 80 confiscated units will be sold until mid-2027. Agents advise buyers to judge value against comparable transactions, total ownership costs and financing, noting deposits of 5% or 10% and completion within eight to 12 weeks.", "url": "https://www.straitstimes.com/business/more-properties-going-under-the-hammer-but-dont-expect-dirt-cheap-buys"}, {"id": "st-12oct-09", "title": "South Korea completes Arctic-Europe commercial voyage, eyes regular service despite risks", "source": "ST", "date": "12 Oct 2026", "tags": ["Trade", "Geopolitics"], "summary": "South Korean container ship PanStar Acro completed the country's first commercial round trip to Europe via the Arctic on Oct 11, docking in Busan 50 days after sailing on Aug 22. The route could cut typical voyage times by around a third, and President Lee Jae Myung's government hopes to launch regular services by 2030 to make Busan a global maritime hub. The project risks friction with Western allies seeking to isolate Russia, as the route runs along Russia's Arctic coast and Seoul consulted Moscow on the voyage. The trial carried only 737 TEU of cargo against about 1,300 TEU sought, and experts say viability hinges on schedules, insurance and fuel costs.", "url": "https://www.straitstimes.com/asia/east-asia/south-korea-completes-arctic-europe-commercial-voyage-eyes-regular-service-despite-risks"}, {"id": "st-12oct-10", "title": "Taiwan’s leader says increasing defence spending will ‘deter war’", "source": "ST", "date": "12 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "Taiwan President Lai Ching-te said in his National Day speech on Oct 10 that higher defence spending aims \"not to provoke; rather, it is to deter war\", as China applies military and grey-zone pressure. His government has earmarked a record NT$1.1 trillion for defence in 2027, more than 3% of GDP. China's Taiwan Affairs Office said the speech distorts the truth and accused Lai of separatist thinking. Lai welcomed US-China talks, while Taiwan awaits Donald Trump's signature on US$14 billion of weapons including the Patriot system, after Trump suggested in May that arms sales could be a bargaining chip with China.", "url": "https://www.straitstimes.com/asia/east-asia/taiwan-cherishes-peace-but-will-not-give-up-its-freedom-president-says"}, {"id": "st-12oct-11", "title": "Thank the bond vigilantes – they’re doing what politicians won’t", "source": "ST", "date": "12 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "In an ST commentary, Vikram Khanna draws on an Oct 7 fireside chat between President Tharman Shanmugaratnam and IMF managing director Kristalina Georgieva to argue that bond markets are now the main fiscal discipline on big debtor economies such as the US, France and Britain. Georgieva said global public debt is on track to exceed 100% of GDP; gross US debt has crossed US$40 trillion, about 123% of GDP, and the US 10-year yield recently neared 5.3%, its highest since 2002. Tharman warned interest rates are no longer well below growth and that AI could shift income from labour to capital, eroding tax revenue. Georgieva urged central banks to stick to price stability and told members to \"Act early, on your own, not when your hand is forced\".", "url": "https://www.straitstimes.com/opinion/thank-the-bond-vigilantes-theyre-doing-what-politicians-wont"}, {"id": "st-12oct-12", "title": "Trump announces deal with Putin for Russian diesel, but what is its most consequential element?", "source": "ST", "date": "12 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "In an ST analysis, Jonathan Eyal argues Donald Trump's Oct 9 deal to buy Russian diesel will barely move US prices but makes Washington dependent on Russian refineries that Ukraine has been striking, handing Vladimir Putin a major victory. Trump cited Russian supplies totalling more than 4.8 million tonnes by the White House's count, while Moscow gave no dates or volumes; Eyal says this month's volumes barely cover one day of US diesel needs. US diesel has hovered above US$6 a gallon for about a month, threatening Republicans in midterm swing states. He adds that, according to unnamed sources in The New York Times, US envoys in Miami floated releasing frozen Russian assets in return for a ceasefire promise.", "url": "https://www.straitstimes.com/world/united-states/trump-announces-deal-with-putin-for-russian-diesel-but-what-is-its-most-consequential-element"}, {"id": "st-12oct-13", "title": "Trump announces Ukraine energy ceasefire with Russia, surprising Zelensky", "source": "ST", "date": "12 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "US President Donald Trump announced on Truth Social on Oct 11 an energy ceasefire between Russia and Ukraine \"effective immediately\", but Volodymyr Zelensky said he was awaiting details and Moscow did not comment. The move followed days of US pressure on Kyiv to stop striking Russian refineries, which Trump blames for diesel prices hurting Republicans before November's midterms; a person familiar said the US threatened to cut intelligence sharing and PURL weapons procurement. Zelensky said Russia still hit energy infrastructure after the announcement, including a heating and power plant in Kharkiv. He also offered to hold elections if Putin agreed to a 60-day ceasefire, after Trump urged Ukrainians to replace him.", "url": "https://www.straitstimes.com/world/europe/trump-says-russia-and-ukraine-agree-to-energy-ceasefire"}, {"id": "st-12oct-14", "title": "Trump’s ‘energy ceasefire’ sparks confusion as Russia strikes Ukraine", "source": "ST", "date": "12 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "Donald Trump's Oct 11 announcement of an immediate energy ceasefire between Ukraine and Russia drew astonishment in Kyiv, silence from Moscow and support from Western allies, but Volodymyr Zelensky said Russia struck several Ukrainian power plants the same day, including in Kyiv and Kharkiv. Britain, France, Canada and the European Commission backed the ceasefire, in contrast to broad criticism of the US-Russia diesel deal announced two days earlier, which Zelensky called a \"weak decision\". Seven US senators, four of them Republicans, called the diesel deal illegal. After Trump said on Oct 10 it was time for Ukraine to get a new president, Germany's Johann Wadephul and EU chief Ursula von der Leyen reaffirmed support for Zelensky.", "url": "https://www.straitstimes.com/world/europe/trumps-energy-ceasefire-sparks-confusion-as-russia-strikes-ukraine"}, {"id": "st-12oct-15", "title": "Trump’s trade wars sting US manufacturers ahead of midterms", "source": "ST", "date": "12 Oct 2026", "tags": ["Trade", "Politics"], "summary": "Ohio manufacturers say Donald Trump's tariffs, the trade fight with Canada and the Iran war are raising costs and uncertainty ahead of November's midterms, a grievance Democrats hope to exploit. Doug Rende, CEO of aluminium products maker Shapes, says tariffs, which rose to 50% on aluminium in 2025, and higher transport fees will add upwards of US$4.5 million to US$5 million in costs this year, with freight surcharges above US$6,500 per container; he has paused hiring and is investing in robotics. Kitchen and bathroom maker Sam Miller has slowed plans for a Canadian distribution facility after US-Canada trade talks collapsed in August. Guy Coviello of the Youngstown Warren Regional Chamber called the effects negative overall.", "url": "https://www.straitstimes.com/world/united-states/trumps-trade-wars-sting-us-manufacturers-ahead-of-midterms"}, {"id": "st-12oct-16", "title": "Ukraine's Zelenskiy tells ABC he will organize elections if Russia agrees to 60-day ceasefire", "source": "ST", "date": "12 Oct 2026", "tags": ["Geopolitics", "Politics"], "summary": "Ukrainian President Volodymyr Zelenskiy told ABC's This Week programme on Oct 11 he would organise elections if Russian President Vladimir Putin agreed to a 60-day ceasefire. He was responding to Donald Trump, who on Oct 10 criticised Ukraine's attacks on Russian oil refineries a day after the US temporarily lifted sanctions on Russian fuel, and said it was \"time for Ukraine to get a new president\". Zelenskiy said it is up to Ukrainians to choose their leader, noted Putin also wants to change Ukraine's leadership, and blamed rising fuel prices on the Middle East war. Earlier on Oct 11 he said Ukraine was ready to halt refinery strikes if Moscow stopped hitting Ukrainian energy infrastructure.", "url": "https://www.straitstimes.com/world/europe/ukraines-zelenskiy-tells-abc-he-will-organize-elections-if-russia-agrees-to-60-day-ceasefire"}, {"id": "st-12oct-17", "title": "US military says it disabled cargo vessel trying to run Iran blockade", "source": "ST", "date": "12 Oct 2026", "tags": ["Defence", "Geopolitics", "Energy"], "summary": "US Central Command said on Oct 10 a US fighter jet struck the stern of the Panama-flagged cargo vessel M/V Ocean Molica, also known as the Arika Sun, in the Gulf of Oman with a precision munition after its crew ignored warnings and tried to run the naval blockade against Iran. CENTCOM said the strike fully disabled the ship's propulsion without harming the crew, and that the vessel had left an Iranian port. It warned mariners near the Strait of Hormuz to heed blockade warnings. Transits through the strait fell to their lowest in more than two months after tanker attacks last week hit their highest level since the US-Israel war on Iran began in February.", "url": "https://www.straitstimes.com/world/middle-east/us-military-says-it-disabled-cargo-vessel-trying-to-run-iran-blockade"}, {"id": "st-12oct-18", "title": "US says Chinese actions off Taiwan’s east coast are ‘deeply destabilising’", "source": "ST", "date": "12 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "A US State Department spokesperson called China's maritime actions off Taiwan's east coast \"deeply destabilising\", after Reuters reported the first known sighting there of a Chinese militia boat in August. China has stepped up activity east of Taiwan since June with regular coast guard patrols, and Taiwanese officials believe Beijing is practising for a possible blockade using military, paramilitary and civilian assets. The spokesperson urged Beijing to stop pressuring Taiwan and engage its democratically elected authorities; China's Foreign Ministry did not immediately respond. Taiwan's coast guard said the militia boat and accompanying vessels stayed outside restricted waters, while Donald Trump has yet to approve a new US$14 billion arms package for the island.", "url": "https://www.straitstimes.com/asia/east-asia/us-says-chinese-actions-off-taiwan-are-deeply-destabilising"}, {"id": "st-12oct-19", "title": "US senators want Trump to reverse course on Russia diesel", "source": "ST", "date": "12 Oct 2026", "tags": ["Politics", "Geopolitics", "Energy"], "summary": "Seven US senators, four Republicans and three Democrats, urged Donald Trump on Oct 11 to \"reverse course\" on his diesel supply deal with Russia, saying it breaches a 2022 congressional ban on Russian energy imports and that the administration failed to consult Congress as required. The signatories include Republicans Susan Collins, Lisa Murkowski, Thom Tillis and John Curtis. Treasury Secretary Scott Bessent said the administration would proceed using existing legal authority, and Senate No. 2 Republican John Barrasso defended the deal. The criticism comes weeks before the Nov 3 midterms, with diesel prices near record highs; Trump announced the deal on Oct 9 and temporarily lifted sanctions on Russian fuel.", "url": "https://www.straitstimes.com/world/united-states/prominent-republican-senator-says-trumps-russian-diesel-deal-may-be-illegal"}, {"id": "st-12oct-20", "title": "US threatens to block arms for Ukraine over refinery attacks, FT reports", "source": "ST", "date": "12 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "The US is threatening to halt the procurement system that supplies Ukraine with weapons to press Kyiv to stop deep strikes on Russian energy infrastructure, the Financial Times reported on Oct 11, citing officials in Europe. According to the report, US officials have been lobbying European capitals and Kyiv, and the threats included cutting off intelligence sharing and the Prioritised Ukraine Requirements List (Purl) mechanism. Reuters could not verify the report, and the White House did not immediately comment. The report followed Donald Trump's surprise announcement the same day of an immediate Russia-Ukraine energy ceasefire, on which Volodymyr Zelenskiy said he was awaiting details.", "url": "https://www.straitstimes.com/world/europe/us-threatens-to-block-arms-for-ukraine-over-refinery-attacks-ft-reports"}, {"id": "bt-12oct-01", "title": "Amazon is in talks to buy US$7 billion AI startup Decart, WSJ reports", "source": "BT", "date": "12 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Amazon is negotiating to acquire artificial intelligence startup Decart AI in a deal that could value it at around US$7 billion, The Wall Street Journal reported, citing people familiar with the matter. According to the Journal, the purchase could be wrapped up soon if the negotiations do not collapse. The talks follow Anthropic's decision in September not to acquire Decart; the Claude chatbot maker had been in talks to buy the startup for about US$6 billion and had performed due diligence. Decart was founded in 2023 by three Israeli engineers: brothers Dean and Orian Leitersdorf and Moshe Shalev.", "url": "https://www.businesstimes.com.sg/companies-markets/amazon-talks-buy-us7-billion-ai-startup-decart-wsj-reports"}, {"id": "bt-12oct-02", "title": "Bio-LNG could ensure Singapore’s energy resilience amid global disruptions: Tan See Leng", "source": "BT", "date": "12 Oct 2026", "tags": ["Energy", "Southeast Asia"], "summary": "Bio-LNG could help Singapore keep a \"diverse and resilient\" energy supply amid disruptions in the Middle East and Europe, Dr Tan See Leng, minister for energy, trade and industry (energy and industry), said at a Shell forum on Oct 9. Shell and Singapore LNG Corp (SLNG) said they had delivered and unloaded a bio-LNG shipment meeting EU sustainability standards for the first time at SLNG's Jurong Island terminal, where construction of a third jetty began on Oct 9. Jetty 3 will support about two million tonnes per annum of LNG bunker reload demand when completed in the second half of 2028. Shell also launched the LiveWire Singapore programme with the Action Community for Entrepreneurship to support local scale-ups.", "url": "https://www.businesstimes.com.sg/companies-markets/energy-commodities/bio-lng-could-ensure-singapores-energy-resilience-amid-global-disruptions-tan-see-leng"}, {"id": "bt-12oct-03", "title": "China emerges as source of cheap global funding as Beijing lets more yuan flow offshore", "source": "BT", "date": "12 Oct 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "China is becoming a source of low-cost funding for foreign borrowers, with regulators approving the offshore use of proceeds from more than 40% of panda bonds sold in 2026, a record share worth up to 130 billion yuan (US$19 billion), according to Bloomberg data. China's 10-year yield stood at 1.68% on Oct 8, against 5.23% for US Treasuries and 3.09% for Japanese bonds. Foreign issuers raised 115.5 billion yuan through Oct 8, twice 2025's total, and now make up 47% of the market, while dim sum bond sales have hit a record 1 trillion yuan. Analysts link the shift to Beijing's push to internationalise the yuan and recycle trade surpluses, though hedging costs of about 3% erode much of the saving.", "url": "https://www.businesstimes.com.sg/companies-markets/capital-markets-currencies/china-emerges-source-cheap-global-funding-beijing-lets-more-yuan-flow-offshore"}, {"id": "bt-12oct-04", "title": "China moves to stave off wider EU trade war with hybrid deal", "source": "BT", "date": "12 Oct 2026", "tags": ["Trade", "Geopolitics"], "summary": "China and the EU ended talks late on Oct 9 with a 16-point consensus covering trade, investment, export controls and intellectual property, with the EU saying China agreed to slash millions of hybrid car exports. People familiar with the discussions say the bloc intends to curb imports through safeguard measures, likely tariff-rate quotas, aiming to apply them from Dec 1. EU leaders meet on Thursday to weigh a tougher response to Chinese exports behind a trade deficit exceeding €1 billion a day, after Germany and France called for stronger tools. Trivium China's Joe Peissel called it a strategic win for Beijing, saying it conceded little on structural drivers, while analysts note China's rare-earth leverage deters sweeping EU barriers.", "url": "https://www.businesstimes.com.sg/international/china-moves-stave-wider-eu-trade-war-hybrid-deal"}, {"id": "bt-12oct-05", "title": "China vows to curb tech bubbles, keep AI risks in check", "source": "BT", "date": "12 Oct 2026", "tags": ["Technology & AI", "Politics"], "summary": "China will tighten oversight of its advanced technology drive to curb investment bubbles while keeping AI \"safe, reliable and controllable\", according to guidelines issued on Oct 9 by the Communist Party and the cabinet, as cited by Xinhua. The guidelines pledge breakthroughs in AI theory and core technologies, more computing power, algorithms and data, national pilot bases for industrial AI, and full implementation of the AI Plus initiative. Officials were told to avoid bubbles, industrial hollowing-out, blind investment and swarm-like rushes into high-tech sectors, and those responsible for major losses from blind investment will be held accountable. The document also calls for orderly development of the low-altitude economy.", "url": "https://www.businesstimes.com.sg/international/global/china-vows-curb-tech-bubbles-keep-ai-risks-check"}, {"id": "bt-12oct-06", "title": "Competition authority seeks public views on Eneos Apac’s proposed acquisition of Chevron Singapore", "source": "BT", "date": "12 Oct 2026", "tags": ["Finance & Markets", "Energy", "Southeast Asia"], "summary": "The Competition and Consumer Commission of Singapore (CCS) is seeking public feedback on Eneos Apac's proposed acquisition of Chevron Singapore, a petroleum products distributor indirectly wholly owned by Chevron Corp. CCS on Oct 2 accepted the companies' application for a decision on whether the deal would infringe section 54 of the Competition Act 2004. Chevron Singapore retails fuels and lubricants, runs fuel storage and terminals, and holds a stake in Singapore Refining Company, a 50:50 joint venture with SPC. Eneos Apac says the firms overlap only in lubricant blending and wholesale and that the deal raises no material competition concerns; submissions close at 5 pm on Oct 16.", "url": "https://www.businesstimes.com.sg/companies-markets/competition-authority-seeks-public-views-eneos-apacs-proposed-acquisition-chevron-singapore"}, {"id": "bt-12oct-07", "title": "DBS, OCBC, UOB face rate hike reality check", "source": "BT", "date": "12 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "A BT column argues the recent sell-off in DBS, OCBC and UOB is not entirely about their micro fundamentals but reflects a broader repricing of risk across global banks. Citi cut earnings forecasts for all three and downgraded OCBC to \"sell\" with a S$27.50 target, expecting its NIMs to contract in Q3 2026 as deposit rates outpace lending rates. OCBC fell 8.4% for the week to S$29, DBS 5% to S$73.36 and UOB 7.3% to S$39.96, while the STI dropped 4.1% to 5,401.89. The columnist says dividends remain decent, with DBS on course for a 4.4% yield, and advises investors to sit tight ahead of Q3 results next month.", "url": "https://www.businesstimes.com.sg/opinion-features/dbs-ocbc-uob-face-rate-hike-reality-check"}, {"id": "bt-12oct-08", "title": "Family offices see more tailored products, leverage ‘collective firepower’ for direct deal access", "source": "BT", "date": "12 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "More products are being structured for increasingly institutionalised family offices, industry leaders said at The Cercle's Singapore Family Office Forum at The Fullerton Hotel on Oct 6, attended by 60 family office principals, sovereign allocators and institutional leaders. Agentic Funds founder Sam Chowdhury said family offices seek opportunities fitting a 3L framework of lifestyle, legacy and liquidity, with patriarchs prioritising capital preservation and the next generation seeking real AI exposure. Participants said direct deal sourcing remains fragmented and slow, though one Hong Kong adviser said an AI platform cut investment decision time from two weeks to three to five days. The Cercle founder Noelle Reno said co-investing pools \"collective firepower\" to negotiate directly with target companies.", "url": "https://www.businesstimes.com.sg/companies-markets/family-offices-see-more-tailored-products-leverage-collective-firepower-direct-deal-access"}, {"id": "bt-12oct-09", "title": "Global bond sell-off may mean fewer rate hikes from central banks", "source": "BT", "date": "12 Oct 2026", "tags": ["Finance & Markets"], "summary": "A global bond sell-off has pushed yields to multi-year highs and tightened financial conditions, leading traders to pare rate-hike bets across eight major economies to 539 basis points from 717 basis points in September, according
