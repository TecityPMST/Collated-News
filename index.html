nship\" with Kim Jong-un. The Ulchi Freedom Shield exercise began Monday as planned.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20SCMP/Trump%20lets%2060-day%20deadline%20for%20Iran%20peace%20deal%20expire,%20threatens%20to%20'bomb'%20Oman.pdf"}, {"id": "scmp-24", "title": "US diesel crack surpasses US$100 a barrel for the first time on supply disruptions", "source": "SCMP", "date": "18 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "The US diesel crack, a key measure of refining profitability, hit an all-time high of US$102.20 a barrel Monday as supply disruptions from the wars in Iran and Ukraine met peak agricultural consumption season. Measured against WTI crude, the crack traded at US$99.82, up 2.4 per cent, setting intraday records in five of the last six sessions. Global refinery throughput averaged 80.9 million barrels a day in July, down about 5 million from a year ago. Middle Eastern exports have been hit by Strait of Hormuz disruptions, while Russia banned international sales until end-January after Ukrainian refinery attacks. US distillate inventories hit their lowest for the season since 1996. Analysts warned US pressure on Iranian exports and China could worsen the crisis.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20SCMP/US%20diesel%20crack%20surpasses%20US100%20a%20barrel%20for%20the%20first%20time%20on%20supply%20disruptions.pdf"}, {"id": "scmp-25", "title": "Why the Arctic sea route has become so important for China and Russia", "source": "SCMP", "date": "18 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "The 5,600km Northern Sea Route along Russia's Arctic coast has gained strategic importance for China and Russia as climate change opens the passage and disruptions hit the Suez Canal and Strait of Hormuz. The route offers China a path free of Western chokepoints: about 30 days from China to St Petersburg versus 45 via Suez. Some 38 container ships are making the journey this summer, up from 17 Chinese voyages last year. Chinese state firms hold stakes in Russia's Yamal LNG and Arctic LNG 2 projects. The two governments aim to lift bilateral cargo to 20 million tonnes by 2030. Sanctions have forced Russia to cut cargo targets but deepened cooperation with China, its principal Arctic partner. India and South Korea are also interested.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20SCMP/Why%20the%20Arctic%20sea%20route%20has%20become%20so%20important%20for%20China%20and%20Russia.pdf"}, {"id": "scmp-26", "title": "Xi Jinping's tribute to Jiang Zemin reinforces continuity and party unity", "source": "SCMP", "date": "18 Aug 2026", "tags": ["Politics", "Geopolitics"], "summary": "This commentary reads President Xi Jinping's tribute to former leader Jiang Zemin, on the centenary of his birth at the Great Hall of the People, as a signal of party unity and policy continuity ahead of the Communist Party's 21st national congress and amid intense US rivalry. Xi delivered a 40-minute address praising Jiang's leadership through the post-1989 turmoil, the Soviet collapse and the Asian financial crisis, plus his anti-corruption support and tough stance on Taiwan independence. The speech echoed Xi's 2022 funeral eulogy calling Jiang \"a great Marxist\". The piece argues Xi shares Jiang's unwavering belief in the party's cause, citing Jiang's oversight of Hong Kong's and Macau's return and \"one country, two systems\". The commemoration aims to rally party members before the congress.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20SCMP/Xi%20Jinping's%20tribute%20to%20Jiang%20Zemin%20reinforces%20continuity%20and%20party%20unity.pdf"}]}};</script>
