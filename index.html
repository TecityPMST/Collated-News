ity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/China's%20hypersonic%20weapons%20can%20be%20guided%20by%20the%20stars%20if%20GPS%20fails%20report.pdf"}, {"id": "scmp-10", "title": "Facebook parent Meta to unwind US$2 billion Manus AI deal after Beijing block", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "Meta Platforms is fully unwinding its roughly US$2 billion acquisition of Chinese-founded AI agent platform Manus, more than three months after Beijing blocked the deal on national-security grounds, marking another US-China tech decoupling. On Tuesday Manus told users it would delete data generated by certain users on or after December 29, when Meta acquired it, as it returns to independent operations; affected users must back up by August 23. Manus, built by 2022-founded Butterfly Effect, had rebranded as a Singapore company, shedding China staff to access US models and Nvidia chips before Meta's late-December purchase. Beijing's probe concluded in April ordering the unwind. Tencent was reportedly in talks to become the largest shareholder. User data will stay stored in the US and Singapore.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/Facebook%20parent%20Meta%20to%20unwind%20US2%20billion%20Manus%20AI%20deal%20after%20Beijing%20block.pdf"}, {"id": "scmp-11", "title": "Gold breakout rally sends Chinese bullion stocks near highs as central banks keep buying", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Finance & Markets"], "summary": "Rebounding gold prices have lifted shares of Chinese producers Zijin Mining and Chifeng Jilong Gold at least 40 per cent from July lows, near record highs, with a mainland gold-stock gauge up about 25 per cent. Bullion rose 1.3 per cent to US$4,479 an ounce Tuesday as weak US jobs data eased rate-hike fears, though it remains 18 per cent below January's US$5,447 peak after an oil-driven selloff. Gold broke above its 50-day moving average this month. Central banks bought a record 289 tonnes in the second quarter, up 62 per cent, led by Poland (51 tonnes) and China (33 tonnes). State Street forecasts US$5,000 by early 2027 and Deutsche Bank US$4,700 by year-end, citing sovereign-debt risks and reserve diversification.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/Gold%20breakout%20rally%20sends%20Chinese%20bullion%20stocks%20near%20highs%20as%20central%20banks%20keep%20buying.pdf"}, {"id": "scmp-12", "title": "Hong Kong property recovery faces new risk as China widens offshore tax net", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Finance & Markets", "Society"], "summary": "Hong Kong's property recovery could face a fresh test if China's crackdown on offshore wealth extends from insurance returns to property income, curbing mainland demand and pressuring decentralised office markets, analysts say. Beijing reportedly imposes a 20 per cent personal income tax on certain offshore returns by mainland residents, including Hong Kong insurance gains; property is not yet covered but scrutiny may broaden. UBS estimates a 20 per cent tax would cut net residential yields from 2.2 to 1.8 per cent. Insurers occupy about 6 per cent of grade-A office stock, concentrated in Kowloon East and Island East. Mainland buyers account for 7 to 33 per cent of residential transaction value. First-half transactions hit 48,458 units, 72.5 per cent of 2025's total.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/Hong%20Kong%20property%20recovery%20faces%20new%20risk%20as%20China%20widens%20offshore%20tax%20net.pdf"}, {"id": "scmp-13", "title": "Jellyfish force shutdown of 3 reactors at French nuclear power plant", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Energy", "Environment"], "summary": "EDF shut three reactors at France's Gravelines nuclear plant near Dunkirk after a swarm of jellyfish clogged the seawater pumps used to cool the units, the utility said Tuesday. Three reactors went offline Monday and a fourth's output was halved, leaving one at full capacity; a sixth was already down for maintenance. EDF said the incident posed no risk to safety, personnel or the environment. Gravelines, western Europe's largest plant with six 900-megawatt reactors, was similarly halted by jellyfish a year ago. France's nuclear output has been repeatedly disrupted this year by heatwaves and droughts, with a 15.6 per cent shortfall recorded Sunday. Experts blame overfishing, plastic pollution and warming seas for surging jellyfish populations. Similar shutdowns hit Sweden in 2013 and Japan in 1999.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/Jellyfish%20force%20shutdown%20of%203%20reactors%20at%20French%20nuclear%20power%20plant.pdf"}, {"id": "scmp-14", "title": "Meta to challenge China's open-weight AI dominance amid US regulatory fears", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Technology & AI"], "summary": "Meta Platforms is renewing its open-source AI push to challenge China's dominance in open-weight models and lure US customers wary of looming Washington restrictions on Chinese AI. On Monday it launched Muse Glimmer, a 30-billion-parameter model light enough to run locally, and said it would release weights of its flagship Muse Spark 1.2. CEO Mark Zuckerberg pledged \"personal superintelligence to billions of people.\" Analysts say Spark 1.2 ranks between Claude Sonnet 5 and GPT-5.6 Terra, trailing Moonshot's Kimi K3 but beating Zhipu's GLM-5.2, with the advantage of being \"not Chinese.\" Washington reportedly weighs curbs on foreign open-weight models. Analysts warn adoption ultimately hinges on performance; Meta cites a compute advantage over hardware-constrained Chinese labs.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/Meta%20to%20challenge%20China's%20open-weight%20AI%20dominance%20amid%20US%20regulatory%20fears.pdf"}, {"id": "scmp-15", "title": "New Hong Kong trade office in Malaysia a bridge to Greater Bay Area: minister", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Trade", "Southeast Asia"], "summary": "Hong Kong has opened an Economic and Trade Office in Kuala Lumpur, which Commerce Secretary Algernon Yau called a \"highly strategic move\" to deepen regional ties and position the city as a bridge to the Greater Bay Area. The office will oversee Malaysia, Brunei, Pakistan and Laos, supporting a two-way strategy helping Hong Kong firms enter Malaysia and Malaysian enterprises access the bay area via Hong Kong's professional services. Asean is Hong Kong's second-largest merchandise trading partner; two-way Hong Kong-Malaysia trade was HK$220 billion (US$28.2 billion) in 2022. Yau led a 200-strong delegation, with over 1,600 executives at a business dialogue and 300-plus matching sessions. It is Hong Kong's 15th overseas ETO. Yau said the city is pushing to join RCEP.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/New%20Hong%20Kong%20trade%20office%20in%20Malaysia%20a%20bridge%20to%20Greater%20Bay%20Area%20minister.pdf"}, {"id": "scmp-16", "title": "US export controls achieving no strategic gain but hurting American firms, survey finds", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Trade", "Geopolitics"], "summary": "US export-control licensing is achieving little strategic benefit while costing billions in lost exports and eroding American firms' global market share, a US-China Business Council flash survey of 31 companies in July found. Most pending licences cover items already available in China from Chinese or international suppliers, USCBC president Sean Stein said, arguing controls \"undermine US competitiveness\" without protecting security. Lengthy reviews were cited by 95 per cent; two-thirds waited over three months, exceeding the statutory 90-day rule, and 31 per cent waited one to two years. Some 73 per cent reported lost sales to Chinese rivals. US goods exports to China fell over a quarter in 2025 to US$106.3 billion. Stein called next month's expected Trump-Xi meeting \"enormously important.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/US%20export%20controls%20achieving%20no%20strategic%20gain%20but%20hurting%20American%20firms,%20survey%20finds.pdf"}, {"id": "scmp-17", "title": "US faults China over opaque overseas lending, warns of emerging-market debt risks", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Geopolitics", "Finance & Markets"], "summary": "The US State Department's 2026 Fiscal Transparency Report says China failed minimum transparency requirements, warning that opacity around its overseas lending raises the risk of unexpected defaults and debt restructuring in emerging markets. It faulted undisclosed foreign claims held by Chinese state-owned and commercial banks and enterprises, which \"obscures the scale and terms of many sovereign liabilities.\" The department added a requirement that governments publish terms of sovereign loans, including collateral, though it did not say the rule specifically targeted China. Of 139 countries reviewed, 73 met requirements and 67 did not. The report also cited domestic deficiencies: off-budget accounts lacking audit, incomplete debt data, and a supreme audit institution failing independence standards. Beijing rejects \"debt trap\" accusations.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/US%20faults%20China%20over%20opaque%20overseas%20lending,%20warns%20of%20emerging-market%20debt%20risks.pdf"}, {"id": "scmp-18", "title": "Ukraine says Russia fired North Korean missiles in deadly attack", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Ukraine said Russian attacks killed at least 10 people overnight and wounded dozens, accusing Moscow of firing North Korean ballistic missiles. President Volodymyr Zelensky said Zaporizhzhia \"was struck with North Korean ballistic missiles, Zircons,\" killing seven Zaporizhstal steelworkers heading to shelter. Three more died in Dnipropetrovsk, with further deaths in Sumy and Odesa. A Kyiv children's hospital was hit but staff sheltered safely. Zelensky said Ukraine gave the US proposals to end the war and appealed for air defence, alleging Russia received more North Korean missiles and that 30,000 to 50,000 troops may deploy. Seoul said it was watching \"closely.\" Ukraine faces a Patriot-interceptor shortage since February's US-Israeli war in Iran; civilian deaths are the highest since 2022.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/Ukraine%20says%20Russia%20fired%20North%20Korean%20missiles%20in%20deadly%20attack.pdf"}, {"id": "scmp-19", "title": "Wharf firms up balance sheet as Hong Kong home sales cushion profit slump", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Finance & Markets"], "summary": "Hong Kong developer Wharf (Holdings) is leaning on the city's luxury-home market to offset mainland weakness, paring investment and building cash. First-half Hong Kong development revenue nearly tripled to HK$1.35 billion (US$172 million), with operating profit up more than fivefold, offsetting a 54 per cent drop in mainland development revenue, where a HK$547 million impairment was booked. It sold its first house at 1 Plantation Road for HK$558 million. Group profit plunged 91 per cent to HK$48 million on investment-property revaluation deficits; underlying profit fell 17 per cent. Net cash rose to HK$6.2 billion from HK$2 billion, funding a doubled HK$0.40 interim dividend. Chairman Stephen Ng said Hong Kong property is Wharf's \"first choice,\" citing few good mainland opportunities. Logistics profit fell 19 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/Wharf%20firms%20up%20balance%20sheet%20as%20Hong%20Kong%20home%20sales%20cushion%20profit%20slump.pdf"}, {"id": "scmp-20", "title": "Why submarine attacks may prove to be the Achilles' heel for China's new carrier fleet", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "China's rapidly expanding aircraft-carrier fleet may be vulnerable to submarine attack, an area where its defences lag the US, a new Centre for Strategic and International Studies report says. The \"cost-imposition\" strategy proposes land-based strikes, long-range air strikes, cyber and electromagnetic attacks and drone swarms, but submarine ambushes at first-island-chain chokepoints are seen as China's weakest point. Christopher Sharman said the undersea vulnerability \"remains significant today\" though not static, as PLAN meteorological and oceanographic capabilities still trail the US Navy. Beijing's Transparent Ocean programme deploys satellites, buoys, gliders and seabed sensors, and it is expanding patrol aircraft and Type 927 surveillance ships. Analyst Timothy Heath said land-based missiles remain China's best option, calling carriers too valuable to expose.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/Why%20submarine%20attacks%20may%20prove%20to%20be%20the%20Achilles'%20heel%20for%20China's%20new%20carrier%20fleet.pdf"}]}, "2026-08-13": {"date": "2026-08-13", "dayOfWeek": "Thursday", "totalArticles": 82, "sourceCounts": {"WSJ": 12, "ST": 17, "BT": 29, "SCMP": 24}, "executiveDigest": "US inflation cooled in July - 'disinflation returns' - giving the Fed room to breathe, lifting gold to a two-month high and the S&P as CoreWeave's results fuelled AI optimism. But the Hormuz standoff ground on: Trump declared the strait 'under U.S. control', yet WSJ noted 'few ships are listening' as OPEC cut its demand forecast and the 2026 supply shortfall deepened. Singapore's markets ran hot - DBS price targets were raised to S$81 after a record Q2, JPMorgan floated an STI '7,000' bull case, and MAS eased family-office tax rules to court global wealth.", "briefingCards": [{"title": "Lead story - Disinflation gives the Fed room", "body": "The data turned the Fed's way: ST reported 'US consumer inflation slows in July, giving the Fed room to breathe', and WSJ declared 'disinflation returns, Kevin Warsh's critics hardest hit'. Markets rallied - gold rose to a two-month high as the print 'dampened rate-hike bets', and the S&P 500 'ended higher as CoreWeave results fuelled AI optimism'. The soft landing narrative competed with an unresolved oil picture: OPEC 'cut its oil-demand forecast again as Hormuz talks stall', US crude stockpiles posted an unexpected build, and BT warned the 'global 2026 oil supply shortfall will deepen as a Hormuz reopening remains elusive'. The dollar ticked up on Iran tension even as the yen's intervention put China's renminbi under fresh pressure."}, {"title": "Markets & finance", "body": "It was a blockbuster Singapore markets day: analysts raised DBS price targets 'to as high as S$81' after a record Q2, saw DBS and OCBC 'ahead on wealth', and JPMorgan floated an 'STI 7,000' bull case over 12 months, while SGX's July securities turnover jumped 37% to S$46.2 billion (even as 'SGX's record year masks Singapore's equities challenge'). MAS eased family-office tax rules and widened AML checks to court global wealth. Globally, Norway's wealth fund posted a record US$184 billion H1 profit, Jane Street is repaying a US$5.5 billion loan, Bank of America launched a US$250 billion tech-and-energy infrastructure push, and Switzerland moved on stricter bank-bonus rules. UOL (+23%), CICT (+7.1% DPU) and AEM (profit up tenfold on AI chips) rounded out earnings."}, {"title": "Asia realignment", "body": "The US-China track stalled: SCMP said the 'Board of Investment' mechanism 'stalls before an expected Trump-Xi meeting', a US congressional panel judged China 'projects outward confidence amid economic anxiety', and Singapore and South Korea are eyeing science tie-ups 'as the last main US-China link shatters'. Beijing extended its reach - sending scientists to Iran for rare-earth 'exploration and processing' and pushing a 'Go Global 3.0' era from solar to AI. Security frictions grew: after China's missile test the US and allies 'demanded 24-hour warning next time', the PLA held its first joint naval drill with Indonesia east of Taiwan (Jakarta called it 'routine'), and Erdogan pushed a Turkey-Saudi-Pakistan defence pact."}, {"title": "Energy & climate", "body": "Oil stayed torn between weak demand and Hormuz risk: OPEC cut its demand forecast as talks stalled, US crude stockpiles unexpectedly built, and prices only edged up, yet BT warned the 2026 supply shortfall will deepen while a ship paid a near-record US$4 million to skip the Panama Canal queue amid Hormuz-driven congestion. WSJ flagged the Black Sea as 'another global chokepoint' being squeezed by war, and 'red-hot power stocks are losing steam'. Malaysia is exploring using palm oil to cool data centres as water demand surges, and US soybean growers are pivoting to new buyers and biofuel 'fearing deflated China demand'."}, {"title": "Technology & AI", "body": "AI earnings and plumbing dominated: Cisco's profit jumped 'as AI orders roll in', CoreWeave boosted its 2026 spending and beat estimates, Super Micro guided sales up to US$15.5 billion, and Foxconn is ramping global AI-server production (its Taiwan arm posted a 35% profit rise). WSJ detailed 'why Wall Street and Nvidia are building an exotic money pipeline for the AI boom', and projected data-centre insurance premiums topping US$24 billion by 2030. The model race sharpened - Apple is in talks to pay publishers to improve an AI-powered Siri, and DeepSeek 'publicised efforts to challenge Anthropic's Claude Code' - even as Tencent's Q2 profit fell 'as its AI push builds' and Cerebras swung to a loss while lifting its outlook."}, {"title": "Singapore & SEA focus", "body": "Singapore's financial hub was in the spotlight: DBS targets were raised to S$81 on a record Q2, JPMorgan sees the STI potentially hitting 7,000, SGX July turnover rose 37% to S$46.2 billion, life insurers grew H1 premiums 21.4%, and MAS eased family-office tax rules while widening AML checks 'as Singapore vies for global wealth'. AEM's profit rose tenfold on AI-chip demand, and SK Hynix and Samsung shares rallied on reports of Temasek investment plans. Property sent mixed signals - UOL's H1 profit rose 23%, but two-thirds of Sentosa Cove homes resold at a loss (average loss topping $1 million since 2023) - while a proposed one-north rezoning would double space for start-ups. Regionally, Malaysia's PM Anwar was discharged after surgery ahead of a pivotal PKR-DAP week."}], "keyMetrics": [{"value": "82", "label": "Articles curated today", "sub": "WSJ 12 · ST 17 · BT 29 · SCMP 24"}, {"value": "Disinflation", "label": "US July inflation cools", "sub": "Fed 'room to breathe'"}, {"value": "2-mo high", "label": "Gold rises", "sub": "Rate-hike bets dampened"}, {"value": "S$81 / 7,000", "label": "DBS target; STI bull case", "sub": "Record Q2; JPMorgan"}, {"value": "'Few listening'", "label": "Trump claims Hormuz control", "sub": "OPEC cuts demand forecast"}, {"value": "US$15.5b", "label": "Super Micro guidance", "sub": "CoreWeave, Cisco ride AI"}], "articles": [{"id": "wsj-01", "title": "Apple in Talks to Pay Publishers to Improve AI-Powered Siri", "source": "WSJ", "date": "13 Aug 2026", "tags": ["Technology & AI"], "summary": "Apple is negotiating multiyear deals with publishers to license content for delivering current news through its AI-powered Siri voice assistant, expected to launch later this year, people familiar said. Unlike standard licensing tied to guaranteed fees and broad access, Apple proposed a variable, pay-as-you-go plan paying partners when their content is used, discussing a possible nine-figure budget. Apple declined to comment. The push comes as the iPhone maker upgrades Siri, long criticized for weak utility, to integrate AI more deeply. Apple previously paid publishers for AI training rights and launched Apple News+ in 2019. News Corp, owner of The Wall Street Journal, supplies news via Apple. A late-2024 AI news-roundup experiment published erroneous headlines and was quickly disabled.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20WSJ/Apple%20in%20Talks%20to%20Pay%20Publishers%20to%20Improve%20AI-Powered%20Siri.pdf"}, {"id": "wsj-02", "title": "Cerebras Swings to Second-Quarter Loss, Lifts Full-Year Outlook", "source": "WSJ", "date": "13 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Cerebras Systems swung to a second-quarter loss of $450.5 million, or $2.98 a share, versus a $309.5 million profit a year earlier, while revenue rose to $180.1 million from $103.3 million. Core revenue more than doubled to $209.9 million, beating the $190.6 million expected, with a 41% core gross margin. Shares slid 16% after hours to $220.38 despite a 12% regular-session gain. The chip company cited margin pressure from renting back its own systems to meet inference demand. CFO Bob Komin said margins hit a low in the current quarter before improving, with over 600 megawatts of capacity contracted. Cerebras lifted full-year core-revenue guidance to $880 million-$890 million and forecast a tripling of core revenue in 2027.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20WSJ/Cerebras%20Swings%20to%20Second-Quarter%20Loss,%20Lifts%20Full-Year%20Outlook.pdf"}, {"id": "wsj-03", "title": "Cisco Reports Sharp Jump in Profit as AI Orders Roll In", "source": "WSJ", "date": "13 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Cisco Systems reported a July-quarter profit of $3.86 billion, or 97 cents a share, up from $2.55 billion a year earlier, as artificial-intelligence hyperscalers kept placing large orders. Adjusted earnings of $1.22 beat the $1.17 expected; revenue grew to $17.25 billion from $14.67 billion, topping forecasts. Product revenue rose 24%. The company took $4 billion in AI infrastructure orders from hyperscalers in the fourth quarter, reaching $9.3 billion for the fiscal year. CEO Chuck Robbins called it \"the fastest-moving technology transition\" ever seen and said demand across the portfolio is the most consistent in 30 years. Cisco guided fiscal 2027 adjusted earnings of $5.05-$5.11 on revenue of $72.2 billion-$73.4 billion, above analyst estimates.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20WSJ/Cisco%20Reports%20Sharp%20Jump%20in%20Profit%20as%20AI%20Orders%20Roll%20In.pdf"}, {"id": "wsj-04", "title": "Disinflation Returns, Kevin Warsh's Critics Hardest Hit", "source": "WSJ", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "The Wall Street Journal editorial board defends new Fed Chair Kevin Warsh after July's consumer-price index rose just 0.1%, disappointing critics who questioned his credibility after three months. Warsh rejects \"forward guidance,\" promising to meet the Fed's 2% inflation target without it; the board applauds. July's rise followed a minus-0.4% June reading; core prices rose 0.2%, with the 12-month core at 2.5%, down from 2.9% in May. Headline CPI remains elevated at 3.4%, lifted by energy-driven spring increases tied to the Iran war. The board says underlying inflation is moderating, vindicating July's decision not to raise rates. Real hourly earnings fell 0.1%, pressuring Republicans before November. The FOMC meets in September and could tighten if inflation reaccelerates.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20WSJ/Disinflation%20Returns,%20Kevin%20Warsh's%20Critics%20Hardest%20Hit.pdf"}, {"id": "wsj-05", "title": "Foxconn Ramping Up Global AI Server Production to Ride Booming Cloud Investment", "source": "WSJ", "date": "13 Aug 2026", "tags": ["Technology & AI", "Trade"], "summary": "Foxconn Technology Group is expanding global production of AI servers to capture surging cloud-infrastructure investment, having become a critical supplier to leaders such as Nvidia. Second-quarter net profit climbed a better-than-expected 35% to NT$59.97 billion (US$1.86 billion) as revenue surged 41% to NT$2.526 trillion, with server-related revenue exceeding half of total sales. Rotating CEO Michael Chiang said U.S. cloud providers' capital expenditure will fuel growth this year and next, with demand steadier than consumer electronics. Foxconn is expanding to hundreds of sites across 24 countries under a \"local for local\" strategy spanning Taiwan, Mexico, Vietnam and the U.S. Morgan Stanley projects its high-end rack share falling to 39% this year from 51%, as buyers diversify suppliers.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20WSJ/Foxconn%20Ramping%20Up%20Global%20AI%20Server%20Production%20to%20Ride%20Booming%20Cloud%20Investment.pdf"}, {"id": "wsj-06", "title": "OPEC Cuts Oil-Demand Forecast Again as Hormuz Talks Stall", "source": "WSJ", "date": "13 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "OPEC again cut its 2026 global oil-demand growth forecast to 580,000 barrels a day from 780,000, citing stalled talks to reopen the Strait of Hormuz and Red Sea risks that prolong supply disruptions. It raised next year's growth estimate to 2.16 million barrels a day. OPEC remains far more optimistic than the International Energy Agency, which expects demand to fall 1.6 million barrels a day this year. OPEC members' output rose 1.66 million barrels a day to 23.63 million in July, led by Kuwait, Iraq and Saudi Arabia. Hormuz talks hit an impasse; President Trump has turned to economic pressure via sanctions and a naval blockade. Brent traded near $89 a barrel and WTI above $83.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20WSJ/OPEC%20Cuts%20Oil-Demand%20Forecast%20Again%20as%20Hormuz%20Talks%20Stall.pdf"}, {"id": "wsj-07", "title": "Red-Hot Power Stocks Are Losing Steam", "source": "WSJ", "date": "13 Aug 2026", "tags": ["Energy", "Finance & Markets"], "summary": "Shares of U.S. power-plant owners have slumped in 2026-Constellation Energy down 21%, Vistra 10%, NRG 25%-while equipment makers surged, with GE Vernova up 55% and Caterpillar 47%, as regulatory shifts reshape the AI power race. In Texas, Governor Greg Abbott ordered a halt on data-center grid connections pending an audit, denting Vistra and NRG. At mid-Atlantic grid operator PJM, a failed capacity auction left a 6.8-gigawatt shortfall; planned extra procurement and data-center matchmaking are expected to lower future capacity prices, hurting incumbents that profited from tightening markets. Bulls argue existing generators can still sign data-center contracts more cheaply than new builds. Analysts say the direction favors new generation, on and off the grid, widening competition.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20WSJ/Red-Hot%20Power%20Stocks%20Are%20Losing%20Steam.pdf"}, {"id": "wsj-08", "title": "Trump Says Hormuz Is Under U.S. Control. Few Ships Are Listening.", "source": "WSJ", "date": "13 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "President Trump claimed Wednesday the U.S. has \"total control\" of the Strait of Hormuz, but ship-tracking data shows only 14 vessels crossed on Tuesday, versus over 130 daily before the war; 11 used Iran's route. Analysts say Tehran has squelched traffic with only sporadic drone and missile attacks by making shippers, captains and insurers fear reprisal. War-risk insurance has risen to as much as 10% of a ship's value, from 0.25% before the war. The IEA said Hormuz is effectively closed again since June's deal collapsed. Iran's grip has cost 2.6 billion barrels of oil since February, Aramco's chief said. Houthi attacks at Bab al-Mandeb killed four sailors aboard the Tihamah, the first such deaths.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20WSJ/Trump%20Says%20Hormuz%20Is%20Under%20U.S.%20Control.%20Few%20Ships%20Are%20Listening..pdf"}, {"id": "wsj-09", "title": "Trump Secretly Flown Out of Turkey on Military Jet Amid Iran Threat", "source": "WSJ", "date": "13 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "President Trump was secretly flown out of Turkey last month on a military jet after U.S. officials were warned of an Iranian threat involving shoulder-fired missiles targeting Air Force One, according to a U.S. official. Trump boarded Air Force One after an Ankara leaders' meeting, then was moved to the military jet via an airport catering truck; aides including Secretary of State Marco Rubio stayed aboard. No missiles were fired. Israel provided the intelligence. Trump publicly said he followed Secret Service advice, noting \"I get a lot of threats.\" The decoy, the first such in his presidency, raises questions about White House transparency and the Qatari-donated 747's defensive capabilities. Iran has vowed revenge for Qassem Soleimani's killing.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20WSJ/Trump%20secretly%20flown%20out%20of%20Turkey%20on%20military%20jet%20amid%20Iran%20threat.pdf"}, {"id": "wsj-10", "title": "U.S. Crude Oil Stockpiles Post Unexpected Build", "source": "WSJ", "date": "13 Aug 2026", "tags": ["Energy"], "summary": "U.S. commercial crude oil inventories rose unexpectedly by 17.4 million barrels to 424.4 million in the week ended Aug. 7, as imports increased and exports fell, the Energy Information Administration said; analysts had expected a 600,000-barrel decline. Strategic Petroleum Reserve stocks fell 6.1 million barrels to 298.7 million, the lowest in over four decades amid continued emergency releases. Cushing stocks rose 1.6 million barrels. Crude imports jumped 1.1 million barrels a day to 7.3 million, while exports fell 627,000 to 3.1 million; production held at 13.8 million barrels a day. Refineries ran at 96.2% of capacity. Gasoline inventories fell 1 million barrels; distillate stocks were roughly flat, 12% below the five-year average.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20WSJ/U.S.%20Crude%20Oil%20Stockpiles%20Post%20Unexpected%20Build.pdf"}, {"id": "wsj-12", "title": "War Is Squeezing Another Global Chokepoint: The Black Sea", "source": "WSJ", "date": "13 Aug 2026", "tags": ["Geopolitics", "Trade", "Energy"], "summary": "The Black Sea, a hub for global grain trade and Ukraine's economic lifeline, has become a war zone, with Russia and now Ukraine setting ships and ports ablaze at both ends. Ukraine struck the Russian port of Novorossiysk on Tuesday, hitting air-defense positions and infrastructure. Russian drones and missiles have struck 57 vessels since June 20, killing at least 21 people, while Ukrainian drones claim strikes on over 200 Russian \"shadow fleet\" ships. Attacks near Novorossiysk crimp the Caspian Pipeline Consortium, carrying nearly 2% of world oil. Maersk and Kernel halted operations at Chornomorsk. Chicago wheat futures topped $7 a bushel in July. Analysts warn of higher food prices across Africa, Asia and the Middle East.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20WSJ/War%20Is%20Squeezing%20Another%20Global%20Chokepoint%20The%20Black%20Sea.pdf"}, {"id": "wsj-13", "title": "Why Wall Street and Nvidia Are Building an Exotic Money Pipeline for the AI Boom", "source": "WSJ", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Nvidia CEO Jensen Huang unveiled a $500 billion plan with Wall Street firms-Apollo, BlackRock, Blackstone, Brookfield, Goldman Sachs and KKR-to standardize AI-chip financing through asset-backed pools, leaving Nvidia partly on the hook if deals fail. The effort targets smaller AI labs, cloud firms and enterprises that crave Nvidia chips but face high borrowing costs, unlike cash-rich Meta, Microsoft and Google. No money has been raised yet; backers aim to sell debt to pension funds, insurers and sovereign-wealth funds. Critics warn chips depreciate fast-one likened compute collateral to \"the shelf life of lettuce.\" Huang said Nvidia might backstop up to 25% of project costs. AI-related bond issuance reached $344 billion by early August, up over $200 billion from 2025.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20WSJ/Why%20Wall%20Street%20and%20Nvidia%20Are%20Building%20an%20Exotic%20Money%20Pipeline%20for%20the%20AI%20Boom.pdf"}, {"id": "st-01", "title": "China races to solve $190 billion property threat as leases end", "source": "ST", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "China is confronting a wave of expiring land leases threatening its commercial property sector, with more than one trillion yuan (S$190 billion) of non-residential assets now holding 20 years or less of tenure, estimates Cushman and Wakefield. Almost all urban land is state-owned; leases run 40 to 70 years. Dwindling terms have scuttled deals for developers including Parkview Group and New World Development, as banks refuse refinancing and buyers submit low-ball bids. Office values in some cities fell over 40 per cent from peaks. Shanghai and Guangzhou recently circulated renewal guidelines proposing extension costs of at least 70 per cent of a benchmark. CapitaLand and Brookfield have raised concerns; investors await a nationwide policy.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/China%20races%20to%20solve%20190%20billion%20property%20threat%20as%20leases%20end.pdf"}, {"id": "st-02", "title": "China tech giant Tencent's Q2 profit down as AI push builds", "source": "ST", "date": "13 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Tencent reported second-quarter 2026 net profit of 56 billion renminbi (S$10.6 billion), up just 0.7 per cent year on year but a 4 per cent fall from the first quarter, missing a Bloomberg forecast of 58.4 billion renminbi. Revenue jumped 11 per cent to 204.8 billion renminbi, slightly beating estimates, as the WeChat operator monetises heavy AI investment. WeChat users await a potential in-app AI agent. Tencent said it is \"building a new, AI-empowered Tencent.\" Founder Pony Ma earlier likened past AI efforts to a \"leaky\" ship. Tencent is reportedly in talks to retake a stake in start-up Manus, and is among firms racing to capitalise on the OpenClaw AI agent platform surge.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/China%20tech%20giant%20Tencent's%20Q2%20profit%20down%20as%20AI%20push%20builds.pdf"}, {"id": "st-03", "title": "China's C919 jet makes first international commercial flight", "source": "ST", "date": "13 Aug 2026", "tags": ["Technology & AI", "Trade"], "summary": "China's homegrown C919 narrow-body jet completed its first international commercial flight on Aug 12, a symbolic step toward challenging Boeing and Airbus. Produced by state-owned COMAC and operated by Air China, the aircraft departed Beijing and landed in Mongolia's capital Ulaanbaatar, a route running one round-trip daily. Billed as a rival to the Boeing 737 and Airbus A320, the jet has yet to win US or European regulatory approval and still sources components from countries including the United States. Beijing hopes it will cut reliance on foreign technology. The C919 flew its first commercial route in May 2023 and has since served domestic and Hong Kong routes. COMAC's smaller C909 already flies foreign markets.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/China's%20C919%20jet%20makes%20first%20international%20commercial%20flight.pdf"}, {"id": "st-04", "title": "DeepSeek publicises efforts to challenge Anthropic's Claude Code", "source": "ST", "date": "13 Aug 2026", "tags": ["Technology & AI"], "summary": "Chinese AI start-up DeepSeek has set up an official WeChat account for its \"DeepSeek Harness Team\" and posted job listings for a group developing AI agents to rival services like Anthropic's Claude Code. A harness is the software scaffolding wrapped around a large language model that lets agents manage complex tasks, such as streamlining coding. The Beijing-based entity is identified by corporate database Qichacha as controlled by DeepSeek and verified by Tencent. The company said it aims to turn its models into cutting-edge agentic products, and separately updated its flagship V4 Pro model with better agentic capabilities on Aug 11. Chinese firms are locked in a race with US developers to build advanced, affordable AI agents for business professionals.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/DeepSeek%20publicises%20efforts%20to%20challenge%20Anthropic's%20Claude%20code.pdf"}, {"id": "st-05", "title": "How China's big push to win back tourists is paying off", "source": "ST", "date": "13 Aug 2026", "tags": ["Society", "Finance & Markets"], "summary": "China's campaign to revive inbound tourism is gaining momentum, with around 35 million foreign visitors arriving in 2025, when arrivals and spending surpassed pre-pandemic levels for the first time. Since 2023 China rolled out visa-free travel for citizens of 50 countries, ramped up online promotion, including on banned Western platforms, and funded local tourism offices. In the first half of 2026, 18 million people arrived from visa-free countries, lifting overall foreign arrivals 20 per cent, led by South Korea, Russia, Malaysia and Thailand. Trends like \"Chinamaxxing\" went viral. Still, tourism generates under 0.5 per cent of GDP, far below Spain and Thailand, and cashless payments, language gaps and app restrictions remain hurdles for visitors.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/How%20China's%20big%20push%20to%20win%20back%20tourists%20is%20paying%20off.pdf"}, {"id": "st-06", "title": "Indonesia says navy drill with China that angered Taiwan was routine", "source": "ST", "date": "13 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Indonesia's navy said on Aug 12 that joint exercises with China in waters east of Taiwan were routine \"passing exercises\" not related to \"war fighting,\" after Taipei branded them a dangerous \"military provocation.\" China's military said the two navies concluded the drill, which included communication, formation manoeuvring and replenishment, the first such operation with a foreign military in those waters. Indonesia said its ship, the I Gusti Ngurah Rai, conducted the exercises while returning from a Russia visit, also engaging Japan and the US Seventh Fleet. Taiwan's Mainland Affairs Council called it \"exercises in name, expansion in fact.\" An intelligence official said the ship, 70-80 nautical miles off Taiwan's east, posed no direct military impact but carried geopolitical significance.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/Indonesia%20says%20navy%20drill%20with%20China%20that%20angered%20Taiwan%20was%20routine.pdf"}, {"id": "st-07", "title": "Iranian factions squabble over war aims with Khamenei absent", "source": "ST", "date": "13 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "Public infighting has erupted in Tehran over the conduct of the US-Israel war, with new Supreme Leader Mojtaba Khamenei unseen since taking power in March after a Feb 28 Israeli strike killed his father and predecessor. President Masoud Pezeshkian, backing a beleaguered peace deal, faces hardliner calls to resign but says he will not budge; he reported a recent \"seven or eight hours\" meeting with Khamenei. Pragmatists like Pezeshkian and Foreign Minister Abbas Araghchi seek negotiations and sanctions relief, while ultra-conservatives oppose engagement with Trump. A military reshuffle installed hardliner Mohsen Rezaei atop the security council, signalling a more \"offensive\" doctrine. Analysts say factional disputes are more visible, though decision-makers retain broad consensus around leveraging the Strait of Hormuz.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/Iranian%20factions%20squabble%20over%20war%20aims%20with%20Khamenei%20absent.pdf"}, {"id": "st-08", "title": "Malaysian PM Anwar discharged from hospital after surgery", "source": "ST", "date": "13 Aug 2026", "tags": ["Politics", "Southeast Asia"], "summary": "Malaysian Prime Minister Anwar Ibrahim was discharged from hospital on Aug 12 after undergoing surgery. \"Alhamdulillah, back home,\" he posted across his social media accounts. On Aug 10, his 79th birthday, Anwar successfully underwent an elective laparoscopic procedure to treat a para-umbilical hernia. The head of his medical team, Dr Asri Ranga Abdullah Ramaiah, said the procedure was carried out smoothly under a team of specialists. Earlier that day his aide said Anwar was undergoing tests and was expected to be under observation for two days. Anwar, in office since 2022, has had recurrent shoulder and back issues and was hospitalised in 2018 for shoulder and back pain, according to Reuters.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/Malaysian%20PM%20Anwar%20discharged%20from%20hospital%20after%20surgery.pdf"}, {"id": "st-09", "title": "North Korea resumes naval base construction as it modernises fleet", "source": "ST", "date": "13 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "North Korea appears to have resumed construction of a long-delayed naval base at Tapchon Bay in Munchon on its east coast, with new worker housing appearing between Aug 6 and Aug 9, according to NK News analysis of Planet Labs satellite imagery. The renewed work coincides with Pyongyang's push to modernise its fleet, having unveiled two 5,000-ton destroyers, the Choe Hyon and Kang Kon, while pursuing a nuclear-powered submarine and a 10,000-ton cruiser. Kim Jong Un called the base's completion an \"urgent task\" and cited a shortage of berths for large warships. Separately, North Korea fired a ballistic missile about 700km into the East Sea on Aug 12, its 11th launch event of 2026, days before US-South Korea Ulchi Freedom Shield drills.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/North%20Korea%20resumes%20naval%20base%20construction%20as%20it%20modernises%20fleet.pdf"}, {"id": "st-10", "title": "PKR and DAP faithful meet this week with Anwar's fate on the line. Here's what to watch", "source": "ST", "date": "13 Aug 2026", "tags": ["Politics", "Southeast Asia"], "summary": "Anwar Ibrahim's PKR and ally DAP hold party gatherings this week after three straight state-poll defeats, with the Aug 1 Negeri Sembilan loss following July's Johor drubbing as the UMNO-PAS pact swept two-thirds supermajorities. PKR's national assembly opens Aug 13 in Melaka, the next state to vote by November; DAP's congress on Aug 16 will vote on relinquishing government positions in protest, though insiders expect loyalty to Anwar. PKR faces a leadership vacuum after Anwar's daughter Nurul Izzah quit as deputy president, while Rafizi Ramli's breakaway Parti Bersama Malaysia courts reform voters. Some in Pakatan Harapan urge exploratory cooperation with Bersatu. Anwar, recovering from hernia surgery, meets divisional chiefs Aug 14 before an Aug 15 address.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/PKR%20and%20DAP%20faithful%20meet%20this%20week%20with%20Anwar's%20fate%20on%20the%20line.%20Here's%20what%20to%20watch.pdf"}, {"id": "st-11", "title": "Proposed rezoning in one-north to double space for start-up facilities", "source": "ST", "date": "13 Aug 2026", "tags": ["Technology & AI", "Society"], "summary": "Proposed zoning changes will roughly double the floor space available for Singapore's start-up ecosystem at LaunchPad @ One-North, assigning the 9.82ha site a gross plot ratio of 2.5, up from just over 1.0 today. JTC, which launched LaunchPad in 2015, said the change lets it rejuvenate the estate as one integrated development, including adaptive reuse of two flatted factories as the AI block and accommodation block of the new Kampong AI park. LaunchPad has housed over 2,400 start-ups including Carousell, Patsnap and Nium. The AI block will offer 14,500 sq m for up to 70 companies; Kampong AI is slated for 2028. A related tender for Block 47 closes Aug 24. Singapore's start-up ecosystem ranks fourth globally.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/Proposed%20rezoning%20in%20one-north%20to%20double%20space%20for%20start-up%20facilities.pdf"}, {"id": "st-13", "title": "Senators press Rubio, Bessent on lack of counter-evasion sanctions on Russia", "source": "ST", "date": "13 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "Two senior Democratic senators, Elizabeth Warren and Christopher Coons, pressed Trump administration officials on Aug 12 over why fresh counter-evasion sanctions on entities helping Russia bypass restrictions have been paused for 17 months, even as peace talks stalled. In a letter to Secretary of State Marco Rubio and Treasury Secretary Scott Bessent, they noted the last major sanctions came in October 2025 against oil firms Rosneft and Lukoil, which they call a one-off that Russia easily evades. They cited Bessent's February pledge to \"see where the peace talks go\" and Rubio's May remark that talks were not fruitful. The senators seek a response by Aug 28. A new Senate sanctions bill passed this month but faces an uncertain future over tariff powers.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/Senators%20press%20Rubio,%20Bessent%20on%20lack%20of%20counter-evasion%20sanctions%20on%20Russia.pdf"}, {"id": "st-14", "title": "Taiwan's Foxconn reports 35% rise in Q2 profit on AI demand, beats forecasts", "source": "ST", "date": "13 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Taiwan's Foxconn, the world's largest contract electronics maker, reported on Aug 12 a 35 per cent rise in second-quarter net profit to NT$59.97 billion (S$2.38 billion), beating an LSEG consensus of NT$58.8 billion, driven by strong AI demand. Its cloud and networking segment, including AI servers, exceeded 50 per cent of revenue for the first time at 51 per cent, while smart consumer electronics, including iPhones, made up 29 per cent. Rotating CEO Michael Chiang said Nvidia's Vera Rubin server racks enter mass-production prep in the third quarter, with shipments beginning in the fourth, cautioning that 2027 output hinges on TSMC's CoWoS capacity. Foxconn forecasts a 30 per cent capex rise in 2026 and is building factories in Mexico and Texas.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/Taiwan's%20Foxconn%20reports%2035%20per%20cent%20rise%20in%20Q2%20profit%20on%20AI%20demand,%20beats%20forecasts.pdf"}, {"id": "st-15", "title": "Two-thirds of Sentosa Cove properties resold at a loss, with average loss topping $1m since 2023", "source": "ST", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Society"], "summary": "Nearly two-thirds of Sentosa Cove properties changed hands at a loss over the past three years, with Mogul.sg data showing 64.5 per cent of resale deals between May 2023 and June 2026 were unprofitable, up from 62.8 per cent earlier. The average loss narrowed to $1.28 million, while gross gains on profitable resales fell about 62 per cent to $655,590. Steep stamp-duty hikes for foreign buyers since 2023 have curtailed demand at the 99-year-leasehold enclave, Singapore's only spot where foreigners may buy landed homes. Landed homes fared slightly better, with about half above water. Cushman & Wakefield and Newmark echoed the trend. Analysts cite a small buyer pool, decaying leases and no new land sales since 2008.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/Two-thirds%20of%20Sentosa%20Cove%20properties%20resold%20at%20a%20loss,%20with%20average%20loss%20topping%201m%20since%202023.pdf"}, {"id": "st-16", "title": "US consumer inflation slows in July, giving Fed room to breathe", "source": "ST", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Energy"], "summary": "US consumer inflation slowed slightly to 3.4 per cent in July despite turbulent oil prices from the Iran war, government data showed on Aug 12, potentially giving the Federal Reserve room on interest rates. The consumer price index rose 0.1 per cent from a month earlier but fell year on year, in line with economists' forecasts. Inflation remains well above the Fed's 2 per cent target after spiking to a three-year high of 4.2 per cent in May from 2.4 per cent in February. Energy led price gains, with petrol up 24.6 per cent and fuel oil up 39.1 per cent year on year, though the energy index fell 1.5 per cent from a month ago. Core CPI rose 2.5 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/US%20consumer%20inflation%20slows%20in%20July,%20giving%20Fed%20room%20to%20breathe.pdf"}, {"id": "st-17", "title": "Ukraine halts strikes on tankers using Russian port at US request, FT says", "source": "ST", "date": "13 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "Ukraine has paused drone strikes on oil tankers using Russia's Black Sea port of Novorossiysk after a request from US Vice-President JD Vance, the Financial Times reported on Aug 12, citing Ukrainian officials. Last month's request followed US alarm that Ukraine was destabilising oil markets and harming US firms by targeting tankers carrying Kazakh crude piped to a Caspian Pipeline Consortium terminal. Washington warned Kyiv to \"cease and desist\" from hitting non-Russian vessels and CPC infrastructure, which it views as an alternative to Russian energy. Ukraine reaffirmed it will refrain from such targeting. Black Sea drone attacks took out up to a fifth of CPC oil loadings in July, and Kazakhstan's output fell 14 per cent versus June.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/Ukraine%20halts%20strikes%20on%20tankers%20using%20Russian%20port%20at%20US%20request,%20FT%20says.pdf"}, {"id": "st-18", "title": "Yen intervention puts China's renminbi under more pressure", "source": "ST", "date": "13 Aug 2026", "tags": ["Finance & Markets"], "summary": "China's renminbi has come under more upward pressure since the US and Japan moved to strengthen the yen, according to Bloomberg Economics, potentially draining growth support as the currency gains despite falling bond yields and a sluggish economy. Economists David Qu and Chang Shu said the late-July intervention spilled over to Asian currencies, exacerbating a yuan rally at odds with its widening yield disadvantage against the dollar. The won, Singapore dollar and Taiwan dollar are most correlated to the yen. Booming export demand has made the renminbi Asia's best performer, up about 3.6 per cent in 2026. Bloomberg Economics says a stronger currency \"opens a window\" for a 10-basis-point PBOC rate cut to 1.3 per cent before year-end.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/Yen%20intervention%20puts%20China's%20renminbi%20under%20more%20pressure.pdf"}, {"id": "bt-01", "title": "ABN Amro beats on profit, boosts key revenue source outlook", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets"], "summary": "ABN Amro reported second-quarter net income of 780 million euros (US$900 million), beating the 660.1 million euro average analyst estimate on higher fees and lending income, and lifted its 2026 commercial net interest income outlook to 6.8 billion euros from about 6.4 billion. Fees rose 25 per cent and net interest income 11 per cent, both boosted by geopolitical-driven market activity in clearing and wealth. CEO Marguerite Berard is expanding clearing and private banking while cutting jobs and deploying AI. Shares rose as much as 6.3 per cent to their highest since ABN's 2015 relisting. The bank recently completed its 875 million euro NIBC Bank acquisition from Blackstone. The Dutch state's stake is now about a fifth.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/ABN%20Amro%20beats%20on%20profit,%20boosts%20key%20revenue%20source%20outlook.pdf"}, {"id": "bt-02", "title": "AEM's H1 net profit rises 10 times to S$30.8 million on stronger AI chip demand", "source": "BT", "date": "13 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Semiconductor test-equipment maker AEM posted a first-half net profit of about S$31 million for the half year ended Jun 30, up from S$3.1 million a year earlier, driven by stronger demand from AI chipmakers. Revenue grew 30 per cent to S$247.2 million, led by its fabless AI and high-performance computing customer, which became its largest contributor. Earnings per share reached S$0.0979, from S$0.0098. AEM raised FY2026 revenue guidance to S$630 million-S$680 million, from S$550 million-S$600 million, citing customer ramp-ups and its first memory final test handler shipment in Q4. Its AMPS platform backlog exceeds S$400 million. An interim dividend of S$0.024 was declared. Shares rose 0.9 per cent to S$9.63.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/AEM's%20H1%20net%20profit%20rises%2010%20times%20to%20S30.8%20million%20on%20stronger%20AI%20chip%20demand.pdf"}, {"id": "bt-03", "title": "After a strong Q2, what's next for Singapore banks? Analysts see DBS, OCBC ahead on wealth", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Analysts are split on Singapore's three banks after Q2 results, with wealth management the key differentiator in a lower-rate environment. All beat expectations: DBS net profit rose 9 per cent to S$3.08 billion, OCBC 22 per cent to S$2.22 billion, and UOB 10 per cent to S$1.48 billion. Analysts favoured DBS and OCBC for strong wealth performances and positive earnings outlooks, with Maybank citing DBS's over-17 per cent medium-term ROE. UOB faces asset-quality concerns over Greater China commercial real estate, a weaker fee outlook, and a S$200 million non-recurring divestment boost; RHB upgraded it as a \"value play\" on a 48 per cent discount. Shares: DBS S$76.99, OCBC S$31.36, UOB S$42.16.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/After%20a%20strong%20Q2,%20what's%20next%20for%20Singapore%20banks%20Analysts%20see%20DBS,%20OCBC%20ahead%20on%20wealth.pdf"}, {"id": "bt-04", "title": "Analysts raise DBS targets to as high as S$81 after record Q2 net profit", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Analysts raised DBS target prices after the bank posted a record Q2 net profit of S$3.08 billion, with at least two forecasting shares to touch S$80. RHB lifted its target to S$81.20 from S$75.70 with a \"buy\", while UOB Kay Hian's Jonathan Koh raised his to S$80 from S$76.85, citing a 42 per cent jump in wealth management fees and wealth AUM topping S$500 billion at S$516 billion. OCBC's Carmen Lee raised her target to S$78 from S$60.93 but kept a \"hold\", while Macquarie held S$70.86 with \"outperform\". Net interest margin slipped two basis points to 1.87 per cent. DBS declared a total Q2 dividend of S$0.81 and has S$2.6 billion left of its buyback programme. Shares stood at S$76.99.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Analysts%20raise%20DBS%20targets%20to%20as%20high%20as%20S81%20after%20record%20Q2%20net%20profit.pdf"}, {"id": "bt-05", "title": "Bank of America launches US$250 billion initiative for US tech, energy infrastructure", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Energy", "Technology & AI"], "summary": "Bank of America said it plans to deploy US$250 billion through July 2027 to support US digital and infrastructure projects under its \"Critical Infrastructure Finance Initiative\", launched around the nation's 250th anniversary. The programme will include primary market lending, investments, capital markets services and advisory, spanning digital infrastructure such as data centres, energy and power infrastructure including renewables and storage, and core infrastructure such as transportation and natural gas. The bank says it will bolster economic growth and create tens of thousands of jobs. It follows Morgan Stanley's pledge to facilitate roughly US$1.5 trillion over the next decade. The amount is based on eligible activity over 18 months from January 1, 2026, through July 4, 2027.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Bank%20of%20America%20launches%20US250%20billion%20initiative%20for%20US%20tech,%20energy%20infrastructure.pdf"}, {"id": "bt-06", "title": "CICT H1 DPU up 7.1% at S$0.0602, bolstered by CapitaSpring and Gallileo tower in Germany", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "CapitaLand Integrated Commercial Trust posted a first-half distribution per unit of S$0.0602 for the period ended June, up 7.1 per cent from S$0.0562, despite an enlarged unit base from a private placement funding its Paragon acquisition. Net property income rose 8.7 per cent to S$630.5 million and revenue 7.5 per cent to S$846.8 million, led by CapitaSpring and lease commencement at Gallileo in Germany. Distributable income climbed 13.3 per cent to S$466.7 million. CEO Tan Choon Siang expects robust performance to continue, citing Paragon contributions, positive rental reversions and upgraded suburban malls. Portfolio occupancy was 95.6 per cent and aggregate leverage 37.4 per cent. Units closed 0.8 per cent lower at S$2.49.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/CICT%20H1%20DPU%20up%207.1%20at%20S0.0602,%20bolstered%20by%20CapitaSpring%20and%20Gallileo%20tower%20in%20Germany.pdf"}, {"id": "bt-07", "title": "Can the G20 survive Trump and deepening global fractures?", "source": "BT", "date": "13 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "This commentary argues the G20, created in 1999 with US help, is increasingly riven by geopolitical splits and enjoys only fragile support from the Trump administration, weakening its ability to defuse the next crisis. It contrasts the 2009 summit's coordinated US$1.1 trillion stimulus with Trump's disinterest in multilateralism. In 2025 the US boycotted South Africa's G20 over discredited \"white genocide\" claims; this year South Africa was not invited to US-hosted events, with Poland given a seat instead. The Miami Leaders Summit will be held at Trump's Doral golf club. Russia alleges the US failed as host, and a US-pushed \"new G20\" agenda favours energy, AI and immigration while sidelining climate. The writer is an LSE IDEAS associate.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Can%20the%20G20%20survive%20Trump%20and%20deepening%20global%20fractures.pdf"}, {"id": "bt-08", "title": "Commonwealth Bank of Australia's record profit is clouded by 15% mortgage application slump", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets"], "summary": "Commonwealth Bank of Australia posted a record full-year cash profit of A$10.98 billion (US$7.75 billion), up 7.1 per cent and beating consensus, but flagged a 15 per cent drop in mortgage applications since May property tax changes and warned of a slowing economy. Investor lending applications fell 28 per cent. Rivals Westpac and NAB reported similar declines of 20 and 15 per cent. Auction clearance rates hit six-year lows and prices fell about 2 per cent over four months. Net interest margin slipped three basis points to 2.05 per cent, and loan impairment expense rose 9 per cent to A$788 million. CBA, up 7.1 per cent this year, remains richly valued. It declared a record final dividend of A$2.70.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Commonwealth%20Bank%20of%20Australia's%20record%20profit%20is%20clouded%20by%2015%20mortgage%20application%20slump.pdf"}, {"id": "bt-09", "title": "Dollar ticks up on Iran tension, with US data in focus", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "The dollar ticked higher on renewed Gulf tensions as markets awaited US inflation data for Fed policy signals. Oil edged up after the US and Yemen's Houthis reported separate shipping attacks, with Teheran keeping the Strait of Hormuz closed. Investors sought the safe-haven dollar amid energy-shock concerns. Analysts said Friday's soft jobs data did not weigh heavily, with inflation seen driving the Fed's next move; Chicago Fed's Goolsbee stressed inflation over labour weakness. Fed funds futures imply a 50 per cent chance of no September change. The dollar index rose 0.05 per cent to 99.85 and the euro slipped to US$1.1536. The yen weakened to 159.38 despite joint US-Japan intervention, while the NZ dollar fell after PM Luxon won a confidence vote.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Dollar%20ticks%20up%20on%20Iran%20tension,%20with%20US%20data%20in%20focus.pdf"}, {"id": "bt-10", "title": "Global 2026 oil supply shortfall to deepen as Hormuz reopening remains elusive", "source": "BT", "date": "13 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "The International Energy Agency said global oil supply will fall 4.3 million barrels per day, or about 4 per cent, in 2026 as renewed Middle East hostilities disrupt supplies, deepening the market deficit. The forecast worsened from July's 3.7 million bpd drop, taking total supply to a low of 102.02 million bpd, around 1.27 million bpd below demand. Middle East loadings dropped from 20 million bpd in early July to 12 million bpd later. The IEA sees a 1.8 million bpd deficit in July-September, the deepest since Q4 2021, and cut 2026 demand by 1.6 million bpd. It expects a 4.61 million bpd surplus in 2027 assuming de-escalation. Opec, by contrast, still sees demand growing 580,000 bpd. Russian refining stayed near a 20-year low.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Global%202026%20oil%20supply%20shortfall%20to%20deepen%20as%20Hormuz%20reopening%20remains%20elusive.pdf"}, {"id": "bt-11", "title": "Global data centre insurance premiums projected to be over US$24 billion by 2030", "source": "BT", "date": "13 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "The global data centre insurance market is projected to exceed US$24 billion by 2030, up from around US$11 billion today, as rising capacity and complexity make comprehensive cover a financing prerequisite for large AI infrastructure projects, Allianz Commercial said in a report. Single AI campus construction costs can exceed US$20 billion. Fire was the most expensive loss cause, accounting for nearly 60 per cent of 677 million euros (US$781.6 million) in analysed industry claims across 221 cases; natural catastrophes and wilful acts followed. Europe made up 38 per cent of claims value, North America 36 per cent and Asia 21 per cent. Business interruption was the primary severity driver. The US and China are expected to account for about 62 per cent of new capacity additions to 2030.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Global%20data%20centre%20insurance%20premiums%20projected%20to%20be%20over%20US24%20billion%20by%202030.pdf"}, {"id": "bt-12", "title": "Gold rises to over two-month high as US inflation data dampens rate hike bets", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets"], "summary": "Gold advanced to a two-month high after a subdued US inflation report eased near-term pressure on the Federal Reserve to hike rates, reducing the likelihood of tightening at its September meeting. Bullion climbed as much as 0.9 per cent to near US$4,450 an ounce, building on a similar Wednesday gain after data showed consumer prices rose just 0.1 per cent in July, suggesting the Iran-war energy shock continued to fade. Investors also await Fed chairman Kevin Warsh's Jackson Hole remarks. Gold has rallied above the US$4,000 threshold, backed by central bank buying notably from China, and topped its 100-day moving average for the first time since April. Spot gold rose 0.5 per cent to US$4,429.70; silver gained 1 per cent to US$65.94.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Gold%20rises%20to%20over%20two-month%20high%20as%20US%20inflation%20data%20dampens%20rate%20hike%20bets.pdf"}, {"id": "bt-13", "title": "Iran says no progress on reviving interim peace deal with US", "source": "BT", "date": "13 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "Iran and the US remain at loggerheads over ending the Gulf war, with a senior Iranian source saying there had been no progress reviving the interim deal agreed in June, which quickly unravelled. The US accuses Iran of failing to reopen the Strait of Hormuz; Teheran says Washington reneged on lifting a port blockade and releasing frozen assets. Trump said the US has \"total control\" over Hormuz, but Iran's Persian Gulf Strait Authority said it stays blocked until conditions are met. The Iranian source dismissed reports of a 60-day extension. Thousands have died since US-Israel attacks on Iran began Feb 28. Brent peaked at US$126 during the war and traded around US$88; WTI around US$83. Tuesday saw fresh shipping attacks.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Iran%20says%20no%20progress%20on%20reviving%20interim%20peace%20deal%20with%20US.pdf"}, {"id": "bt-14", "title": "Jane Street repaying US$5.5 billion loan in overhaul of debt load", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets"], "summary": "Jane Street is repaying US$5.5 billion of floating-rate loans as part of a broader overhaul of its US$11 billion debt load, S&P Global Ratings said. The market-making giant is also poised to refinance US$5.6 billion of bonds via US$14.6 billion of new senior-secured notes maturing in 2031, 2033 and 2036, and is expected to use some proceeds to fund technology infrastructure and expand trading strategies, per Fitch. S&P rated the deal BB, two rungs below investment grade, citing Jane Street's strong profitability and expanding franchise; Fitch's issuer default rating is BBB-. The firm generated a record US$39.6 billion of trading revenue in 2025 and is in talks with Pimco among others. A refinancing could limit disclosures to a smaller group of investors.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Jane%20Street%20repaying%20US5.5%20billion%20loan%20in%20overhaul%20of%20debt%20load.pdf"}, {"id": "bt-15", "title": "MAS eases family office tax rules, widens AML checks as Singapore vies for global wealth", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "The Monetary Authority of Singapore has made it simpler for single-family offices to qualify for tax incentives, easing hiring, AUM-monitoring and local-spending requirements even as it tightens scrutiny over sources of wealth, per a Jul 31 circular effective Aug 1. New applicants can start with fewer investment professionals, continuous AUM tracking is scrapped, and eligible donations and local investments count at double value. Separately, the 5 per cent cap on precious metals was removed. AML screening was widened to include anyone contributing to the source of funds, applied retroactively, with a three-month grace period to open a local bank account. Singapore had over 2,000 incentivised SFOs at end-2025; industry AUM grew 10.1 per cent to S$6.7 trillion.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/MAS%20eases%20family%20office%20tax%20rules,%20widens%20AML%20checks%20as%20Singapore%20vies%20for%20global%20wealth.pdf"}, {"id": "bt-16", "title": "Norway wealth fund posts record US$184 billion profit in first half of 2026", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Norway's US$2.3 trillion sovereign wealth fund, the world's largest, posted a record profit of 1.75 trillion crowns (US$184.3 billion) for the first half, lifted by technology stocks, particularly Asian names. The fund owns on average 1.5 per cent of all listed companies globally. CEO Nicolai Tangen said the top 10 holdings now represent 20 per cent of the fund's value, mostly tech, raising concentration risk: \"It's chips, chips, chips.\" The fund disclosed a 0.05 per cent SpaceX stake worth US$1.22 billion, modest against holdings such as US$62 billion in Nvidia, US$52 billion in Apple and US$50 billion in Alphabet. It is invested in around 7,100 companies. Management warned future wars and depression could wipe out much of its value.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Norway%20wealth%20fund%20posts%20record%20US184%20billion%20profit%20in%20first%20half%20of%202026.pdf"}, {"id": "bt-17", "title": "Nvidia-backed CoreWeave boosts 2026 spending plan, beats quarterly estimates on AI demand surge", "source": "BT", "date": "13 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "CoreWeave lifted its annual capital spending forecast after beating second-quarter estimates, betting on surging AI cloud demand and sending shares more than 14 per cent higher in extended trading. The Nvidia-backed neocloud raised 2026 revenue and adjusted operating profit targets, citing a ballooning order book. Revenue backlog reached US$104.2 billion, up from US$99.4 billion, with over US$25 billion of net new commitments this quarter. Q2 revenue more than doubled to US$2.58 billion, beating estimates, with a smaller-than-expected adjusted loss of US$1.03 per share. Full-year capex was raised to US$35 billion-US$39 billion from US$31 billion-US$35 billion. CEO Michael Intrator said near-term capacity is effectively sold out, letting it secure increasingly favourable terms. Customers include Meta, Anthropic and Microsoft.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Nvidia-backed%20CoreWeave%20boosts%202026%20spending%20plan,%20beats%20quarterly%20estimates%20on%20AI%20demand%20surge.pdf"}, {"id": "bt-18", "title": "Oil prices edge up as investors weigh US-Iran talks deadlock against lower demand", "source": "BT", "date": "13 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "Oil prices rose slightly on Wednesday as Middle East shipping attacks continued and US-Iran talks hit an impasse, though gains were limited by cuts to 2026 demand forecasts. Brent settled up US$0.07 at US$88.98 a barrel and WTI up US$0.07 at US$83.27. A senior Iranian source said there were no talks to extend the ceasefire since, from Teheran's view, it had no start date. The US and Houthis reported separate attacks in the Strait of Hormuz and Bab el-Mandeb; Hormuz vessel transits fell to a one-week low of eight, versus 125-140 daily before the war. Opec cut its 2026 demand growth forecast to 580,000 bpd, while the IEA now expects a 1.6 million bpd contraction. US crude stocks posted a surprise build, their largest since January 2023.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Oil%20prices%20edge%20up%20as%20investors%20weigh%20US-Iran%20talks%20deadlock%20against%20lower%20demand.pdf"}, {"id": "bt-19", "title": "SGX securities trading value for July rises 37% year on year to S$46.2 billion", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Singapore Exchange's securities market turnover rose 37 per cent year on year in July to S$46.2 billion, with securities daily average value also up 37 per cent and surpassing S$2 billion for a sixth straight month. Derivatives traded volume climbed 16 per cent to 33.9 million contracts. The Straits Times Index advanced 8.9 per cent to 5,628.5, its biggest monthly rise in over five years, aided by rotation into defensive financials, and is up 21 per cent year to date. Retail investors were net buyers for a sixth month with inflows up 92 per cent to S$545.2 million. STI ETFs logged a 17th month of inflows. FX futures volume jumped 54 per cent to 9.3 million contracts, with Korean won futures DAV up 182 per cent. Market cap reached S$1.2 trillion.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/SGX%20securities%20trading%20value%20for%20July%20rises%2037%20year%20on%20year%20to%20S46.2%20billion.pdf"}, {"id": "bt-20", "title": "SGX's record year masks Singapore's equities challenge", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "This commentary argues SGX's record results mask weakness in Singapore's primary equity market, where several 2026 IPOs ended in immediate trading losses and secondary fundraising fell to S$3.6 billion in FY2026 from S$4.3 billion. SGX dismisses first-day drops as amplified single data points and cyclical fundraising, but the writer says bad debuts destroy retail appetite and boards may be avoiding dilution at current valuations. Yet SGX Group posted record FY2026 revenue of S$1.5 billion and a 25 per cent jump in adjusted net profit to S$759.5 million, with dividends up 52 per cent. The paradox: SGX thrives less on domestic stock-picking than on clearing FX (ADV up 33 per cent to US$190 billion), commodities and offshore derivatives for global institutions.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/SGX's%20record%20year%20masks%20Singapore's%20equities%20challenge.pdf"}, {"id": "bt-21", "title": "SK Hynix, Samsung shares rally as report of Temasek's investment plans boosts optimism", "source": "BT", "date": "13 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "South Korean chipmakers Samsung Electronics and SK Hynix rallied as risk appetite returned and traders weigh
