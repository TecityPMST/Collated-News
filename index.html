eficit rose to US$1.993 trillion in the fiscal year ended Sept 30, 12% above 2025 and the highest since 2021, according to the Congressional Budget Office. Spending rose 6% to US$7.4 trillion while revenue rose 3% to US$5.4 trillion, and experts expect the deficit to exceed 6% of GDP versus 5.8% in fiscal 2025. Net interest climbed 11% to more than US$1.1 trillion, accounting for over half the deficit increase, while net tariff collections fell below 2025 after the Supreme Court forced refunds and corporate tax revenue fell US$70 billion. Neither party is prioritising deficit reduction before the midterms, with Trump promising US$5,000 checks costing over US$1 trillion.", "url": "https://www.wsj.com/politics/policy/u-s-deficit-clocks-in-just-under-2-trillion-7e8e9eb3"}, {"id": "wsj-09oct-14", "title": "Trump Says U.S. Won’t Resume Strikes on Iran Before Midterms", "source": "WSJ", "date": "09 Oct 2026", "tags": ["Geopolitics", "Defence", "Politics"], "summary": "President Trump said on Oct 8 in a Truth Social post that the US will not attack Iran before the Nov 3 midterm elections, citing \"productive discussions\" with Tehran, while the US naval blockade remains in force. The statement followed media reports that the White House had asked the Pentagon for strike options before the vote, and officials familiar with planning say the military has prepared options including pre-midterm operations. A fresh carrier strike group and Marine expeditionary unit are heading to the Middle East to join the USS George Washington, nine guided-missile destroyers and three Marine transport ships. The war has become a political liability as fuel prices rise, with election watchers seeing the House likely flipping to Democrats.", "url": "https://www.wsj.com/politics/national-security/trump-says-u-s-wont-resume-strikes-on-iran-before-midterms-1e8ed73e"}, {"id": "wsj-09oct-15", "title": "Trump Throws His Weight Behind Credit-Card Legislation Most Feared by Banks", "source": "WSJ", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Politics"], "summary": "President Trump, Vice President JD Vance and top lieutenants have endorsed the Credit Card Competition Act, which would require cards issued by major banks to support at least two networks so merchants can route transactions to cheaper ones, challenging Visa and Mastercard. The bill, introduced in 2022 by Sens Dick Durbin and Roger Marshall, is backed by large merchants and opposed by banks, which say interchange fees fund rewards programmes. Merchant lobbyists have discussed with White House officials attaching it to other legislation after the midterms, according to people familiar with the matter. A White House spokeswoman says swipe fees cost households US$1,200 a year, while the payments industry views Trump's support as campaign rhetoric.", "url": "https://www.wsj.com/finance/regulation/the-credit-card-bill-that-banks-fear-most-has-gained-trump-as-an-ally-013551b3"}, {"id": "wsj-09oct-16", "title": "U.S. Jobless Claims Slide Yet Again", "source": "WSJ", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Society"], "summary": "US initial jobless claims fell for a fifth straight week to 197,000 in the week through Oct 3, down 2,000 from a revised 199,000, the Labor Department said on Oct 8. Economists surveyed by the WSJ had expected a rise to 200,000. Continuing claims rose 17,000 to 1.72 million in the week through Sept 26. The data reinforce a low-hire, low-fire labour market, and the article says a stable labour market adds pressure on the Federal Reserve to fight inflation by raising rates this year.", "url": "https://www.wsj.com/economy/jobs/u-s-jobless-claims-slide-yet-again-2d927e44"}, {"id": "wsj-09oct-17", "title": "Vice President JD Vance said the administration is suspending several tech firms, including Microsoft, from a program that allows H-1B visa holders to apply for green cards", "source": "WSJ", "date": "09 Oct 2026", "tags": ["Politics", "Technology & AI", "Society"], "summary": "Vice President JD Vance said on Oct 8 that his antifraud task force is suspending Microsoft, Adobe and several tech recruiting firms from the programme letting H-1B visa holders apply for green cards, over alleged visa abuses. Vance accused Microsoft of replacing laid-off US citizens with foreign H-1B workers, on the same day President Trump awarded Microsoft CEO Satya Nadella the National Medal of Technology and Innovation. Microsoft said most of its US staff are citizens and that 80% of its roughly 6,000 H-1B applications last fiscal year were for existing employees. Vance also named nine universities he said were abusing the J-1 programme, and Labor Department inspector general Anthony D'Esposito said he had sent them subpoenas.", "url": "https://www.wsj.com/politics/policy/vance-says-u-s-will-suspend-microsoft-and-other-firms-from-green-card-program-7f45a570"}, {"id": "wsj-09oct-18", "title": "What Six Years of Inflation Mean for the Midterms", "source": "WSJ", "date": "09 Oct 2026", "tags": ["Politics", "Society", "Finance & Markets"], "summary": "A WSJ explanatory article argues that six years of cumulative price rises could hurt Republicans in next month's midterms even though inflation, at about 3.4%, is far below its 2022 peak above 9%. The consumer-price index has risen almost 29% in six years, three times the pace of the prior six, and prices have on average outpaced wages, with inflation beating hourly wage growth in July and August. Economists quoted say consumers judge prices against old benchmarks and notice increases more than cuts; Michigan consumer sentiment dropped last month and fell 20% among Republicans since January. A recent WSJ poll found 60% said Trump's policies had worsened the economy, while the White House blames Democrats.", "url": "https://www.wsj.com/economy/consumers/inflation-midterm-election-2026-0f809bec"}, {"id": "wsj-09oct-19", "title": "Why the Battered Bond Market Is Finally Getting a Reprieve", "source": "WSJ", "date": "09 Oct 2026", "tags": ["Finance & Markets"], "summary": "Technical forces that deepened the US Treasury selloff, notably mortgage-bond hedging and Treasury-futures adjustments, may be running out of steam, investors and analysts say, raising hopes that the rise in yields will fade. Mortgage-backed securities have been extended about as far as they can go, reducing hedging pressure, and Thursday's (Oct 8) rally was led by longer-term Treasurys, with the 10-year yield ending at 5.232%, down from as high as 5.365% early on Oct 7, after long yields touched 24-year highs this week. Brent rose 4.1% to US$104.28, the S&P 500 fell 0.5% and the Nasdaq slipped more than 1.2%. Risks remain, including European fiscal worries, the US-Iran conflict and inflation, and Morgan Stanley's Eli Carter warns peak extension hedging may come later.", "url": "https://www.wsj.com/finance/investing/why-the-battered-bond-market-is-finally-getting-a-reprieve-79ec4348"}, {"id": "st-09oct-01", "title": "‘The best address in Singapore’: Why Malaysia’s IOI Properties is betting billions on the CBD", "source": "ST", "date": "09 Oct 2026", "tags": ["Southeast Asia", "Finance & Markets"], "summary": "In an interview with The Straits Times on Oct 7, IOI Properties chief executive Lee Yeow Seng said he is betting billions on Singapore's CBD, calling Marina Bay the best address in the country as wealthy individuals treat Singapore as a safe haven. IOI owns IOI Central Boulevard Towers, South Beach (after buying CDL's 50.1% stake for about S$835 million) and Asia Square Tower 2 (bought for S$2.5 billion), and, according to The Business Times, is doing due diligence with CapitaLand Investment on One Raffles Place, valued at S$2.3–2.4 billion. Lee said Singapore lacks ultra-luxury hotels and urged the Government to review land sales to the highest bidder. With debt near 80% of equity, he plans to deleverage via a new Singapore-listed REIT and a private fund.", "url": "https://www.straitstimes.com/business/the-best-address-in-singapore-why-malaysias-ioi-properties-is-betting-billions-on-the-cbd"}, {"id": "st-09oct-02", "title": "AI bubble risks worst S&P 500 crash since 2008, strategist says", "source": "ST", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Panmure Liberum head of market strategy Joachim Klement warned the AI trade could collapse in 2027 or 2028, triggering the worst market crash since the global financial crisis. His 2027 year-end S&P 500 target of 5,000 implies 36% downside, the most bearish of strategists tracked by Bloomberg, who on average see 14% upside; he sees the Stoxx 600 falling to 430, over 30% lower. Klement cited depleted hyperscaler free cash flow and rising debt costs, as Bloomberg Intelligence estimates 2026 hyperscaler data-centre capex could more than double to US$713 billion. He advises clients to prepare contingency plans and \"go full defensive\" if the S&P 500 drops below its 200-day moving average.", "url": "https://www.straitstimes.com/business/ai-bubble-risks-worst-sp-500-crash-since-2008-strategist-says"}, {"id": "st-09oct-03", "title": "Attack risks rise for tankers as Iran vows to block more Hormuz routes", "source": "ST", "date": "09 Oct 2026", "tags": ["Geopolitics", "Energy", "Defence"], "summary": "Iran has warned regional countries that any attempt to open new oil export routes through the Strait of Hormuz would be considered hostile, a senior regional official close to Tehran told Reuters, raising attack risks for tankers. A diplomat briefed by Tehran said this could involve missile and drone attacks or boats sent to scare ships away. Last week saw the most tanker attacks since the Iran war began, cutting transits to a more-than-two-month low, and UKMTO reported projectiles struck a tanker some 51 nautical miles off Qatar, which maritime security sources identified as the chemical tanker Acers. US President Donald Trump is weighing next steps, including whether to escalate strikes before or after November's midterms, while the war costs US$3 billion a month.", "url": "https://www.straitstimes.com/world/middle-east/attack-risks-rise-for-tankers-as-iran-vows-to-block-more-hormuz-routes"}, {"id": "st-09oct-04", "title": "Batam residents protest against data centre expansion as water shortages worsen", "source": "ST", "date": "09 Oct 2026", "tags": ["Southeast Asia", "Society", "Technology & AI"], "summary": "Dozens of residents in Batam's Nongsa district blocked access to Nongsa Digital Park on Oct 5, protesting water shortages they say have cut piped supplies for months while data centres expand. Protesters dispersed after a BP Batam official promised to restore supplies within two days and sent six water tankers; by Oct 7 supply was restored to about 53% of affected areas. BP Batam deputy head of business development Denny Tondano blamed El Nino and said data centres draw from the Duriangkang Reservoir via a dedicated pipeline, while homes rely on the depleted Nongsa Reservoir. At least 16 hyperscale data centre projects are in the pipeline across Batam, expected fully operational by 2027–2028.", "url": "https://www.straitstimes.com/asia/se-asia/batam-residents-protest-against-data-centre-expansion-as-water-shortages-worsen"}, {"id": "st-09oct-05", "title": "China militia boat spotted for first time off Taiwan's east coast, patrol finds", "source": "ST", "date": "09 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "A Chinese maritime militia boat, the Minfudingyu 07902, was spotted with a Chinese coast guard cutter and a research vessel off Taiwan's Pacific coast in mid-August, according to a surveillance report by Taiwan's Apex Aviation reviewed by Reuters, the first known sighting of such a craft in the area. Taiwan's defence ministry said China was using law enforcement and research as cover for harassment, and two senior Taiwan officials confirmed the three vessels, identified as cutter 2502 and research ship Xiang Yang Hong 03 alongside the militia boat. The group was detected more than 30 nautical miles off Hualien. China has stepped up east-coast coast guard patrols since June, which Taiwan officials believe is blockade practice.", "url": "https://www.straitstimes.com/asia/china-militia-boat-spotted-for-first-time-off-taiwans-east-coast-patrol-finds"}, {"id": "st-09oct-06", "title": "Greece agrees up to $4 billion US arms deal, sources say", "source": "ST", "date": "09 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "Greece has agreed to spend up to US$4 billion upgrading more F-16 fighter jets and buying advanced US missiles, two senior sources told Reuters on Oct 8, a day after a visit by US Secretary of State Marco Rubio. A senior defence ministry official said the deal covers new missiles and bombs for F-16 Vipers, F-35s and Black Hawk helicopters, plus upgrading old F-16s, and is largely within the multi-year defence plan. Greece already planned to spend about €28 billion by 2036 on F-35s, helicopters and the \"Achilles Shield\" air-defence system. It is upgrading about 82 F-16s and wants 37 more Block 50s upgraded for about US$1 billion.", "url": "https://www.straitstimes.com/world/europe/greece-agrees-up-to-4-billion-us-arms-deal-sources-say"}, {"id": "st-09oct-07", "title": "Houthi strikes rattle Riyadh, disrupt flights as Saudi Arabia rallies allies", "source": "ST", "date": "09 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "Yemen's Houthis stepped up strikes on Riyadh, firing a ballistic missile at the city's airport on Oct 8, disrupting flights, and threatening to force Saudi airspace to close after Riyadh backed Yemen's government in a reignited civil war. Saudi authorities said on Oct 7 that three people were killed this week in strikes on airports in Riyadh and Abha, and several multinationals in the King Abdullah Financial District told staff to work from home, people familiar said. Saudi Arabia is seeking support from Turkey and Pakistan, while one US and one Syrian defence official said Syria is weighing military aid. Turkey said it is sending mainly defensive and technical support, and the renewed fighting has displaced 200,000 people.", "url": "https://www.straitstimes.com/world/middle-east/houthi-strikes-rattle-riyadh-disrupt-flights-as-saudi-arabia-rallies-allies"}, {"id": "st-09oct-08", "title": "In race with US, China struggles to recruit foreign AI researchers", "source": "ST", "date": "09 Oct 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "Despite new science visas and research grants, China is failing to attract foreign AI researchers, and for every 30 Chinese AI researchers in the US in 2025 only one moved the other way, according to a Carnegie Endowment for International Peace study of NeurIPS 2025 papers. The number of Chinese-origin researchers working in the US rose by 4 percentage points from three years earlier, said study lead Damien Ma. China is, however, retaining home-grown talent: 12 of the top 30 NeurIPS institutions were Chinese in 2025, up from six in 2022, and Chinese researchers made up 41% of authors versus 34% for the US. A recent Bloomberg report says China has also curtailed travel by AI entrepreneurs and researchers.", "url": "https://www.straitstimes.com/asia/east-asia/in-race-with-us-china-struggles-to-recruit-foreign-ai-researchers"}, {"id": "st-09oct-09", "title": "Kremlin: Russia agrees with Rubio that Ukraine conflict is in a stalemate", "source": "ST", "date": "09 Oct 2026", "tags": ["Geopolitics"], "summary": "Kremlin spokesman Dmitry Peskov was quoted by Russian news agencies on Oct 8 as saying Russia agrees with US Secretary of State Marco Rubio that the Ukraine conflict is in a stalemate, adding it was up to diplomats to find a path to peace. Speaking on the sidelines of an ex-Soviet leaders' meeting in Turkmenistan, Peskov saw no immediate prospect of a Putin-Zelenskiy-Trump summit and reiterated that Moscow wants a comprehensive settlement, not temporary measures such as a limited ceasefire. US envoys Steve Witkoff and Jared Kushner are to meet Ukrainian representatives in Miami on Oct 9 to try to produce a unified peace proposal, an American source said.", "url": "https://www.straitstimes.com/world/europe/kremlin-russia-agrees-with-rubio-that-ukraine-conflict-is-in-a-stalemate"}, {"id": "st-09oct-10", "title": "Malaysia builds a new ‘Silicon Island’ to house its AI ambitions", "source": "ST", "date": "09 Oct 2026", "tags": ["Southeast Asia", "Technology & AI"], "summary": "Penang is reclaiming a 930ha \"Silicon Island\" south of the main island to give its land-constrained semiconductor sector room to grow and move into design and advanced packaging. A Deloitte study cited by developer Silicon Island Development, 70% owned by Gamuda, projects a cumulative 1.1 trillion ringgit economic contribution and about 75 billion ringgit of investment through 2050, plus some 220,000 jobs. Gamuda is financing 14 billion ringgit of reclamation and infrastructure through a syndicated loan, with first land sales planned for early 2027 and first industrial operations by early 2029. Chief Minister Chow Kon Yeow cited strong interest from Taiwan and Japan, though full build-out could take 15 years.", "url": "https://www.straitstimes.com/asia/se-asia/malaysia-builds-a-new-silicon-island-to-house-its-ai-ambitions"}, {"id": "st-09oct-11", "title": "Naval Group steps up Europe push as defence spending rises", "source": "ST", "date": "09 Oct 2026", "tags": ["Defence", "Finance & Markets"], "summary": "French state-controlled warship builder Naval Group is stepping up its push into Europe's growing naval market, betting fast frigate delivery will give it an edge over rivals such as BAE Systems and TKMS, executives said. European clients outside France now account for 20% to 25% of its €4.7 billion annual turnover, up from zero in 2019, after contracts in the Netherlands, Belgium, Greece and Sweden. Naval Group says it can build two Defence and Intervention Frigates a year at Lorient, with delivery under four years. It is preparing a bid for Denmark's frigate tender against Babcock, after losing Norway's contract to BAE Systems last year.", "url": "https://www.straitstimes.com/world/europe/naval-group-steps-up-europe-push-as-defence-spending-rises"}, {"id": "st-09oct-12", "title": "Russia’s Yandex says unclear whether data centre can be restored after Ukraine strike", "source": "ST", "date": "09 Oct 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "Russian technology and AI company Yandex said on Oct 8 it could not yet determine whether equipment at its Sasovo data centre, hit by a Ukrainian drone attack, could be restored. The strike caused a fire and forced Yandex to suspend operations at the site, one of its five large data centres hosting tens of thousands of servers, and some services were unavailable. Two of Yandex's three supercomputers used to develop its AI model are housed at Sasovo, though the company has not said whether they were damaged. Specialist teams are still assessing the damage.", "url": "https://www.straitstimes.com/world/europe/russias-yandex-says-unclear-whether-data-centre-can-be-restored-after-drone-strike"}, {"id": "st-09oct-13", "title": "Russia’s war in Ukraine is at a dangerous stalemate, says US’ Rubio", "source": "ST", "date": "09 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "US Secretary of State Marco Rubio said on Oct 8, during a visit to Portugal, that Russia's war in Ukraine is at a dangerous stalemate and the US will keep working towards a permanent, negotiated settlement. The Trump administration has sought in recent weeks to revive talks to end the four-year-old conflict, with Ukrainian negotiators due in the US for talks on Oct 9 and 10. Mutual Russian and Ukrainian drone attacks have spread from energy facilities and refineries to ports, oil and grain vessels, e-commerce warehouses and data centres. Rubio warned escalation could become a sabotage campaign in neighbouring NATO countries, but said Washington would not \"invest in pointless processes if we can’t make progress\".", "url": "https://www.straitstimes.com/world/europe/rubio-says-war-in-ukraine-is-at-a-dangerous-stalemate"}, {"id": "st-09oct-14", "title": "S’pore to ensure gains from AI roll-out are shared widely: PM Wong", "source": "ST", "date": "09 Oct 2026", "tags": ["Southeast Asia", "Technology & AI", "Society"], "summary": "Prime Minister Lawrence Wong said at the Forbes Global CEO Conference in Singapore on Oct 8 that Singapore's AI approach is to share the technology's gains widely and protect every worker rather than every job, relying on its tripartite compact of government, employers and unions. Unions administer enterprise transformation grants, and firms are asked to retrench only as a last resort and treat affected workers fairly. Wong said GDP growth of 5% for three consecutive years owed partly to specialty chipmakers such as GlobalFoundries and Micron and a semiconductor ecosystem, but warned no boom is forever. He called for international rules on frontier AI, possibly under the UN, and said Singapore would stay open and seek new links with Latin America and Africa when it chairs ASEAN in 2027.", "url": "https://www.straitstimes.com/singapore/politics/spore-to-ensure-gains-from-ai-rollout-are-shared-widely-pm-wong"}, {"id": "st-09oct-15", "title": "Samsung flags $95.7 billion profit on AI boom, highest quarterly for any tech company", "source": "ST", "date": "09 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Samsung Electronics on Oct 8 estimated third-quarter operating profit of 107.4 trillion won, a nearly ninefold jump and the first time a technology company has topped 100 trillion won in a quarter, beating an LSEG SmartEstimate of 106.1 trillion won. Revenue is expected to rise 127% from 2025 to 195 trillion won, Samsung's fourth straight quarter of record operating profit, driven by an AI-led memory chip shortage that has pushed DRAM, NAND and HBM prices sharply higher. Samsung and Micron expect the supply imbalance to persist into 2028, though rising costs, Chinese competition and possible US chip tariffs are risks. Detailed results, including divisional earnings, are due on Oct 29.", "url": "https://www.straitstimes.com/business/samsung-flags-95-7-billion-profit-on-ai-boom-highest-quarterly-for-any-tech-company"}, {"id": "st-09oct-16", "title": "South Korea recalls ambassador from Ukraine amid N. Korea prisoners wrangle", "source": "ST", "date": "09 Oct 2026", "tags": ["Geopolitics"], "summary": "South Korea said on Oct 8 it will recall its ambassador to Ukraine over a deepening row about the transfer of North Korean prisoners of war to Seoul, which President Volodymyr Zelensky disclosed in September and Seoul says put the prisoners' families in North Korea at risk. President Lee Jae Myung has demanded an official apology, while Ukraine said it remains open to restoring dialogue. The recall follows a Guardian report alleging more than 176,000 tonnes of fuel, mostly diesel, were shipped from South Korea to Russia in July and August. Seoul's foreign ministry said that even if the fuel originated in South Korea, which it said had not been established, refined products such as diesel are not covered by its export controls on Russia.", "url": "https://www.straitstimes.com/asia/east-asia/south-korea-recalls-ambassador-from-ukraine-amid-n-korea-prisoners-wrangle"}, {"id": "st-09oct-17", "title": "Tencent mulls over US$5 billion bond offering as AI push ramps up", "source": "ST", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Tencent Holdings is considering an offshore bond sale of up to US$5 billion, possibly in dollars and offshore yuan and as early as October, according to people familiar with the matter. It would follow Tencent's nearly US$4.7 billion sale of long-dated dollar and yuan securities in June, its largest debt offering since 2020, and adds to a tech-sector borrowing rush that included SoftBank Group's US$11.1 billion junk-bond deal in September. Goldman Sachs credit strategists say global AI-related debt issuance has topped US$575 billion in 2026. Tencent, which has about US$22 billion of offshore notes outstanding, raised AI and computing capex by 176% to 52.8 billion yuan in the June quarter to catch up with ByteDance and Alibaba.", "url": "https://www.straitstimes.com/business/tencent-mulls-us5-billion-bond-offering-as-ai-push-ramps-up"}, {"id": "st-09oct-18", "title": "The Russian shadow behind South Korea’s rows with Ukraine", "source": "ST", "date": "09 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "In an ST analysis, Jonathan Eyal argues South Korea's rows with Ukraine reflect a deliberate shift by President Lee Jae Myung towards courting Russia, citing European media reports that more than 150,000 tonnes of fuel went from Ulsan and Yeosu to Russia in July and August via ship-to-ship transfers. He contrasts this with Seoul's earlier role as Europe's model Asian partner: it supplied 8.6% of major arms imported by NATO's European members in 2021-2025 and reported US$15.4 billion of defence exports to Europe in 2025. Eyal points to Lee's Moscow-friendly appointments, a secret envoy trip to Moscow and Arctic shipping policy. He argues Russia will offer no concessions and Seoul risks a European backlash costly to its export-led economy.", "url": "https://www.straitstimes.com/opinion/the-russian-shadow-behind-south-koreas-rows-with-ukraine"}, {"id": "st-09oct-19", "title": "Turkey says Russia, Ukraine increasing attacks in Black Sea ahead of winter", "source": "ST", "date": "09 Oct 2026", "tags": ["Geopolitics", "Trade"], "summary": "Turkish Foreign Minister Hakan Fidan said on Oct 8 that Russia and Ukraine are intensifying attacks in the Black Sea to establish military superiority before winter, seriously endangering navigational safety. Speaking alongside Hungarian counterpart Anita Orban in Ankara, he said the region must not become a new front in the war. Attacks have struck Turkish-flagged and Turkish-owned commercial vessels, and Ankara is awaiting responses to a proposal it sent both sides to halt attacks and secure grain shipments. Ukraine has stepped up strikes on ships and infrastructure serving Russian oil and grain exports since July, when Russia intensified strikes on the Ukrainian grain hubs of Odesa, Chornomorsk and Pivdennyi.", "url": "https://www.straitstimes.com/world/europe/turkey-says-russia-ukraine-increasing-attacks-in-black-sea-ahead-of-winter"}, {"id": "st-09oct-20", "title": "Turkey’s foreign minister says Ankara weighing Saudi defence support, rules out offensive role", "source": "ST", "date": "09 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "Turkish Foreign Minister Hakan Fidan said on Oct 8 that Turkey is assessing how to help Saudi Arabia defend against attacks by Yemen's Iran-aligned Houthis under the Mecca Joint Defence Agreement with Pakistan, but ruled out joining offensive operations. The pact, signed in August, treats an attack on one member as an attack on all, and on Oct 5 the three countries agreed to move immediately to implement it, including \"rapid deployment\" of forces in Saudi Arabia. Fidan said possible contributions are mainly air defence, electronic warfare and technical support. Because Turkey's parliament has not ratified the pact, support would for now be largely bilateral; Fidan said it would be submitted for approval as soon as possible.", "url": "https://www.straitstimes.com/world/middle-east/turkeys-foreign-minister-says-ankara-weighing-saudi-defence-support-rules-out-offensive-role"}, {"id": "st-09oct-21", "title": "UK announces new round of Russia sanctions targeting financial services, 'shadow fleet'", "source": "ST", "date": "09 Oct 2026", "tags": ["Geopolitics", "Energy", "Finance & Markets"], "summary": "Britain's Foreign Office announced 38 new sanctions designations on Oct 8 aimed at Russia's oil revenue, financial channels and military supply chains. The package covers 12 more oil tankers Britain says belong to Russia's shadow fleet, three crypto exchanges and two payment platforms it suspects of helping Russia evade financial sanctions, two of which it says handled transactions with the A7 illicit finance network. It also targets 17 entities and individuals supplying goods deemed critical to the war effort, including Russia-based importers of machine tools, electronics and missile and drone materials. Russia's embassy in London, as reported by RIA Novosti, said the sanctions highlight the \"ineffectiveness and futility\" of Britain's course.", "url": "https://www.straitstimes.com/world/europe/uk-announces-new-round-of-russia-sanctions-targeting-financial-services-shadow-fleet"}, {"id": "st-09oct-22", "title": "UOB to create 1,000 roles even as concerns rise over AI’s impact on entry-level roles for fresh grads", "source": "ST", "date": "09 Oct 2026", "tags": ["Southeast Asia", "Society", "Technology & AI"], "summary": "UOB expects to hire 1,000 young graduates over the next 12 months, mostly in permanent roles in personal financial services and anti-money laundering plus graduate and internship programmes, despite concerns that AI is eroding entry-level jobs. Chief executive Wee Ee Cheong announced the plans at the bank's Better U employee festival on Oct 8, saying routine tasks can be automated but humans are still needed \"to sell, to make decisions\". UOB will also train 5,500 managers across the region for an AI-enabled workplace by end-2027. Its enhanced Gig+U programme, open to employees and external hires by the first quarter of 2027, will add customer-facing and sales advisory roles, with a talent pool of 200 participants.", "url": "https://www.straitstimes.com/business/uob-to-create-1000-jobs-for-fresh-graduates-as-concerns-rise-over-impact-of-ai-on-entry-level-roles"}, {"id": "st-09oct-23", "title": "US imposes fresh sanctions on Iran's shadow fleet", "source": "ST", "date": "09 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "The US Treasury on Oct 8 imposed fresh sanctions on individuals, networks and 17 vessels transporting Iranian crude, oil products and petrochemicals under its \"Operation Economic Outcast\", which aims to cut Tehran's funding for the war, missiles, cyberattacks and the IRGC. A Treasury official told reporters the action neutralises the vast majority of Iran's shadow fleet and cuts off the regime's last major source of illicit revenue. The move adds pressure after the US re-imposed its blockade of Iranian ports on July 14 following the breakdown of a memorandum of understanding between Tehran and Washington. A Treasury official said Iran has only about 20 million barrels of crude left on vessels outside the blockade.", "url": "https://www.straitstimes.com/world/middle-east/us-imposes-fresh-sanctions-on-irans-shadow-fleet"}, {"id": "st-09oct-24", "title": "Witkoff, Kushner to meet Ukrainians in Miami on Friday, says US source", "source": "ST", "date": "09 Oct 2026", "tags": ["Geopolitics"], "summary": "US envoys Steve Witkoff and Jared Kushner will meet Ukrainian representatives in Miami on Oct 9 to discuss new proposals for ending the war, according to an American source familiar with the plan. The source said the working session will cover ideas US negotiators began developing with Russians and Ukrainians on a recent regional visit, including security guarantees for Ukraine and a post-war prosperity plan. White House National Security Council and Treasury officials will attend, and national security advisers from the UK, France and Germany plus NATO and EU officials were invited. Earlier on Oct 8 Secretary of State Marco Rubio called the conflict a dangerous stalemate, and President Donald Trump said this week he planned to speak to Vladimir Putin by phone soon.", "url": "https://www.straitstimes.com/world/europe/witkoff-kushner-to-meet-ukrainians-in-miami-on-friday-says-us-source"}, {"id": "bt-09oct-01", "title": "‘Reinvented’ PC: Microsoft says new laptop with Nvidia chip outperforms MacBooks on AI tasks", "source": "BT", "date": "09 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Microsoft unveiled pricing for its Nvidia-chip-based Surface Laptop Ultra, which executives said at an Oct 7 event in San Francisco returns prompts from locally run AI models twice as fast as Apple's MacBook Pro M5 and generates videos six times quicker. The Ultra will start at US$2,599, about US$400 less than an entry-level 16-inch MacBook Pro, and will ship soon. The Nvidia PC chip, also used by Dell Technologies and HP, opens a new front of competition with Intel and AMD; Nvidia CEO Jensen Huang said \"We’ve reinvented the personal computer completely\". Microsoft is trying to defend Windows' dominance in the AI era, though Gartner said earlier in 2026 that surging memory costs would likely delay AI PCs becoming a majority of shipments until 2028.", "url": "https://www.businesstimes.com.sg/companies-markets/reinvented-pc-microsoft-says-new-laptop-nvidia-chip-outperforms-macbooks-ai-tasks"}, {"id": "bt-09oct-02", "title": "‘Take some pain today for growth tomorrow’: Why policymakers should heed IMF’s call", "source": "BT", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "In a BT opinion piece, an associate at LSE IDEAS argues policymakers should heed IMF managing director Kristalina Georgieva's call for fiscal consolidation, made in a curtain-raiser speech in Singapore on Oct 7 ahead of the IMF-World Bank Annual Meetings in Bangkok on Oct 12-18. Georgieva cited global debt above US$365 trillion (per the Institute of International Finance), high energy prices after the Iran crisis, and US, German and Japanese 10-year yields at their highest since 2007, 2009 and 1996 respectively. She said AI could lift global growth by up to half a percentage point a year but warned that should earnings fall flat, hyperscaler leverage and large global holdings of US equities could turn a disappointment into a far-reaching shock. The writer argues that with borrowing costs above growth rates, medium-term consolidation and structural reforms are urgent.", "url": "https://www.businesstimes.com.sg/opinion-features/take-some-pain-today-growth-tomorrow-why-policymakers-should-heed-imfs-call"}, {"id": "bt-09oct-03", "title": "Amazon’s fresh job cuts hit retail division; under 1,000 white collar staff affected, source says", "source": "BT", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Society"], "summary": "Amazon confirmed on Oct 7 it had cut a small number of jobs, mainly in its stores unit that runs the main e-commerce website, with fewer than 1,000 white-collar workers let go, according to a person familiar with the matter. The cuts coincided with its Prime Big Deal Days promotion on Oct 6-7, and internal Slack posts suggested customer service and selling partner services were among divisions hit, with staff in the US, India and the UK affected. They follow a larger round of 30,000 job cuts that began in 2025 and continued into January. Founder and executive chairman Jeff Bezos told Fox News continued cuts were necessary because the company overhired during the pandemic.", "url": "https://www.businesstimes.com.sg/companies-markets/amazons-fresh-job-cuts-hit-retail-division-under-1000-white-collar-staff-affected-source-says"}, {"id": "bt-09oct-04", "title": "China-based suspect in South Korea bank hacks used AI, Claude tools: CrowdStrike report", "source": "BT", "date": "09 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "US cybersecurity firm CrowdStrike said in an Oct 7 report that the suspect behind recent cyberattacks on South Korea's financial sector may be a 26-year-old in China's Guangdong province who used the Chinese-developed open-source AI agent tool Artex and Anthropic's Claude Code. It assessed with moderate confidence that the actor is likely a Chinese speaker and financially motivated, citing Chinese-language prompts and requests to Claude about where Korean breach data is sold. A Claude-generated resume included a location in Maoming, Guangdong, which CrowdStrike said likely belonged to the attacker. At least nine South Korean banks have been targeted since late September; Shinhan Bank said data of about 25,000 customers was compromised, and police have launched a probe.", "url": "https://www.businesstimes.com.sg/companies-markets/banking-finance/china-based-suspect-south-korea-bank-hacks-used-ai-claude-tools-crowdstrike-report"}, {"id": "bt-09oct-05", "title": "Goldman Sachs says middle managers at risk as new hires oversee AI", "source": "BT", "date": "09 Oct 2026", "tags": ["Technology & AI", "Society", "Finance & Markets"], "summary": "Goldman Sachs' Kevin Sneader, who leads the bank's Asia-Pacific business outside Japan, said at the Milken Institute Asia Summit in Singapore on Oct 8 that new finance hires now manage AI agents from day one, leaving the future of middle managers uncertain. He called redeploying those managers a \"generational challenge\" for many segments. Clayton, Dubilier & Rice operating partner Sandra Peterson said the traditional pyramid career ladder may not survive as AI does the grunt work. MAS managing director Chia Der Jiun said operations staff will need to supervise AI agents and banks will need fewer fresh graduates for analysis, adding Singapore is training bank staff in AI and working with universities.", "url": "https://www.businesstimes.com.sg/companies-markets/banking-finance/goldman-sachs-says-middle-managers-risk-new-hires-oversee-ai"}, {"id": "bt-09oct-06", "title": "In search of the elusive unicorn for SGX’s Global Listing Board", "source": "BT", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "In a BT opinion piece, the chairman of Shan De Advisors and a former SGX senior managing director argues the SGX-Nasdaq Global Listing Board (GLB) has removed regulatory hurdles but still faces commercial obstacles to attracting its first listing. DayOne Data Centers, valued at US$20 billion, filed on Oct 6 for a Nasdaq-only IPO; its US$5 billion raise would have required S$750 million from Singapore investors under the GLB's 15% local fundraising rule, which he calls \"a bridge too far\". He notes US equity fundraising fees of 4-7% versus 2-4% in Singapore may lead banks to steer issuers westwards. He suggests first building support for local small and mid-cap IPOs, with a 15% tranche of a potential US$500 million Carro raise (US$75 million) more realistic.", "url": "https://www.businesstimes.com.sg/companies-markets/search-elusive-unicorn-sgxs-global-listing-board"}, {"id": "bt-09oct-07", "title": "Malaysian chip designers eye new business through Japanese foundry Rapidus", "source": "BT", "date": "09 Oct 2026", "tags": ["Technology & AI", "Southeast Asia"], "summary": "Four Malaysian chip designers – SkyeChip, Oppstar Technology, Infinecs Systems and GreatAsic Technology – are among 17 inaugural Design Solution Associates in Japanese foundry Rapidus' new design ecosystem, Rapidus Core, announced on Oct 5, alongside Singapore's Quest Global Services. The framework links prospective customers with design partners for Rapidus' 2-nanometre platform ahead of its planned 2027 manufacturing launch, but has yet to yield firm orders or revenue. SkyeChip will supply memory interface and die-to-die IP for AI and HPC chips, while Oppstar will offer advanced-node design and layout. Sidec CEO Yong Kai Ping cautioned that \"being a recognised ecosystem partner does not mean a guaranteed order book\".", "url": "https://www.businesstimes.com.sg/international/asean/malaysian-chip-designers-eye-new-business-through-japanese-foundry-rapidus"}, {"id": "bt-09oct-08", "title": "More interest rate hikes needed, but there is ‘flexibility’ about the pace: Fed’s Waller", "source": "BT", "date": "09 Oct 2026", "tags": ["Finance & Markets"], "summary": "Fed Governor Christopher Waller said on Oct 8 that further rate hikes will likely be needed to return inflation to the 2% target, but there is \"flexibility\" on timing, leaving open a pause at the Oct 27-28 meeting. Speaking at a Central Bank of Turkey forum in Istanbul, he cited a strengthening economy, an unresolved energy price shock from the Iran war and AI-driven demand adding to inflation, which is more than a percentage point above target. The Fed raised rates by a quarter point in September to a 3.75%-4% range, and investors expect a hold in October and a hike at the Dec 8-9 meeting. Waller defended Fed officials signalling the likely path, amid no guidance from Chairman Kevin Warsh.", "url": "https://www.businesstimes.com.sg/companies-markets/banking-finance/more-interest-rate-hikes-needed-there-flexibility-about-pace-feds-waller"}, {"id": "bt-09oct-09", "title": "OUE Reit confirms IOI Properties, CapitaLand in talks for One Raffles Place; no binding deal yet", "source": "BT", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "OUE Reit confirmed on Oct 8 that it is in exclusive talks with entities linked to IOI Properties Group and CapitaLand Investment over the sale of One Raffles Place, but said no binding agreement has been signed and there is no certainty a deal will materialise. The filing followed a BT interview in which IOI Properties group CEO Lee Yeow Seng said a 50-50 joint bid submitted about three months ago had been accepted for exclusive due diligence by owners OUE Reit and UOB. Market estimates value the Raffles Place property at S$2.3 billion to S$2.4 billion. OUE Reit units fell 1.5% to S$0.34 and CLI shares fell 1.2% to S$2.46, while IOI Properties rose 2.4% to RM3.38.", "url": "https://www.businesstimes.com.sg/property/oue-reit-confirms-ioi-properties-capitaland-talks-one-raffles-place-says-no-binding-deal-reached-yet"}, {"id": "bt-09oct-10", "title": "OpenAI annualised revenue closer to US$50 billion than reported US$70 billion: FT", "source": "BT", "date": "09 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "OpenAI's annualised revenue is about US$20 billion less than previously signalled, the Financial Times reported on Oct 8, citing financial documents shared with investors. According to the FT, OpenAI recently told investors its revenue was approaching US$50 billion on an annualised basis at end-September, short of the US$70 billion reported by media outlets including Reuters. The FT, citing a person with knowledge of the matter, said the gap arose from investors' attempts to compare directly with Anthropic, which counts sales via cloud partners such as AWS and Google Cloud while OpenAI does not. Reuters could not verify the report; OpenAI and Anthropic are potentially preparing to go public.", "url": "https://www.businesstimes.com.sg/startups-tech/technology/openai-annualised-revenue-closer-us50-billion-reported-us70-billion-ft"}, {"id": "bt-09oct-11", "title": "SK Hynix’s flash memory unit Solidigm said to pick banks for US IPO in 2027", "source": "BT", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "SK Hynix's flash memory unit Solidigm has picked Goldman Sachs and Morgan Stanley to lead a US IPO in 2027 that could raise about US$10 billion, according to people familiar with the matter. JPMorgan Chase, Citigroup and UBS have also been tapped, and Solidigm is working to finalise a pre-IPO funding round, the people said; Bloomberg News has reported a listing could value it at up to US$100 billion. SK Hynix said Solidigm is reviewing options but no plans are confirmed. Formed in 2021 from Intel's flash business, Solidigm has recast itself as a supplier of high-capacity drives for AI data centres, with customers including CoreWeave, Dell Technologies and Tencent.", "url": "https://www.businesstimes.com.sg/companies-markets/sk-hynixs-flash-memory-unit-solidigm-said-pick-banks-us-ipo-2027"}, {"id": "bt-09oct-12", "title": "TSMC’s Q3 revenue surges to record, beating market forecast", "source": "BT", "date": "09 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "TSMC reported record third-quarter revenue of NT$1.49 trillion (US$46.71 billion) on Oct 8, up 50% year on year on surging AI demand and above the LSEG SmartEstimate of NT$1.46 trillion. The figure, calculated by Reuters, also topped the company's own July guidance of US$44.6 billion to US$45.8 billion. September revenue rose 54.6% to NT$511.86 billion. TSMC, Asia's most valuable listed company at US$2.1 trillion, will report Q3 earnings next Thursday, when analysts expect net profit to rise 64% to NT$740.8 billion.", "url": "https://www.businesstimes.com.sg/companies-markets/tsmcs-q3-revenue-surges-record-beating-market-forecast"}, {"id": "bt-09oct-13", "title": "Temasek-related Azalea, SeaTown, Seviora Capital to merge in 2027", "source": "BT", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Seviora Holdings, Temasek's primary asset management platform, said on Oct 8 it will merge its wholly owned units Azalea Investment Management, SeaTown Holdings International and Seviora Capital into a single platform from Jan 1, 2027, operating under the Seviora name. Gabriel Lim will remain CEO, with Yeo Hong Ping as COO, Azalea's Chue En Yaw heading global fund solutions and SeaTown's Patrick Pang heading private capital. Fullerton Fund Management and InnoVen Capital are unaffected and remain separate legal entities, and the group is undergoing a brand review. The move comes as Singapore pushes to compete in asset management and follows Temasek's reorganisation into three entities from April.", "url": "https://www.businesstimes.com.sg/companies-markets/temasek-related-azalea-seatown-seviora-capital-merge-2027"}, {"id": "bt-09oct-14", "title": "UK card defaults rise for longest period in 17 years: BOE", "source": "BT", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Society"], "summary": "UK credit card defaults rose for a sixth consecutive quarter, the first such run since the 2008-2009 financial crisis, a Bank of England credit conditions survey showed. Lenders reporting higher default rates in the three months to September outnumbered those seeing a decline by 26 percentage points, and lenders expect another rise in the fourth quarter. Households are squeezed by higher borrowing costs since the Iran war began at end-February, with inflation at 3.1% expected to top 4% early next year; consumer credit rose a record £2.5 billion in August. The survey, conducted Aug 17 to Sep 4, predates the escalation that pushed oil back above US$100 a barrel, while mortgage defaults fell slightly.", "url": "https://www.businesstimes.com.sg/international/uk-card-defaults-rise-longest-period-17-years-boe"}, {"id": "scmp-09oct-01", "title": "Alibaba’s AI cloud revenue set to surge over 50% as investment blitz pays off: analysts", "source": "SCMP", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Analysts expect Alibaba's AI Cloud and Compute Services unit to report revenue growth of about 50% for the quarter ended September 30, accelerating from 45% in the June quarter, as its heavy AI investment starts to pay off. Jefferies projects a segment profit margin of 12.3%, while Singapore-based Longbridge Securities forecasts an EBITA margin of about 15%, up from 12%. Longbridge sees AI Lab and Applications revenue up 20% with losses narrowing to 10 billion–11 billion yuan, and Jefferies expects group revenue to rise 9.6%. Jefferies analysts say cloud profits should offset AI Lab losses by end-December; Alibaba reports September-quarter earnings in November.", "url": "https://www.scmp.com/tech/big-tech/article/3370209/alibabas-ai-cloud-revenue-set-surge-over-50-investment-blitz-pays-analysts"}, {"id": "scmp-09oct-02", "title": "Amid battle for AI edge, Hong Kong presses HSBC over Singapore hub decision: sources", "source": "SCMP", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Technology & AI", "Southeast Asia"], "summary": "The Hong Kong Monetary Authority has questioned HSBC over its decision to set up an AI centre in Singapore despite Hong Kong being its largest market, a source familiar with the matter told the SCMP, adding the HKMA has been in discussions with the bank since the announcement. HSBC said in late July it would open the Singapore centre by year-end and hire 100 AI specialists there, days after agreeing to sell its Singapore life and health insurance business to Allianz for S$2.7 billion (US$2.1 billion). Industry figures called the move \"classic competitive regulatory signalling\" in the Hong Kong-Singapore rivalry. HSBC declined to comment, but CEO Georges Elhedery said in August the bank has 150 AI specialists in Hong Kong and is building an AI research institute there.", "url": "https://www.scmp.com/business/banking-finance/article/3370203/amid-battle-ai-edge-hong-kong-presses-hsbc-over-singapore-hub-decision-sources"}, {"id": "scmp-09oct-03", "title": "As China and the EU begin crunch trade talks, optimism is in short supply", "source": "SCMP", "date": "09 Oct 2026", "tags": ["Trade", "Geopolitics"], "summary": "China and the EU opened a new round of trade talks in Beijing on Oct 8, with observers on both sides expecting no major breakthrough and mainly hoping to avoid a full-blown trade conflict. A Chinese source said EU Trade Commissioner Maros Sefcovic \"will not go home empty-handed\", while Chinese firms in Europe hoped for limited progress and braced for more friction in autos, medical equipment and chemicals. European analysts say Sefcovic is under pressure to deliver amid fears of a second China shock, after France and Germany on Oct 5 proposed a rapid-response tool letting the European Commission swiftly cut a threatening third country out of its market. IFRI's Marc Julienne expects a more intensified tit-for-tat, though neither side wants a trade war.", "url": "https://www.scmp.com/economy/china-economy/article/3370119/china-and-eu-begin-crunch-trade-talks-optimism-short-supply"}, {"id": "scmp-09oct-04", "title": "Beyond the summit: how US-China relations could still unravel", "source": "SCMP", "date": "09 Oct 2026", "tags": ["Geopolitics", "Politics"], "summary": "An SCMP opinion piece argues that the upbeat optics of President Xi Jinping's state visit to the US cannot hide frictions over tech exports, investment and domestic politics that could pull ties off track. The writer says there is no US consensus on what to offer for China lifting rare earth export controls, and that chip controls were never on the negotiating table, as the Post was told, suggesting hawks lead on the issue. Chinese hopes of opening the door to US investment proved futile, Ford CEO Jim Farley warned against admitting Chinese carmakers, and Trump declined China's request to openly oppose Taiwan independence while delaying arms sales to Taiwan. With midterms weeks away and US allies such as Japan lobbying Washington, the writer says the next three months will be decisive.", "url": "https://www.scmp.com/opinion/china-opinion/article/3369893/beyond-summit-how-us-china-relations-could-still-unravel"}, {"id": "scmp-09oct-05", "title": "Can China match up with Meta’s Muse in race to harness AI agents?", "source": "SCMP", "date": "09 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Meta Platforms' Muse personal AI agent, launched on September 8, passed 2.5 million downloads in two weeks and topped US free-app rankings, putting a spotlight on \"agent harnesses\" that give AI models memory, tool access and autonomy. A Bernstein report says the main prize is context lock-in, which could favour Tencent and Alibaba's sprawling ecosystems; it rates Tencent's WorkBuddy as the early engagement leader among Chinese productivity harnesses and sees its Xiaowei agent running through WeChat. Bernstein says Alibaba is pursuing an enterprise strategy across QwenWork, DingTalk, Taobao and Alibaba Cloud, with ByteDance a contender via Feishu. Bank of America's Winnie Wu cautions that China's guarded ecosystems, users' reluctance to pay subscriptions and computing constraints could make Muse harder to replicate.", "url": "https://www.scmp.com/tech/big-tech/article/3370123/can-china-match-metas-muse-race-harness-ai-agents"}, {"id": "scmp-09oct-06", "title": "China’s AI chipmaker Biren tumbles 12% as it seeks US$510 million in share placement", "source": "SCMP", "date": "09 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Shares of Shanghai Biren Technology closed down 11.9% at HK$30.36 in Hong Kong on Oct 8 after the AI chipmaker said it plans to raise HK$4 billion (US$510 million) by placing 130 million new shares at HK$31.08, about a 10% discount to the previous close of HK$34.44. It is Biren's second placement since its January listing, after HK$7 billion raised in July, taking the two rounds above HK$11 billion in three months. Biren cited \"faster than anticipated\" progress on next-generation AI processors and will put about 70% of net proceeds towards manufacturing capacity, components and commercial launch. First-half 2026 revenue rose about 21-fold to 1.24 billion yuan, while its net loss narrowed to 377 million yuan.", "url": "https://www.scmp.com/tech/tech-trends/article/3370177/chinas-ai-chipmaker-biren-tumbles-12-it-seeks-us510-million-share-placement"}, {"id": "scmp-09oct-07", "title": "End ‘wholesale restrictions’ on Chinese EVs in US, experts say", "source": "SCMP", "date": "09 Oct 2026", "tags": ["Trade", "Geopolitics"], "summary": "Experts at an Oct 6 discussion urged the US to replace \"wholesale restrictions\" on Chinese carmakers and battery makers with targeted safeguards, warning US carmakers could otherwise lose global market share. George Washington University's John Helveston cited a Rhodium Group report that direct government grants give the BYD Seal only a US$304 per-car cost advantage over Tesla's Model 3, about 5% of the gap, with vertical integration and cheaper R&D mattering more. The comments came days after efforts to explore Chinese investments stalled during Xi Jinping's state visit to Washington; according to SCMP sources, a battery deal was discussed but not agreed. Chinese carmakers face US tariffs of more than 120% and connected-vehicle rules, though Trump has floated allowing Chinese plants.", "url": "https://www.scmp.com/news/us/diplomacy/article/3370109/end-wholesale-restrictions-chinese-evs-us-experts-say"}, {"id": "scmp-09oct-08", "title": "German President Steinmeier targets China trip as Berlin sharpens trade stance", "source": "SCMP", "date": "09 Oct 2026", "tags": ["Geopolitics", "Trade"], "summary": "German President Frank-Walter Steinmeier is planning to visit China in the coming weeks, his first official visit since 2018, according to multiple sources familiar with the arrangement, coinciding with Chancellor Friedrich Merz's trips to Japan and South Korea. Chinese foreign ministry spokeswoman Mao Ning said on Oct 8 there were no details to offer. Berlin has shifted to a harder trade line on China: Merz and Emmanuel Macron co-signed a paper for a tool to exclude rule-breaking partners from the EU single market, and on Oct 7 Germany blocked the sale of large parts of Hamburg logistics firm Zippel to Cosco on security grounds. Brussels is pressing Beijing to cap exports of a product understood to be plug-in hybrids, with Berlin-backed safeguard tariffs likely if that fails.", "url": "https://www.scmp.com/news/china/diplomacy/article/3370140/german-president-steinmeier-targets-china-trip-berlin-sharpens-trade-stance"}, {"id": "scmp-09oct-09", "title": "Hong Kong IPO boom at risk as cornerstone backers get cold feet, sources say", "source": "SCMP", "date": "09 Oct 2026", "tags": ["Finance & Markets"], "summary": "Cornerstone investors in Hong Kong IPOs are reconsidering commitments as more than 60% of third-quarter listings trade below issue price, and at least one October IPO has been delayed to November at the earliest after investors pulled out of verbal agreements, according to people familiar with the matter. Hong Kong IPO proceeds reached US$48.4 billion in the first nine months of 2026, the highest for the period since records began in 1980, LSEG data show, but 20 of 31 third-quarter listings were below offer price as of September 30. Six of nine listings raising over US$1 billion are in the red, with Shein and Luxshare 27% and 20% below issue. Temasek, GIC and Hillhouse have mostly recorded paper losses.", "url": "https://www.scmp.com/business/banking-finance/article/3370173/hong-kong-ipo-boom-risk-cornerstone-backers-get-cold-feet-sources-say"}, {"id": "scmp-09oct-10", "title": "How Japanese bond yields, Chinese competition are stoking euro-zone fears", "source": "SCMP", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Trade"], "summary": "An SCMP opinion piece argues that a French bond sell-off and a \"second China shock\" are exposing the euro zone's incomplete integration. France's 10-year yield hit 5% on October 2, its highest since 2002, above Greece and Italy, and its spread over Germany is the widest since 2012. The writer links this to resistance to austerity, the prospect of a Marine Le Pen presidency and reliance on foreign holders, with Japan the largest non-euro-zone holder, while TS Lombard suspects Japanese portfolio rebalancing fuelled recent selling as Japanese yields rose. The writer sees the stress as idiosyncratic rather than systemic, and the deeper crisis in the economy, as China's share of global car exports rose to 15%, matching Germany's.", "url": "https://www.scmp.com/opinion/world-opinion/article/3370128/how-japanese-bond-yields-chinese-competition-are-stoking-euro-zone-fears"}, {"id": "scmp-09oct-11", "title": "How expanded Japan-US military exercises could complicate PLA planning over Taiwan", "source": "SCMP", "date": "09 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "Japan and the US will rehearse moving anti-ship missiles, air defences and communications onto islands near Taiwan in Keen Sword 27 from October 19 to 29, which analysts say could complicate PLA planning for a Taiwan or East China Sea conflict. The drill involves about 45,000 Japanese personnel, 40 ships and 260 aircraft, up from 33,000 personnel in 2024, with about 12,000 US troops reportedly taking part and the Philippines, France, Germany, the Netherlands and New Zealand joining as participants. Japan will deploy Type 88 anti-ship and Type 03 air-defence systems to Yonaguni, just over 100km from Taiwan, alongside US Marine Corps Nmesis and Madis systems. Analysts say the drills signal a widening \"wall strategy\" but could deepen strategic mistrust with Beijing.", "url": "https://www.scmp.com/news/china/military/article/3370210/how-expanded-japan-us-military-exercises-could-complicate-pla-planning-over-taiwan"}, {"id": "scmp-09oct-12", "title": "It’s time for China to offer more than statements on Hormuz", "source": "SCMP", "date": "09 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "An unsigned SCMP opinion piece argues that Beijing's Hormuz diplomacy has been \"rich in principles and thin on procedures\" and that China should back a standing Gulf crisis-management mechanism. It notes two Trump-Xi summits in five months produced shared language but not an open strait, and that last week Trump rejected an Iranian truce proposal and said he was considering resuming bombing after next month's midterms. China imported about half its crude and almost a third of its LNG from the Middle East in 2025 and cut crude imports from 11.7 million to under 9 million barrels a day by late May. The piece proposes a modest, regionally owned mechanism with hotlines, maritime incident reporting and shipping protocols, modelled on the 1972 US-Soviet Incidents at Sea agreement.", "url": "https://www.scmp.com/opinion/world-opinion/article/3369792/its-time-china-offer-more-statements-hormuz"}, {"id": "scmp-09oct-13", "title": "Kremlin aide visits China amid speculation about potential Xi-Putin-Trump meeting", "source": "SCMP", "date": "09 Oct 2026", "tags": ["Geopolitics"], "summary": "Nikolai Patrushev, aide to Russia's president and chairman of Russia's Maritime Board, arrived in China on Oct 8 for talks with Foreign Minister Wang Yi on maritime cooperation, a trip being watched for signs of a possible Xi-Putin-Trump summit at next month's Apec meeting in Shenzhen. He leads a delegation of government agencies, logistics firms, shipbuilders and scientific institutions, and is the first high-level Russian official to visit since Xi's Washington summit with Trump late last month. Putin told the Valdai Discussion Club on Oct 1 that a three-way meeting at Apec \"is certainly possible\", adding it would depend largely on host Xi Jinping. China's ambassador to Moscow, Zhang Hanhui, told Izvestia such a meeting would benefit a multipolar world.", "url": "https://www.scmp.com/news/china/diplomacy/article/3370170/kremlin-aide-visits-china-amid-speculation-about-potential-xi-putin-trump-meeting"}, {"id": "scmp-09oct-14", "title": "More global investors eye Chinese equities, ending 4-year underweight run, bank says", "source": "SCMP", "date": "09 Oct 2026", "tags": ["Finance & Markets"], "summary": "Global active long-only funds have raised their average allocation to Chinese equities to benchmark-neutral from underweight since June, ending four years of underweight positioning, according to a Bank of America analysis of 2,767 funds holding US$562 billion of Chinese stocks. The MSCI China Index traded at about 10.2 times forward earnings on September 30, below its 10-year average of 11.7 times, and China/Hong Kong ETFs saw US$19 million of inflows in August after US$1.94 billion of July outflows. Phillip Capital's Louis Wong called it \"more a stop to the selling, not a broad bullish turn\", with interest concentrated in AI chips, data-centre power and cloud platforms. UOB Kay Hian's Wang Qi, citing higher US interest rates, said investors want to see a sizeable Chinese stimulus first, and Wong noted a 10-year US Treasury yield of around 5.3% sets a high hurdle.", "url": "https://www.scmp.com/business/china-business/article/3370035/more-global-investors-eye-chinese-equities-ending-4-year-underweight-run-bank-says"}, {"id": "scmp-09oct-15", "title": "Pentagon unveils US$350 million quantum computing push as China rivalry grows", "source": "SCMP", "date": "09 Oct 2026", "tags": ["Defence", "Technology & AI"], "summary": "The Pentagon on Oct 8 announced a quantum computing initiative worth around US$350 million to maintain US leadership and support national security, amid competition with China over military uses of advanced technology. Emil Michael, undersecretary of defence for research and engineering, called quantum dominance a \"critical priority\", citing a June executive order. Separately, the Pentagon's Office of Strategic Capital signed a US$150 million conditional loan commitment to PsiQuantum, and on Oct 7 DARPA moved six firms including IBM, IonQ and Microsoft to Stage C of its Quantum Benchmarking Initiative, worth up to US$300 million. China designated quantum technology a core priority in its 2026–2030 five-year plan and set up a US$10 billion national quantum lab in 2017.", "url": "https://www.scmp.com/news/us/science-technology/article/3370243/pentagon-unveils-us350-million-quantum-computing-push-china-rivalry-grows"}, {"id": "scmp-09oct-16", "title": "Retail properties offloaded for losses in weak market as revaluations spark bank concerns", "source": "SCMP", "date": "09 Oct 2026", "tags": ["Finance & Markets"], "summary": "Several Hong Kong retail properties held by prominent investors have recently sold at heavy losses, which analysts attribute to banks taking a tough line on debt collection after revaluations. Centaline Commercial managing director Stanley Poon said shop prices have fallen 30% to 70% from 2018 peaks, with owners facing bank demands to cover mortgage shortfalls. Kam Wah Holdings chairman Yeung Fun-bun sold a Cheung Sha Wan shop for HK$22.8 million, 57.8% below its HK$54 million 2018 purchase price, while Choi Pak-nang sold a Mong Kok shop for HK$27 million, 57% below what he paid in 2012, according to market sources. Poon said banks that had held off may now take possession and sell foreclosed properties.", "url": "https://www.scmp.com/business/banking-finance/article/3370125/retail-properties-offloaded-losses-weak-market-revaluations-spark-bank-concerns"}, {"id": "scmp-09oct-17", "title": "South Korea test-flies its first home-grown hypersonic weapon", "source": "SCMP", "date": "09 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "South Korea flight-tested its first domestically developed hypersonic weapon on Oct 8, designed to fly at least five times the speed of sound and evade missile defences, with President Lee Jae Myung attending and calling it a major step for conventional defence. According to a statement, the weapon separated from its booster, manoeuvred vertically and horizontally and hit a test target; Lee also inspected the Hyunmoo-5 ballistic missile. The test follows North Korea's October 3 launch of what it called a hypersonic intermediate-range missile, which it said flew more than 1,000km; Seoul detected over 700km and Japan about 680km. Inter-Korean tensions have risen after landmine blasts injured three South Korean soldiers last month.", "url": "https://www.scmp.com/news/asia/east-asia/article/3370218/south-korea-test-flies-its-first-home-grown-hypersonic-weapon"}, {"id": "scmp-09oct-18", "title": "The ‘G2’ illusion? After Xi-Trump summit, China wants equality while the US seeks deals", "source": "SCMP", "date": "09 Oct 2026", "tags": ["Geopolitics"], "summary": "An SCMP analysis says Xi Jinping's state visit to Washington has exposed differing meanings of reciprocity: transactional for the US, equal standing for China, as Wang Yi made explicit in remarks released by Xinhua on September 26. Analysts quoted largely doubt a G2 is emerging: Tsinghua's Sun Chenghao said protocol alone does not show a G2 framework, ICAS's Sourabh Gupta called it \"a far-fetched assumption\", and Hudson's Ken Moriyasu said Xi wants a multipolar order rather than a duopoly. The pageantry stirred unease in India, according to NUS fellow Ivan Lidarev, who expects New Delhi to pursue a thaw with Beijing and a less US-leaning position.", "url": "https://www.scmp.com/news/china/diplomacy/article/3370028/g2-illusion-after-xi-trump-summit-china-wants-equality-while-us-seeks-deals"}, {"id": "scmp-09oct-19", "title": "UK signals ‘openness’ to Germany joining GCAP fighter jet programme", "source": "SCMP", "date": "09 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "British Prime Minister Andy Burnham told Chancellor Friedrich Merz in Berlin on Oct 8 that Britain is open to Germany joining the Global Combat Air Programme (GCAP), the sixth-generation fighter project with Italy and Japan. Germany's FCAS jet project with France collapsed earlier this year, and Germany already works on the Eurofighter Typhoon with the UK and Italy; adding a partner would help share costs, though Japan may need convincing. On his first Berlin visit as prime minister, Burnham and Merz ratified the Kensington Treaty and launched a security partnership on hybrid threats. Burnham also said he was committed to deeper cooperation with the EU at a summit towards the end of the year.", "url": "https://www.scmp.com/news/world/europe/article/3370225/uk-signals-openness-germany-joining-gcap-fighter-jet-programme"}, {"id": "scmp-09oct-20", "title": "US AI firm Anthropic enables Chinese-language options for Claude chatbot", "source": "SCMP", "date": "09 Oct 2026", "tags": ["Technology & AI"], "summary": "Anthropic has added simplified and traditional Chinese interface options to its Claude chatbot in supported markets, SCMP checks confirmed on Oct 8, while still blocking users in mainland China, Hong Kong and Macau. China briefly appeared as a billing country option, and X users shared screenshots showing UnionPay at checkout, which the Post could not verify. Analysts said the move targets overseas Chinese communities rather than the mainland: Hello China Tech's Poe Zhao cited Singapore, Malaysia, Taiwan and North America, and Omdia's Su Lian Jye agreed. The change follows reported Hong Kong account suspensions for VPN use last week and Anthropic's accusation last month that DeepSeek and Moonshot AI conducted \"industrial-scale\" distillation of Claude.", "url": "https://www.scmp.com/tech/big-tech/article/3370154/us-ai-firm-anthropic-enables-chinese-language-options-claude-chatbot"}, {"id": "scmp-09oct-21", "title": "US wraps up military mission in Iraq, giving Baghdad room to strengthen China ties", "source": "SCMP", "date": "09 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "The US formally ended its Operation Inherent Resolve mission in Iraq on September 30, completing a withdrawal agreed in 2024 under Joe Biden, with an Iraqi-led effort replacing it and Washington continuing targeted training and intelligence support. Analysts said the move could give Baghdad more room to diversify partnerships and indirectly help China's energy and commercial interests, but Beijing lacks the ambition and capacity to fill a security role. Rihla Research's Jesse Marks said China will pursue energy deals but \"will not fill a US security role\", and the Soufan Centre's Kenneth Katzman said China does not envision one. Concerns remain over Iraqi forces' ability to contain Islamic State remnants and Iran-backed groups.", "url": "https://www.scmp.com/news/china/diplomacy/article/3370072/us-wraps-military-mission-iraq-giving-baghdad-room-strengthen-china-ties"}, {"id": "scmp-09oct-22", "title": "Washington’s transactional Taiwan policy puts Indo-Pacific at risk, ex-US officials warn", "source": "SCMP", "date": "09 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "Former US officials told a Global Taiwan Institute symposium in Washington on Oct 7 that US Taiwan policy has become less independent of China policy and that the Iran war is eroding readiness in the western Pacific. Former AIT chair Laura Rosenberger said a pre-notified US$14 billion arms sale had not moved forward, which Trump in May called a \"very good negotiating chip\" to help keep a trade truce. Former Carrier Strike Group 5 commander Mark Montgomery said no US destroyers or carriers are operating in the western Pacific because the USS Abraham Lincoln and USS George Washington were sent to the Middle East, risking a readiness gap of 18 months or more. Taiwan's envoy Alexander Yui had said US relations remained robust.", "url": "https://www.scmp.com/news/us/article/3370204/washingtons-transactional-taiwan-policy-puts-indo-pacific-risk-ex-us-officials-warn"}, {"id": "tass-09oct-01", "title": "AI-equipped drones capable of autonomously seeking, engaging targets — top brass", "source": "TASS", "date": "09 Oct 2026", "tags": ["Defence", "Technology & AI"], "summary": "Russian Deputy Defense Minister Yunus-Bek Yevkurov said in an interview with Politika magazine that AI-equipped drones can now autonomously seek and engage targets based on pre-loaded data and coordinates, TASS reports. Yevkurov said battlefield threats emerge suddenly, and that at the start of what he called the special military operation forces had to constantly adopt countermeasures. He said quadcopter-style drones were initially used for reconnaissance and dropping munitions, but FPV drones have proved far more dangerous. According to TASS, Yevkurov said Russian forces are now employing FPV drones quite successfully.", "url": "https://tass.com/defense/2199497"}, {"id": "tass-09oct-02", "title": "FACTBOX: What is known about approval of EU’s 22nd sanctions package against Russia", "source": "TASS", "date": "09 Oct 2026", "tags": ["Geopolitics"], "summary": "A TASS factbox says EU ambassadors agreed on Oct 7 on a 22nd sanctions package against Russia covering over 1,500 Russian companies and individuals linked to the defence sector, citing a European source; Reuters puts the figure at 1,570. TASS says the package adds no significant new trade or economic restrictions but would expand the blacklist, which now holds just over 3,000 entities and individuals, by nearly 50%, and is expected to be approved by the EU Council by the end of the week. Estonia asked for one Russian supplier of strategically important materials and an associated individual to be excluded, spokesperson Kerstin Lepik told broadcaster ERR. Lithuanian Prime Minister Mindaugas Sinkevicius proposed banning transit of Russian food grain through the EU.", "url": "https://tass.com/world/2199325"}, {"id": "tass-09oct-03", "title": "Germany’s Quantum Systems to supply Kiev with tens of thousands of interceptor drones", "source": "TASS", "date": "09 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "TASS, citing the Ukrinform news agency, reports that German defence company Quantum Systems intends to send tens of thousands of SPYS interceptor drones to Ukraine by the end of 2026. Vice President Matthias Lehna said at a briefing in Berlin that a letter of intent for the package was signed over the weekend. The SPYS drones were developed with Ukrainian defence company WIY. TASS adds that Russia has repeatedly said arms supplies to Ukraine only prolong the conflict.", "url": "https://tass.com/world/2199343"}, {"id": "tass-09oct-04", "title": "Houthis threaten new strikes on Saudi oil facilities", "source": "TASS", "date": "09 Oct 2026", "tags": ["Geopolitics", "Energy", "Defence"], "summary": "Yemen's Houthi movement (Ansar Allah) urged experts, engineers and workers at all Saudi oil facilities to stay away from sites it targets, warning of further attacks, military spokesman Yahya Saree said on his Telegram channel, TASS reports. Saree said the threat covers both previously attacked facilities and new targets. He also repeated a warning to international airlines, passengers and Saudi airport staff about the dangers of being in Saudi airspace.", "url": "https://tass.com/world/2199375"}, {"id": "tass-09oct-05", "title": "Inspections of Iranian nuclear facilities attacked by US impossible — atomic energy chief", "source": "TASS", "date": "09 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "Atomic Energy Organization of Iran head Mohammad Eslami said IAEA inspections of Iranian nuclear facilities attacked by US forces or under threat of strikes are ruled out, TASS reports, citing the Es-Siyasa news portal. Eslami said Iranian facilities cannot be inspected if safety conditions are not ensured. He added that cooperation with the IAEA is prohibited by law, saying the agency jeopardises the security of the country and its specialists.", "url": "https://tass.com/world/2199475"}, {"id": "tass-09oct-06", "title": "LNG exports from Middle East plummet 47% YOY in H1 2026, WTO says", "source": "TASS", "date": "09 Oct 2026", "tags": ["Energy", "Trade"], "summary": "TASS, citing the World Trade Organization's global trade prospects report, says Middle East LNG exports fell about 47% year on year in the first half of 2026, while global LNG shipments declined only around 1%. The WTO said the energy shock was softened and partly offset by higher output and deliveries from other exporters including Malaysia, Norway and Angola. Middle East crude oil exports fell about 24% in the period, while increased shipments from the United States, Norway and Brazil limited the global decline in crude exports to around 6%, according to the report.", "url": "https://tass.com/economy/2199357"}, {"id": "tass-09oct-07", "title": "London sanctions will not change Moscow’s course, Russian Embassy says", "source": "TASS", "date": "09 Oct 2026", "tags": ["Geopolitics"], "summary": "The Russian Embassy in the UK said in a comment to TASS that the latest British sanctions, targeting banks, individuals and merchant vessels, will not force Moscow to change its foreign policy course. The embassy said each new list shows London has reached a dead end with its sanctions policy and that the approach is ineffective. It said protecting national interests remains Russia's priority and that attempts to speak to Russia in the language of sanctions and threats are doomed to fail. The embassy also accused London of seeking to cut Global South countries off from Russian resources, calling this a neo-colonial attitude.", "url": "https://tass.com/politics/2199491"}, {"id": "tass-09oct-08", "title": "Oil transit through Strait of Hormuz has reached nearly 80% of February levels — Rubio", "source": "TASS", "date": "09 Oct 2026", "tags": ["Energy", "Geopolitics"], "summary": "US Secretary of State Marco Rubio told Greek newspaper Kathimerini that oil shipments via the southern route of the Strait of Hormuz, which the US cleared of mines, have reached nearly 80% of pre-conflict levels, TASS reports. Rubio said Iran is the only country unable to regularly ship oil from the Middle East because of the blockade. TASS recounts that the US and Israel launched military operations against Iran on Feb 28, a June memorandum provided for a ceasefire, and the US resumed large-scale strikes on the night of July 8. According to TASS, Washington has since shifted toward economic pressure on Iran through sanctions.", "url": "https://tass.com/economy/2199281"}, {"id": "tass-09oct-09", "title": "Putin says Iran making serious efforts to end Middle East conflict", "source": "TASS", "date": "09 Oct 2026", "tags": ["Geopolitics"], "summary": "Russian President Vladimir Putin told Iranian President Masoud Pezeshkian in Turkmenbashi, Turkmenistan, that Moscow sees Tehran making real attempts to end the Middle East conflict, TASS reports. Putin said the conflict did not break out through Iran's fault and that Iran had put forward new proposals for a peaceful resolution. He added that Russia is ready to do everything to help resolve the situation.", "url": "https://tass.com/politics/2199563"}, {"id": "tass-09oct-10", "title": "Russia favors comprehensive Ukraine settlement over piecemeal solution — Kremlin", "source": "TASS", "date": "09 Oct 2026", "tags": ["Geopolitics"], "summary": "Kremlin spokesman Dmitry Peskov said Moscow supports a comprehensive settlement of the Ukraine conflict rather than a piecemeal one, TASS reports. He was responding to questions about India's peace initiatives after the Hindustan Times reported on Oct 7 that India had proposed a three-point truce plan to Russia and Ukraine. According to that report, the plan aims to reduce strikes on energy infrastructure, maintain Black Sea trade and protect commercial shipping. Peskov said such proposals are all on the table, but Moscow wants a settlement lasting for decades.", "url": "https://tass.com/politics/2199583"}, {"id": "tass-09oct-11", "title": "Russia-Iran relations develop positively — Putin", "source": "TASS", "date": "09 Oct 2026", "tags": ["Geopolitics"], "summary": "Russian President Vladimir Putin told Iranian President Masoud Pezeshkian in Turkmenbashi, Turkmenistan, that Russian-Iranian relations are developing positively, TASS reports. Putin said ties rest on a fundamental agreement the two countries signed at the beginning of last year. He cited the humanitarian sphere, with many events under way, as a good example and said relations are strengthening overall.", "url": "https://tass.com/politics/2199573"}, {"id": "tass-09oct-12", "title": "Russian oil supplies to India hinder Delhi-Washington trade deal — report", "source": "TASS", "date": "09 Oct 2026", "tags": ["Trade", "Energy"
