shkek for 'Power of Siberia 2' pipeline talks. Security realigned too: a Turkey-Saudi-Pakistan defence pact holds its first meeting, South Korea's Lee reshuffled his cabinet with 'key AI roles', and experts warned a 'PLA shift to systems warfare means Taiwan's defences must change'."},{"title":"Energy & climate","body":"Venezuela moved to center stage: BT reported 'Trump says the US is taking partial control of Venezuela's vast oil reserves', WSJ went 'inside Trump's plan to give the Pentagon a stake', Chevron and US firms 'near a deal to invest billions', and Caracas said a '25-year deal could generate US$209 billion' - even as Venezuelans decried 'a new form of US colonialism'. Iran/Hormuz stayed pivotal: oil whipsawed on the US strike and deal rumours, strait traffic 'slipped below its 10-day average', and Panama Canal congestion 'drove gas tankers to unusual routes'. Xi and Putin will discuss the 'Power of Siberia 2' pipeline, while WSJ warned 'the strongest El Nino in a generation is wreaking havoc on the global economy'."},{"title":"Technology & AI","body":"Nvidia set the tone - WSJ said it 'insists it can keep printing money to fund the AI boom' and 'wants to run the world's robots, with China an eager customer' - even as 'China's AI catch-up is forcing Silicon Valley to cut prices'. The memory build-out accelerated: SK Hynix 'started work on a US$4 billion Indiana AI-memory hub, expecting a shortage through 2030' and weighs closer ties with Japan, while SoftBank 'seeks another US$10 billion loan for its OpenAI stake'. China's CXMT posted an '870% revenue surge', HKEX's Tech 100 'added Pony AI and WeRide', and MiniMax expanded its Alibaba cloud pact. Copyright risk grew as 'Sony Music and Warner accused Anthropic of blatant theft', and WSJ chronicled 'how Big Tech blinded itself to the grassroots AI revolt'."},{"title":"Singapore & SEA focus","body":"Singapore markets got a mixed read: ST said 'Nvidia's valuation sparked a tech rally but Singapore companies lost out', and BT noted Warsh's hawkish turn 'favours soaring banks over struggling S-Reits'. The bright spot was structural - OCBC said 'mega-projects on Singapore's road map could unlock a multi-decade investment story'. On corporates, Frasers Property shareholders 'approved a S$2.1 billion hospitality-portfolio revamp', and Glencore's US$480 million Radiant World provision kept a Singapore-linked saga in view. Regionally, Malaysia's PM Anwar 'unveiled measures to tackle living costs and support local businesses', BYD posted a US$1.2 billion quarterly profit, and JD.com's US$1.3 billion expansion could 'test Hong Kong's footfall-driven retail-property model'."}],"keyMetrics":[{"value":"90","label":"Articles curated today","sub":"WSJ 23 · ST 17 · BT 22 · SCMP 28"},{"value":"Hawkish","label":"Warsh at Jackson Hole","sub":"Favours banks over S-Reits"},{"value":"US strikes","label":"Iranian rocket launchers","sub":"First attack in weeks; oil swings"},{"value":"US$209b","label":"Venezuela oil takeover","sub":"Trump: partial US control"},{"value":"Rally, SG out","label":"Nvidia valuation surge","sub":"S'pore-listed names lose out"},{"value":"US$96.5b","label":"Japan's yen defence","sub":"Record monthly intervention"}],"articles":[{"id":"wsj-01","title":"A Core Egyptian Bank Gets Caught Up in Treasury's Iran Crackdown","source":"WSJ","date":"31 Aug 2026","tags":["Finance & Markets","Geopolitics"],"summary":"The U.S. Treasury targeted the United Arab Emirates branch of Banque Misr, one of Egypt's most important banks, in its tightening economic squeeze on Iran. Treasury said Friday the branch processed $1.8 billion for 103 companies over 2.5 years that could form part of Iran's shadow banking network, calling it a critical node. Iran, cut off from dollar dealings, relies on such counterparts. Analyst Rachel Ziemba said financial sanctions work through a private-sector \"chilling effect.\" Egypt's Foreign Ministry, communicating with Washington, said the measures don't affect banks inside Egypt and that its banks are \"solid and strong.\" State-owned Banque Misr, founded 1920 and nationalized 1960, is Egypt's second-largest bank, raising fears other institutions curb dealings.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/A%20Core%20Egyptian%20Bank%20Gets%20Caught%20Up%20in%20Treasury's%20Iran%20Crackdown.pdf"},{"id":"wsj-02","title":"Canadian Small Businesses to Bear Brunt of New U.S. Tariffs","source":"WSJ","date":"31 Aug 2026","tags":["Trade","Politics"],"summary":"Canadian honey producers, plus exporters of artwork, wool, cosmetics and flowers, are reeling from President Trump's new 50% tariffs on $20 billion of Canadian goods, about 5% of Canada's U.S.-bound exports. Canada's overall economy should withstand them, but small and medium businesses will bear the brunt, some fearing closure. A CFIB survey found 40% of exporters sold targeted products; nearly 80% expected revenue losses, and over one-third estimated losses of at least 50%. Alberta's Lorne Prins warned honey prices could enter \"a free fall\"; Canada shipped 56% of its 2025 honey exports to the U.S. Producers rushed shipments before the tariffs took effect. Trump has also imposed duties up to 50% on steel, aluminum, lumber and autos.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/Canadian%20Small%20Businesses%20to%20Bear%20Brunt%20of%20New%20U.S.%20Tariffs.pdf"},{"id":"wsj-03","title":"Chevron, Other U.S. Firms Near Deal to Invest Billions in Venezuelan Oil Fields","source":"WSJ","date":"31 Aug 2026","tags":["Energy","Geopolitics"],"summary":"Chevron and other U.S. energy companies are nearing deals to invest billions in Venezuela's oil fields, positioning President Trump for a win after slow negotiations. Chevron, the only major U.S. firm active there with three PdVSA joint ventures, is close to adding two heavy-oil fields. Halliburton is in talks to supply oil-field equipment. Executives are set to sign production deals in Caracas next week, with Energy Secretary Chris Wright expected to travel there. Many offered fields are \"greenfields\" lacking infrastructure, requiring billions to develop. Rivals ExxonMobil and ConocoPhillips will stay on the sidelines, still seeking restitution after Hugo Chavez nationalized their assets in 2007. Since ousting Nicolas Maduro in January, Trump has pushed firms to boost Western Hemisphere output.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/Chevron,%20Other%20U.S.%20Firms%20Near%20Deal%20to%20Invest%20Billions%20in%20Venezuelan%20Oil%20Fields.pdf"},{"id":"wsj-04","title":"Consumer Sentiment Was Weaker in August, per Michigan Survey","source":"WSJ","date":"31 Aug 2026","tags":["Finance & Markets"],"summary":"U.S. consumer sentiment worsened in August, confirming the preliminary reading, per the University of Michigan's final survey. The sentiment index fell to 51.7 from 55.2 in July, roughly matching economists' expectations of 51. That leaves sentiment above the mid-40s historic lows touched earlier this year, but down about 6% month-on-month and about 11% below a year ago amid worries inflation will stay elevated. Survey director Joanne Hsu said that with ongoing policy uncertainty including the Iran conflict, \"consumers anticipate further increases in gasoline prices.\" Sentiment declined across all political groups, particularly among Republicans. Long-run inflation expectations held steady at 3.3% for a third straight month, a measure Fed officials watch to prevent price pressures becoming self-fulfilling.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/Consumer%20Sentiment%20Was%20Weaker%20in%20August,%20per%20Michigan%20Survey.pdf"},{"id":"wsj-05","title":"Drain on U.S. Munitions From Iran War Raises Fears Over Ability to Deter China, Russia","source":"WSJ","date":"31 Aug 2026","tags":["Defence","Geopolitics"],"summary":"The U.S. has rushed so many munitions to the Middle East to fight Iran that military planners fear the loss of firepower is diminishing America's ability to deter China and Russia, officials said. European inventories of PAC-3 Patriot interceptors and Atacms missiles are deemed \"beyond critical.\" Refilling stocks moved from Japan, South Korea and Germany could take years. Thaad interceptors and Merops counterdrone systems were also sent from Europe. Shrinking supplies led U.S. European Command to adjust operational plans, and officials assess America couldn't fully execute contingency plans to defend Taiwan near-term. Each move required Defense Secretary Pete Hegseth's approval. The White House insisted the U.S. has enough munitions, citing \"Operation Epic Fury\" against Iran.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/Drain%20on%20U.S.%20Munitions%20From%20Iran%20War%20Raises%20Fears%20Over%20Ability%20to%20Deter%20China,%20Russia.pdf"},{"id":"wsj-06","title":"Federal Reserve Chairman Kevin Warsh Signaled the U.S. Central Bank May Not Be Done Fighting Inflation","source":"WSJ","date":"31 Aug 2026","tags":["Finance & Markets","Politics"],"summary":"Federal Reserve Chairman Kevin Warsh signaled the central bank may not be done fighting inflation with higher rates, in his most substantive remarks since taking over this spring. Investors read his Jackson Hole debut as hawkish, raising odds of a September rate increase to around 60% from 35%. Warsh said he saw little sign borrowing conditions were restraining the economy and that better summer inflation readings hadn't convinced him the trend was improving. He said \"we must be confident that underlying inflation is moving to our objective.\" At the current roughly 3.6% rate, he found it hard to call conditions restrictive. Three officials voted last month to raise rates; the bank remains split over tariff and Iran-war shocks.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/Federal%20Reserve%20Chairman%20Kevin%20Warsh%20signaled%20the%20U.S.%20central%20bank%20may%20not%20be%20done%20fighti.pdf"},{"id":"wsj-07","title":"How Big Tech Blinded Itself to the Grassroots AI Revolt","source":"WSJ","date":"31 Aug 2026","tags":["Technology & AI","Society"],"summary":"The Wall Street Journal argues Silicon Valley's playbook is failing AI, leaving tech leaders looking out of touch as controversies mount. Even if Anthropic and OpenAI IPOs meet Wall Street's lofty expectations, the companies face lasting political and regulatory headaches, potentially \"birthed as the bad guys.\" PR veteran Rachael Horwitz called the moment the next great comms case study of \"what not to do.\" OpenAI's Sam Altman conceded the field hasn't explained AI's benefits well. The column links the backlash to an inward-looking technorati spurning government, regulators and media, accelerated by Elon Musk's 2022 Twitter purchase and a \"go-direct\" movement among founders. Data-center growth is now stirring grassroots political anger nationwide.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/How%20Big%20Tech%20Blinded%20Itself%20to%20the%20Grassroots%20AI%20Revolt.pdf"},{"id":"wsj-08","title":"How Xi Jinping Turned Oil From a Weakness Into a Geopolitical Weapon","source":"WSJ","date":"31 Aug 2026","tags":["Energy","Geopolitics"],"summary":"Before the U.S. attacked Iran, Beijing spent years and tens of billions amassing the world's biggest oil stockpile, giving China major power over global oil markets and a new defense against the West. China's reserves last year were nearly 600 million barrels larger than America's, letting it slash imports when war broke out and keep prices in check. It's a vindication for Xi Jinping, long worried about reliance on crude transiting vulnerable straits. Chinese crude imports fell 23% from March to July versus a year earlier. Analysts say the leverage could be wielded in a future clash over Taiwan. A China National Petroleum think tank urged \"bottom-line and extreme-scenario thinking\" on energy security.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/How%20Xi%20Jinping%20Turned%20Oil%20From%20a%20Weakness%20Into%20a%20Geopolitical%20Weapon.pdf"},{"id":"wsj-09","title":"I Let Google's Personal Intelligence Access My Life-and It's a Huge Help","source":"WSJ","date":"31 Aug 2026","tags":["Technology & AI","Society"],"summary":"WSJ columnist Christopher Mims describes becoming a convert to Google's Personal Intelligence, which with permission accesses nearly all his activity across Google services. He woke to three AI alerts about sleep, a book cover and a family kayaking trip. A self-described privacy skeptic, he now relies on Daily Brief, a Gemini-generated daily agenda pulling from his calendar and Gmail inbox, calling it indispensable. A newer experimental app, Dreambeans, suggests activities paired with AI-generated sketches of him and his family. Daily Brief costs as little as $5 monthly via Google AI Plus; Dreambeans requires the $20 Google AI Pro plan. A separate Google Health Coach draws data from his Fitbit Air band using Gemini AI.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/I%20Let%20Google's%20Personal%20Intelligence%20Access%20My%20Life-and%20It's%20a%20Huge%20Help.pdf"},{"id":"wsj-10","title":"Inside Trump's Plan to Give the Pentagon a Stake in Venezuela's Oil Riches","source":"WSJ","date":"31 Aug 2026","tags":["Energy","Geopolitics"],"summary":"After U.S. energy firms resisted investing quickly in Venezuela, the Trump administration devised an extraordinary plan making the U.S. government itself an investor, announced Friday evening. Washington would gain a direct financial stake in a private company granted centurylong rights to some of the world's largest oil reserves, tying the U.S. to Venezuela's unelected government. The company, led by businessman Alejandro Betancourt, could develop 17 oil fields holding 65 billion barrels, one-fifth of reserves; the Pentagon would help finance it and share output. Trump and interim President Delcy Rodriguez agreed the outlines by phone. Rystad's Schreiner Parker said if the deal survives future governments, Trump will have \"secured strategic oil reserves for the U.S.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/Inside%20Trump's%20Plan%20to%20Give%20the%20Pentagon%20a%20Stake%20in%20Venezuela's%20Oil%20Riches.pdf"},{"id":"wsj-11","title":"Nvidia Insists It Can Keep Printing Money to Fund the AI Boom","source":"WSJ","date":"31 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Nvidia is defending its aggressive use of its balance sheet to fund the AI boom. When nearing a deal to help OpenAI secure a data-center project costing over $500 billion, CFO Colette Kress pushed for a scaled-back arrangement, and Nvidia agreed to backstop less than half the original amount. But the $5 trillion company shows no broader retreat. Its second-quarter earnings included guidance that revenue will grow much faster than analysts expected, driving a $442 billion gain Thursday. Kress cited financial guarantees, equity investments and credit support, including a $500 billion chip-financing initiative with six Wall Street firms and nearly $50 billion invested in frontier AI labs. She rejected \"circular financing\" criticism, saying \"we see it differently.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/Nvidia%20Insists%20It%20Can%20Keep%20Printing%20Money%20to%20Fund%20the%20AI%20Boom.pdf"},{"id":"wsj-12","title":"Nvidia Wants to Run the World's Robots. China Is an Eager Customer.","source":"WSJ","date":"31 Aug 2026","tags":["Technology & AI","Trade"],"summary":"Nvidia is betting big on \"physical AI\" - chips and software for robots, cars and drones - with China emerging as a major customer. The business already generates about $10 billion in annual revenue, a fraction of Nvidia's $303 billion over the four quarters ended in July, but CEO Jensen Huang predicts tenfold growth within a decade. Nvidia pairs specialized chips with developer software and open-weight models like GR00T and Cosmos to lock in customers. Huang's children Madison and Spencer help run the division; Madison toured robotics sites in Seoul and Beijing. Although the U.S. bars Nvidia from selling its most powerful AI chips to China, trade in robot and car chips remains open, fueling demand.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/Nvidia%20Wants%20to%20Run%20the%20World's%20Robots.%20China%20Is%20an%20Eager%20Customer..pdf"},{"id":"wsj-13","title":"Putin Turns Again to China's Xi as Russia's Clout Crumbles","source":"WSJ","date":"31 Aug 2026","tags":["Geopolitics","Energy"],"summary":"As Vladimir Putin prepares to meet Xi Jinping Monday in Kyrgyzstan, their wartime fortunes have sharply diverged. Russia endured a summer of Ukrainian strikes on its oil-and-gas industry, while China emerged from the Iran war with greater power over oil markets and resilience against the West. The meeting, on the sidelines of a Shanghai Cooperation Organization summit that includes Iran, will showcase shared resistance to U.S. power. China has provided Iran a financial lifeline; Iran supplied drones Russia used against Ukraine. Analysts say China's dominance is felt inside the Kremlin, with Putin forced into a junior-partner role as Russia's economy grows more reliant on Beijing. China has gained cheaper oil and a Western-competitor-free market.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/Putin%20Turns%20Again%20to%20China's%20Xi%20as%20Russia's%20Clout%20Crumbles.pdf"},{"id":"wsj-14","title":"Russia Is Bombarding Europe With a New Wave of 'Gray Zone' Attacks","source":"WSJ","date":"31 Aug 2026","tags":["Geopolitics","Defence"],"summary":"Russia has intensified \"gray zone\" activities against Europe - drone incursions, sabotage and cyberattacks - aimed at sowing fear as it struggles to advance in Ukraine and faces damaging Ukrainian drone and missile strikes. NATO leaders call the moves a worrying sign of Russia's rising appetite for risk as Putin seeks to curb European aid and divide allies. Western officials warn Russia could escalate and has captured Ukrainian drones usable for false-flag attacks; the Kremlin dismisses the reports. CIA Director John Ratcliffe made a surprise Moscow trip to affirm U.S. support for NATO allies. Incidents included explosive drones at a German airport. Tracked Russia-backed incidents rose to about 15 monthly since April, from roughly 10.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/Russia%20Is%20Bombarding%20Europe%20With%20a%20New%20Wave%20of%20'Gray%20Zone'%20Attacks.pdf"},{"id":"wsj-15","title":"Singapore Found a Way to Beat Gridlock, but Some Cars Cost as Much as Real Estate","source":"WSJ","date":"31 Aug 2026","tags":["Southeast Asia","Society"],"summary":"In Singapore, a firm 36-year cap on car ownership has kept the wealthy city-state largely free of Southeast Asian gridlock, but pushed car prices to real-estate levels. Buyers must win certificates of entitlement (COEs) auctioned by the government; dealers advertise prices including COE costs. A one-year-old BMW X5 was listed at $352,000 and a new Toyota Yaris Cross at $152,000. At this month's auction, small-car COEs sold for $101,000, up from about $23,000 in 2020. Certificates last 10 years and attach to the vehicle. Singapore has roughly 667,000 cars for 6.1 million people, versus 1.9 million in similarly populated Maryland. Higher supply this year is offset by EV incentives expiring in December that boost demand.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/Singapore%20Found%20a%20Way%20to%20Beat%20Gridlock,%20but%20Some%20Cars%20Cost%20as%20Much%20as%20Real%20Estate.pdf"},{"id":"wsj-16","title":"Social Security's Looming Insolvency Is the Country's Most Foreseeable Problem, Threatening Automatic Benefit Cuts in 2032. Congress Is Trying to Work Up the Nerve to Solve It.","source":"WSJ","date":"31 Aug 2026","tags":["Politics","Society"],"summary":"The Wall Street Journal calls Social Security's looming insolvency the country's most foreseeable problem, threatening automatic benefit cuts of 22% in 2032. Discussions accelerated this summer with actuarial warnings, hearings and scattered bipartisan efforts, and analysts eventually expect both parties to act to prevent cuts for tens of millions of seniors. But Congress rarely moves until jammed against a deadline, and delay has made the needed adjustment more severe, since earlier tax or spending changes are no longer large enough to close the gap. Senator Tim Kaine, backing two bipartisan bills, said \"we're not sleepwalking here,\" though their leading Republican sponsors are retiring. Senator Jim Justice insisted lawmakers will never \"hit the wall.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/Social%20Security's%20looming%20insolvency%20is%20the%20country's%20most%20foreseeable%20problem,%20threatenin.pdf"},{"id":"wsj-17","title":"SpaceX and Rivals Dodge Traffic as Satellites, Debris Crowd Low-Earth Orbit","source":"WSJ","date":"31 Aug 2026","tags":["Technology & AI","Environment"],"summary":"Nearly 70 years after Sputnik, low-Earth orbit - roughly 100 to 1,200 miles up - holds more man-made material than ever, raising fears of collisions that could destroy spacecraft. A worst case is debris triggering a chain reaction of crashes rendering parts of orbit unusable. Elon Musk's SpaceX has driven the crowding, building the largest satellite fleet in history for Starlink, and is now maneuvering more often per FCC filings. China's LandSpace recently reused a rocket booster. Between now and 2034, at least 41,000 more satellites are expected, two-thirds from SpaceX, Amazon and Chinese firms, per analyst Dallas Kasaboski. Proposed orbital data centers laden with AI chips could push totals toward 1.5 million satellites.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/SpaceX%20and%20Rivals%20Dodge%20Traffic%20as%20Satellites,%20Debris%20Crowd%20Low-Earth%20Orbit.pdf"},{"id":"wsj-18","title":"The Strongest El Nino in a Generation Is Wreaking Havoc on Global Economy","source":"WSJ","date":"31 Aug 2026","tags":["Environment","Finance & Markets"],"summary":"The strongest El Nino in a generation is rippling through the global economy. French firm Innovafeed, which breeds black soldier flies for fish feed, has benefited as fish-meal prices hit records after Peru, the top producer of anchovies used to make it, suspended this year's catch early over El Nino fears; the firm secured more demand in two months than the prior two years. The phenomenon, which spikes Pacific heat and spreads drought and floods, is showing up in Panama Canal costs and Chilean copper output, and may affect Asia's rice crop and Colorado ski powder. Scientists declared its onset in June with record ocean temperatures. Climate scientist Christopher Callahan warns events can cause trillions in lost income.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/The%20Strongest%20El%20Nino%20in%20a%20Generation%20Is%20Wreaking%20Havoc%20on%20Global%20Economy.pdf"},{"id":"wsj-19","title":"The U.S.-Canada Trade War. The War in Iran. Surging Bond Yields. The Global Economy, to Some Surprise, Has Taken It All in Its Stride.","source":"WSJ","date":"31 Aug 2026","tags":["Finance & Markets","Trade"],"summary":"Despite a U.S.-Canada trade war, an escalating Iran conflict and surging bond yields, the global economy has taken it all in stride, WSJ reports from Tokyo. Oil remains steady below $90 a barrel, stock markets trade near highs, advanced economies saw a summer growth spurt, and global trade is buoyant. Behind the resilience is the AI boom fueling U.S. investment and Asian exports, even with the Strait of Hormuz shut. IMF chief Kristalina Georgieva described \"a tug of war\" between the Middle East supply shock and AI's demand boost, calling AI a growth engine. Economists question whether it will last; Moody's Stefan Angrick warned \"maybe we are just living on borrowed time.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/The%20U.S.-Canada%20trade%20war.%20The%20war%20in%20Iran.%20Surging%20bond%20yields.%20The%20global%20economy,%20to%20so.pdf"},{"id":"wsj-20","title":"The Pace of Job Growth Was Probably Slightly Weaker Than Reported From Early 2025 Through Early This Year, the Labor Department Said Friday","source":"WSJ","date":"31 Aug 2026","tags":["Finance & Markets"],"summary":"U.S. job growth was probably slightly weaker than reported from early 2025 through early this year, the Labor Department's Bureau of Labor Statistics said Friday. The economy likely added 79,000 fewer jobs than reported over the 12 months ended in March. The private sector likely had 178,000 fewer jobs, with declines concentrated in retail and wholesale trade, plus healthcare, private education and professional and business services. Transportation, warehousing and information sectors had more jobs. Governments added 99,000. The figures suggest the average pace of seasonally adjusted gains was below the roughly 23,000 monthly official count - a low level consistent with employers hesitant to hire or fire amid an aging population and restricted immigration. The BLS revises using state tax records.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/The%20pace%20of%20job%20growth%20was%20probably%20slightly%20weaker%20than%20reported%20from%20early%202025%20through.pdf"},{"id":"wsj-21","title":"Trump's New Iran Sanctions Put China on Notice","source":"WSJ","date":"31 Aug 2026","tags":["Geopolitics","Finance & Markets"],"summary":"This WSJ opinion piece argues Trump's new Iran sanctions put China on notice by targeting foreign banks that help Tehran evade sanctions. Days after Treasury Secretary Scott Bessent announced an \"economic D-Day\" campaign, the department said Aug. 28 it will cut five UAE branches of Egypt's state-owned Banque Misr off from the U.S. financial system, effective after a 30-day comment period. Per FinCEN, the branches processed about $1.8 billion for 103 suspected Iranian shadow-banking fronts since 2024, including entities tied to Iran's Defense Ministry and Revolutionary Guard. The author urges Treasury to target Hong Kong banks and add China's Bank of Kunlun to the Specially Designated Nationals List, calling the pressure rarely seen across administrations.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/Trump's%20New%20Iran%20Sanctions%20Put%20China%20on%20Notice.pdf"},{"id":"wsj-22","title":"Week Ahead for FX, Bonds: U.S. Jobs Data in Focus; Bank of Canada Decision Due","source":"WSJ","date":"31 Aug 2026","tags":["Finance & Markets"],"summary":"A markets preview lists key global events for the week beginning August 31 affecting FX and bonds. Focus turns to U.S. August nonfarm payrolls, due Friday, as investors gauge labor-market health and the timing of a possible Federal Reserve rate increase as early as September. An interest-rate decision is due from the Bank of Canada, and eurozone inflation data is in focus in Europe. Asia brings manufacturing and services surveys from China, Bank of Japan commentary, Australian growth data, and policy decisions in Malaysia and New Zealand. Fed Chairman Kevin Warsh stressed inflation concerns at Jackson Hole. Money markets assigned a 57% probability of a 25-basis-point September hike and fully priced one for December.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/Week%20Ahead%20for%20FX,%20Bonds%20U.S.%20Jobs%20Data%20in%20Focus%20Bank%20of%20Canada%20Decision%20Due.pdf"},{"id":"wsj-23","title":"Why the World Needs to Force China's Yuan to Revalue","source":"WSJ","date":"31 Aug 2026","tags":["Finance & Markets","Trade"],"summary":"WSJ's Greg Ip argues the world needs a new Plaza Accord, this time to push up China's undervalued yuan rather than bring down an overvalued dollar. China's massive, growing trade surplus threatens to hollow out trading partners' industrial bases, and years of pleas for it to rely more on domestic demand have failed. A currency accord enforced with tariffs may be the only lever, and frustration is boiling over, especially in Europe; German Chancellor Friedrich Merz called for one in June. Goldman Sachs projects China's surplus will hit $1.2 trillion this year, nearing 1% of global GDP. It estimates the yuan is undervalued by 19%, while Brad Setser puts it at 35%. G20 officials meet in Asheville, N.C.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/Why%20the%20World%20Needs%20to%20Force%20China's%20Yuan%20to%20Revalue.pdf"},{"id":"st-01","title":"'A new form of US colonialism': Venezuelans bristle at oil takeover","source":"ST","date":"31 Aug 2026","tags":["Geopolitics","Energy"],"summary":"After US forces captured autocrat Nicolas Maduro in January, President Donald Trump announced on Aug 28 that the US would take majority control of a vast part of Venezuela's oil reserves, long viewed as a national birthright. Successor Delcy Rodriguez's Socialist Party backed the deal despite decades of resource-nationalism rhetoric, an about-face many Venezuelans found ironic. Retired educator Jose Leal called the promised US$100 billion (S$127.5 billion) investment small against the 65 billion barrels surrendered, but accepted it as a \"necessary evil\" to escape socialism. Critics including exiled ex-PDVSA head Rafael Ramirez decried \"a new form of US colonialism\", while former manager Dario Nava said sovereignty was lost. The accord guarantees no democratic transition or election date, potentially entrenching Rodriguez in power.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20ST/'A%20new%20form%20of%20US%20colonialism'%20Venezuelans%20bristle%20at%20oil%20takeover.pdf"},{"id":"st-02","title":"Germany's Merz says victory for AfD in Saxony-Anhalt would deter foreign investors","source":"ST","date":"31 Aug 2026","tags":["Politics","Finance & Markets"],"summary":"German Chancellor Friedrich Merz warned on Aug 30 that a victory for the far-right AfD in the Sept 6 regional election in Saxony-Anhalt would damage the eastern state and deter foreign investment. \"I cannot imagine international investors attending a ground-breaking ceremony with an AfD Minister-President,\" he told ARD television. The anti-immigrant Alternative for Germany leads polls at 42 per cent versus 22 per cent for Merz's Christian Democrats, leaving it just shy of an absolute majority if support holds. The outcome may hinge on whether smaller parties clear the 5 per cent threshold. All main parties rule out coalition with the AfD, so sitting CDU premier Sven Schulze may seek his own coalition or a minority government. Merz declined to specify plans if the AfD falls short.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20ST/Germany's%20Merz%20says%20victory%20for%20AfD%20in%20Saxony-Anhalt%20would%20deter%20foreign%20investors.pdf"},{"id":"st-03","title":"Iceland rejects EU-accession talks in close-fought referendum","source":"ST","date":"31 Aug 2026","tags":["Politics","Geopolitics"],"summary":"Icelanders voted to stay out of the European Union in an Aug 29 referendum, results showed on Aug 30, rejecting a government push to reopen membership talks. Some 52.8 per cent voted against negotiations versus 47.2 per cent in favour, with 82.5 per cent turnout; only central Reykjavik backed talks. An EU diplomat called it \"a clear setback for Brussels\", citing fishing and independence as decisive. Fishing makes up 15 per cent of GDP and 40 per cent of export revenue, and voters feared losing control of waters. PM Kristrun Frostadottir had framed membership as a shield against trade wars and Arctic rivalry, calling it \"now or never\". Iceland, a NATO member with no army, first applied in 2009 during a financial crisis; a Eurosceptic government ended talks in 2013.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20ST/Iceland%20rejects%20EU-accession%20talks%20in%20close-fought%20referendum.pdf"},{"id":"st-04","title":"Iran's Khamenei urges Gulf rulers in written message to confront 'real enemy'","source":"ST","date":"31 Aug 2026","tags":["Geopolitics","Politics"],"summary":"Iran's Supreme Leader Mojtaba Khamenei urged Muslim countries, especially Gulf states, to unite against their \"real enemy\", warning that divisions among Muslims serve their adversaries. The message, published on his Telegram account for Islamic Unity Week marking the Prophet Muhammad's birthday, called for cooperation and mutual defence and asked whether Palestinians would have been left \"so helpless\" had Muslims been united. Khamenei has not appeared publicly since being injured in US-Israeli air strikes six months ago that launched the Iran war and killed his father, previous supreme leader Ayatollah Ali Khamenei. He asked Gulf rulers whether \"rogues without identity\" would covet their lands if united under Islam. Since 1979, Gulf monarchies have viewed Iran's revolutionary ideology as a threat; Tehran has struck Gulf infrastructure during the conflict.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20ST/Iran's%20Khamenei%20urges%20Gulf%20rulers%20in%20written%20message%20to%20confront%20'real%20enemy'.pdf"},{"id":"st-05","title":"Mega projects in Singapore's road map could unlock multi-decade investment story: OCBC","source":"ST","date":"31 Aug 2026","tags":["Southeast Asia","Finance & Markets"],"summary":"Singapore's push on infrastructure, tourism and AI could open a multi-decade investment story, OCBC Bank's wealth advisory chief Afdhal Rahman said. PM Lawrence Wong's Aug 23 National Day Rally road map proposed mega projects benefiting infrastructure, utilities, construction, banks and tourism over 50 years. A flagged proposal merges Pulau Semakau, Bukom and Sudong into a larger western island for industrial and power use, still at feasibility stage. Plans to link Sentosa and Pulau Brani, a Downtown South resort, plus AI grants, autonomous-vehicle roll-out and Tourism 2040 ambitions add avenues. OCBC sees Singapore equities staying defensive amid a stronger Singapore dollar; the Straits Times Index, led by DBS, OCBC and UOB, has risen over 20 per cent in 2026 to near 5,700.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20ST/Mega%20projects%20in%20Singapore's%20road%20map%20could%20unlock%20multi-decade%20investment%20story%20OCBC.pdf"},{"id":"st-06","title":"NATO sees no imminent threat of attack, official says","source":"ST","date":"31 Aug 2026","tags":["Defence","Geopolitics"],"summary":"A NATO official said on Aug 30 that Russia is stepping up hybrid acts in Europe but that the alliance sees no imminent threat of attack. Even as Russia faces substantial Ukrainian resistance, it is intensifying attacks on Ukraine and hybrid activity in Europe, the official said, adding NATO remains vigilant and continues to stand with Ukraine. Polish PM Donald Tusk said on Aug 29 that Poland and NATO must prepare for various scenarios and that a Russian provocation against a member cannot be ruled out. CIA director John Ratcliffe flew to Russia on Aug 25 and reportedly raised the possibility of a Russian operation against a NATO member. Germany's Merz said Berlin would soon name those responsible for an attempted drone attack on Leipzig/Halle airport. Russia denies involvement.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20ST/NATO%20sees%20no%20imminent%20threat%20of%20attack,%20official%20says.pdf"},{"id":"st-07","title":"North Korea defence minister dismissed: State media","source":"ST","date":"31 Aug 2026","tags":["Defence","Geopolitics"],"summary":"North Korea dismissed its defence minister as part of a military leadership reshuffle, state media reported on Aug 30. The \"structural reorganisation plans\" were decided at an Aug 29 meeting led by Kim Jong Un, KCNA said. No Kwang Chol was removed and demoted to first vice-director of the Munitions Industry Department, with Kim Song Gi, director of the Korean People's Army General Political Bureau, named the new defence minister. Defence advisor Pak Jong Chon was made vice-chairman of the Central Military Commission. Kim also honoured scientists for advances in \"new combat weapon systems\". The shuffle follows shortened US-South Korea joint drills, which Trump criticised as provocative while bashing Seoul for not backing his Iran war. Despite Trump's overtures, Pyongyang has fired missiles and condemned the exercises.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20ST/North%20Korea%20defence%20minister%20dismissed%20State%20media.pdf"},{"id":"st-08","title":"Nvidia's valuation sparks tech rally but S'pore companies lose out: Markets this week","source":"ST","date":"31 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Nvidia eased AI-bubble fears this week as its market value ballooned US$442 billion (S$564 billion), with shares surging 8.7 per cent on Aug 27, its biggest one-day gain since April 2025. Q2 revenue rose 106 per cent to US$96.2 billion, data centre revenue up 117 per cent, with Q3 guidance of US$108 billion. The rally lifted Broadcom, Intel and SK Hynix, but a softer gross-margin outlook citing memory costs hit Singapore-listed chip names: AEM fell 5.4 per cent, UMS 3.6 per cent, and Frencken 8.3 per cent after a $100 million placement. Fed chair Kevin Warsh signalled a possible Sept 16 rate hike over persistent inflation. SingPost lifted Q1 operating profit 55.2 per cent; OUE unit proposed privatising OUE Healthcare. Shein launches its Hong Kong IPO on Sept 1.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20ST/Nvidia's%20valuation%20sparks%20tech%20rally%20but%20S'pore%20companies%20lose%20out%20Markets%20this%20week.pdf"},{"id":"st-09","title":"Republicans see Trump's unceasing Iran war as midterm threat","source":"ST","date":"31 Aug 2026","tags":["Politics","Geopolitics"],"summary":"Six months into an Iran war Trump predicted would last \"four to five weeks\", Republican strategists fear it will hurt the party in November's midterms. The conflict has spiked gas prices, stoked inflation and demoralised GOP voters, dragging Trump's approval to 33 per cent, the lowest of his second term. Some forecasters say Republicans risk losing both houses of Congress, exposing the administration to Democratic investigations. The Cook Report shifted Texas and Iowa Senate races to \"Toss Up\". An Ipsos-Reuters poll found 63 per cent disapprove of Trump's war handling; a Tavern Research survey found 71 per cent believe the war hurt the US domestically. Trump posted \"Mission Accomplished 2026\" and called poll declines \"fake\". GOP opposition is largely limited to figures like Tucker Carlson.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20ST/Republicans%20see%20Trump's%20unceasing%20Iran%20war%20as%20midterm%20threat.pdf"},{"id":"st-10","title":"South Korea's Lee replaces 6 ministers, fills key AI roles in year-two Cabinet reset","source":"ST","date":"31 Aug 2026","tags":["Politics","Technology & AI"],"summary":"South Korean President Lee Jae Myung reshuffled his Cabinet on Aug 30, replacing six ministers to reset his administration for a second year and filling long-vacant AI posts. He nominated retired four-star general Kang Shin-chul, ambassador to Saudi Arabia, as defence minister, and lawmaker and former judge Kim Seung-won as justice minister ahead of an Oct 2 overhaul stripping prosecutors of investigative powers. First Vice-Finance Minister Lee Hyoung-il was named economic deputy PM amid high rates, inflation and a weak won. Yong Hye-in, 36, would become the youngest gender-equality minister. Former Google manager Lee Hai-min was named senior secretary for AI and future planning, Ha Jung-woo vice-chair of the national AI strategy council, and Lee Won-ju the first presidential adviser for megaprojects spanning semiconductors, physical AI and data centres.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20ST/South%20Korea's%20Lee%20replaces%206%20ministers,%20fills%20key%20AI%20roles%20in%20year-two%20Cabinet%20reset.pdf"},{"id":"st-11","title":"Tests loom for popular British PM Andy Burnham as Parliament returns","source":"ST","date":"31 Aug 2026","tags":["Politics"],"summary":"British PM Andy Burnham has enjoyed a honeymoon first month, but hard governing trade-offs loom as Parliament returns. Since succeeding Keir Starmer on July 20, he has pleased voters by cutting electricity bills and bus fares while cultivating a man-of-the-people image, sparking a Labour poll bounce; a YouGov survey found 46 per cent view him favourably, up 12 points. MPs return Sept 1, when he will detail a watered-down prisoner-release plan, face his first Prime Minister's Questions on Sept 2, and confront an Oct 28 budget constrained by pledges not to raise income tax, payroll contributions or VAT. Divisive issues include North Sea drilling at Jackdaw and Rosebank, welfare and social care reform, an EU \"reset\", and a tricky likely first meeting with Trump, whose policies he once called \"poisonous\".","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20ST/Tests%20loom%20for%20popular%20British%20PM%20Andy%20Burnham%20as%20Parliament%20returns.pdf"},{"id":"st-12","title":"The political power struggles behind Taiwan's referendum on nuclear power","source":"ST","date":"31 Aug 2026","tags":["Politics","Energy"],"summary":"Taiwan will hold a nuclear-energy referendum alongside Nov 28 \"nine-in-one\" local elections, its fourth nuclear vote in eight years, prompting scrutiny of direct polls as partisan tools. The question asks whether to abolish the \"Nuclear-Free Homeland\" policy to ensure stable, affordable electricity, bolster defence resilience and support AI industries. The Central Election Commission approved only this proposal, rejecting caning and traffic-fine measures. Experts say opposition KMT and Taiwan People's Party hope crime and nuclear issues mobilise conservative voters, boosting turnout in close local races, as in 2018. NUS scholars Qi Dongtao and Chong Ja Ian note electoral motives may outweigh policy substance. A 2017 threshold change lowered the bar for passage, spurring frequent referendums; legal expert Lin Jia-he warns voters lack time to deliberate.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20ST/The%20political%20power%20struggles%20behind%20Taiwan's%20referendum%20on%20nuclear%20power.pdf"},{"id":"st-13","title":"Turkey, Saudi Arabia, Pakistan to hold first defence pact meeting, source says","source":"ST","date":"31 Aug 2026","tags":["Defence","Geopolitics"],"summary":"Top officials from Turkey, Saudi Arabia and Pakistan will meet in Istanbul on Aug 31 for the first committee session under the Mecca Joint Defence Agreement, a Turkish foreign ministry source said. Signed on Aug 7, the accord unites Sunni Muslim US allies alarmed by the Iran war and Iranian missile fire on Gulf oil exporters, and stipulates that an armed attack on one is an attack on all, echoing NATO's Article 5. Foreign and defence ministers and chiefs of staff will attend, discussing defence capabilities, interoperability and joint industry cooperation. The three share concerns over Israel and Shi'ite Iran as Washington steps up financial pressure on Iran in an \"economic D-Day\". Turkey said the pact, open to expansion including Egypt, does not replace existing alliances.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20ST/Turkey,%20Saudi%20Arabia,%20Pakistan%20to%20hold%20first%20defence%20pact%20meeting,%20source%20says.pdf"},{"id":"st-14","title":"US Treasury's Bessent faces G20 diplomacy test amid tariffs, Iran war, bond turmoil","source":"ST","date":"31 Aug 2026","tags":["Trade","Finance & Markets"],"summary":"US Treasury Secretary Scott Bessent faces a diplomacy test at a G20 finance meeting in Asheville, North Carolina, on Monday and Tuesday, pressing peers to shrink trade imbalances, boost growth and cut ties to Iran while calming worries over US debt and bond yields. He wants Iran sanctions front and centre, but many members prefer discussing tariffs; the US is rebuilding levies after the Supreme Court struck down Trump's global tariffs in February. The Iran war has kept the Strait of Hormuz closed, sapping G20 growth. Europe wants to address a flood of Chinese exports, up 23.9 per cent in July, while China resists rebalancing. US public debt crossed US$40 trillion on Aug 19; 30-year yields hit 19-year highs before Bessent doubled Treasury buybacks to US$4 billion per operation.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20ST/US%20Treasury's%20Bessent%20faces%20G20%20diplomacy%20test%20amid%20tariffs,%20Iran%20war,%20bond%20turmoil.pdf"},{"id":"st-15","title":"Ukraine defence chief to outline war plan as Kyiv seeks more funds","source":"ST","date":"31 Aug 2026","tags":["Defence","Geopolitics"],"summary":"Ukraine's new defence minister Yevhenii Khmara said he would present partners a \"clear vision\" of how Kyiv plans to fight Russia, as the government seeks to bring forward part of an EU loan to cover a US$27 billion (S$34 billion) military budget deficit. Ukraine relies heavily on foreign funds in the war's fifth year, with the EU committing 90 billion euros through 2027, earmarking 45 billion euros each for 2026 and 2027. Khmara, a former special-forces commander who led deep-strike operations, said he shares a \"common vision\" with new top general Mykhailo Drapatyi. Kyiv is stepping up long-range drone strikes on Russian oil and defence infrastructure but faces manpower and air-defence shortages. Ukraine has tested four interceptors against jet-powered drones that have plagued Kyiv for four consecutive days, killing residents.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20ST/Ukraine%20defence%20chief%20to%20outline%20war%20plan%20as%20Kyiv%20seeks%20more%20funds.pdf"},{"id":"st-16","title":"Ukraine's occupied nuclear plant running on generators, with only 10 days' worth of diesel","source":"ST","date":"31 Aug 2026","tags":["Energy","Geopolitics"],"summary":"The Russian-occupied Zaporizhzhia nuclear power plant in Ukraine has been without off-site power for over a week and is relying on emergency diesel generators, the IAEA said on Aug 29. The plant, which needs power to cool its six non-operating reactors, has only a 10-day diesel supply on site and had not received a delivery to off-site storage in about six months, though it was resupplied on Aug 26 and 27. Director-general Rafael Grossi stressed reliable external power is indispensable for nuclear safety. Power was lost following military activity on the northern side of the Dnipro River; the agency is seeking a local ceasefire for repairs. Three drone incidents this week injured two employees. The plant was seized in March 2022 and its reactors shut since.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20ST/Ukraine's%20occupied%20nuclear%20plant%20running%20on%20generators,%20with%20only%2010%20days'%20worth%20of%20diesel.pdf"},{"id":"st-17","title":"White House exodus poses new challenge for Trump at pivotal time","source":"ST","date":"31 Aug 2026","tags":["Politics"],"summary":"President Donald Trump enters a critical stretch of his second term amid a wave of senior staff resignations, forcing reliance on a shrinking circle of aides. Over the past month he lost press secretary Karoline Leavitt, White House counsel David Warrington, deputy national security adviser Andy Baker and legislative affairs director James Braid, with more officials weighing exits. The exodus comes as Republicans risk losing their congressional majorities in November, which could unleash investigations, while Trump faces low approval, a shaky economy, an unpopular Iran war and a trade war with Canada. Will Scharf was tapped as White House counsel to prepare for probes. Veteran advisers Jason Miller and Johnny DeStefano returned for midterm messaging. Analysts say hiring is hard this late; affordability remains the top voter concern.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20ST/White%20House%20exodus%20poses%20new%20challenge%20for%20Trump%20at%20pivotal%20time.pdf"},{"id":"bt-01","title":"'Too much of a hassle': Tougher rules drive retail investors from South Korean leveraged chip ETFs","source":"BT","date":"31 Aug 2026","tags":["Finance & Markets","Technology & AI"],"summary":"South Korea's regulatory tightening is cooling retail fervour for risky leveraged ETFs tracking twice the daily returns of Samsung Electronics and SK Hynix. A rule effective Aug 19 forcing five-day simulated trading on a Windows-only PC program has proved too cumbersome, with interviewed investors abandoning the process. Trading value has collapsed to 4 per cent of its June peak, heading for the products' first monthly outflow. The single-stock ETFs, launched in May, saw combined August outflows near US$1 billion; assets under management shrank to US$5 billion from US$11.4 billion at their late-June peak. The Kospi's volatility gauge fell to a four-month low around 50 from 97. The benchmark is up 61 per cent in 2026 but 25 per cent below its June record.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20BT/'Too%20much%20of%20a%20hassle'%20Tougher%20rules%20drive%20retail%20investors%20from%20South%20Korean%20leveraged%20ch.pdf"},{"id":"bt-02","title":"Australian dollar's top forecasters say winning run likely over","source":"BT","date":"31 Aug 2026","tags":["Finance & Markets"],"summary":"Top-ranked forecasters warn the Australian dollar's two-month rally is near a peak, arguing bets on another RBA rate hike have gone too far. SB1 Markets sees the Aussie falling up to 3.7 per cent by year-end; Santander and Danske Bank both project 70 US cents by year-end or December. The currency closed Friday at 71.64 US cents after gaining over 3.5 per cent since July on sticky inflation. Santander's Stuart Bennett expects the RBA to stand pat, prompting a paring of hike expectations. SB1's Dane Cekov notes any easing of the Middle-East conflict would lower oil and weigh on commodity currencies. The Aussie also benefited from US dollar weakness, though Fed chair Kevin Warsh's hawkish Jackson Hole tone may erode that support. Seasonality favours a September pullback.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20BT/Australian%20dollar's%20top%20forecasters%20say%20winning%20run%20likely%20over.pdf"},{"id":"bt-03","title":"China's AI catch-up is forcing Silicon Valley to cut prices","source":"BT","date":"31 Aug 2026","tags":["Technology & AI","Geopolitics"],"summary":"Chinese AI models are narrowing the gap with US frontier systems, pressuring Silicon Valley on price. Zhipu AI's GLM-5.2, Moonshot's Kimi K3 and Alibaba's Qwen3.8-Max approach Claude and ChatGPT on many tasks at lower cost; GLM-5.2 runs US$4.40 per million output tokens versus US$10 for Claude Sonnet 5. OpenRouter data shows eight of the top-10 models by token volume are Chinese, though US models still capture more spending. Amid intensifying China-US tech rivalry, both governments weigh restrictions: Washington may probe open-weight models for IP theft, while Beijing debates curbing overseas access. OpenAI and Anthropic have cut or frozen prices in response. Analysts say frontier models will become protected strategic assets while cheaper open models keep diffusing across borders.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20BT/China's%20AI%20catch-up%20is%20forcing%20Silicon%20Valley%20to%20cut%20prices.pdf"},{"id":"bt-04","title":"China's largest five banks report strongest first-half profit since height of property crash","source":"BT","date":"31 Aug 2026","tags":["Finance & Markets"],"summary":"China's five biggest banks posted first-half net profit growth of 3 to 5 per cent, their strongest showing in years as non-performing loan ratios held steady or fell. ICBC, the world's largest lender by assets, reported a 3.3 per cent rise, while Bank of China led at 5.1 per cent; Agricultural Bank, China Construction Bank and Bank of Communications logged 4.9, 4.6 and 4 per cent respectively. The wider commercial sector's net interest margin rose one basis point to 1.41 per cent in the second quarter, the first quarterly gain since 2022. The recovery is uneven, with smaller banks still exposed. Analysts at Fitch and Moody's expect little near-term margin improvement given low rates, weak consumer demand and around 4 per cent economic growth.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20BT/China's%20largest%20five%20banks%20report%20strongest%20first-half%20profit%20since%20height%20of%20property%20cra.pdf"},{"id":"bt-05","title":"Fed chair Warsh's hawkish Jackson Hole turn favours soaring banks over struggling S-Reits","source":"BT","date":"31 Aug 2026","tags":["Finance & Markets"],"summary":"Markets read Fed chair Kevin Warsh's Jackson Hole speech as a curtain-raiser for a September rate hike, with Warsh stressing the Fed's focus on prices amid 3.7 per cent inflation and 4.1 per cent unemployment. He reiterated plans to end forward guidance. Two-year Treasury yields surged 13 basis points to 4.36 per cent, while 10-year and 30-year yields edged up to 4.73 and 5.21 per cent; US debt topped US$40 trillion on Aug 19. For Singapore, higher rates have hammered S-Reits: the iEdge S-Reit Index returned minus 3.9 per cent this year, while the STI gained nearly 27 per cent on bank strength. OCBC returned 63.8 per cent, DBS 40.4 per cent, UOB 21.2 per cent. The bank-Reit divergence may persist.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20BT/Fed%20chair%20Warsh's%20hawkish%20Jackson%20Hole%20turn%20favours%20soaring%20banks%20over%20struggling%20S-Reits.pdf"},{"id":"bt-06","title":"Fight over EssilorLuxottica founder's US$47 billion fortune deepens as heir quits roles at Ray-Ban maker","source":"BT","date":"31 Aug 2026","tags":["Finance & Markets"],"summary":"The four-year feud over the late Leonardo Del Vecchio's more than 40 billion euro (US$46.6 billion) fortune deepened as heir Leonardo Maria Del Vecchio stepped down from roles at EssilorLuxottica to focus on his LMDV Capital family office. He had failed to break the deadlock at Delfin Sarl, the eyewear group's biggest shareholder, where eight heirs each hold 12.5 per cent and near-unanimity is required for major decisions. Delfin also holds stakes in Monte dei Paschi, Generali and UniCredit, making the crisis systemic for Italy's finance sector. EssilorLuxottica shares are down about 40 per cent year-to-date amid competition in AI smart glasses from Apple, Google and Samsung. The company unveiled a buyback of up to five million shares worth over 800 million euros.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20BT/Fight%20over%20EssilorLuxottica%20founder's%20US47%20billion%20fortune%20deepens%20as%20heir%20quits%20roles%20at.pdf"},{"id":"bt-07","title":"Frasers Property shareholders approve S$2.1 billion hospitality portfolio revamp","source":"BT","date":"31 Aug 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"Frasers Property shareholders approved a portfolio optimisation of hospitality assets under Frasers Hospitality Trust, which was taken private in 2025, at a Friday EGM. Some 99.07 per cent of votes cast backed the resolution. The transaction, expected to complete by end-FY2026, splits FHT properties into four categories: S$1.1 billion of mature stabilised assets divested to TCCGI; S$0.4 billion of value-enhancement assets held 49.95 per cent by Frasers; S$0.3 billion of non-core assets retained; and a S$0.3 billion redevelopment asset supporting the Valley Point site. Controlling shareholders TCC Assets (86.9 per cent) and TCCGI abstained. On a pro forma FY2025 basis, the group expects EPS up 3.4 per cent, NAV per share up 1.3 per cent, and net gearing down 3.3 percentage points. Shares closed at S$1.01.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20BT/Frasers%20Property%20shareholders%20approve%20S2.1%20billion%20hospitality%20portfolio%20revamp.pdf"},{"id":"bt-08","title":"Glencore books US$480 million provision covering entire Radiant World exposure: sources","source":"BT","date":"31 Aug 2026","tags":["Finance & Markets","Trade"],"summary":"Glencore took a roughly US$480 million provision covering its entire net exposure to Radiant World, the iron ore trader under scrutiny over concerns it gave falsified documents to banks. Radiant World owes Glencore US$951 million while Glencore owes it US$471 million, per an FT-cited letter that also covers exposure to Sapphire Minmetals. Glencore had earlier called its exposure 'well below' US$500 million. The loss, about a quarter of the average annual earnings of its metals and minerals trading division, is a black eye for its iron ore unit. Radiant World has threatened legal action, alleging a relationship beyond a counterparty; Glencore calls the claims meritless. The US Justice Department and Singapore police are investigating; banks have frozen accounts and miners have withdrawn business. Radiant World denies wrongdoing.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20BT/Glencore%20books%20US480%20million%20provision%20covering%20entire%20Radiant%20World%20exposure%20sources.pdf"},{"id":"bt-09","title":"Hold rates or defy Trump? US Fed chair Warsh faces 'no-win' inflation dilemma","source":"BT","date":"31 Aug 2026","tags":["Finance & Markets","Politics"],"summary":"At his first Jackson Hole appearance as Fed chair, Kevin Warsh clarified the central bank's commitment to its 2 per cent target and hinted at readiness to raise rates if inflation persists, with markets now seeing a quarter-point hike at the Sep 15-16 meeting as more likely than not. That leaves Warsh with a fraught choice: a September hike just before midterm elections would trigger a showdown with Trump, who handpicked him expecting lower rates. St Louis Fed's Musalem backs tightening; Chicago's Goolsbee calls the data 'ambiguous.' A soft Sep 11 CPI could justify holding. Treasury Secretary Bessent's yield interventions have muddied signals. Economists including Rogoff suggest delaying any hike until after the midterms to preserve Fed independence, calling it a 'no-win situation.'","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20BT/Hold%20rates%20or%20defy%20Trump%20US%20Fed%20chair%20Warsh%20faces%20'no-win'%20inflation%20dilemma.pdf"},{"id":"bt-10","title":"Japan spent record US$96.5 billion to support yen over past month, data shows","source":"BT","date":"31 Aug 2026","tags":["Finance & Markets"],"summary":"Japanese authorities spent a record 15.4 trillion yen (US$96.5 billion) intervening in currency markets between Jul 30 and Aug 26 to support the yen, Finance Ministry data showed, underscoring Tokyo's resolve to pull the currency from four-decade lows. The BOJ bought yen on Jul 30 and 31, including rare joint action with the US, as the yen neared 164 per dollar; the Bank of Korea timed won-buying to amplify the effect. The Jul 30 intervention may have reached 9.6 trillion yen. The yen strengthened to 155.20 by Aug 3 before stabilising near 159.50. Markets assign 65 per cent odds to a September BOJ hike. Washington said Tokyo could tap a Covid-era Fed backstop, and Treasury Secretary Bessent pledged 'whatever it takes' to stabilise the currency.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20BT/Japan%20spent%20record%20US96.5%20billion%20to%20support%20yen%20over%20past%20month,%20data%20shows.pdf"},{"id":"bt-11","title":"Malaysia's PM Anwar unveils measures to tackle living costs, support local businesses","source":"BT","date":"31 Aug 2026","tags":["Southeast Asia","Politics"],"summary":"Malaysian PM Anwar Ibrahim announced measures effective Sep 1 to ease living costs and support businesses, including restoring the RON95 subsidised petrol quota to 300 litres a month (from 200) and diesel to 400 litres for certain users, after cuts earlier this year amid crude price surges tied to the US-Israeli war on Iran. He pledged more funding for schools, digital health, and micro-financing for small traders. A government AI programme will offer Malaysians aged 18-30 free access to apps including Google's Gemini Enterprise and Alibaba Cloud's MuleRun. The e-invoicing exemption threshold rises to RM3 million (US$745,000). Anwar's coalition has lost three successive regional elections and faces criticism over stalled reforms and corruption cases; he warned he may call snap polls if divisions widen.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20BT/Malaysia's%20PM%20Anwar%20unveils%20measures%20to%20tackle%20living%20costs,%20support%20local%20businesses.pdf"},{"id":"bt-12","title":"Oil jumps at week's open as US military hits Iranian launchers","source":"BT","date":"31 Aug 2026","tags":["Energy","Geopolitics"],"summary":"Oil surged at the week's open after fresh fighting flared in the Strait of Hormuz, highlighting risks to Middle East flows after months of conflict. Brent for November rose above US$90 a barrel while West Texas Intermediate traded near US$86. The US military struck Iranian rocket launchers preparing to send mines into the waterway on Sunday, ending weeks of relative calm, according to US Central Command's captain Tim Hawkins. Crude wrapped a volatile month in which Brent swung nearly US$17 a barrel, buffeted by stop-start peace efforts and Washington's pledge to isolate Iran's economy. About six million to eight million barrels a day are still moving through Hormuz, with ships paying tolls on an Iran-approved route. UK holiday trading may thin Monday volumes.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20BT/Oil%20jumps%20at%20week's%20open%20as%20US%20military%20hits%20Iranian%20launchers.pdf"},{"id":"bt-13","title":"Oil settles lower on clues about Fed policy, rumours of Hormuz deal","source":"BT","date":"31 Aug 2026","tags":["Energy","Geopolitics"],"summary":"Oil settled lower on Friday and fell for the week as traders weighed Fed policy signals and rumours of a Strait of Hormuz shipping agreement. Brent settled at US$89.31 a barrel, down 0.43 per cent; WTI finished at US$83.40, down 0.16 per cent. For the week Brent lost over 5 per cent and WTI over 4 per cent. Fed chair Warsh's hints at a possible rate hike pressured prices, while analysts cited a choppy recovery in Hormuz flows, through which 20 per cent of global oil moved pre-war. Thursday saw seven vessels transit, below the 10-day average of 15. Goldman Sachs estimated Gulf exports at 15-16 million bpd. Officials are working on a deal for long-term US access to Venezuelan crude, and Venezuela may leave OPEC.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20BT/Oil%20settles%20lower%20on%20clues%20about%20Fed%20policy,%20rumours%20of%20Hormuz%20deal.pdf"},{"id":"bt-14","title":"Panama Canal congestion drives gas tankers to unusual routes","source":"BT","date":"31 Aug 2026","tags":["Trade","Energy"],"summary":"Growing congestion at the Panama Canal is pushing gas tankers into unusual journeys, from a rare South America detour to ship-to-ship shuttling. Wait times have grown to as long as 19 days, the highest since 2022, with operators paying millions to jump the queue. The Iran war has diverted more traffic while El Nino-driven dry conditions forced authorities to cut cargo and crossing limits, hitting wider Neopanamax LPG carriers hardest. Off Balboa, the Panamax Energia Grandeur transferred cargo to the Neopanamax Eneos Wisdom to keep gas flowing to Asia; both were chartered by TotalEnergies. Another supertanker, Gas Scorpio, is rounding South America to load in the US, adding a month of transit. Analysts say Hormuz tensions, climate and energy security are colliding to stretch the LPG market thin.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20BT/Panama%20Canal%20congestion%20drives%20gas%20tankers%20to%20unusual%20routes.pdf"},{"id":"bt-15","title":"SK Hynix starts work on US$4 billion Indiana AI memory hub, expects shortage through 2030","source":"BT","date":"31 Aug 2026","tags":["Technology & AI"],"summary":"SK Hynix broke ground on a more than US$4 billion facility in West Lafayette, Indiana, planning volume production of next-generation HBM4E chips from the third quarter of 2029, as CEO Kwak Noh-Jung said the current memory shortage should persist through end-2030. The Purdue Research Park site will open its cleanroom in the second half of 2028, house an HBM packaging line and AI R&D facility, and integrate with Korean fabs. It aims to create about 7,000 jobs, backed by US$458 million in Chips Act grants and up to US$500 million in loans. SK Hynix held 58 per cent of the global HBM market by revenue in the first quarter. Nvidia forecast 70 per cent revenue growth. The board approved 54.3 trillion won (US$38.3 billion) in investments through 2031.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20BT/SK%20Hynix%20starts%20work%20on%20US4%20billion%20Indiana%20AI%20memory%20hub,%20expects%20shortage%20through%202030.pdf"},{"id":"bt-16","title":"SK Hynix weighs closer ties with Japan's memory industry","source":"BT","date":"31 Aug 2026","tags":["Technology & AI"],"summary":"SK Hynix is exploring deeper cooperation with Japanese customers and suppliers in the memory sector, CEO Kwak Noh-jung said after a groundbreaking for its US plant in West Lafayette, Indiana. He said the world's second-biggest memory maker is keen to contribute to Japan's semiconductor industry, much as its more than US$4 billion Indiana investment aims to do, but has 'no fixed plans' for its significant indirect stake in Kioxia. The 133.5-acre Indiana site will be SK Hynix's first US HBM packaging base, opening its cleanroom by October 2028, with mass production from 2029 and about 1,000 jobs. After Toshiba cut its Kioxia stake, an SK Hynix-linked vehicle became Kioxia's largest shareholder at 14.19 per cent. SK Hynix continues to review a possible IPO of its US Nand unit Solidigm.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20BT/SK%20Hynix%20weighs%20closer%20ties%20with%20Japan's%20memory%20industry.pdf"},{"id":"bt-17","title":"Shipping traffic via Strait of Hormuz slips below 10-day average, data shows","source":"BT","date":"31 Aug 2026","tags":["Energy","Geopolitics"],"summary":"Seven commodity vessels transited the Strait of Hormuz on Thursday, down from 17 a day earlier and below the 10-day average of 15, preliminary Kpler shipping data showed. The seven included two medium-range tankers, one very large gas carrier, one Ultramax, one intermediate tanker and two chemical tankers; four were exiting and three entering. Figures may change as ships switch off transponders. Iran war mediators have renewed emphasis on reopening the strait, with Teheran agreeing to draw up conditions to restore normal traffic after a Qatari emissary pressed for freedom of navigation. A senior Iranian source said Iran and Oman were still finalising an agreement on how to share control of the waterway and its revenues. Meanwhile, 17 vessels transited the Bab el-Mandeb chokepoint, six entering and 11 exiting.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20BT/Shipping%20traffic%20via%20Strait%20of%20Hormuz%20slips%20below%2010-day%20average,%20data%20shows.pdf"},{"id":"bt-18","title":"SoftBank seeks another US$10 billion loan for OpenAI stake funding","source":"BT","date":"31 Aug 2026","tags":["Finance & Markets","Technology & AI"],"summary":"SoftBank Group is seeking a US$10 billion loan to help refinance debt tied to its investment in OpenAI, according to people familiar with the matter. The two-year facility would carry an interest margin around 275 basis points over SOFR, with Mizuho Bank as mandated lead arranger; commitments are due Aug 31. Proceeds could partly repay a US$40 billion bridge loan secured earlier this year. SoftBank, led by Masayoshi Son, is slated to invest close to US$65 billion in OpenAI by October. It is also weighing a US$10 billion to US$20 billion bond sale and a record one trillion yen (US$6.3 billion) retail bond issue at home. US firms have borrowed over US$410 billion this year for AI infrastructure in bond markets alone.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20BT/SoftBank%20seeks%20another%20US10%20billion%20loan%20for%20OpenAI%20stake%20funding.pdf"},{"id":"bt-19","title":"South Korea, Japan and US to hold North Korea-focused nuclear missile drill","source":"BT","date":"31 Aug 2026","tags":["Defence","Geopolitics"],"summary":"South Korea, Japan and the United States will conduct joint Freedom Edge military drills from Sep 9 to 11 to test readiness against North Korea's missile and nuclear threats, Seoul's Joint Chiefs of Staff said. The defensive exercise will be held in international waters south and east of Jeju island. It follows US President Donald Trump scaling back a major joint exercise with South Korea and cancelling a September Marine Corps drill. Trump cited Seoul's refusal to help in the Iran war and argued the August Ulchi Freedom Shield drills sent the wrong message to North Korea. Trump has been seeking a new summit with North Korean leader Kim Jong Un, whom he met in 2018 and 2019.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20BT/South%20Korea,%20Japan%20and%20US%20to%20hold%20North%20Korea-focused%20nuclear%20missile%20drill.pdf"},{"id":"bt-20","title":"Trump says US is taking partial control of Venezuela's vast oil reserves","source":"BT","date":"31 Aug 2026","tags":["Energy","Geopolitics"],"summary":"President Donald Trump announced an unprecedented US push to take control of a fifth of Venezuela's oil reserves, saying Washington had secured majority control of more than 65 billion barrels of proven reserves through a partnership with private business, at no cost to taxpayers. The move follows weeks of negotiations to give US firms long-term access to Venezuelan oilfields and guarantee crude supply. Secretary of State Marco Rubio said it would bring nearly US$100 billion in private investment. Venezuela holds the world's largest proven reserves but produces only about 1.25 million barrels a day after years of underinvestment and sanctions. Analysts questioned the deal's legal basis and whether it could lift output at scale. The US removed former president Nicolas Maduro in January.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20BT/Trump%20says%20US%20is%20taking%20partial%20control%20of%20Venezuela's%20vast%20oil%20reserves.pdf"},{"id":"bt-21","title":"US strikes Iranian rocket launchers in first attack in weeks","source":"BT","date":"31 Aug 2026","tags":["Defence","Geopolitics"],"summary":"The US military struck Iranian rocket launchers preparing to send mines into the Strait of Hormuz on Sunday, following weeks of relative calm, US Central Command's captain Tim Hawkins said. Islamic Revolutionary Guard Corps forces were readying rockets with sea mines aimed at the strait, once a waterway carrying one-fifth of the world's oil and LNG. Last week the US finished clearing mines from shipping routes there. The strike was the first military action against Iran in more than a month, after the US last fired missiles in late July and shifted to an economic-pressure campaign. Iran's foreign minister Abbas Araghchi said resuming diplomacy 'isn't impossible' after talks with Qatar, insisting 'pressure doesn't work.' Treasury Secretary Bessent promised an 'economic onslaught' against Iran and buyers of its oil, including China.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20BT/US%20strikes%20Iranian%20rocket%20launchers%20in%20first%20attack%20in%20weeks.pdf"},{"id":"bt-22","title":"Venezuela says 25-year US oil deal could generate US$209 billion while preserving resource sovereignty","source":"BT","date":"31 Aug 2026","tags":["Energy","Geopolitics"],"summary":"Venezuelan interim President Delcy Rodriguez said an energy agreement with the US would run 25 years, target crude output of 1.5 million barrels a day and preserve national sovereignty over natural resources. She called it a 'historic' deal covering 17 strategic oil fields, with a broader plan adding eight greenfield blocks. The accord could generate about US$209 billion in state revenue based on a US$65-per-barrel benchmark, with roughly US$19 from each barrel flowing to Venezuela. It follows Trump's announcement that the US would take partial control of the country's reserves, the world's largest proven at over 65 billion barrels, though output is only about 1.25 million bpd. Officials plan to sign agreements next week granting exploration and production rights to firms including Chevron.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20BT/Venezuela%20says%2025-year%20US%20oil%20deal%20could%20generate%20US209%20billion%20while%20preserving%20resource.pdf"},{"id":"scmp-01","title":"As Iran war hits six-month mark, Trump says he's 'not in a hurry'","source":"SCMP","date":"31 Aug 2026","tags":["Geopolitics","Politics"],"summary":"As the US-Israel war on Iran reaches six months, President Donald Trump says he is \"not in a hurry\" to restart negotiation
