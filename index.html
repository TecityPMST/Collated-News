oomberg data showed over 20,000 trades in 10-share lots versus more than 13,000 in 100-share lots. JMH saw the strongest adoption, with about a third of its trades in 10-share lots, and 55% of trades in the 11 stocks were below the old 100-share lot. Eight of the 11 had higher average daily turnover than on Oct 2, and SGX said liquidity stayed broadly stable despite softer market-wide trading.", "url": "https://www.businesstimes.com.sg/companies-markets/dbs-tops-trades-smaller-board-lots-debut-revised-sgx-framework"}, {"id": "bt-07oct-08", "title": "Gold liquidity deep enough for Asian, Western hubs to coexist, Hong Kong and Singapore say", "source": "BT", "date": "07 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Hong Kong and Singapore representatives told the LBMA's conference on Oct 6 that global gold liquidity is deep enough for Asian hubs to grow alongside Western centres, amid Western worries about competition with the London bullion market. Hong Kong plans the first central clearing and settlement system for gold in early 2027 and over 2,000 metric tons of storage within two years; Christopher Hui, secretary for financial services and the treasury, said details of renminbi physically delivered gold futures are due towards year-end. Singapore, with over 2,000 tonnes of commercial vaulting capacity, is starting central bank gold-vaulting services this month and establishing an OTC gold clearing system. MAS's Lim Cheng Khai cited strong growth in Asian gold demand, saying both hubs aim to \"complement price discovery in the Asian time zone\".", "url": "https://www.businesstimes.com.sg/companies-markets/energy-commodities/gold-liquidity-deep-enough-asian-western-hubs-coexist-hong-kong-and-singapore-say"}, {"id": "bt-07oct-09", "title": "Hong Kong property developer New World seeks more time to pay bonds with exchange offer", "source": "BT", "date": "07 Oct 2026", "tags": ["Finance & Markets"], "summary": "Hong Kong developer New World Development launched a debt exchange offer on Oct 6 letting bondholders swap notes due 2027 and 2028 for new secured debt maturing in 2032, to ease near-term repayment pressure. A new unit, New VD BondCo, plans to issue up to US$600 million of 7.375% senior secured notes due 2032 in exchange for three US dollar note series with about US$991 million outstanding. New World, one of the city's most indebted developers, is grappling with tight credit conditions and a prolonged property downturn; it said the offer, which expires on Oct 20, is intended to optimise its debt maturity profile. Last week it expanded a loan facility by around HK$1 billion and terminated its operating rights for a shopping mall next to Hong Kong International Airport.", "url": "https://www.businesstimes.com.sg/companies-markets/reits-property/hong-kong-property-developer-new-world-seeks-more-time-pay-bonds-exchange-offer"}, {"id": "bt-07oct-10", "title": "Middle East oil flows of around 14 million barrels a day help avert US$200-a-barrel oil: Vitol CEO", "source": "BT", "date": "07 Oct 2026", "tags": ["Energy", "Finance & Markets"], "summary": "Vitol CEO Russell Hardy said on Oct 6 that about 12 million bpd of crude and 2 million bpd of refined products had left the Middle East by tanker over the past 7 to 10 days, helping balance markets into winter as Western inventories are largely drained. Without that flow, he told the Energy Intelligence Forum, \"you do have that US$200 per barrel scenario\". He said this year's disruptions had moved from crude to products to shipping, and refined-product tightness will roll into winter as hits on Russian infrastructure and five lost months of Middle East refining runs leave the world short of capacity. He said diesel from the G7's 100 million-barrel strategic reserve release, agreed last week, will give Europe some relief; Brent traded around US$98 on Oct 6.", "url": "https://www.businesstimes.com.sg/companies-markets/energy-commodities/middle-east-oil-flows-around-14-million-barrels-day-help-avert-us200-barrel-oil-vitol-ceo"}, {"id": "bt-07oct-11", "title": "Scalability of digital assets hinges on ‘boring’ risk-management systems: summit participants", "source": "BT", "date": "07 Oct 2026", "tags": ["Finance & Markets", "Technology & AI", "Southeast Asia"], "summary": "Speakers at the Digital Assets Summit 2026, hosted by the Digital Assets Association (DAA) Singapore at SGX Centre on Oct 6, said digital finance's next stage hinges on innovating and scaling while managing risk. DAA co-chair Danny Chong said the harder question is whether functioning markets can be built around tokenised assets, adding \"the boring parts are usually where the real markets are built\". Senior Minister of State in the Prime Minister's Office Desmond Tan said tokenisation and distributed ledgers can cut friction but relocate rather than eliminate risk, and National Research Foundation chairman Heng Swee Keat said digital finance is at a very early stage. SGX chief risk officer Ivan Han said sound risk management is not at odds with innovation, as institutions commit capital when they understand the risk.", "url": "https://www.businesstimes.com.sg/companies-markets/scalability-digital-assets-hinges-boring-risk-management-systems-summit-participants"}, {"id": "bt-07oct-12", "title": "Singapore firms’ payment delays worsen for third straight quarter in Q3: SCCB", "source": "BT", "date": "07 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Slow payments by Singapore companies rose for a third straight quarter in Q3 2026 to 44.47% of payment transactions, up 0.02 percentage point on the quarter and 0.01 point on the year, Singapore Commercial Credit Bureau (SCCB) data released on Oct 6 showed. Prompt payments edged up 0.01 point to 41.05%, while partial payments fell 0.03 point to 14.48%. Construction had the highest share of slow payments at 55.88% after a fourth straight quarterly rise, manufacturing rose for a fourth quarter to 39.99% and retail for a third to 43.36%, while services and wholesale trade improved. SCCB CEO Audrey Chia said the continuous rise underscores \"the lingering cash-flow pressures faced by local companies\".", "url": "https://www.businesstimes.com.sg/companies-markets/singapore-firms-payment-delays-worsen-third-straight-quarter-q3-sccb"}, {"id": "bt-07oct-13", "title": "South Korea investigates possible use of AI in hacks on its banks", "source": "BT", "date": "07 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "South Korean officials are investigating whether AI agents were involved in recent hacks on the country's banks, with President Lee Jae Myung saying on Oct 6 that \"signs have emerged\" AI models were used in some attacks; no details were given on who was behind them. Lee told his Cabinet to confirm what happened swiftly; Yonhap reported the National Office of Investigation has opened an inquiry into cyberattacks on financial firms including Hana Bank, KB Kookmin Bank and Shinhan Bank. Shinhan said personal credit information of about 25,000 people had leaked, while Hana and Kookmin reported 89 and 99 customers affected, plus 20 current or former Kookmin employees. Australian officials last month disclosed government website breaches, including a June incident in which OpenAI agents infiltrated a public health insurance data portal.", "url": "https://www.businesstimes.com.sg/international/south-korea-investigates-possible-use-ai-hacks-its-banks"}, {"id": "scmp-07oct-01", "title": "After cordial Xi-Trump summit, could China’s US dollar pivot cause tremors?", "source": "SCMP", "date": "07 Oct 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "An SCMP analysis says China's gradual shift from US dollar assets loomed over last month's Xi-Trump summit, with its US Treasury holdings at an 18-year low of US$618 billion in July. Beijing is also widening yuan use and alternative payment rails, with CIPS transactions up 11.9% year on year to 100.9 trillion yuan (US$14.9 trillion) in the first half, per the People's Bank of China. Analysts including Fudan University's Charles Chang call it a defensive safety net, not a bid to replace the dollar, which held 56.7% of global central bank reserves in Q2 versus the yuan's 2.11%, per the IMF. Natixis' Alicia Garcia-Herrero warns parts of Washington will treat even a regional yuan system as a strategic threat, which could bring greater scrutiny of CIPS links and correspondent banks.", "url": "https://www.scmp.com/economy/global-economy/article/3369918/after-cordial-xi-trump-summit-could-chinas-us-dollar-pivot-cause-tremors"}, {"id": "scmp-07oct-02", "title": "As China’s AI race accelerates, ‘model fatigue’ becomes the next challenge", "source": "SCMP", "date": "07 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "An SCMP analysis says China's AI sector is suffering an intensified form of \"model fatigue\", with upgrades arriving so fast that individual breakthroughs struggle for attention. On Sept 22 alone, Xiaomi live-streamed training of its MiMo-V2.6 model, Anthropic unveiled Opus 5.5 and OpenAI released GPT-6 Sol and Luna. Analysts say the burden in China falls more heavily on developers through price wars: DeepSeek cut V4.1 Flash API prices to as low as 0.02 yuan per million cached input tokens off-peak, and Alibaba's Qwen3.8-Flash charges 1 yuan per million input tokens. Tech Buzz China's Rui Ma says firms are carving out niches, such as ByteDance in video generation and Ant Group in healthcare; the piece adds that calls to slow down, including from Anthropic CEO Dario Amodei, have met strong resistance from Chinese researchers and state media commentators.", "url": "https://www.scmp.com/tech/big-tech/article/3369757/chinas-ai-race-accelerates-model-fatigue-becomes-next-challenge"}, {"id": "scmp-07oct-03", "title": "Beijing’s policy advisers map out how post-reunification Taiwan could be governed", "source": "SCMP", "date": "07 Oct 2026", "tags": ["Geopolitics", "Politics"], "summary": "Leading mainland Chinese research institutes have finalised or nearly completed the first proposals for governing Taiwan after reunification, the SCMP has learned, seven years after Xi Jinping called for such plans in 2019. Tsinghua and Xiamen universities finished studies this year and Peking University's is close to completion, according to academic sources; the unpublished studies are not official policy. Scholars say autonomy would hinge on how reunification is achieved: Xiamen University's Chen Xiancai says a peaceful deal could leave Taiwan more room than Hong Kong and Macau, while \"compelled reunification\" through pressure, possibly including a blockade, could mean a Hong Kong- or Macau-style model or less. More than 80% of people in Taiwan oppose the one country, two systems formula, according to an August Mainland Affairs Council poll.", "url": "https://www.scmp.com/news/china/politics/article/3369782/beijings-policy-advisers-map-out-how-post-reunification-taiwan-could-be-governed"}, {"id": "scmp-07oct-04", "title": "China’s economy to slow as global growth stays solid, US think tank report says", "source": "SCMP", "date": "07 Oct 2026", "tags": ["Finance & Markets", "Trade"], "summary": "The Peterson Institute for International Economics (PIIE) projects China's growth will slow to 4.6% this year and 4.3% in 2027, from 5% in 2025, as export strength fades and weak domestic demand persists, according to its semi-annual Global Economic Prospects report released on Oct 6. The 2026 forecast is up from 4.5% in April, but the tone has shifted: the spring report called Chinese exports strong, while senior fellow Karen Dynan now expects the export boom to fade as trade restrictions increase. PIIE sees world growth of 3.2% this year and 3.1% next year despite the war with Iran, and US growth of 2.3% and 2.2%, propelled by the AI boom. Dynan also predicted three more Fed rate hikes in the coming months amid inflation concerns.", "url": "https://www.scmp.com/news/china/diplomacy/article/3369965/chinas-economy-slow-global-growth-stays-solid-us-think-tank-report-says"}, {"id": "scmp-07oct-05", "title": "Hong Kong land sale stuns market as HK$4.3b bid hits 5-year Kowloon high", "source": "SCMP", "date": "07 Oct 2026", "tags": ["Finance & Markets"], "summary": "Kerry Properties won a residential site on Fat Kwong Street in Ho Man Tin for HK$4.31 billion (US$549 million), the highest price paid for a Kowloon residential site in nearly five years, signalling developer confidence in luxury home demand. The price of HK$20,738 per square foot of gross floor area was 38% above the top market estimate of HK$15,000; the last Kowloon residential site above HK$20,000 per square foot was Lai Sun Development's Broadcast Drive purchase at HK$22,465 in October 2021. The government received 10 tenders for the plot, expected to hold around 250 flats, and Centaline Surveyors' James Cheung King-tat says the homes would need to sell at nearly HK$40,000 per square foot of saleable area. Kerry has bought four sites for a combined HK$6.47 billion this year.", "url": "https://www.scmp.com/business/article/3369948/hong-kong-land-sale-stuns-market-hk43b-bid-hits-5-year-kowloon-high"}, {"id": "scmp-07oct-06", "title": "Hong Kong’s bridge of gold completes China’s yuan ambition", "source": "SCMP", "date": "07 Oct 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "An SCMP opinion piece in a series on Beijing's gold push argues Hong Kong is becoming the offshore vaulting and delivery point in a gold-backed route to yuan internationalisation, with Shanghai the pricing and clearing centre. The writer notes gold is under 10% of China's US$3.4 trillion reserves, versus 65-75% for the US, Germany, France and Italy, and that China has imported over 1,000 tonnes so far this year. Yuan-denominated gold contracts in Shanghai and Hong Kong vaults let partners such as Brics nations and Middle Eastern oil exporters convert yuan into physical gold, making yuan far less risky to accept, the piece says. It cites Hong Kong's plan to lift gold storage capacity tenfold to 2,000 tonnes by 2028 and HKEX's yuan-denominated gold futures contract, due early next year.", "url": "https://www.scmp.com/opinion/hong-kong-opinion/article/3369468/hong-kongs-bridge-gold-completes-chinas-yuan-ambition"}, {"id": "scmp-07oct-07", "title": "Nvidia-backed Reflection AI challenges Chinese dominance in open-weight models", "source": "SCMP", "date": "07 Oct 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "Nvidia-backed US start-up Reflection AI on Oct 5 debuted Beam, its first open-weight model for coding, reasoning and agentic tasks, aiming to challenge China's dominance in freely available AI. Reflection says the mixture-of-experts model activates 23 billion of 501 billion parameters per task, needs three to four times less inference compute than comparable open models and is competitive with Z.ai's GLM-5.2, though Moonshot AI's Kimi K3 stays ahead in raw capability. Founded by former Google DeepMind researchers, Reflection has raised over US$4 billion since its 2024 launch and hit a US$25 billion valuation before releasing its first model; Nvidia backed it with US$800 million and chip access. Beam is in final red-teaming, with weights due later this month; meanwhile, Amazon said on Oct 5 that AWS had added Z.ai's GLM-5.3 to Amazon Bedrock.", "url": "https://www.scmp.com/tech/tech-trends/article/3369885/nvidia-backed-reflection-ai-challenges-chinese-dominance-open-weight-models"}, {"id": "scmp-07oct-08", "title": "Saudi-Iran war risk grows as Riyadh resumes Yemen bombing", "source": "SCMP", "date": "07 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "An SCMP analysis, citing analysts, says Saudi Arabia and Iran are edging toward direct conflict after more than 100 Saudi warplanes bombed Yemen's Houthis on Oct 5, ending a four-year lull and helping government forces retake much of the territory the Houthis seized last month. Pakistan and Turkey said they would deploy forces in Saudi Arabia under an August defence pact, Britain has agreed to provide air-to-air refuelling, French units are guarding Saudi oil-export infrastructure and the US reportedly sent over 100 military advisers. Analysts expect stepped-up Houthi drone and missile attacks, aided by Iran's Revolutionary Guards. King's College London's Andreas Krieg says Saudi strikes on embedded Iranian networks make it harder to keep the Saudi-Houthi war separate from the Saudi-Iranian confrontation, \"probably the most serious escalation risk over the coming weeks\".", "url": "https://www.scmp.com/week-asia/politics/article/3369933/saudi-iran-war-risk-grows-riyadh-resumes-yemen-bombing"}, {"id": "scmp-07oct-09", "title": "Trump says Iran could ‘take out’ Los Angeles or San Diego, drawing backlash", "source": "SCMP", "date": "07 Oct 2026", "tags": ["Politics", "Geopolitics"], "summary": "US President Donald Trump, discussing wartime economic sacrifices at a rally in Grand Island, Nebraska, on Oct 5, suggested Iran could take out a major US city: \"Let ’em take out Los Angeles, let ’em take out San Diego\". On Oct 6, White House Director of Communications Steven Cheung dismissed the criticism, saying Trump meant US cities would have been threatened had a nuclear Iran not been stopped. California Governor Gavin Newsom and Los Angeles Mayor Karen Bass, both Democrats, criticised the remark, and Republican Jim Desmond, running in a competitive district near San Diego, said he vehemently disagreed. The remark coincided with the start of early voting in California for the November midterms; San Diego hosts more than 115,000 active-duty service members.", "url": "https://www.scmp.com/news/world/united-states-canada/article/3369961/trump-says-iran-could-take-out-los-angeles-or-san-diego-drawing-backlash"}, {"id": "scmp-07oct-10", "title": "US firm to make battle-tested drones in Taiwan, boosting supply chain resilience", "source": "SCMP", "date": "07 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "California-based Aevex Aerospace is working with Taiwan's Coretronic Intelligent Robotics Corporation (CIRC) to produce its Ukraine-tested Vandal and Onyx drones locally, as the island seeks a \"drone shield\" against the People's Liberation Army. According to Aevex, the Vandal can carry a 4.5kg payload and fly more than 460km, and the larger Onyx can carry 13.6kg with a range exceeding 270km; both are designed to work when satellite navigation is degraded. CIRC chairwoman Ann Wu said capacity at its Zhunan plant could reach 4,000 aircraft a month depending on demand, and Aevex said local production could cut reliance on trans-Pacific resupply in a crisis. Economic affairs minister Kung Ming-hsin said on Oct 5 Taiwan needs more than 200,000 drones for deterrence, from a supply chain free of mainland Chinese products.", "url": "https://www.scmp.com/news/china/military/article/3369929/us-firm-make-battle-tested-drones-taiwan-boosting-supply-chain-resilience"}, {"id": "scmp-07oct-11", "title": "Would China agree to slow AI development? That’s the wrong question", "source": "SCMP", "date": "07 Oct 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "An SCMP opinion piece argues that whether China would agree to slow frontier AI is the wrong question, noting official readouts from the latest US-China summit did not address it. The writer says there is no single Chinese answer: many in China's AI safety community worry about frontier risks, while compute-restricted firms and ordinary people worried about being left behind find talk of a pause remote. It cites estimates that leading Chinese models trail US ones by about eight months to a year, and says Chinese observers may ask whether \"pacing\" is a tool for maintaining US technological superiority. The writer calls for frontier risks on the next US-China AI dialogue agenda, a Pugwash-style safe space for technical experts and pressure on companies to compete on safety evaluations and safeguards.", "url": "https://www.scmp.com/opinion/world-opinion/article/3369561/would-china-agree-slow-ai-development-thats-wrong-question"}, {"id": "tass-07oct-01", "title": "Chinese diplomat refutes reports on intel transfer to Iran in conflict with US", "source": "TASS", "date": "07 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "Chinese foreign ministry spokesman Guo Jiakun said China has not shared navigation-related intelligence with Iran during Iran's conflict with the United States, TASS reports from Beijing. TASS says Guo was responding to a Western journalist's question about reports that China had allegedly shared satellite intelligence and other location-tracking information with Iran. He said Beijing rejects \"attempts to discredit China by using military conflicts as a pretext\" and stressed that China has always been committed to its international obligations.", "url": "https://tass.com/world/2198173"}, {"id": "tass-07oct-02", "title": "Insurers stop covering risks related to Ukraine port calls — Ambrey", "source": "TASS", "date": "07 Oct 2026", "tags": ["Geopolitics", "Trade", "Finance & Markets"], "summary": "UK-based maritime security company Ambrey told TASS that many underwriters no longer offer cover for Ukraine port calls after large industry losses, even with war risk premium rates in double digits. Ambrey said Romanian and Bulgarian waters should no longer be treated as safe by default, with merchant vessels now exposed to kinetic activity within the EEZs of two NATO member states. It said that as Russian strikes degraded the Odessa-cluster ports, the Danube's share of cargo handled at Ukrainian ports rose from around 10% in January-June to 74% in August 2026, while Danube-related attacks reached 3.7 times as many events a month in July-September as in January-June. TASS attributes the higher Black Sea threat to what it calls a military campaign initiated by Ukraine and Russian \"involuntary tit-for-tat action\".", "url": "https://tass.com/world/2198453"}, {"id": "tass-07oct-03", "title": "Iran boosts arms production capacities by 2.5 times — defense ministry", "source": "TASS", "date": "07 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "Iranian defence ministry spokesman Brig. Gen. Reza Talaei-Nik said Iran has increased its weapons production capacity 2.5-fold from before its conflict with the United States, TASS reports, citing the Tasnim news agency. He said output of certain weapon types, involving the private sector, more than tripled, warning that if \"the enemy makes a wrong calculation\" it will face more advanced weapons and a heavy response. TASS says the US and Israel began a war with Iran on February 28 and that, after a June US-Iran memorandum of understanding on an immediate cessation of hostilities, the US resumed large-scale strikes on the night of July 8, accusing Iran of violating agreed terms on the Strait of Hormuz. It says Washington has since shifted from large-scale force to sanctions pressure.", "url": "https://tass.com/world/2198269"}, {"id": "tass-07oct-04", "title": "Macron views latest nuclear-capable missile launch trials as clear signal", "source": "TASS", "date": "07 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "French President Emmanuel Macron said the latest test of the M51.3 sea-based strategic ballistic missile sent a clear signal to everyone, TASS reports. In an address to troops published on X, Macron called it \"a strong and clear signal that was received where it should\" and said he had observed the trials from the Auvergne multi-purpose frigate. Describing the trials as a success, he repeated his earlier statement that one should instill fear in order to remain free, adding that instilling fear requires being strong.", "url": "https://tass.com/world/2198163"}, {"id": "tass-07oct-05", "title": "Moscow’s response to Japan’s sanctions to hurt Tokyo’s interests — Russian embassy", "source": "TASS", "date": "07 Oct 2026", "tags": ["Geopolitics", "Trade"], "summary": "The Russian Embassy in Japan said in a statement that Moscow will keep responding to Japan's sanctions with systemic countermeasures aimed at hurting Tokyo's interests in areas it finds sensitive, TASS reports. The embassy contrasted what it called Tokyo's \"bombastic proclamations about readiness to contribute to a peaceful settlement\" with its plans for further defence cooperation with Kyiv, and said full responsibility for the negative consequences, which it called inevitable, would lie with Japan. According to TASS, Japan on October 2 added 33 companies and nine individuals from Russia, as well as 35 vessels, to its Russia-related sanctions lists. Russian Foreign Ministry spokeswoman Maria Zakharova had earlier said the new sanctions proved Tokyo's foreign policy lacked independence.", "url": "https://tass.com/politics/2198151"}, {"id": "tass-07oct-06", "title": "Trump announces construction of largest US shipyard since World War II", "source": "TASS", "date": "07 Oct 2026", "tags": ["Defence", "Finance & Markets"], "summary": "US President Donald Trump announced that the US Navy is beginning construction of the country's largest new shipyard since World War II, speaking in Maryland, where the complex will be built, TASS reports. He said the workers of Baltimore and the shipyard at Sparrow's Point had been a vital part of American industrial strength for over 100 years. According to TASS, Anduril Industries, which develops and produces unmanned and uncrewed systems, earlier announced a US$3.7 billion investment in the new Arsenal-2 shipyard, expected to begin operations in 2030 and to make components for Virginia-class submarines, and signed a US$2.9 billion US Navy contract to build submarines. Trump said the US government would own a 40% stake in the new shipyard.", "url": "https://tass.com/world/2198493"}, {"id": "tass-07oct-07", "title": "Trump believes conflict in Ukraine nearing its end", "source": "TASS", "date": "07 Oct 2026", "tags": ["Geopolitics"], "summary": "US President Donald Trump told supporters in Baltimore, Maryland, that peace in Ukraine is actually getting closer even though it does not look like it, TASS reports. Trump said the Russia-Ukraine conflict had not yet been ended and that he was working on it, admitting he had thought it \"would be the easiest one for me\". Asserting that eight wars had already been ended, he said this one would end too, pretty soon.", "url": "https://tass.com/world/2198491"}, {"id": "tass-07oct-08", "title": "United States does not need Iranian oil, President Donald Trump declares", "source": "TASS", "date": "07 Oct 2026", "tags": ["Energy", "Geopolitics"], "summary": "US President Donald Trump said in Baltimore, Maryland, that the United States does not need Iranian oil and claimed the Strait of Hormuz is fully controlled by the US Navy, TASS reports. He said others need Iran's oil badly, adding \"we’re getting it out at record levels\". Trump also said Washington intends to prevent Tehran from acquiring nuclear weapons, calling that goal already a fait accompli. TASS notes that Tehran has repeatedly said it is not seeking nuclear arms, that Western intelligence agencies have found no evidence of Iran developing them, which it says The New York Times confirmed at the end of January, and that a fatwa by former supreme leader Ayatollah Ali Khamenei banning nuclear weapons production has been in effect since 2003.", "url": "https://tass.com/world/2198503"}, {"id": "xinhua-07oct-01", "title": "Australian petrol vehicle sales down 36.2 pct in September", "source": "XINHUA", "date": "07 Oct 2026", "tags": ["Finance & Markets", "Trade"], "summary": "Australian petrol vehicle sales fell 36.2% year on year in September as electric vehicle sales kept surging, the Federal Chamber of Automotive Industries (FCAI) reported on Oct 6, according to Xinhua. The FCAI said diesel sales fell 18.4%, battery electric vehicle (BEV) and plug-in hybrid sales more than doubled, and BEVs took 24.2% of new-vehicle sales, second only to August's record 24.9%. China supplied 35.5% of vehicles sold against Japan's 22.5%, the FCAI said; Xinhua says China first overtook Japan as Australia's top supplier in February, after almost 30 years of Japanese leadership. Xinhua reports BYD's 2026 Australian sales reached 76,614 vehicles by end-September, up 102%.", "url": "https://english.news.cn/20261006/3f2fc28662984915b842be9e65fe91b2/c.html"}, {"id": "xinhua-07oct-02", "title": "German industrial orders decline in August", "source": "XINHUA", "date": "07 Oct 2026", "tags": ["Finance & Markets"], "summary": "German industrial orders fell 10.6% month on month in August, reversing a strong July increase, official data showed on Oct 6, Xinhua reports. The Federal Statistical Office (Destatis) said the decline was driven largely by the volatile \"other transport equipment\" sector, where orders plunged 61.5% after more than doubling in July on exceptionally large orders for ships, rail vehicles and aircraft. Xinhua reports domestic orders fell 17.3% and foreign orders 5.4%, while the Economy Ministry put machinery orders down 4.4%, electrical equipment down 5.3% and automotive orders up 2.8%. The ministry attributed the swings to the growing importance of public procurement and said the overall order situation had improved markedly in recent months, particularly in sectors benefiting from AI expansion and government procurement.", "url": "https://english.news.cn/20261006/b575f8dcabfa4e5eb0ebcaa1bd957c01/c.html"}, {"id": "xinhua-07oct-03", "title": "Lithuania's parliament backs lifting constitutional ban on weapons of mass destruction", "source": "XINHUA", "date": "07 Oct 2026", "tags": ["Defence", "Politics"], "summary": "Lithuania's parliament has backed a constitutional amendment removing the ban on deploying weapons of mass destruction on Lithuanian territory, potentially opening the way for allied nuclear weapons to be stationed there, Xinhua reports, citing local news. According to Xinhua, the amendment, which keeps the ban on foreign military bases, passed its first reading on Oct 6 by 106 votes to 18 with six abstentions; the final vote, at least three months away, needs at least 94 of the Seimas's 141 members. Parliament Speaker Juozas Olekas said the final vote is expected on Jan 12. Opposition conservative leader Laurynas Kasciunas said the current restriction stops Lithuania fully participating in NATO's nuclear deterrence plans, while lawmakers opposing the change want it put to a referendum.", "url": "https://english.news.cn/20261006/ad8ba5b7075948d19c0235af5bd9e2f4/c.html"}, {"id": "xinhua-07oct-04", "title": "Poland to invest over 26 bln USD in population protection, civil defense", "source": "XINHUA", "date": "07 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "Poland plans to invest 102.4 billion zlotys (US$26.45 billion) from 2027 to 2031 in a population protection and civil defence programme, Prime Minister Donald Tusk said on Oct 6, Xinhua reports. According to Xinhua, the programme covers protective structures, rescue equipment and facilities, emergency stockpiles, secure water and energy supplies and communications security, continuing 2025-2026 work for which the government allocated nearly 34 billion zlotys (US$8.78 billion). Xinhua says the Russia-Ukraine conflict has brought security concerns closer to Poland's borders, and that the government has accelerated the construction and modernisation of shelters, distributed emergency preparedness guides and expanded nationwide training on responding to air raids and other emergencies.", "url": "https://english.news.cn/20261006/d02633a42a4847569c5e766f7fc83dc9/c.html"}, {"id": "xinhua-07oct-05", "title": "World Bank lifts Malaysia's 2026 growth forecast to 5.1 pct on AI-related activities", "source": "XINHUA", "date": "07 Oct 2026", "tags": ["Southeast Asia", "Finance & Markets", "Technology & AI"], "summary": "The World Bank on Oct 6 raised its 2026 growth forecast for Malaysia by 0.7 percentage points to 5.1%, citing stronger-than-expected first-half activity fuelled by strong growth in global AI-related activities, Xinhua reports. Xinhua says Malaysia's real GDP growth accelerated to 6% in the second quarter from 5.4% in the first, and the bank said the expansion was driven largely by net exports, particularly AI-related demand for electrical and electronic products and information and communications technology services. In its East Asia and Pacific Economic Update, the bank said several regional economies, including Malaysia, had grown faster than anticipated in 2026 on high-tech manufacturing and exports. Domestic demand is expected to remain the main growth driver, Xinhua adds.", "url": "https://english.news.cn/20261006/92a010a028a94e09961fb96fe407f50e/c.html"}]}, "2026-10-08": {"date": "2026-10-08", "dayOfWeek": "Thursday", "totalArticles": 87, "sourceCounts": {"WSJ": 14, "ST": 15, "BT": 22, "SCMP": 13, "TASS": 18, "XINHUA": 5}, "executiveDigest": "The IMF set the tone for the day. Speaking in Singapore ahead of next week's IMF-World Bank meetings in Bangkok, Kristalina Georgieva said oil remains around US$100 a barrel and global public debt is on track to exceed 100% of GDP, and called rate rises by the Fed, ECB and BOJ 'highly appropriate'. Bond markets remain under pressure: the US 10-year yield touched a 24-year high above 5.36% on Oct 7 before settling at 5.276%, France's 10-year rose to 4.91%, and Fed minutes made no urgent case for an Oct 28 hike, while China is the exception, its 10-year falling to as low as 1.7%. In the Gulf, three maritime security sources counted at least 12 tanker attacks around Hormuz in the week to Oct 5, the most of the war, and Shell guides to record Q3 refining margins of US$42 a barrel. From the state agencies, TASS carries an Al Hadath report that Iran-US mediation is deadlocked, and Xinhua quotes an IRGC adviser who says the strait is closed. At home, OCBC lost more than S$8 billion in value on a Citi downgrade, and Parliament passed the Digital Infrastructure Bill.", "briefingCards": [{"title": "Lead story - IMF tells governments the era of cheap money is over as yields hit multi-decade highs", "body": "In a curtain-raiser speech in Singapore on Oct 7, IMF Managing Director Kristalina Georgieva said the global economy faces three crosscurrents, the rapid arrival of AI, persistently high energy prices and record public debt, now on track to exceed 100% of GDP, with US, German and Japanese 10-year yields at their highest since 2007, 2009 and 1996 (WSJ). She called rate rises by the Fed, ECB and Bank of Japan 'highly appropriate', warned that AI earnings disappointments could become a far-reaching shock, and urged high-debt advanced economies to adopt credible medium-term fiscal consolidation (WSJ). She also said AI could lift global growth by up to half a percentage point a year if it is widely accessible, but that its gains are bypassing most economies outside the US, China and India; Singapore tops the IMF's AI preparedness index, and the IMF-World Bank meetings run in Bangkok on Oct 12-18 (ST). At a fireside chat at the Lee Kuan Yew School of Public Policy, President Tharman Shanmugaratnam said deficits have become structural, warned of fiscal dominance, and said AI-driven growth may not lift tax revenue because income may shift from labour to capital (BT). At the Forbes Global CEO Conference in Singapore, Ray Dalio called AI a 'classic bubble' nearing the point of bursting as debt grows and rates rise, and Temasek CEO Dilhan Pillay said heavy capital flows into AI infrastructure may drive up the overall cost of capital (BT). Framing differs: TASS splits the speech into four items, leading on its warnings that the AI building boom is inflationary, that frontier models could 'run amok' and that high energy prices will persist even if the Gulf war ends, and on her call for 'a prudently hawkish bias' (TASS), while WSJ leads on her call to act now on debt (WSJ)."}, {"title": "Markets & finance - US 10-year yield hits a 24-year high while China's bonds rally", "body": "The US 10-year Treasury yield touched a 24-year high above 5.36% on Oct 7 before settling at 5.276% after a strong auction, following its steepest quarterly rise since 1994, and the S&P 500's forward multiple has compressed to about 19.3 times from 22.2 at the start of the year even with the index near records; the equal-weighted index is down 5% since Aug 13 (WSJ). Minutes of the Fed's September meeting showed a unanimous vote for its first hike in three years but no urgent case for a follow-on at the Oct 28 meeting, with most officials projecting one more increase by year-end (WSJ). Foreign investors pulled US$26.3 billion from emerging-market stocks and bonds in September, the first monthly outflow since June, led by selling of South Korean stocks, the IIF says (ST). In Europe, France's 10-year yield rose to 4.91%, and Finance Minister Roland Lescure told the WSJ France may issue more shorter-term debt 'at the margin' (WSJ), while German industrial output rose 2.0% in August, the strongest gain since March 2025 (WSJ). China is the exception: its 10-year yield fell to as low as 1.7%, with the PBOC a net bond buyer this year (WSJ), though its forex reserves fell US$38.1 billion in September to US$3.4003 trillion on a stronger dollar and lower global asset prices, according to SAFE as reported by Xinhua (Xinhua). In Asia, Taiwan's Taiex, up 72% this year, has overtaken South Korea's Kospi, up about 65%, as the best-performing major index (BT), and Korean retail investors lost an estimated US$1.7 billion on leveraged single-stock products tied to Samsung Electronics and SK Hynix (BT). Hang Seng Indexes will expand the Hang Seng Tech Index, down 23% this year, to 50 constituents in December (SCMP)."}, {"title": "Asia realignment - Brussels hardens its China line as Trump presses Xi on Japan", "body": "The European Parliament adopted a markedly tougher China report on Oct 7 by 454 votes to 86, calling Beijing's industrial policy an 'existential threat to the EU' and urging a continuous European naval presence around the Taiwan Strait (SCMP). EU trade chief Maros Sefcovic meets Commerce Minister Wang Wentao in Beijing on Oct 8 and 9, and people familiar with the talks say Brussels hopes China will agree to moderate exports in a single sector as a proof of concept (SCMP). Beijing is signalling it can respond: Zhou Mi, a researcher at a Commerce Ministry-affiliated academy, said on a CCTV-linked account that China has tools including foreign-subsidy probes if tensions escalate (BT). Goldman Sachs says China's export engine may hit a ceiling, as 82 countries ran deficits with China above 3% of GDP in 2025, up from 24 in 2005 (SCMP). People familiar with the talks told the SCMP that Trump pressed Xi at last month's Washington summit to lift China's export curbs on Japan and meet Prime Minister Sanae Takaichi, but that Xi was not receptive (SCMP). Taiwan's envoy in Washington, Alexander Yui, said ties remain robust while Trump holds back a US$14 billion arms package (ST), Taiwanese prosecutors indicted 10 people over the alleged resale of export-controlled US chips to China (ST), and the US Treasury issued its first outbound investment fine, US$200,000, for failing to report a roughly US$92,000 investment in a Shanghai robotics AI firm (SCMP). From the agencies: Xinhua reports Russian presidential aide Nikolai Patrushev visits China from Oct 8 to 13 for talks with Wang Yi (Xinhua), and a Russian Arctic specialist told TASS that China may become a major economic and technological player in the Arctic but will not become a full-fledged Arctic state (TASS)."}, {"title": "Energy & climate - Hormuz tanker attacks peak as Shell guides to record refining margins", "body": "Attacks on tankers around the Strait of Hormuz in the week of Sept 28-Oct 5 were the most of any week since the US war with Iran began on Feb 28, with three maritime security sources counting at least 12, while IMO data showed nine incidents involving vessels (ST). As fighting between the Houthis and Saudi-backed forces escalates in Yemen, attacks on Saudi airports in Riyadh and Abha killed three people, and Syrian Petroleum's CEO says Iraq asked it to help export crude, bypassing Hormuz (BT). Shell expects a record third-quarter refining margin of US$42 a barrel, up from US$24 in the second quarter (BT), and IEA members agreed to speed up the remaining releases under their March collective action, about 100 million barrels, prioritising diesel, Xinhua reports (Xinhua). The state agencies frame Hormuz differently: Xinhua quotes IRGC adviser Mohammad-Reza Naqdi saying the strait is closed and under the full control of Iran's armed forces, and notes that US officials say it is open and under US control (Xinhua), while TASS, citing Al Hadath and a senior US source, reports that mediation is deadlocked and that Hormuz is no longer a US priority because, in the US assessment, Iran has 'lost control over it' (TASS). TASS, citing IRNA, quotes Iranian Foreign Ministry spokesman Esmaeil Baghaei as saying Iran and Oman have agreed coordinates for safe shipping corridors (TASS). For Europe, TASS calculates that EU gas storage was 72.83% full on Oct 5, the lowest for the date since records began in 2011, with Asian LNG prices averaging 8% above Europe's (TASS). On climate, South Korea unveiled a 1,000 trillion won (US$747 billion) energy transition plan through 2035 (BT), and Australia's High Court upheld the blocking of a coal mine extension over its scope 3 emissions (ST)."}, {"title": "Technology & AI - OpenAI publishes hundreds of maths results as chip buyers turn to debt", "body": "OpenAI published 722 papers containing AI solutions to more than 300 long-unsolved maths problems, including advances on three of the five remaining Millennium Prize Problems, in a low-key rollout aimed at winning back sceptical mathematicians (WSJ). The hardware bill is moving into private credit: Broadcom has been working to arrange more than US$50 billion in financing for OpenAI's custom chip, Oracle is in talks with Apollo and Goldman Sachs over a chip purchase, and SpaceX has discussed a US$40 billion Nvidia chip financing, according to people familiar (WSJ), while venture firm Disruptive has secured US$7.5 billion towards a fund of up to US$10 billion, the people said (WSJ). Chinese open-weight models are winning users but not revenue: DeepSeek captured only about 8% of estimated spending on its models via OpenRouter, Epoch AI says, and Z.ai reported a 24.6% API gross margin in the first half, against Epoch AI's estimated 85% for Anthropic's Opus 4.8 (SCMP). The labour effects are showing: HSBC plans to cut its UK financial advisers by nearly 70% as it leans on AI, according to people familiar (ST), and Micron workers at its Taoyuan plant voted 1,994 to 14 to strike over bonuses (ST). In devices and tools, Apple will unveil new smart home devices on Oct 13 alongside LG-branded accessories co-developed with LG, according to people familiar (BT), and Google and Unity launched a prompt-to-game platform (ST). Physical limits are tightening: Nobel physicist Frank Wilczek argues in a WSJ op-ed that no large data centre or major extension should be connected unless its developer brings new carbon-free power (WSJ), and Goodman faces resident criticism over a 1-gigawatt campus in Japan (BT). TASS, citing the Nikkei, reports Panasonic plans humanoid factory robots from as early as 2029 (TASS)."}, {"title": "Singapore & SEA focus - OCBC's S$8 billion slide, a new data-centre law and MAS AI rules", "body": "OCBC shares fell 5.9% to S$30.30 on Oct 7, wiping more than S$8 billion off its market value, after Citi cut the bank to sell with a S$27.50 target; DBS fell 1.4% and UOB 2.9% (BT). Parliament passed the Digital Infrastructure Bill, under which about two-thirds of Singapore's 70 data centres will need a licence and meet security, resilience and energy-efficiency rules, with fines of up to S$1 million or 10% of Singapore turnover (BT). MAS issued AI risk-management guidelines holding banks and insurers accountable for third-party AI tools, phased in from Oct 7, 2027 (ST), and Senior Minister of State Tan Kiat How said existing rules apply to agentic AI while safeguards are reviewed (BT). Transport Minister Jeffrey Siow said there will be no cap on autonomous vehicles, with Waymo to test here in 2027 (BT). MAS deputy chairman Chee Hong Tat said the 10-year SGS yield is 2.5%, about 250 basis points below Treasuries (BT). On power, Wood Mackenzie says Singapore will miss its 6-gigawatt 2035 low-carbon import target, with imports likely just 2% of the generation mix (BT), and the 200-MW Jurong Island battery does not count towards reserve margins (BT). Foreign Minister Vivian Balakrishnan said Singapore will deepen integration and widen ties as ASEAN chair in 2027, noting Taiwan overtook China as Singapore's largest trading partner in 2025 (ST). An FT feature carried by ST says China's 20% tax on dividends and interest from offshore trusts, collected from Oct 22, has rattled wealthy clients in Singapore (ST). On property, Hongkong Land's fund has yet to seal Marina One's commercial component, asking about S$5.7 billion (BT). Regionally, Malaysia's Anwar presents Budget 2027 on Oct 9 amid election speculation (BT)."}], "keyMetrics": [{"value": "87", "label": "Articles curated today", "sub": "WSJ 14 · ST 15 · BT 22 · SCMP 13 · TASS 18 · Xinhua 5"}, {"value": ">5.36%", "label": "US 10-year yield intraday, Oct 7", "sub": "24-year high; settled at 5.276% after a strong auction (WSJ)"}, {"value": "12+", "label": "Tanker attacks around Hormuz, Sept 28-Oct 5", "sub": "Most of any week since the war began, per three security sources (ST)"}, {"value": "US$42/bbl", "label": "Shell Q3 refining margin guidance", "sub": "A record, vs US$24 in Q2 (BT)"}, {"value": "S$8B+", "label": "OCBC market value lost, Oct 7", "sub": "Shares -5.9% to S$30.30 after Citi cut to sell (BT)"}, {"value": "US$3.40T", "label": "China forex reserves, end-September", "sub": "Down US$38.1B (1.11%), per SAFE (Xinhua)"}], "articles": [{"id": "wsj-08oct-01", "title": "AI Solved One Math Problem and Everyone Freaked Out. It Just Cracked Hundreds More.", "source": "WSJ", "date": "08 Oct 2026", "tags": ["Technology & AI"], "summary": "OpenAI on the night of Oct 6 published a collection of 722 papers containing AI solutions to more than 300 long-unsolved problems across number theory, algebraic geometry and other fields, including advances on three of the five remaining Millennium Prize Problems, among them the Riemann hypothesis. The company released 372 groups of results from roughly 4,000 problems attempted, with summaries of the model's chain of thought, a low-key rollout meant to win back mathematicians angered by AI hype after its earlier Millennium Prize claim. More than two dozen Fields Medal winners had published an open letter against the labs' race, and an advisory group issued publishing guidelines last week. OpenAI followed them except one: it rejected the call to stop testing advanced maths on proprietary models.", "url": "https://www.wsj.com/tech/ai/openai-ai-math-problems-millennium-prize-23d14511"}, {"id": "wsj-08oct-02", "title": "Bond Yields Are Surging Around the World—but Not in China", "source": "WSJ", "date": "08 Oct 2026", "tags": ["Finance & Markets"], "summary": "China's benchmark 10-year government bond yield fell to as low as 1.7% on Oct 7, more than 3 percentage points below the 5.3% on the equivalent US Treasury and well below UK, French and even Japanese yields, as a global bond rout pushes borrowing costs elsewhere to decades-old highs. Global yields are being driven by soaring government debt, the inflationary energy cost of the war in Iran and AI-fuelled growth optimism, while China faces booming exports but feeble consumption and a multiyear property slump. The People's Bank of China has been a net buyer of bonds this year, signalling comfort with lower yields. A savings glut bottled up by capital controls flows into bonds, and Chinese banks held 29 trillion yuan of bonds as of August, more than double 2022 levels.", "url": "https://www.wsj.com/finance/investing/bond-yields-are-surging-around-the-worldbut-not-in-china-efd4c694"}, {"id": "wsj-08oct-03", "title": "Fed officials didn’t make an urgent case for an immediate follow-on rate hike after raising interest rates in September, according to the minutes of the meeting.", "source": "WSJ", "date": "08 Oct 2026", "tags": ["Finance & Markets"], "summary": "Minutes of the Federal Reserve's September meeting, released Oct 7, showed officials unanimously backed the rate increase, the Fed's first in three years, but made no urgent case for a follow-on hike at the Oct 28 meeting. Most participants projected one more increase by year-end across the October and December meetings, with a small handful pencilling in both. New York Fed President John Williams and Vice Chair Philip Jefferson signalled last week there was little urgency to act in October, and the Oct 2 September jobs report showed average hourly earnings up 3%, the lowest in more than five years. Former Philadelphia Fed president Patrick Harker said rising long-term Treasury yields are already applying an economic brake, giving the Fed room to wait until December.", "url": "https://www.wsj.com/economy/central-banking/fed-minutes-signal-further-rate-increase-this-year-but-no-urgency-for-october-hike-54ec759f"}, {"id": "wsj-08oct-04", "title": "France Considers Issuing More Shorter-Term Debt After Bond-Market Turmoil", "source": "WSJ", "date": "08 Oct 2026", "tags": ["Finance & Markets", "Politics"], "summary": "In a WSJ interview, French Finance Minister Roland Lescure said France is considering issuing more shorter-term debt as investors grow wary of lending to the debt-laden country for longer periods, though he stressed the change would be \"at the margin\". A monthslong selloff has pushed long-term borrowing costs towards their highest since 2002, with the 10-year yield at 4.91% and the 2-year at 3.61% on Oct 7, a curve gap of about 1.3 percentage points. Lescure said a recent 10-year auction went smoothly but 30-year demand is trickier, and that carry-trade unwinding and quarter-end adjustments probably played a role, though he saw no net sellers. Shortening maturities from an average of 8.5 years carries the risk that rate spikes feed faster into interest bills.", "url": "https://www.wsj.com/world/europe/france-considers-issuing-more-shorter-term-debt-amid-bond-market-turmoil-db2966fd"}, {"id": "wsj-08oct-05", "title": "France’s Economy Is Trapped in a Negative Feedback Loop", "source": "WSJ", "date": "08 Oct 2026", "tags": ["Finance & Markets", "Politics"], "summary": "A WSJ analysis says political and fiscal uncertainty in France is now weighing on growth, making its debt harder to contain: the economy narrowly avoided recession in the second quarter and bond yields surged close to debt-crisis levels last week after a poorly received budget. Business investment has stagnated since 2024 and fell 0.3% in Q2 after a 0.8% drop in Q1, according to Insee, while debt rose 1.5 points to 119% of GDP. A Medef survey found 82% of firms pessimistic about the next government's policy. Berenberg's Holger Schmieding calls it \"a negative feedback loop\" and sees no return to decent growth until uncertainty is resolved, though the composite PMI turned expansionary in September.", "url": "https://www.wsj.com/economy/global/frances-economy-is-trapped-in-a-negative-feedback-loop-509598a9"}, {"id": "wsj-08oct-06", "title": "German Industrial Output Rebounds at Strongest Pace Since Early 2025", "source": "WSJ", "date": "08 Oct 2026", "tags": ["Finance & Markets"], "summary": "German industrial production rose 2.0% month on month in August, after a 1.2% fall in July, Destatis said on Oct 7, the strongest rise since March 2025 and well above the 0.5% economists polled by the WSJ expected. Output was up 2.3% year on year; the monthly rise was led by construction and mechanical equipment, which KfW's Sebastian Wanke linked partly to AI data-centre build-outs; car production fell and energy-intensive output dropped 0.5%. Factory orders published Oct 6 plummeted on a fall in big-ticket orders such as planes and military vehicles. Commerzbank's Ralph Solveen said the data suggest manufacturing did not decline in Q3, but any pickup is likely modest given structural problems, US tariffs and Chinese competition.", "url": "https://www.wsj.com/world/europe/german-industrial-output-rebounds-at-strongest-pace-since-early-2025-2de26cec"}, {"id": "wsj-08oct-07", "title": "IMF Chief Tells Economic Leaders: The Time to Act Is Now", "source": "WSJ", "date": "08 Oct 2026", "tags": ["Finance & Markets", "Energy", "Southeast Asia"], "summary": "In a curtain-raiser speech in Singapore on Oct 7 ahead of next week's IMF-World Bank meetings in Bangkok, IMF Managing Director Kristalina Georgieva said the global economy faces three crosscurrents: the rapid arrival of AI, persistently high energy prices and record public debt, now on track to exceed 100% of GDP. She said oil remains around US$100 a barrel, while Gulf gas supplies remain severely disrupted and US, German and Japanese 10-year yields are at their highest since 2007, 2009 and 1996. Georgieva called rate rises by the Fed, ECB and Bank of Japan \"highly appropriate\" and warned AI earnings disappointments could become a far-reaching shock. She urged high-debt advanced economies to adopt credible medium-term fiscal consolidation.", "url": "https://www.wsj.com/economy/global/imf-chief-tells-economic-leaders-the-time-to-act-is-now-cef10d0a"}, {"id": "wsj-08oct-08", "title": "Let Physics Regulate the AI Industry", "source": "WSJ", "date": "08 Oct 2026", "tags": ["Technology & AI", "Energy"], "summary": "In a WSJ op-ed, 2004 Nobel physics laureate Frank Wilczek argues that energy should be used as a hard red line to restrain the AI industry: no large new data centre or major extension should get permits or a grid connection unless its developer brings enough new carbon-free generation, storage and transmission online to meet its added demand and pays the full cost. He contrasts AI executives' calls to slow development with breakneck construction such as the Stargate data centre in Abilene, Texas. He argues voluntary restraint will fail under competitive pressure and that regulation works best tied to measurable physical acts, as with nuclear test bans. He writes: \"Gigawatts are measurable.\"", "url": "https://www.wsj.com/opinion/let-physics-regulate-the-ai-industry-e1ee9084"}, {"id": "wsj-08oct-09", "title": "Oracle, Broadcom and SpaceX Seek Blockbuster Debt Deals to Pay for AI Chips", "source": "WSJ", "date": "08 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Broadcom has been working to arrange more than US$50 billion in financing for OpenAI's custom AI chip, with Apollo and Blackstone among lenders approached, according to people familiar with the discussions, who said talks are early and the deal is expected to close before year-end. Oracle is separately in talks with Apollo and Goldman Sachs to fund a big chip purchase, likely via a separate vehicle that buys the chips for Oracle to lease, and SpaceX has discussed a US$40 billion Nvidia chip financing, according to a person familiar with the discussions. The deals reflect AI infrastructure costs that have pushed the public bond market to its limits, and new chip buyers such as OpenAI and Anthropic that lack the firepower to buy hardware outright.", "url": "https://www.wsj.com/tech/oracle-broadcom-and-spacex-seek-blockbuster-debt-deals-to-pay-for-ai-chips-848e8032"}, {"id": "wsj-08oct-10", "title": "Ripple, Crypto’s Payments Giant, Breaks Into Wall Street", "source": "WSJ", "date": "08 Oct 2026", "tags": ["Finance & Markets"], "summary": "Crypto firm Ripple has become a serious provider of swap financing to leveraged ETFs through Ripple Prime, the former Hidden Road prime brokerage it bought last year for US$1.25 billion, and on Oct 6 announced prime brokerage, clearing and financing services for hedge fund Brevan Howard. Nonbanks such as Ripple, Jane Street and Clear Street are gaining ground because banks face stricter risk rules and many new ETF issuers lack bank relationships. The US has 593 leveraged ETFs with more than US$256 billion in assets, per Morningstar Direct. Fees are lucrative: one Tradr fund pays Ripple roughly 8% of assets annualised, costs borne by investors, while a single-day drop above 50% could wipe out a fund.", "url": "https://www.wsj.com/finance/investing/ripple-cryptos-payments-giant-breaks-into-wall-street-7b506aa5"}, {"id": "wsj-08oct-11", "title": "Rising Rates Are Eroding the Value of Even the Most High-Flying Tech Stocks", "source": "WSJ", "date": "08 Oct 2026", "tags": ["Finance & Markets"], "summary": "Rising Treasury yields are compressing stock valuations even as the S&P 500 sits near records: the index trades at about 19.3 times forward earnings, down from 22.2 at the start of the year, and Nvidia's multiple has dropped significantly. The 10-year yield touched a 24-year high on Oct 7, surging above 5.36% before settling at 5.276% after a strong auction, following its steepest quarterly rise since 1994. Gains are concentrated: Microsoft, Nvidia, Apple and Meta added about 300 points in Q3 while the other 496 stocks subtracted 150, per Citadel Securities, and the equal-weighted index is down 5% since Aug 13. Strategists say earnings must keep beating as Q3 reporting starts next week with JPMorgan and Citigroup.", "url": "https://www.wsj.com/finance/stocks/rising-rates-are-eroding-the-value-of-even-the-most-high-flying-tech-stocks-fb420a5e"}, {"id": "wsj-08oct-12", "title": "The AI Luddites Won’t Win", "source": "WSJ", "date": "08 Oct 2026", "tags": ["Technology & AI", "Society"], "summary": "In a letter to the WSJ, reader Paul Freiberg of Neenah, Wis., agrees with Andy Kessler's Sept. 14 Inside View column that technology always finds a way around opposition. He says economists note the original Luddites acted rationally because they were losing their jobs, and that it is unsurprising unions oppose AI, though a balanced approach is needed to avoid pitfalls. Citing Mark Kurlansky's 2016 book on paper, he argues society develops technology to address its own changes, concluding that AI is here to stay and \"Luddites never win.\"", "url": "https://www.wsj.com/opinion/the-ai-luddites-wont-win-1f95c5bf"}, {"id": "wsj-08oct-13", "title": "Venture Firm Behind Chip Startup Groq Targets $10 Billion Megafund", "source": "WSJ", "date": "08 Oct 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Disruptive, the Dallas-based venture firm that backed chip startup Groq and Reflection AI, is raising up to US$10 billion for a new fund and has so far secured US$7.5 billion in commitments, according to people familiar with the matter. It plans to invest in roughly 10 late-stage companies over two years, joining an elite group of megafund managers which include firms such as Thrive Capital and Andreessen Horowitz that have raised more than US$10 billion for new funds this year. Founded in 2012 by Alex Davis, Disruptive gained prominence after Nvidia's US$20 billion licensing deal with Groq late last year. The firm previously invested largely through deal-by-deal SPVs, an approach that has lost favour in Silicon Valley.", "url": "https://www.wsj.com/finance/venture-firm-behind-chip-startup-groq-targets-10-billion-megafund-030ce4a0"}, {"id": "wsj-08oct-14", "title": "Zuckerberg’s Biohub Partners With DOE, NIH to Invest $1.8 Billion in Biological Data for AI Models", "source": "WSJ", "date": "08 Oct 2026", "tags": ["Technology & AI", "Society"], "summary": "Biohub, the nonprofit co-founded by Mark Zuckerberg, said on Oct 7 it is working with the Energy Department, the National Institutes of Health and other partners to invest US$1.8 billion in building AI-ready biological data to help researchers find new ways to prevent and treat diseases. The DOE will invest more than US$500 million over five years in lab measurement, modelling and computation for an open data resource. NIH will coordinate datasets developed through more than US$500 million in prior federal investment and work with Biohub to standardise them for AI training. Biohub's head of science Alex Rives said a predictive model of biology could let scientists perform experiments digitally.", "url": "https://www.wsj.com/tech/ai/zuckerbergs-biohub-partners-with-doe-nih-to-invest-1-8-billion-in-biological-data-for-ai-models-f8d5f799"}, {"id": "st-08oct-01", "title": "AI has potential to lift global growth by half a percentage point annually: IMF chief", "source": "ST", "date": "08 Oct 2026", "tags": ["Technology & AI", "Finance & Markets", "Southeast Asia"], "summary": "IMF managing director Kristalina Georgieva said in Singapore on Oct 7 that AI could lift global growth by up to half a percentage point a year, but only if it is \"done right\" and widely accessible, warning that its gains are bypassing most economies outside the US, China and India. Speaking at a curtain raiser for the IMF-World Bank annual meetings in Bangkok on Oct 12-18, she noted Singapore tops the IMF's AI preparedness index and that oil remains around US$100 a barrel; Gulf gas supply also remains severely impaired. She said global public debt is near post-World War II highs and said now may be a good time for a prudently hawkish bias. President Tharman Shanmugaratnam warned that, with governments running out of fiscal space, more of the burden of future crises will fall on central banks.", "url": "https://www.straitstimes.com/business/ai-has-potential-to-lift-global-growth-by-half-a-percentage-point-annually-imf-chief"}, {"id": "st-08oct-02", "title": "Attacks on tankers in Hormuz hit highest of any week since start of Iran war, sources say", "source": "ST", "date": "08 Oct 2026", "tags": ["Geopolitics", "Energy", "Defence"], "summary": "Attacks on tankers in the Strait of Hormuz in the week of Sept 28-Oct 5 were the most of any week since the US war with Iran began on Feb 28, according to three maritime security sources who counted at least 12 attacks on oil, LNG and LPG tankers. The UN's International Maritime Organization recorded nine incidents in the same week, versus eight in the next-closest week of July 13, though it tends to verify incidents more slowly. The US Navy-led Joint Maritime Information Center said on Oct 4 that Revolutionary Guards harassment, including drone overflights and VHF hailing, persisted. The surge comes as Gulf exporters topped pre-war levels for about half of September; India said on Oct 6 that 12 crew were injured when a projectile struck tanker On Peace.", "url": "https://www.straitstimes.com/world/middle-east/attacks-on-tankers-in-hormuz-hit-highest-of-any-week-since-start-of-iran-war-sources-say"}, {"id": "st-08oct-03", "title": "Australia’s top court backs grassroots group in landmark climate case on coal mine", "source": "ST", "date": "08 Oct 2026", "tags": ["Environment", "Energy"], "summary": "The High Court of Australia, ruling on its first climate change case, upheld a decision blocking MACH Energy's bid to extend its Mount Pleasant coal mine in New South Wales from December 2026 to 2048 and double output, which would have yielded an extra 406 million tons of coal. Justice James Edelman found the state's Independent Planning Commission erred by considering only 2% of the project's emissions and ignoring scope 3 emissions, which made up 98%. A community group led by retired teacher Wendy Wales brought the case; MACH said it was \"disappointed\". Industry groups including the Chamber of Minerals and Energy and Minerals Council of Australia warned the ruling creates uncertainty and sovereign-risk concerns for LNG and mining investment.", "url": "https://www.straitstimes.com/asia/australianz/australias-top-court-backs-grassroots-group-in-landmark-climate-case-on-coal-mine"}, {"id": "st-08oct-04", "title": "Denmark says Russia has conducted sabotage attacks against its defense firms", "source": "ST", "date": "08 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "An official from Denmark's national security and intelligence service (PET) told a Copenhagen conference on Oct 7 that Russia has begun carrying out sabotage operations against Danish companies supplying Ukraine, after concluding broader disruption had failed to deter NATO support. The official said planning in spring gave way to many more operations from early summer, now aimed at weapons production. Russia increasingly uses untrained proxies recruited via Telegram and social media, according to PET. The Russian embassy rejected the allegations as unfounded; Danish defence intelligence said last month Russia is likely to intensify hybrid attacks on the West.", "url": "https://www.straitstimes.com/world/europe/denmark-says-russia-has-conducted-sabotage-attacks-against-its-defense-firms"}, {"id": "st-08oct-05", "title": "Financial institutions must remain accountable for use of third-party AI tools: MAS", "source": "ST", "date": "08 Oct 2026", "tags": ["Technology & AI", "Finance & Markets", "Southeast Asia"], "summary": "The Monetary Authority of Singapore published guidelines on Oct 7 on AI risk management in the financial sector, stating that banks and insurers remain accountable for AI used in their services, including tools built or run by third parties. Institutions must keep an inventory of AI use cases, conduct risk assessments and apply proportionate controls, with stricter scrutiny for high-impact uses such as credit decisioning and insurance underwriting. Basic governance policies suffice for low-risk uses such as drafting e-mails, and a dedicated AI committee is not required. Foundational requirements take effect from Oct 7, 2027 and testing and human-control requirements from Oct 8, 2028, with MAS to consult on agentic AI guidance in 2027.", "url": "https://www.straitstimes.com/tech/financial-institutions-must-remain-accountable-for-use-of-third-party-ai-tools-mas"}, {"id": "st-08oct-06", "title": "Germany's AfD calls for end to support for Ukraine", "source": "ST", "date": "08 Oct 2026", "tags": ["Politics", "Geopolitics"], "summary": "Germany's far-right AfD will table a joint motion with the far-left BSW in Saxony-Anhalt's state parliament calling for an end to military support for Ukraine, an AfD spokesperson said on Oct 7. The motion, to be debated next week, has no direct effect on foreign policy, which is a federal matter, but underlines the AfD's push to restore ties with Russia. AfD state leader Ulrich Siegmund topped last month's Saxony-Anhalt election but fell just short of a majority and has been exploring cooperation with the BSW. The move follows a fruitless meeting between Foreign Minister Johann Wadephul and Sergei Lavrov, and Chancellor Friedrich Merz's weekend visit to Kyiv.", "url": "https://www.straitstimes.com/world/europe/germanys-afd-calls-for-end-to-support-for-ukraine"}, {"id": "st-08oct-07", "title": "Google, Unity launch platform to create video games from prompts", "source": "ST", "date": "08 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Alphabet's Google and Unity Software announced on Oct 7 a platform called Playground that lets users aged 18 and over generate and customise video games from text prompts with no coding. A more advanced Unity Spark experience with professional-level mechanics and high-fidelity 3D will be integrated later in 2026. The launch builds on Google's world-model work; its Project Genie prototype sent gaming stocks sharply lower in January, but the Oct 7 reaction was muted, with Unity little changed and Roblox down less than 1%. Bloomberg Intelligence analyst Nathan Naidu said the tie-up could ease fears AI will make Unity's software less necessary.", "url": "https://www.straitstimes.com/world/google-unity-launch-platform-to-create-video-games-from-prompts"}, {"id": "st-08oct-08", "title": "HSBC plans deep job cuts in UK wealth management business", "source": "ST", "date": "08 Oct 2026", "tags": ["Finance & Markets", "Technology & AI", "Society"], "summary": "HSBC Holdings plans to cut around half of management and specialist roles in its British wealth division and reduce its financial advisers by nearly 70%, according to people with knowledge of the matter, as it uses AI to serve affluent clients more efficiently. The bank is in a consultation process, and affected staff are expected to leave by the end of October, the people said; the Financial Times reported the plans earlier. HSBC said it is evolving to deliver more digitally enabled products. The cuts follow CEO Georges Elhedery's cost-cutting drive since September 2024, and come after Standard Chartered said in May it would cut more than 15% of its support workforce by 2030.", "url": "https://www.straitstimes.com/business/banking/hsbc-plans-deep-job-cuts-in-uk-wealth-management-business"}, {"id": "st-08oct-09", "title": "Hawkish Fed triggers emerging market outflows in September", "source": "ST", "date": "08 Oct 2026", "tags": ["Finance & Markets"], "summary": "Foreign investors pulled US$26.3 billion from emerging market stocks and bonds in September, the first monthly outflow since June, as a hawkish Fed under Kevin Warsh raised rates for the first time since 2023, lifting Treasury yields and the dollar, the Institute of International Finance reported on Oct 7. Equities lost US$19.2 billion, driven by heavy foreign selling of South Korean stocks after a 62% KOSPI rise in 2026, while fixed income saw US$7 billion of outflows, the first since March. The IIF said a hawkish Fed, a BoJ at its highest policy rate since 1995 and broad tightening raise the hurdle for EM carry into the fourth quarter. Year-to-date EM equity outflows reach US$113.9 billion.", "url": "https://www.straitstimes.com/business/hawkish-fed-triggers-emerging-market-outflows-in-september"}, {"id": "st-08oct-10", "title": "Micron workers at Taiwan plant vote to strike over bonuses", "source": "ST", "date": "08 Oct 2026", "tags": ["Technology & AI", "Society"], "summary": "Union members at Micron Technology's Taoyuan plant in Taiwan have voted to strike after bonus talks collapsed, with 1,994 of 2,012 voters in favour, the union said on Oct 7. No date has been set, and union head Jerry Lin urged Micron to present a concrete proposal after its board meeting on Oct 8-9 (US time); the larger Taichung union, representing about 11,000 workers, is continuing talks. The unions seek a one-off bonus of 83 months' salary and a permanent allocation of 15% of operating profit to quarterly worker bonuses, having rejected Micron's offer of up to 68 months' pay. Micron posted record fiscal 2026 revenue of about US$133 billion, up 256%.", "url": "https://www.straitstimes.com/asia/east-asia/micron-workers-at-taiwan-plant-vote-to-strike-over-bonuses"}, {"id": "st-08oct-11", "title": "S’pore aims to deepen integration, widen external ties as ASEAN chair in 2027: Vivian Balakrishnan", "source": "ST", "date": "08 Oct 2026", "tags": ["Southeast Asia", "Geopolitics"], "summary": "Foreign Minister Vivian Balakrishnan said on Oct 7 that Singapore will aim to deepen ASEAN integration and widen partnerships beyond traditional dialogue partners, including the EU, Canada, Africa, South America and the Pacific Islands, when it chairs the bloc in 2027. Speaking at the Milken Institute Asia Summit 2026, he said ASEAN wants to be assessed on its merits, \"not as another arena for proxy wars\", and noted first-half 2026 growth of over 8% in Vietnam, 6.1% in Singapore and over 5% in Malaysia and Indonesia. He said Taiwan overtook China as Singapore's largest trading partner in 2025, driven by AI and semiconductors. He cited the UN High Seas Treaty as proof global rules can still be agreed.", "url": "https://www.straitstimes.com/singapore/politics/spore-to-deepen-integration-widen-external-ties-as-asean-chair-in-2027-vivian-balakrishnan"}, {"id": "st-08oct-12", "title": "Taiwan indicts 10 for alleged resale of US chips to China", "source": "ST", "date": "08 Oct 2026", "tags": ["Trade", "Defence", "Technology & AI"], "summary": "Taiwanese prosecutors have indicted 10 Taiwanese people for allegedly using forged documents to obtain export-controlled US chips and ship them to China, with the indictment saying the end-users were evidently China's military industry. The New Taipei District Prosecutors Office says Chen Chien-hsiung, who heads several tech companies, and his co-defendants posed since 2017 as the National Chung-Shan Institute of Science and Technology to buy chips from Analog Devices and Texas Instruments. They allegedly relabelled chips made in the Philippines, South Korea and Singapore as non-controlled \"made in Taiwan\" products and exported them to Hong Kong for profit of over NT$300 million. Prosecutors seek 10 years' jail for Chen.", "url": "https://www.straitstimes.com/asia/east-asia/taiwan-indicts-10-for-alleged-resale-of-us-chips-to-china"}, {"id": "st-08oct-13", "title": "Taiwan’s US envoy says ties robust after Trump-Xi summit", "source": "ST", "date": "08 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "Taiwan's de facto ambassador to Washington, Alexander Yui, said on Oct 7 that US-Taiwan ties remain robust after September's Trump-Xi summit, while stressing the need for timely delivery of US defence equipment. President Donald Trump has held back a US$14 billion arms package for Taipei to preserve a trade truce with Xi Jinping, having approved an US$11 billion package in December, and called it a \"very good negotiating chip\" after meeting Xi in Beijing in May. Yui welcomed the arrival of the first two new F-16s and said Taiwan's preparedness is not built around any single date. Foreign Minister Lin Chia-lung called the US and Taiwan truly symbiotic partners, citing TSMC's Arizona investments.", "url": "https://www.straitstimes.com/asia/east-asia/taiwans-us-envoy-says-ties-robust-after-trump-xi-summit"}, {"id": "st-08oct-14", "title": "The taxman comes for China’s offshore riches", "source": "ST", "date": "08 Oct 2026", "tags": ["Finance & Markets", "Politics", "Southeast Asia"], "summary": "An FT feature carried by ST reports that China will from Oct 22 begin collecting a 20% tax on dividends and interest from offshore trusts held by wealthy Chinese, under rules announced on July 24 that apply retroactively to 2023-2025 gains and add a one-off 20% tax on inheritance or loss of tax residency. According to officials, bankers and advisers, Chinese banks have been told to review wealthy clients' overseas investments, in some cases back to 2000. The move has rattled Hong Kong, Singapore and Tokyo; Haidilao co-founder Shu Ping sold over US$350 million of shares, which analysts speculated was to pay tax. Two bankers say Morgan Stanley's New York wealth unit is seeing a sharp rise in transfers from Chinese clients in Hong Kong and Singapore.", "url": "https://www.straitstimes.com/opinion/the-taxman-comes-for-chinas-offshore-riches"}, {"id": "st-08oct-15", "title": "Tokyo Stock Exchange to remove nearly 700 firms from Topix and add 35 in major reform", "source": "ST", "date": "08 Oct 2026", "tags": ["Finance & Markets"], "summary": "The Tokyo Stock Exchange plans to remove nearly 700 firms from its Topix index and add 35 in the first major reshuffle of its main benchmark, leaving 986 constituents, about 40% fewer than now, according to JPX Market Innovation and Research. Joiners include Trial Holdings, Workman and autonomous-driving startup Tier IV, while Pasona Group and Tsubaki Nakashima are among those removed. Weightings of deleted stocks will be cut to zero by July 2028, and a second regular reshuffle will take place in October 2027. The Topix is tracked by large institutions including the Government Pension Investment Fund.", "url": "https://www.straitstimes.com/business/tokyo-stock-exchange-to-remove-nearly-700-firms-from-topix-and-add-35-in-major-reform"}, {"id": "bt-08oct-01", "title": "‘Diverging’ trajectories: Taiwan dethrones South Korea atop global markets as AI trade widens", "source": "BT", "date": "08 Oct 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Taiwan's Taiex has overtaken South Korea's Kospi as the world's best-performing major equity index in 2026, up 72% versus about 65%, after beating it by about 23 percentage points last quarter, the widest margin since the turn of the century. Investors cite Taiwan's broader AI supply-chain exposure across chip design, packaging, networking and servers, while Korea remains concentrated in Samsung Electronics and SK Hynix, whose shares fell 19% to 33% in the three months to September. In a September Bank of America survey, 40% of fund managers were overweight Taiwan versus 25% for Korea. Societe Generale prefers Taiwan, expecting memory price gains to slow, though Citigroup's Peter Lee argues the market underestimates 2027 HBM demand.", "url": "https://www.businesstimes.com.sg/companies-markets/capital-markets-currencies/diverging-trajectories-taiwan-dethrones-south-korea-atop-global-markets-ai-trade-widens"}, {"id": "bt-08oct-02", "title": "AI bubble may burst soon amid financing concentration, rising rates: Ray Dalio", "source": "BT", "date": "08 Oct 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Bridgewater Associates founder Ray Dalio said at the Forbes Global CEO Conference in Singapore on Oct 7 that AI is a \"classic bubble\" nearing the point of bursting as debt grows and interest rates rise. He cited sector concentration and investors' rising borrowing to keep investing in the theme. Franklin Templeton CEO Jenny Johnson warned that AI financing via private credit and off-balance-sheet structures is increasingly hard to trace, while Temasek CEO Dilhan Pillay said heavy capital flows into AI infrastructure may drive up the overall cost of capital. Dalio still sees opportunities in Asean, undiscovered AI beneficiaries, commodities and short positions on debt.", "url": "https://www.businesstimes.com.sg/companies-markets/ai-bubble-may-burst-soon-amid-financing-concentration-rising-rates-ray-dalio"}, {"id": "bt-08oct-03", "title": "Apple’s smart home push includes doorbell, lock, thermostat co-developed with LG", "source": "BT", "date": "08 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Apple's smart home push, with new devices set to be introduced on Oct 13, will include a doorbell, thermostat, smart deadbolt lock and security cameras co-developed with LG Electronics, according to people with knowledge of the matter. The accessories will carry the LG brand, with LG handling manufacturing and support, and will work with Apple's new smart home hub, an upgraded HomePod mini and a new TV set-top box. LG's filings with the US FCC and UL Solutions list the devices but not Apple's involvement, and the products are not expected to reach consumers for at least a few more months. The ecosystem marks a reboot of Apple's 2014 HomeKit platform against Amazon's Ring and Google's Nest.", "url": "https://www.businesstimes.com.sg/startups-tech/technology/apples-smart-home-push-includes-doorbell-lock-thermostat-co-developed-lg"}, {"id": "bt-08oct-04", "title": "Brookfield denies accusation it cut Soilbuild out of Mapletree deal", "source": "BT", "date": "08 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Brookfield Asset Management has denied in Singap
