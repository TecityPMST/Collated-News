e Singapore National Employers Federation (SNEF) said. Those expecting uncertain prospects fell to 63 per cent from 72 per cent. SNEF flagged an increasingly K-shaped economy, with outward-oriented sectors buoyed by external and tech demand while retail and F&B grapple with weak demand and rising costs. Some 54 per cent will not add staff, though 40 per cent plan to hire. Just over half plan wage moderation or freezes; 86 per cent still commit to built-in raises for lower-wage workers. Rising manpower cost remains the top challenge, flagged by 83 per cent. The survey polled 320 firms employing nearly 160,000 workers.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/Over%20half%20of%20employers%20plan%20hiring%20freeze,%20wage%20moderation%20despite%20better%20outlook%20SNEF%20pol.pdf"},{"id":"bt-15","title":"Singapore records S$1.3 billion inflow of funds in Q2, led by higher allocation funds: Morningstar","source":"BT","date":"4 Sep 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"Funds in Singapore recorded net inflows of S$1.3 billion in the second quarter of 2026, driven by allocation funds, Morningstar data showed. Though down from S$3.2 billion in the first quarter, first-half inflows reached S$4.5 billion, significant versus historical norms, said senior analyst Arvind Subramanian. Allocation funds drew S$1.8 billion, up from S$1.5 billion. Equity funds posted S$93.3 million in net outflows, reversing Q1 inflows, but Subramanian noted rising underlying interest in Singapore equities, aided by the Equity Market Development Programme boosting small and mid-cap allocations. Managers are hiring Singapore-focused analysts and eyeing more IPOs to match inflows. Fixed-income funds saw outflows widen to S$288.9 million amid bond-market volatility, though investors still prefer less-volatile Singapore bonds over global fixed income.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/Singapore%20records%20S1.3%20billion%20inflow%20of%20funds%20in%20Q2,%20led%20by%20higher%20allocation%20funds%20Morni.pdf"},{"id":"bt-16","title":"Trump puts tariffs of up to 100% on foreign-made drones","source":"BT","date":"4 Sep 2026","tags":["Trade","Geopolitics","Technology & AI"],"summary":"The Trump administration imposed tariffs of up to 100 per cent on drones, continuing efforts to thwart China's drone industry and promote domestic manufacturing. The 100 per cent levy applies to drones weighing over 24.9 kg or using thermal imaging, mostly Chinese-made and used by law enforcement; smaller drones face 25 per cent. Trump, whose two eldest sons have US drone-industry ties, announced the levies after a Commerce probe deemed foreign-drone reliance a security threat. Shenzhen-based DJI makes over 70 per cent of the world's commercial drones. Critics call it protectionism. Allied drones face lower levies: 15 per cent for the EU, Japan, South Korea, Switzerland and Taiwan, 10 per cent for Britain. A separate FCC proposal could reclassify many drones as military grade.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/Trump%20puts%20tariffs%20of%20up%20to%20100%20on%20foreign-made%20drones.pdf"},{"id":"bt-17","title":"Trump says renewed US campaign against Iran won't last long","source":"BT","date":"4 Sep 2026","tags":["Geopolitics","Defence"],"summary":"US President Donald Trump said the renewed US campaign against Iran would not continue for too long, following the biggest exchange of fire between Teheran and Washington since July. Speaking to reporters in the Oval Office, Trump said Iran was trying to build a rocket that drops mines and that the US had destroyed it. He also said Iran had been working to restore its radar and missile systems, which were targeted in the US strikes. \"We took out all of the new equipment that they tried to build along the Strait of Hormuz, some defensive, some offensive,\" he said, describing a very heavy attack and adding that the US is prepared to strike again at any time.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/Trump%20says%20renewed%20US%20campaign%20against%20Iran%20won't%20last%20long.pdf"},{"id":"bt-18","title":"US Fed survey shows economic activity edged up, prices rose moderately in recent weeks","source":"BT","date":"4 Sep 2026","tags":["Finance & Markets","Politics"],"summary":"US economic activity increased modestly, employment rose slightly and prices climbed moderately in recent weeks, the Federal Reserve's Beige Book showed, offering little clarity ahead of the Sep 15-16 meeting. The general outlook was positive but sentiment was mixed amid uncertainty over energy prices, policy and international conflict. Price increases slowed in three of 12 districts. The Fed has held its benchmark rate at 3.5-3.75 per cent since December, but five of 19 policymakers feel a hike is past due. Expectations rose after chairman Kevin Warsh flagged inflation as his predominant focus; markets price a 65 per cent chance of a hike. Input pressures were elevated in manufacturing and construction, tariff impacts persisted, and housing weakness was widespread. AI and data-centre demand featured prominently.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/US%20Fed%20survey%20shows%20economic%20activity%20edged%20up,%20prices%20rose%20moderately%20in%20recent%20weeks.pdf"},{"id":"bt-19","title":"US Fed's Waller says safety premium for Treasuries is gone, pushing neutral rate higher","source":"BT","date":"4 Sep 2026","tags":["Finance & Markets","Politics"],"summary":"Federal Reserve Governor Christopher Waller said the safety premium for safe, liquid US government debt has largely disappeared, pushing the neutral level of interest rates higher and implying higher policy rates for any given inflation rate. Speaking at a Reuters Next event, he attributed rising yields to fiscal concerns and competition for capital from AI infrastructure investment, citing Stanford research showing the premium eroded over years. Waller said that to grow out of a US$40 trillion debt load, structural deficits must fall toward zero from around 6 per cent of GDP. He urged patience, saying \"give disinflation a chance,\" and is inclined to hold rates if inflation cools. His comments pushed the benchmark Treasury yield to 4.74 per cent. He dismissed the effectiveness of Bessent's expanded bond buybacks.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/US%20Fed's%20Waller%20says%20safety%20premium%20for%20Treasuries%20is%20gone,%20pushing%20neutral%20rate%20higher.pdf"},{"id":"bt-20","title":"US weekly jobless claims rise marginally amid stable labour market","source":"BT","date":"4 Sep 2026","tags":["Finance & Markets","Politics"],"summary":"US initial jobless claims rose marginally last week, suggesting no material shift in labour conditions at the end of August. Claims climbed 2,000 to a seasonally adjusted 206,000 for the week ended August 29, near economists' 205,000 forecast and in the lower end of this year's 189,000-230,000 range, consistent with a \"slow hire, slow fire\" market. Employers remain hesitant amid aggressive trade and immigration policies; Challenger data showed planned hiring up 37 per cent but positions filling slowly, while planned job cuts rose 58 per cent to 52,881 in August. Continuing claims rose 8,000 to 1.779 million. The government is expected to report Friday that nonfarm payrolls rebounded 56,000 after July's 23,000 decline, with unemployment steady at 4.1 per cent. Economists expect a possible Fed hike this month.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/US%20weekly%20jobless%20claims%20rise%20marginally%20amid%20stable%20labour%20market.pdf"},{"id":"bt-21","title":"Wealth of Singapore's 50 richest diverges as OCBC, Sheng Siong boom offsets tech slide","source":"BT","date":"4 Sep 2026","tags":["Finance & Markets","Southeast Asia","Technology & AI"],"summary":"The aggregate net worth of Singapore's 50 richest stayed flat at US$239 billion in Forbes Asia's latest list, as gains at OCBC and Sheng Siong offset a nearly US$16 billion combined decline for Facebook co-founder Eduardo Saverin and Sea's founders. The Lee family of OCBC was the biggest gainer, up 78 per cent to US$13.8 billion for fourth place, as the bank's shares nearly doubled. Sheng Siong's Lim Hock Chee reached US$2.7 billion. City Developments' Kwek Leng Beng ranked second at US$16.1 billion, with Far East Organization's Ng family third at US$14.3 billion. Saverin held first at US$32.9 billion despite a US$10.1 billion fall as Meta shares dropped 25 per cent. Sea founders lost US$5.9 billion. Thirty-five entrants grew wealthier year-on-year.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/Wealth%20of%20Singapore's%2050%20richest%20diverges%20as%20OCBC,%20Sheng%20Siong%20boom%20offsets%20tech%20slide.pdf"},{"id":"bt-22","title":"White House pressures US space firms to skip Paris space summit: sources","source":"BT","date":"4 Sep 2026","tags":["Geopolitics","Technology & AI","Politics"],"summary":"The Trump administration pressured US space companies not to attend a high-profile space summit in Paris organised by French President Emmanuel Macron, triggering a last-minute reshuffle and cancellation of some announcements, sources said. The White House Office of Science and Technology Policy held a call warning that attendance at the Sep 9-10 event could suggest support for European policy positions the US disagrees with. The summit features Macron and European Commission President Ursula von der Leyen as Europe ramps up civil and military space investment and reduces reliance on US firms like Elon Musk's SpaceX. SpaceX will no longer attend. An OSTP official said the administration continues to collaborate with allies. Organiser Philippe Adam said US and Chinese economic players were invited and broad participation matters.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/White%20House%20pressures%20US%20space%20firms%20to%20skip%20Paris%20space%20summit%20sources.pdf"},{"id":"bt-23","title":"Yen rallies sharply as markets raise bets on Bank of Japan rate hikes; US dollar drops","source":"BT","date":"4 Sep 2026","tags":["Finance & Markets"],"summary":"The yen extended gains on Thursday after a sudden burst higher, though traders attributed the move to rising bets on Bank of Japan rate hikes rather than intervention. The US dollar dropped 1.5 per cent to 156.17 yen, its strongest in a month, with the euro sliding over 1 per cent. The rally followed hawkish comments from BOJ board member Hajime Takata urging nimble rate hikes; Citi called them the strongest board messaging yet. A September BOJ hike is nearly fully priced. Since a rare US-Japan joint intervention on Jul 31, the yen struggled amid wide rate differentials and energy-price spikes. ING's Chris Turner said a Fed hike would limit the dollar's fall. Markets price a 61 per cent chance of a September Fed hike.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/Yen%20rallies%20sharply%20as%20markets%20raise%20bets%20on%20Bank%20of%20Japan%20rate%20hikes%20US%20dollar%20drops.pdf"},{"id":"bt-24","title":"Yen traders brace for holiday intervention risk around Bank of Japan","source":"BT","date":"4 Sep 2026","tags":["Finance & Markets"],"summary":"Yen traders are on heightened alert for possible intervention around the Bank of Japan's upcoming policy meeting, with a three-day holiday afterwards offering authorities a chance to act in thinner trading. The yen gained as much as 0.5 per cent to 157.99 on Thursday as traders priced in a larger than 25-basis-point hike at the Sep 18 meeting. In April, authorities waited for a long holiday to intervene for the first time since 2024, and investors speculate a similar Silver Week tactic. The yen has been pressured by elevated oil prices and wide US rate gaps, despite Japan spending a record US$96.4 billion over the past month. Finance Minister Satsuki Katayama and Treasury Secretary Scott Bessent said they would re-enter markets if needed; analysts see intervention likely near 160.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/Yen%20traders%20brace%20for%20holiday%20intervention%20risk%20around%20Bank%20of%20Japan.pdf"},{"id":"scmp-01","title":"About 4 in 5 young, affluent investors in mainland China turn to offshore assets: study","source":"SCMP","date":"4 Sep 2026","tags":["Finance & Markets","Society"],"summary":"A CFA Institute study found about 81 per cent of surveyed young, affluent mainland Chinese investors held offshore assets, averaging 43 per cent of their portfolios. The December survey covered 300 investors aged 18 to 44. Those with international experience were most exposed, with 93 per cent holding offshore assets averaging 45 per cent of portfolios. Tier-one city investors allocated 45 per cent offshore versus 40 per cent elsewhere. Wealth preservation was the top motive (55 per cent), followed by diversification (54 per cent) and tracking global trends (50 per cent); 44 per cent sought unavailable investment types and 41 per cent hedged domestic or currency risks. The institute said advisers need cross-border capabilities despite China's capital controls.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/About%204%20in%205%20young,%20affluent%20investors%20in%20mainland%20China%20turn%20to%20offshore%20assets%20study.pdf"},{"id":"scmp-02","title":"Are Z.ai and MiniMax heading down opposite financial paths months after Hong Kong IPOs?","source":"SCMP","date":"4 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"First-half earnings suggest diverging trajectories for two Chinese AI firms that listed in Hong Kong in January. Beijing-based Z.ai (Zhipu AI) posted a near-400 per cent revenue surge to 953.9 million yuan (US$142 million), while Shanghai rival MiniMax grew 283 per cent to US$116.6 million. Z.ai co-founder Tang Jie said annual recurring revenue hit US$1.6 billion in August; MiniMax's Yan Junjie claimed US$800 million, but later admitted the figure annualised a single week's revenue, which Gavekal analyst Tilly Zhang called \"creative\". On the Artificial Analysis Intelligence Index, MiniMax's M3 scored 45, trailing Z.ai's GLM-5.3 and Moonshot's Kimi K3, both at 60. HSBC more than halved MiniMax's price target.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/Are%20Z.ai%20and%20MiniMax%20heading%20down%20opposite%20financial%20paths%20months%20after%20Hong%20Kong%20IPOs.pdf"},{"id":"scmp-03","title":"As hordes head to Shenzhen, Hong Kong bars, restaurants sign up for more floor space","source":"SCMP","date":"4 Sep 2026","tags":["Society","Finance & Markets"],"summary":"Hong Kong food and beverage operators leased 155,000 sq ft of new floor space in the second quarter, a sector record and more than double the first quarter, according to CBRE. First-half take-up reached 230,000 sq ft. Analysts said a selective, narrow retailing recovery is forcing brands to adopt novel tactics, with F&B operators incorporating experiential elements, said CBRE's Lawrence Wan. Examples cited include live music, native Korean-speaking staff, drinking games with chefs and curated vintage furniture. JLL pointed to immersive concepts such as Le Petit Chef and The Magic Table at Grand Hyatt, dining-in-darkness at Dans le Noir, and narrative-led venues like Jing, as diners increasingly view food as one part of the total experience.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/As%20hordes%20head%20to%20Shenzhen,%20Hong%20Kong%20bars,%20restaurants%20sign%20up%20for%20more%20floor%20space.pdf"},{"id":"scmp-04","title":"Asia is not on the edge of a new 1997-style financial crisis","source":"SCMP","date":"4 Sep 2026","tags":["Finance & Markets"],"summary":"This opinion piece argues Asia is not facing a repeat of the 1997 financial crisis, despite market alarmism over rising interest rates and an AI-fuelled stock bubble. In an August 31 report titled \"Nope, it's not 1997\", HSBC said differences outweigh similarities but noted parallels: sharply higher US Treasury yields, a collapsing Japanese yen and excessive technology-sector optimism. The author contends these risks are unrelated to the policy and structural weaknesses behind 1997. Former victims Thailand, Malaysia, Indonesia and South Korea have shed those deficiencies, jettisoning rigid currency pegs, tightening monetary policy, stemming capital outflows and reforming corporate and financial sectors. The IMF credited such strategies with restoring confidence and reviving growth by late 1998, alongside improved current accounts.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/Asia%20is%20not%20on%20the%20edge%20of%20a%20new%201997-style%20financial%20crisis.pdf"},{"id":"scmp-05","title":"Beijing ramps up coastguard patrols and scientific surveys near Taiwan","source":"SCMP","date":"4 Sep 2026","tags":["Geopolitics","Defence"],"summary":"Beijing said it conducted a routine patrol in waters east of Taiwan on Thursday, the latest in weeks of ramped-up coastguard and vessel activity that has alarmed the island. China Coast Guard spokesman Jiang Lue said a formation led by the Putuoshan vessel carried out a \"law enforcement\" patrol, vowing to strengthen control over waters under Chinese jurisdiction. The surge follows the opening of Japan-Philippines maritime delimitation talks that Beijing calls illegal. Chinese media also reported a marine geophysical survey east of Taiwan by the Ministry of Natural Resources from August 10 to 31, and earlier deployment of research vessel Xiangyanghong 22. Beijing views Taiwan as part of China and has not ruled out using force to achieve reunification.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/Beijing%20ramps%20up%20coastguard%20patrols%20and%20scientific%20surveys%20near%20Taiwan.pdf"},{"id":"scmp-06","title":"ByteDance to expand massive AI data centre cluster in Inner Mongolia, source says","source":"SCMP","date":"4 Sep 2026","tags":["Technology & AI"],"summary":"TikTok parent ByteDance is seeking to expand computing capacity by building more data centres in Inner Mongolia over the next two years, a person familiar said, underscoring Chinese tech giants' AI infrastructure push. The company held preliminary talks with local vendors to add five to six gigawatts of compute in Ulanqab. With a one-gigawatt AI data centre costing about 160 billion yuan (US$23.8 billion) per a Soochow Securities note, the facility could cost roughly 800 billion to 960 billion yuan, targeting early-2028 delivery in Ulanqab's Jining district, which also hosts Huawei, Kuaishou, Alibaba and Apple facilities. ByteDance reportedly secured a US$29.6 billion loan. Alibaba's capital expenditure rose 75 per cent and Tencent's jumped 176 per cent in recent quarters.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/ByteDance%20to%20expand%20massive%20AI%20data%20centre%20cluster%20in%20Inner%20Mongolia,%20source%20says.pdf"},{"id":"scmp-07","title":"China prepares next phase of national SME fund to boost tech start-ups and IPOs","source":"SCMP","date":"4 Sep 2026","tags":["Finance & Markets","Technology & AI"],"summary":"China will soon launch the second phase of its National SME Development Fund, focusing on IPO incubation and channelling private capital into early-stage hard-tech firms. The move was confirmed as the Ministry of Industry and Information Technology, with nine other agencies, released the 15th five-year plan for SME development. The fund's first phase, established in September 2015, had by March spawned 46 sub-funds with over 120 billion yuan (US$17.6 billion) invested in more than 2,000 enterprises and 92 IPOs, with roughly 15 per cent overall returns, per China Galaxy Securities. Analyst Wu Jing said the fund can help early-stage tech firms held back by light assets and high risk. Regional platforms will build boards for \"little giant\" SMEs.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/China%20prepares%20next%20phase%20of%20national%20SME%20fund%20to%20boost%20tech%20start-ups%20and%20IPOs.pdf"},{"id":"scmp-08","title":"China rejects G20 trade-imbalance claims, says no need to devalue yuan","source":"SCMP","date":"4 Sep 2026","tags":["Trade","Finance & Markets","Geopolitics"],"summary":"China pushed back at critics of its trade imbalances at a G20 gathering, with the central bank denying it deliberately pursues surpluses and vowing not to weaponise the yuan. PBOC governor Pan Gongsheng said China remains committed to expanding domestic demand, adding that addressing global imbalances requires structural reforms in all countries. China's trade surplus hit a record US$1.2 trillion last year. US Treasury Secretary Scott Bessent called the surplus \"unsustainable\" and blamed Beijing for the group failing to issue a unanimous statement; the US instead released a text agreed by all present except China. Commerce ministry spokeswoman Huang Ling accused Washington of hyping \"economic imbalances\" and \"overcapacity\" to promote protectionism and pressure China.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/China%20rejects%20G20%20trade-imbalance%20claims,%20says%20no%20need%20to%20devalue%20yuan.pdf"},{"id":"scmp-09","title":"China's new home finance rules reduce buyer risks but may not revive the market: analysts","source":"SCMP","date":"4 Sep 2026","tags":["Finance & Markets"],"summary":"China's new housing finance rules reduce the risk of buying pre-sold homes but analysts doubt they will tempt hesitant buyers facing falling prices. Mortgage funds for pre-sold homes will be released only after project completion filing, when homes are certified safe, rather than when the main structure is finished; the maximum mortgage term extends to 40 years from 30. The measures address buyers left paying mortgages on unfinished homes during the property downturn. Bank of America's Karl Choi said the reform is \"the right thing to do\" but not primarily aimed at stimulating demand, which is tied to the economic outlook and price expectations. Fitch expects limited near-term impact; Barclays noted longer terms raise total interest paid.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/China's%20new%20home%20finance%20rules%20reduce%20buyer%20risks%20but%20may%20not%20revive%20the%20market%20analysts.pdf"},{"id":"scmp-10","title":"China's robot revolution may not arrive in the way you expect","source":"SCMP","date":"4 Sep 2026","tags":["Technology & AI"],"summary":"This analysis argues China's robotics boom is splitting into two bets. At last month's World Robot Conference in Beijing, humanoids sorted parcels and performed chores, while Unitree Robotics closed its Shanghai market debut at more than five times its offer price. One approach packs capability into versatile humanoid bodies; the other spreads useful intelligence across different bodies. Unitree founder Wang Xingxing conceded a software breakthrough for unfamiliar tasks could take two to three years or up to a decade. The piece notes the physical world's difficulty and questions priorities, given 12.4 per cent global youth unemployment last year. Stanford's Fei-Fei Li frames the challenge as spatial intelligence, reasoning that robots need not look human.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/China's%20robot%20revolution%20may%20not%20arrive%20in%20the%20way%20you%20expect.pdf"},{"id":"scmp-11","title":"Chinese military's AI attack chain lags foreign models: researchers","source":"SCMP","date":"4 Sep 2026","tags":["Defence","Technology & AI"],"summary":"China's military AI models trail foreign equivalents and concentrate on support rather than combat functions, according to a study by Chinese researchers affiliated with the Armed Police Force Shandong Corps and the Engineering University of People's Armed Police, published in Defence Industry Conversion in China in July. The authors said military AI is mainly used in auxiliary fields such as intelligent question-answering and content generation, lagging foreign large language models, while offensive combat applications remain exploratory. The paper appears as AI becomes central to US-China strategic competition, with the Pentagon calling for an \"AI-first\" force. In August, CCTV reported the PLA air force used an \"intelligent-strike planning system\" for operations involving over 100 units. The paper drew heavily on US Military Review analysis.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/Chinese%20military's%20AI%20attack%20chain%20lags%20foreign%20models%20researchers.pdf"},{"id":"scmp-12","title":"Extra funds push Taiwan's defence spending past NT$1 trillion for the first time","source":"SCMP","date":"4 Sep 2026","tags":["Defence","Geopolitics"],"summary":"Taiwan's cabinet approved a supplementary defence budget of NT$145.7 billion (US$4.6 billion) on Thursday, pushing total defence-related spending this year above NT$1 trillion for the first time. The funding lifts spending from 3.32 per cent to about 3.83 per cent of GDP, the highest in decades, and fills gaps after opposition lawmakers cut NT$470 billion in May from an eight-year special package. Of the additional funds, NT$133.4 billion goes to military investment, including the locally developed Chiang Kung anti-tactical ballistic missile system (NT$13 billion), uncrewed systems (NT$55.9 billion) and two classified programmes (NT$64.5 billion). Premier Cho Jung-tai said defence \"cannot afford a gap\", targeting over 600 surveillance drones and 40,000 coastal attack drones to strengthen asymmetric warfare capabilities.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/Extra%20funds%20push%20Taiwan's%20defence%20spending%20past%20NT1%20trillion%20for%20the%20first%20time.pdf"},{"id":"scmp-13","title":"Hong Kong regulator reclassifies certain funds with exposure to private markets","source":"SCMP","date":"4 Sep 2026","tags":["Finance & Markets"],"summary":"Hong Kong's Securities and Futures Commission has reclassified authorised funds with private market exposure above 50 per cent of net asset value as complex products, raising the threshold for selling them to retail investors. The regulator said it observed funds gaining indirect exposure through layered structures and complex instruments that may lack transparency, making underlying risks hard for retail investors to grasp. Citing low liquidity, valuation challenges and higher credit risks, the SFC said such funds must enhance disclosure. Complex products are subject to selling requirements including suitability checks. The move follows heightened attention to private credit risks; last December HSBC Asset Management suspended a retail fund involving private credit. New fund applications may face closer scrutiny outside the FASTrack process.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/Hong%20Kong%20regulator%20reclassifies%20certain%20funds%20with%20exposure%20to%20private%20markets.pdf"},{"id":"scmp-14","title":"Iran targets US bases in Kuwait despite warnings from Trump","source":"SCMP","date":"4 Sep 2026","tags":["Geopolitics","Defence"],"summary":"Iran attacked US military bases in Kuwait on Thursday with missiles and drones, despite President Donald Trump threatening further strikes six months into the war. Trump said the US was prepared to attack Iran \"any time we want\" after bombardment left at least 19 Iranians dead. Tehran retaliated by hitting US targets in Kuwait, Jordan, the UAE, Bahrain and Iraq's Kurdistan region. Iran maintains a stranglehold on the Strait of Hormuz oil route while the US presses a counter-blockade of Iranian ports. The latest round began when Washington struck Iranian targets on Sunday, saying it was stopping Tehran from placing sea mines. Energy Secretary Chris Wright pledged \"maximum pressure\" sanctions; Trump mused renaming the strait \"Trump Strait\".","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/Iran%20targets%20US%20bases%20in%20Kuwait%20despite%20warnings%20from%20Trump.pdf"},{"id":"scmp-15","title":"Mexican foreign minister to meet Wang Yi in China as US demands trade ties rollback","source":"SCMP","date":"4 Sep 2026","tags":["Geopolitics","Trade"],"summary":"Mexican Foreign Affairs Secretary Roberto Velasco arrives in China on Sunday for his first official visit, as Mexico navigates US pressure to roll back Chinese trade ties. The two-day trip comes at the invitation of Foreign Minister Wang Yi; Velasco will meet Wang in Beijing then inaugurate Mexico's new Chongqing consulate. Beijing said it expects the visit to deepen political trust and promote steady growth of ties. Velasco faces a delicate balance, with the US pressuring Mexico to mirror its barriers against Chinese steel and aluminium amid the USMCA review. Chinese firms including BYD have expanded in Mexico under nearshoring, prompting US concerns about transshipment. Mexico is weighing anti-dumping measures and already imposed tariffs up to 50 per cent on 1,400 products.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/Mexican%20foreign%20minister%20to%20meet%20Wang%20Yi%20in%20China%20as%20US%20demands%20trade%20ties%20rollback.pdf"},{"id":"scmp-16","title":"Moonshot AI – creator of Kimi K3 model – has filed for Hong Kong IPO: sources","source":"SCMP","date":"4 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Chinese AI start-up Moonshot AI, developer of the Kimi K3 model, has confidentially filed for a Hong Kong IPO, according to two people familiar with the matter, as it seeks public funds for rapid expansion. The Beijing-based company targets a listing as early as the first quarter of 2027, subject to regulatory approvals and market conditions, and is pursuing a final pre-IPO financing round that could value it around US$50 billion. Moonshot declined to comment on rumours. Its Kimi K3, released in July, is the world's largest open-weight model with over 2.8 trillion parameters, approaching leading proprietary systems while keeping a price edge. It ranks as the top Chinese model on the Artificial Analysis Intelligence Index alongside Z.ai's GLM-5.3.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/Moonshot%20AI%20-%20creator%20of%20Kimi%20K3%20model%20-%20has%20filed%20for%20Hong%20Kong%20IPO%20sources.pdf"},{"id":"scmp-17","title":"Norway seizes Russian ship over US$4.2 billion claim by Ukrainian energy firm","source":"SCMP","date":"4 Sep 2026","tags":["Geopolitics","Energy"],"summary":"Norway seized a Russian ship in the Arctic to enforce a US$4.22 billion compensation claim won by Ukrainian energy firm Naftogaz over Moscow's seizure of its assets when Russia annexed Crimea in 2014, officials said late Wednesday. The vessel, the Professor Molchanov, was seized off Svalbard, according to Covington, the US law firm representing Naftogaz. Russia's foreign ministry called the action \"piracy\", lodged a formal protest and demanded the vessel's release. The Svalbard governor's office confirmed the ship would be held, and would care for crew and passengers with Trust Arktikugol. The ship had arrived Tuesday in Barentsburg carrying Russian scientists. Svalbard, Norwegian territory since 1925, is governed under a 1920 treaty allowing signatory citizens, including Russians, to settle visa-free.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/Norway%20seizes%20Russian%20ship%20over%20US4.2%20billion%20claim%20by%20Ukrainian%20energy%20firm.pdf"},{"id":"scmp-18","title":"Tech race flashpoint: Huang, Musk push back on AI guard rails amid heated US-China rivalry","source":"SCMP","date":"4 Sep 2026","tags":["Technology & AI","Geopolitics"],"summary":"US tech leaders including Nvidia CEO Jensen Huang and Tesla's Elon Musk are pressing global powers to curb AI regulations, warning strict guard rails could suffocate innovation amid an intensifying US-China technological arms race. Speaking at a G20 meeting in Chapel Hill, North Carolina, alongside Commerce Secretary Howard Lutnick, Huang urged regulations targeting \"actual and pragmatic harm\" rather than \"hypothetical theoretical harm\", warning the worst outcome is being left behind. Musk said countries should create an environment \"relatively free of regulation\" where new technologies are \"default legal\", singling out the EU as overly restrictive. Meta CEO Mark Zuckerberg cautioned against restricting open-source AI, arguing wide distribution aids safety. The comments come as Washington eases rules for home-grown developers, drawing rebukes from Beijing.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/Tech%20race%20flashpoint%20Huang,%20Musk%20push%20back%20on%20AI%20guard%20rails%20amid%20heated%20US-China%20rivalry.pdf"},{"id":"scmp-19","title":"Trump calls Xi's Washington visit 'exciting', but claims US leads China in AI race","source":"SCMP","date":"4 Sep 2026","tags":["Geopolitics","Technology & AI"],"summary":"President Donald Trump claimed on Wednesday the US holds a substantial lead over China in AI and said he was thrilled about President Xi Jinping's Washington visit later this month. \"We're leading China in AI very substantially,\" Trump told reporters, adding Xi arrives on the 24th with \"a lot of good things to discuss\". The bravado comes amid rising inflation and oil prices, the ongoing Iran war and low polling ahead of November midterms. Analysts expect few deliverables; AEI's Zack Cooper said \"there's not going to be much\". Treasury Secretary Scott Bessent criticised China for not signing the G20 communique. Trump touted a claimed US$20 trillion of inbound investment, though analysts say figures are hard to verify, amid a new trade war with Canada.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/Trump%20calls%20Xi's%20Washington%20visit%20'exciting',%20but%20claims%20US%20leads%20China%20in%20AI%20race.pdf"},{"id":"scmp-20","title":"US export curbs have reshaped China's tech scene around 'chokepoints': report","source":"SCMP","date":"4 Sep 2026","tags":["Technology & AI","Trade"],"summary":"Years of US export controls have reshaped China's pipeline of stock market hopefuls, concentrating them in areas where Beijing seeks to break reliance on foreign technology, a Morgan Stanley report found. About 20 per cent of companies launching IPOs on Shanghai's Star Market this year address key technological \"chokepoints\", up from 8.1 per cent in 2022, based on analysis of 229 IPOs between 2022 and mid-July 2026. Around 60 per cent of 2026 firms contributed to supply chain self-sufficiency, up from 41 per cent four years ago. Of 21 chokepoint firms this year, 19 are in the semiconductor supply chain, with 15 in electronics. Bottlenecks have narrowed and moved upstream to raw materials, machinery and core manufacturing tools since Washington's controls began in 2022.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/US%20export%20curbs%20have%20reshaped%20China's%20tech%20scene%20around%20'chokepoints'%20report.pdf"},{"id":"scmp-21","title":"US looks to warship designs from Japan, South Korea and Turkey, reports say","source":"SCMP","date":"4 Sep 2026","tags":["Defence","Geopolitics"],"summary":"Washington is considering using Japanese, South Korean or Turkish frigate designs to expand its naval fleet as the US shipbuilding industry struggles to meet demand, according to US media reports. The move follows a National Security Presidential Memorandum Trump signed on August 13 calling for foreign shipbuilding capacity and investment, though the plan is likely to face strong congressional opposition. Potential contenders for the Navy's new guided-missile frigate include Japan's Mogami-class, South Korea's Chungnam-class and Turkey's Istanbul-class, USNI News reported. Cooperation could follow the \"Finland model\", with foreign shipbuilders constructing the first two hulls and investing in US facilities before production transfers to American shipyards. It would be the first US purchase of a major surface combatant from a foreign partner since World War II.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/US%20looks%20to%20warship%20designs%20from%20Japan,%20South%20Korea%20and%20Turkey,%20reports%20say.pdf"},{"id":"scmp-22","title":"US military's cyber unit plan threatens South Korea's diplomatic balancing act","source":"SCMP","date":"4 Sep 2026","tags":["Defence","Geopolitics"],"summary":"A potential US deployment of an army specialist unit capable of integrated operations across domains, including cyberspace, to South Korea could further reorient the US military's peninsula role from deterring North Korea towards containing China, analysts say. Reports say the Pentagon is considering moving elements of the Second Multi-Domain Task Force from Germany to South Korea, affecting the 28,500-strong US Forces Korea. Hundreds of troops from the MDTF's Multi-Domain Effects Battalion, handling cyber, information and space operations, could be deployed. Seoul's defence ministry declined to comment. The MDTF was developed partly to counter anti-access/area-denial capabilities of China and Russia. Washington reportedly aims to complete deployment this year, part of a broader restructuring including a new Western Hemisphere Command.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/US%20military's%20cyber%20unit%20plan%20threatens%20South%20Korea's%20diplomatic%20balancing%20act.pdf"},{"id":"scmp-23","title":"US urged to consider military strikes to stop China achieving AGI first","source":"SCMP","date":"4 Sep 2026","tags":["Technology & AI","Defence","Geopolitics"],"summary":"The US should prepare for scenarios requiring extreme measures to stop China from achieving artificial general intelligence, including state-backed espionage and military strikes on Chinese data centres, according to former White House official Jacob Stokes of the Centre for a New American Security. Speaking at an online event on Thursday, Stokes said agencies including the Defense Department and NSA should assess what intelligence would justify such actions. In a CNAS report titled \"Superpowers and AGI\", the former Obama national security staffer called for considering diplomatic, espionage, cyber and kinetic measures, including preventive strikes. The US currently holds a months-long lead over China in frontier AI per Epoch AI, but Beijing could make a surprise breakthrough via robotics and embodied AI.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/US%20urged%20to%20consider%20military%20strikes%20to%20stop%20China%20achieving%20AGI%20first.pdf"},{"id":"scmp-24","title":"US$1.6 billion levy complicates sale of Singapore land by Malaysian king's son","source":"SCMP","date":"4 Sep 2026","tags":["Southeast Asia","Finance & Markets"],"summary":"A plan by a Malaysian royal to sell a tract of land in central Singapore faces a tax bill that may exceed US$1 billion. A land betterment charge has become a sticking point in negotiations between prospective buyers and the owner, Tunku Ismail Ibrahim, eldest son of Malaysia's billionaire king, who wants any buyer to foot the bill, people familiar said. The tax, imposed when planning approvals raise land value, may run north of S$2 billion (US$1.6 billion) per three local analysts. Ismail is selling 16.6 hectares (41 acres), including a plot from a 2025 land swap with Singapore's government near the Botanic Gardens. In March, the Urban Redevelopment Authority said he applied to develop the land for residential use, proposing rezoning for good class bungalows.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/US1.6%20billion%20levy%20complicates%20sale%20of%20Singapore%20land%20by%20Malaysian%20king's%20son.pdf"},{"id":"scmp-25","title":"Xi Jinping's call for Mideast to build own security framework is a message to US: expert","source":"SCMP","date":"4 Sep 2026","tags":["Geopolitics"],"summary":"Chinese President Xi Jinping urged Middle Eastern nations to build a self-led security model, nudging them to cut reliance on Washington following further US-Iran military clashes, but did not position Beijing as an alternative security guarantor. On his first Egypt visit in a decade, Xi made the proposal during talks with President Abdel-Fattah el-Sisi in Cairo on Wednesday. Beijing and Cairo aligned on Gaza, Red Sea security and Sudan, and China gave greater weight to Egypt's concerns over an Ethiopian megadam on the Nile. \"The people of the Middle East should be masters of their own affairs,\" Xi said, opposing outside interference. El-Sisi praised China's \"objective and impartial position\". Analyst John Calabrese said Xi's \"common security\" emphasis carried a message about Washington's role.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/Xi%20Jinping's%20call%20for%20Mideast%20to%20build%20own%20security%20framework%20is%20a%20message%20to%20US%20expert.pdf"}]}};</script>
