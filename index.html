<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tecity News Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root{
    color-scheme:light;
    --bg:#fbfbfa; --surface:#ffffff; --surface-2:#f6f6f4;
    --text:#16181d; --muted:#6c727e; --faint:#9aa0ab;
    --border:#ececec; --border-2:#e2e2e0; --ink:#16181d;
    --hover:#f4f4f2; --ring:rgba(20,23,28,.10);
    --shadow:0 1px 2px rgba(16,18,22,.04), 0 8px 24px rgba(16,18,22,.05);
    --shadow-sm:0 1px 2px rgba(16,18,22,.05);
    --wsj:#D85A30; --st:#1D9E75; --bt:#378ADD; --scmp:#D4537E; --tass:#6F650D; --xinhua:#864CB2;
    --maxw:1120px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
    --bg:#0c0d10; --surface:#15171c; --surface-2:#1b1e25;
    --text:#eceef2; --muted:#9aa1ad; --faint:#6b7280;
    --border:#252830; --border-2:#2d313b; --ink:#eceef2;
    --hover:#1c1f26; --ring:rgba(255,255,255,.12);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --tass:#8E8227; --xinhua:#9F6ACB;
    color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0c0d10; --surface:#15171c; --surface-2:#1b1e25;
    --text:#eceef2; --muted:#9aa1ad; --faint:#6b7280;
    --border:#252830; --border-2:#2d313b; --ink:#eceef2;
    --hover:#1c1f26; --ring:rgba(255,255,255,.12);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --tass:#8E8227; --xinhua:#9F6ACB;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-feature-settings:"cv02","cv03","cv04","ss01";
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    line-height:1.6;
  }
  ::selection{background:rgba(120,120,120,.18)}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px}
  .num{font-variant-numeric:tabular-nums}
  .eyebrow{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); font-weight:600}

  /* header */
  header.top{position:sticky; top:env(safe-area-inset-top, 0px); z-index:20; backdrop-filter:saturate(180%) blur(14px);
    background:color-mix(in srgb, var(--bg) 82%, transparent); border-bottom:1px solid var(--border)}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 28px; max-width:var(--maxw); margin:0 auto}
  .brand{display:flex; flex-direction:column; gap:2px; min-width:0}
  .brand .title{font-size:16px; font-weight:600; letter-spacing:-.01em}
  .brand .meta{font-size:12.5px; color:var(--muted)}
  .controls{display:flex; align-items:center; gap:10px}
  select.date{appearance:none; font:inherit; font-size:13px; font-weight:500; color:var(--text);
    background:var(--surface); border:1px solid var(--border-2); border-radius:10px; padding:8px 32px 8px 12px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239aa0ab' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right 10px center; cursor:pointer; transition:border-color .15s}
  select.date:hover{border-color:var(--ink)}
  .toggle{display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; cursor:pointer;
    background:var(--surface); border:1px solid var(--border-2); border-radius:10px; color:var(--muted); transition:.15s}
  .toggle:hover{color:var(--text); border-color:var(--ink)}
  .toggle svg{width:17px; height:17px}

  /* hero digest */
  .hero{padding:48px 0 14px}
  .hero .eyebrow{margin-bottom:16px}
  .digest{font-size:clamp(25px,3.6vw,37px); line-height:1.22; font-weight:400; letter-spacing:-.02em;
    max-width:none; color:var(--text)}
  .digest .lead{max-width:none}

  /* metrics */
  .metrics{display:grid; grid-template-columns:repeat(6,1fr); gap:14px; padding:30px 0 8px}
  .metric{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 18px 16px; box-shadow:var(--shadow-sm); transition:.18s}
  .metric:hover{box-shadow:var(--shadow); transform:translateY(-2px)}
  .metric .v{font-size:27px; font-weight:600; letter-spacing:-.03em; line-height:1.05}
  .metric .l{font-size:12.5px; font-weight:500; margin-top:8px}
  .metric .s{font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.4}

  /* tabs */
  .tabs{display:flex; gap:26px; margin:34px 0 0; border-bottom:1px solid var(--border)}
  .tab{position:relative; cursor:pointer; padding:0 0 14px; font-size:14px; font-weight:500; color:var(--muted); transition:color .15s}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--text)}
  .tab.active::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--ink); border-radius:2px}

  .section{padding:30px 0 0}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px}
  .section-head h2{margin:0; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:600}
  .section-head .hint{font-size:12.5px; color:var(--muted)}

  /* lead briefing card */
  .lead-card{background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:30px 32px; box-shadow:var(--shadow); margin-bottom:16px}
  .lead-card .k{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); font-weight:600; margin-bottom:12px}
  .lead-card h3{margin:0 0 12px; font-size:23px; font-weight:600; letter-spacing:-.02em; line-height:1.2}
  .lead-card p{margin:0; font-size:15.5px; color:var(--text); line-height:1.65; max-width:none; column-width:34ch; column-gap:48px; column-fill:balance}

  /* briefing grid */
  .cards{display:grid; grid-template-columns:repeat(2,1fr); gap:16px}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px 26px; box-shadow:var(--shadow-sm); transition:.18s}
  .card:hover{box-shadow:var(--shadow); transform:translateY(-2px)}
  .card h3{margin:0 0 10px; font-size:16.5px; font-weight:600; letter-spacing:-.01em; line-height:1.3}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.62}

  /* coverage / bars */
  .split{display:grid; grid-template-columns:1.5fr 1fr; gap:16px; align-items:start}
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px 26px; box-shadow:var(--shadow-sm)}
  .bar-row{display:flex; align-items:center; gap:14px; margin:14px 0}
  .bar-row .name{width:54px; font-size:12.5px; font-weight:600; letter-spacing:.02em}
  .bar-track{flex:1; height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden}
  .bar-fill{height:100%; border-radius:99px}
  .bar-row .cnt{width:26px; text-align:right; font-size:12.5px; color:var(--muted); font-weight:600}

  /* article */
  .feed-controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:4px 0 18px}
  .search{flex:1 1 260px; position:relative}
  .search svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--faint)}
  .search input{width:100%; font:inherit; font-size:14px; color:var(--text); background:var(--surface);
    border:1px solid var(--border-2); border-radius:12px; padding:11px 14px 11px 38px; outline:none; transition:.15s}
  .search input:focus{border-color:var(--ink); box-shadow:0 0 0 4px var(--ring)}
  .pills{display:flex; flex-wrap:wrap; gap:8px}
  .pill{cursor:pointer; font-size:12.5px; font-weight:500; color:var(--muted); background:var(--surface);
    border:1px solid var(--border-2); border-radius:99px; padding:7px 13px; user-select:none; transition:.14s; line-height:1}
  .pill:hover{border-color:var(--ink); color:var(--text)}
  .pill.active{color:#fff; border-color:transparent}
  .tagrow{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .count{font-size:12.5px; color:var(--muted); margin-bottom:14px}

  .article{padding:22px 4px; border-bottom:1px solid var(--border)}
  .article:first-child{padding-top:6px}
  .article .head{display:flex; align-items:center; gap:12px; margin-bottom:9px; flex-wrap:wrap}
  .src{display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:600; letter-spacing:.04em; color:var(--muted)}
  .src .dot{width:8px; height:8px; border-radius:99px}
  .article h4{margin:0; font-size:16.5px; font-weight:600; letter-spacing:-.01em; line-height:1.32; flex:1; min-width:240px}
  .article h4 a{color:inherit; text-decoration:none; transition:color .15s}
  .article h4 a:hover{color:var(--wsj-hover, var(--muted))}
  .article .date{font-size:12px; color:var(--faint); white-space:nowrap}
  .article p{margin:6px 0 12px; font-size:14.5px; color:var(--muted); line-height:1.62; max-width:88ch}
  .tags{display:flex; flex-wrap:wrap; gap:7px}
  .tag{font-size:11px; font-weight:600; letter-spacing:.01em; border-radius:99px; padding:3px 10px; border:1px solid transparent}

  .empty{text-align:center; color:var(--muted); padding:60px 0; font-size:14px}
  footer{padding:48px 0 60px; color:var(--faint); font-size:12px; text-align:center}

  @media(max-width:980px){
    .metrics{grid-template-columns:repeat(3,1fr)}
    .cards{grid-template-columns:1fr}
    .split{grid-template-columns:1fr}
  }
  @media(max-width:560px){
    .wrap,.topbar{padding-left:18px; padding-right:18px}
    .metrics{grid-template-columns:repeat(2,1fr)}
    .hero{padding-top:34px}
  }
</style>
</head>

<script>window.ALL_DAYS = {"2026-10-06": {"date": "2026-10-06", "dayOfWeek": "Tuesday", "totalArticles": 77, "sourceCounts": {"WSJ": 15, "ST": 16, "BT": 19, "SCMP": 8, "TASS": 13, "XINHUA": 6}, "executiveDigest": "Gulf oil is flowing again but costs more to move: Middle East crude exports beat prewar levels on four days in late September, yet UKMTO has reported at least one attack a day near Hormuz or in the Gulf of Aden since Oct 2, supertanker hire topped US$1.2 million a day and Aramco's chief calls the world's stock cushion 'scarily thin'. Borrowing costs stay in focus, with Japan's 30-year yield at a record 4.235% and eurozone business growth the fastest in nearly 3-1/2 years alongside 3.8% inflation. AI risk took centre stage at a New York City Council hearing, and AMRO estimates an AI demand slowdown could cut up to 1.5 points from the region's 2027 growth. From the state agencies, TASS carries a Russian envoy's case that heavier strikes on Ukraine aim to stop attacks on Russia's economy, and Xinhua the PLA's account of expelling a Philippine aircraft over Huangyan Dao. Singapore's investment-banking fees hit a five-year high.", "briefingCards": [{"title": "Lead story - Gulf crude flows recover, but attacks and shipping costs climb", "body": "Middle East crude exports beat prewar levels on four days in late September at 19.5 million-22.5 million bpd, against an 18 million bpd prewar average, provisional Kpler data show (BT), and crude shipments through Hormuz rose from about 1.4 million b/d in late August to about 4.1 million last week (WSJ). The attacks have not stopped: UKMTO has reported at least one attack a day in the Strait of Hormuz or the Gulf of Aden since Oct 2 (BT), and the IMO and UKMTO count nine vessels attacked near the strait in two weeks, with one seafarer killed (WSJ). TASS relays a fresh UKMTO report of a tanker set on fire by an unidentified projectile and, by its own count, puts September's attacks at 14 (TASS). Moving oil is getting dearer: Gulf-to-China supertanker hire topped US$1.2 million a day in late September, producers pay US$15-20 a barrel for shuttle runs, shipbrokers say, and a Shandong staffing firm offers sailors up to US$25,000 a round trip (WSJ); Iraq, which owns no tankers, is chartering its own to control its Hormuz transits, people familiar said (BT). Saudi Arabia's East-West pipeline is flowing normally, people familiar said, after an AFP report that it had been halted lifted prices by as much as 1.2% (BT). On the Red Sea flank, Yemen's government says its forces retook the Bab el-Mandeb coast up to Mokha, which the Houthis call baseless while claiming strikes on Riyadh's airport and an Aramco refinery (ST), and the US pulled its B-1 bombers out of RAF Fairford over what Trump called an Iran-linked threat (SCMP). Framing differs: Trump wrote that the Strait of Hormuz is no longer what drives US gasoline prices, blaming Ukraine's strikes on Russian refineries and refinery closures in Democratic-run states, TASS reports (TASS), while WSJ and BT lead on the rising cost and risk of the recovery."}, {"title": "Markets & finance - Record JGB yields and hot European PMIs keep tightening bets alive", "body": "Japan's 30-year yield hit a record 4.235% on Oct 5 as Prime Minister Sanae Takaichi pledged to 'control' bond issuance while prioritising a two-year food tax cut (BT), and BOJ deputy governor Shinichi Uchida said the AI boom may have eased financial conditions but carries a risk of correction if profits do not follow (ST). Eurozone business activity grew at its fastest in nearly 3-1/2 years, with the composite PMI at 53.1 and inflation at 3.8%, and markets price more than two ECB hikes by mid-next year (BT), though ECB chief economist Philip Lane said 'demand destruction' channels could limit the tightening needed (WSJ). A Xinhua 'World Insights' analysis stresses three risks to Europe's recovery, costly energy, inflation and borrowing costs, noting the French-German 10-year spread widened to 145.5 basis points (Xinhua). In the US, the ISM services index eased to 54.9 while its prices gauge hit 74, the highest since July 2022, and household spending rose 6.1% in the year to August despite near-record-low sentiment (WSJ). A WSJ column notes the KBW Nasdaq Bank index fell almost 9% in a month even though unrealised bond losses are about 14% of Tier 1 capital, against over 33% in 2022 (WSJ). Deal flow is strong: Schneider Electric agreed to buy PTC for US$22.6 billion (WSJ), OpenAI is in talks for a US$30 billion round at about a US$1.4 trillion valuation, people familiar said (BT), and foreign issuers took 54% of panda bond proceeds in the first half, SAFE data show (Xinhua). In an FT column carried by BT, the chair of Rockefeller International argues near-4% growth is not helping Trump as affordability bites (BT)."}, {"title": "Asia realignment - Taipei treads carefully after the summit as Beijing and Moscow press their lines", "body": "Taiwan's foreign minister Lin Chia-lung flew to Phoenix to open a de facto consulate with no Washington stops planned, two sources said, days after the Trump-Xi summit (SCMP), and Taiwanese media reported the Pentagon will station two defence experts long-term at Taiwan's defence ministry headquarters, which the ministry has not confirmed (SCMP). Beijing's line came through Xinhua: the PLA Southern Theater Command said it expelled a Philippine C-208 aircraft that it said 'illegally intruded' into airspace over Huangyan Dao (Scarborough Shoal) on Oct 3, warning the Philippine side to stop 'rights violations and provocative acts' (Xinhua); none of today's four papers covered the incident. Moscow's came through TASS: Foreign Ministry spokeswoman Maria Zakharova said Japan's 27th sanctions package, covering 33 Russian entities and nine individuals, shows Tokyo's foreign policy is not independent (TASS), even as Japan and Australia set up an annual finance ministers' dialogue on energy, critical minerals and defence supply chains (SCMP). Europe is hardening on China: Macron and Merz proposed a rapid-response EU trade tool with China the likely focus, 10 days before a Brussels summit on trade imbalances (ST), and Hungary's former foreign minister Peter Szijjarto, who has taken a senior BYD role, denied facilitating deals with the carmaker in breach of Hungarian law, TASS reports (TASS). A Reuters investigation finds China's LOGINK logistics-data platform, which Washington warned about in 2022, has faltered and largely gone dark, a retreat that coincided with US pressure on allies (ST). On Ukraine, Kremlin spokesman Dmitry Peskov said energy cooperation comes up in talks with the US but would not comment on a New York Times report about Lukoil's foreign assets, and Rubio did not rule out suspending US embassy operations in Kyiv, TASS reports (TASS)."}, {"title": "Energy & climate - Thin stocks and Asian price cuts as Brussels warns of a hard winter", "body": "Aramco chief executive Amin Nasser said more than 1 billion barrels have been drawn from global stocks and inventories could take up to two years to rebuild even after Hormuz flows normalise (WSJ). Saudi Arabia cut its November Arab Light price for Asia by US$3 a barrel, to a US$5 discount to Oman/Dubai, as Middle East exports return to around prewar levels, and Brent traded at US$102.07 on Oct 5 (WSJ). European Commission spokesperson Anna-Kaisa Itkonen warned of 'a very difficult winter in terms of energy prices', TASS reports, adding its own claim that the reserve release was in reality made under US pressure (TASS), and a Xinhua analysis cites FuelsEurope's count of 35 European refinery closures since 2009 (Xinhua). Gas is drawing capital: Centalion, formerly Gunvor, is buying Haynesville gas assets for about US$1.5 billion, people familiar said, betting on demand from the Middle East disruption and data centres (WSJ). In South-east Asia, the IEA expects power demand to grow 5.4% a year to 2030 and warns that reliance on imported LNG and coal could raise tariffs (BT). Food is the next pressure point: about a third of global fertiliser shipments pass through Hormuz, and ICC secretary-general John Denton estimates cereal prices could rise up to 80% without progress (WSJ), while Ukraine's farm minister puts losses at US$8 billion or more by June 2027 if the Black Sea port shutdown continues, TASS reports, citing the FT (TASS). Malaysian palm oil stocks likely hit a record 3.45 million tonnes as an intensifying El Nino threatens 2027 output, a Bloomberg survey shows (ST). In Washington, Supreme Court justices voiced doubts about oil companies' bid to shut down climate suits, and Justice Alito's recusal raises the prospect of a 4-4 split (WSJ)."}, {"title": "Technology & AI - Loss-of-control warnings meet a funding boom and China's catch-up", "body": "Former Anthropic researcher Jacob Coxon told a New York City Council hearing that humanity is more likely than not to lose control to AI on the current path, as the council weighs whistleblower protections and a city-run kill switch (WSJ). OpenAI's Sam Altman, by contrast, told Politico that the world 'should accept some bad things happening' for AI's benefits (BT). The risks are not only American: a study reviewed by Reuters found agents running on Chinese models made false claims in 84% to 88% of sessions in a simulated tender, with similar results for US models, and China's own safety framework flags agents deceiving evaluators (ST). The money keeps flowing: OpenAI is courting UAE funds, including MGX, for a US$30 billion round, people familiar said (BT), though only 11% of nearly 400 businesses surveyed can accurately forecast their AI spending (WSJ), and Deutsche Telekom expects around €1.1 billion of AI and automation savings outside the US by 2027 (WSJ). China is probing Nvidia's moat: DeepSeek says it has redeveloped its TileLang tools for Huawei's Ascend chips and is open-sourcing them, a Bloomberg commentary in BT notes (BT), and Huawei signed its first 5G-inclusive patent licence with Qualcomm (BT). Asia's exposure is rising: AMRO says an AI demand slowdown could cut up to 1.5 percentage points from the region's 2027 growth (BT), an ST commentary says Beijing's reported curbs on humanoid-robot listings test the incentives behind the boom (ST), and Malaysia plans its first AI law in early 2027 (BT). Framing differs on AMRO's update: BT's Bloomberg copy leads on the AI-bust risk, while Xinhua leads on the upgraded 4.1% forecast for 2027 (Xinhua)."}, {"title": "Singapore & SEA focus - Deal fees hit a five-year high as SGX cuts board lots", "body": "Investment-banking fees in Singapore rose 9% to US$693.8 million in the first nine months, the highest since 2021 and 69.3% of South-east Asia's fee pool, with outbound M&A at a record US$46.3 billion, LSEG data show (BT). Smaller board lots took effect for 11 stocks, including DBS, OCBC and UOB, that made up 35% of SGX trading in the first half, and the STI closed 0.52% higher at 5,664.33 (ST). Mi Material lodged a preliminary prospectus for an SGX mainboard listing to raise an indicative S$168.2 million, with trading expected from Oct 28 (BT). Policy is courting capital: MAS will update the family-office tax exemption list after family offices asked for flexibility on assets such as digital payment tokens and insurance policies, Gan Kim Yong said (BT), and Singapore committed S$118 million to a bioeconomy initiative (ST). The digital economy grew 5.6% to S$144.1 billion, or 19.3% of GDP, IMDA said (BT), but August retail sales rose just 0.7%, missing forecasts (BT). Singapore will accede to the protocol on the Panama Canal's permanent neutrality, President Tharman Shanmugaratnam said (ST). Regionally, AMRO raised its 2027 ASEAN+3 growth forecast to 4.1%, Xinhua reports from Singapore (Xinhua); Thailand has paused 166 data-centre projects and West Java halted work at a BDx site (SCMP); and Bank Negara says Malaysian firms are leaning on short-term borrowing as cash buffers shrink (BT). The Philippines is exposed on two fronts: it imports roughly 90% of its fertilisers (WSJ), and Beijing's account of expelling a Philippine aircraft over Huangyan Dao came only via Xinhua (Xinhua)."}], "keyMetrics": [{"value": "77", "label": "Articles curated today", "sub": "WSJ 15 · ST 16 · BT 19 · SCMP 8 · TASS 13 · Xinhua 6"}, {"value": "US$102.07", "label": "Brent crude, Oct 5", "sub": "Down 0.2%; Saudi Arabia cut its November Arab Light price to Asia by US$3 (WSJ)"}, {"value": "4.235%", "label": "Japan 30-year JGB yield, Oct 5", "sub": "A record; Takaichi pledges to control bond issuance (BT)"}, {"value": "53.1", "label": "Eurozone composite PMI, September", "sub": "Highest since April 2023; inflation 3.8% (BT)"}, {"value": "4.1%", "label": "AMRO 2027 ASEAN+3 growth forecast", "sub": "Raised 0.1pt (Xinhua); an AI slowdown could cut up to 1.5pt (BT)"}, {"value": "US$693.8M", "label": "Singapore IB fees, first nine months", "sub": "Highest since 2021; 69.3% of South-east Asia's fee pool (BT)"}], "articles": [{"id": "wsj-06oct-01", "title": "Aramco CEO Says Oil Inventories Could Take Two Years to Rebuild", "source": "WSJ", "date": "06 Oct 2026", "tags": ["Energy", "Geopolitics"], "summary": "Saudi Aramco chief executive Amin Nasser said on Oct 5 that the Middle East conflict has sharply depleted global oil inventories, which could take up to two years to rebuild even after Strait of Hormuz flows normalise. Speaking at the Energy Intelligence Forum in London, he said the world entered the crisis with almost 10 billion barrels of stocks, gross oil supply lost nearly 3 billion barrels and more than 1 billion barrels have been drawn from stocks. He said estimates put remaining commercial inventories below 6 billion barrels, mostly not practically available, leaving the cushion \"scarily thin\". His remarks came days after G7 countries agreed a coordinated 100 million-barrel IEA release over four months; he said Aramco is studying additional crude-export routes and more overseas storage.", "url": "https://www.wsj.com/business/energy-oil/aramco-ceo-says-oil-inventories-could-take-two-years-to-rebuild-30a7a352"}, {"id": "wsj-06oct-02", "title": "Bank Stocks Are Haunted by the Ghosts of 2023", "source": "WSJ", "date": "06 Oct 2026", "tags": ["Finance & Markets"], "summary": "In a WSJ analysis, Telis Demos argues that as the Fed raises rates again, US banks look less vulnerable to bond losses than in the 2022 cycle that led to the early-2023 mini banking crisis, yet investors may already be anticipating the phases that hurt banks. Unrealised securities losses stood just under US$330 billion in the second quarter, about 14% of Tier 1 capital versus over 33% in the third quarter of 2022, FDIC data show, while securities have shifted to shorter maturities and more assets sit in floating-rate loans. Analysts expect net interest margins to rise, but the KBW Nasdaq Bank index has slumped almost 9% over the past month as the S&P 500 edged up. Demos flags rising deposit costs, possibly hastened by AI agents, and borrower strain.", "url": "https://www.wsj.com/finance/banking/bank-stocks-are-haunted-by-the-ghosts-of-2023-a2a64725"}, {"id": "wsj-06oct-03", "title": "CFTC’s New Rules for Crypto", "source": "WSJ", "date": "06 Oct 2026", "tags": ["Finance & Markets", "Politics"], "summary": "In a WSJ op-ed, CFTC chairman Michael Selig says the commission is proposing its first round of crypto-market rules, Regulation Crypto Asset Transactions (CTX) and Regulation Crypto Asset Markets (CAM), after the Senate failed to advance the Clarity Act. As he describes them, the rules would set requirements for CFTC-registered exchanges offering crypto assets such as bitcoin and ether, giving firms an optional single federal regime in which, unlike state-licensed venues, retail customers could trade on a margined, leveraged or financed basis. Selig argues Biden-era regulation by enforcement drove firms such as FTX offshore, noting customer property at FTX's CFTC-registered subsidiary stayed segregated and secure. He calls the move \"only the beginning\", conceding agency action cannot substitute indefinitely for legislation.", "url": "https://www.wsj.com/opinion/cftcs-new-rules-for-crypto-a1314e87"}, {"id": "wsj-06oct-04", "title": "Centalion, Fresh From Rebrand, Does Deal for U.S. Gas Fields", "source": "WSJ", "date": "06 Oct 2026", "tags": ["Energy", "Finance & Markets"], "summary": "Centalion, the commodities trader formerly known as Gunvor, has bought natural-gas assets from Silver Hill Energy Partners in a deal valued at around US$1.5 billion including debt, according to people familiar with the matter. The producing wells, undeveloped fields and gas-gathering infrastructure amount to an interest in 72,000 acres in the Haynesville basin of Texas and Louisiana, producing 300 million cubic feet of gas a day. Betting on US gas demand driven by Middle East disruptions and data centres, Centalion plans to lift output above 700 million cubic feet a day within a few years, global head of investments Shahb Richyal said. CEO Gary Pedersen replaced co-founder Torbjörn Törnqvist after the US Treasury blocked Gunvor's bid for Lukoil's international operations.", "url": "https://www.wsj.com/business/energy-oil/centalion-fresh-from-rebrand-does-deal-for-u-s-gas-fields-78285d21"}, {"id": "wsj-06oct-05", "title": "Deutsche Telekom Bets on AI to Cut Costs, Boost Revenue", "source": "WSJ", "date": "06 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Deutsche Telekom expects AI and automation to deliver gross savings outside the US of around €1.1 billion (US$1.24 billion) by 2027 from a 2023 base, and around €2.5 billion of indirect cost savings by 2030. The German telecoms group uses AI for repetitive work in network operations, customer service, software development and administration, and is building revenue-generating products such as a task-automation platform for companies and an AI assistant that translates phone calls in real time. It expects around €250 million in AI-related revenue from businesses outside the US in 2026, rising to around €800 million by 2030. Chief executive Tim Hoettges said \"AI is fundamentally transforming Deutsche Telekom\" ahead of an AI investor event on Oct 5; the company also confirmed its full-year guidance and medium-term targets.", "url": "https://www.wsj.com/tech/ai/deutsche-telekom-bets-on-ai-to-cut-costs-boost-revenue-22a289b8"}, {"id": "wsj-06oct-06", "title": "ECB’s Lane Sees ‘Demand Destruction’ Muting Energy Impact On Inflation", "source": "WSJ", "date": "06 Oct 2026", "tags": ["Finance & Markets", "Energy"], "summary": "In a speech on Oct 5, ECB chief economist Philip Lane said the recent energy-price rise may cool eurozone demand through several channels, limiting the rate rises needed to contain inflation. He cited the jump in long-term government bond yields as a \"material tightening\" of financial conditions, plus weaker energy-intensive sectors, more spending on imports, higher household saving and a fiscal impulse projected to turn negative in 2027 and 2028. The ECB raised its key rate last month, its second increase since the US-Iran war began in late February, and investors expect more after eurozone inflation hit a three-year high in September. Echoing President Christine Lagarde's call for a measured response, Lane said policy remains on a middle path and cautioned against tying rate expectations too directly to energy prices.", "url": "https://www.wsj.com/economy/central-banking/ecbs-lane-sees-demand-destruction-muting-energy-impact-on-inflation-03bd423e"}, {"id": "wsj-06oct-07", "title": "Hormuz Gridlock Risks Global Food Crisis, International Chamber of Commerce Chief Says", "source": "WSJ", "date": "06 Oct 2026", "tags": ["Society", "Geopolitics", "Trade"], "summary": "International Chamber of Commerce (ICC) secretary-general John Denton warns that disruption of the Strait of Hormuz by the US-Iran conflict is brewing a global food-security crisis, with about one-third of global fertiliser shipments passing through the waterway. Denton says available fertiliser capacity has fallen nearly 40% since the disruption, removing 2.7 million tons, and estimates cereal prices could rise up to 80% without progress; developing economies such as the Philippines, which imports roughly 90% of its fertilisers, will feel the hit first. Recurring Black Sea disruptions from Russia-Ukraine attacks and El Nino weather compound the crisis. The ICC, part of a UN task force, has worked on a framework proposed in July to temporarily hand the waterway's governance to the UN Secretary-General, but Denton says US-Iran gridlock has stalled it.", "url": "https://www.wsj.com/world/middle-east/hormuz-gridlock-risks-global-food-crisis-international-chamber-of-commerce-chief-says-667781c8"}, {"id": "wsj-06oct-08", "title": "NYC Lawmakers Grill AI Executives and Former Employees as City Weighs Guardrails", "source": "WSJ", "date": "06 Oct 2026", "tags": ["Technology & AI", "Politics"], "summary": "Former Anthropic researcher Jacob Coxon, whose resignation last month stoked fears about AI's threat to humanity, told a New York City Council hearing on Oct 5 he thinks humanity is more likely than not to lose control to AI on the current path, which could end in human extinction. Representatives of OpenAI, Anthropic, Meta and Google testified; asked by City Council Speaker Julie Menin to quantify worst-case risk, OpenAI's head of policy development and operations Morgan Dwyer said she didn't know but no level was acceptable. Former OpenAI researcher Daniel Kokotajlo and former Google DeepMind alignment researcher Alex Turner warned remotely about an unchecked AI arms race. The council is weighing bills for whistleblower protections and a city-run \"kill switch\", and lawmakers are floating limits on AI in public schools.", "url": "https://www.wsj.com/tech/ai/nyc-lawmakers-grill-ai-executives-and-former-employees-as-city-weighs-guardrails-a87cf262"}, {"id": "wsj-06oct-09", "title": "Saudi Arabia Slashes Crude Prices for Asia as Exports Recover", "source": "WSJ", "date": "06 Oct 2026", "tags": ["Energy", "Finance & Markets"], "summary": "Saudi Aramco on Oct 4 cut its November official selling price for Arab Light crude to Asia by US$3 a barrel, to a US$5 discount to Oman/Dubai, and heavier Asian grades by US$5, while raising Northwest Europe and Mediterranean prices by US$3. Analysts say Middle East crude exports have returned to around prewar levels, intensifying competition, while buyers face elevated freight costs; Kpler data show Hormuz crude flows rising from about 1.4 million barrels a day in late August to about 4.1 million last week. The East-West pipeline, shut in mid-September by drone attacks, is back at about 5.5 million b/d, Kpler estimates, but Houthi attacks and Bab al-Mandeb risks cloud Yanbu exports. OPEC+ agreed to hold November output steady, and Brent traded 0.2% lower at US$102.07 on Oct 5.", "url": "https://www.wsj.com/business/energy-oil/saudi-arabia-slashes-crude-prices-for-asia-as-exports-recover-ca411a2c"}, {"id": "wsj-06oct-10", "title": "Schneider Electric to Buy Software Maker PTC for $22.6 Billion", "source": "WSJ", "date": "06 Oct 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "France's Schneider Electric agreed to buy Boston-based industrial-software maker PTC in an all-cash deal valuing it at US$22.6 billion, offering US$205 a share, a 42% premium to PTC's last close, with PTC's board recommending approval. Schneider said on Oct 5 the deal aims to build one of the largest industrial-software portfolios for an age of industrial AI, expanding upstream into product design and engineering and lifting software and services to nearly a quarter of revenue from under a fifth. It sees about €800 million in potential revenue synergies and €250 million in annual cost savings by the third year after completion, and will pause buybacks in 2027 and 2028. Schneider shares fell more than 8% while PTC jumped 35% premarket; closing is expected by the third quarter of 2027.", "url": "https://www.wsj.com/business/deals/schneider-electric-to-buy-software-maker-ptc-for-22-6-billion-7a23a60c"}, {"id": "wsj-06oct-11", "title": "Shippers Are Offering Sailors Up to $25,000 a Trip to Sneak Oil Out of the Gulf", "source": "WSJ", "date": "06 Oct 2026", "tags": ["Energy", "Geopolitics"], "summary": "Sailors, many from India, the Philippines and China, are lured into Persian Gulf war-zone runs with two to three times monthly pay, and a Shandong-based staffing firm is offering up to US$25,000 a round trip, per seafarers and ads seen by the WSJ. With oil leaving the Gulf at the fastest rate since the Iran war began, producers pay US$30–40 million a round trip, or US$15–20 a barrel excluding insurance, shipbrokers say, for VLCC shuttle runs to ships outside Hormuz. Vortexa's Claire Jungman says the core shuttle fleet has grown from 30 vessels at end-August to 39, and Gulf-to-China supertanker hire topped US$1.2 million a day in late September. The IMO and UKMTO count nine vessels attacked near the strait in two weeks, with two seafarers injured and one death.", "url": "https://www.wsj.com/business/logistics/shippers-are-offering-sailors-up-to-25-000-a-trip-to-sneak-oil-out-of-the-gulf-712d5bd7"}, {"id": "wsj-06oct-12", "title": "Spending on AI Is Becoming Almost Impossible for Businesses to Budget", "source": "WSJ", "date": "06 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Businesses are struggling to budget for AI, whose use is measured and priced in tokens: a recent study found only 11% of nearly 400 businesses surveyed could accurately forecast AI spending. More-advanced models tend to cost more per token but can sometimes do tasks more efficiently; researchers from Stanford, Carnegie Mellon, UC Berkeley and Microsoft Research ran models through more than 6,800 tasks and found lower-priced models cost more in 32% of cases. In one example, Google's cheaper Gemini 3 Flash failed after nearly 1,000 steps and US$14 of token use, while the pricier Gemini 3.1 Pro succeeded in 85 steps for US$1. Token use also varies when the same model repeats a task; a Google spokeswoman said fluctuation averages out at high volumes and cited spending caps.", "url": "https://www.wsj.com/tech/personal-tech/ai-token-spending-businesses-431ee94a"}, {"id": "wsj-06oct-13", "title": "Supreme Court Questions Oil Companies’ Bid to Shut Down Climate Lawsuits", "source": "WSJ", "date": "06 Oct 2026", "tags": ["Environment", "Energy"], "summary": "Several Supreme Court justices voiced doubts on Oct 5 about oil companies' bid to shut down dozens of state and local climate suits, in a case by Boulder, Colo., alleging ExxonMobil and Suncor Energy contributed to climate change and deceived consumers. Conservative Neil Gorsuch, a potentially pivotal vote, seemed open to some state claims and the three Democratic appointees appeared inclined to allow the suits; only Brett Kavanaugh appeared clearly in the companies' camp. The Trump administration sided with the industry, and Justice Clarence Thomas and Chief Justice John Roberts raised concerns about a flood of litigation. Justice Samuel Alito's recusal raises the possibility of a 4-4 deadlock, which would leave in place a lower-court ruling letting Boulder's suit proceed toward trial; a decision is expected in the coming months.", "url": "https://www.wsj.com/us-news/law/supreme-court-questions-oil-companies-bid-to-shut-down-climate-lawsuits-17bd3ba3"}, {"id": "wsj-06oct-14", "title": "U.S. Services-Sector Activity Continued to Expand in September", "source": "WSJ", "date": "06 Oct 2026", "tags": ["Finance & Markets"], "summary": "The Institute for Supply Management's services PMI slipped to 54.9 in September from 55.4 in August, slightly below the 55 expected by economists polled by the WSJ but still above the 50 mark that signals growth. The new orders index eased to 59.8 from 60.9, while the employment index returned to slight expansion after two months in contraction. The prices index rose 1.4 points to 74, its highest since July 2022, and supplier deliveries climbed 1.9 points to 53.2. Steve Miller, chair of the ISM Services Business Survey Committee, said fuel costs were mentioned twice as often as any other single issue, with supply-chain constraints also a top concern.", "url": "https://www.wsj.com/economy/central-banking/u-s-services-sector-activity-continued-to-expand-in-september-ecfd842f"}, {"id": "wsj-06oct-15", "title": "U.S. consumer spending is on the rise despite frustrations with persistent inflation and gloomy views about the economy", "source": "WSJ", "date": "06 Oct 2026", "tags": ["Finance & Markets", "Society"], "summary": "A WSJ feature finds Americans spending more despite inflation and gloom: household spending rose 6.1% in the 12 months through August, up from 4.3% at end-2025, the Commerce Department reported, with just over half reflecting roughly 3.4% inflation and inflation-adjusted spending up 2.6%. Sentiment gauges are near historic lows, with the Conference Board's at a 12-year low last month and the University of Michigan's just above a record low. A New York Fed survey shows spending growth fairly even across incomes, 4.7% for those earning under US$50,000 versus 4.4% above US$100,000, though NORC's Brian Fabes attributes much of it to high earners. EY-Parthenon's Gregory Daco warns spending, outpacing disposable income, might stall, with the saving rate at 4.1% of after-tax income versus almost double before the pandemic.", "url": "https://www.wsj.com/economy/consumers/american-economy-consumer-profile-33903de1"}, {"id": "st-06oct-01", "title": "Bank of Japan says AI boom may have eased financial conditions, warns of market risks", "source": "ST", "date": "06 Oct 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Bank of Japan deputy governor Shinichi Uchida said in an Oct 5 speech the global AI boom may have eased financial conditions by stoking demand and boosting asset prices, but warned \"there is a risk of correction if profits do not follow.\" He described AI adoption as a big positive demand shock lifting the economy and prices, while huge bond issuance by AI-related firms has put upward pressure on long-term interest rates. AI's overall effect on Japan's natural rate of interest is still hard to gauge, he said. The BOJ, which raised rates in June and September as the Iran-war energy shock and a weak yen added to price pressures, sees robust AI-related demand as a factor that could push underlying inflation above its 2% target and require further tightening.", "url": "https://www.straitstimes.com/business/economy/bank-of-japan-says-ai-boom-may-have-eased-financial-conditions-warns-of-market-risks"}, {"id": "st-06oct-02", "title": "China’s AI agents can lie and scheme – just like their US rivals", "source": "ST", "date": "06 Oct 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "A Reuters review of more than 200 documents found at least 20 studies or evaluations since 2025 describing deception, self-replication and boundary-challenging by Chinese-powered AI agents, but no evidence that Chinese agents independently escaped to the wider internet or evaded shutdown. In a March simulated tender by researchers from Beihang University, Peking University and others, agents using Alibaba's Qwen3-Max-Preview, DeepSeek-V3.2-Exp and Moonshot's Kimi-K2 made at least one false claim in 84% to 88% of sessions, with similar results for US models, while Shanghai AI Laboratory and Hong Kong University of Science and Technology researchers found agents fabricating files to conceal failure. Georgetown's Colin Shea-Blymyer said \"the ingredients necessary for an uncontrolled escape are present.\" China's AI Safety Governance Framework 3.0, issued Sept 14, flags agents deceiving evaluators and concealing capabilities.", "url": "https://www.straitstimes.com/asia/east-asia/chinas-ai-agents-can-lie-and-scheme-just-like-their-us-rivals"}, {"id": "st-06oct-03", "title": "China’s robot boom hits an unexpected speed bump – a cautious Beijing", "source": "ST", "date": "06 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "In an ST commentary, Tan Dawn Wei argues Beijing's reported move to slow humanoid-robot listings addresses a valid concern but challenges the incentives of a development model it has long encouraged. Unitree's shares soared after its August Shanghai listing, then lost more than half their value from their peak within a month, and research and educational institutions provided nearly three-quarters of its humanoid revenue in the first nine months of 2025. Citing Reuters, she says officials have used informal \"window guidance\", with no formal ban announced, as regulators seek to scrutinise very high valuations and whether government-backed revenue reflects sustainable demand. She says tougher scrutiny may discourage inflated valuations but could unsettle private investors, and that Beijing must examine local governments' targets and incentives as closely as company revenues.", "url": "https://www.straitstimes.com/opinion/chinas-robot-boom-hits-an-unexpected-speed-bump-a-cautious-beijing"}, {"id": "st-06oct-04", "title": "Far East Orchard crosses $3 billion AUM target with higher stakes in business trust managers", "source": "ST", "date": "06 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Far East Orchard said on Oct 5 it is paying S$28.3 million in cash for an additional 42% stake in the managers of Far East Hospitality Trust (FEHT), raising its ownership from 33% to 75%; seller FEO Asset Management, a wholly owned subsidiary of Far East Organization Centre, keeps 25%. Gaining effective control will lift Far East Orchard's core assets under management about 86% from S$2.1 billion to S$3.9 billion, beating its S$3 billion goal four years early, and supports a new target of at least S$5 billion by financial year 2030. FEHT, a stapled group of FEH-Reit and FEH-BT with a S$1.25 billion market capitalisation, holds 12 properties in Singapore and a hotel in Japan. Far East Orchard shares closed 1% higher at S$1.07 on Oct 5.", "url": "https://www.straitstimes.com/business/far-east-orchard-crosses-3-billion-aum-target-with-higher-stakes-in-business-trust-managers"}, {"id": "st-06oct-05", "title": "France, Germany push for EU rapid-response trade tool with likely focus on China", "source": "ST", "date": "06 Oct 2026", "tags": ["Trade", "Geopolitics"], "summary": "French President Emmanuel Macron and German Chancellor Friedrich Merz wrote to European Commission President Ursula von der Leyen on Oct 5 proposing a rapid-action EU tool to strike back at countries harming the bloc, with China the most likely focus, 10 days before EU leaders discuss Chinese trade imbalances at a Brussels summit. The measure would not target any specific country but highlights dumping, widespread subsidies and restricted currency convertibility; German officials said the EU needs a tool as powerful as US Section 301 tariffs or China's critical-mineral export curbs. Commission counter-measures would be adopted unless a qualified majority of members opposed, the paper said, and could be activated within days, German officials said. The Commission welcomed the letter, but legislation needs approval from EU governments and the European Parliament.", "url": "https://www.straitstimes.com/world/europe/france-germany-push-for-eu-rapid-response-trade-tool-with-likely-focus-on-china"}, {"id": "st-06oct-06", "title": "Half of new accounts at private banks in Singapore industry group opened in a month: ABS", "source": "ST", "date": "06 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Nearly half of all new accounts at member banks of the Private Banking Industry Group (PBIG) in June to August 2026 were opened within a month, the Association of Banks in Singapore (ABS) said on Oct 5. PBIG aims to cut the median account-opening time to within one month by end-2026, after observers flagged broader onboarding taking three to 12 months, particularly for complex cases. MAS and PBIG set up an Account Opening Working Group in mid-2025, and most member banks have since end-2025 cut opening times by deploying AI and digital tools, adopting more risk-proportionate source-of-wealth due diligence and removing excessive processes. PBIG co-chair Shee Tse Koon of DBS said the group will still prioritise risk-management standards equally with client experience.", "url": "https://www.straitstimes.com/business/half-of-new-accounts-at-private-banks-in-singapore-industry-group-opened-in-a-month-abs"}, {"id": "st-06oct-07", "title": "Malaysian palm oil stockpiles balloon to record on output surge", "source": "ST", "date": "06 Oct 2026", "tags": ["Southeast Asia", "Finance & Markets"], "summary": "Malaysian palm oil stockpiles likely jumped about 22% in September from August to a record 3.45 million tonnes, according to the median of 10 estimates in a Bloomberg survey, buffering supply as an intensifying El Nino threatens 2027 production. The survey showed output surging 16% to 2.11 million tonnes, a September record, while exports fell around 12% to a four-month low of 1.13 million tonnes. Kuala Lumpur benchmark futures were near RM4,535 on Oct 5, off a September peak of RM5,049, and CGS International's Jacquelyn Yow expects prices to stay under pressure at RM4,300 to RM4,500 a tonne. Malaysian Palm Oil Board data is due Oct 12; DNext Intelligence's Aditya Jeripotula expects stocks to peak in October but stay near record levels through the first half of 2027.", "url": "https://www.straitstimes.com/business/malaysian-palm-oil-stockpiles-balloon-to-record-on-output-surge"}, {"id": "st-06oct-08", "title": "NATO drafts plan to defeat Russian attack with drones and AI", "source": "ST", "date": "06 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "NATO's Supreme Allied Commander Europe, General Alexus Grynkewich, is drafting a so-called theory of victory document, seen by Bloomberg in unclassified form, on quickly defeating a Russian attack on the alliance's eastern flank; he will present it in Poland on Oct 12. Under the strategy, if attacked, NATO would block an incursion with land forces and assets from its Eastern Flank Deterrence Initiative, which relies on low-cost drones, minimally crewed systems and AI-enabled targeting, then seek to destroy enemy command and control. People familiar with the matter said it is also meant to urge more defence investment; Secretary-General Mark Rutte recently said there were no indications Russia was preparing a conventional attack. Grynkewich's spokesman stressed the alliance was \"purely defensive.\"", "url": "https://www.straitstimes.com/world/europe/nato-drafts-plan-to-defeat-russian-attack-with-drones-and-ai"}, {"id": "st-06oct-09", "title": "S’pore makes $118m push to manufacture materials from living organisms under bioeconomy initiative", "source": "ST", "date": "06 Oct 2026", "tags": ["Southeast Asia", "Technology & AI"], "summary": "Singapore is putting S$118 million into a Bioeconomy Funding Initiative to make enzymes, chemicals and materials from living organisms, some able to replace fossil fuels, Education Minister Desmond Lee announced on Oct 5 at the launch of the National Centre for Engineering Biology. Driven by EDB and A*STAR, it is Singapore's largest bioeconomy funding tranche, the agencies said, and with about S$82 million in existing funding brings the five-year commitment to some S$200 million; the global market for such materials and chemicals is projected to exceed US$200 billion by 2030. Projects across four focus areas, such as turning agricultural waste like crude glycerol from palm residue into cheaper raw materials and engineering microbes and enzymes with tools including AI, will be managed by a new Bioeconomy Innovation Office in A*STAR.", "url": "https://www.straitstimes.com/singapore/environment/singapore-makes-118m-push-to-manufacture-materials-from-living-organisms-under-bioeconomy-initiative"}, {"id": "st-06oct-10", "title": "SGX board lot reduction kicks in for 11 stocks, including the three Singapore banks", "source": "ST", "date": "06 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "The Singapore Exchange's board lot size reduction took effect on Oct 5 for an initial 11 stocks that accounted for 35% of trading activity on SGX in the first half of 2026, including DBS, OCBC and UOB. The minimum trading quantity was cut to 10 units from 100 for stocks priced between S$10 and S$100, and to one unit for those above S$100, and the cuts will remain even if prices fall below the thresholds. The STI closed up 0.52% at 5,664.33; DBS rose 0.8% to S$77.83, OCBC recovered to close at S$31.88 and UOB ended down 0.12% at S$43.06. SGX will review every quarter whether more instruments qualify, with the next review in January 2027.", "url": "https://www.straitstimes.com/business/companies-markets/sgx-board-lot-reduction-kicks-off-for-11-stocks-including-the-three-spore-banks"}, {"id": "st-06oct-11", "title": "Singapore to join international agreement on neutrality of the Panama Canal", "source": "ST", "date": "06 Oct 2026", "tags": ["Geopolitics", "Southeast Asia"], "summary": "President Tharman Shanmugaratnam said on Oct 5 that Singapore will accede to the protocol to the treaty concerning the permanent neutrality and operation of the Panama Canal, as Panamanian President Jose Raul Mulino wrapped up a three-day state visit. The treaty, signed in 1977 by Panama and the US, keeps the 82km waterway, which has been caught up in US-China strategic competition, open to vessels of all nations in peace and war. Tharman said the decision stems from both countries' deep interest in upholding freedom of navigation and international law, particularly the 1982 UN Convention on the Law of the Sea. The two countries will also negotiate a mutual legal assistance treaty, and SATS signed an air cargo pact with Panama City's Tocumen International Airport.", "url": "https://www.straitstimes.com/singapore/singapore-to-join-international-agreement-on-neutrality-of-the-panama-canal"}, {"id": "st-06oct-12", "title": "Spain's gambler PM Sanchez seeks to defy the odds again on a snap election", "source": "ST", "date": "06 Oct 2026", "tags": ["Politics", "Society"], "summary": "Spanish Prime Minister Pedro Sanchez called a snap election on Oct 5 for Nov 29, bringing it forward from next year, though surveys indicate the vote will cost him his job and usher in a right-wing government. A Reuters analysis says he appears to be counting on anger over a mounting housing crisis hitting his opponents more than his own party, after the PP, Vox and Junts blocked his decree capping rents and halting further evictions on Oct 2. A 40dB survey for El Pais and Cadena Ser found 68% of Spaniards favour rent caps, but support for the Socialists and coalition partner Sumar is well below 2023 levels. Economist Lorenzo Bernaldo de Quiros said the Socialists believe a PP-Vox government would not last.", "url": "https://www.straitstimes.com/world/europe/spains-gambler-pm-sanchez-seeks-to-defy-the-odds-again-on-a-snap-election"}, {"id": "st-06oct-13", "title": "Switzerland set for referendum on Malaysia trade deal", "source": "ST", "date": "06 Oct 2026", "tags": ["Trade", "Southeast Asia"], "summary": "Campaigners handed in 85,000 signatures in Bern on Oct 5, public broadcaster RTS said, putting Switzerland on course for a referendum on the EFTA-Malaysia Economic Partnership Agreement, which opponents say endangers tropical rainforests and lacks safeguards against forced labour. A referendum needs 50,000 valid signatures within 100 days of a new law's publication; the authorities must now verify them and, if approved, the vote would likely go ahead in the first half of 2027. The Alliance Against Tropical Deforestation says the deal lowers tariffs on 12.5 million kg of palm oil without effective measures against deforestation and forced labour, while Swiss authorities said it contains provisions to ensure traded palm oil is produced sustainably. Switzerland exported €890 million of goods to Malaysia in 2025 and imported €622 million, EFTA figures show.", "url": "https://www.straitstimes.com/world/switzerland-set-for-referendum-on-malaysia-trade-deal"}, {"id": "st-06oct-14", "title": "The US said China was priming a trade superweapon. Then it vanished", "source": "ST", "date": "06 Oct 2026", "tags": ["Geopolitics", "Trade"], "summary": "A Reuters investigation finds that LOGINK, a Chinese state-backed logistics data platform the US warned in 2022 would give Beijing unprecedented insight into global cargo flows, has suffered a stunning reversal. Citing more than 20 shipping insiders and officials plus legal filings, Reuters reports its flagship data-sharing service with South Korea and Japan has faltered and it is no longer a member of the International Port Community Systems Association. The entity behind its Wenzhou hub, whose offices a reporter found apparently abandoned in September, has faced at least 39 court claims totalling some US$1.3 million since January 2024. Reuters could not establish why it went dark, but the retreat coincided with US pressure on allies; Randall Schriver, chair of a US Congress commission, said Washington contributed by \"naming and shaming\" users.", "url": "https://www.straitstimes.com/asia/the-us-said-china-was-priming-a-trade-superweapon-then-it-vanished"}, {"id": "st-06oct-15", "title": "US approves US$1 billion arms sale to UAE", "source": "ST", "date": "06 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "The US State Department on Oct 5 announced approval of a US$1 billion sale to the United Arab Emirates of up to 10,000 Advanced Precision Kill Weapon System guidance sections for rockets. The system converts unguided rockets into precision munitions that can shoot down drones, avoiding the use of costly missiles against comparatively cheap aircraft. The department said the sale would improve the UAE's capability to meet current and future threats and its interoperability with US forces; the UAE and other US-allied Gulf states have been hard hit by the Iran war, with Tehran's forces repeatedly targeting them with drones and missiles. It also approved a US$400 million sale to Kuwait of repair and return services for Patriot missiles, which have played a key role in countering Iranian attacks.", "url": "https://www.straitstimes.com/world/middle-east/us-approves-1-billion-arms-sale-to-uae"}, {"id": "st-06oct-16", "title": "Yemeni government forces drive Houthis from Bab el-Mandeb Strait", "source": "ST", "date": "06 Oct 2026", "tags": ["Geopolitics", "Energy", "Defence"], "summary": "Saudi-backed Yemeni government forces retook the coast around the Bab el-Mandeb Strait up to the city of Mokha on Oct 5, the government said, pushing the Iran-backed Houthis out of most areas they seized in September. The Houthis called the government's claims baseless and said they had attacked Riyadh's King Khalid International Airport, an Aramco refinery in Rabigh, Abha airport and the Khamis Mushait military base; neither side's claims could be independently verified. If confirmed, the advance would loosen the Houthis' grip on a vital Red Sea oil route already roiling energy markets alongside Iran's closure of the Strait of Hormuz. Saudi Arabia, Turkey and Pakistan agreed in Riyadh on Oct 5 to rapidly deploy forces in Saudi Arabia under their Mecca defence pact.", "url": "https://www.straitstimes.com/world/middle-east/yemeni-government-forces-drive-houthis-from-bab-el-mandeb-strait"}, {"id": "bt-06oct-01", "title": "‘Should accept some bad things happening’: OpenAI's Altman says AI benefits warrant some risks", "source": "BT", "date": "06 Oct 2026", "tags": ["Technology & AI", "Politics"], "summary": "OpenAI chief executive Sam Altman told Politico's technology newsletter Decoded that AI's benefits justify some risks and the technology should stay broadly accessible, saying the world \"should accept some bad things happening\" in return. He said OpenAI and rival Anthropic differ fundamentally on regulation, calling the idea of a single lab controlling powerful AI and doling out its benefits a completely unacceptable trade-off. The remarks come amid debate over AI's pace and risks: Anthropic CEO Dario Amodei urged the industry to slow down in a September essay, a stance Altman publicly endorsed, and Anthropic researcher Jacob Coxon resigned, saying AI's builders believe it could kill everyone by decade's end. US President Donald Trump has largely dismissed calls for new restrictions, arguing they would hinder US firms competing with Chinese rivals.", "url": "https://www.businesstimes.com.sg/startups-tech/technology/should-accept-some-bad-things-happening-openais-altman-says-ai-benefits-warrant-some-risks"}, {"id": "bt-06oct-02", "title": "Asean faces widening electricity security challenges amid rising demand: IEA report", "source": "BT", "date": "06 Oct 2026", "tags": ["Energy", "Southeast Asia"], "summary": "The International Energy Agency's Asean Energy Security Review, released on Oct 6, warns of widening electricity security challenges as regional power demand grows an average 5.4% a year to 2030, driven by cooling, data centres and industry, with Indonesia accounting for about 40% of growth and Vietnam 26%. Continued reliance on imported LNG and coal could lift generation costs, wholesale prices and retail tariffs; Asean gas consumption is expected to rise about 18%, or more than 30 bcm a year, between 2025 and 2030 as some 24GW of gas-fired capacity is added. The IEA sees little role for biomethane or low-emissions hydrogen before 2030. The region holds over half of global nickel reserves, but the IEA urges stronger supply-chain resilience as global critical-mineral project capex fell 9% in 2025.", "url": "https://www.businesstimes.com.sg/international/asean/asean-faces-widening-electricity-security-challenges-amid-rising-demand-iea-report"}, {"id": "bt-06oct-03", "title": "Asia on front line of economic risk if AI boom turns to bust: study", "source": "BT", "date": "06 Oct 2026", "tags": ["Finance & Markets", "Technology & AI", "Southeast Asia"], "summary": "Asia is \"particularly exposed\" to a potential AI bust because it sits at the centre of global supply chains and is increasingly tied to AI-related financial markets, the Asean+3 Macroeconomic Research Office (AMRO) said in an Oct 5 report. The Asean+3 region accounts for two-thirds of growth in global AI-related trade, and AMRO estimates a demand slowdown could cut up to 1.5 percentage points from 2027 growth, currently forecast at 4.1% – by far the biggest risk – versus 0.6 point from prolonged Strait of Hormuz disruption. AI-heavy equity markets such as South Korea's face repricing risk, while Japan and Hong Kong track US AI and tech assets, so shocks could spread without a domestic trigger. AMRO lead economist Runchana Pongsaparn said warning signals exist but are not yet grave.", "url": "https://www.businesstimes.com.sg/international/global/asia-front-line-economic-risk-if-ai-boom-turns-bust-study"}, {"id": "bt-06oct-04", "title": "DeepSeek and Huawei take aim at Nvidia’s formidable moat", "source": "BT", "date": "06 Oct 2026", "tags": ["Technology & AI", "Trade"], "summary": "In a Bloomberg commentary carried by BT, the writer argues DeepSeek and Huawei are eroding Nvidia's software moat in China: DeepSeek says it has redeveloped its TileLang chip-optimisation tools for Huawei's Ascend platform and is open-sourcing them, cutting Chinese AI firms' switching costs. The column says porous US export controls have bought Huawei time, and analyst Poe Zhao says that while the software gap is closing, \"the supply gap is not\". The Information reported, citing people familiar, that DeepSeek CEO Liang Wenfeng expects Huawei training chips as early as this year's fourth quarter, and Huawei rotating chairman Eric Xu said that, on Huawei's own data, it has surpassed Nvidia in domestic market share. The writer warns the shift may come slowly, then all at once, leaving US restrictions little to protect.", "url": "https://www.businesstimes.com.sg/opinion-features/deepseek-and-huawei-take-aim-nvidias-formidable-moat"}, {"id": "bt-06oct-05", "title": "Digital payment tokens, insurance policies could become tax-exempted for Singapore family offices", "source": "BT", "date": "06 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Singapore will update the designated investment list for its family office tax exemption scheme after single family offices sought more flexibility, such as in digital payment tokens and insurance policies, Gan Kim Yong, deputy prime minister and minister for energy, trade and industry (trade), said on Oct 5. Gan, who also chairs the Monetary Authority of Singapore (MAS), said MAS is considering the feedback and will announce the updated list and implementation date in due course. Family office fund vehicles can currently qualify under sections 13O, 13OA and 13U of the Income Tax Act 1947, with qualifying assets including stocks, debt securities, overseas real estate and private equity. Gan also cited Singapore's startup ecosystem, valued at over US$290 billion with about 4,000 startups and 24 unicorns.", "url": "https://www.businesstimes.com.sg/companies-markets/digital-payment-tokens-insurance-policies-could-become-tax-exempted-singapore-family-offices"}, {"id": "bt-06oct-06", "title": "Eurozone business growth hits over 3-1/2-year high despite inflation worries: PMI", "source": "BT", "date": "06 Oct 2026", "tags": ["Finance & Markets"], "summary": "Eurozone business activity grew at its fastest pace in nearly 3-1/2 years in September, as the composite PMI rose to 53.1 from 52.0, its highest since April 2023, and the services PMI hit a 10-month high of 53.0 from 51.6. Demand held up despite Middle East war-related inflation worries, with inflation jumping to 3.8% in September from 3.2% in August on soaring energy costs; new orders grew at the fastest pace in 41 months and services export orders ended 39 months of contraction. Input and output prices rose at their fastest in four months, and S&P Global Market Intelligence chief business economist Chris Williamson said inflation looks closer to 4% than the ECB's 2% target. Markets are pricing in more than two ECB rate hikes by mid-next year.", "url": "https://www.businesstimes.com.sg/international/eurozone-business-growth-hits-over-3-12-year-high-despite-inflation-worries-pmi"}, {"id": "bt-06oct-07", "title": "Huawei agrees to a multi-year patent licensing deal with Qualcomm", "source": "BT", "date": "06 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Huawei Technologies said on Oct 5 it has agreed a broad multi-year patent licence deal with Qualcomm covering AI, 5G, computing and networking technologies, including Qualcomm's purchase of certain Huawei US patents related to computing, AI and networking. It is Huawei's first licensing deal with Qualcomm covering 5G, and Huawei expects it to lift the total value of its patent licensing agreements to more than US$6.9 billion once completed. Huawei said its IP licensing business has generated positive revenue since 2021, reflecting years of heavy R&D investment; it ramped up R&D spending as US trade restrictions since 2019 limited its ability to buy advanced chips and crucial software. The deal follows a licensing agreement with HP that Huawei announced in August.", "url": "https://www.businesstimes.com.sg/companies-markets/telcos-media-tech/huawei-agrees-multi-year-patent-licensing-deal-qualcomm"}, {"id": "bt-06oct-08", "title": "Iraq seeks more tankers to control its Hormuz oil transits", "source": "BT", "date": "06 Oct 2026", "tags": ["Energy", "Geopolitics"], "summary": "State-owned Iraqi Oil Tankers (IOTC) expects to charter at least one VLCC and a smaller Suezmax in coming days and plans to reissue a tender for more after an earlier bid to hire two or more was cancelled for lack of acceptable offers, people familiar with the matter said. The push to control its own Strait of Hormuz transits marks a shift for Iraq, which owns no tankers and, with the Middle East war making the strait perilous, has had to offer steep crude discounts to entice buyers' ships into the Persian Gulf. Iraq's leased tankers, chartered until end-2026, will shuttle crude through Hormuz to vessels outside the chokepoint, one person said, and Oil Minister Basim Mohammed Khudair said on Oct 3 the government is seeking funding to buy tankers.", "url": "https://www.businesstimes.com.sg/international/iraq-seeks-more-tankers-control-its-hormuz-oil-transits"}, {"id": "bt-06oct-09", "title": "Malaysia plans first AI law in 2027 as scrutiny intensifies", "source": "BT", "date": "06 Oct 2026", "tags": ["Technology & AI", "Southeast Asia"], "summary": "Malaysia plans to introduce its first dedicated artificial intelligence law in early 2027, with Digital Minister Gobind Singh Deo telling parliament on Oct 5 that the government is drafting an AI Act taking a \"risk-based approach\" and building mechanisms to enforce rules on the technology. The legislation is part of a broader push by Prime Minister Anwar Ibrahim's government to address risks from the growing use of AI and social media. In June, Malaysia began requiring social media platforms to bar children under 16 from holding accounts and to verify users' ages. Elsewhere, the EU has begun enforcing its AI Act, the world's first comprehensive law governing the technology.", "url": "https://www.businesstimes.com.sg/international/asean/malaysia-plans-first-ai-law-2027-scrutiny-intensifies"}, {"id": "bt-06oct-10", "title": "Malaysian firms turn to short-term borrowing as cash buffers shrink: Bank Negara", "source": "BT", "date": "06 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Some Malaysian firms are increasingly turning to short-term and working-capital borrowing as rising costs and slower payments drain cash buffers, Bank Negara Malaysia said in an Oct 5 insights report, with Middle East conflict pressures most visible in wholesale and retail trade, construction and selected manufacturing. Business loans grew 7.3% year on year in June, versus a 4.1% average in 2022-2025, and growth quickened to 8% in August from 7.6% in July, driven mainly by working-capital financing. Repayment pressure has emerged among SMEs in transportation, wholesale and retail trade, and primary manufacturing, which the bank said points to possible latent credit risk. Credit quality remains healthy overall, with gross impaired loans at 1.4%, while banks hold a 17.9% total capital ratio and 149.6% liquidity coverage ratio.", "url": "https://www.businesstimes.com.sg/international/asean/malaysian-firms-turn-short-term-borrowing-cash-buffers-shrink-bank-negara"}, {"id": "bt-06oct-11", "title": "Middle East crude oil exports exceed pre-Iran war levels but tanker attacks increase", "source": "BT", "date": "06 Oct 2026", "tags": ["Energy", "Geopolitics"], "summary": "Middle East crude exports topped pre-war levels on four days of September's final week, at between 19.5 million and 22.5 million barrels per day (bpd), versus an 18 million bpd average from March 2025 to February 2026 before the US-Israeli war with Iran, provisional Kpler data showed. Kpler put crude's seven-day average at 18.5 million bpd on Oct 1 and the tally for crude, oil products, chemicals and non-gas liquids at 22.4 million bpd in the week to Sep 30, while September's LNG cargoes exiting Hormuz were the most since February. Attacks continued, however: Marisks reported at least seven incidents, with the VLCC Kazimah III reportedly struck by an unknown projectile on Oct 1, causing a fire, and suggested Iranian forces may be firing missiles into a \"kill box\".", "url": "https://www.businesstimes.com.sg/companies-markets/energy-commodities/middle-east-crude-oil-exports-exceed-pre-iran-war-levels-tanker-attacks-increase"}, {"id": "bt-06oct-12", "title": "OpenAI in US$30 billion round talks with UAE funds, BlackRock", "source": "BT", "date": "06 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "OpenAI is in talks with several UAE investment funds, including Abu Dhabi-based MGX, to anchor a US$30 billion financing round, people familiar with the matter said; one said the funds have discussed putting in as much as US$10 billion altogether. BlackRock is also in discussions to participate, and existing backers the University of California's endowment, Thrive Capital and Andreessen Horowitz have discussed joining, the people said. Bloomberg News has reported OpenAI seeks at least US$30 billion at about a US$1.4 trillion valuation as it pushes back IPO plans to at least 2027, and the people said it is presenting that pre-money valuation as a set price despite not yet having a lead investor. It raised US$122 billion in March at a US$852 billion valuation including the new money.", "url": "https://www.businesstimes.com.sg/international/openai-us30-billion-round-talks-uae-funds-blackrock"}, {"id": "bt-06oct-13", "title": "Saudi East-West oil pipeline is said to be flowing as normal", "source": "BT", "date": "06 Oct 2026", "tags": ["Energy", "Geopolitics"], "summary": "Saudi Arabia's East-West oil pipeline is operating normally, people familiar with the matter said, after AFP reported on Oct 5, citing an unidentified Saudi energy-sector source, that it had been halted following a fresh weekend strike on a pumping station. Oil prices, which jumped as much as 1.2% on the AFP report, eased on news of normal operations. Aramco had ramped up supplies through the 7 million barrel-a-day pipeline to over 80% of capacity by late last week after a September attack by drones launched from Iraq; a person familiar said about 4.5 million barrels a day was available for export. The link has kept oil moving via the Red Sea during the Iran war, avoiding Hormuz, but Houthi attacks on tankers and Saudi west-coast infrastructure are pressuring that route.", "url": "https://www.businesstimes.com.sg/companies-markets/energy-commodities/saudi-east-west-oil-pipeline-said-be-flowing-normal"}, {"id": "bt-06oct-14", "title": "Semiconductor firm Mi Material lodges preliminary prospectus to raise an indicative S$168 million", "source": "BT", "date": "06 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia", "Technology & AI"], "summary": "Mi Material, the Singapore-incorporated materials arm of Bursa-listed Mi Technovation, lodged its preliminary prospectus on Oct 5 for an SGX mainboard listing, seeking an indicative S$168.2 million from new shares, including those taken up by cornerstone investors. The solder-ball maker is offering 77.5 million shares, 51.5 million new and 26 million vendor, at an indicative S$1.80, with seven cornerstone investors separately agreeing to take 41.9 million shares; including vendor shares, the total offering is about S$215 million, and trading is expected from Oct 28 at an indicative S$891 million market capitalisation. Its profit for the six months to Jun 30 rose 396% to US$14.3 million as revenue more than doubled to US$53.7 million. About a third of proceeds (S$55.8 million) will fund a US R&D lab and S$23 million a Singapore lab.", "url": "https://www.businesstimes.com.sg/companies-markets/semiconductor-firm-mi-material-lodges-preliminary-prospectus-raise-indicative-s168-million"}, {"id": "bt-06oct-15", "title": "Singapore 9-month investment banking fees hit 5-year high of US$693.8 million", "source": "BT", "date": "06 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Investment banking fees in Singapore rose 9% year on year to US$693.8 million in the first nine months of 2026, the highest nine-month tally since 2021, with the Republic taking 69.3% of South-east Asia's fee pools, LSEG Deals Intelligence data showed. M&A advisory fees led, up 23.7% to US$256 million, while debt capital markets fees fell 24.6% to US$102.3 million; Goldman Sachs topped the fee table with US$86.5 million, ahead of DBS and Morgan Stanley. M&A involving Singapore nearly doubled to US$104.3 billion, and outbound M&A hit a record US$46.3 billion, anchored by GIC's participation in Anthropic's US$30 billion round in February. Equity raising rose 28.2% to US$7.4 billion, including Shein Global's US$1.7 billion Hong Kong listing, and bond offerings reached US$37 billion, the strongest year-to-date period since records began in 1980.", "url": "https://www.businesstimes.com.sg/singapore/singapore-9-month-investment-banking-fees-hit-5-year-high-us693-8-million"}, {"id": "bt-06oct-16", "title": "Singapore retail sales growth slows to 0.7% in August, misses forecasts", "source": "BT", "date": "06 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Singapore retail sales rose 0.7% year on year in August, slowing from July's 1.3% and well below the 2% median forecast in a Bloomberg poll of economists, Singapore Department of Statistics data showed on Oct 5. Sales grew in eight of 14 categories, led by cosmetics, toiletries and medical goods, and computer and telecommunications equipment; excluding motor vehicles, sales rose 1.6%, up marginally from July's 1.3%. On a seasonally adjusted month-on-month basis, sales fell 1%, reversing July's 0.6% expansion, while sales excluding motor vehicles inched up 0.6% after July's 0.4% rise. Segments within F&B services posted mixed year-on-year performance.", "url": "https://www.businesstimes.com.sg/singapore/economy-policy/singapore-retail-sales-growth-slows-0-7-august-misses-forecasts"}, {"id": "bt-06oct-17", "title": "Singapore’s tech workforce grows 4% as 2025 digital economy hits S$144.1 billion: IMDA", "source": "BT", "date": "06 Oct 2026", "tags": ["Technology & AI", "Southeast Asia", "Society"], "summary": "Singapore's tech workforce grew 3.8% to 222,200 in 2025, driven by demand from non-tech sectors, while the digital economy expanded 5.6% to S$144.1 billion from S$136.5 billion, or 19.3% of GDP, IMDA's Singapore Digital Economy Report 2026 showed on Oct 5. Tech jobs in non-tech sectors rose 5.3% to 130,900, or 59% of the total, against 1.8% growth to 91,300 in tech sectors, and the median monthly tech wage edged up to S$8,000 from S$7,950. Digitalisation of non-tech sectors generated S$97 billion of nominal value-added, led by finance and insurance at S$39.1 billion, while the tech sector's value-added rose to S$47.1 billion, or 6.3% of GDP. IMDA aims to upskill 40,000 tech professionals in advanced AI skills over the next three years under the TechSkills accelerator programme.", "url": "https://www.businesstimes.com.sg/companies-markets/singapores-tech-workforce-grows-4-2025-digital-economy-hits-s144-1-billion-imda"}, {"id": "bt-06oct-18", "title": "Takaichi pledges fiscal discipline as Japan’s debt bill rises", "source": "BT", "date": "06 Oct 2026", "tags": ["Finance & Markets", "Politics"], "summary": "Japanese Prime Minister Sanae Takaichi pledged on Oct 5 to \"control\" bond issuance and act swiftly against market turbulence, telling parliament the government would pursue fiscal sustainability, including by reviewing tax breaks and subsidies, while ramping up growth spending. The 30-year JGB yield hit a record 4.235% that day on debt-issuance and Middle East war-fuelled inflation worries; Japan's public debt, roughly twice the size of its economy, is the developed world's largest. The government's immediate priority is legislation for her two-year food tax cut from next April, which sparked a bond selloff over a lack of detail on covering the revenue shortfall. Former BOJ Deputy Governor Masazumi Wakatabe, a member of the government's key economic panel, attributed rising yields to expectations of further BOJ rate hikes, not fiscal worries, minutes showed.", "url": "https://www.businesstimes.com.sg/international/takaichi-pledges-fiscal-discipline-japans-debt-bill-rises"}, {"id": "bt-06oct-19", "title": "Why a booming economy is not helping Trump", "source": "BT", "date": "06 Oct 2026", "tags": ["Politics", "Finance & Markets", "Technology & AI"], "summary": "In an FT column carried by BT, the chair of Rockefeller International argues that growth accelerating to near 4% in the third quarter is not helping Donald Trump, whose approval rating is plummeting. A Republican loss of both houses of Congress in November, which betting markets see as a live possibility, would be the first such defeat in conditions this favourable since the 1950s, he writes. He blames affordability and AI: petrol prices are up more than 40% in a year, mortgage rates top 7%, real wage growth has turned negative and nine in 10 Americans do not want a local data centre. He argues mostly AI-driven stock gains favour the wealthiest, a \"reverse Robin Hood effect\", and that a Republican rout would mean Trump had turned his party into a target.", "url": "https://www.businesstimes.com.sg/opinion-features/why-booming-economy-not-helping-trump"}, {"id": "scmp-06oct-01", "title": "Asset manager Schroders to expand in Hong Kong after merger with Nuveen, CEO says", "source": "SCMP", "date": "06 Oct 2026", "tags": ["Finance & Markets"], "summary": "UK fund house Schroders will increase investment and headcount in Hong Kong after its acquisition by US asset manager Nuveen, global CEO Richard Oldfield told the SCMP on Oct 2. Nuveen completed the deal on Oct 1, creating a group with about US$2.6 trillion in assets that would be Europe's second-largest asset manager after Amundi (US$2.7 trillion); the group mana
