dum yielded little progress, and clashes persist at Scarborough Shoal and Second Thomas Shoal. Analysts argue the Philippine constitution's resource-control clause need not block cooperation.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Could%20joint%20oil%20and%20gas%20projects%20help%20ease%20Beijing%20and%20Manila's%20South%20China%20Sea%20tensions.pdf"},{"id":"scmp-10","title":"Finland says it 'makes no sense' for Russia to risk attack on a Nato nation","source":"SCMP","date":"31 Aug 2026","tags":["Geopolitics","Defence"],"summary":"Finnish President Alexander Stubb said he does not believe Russia would risk attacking a Nato country, telling Germany's Bild it would \"make no sense\" to test the alliance's resolve. Western officials have warned of rising Russian hybrid operations, including cyberattacks, and German officials assess Moscow could be positioned to attack Nato by 2029, but Stubb said he sees \"neither evidence nor facts\" to support that timeline. He argued Nato's conventional, missile and nuclear strength is too strong to attack, citing intelligence. Russia is taking unsustainable losses in Ukraine, losing about 30,000-35,000 troops monthly while recruiting only 27,000, he said, making a two-front mobilisation implausible. Finland, which joined Nato in 2023, insists Ukraine is \"the best security guarantee we have against Russia.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Finland%20says%20it%20'makes%20no%20sense'%20for%20Russia%20to%20risk%20attack%20on%20a%20Nato%20nation.pdf"},{"id":"scmp-11","title":"Furore grows as Venezuela defends US oil deal with Trump","source":"SCMP","date":"31 Aug 2026","tags":["Geopolitics","Energy"],"summary":"Venezuelan acting president Delcy Rodriguez defended a deal granting the US exclusive access to the country's oil, facing criticism from both hardline Chavistas and opposition forces who call it an \"abdication of sovereignty.\" The agreement gives the US majority control over 65 billion barrels of crude, reportedly yielding Venezuela around US$19 profit per barrel, and analysts say it may deepen Trump's incentive to keep Rodriguez in power rather than push for swift elections. Negotiated without opposition leader Maria Corina Machado, the deal drew accusations of giving away resources under US threat and betraying Chavismo's resource-nationalism principles. Rodriguez's popularity has slid after a slow response to June earthquakes that killed over 6,500 people, complicating her balance between Washington and her political movement.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Furore%20grows%20as%20Venezuela%20defends%20US%20oil%20deal%20with%20Trump.pdf"},{"id":"scmp-12","title":"HKEX Tech 100 adds Pony AI, WeRide in index revamp targeting AI stocks","source":"SCMP","date":"31 Aug 2026","tags":["Finance & Markets","Technology & AI"],"summary":"Hong Kong Exchanges and Clearing (HKEX) will add 10 companies to its Tech 100 Index in a quarterly reshuffle that boosts exposure to artificial intelligence, including autonomous-driving firms Pony AI and WeRide, AI drug-discovery specialist Insilico Medicine, and enterprise AI firm Beijing Haizhi Technology. Fourteen constituents, including Alibaba Health, Ganfeng Lithium, JD Health, Bilibili and NetEase Cloud Music, will be removed, with changes effective September 14. The move follows a methodology overhaul to broaden coverage \"across the AI value chain,\" amid criticism that existing benchmarks lag the rise of Chinese AI firms. The Hang Seng Tech Index has fallen 16 per cent this year and the HKEX Tech 100 has dropped 13 per cent, both lagging global peers despite the AI stock surge.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/HKEX%20Tech%20100%20adds%20Pony%20AI,%20WeRide%20in%20index%20revamp%20targeting%20AI%20stocks.pdf"},{"id":"scmp-13","title":"Hormuz deal presses pause on Iran conflict, but fears of 'forever war' remain","source":"SCMP","date":"31 Aug 2026","tags":["Geopolitics","Energy"],"summary":"A diplomatic push by Oman, Pakistan and Qatar is expected to yield another pause in the Iran conflict, but analysts see little prospect of ending what they fear is becoming a \"forever war.\" Iran and Oman agreed in principle to a temporary maritime route through the Strait of Hormuz, potentially easing tit-for-tat blockades if Washington accepts. Hours after the deal, the Trump administration switched focus to secondary sanctions, with Treasury Secretary Scott Bessent describing the \"economic asphyxiation\" of Iran. Trump claimed the US Navy had demined Hormuz channels. President Masoud Pezeshkian vowed to \"stand firm,\" while the Revolutionary Guards insisted Hormuz remained under their control and fired on vessels using the US-organised route. Analysts expect Tehran to wait out the November US midterms.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Hormuz%20deal%20presses%20pause%20on%20Iran%20conflict,%20but%20fears%20of%20'forever%20war'%20remain.pdf"},{"id":"scmp-14","title":"Icelandic voters reject proposal to restart negotiations to join European Union","source":"SCMP","date":"31 Aug 2026","tags":["Politics","Geopolitics"],"summary":"Icelandic voters rejected restarting European Union accession talks in a referendum, with opponents winning 52.8 per cent to 47.2 per cent amid turnout above 82 per cent, the National Electoral Commission said. The influential fishing industry led opposition, fearing the bloc's common fisheries policy would open Iceland's prized waters to foreign trawlers. The vote was held in the shadow of US President Donald Trump's repeated threats to take Greenland; supporters argued European solidarity would offer protection, and the government moved up the referendum after Trump mistakenly named Iceland while discussing Greenland. Prime Minister Kristrun Frostadottir framed the result as \"a win for democracy\" and would not rule out revisiting the issue. Reykjavik was the only area backing the measure.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Icelandic%20voters%20reject%20proposal%20to%20restart%20negotiations%20to%20join%20European%20Union.pdf"},{"id":"scmp-15","title":"Iran's supreme leader remains unseen 6 months after war began","source":"SCMP","date":"31 Aug 2026","tags":["Geopolitics","Politics"],"summary":"Six months after air strikes propelled a badly wounded Mojtaba Khamenei into the role of Iran's supreme leader, he remains entirely unseen and unheard, creating a vacuum at the heart of the country's leadership. Reportedly disfigured, Khamenei is said to rule \"from the shadows\" for security reasons, delegating daily authority while holding final say, according to officials. But with no photograph, video or audio released since his appointment, and his absence from his father's funeral rites, scepticism is growing even among hardline Basij supporters. Iran has emerged battered but standing, its political system holding and its military still able to choke energy supplies. Yet the economy is buckling under an oil-export blockade, with inflation and a collapsing rial risking renewed mass protests.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Iran's%20supreme%20leader%20remains%20unseen%206%20months%20after%20war%20began.pdf"},{"id":"scmp-16","title":"Iranian leaders admit economic toll of war with US as trade drops 35%","source":"SCMP","date":"31 Aug 2026","tags":["Geopolitics","Finance & Markets"],"summary":"Iranian leaders are acknowledging the economic toll of the war with the US, with President Masoud Pezeshkian reporting foreign trade has shrunk nearly 35 per cent due to American sanctions and a naval blockade, and Supreme Leader Mojtaba Khamenei urging the government to tackle inflation, unemployment and prices. Annual inflation hit 66 per cent last month. As the war reaches six months, the Trump administration escalated its \"economic D-Day,\" warning countries to cut Iran ties or face secondary sanctions, though it stopped short of penalising major partners China and India. Treasury sanctioned Egypt's Banque Misr and an entity in Hong Kong linked to Bank Melli. Pezeshkian said Iran sold about 90 million barrels of oil during a short-lived June memorandum with Washington. Qatar is reviving diplomacy.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Iranian%20leaders%20admit%20economic%20toll%20of%20war%20with%20US%20as%20trade%20drops%2035.pdf"},{"id":"scmp-17","title":"JD.com's US$1.3b expansion could test Hong Kong's footfall-driven retail property model","source":"SCMP","date":"31 Aug 2026","tags":["Finance & Markets","Trade"],"summary":"JD.com's rapid Hong Kong expansion could challenge the footfall-driven property model that has long made the city's busiest streets its most valuable, analysts say. The Chinese e-commerce giant has invested over HK$10 billion (US$1.3 billion) in Hong Kong property over two years, part of a broader HK$35 billion push across retail, logistics and technology. Its stores, warehouses and logistics hubs are valued not just for rental income but for their role in a goods-moving network, potentially reducing footfall's importance for some retailers while lifting the value of strategically located logistics sites. Analysts call it a \"stress test\" for a model that reduces everything to land prices and footfall. Assets could later be recycled into a real estate investment trust, freeing capital while retaining infrastructure access.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/JD.com's%20US1.3b%20expansion%20could%20test%20Hong%20Kong's%20footfall-driven%20retail%20property%20model.pdf"},{"id":"scmp-18","title":"MiniMax expands Alibaba cloud pact as compute needs surge for training and inference","source":"SCMP","date":"31 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Chinese AI firm MiniMax has raised the three-year purchase ceiling on its cloud-computing deals with Alibaba by 220 per cent to US$1.2 billion, underscoring surging demand for computing power among China's top AI developers. The Shanghai-based company plans to spend up to US$300 million on Alibaba Cloud this year, nearly triple its original cap, after burning through two-thirds of its budget by June. Its API budget with Alibaba jumped over tenfold. MiniMax, known for its M-series models and Hailuo AI app, reported a 283 per cent first-half revenue surge to US$116.6 million, driven by a 700 per cent leap in enterprise sales, and raised HK$16 billion in July. It is also building an \"independent and controllable\" compute cluster using domestically made AI chips. Alibaba owns the Post.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/MiniMax%20expands%20Alibaba%20cloud%20pact%20as%20compute%20needs%20surge%20for%20training%20and%20inference.pdf"},{"id":"scmp-19","title":"PLA shift to systems warfare means Taiwan's defences need to change: experts","source":"SCMP","date":"31 Aug 2026","tags":["Defence","Geopolitics"],"summary":"The People's Liberation Army is increasingly embracing broader \"systems-oriented warfare\" over individual weapons platforms, a shift Taiwanese analysts warn poses new challenges to the island's defences. Under \"systems destruction warfare,\" Beijing could seek to disable critical nodes supporting Taiwanese forces, including satellites, radar, communications, command centres and logistics, rendering even sophisticated weapons ineffective without physically destroying them. Analysts, drawing on lessons from Ukraine and the US-Israel war on Iran, say the PLA emphasises distributed command, resilient \"kill webs\" and exploiting the cost imbalance between cheap Chinese drones and Taiwan's costly interceptors. Prolonged saturation attacks could exhaust missile stocks. Experts urge Taipei to adopt a \"high-low mix\" of interceptors and cheaper countermeasures, including electronic warfare, counter-drone systems, lasers and high-powered microwave weapons.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/PLA%20shift%20to%20systems%20warfare%20means%20Taiwan's%20defences%20need%20to%20change%20experts.pdf"},{"id":"scmp-20","title":"Russian drone strike near Kyiv kills at least 37","source":"SCMP","date":"31 Aug 2026","tags":["Geopolitics","Defence"],"summary":"At least 37 people died after a Russian drone struck a depot near Kyiv's western suburbs overnight, sparking a huge fire and explosions, authorities said. The facility in the town of Myla appeared to have been storing \"explosive objects,\" with President Volodymyr Zelensky suggesting ammunition was to blame and demanding accountability for storing munitions near homes. The blast damaged residential areas and a care home. Among the dead was Taras Didych, mayor of Dmytrivska village. Ukrainian prosecutors opened an investigation into the legality of the storage and whether the unnamed company held proper permits. Prime Minister Sergiy Koretsky said a \"lesson\" had not been learned after a similar deadly July attack in Vyshneve, calling repeated mistakes \"criminal negligence.\" Both sides have intensified long-range strikes.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Russian%20drone%20strike%20near%20Kyiv%20kills%20at%20least%2037.pdf"},{"id":"scmp-21","title":"Sony Music, Warner accuse Anthropic of 'blatant theft' in major new lawsuit","source":"SCMP","date":"31 Aug 2026","tags":["Technology & AI","Society"],"summary":"Sony Music Publishing, Warner Chappell Music and affiliates, 35 publishers in total, filed a lawsuit against Anthropic in California, accusing the AI firm of \"one of the largest and most blatant ongoing thefts of intellectual property in history\" by \"illegally torrenting, scraping and downloading\" copyrighted works. They seek an injunction and statutory damages, naming co-founders Dario Amodei and Benjamin Mann. Anthropic said it disagrees and will \"defend ourselves robustly.\" The case adds to legal challenges as Anthropic eyes a potential IPO with a valuation of up to US$2 trillion. Concord, Universal and BMG have separate suits over lyrics. Anthropic agreed last year to a US$1.5 billion settlement with authors, and unsealed documents revealed its \"Project Panama\" destructively scanned millions of books.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Sony%20Music,%20Warner%20accuse%20Anthropic%20of%20'blatant%20theft'%20in%20major%20new%20lawsuit.pdf"},{"id":"scmp-22","title":"Trita Parsi on why US air strikes strengthened Iran's hand and failed to trigger a revolt","source":"SCMP","date":"31 Aug 2026","tags":["Geopolitics","Politics"],"summary":"Quincy Institute co-founder Trita Parsi argues in an interview that the US-Israel war has strengthened Iran's regional hand and leverage, as many countries now see Tehran as having survived an attack almost no other nation could withstand. On Trump's \"economic D-Day\" secondary sanctions, which implicate some Chinese and Hong Kong firms, Parsi warns they will either fail to squeeze Tehran hard or, if effective, trigger counter-escalation, since \"Iran fears capitulation much more than escalation.\" With no clear demands from Treasury Secretary Scott Bessent, Tehran will read the sanctions as a push for surrender, restarting the escalatory cycle. Parsi sees no end in sight to the Strait of Hormuz standoff, though limited traffic may resume since both sides need it, and notes drained US ammunition raises risks of future fighting.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Trita%20Parsi%20on%20why%20US%20air%20strikes%20strengthened%20Iran's%20hand%20and%20failed%20to%20trigger%20a%20revolt.pdf"},{"id":"scmp-23","title":"US Treasury sanctions Hong Kong-based firm over Iran money laundering ties","source":"SCMP","date":"31 Aug 2026","tags":["Geopolitics","Finance & Markets"],"summary":"The US sanctioned Hong Kong-based Kameng Trading Ltd for allegedly acting as a front company to help Iran's sanctioned Pedram Pirouzan Exchange House (Opal Exchange) access the international financial system, the latest Chinese entity targeted in Washington's expanded pressure on Tehran's finances. Treasury Secretary Scott Bessent said the move, part of an operation dubbed \"Economic Outcast,\" aims to \"sever every economic lifeline Tehran has left.\" Kameng, incorporated in July 2024 with an office in Tsim Sha Tsui, lists an Indian passport holder based in Dubai as sole director. Treasury also sanctioned a Dubai-based Bank Melli branch manager. Tehran condemned the measures as \"state terrorism.\" The sanctions come as Beijing vows retaliation just weeks before President Xi Jinping's expected US visit.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/US%20Treasury%20sanctions%20Hong%20Kong-based%20firm%20over%20Iran%20money%20laundering%20ties.pdf"},{"id":"scmp-24","title":"US and China must team up to keep maritime trade routes free and safe","source":"SCMP","date":"31 Aug 2026","tags":["Trade","Geopolitics"],"summary":"This opinion piece argues the Strait of Hormuz crisis shows neither the US nor China benefits when key waterways become instruments of political pressure or economic coercion, and the two powers should cooperate to keep trade routes free and safe. With the 60-day US-Iran memorandum expired, Hormuz tensions have flared, illustrating how a strait can remain legally \"open\" while ships face military threats, higher insurance premiums, sanctions risks and forced re-routing. Global trade depends on chokepoints including the Malacca, Hormuz, Suez and Panama routes; disruption spreads quickly through freight costs and energy prices. China depends heavily on Malacca and Hormuz for trade and energy. The piece warns non-state actors like the Houthis could impose passage conditions, and says cooperation need not resolve broader disputes.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/US%20and%20China%20must%20team%20up%20to%20keep%20maritime%20trade%20routes%20free%20and%20safe.pdf"},{"id":"scmp-25","title":"Ukraine preparing for further talks with Trump envoys, Zelensky says","source":"SCMP","date":"31 Aug 2026","tags":["Geopolitics","Defence"],"summary":"Ukrainian President Volodymyr Zelensky said Kyiv is preparing for further talks with representatives of US President Donald Trump, pledging to ensure \"war does not remain the only option for how events unfold\" and noting America shares many of Ukraine's views. Former defence minister Mykhailo Fedorov is seeking US investment for a defence-technology fund, while new minister Yevhenii Khmara said Kyiv would try to bring forward part of a €45 billion (US$52.1 billion) EU loan. The death toll from Friday's Russian strike on an ammunition warehouse in Myla, the war's deadliest attack this year, rose to 38 with four missing and at least 52 injured. Russia has intensified daytime air raids and its Defence Ministry said it is preparing \"massive strikes\" on Ukraine's energy infrastructure.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Ukraine%20preparing%20for%20further%20talks%20with%20Trump%20envoys,%20Zelensky%20says.pdf"},{"id":"scmp-26","title":"Will Hong Kong see fewer creditor-led commercial property sales as assets stabilise?","source":"SCMP","date":"31 Aug 2026","tags":["Finance & Markets"],"summary":"Financial distress in Hong Kong's commercial property market has moderated but not disappeared, analysts say, with highly leveraged owners still struggling to refinance. The city's office and retail segments endured a multi-year slump as new supply outstripped demand and interest rates surged, triggering loan defaults. Colliers expects defaults to stabilise, but banks continue releasing distressed assets through mortgagee sales. Lower rates have eased debt-servicing pressure, with one-month Hibor around 2.6 per cent versus 7-8 per cent at end-2023. First-half non-residential transactions above HK$50 million rose 120 per cent to HK$22.3 billion. Savills estimates about HK$200 billion of non-performing property loans remain in the system, with distressed resales clearing at 35 to 56 per cent discounts, such as 299 Queen's Road Central's 70 per cent discount.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Will%20Hong%20Kong%20see%20fewer%20creditor-led%20commercial%20property%20sales%20as%20assets%20stabilise.pdf"},{"id":"scmp-27","title":"Will US threats over Iran be the last straw for Beijing?","source":"SCMP","date":"31 Aug 2026","tags":["Geopolitics","Trade"],"summary":"This analysis argues China's measured stance since the May Xi-Trump summit is reaching a tipping point as US pressure mounts. Treasury Secretary Scott Bessent threatened sanctions on any nation buying Iranian crude, implicitly targeting China, Iran's largest oil customer, while Washington unveiled new sanctions on 60 entities linked to Iranian trade. Since May, the Pentagon added Alibaba, Baidu and BYD to its \"Chinese military companies\" list, and the US imposed tariffs on 60 economies plus bans on Chinese robots and power inverters. Beijing has responded with calibrated, precise countermeasures rather than blanket retaliation, but has signalled it will retaliate \"forcefully\" against secondary sanctions over Iran. Two further flashpoints, an overcapacity investigation and a push to review China's PNTR status, could escalate the friction.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Will%20US%20threats%20over%20Iran%20be%20the%20last%20straw%20for%20Beijing.pdf"},{"id":"scmp-28","title":"Xi, Putin to meet in Bishkek for Power of Siberia 2 pipeline talks: Kremlin","source":"SCMP","date":"31 Aug 2026","tags":["Geopolitics","Energy"],"summary":"Chinese President Xi Jinping and Russian leader Vladimir Putin are expected to discuss the Power of Siberia 2 gas pipeline in Bishkek on Monday, the Kremlin said, in their second face-to-face meeting this year on the sidelines of the Shanghai Cooperation Organisation summit in Kyrgyzstan. Presidential aide Yury Ushakov said the long-stalled project, designed to boost Russian gas deliveries to China, would be discussed bilaterally. The 25th-anniversary SCO summit gathers leaders of India, Pakistan, Iran and Belarus amid the Ukraine war and Iran's conflict with the US, which has restricted passage through the Strait of Hormuz. First proposed in 2006, the 2,600km pipeline would deliver 50 billion cubic metres of gas annually to China via Mongolia. Trump also suggested targeting Chinese banks over Iran dealings.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20SCMP/Xi,%20Putin%20to%20meet%20in%20Bishkek%20for%20Power%20of%20Siberia%202%20pipeline%20talks%20Kremlin.pdf"}]}};</script>
