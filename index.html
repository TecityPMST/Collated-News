olds for weighted-voting-rights firms. HKEX lost its first-half 2026 IPO crown to Nasdaq after SpaceX's US$75 billion June IPO but reported record second-quarter and half-year profit. Advisers say it lowers friction costs and helps complex cross-border and dual mainland-Hong Kong listings.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20SCMP/Hong%20Kong%20stock%20exchange%20extends%20listing%20application%20window%20to%2012%20months.pdf"},{"id":"scmp-13","title":"Iran president says time to end war while Tehran is in position of strength","source":"SCMP","date":"24 Aug 2026","tags":["Geopolitics","Defence"],"summary":"Iranian President Masoud Pezeshkian said it was time to end the months-long war with the US while Tehran is \"in a position of power and dignity,\" claiming the world acknowledges Iran's victory. Talks remain on hold; the war begun by the US and Israel in February is stalemated, with Iran keeping the Strait of Hormuz partially shut and the US maintaining a naval counter-blockade. Pezeshkian defended a June memorandum of understanding as no capitulation. US Treasury Secretary Scott Bessent vowed to \"collapse\" the regime with sanctions, which Iran's foreign ministry called \"economic terrorism.\" China's Lin Jian said sanctions will not help. Xi Jinping is due at the White House on September 24. The US also imposed new sanctions on Hezbollah.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20SCMP/Iran%20president%20says%20time%20to%20end%20war%20while%20Tehran%20is%20in%20position%20of%20strength.pdf"},{"id":"scmp-14","title":"Israel-Turkey tensions rise after Netanyahu orders strikes on Syrian airbase","source":"SCMP","date":"24 Aug 2026","tags":["Geopolitics","Defence"],"summary":"Fears of an Israel-Turkey confrontation grew after Benjamin Netanyahu ordered eight air strikes on the Abu Al-Duhur airbase in Idlib, northwest Syria, near the Turkish border, a warning against Turkish military entrenchment and rebuilding Syria's armed forces. Netanyahu's office claimed Syria was breaching a security \"status quo\" by permitting Turkish deployment. Because Israel gave no advance notice, its jets could have triggered a clash; US envoy Tom Barrack noted Turkey's Nato military could have responded, recalling the 2015 downing of a Russian jet. Washington voiced \"deep concern\" over the \"unnecessary escalation.\" Analysts read the strikes as signalling to Damascus and an election-driven manoeuvre by Netanyahu, warning of a long, tense standoff amid waning US power and Turkey's growing role in shaping Syria.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20SCMP/Israel-Turkey%20tensions%20rise%20after%20Netanyahu%20orders%20strikes%20on%20Syrian%20airbase.pdf"},{"id":"scmp-15","title":"Panama Canal to reduce shipping over El Nino-fuelled drought","source":"SCMP","date":"24 Aug 2026","tags":["Environment","Trade"],"summary":"The Panama Canal Authority will cut daily ship transits due to an El Nino-driven drought lowering water levels in two artificial feeder lakes. From September 3, daily vessels fall from 36 to 34, then to 32 from September 15. Rainfall in the canal watershed from May to August is down 34 per cent from the historical average. The canal handles 5 per cent of global maritime trade and about 40 per cent of US container traffic; its main users are the US, China, Japan, Chile and South Korea. In 2023 low water cut transits from 38 to 22. Waiting times will rise, and auction bids have spiked, with one company paying US$4 million in April. Honduras placed 80 per cent of the country on drought alert.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20SCMP/Panama%20Canal%20to%20reduce%20shipping%20over%20El%20Nino-fuelled%20drought.pdf"},{"id":"scmp-16","title":"The African firms adopting Chinese AI as US-China rivalry intensifies","source":"SCMP","date":"24 Aug 2026","tags":["Technology & AI","Geopolitics"],"summary":"Across Africa, businesses are pragmatically adopting Chinese AI models where they offer better value or flexibility while keeping options open amid US-China rivalry. Nigeria's Curacel added Zhipu's GLM-5.3 alongside Western models, routing high-volume tasks like coding and data extraction to cheaper Chinese systems. Models such as DeepSeek, Alibaba's Qwen and Moonshot's Kimi, many open-weight and downloadable, are gaining ground. Huawei launched a South African \"model as a service\" platform offering DeepSeek, Qwen and GLM. Uganda's Sunflower farming AI was built on Qwen3 for local languages. A US State Department draft warned that joining China's Waico could exclude countries from the US-led Pax Silica coalition. Executives stress avoiding vendor lock-in and preserving data sovereignty, rejecting the idea that Africa must choose sides.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20SCMP/The%20African%20firms%20adopting%20Chinese%20AI%20as%20US-China%20rivalry%20intensifies.pdf"},{"id":"scmp-17","title":"The Mistral paradox: Europe's push for tech sovereignty relies on China's Z.ai","source":"SCMP","date":"24 Aug 2026","tags":["Technology & AI","Geopolitics"],"summary":"French AI champion Mistral, in a push for \"European infrastructure for sovereign AI,\" will offer other firms' models and has chosen GLM-5.2, an open-weight model from China's Zhipu (Z.ai), which sits on the US entity list. The move highlights how Europe's political and commercial incentives diverge: the EU is in a bitter trade dispute with China yet its firms, including carmakers, are drawn to cheap, advanced Chinese technology. Analysts say Europe cannot win on frontier models, making GLM-5.2 the strongest option. Experts note US pressure, from Pax Silica exclusivity to Nato letters and tariff threats, is pushing Europe toward Beijing. Critics warn open weights are not free and deepen dependence, potentially undermining the EU's trade leverage over China.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20SCMP/The%20Mistral%20paradox%20Europe's%20push%20for%20tech%20sovereignty%20relies%20on%20China's%20Z.ai.pdf"},{"id":"scmp-18","title":"US economist Barry Eichengreen on reality of de-dollarisation and next currency reshuffle","source":"SCMP","date":"24 Aug 2026","tags":["Finance & Markets","Geopolitics"],"summary":"In an Open Questions interview, Berkeley economist and former IMF adviser Barry Eichengreen argues genuine de-dollarisation is finally under way, driven by new doubts about US political institutions and alliance commitments under Trump, atop long-standing concerns over US debt. He expects a gradual shift to a multipolar system but stresses the yuan starts far behind: the dollar is nearly 60 per cent of central bank reserves versus the yuan's 2 per cent, and CIPS growth slowed sharply in 2025. Neither the euro nor the yuan can replace the dollar soon; non-traditional currencies captured three-quarters of the dollar's lost reserve share. He urges China to liberalise markets slowly, casts Hong Kong as a sandbox, doubts gold and stablecoins will dominate, and bets on central bank digital currencies.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20SCMP/US%20economist%20Barry%20Eichengreen%20on%20reality%20of%20de-dollarisation%20and%20next%20currency%20reshuffle.pdf"},{"id":"scmp-19","title":"US efforts to secure AI supply chains are doomed to fail: Chinese academic","source":"SCMP","date":"24 Aug 2026","tags":["Technology & AI","Geopolitics"],"summary":"Zheng Yongnian, dean of the school of public policy at the Chinese University of Hong Kong, Shenzhen, told a conference that US initiatives such as Pax Silica, the chip alliance and the rare-earth alliance are \"doomed to fail\" because they explicitly target a third party, and that banning US firms from using cheap Chinese AI models would be \"self-harm.\" He argued the US and China cater to different markets, with American firms favouring expensive closed-source models for affluent economies and China offering cost-efficient open-source ones for developing nations. He warned over 40 per cent of US growth is tied to AI, so a bubble burst would cascade globally. Calling decoupling unfeasible, he urged cooperation to boost demand in Africa, Asia and Latin America.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20SCMP/US%20efforts%20to%20secure%20AI%20supply%20chains%20are%20doomed%20to%20fail%20Chinese%20academic.pdf"},{"id":"scmp-20","title":"Wall Street helped build modern China. But is it now being cast aside?","source":"SCMP","date":"24 Aug 2026","tags":["Finance & Markets","Geopolitics"],"summary":"For decades Wall Street titans like Henry Paulson, Stephen Schwarzman and Ray Dalio were feted as \"old friends of China,\" but private access to top leadership has largely diminished even as Beijing gradually opens its capital markets. Analysts say China no longer needs foreign bankers' capital and expertise as it did 20 years ago. The 1990s-2000s honeymoon featured CICC (1995, with Morgan Stanley), Goldman's US$2.58 billion ICBC stake (2006) and Alibaba's US$25 billion 2014 NYSE IPO. Now only two mainland firms completed US debuts in the first half, raising US$59.5 million, the weakest in five years. Regulatory friction, Washington's hawkish turn and Beijing's self-sufficiency drive have eroded Wall Street's role, though a May delegation joined Trump's Beijing visit.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20SCMP/Wall%20Street%20helped%20build%20modern%20China.%20But%20is%20it%20now%20being%20cast%20aside.pdf"},{"id":"scmp-21","title":"Washington pushes 'America First' agenda in Apec talks ahead of Chinese leader's visit","source":"SCMP","date":"24 Aug 2026","tags":["Trade","Geopolitics"],"summary":"The United States pledged an \"America First\" approach at the latest Apec senior officials' talks in Dalian, China, weeks before Xi Jinping's visit to America. The State Department said it would seek opportunities for US business in agriculture, fisheries, energy, transport, health and food security, boost services exports and supply-chain innovation, and lead trade and labour discussions. The Dalian meeting, the third and largest this year, runs through Friday with more than 2,300 representatives and nearly 130 events, laying groundwork for November's Apec summit in Shenzhen. Trade is expected to top the agenda when Xi visits, following his May hosting of Trump in Beijing. China's customs official Zhang Baofeng urged Apec economies to remove trade barriers and strengthen supply-chain resilience.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20SCMP/Washington%20pushes%20'America%20First'%20agenda%20in%20Apec%20talks%20ahead%20of%20Chinese%20leader's%20visit.pdf"},{"id":"scmp-22","title":"Why Hong Kong's SK Hynix fund stayed at full leverage amid market volatility","source":"SCMP","date":"24 Aug 2026","tags":["Finance & Markets"],"summary":"CSOP Asset Management's Hong Kong-listed SK Hynix Daily Max (2x) Leveraged Product kept maximum double exposure every trading day even after adopting a flexible 1.1-to-2-times structure on August 3, deepening losses for investors like Seoul retail trader Carol Kim, who took a 77.2 per cent hit including foreign-exchange losses. The product had surged with SK Hynix, which jumped 349.23 per cent to a June 22 peak. In its first week under the new structure it fell 26.9 per cent, and assets shrank about 71.5 per cent to HK$37.65 billion from a HK$132.07 billion peak. CSOP said as a passive provider it does not adjust leverage on market views. Hong Kong's SFC overhauled rules on July 24, requiring flexible buffers and banning the ETF label for such funds.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20SCMP/Why%20Hong%20Kong's%20SK%20Hynix%20fund%20stayed%20at%20full%20leverage%20amid%20market%20volatility.pdf"},{"id":"scmp-23","title":"Why Trump's economic pain could spark more Iranian attacks on Gulf nations","source":"SCMP","date":"24 Aug 2026","tags":["Geopolitics","Energy"],"summary":"A Bloomberg analysis warns Trump's plan of new sanctions, a naval blockade and economic pressure on Iran's trading partners could prompt Tehran to retaliate with military strikes across the Gulf, including on energy infrastructure, to push up oil prices and force a US retreat. Treasury Secretary Scott Bessent will unveil details Monday of a campaign shifting from tit-for-tat strikes to full economic isolation, potentially touching China, India, Turkey and the UAE. Iran's Revolutionary Guard controls the Strait of Hormuz, keeping it largely shut and raising energy prices. Iran faces one of its worst economic crises, with inflation above 80 per cent, the rial down almost 30 per cent this year and oil exports \"virtually stopped.\" The IMF expects a 6.1 per cent contraction.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20SCMP/Why%20Trump's%20economic%20pain%20could%20spark%20more%20Iranian%20attacks%20on%20Gulf%20nations.pdf"}]},"2026-08-25":{"date":"2026-08-25","dayOfWeek":"Tuesday","totalArticles":89,"sourceCounts":{"WSJ":17,"ST":25,"BT":20,"SCMP":27},"executiveDigest":"Washington opened a maximal economic front on Iran: Treasury Secretary Bessent launched 'Operation Economic Outcast' - an 'Economic D-Day' that sanctioned Chinese entities with a global warning - even as Hormuz shipping dried up (fewer than 20 vessels over the weekend) and the US claimed 'oil is pouring through' the strait that trackers can't find. Markets braced for Warsh's Jackson Hole speech and US PCE: gold hit a three-month high and the dollar hovered near multi-month lows on debt nerves. In Singapore, National Day Rally follow-through dominated - a $70k support package and more childcare leave to lift births - while Trump threatened a 50% tariff on Canadian vehicles after trade talks collapsed.","briefingCards":[{"title":"Lead story - US launches 'Economic D-Day' on Iran","body":"The pressure campaign turned systematic: WSJ reported Bessent launched 'Operation Economic Outcast to isolate and squeeze Iran' as 'Trump unleashed Scott Bessent', and SCMP said the US 'sanctioned Chinese entities and issued a global warning on an Economic D-Day against Iran'. The physical toll on the strait grew - BT reported 'fewer than 20 ships transited Hormuz over the weekend' and the Total CEO put the cost of shipping oil through it at US$20 million - yet WSJ noted the paradox that 'the US says oil is pouring through Hormuz, but trackers can't find it'. China and Jordan called for Hormuz 'to get back to normal', China said it is 'actively committed' to peace talks, and ST laid out Iran's remaining escalation options as Houthis struck a ship off Saudi Arabia's Yanbu."},{"title":"Markets & finance","body":"All eyes turned to Jackson Hole: gold hit a three-month high 'ahead of US inflation data and the Fed chair's speech', the dollar 'hovered near multi-month lows as debt nerves unnerved investors', and BT and SCMP both flagged worry over Bessent's bond-buyback programme and 'America's US$40 trillion debt gamble'. Capital markets stayed busy - SoftBank planned a record 8 billion yen retail bond sale, Chinese memory giant YMTC is seeking a US$4.9 billion IPO, and Temasek's Azalea raised over US$1 billion 'despite a challenging PE environment'. Alibaba shares slid after a US$10.2 billion AI share sale 'offered at a sharp discount', though its top executives bought US$15 million of stock in a vote of confidence, and Singapore core inflation climbed to 2% on sharply higher electricity prices."},{"title":"Asia realignment","body":"The trade war widened west: Trump threatened a 50% tariff on Canadian vehicles and parts after talks collapsed, Canada's Carney tested his 'no deal is better than a bad deal' doctrine, China media hailed Canada's 'Chinese-style' retaliation, and Mexico turned 'optimistic' on its own US deal. Ahead of Xi-Trump talks, the US 'eyes China overcapacity tariffs of 7.5%', and WSJ warned Trump's 'war on tariff evasion could turn into a battle over global manufacturing'. Alliance doubts deepened - the US cancelled Marines drills with South Korea and ST said 'Trump's Kim gambit deepens doubts over US reliability' - while mainland China's ship activity near Taiwan 'hit a record for a third straight month' and Xi is likely to visit India."},{"title":"Energy & climate","body":"Oil stayed rangebound despite the drama - crude 'steadied as the economic D-Day plan offered little clarity on the Hormuz deadlock' - with traffic through the strait collapsing and Houthi attacks persisting. The transition and resource contest advanced: SCMP reported China 'boosts coal's economic value 700% by turning it to liquids', CATL debuted a direct-sales e-commerce platform, and WSJ pushed to 'Make American Magnesium Again'. Climate strain was acute across South-east Asia - Indonesia 'battles intensifying wildfires' gripped by El Nino, and Malaysia said Indonesia will 'open airspace for cloud seeding to tackle haze' - while Europe, having chastised Trump's climate rollback, is 'now delaying its own green goals'."},{"title":"Technology & AI","body":"The AI trade leaned on one name - WSJ said 'Wall Street is counting on Nvidia to keep the AI party going' - even as chip-security friction flared: Taiwan 'charged nine over smuggling AI servers to China', and Goldman still sees 'China's advanced-chip supply surging by 2035 despite equipment bottlenecks'. Robotics money moved: Xpeng's robotics unit raised US$900 million to 'challenge Tesla in embodied AI', though BT asked 'where the robotics returns will actually be earned' and ST noted 'the hardest thing for a robot to do is become useful'. The H-1B shock loomed - a proposed six-figure (US$100,000+) visa fee - while Britain and Ukraine signed an AI battlefield-tech defence partnership."},{"title":"Singapore & SEA focus","body":"National Day Rally follow-through led the local file: ST and BT parsed whether '$70k in support and more childcare leave' will lift births - with analysts warning 'childcare-leave salary caps still leave gaps for higher-income parents' - and framed the shift as giving parents 'more money and time', with workplace culture 'the next challenge'. The new Western island drew focus as a possible 'next-generation energy hub' (government will study 'rich marine biodiversity' before reclamation). Singapore leaned into AI 'on its own terms' - a new AI-agent platform for all public-healthcare professionals, DBS's career-advisory service for AI-driven change - while BT explained 'wealthy nations fear AI, but Singapore embraces it', and ST unpacked how Singapore manages the US 'transshipment scam' scrutiny."}],"keyMetrics":[{"value":"89","label":"Articles curated today","sub":"WSJ 17 · ST 25 · BT 20 · SCMP 27"},{"value":"'Economic D-Day'","label":"Bessent's Iran squeeze","sub":"Sanctions hit Chinese entities"},{"value":"<20 ships","label":"Hormuz transits collapse","sub":"US$20m to ship oil through: Total"},{"value":"3-mo high","label":"Gold pre-Jackson Hole","sub":"Dollar near multi-month lows"},{"value":"$70k","label":"NDR births package","sub":"More childcare leave for parents"},{"value":"50%","label":"Trump's Canada auto tariff","sub":"After trade talks collapse"}],"articles":[{"id":"wsj-01","title":"Bessent Launches 'Operation Economic Outcast' to Isolate and Squeeze Iran","source":"WSJ","date":"25 Aug 2026","tags":["Geopolitics","Energy","Finance & Markets"],"summary":"Treasury Secretary Scott Bessent announced \"Operation Economic Outcast,\" a campaign to isolate Iran by sanctioning more than 60 entities, individuals and vessels that help Tehran smuggle oil, evade sanctions and procure nuclear and missile technology. He warned any economic engagement with the regime would face the full reach of American power. Treasury said secondary sanctions could hit five sectors: digital assets, technology, gold, aviation and shipping, and suspended several remittance licenses. Bessent declined to set public compliance timelines but said U.S. patience was limited. He flagged plans to push European branches of Bank Melli to close and to sanction a financial institution this week. Trump is phoning world leaders. Iran's parliament speaker Ghalibaf dismissed the measures, saying \"no one buys their bombast.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20WSJ/Bessent%20Launches%20'Operation%20Economic%20Outcast'%20to%20Isolate%20and%20Squeeze%20Iran.pdf"},{"id":"wsj-02","title":"Canada's Carney Puts His 'No Deal Is Better Than a Bad Deal' Doctrine to the Test","source":"WSJ","date":"25 Aug 2026","tags":["Trade","Politics"],"summary":"Prime Minister Mark Carney walked away from U.S. trade talks Friday night, letting 50% tariffs on roughly $20 billion of Canadian goods take effect and testing his maxim that no deal is better than a bad one. He rejected \"unfair\" 11th-hour U.S. changes and pledged dollar-for-dollar retaliation, diverging from allies who rushed to sign lopsided deals with Trump. The stance drew broad support: Angus Reid found over 75% backed walking away, though nearly 90% worried about economic costs, and an Abacus poll showed just 18% favored concessions. Opponents including Conservative leader Pierre Poilievre and Ontario Premier Doug Ford lined up behind Carney, though some questioned retaliation. Risks include damaged business confidence in Canada's largest trading partner as talks over the relationship's future stall.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20WSJ/Canada's%20Carney%20Puts%20His%20'No%20Deal%20Is%20Better%20Than%20a%20Bad%20Deal'%20Doctrine%20to%20the%20Test.pdf"},{"id":"wsj-03","title":"Chinese Chip Maker YMTC Seeks $4.9 Billion IPO","source":"WSJ","date":"25 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"China's flagship memory-chip maker Yangtze Memory Technologies (YMTC) filed for a Shanghai IPO to raise $4.9 billion, one of the country's biggest semiconductor share sales in years. First-quarter revenue reached 47.04 billion yuan ($7.0 billion), beating full-year 2024, with core NAND flash revenue up nearly fivefold and net profit of 33.38 billion yuan. Gross margin surged to 77% from 35% as AI demand lifted NAND prices and kept factories near full capacity. Counterpoint Research ranks YMTC third globally in NAND shipments, ahead of Kioxia. It plans to issue 2.0 billion to 2.4 billion new shares, 10% to 12% of post-offering capital, to upgrade production. Analysts see a \"top-3 global NAND platform,\" though TrendForce warns of possible oversupply by late 2027 and U.S. tech restrictions persist.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20WSJ/Chinese%20Chip%20Maker%20YMTC%20Seeks%204.9%20Billion%20IPO.pdf"},{"id":"wsj-04","title":"EV-Maker Polestar Says Trump Administration Strung It Along Before U.S. Ban","source":"WSJ","date":"25 Aug 2026","tags":["Trade","Technology & AI"],"summary":"Chinese-owned EV maker Polestar told U.S. dealers in an Aug. 18 letter that the Trump administration blindsided it by forcing an exit from the American market while allowing corporate cousin Volvo Cars, which sells a nearly identical vehicle, to stay. The Commerce Department's June 24 denial came under a Connected Vehicles rule, originating under Biden, aimed at preventing Chinese spying via connected-car technology. Polestar and Volvo share majority owner Zhejiang Geely and build models on the same South Carolina line. Commerce officials had signaled approval was likely and cleared Volvo in May before denying Polestar in June. Polestar offered mitigation measures on data storage, auditing and cybersecurity. It sold fewer than 6,000 U.S. cars last year; one dealer is suing for at least $25 million.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20WSJ/EV-Maker%20Polestar%20Says%20Trump%20Administration%20Strung%20It%20Along%20Before%20U.S.%20Ban.pdf"},{"id":"wsj-05","title":"Europe Chastised Trump's Climate Rollback. Now It's Delaying Its Own Green Goals.","source":"WSJ","date":"25 Aug 2026","tags":["Environment","Energy","Politics"],"summary":"After chastising Trump's climate rollback, Europe, the U.K. and Canada are walking back their own environmental rules. The EU has proposed relaxing its carbon-pricing system and letting automakers sell gasoline cars longer; the U.K. may allow new North Sea oil and is reviewing EV targets; Canada scrapped its carbon tax and backs new oil-and-gas infrastructure. The retreat reflects concerns that green policies raise energy prices and stifle industry, especially after Russia's 2022 invasion slashed cheap gas supplies. Wind and solar now supply 34% of Europe's power, up from 20% in 2021, and the EU still targets 55% emissions cuts by 2030 and net-zero by 2050. Shell, BP and Equinor have scaled back renewables, and Germany rolled back a costly home-heating mandate.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20WSJ/Europe%20Chastised%20Trump's%20Climate%20Rollback.%20Now%20It's%20Delaying%20Its%20Own%20Green%20Goals..pdf"},{"id":"wsj-06","title":"Inside Indonesia's Push to Boost Commodity Market Credibility","source":"WSJ","date":"25 Aug 2026","tags":["Southeast Asia","Trade"],"summary":"Indonesia's Danantara Sumberdaya Indonesia (DSI), set up in May as the export-control arm of the roughly $1 trillion Danantara sovereign-wealth fund, aims to boost credibility and transparency in commodity markets rather than intervene, its head Luke Mahony said. Overseeing coal, palm oil and ferroalloys, about a quarter of exports, DSI's creation initially unnerved markets fearing redrawn contracts and disrupted trade. Mahony clarified DSI monitors the market, not participates, and won't take ownership of goods; existing contracts are recognized but reviewed for structural underinvoicing. Its board and five-year plan are still pending, and Bank of America economists call its role \"highly unclear.\" President Prabowo Subianto said trade manipulation and fraudulent export reporting cost Indonesia up to $908 billion from 1991 to 2024.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20WSJ/Inside%20Indonesia's%20Push%20to%20Boost%20Commodity%20Market%20Credibility.pdf"},{"id":"wsj-07","title":"Kevin Warsh's reluctance to signal where interest rates are headed has left the world unsure how he thinks about the economy or inflation. Fortunately, there's a trove of evidence on exactly how he thinks.","source":"WSJ","date":"25 Aug 2026","tags":["Finance & Markets","Politics"],"summary":"Fed Chairman Kevin Warsh's reluctance to signal rate intentions has left markets guessing how he views the economy and inflation, but his 2007-2011 projections as a Fed governor offer clues. Those forecasts and transcripts show his inflation views diverged from colleagues as the 2007-09 crisis eased: while others saw 9% unemployment as slack curbing prices, Warsh argued growth-unfriendly government policies had durably raised unemployment. For most of the following decade inflation ran below expectations and unemployment fell to 3.5% by 2020; the inflation he warned of arrived only with the pandemic and stimulus. Now chairing the rate-setting committee, Warsh emphasizes supply-side factors and AI-driven productivity. A longtime critic of the dot plot, he declined to submit forecasts at his first meeting as chairman in June.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20WSJ/Kevin%20Warsh's%20reluctance%20to%20signal%20where%20interest%20rates%20are%20headed%20has%20left%20the%20world%20unsu.pdf"},{"id":"wsj-08","title":"Make American Magnesium Again","source":"WSJ","date":"25 Aug 2026","tags":["Defence","Trade"],"summary":"In an op-ed, Rep. Elise Stefanik argues the U.S. must revive domestic magnesium production, a metal it designates critical yet no longer makes. America's last smelter failed in 2021 and went bankrupt last year, leaving China controlling 90% of global supply, up from 16% in 1999. Magnesium is essential to aerospace aluminum alloys, steel desulfurization, titanium refining and products from the F-35 to beer cans; without it, she warns, a nation cannot arm itself without China's permission. A 2021 Chinese energy crunch quintupled prices, and Beijing has restricted gallium and germanium exports. China is also scaling \"thixomolding\" for EVs, drones and robotics. Stefanik notes the U.S. invented seawater extraction and the Trump administration plans to invest $3 billion in critical minerals.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20WSJ/Make%20American%20Magnesium%20Again.pdf"},{"id":"wsj-09","title":"New tariffs have kicked in on U.S. imports from Canada after trade talks collapsed. Canada intends to set retaliatory tariffs starting in September. Here's what to know about the new levies.","source":"WSJ","date":"25 Aug 2026","tags":["Trade","Politics"],"summary":"New U.S. tariffs took effect Saturday on billions of dollars of Canadian imports after trade talks collapsed, with Canada planning retaliatory tariffs from Sept. 8, raising the risk of a wider trade war. The levies impose a 50% surcharge on a long list of goods including wine, hockey sticks, cement, honey, essential oils, candles and various paper, textile and electronic products; energy, potash and fish are exempt. Unlike earlier measures, USMCA-compliant exports aren't spared. The tariffs hit about $20 billion, roughly 5% of the $383 billion the U.S. imported from Canada in 2025. Steel, aluminum, auto parts and lumber already under national-security tariffs are excluded. Carney said U.S. terms threatened Canada's sovereignty; Trump separately threatened 50% auto tariffs from Jan. 1.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20WSJ/New%20tariffs%20have%20kicked%20in%20on%20U.S.%20imports%20from%20Canada%20after%20trade%20talks%20collapsed.%20Canada.pdf"},{"id":"wsj-10","title":"Taiwan Charges Nine in Connection With Smuggling of AI Servers to China","source":"WSJ","date":"25 Aug 2026","tags":["Technology & AI","Geopolitics"],"summary":"Taiwan prosecutors charged nine people, including former Nvidia and Super Micro Computer employees, with aiding shipments of advanced AI servers to China, as Taipei tries to curb technology reaching the mainland. Eight face charges including breach of trust and forgery; one is accused of siphoning company funds. Two defendants made false claims to secure approval to buy 130 Super Micro servers with high-end Nvidia chips, saying the hardware would stay in Taiwan. A Super Micro employee allegedly leaked internal vetting procedures, and an Nvidia employee assured managers inspections had cleared, though the facility lacked rack space, power and bandwidth. Ultimately 74 servers were shipped to China via Hong Kong, Japan and Indonesia; customs intercepted 56. Both companies said they are cooperating and deny wrongdoing.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20WSJ/Taiwan%20Charges%20Nine%20in%20Connection%20With%20Smuggling%20of%20AI%20Servers%20to%20China.pdf"},{"id":"wsj-11","title":"The Trump administration is proposing a new six-figure fee for H-1B visas that would apply to most new applicants, not just those applying from abroad","source":"WSJ","date":"25 Aug 2026","tags":["Politics","Technology & AI","Society"],"summary":"The Trump administration is proposing a $103,265 fee on new H-1B visa filings that would apply to most new applicants, not just those from abroad, replacing an earlier $100,000 charge struck down by a Boston appeals court. The Department of Homeland Security's Monday filing sets a 30-day public comment period; the fee must be paid before adjudication. The H-1B, capped at 85,000 new visas annually with nonprofit exemptions, is the main pathway for high-skilled foreign workers and is disproportionately used for Indian tech talent. The new levy would burden technology and finance firms recruiting international graduates but exempt hospitals, research institutions and nonprofits. The government projects $8.8 billion in revenue to fund the immigration system, including deportation courts. A separate $100,000 OPT fee is under review.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20WSJ/The%20Trump%20administration%20is%20proposing%20a%20new%20six-figure%20fee%20for%20H-1B%20visas%20that%20would%20apply.pdf"},{"id":"wsj-12","title":"Trump Threatens 50% Tariff on Vehicles and Parts From Canada","source":"WSJ","date":"25 Aug 2026","tags":["Trade","Politics"],"summary":"President Trump said the U.S. would impose 50% tariffs on automobiles and parts from Canada starting Jan. 1, 2027, escalating a weekend trade conflict. \"On January First, 2027, Tariffs on all Cars, Trucks...will be increased to 50%,\" he wrote on Truth Social. Current auto tariffs stand at 25% with U.S.-content discounts, while steel is already at 50%. The threat followed Carney's pledge to retaliate against separate tariffs Trump imposed Saturday on about 5% of Canadian exports. The move casts further doubt on the USMCA. Vice President JD Vance said a deal was still possible if Canada cut its levies, and Bessent urged Canada to negotiate in good faith. Carney said Canada would return only with the right attitude. Analysts warn a 50% levy could shutter Canadian auto plants.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20WSJ/Trump%20Threatens%2050%20Tariff%20on%20Vehicles%20and%20Parts%20From%20Canada.pdf"},{"id":"wsj-13","title":"Trump Unleashes Scott Bessent on Iran","source":"WSJ","date":"25 Aug 2026","tags":["Geopolitics","Energy"],"summary":"A Wall Street Journal editorial welcomes Treasury Secretary Scott Bessent's \"Operation Economic Outcast\" against Iran, which he likened to D-Day, vowing to sever every economic lifeline until Tehran stands alone. Trump is calling world leaders, and every country faces a defined timeline to halt identified activities or face unilateral U.S. action; a major financial-institution sanction is expected this week. The board notes Iran's oil exports have hit zero under the U.S. port blockade, the UAE halted all trade, and Iran's currency plunged past two million to the dollar. Iranian officials are increasingly anxious. The editorial questions whether the administration will follow through, especially against Chinese state banks and \"teapot\" refineries, and warns Dubai's sanctions-evasion network remains intact.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20WSJ/Trump%20Unleashes%20Scott%20Bessent%20on%20Iran.pdf"},{"id":"wsj-14","title":"U.K. to Share Classified Missile Technology With Ukraine","source":"WSJ","date":"25 Aug 2026","tags":["Defence","Geopolitics"],"summary":"The U.K. and France will send classified technology to Kyiv so Ukraine can domestically manufacture the Anglo-French cruise missile known as Storm Shadow, or Scalp, part of growing Western help for Ukraine to build its own weapons against Russia. Britain will let defense firm MBDA share proprietary information on British-made parts; Macron in July approved local production of French weapons including Scalp and Aster interceptors. The transfer doesn't solve Ukraine's core problem, funding, as Zelensky urges Europe to accelerate financial support. Ukraine also seeks a U.S. license for Patriot interceptors, which Trump backed then rowed back on, leaving Kyiv exposed. BAE Systems recently signed a howitzer deal, and Britain will gain access to Ukraine's Avengers AI laboratory for battlefield data.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20WSJ/U.K.%20to%20Share%20Classified%20Missile%20Technology%20With%20Ukraine.pdf"},{"id":"wsj-15","title":"U.S. Cancels Marines Drills With South Korea","source":"WSJ","date":"25 Aug 2026","tags":["Defence","Geopolitics"],"summary":"The U.S. has scrapped the large-scale \"Twin Dragons\" amphibious exercise with South Korea planned for next month, the latest American pullback in Asia amid the war in Iran. The drill involved thousands of U.S. and South Korean Marines rehearsing a beachfront landing to reassure allies of Washington's commitment. Seoul's military said Monday the exercise was canceled; the U.S. had cited Middle East demands in June. Over 2,000 Marines in Japan were moved to the Middle East in March, and a Pacific-based aircraft carrier was redeployed there. This follows Trump's early halt to the \"Ulchi Freedom Shield\" drills, which he called costly and hostile to North Korea. Lawmakers from both parties warned the pullback risks undermining the alliance; Pyongyang dismissed the move.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20WSJ/U.S.%20Cancels%20Marines%20Drills%20With%20South%20Korea.pdf"},{"id":"wsj-16","title":"U.S. Says Oil Is Pouring Through Hormuz. Trackers Can't Find It.","source":"WSJ","date":"25 Aug 2026","tags":["Energy","Geopolitics"],"summary":"The Trump administration says large volumes of oil are moving through the Strait of Hormuz, but commercial ship trackers see far less, exposing a persistent data gap. Energy Secretary Chris Wright said the U.S. military helped ship over 15 million barrels out of the waterway one Tuesday and put the seven-day average above 8 million barrels a day; trackers estimate 2 million to 6 million. Wright says private firms undercount ships crossing at night with transponders off. UKMTO, citing U.S. Navy data, reported 74 transits over three days but couldn't independently verify barrel counts and said commercial traffic stayed suppressed. Markets remain calm, with Brent around $90 a barrel; the premium of physical cargoes over futures has narrowed from $36 to under $6.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20WSJ/U.S.%20Says%20Oil%20Is%20Pouring%20Through%20Hormuz.%20Trackers%20Can't%20Find%20It..pdf"},{"id":"wsj-17","title":"Wall Street Is Counting on Nvidia to Keep the AI Party Going","source":"WSJ","date":"25 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Wall Street is banking on Nvidia's Wednesday earnings call to sustain the AI boom, with CEO Jensen Huang's remarks poised to sway a tech-heavy stock market and an economy tethered to AI hopes. The $5 trillion chip maker has beaten estimates for 14 straight quarters, posting 210% net-income growth last period; analysts project record $92 billion in sales and more than 95% earnings growth to over $51.5 billion. But warning signs are mounting: political pushback to AI, a bond selloff lifting borrowing costs, hyperscalers leaning on debt, and OpenAI's tepid 18% quarterly revenue growth with deepening losses. Nvidia is increasingly backstopping the market via a $500 billion AI-financing plan, a Cloverleaf Infrastructure stake and a $6 billion Poolside deal.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20WSJ/Wall%20Street%20Is%20Counting%20on%20Nvidia%20to%20Keep%20the%20AI%20Party%20Going.pdf"},{"id":"st-01","title":"AI can fix productivity. But there's a cost","source":"ST","date":"25 Aug 2026","tags":["Technology & AI","Society"],"summary":"Britain's economic data paint a K-shaped recovery under Labour: June growth of 0.3 per cent, business investment up 1.7 per cent and six straight quarters of FTSE 100 gains sit alongside weak private-sector wage growth, vacancies down to 707,000 and unemployment climbing to 4.9 per cent. LSE economists find annualised productivity growth of 1.6 per cent since 2024 Q3, versus 0.3 per cent the prior decade, but PAYE records suggest employment fell 133,000 even as official figures show a 377,000 rise. Authors see the first signs of AI reshaping the economy; Bank of England economists note vacancies dropping fastest in AI-exposed roles, with customer-service ads down 23 per cent a year since 2023. The column urges flexible policy to protect young and low-skilled workers.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20ST/AI%20can%20fix%20productivity.%20But%20there's%20a%20cost.pdf"},{"id":"st-02","title":"Britain's Burnham urges allies to do 'everything' to support Ukraine's skies","source":"ST","date":"25 Aug 2026","tags":["Geopolitics","Defence"],"summary":"British Prime Minister Andy Burnham on Aug 24 urged allies to \"do everything we can\" and \"dig into our own stocks of air defence\" to protect Ukraine from Russian attacks, speaking at his first meeting co-chairing the \"Coalition of the Willing\". He warned that Russian President Vladimir Putin is hoping to win \"through a campaign of terror using ballistic missiles against Ukrainian civilians\", saying this could \"never be the route to victory\" and that allies must send a clear message. Burnham called for working with partners beyond the coalition to source interceptors to counter missiles \"that are falling now\". He also pressed for more sanctions on Russian oil and LNG exports to intensify economic pressure on Moscow.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20ST/Britain's%20Burnham%20urges%20allies%20to%20do%20'everything'%20to%20support%20Ukraine's%20skies.pdf"},{"id":"st-03","title":"Britain, France pledge stronger support as Ukraine marks Independence Day","source":"ST","date":"25 Aug 2026","tags":["Geopolitics","Defence"],"summary":"Britain and France pledged stronger military support for Ukraine as Kyiv marked the 35th anniversary of independence, including access to classified technology and faster air defence missile deliveries. On his first foreign trip, PM Andy Burnham announced Britain would let Kyiv access classified tech to produce Storm Shadow long-range cruise missiles; France had already assented. The Kremlin warned this would \"add fuel to the fire\". President Volodymyr Zelensky said Ukraine wants peace but will not surrender, and cited a US$27 billion 2026 defence funding gap, suggesting frozen Russian assets could help. He said Ukraine needs at least 300 Patriot interceptors for winter. More than 50 countries at the UN urged Russia to accept an unconditional ceasefire. Fighting continues along a 1,200km front.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20ST/Britain,%20France%20pledge%20stronger%20support%20as%20Ukraine%20marks%20Independence%20Day.pdf"},{"id":"st-04","title":"Britain, Ukraine sign AI defence partnership linked to battlefield technology","source":"ST","date":"25 Aug 2026","tags":["Technology & AI","Defence"],"summary":"Britain said on Aug 24 it had signed a partnership with Ukraine to jointly develop AI tools for defence and security, giving British researchers access to Ukraine's Avengers AI Labs, making Britain its first international partner. PM Andy Burnham and President Volodymyr Zelensky signed the deal in Kyiv. Avengers Labs is built around an annotated dataset of five million battlefield images, largely from the military's domestically developed DELTA combat system. Ukraine said AI models trained on the data already power an automated target-detection system that analyses over 100,000 drone video feeds monthly and identifies about 70 per cent of enemy targets in real time. Pilot projects include fibre-optic cables as AI sensors and low-power AI chips for drones. Britain will also let MBDA release classified SCALP missile component data.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20ST/Britain,%20Ukraine%20sign%20AI%20defence%20partnership%20linked%20to%20battlefield%20technology.pdf"},{"id":"st-05","title":"China media hails Canada's 'Chinese-style' tariff retaliation","source":"ST","date":"25 Aug 2026","tags":["Trade","Geopolitics"],"summary":"China's nationalist tabloid Global Times praised Canada's retaliation against US tariffs, casting it as validating Beijing's opposition to Washington's protectionism. Calling Ottawa's move a \"Chinese-style counter-attack\", the paper said in an Aug 24 editorial that more countries realise concessions to the US do not bring respect or stability. Canada walked away from trade talks over the weekend; the US will impose 50 per cent tariffs on about US$20 billion of Canadian goods, while Ottawa pledged dollar-for-dollar retaliation from Sept 8. The editorial cited US trade representative Jamieson Greer likening Canada's measures to \"the kind of things that China would do\". Beijing-Washington ties have stabilised since 2025, with Xi Jinping expected to make his first US state visit in over a decade in September, while China-Canada relations have warmed under PM Mark Carney.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20ST/China%20media%20hails%20Canada's%20'Chinese-style'%20tariff%20retaliation.pdf"},{"id":"st-06","title":"Explainer: What are Iran's options to escalate further in face of US economic threats?","source":"ST","date":"25 Aug 2026","tags":["Geopolitics","Energy"],"summary":"With the US threatening \"the toughest sanctions in history\" after nearly six months of war, this explainer weighs Iran's escalation options. Officials including Mohsen Rezaei have threatened to halt all Gulf oil exports; Iranian attacks and threats have already stopped most traffic through the Strait of Hormuz, which once carried a fifth of global energy, and Tehran blacklisted 45 tankers. Houthi allies restrict Red Sea shipping via the Bab el-Mandeb strait, prompting Chinese firms to reroute. Attacks like the one off Yanbu could push crude prices higher. Iran has threatened Gulf neighbours with \"earthquake\" force, targeting US bases, energy infrastructure and potentially desalination plants. Beyond missile range, Revolutionary Guards may use cyber attacks, seen in Britain and Minnesota, and recruited operatives, which Tehran denies.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20ST/Explainer-What%20are%20Iran's%20options%20to%20escalate%20further%20in%20face%20of%20US%20economic%20threats.pdf"},{"id":"st-07","title":"Government will do studies on rich marine biodiversity before western island reclamation","source":"ST","date":"25 Aug 2026","tags":["Environment","Society"],"summary":"Singapore's Ministry of National Development said it will conduct technical, feasibility, environmental and site studies and engage stakeholders before reclaiming a new western island, announced at the 2026 National Day Rally to merge several southern islands for industry, energy and defence. Eleven scientists and nature groups warned of irreversible loss to mature habitats. Intertidal habitats that could fall within the potential area cover about 592.8ha, larger than Sentosa and over half the Southern Islands' intertidal areas, holding nearly all Singapore's remaining natural coral reefs. Huang Danwei noted reefs at Pulau Hantu and Pulau Semakau date back 8,000 years, with \"no mitigation\" for reefs lost to burial. Neo Mei Lin said 80-90 per cent of the giant clams she studies live there. Experts urged marine spatial zoning and building \"with nature\".","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20ST/Government%20will%20do%20studies%20on%20rich%20marine%20biodiversity%20before%20western%20island%20reclamation.pdf"},{"id":"st-08","title":"Gripped by El Nino, Indonesia battles intensifying wildfires","source":"ST","date":"25 Aug 2026","tags":["Environment","Southeast Asia"],"summary":"Peatland wildfires have burned for weeks across West Kalimantan, sending acrid haze over Indonesian Borneo and into Malaysia, forcing school closures in Pontianak. Experts fear a severe season as a \"super\" El Nino, possibly the strongest on record, suppresses rains. As of Aug 20, Nusantara Atlas tracked over 224,000 hot spots, resembling 2019 when up to 3 million ha burned; about 93,000ha burned in July alone. In 2015, some 2.6 million ha burned, and a Harvard-Columbia study linked the haze to around 100,000 premature deaths across Indonesia, Malaysia and Singapore. Experts blame degraded, drained peatlands from palm oil agriculture; dry peat becomes combustible fuel and burns underground. Indonesia has arrested over 70 people and investigated four companies, and turned to cloud-seeding, though its benefits are limited.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20ST/Gripped%20by%20El%20Nino,%20Indonesia%20battles%20intensifying%20wildfires.pdf"},{"id":"st-09","title":"How the French language contributed to the US-Canada trade war","source":"ST","date":"25 Aug 2026","tags":["Trade","Geopolitics"],"summary":"The US-Canada trade war has taken on a cultural dimension after talks collapsed. PM Mark Carney said the dispute was not just about tariffs but \"threats\" to the French language and \"Quebec culture\", citing subsidies for Francophone culture, Francophone online media and bilingual labelling as \"fundamental rights\". He accused the US of seeking to destroy Canada's auto, steel and aluminium industries. Canada now faces added tariffs on some US$20 billion of exports and doubled vehicle tariffs, with Carney vowing to match \"dollar for dollar\". An Angus Reid poll found 85 per cent of Quebecers backed breaking off talks, the highest of any province; Premier Christine Frechette, facing an October re-election, said \"our identity is not negotiable\". US trade representative Jamieson Greer called the language issue a \"funny fake story\", focusing on tech-earnings rules.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20ST/How%20the%20French%20language%20contributed%20to%20the%20US-Canada%20trade%20war.pdf"},{"id":"st-10","title":"Indonesia will build trustworthy commodity exchange, chief supervisor candidate Sarjito says","source":"ST","date":"25 Aug 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"Indonesia's upcoming minerals and strategic commodity exchange will be built on infrastructure that can be trusted, said Sarjito, President Prabowo Subianto's sole nominee to regulate commodity trading, at an Aug 24 parliamentary \"fit-and-proper\" hearing. The bourse is set to launch on Jan 1 as the resource-rich country seeks greater influence over prices of its commodities; Indonesia is the world's biggest exporter of thermal coal, palm oil and nickel, and a major supplier of tin, copper, bauxite and coffee. Sarjito, a former deputy commissioner at financial services authority OJK who retired in 2024, needs parliamentary approval. He said the OJK, the bourse, clearing agencies and warehouses must immediately build market trust: \"The exchange does not have to become huge on its first day, but it has to be trusted from the first transaction.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20ST/Indonesia%20will%20build%20trustworthy%20commodity%20exchange,%20chief%20supervisor%20candidate%20Sarjito%20sa.pdf"},{"id":"st-11","title":"Japan lawmakers visit China seeking to patch up ties","source":"ST","date":"25 Aug 2026","tags":["Geopolitics","Politics"],"summary":"A delegation of Japanese lawmakers left for China on Aug 24 seeking to repair ties strained by PM Sanae Takaichi's November 2025 comments suggesting Japan could intervene militarily in any Taiwan conflict, which angered Beijing. China warned citizens against travel to Japan and imposed trade restrictions reportedly cutting rare earth supplies to Japanese firms. The cross-party group comprises one ruling Liberal Democratic Party member and two opposition lawmakers, expected to meet senior Chinese Communist Party officials in the first such exchange since Takaichi's remarks. MP Shinichi Isa hoped to \"grasp an opportunity of dialogue\" amid a situation where \"everything is currently cut off\". LDP member Gaku Hashimoto had met Vice-Foreign Minister Hua Chunying in June. Former foreign minister Takeshi Iwaya is expected to lead a trip in late September.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20ST/Japan%20lawmakers%20visit%20China%20seeking%20to%20patch%20up%20ties.pdf"},{"id":"st-12","title":"National Day Rally 2026: Will $70k in support, more childcare leave get Singaporeans to have kids?","source":"ST","date":"25 Aug 2026","tags":["Society","Politics"],"summary":"In this podcast episode of The Usual Place, host Natasha Ann Zachariah examines whether National Day Rally 2026 measures will lift Singapore's total fertility rate, now at 0.87. PM Lawrence Wong's Aug 23 address made parents the focus, promising more childcare leave, financial support, lower pre-school fees and extra BTO ballot chances. Senior Parliamentary Secretary Goh Hanyan from the Ministry of Culture, Community and Youth explains why the Government shifted to treat every child equally. Reuben Ng, an associate professor at the Lee Kuan Yew School of Public Policy and father of four, discusses when further measures are needed. Topics include whether measures were good enough, tackling cost concerns first, the \"badge of honour\" around not taking leave, colleagues covering for parents, whether singles lose out, and the political risk of investing public funds in parenting.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20ST/National%20Day%20Rally%202026%20Will%2070k%20in%20support,%20more%20childcare%20leave%20get%20Singaporeans%20to%20have.pdf"},{"id":"st-13","title":"NDR support measures give parents more money and time; workplace culture the next challenge","source":"ST","date":"25 Aug 2026","tags":["Society","Politics"],"summary":"Parents welcomed National Day Rally measures that address practical family demands and focus support across children's growing years, but said workplace culture must change to shift mindsets around parenthood. PM Lawrence Wong on Aug 23 announced more childcare leave, lower pre-school fees and support worth nearly $70,000 a child to age 17, including a new SG Child Support Package worth $62,000 with a $10,000 Baby Gift and $32,000 in Child Credits paid $2,000 a year for 16 years. Childcare leave rises to 10 days per parent. Parents and MPs cited stigma, cover arrangements at small firms and career penalties for mothers. NTU's Chua Yeow Hwee said workplace culture is the next priority. Observers were cautious about lifting the total fertility rate, which hit a record low of 0.87 in 2025, calling the benefits \"necessary but insufficient\".","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20ST/NDR%20support%20measures%20give%20parents%20more%20money%20and%20time%20workplace%20culture%20the%20next%20challenge.pdf"},{"id":"st-14","title":"New platform to create AI agents available to all public healthcare professionals","source":"ST","date":"25 Aug 2026","tags":["Technology & AI","Society"],"summary":"AgentSea, a new agentic AI platform by national healthtech agency Synapxe, is now available to more than 80,000 public healthcare professionals in Singapore, letting them build customised AI agents using natural language with little technical expertise. Co-developed with Amazon Web Services, it embeds guardrails to protect patient data. Cardiologist Kenneth Chew built a tool that halved his 40-minute daily pre-clerking time; KK Women's and Children's Hospital used it to auto-generate rosters. Since its late-May launch, over 12,000 agents have been created, with more than 300 shared. Senior Minister of State for Health Tan Kiat How, speaking at the HIMSS 2026 APAC Conference on Aug 24, said safeguards must strengthen as AI gains agency, citing updated Ministry of Health guidelines. Healthcare is one of four national AI missions PM Wong named in February.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20ST/New%20platform%20to%20create%20AI%20agents%20available%20to%20all%20public%20healthcare%20professionals.pdf"},{"id":"st-15","title":"Pakistan's army chief meets Iran's president in Tehran","source":"ST","date":"25 Aug 2026","tags":["Geopolitics","Defence"],"summary":"Pakistan's army chief Asim Munir met Iranian President Masoud Pezeshkian in Tehran on Aug 24, Iranian state TV reported, as Islamabad tries to mediate a resolution to the Middle East war. The visit followed a call last week between US President Donald Trump and Munir. Pakistan brokered a memorandum of understanding in June, but peace negotiations now appear stalled. Munir also met parliamentary speaker and chief negotiator Mohammad Bagher Ghalibaf and Mohsen Rezaei, head of Iran's highest national security body. Iran's foreign ministry said the visit was part of \"Pakistan's ongoing efforts to help consolidate peace and security in the region\". Separately, US Treasury Secretary Scott Bessent on Aug 24 laid out plans for the \"economic asphyxiation\" of Iran, expanding secondary sanctions threats and warning countries against providing lifelines to Tehran.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20ST/Pakistan's%20army%20chief%20meets%20Iran's%20president%20in%20Tehran.pdf"},{"id":"st-16","title":"Pakistan's Munir spoke to Trump ahead of Tehran visit, sources say","source":"ST","date":"25 Aug 2026","tags":["Geopolitics","Defence"],"summary":"US President Donald Trump spoke with Pakistan's army chief Asim Munir last week ahead of Munir's Monday trip to Tehran, three Pakistani sources said, with one saying the main US request was to use Pakistan's influence to bring Iran back to negotiations. Trump has warned of economic consequences for any country giving Iran \"any type of lifeline\", while Iran has vowed to halt all Gulf oil exports. The previously unreported call was initiated by Trump. Munir arrived in Tehran with Interior Minister Mohsin Naqvi and was expected to meet people close to Supreme Leader Ayatollah Mojtaba Khamenei. Discussions were also expected to cover Houthi attacks on Saudi Arabia and a mutual defence pact between Pakistan, Turkey and Saudi Arabia. Pakistan's June-brokered Islamabad Memorandum quickly faltered; a source cited a \"trust deficit on both sides\".","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20ST/Pakistan's%20Munir%20spoke%20to%20Trump%20ahead%20of%20Tehran%20visit,%20sources%20say.pdf"},{"id":"st-17","title":"Putin allows Russia to take control of infrastructure deemed vulnerable to drone attacks","source":"ST","date":"25 Aug 2026","tags":["Geopolitics","Energy"],"summary":"Russian President Vladimir Putin on Aug 24 signed a decree granting the state power to take temporary control of critically important infrastructure judged poorly protected from Ukrainian drone attacks and other threats. The state can seize physical and financial assets and ownership rights if responsible entities fail in their duty to protect facilities or are too slow to repair them. It covers fuel, energy, industrial, communications, transport and logistics facilities. First Deputy PM Denis Manturov said the measure is not a precursor to nationalisation and would not be used broadly. Ukraine has stepped up drone strikes on oil refineries and warehouses: it has hit at least two dozen warehouses of top retailer Wildberries since July 18, and on Aug 24 second-largest retailer Ozon said four of its southern-Russia logistics hubs were targeted.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20ST/Putin%20allows%20Russia%20to%20take%20control%20of%20infrastructure%20deemed%20vulnerable%20to%20drone%20attacks.pdf"},{"id":"st-18","title":"Seoul says South Korea and US vow close cooperation on North Korea","source":"ST","date":"25 Aug 2026","tags":["Geopolitics","Defence"],"summary":"South Korean Foreign Minister Cho Hyun and US Secretary of State Marco Rubio spoke on Aug 24 and agreed to maintain close cooperation on resolving the North Korean nuclear issue, Yonhap reported, amid tension between the allies. President Donald Trump recently scaled back joint military exercises, praised nuclear-armed North Korea and said Seoul had not helped his efforts to denuclearise Iran. The US State Department issued only a brief statement. Seoul's ministry did not explicitly mention denuclearisation; Cho said Seoul would help ensure Trump's message to Pyongyang leads to resumed dialogue. Cho flagged friction over Seoul's US$350 billion US investment pledge under a 2025 trade deal, details of which remain unannounced. Both sides agreed to pursue \"mutually beneficial\" outcomes on tariffs, investment and security, and Cho backed restoring free passage through the Strait of Hormuz.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20ST/Seoul%20says%20South%20Korea%20and%20US%20vow%20close%20cooperation%20on%20North%20Korea.pdf"},{"id":"st-19","title":"SoftBank Group plans record $8b retail bond sale in Japan","source":"ST","date":"25 Aug 2026","tags":["Finance & Markets","Technology & AI"],"summary":"SoftBank Group plans a record one trillion yen (S$8 billion) retail bond sale, the biggest by any issuer in Japan, to fund its investment commitments to OpenAI. The seven-year bonds are expected to price on Sept 4 with an indicative coupon of 4.3 to 4.9 per cent, likely near the top end. Proceeds will refinance 400 billion yen of bonds maturing in September and fund AI investments; SoftBank has committed more than US$60 billion to the ChatGPT developer. The move mirrors a global AI funding rush, with Alphabet, Meta, Microsoft and Amazon pledging nearly US$2.4 trillion, and Alibaba raising US$10 billion in Hong Kong on Aug 24. SoftBank shares fell 5.3 per cent to 4,975 yen. Bloomberg Intelligence sees a shortfall over US$20 billion even after the issue. S&P rates the group BB+, one notch below investment grade, with a stable outlook.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20ST/SoftBank%20Group%20plans%20record%208b%20retail%20bond%20sale%20in%20Japan.pdf"},{"id":"st-20","title":"The hardest thing for a robot to do is become useful","source":"ST","date":"25 Aug 2026","tags":["Technology & AI","Society"],"summary":"In this commentary, SUTD professor and LionsBot co-founder Mohan Rajesh Elara argues robotics is entering a new phase, marked by Unitree Robotics' 2026 Shanghai IPO at about 61 billion yuan (S$11.5 billion) - shares up over 460 per cent on debut, retail tranche 8,000 times oversubscribed - as Singapore becomes a super-aged society with one in five aged 65 or older. He contends a general-purpose humanoid is at least a decade away because robots must master physics, not just information; the final 10 per cent of development is hardest. Purpose-built machines will dominate, and the race is to close the deployment learning loop fastest. He urges Singapore to become the first nation designed to work with robots via common building-to-city standards, citing an SUTD Robot-Friendly Building Level of Service, and to train graduates to command the machines.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20ST/The%20hardest%20thing%20for%20a%20robot%20to%20do%20is%20become%20useful.pdf"},{"id":"st-21","title":"Trump administration moves to impose more than US$100,000 fee for H-1B worker visas","source":"ST","date":"25 Aug 2026","tags":["Politics","Technology & AI"],"summary":"The Trump administration on Aug 24 released a proposed regulation to codify an unprecedented fee of more than US$100,000 (S$127,000) on new H-1B visas for highly skilled foreign workers, after a court blocked the temporary version imposed in 2025. The Department of Homeland Security's rule, posted in the Federal Register, would make a US$103,265 fee permanent and could be finalised by year-end. A federal judge ruled the fee illegal in June; appeals are ongoing. The H-1B programme offers 65,000 visas annually plus 20,000 for advanced-degree holders, previously costing US$2,000-US$5,000. The fee would exempt those already on student visas and renewals. Critics say the programme displaces American workers; business groups say it fills talent gaps. H-1B registrations fell to about 344,000 in 2025, down over 25 per cent. The US Chamber of Commerce and Democratic-led states are suing.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20ST/Trump%20administration%20moves%20to%20impose%20more%20than%20US100,000%20fee%20for%20H-1B%20worker%20visas.pdf"},{"id":"st-22","title":"Trump's Kim gambit deepens doubts over US reliability at a key moment for Asia","source":"ST","date":"25 Aug 2026","tags":["Geopolitics","Defence"],"summary":"Donald Trump's olive branch to North Korea's Kim Jong Un, at the expense of ally South Korea, has deepened Asian doubts over US reliability, officials and analysts say. Trump's abrupt move to cut back drills with Seoul - and a cancelled September exercise, blamed on the Iran war - fuels concern about his unpredictability. Japan fears sudden demands to pay more for hosting US forces and worries October's Keen Sword drills could be leverage; the diversion of the USS George Washington to the Middle East has stirred fears of eroded deterrence against China. Taiwan watches warily as Trump holds up a $14 billion arms package to preserve a trade truce with Xi Jinping ahead of a Washington summit. India, exasperated by steep tariffs and the renaming of Indo-Pacific Command to Pacific Command, is now \"very, very cautious\" about long-term defence deals.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20ST/Trump's%20Kim%20gambit%20deepens%20doubts%20over%20US%20reliability%20at%20a%20key%20moment%20for%20Asia.pdf"},{"id":"st-23","title":"US calls transshipments a 'scam': Why do firms reroute goods, and how does Singapore manage this?","source":"ST","date":"25 Aug 2026","tags":["Trade","Southeast Asia"],"summary":"This explainer examines US claims that transshipment - importing and re-exporting goods - hides true country of origin to evade tariffs. An Aug 13 White House report, \"The Great Transshipment Scam\", named Singapore, the world's biggest container transshipment hub, as \"a small opportunistic Chinese target\", and touted an AI-powered \"detective border\" tool. Analysts including Maybank's Chua Hak Bin say stricter scrutiny could let Singapore position itself as a trusted, traceable hub. In 2025 the Port of Singapore handled a record 44.66 million TEUs, up 8.6 per cent, with 85-90 per cent transshipped. Experts note most transshipment is legal and that the US deficit reflects its own macroeconomics. The report estimates evasion of US$40 billion-US$303 billion annually; a 40 per cent transshipment duty from July 2025 is unused, and a Trade Fraud Task Force has collected only US$1 billion.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20ST/US%20calls%20transshipments%20a%20'scam'%20Why%20do%20firms%20reroute%20goods,%20and%20how%20does%20Singapore%20manage.pdf"},{"id":"st-24","title":"Western island reclamation will create space for industries, low-carbon energy sources: Analysts","source":"ST","date":"25 Aug 2026","tags":["Energy","Environment"],"summary":"Analysts say Singapore's planned western island reclamation will create space for industries and power infrastructure that can tap the sea and benefit from proximity to Jurong Island and distance from homes. At the Aug 23 National Day Rally, PM Lawrence Wong outlined forming a new island by merging Pulau Semakau, Pulau Bukom and Pulau Sudong for industry, energy and defence over coming decades. Experts said it could be designed from scratch as an integrated low-carbon energy hub combining gas, low-carbon fuels, electricity imports, storage, renewables and potentially nuclear, boosting energy security. HY's Matthew Chew said seawater access and land flexibility make it a nuclear candidate, though no decision is made. Analysts cited benefits from co-locating the Singapore Armed Forces for security, but warned of costs, sea-level rise, height controls and environmental impacts.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20ST/Western%20island%20reclamation%20will%20create%20space%20for%20industries,%20low-carbon%20energy%20sources%20Ana.pdf"},{"id":"st-25","title":"Yemen's Houthis say they attacked ship off Saudi Arabia's Yanbu","source":"ST","date":"25 Aug 2026","tags":["Geopolitics","Energy"],"summary":"Yemen's Iran-aligned Houthis attacked a vessel off Saudi Arabia's Red Sea port city of Yanbu, military spokesman Yahya Saree said in a televised speech on Monday. Saudi national shipping company Bahri later said one of its vessels, the Amzan, was involved in a maritime incident in the Red Sea, with all crew safe and no injuries. The United Kingdom Maritime Trade Operations agency said a tanker was struck by an unknown projectile 63 nautical miles west of Yanbu, with no reported environmental impact. Yanbu is Saudi Arabia's main Red Sea oil port, loading millions of barrels a day, and has become the main route out for Saudi oil skirting the Iran-blockaded Strait of Hormuz. Shipping from Yanbu has faced disruption since the Houthis declared a blockade on Saudi-linked vessels last month; in July they claimed to have targeted Aramco facilities there.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20ST/Yemen's%20Houthis%20say%20they%20attacked%20ship%20off%20Saudi%20Arabia's%20Yanbu.pdf"},{"id":"bt-01","title":"Alibaba shares slide after US$10.2 billion AI share sale offered at sharp discount","source":"BT","date":"25 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Alibaba's Hong Kong shares fell 9.1 per cent after it launched a US$10.2 billion (HK$80 billion) share sale at HK$112.70 apiece, an 8.4 per cent discount to Friday's close, to fund chips, AI infrastructure and models. It is the largest-ever primary follow-on offering by a Hong Kong-listed firm and the third-largest globally in 2026 after Alphabet and Intel. The deal drew US$28 billion of orders, including US$6 billion from long-only and sovereign investors such as Qatar's QIA, Norway's Norges and Hillhouse. Investors flagged dilution and execution risks. AI is now Alibaba's biggest revenue driver even as e-commerce stagnates; net profit fell 75 per cent last quarter on AI spending. Chinese hyperscalers still invest far less than US peers hampered by Nvidia export curbs.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20BT/Alibaba%20shares%20slide%20after%20US10.2%20billion%20AI%20share%20sale%20offered%20at%20sharp%20discount.pdf"},{"id":"bt-02","title":"Beyond the backflipping humanoid: where will the robotics returns actually be earned?","source":"BT","date":"25 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"This commentary by a Vertex Ventures investor argues humanoid-robot valuations have run far ahead of fundamentals. Figure AI raised over US$1 billion at a US$39 billion valuation despite revenue in the low tens of millions; Apptronik, Norway's 1X and China's Unitree (US$66 billion at IPO, up 600 per cent on debut) command similar multiples. The writer sorts robotics by how much the environment varies: structured (commoditised), unstructured (the humanoid's difficult target) and semi-structured. He favours purpose-built vertical robots in semi-structured settings such as washroom cleaning and self-driving (Waymo), which win on cost per task and where valuations remain reasonable. Singapore, with high labour costs and firms like Hivebotics, Neptune Robotics and BeeX, is a strong test bed, though small.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20BT/Beyond%20the%20backflipping%20humanoid%20where%20will%20the%20robotics%20returns%20actually%20be%20earned.pdf"},{"id":"bt-03","title":"China 'actively committed' to US-Iran peace talks as tensions rise","source":"BT","date":"25 Aug 2026","tags":["Geopolitics","Energy"],"summary":"China said it continues to back a diplomatic end to the US-Iran war, in a delayed statement released just before Washington was set to unveil measures punishing Teheran's economic partners. Vice-Foreign Minister Miao Deyu told Iran's deputy foreign minister Kazem Gharibabadi in Beijing on Aug 17 that China is \"actively committed to promoting peace talks\"; the meeting was disclosed only on Aug 23. The timing preceded US Treasury Secretary Scott Bessent's plan to shift the conflict to full economic isolation. China buys the bulk of Iran's oil and was its second-largest trading partner in 2025. Any US pressure on China over Iran could strain ties weeks before Xi Jinping's planned Washington visit, which analyst Wu Xinbo said has been disrupted by the Iran issue.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20BT/China%20'actively%20committed'%20to%20US-Iran%20peace%20talks%20as%20tensions%20rise.pdf"},{"id":"bt-04","title":"China's Xi likely to visit India with big delegation for first time in seven years","source":"BT","date":"25 Aug 2026","tags":["Geopolitics"],"summary":"Chinese President Xi Jinping is likely to attend the Sep 12-13 Brics summit in New Delhi with a delegation of about 400 officials, three sources said, in what would be his first India visit in seven years and a sign of thawing ties. India is hosting; Xi's presence would be watched for signals about stabilising relations after deadly 2020 border clashes that killed 20 Indian and four Chinese soldiers. Last year PM Modi visited China, and a disengagement pact was reached in October 2024, but a fresh border dispute recently triggered sharp exchanges. India's NSA Ajit Doval began Beijing talks with Wang Yi on the boundary. Trump's trade policies have created convergence, making Xi's attendance a signal against external pressure on Brics.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20BT/China's%20Xi%20likely%20to%20visit%20India%20with%20big%20delegation%20for%20first%20time%20in%20seven%20years.pdf"},{"id":"bt-05","title":"Core inflation climbs to 2% in July; electricity prices rise sharply","source":"BT","date":"25 Aug 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"Singapore's core inflation rose to 2 per cent in July from June's 1.6 per cent, its highest since October 2024, but below the 2.2 per cent median forecast, MAS and MTI said. Headline inflation picked up to 2.2 per cent from 1.9 per cent, also under the 2.4 pe
