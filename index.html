etary Pete Hegseth to produce a plan within 60 days for using hydraulic catapults in the next Gerald Ford-class carrier, the planned USS Doris Miller. The Navy has struggled with the modern electromagnetic launch system on the USS Gerald R. Ford. Trump recounted a servicemember saying \"steam is better\", adding it could be fixed \"with a hammer and a blowtorch\". The decision is likely to cost hundreds of millions of dollars given the required redesign. The memo also directs Hegseth to plan a fifth Navy shipyard and a new surface-ship acquisition approach.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Trump%20orders%20US%20aircraft%20carriers%20to%20go%20back%20to%20steam%20catapults.pdf"}, {"id": "scmp-22", "title": "Trump turns to economic pain as US bombings fail to sway Iran", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "With its military campaign failing to force Iran to capitulate, the Trump administration is again betting that economic pressure will do the job. Facing a munitions shortfall and wary of an unpopular war, officials are returning to \"maximum pressure\", relying on sanctions and a naval blockade to stifle oil exports. UN ambassador Mike Waltz said \"Operation Economic Fury\", led by Treasury Secretary Scott Bessent, is \"devastating the Iranian economy\". The US has added some 2,200 sanctions since 2018, about 350 under Bessent's push. Critics note decades of sanctions on Iran, North Korea and Cuba have not sparked political change; analyst David Tannenbaum said \"the regime is entrenched\". A key option is hitting China and India, Iran's biggest oil buyers, though targeting major Chinese banks carries diplomatic costs.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Trump%20turns%20to%20economic%20pain%20as%20US%20bombings%20fail%20to%20sway%20Iran.pdf"}, {"id": "scmp-23", "title": "US accuses Chinese exporters of masterminding 'Great Transshipment Scam'", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Trade", "Geopolitics"], "summary": "The Trump administration released a 25-page report accusing Chinese exporters of orchestrating \"illegal transshipment\" through more than 40 third countries to dodge US tariffs, branding it \"The Great Transshipment Scam\". It alleges firms use limited assembly, relabelling and false country-of-origin declarations since the 2018 trade war began. Trade adviser Peter Navarro said the scheme let China \"launder its exports\" and \"rob our treasury of tens of billions\". China's embassy opposed \"overstretching the concept of national security\". Named countries include Canada, Mexico, Japan, South Korea, the EU and most of Southeast Asia. The report cites suspect transshipment of US$40-303 billion annually and estimates 450,000 displaced US jobs, using AI monitoring dubbed \"Detective Border\". Mexico and Vietnam face particular scrutiny; the findings precede an expected Xi-Trump summit.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/US%20accuses%20Chinese%20exporters%20of%20masterminding%20'Great%20Transshipment%20Scam'.pdf"}, {"id": "scmp-24", "title": "What the Mecca military pact means for China", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "This analysis argues the Mecca defence agreement between Saudi Arabia, Turkey and Pakistan presents a complex strategic calculus for Beijing. The tripartite pact, treating an attack on one as an assault on all, fuses Saudi capital, Turkish military technology and Pakistani manpower into an autonomous bloc born of eroding confidence in Western security guarantees. Beijing welcomes the erosion of America's Persian Gulf security monopoly, which validates its multipolar vision and could protect Belt and Road trade and energy routes. But liabilities loom: the pact, engineered as a deterrent against Iran, threatens China's strategic partnership with Tehran and its neutral-broker role from the 2023 Saudi-Iran rapprochement. Turkey's Kaan jet and drones also compete with Chinese defence exports. Beijing's stance will remain pragmatic and cautiously supportive under \"regional ownership of security\".", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/What%20the%20Mecca%20military%20pact%20means%20for%20China.pdf"}, {"id": "scmp-25", "title": "Zhu Rongji's legacy: how the late premier reshaped state firms, Pudong and China's economy", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Politics", "Finance & Markets"], "summary": "Former Chinese premier Zhu Rongji, who died on Wednesday at 97, is remembered as a candid, decisive reformer who championed entrepreneurship, welcomed foreign management expertise and brought urgency to economic policymaking, according to four people who knew him for decades. Zhang Chongqing recalled Zhu as \"intelligent, insightful, outspoken and decisive\", sharing his office phone number with foreign guests. As premier, Zhu launched China's biggest state-owned enterprise reform, bankrupting tens of thousands of inefficient \"zombies\" and laying off millions, measures that revitalised the economy and made room for private and foreign firms. He helped set up Tsinghua's School of Economics and Management in 1984 and advocated adopting advanced foreign textbooks. His April 1999 Washington trip underpinned WTO accession and market opening, now a subject of reflection amid US-China rivalry.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Zhu%20Rongji's%20legacy%20how%20the%20late%20premier%20reshaped%20state%20firms,%20Pudong%20and%20China's%20economy.pdf"}]}, "2026-08-17": {"date": "2026-08-17", "dayOfWeek": "Monday", "totalArticles": 97, "sourceCounts": {"WSJ": 24, "ST": 21, "BT": 26, "SCMP": 26}, "executiveDigest": "The Iran war became a test of 'who blinks first' under economic pressure: the US reframed its goal to 'cheaper oil for Americans', Trump said he would 'soon declare the Strait of Hormuz to be US territory', and oil rallied on fresh tanker attacks. Weaker US data - retail sales slid and consumer sentiment dropped - dented Fed-hike odds, and gold held near a two-month high around US$4,400. Singapore stood out: it raised its 2026 growth targets again, its stocks hit a record on a 'Goldilocks' boost, and OpenAI moved to expand its footprint with talks to lease 100,000 sq ft at Shaw Tower.", "briefingCards": [{"title": "Lead story - Iran war shifts to economic attrition", "body": "The conflict entered a war-of-nerves phase: WSJ said 'the Iran war is now about who blinks first under economic pressure', SCMP reported the US 'shifted its war goal, saying cheaper oil for Americans is the top priority', and Trump declared he would 'soon call the Strait of Hormuz US territory'. Pressure tools multiplied - Iran offered a bounty of more than US$38,000 to kill or capture US soldiers and said missing pilots are 'prisoners in Qatar', while WSJ profiled 'a sprawling Chinese refinery bankrolling Tehran'. Oil rallied 'on tanker attacks and no progress on peace', even as Israel struck Lebanon 'as the end of the US-Iran ceasefire looms'. ST laid out Trump's economic-pressure options in an explainer."}, {"title": "Markets & finance", "body": "US data softened the rate outlook: retail sales slid in July, Michigan consumer sentiment dropped, and an oil rally further 'dented the chances of a Fed rate hike'. Gold held near a two-month high around US$4,400, emerging-market currencies capped their best streak since 2024, and money managers chased a historic US$577 billion German pension shift. The yen was a flashpoint - Marubeni favours a strong yen, a former top diplomat sees 'more intervention and faster BOJ hikes', and 'traders are spoiling for a fight' - while WSJ argued 'Warsh is wise to ditch the dots'. Bond desks flagged 'US$70 billion in phantom liabilities' around AI-firm credit backstops, and WSJ warned 'big tech earnings are inflated by other tech companies'."}, {"title": "Asia realignment", "body": "Washington pressed allies to choose sides: ST reported the US 'will tell partners they must pick sides in the AI race with China', and a White House report pegged illegal transshipment at US$19-26 billion in lost tariff revenue - prompting Singapore to require firms to 'declare the true country of origin' and, economists said, potentially tighten further. Trump unveiled drone-import tariffs, ousted-adjacent friction saw South Korea's trade minister removed amid tariff pressure, and Trump told the Pentagon to 'reduce military exercises with South Korea', citing Seoul's Iran-war stance. Beijing manoeuvred too - opening a regular Arctic cargo route, issuing a South China Sea 'ecological report', and being urged to ready civilian ships for wartime - while the Saudi-Turkey-Pakistan pact signalled 'a realigning global order'."}, {"title": "Energy & climate", "body": "Oil firmed on Middle East risk - climbing over US$1 on tanker attacks - as attention fixed on Hormuz and Lebanon, and WSJ detailed how a Chinese mega-refinery keeps 'bankrolling Tehran'. The energy transition advanced elsewhere: China's 1MW perovskite solar farm 'beat a silicon system in an industrial-scale test', and China opened its first regular Arctic cargo route as ice recedes. Climate risk moved onto balance sheets - the AIIB warned inaction 'could downgrade a third of sovereign borrowers by 2050', Europe's heat-parched land threatens next year's crops, and a widening insurance gap is leaving European businesses with a mounting 'heatwave bill'."}, {"title": "Technology & AI", "body": "The AI money machine drew fresh scrutiny even as it accelerated: Anthropic's Q2 revenue surged past US$11.5 billion, Alibaba's Qwen hit 3 billion downloads, and CXMT overtook Tencent as China's most valuable firm 'amid an AI frenzy'. Nvidia was everywhere - downsizing its US$250 billion OpenAI data-centre guarantee, holding US$21 billion of SpaceX and US$30 billion of Intel, and in talks to put US$3 billion into a SoftBank unit - while Stripe bought OpenRouter for over US$7 billion and is in talks to buy PayPal. But cracks showed: WSJ chronicled 'how AI models from OpenAI and Anthropic went rogue', and bond traders fret over 'phantom liabilities' in AI credit. Geopolitically, the US urged Apple not to buy Chinese memory chips as 'the US-China tech war comes for AI's plumbing'."}, {"title": "Singapore & SEA focus", "body": "Singapore's momentum extended: it raised its 2026 growth targets again, and its stocks hit a record on a 'Goldilocks' boost from stronger growth. The AI build-out went local - OpenAI is in talks to lease 100,000 sq ft at Shaw Tower, data-centre S-Reits 'powered ahead on AI and cloud growth', and ST noted Singapore's newest data centre 'needs to be fed' (power). Trade compliance tightened after the US transshipment report, with MTI requiring true country-of-origin declarations. Among corporates, Straits Trading's H1 net loss narrowed 72.7% to S$11.1 million. Regionally, Malaysia's central bank was 'upbeat as Q2 growth beat expectations', and DAP's vote to stay in Anwar's alliance secured stability - 'but at what cost?'."}], "keyMetrics": [{"value": "97", "label": "Articles curated today", "sub": "WSJ 24 · ST 21 · BT 26 · SCMP 26"}, {"value": "Who blinks first", "label": "Iran war goes economic", "sub": "Trump eyes Hormuz 'US territory'"}, {"value": "Rally", "label": "Oil on tanker attacks", "sub": "Weak US data dents Fed-hike odds"}, {"value": "Record + raise", "label": "SG stocks & 2026 growth", "sub": "'Goldilocks' boost"}, {"value": "US$11.5b", "label": "Anthropic Q2 revenue", "sub": "Qwen hits 3b downloads"}, {"value": "US$19-26b", "label": "US transshipment loss", "sub": "SG tightens origin rules"}], "articles": [{"id": "wsj-01", "title": "New White House Report Says Illegal Transshipment Costs U.S. $19 Billion to $26 Billion in Annual Tariff Revenue", "source": "WSJ", "date": "17 Aug 2026", "tags": ["Trade", "Geopolitics"], "summary": "A report led by White House trade adviser Peter Navarro estimates illegal transshipment costs the U.S. $19 billion to $26 billion in annual tariff revenue, as Chinese exporters route nearly finished goods through third countries to dodge American tariffs. Ahead of a September Xi Jinping visit, it names over 40 enabling nations, including Vietnam, Malaysia, Canada, Mexico and the EU. Proposed fixes include AI border scanning and tighter country-of-origin rules. The effective tariff rate on Chinese goods was about 23% in June, more than triple other partners. The report cited third-party transshipment estimates ranging from $40 billion to $303 billion. Trade analyst Deborah Elms said, \"This is a problem that you created.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20WSJ/A%20new%20report%20led%20by%20White%20House%20trade%20adviser%20Peter%20Navarro%20estimates%20illegal%20transshipmen.pdf"}, {"id": "wsj-02", "title": "Big Manufacturers Find New Demand in Equipping AI Data Centers", "source": "WSJ", "date": "17 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "U.S. industrial companies including Caterpillar, Cummins, Eaton and Ford are pivoting toward AI data centers, driving manufacturing to its highest level since 2022. Caterpillar is investing $725 million to expand generator output in Indiana, with a backlog stretching to 2030; power generation is now its top profit source. Cummins is spending $450 million and expects data-center sales to rise 80% to $9 billion by 2030. Ford's new energy unit will redirect $2 billion of EV batteries to storage. Eaton has spent $13 billion on acquisitions since 2025. Economists warn of overbuilding risks; Harvard's Willy Shih likened the boom to late-1990s fiber optics. Caterpillar CEO Joe Creed said, \"No one is slowing down at the moment.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20WSJ/Big%20Manufacturers%20Find%20New%20Demand%20in%20Equipping%20AI%20Data%20Centers.pdf"}, {"id": "wsj-03", "title": "Businesses Are Spending Big on Quantum", "source": "WSJ", "date": "17 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Enterprise users spent $300 million on quantum computing in 2025, outranking combined research-lab and government spending for the first time, per Boston Consulting Group. Of the top 275 global companies surveyed, 62% spent at least $1 million yearly with a dedicated program. Firms like HSBC, Allstate and EY are investing to secure talent and prepare defensively before quantum computers can break current encryption. HSBC demonstrated a bond-optimization use case with IBM showing up to 34% improvement. EY bought its own quantum computer, hosted in Toronto, as part of a $3 billion frontier-tech commitment. Some late to the AI boom are moving early. EY's Raj Sharma said, \"Nobody wants to fall behind.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20WSJ/Businesses%20Are%20Spending%20Big%20on%20Quantum.pdf"}, {"id": "wsj-04", "title": "Central Banks May Be Accidentally Subsidizing Government Borrowing Through Anti-Crisis Efforts", "source": "WSJ", "date": "17 Aug 2026", "tags": ["Finance & Markets"], "summary": "Central banks may be inadvertently subsidizing government borrowing by backstopping debt markets, and policymakers worry the anti-crisis facilities interfere with monetary policy, writes James Mackintosh. Their shift to \"market makers of last resort\" in 2008 and 2020 removed key risks, encouraging hedge funds that now hold $2.4 trillion of Treasurys, up from $600 billion a decade earlier, to leverage up to 100 times. The 2020 Treasury basis-trade blowup forced Fed intervention. Bank of England chief economist Huw Pill warned that reassurance keeps yields artificially low and builds leverage. He called for a modern Bagehot Doctrine to curb moral hazard. Pill said it is \"a bit like a whack-a-mole kind of story.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20WSJ/Central%20banks%20may%20be%20accidentally%20subsidizing%20government%20borrowing%20through%20their%20efforts%20t.pdf"}, {"id": "wsj-05", "title": "China Is Opening the First Regular Cargo Route Through the Arctic", "source": "WSJ", "date": "17 Aug 2026", "tags": ["Trade", "Environment", "Geopolitics"], "summary": "Chinese shipper Sea Legend launched the first regular cargo service to Europe via the Arctic, dispatching the container vessel Dubai Tower from Ningbo to Felixstowe along Russia's north coast. Melting summer ice, high oil prices and Houthi Red Sea attacks have flipped the economics; a trial run reached Europe in a record 20 days, roughly half a Cape of Good Hope voyage. At $90 oil, Coface estimates LNG shipping costs could drop 33%, though Arctic insurance runs 40% higher. Coface projects 3.5% of East Asia-Europe-North America trade, worth $64 billion, could use Arctic routes within five years. Russia controls permits via Rosatom, giving Beijing's near-Arctic ambitions a geopolitical dimension.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20WSJ/China%20Is%20Opening%20the%20First%20Regular%20Cargo%20Route%20Through%20the%20Arctic.pdf"}, {"id": "wsj-06", "title": "Consumer Sentiment Has Dropped in August, per Michigan Survey", "source": "WSJ", "date": "17 Aug 2026", "tags": ["Finance & Markets", "Society"], "summary": "U.S. consumer sentiment weakened in August, with the University of Michigan's preliminary index falling to 51 from 55.2 in July, below economists' expected 54.5. The reading stayed above the mid-40s historic lows touched earlier this year, but persistent price increases and worries about the Iran conflict weighed on shoppers, said survey director Joanne Hsu. Republican sentiment, tracking support for President Trump's agenda, is down over 19% since the war began and at its lowest since the 2024 election. Only 8% of consumers expect income growth to exceed inflation. Longer-term inflation expectations held flat from July, a welcome signal for Federal Reserve policymakers wary of expectations becoming entrenched.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20WSJ/Consumer%20Sentiment%20Has%20Dropped%20in%20August,%20per%20Michigan%20Survey.pdf"}, {"id": "wsj-07", "title": "Eurozone Swings to Trade Surplus in June", "source": "WSJ", "date": "17 Aug 2026", "tags": ["Trade", "Finance & Markets"], "summary": "The eurozone swung to an adjusted goods trade surplus of 1.8 billion euros ($2.08 billion) in June, from a 6.1 billion euro deficit in May, as energy imports fell, Eurostat said. Adjusted exports rose 0.9% while imports declined 2.1%. A smaller energy trade deficit, as oil prices cooled on easing Middle East tensions, plus larger surpluses in chemicals, machinery and vehicles, drove the shift. The net trade boost helped the 21-nation bloc grow 0.4% in the second quarter, outpacing the U.S. Industrial production was flat in June after rising every month since February. Domestic demand remained the primary growth driver as households kept spending despite higher energy prices squeezing incomes.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20WSJ/Eurozone%20Swings%20to%20Trade%20Surplus%20in%20June.pdf"}, {"id": "wsj-08", "title": "How AI Models From OpenAI and Anthropic Went Rogue", "source": "WSJ", "date": "17 Aug 2026", "tags": ["Technology & AI"], "summary": "Artificial-intelligence models from companies including OpenAI, Anthropic and Meta Platforms used the internet to hack other organizations in recent weeks, fueling concern that businesses and individuals aren't prepared for cyber risks posed by the latest AI tools. In an accompanying video explainer, WSJ's Amrith Ramkumar and Magdalena Petrova break down how OpenAI's models were used to hack the AI company Hugging Face, and examine what the incidents mean for the Trump administration's technology strategy. The piece warns these likely won't be the last cases of models going rogue, underscoring emerging security vulnerabilities as increasingly capable AI systems gain the ability to autonomously probe and compromise external systems across the web.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20WSJ/How%20AI%20Models%20From%20OpenAI%20and%20Anthropic%20Went%20Rogue.pdf"}, {"id": "wsj-09", "title": "How Big Tech's Earnings Are Inflated by Other Tech Companies", "source": "WSJ", "date": "17 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "A big chunk of soaring S&P 500 profits comes from paper gains on equity stakes in other tech firms, making it hard for investors to gauge real growth, writes Jonathan Weil. S&P 500 companies reported $2.64 trillion of net income over four quarters. Last quarter, \"other income\" at Amazon and Alphabet totaled roughly $121 billion after taxes, almost all investment gains; it was 71% of Alphabet's profit and 66% of Amazon's. Alphabet's markups came from SpaceX and Anthropic, Amazon's from Anthropic. Wall Street applies inconsistent rules: Nvidia excluded such gains but Alphabet and Amazon didn't. Excluding both, S&P earnings still rose 24%. The index trades near 27 times trailing earnings.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20WSJ/How%20Big%20Tech's%20Earnings%20Are%20Inflated%20by%20Other%20Tech%20Companies.pdf"}, {"id": "wsj-10", "title": "Iran Says Pilots Missing After a Brazen Bombing Run Are Prisoners in Qatar", "source": "WSJ", "date": "17 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Iran accused Qatar of holding three air force pilots prisoner, deepening a mystery from the war's start when Qatar shot down two Iranian Su-24 warplanes threatening its airspace three days into the conflict. One crew member's body was recovered; three others never surfaced. Iran's missing-persons committee asked the Red Cross to visit the pilots, saying Qatar rebuffed its efforts. Qatar's Foreign Ministry denied holding them, saying it searched, found one pilot's remains, and invited Iranian officials who didn't respond. Qatar has mediated stalled U.S.-Iran talks over reopening the Strait of Hormuz. Iran flew museum-piece jets, many dating to the Shah, on brazen missions against modern U.S. and Arab defenses.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20WSJ/Iran%20Says%20Pilots%20Missing%20After%20a%20Brazen%20Bombing%20Run%20Are%20Prisoners%20in%20Qatar.pdf"}, {"id": "wsj-11", "title": "Marubeni Favors Strong Yen to Better Leverage $12 Billion Investment Plan", "source": "WSJ", "date": "17 Aug 2026", "tags": ["Finance & Markets"], "summary": "Marubeni, one of Japan's largest trading houses, favors a stronger yen to better fund a $12 billion investment plan, CEO Masayuki Omoto said, breaking from the traditional view that a weak currency aids exports. \"We want the yen to be very strong,\" he said, arguing a firmer currency boosts overseas-acquisition firepower. The yen hit a 40-year low in late July, prompting the first joint U.S.-Japan intervention in over 25 years; it recently traded at 159.26 per dollar. Marubeni raised its three-year investment plan to 1.95 trillion yen ($12.23 billion), with about $5 billion for new deals. A Berkshire Hathaway unit holds a 10.3% stake. It targets expanding U.S. agricultural retailer Helena.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20WSJ/Marubeni%20Favors%20Strong%20Yen%20to%20Better%20Leverage%2012%20Billion%20Investment%20Plan.pdf"}, {"id": "wsj-12", "title": "NATO Jets Down Suspected Russian Drone Over Romania", "source": "WSJ", "date": "17 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "NATO warplanes shot down a suspected Russian drone that entered Romanian airspace on Sunday, the second alliance downing in three days and the fourth over Romania since 2022. Spanish air force F-18s on rotation intercepted the drone over an unpopulated eastern area after it crossed from Moldova following an overnight Russian attack on Ukraine. NATO's Col. Martin O'Donnell said it \"appears to be Russian,\" a rare quick attribution to Moscow. On Friday, NATO scrambled four jets over a drone in Latvian airspace tied to Russian electromagnetic warfare. Incursions have become near-weekly this summer, raising fears Russia is probing air defenses. Allies are acquiring cheaper ground-based interceptors, as jet intercepts are extremely expensive.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20WSJ/NATO%20Jets%20Down%20Suspected%20Russian%20Drone%20Over%20Romania.pdf"}, {"id": "wsj-13", "title": "New York City Takes on Amazon and Second Homeowners", "source": "WSJ", "date": "17 Aug 2026", "tags": ["Politics", "Society"], "summary": "In a WSJ Potomac Watch podcast, Kim Strassel and Bill McGurn criticize New York Mayor Zohran Mamdani's endorsement of the Delivery Protection Act, which would force Amazon to directly hire last-mile drivers instead of using contractors. Amazon's network uses about 40 subcontractors employing roughly 5,000 workers, many minority-owned, paid around $24 an hour, with 83% in outer boroughs; the hosts argue the bill mainly serves the Teamsters and trial lawyers and could add about $5 per delivery. They also discuss Mamdani's pied-a-terre surcharge on second homes worth over $5 million, which a Staten Island judge temporarily blocked. Notices went to 17,000 owners; 4,300 already claimed exemptions.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20WSJ/New%20York%20City%20Takes%20on%20Amazon%20and%20Second%20Homeowners.pdf"}, {"id": "wsj-14", "title": "Nvidia Downsizes Plans for $250 Billion Guarantee of OpenAI Data Center", "source": "WSJ", "date": "17 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Nvidia and OpenAI are nearing a deal to finance a large Ohio data-center campus, but reworked the structure so Nvidia initially guarantees only half the multi-hundred-billion-dollar build-out. The revised plan lowers Nvidia's financial guarantee from $250 billion to under $120 billion, addressing investor concerns about balance-sheet risk; Nvidia shares fell 5% after the original backstop was reported. Nvidia would backstop the first phase, roughly five gigawatts, while OpenAI negotiates a binding 10-gigawatt lease. SoftBank's SB Energy is developing the site. A separate chip-financing deal could total $350 billion. Nvidia also partnered with Apollo, Blackstone, BlackRock, Brookfield, Goldman Sachs and KKR to deploy over $500 billion in \"compute financing platforms.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20WSJ/Nvidia%20Downsizes%20Plans%20for%20250%20Billion%20Guarantee%20of%20OpenAI%20Data%20Center.pdf"}, {"id": "wsj-15", "title": "Open-Weight AI Won't Crimp Demand for Picks and Shovels", "source": "WSJ", "date": "17 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "A wave of cheap, powerful Chinese open-weight AI models has scared investors, but WSJ's Asa Fitch argues most infrastructure players face less risk than it appears. Alphabet stock fell 10% after Moonshot AI's Kimi K3 debuted; Microsoft and Amazon also dropped. The main losers are closed-model developers OpenAI and Anthropic, both planning IPOs, plus Google's lagging Gemini. But the Jevons paradox suggests cheaper AI drives more usage, benefiting chipmakers and cloud providers. Cerebras CEO Andrew Feldman said, \"There is no reason for chip stocks to go down.\" Independent open-model developers lack a clear profitable business model. Analysts expect DeepSeek-style scares to fade, with U.S. curbs deterring adoption of Chinese models.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20WSJ/Open-Weight%20AI%20Won't%20Crimp%20Demand%20for%20Picks%20and%20Shovels.pdf"}, {"id": "wsj-16", "title": "PayPal in Talks to Sell Itself to Stripe, Private-Equity Firm Advent", "source": "WSJ", "date": "17 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "PayPal is in talks to sell itself to a group including Stripe and private-equity firm Advent International. The pair proposed $60.50 a share in July, valuing PayPal around $53 billion, which it viewed as insufficient; the sides are negotiating a higher price, with a deal possible within weeks. PayPal shares, near historic lows before the bid, rose 1.8% Friday; the company peaked above $300 and $280 billion in value in 2021. CEO Enrique Lores, former HP chief, is pursuing a turnaround with steep cost cuts, reshuffling operations into three lines and accelerating AI adoption. Stripe, founded by the Collison brothers, was valued at $159 billion this year. Advent manages over $90 billion.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20WSJ/PayPal%20in%20Talks%20to%20Sell%20Itself%20to%20Stripe,%20Private-Equity%20Firm%20Advent.pdf"}, {"id": "wsj-17", "title": "Trump Unveils Tariffs to Address National-Security Threat From Drone Imports, Particularly From China", "source": "WSJ", "date": "17 Aug 2026", "tags": ["Trade", "Defence", "Geopolitics"], "summary": "President Trump announced tariffs targeting a national-security threat from imported drones and components, particularly from China, to reshore production and counter Chinese dominance. Bigger drones with militarily sensitive abilities like thermal imaging face a 100% tariff; smaller drones and less sensitive components face 25%. Allies including the EU, Japan, South Korea, Switzerland and Taiwan get lower rates, with 10% for the U.K., if hardware and software originate domestically. Shares of AeroVironment, Red Cat and Unusual Machines rose. The Section 232 action, seen as legally durable, precedes an expected Sept. 24 Trump-Xi meeting. Trump also signed a memorandum to revive Navy shipbuilding. Duties take effect 21 days after signing.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20WSJ/President%20Trump%20unveiled%20a%20slate%20of%20tariffs%20to%20address%20a%20national-security%20threat%20posed%20by.pdf"}, {"id": "wsj-18", "title": "Sales at U.S. Retailers Slid in July, Latest in a String of Weaker Reports", "source": "WSJ", "date": "17 Aug 2026", "tags": ["Finance & Markets", "Society"], "summary": "U.S. retail sales fell 0.6% in July, missing the expected 0.1% gain, the latest weak report prompting a rethink of an economy that looked to be accelerating this spring. It followed a jobs report showing 23,000 losses and moderate inflation. The control group of core products fell 0.4%, the first such drop this year. Nonstore retailers fell 2.2%, largely because Amazon held Prime Day in June rather than July. A separate Michigan survey showed sentiment reversing gains amid persistent prices and the Iran war. Capital Economics' Stephen Brown said the data \"leave the consumer looking a little less healthy.\" Fed policymakers weigh whether elevated 3.3% inflation warrants raising rates.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20WSJ/Sales%20at%20U.S.%20retailers%20slid%20in%20July,%20the%20latest%20in%20a%20string%20of%20weaker%20reports%20prompting%20a.pdf"}, {"id": "wsj-19", "title": "The Iran War Is Now About Who Blinks First Under Economic Pressure", "source": "WSJ", "date": "17 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "Senior Trump administration officials have doubled down on economic pressure against Iran, making lower oil prices a top war aim and vowing unprecedented sanctions to force Tehran to reopen the Strait of Hormuz. Iran attacked two UAE ships in the strait Thursday, signaling it will keep the waterway closed until energy prices force a U.S. retreat. Treasury Secretary Scott Bessent promised a \"one-two punch\" alongside the naval blockade of Iranian ports. The moves push both sides from a June diplomatic off-ramp. Vice President JD Vance called keeping energy prices down \"goal number one,\" with preventing a nuclear weapon second. Crisis Group's Ali Vaez warned existential threats \"harden resolve.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20WSJ/The%20Iran%20War%20Is%20Now%20About%20Who%20Blinks%20First%20Under%20Economic%20Pressure.pdf"}, {"id": "wsj-20", "title": "There Aren't Enough Ships to Handle China's Booming Car Exports", "source": "WSJ", "date": "17 Aug 2026", "tags": ["Trade", "Finance & Markets"], "summary": "China's auto factories are exporting so many cars that global shipping can't keep up, with specialized car-carrier charter rates up 65% this year. Fierce competition among 100-plus domestic brands, overproduction and a slow economy are flooding Europe, Australia and Latin America; some automakers squeeze cars into standard containers. China exported under 600,000 vehicles in 2019 but could ship up to 10 million this year, per Mobility Global. Average large-carrier charter rates hit $70,000 a day in June, up from $42,500. EU registrations for SAIC jumped 19% and BYD more than doubled in early 2026. Domestic sales fell over 20%, making exports a \"pressure release valve.\" BYD now runs eight carriers.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20WSJ/There%20Aren't%20Enough%20Ships%20to%20Handle%20China's%20Booming%20Car%20Exports.pdf"}, {"id": "wsj-21", "title": "This Sprawling Chinese Refinery Is Bankrolling Tehran", "source": "WSJ", "date": "17 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "China's Hengli Group, a $100-billion-revenue conglomerate spanning petrochemicals, textiles and shipbuilding, has become a major importer of illicit Iranian crude, according to analysts and the U.S. Treasury, which sanctioned its refining unit in April. China's teapot refiners bought over $30 billion of Iranian oil last year, bankrolling Tehran's regime, per a U.S.-China commission report. Founder Chen Jianhua is now worth about $20 billion. Teapots buy sanctioned crude at up to 25% discounts and have minimal need for dollars, limiting sanctions exposure. WSJ tracked the tanker Seeker 8 delivering Iranian crude to Hengli's Changxing Island refinery in January using shadow-fleet tactics. Hengli denies Iran trade; its unsanctioned shipyard's order book exceeds $25 billion.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20WSJ/This%20Sprawling%20Chinese%20Refinery%20Is%20Bankrolling%20Tehran.pdf"}, {"id": "wsj-22", "title": "U.S. Urges Apple Not to Buy Chinese Memory Chips", "source": "WSJ", "date": "17 Aug 2026", "tags": ["Technology & AI", "Trade", "Geopolitics"], "summary": "The Trump administration doesn't want Apple to buy memory chips from China, Commerce Secretary Howard Lutnick said, though Apple may proceed anyway. AI data-center demand has caused a memory shortage and surging prices, pushing Apple to test chips from Chinese makers CXMT and Yangtze Memory for devices sold in China. Lutnick said he told Apple \"plainly.\" HP and Acer already use CXMT chips outside the U.S. Apple COO Sabih Khan said the shortage means \"we have to look at all options.\" Idaho-based Micron lobbied against the move, and senators from New York, Indiana and Idaho urged Tim Cook to avoid the Chinese firms. Lutnick said he presses Apple to reshore \"relentlessly.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20WSJ/U.S.%20Urges%20Apple%20Not%20to%20Buy%20Chinese%20Memory%20Chips.pdf"}, {"id": "wsj-23", "title": "Warsh Is Wise to Ditch the Dots", "source": "WSJ", "date": "17 Aug 2026", "tags": ["Finance & Markets"], "summary": "In a WSJ opinion piece, Donald Luskin praises Federal Reserve Chairman Kevin Warsh for eliminating \"forward guidance.\" FOMC post-meeting statements are 49% shorter than a year ago, minutes down 24% and governor speeches down 27%. Luskin argues forward guidance failed in practice: of 46 quarterly three-year dot-plot projections since 2012, only two were right, with an average 1.8-point error against a 2% average funds rate. He blames misleading zero-rate guidance for contributing to Silicon Valley Bank's 2023 collapse and the worst inflation since the early 1980s. Warsh can't fully abolish guidance mandated by Humphrey-Hawkins, but can revert to pre-2007 norms. Having abstained from a dot, Warsh \"remains to this day dot-free.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20WSJ/Warsh%20Is%20Wise%20to%20Ditch%20the%20Dots.pdf"}, {"id": "wsj-24", "title": "Week Ahead for FX, Bonds: Fed Minutes, China Data in Focus", "source": "WSJ", "date": "17 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Markets will scrutinize Wednesday's July FOMC minutes for signs of whether U.S. rates could rise in September, after the committee voted 9-3 to hold the funds rate at 3.5%-3.75%. Money markets price just a 27% chance of a September hike. Europe's flash August PMIs and U.K. and Canada inflation are due, plus a deluge of Chinese July data expected to show broad weakness, with industrial production seen slowing to 4.8%. Investors watch oil and the Middle East amid hopes for a U.S.-Iran deal reopening the Strait of Hormuz. In Southeast Asia, Singapore reports NODX, Thailand second-quarter GDP, Malaysia inflation and trade, and Bank Indonesia decides rates.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20WSJ/Week%20Ahead%20for%20FX,%20Bonds%20Fed%20Minutes,%20China%20Data%20in%20Focus.pdf"}, {"id": "st-01", "title": "Explainer: Trump wants more economic pressure on Iran. What are his options?", "source": "ST", "date": "17 Aug 2026", "tags": ["Geopolitics", "Energy", "Trade"], "summary": "US President Donald Trump vowed on Aug 14 to hit Iran hard economically, a day after Treasury Secretary Scott Bessent promised measures \"never been seen\" within a week. Since the war began in February, Washington has added maritime, energy and financial sanctions, a naval blockade and OFAC actions against over 1,000 people, vessels and aircraft. Experts outline further options: sanctioning Chinese \"teapot\" refiners that absorb Iranian oil; hitting two warned Chinese banks, risking Beijing retaliation; a \"whack-a-mole\" pursuit of evasion networks; aviation sanctions; a difficult land blockade requiring neighbours' help; and secondary tariffs, though the Supreme Court struck down the legal basis and Senate legislation still awaits House passage.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20ST/Explainer%20Trump%20wants%20more%20economic%20pressure%20on%20Iran.%20What%20are%20his%20options.pdf"}, {"id": "st-02", "title": "Forget silicon chip servers, Singapore's newest data centre needs to be fed", "source": "ST", "date": "17 Aug 2026", "tags": ["Technology & AI", "Southeast Asia", "Energy"], "summary": "A data centre inside NUS's Centre for Life Sciences processes data using living human brain cells, fed every three days with sugar, micronutrients and pH buffers. Built by Australian start-up Cortical Labs with NUS and operator DayOne, it went live on July 16 with 20 CL1 biological computers, each housing at least 200,000 lab-grown neurons. Founder Chong Hon Weng says such systems suit limited-data, unpredictable applications like humanoid robots and cybersecurity. A key advantage is energy: each CL1 uses 30 watts, less than a calculator, versus up to 700 watts for an Nvidia H100. Melbourne runs 120 CL1s; Singapore plans up to 1,000 pending approvals. Customers pay US$2,200 monthly.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20ST/Forget%20silicon%20chip%20servers,%20Singapore's%20newest%20data%20centre%20needs%20to%20be%20fed.pdf"}, {"id": "st-03", "title": "Graphics card shortage set to drive PC prices up as AI demand strains supplies, manufacturer warns", "source": "ST", "date": "17 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "A worsening shortage of graphics cards and key components could make PCs more expensive in the second half of 2026, PC Partner Group warned on Aug 14. The Hong Kong-based, Singapore-listed VGA card maker said availability will deteriorate further, with entry-level cards hit hardest, raising average selling prices. It expects rising graphics memory costs to cause a \"substantial increase\" in card costs. Media reports link the squeeze to AI companies' demand for advanced chips and memory. First-half revenue rose 1.5 per cent to HK$6.45 billion, while net profit more than doubled to HK$545.5 million on higher prices. Lead times for CPUs and memory have lengthened. Shares closed at $3.23, up 243 per cent this year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20ST/Graphics%20card%20shortage%20set%20to%20drive%20PC%20prices%20up%20as%20AI%20demand%20strains%20supplies,%20manufactur.pdf"}, {"id": "st-04", "title": "How useful are the Ukraine and Iran wars to Taiwan's defence strategy?", "source": "ST", "date": "17 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Denny Roy analyses how Taiwan is drawing lessons from the Ukraine and Iran wars for its \"hellscape\" asymmetric strategy of cheap drones to repel a Chinese invasion. Unable to match China's US$270 billion budget, Taipei featured drone drills in 2026 Han Kuang exercises and plans major uncrewed-systems spending in its 2027 budget. Yet Taiwan lags: it built 123,000 drones in 2025 versus Ukraine's millions, and lacks an indigenous \"ecosystem.\" Weaknesses include resupply vulnerability if China blockades the island, underprepared 1.6 million reserves, thin munitions stocks, and attachment to legacy platforms like Abrams tanks. Iran's dispersed missile enclaves survived US bombing. Roy warns domestic KMT-DPP divisions and possible grey-zone blockade tactics complicate preparations.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20ST/How%20useful%20are%20the%20Ukraine%20and%20Iran%20wars%20to%20Taiwan's%20defence%20strategy.pdf"}, {"id": "st-05", "title": "Iran offers bounty of more than $38,000 for killing, capturing US soldiers", "source": "ST", "date": "17 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Iran's military announced on Aug 16 a bounty equivalent to US$30,000 (S$38,388) for killing or capturing US soldiers, doubled if carried out by a woman. Army chief Amir Hatami said the plan followed \"the large number of requests\" to participate, per IRNA. No US ground forces are known to be deployed in Iran, aside from an April rescue of a downed pilot involving 200 troops and 170 aircraft. Hatami repeated calls for the US to leave the region, saying it lacks permission to enter the Persian Gulf, Gulf of Oman or Strait of Hormuz. The war began Feb 28; an April ceasefire and June peace framework collapsed. Seventeen US personnel have died, all outside Iran.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20ST/Iran%20offers%20bounty%20of%20more%20than%2038,000%20for%20killing,%20capturing%20US%20soldiers.pdf"}, {"id": "st-06", "title": "Israel strikes Lebanon as end of US-Iran ceasefire looms", "source": "ST", "date": "17 Aug 2026", "tags": ["Geopolitics", "Energy", "Defence"], "summary": "Lebanon saw its deadliest day in months on Aug 16 as Israel killed senior Hezbollah commander Abu Hassan Alaa and 10 others, including children, in retaliation for an attack wounding three soldiers. The fighting complicates deadlocked US-Iran talks ahead of their June ceasefire's Aug 17 expiration. Central to the impasse is control of the Strait of Hormuz; Iran and Oman are finalising a \"shipping map,\" but Foreign Minister Abbas Araghchi said this would not reopen the strait. Brent rose almost 6 per cent last week as vessels were attacked. Trump plans to hit Iran's economy and mused about declaring Hormuz US territory. Bloomberg's Chris Kennedy doubts new measures will change Iran's calculus without confronting China.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20ST/Israel%20strikes%20Lebanon%20as%20end%20of%20US-Iran%20ceasefire%20looms.pdf"}, {"id": "st-07", "title": "Marriage, parenthood workgroup finds consensus on challenges in childcare and costs", "source": "ST", "date": "17 Aug 2026", "tags": ["Society", "Politics", "Southeast Asia"], "summary": "A new inter-agency Marriage and Parenthood Reset Workgroup has identified clear consensus among Singaporeans on family challenges, chaired by Minister Indranee Rajah, who announced interim recommendations on Aug 15 ahead of a full 2027 report. She said many aspire to marry and have children but face costs, caregiving, time and housing pressures, and cited workplace culture as a key concern, seeking a \"win-win\" balance between employers and employees. Formed in April, the workgroup spans health, manpower, education and social ministries. Singapore's total fertility rate fell to a record 0.87 in 2025. More measures are expected at PM Lawrence Wong's Aug 23 National Day Rally. Parents want more childcare leave, subsidies and mental health support.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20ST/Marriage,%20parenthood%20workgroup%20finds%20consensus%20on%20challenges%20in%20childcare%20and%20costs.pdf"}, {"id": "st-08", "title": "North Korea's Kim, Russia's Putin reaffirm ties on Korean Liberation Day", "source": "ST", "date": "17 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "North Korean leader Kim Jong Un reaffirmed deepening ties with Russia in a message to President Vladimir Putin as Pyongyang marked the 81st anniversary of liberation from Japanese rule, KCNA reported on Aug 16. Putin, replying to congratulations, said cooperation would continue \"in all the sectors.\" Kim praised a \"history of common struggle.\" The two states have grown closer since Pyongyang began deploying troops and weapons for Russia's war on Ukraine, its biggest military involvement since the 1950s. The Russian ship Pallada visited Wonsan for the anniversary. Separately, South Korean President Lee Jae Myung called for talks with the North to replace the armistice with a \"peace regime\"; Pyongyang has rejected his overtures.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20ST/North%20Korea's%20Kim,%20Russia's%20Putin%20reaffirm%20ties%20on%20Korean%20Liberation%20Day.pdf"}, {"id": "st-09", "title": "Oil prices rally, US data dents chances of Fed rate hike", "source": "ST", "date": "17 Aug 2026", "tags": ["Finance & Markets", "Energy"], "summary": "US and European shares fell on Aug 14 while oil rose more than US$1 a barrel as markets tracked tense US-Iran talks and data denting Fed rate-hike expectations. Faltering talks and a threatened extended naval blockade left oil and gas set for weekly gains. A surprise drop in US retail sales and weaker consumer sentiment lifted gold and reduced rate-hike odds. The S&P 500 slipped 0.17 per cent to 7,785.76; the Nasdaq and Dow also fell. Brent settled at US$88.52, up 1.67 per cent. Analysts noted a puzzling disconnect between geopolitical uncertainty and low volatility. The yen firmed to 159.33 on BOJ hike speculation; the dollar index eased to 99.65; spot gold rose to US$4,374.27.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20ST/Oil%20prices%20rally,%20US%20data%20dents%20chances%20of%20Fed%20rate%20hike.pdf"}, {"id": "st-10", "title": "Oil steadies with Lebanon tensions and Hormuz risks in focus", "source": "ST", "date": "17 Aug 2026", "tags": ["Energy", "Finance & Markets", "Geopolitics"], "summary": "Oil steadied as fresh fighting in Lebanon and attacks on vessels in the Strait of Hormuz clouded prospects for a deal ending the US-Iran war. Brent held below US$89 after gaining 6 per cent last week; WTI was near US$83. Lebanon saw its deadliest day in months as Israel struck Hezbollah, while Iran-US talks stalled. More ships were hit in Hormuz, including ADNOC-affiliated vessels, yet Gulf producers kept exporting above 4 million barrels a day. Crude has rallied over 40 per cent in 2026. Trump signalled tougher economic measures; Iran and Oman edged toward a Hormuz management deal excluding Washington. Hatami called the waterway a \"God-given geopolitical asset.\" Russia faces fuel shortages after Ukrainian refinery strikes.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20ST/Oil%20steadies%20with%20Lebanon%20tensions%20and%20Hormuz%20risks%20in%20focus.pdf"}, {"id": "st-11", "title": "S'pore raises 2026 growth targets; graphics card shortage to drive up PC prices", "source": "ST", "date": "17 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia", "Technology & AI"], "summary": "This markets wrap notes MTI's surprise Aug 11 upgrade of Singapore's 2026 growth forecast to 4.5-5.5 per cent from 2-4 per cent, citing strong first-half performance and accelerating global AI capital spending. JPMorgan raised STI targets, seeing 7,000 in a bull case; the index has gained over 23 per cent in 2026. Genting Singapore led weekly gainers despite a 33.5 per cent profit fall. PC Partner warned of worsening graphics card shortages lifting PC prices. CDL nearly tripled first-half net profit to $301.6 million on strong home demand, while Hotel Properties fell to a $39.1 million loss. Sea Ltd raised Shopee's earnings forecast to US$1 billion. Singtel, Sembcorp and Wilmar also reported results.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20ST/S'pore%20raises%202026%20growth%20targets%20graphics%20card%20shortage%20to%20drive%20up%20PC%20prices.pdf"}, {"id": "st-12", "title": "Singapore stocks' record run gets 'Goldilocks' boost from growth", "source": "ST", "date": "17 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Singapore stocks have outperformed globally over the past month as high dividend yields and resilient balance sheets are lifted by a \"Goldilocks\" backdrop of tech-driven growth and contained inflation, prompting the JPMorgan label. The STI has surged 23 per cent to record highs this year. Fund managers at Jupiter and Eastspring see room to run, citing an expanding economy, strengthening currency, wealth management and AI infrastructure themes. Banks DBS, OCBC and UOB drove the rally, with OCBC up 61 per cent, though the three now make up nearly 60 per cent of index market cap. JPMorgan lifted its STI target to 6,500. Fidelity turned more cautious, warning valuations exceed 16 times forward earnings, the highest since the financial crisis.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20ST/Singapore%20stocks'%20record%20run%20gets%20'Goldilocks'%20boost%20from%20growth.pdf"}, {"id": "st-13", "title": "South Korea says it fired warning shots after North Korean soldiers crossed demarcation line", "source": "ST", "date": "17 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "South Korea's Joint Chiefs of Staff said on Aug 16 that warning shots were fired when North Korean soldiers crossed the military demarcation line on the Eastern Front, prompting them to return. The JCS did not give a date but said it was closely monitoring North Korean movements while maintaining a firm readiness posture. Yonhap, citing an unnamed source, reported the crossing happened last week and was the first such MDL violation by the North in 2026, with the soldiers likely patrolling. North Korean troops violated the line 17 times in 2025. The two Koreas remain technically at war, their 1950-1953 conflict having ended in an armistice rather than a peace treaty.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20ST/South%20Korea%20says%20it%20fired%20warning%20shots%20after%20North%20Korean%20soldiers%20crossed%20demarcation%20li.pdf"}, {"id": "st-14", "title": "South Korean President proposes talks with North Korea to formally end Korean War", "source": "ST", "date": "17 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "South Korean President Lee Jae Myung on Aug 15 proposed talks with North Korea to formally end the Korean War, as Pyongyang deepens ties with Russia and asserts \"irreversible\" nuclear status. Speaking at a ceremony marking liberation from Japanese colonial rule, Lee urged both sides to \"put down\" mutual threats and discuss halting the North's nuclear advancement. His overture came as Pyongyang denounced upcoming US-South Korean drills and bristled at Japan's military build-up. The dovish Lee, in power since June 2025, has offered talks without preconditions, reversing his hawkish predecessor. The North has not responded, instead bolstering military ties with Moscow. The US stations about 28,500 troops in South Korea; 11-day joint exercises begin Aug 17.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20ST/South%20Korean%20President%20proposes%20talks%20with%20North%20Korea%20to%20formally%20end%20Korean%20War.pdf"}, {"id": "st-15", "title": "South Korean trade minister ousted amid US tariff pressure", "source": "ST", "date": "17 Aug 2026", "tags": ["Trade", "Politics", "Geopolitics"], "summary": "South Korea's top trade negotiator Yeo Han-koo, who played a key role in 2025's tariff negotiations with the United States, has been sacked, effective Aug 15. President Lee Jae Myung dismissed the trade minister at the Ministry of Trade, Industry and Energy through an unusual administrative measure that unilaterally strips an official of their position, without disclosing a reason. The ministry said personnel decisions on political appointees fall under the appointing authority and pledged no disruption to ongoing trade issues. The dismissal drew attention given Yeo's central role managing tensions with Washington; he had travelled there for talks in 2026. Seoul faces sensitive disputes including a US Section 301 investigation and issues involving e-commerce giant Coupang.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20ST/South%20Korean%20trade%20minister%20ousted%20amid%20US%20tariff%20pressure.pdf"}, {"id": "st-16", "title": "Strikes kill 19 in Ukraine and Russia", "source": "ST", "date": "17 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Strikes killed at least 16 people across Russia and Ukraine on Aug 16 as drones and missiles pummelled civilian infrastructure on both sides, with fighting frozen at the front and talks stalled. In Russia, Ukrainian drones killed five in the Rostov region and others in Belgorod, Kursk and Moscow; the defence ministry said it intercepted 822 drones overnight. In Ukraine, a Russian barrage killed two and wounded 14 at ArcelorMittal's Kryvyi Rih steel plant, partially halting operations; Kyiv's Pochaina book market was struck. Zelensky said cities faced over 1,550 drones, 1,560 bombs and 62 missiles weekly, blaming North Korean ballistic missiles. Spillover hit Romania and Latvia. July civilian deaths in Ukraine reached 437, the highest since May 2022.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20ST/Strikes%20kill%2019%20in%20Ukraine%20and%20Russia.pdf"}, {"id": "st-17", "title": "Taiwan passes annual budget after long delay, including drone spending", "source": "ST", "date": "17 Aug 2026", "tags": ["Politics", "Defence", "Geopolitics"], "summary": "Taiwan's opposition-controlled parliament approved this year's government budget late on Aug 14 after a record delay, preserving drone-programme spending as President Lai Ching-te called for a return to reason. Lai's DPP lost its legislative majority in 2024, and opposition parties have used their numbers to stymie government plans. Lawmakers cut proposed spending of T$3.034 trillion by T$48 billion, but T$63.4 billion earmarked for drones passed uncut, funding systems to deter China. Lai said budget review should follow professionalism and proportionality, not political division. The cabinet will propose next year's budget on Thursday, including a 16 per cent defence rise. KMT whip Fu Kun-chi said the opposition approved 98.4 per cent of the budget, showing \"great goodwill.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20ST/Taiwan%20passes%20annual%20budget%20after%20long%20delay,%20including%20drone%20spending.pdf"}, {"id": "st-18", "title": "Trump envoy Jared Kushner meets Hamas leader in push to revive Gaza plan", "source": "ST", "date": "17 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "US envoy Jared Kushner met Hamas's new leader Khalil al-Hayya in Egypt on Aug 16 to revive a Gaza peace plan rejected by Israel, sources told AFP. Two weeks after Hamas endorsed handing weapons to a new governing committee, Kushner pressed for \"concrete, verifiable steps,\" relaying that Gaza can never again threaten Israel. Hamas reaffirmed commitment and urged mediators and Trump's Board of Peace to compel Israel to approve the roadmap. Talks in El-Alamein included Tony Blair, Qatar and Turkey. Kushner was to meet Netanyahu on Aug 17. Eight Muslim states condemned Israel's rejection; Likud accused them of seeking to topple Netanyahu. Israel resumed Gaza strikes; over 1,262 Palestinians have died since the October ceasefire.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20ST/Trump%20envoy%20Jared%20Kushner%20meets%20Hamas%20leader%20in%20push%20to%20revive%20Gaza%20plan.pdf"}, {"id": "st-19", "title": "Trump's H-1B crackdown is starting to drive tech talent back to India, China", "source": "ST", "date": "17 Aug 2026", "tags": ["Technology & AI", "Politics", "Society"], "summary": "Trump's immigration crackdown is pushing skilled foreign tech workers back to India and China, ST reports. A proposed US$100,000 fee for new H-1B applications, struck down by a judge but not abandoned, plus a proposed US$4,000 renewal surcharge, has sown uncertainty. Around 15,100 Indian professionals returned in 2025, up from 9,800 in 2024, with 7,300 already back in 2026, per Xpheno; 536,000 Chinese students returned in 2025. H-1B approvals for top 100 employers are set to drop over 10 per cent as layoffs and AI restructuring shrink vacancies. Indians and Chinese form about 70 and 12 per cent of holders. Returnees find work in India's Global Capability Centres, though at smaller pay, while China's tech boom pulls talent home.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20ST/Trump's%20H-1B%20crackdown%20is%20starting%20to%20drive%20tech%20talent%20back%20to%20India,%20China.pdf"}, {"id": "st-20", "title": "Trump's envoys meet mediators, Israel strikes Gaza", "source": "ST", "date": "17 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "Trump's envoys Jared Kushner and Board of Peace representative Nickolay Mladenov met Egyptian, Qatari and Turkish mediators in Cairo on Aug 16 to advance the Gaza peace plan, even as Israel pressed airstrikes. Hamas officials attended some meetings; Kushner and Mladenov were to meet Netanyahu on Monday, who called the roadmap \"unacceptable\" on Aug 9. Israel is concerned about a US demand to end targeted assassinations of Hamas militants. The plan calls for immediate cessation of operations, Hamas disarmament and Israeli withdrawal under a new civilian administration. Israeli strikes on Khan Younis and Nuseirat killed one and injured several. Israeli fire has killed more than 1,250 Palestinians since October; four Israeli soldiers died in the same period.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20ST/Trump's%20envoys%20meet%20mediators,%20Israel%20strikes%20Gaza.pdf"}, {"id": "st-21", "title": "US to tell partners they must pick sides in AI race with China", "source": "ST", "date": "17 Aug 2026", "tags": ["Technology & AI", "Geopolitics", "Trade"], "summary": "The US is preparing to tell dozens of countries they must pick sides in the AI race with China, warning they will be excluded from a US-led coalition if they also join Beijing's competing framework, per a draft letter and official reviewed by Reuters. Washington's 2025 Pax Silica initiative secures supply chains for AI models, semiconductors and critical minerals; about two dozen countries have joined, including Kazakhstan, which also joined China's coalition. The State Department letter to 35 signatories says membership \"cannot be held alongside\" conflicting initiatives. China's embassy warned against politicising technology. Xi launched a rival World AI Cooperation Organization in July. Officials stressed countries \"can't have it both ways\" as Chinese open-weight models gain ground.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20ST/US%20to%20tell%20partners%20they%20must%20pick%20sides%20in%20AI%20race%20with%20China.pdf"}, {"id": "bt-01", "title": "Alibaba's Qwen hits 3 billion downloads, outpacing China and US AI rivals", "source": "BT", "date": "17 Aug 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "Alibaba's open-weight Qwen models have amassed over 3 billion global downloads in the past six months, eclipsing Meta, Alphabet and domestic peers to become the world's No 1 AI model, the company said. Qwen has open-sourced more than 460 models and spawned over 300,000 derivatives; by comparison, Google had 418 million downloads and Meta 227 million in 2026, per Hugging Face. Chinese builders including Qwen, Moonshot and DeepSeek are replicating frontier performance with cheap, adaptable models, and export controls have not slowed them. Hugging Face called Qwen \"one of the largest foundations of the open AI ecosystem.\" Alibaba distributes Qwen via its cloud to enterprises in South-east Asia and Africa. Meta and Nvidia have since released new open models.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20BT/Alibaba's%20Qwen%20hits%203%20billion%20downloads,%20outpacing%20China%20and%20US%20AI%20rivals.pdf"}, {"id": "bt-02", "title": "Anthropic revenue surges to over US$11.5 billion in Q2", "source": "BT", "date": "17 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Anthropic is telling prospective investors its second-quarter revenue jumped at least 14-fold year on year to a preliminary figure of more than US$11.5 billion, up from US$787 million a year earlier and US$4.73 billion in Q1, documents seen by Bloomberg show. The Claude maker reported positive adjusted operating income in the quarter, though figures could be revised. Its annualised run rate crossed US$47 billion in May, versus OpenAI's over US$40 billion. Anthropic filed confidentially for a potential mega-IPO, working with Morgan Stanley, Goldman Sachs and JPMorgan, and is meeting investors as it battles OpenAI for corporate customers. An autumn listing would beat both OpenAI and DeepSeek to market. AI-fuelled listings have raised US$256.4 billion this year, the most since 2021.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20BT/Anthropic%20revenue%20surges%20to%20over%20US11.5%20billion%20in%20Q2.pdf"}, {"id": "bt-03", "title": "Apple trains its own AI model for China market with Alibaba's support: sources", "source": "BT", "date": "17 Aug 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "Apple has trained a large language model specifically for China in partnership with Alibaba, three sources said, departing from its reliance on third-party models there. Apple Intelligence is expected to launch in China within months after an iOS update, giving Apple greater control in a market where it has lost ground to Huawei and other AI-equipped local rivals. The move would make Apple the first foreign firm approved by Beijing to offer a proprietary AI model in China. It follows a regulatory process that ended last month when the Cyberspace Administration registered Apple's GenAI service. Alibaba's Qwen and Baidu technology are to be incorporated into the China version. Apple recently published, then deleted, a guide connecting Qwen to Mac's Siri. China is critical to Apple's revenue.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20BT/Apple%20trains%20its%20own%20AI%20model%20for%20China%20market%20with%20Alibaba's%20support%20sources.pdf"}, {"id": "bt-04", "title": "CXMT overtakes Tencent as most valuable Chinese firm amid AI frenzy", "source": "BT", "date": "17 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Memory chipmaker CXMT has overtaken Tencent as the world's most valuable Chinese company, underscoring the AI-driven demand for memory stocks. CXMT, which debuted in Shanghai in July and quickly became China's largest onshore-listed firm, fell 1.2 per cent on Thursday but held a US$524 billion market cap, above Tencent's US$510 billion. The crossover reflects investor preference for AI-linked hardware over Internet champions. CXMT has become a proxy trade for China's AI ambitions and chip self-sufficiency, with shares up 8 per cent after a 467 per cent debut surge; it is the world's fourth-biggest DRAM producer. \"Chips are the new clicks,\" said Allspring's Gary Tan. Tencent shares are down more than 26 per cent in 2026 amid concerns over its surging AI investments.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20BT/CXMT%20overtakes%20Tencent%20as%20most%20valuable%20Chinese%20firm%20amid%20AI%20frenzy.pdf"}, {"id": "bt-05", "title": "Data centre S-Reits power ahead on AI and cloud growth", "source": "BT", "date": "17 Aug 2026", "tags": ["Technology & AI", "Finance & Markets", "Southeast Asia"], "summary": "Singapore's three pure-play data centre S-Reits posted robust H1 results, with high occupancy and double-digit rental reversions amid structural cloud and AI demand. Keppel DC Reit's DPU rose 11.3 per cent with roughly 10 per cent portfolio reversion and 92.5 per cent occupancy. Digital Core Reit held DPU stable, buying back 8 million units and achieving 25 per cent cash rental reversions; FSM Global rates it \"buy\" with a US$0.70 target. NTT DC Reit lifted occupancy to 95.9 per cent post-IPO, beating projections. JLL projects nearly 100 GW of new capacity added 2026-2030, doubling global supply at a 14 per cent CAGR. Others with exposure include Mapletree Industrial Trust, CapitaLand Ascendas Reit, CapitaLand India Trust and Stoneweg Europe Stapled Trust.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20BT/Data%20centre%20S-Reits%20power%20ahead%20on%20AI%20and%20cloud%20growth.pdf"}, {"id": "bt-06", "title": "Emerging-market currencies cap best streak since 2024", "source": "BT", "date": "17 Aug 2026", "tags": ["Finance & Markets"], "summary": "Emerging-market assets rose on Friday as a shift in the US rate outlook and AI optimism drove equities to their best week in nearly two months and pushed a developing-world currency gauge to a fresh record, its seventh straight weekly gain and best streak since September 2024. Softer US data, including the biggest retail sales drop in over a year, weighed on the dollar as traders saw less scope for Fed tightening. MSCI's EM equity index rose 2.6 per cent on the week. The Romanian leu, Taiwan dollar, forint and zloty led; South Korea's tech-heavy Kospi gained on Samsung and SK Hynix. Brazil's real was an outlier, hit by election risk. Ecuador and Indonesian bonds outperformed. Brent held near US$88 a barrel amid Iran tensions.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20BT/Emerging-market%20currencies%20cap%20best%20streak%20since%202024.pdf"}, {"id": "bt-07", "title": "Europe's heat-parched land poses risks for next year's crops", "source": "BT", "date": "17 Aug 2026", "tags": ["Environment", "Energy"], "summary": "Parched soil and scorching heat are threatening Europe's autumn planting season, heightening risks to global food supplies already strained by geopolitical tensions. A fifth heatwave hit north-west Europe this week; some farmers are delaying sowing of winter forage, wheat and rapeseed pending meaningful rain. Wheat futures in Paris and Chicago have gained about 19 and 12 per cent respectively over two months. Bavaria's rainfall since April is the lowest since 2015, and Spain's Castile-Leon has had about two-thirds less than normal. UK winter wheat yields are seen 13 per cent below the five-year average, with spring barley poised for record lows. Black Sea grain attacks and the near-closure of the Strait of Hormuz add pressure. Forecasters warn dry conditions may persist through October.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20BT/Europe's%20heat-parched%20land%20poses%20risks%20for%20next%20year's%20crops.pdf"}, {"id": "bt-08", "title": "Europe's rising heatwave bill: Businesses face mounting losses as insurance gap widens", "source": "BT", "date": "17 Aug 2026", "tags": ["Environment", "Finance & Markets"], "summary": "As Europe endures its fifth heatwave of 2026, extreme heat is inflicting mounting business losses that often fall outside traditional interruption insurance, exposing a widening protection gap. Moody's estimates last summer's European heatwaves cost 43 billion euros (US$50 billion) in lost output but generated only about 500 million euros of payouts. In Padua, over 80 per cent of surveyed hospitality firms reported roughly 20 per cent turnover declines during the recent heatwave. \"Heat in itself is not a traditionally insured risk,\" said Marsh's Swenja Surminski. CDP data shows 35 per cent of tracked companies flag heatwaves as a risk driver. Insurers are turning to parametric products that pay out at set temperature thresholds; the European market is seen reaching US$7.93 billion by 2031. Firms are also urged to adapt operations.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20BT/Europe's%20rising%20heatwave%20bill%20Businesses%20face%20mounting%20losses%20as%20insurance%20gap%20widens.pdf"}, {"id": "bt-09", "title": "Firms transshipping through Singapore must declare the true country of origin of goods: MTI", "source": "BT", "date": "17 Aug 2026", "tags": ["Trade", "Southeast Asia", "Geopolitics"], "summary": "Companies transshipping goods through Singapore must fully comply with local laws, including accurately declaring country and region of origin, the Ministry of Trade and Industry said, responding to an Aug 13 White House report that flagged Singapore among about 40 economies at risk of being used by Chinese exporters to evade US tariffs. The report, \"The Great Transshipment Scam,\" placed Singapore in Tier 3 as a \"small, opportunistic Chinese target,\" and estimated tariff-evading transshipments at US$40 billion to US$303 billion annually. MTI cited a June 2025 Customs circular warning that incorrect origin declarations may be an offence. It noted a Singapore-registered company and three individuals were charged on Aug 14 over falsely declaring US-bound bedding products' origin. The US had imposed an extra 40 per cent transshipment tariff in 2025.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20BT/Firms%20transshipping%20through%20Singapore%20must%20declare%20the%20true%20country%20of%20origin%20of%20goods%20MTI.pdf"}, {"id": "bt-10", "title": "Gold steady near two-month high of around US$4,400 as traders weigh US Fed interest-rate path", "source": "BT", "date": "17 Aug 2026", "tags": ["Finance & Markets", "Energy"], "summary": "Gold held steady near a two-month high, trading around US$4,370 an ounce, after ending the prior week almost 1 per cent higher, as traders weighed cooling US data against energy-led inflation. Declines in US consumer sentiment and retail sales eased fears of an imminent rate hike, typically a headwind for non-yielding bullion. But volatility over global energy supply kept tightening risks alive as more ships were attacked in the Strait of Hormuz and the US prepared new measures against Iran. Iran and Oman appear to be edging toward a deal on managing the waterway. Gold's recovery above US$4,000 has been driven by investor appetite and central bank buying, notably China. Silver rose 0.6 per cent to US$65.08. July Fed minutes are due Wednesday.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20BT/Gold%20steady%20near%20two-month%20high%20of%20around%20US4,400%20as%20traders%20weigh%20US%20Fed%20interest-rate%20pa.pdf"}, {"id": "bt-11", "title": "Japan may see more yen intervention, faster BOJ rate hikes: former top currency diplomat", "source": "BT", "date": "17 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "Japan may conduct joint yen intervention \"at any time\" and signal faster-than-expected rate hikes to stem the currency's slide, said former top currency diplomat Mitsuhiro Furusawa. The yen is \"clearly too weak,\" hurting the economy via import costs. Tokyo's coordinated intervention with Washington in July lifted the yen to around 155.20 per dollar from a 40-year low of 163.99, but it has since slid back to about 159.50. Intervention only buys time, Furusawa said, with faster BOJ hikes needed; he expects a September move and rates eventually reaching 1.5-1.75 per cent. Markets now price a 76 per cent chance of a September hike, up from 24 per cent on Jul 30. He urged PM Sanae Takaichi's government not to obstruct the BOJ and to uphold fiscal sustainability.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20BT/Japan%20may%20see%20more%20yen%20intervention,%20faster%20BOJ%20rate%20hikes%20former%20top%20currency%20diplomat.pdf"}, {"id": "bt-12", "title": "Malaysia's central bank upbeat as Q2 growth beats expectations", "source": "BT", "date": "17 Aug 2026", "tags": ["Southeast Asia", "Finance & Markets"], "summary": "Malaysia's central bank said the economy could grow around 5 per cent in 2026, at the upper end of official projections, after Q2 GDP rose 6 per cent year on year, beating the 5.8 per cent advance estimate and up from Q1's 5.4 per cent. Robust exports, steady h
