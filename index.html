r cent estimate. Barclays estimated a 17 per cent electricity tariff adjustment added 0.3 percentage point; electricity and gas rose 8.7 per cent year on year. MAS and MTI kept their 2026 full-year forecast range of 1.5 to 2.5 per cent for both measures and said core inflation should stay elevated into 2027. Economists split on October policy: BofA tentatively sees a slight 25bps slope steepening, while StanChart and Barclays expect MAS to hold.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20BT/Core%20inflation%20climbs%20to%202%20in%20July%20electricity%20prices%20rise%20sharply.pdf"},{"id":"bt-06","title":"DBS rolls out career advisory service to help employees navigate AI-driven change","source":"BT","date":"25 Aug 2026","tags":["Technology & AI","Society","Southeast Asia"],"summary":"DBS launched an in-house career advisory service to help employees navigate AI-led workplace change, training an initial group of more than 100 career advisers from its HR department. Speaking at the DBS Live Fulfilled Festival 2026, Minister Tan See Leng said automation alone captures only a fraction of AI's value and the \"bigger prize\" lies in redesigning jobs for higher-value work; AI capability must become baseline literacy. DBS signed an MOU with the Institute of Banking and Finance to train its 40,000 global staff (14,800 in Singapore) in foundational AI skills, trial workforce interventions, and strengthen the young-talent pipeline. The bank also committed to hiring more than 500 local young talent in 2026. It builds on earlier tools iCoach (2025) and iGrow (2022).","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20BT/DBS%20rolls%20out%20career%20advisory%20service%20to%20help%20employees%20navigate%20AI-driven%20change.pdf"},{"id":"bt-07","title":"Fewer than 20 ships transit key Strait of Hormuz over weekend: data","source":"BT","date":"25 Aug 2026","tags":["Energy","Geopolitics"],"summary":"Fewer than 20 commodity vessels transited the Strait of Hormuz over the weekend as Iranian and US blockades restrict the chokepoint, Kpler data showed. Four vessels crossed on Sunday and 13 on Saturday, versus 16 on Friday; some ships switched off transponders. Eight very large gas carriers passed over three days, several empty. Over the week to Aug 21, 89 vessels exited and 103 entered, with the UKMTO saying AIS-detected transits were roughly 90 per cent below pre-conflict baselines. Tankers made up 45 per cent of traffic. Since Jul 6 the UKMTO reported 23 projectile strikes causing bridge, engine-room and structural damage. Through the Bab el-Mandeb strait, 24 vessels sailed on Sunday, down from 32 on Saturday.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20BT/Fewer%20than%2020%20ships%20transit%20key%20Strait%20of%20Hormuz%20over%20weekend%20data.pdf"},{"id":"bt-08","title":"Gold hits over 3-month high ahead of US inflation data and Fed chair speech","source":"BT","date":"25 Aug 2026","tags":["Finance & Markets"],"summary":"Gold hit its highest in more than three months as a subdued US dollar lent support, with spot gold up 0.9 per cent at US$4,643.63 an ounce, the highest since mid-May, after gaining over 5 per cent last week. US gold futures rose 0.4 per cent to US$4,699.10. The dollar hovered near multi-month lows, unsettled by the Treasury's promise to buy back more long bonds. Traders awaited July PCE data and Fed chair Kevin Warsh's Jackson Hole speech on Friday for interest-rate clues. On geopolitics, the US threatened Iran with \"the greatest financial offensive ever marshalled\", and oil slipped more than US$1 a barrel. Silver rose 0.1 per cent to US$69.03, platinum 0.5 per cent and palladium 0.3 per cent.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20BT/Gold%20hits%20over%203-month%20high%20ahead%20of%20US%20inflation%20data%20and%20Fed%20chair%20speech.pdf"},{"id":"bt-09","title":"How Singapore can run the global AI race on its own terms","source":"BT","date":"25 Aug 2026","tags":["Technology & AI","Southeast Asia"],"summary":"In this commentary, McKinsey's Singapore co-managing partners build on PM Lawrence Wong's National Day Rally line that Singapore will harness technology \"on our own terms\". They argue size is not destiny, citing China's Kimi and Japan's Sakana challenging bigger AI labs. Three ideas are offered: put people at the core by keeping AI adoption and worker transitions in sync, aided by the goal of 100,000 \"AI-bilingual\" workers; build integrated national systems, leveraging Singapore's compactness and national AI Missions to make the Republic a demanding test bed; and export capabilities \"made in Singapore, for the world\", using Asean (Singapore chairs it in 2027) as a portability test. They call for a different scorecard rather than mimicking tech giants.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20BT/How%20Singapore%20can%20run%20the%20global%20AI%20race%20on%20its%20own%20terms.pdf"},{"id":"bt-10","title":"NDR 2026: Childcare leave salary caps still leave gaps for higher-income parents","source":"BT","date":"25 Aug 2026","tags":["Society","Southeast Asia","Politics"],"summary":"Businesses welcomed the government's move to fully reimburse statutory child-related leave but warned the caps may fall short for higher-paid, specialised staff. PM Lawrence Wong announced at the National Day Rally that childcare leave would rise to up to 12 days, tied to the number of children. Employers will be reimbursed up to S$500 a day (S$1,500 a year) for childcare leave, and up to S$10,000 per four weeks for maternity, paternity and adoption leave. Snef and Asme said the caps cover most workers, especially at SMEs, but SMF's Lennon Tan noted specialised shift roles cost more to cover. Manpower strain persists in manufacturing, events and other in-person sectors. Leaders urged shared manpower solutions, digitalisation, cross-training and extending caregiver leave to grandparents.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20BT/NDR%202026%20Childcare%20leave%20salary%20caps%20still%20leave%20gaps%20for%20higher-income%20parents.pdf"},{"id":"bt-11","title":"Oil steadies as US 'economic D-Day' plan offers little clarity on Hormuz deadlock","source":"BT","date":"25 Aug 2026","tags":["Energy","Geopolitics"],"summary":"Oil held a decline as the US ramped up economic pressure on Iran to reopen energy flows through the Strait of Hormuz. WTI traded near US$85 a barrel after falling more than 2 per cent, while Brent closed around US$92. Treasury Secretary Scott Bessent said countries face specific timelines to cut Iran links or face unilateral punishment in an \"economic D-Day\" campaign; OFAC sanctioned about 60 entities including shadow-fleet vessels. Analysts said the move was more a warning than an immediate supply shock, with no new geopolitical premium until secondary sanctions bite. Crude has rallied over 50 per cent in 2026. Iran said it is \"fully prepared\" despite fuel shortages of 14-15 million litres a day. Threats persisted, with a tanker struck near Oman.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20BT/Oil%20steadies%20as%20US%20'economic%20D-Day'%20plan%20offers%20little%20clarity%20on%20Hormuz%20deadlock.pdf"},{"id":"bt-12","title":"Putin is betting Russia can out-suffer Ukraine","source":"BT","date":"25 Aug 2026","tags":["Geopolitics","Defence"],"summary":"This commentary argues Vladimir Putin is unlikely to end the Ukraine war despite mounting strain, betting Russians can endure hardship longer. A bad week saw Russia threaten the UK over drone supplies, the sacking of a bank economist who said Russia cannot win a \"war of attrition\", and bank runs over savings-seizure rumours. Analyst David Roche says the Kremlin is in a \"grey zone\" of vulnerability but not collapse. Ukraine's deep-strike drones have knocked out an estimated third of Russian refining capacity; Russian casualties run near 30,000 monthly against 27,000 replacements. Russia's 2026 GDP growth is forecast at 0.4 per cent and its half-year deficit hit US$73 billion. But dwindling US Patriot supplies, glide-bomb output and wavering European resolve keep Putin confident.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20BT/Putin%20is%20betting%20Russia%20can%20out-suffer%20Ukraine.pdf"},{"id":"bt-14","title":"Shipping oil through Hormuz costs US$20 million, Total CEO says","source":"BT","date":"25 Aug 2026","tags":["Energy"],"summary":"Shipping a supertanker cargo through the Strait of Hormuz costs about US$20 million, TotalEnergies CEO Patrick Pouyanne said, underscoring the wide margins for traders and shipowners amid the Iran war. The company is buying barrels at US$50 to US$60 inside the Persian Gulf as producers rush supplies to market after six months of conflict; additional supertanker freight equates to about US$10 a barrel, while benchmark Brent traded above US$90. TotalEnergies is a large trader of Iraqi and Qatari oil, both still moving barrels through Hormuz, a waterway that carried about a fifth of world oil flows before the war. Pouyanne noted a split between bearish crude markets and tight fuel markets, with gasoline and diesel rallying on Ukrainian attacks on Russian refineries.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20BT/Shipping%20oil%20through%20Hormuz%20costs%20US20%20million,%20Total%20CEO%20says.pdf"},{"id":"bt-15","title":"Singapore's new Western island offers real opportunity to create 'next-generation energy hub': analysts","source":"BT","date":"25 Aug 2026","tags":["Energy","Southeast Asia","Environment"],"summary":"Singapore's planned new Western island, formed by merging Semakau, Bukom, Pulau Sudong and smaller islands, could house next-generation clean-power infrastructure such as green hydrogen or advanced nuclear, analysts said after PM Lawrence Wong's National Day Rally. EY-Parthenon's Sanjeev Gupta said its distance from population centres suits small reactors and could create a \"next-generation energy hub\" building on Jurong Island. Trirec's Melvyn Yeo cited nuclear fusion potential; Perdura's Sunil Veetil urged designing common infrastructure to preserve the nuclear option. Singapore has not decided on nuclear but faces an IAEA assessment in 2027. Proximity to Jurong Island offers petrochemical synergies and advanced manufacturing possibilities. Analysts stressed a \"delicate\" balance against irreversible reclamation and marine ecosystem loss.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20BT/Singapore's%20new%20Western%20island%20offers%20real%20opportunity%20to%20create%20'next-generation%20energy%20h.pdf"},{"id":"bt-16","title":"Temasek's Azalea raises over US$1 billion despite 'challenging' environment for private equity","source":"BT","date":"25 Aug 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"Azalea Investment Management, a Temasek unit, said it raised more than US$1 billion in new capital across three private equity offerings despite a challenging fundraising environment. These include US$526 million from the final close of the Altrium Private Equity Fund III, US$210 million from the first close of the Altrium Co-Invest Fund II, and over US$350 million from the launch of its first evergreen fund, Azalea All Access. CEO Chue En Yaw cited PE's growing role as a portfolio diversifier. Preqin data showed 2025 PE fundraising was soft at US$507 billion in three quarters, about 73 per cent of 2024's total, following the Fed's 2022 rate rises. Azalea All Access offers monthly subscriptions and quarterly redemptions, drawing institutional, private-bank, family-office and high-net-worth investors across Asia.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20BT/Temasek's%20Azalea%20raises%20over%20US1%20billion%20despite%20'challenging'%20environment%20for%20private%20equ.pdf"},{"id":"bt-17","title":"Trump's war on tariff evasion could turn into a battle over global manufacturing","source":"BT","date":"25 Aug 2026","tags":["Trade","Geopolitics"],"summary":"The Trump administration's crackdown on tariff evasion could trigger a bigger fight over what \"Made in China\" means. An Aug 13 White House report, \"The Great Transshipment Scam\" by Peter Navarro's office, alleges China routes exports through more than 40 third countries, estimating transshipped goods at US$34 billion to US$303 billion annually and US$19-26 billion in lost revenue. Singapore was named among smaller \"opportunistic targets\". Trade experts called it a political document that exposes how Trump's own differential tariffs incentivise rerouting. The deeper dispute concerns rules of origin and \"substantial transformation\", with some pushing to determine origin by corporate ownership, which analyst William Reinsch warned would upend supply chains. The USMCA review and September Xi-Trump summit loom as tests.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20BT/Trump's%20war%20on%20tariff%20evasion%20could%20turn%20into%20a%20battle%20over%20global%20manufacturing.pdf"},{"id":"bt-18","title":"US dollar hovers near multi-month lows as debt nerves unnerve investors","source":"BT","date":"25 Aug 2026","tags":["Finance & Markets"],"summary":"The US dollar hovered near multi-month lows, unsettled by the Treasury's promise to buy back more long-dated bonds, as traders awaited Iran sanctions details and policy speeches in the US and Japan. The Canadian dollar weakened 0.5 per cent to C$1.384 after Washington imposed 50 per cent tariffs and Canada retaliated. The euro traded at US$1.1664 and sterling at US$1.3627 near recent highs; the yen was at 159.21. The dollar logged its largest weekly drop against bitcoin in nearly 3.5 years amid debasement fears. After 30-year yields hit near two-decade highs, the Treasury said it would double long-end buybacks to US$4 billion per operation, paltry in a US$32 trillion market. China's yuan hovered near a 3.5-year high at 6.7236. Warsh speaks Friday at Jackson Hole.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20BT/US%20dollar%20hovers%20near%20multi-month%20lows%20as%20debt%20nerves%20unnerve%20investors.pdf"},{"id":"bt-19","title":"US eyes China overcapacity tariffs of 7.5% before Xi-Trump talks","source":"BT","date":"25 Aug 2026","tags":["Trade","Geopolitics"],"summary":"The US is set to impose a 7.5 per cent tariff on Chinese goods over excess manufacturing capacity before a planned September Xi-Trump summit, sources said, restoring Trump's second-term China duties to around 20 per cent, a level Beijing has said is consistent with its trade truce. One option is announcing a higher rate but suspending part to reach an effective 7.5 per cent. The move follows the Supreme Court striking down Trump's earlier global levies as unconstitutional; the administration now justifies duties via Section 301 forced-labour and overcapacity probes. In July it imposed a 12.5 per cent forced-labour tariff. Officials aim to publish the overcapacity findings before the Sep 24 Washington meeting. A coalition of 25 states has sued, calling the levies illegal. The truce expires Nov 10.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20BT/US%20eyes%20China%20overcapacity%20tariffs%20of%207.5%20before%20Xi-Trump%20talks.pdf"},{"id":"bt-20","title":"Wealthy nations fear AI, but Singapore embraces it: Here's why","source":"BT","date":"25 Aug 2026","tags":["Technology & AI","Society"],"summary":"This commentary examines why rich countries are anxious about AI while poorer ones are optimistic, and why Singapore bucks the trend. The World Bank's World Development Report 2026 finds about 4.5 per cent of jobs in low- and middle-income countries are automatable by generative AI versus 14.2 per cent in high-income ones, concentrating downside risk in wealthy service economies. A KPMG-University of Melbourne study of 48,000 people found 39 per cent of people in advanced economies trust AI versus 57 per cent in emerging ones. Nobel laureate Michael Spence attributes optimism to prior beneficial digital disruption like financial inclusion. Singapore, though developed and highly exposed, ranks among the most AI-optimistic, anchored in high institutional trust in its government to manage retraining and regulation.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20BT/Wealthy%20nations%20fear%20AI,%20but%20Singapore%20embraces%20it%20Here's%20why.pdf"},{"id":"bt-21","title":"Why Bessent's bond buyback programme should worry us","source":"BT","date":"25 Aug 2026","tags":["Finance & Markets","Politics"],"summary":"This commentary warns that US Treasury Secretary Scott Bessent's expanded bond buyback programme is stagecraft, not fiscal policy. On Aug 19, US gross national debt crossed US$40 trillion, less than five months after passing US$39 trillion, the same day the Treasury said it would at least double debt repurchases. A buyback swaps expensive long-term debt for more short-term borrowing rather than retiring debt, exposing the Treasury to rate risk. Purchases rose from US$2 billion to at least US$4 billion, tiny in a US$32 trillion market; the effect faded within 24 hours. Analysts including Evercore's Krishna Guha (\"a weak form of Operation Twist\"), Jefferies' Thomas Simons and economist Steve Hanke criticised it. With debt rising about US$2 trillion a year, the writer says a bigger buyback is the wrong signal of seriousness.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20BT/Why%20Bessent's%20bond%20buyback%20programme%20should%20worry%20us.pdf"},{"id":"scmp-01","title":"Alibaba's top executives buy US$15m in shares in vote of confidence after AI fundraising","source":"SCMP","date":"25 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Alibaba chairman Joe Tsai and CEO Eddie Wu bought a combined HK$120 million (US$15.3 million) of ordinary shares on Monday, a personal vote of confidence after the firm unveiled one of China's biggest AI-dedicated fundraising rounds. The 710 million new shares (about 3.7 per cent of outstanding) placement was oversubscribed three times, drawing US$28 billion in demand against a US$10 billion target, with anchor interest from Middle Eastern, European and Asian sovereign wealth funds. Proceeds fund \"full-stack AI capabilities.\" Alibaba's Hong Kong shares fell 8.5 per cent to HK$112.50 on dilution concerns. BofA and Nomura stayed constructive, citing \"stronger growth visibility.\" Cloud and AI revenue jumped 45 per cent year on year last quarter; capital expenditure rose 75 per cent to 67.7 billion yuan. CICC, HSBC, Morgan Stanley and UBS ran the deal.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/Alibaba's%20top%20executives%20buy%20US15m%20in%20shares%20in%20vote%20of%20confidence%20after%20AI%20fundraising.pdf"},{"id":"scmp-02","title":"America's US$40tr debt gamble is getting harder to ignore, economists say after 'grow' goal","source":"SCMP","date":"25 Aug 2026","tags":["Finance & Markets","Politics"],"summary":"US national debt just surpassed US$40 trillion, doubling in a decade, reviving doubts that growth alone can absorb it. Treasury Secretary Scott Bessent argued the US would \"grow our way out of\" the debt, but economists including Natixis's Alicia Garcia-Herrero disagree, noting US$10 trillion added since 2022. Fiscal Lab estimates 4.31 per cent annual real growth would be needed to erase the deficit, versus the CBO's 1.8 per cent baseline. Social security, health and net interest form 65 per cent of spending. The 30-year Treasury yield hit 5.34 per cent, its highest since 2007. Trump cited the \"military\" as the ultimate intervention. Critics blame the 2017 tax cuts and the \"One Big Beautiful Bill.\" Ray Dalio warned of a looming debt crisis, urging gold and bitcoin over bonds.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/America's%20US40tr%20debt%20gamble%20is%20getting%20harder%20to%20ignore,%20economists%20say%20after%20'grow'%20goal.pdf"},{"id":"scmp-03","title":"Banking veteran Li Yun fills senior Shenzhen posts in countdown to Apec","source":"SCMP","date":"25 Aug 2026","tags":["Politics"],"summary":"Banking veteran Li Yun, 52, has been named deputy Communist Party secretary and acting mayor of Shenzhen, months before the city hosts Apec meetings in November. Li, vice-governor of Guangdong since last year, spent 21 years at Agricultural Bank of China and later became vice-president of China Construction Bank; he holds a doctorate in world economy from Wuhan University. He succeeds Qin Weizhong, who left due to a \"change in work post.\" Li vowed to implement Central Committee decisions and advance Shenzhen's high-quality development. His appointment follows economist Jin Lei becoming Shenzhen party chief five months earlier. Beijing views the Apec summit as a chance to showcase technological innovation and diplomacy; Futian district, home to the Apec venues, is pushing internationalisation, and the city has ramped up security.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/Banking%20veteran%20Li%20Yun%20fills%20senior%20Shenzhen%20posts%20in%20countdown%20to%20Apec.pdf"},{"id":"scmp-04","title":"CATL debuts e-commerce platform for direct sales to small buyers, as competition sharpens","source":"SCMP","date":"25 Aug 2026","tags":["Technology & AI","Energy"],"summary":"China's CATL, the world's largest lithium-ion battery maker, launched an e-commerce platform on Friday enabling direct sales to smaller energy-storage buyers, bypassing distributors, as domestic competition intensifies. Orders can be as small as three boxes, with a five-year warranty matching larger buyers and delivery in three to five days; over 1,800 firms used it during beta. Analyst Lucas Zhang said the move targets distributed-solar and residential and small-commercial demand tied to power-market reform. CATL's global energy-storage battery share slipped to 27.1 per cent in the first half, down from 30 per cent in 2025 and 38 per cent in 2024, as Hithium, EVE Energy, BYD and Sungrow gained. Household storage shipments surged 128 per cent. CATL's first-half net profit rose 42 per cent to 43.28 billion yuan, though margins narrowed.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/CATL%20debuts%20e-commerce%20platform%20for%20direct%20sales%20to%20small%20buyers,%20as%20competition%20sharpens.pdf"},{"id":"scmp-05","title":"Can China's flash memory giant YMTC smash Shanghai Star Market IPO records?","source":"SCMP","date":"25 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"CCSH Corporation, parent of NAND flash leader YMTC, is preparing a potentially record Shanghai Star Market IPO, planning to sell 1.98 billion to 2.43 billion shares (10 to 12 per cent of enlarged capital), per a Friday prospectus. It earmarked 33 billion yuan (US$4.9 billion), with 20.8 billion for production lines and 12.2 billion for R&D, exceeding DRAM maker CXMT's baseline. CXMT raised 66.6 billion yuan in July, the largest Star Market IPO on record, and its shares surged 466 per cent on debut. CCSH posted first-quarter revenue of 47 billion yuan and net profit near 33.4 billion yuan. NAND revenue jumped 393 per cent year on year, lifting gross margin to 78.7 per cent. YMTC, on the US Entity List since 2022, has pivoted to domestic suppliers and ranks third globally in NAND bit shipments.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/Can%20China's%20flash%20memory%20giant%20YMTC%20smash%20Shanghai%20Star%20Market%20IPO%20records.pdf"},{"id":"scmp-06","title":"China and Jordan call for Strait of Hormuz to get back to normal after US-Iran conflict","source":"SCMP","date":"25 Aug 2026","tags":["Geopolitics","Energy"],"summary":"China and Jordan jointly called for reopening the Strait of Hormuz and maintaining the US-Iran ceasefire, in a statement during King Abdullah's Beijing visit and meeting with Xi Jinping. The strait, a \"vital channel\" for energy trade, remains closed to most shipping after the six-month war; peace talks have stalled. Both criticised Israel's \"dangerous escalatory actions\" in the West Bank and East Jerusalem, including settlement expansion. Xi pledged deeper cooperation in trade, infrastructure, mining, AI and green energy. The meeting came hours before Washington announced its \"toughest\" Iran sanctions. Jordan, hosting US bases and hit by Iranian strikes, is diversifying partnerships; China is its biggest trading partner. Green power now makes up 27 per cent of Jordan's grid, up from under 1 per cent a decade ago, targeting 40 per cent by 2035.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/China%20and%20Jordan%20call%20for%20Strait%20of%20Hormuz%20to%20get%20back%20to%20normal%20after%20US-Iran%20conflict.pdf"},{"id":"scmp-07","title":"China boosts coal's economic value 700% after turning it to liquids: report","source":"SCMP","date":"25 Aug 2026","tags":["Energy","Technology & AI"],"summary":"China Energy Group Ningxia Coal Industry runs the world's largest coal-to-liquids plant, which reached full operation last month and processed 24 million tonnes of coal in 2025, boosting coal's value sevenfold (700 per cent), per Science and Technology Daily. Using indirect coal liquefaction, it converts coal into low-sulphur oil products including diesel, naphtha, waxes, lubricants and rocket fuel. The technology aided China as it sourced over 40 per cent of its crude from the Middle East before the Strait of Hormuz was blocked by the US-Israel war on Iran; oil topped US$100 a barrel. China developed the tech domestically after South Africa's Sasol demanded up to US$2.5 billion; the home-grown Shenning gasifier emerged in 2012. The facility, larger than 650 football fields, now runs with 99.8 per cent automated control.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/China%20boosts%20coal's%20economic%20value%20700%20after%20turning%20it%20to%20liquids%20report.pdf"},{"id":"scmp-08","title":"China's advanced chip supply to surge by 2035 despite equipment bottlenecks, Goldman says","source":"SCMP","date":"25 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Goldman Sachs projects China's advanced-chip supply (7-nanometre and below) to grow at a 46 per cent compound annual rate from 2025 to 2035, far outpacing 17 per cent demand growth, narrowing the supply-demand gap to 34 per cent by 2035 from 92 per cent in 2025. Supply could reach 410,000 wafers monthly versus 619,000 demand. Growth is driven by SMIC's capacity expansion (30,000 to 50,000 wafers a year) and yields rising from 23 per cent in 2026 to 75 per cent by 2035. China's chip self-sufficiency hit about 70 per cent by volume in June. Capex could reach US$82 billion in 2030, and local equipment makers may hold 38 per cent of the market by value in 2028. Lithography remains the missing link, with China reliant on ASML's DUV machines and blocked from EUV.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/China's%20advanced%20chip%20supply%20to%20surge%20by%202035%20despite%20equipment%20bottlenecks,%20Goldman%20says.pdf"},{"id":"scmp-09","title":"Chinese tech, pharma firms eye Hong Kong as springboard for global expansion","source":"SCMP","date":"25 Aug 2026","tags":["Trade","Technology & AI"],"summary":"Mainland Chinese tech and pharma firms are using Hong Kong as a launchpad for global expansion, industry leaders said during a Greater Bay Area trip organised by the Hong Kong and Macau Affairs Office. Guangzhou Pharmaceutical Holdings vice-chairman Chen Jiehui praised the city's East-West blend for taking traditional Chinese medicine global, and said his state-owned firm is weighing investment in the Northern Metropolis megaproject, which aims to turn 30,000 hectares near the border into a tech and economic hub. PCI Technology's Wang Yuemiao cited Hong Kong's international business network and professional services in law, finance and IP. EHang's Xue Peng highlighted drone-logistics potential. The government's GoGlobal Task Force encourages firms to use Hong Kong as an overseas expansion platform under the Belt and Road strategy.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/Chinese%20tech,%20pharma%20firms%20eye%20Hong%20Kong%20as%20springboard%20for%20global%20expansion.pdf"},{"id":"scmp-10","title":"EV maker Xpeng set to challenge Tesla in embodied AI after robotics unit raises US$900m","source":"SCMP","date":"25 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Chinese EV maker Xpeng raised US$900 million for its robotics unit Dogotix, valuing it at US$6.3 billion in what it called the biggest single private-equity deal for a Chinese robotics maker. Backers Alibaba, Tencent, IDG and Gaorong invested a combined US$600 million; Xpeng pledged US$200 million and executives US$100 million. The capital positions Xpeng to challenge Tesla in embodied and physical AI and humanoid robots. CEO He Xiaopeng aims to build a global physical-AI leader. Xpeng's second-quarter net loss widened 179 per cent to 1.34 billion yuan (US$199.4 million) as R&D jumped 32.1 per cent; revenue rose 8 per cent to 19.7 billion yuan. Xpeng plans 1,000-plus humanoid robots monthly by end-2026, deploying Iron robots as showroom assistants, with commercial deliveries in 2027. Tesla has yet to sell any Optimus robots.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/EV%20maker%20Xpeng%20set%20to%20challenge%20Tesla%20in%20embodied%20AI%20after%20robotics%20unit%20raises%20US900m.pdf"},{"id":"scmp-11","title":"Hang Seng Bank doubles down on wealth hubs despite Beijing's tighter investment scrutiny","source":"SCMP","date":"25 Aug 2026","tags":["Finance & Markets"],"summary":"Hang Seng Bank is expanding its wealth-centre network to capture high-net-worth demand, despite Beijing's tighter scrutiny of mainland investors' cross-border investments. The lender opened a new 6,300 sq ft wealth centre with a sky bar at Hysan Place, Causeway Bay, its second after Harbour City, marking its first grade-A presence on Hong Kong Island, where over 30 per cent of its \"Prestige Banking\" clients are based. It plans to raise relationship managers by about 20 per cent this year and open a Central MTR retail centre plus more wealth hubs over 12 to 18 months. Retail head Rannie Lee cited \"very strong demand\" despite Common Reporting Standard tax scrutiny. Wealth management posted strong double-digit first-half growth; 60,000 new customers were added in the second quarter. AXA is also leasing a new Hong Kong wealth hub.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/Hang%20Seng%20Bank%20doubles%20down%20on%20wealth%20hubs%20despite%20Beijing's%20tighter%20investment%20scrutiny.pdf"},{"id":"scmp-12","title":"Hong Kong housing rally faces test as property flippers retreat","source":"SCMP","date":"25 Aug 2026","tags":["Finance & Markets"],"summary":"Hong Kong's housing rally faces a test as short-term investors retreat, leaving owner-occupiers to sustain the recovery. Centaline's secondary index rose 0.64 per cent to 162.16 on Friday, a three-year high, but flips of homes held under a year fell to 99 in July, down 24 per cent from June and half of March's 202. Average profit per sale rose nearly 10 per cent to HK$842,000, the year's highest monthly average. Centaline's Louis Chan said buyers resist chasing prices as rate expectations shift, with new launches drawing traders. Colliers' Alvin Leung called the slowdown selective rather than a broad retreat. Remaining flips concentrate in cheaper homes: of 922 short-term deals in seven months, 474 were under HK$4 million. The biggest July gain was HK$7.38 million on a Residence Bel-Air flat.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/Hong%20Kong%20housing%20rally%20faces%20test%20as%20property%20flippers%20retreat.pdf"},{"id":"scmp-13","title":"How China's anti-corruption fight became Xi Jinping's most important policy","source":"SCMP","date":"25 Aug 2026","tags":["Politics"],"summary":"An SCMP data project examines how Xi Jinping's anti-corruption campaign became one of the Communist Party's most important policies rather than a temporary crackdown. Once feared to be \"just a gust of wind,\" it has widened: in 2024 agencies punished 983,000 people, with senior officials felled triple the 2013 number. From 2013 to 2025, 60 per cent of felled senior officials served in regional governments, hitting resource-rich Jiangxi, Liaoning, Shanxi, Hebei and Inner Mongolia hardest. The campaign expanded from economic graft to enforcing party discipline and policy adherence, uncovering crypto schemes and proxies. It was institutionalised via the 2018 National Supervisory Commission. Party governance will headline October's fifth plenum, ahead of next year's 21st congress, expected to endorse a fourth Xi term. Experts say it enforces discipline and Xi's agenda.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/How%20China's%20anti-corruption%20fight%20became%20Xi%20Jinping's%20most%20important%20policy.pdf"},{"id":"scmp-14","title":"Mainland China's ship activity near Taiwan hits record for third month in a row","source":"SCMP","date":"25 Aug 2026","tags":["Geopolitics","Defence"],"summary":"Mainland Chinese government vessel sightings around Taiwan hit record levels for a third straight month, with Taiwan's defence ministry detecting coastguard, survey and other official vessels 118 times in August's first 24 days, surpassing 117 in July and 111 in June, far above the prior record of 50 in April 2025. The Asia Maritime Transparency Initiative reported a \"more sustained and assertive presence\" east of Taiwan, concentrated where Chinese, Japanese and Philippine claims overlap, following late-May Tokyo-Manila boundary talks Beijing calls \"illegal, null and void.\" Survey vessels often operated within 50 nautical miles of Taiwan. Analysts warn Beijing may seek a \"semi-permanent presence\" and rehearse a maritime quarantine, with survey data potentially informing undersea warfare in any Taiwan conflict.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/Mainland%20China's%20ship%20activity%20near%20Taiwan%20hits%20record%20for%20third%20month%20in%20a%20row.pdf"},{"id":"scmp-15","title":"Malaysia says Indonesia to open airspace for cloud seeding to tackle haze","source":"SCMP","date":"25 Aug 2026","tags":["Environment","Southeast Asia"],"summary":"Indonesia has granted Malaysian agencies permission to enter its airspace for cloud-seeding operations to combat regional haze from forest and land fires, Malaysia's environment minister Arthur Joseph Kurup said. The fires have led to dozens of school closures this month, including in Malaysia. Malaysia's disaster agency and meteorological department are preparing schedules for cloud seeding in shared border areas, coordinated with the Indonesian military. Malaysia is also ready to help extinguish fires. Both countries will escalate firefighting and prevention ahead of national holidays, including Malaysia Day in Sarawak on September 16. Sarawak, bordering Indonesia's Kalimantan on Borneo, is worst hit, with six districts recording unhealthy air pollution readings on Monday, and unhealthy levels in eight other districts across four peninsular states.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/Malaysia%20says%20Indonesia%20to%20open%20airspace%20for%20cloud%20seeding%20to%20tackle%20haze.pdf"},{"id":"scmp-16","title":"Meet Dai Zheng, the space veteran betting on China's reusable rocket revolution","source":"SCMP","date":"25 Aug 2026","tags":["Technology & AI"],"summary":"LandSpace's Dai Zheng, 42, chief commander of the Zhuque-3 missions, is profiled after his rocket booster returned from orbit and landed upright on August 19, a first in Chinese commercial space history. A decade ago he left a prestigious post at the state China Academy of Launch Vehicle Technology, where he helped architect the Long March 5, to join the then one-year-old start-up in 2016. The landing followed an eight-month recovery effort after a December crash, vindicating his bet that reusability is essential to cutting launch costs for China's satellite-constellation ambitions. LandSpace's Zhuque-2 became the world's first methane-powered rocket to reach orbit in 2023; Zhuque-3 uses stainless steel like SpaceX's Starship. \"We cannot let the next generation look up and see only American satellites,\" Dai said.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/Meet%20Dai%20Zheng,%20the%20space%20veteran%20betting%20on%20China's%20reusable%20rocket%20revolution.pdf"},{"id":"scmp-17","title":"Mexico 'optimistic' on US trade deal after Canada talks collapse","source":"SCMP","date":"25 Aug 2026","tags":["Trade","Geopolitics"],"summary":"Mexican President Claudia Sheinbaum voiced optimism about reaching a trade deal with the US, even as US-Canada negotiations collapsed. Her top negotiator, Economy Minister Marcelo Ebrard, is in Washington for several days seeking to lower 50 per cent US tariffs on Mexican steel and aluminium and 25 per cent duties on cars. The six-year-old USMCA pact, covering the US, Mexico and Canada, recently entered annual reviews. Washington's talks with Ottawa fell apart, prompting Trump to say he will double tariffs on Canadian cars and parts next year. The breakdown triggered a 50 per cent US levy on about US$20 billion of Canadian goods, while Prime Minister Mark Carney announced retaliatory tariffs effective September 8. As with Mexico, Canada's current car duty is 25 per cent, applied only to non-US content.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/Mexico%20'optimistic'%20on%20US%20trade%20deal%20after%20Canada%20talks%20collapse.pdf"},{"id":"scmp-18","title":"Nexperia's China unit pivots to domestic 12-inch wafers in pursuit of '100%' independence","source":"SCMP","date":"25 Aug 2026","tags":["Technology & AI","Trade"],"summary":"The China unit of Dutch chipmaker Nexperia announced plans to shift its entire product line to a domestic 12-inch silicon wafer foundry, pursuing \"100 per cent domestic production\" amid a nearly year-long dispute with its European headquarters. Cut off from European wafer supplies, the unit is moving from 8-inch and 6-inch lines to a new 12-inch supply from an unnamed \"Chinese strategic partner,\" touting cost efficiency. The rift stems from the Dutch government's September 2025 move to restrict Chinese parent Wingtech's control; Nexperia then suspended shipments to its Dongguan plant. The China unit says it has shipped over 40 billion chips to 1,000-plus customers in 11 months. Wingtech had committed 12 billion yuan (US$1.8 billion) to a Shanghai 12-inch line and filed a lawsuit in May. The split has disrupted automotive supply chains.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/Nexperia's%20China%20unit%20pivots%20to%20domestic%2012-inch%20wafers%20in%20pursuit%20of%20'100'%20independence.pdf"},{"id":"scmp-19","title":"Northern Metropolis gets vote of confidence as heavyweights win tender for HK$1.03b","source":"SCMP","date":"25 Aug 2026","tags":["Finance & Markets"],"summary":"A six-company consortium won the first \"large-scale land disposal\" project in Hong Kong's Northern Metropolis for HK$1.03 billion (US$132 million), a 10.5-hectare site in Hung Shui Kiu with total investment projected at HK$16.8 billion. HSK New Development comprises subsidiaries of China Merchants Land, China Resources Land, China Overseas Land & Investment, Sino Land, CTG Investment and JD.com. It scored 100 marks under a two-envelope system weighting land premium 30 per cent and non-price factors 70 per cent, beating Henderson Land. JD.com will deploy proprietary LangzuTech logistics robots and occupy at least 15,300 sq m. The project will create over 6,000 jobs and build more than 3,000 flats. Officials called it a \"vote of confidence\" and a model for industry-oriented land tendering.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/Northern%20Metropolis%20gets%20vote%20of%20confidence%20as%20heavyweights%20win%20tender%20for%20HK1.03b.pdf"},{"id":"scmp-20","title":"Taiwan unveils Strong Bow anti-ballistic missile specs in push for US$1.13 billion funding","source":"SCMP","date":"25 Aug 2026","tags":["Defence","Geopolitics"],"summary":"Taiwan's National Chung-Shan Institute of Science and Technology unveiled specifications of its Chiang Kung (Strong Bow) anti-ballistic missile system to win legislative funding for mass production. The defence ministry seeks NT$36.1 billion (US$1.13 billion) via a supplementary budget to build two systems and 128 interceptors after the programme was cut from a pared-back package in May. Also called Tien Kung IV, the land-based, hypersonic, two-stage solid-fuel interceptor engages missiles above 70km using AESA radar, thrust-vector control and an active seeker. It forms the outermost layer of Taiwan's planned \"T-Dome\" network. Analyst Su Tzu-yun called it \"Taiwan's version of THAAD,\" with a battery covering 100km to 150km and radar range near 1,000km. Analysts warn delays could hamper defences against the PLA's growing missile arsenal.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/Taiwan%20unveils%20Strong%20Bow%20anti-ballistic%20missile%20specs%20in%20push%20for%20US1.13%20billion%20funding.pdf"},{"id":"scmp-21","title":"UK's Burnham plans US trip in September to lobby Trump on Ukraine needs","source":"SCMP","date":"25 Aug 2026","tags":["Defence","Geopolitics"],"summary":"UK Prime Minister Andy Burnham plans to travel to the US in September, alongside other European leaders, to lobby President Trump to let Ukraine access Patriot air-defence missile stocks before winter. Speaking in Kyiv after his first international visit as premier, chairing a meeting of Ukraine's allies and meeting Zelensky, Burnham said he felt \"really optimistic\" that Ukraine's interceptor shortages are \"fixable.\" European leaders may hold another \"Coalition of the Willing\" meeting around the UN General Assembly. Trump has backtracked on letting Kyiv build interceptors, and the Iran war has depleted global Patriot stocks. Burnham will allow Ukraine access to classified British technology to assemble SCALP cruise missiles domestically. Zelensky seeks 300 Patriot missiles; at least 437 Ukrainian civilians were killed in July 2026, a 30 per cent annual rise.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/UK's%20Burnham%20plans%20US%20trip%20in%20September%20to%20lobby%20Trump%20on%20Ukraine%20needs.pdf"},{"id":"scmp-22","title":"US removes Syria from state sponsor of terrorism list","source":"SCMP","date":"25 Aug 2026","tags":["Geopolitics"],"summary":"The United States on Monday removed Syria from its state sponsor of terrorism list, rescinding a designation in place since 1979 that had severely impeded investment. The State Department also revoked the global terrorist designation of Hayat Tahrir al-Sham (HTS), formerly al-Nusra Front, leaving Cuba, Iran and North Korea as the remaining designated states. Treasury Secretary Scott Bessent said the action would foster investment and stability, while stressing continued commitment to countering terrorism. Secretary of State Marco Rubio cited commitments by President Ahmed al-Sharaa to distance Syria from terrorism. Syria's central bank governor called it a \"historic step.\" The move follows Trump meeting al-Sharaa, a former jihadist who recast himself after the 2024 toppling of the Assad family, on the sidelines of a Nato summit.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/US%20removes%20Syria%20from%20state%20sponsor%20of%20terrorism%20list.pdf"},{"id":"scmp-23","title":"US sanctions Chinese entities, issues global warning on 'Economic D-Day' against Iran","source":"SCMP","date":"25 Aug 2026","tags":["Geopolitics","Finance & Markets","Energy"],"summary":"The US announced fresh sanctions on 60 entities, individuals and vessels worldwide, including in mainland China and Hong Kong, and warned Iran-linked entities face removal from the US dollar system. Dubbed \"Economic D-Day,\" the actions aim to choke Tehran after strikes and diplomacy failed to reopen the Strait of Hormuz in the six-month conflict. Treasury Secretary Scott Bessent said Trump is calling world leaders to cut ties, but the sanctions stopped short of major Chinese banks and refiners. Targets include Hong Kong's Sweet Ocean Industrial and several Shenzhen logistics firms tied to Iranian procurement and oil. China rejected the \"illicit unilateral sanctions\"; it buys over 80 per cent of Iran's oil exports. Iran threatened retaliation. The measures complicate the fragile US-China truce ahead of a Trump-Xi summit.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/US%20sanctions%20Chinese%20entities,%20issues%20global%20warning%20on%20'Economic%20D-Day'%20against%20Iran.pdf"},{"id":"scmp-24","title":"US set for largest mass visa revocation, targeting up to 200,000 foreigners","source":"SCMP","date":"25 Aug 2026","tags":["Politics","Society"],"summary":"The Trump administration is preparing to revoke B1 and B2 business and tourism visas of up to 200,000 foreigners who have applied for or are seeking US asylum, potentially the largest single mass visa revocation in US history and likely to face legal challenges. The State Department, coordinating with Homeland Security, is expected to announce in coming weeks the revocation of visas issued between 2016 and 2026 whose holders sought asylum. Revocations would not necessarily trigger immediate deportation; most pending asylum cases would be recategorised. Officials say it targets people entering as short-term visitors who then file for asylum. Deputy Secretary Christopher Landau said people are \"fed up with bogus asylum claims.\" In 18 months the department has already revoked about 175,000 visas over crimes or dissent.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/US%20set%20for%20largest%20mass%20visa%20revocation,%20targeting%20up%20to%20200,000%20foreigners.pdf"},{"id":"scmp-25","title":"US targets China's telecoms grip in Venezuela with new sanctions carve-out","source":"SCMP","date":"25 Aug 2026","tags":["Geopolitics","Technology & AI"],"summary":"The US is opening Venezuela's telecommunications sector to new investment and technology while explicitly excluding Chinese firms, a move that could erode Huawei and ZTE's deep foothold as Venezuela transitions to 5G. OFAC issued two general licences (61 and 62) easing sanctions on state provider CANTV, mobile operator Movilnet and regulator Conatel, but barring transactions involving China, Russia, Iran, North Korea and Cuba. Analyst Alcides Leon said most CANTV and Movilnet technology now comes from Huawei, making a shift difficult and costly, and potentially affecting maintenance and repairs. A 2019 US$144 million CANTV-Huawei contract deployed 4G and 5G with 900 LTE base stations. European suppliers Ericsson and Nokia could gain ground. China condemned the \"illicit unilateral sanctions\" and vowed to protect its firms.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/US%20targets%20China's%20telecoms%20grip%20in%20Venezuela%20with%20new%20sanctions%20carve-out.pdf"},{"id":"scmp-26","title":"US, China diplomats clash over tech spying and trade hub claims in Latin America","source":"SCMP","date":"25 Aug 2026","tags":["Geopolitics","Technology & AI"],"summary":"Chinese and US diplomats in Latin America traded barbs on social media over alleged espionage risks from Chinese tech firms, highlighting strategic tensions in the western hemisphere weeks before an expected Xi-Trump summit. US assistant secretary Juan Pablo Segura named Huawei, ZTE, Hytera, Hikvision, Dahua and DJI as \"high-risk technologies,\" urging partners to switch to \"trusted suppliers.\" Beijing's Panama mission rejected the claims as baseless, accusing the US of being the true global spy and of \"techno-bullying.\" Foreign ministry spokesman Lin Jian dismissed \"fact-distorting fabrications.\" The clash follows an August 13 White House report describing Latin American countries as a \"shadow transshipment network\" re-exporting Chinese goods. Washington has designated the hemisphere a \"Homeland Security Zone\" under a \"Trump Corollary\" to the Monroe Doctrine.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/US,%20China%20diplomats%20clash%20over%20tech%20spying%20and%20trade%20hub%20claims%20in%20Latin%20America.pdf"},{"id":"scmp-27","title":"Ukraine wants peace but won't 'simply surrender', Zelensky says on Independence Day","source":"SCMP","date":"25 Aug 2026","tags":["Geopolitics","Defence"],"summary":"Ukraine wants peace but will not \"simply surrender,\" President Zelensky said in a defiant Independence Day speech marking 35 years since the break from the Soviet Union, as foreign leaders including UK PM Andy Burnham and European Council President Antonio Costa gathered in Kyiv. Zelensky vowed to counter Putin's \"ballistic terror\" and rejected ceding the remaining Donbas. Burnham was to announce British support for Kyiv's long-range missile production and co-chair a virtual \"Coalition of the Willing\" meeting with Macron and Merz on air defence. The Kremlin warned that classified British SCALP technology would \"add fuel to the fire.\" Zelensky cited a US$27-billion defence funding gap, warned Russia could mobilise 300,000 troops after September elections, and said \"China must no longer remain silent.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/25%20Aug%202026/25%20Aug%20SCMP/Ukraine%20wants%20peace%20but%20won't%20'simply%20surrender',%20Zelensky%20says%20on%20Independence%20Day.pdf"}]},"2026-08-26":{"date":"2026-08-26","dayOfWeek":"Wednesday","totalArticles":80,"sourceCounts":{"WSJ":18,"ST":24,"BT":10,"SCMP":28},"executiveDigest":"The Iran war hit its six-month mark with a fresh tanker strike in the Strait of Hormuz and Tehran vowing retaliation for the US 'economic offensive' - even as Trump claimed the strait had been 'demined' and Iran and Oman floated a temporary corridor. Washington kept squeezing Iran while pointedly 'avoiding its biggest lifeline, China', and inside Iran 'economic asphyxiation' had Tehranites queuing for petrol. Markets fixated on Jackson Hole: US consumer confidence hit a seven-month low, four Fed bank boards wanted a hike, gold's debasement trade firmed and Bitcoin topped US$80,000. Singapore built its hub - pledging with Indonesia and Malaysia to keep the straits 'free, open and safe' and bidding to host an investor-state dispute tribunal.","briefingCards":[{"title":"Lead story - Iran war hits six months, Hormuz flares again","body":"The conflict reached a grim milestone: WSJ marked 'the six-month mark' as a 'new tanker strike in Hormuz' met Iran's vow to retaliate 'for the US economic offensive'. The signals were contradictory - Trump 'said the Strait of Hormuz has been demined' and warned Iran 'not to plant more', while ST reported Iran and Oman 'discussing a temporary Hormuz corridor as the impasse drags on'. Crucially, WSJ noted the US 'squeezes Iran but avoids targeting its biggest lifeline, China', and ST flagged Iraq as a model for pressuring Tehran's trade partners. The human toll of 'economic asphyxiation' showed as Tehranites queued for petrol, the US began 'returning staff to Middle East missions', and Trump sent a Saudi nuclear deal to Congress tied to recognising Israel."},{"title":"Markets & finance","body":"Rate uncertainty gripped the tape before Jackson Hole: WSJ asked 'should the Fed raise rates? Clear as mud', BT reported 'four Fed bank boards wanted a hike', and US consumer sentiment fell to a seven-month low even as home prices rose. The debasement theme intensified - a US Treasury buy-back 'reinforced the gold debasement trade', Bitcoin 'rose above US$80,000 on a soft dollar', and WSJ warned of 'America's spiraling debt crisis'. Central banks diverged: the ECB is 'set for a September hike with no appetite to signal more', the RBA 'remains jittery', and Germany's Q2 growth beat. Japan Inc is 'seeking new hedges for a long era of yen weakness', and SCMP explored how a Chinese vault network could bolster the yuan via gold."},{"title":"Asia realignment","body":"The trade war hardened: Canada 'hit US goods with tariffs of up to 50% as the war escalated', and WSJ weighed how the new Canadian tariffs will hit the US economy - even as US-China Track 1.5 talks offered a 'normal stability' formula. Washington conceded ground on minerals ('US admits defeat in the China minerals race'), US lawmakers urged banning Americans from 'aiding Chinese security agencies', and China's anti-corruption drive is 'about to extend beyond its borders'. Security friction simmered: satellite images hinted at 'China adding radar eyes near an emerging South China Sea base', China's J-16s drilled against Egypt's Rafales, and a US spy chief reportedly visited Russia as a US military transport plane landed in Moscow."},{"title":"Energy & climate","body":"Hormuz stayed the fulcrum - a fresh tanker strike, Trump's 'demined' claim, and Iran-Oman corridor talks - while an Asian shipper 'paid a record US$5.3 million for Panama Canal access' amid drought. Climate extremes mounted: the 'hottest ocean temperature on record' was logged 'as a super El Nino forms', and 'extreme weather is hammering Europe's summer harvest', the EU said. Strategic-energy moves advanced: China is 'tapping high-altitude winds for power generation by flying craft to 4,000m', Singapore's island-merger plan 'fuelled nuclear-power speculation', and Trump sent a Saudi civil-nuclear deal to Congress - all against a backdrop of the IMF's Georgieva saying the 'global economy is weathering the energy shock'."},{"title":"Technology & AI","body":"The AI valuation debate ran hot: WSJ reported 'Anthropic expects to tell investors it sees over US$30 trillion in potential revenue', yet warned 'Nvidia has become a banker to the AI boom, putting it on dangerous ground', and OpenAI's head of data centres 'has left the company'. Bubble fears surfaced elsewhere - China's Unitree 'slumped 45% after a fivefold IPO surge' - even as Jack Ma bought HK$600 million of Alibaba shares (execs and Michael Burry featured around its US$10 billion sale) 'signalling AI confidence'. DeepSeek 'led a surge in low-cost Chinese open-weight models on a US platform', Apple unveiled new Mac Mini and Mac Studio chips amid a supplier 'memory-price squeeze', and traders eyed Nvidia's results."},{"title":"Singapore & SEA focus","body":"Singapore pressed straits security and hub-building: Indonesia, Malaysia and Singapore 'committed to keep the Malacca and Singapore straits free, open and safe', Singapore 'will bid to host an international tribunal for investor-state disputes' (Edwin Tong), and it agreed with Vietnam to 'deepen leadership exchanges and expand tech cooperation'. The financial hub drew talent - 'Japan's only high-speed trader, Dharmacapital, is moving to Singapore' - and Guangzhou Knowledge City will work with SUSS and SIT on healthcare and AI. SCMP said the island-merger plan 'fuels nuclear-power speculation', and BT cheered 'DBS's stellar performance and Temasek's dominance', while ST's 'the geese stop flying' asked why some Asian economies 'can't take off'."}],"keyMetrics":[{"value":"80","label":"Articles curated today","sub":"WSJ 18 · ST 24 · BT 10 · SCMP 28"},{"value":"6 months","label":"Iran war milestone","sub":"New Hormuz tanker strike"},{"value":">US$80k","label":"Bitcoin on debasement","sub":"Gold firms pre-Jackson Hole"},{"value":">US$30t","label":"Anthropic revenue vision","sub":"Nvidia 'banker to the AI boom'"},{"value":"-45%","label":"Unitree shares slump","sub":"Sparks robotics bubble fears"},{"value":"Free & open","label":"Straits pledge","sub":"Indonesia, Malaysia, Singapore"}],"articles":[{"id":"wsj-01","title":"America's Spiraling Debt Crisis","source":"WSJ","date":"26 Aug 2026","tags":["Finance & Markets","Politics"],"summary":"William Galston warns that U.S. government debt hitting $40 trillion has alarmed global markets, driving long-term rates to their highest since 2007. Treasury doubled purchases of long-term securities, a tactic investors dismissed as \"a band-aid on a bullet hole,\" but rates soon resumed rising. Tech giants borrowing for AI data centers add pressure. The CBO projects annual deficits climbing from 5.8% to 6.7% of GDP, adding $24 trillion to public debt; interest payments would double to $2.1 trillion by 2036. Galston blames both tax cuts and spending, urges a surtax funding defense increases, a bipartisan commission to stabilize Social Security before its cash reserves run dry, and structural healthcare reforms.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20WSJ/America's%20Spiraling%20Debt%20Crisis.pdf"},{"id":"wsj-02","title":"Anthropic Expected to Tell Investors It Sees Over $30 Trillion in Potential Revenue","source":"WSJ","date":"26 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Anthropic, maker of Claude, is likely to tell investors its total addressable market exceeds $30 trillion, topping SpaceX's $28.5 trillion IPO estimate, people familiar said. Such TAM figures, always speculative, are especially squishy for AI. NYU's Aswath Damodaran called SpaceX's AI-driven TAM \"reaching the end of what's plausible.\" Anthropic more than doubled revenue to $11.6 billion in the second quarter; by contrast, 191 S&P 1500 tech firms earned $2.4 trillion last year. The company could raise up to $100 billion, above SpaceX's $86 billion, targeting a roughly $2 trillion valuation versus SpaceX's $1.77 trillion. Plans remain fluid, but Anthropic could unveil disclosures within weeks and go public by September or early October.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20WSJ/Anthropic%20Expected%20to%20Tell%20Investors%20It%20Sees%20Over%2030%20Trillion%20in%20Potential%20Revenue.pdf"},{"id":"wsj-03","title":"Extreme Weather Is Hammering Europe's Summer Harvest, EU Says","source":"WSJ","date":"26 Aug 2026","tags":["Environment","Trade"],"summary":"Extreme heat and drought over two months have severely damaged European harvests and will likely cause crop failures, the European Commission's MARS crop-monitoring bulletin said. Dry, hot weather \"substantially worsened summer crop prospects\" across western and central Europe. France, southern Germany and northern and central Italy are hardest hit, with grain maize yields projected more than 10% below the five-year average across those countries in 2026. Austria, the Czech Republic, Slovakia and Hungary also suffered. EU-wide, maize yields are seen 7% below average, soybeans 14%, potatoes 6% and rapeseed 5%. The Met Office linked the record heat to an unprecedented El Nino. Agriculture Commissioner Christophe Hansen said forecast cooler, wetter weather comes too late.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20WSJ/Extreme%20Weather%20Is%20Hammering%20Europe's%20Summer%20Harvest,%20EU%20Says.pdf"},{"id":"wsj-04","title":"How Will the New Canadian Tariffs Affect the U.S. Economy?","source":"WSJ","date":"26 Aug 2026","tags":["Trade","Politics"],"summary":"Canada announced tariffs of 15% to 50% on about $20 billion of U.S. goods, effective Sept. 8, a \"dollar for dollar\" reply to U.S. levies on $20 billion of Canadian goods enacted Aug. 22. The two nations have a nearly $900 billion annual trading relationship. Canada is targeting steel, aluminum, furniture, clothing, appliances, dairy, seafood, motorcycles and farm equipment, chosen to pressure Republicans in midterm races across northern-tier states like Maine, Michigan and Wisconsin. Industry Minister Melanie Joly said the aim is political leverage. Trump threatened 50% tariffs on Canadian autos from January. Prime Minister Mark Carney said Canada is \"becoming stronger and less dependent on America.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20WSJ/How%20Will%20the%20New%20Canadian%20Tariffs%20Affect%20the%20U.S.%20Economy.pdf"},{"id":"wsj-05","title":"New Tanker Strike in Hormuz as Iran Vows Retaliation for U.S. Economic Offensive","source":"WSJ","date":"26 Aug 2026","tags":["Geopolitics","Energy"],"summary":"Another oil tanker was struck near the Strait of Hormuz overnight amid an escalating U.S.-Iran economic standoff. Treasury Secretary Scott Bessent launched \"Operation Economic Outcast\" to isolate Tehran, warning countries doing business with Iran could face penalties, and said \"We are going to collapse this regime.\" UKMTO reported the tanker disabled off Oman; Iran has hit over a dozen vessels this month. Houthis struck a Saudi tanker Monday. Iranian officials threatened attacks, with security official Mohsen Rezaei warning that support for Washington's campaign would be treated as \"an act of war.\" China, Iran's main oil buyer, said economic warfare would heighten tensions and vowed to safeguard its interests.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20WSJ/New%20Tanker%20Strike%20in%20Hormuz%20as%20Iran%20Vows%20Retaliation%20for%20U.S.%20Economic%20Offensive.pdf"},{"id":"wsj-06","title":"Nvidia Has Become a Banker to the AI Boom, Putting It on Dangerous Ground","source":"WSJ","date":"26 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Nvidia is increasingly using financial engineering to keep customers buying its chips, introducing risks that could eventually cause pain. It recently provided backstops potentially exposing it to some $230 billion in lease and residual-value obligations, including a $105 billion backstop for an OpenAI lease in Ohio and up to $125 billion supporting Wall Street financing deals. It also acts as customer of last resort for two Australian cloud firms, a model it calls new. Nvidia holds over $80 billion in cash and $72.5 billion in company stakes, but analysts warn the deals concentrate AI risk. The WSJ likens it to Lucent, whose vendor financing to weak customers fueled its dot-com-era downfall.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20WSJ/Nvidia%20Has%20Become%20a%20Banker%20to%20the%20AI%20Boom,%20Putting%20It%20on%20Dangerous%20Ground.pdf"},{"id":"wsj-07","title":"OpenAI's Head of Data Centers Has Left the Company","source":"WSJ","date":"26 Aug 2026","tags":["Technology & AI"],"summary":"Chris Malone, who oversaw OpenAI's data-center build-out, left last week, joining a wave of leadership departures ahead of a planned 2027 IPO. Malone joined in March 2025 shortly after OpenAI announced Stargate with Oracle and SoftBank; that effort got off to a rocky start, prompting a shift toward cloud providers. Recent exits include Chief Revenue Officer Denise Dresser, COO Brad Lightcap and Fidji Simo, Sam Altman's second-in-command. OpenAI, racing to catch Anthropic in business sales, is now reviving internal data-center projects under other leaders. It raised projected computing spending to around $750 billion through 2030, up from $600 billion, and signed a 10-gigawatt Ohio lease backed by an Nvidia guarantee.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20WSJ/OpenAI's%20Head%20of%20Data%20Centers%20Has%20Left%20the%20Company.pdf"},{"id":"wsj-08","title":"Reserve Bank of Australia Remains Jittery About Inflation Risks","source":"WSJ","date":"26 Aug 2026","tags":["Finance & Markets"],"summary":"The Reserve Bank of Australia remains nervous about inflation and won't rule out further rate rises, especially if the Middle East war drives fuel prices sharply higher, minutes of its recent policy meeting show. The RBA held the cash rate at 4.35%, judging policy sufficiently restrictive to return inflation to target, though not until late 2027. The board acknowledged inflationary pressures could prove stronger if upside risks crystallize. Governor Michele Bullock and Deputy Andrew Hauser have since warned inflation remains too high, with Bullock calling a further increase \"quite possible.\" Beyond the war, the RBA is also watching a surge in investment tied to the build-out of artificial-intelligence infrastructure.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20WSJ/Reserve%20Bank%20of%20Australia%20Remains%20Jittery%20About%20Inflation%20Risks.pdf"},{"id":"wsj-09","title":"Russia Tests Readiness for New Round of Military Mobilization","source":"WSJ","date":"26 Aug 2026","tags":["Geopolitics","Defence"],"summary":"Russia is running mobilization-readiness exercises nationwide, including in Kaliningrad, preparing to house, feed and arm potential recruits, Western intelligence officials said. The Kremlin denies any tests and hasn't decided to proceed, likely waiting until after late-September parliamentary elections. But Putin's drive to seize all of Donbas, amid heavy losses and Ukrainian drone advances that have slashed soldiers' front-line lifespans, may force his hand. His September 2022 mobilization triggered mass emigration and chaos. Rumors have again spurred Russians to scout exits, with a record 20,000 crossing into Georgia in one day. Analysts warn mass mobilization would strain Russia's fragile economy and budget, and say authorities may now call up men gradually to avoid panic.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20WSJ/Russia%20Tests%20Readiness%20for%20New%20Round%20of%20Military%20Mobilization.pdf"},{"id":"wsj-10","title":"Should the Fed Raise Rates? That's Clear as Mud","source":"WSJ","date":"26 Aug 2026","tags":["Finance & Markets"],"summary":"Former Fed vice chairman Alan Blinder argues the case for the Fed's September decision is genuinely ambiguous, evidenced by three dissents at the last FOMC meeting. New Chairman Kevin Warsh, untested and open to dissent, may face \"a good family fight.\" PCE inflation, above 3.6% against a 2% target, has crept up for a year, worrying hawks. But growth has slowed to a 1.4% annual rate and payroll gains dropped to 316,000 over 12 months, alarming doves. The real fed-funds rate near zero signals easy money, while 4.1% unemployment matches full employment. Neither a clear case to raise nor to hold applies, leaving muddy waters; Blinder criticizes Warsh's hostility to forward guidance.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20WSJ/Should%20the%20Fed%20Raise%20Rates%20That's%20Clear%20as%20Mud.pdf"},{"id":"wsj-11","title":"The Metals Lobby's Big Steal","source":"WSJ","date":"26 Aug 2026","tags":["Trade","Politics"],"summary":"The WSJ editorial board argues U.S. steel and aluminum lobbies scuttled a deal that would have cut tariffs on Canadian metals to 25% from 50%, escalating the trade war as Canada retaliated with $20 billion in tariffs. Trump removed Canada and Mexico exemptions and raised metal tariffs to 50%, then added 25% on derivative imports. U.S. aluminum prices are now roughly 75% above the global benchmark and steel about 64% higher than in northern Europe. Metal tariffs, including copper, raised $46.9 billion this fiscal year plus $21.8 billion in 2025, a nearly $70 billion tax on Americans. Producer shares soared while overall manufacturing employment fell 62,000.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20WSJ/The%20Metals%20Lobby's%20Big%20Steal.pdf"},{"id":"wsj-12","title":"The Warnings That Came Before a War Now Reaching the Six-Month Mark","source":"WSJ","date":"26 Aug 2026","tags":["Geopolitics","Politics"],"summary":"Before ordering war on Iran on Feb. 28, Trump was warned by intelligence chief Tulsi Gabbard and military leaders that killing Iran's supreme leader could bring a harder-line regime, close the Strait of Hormuz and destabilize energy markets. Nearly six months on, a conflict Trump promised would end within six weeks continues with no clear end. An estimated 3,000 Iranians and 18 U.S. servicemembers have died, with 756 troops wounded; oil reserves and munitions stockpiles are drained. The war weighs on Republican midterm prospects and Trump's poll numbers. A June interim deal to reopen Hormuz collapsed. Treasury's Scott Bessent has now shifted to \"Operation Economic Outcast\" to collapse Iran's economy.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20WSJ/The%20Warnings%20That%20Came%20Before%20a%20War%20Now%20Reaching%20the%20Six-Month%20Mark.pdf"},{"id":"wsj-13","title":"The World's Craziest Stock Market Has Turned Into a Fright Ride","source":"WSJ","date":"26 Aug 2026","tags":["Finance & Markets","Technology & AI"],"summary":"South Korea's Kospi, the world's hottest market for much of the past year on AI enthusiasm, more than tripled before plummeting about 40% over six weeks in June and July, erasing roughly $2.5 trillion in value. Memory-chip makers Samsung and SK Hynix reached trillion-dollar valuations and came to compose over half the exchange. Losses hit hardest among individual \"ant\" investors, who blame President Lee Jae Myung's May approval of single-stock leveraged ETFs that magnified bets. In the U.S., the DRAM ETF became the most successful launch in history before the crash; hedge fund Situational Awareness lost 67%. Regulators have paused new leveraged products and tripled required cash deposits.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20WSJ/The%20World's%20Craziest%20Stock%20Market%20Has%20Turned%20Into%20a%20Fright%20Ride.pdf"},{"id":"wsj-14","title":"U.S. Consumer Sentiment Fell in August, Conference Board Says","source":"WSJ","date":"26 Aug 2026","tags":["Finance & Markets"],"summary":"U.S. consumer confidence fell in August as expectations for future business and labor-market conditions turned more pessimistic, The Conference Board said. Its consumer confidence index dropped to 89.4 from 90.2 in July, below economists' 90.2 forecast. Consumers' assessment of current business and labor conditions rose 6.8 points to 121.2, following three months of decline, while the expectations index fell 5.8 points to 68.2. Perceptions of employment improved, with the labor-market differential, the share saying jobs are plentiful minus those saying they are hard to get, rising to 7.5%. A University of Michigan sentiment reading follows Friday, and the Fed's preferred PCE inflation gauge, expected above target, is due this week.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20WSJ/U.S.%20Consumer%20Sentiment%20Fell%20in%20August,%20Conference%20Board%20Says.pdf"},{"id":"wsj-15","title":"U.S. Home Price Growth Rose in June","source":"WSJ","date":"26 Aug 2026","tags":["Finance & Markets"],"summary":"U.S. home-price growth rose in June even as regional trends diverged and inflation cooled. The S&P Cotality Case-Shiller National Home Price Index climbed 1.5% in the 12 months through June, up from a 1.2% increase in May. But for the 13th consecutive month, home values fell in real terms, as June's 3.5% inflation ran roughly two percentage points above the 1.5% price gain. Chicago posted the highest annual gain among 20 cities at 6.9%, followed by New York at 4.8% and Cleveland at 4.1%, while Seattle recorded the lowest return, falling 2%. S&P's Rebecca Kaufman said homeowners and renters \"breathed a sigh of relief\" as inflation cooled. Detroit-area data faced recording delays.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20WSJ/U.S.%20Home%20Price%20Growth%20Rose%20in%20June.pdf"},{"id":"wsj-16","title":"U.S. Squeezes Iran but Avoids Targeting Its Biggest Lifeline: China","source":"WSJ","date":"26 Aug 2026","tags":["Geopolitics","Energy"],"summary":"The U.S. launched \"Operation Economic Outcast\" to cut off \"every remaining lifeline\" sustaining Iran's economy, but Treasury Secretary Scott Bessent's announcement pointedly avoided China, which enables Iran to withstand American pressure by buying most of its oil. The U.S. sanctioned over 60 entities, including Chinese firms aiding Iran's nuclear, missile, oil and cyber activities, atop more than 1,000 prior sanctions, yet spared prominent Chinese banks. China imported over 500,000 barrels a day in August via ship-to-ship transfers, per Kpler. Analysts said the framing lets China adjust quietly. With Trump seeking better ties and a Xi summit looming next month, officials fear Chinese retaliation over rare earths remains a real threat.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20Aug%202026/26%20Aug%20WSJ/U.S.%20Squeezes%20Iran%20but%20Avoids%20Targeting%20Its%20Biggest%20Lifeline%20China.pdf"},{"id":"wsj-17","title":"World Trade Flows Continue Recovery in June","source":"WSJ","date":"26 Aug 2026","tags":["Trade","Technology & AI"],"summary":"World trade flows rose sharply in June, buoyed by AI-related investment despite disruption from the Iran war and the Strait of Hormuz closure. Goods volumes rose 2% from May, when they gained 0.5%, according to the Netherlands CPB bureau. Trade withstood 2025's U.S. tariff surge, with export and import volumes rising 4.2% for the year versus 2.6% in 2024, driven by demand for semiconductors and data-center equipment. Fed economists estimated that without the AI boom, U.S. imports would have fallen 10% in 2025. Germany raised its second-quarter growth estimate to 0.3%, led by exports. But new Trump tariffs, including a threatened 50% on Canadian autos, threaten second-half flows.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/26%20
