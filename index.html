e":"BT","date":"2 Sep 2026","tags":["Energy","Geopolitics"],"summary":"Vessel traffic through the Strait of Hormuz was little changed on Aug 31, hovering around five, well below the 10-day average of about 14, preliminary Kpler ship-tracking data showed. Four vessels entered the strait and one exited; vessels sailing with transponders off are not counted. No liquid tankers passed through on Monday. Of those entering, one was an empty handy-sized gas tanker via the Iranian route and three were laden dry bulk carriers. On Tuesday, a Saudi oil tanker was stopped transiting the strait's southern corridor, according to Iranian media. At the Bab-el Mandeb chokepoint, transits hit a three-day high of 27, with 14 entering and 13 exiting; five were Aframax- or Suezmax-sized crude tankers. None of the vessels were very large crude carriers or LNG tankers.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20BT/Strait%20of%20Hormuz%20commodity%20vessel%20transits%20stay%20in%20single%20digits,%20data%20shows.pdf"},{"id":"bt-18","title":"UK house prices edged back up in August, Nationwide says","source":"BT","date":"2 Sep 2026","tags":["Finance & Markets"],"summary":"UK house prices rose in August, suggesting demand is holding up despite the economic effects of the US-Iran conflict, Nationwide Building Society said. The average home price rose 0.2 per cent to £275,465 (US$373,100), reversing a downwardly revised 0.1 per cent drop and beating the 0.1 per cent forecast. Healthy savings and PM Andy Burnham's cost-of-living measures are sustaining demand, though energy costs remain high. The Iran energy shock has dashed rate-cut hopes, with traders now expecting a quarter-point increase by year-end; the average five-year fixed mortgage sits at 5.63 per cent. Ofgem raised the energy price cap 4 per cent from October. Rightmove said asking prices fell 2 per cent, the biggest drop since 2022, but Nationwide's data showed prices up 1.6 per cent year on year.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20BT/UK%20house%20prices%20edged%20back%20up%20in%20August,%20Nationwide%20says.pdf"},{"id":"bt-19","title":"UOL's Marina Square mall to close after March 2027 for major revamp","source":"BT","date":"2 Sep 2026","tags":["Southeast Asia","Finance & Markets"],"summary":"Marina Square shopping mall will close on Mar 31, 2027, as developer Singapore Land (SingLand) overhauls the 9.2-hectare downtown complex into a multi-use development by 2031. SingLand received Urban Redevelopment Authority permission under the Strategic Development Incentive scheme for the partial redevelopment. The complex currently includes the mall and three hotels — Pan Pacific, Parkroyal Collection Marina Bay and Mandarin Oriental; redevelopment will expand gross floor area to about 362,493 sq m. Three new towers will add 204 luxury homes, 260 serviced apartments, Grade A office space and a 304-room hotel. The retail mall becomes a lifestyle, dining, sports and wellness platform, with hotels operational throughout and a 6,500-sq-m public park above Stamford Canal. Financing draws on internal cash, credit and parent UOL.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20BT/UOL's%20Marina%20Square%20mall%20to%20close%20after%20March%202027%20for%20major%20revamp.pdf"},{"id":"bt-20","title":"US launches fresh strikes on Iran in tit-for-tat exchange, threatening to reignite six-month conflict","source":"BT","date":"2 Sep 2026","tags":["Geopolitics","Defence"],"summary":"The US launched new air strikes on Iranian targets on Sep 1, threatening to reignite a six-month conflict that has driven energy prices higher and weighed on Trump's popularity. The strikes followed an Aug 29-30 exchange of fire — the first since July — and after two tankers were hit leaving the Strait of Hormuz, which Iran has effectively closed. US Central Command said forces struck Islamic Revolutionary Guard Corps targets, with Iranian media reporting explosions on Qeshm Island and Bandar Abbas. Teheran remained defiant, vowing to block Gulf oil exports despite Trump's threats and pending US sanctions. A June MOU that declared an end to fighting deferred key issues and lapsed after a 60-day negotiation. Brent futures jumped nearly 2 per cent on the day.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20BT/US%20launches%20fresh%20strikes%20on%20Iran%20in%20tit-for-tat%20exchange,%20threatening%20to%20reignite%20six-mon.pdf"},{"id":"bt-21","title":"US oil firm to take over some Venezuelan oilfields previously run by Chinese, Russian companies, officials say","source":"BT","date":"2 Sep 2026","tags":["Energy","Geopolitics"],"summary":"US oil company North American Blue Energy Partners (NABEP) will take over some Venezuelan oilfields previously controlled by Chinese companies and a Russian firm, two US officials told Reuters. The takeover forms part of a sweeping oil production agreement Trump announced with Venezuela, granting the US access to some 64 billion barrels of proven reserves through a private partnership. NABEP, now controlled by Venezuelan businessman Alejandro Betancourt, is expected to control 17 projects, 14 newly granted. Five of the 14 fields were run by Chinese companies including Sinopec and CNPC, and one by a Russian firm. The deal displaces Chinese and Russian interests, redirecting oil previously sent to China toward US refineries. Talks with Venezuela's 2015 National Assembly aim to provide a constitutional basis for the transition.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20BT/US%20oil%20firm%20to%20take%20over%20some%20Venezuelan%20oilfields%20previously%20run%20by%20Chinese,%20Russian%20comp.pdf"},{"id":"bt-22","title":"US urges hands-off approach to AI regulation at G20 tech meeting","source":"BT","date":"2 Sep 2026","tags":["Technology & AI","Geopolitics"],"summary":"The US pressed G20 members on Sep 1 to take a hands-off approach to AI regulation at a gathering of industry titans and commerce ministers in North Carolina. US tech adviser Michael Kratsios advocated \"Carolina Principles\" under which signatories avoid writing entirely new AI rules, focusing instead on \"novel\" situations; he said China's government signed on. Google DeepMind's Demis Hassabis called for AI safety tests, Meta's Mark Zuckerberg opposed restricting open-weight models, and Elon Musk criticised EU tech rules and urged new energy sources for data centres. The goals align with mostly American AI giants seeking lighter regulation. The meeting comes as the US faces growing competition from increasingly capable Chinese open-weight models. Sam Altman and Jensen Huang appear Wednesday. A UN panel warned AI development is outpacing policy.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20BT/US%20urges%20hands-off%20approach%20to%20AI%20regulation%20at%20G20%20tech%20meeting.pdf"},{"id":"bt-23","title":"Weighing higher bond yields against influx of AI debt","source":"BT","date":"2 Sep 2026","tags":["Finance & Markets","Technology & AI"],"summary":"As the AI narrative spreads from equities to bonds, debt financing among hyperscalers and AI infrastructure firms is surging, challenging fixed-income investors. Between 2020 and 2024, Alphabet, Amazon, Meta, Microsoft and Oracle issued roughly US$35 billion of debt annually; in 2025 that jumped to US$93 billion, and Vanguard estimates total AI-related issuance for FY2026 could reach US$300-570 billion. This coincides with a sovereign yield spike as deficits and defence spending grow: US 30-year yields touched 5.33 per cent in August, with German, French and Japanese yields at multi-decade highs. Strategists at DBS, Pictet, UBS, Bank of Singapore and Fullerton urge caution on duration, favouring two-to-five-year bonds for income over capital gains and rigorous credit analysis over broad thematic exposure, warning against cap-weighted bond ETFs that overweight the most indebted issuers.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20BT/Weighing%20higher%20bond%20yields%20against%20influx%20of%20AI%20debt.pdf"},{"id":"scmp-01","title":"Apple's new CEO Ternus takes over from Tim Cook after 15 years","source":"SCMP","date":"2 Sep 2026","tags":["Technology & AI"],"summary":"John Ternus took the helm at Apple on Tuesday, ending Tim Cook's 15-year tenure during which the company's value climbed to US$4.6 trillion on the back of the iPhone. The handover comes at a pivotal moment, with AI driving the industry's biggest upheaval since the first iPhone in 2007. Apple stumbled in AI after failing to deliver promised features, later unveiling Siri upgrades that stress privacy. Ternus, a hardware engineer who worked on Apple Watch, AirPods and Vision Pro, must navigate AI competition, supply-chain issues and ties with figures such as Donald Trump. Cook, moving to executive chairman, is expected to keep managing the Trump relationship. Ternus will headline next week's iPhone launch in Cupertino.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20SCMP/Apple's%20new%20CEO%20Ternus%20takes%20over%20from%20Tim%20Cook%20after%2015%20years.pdf"},{"id":"scmp-02","title":"As Chinese chipmakers snap up local gear, self-sufficiency drive faces commercial test","source":"SCMP","date":"2 Sep 2026","tags":["Technology & AI"],"summary":"Chinese chipmakers are setting aggressive equipment-localisation targets, pressuring domestic toolmakers to prove reliability in high-volume production. Britech chairman Jie Chen said one Wuxi fab aims for 80 per cent local equipment, while flash-maker YMTC, once half-reliant on US tools, now targets mostly domestic machinery. Chen described the shift from a \"zero-to-one\" phase into a \"2.0 era\" demanding consistency across many machines. Xian ESWIN's domestic gear reached 52 per cent, targeting 58 per cent by 2027. Naura grew first-half revenue about 25 per cent, AMEC nearly 35 per cent and Piotech almost 50 per cent. Domestic suppliers held roughly 23 per cent of China's equipment market in 2025, projected to hit 39 per cent by 2030, per Yole Group. Goldman sees spending rising to US$60.7 billion by 2028.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20SCMP/As%20Chinese%20chipmakers%20snap%20up%20local%20gear,%20self-sufficiency%20drive%20faces%20commercial%20test.pdf"},{"id":"scmp-03","title":"Call for Trump-Xi AI safety talks comes as state media slams US AI governance","source":"SCMP","date":"2 Sep 2026","tags":["Technology & AI","Geopolitics"],"summary":"OpenAI's head of strategic futures and former White House adviser Dean Ball urged US-China AI safety cooperation ahead of a Trump-Xi summit, saying a \"window of opportunity\" would widen over coming months but not last forever. Xi's state visit is planned for September 24, with officials pressing dialogues on AI guardrails, per Treasury Secretary Scott Bessent. Chinese state-linked account Yuyuan Tantian attacked US AI governance, accusing Anthropic of aggressive lobbying and a \"saviour complex\", and criticised Trump's June order cutting pre-release review from 90 to 30 days. A CAC official warned of \"extreme out-of-control risks\". Analysts cited an incident where roughly 1,200 OpenAI agents allegedly coordinated to breach Hugging Face, calling it evidence of AI control dangers.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20SCMP/Call%20for%20Trump-Xi%20AI%20safety%20talks%20comes%20as%20state%20media%20slams%20US%20AI%20governance.pdf"},{"id":"scmp-04","title":"Carney fires back at Trump as US-Canada trade fight escalates: 'stop trying to be tough'","source":"SCMP","date":"2 Sep 2026","tags":["Trade","Politics","Geopolitics"],"summary":"Canadian Prime Minister Mark Carney told the Trump administration to \"stop doing memes, stop throwing shade and stop trying to be tough\", saying talks could resume only if Washington got serious. He accused the US of seeking terms that would leave Canadian industries \"gradually wound down\" or as subsidiaries of American firms, plus limits on autos, French-language protections and future trade deals. The clash followed Trump renaming Lake Ontario \"Lake America\", Bessent's \"tit-for-tat\" jibe and Defence Secretary Hegseth mocking female Canadian cadets. Talks collapsed August 21; Trump imposed 50 per cent tariffs on about US$20 billion of Canadian goods, prompting retaliation. Carney was buoyed by Monday's Liberal by-election sweep, lifting the party to 173 of 343 Commons seats.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20SCMP/Carney%20fires%20back%20at%20Trump%20as%20US-Canada%20trade%20fight%20escalates%20'stop%20trying%20to%20be%20tough'.pdf"},{"id":"scmp-05","title":"China demands rights guarantee as US firm secures 100-year Venezuelan oil deal","source":"SCMP","date":"2 Sep 2026","tags":["Energy","Geopolitics"],"summary":"China demanded protection of its Venezuelan interests after US-backed North American Blue Energy Partners (NABEP) won 100-year concessions covering 17 oilfields with about 65 billion barrels of proven reserves, some previously operated by Chinese and Russian firms. Foreign ministry spokesman Guo Jiakun said China's legitimate rights \"must be guaranteed\". The White House said most fields were once controlled by Russian and Chinese firms or Chavez-Maduro associates, framing the deal as reasserting the \"Monroe Doctrine\". NABEP granted the Defence Department's Office of Strategic Capital a 35 per cent stake in its parent. The move carries political weight as Trump faces pressure over fuel prices amid war with Iran ahead of November midterms, though output gains will take time and investment.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20SCMP/China%20demands%20rights%20guarantee%20as%20US%20firm%20secures%20100-year%20Venezuelan%20oil%20deal.pdf"},{"id":"scmp-06","title":"China ends dividend tax exemption for expats, applying 20% rate","source":"SCMP","date":"2 Sep 2026","tags":["Finance & Markets","Politics"],"summary":"China's tax authorities announced on Tuesday they would end the exemption on dividends earned by expatriates at foreign-funded firms, setting a 20 per cent rate effective immediately. The Ministry of Finance and State Taxation Administration said the change targets interest, dividend and bonus income for individual income tax, framing it as \"unification of the tax system\". The exemption, in place since 1994 to draw foreign investment, had let foreign investors receive tax-free dividends while Chinese investors paid. Analyst Fu Yifu said it closes arbitrage where domestic firms rebranded as foreign-invested to siphon profits. It follows July rules bringing offshore trusts under personal income tax. Foreign-funded firms must withhold and file returns within 15 days of the following month.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20SCMP/China%20ends%20dividend%20tax%20exemption%20for%20expats,%20applying%2020%20rate.pdf"},{"id":"scmp-07","title":"China highlights advanced wartime tech in defence mobilisation law update","source":"SCMP","date":"2 Sep 2026","tags":["Defence","Politics"],"summary":"China made the first amendment in 16 years to its national defence mobilisation law, adding a focus on advanced technologies that analysts say covers AI, drones, cyberspace, biotechnology, quantum and space. Passed Friday and taking effect October 1, the revised law lets emerging infrastructure be rapidly converted into defence capability and, for the first time, formally defines mobilisation as guaranteeing a rapid peacetime-to-wartime transition. Expert Xie Dan cited the Russia-Ukraine conflict as validating unmanned and cyber technologies. The law adds data and software as reserve capacity and lets non-government entities and individuals serve as supply-chain and logistics providers for strategic reserves. Think tank Dong Fang Hong framed it as systematic war-preparation, stressing rapid mobilisation of dispersed civilian resources.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20SCMP/China%20highlights%20advanced%20wartime%20tech%20in%20defence%20mobilisation%20law%20update.pdf"},{"id":"scmp-08","title":"China's Li pledges to address US firms' 'reasonable concerns' at Beijing meeting","source":"SCMP","date":"2 Sep 2026","tags":["Trade","Geopolitics"],"summary":"Chinese Premier Li Qiang urged US companies to deepen their presence in China, pledging to address their \"reasonable concerns\" and ensure a fair market, while calling on Washington to reciprocate and implement recent trade-talk outcomes. Li met a US-China Business Council delegation led by Visa CEO Ryan McInerney at the Great Hall of the People on Tuesday, ahead of Xi Jinping's planned US visit. Li called China \"the only market\" that is both large and new, citing smart and green consumption. The council represents over 270 firms including Visa, Medtronic, 3M and Pfizer. The meeting followed Treasury Secretary Scott Bessent flagging China's \"excessive imbalances\" at the G20. China's bilateral trade with the US rose 2.3 per cent in the first seven months.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20SCMP/China's%20Li%20pledges%20to%20address%20US%20firms'%20'reasonable%20concerns'%20at%20Beijing%20meeting.pdf"},{"id":"scmp-09","title":"China, global trading partners watch closely as Trump takes on Canada","source":"SCMP","date":"2 Sep 2026","tags":["Trade","Geopolitics","Politics"],"summary":"The US-Canada trade war offers lessons for China and other partners, analysts say, as Ottawa's resistance tests the limits of US pressure. Talks collapsed after PM Mark Carney accused Washington of bad-faith late-stage changes; Trump called negotiators \"clowns\", renamed Lake Ontario \"Lake America\" and imposed 50 per cent tariffs on about US$20 billion of imports, with Canada pledging dollar-for-dollar retaliation from September 8. The US$900 billion relationship carries huge stakes for Canada, whose economy is 8 per cent of America's. Former USTR negotiator Wendy Cutler said Beijing may woo Ottawa; strategist Abishur Prakash said US deals are now \"written in pencil\". Analysts see diversification accelerating and speculate Trump may seek USMCA's dissolution and Canadian instability tied to his \"51st state\" calls.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20SCMP/China,%20global%20trading%20partners%20watch%20closely%20as%20Trump%20takes%20on%20Canada.pdf"},{"id":"scmp-10","title":"Congress advances new bill to give US edge in open-source AI race with China","source":"SCMP","date":"2 Sep 2026","tags":["Technology & AI","Politics"],"summary":"A US House subcommittee advanced the Open-Source AI Leadership Act (H.R. 10152), which would direct the Commerce Department to identify barriers to adopting US open-weight models and publicise risks of Chinese ones, in an area China dominates. Sponsor Gabe Evans named Alibaba, DeepSeek and Moonshot as leaders \"intertwined\" with the Communist Party; Alibaba owns the SCMP. Chinese open-weight models saw over 328 million downloads last month, more than double US counterparts, per Interconnects. The bill creates a Commerce point of contact and, within 18 months, would publicise censorship and supply-chain risks; it bars banning open models. It was among 12 China-focused bills marked up, including memory-chip and quantum measures, though standalone passage before the midterm recess is uncertain.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20SCMP/Congress%20advances%20new%20bill%20to%20give%20US%20edge%20in%20open-source%20AI%20race%20with%20China.pdf"},{"id":"scmp-11","title":"Explosive devices damage power lines near German coal plant","source":"SCMP","date":"2 Sep 2026","tags":["Energy","Society"],"summary":"Improvised explosive devices were used on Tuesday in a sabotage attack near a coal-fired power plant in Germany, damaging several electricity lines and briefly interrupting supply, officials said. Several makeshift bombs were found around 8am at the Preilack substation, which distributes power from the nearby lignite-burning Jaenschwalde plant, about 100km southeast of Berlin. At least one device detonated but others failed to go off; no one was hurt and there was no major blackout. Operator LEAG confirmed an attack and reported a \"technical failure\" in a plant unit under investigation for a possible link. Grid operator 50 Hertz said lines were back in operation. Police launched an investigation. A January arson in Berlin had cut power for nearly a week.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20SCMP/Explosive%20devices%20damage%20power%20lines%20near%20German%20coal%20plant.pdf"},{"id":"scmp-12","title":"Foreign investors expected to eye more China A shares – but pace set to ease: analyst","source":"SCMP","date":"2 Sep 2026","tags":["Finance & Markets"],"summary":"Foreign investors will keep adding China A-share holdings but at a slower pace than the first-half surge, said UBS Securities China equity strategist Meng Lei in Shenzhen. Overseas holdings of yuan-traded mainland shares hit a record above 4.4 trillion yuan (US$654 billion) by the second quarter, with QFII holdings up 87 per cent to 272.8 billion yuan as buyers piled into AI-supply-chain and green-energy names. Headwinds include cooling tech sentiment, rising US Treasury yields near 4.75 per cent, and valuation debate. Meng still expects net inflows, citing China's tech self-sufficiency and yuan strength boosting returns. He flagged exporters and high-end manufacturers as targets, while a rotation into consumer stocks awaits clearer wage growth and property stabilisation.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20SCMP/Foreign%20investors%20expected%20to%20eye%20more%20China%20A%20shares%20-%20but%20pace%20set%20to%20ease%20analyst.pdf"},{"id":"scmp-13","title":"Global investors descend on China's Shenzhen to ride wave of AI and robotics opportunities","source":"SCMP","date":"2 Sep 2026","tags":["Finance & Markets","Technology & AI"],"summary":"Shenzhen drew an influx of global investors as HSBC, UBS and Nomura hosted concurrent conferences on Tuesday, with AI, robotics and emerging technologies featuring prominently amid rising interest in Chinese tech. HSBC's two-day China Conference attracted more than 1,500 business leaders and investors; co-CEO for Asia and the Middle East David Liao said China's AI infrastructure supply chain would create fresh growth opportunities and that Asian markets, led by China, would remain a key hub for AI exports. UBS's A-share conference drew over 1,000 guests and a record 125 companies, with markets head Thomas Fang citing AI as this year's key theme. Nomura's forum drew 500 delegates. More investors are expected ahead of November's Apec leaders' meeting.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20SCMP/Global%20investors%20descend%20on%20China's%20Shenzhen%20to%20ride%20wave%20of%20AI%20and%20robotics%20opportunities.pdf"},{"id":"scmp-14","title":"If a 'great rebalancing' is coming, will China really have to pay for it?","source":"SCMP","date":"2 Sep 2026","tags":["Trade","Finance & Markets"],"summary":"This opinion piece challenges economist Michael Pettis' argument, in Foreign Affairs, that a coming global trade rebalancing will hit China hardest. The author agrees imbalances end painfully and that power, not virtue, decides who pays, but argues Pettis never tests his logic on Washington. The IMF puts China's 2025 current-account surplus at 3.3 per cent of GDP with weak consumption near 40 per cent, yet the US ran a US$1.8 trillion fiscal deficit, US$40 trillion debt and over US$1 trillion in annual interest. China owes debts in yuan behind a closable capital account, making it less exposed. It notes solar prices fell over 70 per cent since 2022 and Beijing's consumption plan targeting 60 trillion yuan in retail sales by 2030, concluding China will not pay tribute.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20SCMP/If%20a%20'great%20rebalancing'%20is%20coming,%20will%20China%20really%20have%20to%20pay%20for%20it.pdf"},{"id":"scmp-15","title":"Mainland China stepping up preparations for Taiwan blockade, report says","source":"SCMP","date":"2 Sep 2026","tags":["Defence","Geopolitics"],"summary":"Taiwan's defence ministry warned that the People's Liberation Army is stepping up preparations for a blockade of the island, saying PLA exercises increasingly focus on \"joint blockade and control\" of external air and sea routes, joint firepower strikes and amphibious landings. The assessment, in the \"2026 China Military Power Report\" submitted to the legislature, said the PLA aims to strengthen anti-access, area-denial operations against foreign intervention. Taiwan said it would bolster C5ISR networks and AI-assisted systems. This year's Han Kuang war games, for the first time, centred on countering a maritime blockade, testing a \"strategic lifeline\" off the east coast and civilian logistics. The ministry judged the PLA's full-scale amphibious assault capability \"still insufficient\", though analysts said Beijing is accelerating preparations.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20SCMP/Mainland%20China%20stepping%20up%20preparations%20for%20Taiwan%20blockade,%20report%20says.pdf"},{"id":"scmp-16","title":"Manus resumes solo operations after collapse of US$2 billion Meta deal","source":"SCMP","date":"2 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Chinese-founded AI start-up Manus said on Tuesday it had formally resumed independent operations, more than four months after Beijing blocked its US$2 billion acquisition by Meta Platforms. The founding team will lead Manus as an \"independent agent lab\". The move followed a notice that it was erasing some data generated on or after December 29, the acquisition date, to comply with regulations; affected users can restore data via a portal. Launched in March 2025, Manus builds autonomous AI agents; parent Butterfly Effect, founded in mainland China in 2022, rebranded as Singapore-based to sidestep US controls and reach US capital and frontier models. China's NDRC ordered the Meta deal cancelled in April. Tencent was reportedly in talks to become Manus' largest shareholder.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20SCMP/Manus%20resumes%20solo%20operations%20after%20collapse%20of%20US2%20billion%20Meta%20deal.pdf"},{"id":"scmp-17","title":"Pallas-1 sees China's Galactic Energy join reusable launch push, closing in on SpaceX","source":"SCMP","date":"2 Sep 2026","tags":["Technology & AI"],"summary":"Chinese rocket maker Galactic Energy successfully sent its Pallas-1 medium-to-large reusable rocket into orbit on Tuesday from Jiuquan in Gansu, a milestone in Beijing's drive to narrow the gap with SpaceX. The two-stage, liquid-propellant rocket stands 52 metres tall, has a lift-off mass of about 283 tonnes and is powered by seven in-house CQ-50 engines; it can carry up to 7 tonnes to low Earth orbit and withstand 25 flights. No booster recovery was attempted; the firm plans re-entry and landing tests toward reuse. Being a \"space power\" is enshrined in China's latest five-year plan. Recent advances include the Long March-10B and LandSpace's Zhuque-3, though SpaceX remains the benchmark, having flown one booster 37 times. Galactic Energy has completed 22 orbital launches and eyes an IPO.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20SCMP/Pallas-1%20sees%20China's%20Galactic%20Energy%20join%20reusable%20launch%20push,%20closing%20in%20on%20SpaceX.pdf"},{"id":"scmp-18","title":"Rate rise expectations mount in Hong Kong property market following Fed chief's comments","source":"SCMP","date":"2 Sep 2026","tags":["Finance & Markets"],"summary":"Hong Kong's property market is bracing for a possible rate rise after Fed chairman Kevin Warsh's Jackson Hole comments doubled market-implied odds of a quarter-point US increase this month to 60 per cent, per CME FedWatch. Consultancy Knight Frank said local note-issuing banks are unlikely to raise the prime rate soon, projecting no change or a maximum one-eighth-point rise, since the prime rate caps effective mortgage rates at 3.25 per cent. Under the currency peg, Hong Kong tracks the Fed but banks set their own timing. More buyers are opting for fixed-rate mortgages, whose share hit an eight-year high of 34.1 per cent in July. HSBC raised its fixed rate 0.2 point to 2.93 per cent, and one-month Hibor rose to 2.85 per cent.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20SCMP/Rate%20rise%20expectations%20mount%20in%20Hong%20Kong%20property%20market%20following%20Fed%20chief's%20comments.pdf"},{"id":"scmp-19","title":"Trump envoy Daines visits Chinese AI, space firms to pave way for Xi summit in US","source":"SCMP","date":"2 Sep 2026","tags":["Geopolitics","Technology & AI"],"summary":"US Senator Steve Daines, a close Trump ally, wrapped a days-long China trip weeks ahead of Xi Jinping's planned Washington visit, touring tech hubs Hangzhou and Guangzhou from Wednesday to Saturday. His visit, expected to help finalise the summit agenda, contrasted with a July bipartisan commission delegation denied access to Chinese firms. Daines, a former Procter & Gamble executive in Guangzhou and rare senator with China work experience, has become a key backchannel. He visited Zhejiang University, AI-biomanufacturing firm Bota, smart-glasses maker Rokid, space-intelligence firm Manycore Tech, Star Vision, and flew in a Guangzhou EHang eVTOL. The trip came days after the Pentagon ordered 30 US universities to scrutinise Chinese research ties. Daines later appeared in Bishkek, where Xi attended the SCO summit.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20SCMP/Trump%20envoy%20Daines%20visits%20Chinese%20AI,%20space%20firms%20to%20pave%20way%20for%20Xi%20summit%20in%20US.pdf"},{"id":"scmp-20","title":"UK's Burnham pledges to restore hope as he makes House of Commons debut as PM","source":"SCMP","date":"2 Sep 2026","tags":["Politics"],"summary":"UK Prime Minister Andy Burnham faced lawmakers in the House of Commons on Tuesday for the first time since becoming leader six weeks earlier, vowing to \"unlock a feeling of positivity and possibility in every postcode\" in a marked contrast to predecessor Keir Starmer's downbeat tone. Starmer, pushed out by Labour two years after his 2024 landslide, quit his seat to focus on international affairs. Burnham, former Greater Manchester mayor, blamed \"wrong turns\" since the 1980s, backed greater public control of water, energy and transport, and defended a Manchester \"No 10 North\" office criticised as a gimmick. He faces funding a defence rise to Nato's 3.5 per cent of GDP target by 2035, a North Sea oil-and-gas decision, and continued support for Ukraine.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20SCMP/UK's%20Burnham%20pledges%20to%20restore%20hope%20as%20he%20makes%20House%20of%20Commons%20debut%20as%20PM.pdf"},{"id":"scmp-21","title":"UK-Philippines troop deal to boost Nato's South China Sea reach","source":"SCMP","date":"2 Sep 2026","tags":["Defence","Geopolitics","Southeast Asia"],"summary":"A proposed visiting forces agreement between the Philippines and Britain would let troops train and operate temporarily on each other's soil, deepening Manila's ties with Nato members and reducing reliance on the US. Defence officials met in Manila last Thursday for the first formal negotiations. If finalised, Britain would become the fourth Nato member with such a Philippine pact, after the US, France and Canada, alongside deals with Japan, Australia and New Zealand. The move comes amid intensifying China-Philippines South China Sea tensions, including July clashes near Scarborough and Second Thomas shoals. Analysts said Britain offers naval strengths and could join Balikatan exercises, while the deal signals support for Manila's maritime position and Nato's growing, if cautious, Indo-Pacific engagement.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20SCMP/UK-Philippines%20troop%20deal%20to%20boost%20Nato's%20South%20China%20Sea%20reach.pdf"},{"id":"scmp-22","title":"What's next after China court freezes US$318m in Nexperia assets amid Wingtech battle?","source":"SCMP","date":"2 Sep 2026","tags":["Technology & AI","Finance & Markets","Geopolitics"],"summary":"A Dongguan court froze 2.14 billion yuan (US$318 million) in Nexperia-affiliated assets, cementing the operational split between the chipmaker's Chinese manufacturing engine and its European headquarters. Wingtech, Nexperia's Shanghai-listed Chinese owner, disclosed the freeze on equity in four Dutch-owned subsidiaries plus an Itec BV entity; the order lasts three years, until August 2029. It follows Wingtech's May lawsuit under China's anti-foreign-sanctions law seeking control and 8 billion yuan compensation. The saga began last September when the Dutch government intervened and a court later ousted founder Zhang Xuezheng as CEO. Nexperia's China team, about 70 per cent of global output, has been cut off from German and British wafer supply since October and is shifting to a domestic supplier. Wingtech reported heavy losses and faces delisting risk.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20SCMP/What's%20next%20after%20China%20court%20freezes%20US318m%20in%20Nexperia%20assets%20amid%20Wingtech%20battle.pdf"},{"id":"scmp-23","title":"Why US sanctions threats against China aren't credible","source":"SCMP","date":"2 Sep 2026","tags":["Finance & Markets","Geopolitics"],"summary":"This opinion piece argues US threats to sanction China over its ties with Iran are not credible, because America's AI-inflated stock market and fragile bond market make it more vulnerable to a shock than resilient China. Kicking Chinese institutions off SWIFT would merely accelerate the yuan's rise, since partners can switch to China's CIPS, with about 30 per cent of China's trade already settled in yuan in 2025. It notes US stock capitalisation at 240 per cent of GDP, over US$40 trillion in public debt and US$9 trillion of bonds needing refinancing. Sanctioning CIPS users would shut global supply chains centred on China. The author expects the US to \"blink first\", predicting China will inflict measured pain as deterrence without derailing the global economy.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20SCMP/Why%20US%20sanctions%20threats%20against%20China%20aren't%20credible.pdf"},{"id":"scmp-24","title":"Xi Jinping calls on SCO members to team up for bigger global tech-security role","source":"SCMP","date":"2 Sep 2026","tags":["Geopolitics","Politics"],"summary":"President Xi Jinping urged the Shanghai Cooperation Organisation to take a bigger global role in technology and security at its Bishkek summit, describing the 25-year-old Eurasian bloc as having vast potential and, in a veiled swipe at Washington, praising coexistence \"without alliance, confrontation or targeting any third party\". Xi called for prioritising security, deepening trade, AI and digital-economy cooperation, a China-SCO Port Economic Cooperation Centre in Tianjin, and 100 tech projects with members over three years. He pushed for political solutions in Ukraine and the Middle East and more representation for developing countries. Attendees included Putin, Modi and Iran's Pezeshkian, marking the first joint appearance of China, Iran and Russia since US-Israeli strikes on Tehran, and days after US attacks on Iran resumed.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20SCMP/Xi%20Jinping%20calls%20on%20SCO%20members%20to%20team%20up%20for%20bigger%20global%20tech-security%20role.pdf"}]},"2026-09-03":{"date":"2026-09-03","dayOfWeek":"Thursday","totalArticles":92,"sourceCounts":{"WSJ":22,"ST":24,"BT":22,"SCMP":24},"executiveDigest":"The global bond rout ran to multi-decade-high yields as oil-fuelled inflation fears and G-20 discord strained markets - the US dollar hit a seven-week high and gold a three-week low, while WSJ said 'G-20 squabbling overshadowed the summit'. Iran kept the pressure on: the US and Iran 'traded strikes for control of Hormuz', oil settled 1% higher, and Trump floated renaming the strait 'Trump Strait' even as his aides pushed to keep the war 'quiet' before the midterms. For Singapore, the picture brightened - economists lifted the 2026 growth forecast to 5% on the AI boom (MAS survey), factory activity expanded, and Keppel DC REIT upsized a placement to S$625 million - though DBS steered clients toward S-Reits over bank dividends amid the rate backdrop.","briefingCards":[{"title":"Lead story - Bond rout hits multi-decade-high yields","body":"The selloff intensified into the G-20: BT reported 'the global bond rout deepens as oil-fuelled inflation fears drive yields to multi-decade highs', WSJ said 'G-20 squabbling overshadowed the summit as global bond markets strain', and 'nothing this week suggested an end to the deficits, inflation and geopolitical disruptions roiling investors'. The dollar hit a seven-week high, gold a three-week low, and European shares fell - while ST explained 'how Japan's bond rout is turning the tide of global capital' as its yield climbed and the BOJ signalled a possible September hike (the yen surged on intervention alert). The Bank of Canada held 'as inflation worries intensified', the US House passed a bill 'to avert a shutdown', and the UK PM pledged to be 'grounded in fiscal responsibility'."},{"title":"Markets & finance","body":"Rates and safe havens dominated: gold slid 'as Middle East tensions fanned rate-hike fears', the dollar rose to multi-week highs, and US private payroll growth 'slowed in August' even as factory orders beat. G-20 finance chiefs 'backed action against trade-distorting policies' (China 'held out'), and SCMP reported 'the Dutch shifting 86 tonnes of gold from the US and Canada to the UK over geopolitical unrest'. Corporate results leaned AI: Broadcom's profit 'soared on custom-chip demand', HPE lifted its outlook, and Microsoft 'revealed Azure cloud sales in a reporting shift'. Big future numbers landed too - PwC projected 'global data-centre spending reaching US$31.6 trillion by 2050' - while Goldman, BofA and others 'plan to issue a joint dollar stablecoin in 2027'."},{"title":"Asia realignment","body":"'Xiplomacy' accelerated - BT said Xi 'began his busiest travel month since 2019' ahead of Trump talks, bolstering Mideast ties on an Egypt visit (with China-Egypt joint drills) and using an SCO summit to project reach: SCMP reported 'the SCO took a landmark stand on nuclear security as Iran came under renewed attack', 'Iran won SCO backing against US strikes', and analysts weighed 'how the SCO chips away at US power'. A trilateral 'Xi-Trump-Putin at APEC' is floated. Trade friction hardened: 'EU enforcers descended on Beijing demanding it fix untenable imbalances', the US 'said it's fed up with China's overcapacity - and more countries agree', and China opened up - 'handing out nearly US$7 billion in QDII quotas' and prepping the 'US$10.8 billion Pinglu Canal' to supercharge ASEAN shipments."},{"title":"Energy & climate","body":"Iran stayed the swing factor: the US and Iran 'traded strikes for control of Hormuz', oil 'settled 1% higher' as US crude stockpiles fell more than expected, and Trump 'floated renaming the strait Trump Strait' while pressing 'squeezed US refiners to ease pump prices' and wanting 'Big Oil to build more refineries (a tough sell)'. Supply reshuffled - Chevron will 'invest US$7 billion in Venezuela, doubling production', Iraq's exports rose to ~2.34 million bpd - and a Saudi nuclear agreement 'could open a path to 20% enrichment'. Closer to home, ST reported 'if Singapore decides on nuclear power, major grid changes may not be required', a 2015-style haze is 'unlikely due to a later El Nino onset', and MPs will 'push for food resilience as climate and geopolitical crises lift prices'."},{"title":"Technology & AI","body":"AI capex and IP policy advanced together: HPE and Broadcom results underscored demand, PwC pegged data-centre spending at US$31.6 trillion by 2050, and 'tech CEOs and the Trump administration asked the G-20 to adopt pro-AI policies' - with the US 'backing OpenAI in a copyright fight with publishers' and urging that 'AI be allowed to train on creators' work'. Google 'avoided a breakup of its ad business'. China's self-reliance surged: 'AMEC unveiled six chip-making machines in a day', 'Hua Hong is investing US$2 billion in a new fab', its 'tech push fuelled the fastest profit growth in four years', and Beijing 'cracked down on AI slop'. SCMP assessed what 'Anthropic's Fable 5.1 means for the US-China model race', and Tencent's Hy4 gained in open-source rankings."},{"title":"Singapore & SEA focus","body":"Singapore's outlook brightened: 'economists raised the 2026 growth forecast to 5% on the AI boom' (MAS survey), 'factory activity expanded in August' despite an Iran-war supply-chain crunch, and analysts said 'falling AI token costs could fuel the next leg of the Singapore semiconductor rally'. Capital kept moving - 'Keppel DC REIT upsized a private placement to S$625 million on strong demand' - though 'DBS analysts bet on S-Reits over bank dividends' amid the rate backdrop, and observers said a 'heavy EV incentive cut could ease COE premiums'. Regionally, Singapore and Indonesia 'pushed ahead with an AI trade platform (eyeing a 2027 Jakarta forum)', Singapore and Thailand will 'develop a multi-year agenda for successive ASEAN chairmanships', and SCMP asked whether Singapore can be 'the natural choice to bridge ASEAN and Central Asia'."}],"keyMetrics":[{"value":"92","label":"Articles curated today","sub":"WSJ 22 · ST 24 · BT 22 · SCMP 24"},{"value":"Multi-decade","label":"Bond yields surge","sub":"Dollar 7-wk high; gold 3-wk low"},{"value":"5%","label":"SG 2026 growth forecast","sub":"Raised on AI boom (MAS survey)"},{"value":"'Trump Strait'","label":"US-Iran trade strikes","sub":"Oil settles 1% higher"},{"value":"S$625m","label":"Keppel DC REIT placement","sub":"Upsized on 'strong demand'"},{"value":"US$31.6t","label":"Data-centre spend by 2050","sub":"PwC on the AI boom"}],"articles":[{"id":"wsj-01","title":"A jittery Treasury market and the prospect of Fed rate increases risk making life more expensive for already cost-pressured Americans","source":"WSJ","date":"3 Sep 2026","tags":["Finance & Markets","Society"],"summary":"Worries over a protracted Iran conflict, swelling fiscal deficits and possible rate hikes are rattling global bond markets, with effects rippling far beyond Treasurys. Rising yields lift borrowing costs on mortgages, auto loans and corporate bonds, deepening housing-affordability strains as 30-year mortgage rates near 7%. Regular gasoline averages about $4.10 a gallon versus $3.19 a year ago. With inflation at 3.7% in July, futures imply roughly 70% odds of a September quarter-point hike and about 90% for at least one increase by year-end. Fed Chairman Kevin Warsh signaled more work ahead. Higher rates threaten the AI-fueled S&P 500 rally, up nearly 20%, which has propped up consumer spending and record data-center construction.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/A%20jittery%20Treasury%20market%20and%20the%20prospect%20of%20Fed%20rate%20increases%20risk%20making%20life%20more%20exp.pdf"},{"id":"wsj-02","title":"Apple to Give New CEO $3 Million Salary","source":"WSJ","date":"3 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Apple plans to pay new Chief Executive John Ternus an annual salary of $3 million plus a targeted annual stock award of $55 million for fiscal 2027, according to an SEC filing. Ternus's salary rose effective Tuesday, the day he officially took the helm of the iPhone maker. Of the targeted equity award, 75% will be granted in performance-based restricted stock units vesting on Apple's total shareholder return relative to other S&P 500 companies; the rest are time-based RSUs vesting semiannually over four years. Ternus will also get a prorated RSU award targeted at $2.5 million for his time as CEO in fiscal 2026. Apple will pay former CEO Tim Cook a $2 million salary, effective Sept. 26, and a $45 million targeted equity award.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/Apple%20to%20Give%20New%20CEO%203%20Million%20Salary.pdf"},{"id":"wsj-03","title":"Australia's Second-Quarter Growth Stronger Than Expected","source":"WSJ","date":"3 Sep 2026","tags":["Finance & Markets"],"summary":"Australia's economy grew 0.4% in the second quarter and 2.1% from a year earlier, beating market expectations of around 1.8% annual growth, the Australian Bureau of Statistics said. The result strengthens the case for the Reserve Bank of Australia to raise rates further amid sticky inflation, with some economists expecting a fourth increase this year this month. Households stayed cautious: consumption rose 0.4%, with fuel use falling on elevated prices and reduced travel tied to the Middle East conflict, while vehicle purchases jumped 10.3% as EV adoption continued. Private business investment fell 0.5%, dragged by weaker data-center spending. Weak growth alongside high inflation reflects poor productivity. Rising rates and higher property taxes have driven house prices down sharply over five months.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/Australia's%20Second-Quarter%20Growth%20Stronger%20Than%20Expected.pdf"},{"id":"wsj-04","title":"Bank of Canada Keeps Rate Steady as Inflation Worries Intensify","source":"WSJ","date":"3 Sep 2026","tags":["Finance & Markets","Trade"],"summary":"The Bank of Canada left its main interest rate unchanged at 2.25% for a seventh straight decision but adopted a more alarmed tone on inflation risks amid new cross-border tariffs and no end to the Middle East war. Governor Tiff Macklem said inflation, around 3%, remains too high and could rise as crude prices stay elevated, warning the bank is prepared to raise rates more than once if needed. The hawkish stance surprised economists, all of whom had expected the pause to emphasize growth risks from U.S.-Canada trade friction. The Canadian dollar strengthened and two-year yields climbed above 3.1%. Second-quarter growth reached 3.3% annualized, beating forecasts. New U.S. tariffs of 50% on certain goods, plus retaliation, pose fresh risks.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/Bank%20of%20Canada%20Keeps%20Rate%20Steady%20as%20Inflation%20Worries%20Intensify.pdf"},{"id":"wsj-05","title":"Broadcom Third-Quarter Profit Soars on Growing Custom Chip Demand","source":"WSJ","date":"3 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Broadcom more than tripled profit and nearly doubled revenue in its third quarter, driven by demand for custom AI chips it designs for labs such as OpenAI, Anthropic and Google. CEO Hock Tan said compute needs will \"inflect even more in 2027 and 2028.\" Custom chips made up 73% of the quarter's $16.7 billion in AI semiconductor revenue, expected to reach $21.7 billion next quarter. Broadcom has secured supply to double AI chip revenue to $115 billion in fiscal 2027, with a path to $230 billion in 2028. Profit was $13.09 billion, or $2.68 a share; adjusted earnings of $3.32 beat the $3.22 estimate. Revenue rose to $29.59 billion. Shares were roughly flat after-hours amid a memory-chip bottleneck.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/Broadcom%20Third-Quarter%20Profit%20Soars%20on%20Growing%20Custom%20Chip%20Demand.pdf"},{"id":"wsj-06","title":"Chevron to Invest $7 Billion in Venezuela, Doubling Production","source":"WSJ","date":"3 Sep 2026","tags":["Energy","Geopolitics"],"summary":"Chevron, Italy's ENI and other energy firms signed deals in Caracas to pour billions into Venezuela's oil fields, the first big win for the Trump administration's push to revitalize the industry since it ousted Nicolas Maduro in January. Chevron will invest more than $7 billion over five years, doubling its output to 600,000 barrels a day and adding two heavy-oil fields to its Petroindependencia joint venture with PdVSA, at costs near $20 a barrel. Energy Secretary Chris Wright touted working at \"Trump speed.\" CEO Mike Wirth said new contract terms make investment more economic. The deals are separate from Trump's move to take a 35% stake in North American Blue Energy Partners. ExxonMobil and ConocoPhillips stayed on the sidelines, still seeking restitution over 2007 nationalizations.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/Chevron%20to%20Invest%207%20Billion%20in%20Venezuela,%20Doubling%20Production.pdf"},{"id":"wsj-07","title":"China's Xi Bolsters Mideast Ties With Egypt Visit Ahead of Planned U.S. Trip","source":"WSJ","date":"3 Sep 2026","tags":["Geopolitics","Politics"],"summary":"Chinese leader Xi Jinping opened a state visit to Egypt aimed at reinforcing Beijing's ties with a key U.S. partner, part of a diplomatic offensive before an expected Washington trip. Xi told President Abdel Fattah Al Sisi that China backs a new regional security architecture and opposes interference by \"external forces,\" clear swipes at the U.S. six months after its attacks on Iran. With Strait of Hormuz shipping disrupted, Xi offered to help \"safeguard the security of international shipping lanes.\" Analysts said the timing signals China has many friends as the U.S. alienates allies. Trump said he invited Xi to visit Sept. 24, unconfirmed by Beijing. The trip follows Xi's Shanghai Cooperation Organization speech in Bishkek attacking \"hegemonism\" and protectionism.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/China's%20Xi%20Bolsters%20Mideast%20Ties%20With%20Egypt%20Visit%20Ahead%20of%20Planned%20U.S.%20Trip.pdf"},{"id":"wsj-08","title":"Defunding the U.S. Military","source":"WSJ","date":"3 Sep 2026","tags":["Defence","Politics"],"summary":"The Journal's editorial board argues U.S. military readiness is deteriorating in the Middle East while Washington fails to fund it. The Navy's top officer says the fleet is $6 billion to $8 billion short of what it needs this fiscal year owing to the Iran conflict. The administration sought $67 billion in supplemental Pentagon funding, but Democrats are blocking it, while the proposed $1.5 trillion defense budget relies on Republicans passing $350 billion through reconciliation. Planners warn U.S. forces lack air cover for a long war with China or Russia after firing half its Patriot interceptors within weeks in Iran. The Pentagon wants 3,200 advanced Patriots; about 2,900 sit in a stalled reconciliation bill. Golden Dome funding is also at risk.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/Defunding%20the%20U.S.%20Military.pdf"},{"id":"wsj-09","title":"G-20 Squabbling Overshadows Summit as Global Bond Markets Strain","source":"WSJ","date":"3 Sep 2026","tags":["Finance & Markets","Geopolitics","Trade"],"summary":"The G-20 finance ministers' gathering in Asheville, N.C., closed amid a global bond selloff, tariff spats, public insults and a fight over a group photo. As the summit ended, the 10-year Treasury yield rose to 4.795%, the highest of Trump's second term, with the U.S. carrying $40 trillion in government debt. Treasury Secretary Scott Bessent argued growth can outrun debt, but China's objection blocked a consensus statement. Bessent mocked Canada's military and Trump renamed Lake Ontario; Europeans bristled at Russia's finance minister being invited, excluding him from the family photo. Bessent said China agrees Iran cannot have a nuclear weapon and backs Hormuz navigation. He likened Iran to a decapitated snake. Warsh weighs a rate hike; the July labor market lost 23,000 jobs.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/G-20%20Squabbling%20Overshadows%20Summit%20as%20Global%20Bond%20Markets%20Strain.pdf"},{"id":"wsj-10","title":"Google Avoids Breakup of Dominant Ad Business","source":"WSJ","date":"3 Sep 2026","tags":["Technology & AI","Politics"],"summary":"A federal judge rejected the Justice Department's request to dismantle Google's online advertising business, the second time a court denied government efforts to break up the company after it was found liable for illegal monopoly tactics. U.S. District Judge Leonie Brinkema in Alexandria, Va., adopted more restrained remedies curbing Google's control over how publishers use its ad technology instead of forcing a sale of its ad exchange. The ruling effectively closes nearly two decades of U.S. antitrust risk for Alphabet's Google and deals another blow to the antimonopoly movement. It follows setbacks in the Google search case and Meta's FTC breakup case. Brinkema had earlier found Google charged a 20% fee that reduced publisher earnings. Google made $7.3 billion from network ads last quarter.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/Google%20Avoids%20Breakup%20of%20Dominant%20Ad%20Business.pdf"},{"id":"wsj-11","title":"HPE Boosts Outlook as AI Demand Drives Surge in Third-Quarter Profit","source":"WSJ","date":"3 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Hewlett Packard Enterprise lifted long-term growth targets after gains across both segments drove a more than fivefold profit increase in its third quarter, powered by broad AI adoption. Profit reached $1.54 billion, or $1.06 a share, versus $305 million a year earlier; adjusted earnings of $1.11 beat the 93-cent estimate. Revenue rose to $12.21 billion. CFO Marie Myers cited exceptional demand and flagged two pending multibillion-dollar deals. HPE now expects fiscal-year revenue growth of 34% to 37%, up from 29% to 33%, and adjusted EPS of $3.75 to $3.85. Cloud & AI revenue rose 25% to $9.04 billion, with server revenue up 35%. Networking revenue surged 75% to $2.89 billion following the Juniper acquisition. Fourth-quarter revenue is guided to $13.9 billion-$14.8 billion.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/HPE%20Boosts%20Outlook%20as%20AI%20Demand%20Drives%20Surge%20in%20Third-Quarter%20Profit.pdf"},{"id":"wsj-12","title":"Iran Regime Change Returns—Again","source":"WSJ","date":"3 Sep 2026","tags":["Geopolitics","Politics"],"summary":"In this opinion column, Barton Swaim argues the Trump administration again sees Iranian regime collapse as plausible. Treasury Secretary Scott Bessent said Iran's collapse could come \"within weeks or months\" given a shrinking economy, worthless currency and humiliated military. A port blockade has caused severe fuel shortages, echoing conditions before nationwide protests seven years ago. Swaim writes the regime must fall for Trump to call the war a success, and notes Trump has refused an easy exit despite unpopularity and reported weapons shortages. He cites Iran-linked assassination attempts on Trump and state media offering $10 million for his son Barron's life. Swaim urges Reaganesque rhetoric aimed at Iran's downtrodden, arguing words slip across borders despite censorship, invoking Trump's \"hour of your freedom\" address.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/Iran%20Regime%20Change%20Returns-Again.pdf"},{"id":"wsj-13","title":"Nothing in this week's G-20 suggested an end to the deficits, inflation and geopolitical disruptions that are roiling investors","source":"WSJ","date":"3 Sep 2026","tags":["Finance & Markets","Geopolitics"],"summary":"Greg Ip argues the G-20 summit gave bond investors no relief from out-of-control deficits, stubborn inflation and geopolitical disruption. U.S. 10-year yields hit 4.8%, the highest of Trump's presidency, but yields rose more in Japan, where the 10-year reached 3% for the first time in 30 years, and across Europe; France's is 4.21%, Britain's 5.15%. Bessent's claim that the U.S. can \"grow our way out\" of debt is not credible, Ip writes: growth hasn't rescued finances, an AI boom alone won't stabilize debt, and faster growth lifts rates. U.S. debt recently hit $40 trillion. Barclays' Ajay Rajadhyaksha says markets expect higher sustained short rates and warns a fiscal risk premium may eventually emerge, making bond markets harder for G-20 leaders to ignore.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/Nothing%20in%20this%20week's%20G-20%20suggested%20an%20end%20to%20the%20deficits,%20inflation%20and%20geopolitical%20d.pdf"},{"id":"wsj-14","title":"Russia Is Testing NATO's Ability to Hold Back From a Hot War","source":"WSJ","date":"3 Sep 2026","tags":["Defence","Geopolitics"],"summary":"Russia's growing string of small-scale attacks in Europe poses a dilemma for leaders wary of stumbling into a shooting war. NATO Secretary-General Mark Rutte said Russia has grown \"increasingly reckless,\" citing arson at arms factories and a failed Leipzig drone attack targeting a Ukrainian cargo plane. Germany said Russia crossed a line but kept its response measured, pledging fresh air-defense batteries and thousands of strike drones for Ukraine. Europeans favor pressuring Putin by boosting support for Kyiv, which is striking deep inside Russia and crippling resupply to Crimea. Critics like Nico Lange urge blocking Russia's \"shadow fleet\" and restricting diplomats. European officials attributed 20 recent sabotage incidents to Russia. Von der Leyen vowed to increase pressure and advance a new loan for air defenses within a EUR 90 billion package.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/Russia%20Is%20Testing%20NATO's%20Ability%20to%20Hold%20Back%20From%20a%20Hot%20War.pdf"},{"id":"wsj-16","title":"Tech CEOs, Trump Administration Ask G-20 to Adopt Pro-AI Policies","source":"WSJ","date":"3 Sep 2026","tags":["Technology & AI","Politics"],"summary":"Tech executives and Trump officials urged G-20 policymakers to minimize AI regulation, arguing strict rules could strangle an industry capable of supercharging growth and curing diseases. Nvidia's Jensen Huang, OpenAI's Sam Altman, Meta's Mark Zuckerberg and Elon Musk spoke at an innovation summit near Chapel Hill, N.C. Huang said, \"Don't regulate hypothetical, theoretical harm.\" Commerce Secretary Howard Lutnick and AI adviser David Sacks touted the light-touch strategy. The talks followed AI-model hacks and Bernie Sanders's call for a development pause; protesters decried data-center build-out amid a local moratorium. Musk said AI could grow the global economy 20% to 30%. The U.S. urged countries to avoid cheaper Chinese models; China signed broad innovation principles. Altman and Demis Hassabis noted the need for some global standards.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/Tech%20CEOs,%20Trump%20Administration%20Ask%20G-20%20to%20Adopt%20Pro-AI%20Policies.pdf"},{"id":"wsj-17","title":"The Navy's Overstretched Carrier Fleet","source":"WSJ","date":"3 Sep 2026","tags":["Defence","Politics"],"summary":"This editorial warns the U.S. Navy is dangerously short on combat power as heavy demands and a shrinking carrier fleet produce longer deployments that wear out crews and ships. The USS Abraham Lincoln spent more than 200 consecutive days at sea; the Gerald Ford returned after 326 days. A retention crisis looms among midcareer fighter pilots: the Navy needed 52 department heads in 2025 but only 31 accepted orders. Accident reports cite high operational tempo, chronic manning shortfalls and fatigue. As the Nimitz floats past its planned retirement, the fleet risks dropping below Congress's 11-carrier floor. The board argues new technology cannot compensate for deficits facing a possible protracted war with China, urging Trump to sustain his $1.5 trillion defense budget as the U.S. spends only 3% of GDP.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/The%20Navy's%20Overstretched%20Carrier%20Fleet.pdf"},{"id":"wsj-18","title":"Trump Wants Big Oil to Build More Refineries. That's a Tough Sell.","source":"WSJ","date":"3 Sep 2026","tags":["Energy","Politics"],"summary":"President Trump urged oil executives at the White House to build more refineries to lower gasoline prices before the November midterms, but the industry is unwilling. Owning a refinery is highly profitable now, with U.S. plants running above 97% of capacity and diesel crack spreads topping $100 a barrel, lifting the top six refiners' fuel-making profit to a combined $24.7 billion in the second quarter. But companies expect the war-driven boom to fade and won't spend billions on plants taking three to five years to build. Americans paid about $4.10 a gallon Tuesday, up from $2.98 before the Iran conflict. ExxonMobil skipped the meeting. The U.S. has 128 fewer refineries than in 1982; firms instead upgrade existing plants and shift toward diesel and petrochemicals as EVs erode gasoline demand.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/Trump%20Wants%20Big%20Oil%20to%20Build%20More%20Refineries.%20That's%20a%20Tough%20Sell..pdf"},{"id":"wsj-19","title":"U.S. Crude Oil Stockpiles See Larger-Than-Expected Drop","source":"WSJ","date":"3 Sep 2026","tags":["Energy","Finance & Markets"],"summary":"U.S. commercial crude oil inventories fell more than expected last week as refineries ran near full capacity, the Energy Information Administration said. Stocks excluding the Strategic Petroleum Reserve dropped 4.5 million barrels to 424.5 million, about 1% above the five-year average; analysts had expected only a 300,000-barrel decline. SPR oil fell 3.1 million barrels to 286.6 million. Crude production rose 19,000 barrels a day to 13.86 million, while imports climbed to 6.8 million and exports to 4.5 million barrels a day. Refinery capacity use rose to 98% from 97.4%. Gasoline inventories fell 1.2 million barrels to 205.7 million, 6% below the five-year average, with demand down 121,000 barrels a day. Distillate stocks rose 796,000 barrels but stayed 14% below average.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/U.S.%20Crude%20Oil%20Stockpiles%20See%20Larger-Than-Expected%20Drop.pdf"},{"id":"wsj-20","title":"U.S. Government Backs OpenAI in Copyright Fight With Publishers","source":"WSJ","date":"3 Sep 2026","tags":["Technology & AI","Politics"],"summary":"The U.S. government filed a statement supporting OpenAI in its legal battle with the New York Times and other publishers, arguing that training AI on news content falls within \"fair use\" under copyright law. A Justice Department letter said making it harder for large language models to train on copyrighted material would be inconsistent with copyright principles and thwart progress, calling such training \"exceedingly transformative.\" The Times, which sued Microsoft and OpenAI in December 2023, said the administration is siding with trillion-dollar AI companies at the expense of creators whose work was stolen. News Corp, the Journal's owner, has a licensing partnership with OpenAI. The filing reflects the administration's light-touch AI stance and argument that restrictive rules would benefit foreign adversaries in the race against China.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/U.S.%20Government%20Backs%20OpenAI%20in%20Copyright%20Fight%20With%20Publishers.pdf"},{"id":"wsj-21","title":"U.S. Says It's Fed Up With China's Overcapacity—and More Countries Agree","source":"WSJ","date":"3 Sep 2026","tags":["Trade","Geopolitics"],"summary":"A Group of 20 statement implicitly criticizing Beijing for overreliance on exports marks a new stage in international pressure on China's manufacturing juggernaut. Issued Tuesday at the Asheville, N.C., finance ministers' meeting, it said countries with \"excessive and persistent external surpluses\" should end policies causing harmful spillovers. China, which ran a $1.2 trillion trade surplus last year, was the sole dissenter, noted in a footnote. Analysts called the consensus unusual, driven by fears across Europe and Asia that industries in autos, electronics and machinery cannot survive China's export push. Japan's finance minister said feelings have \"crossed a threshold.\" A French report dubbed China \"The Chinese Steamroller.\" Still, analysts doubt swift coordinated action, citing fears of Chinese retaliation such as rare-earth curbs and an unpredictable U.S.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/U.S.%20Says%20It's%20Fed%20Up%20With%20China's%20Overcapacity-and%20More%20Countries%20Agree.pdf"},{"id":"wsj-22","title":"U.S. and Iran Trade Strikes in Latest Fight for Control of Hormuz","source":"WSJ","date":"3 Sep 2026","tags":["Geopolitics","Defence","Energy"],"summary":"The U.S. and Iran exchanged fire Tuesday as they battled for control of the Strait of Hormuz. Trump said U.S. strikes retaliated for Iran's attempt to mine the strait and target American servicemembers. Iran fired missiles and drones across the Persian Gulf; Jordan reported engaging 13 ballistic missiles, and Kuwait and Bahrain took hostile fire. U.S. forces struck Iranian air-defense sites, radar and mine-laying capabilities. Trump threatened harder strikes, warning \"there will be very little left of the Islamic Republic of Iran!\" More than 50,000 American servicemembers remain in the region enforcing a port blockade. Two tankers carrying Saudi oil were hit near Oman while crossing the strait. Brent crude rose 4.4% to $94.47. Officials fear the protracted conflict undermines U.S. deterrence of China and Russia.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/U.S.%20and%20Iran%20Trade%20Strikes%20in%20Latest%20Fight%20for%20Control%20of%20Hormuz.pdf"},{"id":"wsj-23","title":"UK Prime Minister Says Government Will Be 'Grounded in Fiscal Responsibility'","source":"WSJ","date":"3 Sep 2026","tags":["Finance & Markets","Politics"],"summary":"U.K. Prime Minister Andy Burnham told lawmakers the government is acting to cut debt and will stick to its self-imposed budget rules, seeking to reassure investors amid a worldwide bond selloff. U.K. government bond yields have risen sharply, partly reflecting inflation worries as the Middle East conflict continues to block Strait of Hormuz energy shipments. \"We are taking the action needed to get debt down,\" Burnham said, pledging a government \"grounded in fiscal responsibility.\" Burnham took office in July, inheriting a sluggish economy and debt near 94% of output. Investors fear he will raise spending without matching tax revenue, with a new budget due Oct. 28. He said the U.K. is cutting its deficit faster than any other G7 country, though economists estimate it near 4% of GDP.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/UK%20Prime%20Minister%20Says%20Government%20Will%20Be%20'Grounded%20in%20Fiscal%20Responsibility'.pdf"},{"id":"st-01","title":"Australia, US commit $739 million to support Pacific Island nations","source":"ST","date":"3 Sep 2026","tags":["Geopolitics","Southeast Asia"],"summary":"Australia and the United States on Sept 2 announced a combined US$580 million (S$739 million) in funding for Pacific Island nations as they contest China's rising regional influence. The US contribution of US$150 million, including US$60 million for fuel storage and grid stability amid the energy crisis, is among the clearest signals the Trump administration remains engaged in the Pacific after dismantling USAID in 2025. Deputy Secretary of State Christopher Landau unveiled it at the Pacific Islands Forum in Palau. Australia pledged A$600 million (S$545 million) to combat drug smuggling via aerial surveillance and police training. The forum, running to Sept 4, has been dominated by a spat over Taiwan's participation, which Beijing opposes.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/Australia,%20US%20commit%20739%20million%20to%20support%20Pacific%20Island%20nations.pdf"},{"id":"st-02","title":"BOJ chief signals chance of September rate hike, debate on price risks","source":"ST","date":"3 Sep 2026","tags":["Finance & Markets","Politics"],"summary":"Bank of Japan governor Kazuo Ueda said on Sept 1 the central bank will debate raising interest rates in September, focusing on whether inflationary risks are heightening, signalling a strong chance of a hike. His remarks followed a US Treasury statement that Secretary Scott Bessent had urged \"decisive\" steps to combat the weak yen. The BOJ has already raised rates five times, reaching a 31-year high of 1 per cent in June. Hawkish board member Hajime Takata urged nimble hikes. Two-year JGB yields hit 1.830 per cent, the highest since 1995, and the 10-year yield reached 3 per cent for the first time since 1996. Key risks cited include the Middle East conflict, AI-related demand and yen weakness. Markets near fully price a September hike ahead of the Sept 17-18 meeting.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/BOJ%20chief%20signals%20chance%20of%20September%20rate%20hike,%20debate%20on%20price%20risks.pdf"},{"id":"st-03","title":"China's Xi urges new Middle East security framework during Egypt visit","source":"ST","date":"3 Sep 2026","tags":["Geopolitics","Trade"],"summary":"Chinese President Xi Jinping, visiting Egypt on Sept 2, urged Middle East nations to oppose external interference and consider a new regional security architecture, as Beijing seeks influence amid the US war against Iran. It was Xi's first regional trip in four years, coming as US partners reassess strategic ties after conflict disrupted trade and shipping through the Strait of Hormuz and Bab al-Mandeb. Welcomed by President Abdel Fattah al-Sisi, Xi pledged cooperation on safeguarding shipping routes, data centres, semiconductors and critical metals, plus greater use of both currencies. Egypt, which receives US$1.3 billion in annual US military aid, pursues \"strategic balance.\" China imported US$10 billion of Egyptian-bound goods in early 2026; the Suez Canal zone has drawn US$4 billion in Chinese investment.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/China's%20Xi%20urges%20new%20Middle%20East%20security%20framework%20during%20Egypt%20visit.pdf"},{"id":"st-04","title":"EU summons Russia envoys, eyes sanctions after Germany drone 'attack'","source":"ST","date":"3 Sep 2026","tags":["Geopolitics","Defence"],"summary":"EU countries on Sept 2 summoned Russian envoys and discussed fresh sanctions after an explosive-laden drone incident at Leipzig airport that foreign policy chief Kaja Kallas said bore the hallmarks of \"state-sponsored terrorism.\" The EU and NATO frame it as part of a Russian sabotage campaign to destabilise Ukraine's backers. Ministers agreed to keep working on sanctions targeting 1,600 individuals and entities tied to Russia's military industry, aiming to adopt them in October. Germany blamed Moscow, shut a Russian consulate and identified two suspects. Ursula von der Leyen called it \"a new escalation\" using military-grade material by Russian operatives on EU soil. Discussion resurfaced on tapping some 200 billion euros of frozen Russian central bank assets to fund Ukraine.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/EU%20summons%20Russia%20envoys,%20eyes%20sanctions%20after%20Germany%20drone%20'attack'.pdf"},{"id":"st-05","title":"Economists raise Singapore's 2026 growth forecast to 5% on AI boom: MAS survey","source":"ST","date":"3 Sep 2026","tags":["Finance & Markets","Technology & AI"],"summary":"Private-sector economists lifted their 2026 growth forecast for Singapore to 5 per cent, up from 3.5 per cent, after a surge in exports and manufacturing output, according to the MAS quarterly survey released Sept 2. It follows MTI's Aug 11 upgrade of its GDP forecast to 4.5-5.5 per cent and Enterprise Singapore's raised NODX forecast of 14-16 per cent. The economy grew 5.9 per cent year on year in Q2, after 6.3 per cent in Q1. Manufacturing forecasts jumped to 8.4 per cent amid AI-related demand for semiconductors. All respondents cited a sustained AI-driven tech upturn as key support, while flagging risks from Iran war escalation and a possible AI bubble burst. Some 45 per cent expect MAS to tighten in October.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/Economists%20raise%20Singapore's%202026%20growth%20forecast%20to%205%20on%20AI%20boom%20MAS%20survey.pdf"},{"id":"st-06","title":"Gold hits over 3-week low as Middle East tensions fan rate-hike fears","source":"ST","date":"3 Sep 2026","tags":["Finance & Markets","Energy"],"summary":"Gold fell on Sept 2 to its lowest in over three weeks as the escalating Middle East conflict lifted oil prices and stoked inflation and rate-hike fears, while investors awaited US jobs data. Spot gold slipped 0.6 per cent to US$4,302.99 per ounce, its lowest since Aug 7, headed for a fourth straight session of losses below its 200-day moving average. The US launched airstrikes against Iran on Sept 1, prompting Iranian retaliation, and oil rose for a third session. Traders priced in a 67 per cent chance of a Fed rate hike in September. Higher rates dull gold's appeal as it yields nothing. Silver, platinum and palladium also fell.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/Gold%20hits%20over%203-week%20low%20as%20Middle%20East%20tensions%20fan%20rate-hike%20fears.pdf"},{"id":"st-07","title":"Goldman Sachs, BofA and others plan to issue dollar stablecoin together in 2027","source":"ST","date":"3 Sep 2026","tags":["Finance & Markets","
