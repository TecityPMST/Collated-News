nth low, according to JLC International. That raises the risk Beijing will curb fuel exports again, as it did early in the US-Iran war. Clean product exports had recovered to 2.55 million tons in July, but Energy Aspects' Jianan Sun sees a growing risk they are capped at about 1.2 million tons a month in Q4. Independent teapot refiners have lost access to Iranian crude because of the US blockade, which is pushing up premiums for African and Latin American oil, and they may have to cut run rates. The piece also notes that the US and China are discussing tariff cuts on American energy and farm goods ahead of next week's summit, a possible sign the one-year trade truce will be extended.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/17%20Sep%202026/17%20Sep%20BT/Shrinking%20China%20fuel%20stockpiles%20raise%20chance%20of%20export%20curbs.pdf"}, {"id": "bt-17sep-16", "title": "Singapore’s covered bond boom is largely a DBS story", "source": "BT", "date": "17 Sep 2026", "tags": ["Southeast Asia", "Finance & Markets"], "summary": "MAS data show Singapore's outstanding covered bonds reached S$29.8 billion in 2025, up from S$17.3 billion in 2021, a 15% compound annual growth rate, and issuance hit a record S$11 billion last year. Most of the growth came from DBS, whose covered bonds more than tripled to about S$18.5 billion from S$5.7 billion. UOB's stayed flat at S$7.8 billion, while OCBC's fell to S$1.5 billion from S$3.5 billion. Covered bonds remain small next to deposits: DBS's S$18.5 billion equals about 3% of its S$610 billion customer deposits. They offer cheaper long-term funding, which matters more when net interest margins are under pressure. Issuance was made easier in 2020, when MAS raised banks' asset encumbrance limit to 10% of total assets from 4%.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/17%20Sep%202026/17%20Sep%20BT/Singapore's%20covered%20bond%20boom%20is%20largely%20a%20DBS%20story.pdf"}, {"id": "bt-17sep-17", "title": "Sydney housing slump creates pandemic-sized hole in state tax take", "source": "BT", "date": "17 Sep 2026", "tags": ["Finance & Markets", "Society"], "summary": "New South Wales collected A$631.1 million (US$449.7 million) in residential stamp duty in August, down 24% year on year and its lowest monthly intake since the pandemic, as sales volumes fell 18%. Receipts peaked at nearly A$1.1 billion late last year, and the state expects a A$5.3 billion hit to stamp duty over four years. Barrenjoey expects home-sale stamp duty to fall 28% this year, about A$2 billion. The RBA has raised rates three times this year to 4.35%, and proposed federal tax changes in May ended discounts for new property investors. National house prices are nearly 4% below their peak, while Sydney and Melbourne are down more than 7%. Markets price an 84% chance of a fourth RBA hike on Sep 28-29, and HSBC forecasts a 13% price fall if rates rise twice more.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/17%20Sep%202026/17%20Sep%20BT/Sydney%20housing%20slump%20creates%20pandemic-sized%20hole%20in%20state%20tax%20take.pdf"}, {"id": "bt-17sep-18", "title": "UK inflation rises to five-month high before BOE decision", "source": "BT", "date": "17 Sep 2026", "tags": ["Finance & Markets", "Politics"], "summary": "UK CPI rose to 3.1% in August from 2.9%, the highest since March and in line with forecasts, the ONS said on Sep 16. Motor fuels rose 6.9% on the month and airfares 6.2% because of the Iran war and summer travel. Services inflation held at 3.4% and core at 2.6%. The Bank of England is expected to keep rates on hold as a weak labour market contains price pressures, but oil and gas prices are now above its adverse scenario. Bloomberg Economics estimates household energy bills could rise about 25% when the price cap resets in January, pushing CPI above 4% in 2027. Prime Minister Andy Burnham, who took office in July, warned October's budget 'is going to be challenging'.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/17%20Sep%202026/17%20Sep%20BT/UK%20inflation%20rises%20to%20five-month%20high%20before%20BOE%20decision.pdf"}, {"id": "bt-17sep-19", "title": "UK workers spend nearly £1 billion of their own money on AI for work, Deloitte finds", "source": "BT", "date": "17 Sep 2026", "tags": ["Technology & AI", "Society"], "summary": "Deloitte's first GenAI Workforce Survey, conducted by Ipsos among 25,000 UK workers and published Sep 16, found that 17% pay for at least one GenAI tool for work themselves, spending nearly £1 billion (S$1.8 billion) a year in total. Two-thirds have tried tools such as ChatGPT, Claude, Gemini and Copilot, and nearly a quarter use them daily. About 31% use GenAI without their employer's knowledge (so-called shadow AI). The most common uses are searching for information, drafting emails and writing summaries, which save an average of 70 minutes a week. Deloitte UK chief AI officer Hayley McKelvey said workers 'don’t want to wait for permission to use GenAI'.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/17%20Sep%202026/17%20Sep%20BT/UK%20workers%20spend%20nearly%201%20billion%20of%20their%20own%20money%20on%20AI%20for%20work,%20Deloitte%20finds.pdf"}, {"id": "bt-17sep-20", "title": "UOBKH cuts STI target, downgrades banks on prolonged Middle East conflict", "source": "BT", "date": "17 Sep 2026", "tags": ["Southeast Asia", "Finance & Markets", "Geopolitics"], "summary": "UOB Kay Hian cut its 12-month Straits Times Index target by 9.3% to 6,061 from 6,682, citing renewed escalation in the Middle East and the risk of disrupted shipping through Hormuz and Bab el-Mandeb. The new target implies 18.3 times 2026 earnings and 6% upside. It downgraded DBS to sell with a S$74.70 target and OCBC to hold with a S$32.50 target, and removed OCBC and SIA Engineering from its conviction buy list. DBS closed down 1.2% at S$76.50 and OCBC down 2.7% at S$31 on Tuesday. The brokerage recommends defensive positions: Keppel, Singtel and CDL for asset recycling; S-Reits NTT DC Reit and UI Boustead Reit; tech names Venture and Valuetronics; small caps Riverstone and Pan-United; and Sats. It warned the drone attack on Saudi Arabia's 7-million-barrel-a-day East-West pipeline threatens the kingdom's only remaining export route.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/17%20Sep%202026/17%20Sep%20BT/UOBKH%20cuts%20STI%20target,%20downgrades%20banks%20on%20prolonged%20Middle%20East%20conflict.pdf"}, {"id": "bt-17sep-21", "title": "US Fed hikes rates amid stubborn inflation; signals further increases in coming months", "source": "BT", "date": "17 Sep 2026", "tags": ["Finance & Markets", "Politics"], "summary": "The Fed unanimously raised rates by 25 basis points to 3.75-4% on Sep 16, its first hike since 2023 and the first policy move under Chair Kevin Warsh. It pointed to inflation driven by tariffs, the Iran war energy shock and AI capex, and dropped its earlier description of inflation as mainly caused by supply shocks. Sixteen of 18 policymakers expect at least one more hike in 2026, the median path reaches 4-4.25% by year-end, and futures price a 90% chance of another hike. PCE inflation is now projected at 3.7% with no return to 2% until 2029, growth was revised up to 2.3%, and year-end unemployment is seen at 4.1%. Warsh said 'we removed a dose of accommodation' while Trump demanded rates of 1% or less. Two-year Treasury yields hit their highest in more than two years and the curve flattened, less than two months before midterms with 30-year mortgage rates near 7%.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/17%20Sep%202026/17%20Sep%20BT/US%20Fed%20hikes%20rates%20amid%20stubborn%20inflation%20signals%20further%20increases%20in%20coming%20months.pdf"}, {"id": "bt-17sep-22", "title": "US homebuilder sentiment drops to match lowest level since 2022", "source": "BT", "date": "17 Sep 2026", "tags": ["Finance & Markets"], "summary": "The NAHB/Wells Fargo Housing Market Index fell 3 points to 32 in September, below the 34 forecast and matching its lowest level since late 2022, as mortgage rates near 7%, labour shortages and higher material and fuel costs weighed on builders. The index has stayed below 50 for more than two years. Its future sales gauge fell to the lowest since early 2023. The share of builders offering incentives rose to 66% and the share cutting prices rose to 38%. NAHB chairman Bill Owens said stepped-up immigration enforcement is discouraging legal workers from turning up at job sites. The iShares US Home Construction ETF is down about 20% over the year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/17%20Sep%202026/17%20Sep%20BT/US%20homebuilder%20sentiment%20drops%20to%20match%20lowest%20level%20since%202022.pdf"}, {"id": "bt-17sep-23", "title": "Who is Suahasil Nazara, the technocrat now holding Indonesia’s purse strings?", "source": "BT", "date": "17 Sep 2026", "tags": ["Southeast Asia", "Politics", "Finance & Markets"], "summary": "President Prabowo Subianto on Sep 14 appointed long-serving deputy finance minister Suahasil Nazara, 55, as Indonesia's finance minister, replacing Purbaya Yudhi Sadewa. He is the third finance minister since Prabowo took office in October 2024. Suahasil is an economist with a PhD from the University of Illinois who worked alongside Sri Mulyani Indrawati. He takes over as the rupiah ranks among the region's weakest currencies and Jakarta targets 8% growth while planning more than 4,000 trillion rupiah (US$230 billion) of spending in 2027, about a fifth of GDP, within the 3%-of-GDP deficit ceiling. DBS's Radhika Rao expects him to favour fiscal prudence over the more expansionary approach taken under Purbaya. Business leaders, including employers' association chair Shinta Kamdani, want him to reduce policy uncertainty after two years of new instruments such as Danantara.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/17%20Sep%202026/17%20Sep%20BT/Who%20is%20Suahasil%20Nazara,%20the%20technocrat%20now%20holding%20Indonesia's%20purse%20strings.pdf"}, {"id": "bt-17sep-24", "title": "Why US$100 oil, 5% US yields affect Singdollar, ringgit differently vs other Asean currencies", "source": "BT", "date": "17 Sep 2026", "tags": ["Southeast Asia", "Finance & Markets", "Energy"], "summary": "Oil above US$100 and the US 10-year Treasury yield crossing 5% for the first time in three years are pulling Asean currencies apart. Oil jumped more than 6% after Houthi drone attacks on Sep 14 knocked out a Saudi pipeline bypassing Hormuz, with Brent above US$105. The Singapore dollar, ringgit and dong have held up: Singapore on balance-of-payments surpluses, FDI, AI-driven exports and MAS tightening, Malaysia as a net energy exporter, and Vietnam on inflows ahead of its FTSE Russell reclassification on Sep 21. Oil importers the Philippines, Thailand and Indonesia are underperforming as current accounts worsen, though the rupiah has shown signs of stabilising on debt inflows. OCBC's Christopher Wong said a prolonged period of high oil combined with higher US yields would mean greater divergence, while DBS expects central banks to focus on domestic inflation rather than currency-defence hikes.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/17%20Sep%202026/17%20Sep%20BT/Why%20US100%20oil,%205%20US%20yields%20affect%20Singdollar,%20ringgit%20differently%20vs%20other%20Asean%20currencie.pdf"}, {"id": "scmp-17sep-01", "title": "China affirms support for Iran, but warns against Yemen spillover", "source": "SCMP", "date": "17 Sep 2026", "tags": ["Geopolitics", "Energy"], "summary": "Chinese Foreign Minister Wang Yi met Iranian counterpart Abbas Araghchi in Beijing on Wednesday, reaffirming support for Tehran, urging Iran and the US to 'remain rational' and return to their Islamabad Memorandum of Understanding signed in June, and calling for Hormuz to reopen at the earliest opportunity. Wang warned against tensions spilling into Yemen and the Red Sea, where the Houthi seizure of the coast near Bab el-Mandeb has pushed Brent above US$100 a barrel, and promoted Xi Jinping's four-point Middle East security proposal. The trip, Araghchi's second since US strikes on Iran in late February, comes as Washington expands sanctions including on Chinese firms, and ahead of next week's Xi-Trump summit. Iran and Oman are preparing a temporary Hormuz shipping lane, though Tehran says it is not a full reopening. A congressional estimate put US war costs at US$38 billion in five months, and the House voted a third time to curb Trump's war powers.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/17%20Sep%202026/17%20Sep%20SCMP/China%20affirms%20support%20for%20Iran,%20but%20warns%20against%20Yemen%20spillover.pdf"}, {"id": "scmp-17sep-02", "title": "China mulls bid for Apec free-trade area to taunt US, tantalise Asia", "source": "SCMP", "date": "17 Sep 2026", "tags": ["Trade", "Geopolitics"], "summary": "China is expected to push for the Free Trade Area of the Asia-Pacific (FTAAP), covering all 21 Apec members including the US, when it hosts the Apec forum in November, marking the idea's 20th anniversary. Beijing adopted a Beijing road map toward the pact after in-depth ministerial talks in January, and Indonesia's Antara reported China seeking an implementation agreement this year. Analysts say a deal is unlikely because Apec works by consensus and Trump opposes multilateral trade pacts; Willamette University's Liang Yan said 'Trump really wants to use tariffs as an economic tool and for geopolitical reasons.' Even without a deal, the push lets Beijing cast the US as the obstacle to regional trade and portray itself as a champion of open trade. Trump imposed tariffs of more than 100% on Chinese imports last year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/17%20Sep%202026/17%20Sep%20SCMP/China%20mulls%20bid%20for%20Apec%20free-trade%20area%20to%20taunt%20US,%20tantalise%20Asia.pdf"}, {"id": "scmp-17sep-03", "title": "China uses 100,000 home-grown AI chips to build leading weather forecast system", "source": "SCMP", "date": "17 Sep 2026", "tags": ["Technology & AI"], "summary": "The China Meteorological Administration and Sugon said on Tuesday that China can now produce 10-day forecasts at 5km resolution, finer than most major systems, including the US Global Forecast System's roughly 13km. The Mesoscale Convective Vortex model runs on Sugon 8,000, a cluster unveiled in July linking 100,000 computing units built entirely with domestic chips, storage and networking, designed for both high-precision simulation and AI workloads. It produced a 10-day global forecast in about an hour, versus about 45 minutes for the US system in tests, which Sugon says meets routine forecasting needs. The team has tested 3km global resolution, toward a 2030 goal of 1km nationwide and 100m in key areas. Sugon 8,000 has been adapted for nearly 200 applications and more than 500 AI models.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/17%20Sep%202026/17%20Sep%20SCMP/China%20uses%20100,000%20home-grown%20AI%20chips%20to%20build%20leading%20weather%20forecast%20system.pdf"}, {"id": "scmp-17sep-04", "title": "China’s Z.ai raises revenue target 25% after US$5 billion cash injection", "source": "SCMP", "date": "17 Sep 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Z.ai (Zhipu AI) raised its year-end annual recurring revenue outlook by 25% to US$3 billion from about US$2.4 billion on Wednesday, days after raising US$5 billion through a share placement and convertible bonds; ARR has reached US$1.8 billion so far this year. Executives said 'computing power supply is no longer the primary constraint', a turnaround from February when it suspended Coding Plan sales after launching GLM-5. Shares rose 5.9% to HK$720, offsetting part of a 14.3% two-day drop amid a global AI stock slump, and remain more than six times the January listing price. A planned 30 billion yuan infrastructure push could add up to 100,000 petaflops, with 60% for inference that could generate up to 40 billion yuan in annual revenue. First-half revenue rose 400% to 953.89 million yuan while the loss narrowed 12.1% to 2.07 billion yuan.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/17%20Sep%202026/17%20Sep%20SCMP/China's%20Z.ai%20raises%20revenue%20target%2025%20after%20US5%20billion%20cash%20injection.pdf"}, {"id": "scmp-17sep-05", "title": "Hong Kong sets 5-year plan to double innovation spending, boost new industries", "source": "SCMP", "date": "17 Sep 2026", "tags": ["Politics", "Finance & Markets", "Technology & AI"], "summary": "Chief Executive John Lee unveiled Hong Kong's first five-year blueprint on Wednesday, aligned with China's 15th five-year plan, with 105 indicators including 22 major targets (17 anticipatory, five binding) to 2030. Goals include raising innovation spending to 3% of GDP from 1.63%, lifting value-added manufacturing to 5.5% of the economy from 3.8%, cutting carbon emissions per unit of GDP by 32.5% and raising zero-carbon electricity to 30% from 25%. For the Northern Metropolis, spade-ready land is to rise from 120 to 900 hectares and completed homes from 11,000 to 70,000, with targeted tax breaks for strategic industries. His final policy address of the term extends the HK$20,000 newborn bonus for three years (HK$30,000 for second and later children), introduces a yuan liquidity auction for banks, considers using the Exchange Fund to buy more gold, and creates an AI commissioner post. Waiting times for public rental flats are to fall to 4.5 years by 2027 and below four years after 2030.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/17%20Sep%202026/17%20Sep%20SCMP/Hong%20Kong%20sets%205-year%20plan%20to%20double%20innovation%20spending,%20boost%20new%20industries.pdf"}, {"id": "scmp-17sep-06", "title": "Hong Kong targets gold trading, FPS-UnionPay link to boost yuan use", "source": "SCMP", "date": "17 Sep 2026", "tags": ["Finance & Markets"], "summary": "Hong Kong's first five-year plan and policy address set out the city's biggest push yet to internationalise the yuan. The HKMA will introduce a tender for seven-day offshore yuan liquidity, explore short-term yuan debt instruments, link the Faster Payment System with UnionPay by year-end and encourage more foreign banks to join CIPS directly. The central clearing and settlement system for gold will launch in Q1 2027, and the stock exchange is expected to detail renminbi-denominated, physically settled gold futures this year; HSBC's David Liao said 'Hong Kong has a unique advantage in developing more renminbi-denominated gold products'. The government, which spends about 20 million yuan monthly on Guangdong programmes, plans to settle more expenditure in yuan. Other measures include a regional IP trading centre and a second-stage consultation on listing rules by the end of this month.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/17%20Sep%202026/17%20Sep%20SCMP/Hong%20Kong%20targets%20gold%20trading,%20FPS-UnionPay%20link%20to%20boost%20yuan%20use.pdf"}, {"id": "scmp-17sep-07", "title": "Hong Kong to woo finance and tech firms with new tax breaks", "source": "SCMP", "date": "17 Sep 2026", "tags": ["Finance & Markets", "Trade"], "summary": "John Lee's policy address will speed up halving the profits tax for qualifying physical commodity traders from 16.5% to 8.25% by next year, as Hong Kong builds a gold trading hub ahead of its Q1 2027 central clearing launch. A bill by year-end will offer preferential tax rates of 5% or half rate to large firms in finance, advanced manufacturing, R&D, headquarters and logistics, based on investment size, local hiring and economic contribution, which a government source said aims to lure large companies to the city. A separate bill this year will allow tax deductions for capital spending on buying or licensing IP rights to build a regional IP trading centre. Hong Kong's LME-approved storage now exceeds 60,000 sq m with inventory above 20,000 tonnes, and a trial gold clearing system with 11 banks launched in July, including a Delivery Connect link to Shanghai.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/17%20Sep%202026/17%20Sep%20SCMP/Hong%20Kong%20to%20woo%20finance%20and%20tech%20firms%20with%20new%20tax%20breaks.pdf"}, {"id": "scmp-17sep-08", "title": "Investors prepare for ‘super-central-bank week’ as US rate increase appears done deal", "source": "SCMP", "date": "17 Sep 2026", "tags": ["Finance & Markets"], "summary": "With odds of a 25-basis-point Fed hike at 92%, investors are weighing whether it is a one-off or the start of a new tightening cycle amid soaring Treasury yields, oil above US$100 a barrel and White House pressure on chair Kevin Warsh. A one-off move could be read as positive for equities, while signals of more hikes could hit stretched valuations; Macro Risk Advisors predicted a 10% S&P 500 drop, but Citigroup's David Groman said 'It is not the first Fed increase that ends equity bull markets'. The BOJ is expected to raise rates by a quarter point to 1.25% on Friday, with Julius Baer forecasting three more hikes in December, March and July. About 80% of Asian fund managers in a Bank of America survey expect the Japan hike, which risks unwinding the yen carry trade and adding equity volatility. Hong Kong and mainland stocks have barely moved this week ahead of US, UK and Japan decisions.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/17%20Sep%202026/17%20Sep%20SCMP/Investors%20prepare%20for%20'super-central-bank%20week'%20as%20US%20rate%20increase%20appears%20done%20deal.pdf"}, {"id": "scmp-17sep-09", "title": "Saudis seek allies’ help as missile defences run low in fight with Houthis", "source": "SCMP", "date": "17 Sep 2026", "tags": ["Defence", "Geopolitics", "Energy"], "summary": "Saudi Arabia is running low on missile interceptors and has asked France, Britain, Pakistan and Egypt to deploy air-defence support, as US interceptor stocks have dwindled over the six-month Iran war, two regional officials said on Wednesday. Riyadh accused the Houthis of a drone attack on Mecca, which it declared a red line, while the Houthis denied it. A key Saudi pipeline has been shut for weeks after an attack by Iran-backed Iraqi militias, the Houthis have seized islands in the Bab el-Mandeb Strait, Iran is still targeting ships in Hormuz and oil remains above US$100 a barrel. Turkey and Pakistan, partners in a new defence pact with Riyadh, say they have received no request, while US officials signal reluctance to intervene; Oman hosted US-Houthi talks last weekend. The Houthis claimed, without evidence, to have shot down a coalition F-15 over Marib.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/17%20Sep%202026/17%20Sep%20SCMP/Saudis%20seek%20allies'%20help%20as%20missile%20defences%20run%20low%20in%20fight%20with%20Houthis.pdf"}, {"id": "scmp-17sep-10", "title": "US Congress passes bill targeting Russia’s leading energy buyers – China and India", "source": "SCMP", "date": "17 Sep 2026", "tags": ["Trade", "Geopolitics", "Energy"], "summary": "The US House passed the Lindsey Graham Sanctioning Russia and Iran Act of 2026 by 262-159 on Wednesday, after an 86-11 Senate vote last month, sending it to Trump for signature days before Xi Jinping's Washington summit. It authorises tariffs of up to 100% on the five largest importers of Russian oil and gas, likely China and India, while potentially exempting Japan, France, Hungary and Belgium, and adds sanctions on Russia's energy, defence and shadow tanker fleet and on Iran. Democrat Gregory Meeks warned 'he would be able to place tariffs on nearly any country he wants'. Treasury Secretary Scott Bessent and Vice-Premier He Lifeng hold final pre-summit talks this weekend, expected to cover agricultural tariff cuts and extending the October trade truce. Since the Supreme Court struck down IEEPA tariffs in February, Trump has imposed Section 301 tariffs of 10-12.5% on 60 economies and 50% Section 338 tariffs on Canadian goods.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/17%20Sep%202026/17%20Sep%20SCMP/US%20Congress%20passes%20bill%20targeting%20Russia's%20leading%20energy%20buyers%20-%20China%20and%20India.p
