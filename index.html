two years as energy shifts to pipelines. Analysts warn Iran will retaliate and has a higher pain tolerance. Republicans fear the war will hurt them in the midterms. Vice President Vance said the U.S. is \"in the middle of the game.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/Trump%20Shifts%20to%20Economic%20Pressure,%20Again,%20As%20Iran%20Won't%20Meet%20His%20Demands.pdf"}, {"id": "wsj-14", "title": "Trump's Blockade Keeps the Economic Pressure on Iran", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "A WSJ editorial argues Trump's naval blockade and sanctions keep the economic upper hand over Iran, if he has the patience to sustain them. Iranian Foreign Minister Abbas Araghchi says a Hormuz deal with Oman is in its \"final stages\" but demands U.S. reparations, an end to the blockade, release of frozen assets and lifting of sanctions before traffic resumes. Iran launched at least 22 strikes in two weeks, yet oil holds near $80, aided by 8 million barrels a day sneaked out of the strait. The blockade is estimated to cost Iran's regime $435 million a day. Rather than a deal ceding the strait, the editorial favors sustained pressure despite the risk Iran strikes regional energy sites.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/Trump's%20Blockade%20Keeps%20the%20Economic%20Pressure%20on%20Iran.pdf"}, {"id": "wsj-15", "title": "Two Inflation Reports Will Shape the Fed's September Rate Decision", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Finance & Markets"], "summary": "Two inflation reports over the coming month will shape whether Federal Reserve officials push to raise rates in September or extend their pause, writes Nick Timiraos. New Fed Chairman Kevin Warsh wants decisions less tied to monthly data, but Wednesday's July CPI and the preferred gauge later this month carry outsize weight. Tariff, energy and AI-equipment price shocks have persisted, testing officials who forecast inflation would ease without tighter policy. Warsh, who made lowering inflation his signature theme, unsettled investors last month by not clearly explaining a rate hold; the 30-year Treasury yield rose. At least six voters signaled openness to raising rates and three dissented in July. Firm readings could force action or a fourth dissent, possibly addressed at Jackson Hole.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/Two%20inflation%20reports%20to%20shape%20Fed%20September%20rate%20decision.pdf"}, {"id": "wsj-16", "title": "U.A.E.'s Adnoc Gas to Invest More Than $8 Billion in Expansion Push", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Energy", "Finance & Markets"], "summary": "The U.A.E.'s Adnoc Gas said it will invest more than $8 billion to expand production capacity, months after the country left OPEC, freeing Abu Dhabi from quota limits. Already a top global gas producer, it is betting on rising demand from population growth and power-hungry data centers. Plans include a new processing unit at Habshan and an export facility at Ruwais under the Rich Gas Development project, whose combined spend reaches $13.2 billion, the company's largest. Adnoc Gas raised its 2030 earnings target above $12 billion. Second-quarter net income fell to $665 million from $1.39 billion as Hormuz shipping dwindled during the Iran war. Finance chief Peter Van Driel called the OPEC exit \"really good news.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/U.A.E.'s%20Adnoc%20Gas%20to%20Invest%20More%20Than%208%20Billion%20in%20Expansion%20Push.pdf"}, {"id": "wsj-17", "title": "U.K. Discovers Component in Its Naval Drones Sent Signals to China", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Defence", "Technology & AI", "Geopolitics"], "summary": "Cameras on British naval drones sent data to an internet address in China, U.K. officials said, highlighting military supply-chain vulnerability to Chinese parts. Britain's Ministry of Defense said the signal broadcast no sensitive information and a probe found no evidence MOD data was accessed. The component was in a K3 Scout drone boat made by Kraken Technology, which said the vulnerability has been closed; Kraken recently won a $49 million U.S. Special Operations contract. China dominates drone production and key components like motors, antennas, cameras and batteries, and has restricted critical-mineral exports. Naval drones are growing in warfare: the U.S. used them in combat against an Iranian port last month. A German maker noted Chinese engines cost far less.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/U.K.%20Discovers%20Component%20in%20Its%20Naval%20Drones%20Sent%20Signals%20to%20China.pdf"}, {"id": "wsj-18", "title": "U.S. Employment Trends Index Increased in July, Conference Board Says", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Finance & Markets"], "summary": "The Conference Board's Employment Trends Index rose to 107.71 in July from an upwardly revised 106.74 in June, suggesting continued labor-market resilience and potential payroll growth ahead. Economist Conrad Qi said the ETI \"rebounded in July\" despite a \"low-hire, low-fire\" backdrop. Positive contributions came from small firms reporting jobs they can't fill and from initial jobless claims, which fell to their lowest since September 2022, indicating limited layoffs. The share of consumers saying jobs are hard to get also declined. The index remains above its year-ago level, pointing to modest payroll growth in coming months. The largest negative contributor was the rising share of involuntary part-time workers.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/U.S.%20Employment%20Trends%20Index%20Increased%20in%20July,%20Conference%20Board%20Says.pdf"}, {"id": "wsj-19", "title": "U.S. Natural Gas Futures Rebound As Near-Term Weather Warms", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Energy", "Finance & Markets"], "summary": "U.S. natural gas futures rebounded as near-term forecasts turned hotter, boosting power-sector demand, while rising LNG feedgas and continued Middle East conflict fed global supply concerns. Gelber & Associates cited elevated cooling demand and export flows nearly matching supply despite strong production; Nymex gas settled at $2.794/mmBtu. NatGasWeather.com said 12-15 day forecasts favor hotter-than-normal temperatures across the northern U.S., and the next two EIA reports may show smaller storage builds. European TTF gas climbed about 5% on Hormuz shipping worries, with ANZ noting Europe is behind on refilling storage before winter and shippers need sustained calm before transiting the strait. The Dutch benchmark traded near 58.80 euros a megawatt-hour.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/U.S.%20Natural%20Gas%20Futures%20Rebound%20As%20Near-Term%20Weather%20Warms.pdf"}, {"id": "wsj-20", "title": "U.S. Pledges $2 Billion for Battery, Materials Producers", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Technology & AI", "Trade", "Energy"], "summary": "The Trump administration agreed to provide more than $2 billion for companies producing batteries and critical minerals, part of a push to reduce U.S. reliance on Chinese suppliers. At a roundtable with mining executives, Trump said the Defense Department will lend battery firm Sila Nanotechnologies $1.4 billion and signed deals with three other companies. More powerful batteries are needed for drones and AI data centers, making domestic production a Pentagon priority; the department has an office funneling tens of billions in loans. The column also notes shipping surcharges from low water on the Amazon, Rhine and Danube, Puerto Rico water rationing, U.S. manufacturing adding 5,000 July jobs, and cooling Chinese consumer and factory prices.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/U.S.%20Pledges%202%20Billion%20for%20Battery,%20Materials%20Producers.pdf"}, {"id": "wsj-21", "title": "War Is Helping Chinese EVs Upend the Global Car Market", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Trade", "Energy", "Southeast Asia"], "summary": "The Iran war is helping China's electric-vehicle makers export their way out of a domestic glut, as high gasoline prices push overseas drivers toward EVs. China's EV exports rose 120% in the first half of 2026; sales roughly doubled in Brazil, Australia, Korea and Vietnam and quadrupled in Colombia. The IEA now expects EVs at 29% of global new-car sales in 2026. Chinese brands hold 60% of emerging-market EV sales, and five accounted for 12.1% of EU and U.K. registrations in June. Southeast Asian governments are promoting EVs for energy security; Thailand cut EV excise taxes and Laos banned gasoline-car imports. Chinese makers lifted their regional share to 11% as Japanese brands slipped to 57%.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/War%20Is%20Helping%20Chinese%20EVs%20Upend%20the%20Global%20Car%20Market.pdf"}, {"id": "wsj-22", "title": "Will Taiwan Fight China? Just Ask Its People", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Geopolitics", "Society"], "summary": "The WSJ interviewed Taiwanese citizens about whether they would resist China's push to conquer the island of 23 million. Cony Hsieh, 33, a trained reservist, is ready to fight and fears a 2028 election win by the Beijing-friendly Kuomintang. Dov Lin, 54, who lived through KMT martial law and the White Terror, would \"fight tooth and nail\" while favoring the status quo. Artist Hsu Mei-chih, 27, identifies as Taiwanese, saying \"I can't call myself Chinese.\" Engineer Ben Chen, 63, proposes a \"Chinese Commonwealth\" and argues war isn't an option against a superpower. Eric Li, 25, says peers would \"hide, hide, hide\" and backs symbolic concessions like competing as \"Chinese Taipei.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/Will%20Taiwan%20Fight%20China%20Just%20Ask%20Its%20People.pdf"}, {"id": "st-01", "title": "'Unacceptable': Austria breaks up sanctions-evasion scheme supplying Russian arms industry", "source": "ST", "date": "11 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Austria's interior ministry said on Aug 10 it broke up a scheme in which a Vienna-based company supplied metalworking tools and CNC machines used to make engines for Russian missiles and fighter jets, breaching EU sanctions. The firm falsified end-user certificates and concealed shipments through shell companies in Turkey, the UAE, Hong Kong, Belarus, Kyrgyzstan, South Korea, Poland and Lithuania. Its 28-year-old Belarusian head was arrested in May, with authorities seizing CNC machines and tools worth about 140,000 euros. Junior intelligence minister Joerg Leichtfried called it \"unacceptable\" for European technology to be diverted to cruise missiles. Equipment went to firms affiliated with Rostec; goods worth over 3.3 million euros were delivered since 2022.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/'Unacceptable'%20Austria%20breaks%20up%20sanctions-evasion%20scheme%20supplying%20Russian%20arms%20industry.pdf"}, {"id": "st-02", "title": "Asean working to be world's fourth-largest economy by 2030, says Malaysian foreign minister", "source": "ST", "date": "11 Aug 2026", "tags": ["Southeast Asia", "Trade"], "summary": "Asean aims to become the world's fourth-largest economy by 2030, but intra-bloc trade remains under 25 per cent, Malaysian Foreign Minister Mohamad Hasan said at the 59th Asean Day in Wisma Putra on Aug 10. He urged stronger trade ties, noting members already have mechanisms such as free movement of goods to boost commerce. Mohamad said Malaysia advanced many resolutions while chairing Asean last year, with the Philippines now continuing the Kuala Lumpur Declaration agenda. He recalled Asean's founding to make South-east Asia peaceful, noted Timor-Leste's recent accession as youngest member, and said the bloc, now 59 years old, is increasingly focused on building a strong collective economy under Vision 2045.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Asean%20working%20to%20be%20world's%20fourth-largest%20economy%20by%202030,%20says%20Malaysian%20foreign%20minister.pdf"}, {"id": "st-03", "title": "Asia stocks edge higher, oil up amid Gulf confusion", "source": "ST", "date": "11 Aug 2026", "tags": ["Finance & Markets", "Energy"], "summary": "Asian shares tracked Wall Street higher on Aug 10 after a soft US jobs report eased near-term rate-hike risk, while stalled Gulf peace talks lifted oil. Iran said an Oman deal defining new Strait of Hormuz shipping lanes was near, but the waterway would reopen only once US conditions were met. Brent rose 0.9 per cent to US$84.32 and US crude gained 0.7 per cent to US$78.74 amid trickling traffic. Markets await the July US CPI report on Aug 12; futures now price a 44 per cent chance of a September Fed move, down from 67 per cent. Japan's Nikkei rose 0.6 per cent, South Korea 0.5 per cent. S&P 500 earnings per share were up 30 per cent, led by AI names.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Asia%20stocks%20edge%20higher,%20oil%20up%20amid%20Gulf%20confusion.pdf"}, {"id": "st-04", "title": "Australia tightens curbs on two Northern Minerals shareholders ordered to divest", "source": "ST", "date": "11 Aug 2026", "tags": ["Geopolitics", "Trade"], "summary": "Australia has tightened restrictions on two Northern Minerals shareholders ordered to divest over national security concerns, the miner said on Aug 10, extending scrutiny of Chinese-linked investment in the rare earths developer. Northern Minerals is building the Browns Range heavy rare earths project in Western Australia as Western governments seek to cut reliance on China for minerals used in semiconductors and defence. In May, Treasurer Jim Chalmers ordered six offshore shareholders to divest. Amended interim directions now bar Real International Resources and Qogir Trading & Service from selling shares unless the Treasurer confirms the buyer is not an associated party. The six were told to shed a combined 1.68 billion shares by July 2. Shares rose 3.9 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Australia%20tightens%20curbs%20on%20two%20Northern%20Minerals%20shareholders%20ordered%20to%20divest.pdf"}, {"id": "st-05", "title": "Europe's fifth heatwave risks straining rivers, power and crops", "source": "ST", "date": "11 Aug 2026", "tags": ["Environment", "Energy"], "summary": "Another wave of intense heat is set to sweep an already parched Europe this week, raising wildfire risk and threatening crops and rivers. A high-pressure heat dome may push northern France near 40 deg C on Aug 11, with 38 deg C possible in Frankfurt on Aug 14. Europe's fifth major heatwave of the year is likely to keep record-low rivers such as the Rhine, Po and Danube from refilling, disrupting navigation and power. Rhine levels at Kaub, the lowest since 1880, hit 16cm and could fall to 4cm by Aug 14. Evening peak power prices in France and Germany topped 170 euros per megawatt-hour. Red heat warnings cover Italy and Croatia, and Greece is battling wildfires near Attica.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Europe's%20fifth%20heatwave%20risks%20straining%20rivers,%20power%20and%20crops.pdf"}, {"id": "st-06", "title": "Libya's NOC warns of force majeure, Zawiya refinery shutdown if drone attacks continue", "source": "ST", "date": "11 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "Libya's National Oil Corporation said on Aug 10 it could declare force majeure and halt operations at the Zawiya refinery if drone attacks on oil assets continued, after a third strike over the weekend. The latest drone hit an oil blending and filling plant, falling near a main tank and pipeline network; no casualties were reported. Zawiya, about 40km west of Tripoli, has 120,000 barrels per day capacity, is linked to the Sharara oilfield and is Libya's largest operating refinery with Ras Lanuf shut. On Monday a Brega fuel tank holding 4.5 million litres of gasoline caught fire and collapsed. No party claimed responsibility. Attacks also targeted a desalination plant, prompting a state of extreme emergency.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Libya's%20NOC%20warns%20of%20force%20majeure,%20Zawiya%20refinery%20shutdown%20if%20drone%20attacks%20continue.pdf"}, {"id": "st-07", "title": "Meta launches new AI model as CEO Mark Zuckerberg champions open-weight push", "source": "ST", "date": "11 Aug 2026", "tags": ["Technology & AI"], "summary": "Meta CEO Mark Zuckerberg called for lower US barriers to open-source AI to better compete with Chinese rivals as the company released a new open-weight model, Muse Glimmer, on Aug 10. The small model targets agentic tasks and runs on a Mac or PC with a single graphics card. In a 14-page essay, Zuckerberg said concentrating AI power is \"inherently problematic\" and unveiled a US$1 billion fund to ease community concerns over data-centre build-out. He warned Chinese start-ups like Moonshot, Alibaba and DeepSeek lead in open-weight models and urged US policy to cut restrictions on training data. Meta, spending up to US$145 billion on AI infrastructure in 2026, plans to release weights of its advanced Muse Spark 1.2. Shares rose 3 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Meta%20launches%20new%20AI%20model%20as%20CEO%20Mark%20Zuckerberg%20champions%20open-weight%20push.pdf"}, {"id": "st-08", "title": "North Korea condemns Japan's White Paper, calling it 're-invasion paper'", "source": "ST", "date": "11 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "North Korea condemned Japan's 2026 defence White Paper, with a state media commentary branding it a \"re-invasion-minded\" document to legalise Tokyo's war machine. A North Korean analyst said the paper \"groundlessly described\" the North as the greatest strategic challenge to justify a \"reckless arms build-up\". Pyongyang has ratcheted up criticism of Tokyo's defence policy, issuing statements at least seven times since July. On Aug 5, Kim Yo Jong, sister of leader Kim Jong Un, warned of \"additional military options\" over Japan's transformation into a military power, after Tokyo test-fired a US-made Tomahawk cruise missile on July 29. The next day North Korea test-fired a short-range ballistic missile toward the sea, seen by some analysts as a warning to Japan.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/North%20Korea%20condemns%20Japan's%20White%20Paper,%20calling%20it%20're-invasion%20paper'.pdf"}, {"id": "st-09", "title": "Nvidia partners Wall Street giants to raise $640 billion for AI infrastructure", "source": "ST", "date": "11 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Nvidia said on Aug 10 it partnered with six major financial institutions to launch compute financing platforms aimed at raising over US$500 billion (S$640 billion) in third-party capital for AI infrastructure. It signed memorandums with Apollo, BlackRock, Blackstone, Brookfield, Goldman Sachs and KKR. CEO Jensen Huang said the platforms would help customers access scarce compute and build \"AI factories\". Big Tech's combined AI outlays are set to top US$730 billion in 2026. Nvidia's many deals have stoked concern it is inflating demand through circular arrangements; it was in talks to backstop up to US$250 billion for OpenAI's Ohio data-centre hub and finance US$350 billion of chip purchases. It also expanded a US$500 billion partnership with SK Group.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Nvidia%20partners%20Wall%20Street%20giants%20to%20raise%20640%20billion%20for%20AI%20infrastructure.pdf"}, {"id": "st-10", "title": "Oman says grounded tanker oil spill covers 400 square km", "source": "ST", "date": "11 Aug 2026", "tags": ["Environment", "Energy"], "summary": "Leaking crude from a tanker grounded off a nature reserve in Oman has created a slick covering almost 400 square kilometres, the government said on Aug 10. The Caroline Bezengi, loaded with close to one million barrels of Russian oil bound for Asia, first reported trouble on June 8 off Yemen after an apparent onboard blast; no party has claimed responsibility. The slick, near the protected Hallaniyat Islands home to humpback whales, extends within seven kilometres of the coast. Greenpeace estimated it at 600 square km. The 274-metre vessel is part of Russia's shadow fleet, sailed under the Cameroon flag, and is under EU, Ukrainian, UK, Canadian and Swiss sanctions. Experts warned oil could persist for years, citing Exxon Valdez.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Oman%20says%20grounded%20tanker%20oil%20spill%20covers%20400%20square%20km.pdf"}, {"id": "st-11", "title": "Poland and Baltics shield infrastructure, fearing a Russian false-flag strike", "source": "ST", "date": "11 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Russia's northern NATO neighbours are tightening security around dams, power plants and gas infrastructure amid concern Moscow could stage a \"false flag\" attack using Ukrainian drones. Lithuania, Poland, Latvia and Estonia warn of sabotage to test NATO's response as US commitment is questioned; the Kremlin dismissed such warnings as \"scare stories\". Lithuania deployed the military to guard its LNG terminal and a hydro plant, while Latvia boosted security at the Daugava dam and gas storage. A Baltic intelligence official said a drone attack could be launched within days of Putin's approval, with the aim being \"political chaos\" at NATO headquarters. Poland's Orlen is analysing alternative gas routes, and forged documents targeted its planned first nuclear plant.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Poland%20and%20Baltics%20shield%20infrastructure,%20fearing%20a%20Russian%20false-flag%20strike.pdf"}, {"id": "st-12", "title": "Russian attacks on Ukraine's Zaporizhzhia, Kyiv kill five, officials say", "source": "ST", "date": "11 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Russian attacks killed five people and injured 20 in the south-eastern Ukrainian city of Zaporizhzhia early on Aug 11 and also struck Kyiv, triggering fires in the capital, officials said. Zaporizhzhia Regional Governor Ivan Fedorov said Russian troops deployed missiles and aerial bombs on the city, posting pictures of buildings and vehicles ablaze. Air raid alerts sounded in both Zaporizhzhia and Kyiv, where the city's military administration said warehouses in a central district were on fire and one person was injured. Mayor Vitali Klitschko said medical personnel had been dispatched to a central district. Kyiv's air raid alert was lifted after 40 minutes and then issued again later, well after midnight.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Russian%20attacks%20on%20Ukraine's%20Zaporizhzhia,%20Kyiv%20kill%20five,%20officials%20say.pdf"}, {"id": "st-13", "title": "S'pore upgrades key exports forecast for 2026 after AI-powered 27.4% jump in Q2", "source": "ST", "date": "11 Aug 2026", "tags": ["Trade", "Technology & AI"], "summary": "Singapore upgraded its 2026 non-oil domestic exports (NODX) forecast after a 27.4 per cent surge in the second quarter, driven by electronics demand from the global AI build-out, EnterpriseSG said on Aug 11. The NODX forecast was raised to 14-16 per cent, from 3-5 per cent, after a first-half surge of 18.6 per cent, the strongest since 2010. Q2 electronics shipments jumped a record 88.1 per cent, with semiconductors up 91.9 per cent and disk media up 182.5 per cent. MTI lifted its 2026 GDP growth forecast to 4.5-5.5 per cent. Officials warned that an AI capex pullback could trigger sharp corrections; a MAS survey found 60 per cent of forecasters flagged an AI bubble burst as a downside risk. Taiwan was the top NODX market.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/S'pore%20upgrades%20key%20exports%20forecast%20for%202026%20after%20AI-powered%2027.4%20jump%20in%20Q2.pdf"}, {"id": "st-14", "title": "South Korea to launch $4.5b chip fund, speed development of semiconductor hubs", "source": "ST", "date": "11 Aug 2026", "tags": ["Technology & AI", "Politics"], "summary": "South Korea will launch a 5 trillion won (S$4.5 billion) semiconductor fund targeting chip materials, parts, equipment and fabless firms, plus 5 trillion won in trade finance for suppliers, a presidential official said on Aug 10. The measures are part of President Lee Jae Myung's semiconductor megaproject, under which Samsung Electronics and SK Hynix and partners are expected to invest more than US$576 billion in new chip projects. Seoul will seek a Mega Special Zone Act to speed permits and reviews, and Lee urged relocating a Gwangju military air base by mid-2028 for a chip complex. The government pledged secured power and water, including 14.7 gigawatts for the Yongin cluster by 2041, as it expands capacity to meet AI-driven demand.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/South%20Korea%20to%20launch%204.5b%20chip%20fund,%20speed%20development%20of%20semiconductor%20hubs.pdf"}, {"id": "st-15", "title": "South Korea, US to conduct military drills amid evolving North Korea threats", "source": "ST", "date": "11 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "South Korea and the United States will hold major joint military drills from Aug 17 to Aug 27, adding exercises to counter drones, GPS disruption and cyberattacks as they adapt to North Korea's evolving capabilities, officials said on Aug 10. The annual Ulchi Freedom Shield will test operations and government emergency readiness. Colonel Ryan Donald said the exercise reflects the changing character of war, noting DPRK soldiers who fought in Ukraine brought lessons home. About 18,000 South Korean troops will participate. Pyongyang routinely denounces the drills as provocation. North Korea, which recently fired a short-range ballistic missile, has continued developing weapons and in 2026 revised its Constitution to remove references to reunification and declare itself a nuclear weapons state.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/South%20Korea,%20US%20to%20conduct%20military%20drills%20amid%20evolving%20North%20Korea%20threats.pdf"}, {"id": "st-16", "title": "Taiwan bets on drone 'hellscape' to deter possible Chinese invasion", "source": "ST", "date": "11 Aug 2026", "tags": ["Defence", "Technology & AI"], "summary": "Taiwan is building fleets of flying drones and unmanned attack boats to repel any Chinese invasion, accelerating a US-conceived \"hellscape\" strategy of overwhelming an invading force with drones, missiles and artillery. Inspired by Ukraine, Taiwan practised drone reconnaissance during its annual Han Kuang exercises. Officials said drone and counter-drone efforts started late but have improved over two years. The government wants Taiwan making 100,000 drones a month by 2030 and the military to acquire over 210,000 drones. Experts warn Taiwan must also retool organisation, training and doctrine, and lacks the pressure of actual war. Drone exports hit US$115 million in Q1 2026, exceeding all of 2025, with the Czech Republic the top destination and many reaching Ukraine.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Taiwan%20bets%20on%20drone%20'hellscape'%20to%20deter%20possible%20Chinese%20invasion.pdf"}, {"id": "st-17", "title": "Trump flew secretly from Turkey due to Iranian threat", "source": "ST", "date": "11 Aug 2026", "tags": ["Politics", "Geopolitics"], "summary": "US President Donald Trump departed on a secret military flight from Turkey in July when the White House said he was aboard Air Force One, prompted by an Iranian assassination threat, the Washington Post reported on Aug 10. Trump had flown the newly renovated Qatari-donated jet to Ankara for the NATO summit but boarded an older Air Force One as a decoy, then was shuttled by an airport catering truck to a smaller Air Force C-32A. Journalists and some staff believed he was on the decoy plane and were told to keep window shades closed. A similar operation occurred in 2000 under Bill Clinton. The White House said the Qatari jet has high-level security protocols; the Pentagon did not comment.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Trump%20flew%20secretly%20from%20Turkey%20due%20to%20Iranian%20threat.pdf"}, {"id": "st-18", "title": "US court rules Meta, other tech firms must face thousands of lawsuits over social media addiction", "source": "ST", "date": "11 Aug 2026", "tags": ["Technology & AI", "Society"], "summary": "A US appeals court on Aug 10 allowed thousands of lawsuits to proceed against Meta, Google, TikTok and Snapchat over claims they designed products to be addictive to young users. The 9th US Circuit rejected an appeal by Meta and TikTok seeking to overturn a ruling requiring them to face over 3,000 federal lawsuits, saying the appeal was premature and that Section 230 provides a defence to liability, not immunity from suit. The court also denied Meta's bid to delay an Aug 12 trial brought by 29 state attorneys-general. The ruling follows a New Mexico judge ordering Meta to pay US$567 million into a teen mental health fund. Plaintiffs' attorneys called it Meta's last \"procedural off-ramp\". About 3,300 similar cases are consolidated in California state court.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/US%20court%20rules%20Meta,%20other%20tech%20firms%20must%20face%20thousands%20of%20lawsuits%20over%20social%20media%20addiction.pdf"}, {"id": "st-19", "title": "Ukraine's Zelensky says Russia readying more North Korean troops, missiles", "source": "ST", "date": "11 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Ukrainian President Volodymyr Zelensky said on Aug 10 that Russia was preparing to station more North Korean troops on its territory and had received additional ballistic missiles from Pyongyang. \"This is the first time they cannot wage war without supplements from North Korea,\" he said in his nightly address. Zelensky, who provided no evidence or timeframe, urged Japan and South Korea to supply air defence aid, saying Pyongyang's force grows stronger through combat experience. At the weekend he said a decision had been taken to deploy 30,000 to 50,000 North Koreans on Russian soil. North Korea has become a close Russian military partner since Putin and Kim Jong Un signed a mutual defence pact in June 2024, later using troops in the Kursk counteroffensive.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Ukraine's%20Zelensky%20says%20Russia%20readying%20more%20North%20Korean%20troops,%20missiles.pdf"}, {"id": "st-20", "title": "Ukraine, Moldova consider shipping grain by rail through Moldova, sources say", "source": "ST", "date": "11 Aug 2026", "tags": ["Trade", "Geopolitics"], "summary": "Ukraine is considering shipping grain by rail through Moldova as a more secure alternative to sea exports and has asked Chisinau for a low freight tariff, sources said on Aug 10. Black Sea exports via a security corridor to Romania have faced increased Russian attacks on ports and shipping. Kyiv is seeking a 50 per cent discount to route grain to Romania's Constanta port; Moldova countered by asking for volume guarantees. A former Moldovan Railways head said the corridor could carry 4.5 million tonnes annually, about 10 per cent of Ukraine's exports. Ukraine cut its 2026-27 grain export forecast to 38-40 million tonnes from 43 million due to port attacks. Moldova's premier said his country should not miss the transit revenue opportunity.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Ukraine,%20Moldova%20consider%20shipping%20grain%20by%20rail%20through%20Moldova,%20sources%20say.pdf"}, {"id": "st-21", "title": "What is Unitree and why are China's humanoid robot makers racing to list?", "source": "ST", "date": "11 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Chinese robot maker Unitree priced its Shanghai IPO at 150.8 yuan per share, with subscriptions from Aug 10, seeking to raise 6.1 billion yuan (S$1.2 billion) to become the first mainland-listed humanoid robot manufacturer. Founded in 2016 by Wang Xingxing, Hangzhou-based Unitree first became known for cheap quadruped robot dogs; its G1, H1 and R1 humanoids drew attention via viral demonstrations. Revenue rose more than fourfold to nearly 1.7 billion yuan in 2025, and it is profitable, with over 40 per cent of sales overseas. It competes with Tesla and Boston Dynamics and symbolises Beijing's push to dominate embodied intelligence. Rivals Leju Robotics and AgiBot are also pursuing listings, as heavy development spending drives makers to public markets.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/What%20is%20Unitree%20and%20why%20are%20China's%20humanoid%20robot%20makers%20racing%20to%20list.pdf"}, {"id": "st-22", "title": "Who is Iran's Mohsen Rezaei, the hardliner appointed to key security role?", "source": "ST", "date": "11 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "Iran appointed hardliner Mohsen Rezaei as secretary of its Supreme National Security Council, more than five months into the conflict with the United States, promoting a close ally of Supreme Leader Ayatollah Mojtaba Khamenei. Rezaei, 71, replaces Mohammad Baqer Zolqadr as second-in-command of the body chaired by President Masoud Pezeshkian. He commanded the Islamic Revolutionary Guard Corps from age 27 for 16 years, including most of the Iran-Iraq war, and served as vice president for economic affairs under Ebrahim Raisi. Appointed Khamenei's military adviser in March, Rezaei has voiced deep skepticism of negotiations and threatened the US, and accused Washington of violating the war-ending deal by creating Strait of Hormuz tensions. His Iran-Iraq war record remains controversial.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Who%20is%20Iran's%20Mohsen%20Rezaei,%20the%20hardliner%20appointed%20to%20key%20security%20role.pdf"}, {"id": "bt-01", "title": "Anthropic, Macquarie and GIC form venture for AI data centres", "source": "BT", "date": "11 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Anthropic has formed a strategic partnership with Macquarie Asset Management and Singapore's GIC to build data centres for the Claude developer. The new entity, Theseus Infrastructure, will develop AI computing sites \"with an initial focus\" in the US, the companies said on Aug 10. Macquarie and GIC pledged to fund the bulk of equity for each project, while Anthropic committed to covering any consumer electricity price hikes from the facilities. No spending or project-size details were shared. Anthropic has made relatively few splashy data-centre partnerships compared with rival OpenAI's Stargate venture. In 2025 it said it would spend US$50 billion on custom US data centres, and recently obtained a US$35 billion loan to lease chips at five sites, backstopped by Google.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/Anthropic,%20Macquarie%20and%20GIC%20form%20venture%20for%20AI%20data%20centres.pdf"}, {"id": "bt-02", "title": "BOJ flags upside price risks and possible faster interest rate hikes", "source": "BT", "date": "11 Aug 2026", "tags": ["Finance & Markets"], "summary": "The Bank of Japan flagged rising inflation risks in a summary of opinions from its Jul 30-31 meeting, with one of nine board members warning the pace of rate hikes could be \"faster than market expectations\". Another urged the BOJ to demonstrate determination to prevent upward inflation deviations, potentially with larger hikes. The bank held its policy rate at 1 per cent in July and signalled a possible September move, watching the weak yen's impact on prices and growth. The yen weakened to around 158.05 per dollar after the release. Overnight swaps show a two-thirds chance of a September move, and 96 per cent by October. Only Hajime Takata sought a back-to-back raise; governor Kazuo Ueda struck a hawkish tone.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/BOJ%20flags%20upside%20price%20risks%20and%20possible%20faster%20interest%20rate%20hikes.pdf"}, {"id": "bt-03", "title": "From shopping belt to business address - Orchard Road's corporate appeal is growing", "source": "BT", "date": "11 Aug 2026", "tags": ["Southeast Asia", "Finance & Markets"], "summary": "Orchard Road is developing a second identity as a business address, with a growing roster of corporate occupiers. Deloitte Singapore will relocate from Shenton Way's OUE Downtown to Orchard Central from 2027, joining firms such as UBS, which moved 3,000 staff to 9 Penang Road in 2021. Consultants say such moves are company-specific rather than a broad CBD exodus, but tight Grade A supply and firm rents are widening searches. Core CBD Grade A rents rose 0.8 per cent to S$12.50 psf in Q2, the sixth straight quarterly gain. Orchard holds about 5.2 million sq ft of office stock, one-sixth of the core CBD's 33 million. One Comcentre, redeveloping Singtel's headquarters, begins marketing in Q3 2026.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/From%20shopping%20belt%20to%20business%20address%20-%20Orchard%20Road's%20corporate%20appeal%20is%20growing.pdf"}, {"id": "bt-04", "title": "Gold touches US$4,400 as traders turn focus to US inflation data", "source": "BT", "date": "11 Aug 2026", "tags": ["Finance & Markets", "Energy"], "summary": "Gold advanced through US$4,400 an ounce ahead of a key US inflation report, after adding 3.6 per cent over the previous two sessions. Technical buying was spurred by the metal's ascent through the 100-day moving average on Aug 10, alongside dip-buying and stronger inflows from China's gold-backed ETFs. The consumer price index is seen rising 0.1 per cent in July after a 0.4 per cent June decline. Following Friday's weak jobs report, moderating prices could ease Fed inflation anxiety, though high energy prices may build pressure to raise rates. Oil held a three-day gain after Trump's new demands on Iran clouded a Hormuz deal. Spot gold rose 0.1 per cent to US$4,395.64; bullion remains about 17 per cent below pre-Iran-war levels.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/Gold%20touches%20US4,400%20as%20traders%20turn%20focus%20to%20US%20inflation%20data.pdf"}, {"id": "bt-05", "title": "How BYD disrupted Singapore's car market - and why the strategy is turning on itself", "source": "BT", "date": "11 Aug 2026", "tags": ["Southeast Asia", "Technology & AI"], "summary": "BYD's rise to Singapore's No 1 passenger-car seller was explosive, climbing from three registrations in 2020 to 11,184 in 2025, giving it 21.2 per cent of the market ahead of Toyota's 14.2 per cent. The writer, an NUS Business School vice-dean, uses the four-firm concentration ratio (C4) to argue BYD exploited a comfortable, high-C4 South-east Asian market long dominated by Japanese and German brands, pricing aggressively and selling from many suburban showrooms. Its proven in-house battery tech underpins 10-year warranties rivals struggle to match. But aggressive pricing lowers C4 and thins margins for all, including BYD, whose net profit fell 19 per cent in 2025. Chinese brands took 18.2 per cent of registrations in 2024, up from 5.9 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/How%20BYD%20disrupted%20Singapore's%20car%20market%20-%20and%20why%20the%20strategy%20is%20turning%20on%20itself.pdf"}, {"id": "bt-06", "title": "Meta loses last minute bid to pause landmark state AGs trial", "source": "BT", "date": "11 Aug 2026", "tags": ["Technology & AI", "Society"], "summary": "Meta Platforms failed to obtain an emergency order pausing a landmark trial involving claims from dozens of state attorneys general that the social media giant addicts children and fuels a youth mental health crisis. A Ninth Circuit panel ruled on Aug 10 it lacked jurisdiction to review Meta's early appeal and dismissed it. Meta must now defend against a possible US$1.4 trillion penalty request, with jury selection set for Wednesday in Oakland federal court and opening arguments on Aug 18. Meta had argued Section 230 shields it from addiction lawsuits. The company faces mounting legal attacks: it owes almost US$950 million in a New Mexico case and is midway through a Tennessee trial. School district trials begin February 2027.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/Meta%20loses%20last%20minute%20bid%20to%20pause%20landmark%20state%20AGs%20trial.pdf"}, {"id": "bt-07", "title": "Meta releases scaled-down AI model that consumers can use at home", "source": "BT", "date": "11 Aug 2026", "tags": ["Technology & AI"], "summary": "Meta Platforms introduced Muse Glimmer, a new AI model light enough to run on a single computer, letting users download and customise the technology. A distilled version of Muse Spark 1.2, the 30-billion-parameter model is \"small enough\" to need only one graphics card, handling agent-like tasks such as schedule management and file organisation. Its weights will be available on Hugging Face, with a Muse Spark version to follow. The permissive-licence move mirrors Chinese rivals such as DeepSeek, Moonshot and Alibaba. Meta, which with Amazon, Alphabet and Microsoft has committed more than US$2 trillion to AI capacity, is planning a cloud infrastructure business akin to AWS. It also said it will set up a US$1 billion fund for US communities hosting its data centres.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/Meta%20releases%20scaled-down%20AI%20model%20that%20consumers%20can%20use%20at%20home.pdf"}, {"id": "bt-08", "title": "Microsoft plans to unveil next-gen AI chip in September: report", "source": "BT", "date": "11 Aug 2026", "tags": ["Technology & AI"], "summary": "Microsoft plans to unveil its new Maia 300 AI chip this fall, potentially as soon as September, The Information reported on Aug 10. Having introduced its first Maia chip in November 2023, Microsoft has lagged Alphabet and Amazon in scaling in-house silicon as it seeks to cut reliance on Nvidia's costly processors. The company has been in talks with TSMC to secure capacity for more than 300,000 units for delivery in 2027, and ultimately aims for over one million chips, though supplies and negotiations could constrain plans. It also hopes to persuade major cloud customers such as Anthropic to adopt the chip. Microsoft unveiled its second-generation Maia 200 in January, built by TSMC on three-nanometer technology and packed with SRAM for speed.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/Microsoft%20plans%20to%20unveil%20next-gen%20AI%20chip%20in%20September%20report.pdf"}, {"id": "bt-09", "title": "Oil climbs 5% as Iran, US both demand compensation and Hormuz hopes fade", "source": "BT", "date": "11 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "Oil settled 5 per cent higher on Aug 10 after Iran and the US traded demands for compensation, dimming prospects for a deal to reopen the Strait of Hormuz. Iran also insists the US lift sanctions, while Trump said Iran must pay for \"all of the people that they have killed\". Brent settled up 4.99 per cent at US$87.72 a barrel and WTI up 5.05 per cent at US$82.13, the biggest percentage gains since Jul 29. Both benchmarks had fallen more than 7 per cent last week on hopes of an Iran-Oman deal. Houthis said they struck Saudi Aramco's Jazan refinery, whose 400,000-bpd restart was delayed to Aug 30. US Strategic Petroleum Reserve stocks fell to 298.7 million barrels, the lowest since January 1983.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/Oil%20climbs%205%20as%20Iran,%20US%20both%20demand%20compensation%20and%20Hormuz%20hopes%20fade.pdf"}, {"id": "bt-10", "title": "Prabowo taps Destry Damayanti as chief of Bank Indonesia to calm markets", "source": "BT", "date": "11 Aug 2026", "tags": ["Southeast Asia", "Finance & Markets"], "summary": "Indonesian President Prabowo Subianto nominated Destry Damayanti as sole candidate to head Bank Indonesia, a move to calm markets after Perry Warjiyo unexpectedly resigned in late July amid friction with the president. The rupiah extended gains after the Aug 10 announcement, strengthening 0.7 per cent against the US dollar to a one-month high and outperforming Asian peers. Destry, 62, the current acting governor and a senior deputy governor since 2019, was considered a front runner for her market credibility. Parliament, controlled by Prabowo's coalition, could consider candidates from Friday and is expected to approve swiftly. Analysts said the pick ensures policy continuity and eases central-bank independence concerns, with some expecting more dovish, liquidity-supportive policy under her.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/Prabowo%20taps%20Destry%20Damayanti%20as%20chief%20of%20Bank%20Indonesia%20to%20calm%20markets.pdf"}, {"id": "bt-11", "title": "Singapore raises 2026 growth forecast to 4.5-5.5%; Q2 growth revised up to 5.9%", "source": "BT", "date": "11 Aug 2026", "tags": ["Southeast Asia", "Technology & AI"], "summary": "Singapore's government upgraded its 2026 growth forecast to 4.5-5.5 per cent, up from 2-4 per cent, as an accelerating global AI investment boom lifts the trade-reliant economy. The Ministry of Trade and Industry said on Aug 11 the economy grew 6.1 per cent in the first half, with Q2 GDP revised up to 5.9 per cent from an advance 5.7 per cent estimate. Manufacturing surged 12.5 per cent on AI-related semiconductor demand; wholesale trade rose 8.3 per cent and finance 6.2 per cent, while F&B services contracted 1.5 per cent. MTI said fallout from the US-Israel-Iran conflict proved less severe than feared. Permanent secretary Beh Swan Gin dismissed over-reliance on AI and said the 12.5 per cent US tariff would not significantly hit Singapore.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/Singapore%20raises%202026%20growth%20forecast%20to%204.5-5.5%20Q2%20growth%20revised%20up%20to%205.9.pdf"}, {"id": "bt-12", "title": "Singapore's sovereign wealth funds are betting big on AI, but the central bank isn't so sure", "source": "BT", "date": "11 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Within three weeks in July, Temasek, GIC and MAS delivered divergent verdicts on AI. Temasek posted a record S$518 billion portfolio and 10.5 per cent return, planning to more than double AI exposure to up to 15 per cent by 2031 while building cash-yielding infrastructure and private credit. GIC lifted equities weighting to 56 per cent, named AI a core theme spanning enablers, monetisers and adopters, and backed Anthropic, Ramp and Eli Lilly while parking US$30 billion in hedge funds. MAS managing director Chia Der Jiun flagged the AI boom's sustainability as the biggest uncertainty facing an otherwise calm financial system. Up to 50 per cent of the three funds' returns flow to the budget via the NIRC, the government's largest revenue source.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/Singapore's%20sovereign%20wealth%20funds%20are%20betting%20big%20on%20AI,%20but%20the%20central%20bank%20isn't%20so%20sure.pdf"}, {"id": "bt-13", "title": "Sony, TSMC to invest US$6.4 billion in Japanese sensor plant: source", "source": "BT", "date": "11 Aug 2026", "tags": ["Technology & AI"], "summary": "Sony Group and TSMC are in talks to spend a combined one trillion yen (US$6.4 billion) on their planned image sensor factory in Japan, a person familiar said. The partners aim to begin production in 2029, though no time frame was given for the investment. TSMC and Sony Semiconductor Solutions are targeting demand for AI-wielding robots and self-driving cars, which need more sensors; in May they announced preliminary talks to add production lines within Sony's existing Kumamoto factory. An analyst called it a \"virtually risk-free investment\" that lowers Sony's capital burden while securing steady revenue for TSMC. Sony's shares rose as much as 2.2 per cent and TSMC's 1.7 per cent. Sony will control the new venture, with Japan's government considering financial support.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/Sony,%20TSMC%20to%20invest%20US6.4%20billion%20in%20Japanese%20sensor%20plant%20source.pdf"}, {"id": "bt-14", "title": "To avoid a 'graveyard of pilots', Seatrium gives AI projects 3 months to deliver", "source": "BT", "date": "11 Aug 2026", "tags": ["Technology & AI", "Southeast Asia"], "summary": "Seatrium gives selected AI proof-of-concepts just three months to show measurable business value before they are advanced to deployment or discontinued, an approach designed to avoid becoming a \"graveyard of pilots\", said digital SVP Lee Wey Lii. Success is measured not by pilots launched but by projects reaching live operations; pilots do not count toward the digital team's KPI. One workflow using OCR and AI to match equipment tags against engineering diagrams cut a 50-man-day task to two. Seatrium runs an AI council chaired by CEO Chris Ong, a shipyard \"digital twin\" on on-premise GPUs, and works with about 100 people on digital initiatives. Cybersecurity remains Lee's biggest concern. First-half net profit surged 158.3 per cent to S$372.9 million.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/To%20avoid%20a%20'graveyard%20of%20pilots',%20Seatrium%20gives%20AI%20projects%203%20months%20to%20deliver.pdf"}, {"id": "bt-15", "title": "Trump downplays talks with Warsh amid Fed independence doubts", "source": "BT", "date": "11 Aug 2026", "tags": ["Politics", "Finance & Markets"], "summary": "President Donald Trump played down the frequency of his conversations with Federal Reserve Chairman Kevin Warsh, raising fresh questions about whether he is seeking to directly influence the central bank. Trump insisted on Aug 10 he had spoken to Warsh only once \"briefly\" since Warsh joined the Fed, despite his own advisers and people familiar saying the talks occurred more often. National Economic Council director Kevin Hassett said last week the pair discuss the economy \"all the time\", though others described the calls as irregular. Trump hinted at his long-running desire for lower interest rates but said he backs Warsh \"100 per cent\", chalking up policy decisions to the Fed's board. Warsh was confirmed in May.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/Trump%20downplays%20talks%20with%20Warsh%20amid%20Fed%20independence%20doubts.pdf"}, {"id": "bt-16", "title": "Trump makes sweeping new demands on Iran as deal hopes dim", "source": "BT", "date": "11 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "President Trump made sweeping new demands on Iran after Teheran reiterated requests for reparations, dimming hopes of a quick deal to reopen the Strait of Hormuz as oil surged. Trump said he is \"demanding compensation from Iran\" for people killed and wounded, later expanding it to damages in Lebanon, Syria, Yemen and Gaza. The demands, almost certain to be rejected, come despite a June 14-point MOU that detailed a US$300 billion fund for Iran's post-war rehabilitation. Brent rose about 5 per cent to near US$88 a barrel; European diesel surged more than 10 per cent. Iran named hard-liner Mohsen Rezaee to head its Supreme National Security Council. Iran ties Hormuz's reopening to lifting the US naval blockade and compensation.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/Trump%20makes%20sweeping%20new%20demands%20on%20Iran%20as%20deal%20hopes%20dim.pdf"}, {"id": "bt-17", "title": "UK announces nearly £130 million funding for zero-emission vehicle technology", "source": "BT", "date": "11 Aug 2026", "tags": ["Environment", "Technology & AI"], "summary": "The British government announced nearly £130 million (US$175 million) in funding for zero-emission vehicle technologies on Aug 10, with almost £65 million in public money and the rest from industry. Nearly £50 million in government funding will go to auto firms and research partners to develop and scale zero-emission vehicle technologies, while a further £17 million is being injected into nine connected and automated mobility projects covering sensors, brake-by-wire systems and AI simulation. \"Britain invented the modern motor industry,\" Industry Minister Blair McDougall said, vowing the next generation of vehicles is designed and built there. Britain is committed to ending sales of new petrol- or diesel-only cars from 2030, with all new cars zero-emission by 2035.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/UK%20announces%20nearly%20130%20million%20funding%20for%20zero-emission%20vehicle%20technology.pdf"}, {"id": "bt-18", "title": "US dollar steadies after payrolls drop, yen falls", "source": "BT", "date": "11 Aug 2026", "tags": ["Finance & Markets"], "summary": "The US dollar steadied at a near two-month low on Aug 10 following Friday's soft jobs data, as investors awaited this week's inflation report for Fed clues. July data showed the US unexpectedly shed jobs with prior months revised sharply lower, cooling rate-hike expectations; futures put the chance of a September move at about 48 per cent, down from 67 per cent a week earlier. The euro was little changed at US$1.1555 and sterling steady at US$1.3501. The yen weakened 0.6 per cent to 158.89 per dollar, near its biggest daily drop in five months, after speculators slashed bearish bets by the most in over 12 years amid Japan-US intervention. The dollar index held at 99.70; Brent rose above US$85.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/US%20dollar%20steadies%20after%20payrolls%20drop,%20yen%20falls.pdf"}, {"id": "bt-19", "title": "Why Asean matters more than ever to the UK and Singapore", "source": "BT", "date": "11 Aug 2026", "tags": ["Trade", "Geopolitics"], "summary": "In this commentary marking Asean Day, the Acting British High Commissioner to Singapore argues the bloc matters more than ever to UK-Singapore ties. Three years after the UK-Singapore Strategic Partnership and five years as an Asean Dialogue Partner, bilateral trade tops S$48 billion and Singaporean investment in the UK nears S$590 billion. Singapore serves as a gateway to Asean's 680-million-person market, amplified by the UK's CPTPP accession; UK-Asean trade grew more than 17 per cent in a year. Cooperation spans defence via the Five Power Defence Arrangements, cyber defence, and green finance, including the Financing Asia's Transition Partnership aiming to mobilise up to S$7 billion. Singapore assumes the Asean chairmanship in 2027.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/Why%20Asean%20matters%20more%20than%20ever%20to%20the%20UK%20and%20Singapore.pdf"}, {"id": "scmp-01", "title": "AgiBot overtakes Unitree as top global humanoid robot vendor in first half amid IPO push", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Research firm Smart Analytics Global says China's AgiBot overtook Unitree to become the world's largest humanoid robot vendor in the first half of 2026, capturing 44 per cent of the market after shipping roughly 8,400 units, a 562 per cent year-on-year surge. Hangzhou's Unitree slipped to second with 5,900 units and 31 per cent share, concentrated in its G1 model. Both firms are racing to list: Unitree priced its Shanghai Star Market IPO at 150.8 yuan to raise about 6.1 billion yuan (US$904 million), while AgiBot pursues a Hong Kong listing. Global humanoid shipments jumped 272 per cent to about 19,100 units, with Chinese makers supplying over 97 per cent. Industrial and commercial uses drove more than 70 per cent of demand.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/AgiBot%20overtakes%20Unitree%20as%20top%20global%20humanoid%20robot%20vendor%20in%20first%20half%20amid%20IPO%20push.pdf"}, {"id": "scmp-02", "title": "As China ups its basic research game, the US will have to look sharp", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "This opinion piece argues the Beidaihe summer retreat's guest list of scientists signals Beijing's strategic focus on basic research amid intensifying competition with the US. Party secretariat member Cai Qi greeted invited academics working in cutting-edge fields, while Premier Li Qiang signed revised intellectual property rules targeting chip design security. Nominal figures show the US spent US$993 billion on R&D in 2024 versus China's US$551 billion in 2025, but on purchasing-power-parity terms China reached parity in 2024 at about US$1.03 trillion. The White House's 2027 budget proposes a 4 per cent cut to non-defence R&D while raising defence R&D nearly 80 per cent. China produces 3.57 million STEM graduates annually against fewer than 820,000 in the US, and returning Chinese talent increasingly benefits Beijing.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/As%20China%20ups%20its%20basic%20research%20game,%20the%20US%20will%20have%20to%20look%20sharp.pdf"}, {"id": "scmp-03", "title": "As mainland China tightens its tax rules, can Hong Kong remain a magnet for billionaires?", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "As Beijing tightens offshore tax rules, analysts weigh whether Hong Kong can remain a magnet for the wealthy. In late July China said offshore trusts with mainland beneficiaries would face a 20 per cent personal income tax on gains dating to 2023, with a 90-day grace period for voluntary reporting. The city last year overtook Switzerland as the world's largest cross-border wealth hub, holding US$2.95 trillion, with over 60 per cent from mainland flows. Some fear disrupted capital flows, but Peking University's Tian Xuan said compliance would enhance long-term credibility. Hong Kong housed 76 billionaires worth US$328 billion in 2025 versus the mainland's 470 worth US$1.77 trillion. AI-driven IPOs are minting new tech fortunes the city hopes to keep serving.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/As%20mainland%20China%20tightens%20its%20tax%20rules,%20can%20Hong%20Kong%20remain%20a%20magnet%20for%20billionaires.pdf"}, {"id": "scmp-04", "title": "Can CATL's battery breakthrough push flying cars closer to a commercial reality in China?", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Technology & AI", "Energy"], "summary": "CATL, the world's largest EV battery maker, has backed flying cars after its aviation battery system cleared a major safety test verified by the Civil Aviation Administration of China. The Fujian-based firm said the pack is ready for mass production and will first power its Autoflight vehicles, using prismatic cells that isolate individual cells to stop heat spreading, with an energy density of 350 watt-hours per kilogram, 50 per cent above typical car batteries. China leads the eVTOL and \"low-altitude economy\" push, with seven manufacturers expected to begin deliveries this year. CATL led the global EV battery market with a 40.2 per cent share in early 2026, while Chinese firms held 72.6 per cent of the market between January and May, according to SNE Research.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/Can%20CATL's%20battery%20breakthrough%20push%20flying%20cars%20closer%20to%20a%20commercial%20reality%20in%20China.pdf"}, {"id": "scmp-05", "title": "China hits US, Mexican pecans with preliminary anti-dumping curbs", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Trade", "Geopolitics"], "summary": "China's Ministry of Commerce issued a preliminary ruling that the US and Mexico dumped pecans into its market, harming domestic producers. It set provisional cash deposits of 54.3 per cent on American firms and 51.6 per cent on Mexican firms, with six cooperating Mexican companies receiving lower rates of 17.8 to 23 per cent; no US producer participated. Dumped imports rose a cumulative 104.56 per cent over the injury period while their price fell 9.15 per cent. Measures take effect Tuesday, with 10 days for comments. The probe, launched in September 2025, was widely seen as retaliation for Mexico's tariff hikes of up to 50 per cent on about 1,400 product categories, imposed under US pressure to curb Chinese goods entering via the back door.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/China%20hits%20US,%20Mexican%20pecans%20with%20preliminary%20anti-dumping%20curbs.pdf"}, {"id": "scmp-06", "title": "China is building nuclear reactors faster than the West. Can it keep up the pace?", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Energy", "Environment"], "summary": "China is building nuclear reactors far faster and cheaper than Western rivals, adding 27 operational units since 2016 versus just two in the US, aided by standardised Hualong One and CAP1000 designs and state-backed loans as low as 1.5 per cent that roughly halve the levelised cost to about US$42 per megawatt-hour. It operates 62 units (66.1GW) with 58 more under construction, targeting 110GW by 2030 and on track to overtake US capacity. Yet nuclear supplies only about 5 per cent of electricity, and coastal sites face physical limits. Beijing is pursuing next-generation fast-neutron and thorium molten-salt reactors for inland use, while remaining 80 to 90 per cent reliant on uranium imports. Analysts remain divided on fusion's distant commercial viability.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/China%20is%20building%20nuclear%20reactors%20faster%20than%20the%20West.%20Can%20it%20keep%20up%20the%20pace.pdf"}, {"id": "scmp-07", "title": "China moves to join Brazil's WTO fight over Trump's forced labour tariffs", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Trade", "Geopolitics"], "summary": "China has asked to join WTO consultations Brazil opened against US tariffs of up to 37.5 per cent, telling the trade body in Geneva it holds a substantial commercial interest. Beijing argued Washington could apply comparable measures to Chinese goods and reiterated its long-running challenge to Section 301 of the US Trade Act. Brazil requested consultations on July 27 (case DS646) over a 25 per cent duty tied to digital-trade and Pix payment probes and a 12.5 per cent duty from a forced-labour inquiry covering 60 economies including China. The duties hit more than 23 per cent of Brazil's US exports. A Brazilian source called China's move \"a signal of support,\" but noted the dispute stays largely political while the WTO appellate body remains paralysed.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/China%20moves%20to%20join%20Brazil's%20WTO%20fight%20over%20Trump's%20forced%20labour%20tariffs.pdf"}, {"id": "scmp-08", "title": "China's banks look to unload more than US$8.2b in bad credit-card loans", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Finance & Markets"], "summary": "China's commercial banks have accelerated disposals of non-performing credit-card loans, with about 130 notices this year seeking buyers for more than 55 billion yuan (US$8.2 billion) of troubled debt as the slowing economy squeezes asset quality and margins. GDP growth fell to 4.3 per cent in the second quarter from 5 per cent. Between July 2 and August 5, lenders including China Everbright, Shanghai Pudong Development and Ping An Bank announced 20 disposal projects worth about 20.9 billion yuan. Everbright's 10.82 billion yuan portfolio held 443,019 written-off loans. Platinum-card holders made up over 80 per cent of principal in some batches, which a researcher attributed to diluted card tiers rather than wealthy defaults. Bank non-performing loans reached 3.7 trillion yuan, a 1.51 per cent ratio.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/China's%20banks%20look%20to%20unload%20more%20than%20US8.2b%20in%20bad%20credit-card%20loans.pdf"}, {"id": "scmp-09", "title": "China's top AI is still trained on Nvidia chips. What is delaying a switch to local tech?", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "China's most advanced AI models are still trained on Nvidia chips because switching to domestic semiconductors remains prohibitively costly, industry sources say, undermining Beijing's self-sufficiency drive. Nvidia's CUDA platform is the industry standard, while Huawei's rival CANN architecture requires extensive code rewriting; one researcher estimated migrating to Ascend chips would add at least 50 per cent in time and cost. For open-source models like DeepSeek, moving to Ascend might take a few engineers an extra month, but a weights-only model such as Moonshot's Kimi K3 could need ten engineers over six months. Kimi K3 was reportedly trained on Nvidia Blackwell chips. Some teams use local silicon: Meituan's 1.6-trillion-parameter LongCat-2.0 ran on a 50,000-card domestic cluster.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/China's%20top%20AI%20is%20still%20trained%20on%20Nvidia%20chips.%20What%20is%20delaying%20a%20switch%20to%20local%20tech.pdf"}, {"id": "scmp-10", "title": "China, India and Pakistan's dangerous nuclear triangle just became more complicated", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Analysts say the new Mecca defence pact among Pakistan, Turkey and Saudi Arabia complicates the volatile China-India-Pakistan nuclear triangle, chiefly by strengthening Islamabad's strategic position. The deal treats an attack on one as an attack on all. Strategist Brahma Chellaney said it institutionalises Saudi capital, Turkish defence technology and Pakistani geography, adding uncertainty to India's crisis planning. A stronger Pakistan, China's closest partner, keeps Indian attention split between western and northern fronts, suiting Beijing. Farwa Aamer said a stable Pakistan serves China's economic and geopolitical interests. Former Indian foreign secretary Kanwal Sibal warned Pakistan may grow more emboldened. Others, including Husain Haqqani, called the pact \"more symbolic than substantive,\" noting the absence of a shared enemy among the signatories.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/China,%20India%20and%20Pakistan's%20dangerous%20nuclear%20triangle%20just%20became%20more%20complicated.pdf"}, {"id": "scmp-11", "title": "Despite geopolitical tensions, China's rare earth producers have profitable first half", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "China's rare earth producers reported strong first-half profits despite Beijing's use of the minerals as trade leverage against the US and Japan. Shenzhen-listed China Rare Earth Resources and Technology's net profit surged 46.53 per cent to 237 million yuan (US$35.1 million), while China Northern Rare Earth expects profit growth of 112.74 to 121.33 per cent. Trump announced more than US$2 billion in domestic mining investment to diversify supply and signed a July 20 order limiting defence procurement waivers for Chinese minerals, but prices kept climbing, with an industry index up 31.7 per cent since August 2025 on AI-driven demand. Daiwa's Dennis Ip said Western de-risking is not eroding Chinese earnings and may reinforce Beijing's pricing power given its processing and magnet dominance.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/Despite%20geopolitical%20tensions,%20China's%20rare%20earth%20producers%20have%20profitable%20first%20half.pdf"}, {"id": "scmp-12", "title": "Enterprise AI costs hit 2026 low driven by price wars, Chinese open-source models: research", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Business costs to run AI models fell to a 2026 low, Jefferies said, citing Silicon Data's index showing average inference prices of US$1.16 to US$1.18 per million tokens from August 6-8, down from US$2.04 in May. A global price war and cheap Chinese open-source tools drove the drop. OpenAI cut GPT-5.6 rates by up to 80 per cent, while DeepSeek's V4-Flash-0731 costs US$0.03 per task and captured over 27 per cent of OpenRouter volume, overtaking Google. Yet sustaining low prices is hard: newer models from DeepSeek, Zhipu, MiniMax and Moonshot cost more than earlier ones, Zhipu's GLM-5.2 now charges US$1.40 input and US$4.40 output, and DeepSeek warned of a \"significant\" enterprise price hike as its V4-Flash strains server capacity.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/Enterprise%20AI%20costs%20hit%202026%20low%20driven%20by%20price%20wars,%20Chinese%20open-source%20models%20research.pdf"}, {"id": "scmp-13", "title": "Hong Kong's commercial property investment growth beats peer Asia-Pacific markets", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Finance & Markets"], "summary": "Hong Kong's commercial property investment more than doubled to US$3.1 billion in the second quarter, a 129 per cent year-on-year jump that made it Asia-Pacific's fastest-growing market, beating Singapore (108 per cent) and Australia (82 per cent), JLL said. A low base, receivership sales and strong retail and office deals drove the rebound, lifting first-half growth to 90 per cent. Deals included the HK$611.4 million sale of 299 Queen's Road Central and Wee Hur Holdings' HK$748.8 million purchase of One Bedford Place. Prime office rents, down over 40 per cent from 2019 peaks, are edging up. Region-wide investment rose 38 per cent to US$45.5 billion. But higher rates loom: the one-month Hibor hit 2.61 per cent versus 0.95 per cent a year earlier.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/Hong%20Kong's%20commercial%20property%20investment%20growth%20beats%20peer%20Asia-Pacific%20markets.pdf"}, {"id": "scmp-14", "title": "How China DRAM champion CXMT's MSCI entry could lure fund inflows, cement its top ranking", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "ChangXin Memory Technologies (CXMT), China's biggest DRAM maker, joined the MSCI China All Shares Index on Monday, a move analysts said would spur passive-fund buying and could make it the mainland's most valuable stock and the index's second-largest constituent behind Tencent. MSCI fast-tracked the mega-IPO ten days after CXMT's July 27 debut, when shares jumped 466 per cent, valuing it at 3.4 trillion yuan (US$504 billion). Shares fell 4 per cent to 50.40 yuan on Monday. VanEck could add CXMT to its semiconductor ETF as early as September. UBS, initiating coverage, expects CXMT's global DRAM bit-supply share to rise to about 10 per cent by 2028 from 7 per cent, with data-centre revenue eventually exceeding half of total sales.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/How%20China%20DRAM%20champion%20CXMT's%20MSCI%20entry%20could%20lure%20fund%20inflows,%20cement%20its%20top%20ranking.pdf"}, {"id": "scmp-15", "title": "How long can the AI memory price boom last? Research suggests not much longer", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "A run-up in memory-chip stocks is faltering as price growth cools, raising doubts over the boom's durability even with robust AI demand. Morgan Stanley warned the memory cycle enters its late stage in the fourth quarter as increases moderate and inventories build; shares of Micron, SK Hynix and SanDisk have retreated. Bernstein said conventional DRAM contract prices may rise about 17 per cent in the third quarter, down sharply from roughly 65 per cent in April-June. Chinese producers add supply: CXMT plans to nearly double DRAM capacity to 466,000 wafer starts by 2028, while YMTC gains NAND share. Still, JPMorgan expects shortages to persist two more years, and UBS sees DRAM undersupplied until at least the second quarter of 2028.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/How%20long%20can%20the%20AI%20memory%20price%20boom%20last%20Research%20suggests%20not%20much%20longer.pdf"}, {"id": "scmp-16", "title": "How the guest list for Beijing's summer retreat reveals its tech priorities", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Politics", "Technology & AI"], "summary": "China
