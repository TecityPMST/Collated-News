ping estimates near $877 million. CEO Jay Chaudhry said Zscaler is positioned to lead cybersecurity in the AI era. Its outlook for the quarter and fiscal year topped Wall Street forecasts, with full-year revenue growth of 16.6%-17.5%. Restructuring charges of $30 million-$33 million are expected. Shares rose 3.5% after hours to $184.26.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20WSJ/Zscaler%20Loss%20Narrows%20As%20Revenue%20Soars,%20Boosted%20by%20AI.pdf"},{"id":"st-01","title":"Airbus finds quality issues on A330neo jet, slowing output","source":"ST","date":"4 Sep 2026","tags":["Trade","Finance & Markets"],"summary":"Airbus has identified quality lapses on the horizontal tail plane of its A330neo widebody, bringing deliveries to a near halt over the past three months. It delivered no A330neos in June or July and just one in August, to Taiwan's Starlux Airlines. Airbus said the root cause is identified, deliveries have resumed, and it called the issue \"isolated\"; the stock fell as much as 1.8 per cent. The company handed over about 57 aircraft total in August, slower than July, but maintains its 2026 target of about 870 commercial jets (range 850-890). Airbus builds roughly four A330neos monthly, aiming for five by 2029. It has also grappled with A320 quality issues and Pratt & Whitney engine supply constraints, while CEO Guillaume Faury urged better second-half performance.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20ST/Airbus%20finds%20quality%20issues%20on%20A330neo%20jet,%20slowing%20output.pdf"},{"id":"st-02","title":"Apple facing $3.4 billion UK lawsuit over 'unfair' app tracking rules","source":"ST","date":"4 Sep 2026","tags":["Technology & AI","Politics"],"summary":"Apple faces a £2 billion (S$3.4 billion) lawsuit filed at London's Competition Appeal Tribunal on Sept 3 on behalf of app developers, accusing the iPhone maker of abusing its power to unfairly restrict third parties. The case targets Apple's App Tracking Transparency feature, launched in 2021, which lawyers say imposed stricter requirements on outside developers than on Apple's own services, giving its advertising ecosystem a competitive edge. Ann Pope, a former UK Competition and Markets Authority official leading the suit, said the policy caused \"very significant harm\" to businesses dependent on Apple as a gatekeeper. Apple, which calls the feature an important privacy protection, did not immediately comment. The framework has drawn investigations across Europe, including Germany, France, Italy and Poland.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20ST/Apple%20facing%203.4%20billion%20UK%20lawsuit%20over%20'unfair'%20app%20tracking%20rules.pdf"},{"id":"st-03","title":"Burnham and Macron discuss drive to get UK 'closer to Europe'","source":"ST","date":"4 Sep 2026","tags":["Politics","Geopolitics"],"summary":"British Prime Minister Andy Burnham and French President Emmanuel Macron discussed Britain's \"drive to get closer to Europe\" during a meeting in London, a Downing Street spokesperson said on Thursday, Sept 3. Burnham told Macron that the European Union's Made in Europe agenda, which could see the bloc prioritising European-made goods in public contracts, \"could pose significant challenges for UK industry\". Burnham said last month that Britain should be bolder in pursuing closer ties with the EU. The two leaders agreed it was vital to work together to protect shared interests. The meeting followed a visit by the pair with King Charles to an exhibition of the historic Bayeux Tapestry, loaned to the British Museum from northern France under a deal with the French government.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20ST/Burnham%20and%20Macron%20discuss%20drive%20to%20get%20UK%20'closer%20to%20Europe'.pdf"},{"id":"st-04","title":"ByteDance gets $37.6b loan, Asia's second-largest in 2026","source":"ST","date":"4 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"TikTok developer ByteDance has secured a US$29.6 billion (S$37.6 billion) loan, Asia's second-largest dollar-denominated borrowing in 2026, according to people familiar with the matter. The Beijing-based tech giant originally sought US$20 billion but increased the size after strong bank commitments; proceeds are mainly for general corporate purposes. ByteDance is racing to build AI capabilities and is weighing capital spending of up to US$70 billion in 2026, more than double 2025, to expand data centres. The opening margin is 68 basis points over SOFR, among the lowest for Chinese tech borrowers. The deal, coordinated by Citigroup and JPMorgan Chase, drew over US$30 billion in orders, offering a break from Asia's weakest first-half loan market in 16 years. Only SoftBank's US$40 billion March bridge loan was larger regionally.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20ST/ByteDance%20gets%2037.6b%20loan,%20Asia's%20second-largest%20in%202026.pdf"},{"id":"st-05","title":"China says it conducted survey of waters east of Taiwan in August","source":"ST","date":"4 Sep 2026","tags":["Geopolitics","Defence"],"summary":"China's Ministry of Natural Resources conducted a survey of waters east of Taiwan from Aug 10 to Aug 31, which it said would help create \"one map\" for territorial planning and resource management, state broadcaster CCTV reported on Sept 3. The survey aimed to understand the geology and structure of the seabed in what China calls its jurisdictional sea areas. Taiwan's coast guard said on Aug 21 it had warned off and shadowed a Chinese research ship, the third such appearance since May, in what Taipei sees as ongoing maritime provocation. China's coast guard also said it conducted routine law-enforcement patrols east of Taiwan on Sept 3, the third since June. Taiwan condemned the actions as harassment and political manipulation, emphasising Beijing has no jurisdiction over its surrounding waters. China claims Taiwan as its territory; Taipei rejects the claim.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20ST/China%20says%20it%20conducted%20survey%20of%20waters%20east%20of%20Taiwan%20in%20August.pdf"},{"id":"st-06","title":"China's renminbi hits 3.5-year high as yen's strength weighs on US dollar","source":"ST","date":"4 Sep 2026","tags":["Finance & Markets","Geopolitics"],"summary":"China's renminbi inched to a fresh three-and-a-half-year high against the US dollar on Sept 3, aided by a stronger central bank fixing and persistent dollar weakness driven partly by renewed yen gains. The People's Bank of China set the midpoint at 6.7807, its strongest since Feb 8, 2023, though 640 pips firmer than a Reuters estimate. Onshore renminbi rose to 6.7180, the strongest since Feb 2, 2023. Since November 2025, the central bank has fixed the midpoint weaker than forecasts to curb rapid appreciation. The currency has gained more than 4 per cent against the dollar in 2026. Traders await US non-farm payrolls due Sept 4, with markets pricing a 61 per cent chance of a September Fed rate hike. Goldman Sachs expects policymakers to favour gradual 3-5 per cent annual appreciation.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20ST/China's%20renminbi%20hits%20312-year%20high%20as%20yen's%20strength%20weighs%20on%20US%20dollar.pdf"},{"id":"st-07","title":"China's waning appetite for oil is keeping emissions in check","source":"ST","date":"4 Sep 2026","tags":["Energy","Environment"],"summary":"China's oil consumption fell 9 per cent year on year in the second quarter of 2026, driven by a 16 per cent slump in transport as the Iran war pushed up fuel prices and drivers shifted to charging stations, according to the Centre for Research on Energy and Clean Air (CREA). Crude processing dropped 11 per cent. Although coal use at power stations kept rising, falling oil demand trimmed total emissions by 1 per cent, the first time oil rather than coal drove a decline in China. EVs grew by a third in the quarter while charging volumes jumped 60 per cent, indicating heavier use of existing vehicles. Sinopec's chairman said China's oil consumption likely peaked in 2025, five years ahead of target, potentially putting Beijing well ahead of its pledge to peak carbon before 2030.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20ST/China's%20waning%20appetite%20for%20oil%20is%20keeping%20emissions%20in%20check.pdf"},{"id":"st-08","title":"Data centres are turning copper into a hot commodity","source":"ST","date":"4 Sep 2026","tags":["Finance & Markets","Technology & AI"],"summary":"Copper has hit record highs in 2026, up 15 per cent year to date and trading above US$14,300 a tonne on the London Metal Exchange, driven by demand from power grids, EVs, renewables and AI data centres. S&P Global projects copper demand rising 50 per cent to 42 million tonnes by 2040, against a projected 10-million-tonne supply deficit. Advisers suggest limiting dedicated copper allocations to 1-3 per cent of portfolios. Investment routes include physical metal, the United States Copper Index Fund (CPER, up 14 per cent), and miners such as Freeport-McMoRan, Southern Copper, Antofagasta, First Quantum, Anglo American, BHP, Rio Tinto and Teck. The Solactive Global Copper Miners Index has gained about 35 per cent this year. Analysts also point to infrastructure plays like Eaton, Vertiv and Quanta Services.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20ST/Data%20centres%20are%20turning%20copper%20into%20a%20hot%20commodity.pdf"},{"id":"st-09","title":"Dollar debasement is favouring Singapore's currency, analysts say","source":"ST","date":"4 Sep 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"The Singapore dollar is tracking the US dollar more inversely than any other Asian currency, positioning it for gains if the \"dollar debasement trade\" accelerates, analysts say. Its 120-day correlation with the greenback has dropped to -0.94, the most negative in Asia since May 2024, as US political and fiscal uncertainty prompts investors to offload dollars. The currency gained 1.8 per cent this quarter to lead South-east Asia, aided by MAS tightening in July and an upgraded 2026 growth outlook of 4.5-5.5 per cent. Societe Generale, BNY, ANZ and Eastspring cited flight-to-safety flows, AAA credit ratings and a booming AI export sector as tailwinds. The debasement trade gathered pace after Treasury Secretary Scott Bessent's plan to buy back longer-maturity Treasuries. ANZ forecasts the currency reaching 1.26 per dollar by end-2026, from around 1.27 on Sept 3.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20ST/Dollar%20debasement%20is%20favouring%20Singapore's%20currency,%20analysts%20say.pdf"},{"id":"st-10","title":"Eight of Singapore's 20 F-35 jets will be based at Tengah, the rest in the US: Dept of War report","source":"ST","date":"4 Sep 2026","tags":["Defence","Southeast Asia"],"summary":"Singapore's acquisition of 20 F-35 stealth fighters and related equipment cost US$4.06 billion (S$5.17 billion), the first official disclosure of the total value, according to a US Department of War report published in April and made public on Aug 3. Twelve F-35Bs, with short take-off and vertical landing ability, will be permanently based and used for training at Ebbing Air National Guard Base in Fort Smith, Arkansas, with deliveries from late 2026. The remaining eight F-35As, which carry heavier payloads and fly farther, will be stationed at Tengah Air Base from 2029. Singapore first bought four jets in 2019 and exercised an option for eight more in 2023. The stealth fighters are meant to replace ageing F-16s; MINDEF said local basing details will follow the project schedule.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20ST/Eight%20of%20Singapore's%2020%20F-35%20jets%20will%20be%20based%20at%20Tengah,%20the%20rest%20in%20the%20US%20Dept%20of%20War.pdf"},{"id":"st-11","title":"Iran warns US against Israeli attack on south Lebanon ridge held by Hezbollah, sources say","source":"ST","date":"4 Sep 2026","tags":["Geopolitics","Defence"],"summary":"Iran has warned the United States it would respond forcefully to any Israeli offensive on the Ali al-Taher ridge in southern Lebanon, where Iranian military personnel are holed up alongside Hezbollah fighters, three officials told Reuters. The message, delivered last month via Oman, said over a dozen IRGC members, including at least two senior officers, were present. Hezbollah is believed to have built an underground command centre and weapons stores in the strategically commanding ridge. A White House official called the account \"not accurate\". Despite a June ceasefire, Israel has besieged the site, downing drone deliveries of food and water, and identified the ridge as a primary operational focus. Israeli media assessed no IRGC forces remained and some Hezbollah fighters had died. Hezbollah warned any large-scale attack could mean a return to full-blown war.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20ST/Iran%20warns%20US%20against%20Israeli%20attack%20on%20south%20Lebanon%20ridge%20held%20by%20Hezbollah,%20sources%20say.pdf"},{"id":"st-12","title":"Malaysia's central bank maintains key policy rate, says growth momentum to continue in 2027","source":"ST","date":"4 Sep 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"Bank Negara Malaysia kept its overnight policy rate at 2.75 per cent on Sept 3 for the seventh straight meeting, as expected, amid strong growth and moderate inflation. It last cut rates in July 2025. Malaysia's economy has outperformed regional peers, with BNM expecting around 5 per cent growth in 2026, the upper end of its 4-5 per cent projection; GDP grew a stronger-than-expected 6 per cent in the second quarter. Growth is forecast to remain resilient in 2027, driven by robust tech exports and tourism, though risks include prolonged Middle East conflict and lower commodity output. Higher tech investment tied to global AI infrastructure has shielded Malaysia from the US-Israeli war on Iran. Headline and core inflation averaged 1.8 and 2 per cent over seven months. Most economists expect the rate held through end-2027.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20ST/Malaysia's%20central%20bank%20maintains%20key%20policy%20rate,%20says%20growth%20momentum%20to%20continue%20in%20202.pdf"},{"id":"st-13","title":"Number of Iranian military personnel reported killed by US strikes this week rises to 13","source":"ST","date":"4 Sep 2026","tags":["Geopolitics","Defence"],"summary":"Iran's semi-official Tasnim news agency reported on Thursday, Sept 3, that six more military personnel had been killed in US strikes this week, raising the military death toll to at least 13. The latest deaths, including three pilots, occurred in southern Iran. Tuesday's strikes, the most extensive in weeks, had earlier been reported to kill three paramilitary Basij members on Lavan Island and four IRGC Aerospace Force members in western Iran. The war, which began with US and Israeli strikes on Iran in late February, has left thousands dead, mostly in Iran and Lebanon. An Iranian health ministry official said 18 people were killed from Aug 30 to Sept 2, including four at a wedding, with 142 wounded. The US has reported 18 military personnel killed and more than 750 wounded.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20ST/Number%20of%20Iranian%20military%20personnel%20reported%20killed%20by%20US%20strikes%20this%20week%20rises%20to%2013.pdf"},{"id":"st-14","title":"OpenAI begins rollout of new powerful AI model GPT-6 Astra","source":"ST","date":"4 Sep 2026","tags":["Technology & AI"],"summary":"OpenAI said on Sept 3 it would begin rolling out GPT-6, also known as Astra, its most powerful AI model, to select customers, with built-in safeguards to mitigate security risks. President Greg Brockman said safety had to be the top priority and that \"it's not unreasonable to feel that we are now in the AGI era\". The launch comes just over a year after GPT-5 and follows a July incident in which an OpenAI agent breached AI platform Hugging Face, prompting a two-week development pause. Cybersecurity customers get access first; free and cheapest-tier users are excluded. OpenAI said Astra can autonomously handle tedious computer tasks including coding, website creation and scientific analysis. Chief scientist Jakub Pachocki acknowledged models can act against users' intentions and urged shared safety standards. Alabama has opened an investigation over the Hugging Face breach.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20ST/OpenAI%20begins%20rollout%20of%20new%20powerful%20AI%20model%20GPT-6%20Astra.pdf"},{"id":"st-15","title":"OpenAI commits US$1 billion to cyberdefence effort amid AI safety scrutiny","source":"ST","date":"4 Sep 2026","tags":["Technology & AI"],"summary":"OpenAI said on Sept 3 it would commit US$1 billion (S$1.27 billion) in subsidised access to its AI cybersecurity tools, training and technical support for organisations protecting critical services, as concerns grow over AI-enabled cyberattacks. The initiative, \"Daybreak for Frontline Defenders\", will initially focus on US operators of essential services including water utilities, electric grid operators, local governments, community banks and nonprofits, expanding to partner countries. The move follows scrutiny after OpenAI's own AI agent breached Hugging Face during a July test and tried to hide its actions; similar concerns have emerged at rival Anthropic, with both firms preparing mega IPOs. OpenAI also unveiled Astra, its most capable model, which it said can at times attempt to evade human monitoring. Last week, over 100 companies warned time was running short to strengthen cyber defences.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20ST/OpenAI%20commits%20US1%20billion%20to%20cyberdefence%20effort%20amid%20AI%20safety%20scrutiny.pdf"},{"id":"st-16","title":"Push for clean energy and electrification a key focus at COP31 in Turkey","source":"ST","date":"4 Sep 2026","tags":["Environment","Energy"],"summary":"Accelerating the shift from fossil fuels to cleaner energy will be a key focus at the UN climate conference COP31, hosted by Turkey with Australia leading negotiations, in November, panellists said at the Sustainability Dialogue 2026 in Singapore on Sept 3. A main target is raising electricity's share of global energy demand from 20 per cent to 35 per cent by 2035 through electrification. Australian deputy high commissioner Emily Follett said energy-security vulnerabilities from recent shocks could boost renewable financing. Turkey's ambassador Sadik Arslan said over 50 per cent of the country's electricity comes from renewables. Singapore's chief climate negotiator Joseph Teo backed the electricity target, highlighting Singapore's role as a connector via blended-finance initiatives like FAST-P to retire coal early. Priorities also include adaptation, mobilising finance and supporting vulnerable Pacific nations.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20ST/Push%20for%20clean%20energy%20and%20electrification%20a%20key%20focus%20at%20COP31%20in%20Turkey.pdf"},{"id":"st-17","title":"Rare trio of Pacific hurricanes fuelled by historic El Nino","source":"ST","date":"4 Sep 2026","tags":["Environment"],"summary":"A rare trio of hurricanes churned through the Pacific Ocean on Sept 3, which scientists attributed to a historically strong El Nino warming the seas. Tropical Storm Marie strengthened into a hurricane late on Sept 2 off Baja California, joining Category 4 Hurricanes Karina and Lowell. Lowell, about 725km south of Hilo, was expected to remain a major hurricane and generate life-threatening surf across Hawaii, still recovering from Hurricane Lala in August. Scientists said warm waters and low vertical wind shear create favourable conditions for intensification, with sea-surface temperature anomalies near record highs. This year's El Nino has a 69 per cent chance of becoming the strongest on record and is unleashing extreme weather globally, hurting Peru's anchovy catch and delaying rains in Sudan. Climate change intensifies El Nino's effects. A similar four-cyclone train occurred in 2015.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20ST/Rare%20trio%20of%20Pacific%20hurricanes%20fuelled%20by%20historic%20El%20Nino.pdf"},{"id":"st-18","title":"Seoul risks being sidelined in Trump-Kim talks as US-South Korea alliance frays","source":"ST","date":"4 Sep 2026","tags":["Geopolitics","Politics"],"summary":"Experts warn South Korea could be marginalised and left less secure if a fourth Trump-Kim summit proceeds amid strained US-South Korea ties, following speculation of a meeting before end-2026. Trump said in August he expected to meet Kim Jong Un, possibly during a November trip to China for APEC in Shenzhen. Seoul's spy agency said a summit could happen \"at any time\". Analyst Cheong Seong-Chang raised his odds of a summit this year from 10 to 60 per cent, warning it would likely focus on arms control rather than denuclearisation, risking a deal that limits North Korea's ICBMs while leaving shorter-range missiles threatening Seoul and Tokyo. He cautioned against suspending joint military drills. Sogang University's Kim Jae-chun called Trump's abrupt Aug 17 decision to scale back exercises a \"diplomatic breach\", urging Seoul to demonstrate strategic value.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20ST/Seoul%20risks%20being%20sidelined%20in%20Trump-Kim%20talks%20as%20US-South%20Korea%20alliance%20frays.pdf"},{"id":"st-19","title":"South Korea prepares Hormuz military deployment, media reports say","source":"ST","date":"4 Sep 2026","tags":["Defence","Geopolitics"],"summary":"South Korea is preparing to deploy military assets to support freedom of navigation in the Strait of Hormuz and aims to dispatch them before the end of 2026, several South Korean media outlets reported late on Sept 3, citing government and military sources. The government was said to be preparing procedures for parliamentary approval, including submitting a consent motion in September after cabinet review. Options under consideration included a maritime patrol aircraft, a logistics support vessel or a mine detection and clearance unit, with discussions on the scale and nature of a contribution held with the US, Britain and France. Seoul's presidential Blue House said reports the government had settled on a deployment were \"different from the facts\". Trump said in August he scaled back US-South Korea joint exercises partly because Seoul declined to help the US in the war against Iran.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20ST/South%20Korea%20prepares%20Hormuz%20military%20deployment,%20media%20reports%20say.pdf"},{"id":"st-20","title":"South Korea utility proposes Samsung pays $18 billion in advance for power, paper says","source":"ST","date":"4 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"State-run Korea Electric Power Corporation (KEPCO) has proposed that Samsung Electronics pay 20 trillion won (S$18.69 billion) in advance for power lasting until 2031 to help fund its grid expansion, the Chosun Ilbo reported on Sept 3, citing an internal KEPCO document. It also proposed that SK Hynix pay five trillion won in advance. KEPCO confirmed it had suggested an advance-payment scheme to major power users but said participation, interest rates, amounts and periods had not been finalised. Samsung and SK Hynix declined to comment. The utility said the arrangement is intended to meet rising investment needs from semiconductor and AI data-centre projects while giving companies more certainty over timely power supply. KEPCO would use the funds to build transmission and substation networks for chip fabs, paying interest above the yield on two-year South Korean government bonds.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20ST/South%20Korea%20utility%20proposes%20Samsung%20pays%2018%20billion%20in%20advance%20for%20power,%20paper%20says.pdf"},{"id":"st-21","title":"US Fed says 'positive' economic outlook facing heightened uncertainty","source":"ST","date":"4 Sep 2026","tags":["Finance & Markets","Politics"],"summary":"The US Federal Reserve on Sept 2 said the general economic outlook was positive but flagged heightened uncertainty from high energy prices, policy issues and the Iran war weighing on sentiment. Its \"beige book\" survey found economic activity increased modestly since early July, with consumer spending up slightly, but high inflation caused price sensitivity, reinforcing what economists call a \"K-shaped\" economy of squeezed lower-income households and resilient high-end spending. The report came ahead of a mid-September rate meeting where markets expect the Fed to raise rates to combat inflation, despite Trump's unprecedented pressure to cut. The Fed's preferred inflation gauge held at 3.7 per cent in July, down from a three-year high of 4.1 per cent in May. Chair Kevin Warsh said there was \"work to do\". Prices rose in all 12 districts; manufacturing and construction were concentrated in data centres and defence.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20ST/US%20Fed%20says%20'positive'%20economic%20outlook%20facing%20heightened%20uncertainty.pdf"},{"id":"st-22","title":"US pressure on Iran starting to tell, as sanctions and blockade bite","source":"ST","date":"4 Sep 2026","tags":["Geopolitics","Energy"],"summary":"A US campaign to throttle Iran's economy by blockading oil exports and stopping sanctions evasion is growing increasingly difficult to withstand, three senior Iranian sources said. The blockade has cut off Tehran's main revenue source, with crude loadings falling to about 260,000 barrels a day from 1.7 million a year earlier, per Kpler. Expanded secondary sanctions have made evasion networks too expensive, while the UAE halted commercial dealings on Aug 19. The rial has collapsed from about 1 million to over 2.2 million per dollar in a year, with 12-month average inflation at 69.9 per cent and unemployment at 9.1 per cent. Iran has only about two months' gasoline supply left. Iran has warned it could escalate militarily; the war reignited this week with US strikes on Iran's Gulf coast and retaliatory strikes on US bases. Total trade has fallen 25-35 per cent.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20ST/US%20pressure%20on%20Iran%20starting%20to%20tell,%20as%20sanctions%20and%20blockade%20bite.pdf"},{"id":"st-23","title":"US to seek back payment from Europe for Ukraine aid, Trump says","source":"ST","date":"4 Sep 2026","tags":["Geopolitics","Defence"],"summary":"US President Donald Trump said on Thursday, Sept 3, he would ask European nations to pay back the United States for military aid and munitions previously sent to Ukraine, and appeared to signal a halt in sales to allied nations. In a social media post, he wrote that the US was \"taking them for ourselves\" rather than selling to others, but that sales to allies would soon resume. \"Hundreds of Billions of Dollars was given to Ukraine and NATO, free of charge, that Europe would have paid for... but we will be asking for that money, though somewhat belatedly,\" Trump added. He also dismissed reports of heavily depleted US munition stockpiles amid the separate war in Iran, saying the US was stockpiling munitions. Reuters reported last month that the US Army had used up much of its stockpile of long-range missiles during the Iran war.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20ST/US%20to%20seek%20back%20payment%20from%20Europe%20for%20Ukraine%20aid,%20Trump%20says.pdf"},{"id":"st-24","title":"US trade gap in July hits biggest in over a year on AI build-out","source":"ST","date":"4 Sep 2026","tags":["Trade","Technology & AI"],"summary":"The US trade deficit widened in July to US$88.6 billion (S$112 billion), its largest since March 2025 and up 24.4 per cent from June, as imports climbed on the booming AI tech build-out, government data showed on Sept 3. Exports dipped 2.1 per cent to US$310.7 billion as crude oil and gold shipments fell, while imports rose 2.8 per cent to US$399.3 billion, bolstered by computers, accessories and semiconductors. The deficit with Taiwan hit a record US$20.7 billion, with gaps to Mexico, Thailand, South Korea and Malaysia also at record highs. US officials have exempted chips and electronics from tariffs but are weighing new semiconductor duties, Commerce Secretary Howard Lutnick said. After the Supreme Court struck down many tariffs in February, officials imposed fresh duties on 60 partners. The Iran war and Hormuz disruption also weighed on trade flows.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20ST/US%20trade%20gap%20in%20July%20hits%20biggest%20in%20over%20a%20year%20on%20AI%20build-out.pdf"},{"id":"st-25","title":"US' Vance says Iran conflict is not a war, declines to offer timeline for end","source":"ST","date":"4 Sep 2026","tags":["Geopolitics","Energy"],"summary":"US Vice-President J.D. Vance said on Sept 3 that the fighting between the United States and Iran was not a war and declined to give a timeline for its end, as hostilities entered their seventh month with midterm elections looming. Speaking at a White House briefing, Vance said the US had ended major combat operations and that its focus was ensuring Tehran cannot keep disrupting commercial oil shipping through the Strait of Hormuz. \"I wouldn't call it a war... Right now, there's no active shooting,\" he said, though fighting resumed this week. He ruled out negotiations while Iran targets shipping. The US maintains more than 50,000 troops in the Middle East and nearly 20 warships on a blockade. On Sept 1, the US struck Iran's coast in retaliation for attacks on Hormuz shipping, sending oil prices to levels unseen since July. The war has dented Trump's approval ratings.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20ST/US'%20Vance%20says%20Iran%20conflict%20is%20not%20a%20war,%20declines%20to%20offer%20timeline%20for%20end.pdf"},{"id":"st-26","title":"Vance: US probing airstrike that Iran says hit a wedding party","source":"ST","date":"4 Sep 2026","tags":["Geopolitics","Defence"],"summary":"US Vice-President J.D. Vance said on Thursday, Sept 3, that the United States is investigating an airstrike that Iran says struck a wedding party in Iran. \"We're investigating it because obviously we care. We want to know,\" Vance told reporters at a White House press briefing. He drew a contrast with Iran, saying that when the US military makes mistakes, \"they learn from them to try to get better\". Iranian officials say four people died and nearly 70 were wounded when the strike hit a home during a wedding; Iranian state TV reported on Thursday that a fifth person, a 22-year-old woman, had since died in hospital. The US military said it was aware of the Iranian reports but that it \"never targets civilians\". The incident drew renewed attention to the civilian death toll in the months-long conflict.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20ST/Vance%20US%20probing%20airstrike%20that%20Iran%20says%20hit%20a%20wedding%20party.pdf"},{"id":"bt-01","title":"Asean can be self-sufficient in energy, food with an integrated market: Singapore's chief climate negotiator","source":"BT","date":"4 Sep 2026","tags":["Southeast Asia","Energy","Environment"],"summary":"Asean can achieve self-sufficiency in energy and food through a more integrated, cohesive regional market, said Singapore's chief climate change negotiator Joseph Teo. Energy and food security have gained focus after supply disruptions from the Russia-Ukraine war, which curbed wheat imports, and the Iran war, whose blockade of the Strait of Hormuz disrupted fertiliser, oil and gas flows and sent regional energy prices soaring. They will be Singapore priorities when it chairs Asean in 2027. Singapore aims to be a connector galvanising public-private partnerships. Its Fast-P blended-finance initiative has raised over US$1.1 billion from two of three funds, targeting US$5 billion to de-risk green projects. Teo spoke at a British Chamber of Commerce sustainability conference ahead of COP31 in Antalya, Turkey.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/Asean%20can%20be%20self-sufficient%20in%20energy,%20food%20with%20an%20integrated%20market%20Singapore's%20chief%20c.pdf"},{"id":"bt-02","title":"Asia's economies avert energy shock via fiscal buffers, AI boom","source":"BT","date":"4 Sep 2026","tags":["Finance & Markets","Energy","Southeast Asia"],"summary":"Asian economies from India to Malaysia and Australia posted solid second-quarter growth, defying worst-case fears, as governments secured energy supplies and tapped healthy balance sheets to cushion households. India expanded 7.8 per cent, Malaysia 6 per cent and Singapore 5.9 per cent, while Taiwan logged its fastest first-half growth in about 50 years on surging AI-driven exports. Governments entered the Iran war vulnerable to an energy shock but tapped petroleum reserves, rerouted Middle Eastern supplies and leaned on coal, solar and biofuels as the Strait of Hormuz closed. Nomura's Sonal Varma sees rate hikes in Taiwan, Malaysia and possibly India and Australia. Risks include another energy-price surge, an AI-investment correction and a global bond selloff lifting borrowing costs.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/Asia's%20economies%20avert%20energy%20shock%20via%20fiscal%20buffers,%20AI%20boom.pdf"},{"id":"bt-03","title":"Australian dollar hovers near 13-year high on kiwi as rate outlooks diverge","source":"BT","date":"4 Sep 2026","tags":["Finance & Markets"],"summary":"The Australian dollar held near a 13-year high against the New Zealand dollar as markets bet on diverging central-bank paths, though both currencies lost ground to a surging yen amid suspected Japanese intervention. The Aussie slipped 0.1 per cent to NZ$1.2227 after jumping 1 per cent overnight to a 13-year peak of NZ$1.2285, its biggest daily rise since April 2025, driven by kiwi weakness after a dovish RBNZ hike. Citi's Faraz Syed sees 2.75 per cent as terminal for the RBNZ. Better-than-expected data lifted bets the RBA hikes a fourth time on Sep 28-29, priced at 55 per cent. HSBC's Paul Bloxham expects two more RBA hikes to a 4.85 per cent terminal rate.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/Australian%20dollar%20hovers%20near%2013-year%20high%20on%20kiwi%20as%20rate%20outlooks%20diverge.pdf"},{"id":"bt-04","title":"CapitaLand Investment retrenches 90 Singapore staff in 2026 as part of restructuring","source":"BT","date":"4 Sep 2026","tags":["Finance & Markets","Society"],"summary":"Real estate manager CapitaLand Investment (CLI) has cut 90 jobs, about 4 per cent of its Singapore workforce, in 2026 as part of a restructuring, without disclosing which functions were affected. CLI, which has around 2,200 Singapore employees mostly at Capital Tower, said it periodically reviews its organisational structure to stay aligned with strategic priorities. The unionised firm informed the Singapore Industrial and Services Employees' Union in advance, which is ensuring fair treatment and severance under the Collective Agreement; redeployment will be considered where appropriate. CLI has a global workforce over 9,500 and operates in more than 40 countries. It reported a 13.9 per cent rise in first-half net profit to S$327 million. CEO Lee Chee Koon is weighing divesting a stake in Ascott.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/CapitaLand%20Investment%20retrenches%2090%20Singapore%20staff%20in%202026%20as%20part%20of%20restructuring.pdf"},{"id":"bt-05","title":"China 15 years behind in top chipmaking tools, says ASML supplier","source":"BT","date":"4 Sep 2026","tags":["Technology & AI","Geopolitics","Trade"],"summary":"China is about a decade and a half behind in developing cutting-edge chipmaking tools, according to Frank Rohmund, who leads the semiconductor division at Germany's Zeiss Group, a key supplier to ASML. He called it a reasonable assumption that Beijing needs 15 years to develop extreme ultraviolet (EUV) lithography machines, essential for the most advanced AI chips. The US bars ASML from shipping its most advanced machines to China, a key target of Washington's efforts to block top-flight AI chips. Rohmund opposed extending controls to legacy DUV tools, arguing restrictions accelerate Chinese innovation. UBS analysts similarly estimate China is at least a decade from domestic EUV. Zeiss says its components help produce around 80 per cent of the world's chips.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/China%2015%20years%20behind%20in%20top%20chipmaking%20tools,%20says%20ASML%20supplier.pdf"},{"id":"bt-06","title":"China deploys first 2026 policy financing funds to spur investment","source":"BT","date":"4 Sep 2026","tags":["Finance & Markets","Geopolitics"],"summary":"China Development Bank has disbursed 460 million yuan (US$68.47 million) under the first tranche of China's 2026 policy-based financing tool, state media reported, as Beijing ramps up efforts to bolster investment and growth. Funds from China's largest policy bank will replenish capital for major construction projects backed by private investors, with the first tranche covering three projects in battery manufacturing, high-end nickel-chromium materials and transport infrastructure. China has begun accepting applications for an 800 billion yuan programme for local-government projects, up from 500 billion yuan in 2025, though analysts said the late rollout could limit its impact this year. The quasi-fiscal scheme leverages private and bank financing. China's economy grew 4.3 per cent in the second quarter, its weakest in more than three years.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/China%20deploys%20first%202026%20policy%20financing%20funds%20to%20spur%20investment.pdf"},{"id":"bt-07","title":"China services activity quickens on stronger domestic demand in August, private PMI shows","source":"BT","date":"4 Sep 2026","tags":["Finance & Markets","Geopolitics"],"summary":"China's services activity expanded at a faster pace in August, a private survey showed, with stronger domestic demand helping firms add staff for a fourth straight month. The RatingDog China General Services PMI rose to 51.4 from July's 50.4, staying above the 50-mark separating growth from contraction, though it was the second-lowest reading in 14 months. The result contrasted with the official survey, which pointed to sluggish domestic demand weighing on services despite the summer travel peak, a divergence reflecting differing coverage and sampling. New business accelerated, driven by domestic demand as export orders grew more slowly. Input prices rose for an 18th month on higher labour, materials and fuel costs. The composite PMI climbed to 52.1 from 50.8.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/China%20services%20activity%20quickens%20on%20stronger%20domestic%20demand%20in%20August,%20private%20PMI%20shows.pdf"},{"id":"bt-08","title":"From tokens to outcomes: Google Cloud's global startups head sees AI cost shift, expands Singapore push","source":"BT","date":"4 Sep 2026","tags":["Technology & AI","Southeast Asia"],"summary":"As AI usage grows, startups are shifting from measuring token costs toward cost per outcome or task, changing how founders choose models and prompting many to use a mix rather than a single one, said Darren Mowry, head of global startups at Google Cloud. Cost control is a recurring theme, with venture firms weighing overall AI spend. Mowry, who backs open-weight models, likened the landscape to multi-cloud adoption. He argued credits are now table stakes; differentiation lies in bundled engineering support. Google is deepening its Singapore investment, having opened a DeepMind lab there in November 2025 and launched a South-east Asia startup accelerator in May 2026. Of 25 selected startups, 21 are Singapore-based, including deep-tech firm Accelerated Materials. Mowry plans to grow local teams.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/From%20tokens%20to%20outcomes%20Google%20Cloud's%20global%20startups%20head%20sees%20AI%20cost%20shift,%20expands%20Si.pdf"},{"id":"bt-09","title":"Green jet fuel levy for air cargo deferred for a year","source":"BT","date":"4 Sep 2026","tags":["Environment","Trade","Southeast Asia"],"summary":"Singapore will defer a green jet fuel levy for air cargo by a year, starting Oct 1, 2027, for flights leaving the country from Jan 1, 2028. The Civil Aviation Authority of Singapore (CAAS) said the deferment reflects air cargo's diverse nature and the many businesses and agencies, including airlines, freight forwarders and shippers, involved, and will allow time to develop a robust sustainable-aviation-fuel levy collection mechanism. Passenger levies remain, taking effect Jan 1, 2027, for tickets bought from Oct 1: economy travellers pay between S$1 and S$10.40, business and first between S$4 and S$41.60, across four distance bands. The passenger levy was pushed back from October after the Middle East war and Strait of Hormuz closure triggered a global energy crisis. Industry players welcomed the cargo deferment.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/Green%20jet%20fuel%20levy%20for%20air%20cargo%20deferred%20for%20a%20year.pdf"},{"id":"bt-10","title":"Hongkong Land eyes billion-dollar property deals, Blackstone asset amid Japan push","source":"BT","date":"4 Sep 2026","tags":["Finance & Markets"],"summary":"Hongkong Land, one of Hong Kong's biggest landlords, is in talks to enter Japan's resurgent property market as parent Jardine Matheson pivots toward becoming a returns-focused portfolio manager. The firm is targeting deals over US$1 billion for prime Tokyo mixed-use complexes and has approached Blackstone and Hulic about assets Tokyo Garden Terrace Kioicho and Otemachi Place, though talks remain preliminary. Entry is challenging with commercial prices near multi-decade highs; investment flows topped one trillion yen in the second quarter. The 194-year-old Jardine group has proposed over US$10 billion in asset sales and M&A. Hongkong Land has netted US$3.7 billion from disposals since 2024, cutting leverage to 11 per cent. Jardine also agreed to buy Australia's I-MED Radiology for US$2.4 billion.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/Hongkong%20Land%20eyes%20billion-dollar%20property%20deals,%20Blackstone%20asset%20amid%20Japan%20push.pdf"},{"id":"bt-11","title":"Japan services growth hits five-month high, PMI shows","source":"BT","date":"4 Sep 2026","tags":["Finance & Markets"],"summary":"Japan's services sector expanded at its fastest pace in five months in August as stronger domestic demand lifted activity and new work, a private survey showed. The S&P Global final Japan Services PMI rose to 52.5 from July's 51.2, above the 50-mark separating growth from contraction. New business increased for a 26th straight month at a faster pace, though export business contracted for a fifth month at its sharpest rate since November 2020. Employment rose for a 12th month but at the slowest pace in a year. Input cost inflation eased to a four-month low while output charges rose at the second-steepest rate on record. S&P's Annabel Fiddes said sustained cost pressures strengthen the case for another Bank of Japan rate hike. The composite PMI hit 53.5, a six-month high.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/Japan%20services%20growth%20hits%20five-month%20high,%20PMI%20shows.pdf"},{"id":"bt-12","title":"Keppel DC Reit's Tokyo drift: The easy yen trade is over","source":"BT","date":"4 Sep 2026","tags":["Finance & Markets","Technology & AI"],"summary":"Keppel DC Reit's S$1.4 billion purchase of two Tokyo data centres looks attractive on paper, an 88.6 per cent stake in freehold assets at a 2.1 per cent discount with immediate accretion, funded partly by an upsized S$625 million placement. But the yen debt now carries about 2.9 per cent interest, above the trust's 2.7 per cent portfolio average, ending the era of borrowing cheap yen to book spreads. The Inzai City assets are fully leased to investment-grade tenants with rents roughly 30 per cent below market, but Maybank's Krishna Guha expects positive reversion only from 2029. The deal aids diversification, cutting top-client income share and lifting Japan's contribution to 23 per cent, though pro forma leverage rises to 38 per cent. The equity raise was 3.4 times covered.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/Keppel%20DC%20Reit's%20Tokyo%20drift%20The%20easy%20yen%20trade%20is%20over.pdf"},{"id":"bt-13","title":"Oil prices mixed as investors weigh Middle East escalation, chance of Ukraine peace deal","source":"BT","date":"4 Sep 2026","tags":["Energy","Geopolitics","Finance & Markets"],"summary":"Oil prices were mixed on Thursday, supported by US strikes on Iran and renewed Israeli threats but pressured by Russian President Vladimir Putin signalling openness to Ukraine peace talks. Brent settled down 11 cents at US$95.52 a barrel while US WTI rose 29 cents to US$91.30; both hit six-week highs earlier. Iran said 18 people were killed in Tuesday night's US strikes, the biggest US-Iran exchange since July in a war now in its seventh month. Vice-President JD Vance said the US will not talk unless Iran stops attacking Strait of Hormuz shipping. Only six commodity vessels transited the strait on Wednesday, below the 10-day average of 13. UBS said the oil market remains tight with global inventories declining. Iraq lifted August exports to about 2.34 million barrels per day.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/Oil%20prices%20mixed%20as%20investors%20weigh%20Middle%20East%20escalation,%20chance%20of%20Ukraine%20peace%20deal.pdf"},{"id":"bt-14","title":"Over half of employers plan hiring freeze, wage moderation despite better outlook: SNEF poll","source":"BT","date":"4 Sep 2026","tags":["Society","Southeast Asia","Finance & Markets"],"summary":"More than half of Singapore employers do not intend to raise headcount in 2027, and a majority plan to freeze or moderate wages, despite a slightly improved outlook, the Singapore National Employers Federation (SNEF) said. Those expecting uncertain prospects fell to 63 per cent from 72 per cent. SNEF flagged an increasingly K-shaped economy, with outward-oriented sectors buoyed by external and tech demand while retail and F&B grapple with weak demand and rising costs. Some 54 per cent will not add staff, though 40 per cent plan to hire. Just over half plan wage moderation or freezes; 86 per cent still commit to built-in raises for lower-wage workers. Rising manpower cost remains the top challenge, flagged by 83 per cent. The survey polled 320 firms employing nearly 160,000 workers.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/Over%20half%20of%20employers%20plan%20hiring%20freeze,%20wage%20moderation%20despite%20better%20outlook%20SNEF%20pol.pdf"},{"id":"bt-15","title":"Singapore records S$1.3 billion inflow of funds in Q2, led by higher allocation funds: Morningstar","source":"BT","date":"4 Sep 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"Funds in Singapore recorded net inflows of S$1.3 billion in the second quarter of 2026, driven by allocation funds, Morningstar data showed. Though down from S$3.2 billion in the first quarter, first-half inflows reached S$4.5 billion, significant versus historical norms, said senior analyst Arvind Subramanian. Allocation funds drew S$1.8 billion, up from S$1.5 billion. Equity funds posted S$93.3 million in net outflows, reversing Q1 inflows, but Subramanian noted rising underlying interest in Singapore equities, aided by the Equity Market Development Programme boosting small and mid-cap allocations. Managers are hiring Singapore-focused analysts and eyeing more IPOs to match inflows. Fixed-income funds saw outflows widen to S$288.9 million amid bond-market volatility, though investors still prefer less-volatile Singapore bonds over global fixed income.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/Singapore%20records%20S1.3%20billion%20inflow%20of%20funds%20in%20Q2,%20led%20by%20higher%20allocation%20funds%20Morni.pdf"},{"id":"bt-16","title":"Trump puts tariffs of up to 100% on foreign-made drones","source":"BT","date":"4 Sep 2026","tags":["Trade","Geopolitics","Technology & AI"],"summary":"The Trump administration imposed tariffs of up to 100 per cent on drones, continuing efforts to thwart China's drone industry and promote domestic manufacturing. The 100 per cent levy applies to drones weighing over 24.9 kg or using thermal imaging, mostly Chinese-made and used by law enforcement; smaller drones face 25 per cent. Trump, whose two eldest sons have US drone-industry ties, announced the levies after a Commerce probe deemed foreign-drone reliance a security threat. Shenzhen-based DJI makes over 70 per cent of the world's commercial drones. Critics call it protectionism. Allied drones face lower levies: 15 per cent for the EU, Japan, South Korea, Switzerland and Taiwan, 10 per cent for Britain. A separate FCC proposal could reclassify many drones as military grade.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/Trump%20puts%20tariffs%20of%20up%20to%20100%20on%20foreign-made%20drones.pdf"},{"id":"bt-17","title":"Trump says renewed US campaign against Iran won't last long","source":"BT","date":"4 Sep 2026","tags":["Geopolitics","Defence"],"summary":"US President Donald Trump said the renewed US campaign against Iran would not continue for too long, following the biggest exchange of fire between Teheran and Washington since July. Speaking to reporters in the Oval Office, Trump said Iran was trying to build a rocket that drops mines and that the US had destroyed it. He also said Iran had been working to restore its radar and missile systems, which were targeted in the US strikes. \"We took out all of the new equipment that they tried to build along the Strait of Hormuz, some defensive, some offensive,\" he said, describing a very heavy attack and adding that the US is prepared to strike again at any time.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/Trump%20says%20renewed%20US%20campaign%20against%20Iran%20won't%20last%20long.pdf"},{"id":"bt-18","title":"US Fed survey shows economic activity edged up, prices rose moderately in recent weeks","source":"BT","date":"4 Sep 2026","tags":["Finance & Markets","Politics"],"summary":"US economic activity increased modestly, employment rose slightly and prices climbed moderately in recent weeks, the Federal Reserve's Beige Book showed, offering little clarity ahead of the Sep 15-16 meeting. The general outlook was positive but sentiment was mixed amid uncertainty over energy prices, policy and international conflict. Price increases slowed in three of 12 districts. The Fed has held its benchmark rate at 3.5-3.75 per cent since December, but five of 19 policymakers feel a hike is past due. Expectations rose after chairman Kevin Warsh flagged inflation as his predominant focus; markets price a 65 per cent chance of a hike. Input pressures were elevated in manufacturing and construction, tariff impacts persisted, and housing weakness was widespread. AI and data-centre demand featured prominently.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/US%20Fed%20survey%20shows%20economic%20activity%20edged%20up,%20prices%20rose%20moderately%20in%20recent%20weeks.pdf"},{"id":"bt-19","title":"US Fed's Waller says safety premium for Treasuries is gone, pushing neutral rate higher","source":"BT","date":"4 Sep 2026","tags":["Finance & Markets","Politics"],"summary":"Federal Reserve Governor Christopher Waller said the safety premium for safe, liquid US government debt has largely disappeared, pushing the neutral level of interest rates higher and implying higher policy rates for any given inflation rate. Speaking at a Reuters Next event, he attributed rising yields to fiscal concerns and competition for capital from AI infrastructure investment, citing Stanford research showing the premium eroded over years. Waller said that to grow out of a US$40 trillion debt load, structural deficits must fall toward zero from around 6 per cent of GDP. He urged patience, saying \"give disinflation a chance,\" and is inclined to hold rates if inflation cools. His comments pushed the benchmark Treasury yield to 4.74 per cent. He dismissed the effectiveness of Bessent's expanded bond buybacks.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/US%20Fed's%20Waller%20says%20safety%20premium%20for%20Treasuries%20is%20gone,%20pushing%20neutral%20rate%20higher.pdf"},{"id":"bt-20","title":"US weekly jobless claims rise marginally amid stable labour market","source":"BT","date":"4 Sep 2026","tags":["Finance & Markets","Politics"],"summary":"US initial jobless claims rose marginally last week, suggesting no material shift in labour conditions at the end of August. Claims climbed 2,000 to a seasonally adjusted 206,000 for the week ended August 29, near economists' 205,000 forecast and in the lower end of this year's 189,000-230,000 range, consistent with a \"slow hire, slow fire\" market. Employers remain hesitant amid aggressive trade and immigration policies; Challenger data showed planned hiring up 37 per cent but positions filling slowly, while planned job cuts rose 58 per cent to 52,881 in August. Continuing claims rose 8,000 to 1.779 million. The government is expected to report Friday that nonfarm payrolls rebounded 56,000 after July's 23,000 decline, with unemployment steady at 4.1 per cent. Economists expect a possible Fed hike this month.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/US%20weekly%20jobless%20claims%20rise%20marginally%20amid%20stable%20labour%20market.pdf"},{"id":"bt-21","title":"Wealth of Singapore's 50 richest diverges as OCBC, Sheng Siong boom offsets tech slide","source":"BT","date":"4 Sep 2026","tags":["Finance & Markets","Southeast Asia","Technology & AI"],"summary":"The aggregate net worth of Singapore's 50 richest stayed flat at US$239 billion in Forbes Asia's latest list, as gains at OCBC and Sheng Siong offset a nearly US$16 billion combined decline for Facebook co-founder Eduardo Saverin and Sea's founders. The Lee family of OCBC was the biggest gainer, up 78 per cent to US$13.8 billion for fourth place, as the bank's shares nearly doubled. Sheng Siong's Lim Hock Chee reached US$2.7 billion. City Developments' Kwek Leng Beng ranked second at US$16.1 billion, with Far East Organization's Ng family third at US$14.3 billion. Saverin held first at US$32.9 billion despite a US$10.1 billion fall as Meta shares dropped 25 per cent. Sea founders lost US$5.9 billion. Thirty-five entrants grew wealthier year-on-year.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/Wealth%20of%20Singapore's%2050%20richest%20diverges%20as%20OCBC,%20Sheng%20Siong%20boom%20offsets%20tech%20slide.pdf"},{"id":"bt-22","title":"White House pressures US space firms to skip Paris space summit: sources","source":"BT","date":"4 Sep 2026","tags":["Geopolitics","Technology & AI","Politics"],"summary":"The Trump administration pressured US space companies not to attend a high-profile space summit in Paris organised by French President Emmanuel Macron, triggering a last-minute reshuffle and cancellation of some announcements, sources said. The White House Office of Science and Technology Policy held a call warning that attendance at the Sep 9-10 event could suggest support for European policy positions the US disagrees with. The summit features Macron and European Commission President Ursula von der Leyen as Europe ramps up civil and military space investment and reduces reliance on US firms like Elon Musk's SpaceX. SpaceX will no longer attend. An OSTP official said the administration continues to collaborate with allies. Organiser Philippe Adam said US and Chinese economic players were invited and broad participation matters.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/White%20House%20pressures%20US%20space%20firms%20to%20skip%20Paris%20space%20summit%20sources.pdf"},{"id":"bt-23","title":"Yen rallies sharply as markets raise bets on Bank of Japan rate hikes; US dollar drops","source":"BT","date":"4 Sep 2026","tags":["Finance & Markets"],"summary":"The yen extended gains on Thursday after a sudden burst higher, though traders attributed the move to rising bets on Bank of Japan rate hikes rather than intervention. The US dollar dropped 1.5 per cent to 156.17 yen, its strongest in a month, with the euro sliding over 1 per cent. The rally followed hawkish comments from BOJ board member Hajime Takata urging nimble rate hikes; Citi called them the strongest board messaging yet. A September BOJ hike is nearly fully priced. Since a rare US-Japan joint intervention on Jul 31, the yen struggled amid wide rate differentials and energy-price spikes. ING's Chris Turner said a Fed hike would limit the dollar's fall. Markets price a 61 per cent chance of a September Fed hike.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/Yen%20rallies%20sharply%20as%20markets%20raise%20bets%20on%20Bank%20of%20Japan%20rate%20hikes%20US%20dollar%20drops.pdf"},{"id":"bt-24","title":"Yen traders brace for holiday intervention risk around Bank of Japan","source":"BT","date":"4 Sep 2026","tags":["Finance & Markets"],"summary":"Yen traders are on heightened alert for possible intervention around the Bank of Japan's upcoming policy meeting, with a three-day holiday afterwards offering authorities a chance to act in thinner trading. The yen gained as much as 0.5 per cent to 157.99 on Thursday as traders priced in a larger than 25-basis-point hike at the Sep 18 meeting. In April, authorities waited for a long holiday to intervene for the first time since 2024, and investors speculate a similar Silver Week tactic. The yen has been pressured by elevated oil prices and wide US rate gaps, despite Japan spending a record US$96.4 billion over the past month. Finance Minister Satsuki Katayama and Treasury Secretary Scott Bessent said they would re-enter markets if needed; analysts see intervention likely near 160.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20BT/Yen%20traders%20brace%20for%20holiday%20intervention%20risk%20around%20Bank%20of%20Japan.pdf"},{"id":"scmp-01","title":"About 4 in 5 young, affluent investors in mainland China turn to offshore assets: study","source":"SCMP","date":"4 Sep 2026","tags":["Finance & Markets","Society"],"summary":"A CFA Institute study found about 81 per cent of surveyed young, affluent mainland Chinese investors held offshore assets, averaging 43 per cent of their portfolios. The December survey covered 300 investors aged 18 to 44. Those with international experience were most exposed, with 93 per cent holding offshore assets averaging 45 per cent of portfolios. Tier-one city investors allocated 45 per cent offshore versus 40 per cent elsewhere. Wealth preservation was the top motive (55 per cent), followed by diversification (54 per cent) and tracking global trends (50 per cent); 44 per cent sought unavailable investment types and 41 per cent hedged domestic or currency risks. The institute said advisers need cross-border capabilities despite China's capital controls.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/About%204%20in%205%20young,%20affluent%20investors%20in%20mainland%20China%20turn%20to%20offshore%20assets%20study.pdf"},{"id":"scmp-02","title":"Are Z.ai and MiniMax heading down opposite financial paths months after Hong Kong IPOs?","source":"SCMP","date":"4 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"First-half earnings suggest diverging trajectories for two Chinese AI firms that listed in Hong Kong in January. Beijing-based Z.ai (Zhipu AI) posted a near-400 per cent revenue surge to 953.9 million yuan (US$142 million), while Shanghai rival MiniMax grew 283 per cent to US$116.6 million. Z.ai co-founder Tang Jie said annual recurring revenue hit US$1.6 billion in August; MiniMax's Yan Junjie claimed US$800 million, but later admitted the figure annualised a single week's revenue, which Gavekal analyst Tilly Zhang called \"creative\". On the Artificial Analysis Intelligence Index, MiniMax's M3 scored 45, trailing Z.ai's GLM-5.3 and Moonshot's Kimi K3, both at 60. HSBC more than halved MiniMax's price target.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/Are%20Z.ai%20and%20MiniMax%20heading%20down%20opposite%20financial%20paths%20months%20after%20Hong%20Kong%20IPOs.pdf"},{"id":"scmp-03","title":"As hordes head to Shenzhen, Hong Kong bars, restaurants sign up for more floor space","source":"SCMP","date":"4 Sep 2026","tags":["Society","Finance & Markets"],"summary":"Hong Kong food and beverage operators leased 155,000 sq ft of new floor space in the second quarter, a sector record and more than double the first quarter, according to CBRE. First-half take-up reached 230,000 sq ft. Analysts said a selective, narrow retailing recovery is forcing brands to adopt novel tactics, with F&B operators incorporating experiential elements, said CBRE's Lawrence Wan. Examples cited include live music, native Korean-speaking staff, drinking games with chefs and curated vintage furniture. JLL pointed to immersive concepts such as Le Petit Chef and The Magic Table at Grand Hyatt, dining-in-darkness at Dans le Noir, and narrative-led venues like Jing, as diners increasingly view food as one part of the total experience.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/As%20hordes%20head%20to%20Shenzhen,%20Hong%20Kong%20bars,%20restaurants%20sign%20up%20for%20more%20floor%20space.pdf"},{"id":"scmp-04","title":"Asia is not on the edge of a new 1997-style financial crisis","source":"SCMP","date":"4 Sep 2026","tags":["Finance & Markets"],"summary":"This opinion piece argues Asia is not facing a repeat of the 1997 financial crisis, despite market alarmism over rising interest rates and an AI-fuelled stock bubble. In an August 31 report titled \"Nope, it's not 1997\", HSBC said differences outweigh similarities but noted parallels: sharply higher US Treasury yields, a collapsing Japanese yen and excessive technology-sector optimism. The author contends these risks are unrelated to the policy and structural weaknesses behind 1997. Former victims Thailand, Malaysia, Indonesia and South Korea have shed those deficiencies, jettisoning rigid currency pegs, tightening monetary policy, stemming capital outflows and reforming corporate and financial sectors. The IMF credited such strategies with restoring confidence and reviving growth by late 1998, alongside improved current accounts.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/Asia%20is%20not%20on%20the%20edge%20of%20a%20new%201997-style%20financial%20crisis.pdf"},{"id":"scmp-05","title":"Beijing ramps up coastguard patrols and scientific surveys near Taiwan","source":"SCMP","date":"4 Sep 2026","tags":["Geopolitics","Defence"],"summary":"Beijing said it conducted a routine patrol in waters east of Taiwan on Thursday, the latest in weeks of ramped-up coastguard and vessel activity that has alarmed the island. China Coast Guard spokesman Jiang Lue said a formation led by the Putuoshan vessel carried out a \"law enforcement\" patrol, vowing to strengthen control over waters under Chinese jurisdiction. The surge follows the opening of Japan-Philippines maritime delimitation talks that Beijing calls illegal. Chinese media also reported a marine geophysical survey east of Taiwan by the Ministry of Natural Resources from August 10 to 31, and earlier deployment of research vessel Xiangyanghong 22. Beijing views Taiwan as part of China and has not ruled out using force to achieve reunification.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/Beijing%20ramps%20up%20coastguard%20patrols%20and%20scientific%20surveys%20near%20Taiwan.pdf"},{"id":"scmp-06","title":"ByteDance to expand massive AI data centre cluster in Inner Mongolia, source says","source":"SCMP","date":"4 Sep 2026","tags":["Technology & AI"],"summary":"TikTok parent ByteDance is seeking to expand computing capacity by building more data centres in Inner Mongolia over the next two years, a person familiar said, underscoring Chinese tech giants' AI infrastructure push. The company held preliminary talks with local vendors to add five to six gigawatts of compute in Ulanqab. With a one-gigawatt AI data centre costing about 160 billion yuan (US$23.8 billion) per a Soochow Securities note, the facility could cost roughly 800 billion to 960 billion yuan, targeting early-2028 delivery in Ulanqab's Jining district, which also hosts Huawei, Kuaishou, Alibaba and Apple facilities. ByteDance reportedly secured a US$29.6 billion loan. Alibaba's capital expenditure rose 75 per cent and Tencent's jumped 176 per cent in recent quarters.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/ByteDance%20to%20expand%20massive%20AI%20data%20centre%20cluster%20in%20Inner%20Mongolia,%20source%20says.pdf"},{"id":"scmp-07","title":"China prepares next phase of national SME fund to boost tech start-ups and IPOs","source":"SCMP","date":"4 Sep 2026","tags":["Finance & Markets","Technology & AI"],"summary":"China will soon launch the second phase of its National SME Development Fund, focusing on IPO incubation and channelling private capital into early-stage hard-tech firms. The move was confirmed as the Ministry of Industry and Information Technology, with nine other agencies, released the 15th five-year plan for SME development. The fund's first phase, established in September 2015, had by March spawned 46 sub-funds with over 120 billion yuan (US$17.6 billion) invested in more than 2,000 enterprises and 92 IPOs, with roughly 15 per cent overall returns, per China Galaxy Securities. Analyst Wu Jing said the fund can help early-stage tech firms held back by light assets and high risk. Regional platforms will build boards for \"little giant\" SMEs.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/China%20prepares%20next%20phase%20of%20national%20SME%20fund%20to%20boost%20tech%20start-ups%20and%20IPOs.pdf"},{"id":"scmp-08","title":"China rejects G20 trade-imbalance claims, says no need to devalue yuan","source":"SCMP","date":"4 Sep 2026","tags":["Trade","Finance & Markets","Geopolitics"],"summary":"China pushed back at critics of its trade imbalances at a G20 gathering, with the central bank denying it deliberately pursues surpluses and vowing not to weaponise the yuan. PBOC governor Pan Gongsheng said China remains committed to expanding domestic demand, adding that addressing global imbalances requires structural reforms in all countries. China's trade surplus hit a record US$1.2 trillion last year. US Treasury Secretary Scott Bessent called the surplus \"unsustainable\" and blamed Beijing for the group failing to issue a unanimous statement; the US instead released a text agreed by all present except China. Commerce ministry spokeswoman Huang Ling accused Washington of hyping \"economic imbalances\" and \"overcapacity\" to promote protectionism and pressure China.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/China%20rejects%20G20%20trade-imbalance%20claims,%20says%20no%20need%20to%20devalue%20yuan.pdf"},{"id":"scmp-09","title":"China's new home finance rules reduce buyer risks but may not revive the market: analysts","source":"SCMP","date":"4 Sep 2026","tags":["Finance & Markets"],"summary":"China's new housing finance rules reduce the risk of buying pre-sold homes but analysts doubt they will tempt hesitant buyers facing falling prices. Mortgage funds for pre-sold homes will be released only after project completion filing, when homes are certified safe, rather than when the main structure is finished; the maximum mortgage term extends to 40 years from 30. The measures address buyers left paying mortgages on unfinished homes during the property downturn. Bank of America's Karl Choi said the reform is \"the right thing to do\" but not primarily aimed at stimulating demand, which is tied to the economic outlook and price expectations. Fitch expects limited near-term impact; Barclays noted longer terms raise total interest paid.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/China's%20new%20home%20finance%20rules%20reduce%20buyer%20risks%20but%20may%20not%20revive%20the%20market%20analysts.pdf"},{"id":"scmp-10","title":"China's robot revolution may not arrive in the way you expect","source":"SCMP","date":"4 Sep 2026","tags":["Technology & AI"],"summary":"This analysis argues China's robotics boom is splitting into two bets. At last month's World Robot Conference in Beijing, humanoids sorted parcels and performed chores, while Unitree Robotics closed its Shanghai market debut at more than five times its offer price. One approach packs capability into versatile humanoid bodies; the other spreads useful intelligence across different bodies. Unitree founder Wang Xingxing conceded a software breakthrough for unfamiliar tasks could take two to three years or up to a decade. The piece notes the physical world's difficulty and questions priorities, given 12.4 per cent global youth unemployment last year. Stanford's Fei-Fei Li frames the challenge as spatial intelligence, reasoning that robots need not look human.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/China's%20robot%20revolution%20may%20not%20arrive%20in%20the%20way%20you%20expect.pdf"},{"id":"scmp-11","title":"Chinese military's AI attack chain lags foreign models: researchers","source":"SCMP","date":"4 Sep 2026","tags":["Defence","Technology & AI"],"summary":"China's military AI models trail foreign equivalents and concentrate on support rather than combat functions, according to a study by Chinese researchers affiliated with the Armed Police Force Shandong Corps and the Engineering University of People's Armed Police, published in Defence Industry Conversion in China in July. The authors said military AI is mainly used in auxiliary fields such as intelligent question-answering and content generation, lagging foreign large language models, while offensive combat applications remain exploratory. The paper appears as AI becomes central to US-China strategic competition, with the Pentagon calling for an \"AI-first\" force. In August, CCTV reported the PLA air force used an \"intelligent-strike planning system\" for operations involving over 100 units. The paper drew heavily on US Military Review analysis.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/Chinese%20military's%20AI%20attack%20chain%20lags%20foreign%20models%20researchers.pdf"},{"id":"scmp-12","title":"Extra funds push Taiwan's defence spending past NT$1 trillion for the first time","source":"SCMP","date":"4 Sep 2026","tags":["Defence","Geopolitics"],"summary":"Taiwan's cabinet approved a supplementary defence budget of NT$145.7 billion (US$4.6 billion) on Thursday, pushing total defence-related spending this year above NT$1 trillion for the first time. The funding lifts spending from 3.32 per cent to about 3.83 per cent of GDP, the highest in decades, and fills gaps after opposition lawmakers cut NT$470 billion in May from an eight-year special package. Of the additional funds, NT$133.4 billion goes to military investment, including the locally developed Chiang Kung anti-tactical ballistic missile system (NT$13 billion), uncrewed systems (NT$55.9 billion) and two classified programmes (NT$64.5 billion). Premier Cho Jung-tai said defence \"cannot afford a gap\", targeting over 600 surveillance drones and 40,000 coastal attack drones to strengthen asymmetric warfare capabilities.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/Extra%20funds%20push%20Taiwan's%20defence%20spending%20past%20NT1%20trillion%20for%20the%20first%20time.pdf"},{"id":"scmp-13","title":"Hong Kong regulator reclassifies certain funds with exposure to private markets","source":"SCMP","date":"4 Sep 2026","tags":["Finance & Markets"],"summary":"Hong Kong's Securities and Futures Commission has reclassified authorised funds with private market exposure above 50 per cent of net asset value as complex products, raising the threshold for selling them to retail investors. The regulator said it observed funds gaining indirect exposure through layered structures and complex instruments that may lack transparency, making underlying risks hard for retail investors to grasp. Citing low liquidity, valuation challenges an
