invited 60 scientific and academic experts to the annual Beidaihe retreat from August 1-7, and the 15 named by Xinhua reveal Beijing's tech priorities amid competition with the US. They span defence engineering, semiconductors, deep-sea equipment, AI, particle astrophysics and more, reflecting the 15th five-year plan's goal of \"self-reliance and strength in science and technology.\" Chip scientist Cai Shujun called the coming years critical for overcoming integrated-circuit \"chokepoints.\" Other invitees included protective-engineering pioneer Qian Qihu, deep-ocean drillship designer Zhang Haibin, and Tsinghua AI theorist Yuan Yang. On August 3, party fifth-ranking official Cai Qi urged them to secure \"decisive progress\" toward socialist modernisation by 2035. Xi Jinping has pushed for more spending on basic research.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/How%20the%20guest%20list%20for%20Beijing's%20summer%20retreat%20reveals%20its%20tech%20priorities.pdf"}, {"id": "scmp-17", "title": "Pakistan says 'purely defensive' Mecca accord is open to others", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Pakistan's Foreign Minister Ishaq Dar said the new Mecca Joint Defence Agreement with Saudi Arabia and Turkey is \"purely defensive in nature\" and open to other regional states, not directed at any country. Signed Friday by Crown Prince Mohammed bin Salman, President Erdogan and Prime Minister Shehbaz Sharif, it treats an armed attack on one as an attack on all, which Dar tied to Article 51 of the UN Charter. Turkish Foreign Minister Hakan Fidan said Egypt would likely join next, pending technical matters, adding one of the region's biggest militaries. The three bring differing strengths: Pakistan's nuclear arsenal, Saudi wealth and Turkey's defence industry. Islamabad analysts cautioned against equating the pact with Nato despite its collective-defence clause.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/Pakistan%20says%20'purely%20defensive'%20Mecca%20accord%20is%20open%20to%20others.pdf"}, {"id": "scmp-18", "title": "Powerful anti-drone laser spotted on PLA amphibious ship in South China Sea", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "China's most advanced laser weapon, the Liaoyuan-1 (LY-1), was spotted aboard the Type 071 amphibious ship Qilianshan during an August 1 PLA drill at Scarborough Shoal, analysts said, adding near-shore anti-drone defence. The directed-energy weapon, which debuted at last September's Victory Day parade, intercepts incoming missiles and drones as a last line of defence. Analyst Collin Koh said deploying the vessel on the PLA's founding anniversary sent a \"more forceful message\" to Manila and Washington, whose carrier USS George Washington is in the South China Sea. Tensions have flared, with China-Philippine vessels clashing three times in a week. Similar weapons appear on Type 075 and the new Type 076 \"drone carrier\" Sichuan. The drill also showcased H-6J bombers carrying YJ-12 anti-ship missiles.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/Powerful%20anti-drone%20laser%20spotted%20on%20PLA%20amphibious%20ship%20in%20South%20China%20Sea.pdf"}, {"id": "scmp-19", "title": "Russia says 13 killed in Ukraine drone attack on oil-refining city 900km from Moscow", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "Russian authorities said a Ukrainian drone attack on Nizhnekamsk, an oil-refining and petrochemical hub in Tatarstan about 900km from Moscow, killed at least 13 people, including a child, and injured 39, one of the heaviest civilian tolls in months. Ukraine's military said it struck the Taneco refinery, which processed 17 million tonnes of crude in 2024, and Nasa satellite imagery showed heat anomalies at the Nizhnekamskneftekhim plant. Kyiv has intensified strikes on Russia's oil-processing industry, hitting five refineries last week to bring the war's cost home to Russians and strain fuel supplies. Both sides reported deadly attacks over the weekend, with three killed in Kharkiv and five in Belgorod. Both deny targeting civilians. The war began in February 2022.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/Russia%20says%2013%20killed%20in%20Ukraine%20drone%20attack%20on%20oil-refining%20city%20900km%20from%20Moscow.pdf"}, {"id": "scmp-20", "title": "South Korea faces quandary over Ukraine's air defence system request", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "South Korea faces a dilemma over Ukrainian President Zelensky's request for air defence systems, which analysts say could strain ties with Russia and hurt Seoul's own defence. Zelensky warned that 30,000 to 50,000 North Koreans may be deployed to Russia, higher than his earlier estimate, and offered drone technology in return. Seoul cited legal limits on arms transfers to warring states and production constraints; its Cheongung-II system reportedly intercepted 96 per cent of missiles and drones for the UAE. Analyst Doo Jin-ho questioned the trade-off given strained Russia ties. Ukraine faces a critical shortage of US Patriot interceptors. About 6,000 North Korean troops sent to Russia have been killed or wounded, and analysts see friction between Kim Jong-un and Putin over further deployments.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/South%20Korea%20faces%20quandary%20over%20Ukraine's%20air%20defence%20system%20request.pdf"}, {"id": "scmp-21", "title": "The race for critical minerals is clearing the path for deep-sea mining", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Environment", "Geopolitics"], "summary": "This opinion piece warns the race for critical minerals is clearing the path for environmentally damaging deep-sea mining as US-China competition and corporate pressure stall safeguards. The International Seabed Authority's council ended two weeks of talks on July 31 without agreeing a \"mining code,\" pushing negotiations to March. More than 40 nations back a moratorium, with Vanuatu urging a pause until risks are understood. Canada-based The Metals Company is pushing to start commercial extraction in the Clarion-Clipperton zone, turning to US regulators since Washington rejects UNCLOS. Pacific islands, whose seabed minerals may be worth up to US$16 trillion, face conflict risks over fishing grounds, while Kiribati explores mining ties with China. The author calls the ISA a \"toothless tiger.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/The%20race%20for%20critical%20minerals%20is%20clearing%20the%20path%20for%20deep-sea%20mining.pdf"}, {"id": "scmp-22", "title": "Trump demands Iran pay compensation as hopes fade for Hormuz agreement", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "US President Trump demanded Iran compensate victims of attacks he blamed on Tehran, adding a condition to negotiations over reopening the Strait of Hormuz, after Iran sought damages for more than five months of US and Israeli strikes. Trump said he would put the demand \"into any, and all, future negotiations,\" citing victims of protests and the 2000 USS Cole bombing, though the FBI attributed that to al-Qaeda. He claimed US forces control the strait \"100 per cent\" and had mine-swept it. Iran's foreign ministry said Washington must compensate Tehran, lift sanctions, withdraw forces and release frozen assets before reopening. A ceasefire was agreed in April, but the US maintains a counter-blockade on Iranian ports. The two agreed a 14-point memorandum in June.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/Trump%20demands%20Iran%20pay%20compensation%20as%20hopes%20fade%20for%20Hormuz%20agreement.pdf"}, {"id": "scmp-23", "title": "Trump extends Jones Act waiver for 90 days, narrows scope", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Trade", "Energy"], "summary": "President Trump extended for 90 days a waiver letting foreign-flagged ships move oil and commodities between US ports, but narrowed it to require case-by-case review rather than blanket exemptions after shipbuilders and Congress complained the policy undermined the domestic maritime industry. The White House said the waiver, the longest suspension of the century-old Jones Act, ensures uninterrupted fuel access amid war-disrupted crude flows, having boosted domestic gasoline, diesel and jet-fuel deliveries. The law requires inter-port cargo on US-built, US-owned, US-crewed ships. Analysts said the waiver likely cuts petrol prices only pennies per gallon. The American Maritime Partnership welcomed the tighter review; about 208 exemptions were granted in roughly four and a half months. The Cato Institute urged permanent reform.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/Trump%20extends%20Jones%20Act%20waiver%20for%2090%20days,%20narrows%20scope.pdf"}, {"id": "scmp-24", "title": "US 'digging in' to Asia but wants 'partners not dependency': Pentagon", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Geopolitics", "Defence", "Southeast Asia"], "summary": "The US is not disengaging from Asia but \"digging in\" to keep a favourable balance of power in the Indo-Pacific, while wanting allies to shoulder more defence, Pentagon policy chief Elbridge Colby said in Manila. Seeking to counter doubts about Washington's reliability, he called for \"partnership, not dependency\" and \"partners, not protectorates.\" Colby said deterrence required a \"posture of deterrence by denial\" along the first island chain running from the Kuril Islands through Japan, Taiwan and the Philippines to Borneo, and pointed to growing US commitment. The Philippines, America's oldest Asian treaty ally, was the first stop on a trip also covering Indonesia, Thailand and Cambodia. He argued strong partners make deterrence strong.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/US%20'digging%20in'%20to%20Asia%20but%20wants%20'partners%20not%20dependency'%20Pentagon.pdf"}, {"id": "scmp-25", "title": "US does its robotics industry no favours by fencing it off from China", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Technology & AI", "Trade"], "summary": "This opinion piece argues Washington harms its own robotics industry by fencing it off from China. FCC chairman Brendan Carr added Chinese humanoid robots, quadrupeds and power inverters to the agency's Covered List, denying them US sales authorisation on cybersecurity grounds, though the order exempts the federal government. Chinese makers hold about 85 per cent of the global humanoid market, so there is little domestic industry to protect. The author contrasts China's protection-with-competition model, which built dominant EV and solar sectors, with sheltered, stagnant import-substitution economies. Chinese robot exports hit nearly 20 billion yuan (US$2.96 billion) in five months across 150 countries, with Unitree and AgiBot targeting Europe. US firms like Figure are capital-rich but production-poor. The piece files the ban under \"concessions.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/US%20does%20its%20robotics%20industry%20no%20favours%20by%20fencing%20it%20off%20from%20China.pdf"}, {"id": "scmp-26", "title": "Wave of US tariff refunds flows back to Chinese firms, buoying profits by millions", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Trade", "Finance & Markets"], "summary": "A wave of US tariff refunds is reaching Chinese companies, with over US$38 million plus interest paid to five listed firms in automotive and healthcare since last month, each averaging US$7.64 million, or 13 to 54 per cent of 2025 net profit. Zhejiang's Huahai Pharmaceutical received over US$14.2 million and Guizhou Tyre over US$11.98 million; more than a dozen mainland firms have applied. The refunds follow the US Supreme Court striking down Trump's sweeping duties in February; CBP had disbursed US$100 billion by end-July, about 60 per cent of US$166 billion collected. The payouts are straining US fiscal revenue, turning June net customs revenue to negative US$25.56 billion. Analysts expect Trump to roll out additional tariff measures.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/Wave%20of%20US%20tariff%20refunds%20flows%20back%20to%20Chinese%20firms,%20buoying%20profits%20by%20millions.pdf"}, {"id": "scmp-27", "title": "Why Taiwan is conducting its first-ever mobile network throttling exercise", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Defence", "Society"], "summary": "Taiwan is conducting its first-ever mobile network throttling exercise to test public response to wartime communications disruptions, reducing 4G and 5G bandwidth for 30 minutes in central Taiwan on Monday and the north on Thursday, affecting about 17 million people, or 73 per cent of the population. Voice calls, SMS and emergency broadcasts continue, but data services like mobile payments and streaming may fail. Users complained it felt like a full blackout, and opposition KMT legislators said cutting bandwidth to 1 per cent amounted to a shutdown, disputing claims it followed international practice. Premier Cho Jung-tai called it \"network throttling, not an internet shutdown.\" Analysts urged greater use of LEO satellites. Beijing dismissed the drill as \"political theatre.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/Why%20Taiwan%20is%20conducting%20its%20first-ever%20mobile%20network%20throttling%20exercise.pdf"}]}, "2026-08-12": {"date": "2026-08-12", "dayOfWeek": "Wednesday", "totalArticles": 85, "sourceCounts": {"WSJ": 20, "ST": 23, "BT": 22, "SCMP": 20}, "executiveDigest": "The Iran standoff turned kinetic: the US fired on a ship breaking its blockade, Iran vowed the Strait of Hormuz would 'stay closed' unless Washington met its terms, and WSJ said Iran is now defying pressure as a 'survival economy' - keeping oil climbing and the refinery squeeze acute. Singapore's momentum built: economists lifted 2026 growth forecasts beyond MTI's upgraded 4.5-5.5% range as MTI reports showed business AI use boosting revenue and jobs. The AI open-weight contest sharpened - Nvidia released a new open model and Meta moved to challenge China's lead - while the yen slid toward 160 per dollar.", "briefingCards": [{"title": "Lead story - US-Iran standoff turns kinetic", "body": "The blockade drew fire: WSJ reported the 'U.S. fires on a ship breaking its blockade of Iran', and an Iranian official said the Strait of Hormuz will 'stay closed unless the US meets Iran's conditions'. WSJ portrayed Iran defying pressure as a 'survival economy' under a 'mysterious ruler' signalling a hard line, and asked whether its 'Trump strategy' is 'dead or alive'; Pakistan, by contrast, said the US and Iran are 'close to a deal despite Trump rhetoric'. Markets kept pricing risk - oil 'continued to climb on US-Iran deal doubts' as stocks retreated, WSJ flagged 'the real oil squeeze is in refineries', and BT asked whether 'the Iran war has damaged US economic credibility'. Abu Dhabi's Adnoc L&S still posted record profit 'despite regional disruption'."}, {"title": "Markets & finance", "body": "Currencies and central banks dominated: the yen inched toward the key 160-per-dollar level as intervention concerns mounted, and WSJ asked 'will the yen need saving again soon?'. The RBA held rates but stayed 'worried about inflation', the Bank of Korea signalled more hikes, and US small-business confidence rose even as existing-home sales fell for a second month. Gold's breakout rally lifted Chinese bullion stocks as central banks kept buying, and 'resilient Europe' became a winning bet for money managers, though a Norway wealth-fund manager warned a 'fund collapse is not impossible'. In Singapore, DBS and OCBC shares could rise on Q2 while UOB drew asset-quality concerns, and Hsieh Fu Hua was named CapitaLand Investment deputy chairman."}, {"title": "Asia realignment", "body": "Friction hardened before a Xi-Trump summit: China hit US pecans with 54% levies, detained Japanese executives in a dual-use export probe, and a survey found US export controls are 'achieving no strategic gain but hurting American firms'. The US faulted China over 'opaque overseas lending' and emerging-market debt risk. Middle powers hedged - Australia and Vietnam boosted ties 'in a world becoming more uncertain', Thailand prepared to use military ties as leverage in US talks, and a new Hong Kong trade office in Malaysia was pitched as a Greater Bay Area bridge. Security signals grew: a China missile test 'deepened the Pacific divide', and Pakistan's 'Islamic Nato' pact put India 'on edge'."}, {"title": "Energy & climate", "body": "The Iran blockade kept crude bid and spotlighted refining - WSJ said 'the real oil squeeze is happening in refineries' - as ST profiled 'how China became the world's great oil power' and Adnoc L&S posted record profit. Samsung SDI bought GM's stake in a US battery JV, and Malaysia renewed a 10-year energy plan targeting about $27.5 billion in savings. Climate stress mounted: jellyfish forced three reactors offline at a French nuclear plant, low water on the Rhine began disrupting German industry, Europe's hot summer stunted Austrian crops, and SD Guthrie flagged El Nino hitting 2027-28 palm-oil output."}, {"title": "Technology & AI", "body": "The open-weight contest intensified: Nvidia released a new open model, WSJ explained 'why open-weight AI models matter and Meta benefits', and SCMP said Meta will 'challenge China's open-weight AI dominance amid US regulatory fears' - even as Meta moved to unwind a US$2 billion Manus AI deal after a Beijing block. Infrastructure names ran hot - CoreWeave's revenue doubled and Super Micro's profit surged - while Alibaba touted AI data centres 'built in 100 days at 10% lower cost' and a US$30 annual AI subscription. Leadership shifted as longtime OpenAI exec Brad Lightcap prepared to step down, and ST framed the tech sell-off as 'testing AI hype, but not the end of the infrastructure story'."}, {"title": "Singapore & SEA focus", "body": "Growth optimism firmed: BT reported 'economists are lifting 2026 forecasts beyond MTI's upgraded 4.5-5.5% range' on the AI boom, and MTI studies showed business AI use improving revenue and employment - and that non-stop flights to emerging markets could further boost the economy. Markets and policy were active: DBS and OCBC could climb on Q2 (UOB asset-quality watch), SGX is eyeing single-stock ETFs and tie-ups, OCBC opened retail platinum and palladium trading, and Keppel's telco unit won an IMDA subsea-cable licence. On the watch list, Beijing's offshore trust-tax changes 'could affect wealth hubs including Singapore', and talk of private and resale HDB markets 'decoupling' could spark a buyer frenzy."}], "keyMetrics": [{"value": "85", "label": "Articles curated today", "sub": "WSJ 20 · ST 23 · BT 22 · SCMP 20"}, {"value": "US fires on ship", "label": "Iran blockade turns kinetic", "sub": "Hormuz to 'stay closed'"}, {"value": "Climbing", "label": "Oil on deal doubts", "sub": "Squeeze hits refineries"}, {"value": ">4.5-5.5%", "label": "Economists lift SG 2026", "sub": "AI boom beyond MTI upgrade"}, {"value": "~160", "label": "Yen per US dollar", "sub": "Intervention concerns mount"}, {"value": "Open model", "label": "Nvidia releases; Meta pushes", "sub": "Challenging China's open weights"}], "articles": [{"id": "wsj-01", "title": "Abu Dhabi's Adnoc L&S Posts Record Quarterly Profit Despite Regional Disruption", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Finance & Markets", "Energy", "Geopolitics"], "summary": "Abu Dhabi-based maritime logistics firm Adnoc L&S, part of state oil giant Adnoc, reported record second-quarter net profit of $917 million for the three months ended June 30, up from $229 million a year earlier, despite the six-month Iran war disrupting Strait of Hormuz trade. Strong shipping rates, higher chartering activity and an expanded fleet drove earnings, aided by diversified operations and long-term Adnoc Group contracts. The company committed about $2.3 billion to vessel acquisitions and newbuilds this year within $5.7 billion of capital commitments. Lower utilization and reduced day rates hit its jack-up barge fleet. It raised full-year guidance a third time while warning results remain highly dependent on regional developments.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Abu%20Dhabi's%20Adnoc%20LS%20Posts%20Record%20Quarterly%20Profit%20Despite%20Regional%20Disruption.pdf"}, {"id": "wsj-02", "title": "CoreWeave Shares Jump as Revenue Doubles From Year Earlier", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Cloud-computing firm CoreWeave posted a fifth straight quarter of record revenue, reporting $2.58 billion for the June quarter, beating a $2.55 billion forecast, and a sales backlog of $104 billion, nearly double its November order book. Shares rose about 13% after hours from a $90.32 close. CoreWeave, 12.8% owned by Nvidia, buys Nvidia GPUs and leases them to Microsoft and OpenAI. It reported a net loss of $626 million, better than the $677 million expected, lifting cumulative losses near $2.3 billion. Investors focus on capacity constraints, heavy capital spending and construction delays. Executive Brannin McBee said, \"We're executing better than expected,\" adding capacity is effectively sold out this year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/CoreWeave%20Shares%20Jump%20as%20Revenue%20Doubles%20From%20Year%20Earlier.pdf"}, {"id": "wsj-03", "title": "Hanwha Offers to Buy Builder of U.S. Navy Ships", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Defence", "Trade"], "summary": "South Korea's Hanwha has made a nonbinding offer valued at more than $1 billion to buy Austal USA, a Mobile, Alabama builder of ships and submarine parts for the U.S. Navy and Coast Guard. Austal supplies submarine modules to General Dynamics Electric Boat for Virginia- and Columbia-class submarines, employs about 3,500 workers, and includes repair facilities in San Diego. Hanwha is expanding its U.S. commercial and military shipbuilding ambitions as President Trump seeks to revitalize domestic shipbuilding. The article also notes Trump extended for 90 days a waiver of the century-old Jones Act, which requires inter-port U.S. shipments use American-made vessels; 212 foreign-ship voyages have occurred since March 17.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Hanwha%20Offers%20to%20Buy%20Builder%20of%20U.S.%20Navy%20Ships.pdf"}, {"id": "wsj-04", "title": "Insurance Risks Remain High as Wildfire Threat Rises, Swiss Re Institute Says", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Environment", "Finance & Markets"], "summary": "The Swiss Re Institute said insured natural-catastrophe losses fell sharply to an estimated $42 billion in the first half of 2026, down from $91 billion a year earlier and the lowest first-half total since 2020, also 16% below the ten-year average. Total economic losses dropped to $100 billion from $152 billion. However, it warned wildfire is the fastest-growing weather peril globally, with record June heat raising European wildfire risk; European insured wildfire losses have risen 8% to 11% annually in real terms since 1970. Severe convective storms remained the biggest loss driver. It cautioned the long-term upward trend in insured losses is intact and second-half hurricane season could lift totals.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Insurance%20Risks%20Remain%20High%20as%20Wildfire%20Threat%20Rises,%20Swiss%20Re%20Institute%20Says.pdf"}, {"id": "wsj-05", "title": "Iran Is Defying U.S. Pressure by Becoming a 'Survival Economy'", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "President Trump is betting sanctions and a naval blockade will force Iran to concede, but Tehran is adopting time-tested survival measures: rationing goods, limiting foreign currency, slashing investment and shifting burdens onto households while preserving strategic imports. Analysts warn making Iran poorer is easier than changing its leaders' decisions, and that Tehran may keep escalating to raise costs over the Strait of Hormuz. Iran's oil exports fell to near zero in July after the blockade resumed, down from $4.5 billion in June; no tankers loaded at Kharg Island. Annual inflation exceeds 80%, with chicken up 190%. The IMF expects the economy to shrink 5.4% this year, risking millions of jobs.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Iran%20Is%20Defying%20U.S.%20Pressure%20by%20Becoming%20a%20'Survival%20Economy'.pdf"}, {"id": "wsj-06", "title": "Iran's Mysterious Ruler Signals a Hard Line on Trump With New Leadership", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "Iran's new supreme leader Mojtaba Khamenei, son of Ali Khamenei who was killed with security chiefs in February U.S.-Israeli strikes, signaled a hard line on Trump through a sweeping leadership overhaul on Sunday and Monday. Unseen publicly since the war began and reportedly injured, he named seasoned hard-liners to security posts. Mohsen Rezaei, former Revolutionary Guard commander, becomes secretary of the Supreme National Security Council and Khamenei's personal representative; Brig. Gen. Ahmad Vahidi leads the Guard and Hossein Taeb the Basij. Analysts said appointments reflect determination to resist concessions on Iran's nuclear program and the Strait of Hormuz. Rezaei, 71, rejects any Hormuz corridor Iran doesn't control; the council remains split on a deal.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Iran's%20Mysterious%20Ruler%20Signals%20a%20Hard%20Line%20on%20Trump%20With%20New%20Leadership.pdf"}, {"id": "wsj-07", "title": "Iran's Trump Strategy—Dead or Alive", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "The WSJ editorial board argues Iran's efforts to kill President Trump help explain why the U.S. is fighting. Officials now say Trump was smuggled off a plane in a catering container in July to avoid an Iranian threat, flown secretly out of Turkey on a military jet while reporters remained on a decoy presidential plane. The board recounts Tehran billboards depicting Trump in a coffin, clerical labels demanding his death, and a fatwa echoing the one against Salman Rushdie. It notes broken-up murder-for-hire plots by the Revolutionary Guard and a Pakistani national's March conviction. The board says Iran wants to run out the clock on Trump's presidency or hasten it with violence.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Iran's%20Trump%20Strategy-Dead%20or%20Alive.pdf"}, {"id": "wsj-08", "title": "Longtime OpenAI Exec Brad Lightcap to Step Down", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Technology & AI"], "summary": "Brad Lightcap, OpenAI's former chief operating officer, is stepping down, the latest leadership change at the artificial-intelligence lab. In a note to staff posted on X, Lightcap said he was leaving to \"start something new,\" adding he believes in OpenAI more than ever and will help advance its mission from a different vantage point. Lightcap joined OpenAI in 2018 and served as operating chief from 2022 before transitioning to a special-projects role in the spring, the Journal reported. His exit follows the departure of product and business chief Fidji Simo, OpenAI's second-ranking executive, who said last month she was stepping aside after taking medical leave in the spring.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Longtime%20OpenAI%20Exec%20Brad%20Lightcap%20to%20Step%20Down.pdf"}, {"id": "wsj-09", "title": "Mamdani Takes on Amazon in New Battle Over New York's Delivery Workers", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Society", "Politics"], "summary": "New York Mayor Zohran Mamdani on Monday backed a City Council bill, the Delivery Protection Act, that would force Amazon, FedEx and others to directly employ delivery workers instead of using subcontractors. Warehouse operators would need city licenses meeting new safety, training and employment rules, requiring thousands of contract couriers be hired. Mamdani cited a 2025 comptroller report finding injury-causing crashes rose in 78% of neighborhoods near last-mile facilities, and accused corporations of \"exploitative subcontracting.\" Amazon warned it could relocate warehouses and put over 5,000 subcontractor jobs at risk, citing average pay near $24 an hour and safety investments. New York could become the first city mandating such direct employment; New Jersey recently sued Amazon.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Mamdani%20Takes%20on%20Amazon%20in%20New%20Battle%20Over%20New%20York's%20Delivery%20Workers.pdf"}, {"id": "wsj-10", "title": "Nvidia Releases New Open Model", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Technology & AI"], "summary": "Nvidia, a leading backer of open AI, released a new open model called Nemotron 3.5 Lightning on Tuesday, alongside Nemo Switchyard, an \"open-source model routing library\" that automatically selects models for AI agent tasks. Executive Kari Briski said both help enterprises cut AI token costs and protect proprietary data, since routers send routine tasks to cheaper, smaller models while balancing quality, latency and cost. Open models let firms self-train on their own data and guard intellectual property. The release came a day after Meta unveiled its open model Muse Glimmer. The article's radar notes Anthropic is courting investors for a potential record IPO valued at $965 billion, targeting a September or October debut.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Nvidia%20Releases%20New%20Open%20Model.pdf"}, {"id": "wsj-11", "title": "Reserve Bank of Australia Holds Rates Steady but Remains Worried About Inflation", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Finance & Markets"], "summary": "The Reserve Bank of Australia left its official cash rate unchanged at 4.35% on Tuesday, in line with expectations, after three increases earlier this year. The nine-member board voted unanimously to hold, saying it remains focused on ensuring high inflation does not become embedded and warning inflation is still too high. It does not expect inflation to return near its target midpoint until late 2027, citing upside risks. Weaker second-quarter inflation gave scope to pause, while falling housing prices weigh on spending; ANZ expects capital-city home prices to fall more than 10%. The RBA flagged Middle East war keeping oil and commodity prices elevated. BlackRock Australia anticipates one further rate increase this year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Reserve%20Bank%20of%20Australia%20Holds%20Rates%20Steady%20but%20Remains%20Worried%20About%20Inflation.pdf"}, {"id": "wsj-12", "title": "Samsung SDI Buys GM's Stake in U.S. Battery JV", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Energy", "Finance & Markets"], "summary": "Samsung SDI has acquired General Motors' 49.99% stake in SynergyCells, a $3.5 billion U.S. battery joint venture, ending the partnership amid sluggish electric-vehicle demand. The South Korean battery maker said Tuesday it will use the plant in New Carlisle, Indiana, under construction since 2024, to make batteries for energy storage systems and other high-tech applications rather than EVs. Global automakers and battery makers have scaled back U.S. plans given weak demand and the Trump administration's elimination of EV incentives. Samsung SDI said it and GM will continue a strategic partnership on next-generation prismatic batteries. The plant, originally designed for 27 gigawatt hours of EV batteries annually, could be repurposed for the fast-growing U.S. storage market.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Samsung%20SDI%20Buys%20GM's%20Stake%20in%20U.S.%20Battery%20JV.pdf"}, {"id": "wsj-13", "title": "Super Micro Computer Fourth-Quarter Profit Surges as Gross Margin Improves", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Super Micro Computer reported surging fiscal fourth-quarter profit and nearly doubled sales, crediting a better customer and product mix for improved margins. Gross margin reached 17.5%, above its 15% to 17% forecast. Profit was $1.17 billion, or $1.62 a share, versus $195.2 million a year earlier; adjusted earnings of $1.70 beat the 92-cent estimate. Net sales rose to $11.12 billion from $5.76 billion, at the lower end of guidance because of customer delays in power, cooling and networking. Shares jumped 8.6% to $34.33 after hours. CEO Charles Liang said the company booked over $60 billion in new orders and record backlog, forecasting fiscal 2027 net sales of $65 billion to $72 billion, well above analyst estimates.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Super%20Micro%20Computer%20Fourth-Quarter%20Profit%20Surges%20as%20Gross%20Margin%20Improves.pdf"}, {"id": "wsj-14", "title": "Top German General Says Russia Is Probing NATO Defenses With Hybrid Attacks", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Germany's top military officer, Gen. Carsten Breuer, said Russia is systematically using drones to probe European air defenses for weaknesses within an intensifying gray-zone campaign. \"Hybrid attacks are taking place every day in NATO countries,\" he told the Journal, warning Russia is shifting its economy and military to prepare for wider conflict with the West. The assessment underpins Germany's first military strategy since World War II, asserting broader European security leadership. Breuer noted a disarmed explosive-laden drone near a Ukrainian cargo plane and a July Russian cruise missile crash in Poland. Berlin plans 30 billion euros for space assets by 2030 and will produce Tomahawk missiles. Breuer is a candidate to chair NATO's military committee.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Top%20German%20General%20Says%20Russia%20Is%20Probing%20NATO%20Defenses%20With%20Hybrid%20Attacks.pdf"}, {"id": "wsj-15", "title": "U.S. Fires on Ship Breaking Its Blockade of Iran", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "U.S. forces fired on a Panama-flagged ship attempting to run the American blockade of Iranian ports early Tuesday, the military said, escalating enforcement as Washington squeezes Tehran economically. A Navy MH-60 helicopter fired two Hellfire missiles into the engine room of the M/V Vela Nova after its crew ignored warnings while crossing the Gulf of Oman toward an Iranian port. Central Command said the ship is no longer transiting to Iran; all 17 crew were accounted for with no immediate casualties. In June, three Indian sailors were killed enforcing the blockade. Control of the Strait of Hormuz, carrying about a fifth of global oil, remains central to stalled de-escalation talks. Trump reimposed the blockade in July.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/U.S.%20Fires%20on%20Ship%20Breaking%20Its%20Blockade%20of%20Iran.pdf"}, {"id": "wsj-16", "title": "U.S. Small Business Confidence Rose Last Month", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Finance & Markets"], "summary": "Confidence among U.S. small businesses rose in July as hiring plans improved, the National Federation of Independent Business said Tuesday. Its small-business optimism index climbed to 99.8, the highest since August 2025, beating economists' expected reading of 97. Small businesses account for nearly half of private-sector jobs and are often more sensitive to price swings, higher interest rates and uncertainty. A seasonally adjusted net 20% of owners plan to add jobs over the next three months, up 9 points from June and the highest hiring-plan level since October 2022. Both actual and planned price increases dropped notably, and reports of inflation as the top problem fell for the first time this year. Labor quality was the leading concern.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/U.S.%20Small%20Business%20Confidence%20Rose%20Last%20Month.pdf"}, {"id": "wsj-17", "title": "Who's Really Holding Up the Gaza Deal?", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "The WSJ editorial board argues Hamas, not Israel, is blocking progress on a Gaza deal, noting that in the past 10 months no Hamas terrorist has surrendered a weapon. Israel held fire for seven days after a meeting between Board of Peace director Nickolay Mladenov and Prime Minister Netanyahu, until a Hamas sniper drew return fire Tuesday. As Israel's October election nears, Netanyahu wants to look firm on security. A senior U.S. official said Washington understands his political needs provided he reins in strikes. The board voices reservations about a 15-point road map departing from the 2025 Trump plan, warning provisions on demilitarization and disarmament could let Hamas game a sector-by-sector approach.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Who's%20Really%20Holding%20Up%20the%20Gaza%20Deal.pdf"}, {"id": "wsj-18", "title": "Why Open-Weight AI Models Matter and Meta Benefits from Them", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Technology & AI"], "summary": "Meta chief Mark Zuckerberg on Monday called Meta's open-weight AI models \"open source AI\" in a 6,500-word essay, pledging more releases and citing national-security importance. The WSJ argues the label is misleading: none of the models are truly open-source. Open-source software exposes full source code for anyone to use, modify and improve collaboratively. Open-weight models differ; the training code and methods stay hidden, so users cannot see, retrain or add data, though they can adjust the numerical weights to specialize or alter behavior. Such modification can be useful or harmful if bad actors remove safeguards. Because Meta controls training and capabilities, it remains best positioned to benefit, keeping open-weight models closely tied to the company rather than a community.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Why%20Open-Weight%20AI%20Models%20Matter%20and%20Meta%20Benefits%20from%20Them.pdf"}, {"id": "wsj-19", "title": "Why the Real Oil Squeeze Is Happening in Refineries", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Energy", "Finance & Markets"], "summary": "The bigger squeeze in energy markets is downstream in refineries, where disruptions from the Iran war, Ukrainian attacks on Russian energy infrastructure and China's fuel-export restrictions have pulled millions of barrels of refined products off global markets. Refining margins have surged; the U.S. 3-2-1 crack spread topped $70 last month versus its typical teens, while average U.S. gasoline reached $4 a gallon from $3.16 a year ago. With Strait of Hormuz flows unlikely to normalize soon and Gulf refinery repairs taking months, tightness could persist. Refiners have secured enough crude via reshuffled trade flows and reserve releases, but plants running above 90-95% utilization leave little spare capacity, so a single outage could hit supply disproportionately.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Why%20the%20Real%20Oil%20Squeeze%20Is%20Happening%20in%20Refineries.pdf"}, {"id": "wsj-20", "title": "Will the Yen Need Saving Again Soon?", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Finance & Markets"], "summary": "The WSJ editorial board warns that recent joint Tokyo-Washington intervention to stabilize the yen has not held, with the currency resuming a downward march. A key error was the Bank of Japan's late-July decision to hold short-term rates steady; its policy rate is negative in inflation-adjusted terms, and the gap with higher foreign rates pressures the yen. A July BOJ summary hints at rate increases \"faster than market expectations.\" But politicians worry higher rates raise costs of servicing government debt near 230% of GDP. Prime Minister Sanae Takaichi asked Governor Kazuo Ueda to step up bond purchases after pushing a record 122.3 trillion yen budget. The board says reforms and normal policy are needed to avoid further rescues.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Will%20the%20Yen%20Need%20Saving%20Again%20Soon.pdf"}, {"id": "st-01", "title": "Australia, Vietnam boost ties in hedge against China in a world 'becoming more uncertain'", "source": "ST", "date": "12 Aug 2026", "tags": ["Geopolitics", "Southeast Asia", "Trade"], "summary": "Australia and Vietnam committed on Aug 11 to strengthen military cooperation and expand trade, deepening ties amid shared concerns over China's assertiveness. Visiting Vietnamese President To Lam and PM Anthony Albanese announced a new deal to safeguard supply chains for critical minerals, clean energy and superconductors. Two-way trade has soared from A$14.6 billion in 2020 to over A$30 billion in 2025, fuelled by Australian iron ore, coal and education, and Vietnamese manufactures. Analysts said both nations are hedging against China's military clout and US-China economic coercion, though Australia's US alliance and Vietnam's non-aligned stance cap the partnership. VietJet will fly Ho Chi Minh City to western Sydney from January 2027; RMIT will build a Hanoi campus.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Australia,%20Vietnam%20boost%20ties%20in%20hedge%20against%20China%20in%20a%20world%20'becoming%20more%20uncertain'.pdf"}, {"id": "st-02", "title": "China hits US pecans with 54% levies before Xi-Trump summit", "source": "ST", "date": "12 Aug 2026", "tags": ["Trade", "Geopolitics"], "summary": "China ordered steep anti-dumping deposits on pecan imports from the US and Mexico, adding trade friction weeks before an expected September summit between Donald Trump and Xi Jinping. From Aug 11, US pecan importers must pay a 54.3 per cent deposit, while Mexican rates range from 17.8 to 51.6 per cent. The Commerce Ministry cited provisional findings that pecans were sold at unfairly low prices. The impact is limited: US pecan shipments to China fell to US$6.9 million in the first four months of 2026 from US$77.2 million two years earlier, as China shifted to South African supply. The probe began September 2025; American pecans already faced 10 per cent tariffs from March 2025.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/China%20hits%20US%20pecans%20with%2054%20levies%20before%20Xi-Trump%20summit.pdf"}, {"id": "st-03", "title": "China missile test deepens Pacific divide over growing militarisation", "source": "ST", "date": "12 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "China's July test of a nuclear-capable missile into the Pacific, its first known ballistic launch there since September 2024, exposed limits to Pacific leaders' \"Ocean of Peace\" ambitions. Fired hours after Fiji and Australia signed a landmark defence treaty, the test drew individual alarm but no collective condemnation from Pacific Islands foreign ministers meeting in Suva. Papua New Guinea called it \"totally inappropriate\"; China said it was conducted safely. Kiribati and Nauru, which switched recognition from Taiwan, opposed a joint statement, and New Zealand's Winston Peters blamed foreign influence for the impasse. The launch capped a year of intensified US-China military activity across the contested region. Leaders meet in Palau in three weeks.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/China%20missile%20test%20deepens%20Pacific%20divide%20over%20growing%20militarisation.pdf"}, {"id": "st-04", "title": "Europe's hot summer stunts Austrian crops, prompts rush to slaughterhouse", "source": "ST", "date": "12 Aug 2026", "tags": ["Environment", "Society"], "summary": "Europe's scorching summer is hurting agriculture even in water-rich Austria, where heat has stunted crops and forced cattle down from parched Alpine pastures for early slaughter. Dairy farmer Johann Fessl said weeks without rain left shortages of water and grass, raising feed costs and lengthening slaughterhouse waiting lists, with some talking of emergency slaughters. AgrarMarkt Austria expects the grain harvest to be 19 per cent smaller this year. Corn yields collapsed, and greenhouse tomato growers near Linz reported widespread blossom-end rot rendering fruit unsellable. The persistent heat and lack of precipitation reflect a wider European climate stress on food production. One silver lining: growers said carrots are thriving exceptionally because of the heat.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Europe's%20hot%20summer%20stunts%20Austrian%20crops,%20prompts%20rush%20to%20slaughterhouse.pdf"}, {"id": "st-05", "title": "How China became the world's great oil power", "source": "ST", "date": "12 Aug 2026", "tags": ["Energy", "Geopolitics", "Finance & Markets"], "summary": "The Iran war caused petroleum history's largest supply shock, yet oil never hit the US$150 many predicted, partly thanks to Beijing. Between February and June, China halved crude imports by 5.5 million barrels a day, enough to shave US$30 or more off Brent, experts reckon. It used three levers: drawing down brimming stockpiles, curbing refined-product exports, and suppressing domestic demand as fuel prices rose and commuters switched to metros and EVs. Refinery runs fell sharply; petrochemical makers substituted coal and ethane for Gulf feedstocks. GDP still grew 4.3 per cent in Q2. Analysts dub China \"the new OPEC,\" though its finite stocks mean it cannot ration imports indefinitely like the cartel can cut output.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/How%20China%20became%20the%20world's%20great%20oil%20power.pdf"}, {"id": "st-06", "title": "Intel raises US$20 billion from expanded stock sale", "source": "ST", "date": "12 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Intel raised US$20 billion from an upsized share offering on Aug 11, funding the costly build-out of its chip contract-manufacturing business by cashing in on a stock surge. Priced at US$95 a share, a 2.6 per cent discount, the sale beat its initial US$15 billion target. Intel shares have nearly trebled in 2026, outperforming AMD, Nvidia and the Philadelphia Semiconductor Index. AI-agent demand for CPUs pushed Intel to lift 2026 capex guidance to US$20 billion, and it committed to high-volume 14A production in 2028, with Tesla an early customer. Trump said Apple would make processors with Intel, though unconfirmed. JPMorgan, Goldman Sachs, Morgan Stanley and Citigroup are joint book-runners. An analyst said the raise makes \"perfect sense.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Intel%20raises%20US20%20billion%20from%20expanded%20stock%20sale.pdf"}, {"id": "st-07", "title": "Low levels of river Rhine begin to disrupt German industry", "source": "ST", "date": "12 Aug 2026", "tags": ["Environment", "Trade", "Energy"], "summary": "German companies reported growing disruption as record-low Rhine water levels curb one of Europe's main freight arteries after weeks of drought. Chemicals maker Covestro declared force majeure on polyether polyols used in mattresses and insulation, unable to fully offset lost barge capacity with trucks and trains. Evonik's Marl park saw hampered production; utilities Uniper and EnBW reported lower hydroelectric output; steelmaker Salzgitter shifted coal to rail from Rotterdam. Industry body VCI warned \"alarm bells are ringing loudly.\" Up to 150 trucks are needed to replace one barge. Agricultural trader RWZ, which normally ships 50,000 tonnes in July-August, moved under 10 per cent this year, warning conditions become \"catastrophic\" if levels do not recover by October.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Low%20levels%20of%20river%20Rhine%20begin%20to%20disrupt%20German%20industry.pdf"}, {"id": "st-08", "title": "Malaysia renews 10-year energy plan, targeting savings of around $27.5 billion", "source": "ST", "date": "12 Aug 2026", "tags": ["Energy", "Southeast Asia", "Environment"], "summary": "Malaysia on Aug 11 renewed its National Energy Efficiency Action Plan through 2035, targeting savings of about US$21.5 billion (S$27.5 billion) and an 11.6 per cent cut in energy demand. The plan projects cumulative savings of 815,382 terajoules versus business-as-usual, equal to a 26.1 million-tonne reduction in CO2-equivalent emissions. The first NEEAP (2016-2025) delivered 60,886 gigawatt-hours in electricity savings, worth roughly RM16.1 billion, exceeding target. Power demand is set to rise sharply as Malaysia becomes South-east Asia's fastest-growing data-centre hub, drawing investment from Amazon and Microsoft. A 2023 law requires the biggest energy consumers to adopt power-saving measures, supporting pledges to cut emissions 45 per cent by 2030 and reach net-zero by 2050.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Malaysia%20renews%2010-year%20energy%20plan,%20targeting%20savings%20of%20around%2027.5%20billion.pdf"}, {"id": "st-09", "title": "Mecca defence accord underscores West Asia's shifting geopolitical sands", "source": "ST", "date": "12 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Ravi Velloor analyses the Mecca Joint Defence Agreement, signed Aug 7 by Saudi Arabia, Turkey and Pakistan, which stipulates that an attack on one is an attack on all, echoing NATO's Article 5. The three Sunni powers combine Saudi wealth, Turkey's military-industrial base and Pakistan's nuclear arsenal; Egypt participated but skipped the final day, and Qatar helped broker alignment. Velloor argues it likely carries tacit US endorsement, marks a breakout for Pakistani diplomacy, and reflects Saudi fears of encirclement and hedging against American retrenchment. Israel and the UAE are made uneasy, with Turkey eyeing Egypt's inclusion. The accord looks formidable but riddled with ambiguity over whether members would fight for one another in a real conflict.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Mecca%20defence%20accord%20underscores%20West%20Asia's%20shifting%20geopolitical%20sands.pdf"}, {"id": "st-10", "title": "North Korea fired a ballistic missile, South Korean military says", "source": "ST", "date": "12 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "North Korea fired a ballistic missile on Aug 12 toward the sea off the Korean Peninsula's east coast, South Korean and Japanese authorities said, days before major US-South Korea joint drills. The missile flew about 700 km, reaching a maximum altitude near 90 km, and landed outside Japan's exclusive economic zone. Seoul's Office of National Security convened an emergency meeting, urging Pyongyang to halt launches violating UN resolutions; Japan lodged a strong protest via Beijing. The launch followed an Aug 6 firing and precedes Aug 17-27 exercises Pyongyang routinely denounces. On Aug 11 North Korea condemned Japan's defence white paper. Zelensky said Russia used a North Korean missile in an Aug 11 strike killing seven Ukrainian steel workers.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/North%20Korea%20fired%20a%20ballistic%20missile,%20South%20Korean%20military%20says.pdf"}, {"id": "st-11", "title": "Norway wealth fund manager says fund collapse not impossible", "source": "ST", "date": "12 Aug 2026", "tags": ["Finance & Markets"], "summary": "The manager of Norway's US$2 trillion sovereign wealth fund, the world's largest, warned on Aug 11 that its collapse is possible and not wholly improbable given global tensions. Nicolai Tangen, CEO of Norges Bank Investment Management, said the fund's extraordinary growth, partly luck, cannot be expected to continue, noting \"fortunes always end up disappearing,\" citing Spain and Britain. Fuelled by oil and gas revenues, the fund has grown from under 2 billion kroner in 1996 to over 22 trillion kroner today, invested in global equities, bonds and property. Among risks, Tangen cited nuclear war, biological terrorism, and a burst \"AI bubble\" combined with US-China trade war, which he said could wipe out at least 80 per cent of stock investments.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Norway%20wealth%20fund%20manager%20says%20fund%20collapse%20not%20impossible.pdf"}, {"id": "st-12", "title": "OCBC opens up platinum, palladium trading on its app to retail investors", "source": "ST", "date": "12 Aug 2026", "tags": ["Finance & Markets", "Society"], "summary": "OCBC expanded precious-metals trading on its mobile app, letting retail investors trade platinum and palladium bullion from Aug 11 with a minimum of 0.01 ounce, about $23 and $18 respectively. The move builds on digital gold and silver features launched in 2021 and democratises assets once reserved for affluent clients. OCBC Group Research is bullish, forecasting platinum above US$2,000 and palladium above US$1,500 by the first half of 2027; prices stood at US$1,833 and US$1,389 at end-June 2026. The metals are industrial-driven, tied to autos, hydrogen and emissions systems, giving diverging price paths from gold. Wealth head Tan Siew Lee flagged their high-beta risk. App gold and silver customers rose 2.5 times year on year in 2025.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/OCBC%20opens%20up%20platinum,%20palladium%20trading%20on%20its%20app%20to%20retail%20investors.pdf"}, {"id": "st-13", "title": "Pakistan says US, Iran close to deal despite Trump rhetoric", "source": "ST", "date": "12 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "Pakistan's defence minister Khawaja Asif said the US and Iran are \"close to some sort of arrangement\" over the Strait of Hormuz, saying things are \"shaping up in favour of peace,\" even as both sides hardened positions. Al Jazeera reported Iran-Oman talks on reopening the waterway had advanced. Oil erased gains on the comments. The optimism followed Trump's tougher stance on Aug 10 demanding Iran pay reparations for those killed, responding to Iranian demands for compensation over a lapsed June interim deal. Brent traded near US$87.50 a barrel; European diesel futures surged over 10 per cent amid refinery attacks in Libya and Russia. Supertanker rates on the Mideast-to-China route neared US$500,000 a day, more than double pre-war levels.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Pakistan%20says%20US,%20Iran%20close%20to%20deal%20despite%20Trump%20rhetoric.pdf"}, {"id": "st-14", "title": "Romania destroys drones drifting near major offshore gas project in the Black Sea", "source": "ST", "date": "12 Aug 2026", "tags": ["Defence", "Energy"], "summary": "Romanian army divers destroyed two Gerbera-type drones drifting in the country's Black Sea exclusive economic zone near the Neptun Deep offshore gas project, Defence Minister Radu Miruta said on Aug 11. A civilian vessel spotted the drones; Ukraine confirmed they were not its own. Authorities opted for controlled destruction by detonation to protect the shipping lane and platform works. The NATO state, sharing a 614-km border with Ukraine, has faced repeated Russian drone incursions, downing three with F-16s in July. NATO members Romania, Bulgaria and Turkey have neutralised over 150 Black Sea mines and agreed to expand a joint mine-clearing task force to protect critical infrastructure. Neptun Deep, owned by OMV Petrom and Romgaz, is due onstream in 2027, making Romania the EU's largest gas producer.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Romania%20destroys%20drones%20drifting%20near%20major%20offshore%20gas%20project%20in%20the%20Black%20Sea.pdf"}, {"id": "st-15", "title": "S'pore banks Q2 earnings: DBS, OCBC shares could go higher; asset quality concerns resurface at UOB", "source": "ST", "date": "12 Aug 2026", "tags": ["Finance & Markets"], "summary": "DBS and OCBC shares hit fresh highs and could climb further after strong second-quarter results, while asset-quality concerns weighed on UOB, analysts said. Wealth and fee income offset margin pressure. DBS peaked at $77.97 and OCBC at $31.56 on Aug 11; both raised full-year targets, with RHB lifting DBS's target to $81.20 and OCBC's to $32.85. UOB fell 2.63 per cent to $42.16 after flagging a large non-performing asset tied to a Greater China property account; new NPAs hit $902 million, up 90 per cent year on year. Citi downgraded UOB to \"sell,\" though RHB upgraded it to \"buy.\" Saxo's Charu Chanana said Singapore banks are becoming regional wealth platforms rather than pure interest-rate proxies. UOB is selling its asset-management arm to Allianz for $555 million.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/S'pore%20banks%20Q2%20earnings%20DBS,%20OCBC%20shares%20could%20go%20higher%20asset%20quality%20concerns%20resurface%20at%20UOB.pdf"}, {"id": "st-16", "title": "S'pore firms ink new deals in Liaoning as China's rust belt seeks economic turnaround", "source": "ST", "date": "12 Aug 2026", "tags": ["Southeast Asia", "Trade", "Technology & AI"], "summary": "Six new deals spanning healthcare, research and technology were signed by Singapore entities in China's Liaoning province during an Aug 11 trade meeting, as the north-eastern rust belt seeks to revive its slowing, greying economy. Minister Masagos Zulkifli co-chaired the 11th Singapore-Liaoning Economic and Trade Council with Governor Wang Xinwei; the council, formed 2003, last met in 2019. Bilateral trade hit 11.84 billion yuan in 2025, up 28.6 per cent, and grew 45.5 per cent year on year in the first half of 2026. Deals included Aoxin Q&M's 35 million yuan Shenyang dental hospital, data-centre and carbon-fibre projects. ComfortDelGro eyes a phased robotaxi rollout, PSA is optimising Dalian port operations, and Singapore is positioned as a \"trusted gateway\" for Liaoning firms going global.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/S'pore%20firms%20ink%20new%20deals%20in%20Liaoning%20as%20China's%20rust%20belt%20seeks%20economic%20turnaround.pdf"}, {"id": "st-17", "title": "Singapore Exchange eyes single-stock ETFs, tie-ups for growth", "source": "ST", "date": "12 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Singapore Exchange is exploring a broader suite of ETFs, including possible single-stock and leveraged products, and deeper cross-market partnerships to cement its position as South-east Asia's key multi-asset exchange, CEO Loh Boon Chye said. SGX offers 53 ETFs with over $21 billion in assets, launched its first physical gold ETF in March, and will list an active iEdge Singapore Next 50 ETF in September. Singapore equities have hit record highs in 2026 as banks draw investors seeking shelter from geopolitical tensions and AI-trade volatility; SGX shares are up nearly 50 per cent this year. Net income for the year to June rose 7.8 per cent to $698 million. SGX has tied up with Nasdaq and the Thai bourse, and has over 50 IPOs in its pipeline.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Singapore%20Exchange%20eyes%20single-stock%20ETFs,%20tie-ups%20for%20growth.pdf"}, {"id": "st-18", "title": "Strait of Hormuz to stay closed unless US meets Iran's conditions, Iran official says", "source": "ST", "date": "12 Aug 2026", "tags": ["Geopolitics", "Energy", "Defence"], "summary": "The Strait of Hormuz will stay closed until the US changes behaviour and accepts Iran's conditions to end the war, Iran's newly appointed Supreme National Security Council secretary Mohsen Rezaei said on Aug 11, the strongest signal yet that any Iran-Oman transit deal would not immediately reopen it. Tehran demands the US lift its naval blockade, release frozen assets, pay war damages and end regional attacks. Oil futures extended gains. Trump countered by demanding Iran pay compensation over 50 years and calling Tehran \"devious negotiators,\" while Pakistan's Khawaja Asif said the sides were nearing an arrangement. New shipping attacks killed four crew on a cargo vessel in Bab el-Mandeb, and a container ship was hit off Pakistan in a suspected US strike enforcing the blockade.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Strait%20of%20Hormuz%20to%20stay%20closed%20unless%20US%20meets%20Iran's%20conditions,%20Iran%20official%20says.pdf"}, {"id": "st-19", "title": "Talk of private and resale HDB markets decoupling could spark buyer frenzy", "source": "ST", "date": "12 Aug 2026", "tags": ["Society", "Finance & Markets"], "summary": "NUS professor Sing Tien Foo argues that the recent divergence between resale HDB and private housing price indexes does not signal structural decoupling, despite fears it could spark fear-driven buying. HDB resale prices fell 0.3 per cent, a third straight quarterly decline, while URA's private index rose 0.5 per cent. Nearly a third of surveyed veterans believe the markets are decoupling, but two decades of data show cointegration, with segments linked through overlapping buyer pools and household upgrading and downgrading. Private growth was led by landed and Core Central Region homes. Sing warns fear-based buying pushes households beyond their means; average holding periods have fallen sharply without higher returns. He urges decisions based on affordability, not fear of missing out, citing China's property correction.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Talk%20of%20private%20and%20resale%20HDB%20markets%20decoupling%20could%20spark%20buyer%20frenzy.pdf"}, {"id": "st-20", "title": "Tech stock sell-off tests AI hype, but is not end of infrastructure story", "source": "ST", "date": "12 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "July's tech retreat, the Nasdaq's worst July in 20 years with a 3.2 per cent drop, signalled investors are no longer betting tech will keep rallying, as institutions unwound exposure over the mismatch between earnings and capital spending. Analysts say the AI infrastructure build-up continues, with TrendForce estimating top-nine cloud providers' 2026 spending will surge 90 per cent to US$886.7 billion and hit US$1.3 trillion in 2027. Morgan Stanley's Mike Wilson said markets no longer reward AI \"on faith alone.\" AI-related debt has swelled, with hidden liabilities near US$1.65 trillion. SpaceX shares fell despite beating estimates on heavy AI capex, while Amazon and Microsoft rallied. Singapore, heavily exposed via Micron and others, has a large stake in the cycle's durability.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Tech%20stock%20sell-off%20tests%20AI%20hype,%20but%20is%20not%20end%20of%20infrastructure%20story.pdf"}, {"id": "st-21", "title": "Thailand preparing to use military ties as leverage in US talks", "source": "ST", "date": "12 Aug 2026", "tags": ["Trade", "Defence", "Southeast Asia"], "summary": "Thailand plans to warn the Trump administration that steep US tariffs could force it to scale back military cooperation, including the Cobra Gold exercises, an official said. The position would feature in a counter-proposal as reciprocal-trade talks resume later in August. Thailand, which ran a US$51.4 billion trade surplus with the US in 2025, faces a 12.5 per cent Section 301 tariff and is seeking to cap the rate at 19 per cent, offering to eliminate tariffs on US beef, lamb and alcohol. Thailand is one of two US treaty allies in South-east Asia alongside the Philippines. A defence spokesman said he could not confirm the plan, suggesting talks would enhance cooperation. Cobra Gold's 2025 edition drew 8,000 personnel from 30 countries.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Thailand%20preparing%20to%20use%20military%20ties%20as%20leverage%20in%20US%20talks.pdf"}, {"id": "st-22", "title": "The US ammo crunch is a global disaster", "source": "ST", "date": "12 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Bloomberg columnist Andreas Kluth argues the US has depleted \"virtually all\" its global stockpile of high-precision offensive missiles, including ATACMS, PrSM and Tomahawks, during the unwinnable Iran war Trump launched. The Center for Strategic and International Studies estimates two-thirds of Patriots and nearly half of THAAD interceptors are used up. Joint Chiefs chairman Dan Caine warned of the risk before the February attack but was ignored; replenishment will take years. The scarcity constrains Trump's escalation options against Iran and weakens US deterrence globally, from Taiwan and Korea to NATO and Ukraine, which had hoped to buy more American arms. Kluth writes that Washington, once a \"hyperpower,\" now looks diminished, \"almost out of breath and out of ammo,\" calling it a self-inflicted global disaster.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/The%20US%20ammo%20crunch%20is%20a%20global%20disaster.pdf"}, {"id": "st-23", "title": "Zelensky: Ukraine has given US negotiators proposals for ending the war with Russia", "source": "ST", "date": "12 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "President Volodymyr Zelensky said on Aug 11 that Ukraine handed US negotiators proposals for a plan to end the war with Russia, and warned Moscow would use its September parliamentary election as a pretext for new mobilisation. Speaking in his nightly address, he offered no details but urged the US to strengthen Ukrainian air defence and pressure Russia toward ending rather than prolonging the war. US negotiators Steve Witkoff and Jared Kushner last visited Moscow in January and have not been to Kyiv. Russia insists any settlement require Ukraine cede four claimed regions. Zelensky said intelligence showed Russia plans to mobilise several hundred thousand more troops after its \"pseudo-election.\" Russia's Supreme Court barred the anti-war Yabloko party from the vote.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20ST/Zelensky%20Ukraine%20has%20given%20US%20negotiators%20proposals%20for%20ending%20the%20war%20with%20Russia.pdf"}, {"id": "bt-01", "title": "AI boom prompts economists to lift 2026 growth forecasts beyond MTI's upgraded 4.5-5.5% range", "source": "BT", "date": "12 Aug 2026", "tags": ["Southeast Asia", "Technology & AI", "Finance & Markets"], "summary": "Private-sector economists raised full-year Singapore growth forecasts after MTI lifted its official range to 4.5-5.5%, from 2-4%, following a 6.1% H1 expansion. Q2 GDP grew a revised 5.9% year on year, with manufacturing output surging 12.5% on AI-related semiconductor demand. DBS moved to 5%, Maybank to 5.2%, UOB to 5%, while Nomura was most bullish at 5.7%, above MTI's range; RHB held at 4.5%. Economists cited two offsetting forces: a stronger-than-expected AI investment boom and milder-than-feared Middle East impact, though some warned of concentrated, non-broad-based growth and a possible AI-investment correction. Regional peers Taiwan, South Korea and much of South-east Asia also upgraded forecasts on the same export tailwind.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/AI%20boom%20prompts%20economists%20to%20lift%202026%20growth%20forecasts%20beyond%20MTI's%20upgraded%204.5-5.5%20range.pdf"}, {"id": "bt-02", "title": "Australia's July business conditions improve, sentiment fragile", "source": "BT", "date": "12 Aug 2026", "tags": ["Finance & Markets"], "summary": "Australian business conditions improved marginally in July while confidence stayed fragile, a National Australia Bank survey showed, with firms citing cost pressures as renewed Gulf tensions pushed oil prices higher. NAB's business conditions index rose one point to +4, below its +7 long-run trend, while confidence held at -6, well below February levels before the US-Israeli war on Iran began. NAB said elevated uncertainty continued to weigh on confidence, warning of \"continued pressure on margins.\" Transport and utilities drove rises in final prices and purchase costs. Employment and profitability picked up, sales were steady, and capacity utilisation jumped to 83%. The Reserve Bank of Australia was widely expected to hold rates at 4.35% after three hikes this year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Australia's%20July%20business%20conditions%20improve,%20sentiment%20fragile.pdf"}, {"id": "bt-03", "title": "Bank of Korea deputy governor signals more rate hikes on inflation risk", "source": "BT", "date": "12 Aug 2026", "tags": ["Finance & Markets"], "summary": "The Bank of Korea will likely need to raise rates further as strong growth feeds underlying inflation, outgoing senior deputy governor Ryoo Sangdai said, though a stabilising won and softer Kospi give policymakers some flexibility. He said weight will fall on whether core inflation stays elevated, growth momentum holds, and financial stability. His comments reinforce a tightening bias ahead of the Aug 27 meeting. The BOK raised its benchmark to 2.75% in July, its first hike since 2023. Headline inflation cooled to 2.8% in July but stayed above target; core edged up to 2.6%. Ryoo said inflation could persist above the 2% target as the semiconductor boom lifts wages, adding: \"The scale of the increase may not be large, but it could be persistent.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Bank%20of%20Korea%20deputy%20governor%20signals%20more%20rate%20hikes%20on%20inflation%20risk.pdf"}, {"id": "bt-04", "title": "Banking veteran Hsieh Fu Hua appointed deputy chairman and director of CapitaLand Investment", "source": "BT", "date": "12 Aug 2026", "tags": ["Finance & Markets"], "summary": "Banking veteran Hsieh Fu Hua, 75, has been appointed deputy chairman and non-executive independent director of CapitaLand Investment (CLI), effective Aug 12. He will also sit on the group's executive, sustainability, executive resource and compensation, and nominating committees. CLI said his appointment, as it \"accelerates its growth ambitions\" as a global real asset manager, broadens board experience across financial markets, investment management and governance. Chairman Miguel Ko cited his strategic insight and boardroom experience. Hsieh is co-founder and adviser to PrimePartners Group and chairman of GXS Bank, a GIC board director, and chairman of the National University of Singapore and WWF Singapore. He previously led Singapore Exchange, served as Temasek president, and chaired UOB, Tiger Airways and Eastspring. CLI's board will comprise 12 directors, nine independent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Banking%20veteran%20Hsieh%20Fu%20Hua%20appointed%20deputy%20chairman%20and%20director%20of%20CapitaLand%20Investment.pdf"}, {"id": "bt-05", "title": "Beijing's offshore trust tax changes could affect wealth hubs including Singapore", "source": "BT", "date": "12 Aug 2026", "tags": ["Finance & Markets", "Society"], "summary": "China's new Jul 24 rules to tax offshore trusts could have widespread implications for wealth hubs such as Singapore, experts say. Offshore trusts have long served wealthy Chinese families for cross-border asset protection and succession. Within two weeks, Caixin reported tax bureaus levying income tax on insurance-policy returns. The rules sit alongside existing CRS reporting and Controlled Foreign Corporation rules, with authorities cross-checking self-reported figures against automatic account data. Lawyers said residence, not location, now triggers tax, so clients spending significant time in China may be caught even with compliant Singapore structures. Most advisers expect clients to review rather than unwind trusts. Banks including DBS, Bank of Singapore and UOB reported no significant outflows and remain bullish on Singapore's wealth-hub position.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Beijing's%20offshore%20trust%20tax%20changes%20could%20affect%20wealth%20hubs%20including%20Singapore.pdf"}, {"id": "bt-06", "title": "China's car sales extend slide as shift accelerates to overseas markets", "source": "BT", "date": "12 Aug 2026", "tags": ["Trade", "Finance & Markets"], "summary": "China's car sales fell for a 10th straight month in July, though the pace eased, contrasting with surging exports as automakers expand abroad to escape cut-throat home competition. Domestic sales slid 21.1% year on year to 1.47 million vehicles, while exports rose 88.2% to 923,000, China Passenger Car Association data showed. EV and plug-in hybrid exports jumped 147.8%. Over January-July, domestic passenger sales fell 20.5%, about 2.65 million fewer vehicles. CPCA's Cui Dongshu blamed elevated fuel prices and weak entry-level demand. Automakers are pushing into Europe, South-east Asia, Latin America and the Middle East, and tapping idle foreign factories; Geely will build EV SUVs
