to Bloomberg data. The average yield on global government bonds has climbed above 4%, the highest since 2000, driven by fiscal concerns from the US to Japan and France and heavy AI-related debt issuance. US 10-year yields are up more than 70 basis points since the start of the second half, and France's 121 basis points. Some strategists see bonds as attractive again, while others warn oil above US$100 a barrel keeps hike risks underpriced, with the IMF meetings in Bangkok and Wednesday's US September CPI release in focus.", "url": "https://www.businesstimes.com.sg/international/global/global-bond-sell-may-mean-fewer-rate-hikes-central-banks"}, {"id": "bt-12oct-10", "title": "Houthi attacks on Saudi Arabia raise risk of wider war", "source": "BT", "date": "12 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "A strike on Riyadh's main airport on Oct 10 killed 12 people, including an American, and wounded 309, and the airport was hit again on Oct 11 by an unknown projectile, the fourth attack in a week, raising the risk of an escalation that could draw in the US. The Saudi-led coalition blamed the Houthis, who have not claimed that strike, as Saudi jets back a Yemeni government counter-offensive after the Houthis seized Mokha and territory near Bab el-Mandeb. Asked whether the US would join strikes, President Donald Trump said: \"We may. We're going to look at it.\" The attacks have shut the airport, disrupted business events and add to Saudi strain as the government expects a 3.6% economic contraction this year.", "url": "https://www.businesstimes.com.sg/international/houthi-attacks-saudi-arabia-raise-risk-wider-war"}, {"id": "bt-12oct-11", "title": "Interactive: Why the Asean Power Grid’s future lies in subsea cables", "source": "BT", "date": "12 Oct 2026", "tags": ["Energy", "Southeast Asia"], "summary": "A BT interactive feature says delivering the Asean Power Grid (APG) will need US$27 billion of interconnector investment from 2025 to 2040, per the IEA, more than 10 times the US$2 billion the region invested from the 1970s to 2024. Ember analyst Lam Pham says Asean lacks HVDC cable manufacturing and competes with Europe's offshore wind industry for production and installation capacity, pushing up costs and lead times. In a survey of 100 Asean energy professionals, only 24% expect significant cross-border power trading within a decade, while Singapore-Indonesia projects face delays over Jakarta's five-yearly export permit renewals. Asean's Submarine Power Cable Development Framework is the key milestone to watch.", "url": "https://www.businesstimes.com.sg/companies-markets/energy-commodities/interactive-why-asean-power-grids-future-lies-subsea-cables"}, {"id": "bt-12oct-12", "title": "Iran war’s energy shock, record public debt loom over IMF-World Bank meetings in Bangkok", "source": "BT", "date": "12 Oct 2026", "tags": ["Finance & Markets", "Energy", "Geopolitics"], "summary": "Finance officials gather in Bangkok this week for the IMF and World Bank annual meetings under the shadow of the US-Israeli-led war with Iran, now in its eighth month,, the biggest energy supply shock ever and rising interest rates, with US Treasury Secretary Scott Bessent skipping the event. World Bank president Ajay Banga said soaring diesel and fertiliser prices and a looming \"super\" El Nino are hitting at once, though the bank is not cutting its global forecasts for now. The IMF expects little change to its 3% global growth forecast for 2026 but says public debt is at its highest since World War II and will exceed 100% of GDP before 2030. G7 countries agreed to release 100 million barrels of diesel and crude from emergency reserves.", "url": "https://www.businesstimes.com.sg/international/iran-wars-energy-shock-record-public-debt-loom-over-imf-world-bank-meetings-bangkok"}, {"id": "bt-12oct-13", "title": "Malaysia Budget 2027: Election appeal meets the investment test", "source": "BT", "date": "12 Oct 2026", "tags": ["Southeast Asia", "Politics", "Finance & Markets"], "summary": "A BT analysis says Malaysia's Budget 2027, unveiled by Prime Minister Anwar Ibrahim on Oct 9, pairs voter-friendly wage and tax measures with a test of fiscal credibility. The RM510 billion (US$124.8 billion) package targets a deficit of 3.3% of GDP in 2027 from 3.6%, but the shortfall shrinks only RM1 billion to RM77.5 billion, relying on growth rather than spending cuts. The monthly minimum wage rises 17.6% to RM2,000 in June 2027, with MSMEs under RM50 million in sales exempt, and economist Yeah Kim Leng says the budget gives Anwar the \"runway\" for an early election. Operating spending makes up 82% of the federal budget while debt-service charges rise to RM61.01 billion.", "url": "https://www.businesstimes.com.sg/international/malaysia-budget-2027-election-appeal-meets-investment-test"}, {"id": "bt-12oct-14", "title": "Malaysia sees 2027 palm output declining, announces support measures", "source": "BT", "date": "12 Oct 2026", "tags": ["Southeast Asia", "Trade", "Environment"], "summary": "Malaysia expects crude palm oil production to decline marginally in 2027, with prices staying high on tighter supply and biodiesel demand, according to a government economic outlook report released on Oct 9. The report forecasts prices averaging RM4,450 to RM4,600 (US$1,088 to US$1,125) per tonne next year, with El Nino expected to curb output in Malaysia and Indonesia and Indonesian biodiesel demand further tightening supply. Benchmark palm oil traded at RM4,666 at midday on Oct 9, up 17% year to date. Prime Minister Anwar Ibrahim announced RM100 million in hybrid financing for 4,500 smallholders to replant, plus RM200 million in soft loans at 2% interest.", "url": "https://www.businesstimes.com.sg/international/asean/malaysia-sees-2027-palm-output-declining-announces-support-measures"}, {"id": "bt-12oct-15", "title": "MAS flags risks of using AI agents in digital-asset trading", "source": "BT", "date": "12 Oct 2026", "tags": ["Finance & Markets", "Technology & AI", "Southeast Asia"], "summary": "MAS managing director Chia Der Jiun warned on Oct 9 that AI agents moving from analysing information to executing transactions raise risk-management questions, especially for liquidity and collateral. Speaking at an Insead conference in Singapore, he said agents that autonomously optimise trades across tokenised assets and digital money could move money faster \"for smaller differences in benefits and incentives\", forcing institutions to sharpen their value proposition. Chia said deployment requires controls on authority, permissions, identity, accountability and governance, and that institutions must ensure agents act within user instructions and risk limits. MAS and industry earlier this year published the SAFR white paper and an open-source reference implementation, and Chia called public-private partnership essential as standards develop.", "url": "https://www.businesstimes.com.sg/singapore/economy-policy/mas-flags-risks-using-ai-agents-digital-asset-trading"}, {"id": "bt-12oct-16", "title": "Nvidia weighs deeper ties with open-model developer Reflection AI through investment or computing deal", "source": "BT", "date": "12 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Nvidia is in early talks to increase its investment in US open-weight model developer Reflection AI or supply it with computing power, according to a person familiar with the matter. The Financial Times previously reported the talks could lead to an acquisition offer, with options including an \"acqui-hire\", a chip-supply agreement or a larger equity stake. Reflection, founded by two former Google DeepMind researchers, launched its first open-weight model, Beam, in October and has held talks to raise US$2.5 billion at a US$25 billion valuation, the Wall Street Journal previously reported. A tie-up would add to Nvidia's recent deals, including a US$13 billion agreement to buy Hugging Face and a roughly US$20 billion licensing pact with Groq.", "url": "https://www.businesstimes.com.sg/international/global/nvidia-weighs-deeper-ties-open-model-developer-reflection-ai-through-investment-or-computing-deal"}, {"id": "bt-12oct-17", "title": "Singapore’s 2027 Asean chairmanship could advance sustainability, regional energy integration", "source": "BT", "date": "12 Oct 2026", "tags": ["Southeast Asia", "Energy", "Environment"], "summary": "Asean deputy secretary-general Satvinder Singh said on Oct 9 that sustainability, including a planned Green Economic Framework Agreement, and implementing the Digital Economy Framework Agreement will be key priorities when Singapore chairs Asean in 2027. Speaking at the ACCA annual conference, Singh named energy security as one of the region's most pressing challenges, as about 80% of Gulf oil shipped through the Strait of Hormuz flowed to the region before the Iran war. He said higher oil and gas prices would raise the region's energy import bill by close to US$200 billion next year, and urged using the crisis to accelerate clean-energy transition, including the Asean Power Grid. He also called for greater mobility of professional skills across Asean.", "url": "https://www.businesstimes.com.sg/international/asean/singapores-2027-asean-chairmanship-could-advance-sustainability-regional-energy-integration"}, {"id": "bt-12oct-18", "title": "Soaring freight rates threaten Asia’s appetite for US crude", "source": "BT", "date": "12 Oct 2026", "tags": ["Energy", "Trade"], "summary": "Record tanker freight rates are pricing US crude out of reach for Asian refiners, pushing them towards Middle East and Latin American grades, according to traders and shipbrokers. Chartering a VLCC to carry 2 million barrels from the US Gulf to China in November hit US$80 million this week, per Simpson, Spence & Young data, about US$40 a barrel versus US$8.60 before the US-Israeli war on Iran began in February. Refiners are weighing UAE Murban, whose premium rebounded above US$11 a barrel to Dubai on Oct 8, and Argentina's Medanito. Sparta Commodities' June Goh said VLCC rates on key Asia routes have spiked more than 300% since mid-August, citing inefficient ship-to-ship transfers around the Strait of Hormuz closure.", "url": "https://www.businesstimes.com.sg/companies-markets/energy-commodities/soaring-freight-rates-threaten-asias-appetite-us-crude"}, {"id": "bt-12oct-19", "title": "South Korea’s once-hot AI stocks struggle for buyers as doubts grow over memory-chip boom", "source": "BT", "date": "12 Oct 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "South Korea's US$4.3 trillion stock market is losing investor interest as doubts grow over the memory-chip boom, with turnover down 70% from its late-May peak. The Kospi, the best-performing major benchmark in the first half, has lost 22% since to be the worst in the second half, while foreign funds have pulled US$131 billion from Korean stocks this year, the most among major Asian markets. Samsung Electronics and SK Hynix account for over half the index, and Samsung shares fell on Oct 8 despite a nearly nine-fold jump in quarterly operating profit. Investors are favouring Taiwan, whose Taiex is up 70% in 2026 and beat the Kospi by about 23 percentage points last quarter.", "url": "https://www.businesstimes.com.sg/companies-markets/capital-markets-currencies/south-koreas-once-hot-ai-stocks-struggle-buyers-doubts-grow-over-memory-chip-boom"}, {"id": "bt-12oct-20", "title": "ST Engineering opens tech-focused aircraft maintenance facility in Changi; to create over 500 jobs", "source": "BT", "date": "12 Oct 2026", "tags": ["Southeast Asia", "Finance & Markets", "Technology & AI"], "summary": "ST Engineering officially opened its S$170 million Changi Creek airframe maintenance, repair and overhaul (MRO) facility at Changi Airport on Oct 9, its fourth in Singapore. The site will add 40% capacity to its Singapore wide-body airframe MRO network, be fully operational by end-2027 and employ more than 500 people. Commercial aerospace president Kevin Chow said ST Engineering's demand growth is multiples of the 1–2% most analysts project for the global market. The facility uses AI, drones, autonomous vehicles and robots; the robots and autonomous driving technology, developed with A*Star, are expected to free up about 7,800 manhours a year, and Deputy PM Gan Kim Yong said the industry must tap technology to transform work.", "url": "https://www.businesstimes.com.sg/companies-markets/st-engineering-opens-tech-focused-aircraft-maintenance-facility-changi-create-over-500-jobs"}, {"id": "bt-12oct-21", "title": "Trump complained about the weak yen. Days later, Japan PM Takaichi signals the end of reflation", "source": "BT", "date": "12 Oct 2026", "tags": ["Politics", "Finance & Markets", "Geopolitics"], "summary": "A Straits Times analysis carried by BT says Japanese Prime Minister Sanae Takaichi has moved to declare an end to reflation after US President Donald Trump complained about the weak yen at their Sep 22 summit, but analysts see political signalling rather than a change in substance. Takaichi called 2026 the \"first year of responsible, proactive fiscal policy\" on Oct 5 and rejected the reflationary label on Oct 8, while US Treasury Secretary Scott Bessent has warned Tokyo to stop the reflation. The yen fell to around 164 per dollar in July, and Japan has spent more than 27 trillion yen on intervention in 2026. Economists including Sayuri Shirai say Takaichi must deliver concrete productivity measures rather than slogans.", "url": "https://www.businesstimes.com.sg/international/trump-complained-about-weak-yen-days-later-japan-pm-takaichi-signals-end-reflation"}, {"id": "bt-12oct-22", "title": "Trump says Putin to supply US with diesel ahead of November midterms", "source": "BT", "date": "12 Oct 2026", "tags": ["Energy", "Geopolitics", "Politics"], "summary": "US President Donald Trump announced on Oct 9 that he is working with Vladimir Putin to release Russian diesel into global markets, starting with about 13.5 million barrels of cargoes from October, as the White House seeks to curb fuel prices before November's midterms. The US Treasury issued a waiver for previously sanctioned Russian fuel, and Deputy PM Alexander Novak said Russia is lifting its diesel export restrictions early, Tass reported. Ukrainian President Volodymyr Zelenskyy and Senate Democratic leader Chuck Schumer criticised the deal. US diesel futures fell to about US$4.66 a gallon, and TD Securities' Ryan McKay said the impact would be marginal and questioned whether Russian refiners could deliver.", "url": "https://www.businesstimes.com.sg/international/trump-says-putin-supply-us-diesel-ahead-november-midterms"}, {"id": "bt-12oct-23", "title": "US 10-year Treasury yield risks hitting 6% for first time since 2000: Pimco", "source": "BT", "date": "12 Oct 2026", "tags": ["Finance & Markets"], "summary": "Pimco chief investment officer Dan Ivascyn told the Financial Times the 10-year US Treasury yield could rise to 6% for the first time since 2000, driven by high oil prices fuelling inflation and worries over US public debt. The yield, at 5.29%, has risen almost 120 basis points this year and hit 5.34% last week, its highest since 2002. Ivascyn said a sharp rise was feasible in the near term, citing stop-out activity by platform hedge funds and other levered investors. He warned a move to 5.5% or higher would likely bring \"some decent weakness in risk markets, both credit and equity\".", "url": "https://www.businesstimes.com.sg/companies-markets/banking-finance/us-10-year-treasury-yield-risks-hitting-6-first-time-2000-pimco"}, {"id": "bt-12oct-24", "title": "World Bank in talks with dozens of countries about crisis aid: Banga", "source": "BT", "date": "12 Oct 2026", "tags": ["Finance & Markets", "Energy", "Geopolitics"], "summary": "World Bank president Ajay Banga told Reuters the bank is in discussions with 30 to 40 countries about crisis aid to manage energy shocks and price rises from the Middle East war. Few countries have tapped the initial US$25 billion in crisis funds made available in late February, but diesel and fertiliser price spikes and a looming super-El Nino are adding pressure, and Banga expects more demand for the US$50–60 billion available. The bank could provide up to US$100 billion if conditions worsen, more than the US$70 billion disbursed during the pandemic. Banga spoke ahead of this week's IMF and World Bank annual meetings and highlighted a record US$112 billion in private capital mobilised in the year to June.", "url": "https://www.businesstimes.com.sg/companies-markets/banking-finance/world-bank-talks-dozens-countries-about-crisis-aid-banga"}, {"id": "scmp-12oct-01", "title": "Anthropic claims Chinese AI firms secretly use Claude. Is it true?", "source": "SCMP", "date": "12 Oct 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "An SCMP explainer examines Anthropic's claim that Chinese AI developers ran \"industrial-scale\" distillation of its Claude model via fraudulent accounts and proxy networks, in some cases using Claude as a hidden back end for their own apps. Anthropic says Moonshot routed almost 300,000 requests over 10 days, mainly to Opus, through 5,380 fraudulent accounts largely based in Singapore and Japan; a joint NSA, FBI and CISA advisory last month made similar allegations. Analysts are divided: Konstantin Pilz finds the claims credible, while Brookings' Kyle Chan says third-party proxy services known as transfer stations may be the real culprits. The Information reported that the Cyberspace Administration of China questioned seven named developers before narrowing its focus to DeepSeek and Moonshot, and Pilz said that if the claims are true, Beijing's main concern would be data security.", "url": "https://www.scmp.com/tech/tech-war/article/3370317/anthropic-claims-chinese-ai-firms-secretly-use-claude-it-true"}, {"id": "scmp-12oct-02", "title": "Apple’s Tim Cook kicks off China visit amid mixed signals on new iPhone demand", "source": "SCMP", "date": "12 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Apple executive chairman Tim Cook began his third China visit this year, meeting Guangdong governor Meng Fanli on Oct 11 and saying Apple was willing to expand its presence, including in smart manufacturing and sales channels. It is Cook's first China trip since handing the CEO role to John Ternus last month, and follows the September launch of the iPhone 18 Pro line-up and the foldable iPhone Duo, which goes on sale on October 23. Counterpoint Research says first-three-day sales of the new Pro models were 12% above the iPhone 17 Pro's entire first week, making Apple No 1 in China for Sept 14–20. However, Nikkei Asia reported Apple had asked some suppliers to cut component production for the new Pro models.", "url": "https://www.scmp.com/tech/tech-trends/article/3370500/apples-tim-cook-kicks-china-visit-amid-mixed-signals-new-iphone-demand"}, {"id": "scmp-12oct-03", "title": "Australia says it won’t buy Russian fuel despite Trump’s diesel agreement", "source": "SCMP", "date": "12 Oct 2026", "tags": ["Energy", "Geopolitics"], "summary": "Australia will keep its ban on Russian fuel imports so Moscow does not benefit from the invasion of Ukraine, climate change and energy minister Chris Bowen said on Oct 10. \"We don’t need or want Russian fuel in Australia,\" Bowen said, adding that what the US does is a matter for Washington. On Oct 9 President Donald Trump announced Russian diesel cargoes totalling about 13.5 million barrels initially, starting this month, a move that upends years of sanctions as the White House seeks to tame fuel prices before the midterm election. Bowen said Australia held 43 days of petrol, up two days in a week, and 31 days of diesel, down one day.", "url": "https://www.scmp.com/news/asia/australasia/article/3370422/australia-says-it-wont-buy-russian-fuel-despite-trumps-diesel-agreement"}, {"id": "scmp-12oct-04", "title": "Bessent may skip Apec in Hong Kong to focus on Trump’s Shenzhen visit, sources say", "source": "SCMP", "date": "12 Oct 2026", "tags": ["Geopolitics", "Trade"], "summary": "US Treasury Secretary Scott Bessent may skip the Apec finance ministers' meeting in Hong Kong on October 20–21 to focus on preparing for President Donald Trump's visit to Shenzhen for the November 18–19 leaders' meeting, sources told the SCMP. Bessent is expected to meet Vice-Premier He Lifeng in Shenzhen beforehand as the two sides seek a longer extension of the trade truce, which was extended by two months during Xi Jinping's state visit to Washington last month and expires on January 10. Treasury undersecretary for international affairs Erin Browne is the leading candidate to head the US delegation, a source said. US Treasury secretaries have attended only four overseas Apec finance ministers' meetings since 2000.", "url": "https://www.scmp.com/news/china/diplomacy/article/3370295/bessent-may-skip-apec-hong-kong-focus-trumps-shenzhen-visit-sources-say"}, {"id": "scmp-12oct-05", "title": "China state funds double down on Hua Hong in legacy chip push", "source": "SCMP", "date": "12 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Chinese state funds are pouring billions of yuan into Hua Hong Group, parent of the country's second-largest contract chipmaker, and its new Wuxi fab to drive self-reliance in mature-node chips. A filing on Oct 8 showed Hua Hong Group's registered capital rising to 19.7 billion yuan (US$2.9 billion) from 13.5 billion yuan, with the 6.2 billion yuan injection led by Shanghai Guosheng Group, whose direct stake rises to 41.7% from 15.3%. Registered capital of the joint venture behind the Wuxi Fab 9B, backed by the \"Big Fund\", jumped to US$4.17 billion from 6.68 million yuan. Fab 9B will add 55,000 wafers of monthly capacity, lifting Wuxi capacity by about 30%; Hua Hong's Hong Kong shares fell 1.1% to HK$94.55 on Oct 9.", "url": "https://www.scmp.com/tech/big-tech/article/3370297/china-state-funds-double-down-hua-hong-legacy-chip-push"}, {"id": "scmp-12oct-06", "title": "China wants 5 innovative drugs with US$1 billion returns by 2030. Which might they be?", "source": "SCMP", "date": "12 Oct 2026", "tags": ["Society", "Finance & Markets"], "summary": "Beijing's new five-year targets call for at least five Chinese drugs with annual global sales above US$1 billion by 2030, a goal analysts at Jefferies, Atlas Venture and DBS consider achievable. BeOne Medicines' zanubrutinib (Brukinsa), with US$3.9 billion in 2025 revenue, and Legend Biotech's Carvykti, with US$1.9 billion, already exceed the threshold. Other contenders named are Akeso's ivonescimab, which Evaluate forecasts could reach US$8.5 billion by 2032, BeOne's tislelizumab (US$737 million in 2025, up 18.8%) and Kelun-Biotech's sac-TMT, licensed to Merck outside China. DBS's Mark Kong says Chinese first-in-class drugs are about 22% of the global total, against a 25% target for 2030.", "url": "https://www.scmp.com/business/china-business/article/3370340/china-wants-5-innovative-drugs-us1-billion-returns-2030-which-might-they-be"}, {"id": "scmp-12oct-07", "title": "Chinese nickel investors brace for headwinds as Indonesia weighs smelter freeze", "source": "SCMP", "date": "12 Oct 2026", "tags": ["Southeast Asia", "Trade", "Finance & Markets"], "summary": "Indonesia is weighing a halt to construction of smelters producing semi-finished nickel products such as nickel pig iron and nickel matte amid a global glut, state news agency Antara reported, citing energy and mineral resources minister Bahlil Lahadalia. Such products make up about 50–60% of Indonesia's output, and Chinese investment accounts for about 75% of its nickel refining industry, per the Centre for Advanced Defense Studies. Analysts say Chinese-invested projects could be delayed or cancelled, with ISEAS's Siwage Dharma Negara calling Jakarta's \"regulatory uncertainty\" the bigger concern. The minister's team is preparing a recommendation for President Prabowo Subianto on which segments to restrict.", "url": "https://www.scmp.com/economy/global-economy/article/3370344/chinese-nickel-investors-brace-headwinds-indonesia-weighs-smelter-freeze"}, {"id": "scmp-12oct-08", "title": "Chinese optical chip stocks extend rout amid fears of potential US curbs", "source": "SCMP", "date": "12 Oct 2026", "tags": ["Finance & Markets", "Technology & AI", "Trade"], "summary": "Chinese optical chip stocks fell for a second session on Oct 9 on fears of US curbs on next-generation optical transceivers, as the CSI 300 slid 1.3% by midday to its lowest since August last year. Laser chip suppliers were hit hardest: Yuanjie Semiconductor dropped 6.5% after a 20% limit-down plunge on Oct 8, and Everbright Photonics fell 5.4%. The sell-off followed an October 1 Morgan Stanley report warning the FCC could restrict Chinese-made transceivers, likely 3.2T products, as early as this month, possibly allowing imports with at least 65% US-sourced bill-of-materials value. Dongshan Precision called the 65% requirement market speculation, and Everbright said 3.2T production is not expected until 2028 or 2029.", "url": "https://www.scmp.com/tech/tech-war/article/3370305/chinese-optical-chip-stocks-extend-rout-amid-fears-potential-us-curbs"}, {"id": "scmp-12oct-09", "title": "How Taiwan’s military manpower shortage is undermining its ability to fight", "source": "SCMP", "date": "12 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "Taiwan's military volunteer staffing rate has stayed below its 80% target for a third straight year, the Legislative Yuan Budget Centre warned in its assessment of the 2027 budget, raising concerns over combat readiness. The rate peaked at 88.52% in 2020, fell to 75.93% in 2024, stood at 77.31% at end-2025 and 76.62% at end-June, with many front-line Category I units, including infantry, artillery and missile units, below the benchmark. Max Lo of the Taiwan International Strategic Study Society warned there may be weapons \"but not necessarily enough people to operate them\" as Taiwan receives 66 F-16Vs, the first two delivered last week. Men eligible for compulsory service are projected to fall below 80,000 next year.", "url": "https://www.scmp.com/news/china/military/article/3370477/how-taiwans-military-manpower-shortage-undermining-its-ability-fight"}, {"id": "scmp-12oct-10", "title": "Japan’s Sumitomo Bakelite expands China chip packaging materials output amid AI boom", "source": "SCMP", "date": "12 Oct 2026", "tags": ["Technology & AI", "Southeast Asia"], "summary": "Japan's Sumitomo Bakelite said on Oct 9 it will add production lines for mould underfill (MUF) materials and compression-moulding granules at its facilities in Suzhou and Singapore, without disclosing the investment amount. The expansion is expected to roughly double its MUF capacity and triple compression-moulding granule capacity; the Singapore lines are due to start at end-fiscal 2028 and the Suzhou lines in fiscal 2030. The company cited fast-growing demand for advanced chips for generative AI and communications satellites, particularly in China and Southeast Asia. It is the second Suzhou expansion in under four months, and Sumitomo Bakelite is also buying part of Kyocera's chemical materials business for about 30 billion yen (US$189.6 million).", "url": "https://www.scmp.com/tech/tech-trends/article/3370468/japans-sumitomo-bakelite-expands-china-chip-packaging-materials-output-amid-ai-boom"}, {"id": "scmp-12oct-11", "title": "Kurt Campbell on US deterrence, the Quad, Aukus and Taiwan after Xi-Trump summit", "source": "SCMP", "date": "12 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "In an SCMP interview, former US deputy secretary of state Kurt Campbell says containing China is impossible and the framework is \"outmoded\", but urges Washington to shore up ties with allies, criticising President Donald Trump for focusing more on China than on partners such as Canada. He backs stabilising US-China relations but says AI cooperation is complicated by Trump seeking dialogue while insisting on dominance. On Taiwan, he argues treating arms sales as negotiable could inject doubt into the credibility that has preserved cross-strait stability. Campbell says the Quad has not met at leader level under Trump and there is no push to institutionalise it, and that Southeast Asian countries are keeping flexibility in dealing with both Washington and Beijing.", "url": "https://www.scmp.com/news/china/diplomacy/article/3370485/kurt-campbell-us-deterrence-quad-aukus-and-taiwan-after-xi-trump-summit"}, {"id": "scmp-12oct-12", "title": "Open-source AI is Europe’s only path to tech independence, says Alibaba chairman Joe Tsai", "source": "SCMP", "date": "12 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Alibaba Group Holding chairman Joe Tsai said at the Wave tech event in Italy that open-source AI is the only way for Europe to achieve technological independence, citing China's open-source drive as a blueprint. He said European factories hold valuable manufacturing data that firms should keep and use to train open-source models rather than feed into closed-source APIs. Tsai said Alibaba is using the US$25 billion of free cash flow from e-commerce to fund AI infrastructure and models, and has doubled computing capex every year for three years. He argued US export controls have fuelled China's AI ecosystem, and predicted AI will be infused in every aspect of business within five years. Alibaba owns the SCMP.", "url": "https://www.scmp.com/tech/tech-trends/article/3370428/open-source-ai-europes-only-path-tech-independence-says-alibaba-chairman-joe-tsai"}, {"id": "scmp-12oct-13", "title": "Putin aide looks to boost Russian shipbuilding ties with China during visit", "source": "SCMP", "date": "12 Oct 2026", "tags": ["Geopolitics", "Trade"], "summary": "Russian presidential aide and Maritime Board chairman Nikolai Patrushev held talks in Beijing with Chinese vice-minister of industry and information technology Ke Jixin on Chinese shipbuilders becoming technology partners and equipment suppliers for new Russian shipyards, the Maritime Board said on Saturday. On his six-day trip, which began in Shanghai on Thursday, Patrushev visited Waigaoqiao Shipbuilding, calling current cooperation \"quite limited\" and proposing jointly building ice-class vessels, including for Chinese Arctic shipping. He also visited Shanghai Jiao Tong University and Yangshan Port, proposing joint investment in Russian berthing and terminal infrastructure. Russia set up the Maritime Board in 2024 and is developing a trans-Arctic transport corridor.", "url": "https://www.scmp.com/news/china/diplomacy/article/3370497/putin-aide-looks-boost-russian-shipbuilding-ties-china-during-visit"}, {"id": "scmp-12oct-14", "title": "Soaring component costs force laptop makers to rethink shift away from China: report", "source": "SCMP", "date": "12 Oct 2026", "tags": ["Technology & AI", "Trade", "Finance & Markets"], "summary": "Rising component costs are pushing notebook makers to rethink moving production out of China, according to Taiwan-based TrendForce, which projects the share of global notebook production outside mainland China will fall to 21% this year from about 24% in 2025 and below 20% in 2027. TrendForce said that unless tariffs intensify, production costs and supply-chain completeness will outweigh policy risk. It expects global notebook shipments to fall by a low single-digit percentage in 2027, or high single digits if chip costs keep rising; CPUs, DRAM and SSDs make up about 68% of the bill of materials for a mainstream US$900 laptop. Separately, IDC said global PC shipments plunged about 20% year on year to 62.7 million units in the third quarter.", "url": "https://www.scmp.com/tech/tech-trends/article/3370341/soaring-component-costs-force-laptop-makers-rethink-shift-away-china-report"}, {"id": "scmp-12oct-15", "title": "Taiwanese leader welcomes talks between Washington and Beijing ‘to reduce risk of war’", "source": "SCMP", "date": "12 Oct 2026", "tags": ["Geopolitics", "Politics"], "summary": "Taiwanese leader William Lai Ching-te used his Double Tenth address on Oct 10 to welcome the US and China \"managing their competition through dialogue to reduce the risk of conflict and war\", while accusing Beijing of military and grey-zone pressure to change the status quo. Taiwan Affairs Office spokeswoman Zhang Han accused him of stirring up confrontation across the Taiwan Strait, without addressing his comments on US-China talks. Lai said higher defence spending was meant to deter war, not provoke, and that Taiwan was open to dialogue on an equal footing; he also said Taiwan's growth was expected to exceed 11%, the highest in 39 years. Analysts said he avoided some earlier contentious phrasing, reflecting improving US-China ties after Xi Jinping and Donald Trump met in Washington last month.", "url": "https://www.scmp.com/news/china/politics/article/3370442/taiwanese-leader-welcomes-talks-between-washington-and-beijing-reduce-risk-war"}, {"id": "scmp-12oct-16", "title": "The EU’s China dilemma: how to counter Beijing without alienating friends", "source": "SCMP", "date": "12 Oct 2026", "tags": ["Trade", "Geopolitics"], "summary": "An SCMP analysis examines how the EU's proposed Industrial Accelerator Act (IAA), which would channel EU funds and public contracts to EU-made products in sectors such as EVs, steel, cement and clean tech and impose conditions on big investments mainly from China, is alienating partners. Japan's EU ambassador Kazutoshi Aikawa likened it to the US Inflation Reduction Act, and an EPP lawmaker said South Korea had warned of countermeasures. Germany-led members want FTA partners included, while France-led states want it narrow; a small group of EPP lawmakers proposed scrapping it. The Times reported Britain was considering matching EU tariffs of up to 45% on Chinese EVs to gain access to subsidies, after Chinese models took 23% of UK new-car sales last month.", "url": "https://www.scmp.com/news/china/diplomacy/article/3370482/eus-china-dilemma-how-counter-beijing-without-alienating-friends"}, {"id": "scmp-12oct-17", "title": "What are the concerns and priorities behind the new language used to define China-US ties?", "source": "SCMP", "date": "12 Oct 2026", "tags": ["Geopolitics"], "summary": "After presidents Xi Jinping and Donald Trump met in Washington last month, the two sides pledged a \"constructive relationship of strategic stability on the basis of respect, fairness and reciprocity\", extending the phrase agreed in May. According to people familiar with the matter, Washington pushed for the fairness and reciprocity wording while Beijing insisted on respect, softening its resistance after the US agreed to mutual respect. Chinese Foreign Minister Wang Yi said respect covered sovereignty, territorial integrity and core interests, a term used for issues such as Taiwan. The International Crisis Group's Ali Wyne said China's expansive conception of respect lets it frame almost any US competitive action as undercutting the framework.", "url": "https://www.scmp.com/news/china/diplomacy/article/3370323/what-are-concerns-and-priorities-behind-new-language-used-define-china-us-ties"}, {"id": "scmp-12oct-18", "title": "What’s in a name? What China and Trump call AI reveals how they see its future", "source": "SCMP", "date": "12 Oct 2026", "tags": ["Technology & AI", "Politics"], "summary": "US President Donald Trump last week signed an executive order directing federal agencies to replace the term artificial intelligence with Super Intelligence (SI) in official communications, saying the word artificial makes the technology sound fake. An SCMP feature contrasts this with China's term rengong zhineng, borrowed from Japanese, which Aarhus University's Shuang Frost says translates literally as \"human-made intelligence\". In March, a People's Daily online commentary called for a shorter, catchier Chinese alternative to the English abbreviation AI. Frost says the Chinese term could be challenged by recursive self-improvement making AI less visibly human-made, while NUS associate professor Chao Hao suggests chaoji zhineng (super intelligence) could supplement it.", "url": "https://www.scmp.com/tech/tech-trends/article/3370269/whats-name-what-china-and-trump-call-ai-reveals-how-they-see-its-future"}, {"id": "scmp-12oct-19", "title": "Why are mainland China’s tax officials suddenly so interested in my Hong Kong MPF?", "source": "SCMP", "date": "12 Oct 2026", "tags": ["Finance & Markets", "Society"], "summary": "In a first-person SCMP column, journalist Frank Chen describes a call from Shanghai's municipal tax bureau asking about his Hong Kong Mandatory Provident Fund (MPF) contributions, saying the MPF had been categorised as a type of offshore trust. A Beijing-based colleague also received a text from the city's tax service asking for declarations of offshore trust holdings. The official said the call was routine record-keeping, not a tax demand, and agreed pensions should not be taxed. Chen argues authorities should define offshore trusts clearly, warning taxing pensions could deter talent from Shanghai. The column notes China announced in July a flat 20% tax on all offshore trust income, as part of an enforcement drive to shore up strained local government finances.", "url": "https://www.scmp.com/economy/china-economy/article/3370354/why-are-mainland-chinas-tax-officials-suddenly-so-interested-my-hong-kong-mpf"}, {"id": "scmp-12oct-20", "title": "Will Taiwan issue derail Washington and Beijing’s latest reset? Analysts are sceptical", "source": "SCMP", "date": "12 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "Analysts say recent US-Taiwan interactions, including former leader Tsai Ing-wen's week-long US visit and the opening of a Taipei Economic and Cultural Office in Phoenix, Arizona, are unlikely to derail improving US-China ties, though a US$14 billion arms package awaiting Donald Trump's approval remains Beijing's key concern. Tsai's itinerary included a meeting with Nancy Pelosi and a Stanford speech accusing Beijing of grey-zone activities. US ambassador to China David Perdue said Trump had authorised 50% more arms transfers to Taiwan than any president since 1979. Nanjing University's Zhu Feng said Trump might approve the package before next month's midterms, which would damage relations without overturning the consensus; Renmin University's Shi Yinhong expects no impact on a possible Xi-Trump meeting at Apec in Shenzhen in November.", "url": "https://www.scmp.com/news/china/politics/article/3370402/will-taiwan-issue-derail-washington-and-beijings-latest-reset-analysts-are-sceptical"}, {"id": "tass-12oct-01", "title": "EU defense commissioner calls for stopping to rely on US help regarding Ukraine", "source": "TASS", "date": "12 Oct 2026", "tags": ["Geopolitics", "Politics"], "summary": "European Commissioner for Defense and Space Andrius Kubilius has called on the EU to stop expecting US help in settling the Ukraine conflict, TASS reports. Writing on X, Kubilius said the EU had been Ukraine's only serious financial supporter while waiting for US leadership to bring peace, and that the EU and Ukraine now need an \"independent Peace Strategy\". TASS notes he gave no reason for the shift, and notes an October 9 phone call between Vladimir Putin and Donald Trump that covered oil product supplies. The agency adds that, according to the European Commission, the EU has spent €228.5 billion supporting Kyiv since the conflict began.", "url": "https://tass.com/world/2200583"}, {"id": "tass-12oct-02", "title": "EU promises Kiev more funds for drones, missiles amid statements from US", "source": "TASS", "date": "12 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "European Commission President Ursula von der Leyen said after a phone call with Ukrainian President Volodymyr Zelensky that the EU will provide further funding for drones and missiles for Ukraine, TASS reports. The pledge followed US President Donald Trump's remarks that Ukraine needs a new president and should find \"a new leader who can make a deal\". Writing on X, von der Leyen said Ukraine would be front and centre at the coming European Council, which will discuss its funding needs for the year ahead, and that the EU would soon open two further clusters of accession negotiation chapters. TASS also cites Kremlin spokesman Dmitry Peskov saying Moscow wants a comprehensive, lasting settlement.", "url": "https://tass.com/world/2200585"}, {"id": "tass-12oct-03", "title": "Houthis say they attacked Saudi Aramco facilities, airports in Saudi Arabia", "source": "TASS", "date": "12 Oct 2026", "tags": ["Geopolitics", "Energy", "Defence"], "summary": "Yemen's Houthis say they struck Saudi Aramco facilities in eastern Saudi Arabia and airports in Riyadh and Dammam, TASS reports. Houthi spokesman Yahya Saria said four operations using ballistic and cruise missiles and drones hit a gas processing facility in Shedgum and an oil facility in Tanajib, causing fires, and suspended navigation at King Khalid International Airport in Riyadh and King Fahd International Airport in Dammam. Saria said the strikes responded to 124 Saudi-led coalition airstrikes on Yemen in a day. According to Saudi Arabia's General Authority of Civil Aviation, a Houthi attack on Riyadh's airport on October 10 killed 12 people and wounded 309.", "url": "https://tass.com/world/2200579"}, {"id": "tass-12oct-04", "title": "Iran warns ships against transiting Strait of Hormuz with their navigation systems off", "source": "TASS", "date": "12 Oct 2026", "tags": ["Geopolitics", "Energy", "Defence"], "summary": "Iran's Islamic Revolutionary Guard Corps has warned that vessels crossing the Strait of Hormuz with navigation and identification systems switched off will be classified as hostile, TASS reports. In a statement, the IRGC Navy's press office said such ships \"will be subject to severe punishment\". The IRGC added that three tankers that violated Iran's transit rules have struck sea mines and caught fire since the previous day.", "url": "https://tass.com/world/2200591"}, {"id": "tass-12oct-05", "title": "Iran-Oman agreement on Hormuz Strait doesn’t provide for its immediate reopening", "source": "TASS", "date": "12 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "Iranian Deputy Foreign Minister Kazem Gharibabadi said Iran's agreement with Oman on shipping routes through the Strait of Hormuz is a legal act but does not mean the strait will reopen immediately, TASS reports, citing SNN television. He said the two countries are seeking to register the agreement with the International Maritime Organization, but that reopening \"depends entirely on the United States fulfilling its obligations\" and Tehran is not obliged to reopen it at this stage. Gharibabadi said Iran will keep controlling the strait until Washington accepts there is no military solution. Foreign Ministry spokesman Esmail Baghaei said on October 7 the two sides had agreed coordinates for safe corridors.", "url": "https://tass.com/world/2200593"}, {"id": "tass-12oct-06", "title": "No sanctions bills ban US from importing diesel from Russia — Treasury Secretary", "source": "TASS", "date": "12 Oct 2026", "tags": ["Geopolitics", "Energy", "Trade"], "summary": "US Treasury Secretary Scott Bessent told Fox News the administration has full legal authority to import Russian diesel and that no congressional sanctions bill prohibits it, TASS reports. Bessent said anyone in Congress claiming an old bill or the current Lindsey Graham bill bars the imports is wrong. The comments follow an October 9 Putin-Trump phone call on petroleum product supplies, after which, according to Russian Deputy Prime Minister Alexander Novak, Russia will lift its diesel export ban early and supply 300,000 tons in October, 500,000 tons in November and 1 million tons in December. TASS said the US has issued a general licence allowing Russian diesel supplies to world markets until April 7, 2027.", "url": "https://tass.com/world/2200543"}, {"id": "tass-12oct-07", "title": "Russian diesel imports beneficial to Americans — Treasury Secretary", "source": "TASS", "date": "12 Oct 2026", "tags": ["Energy", "Trade", "Geopolitics"], "summary": "US Treasury Secretary Scott Bessent told Fox News that agreements to import Russian diesel are \"good for the American people\" because they will lower diesel prices, TASS reports. The deal follows an October 9 phone call in which Vladimir Putin and Donald Trump discussed petroleum product supplies, with Putin saying Moscow reiterated its readiness to supply oil and oil products to the US and global markets. According to Russian Deputy Prime Minister Alexander Novak, Russia will lift its diesel export ban early and is ready to supply 300,000 tons in October, rising to 1 million tons in December and possibly 3 million tons a month later. TASS says Washington has issued a general licence for Russian diesel supplies until April 7, 2027.", "url": "https://tass.com/world/2200551"}, {"id": "tass-12oct-08", "title": "Trump’s call to remove Zelensky reflects mood among Ukrainians — Russian legislator", "source": "TASS", "date": "12 Oct 2026", "tags": ["Geopolitics", "Politics"], "summary": "Russian senator Grigory Karasin, first deputy chairman of the Federation Council's international affairs committee, said US President Donald Trump's call for Ukraine to change its president will resonate in Ukrainian society, TASS reports. Writing on Telegram, Karasin said private \"kitchen discussions\" about Volodymyr Zelensky had long touched on the topic, though he acknowledged replacing Zelensky has not been a visible focus of public debate. Karasin also linked Trump's remarks to Zelensky's recent call to British Prime Minister Andy Burnham. Trump had said it was time for Ukraine to find a leader capable of making a deal.", "url": "https://tass.com/politics/2200417"}, {"id": "xinhua-12oct-01", "title": "Australia expects sufficient east coast gas supply in Q1 2027", "source": "XINHUA", "date": "12 Oct 2026", "tags": ["Energy"], "summary": "According to Xinhua, Australia's Department of Industry, Science and Resources said on Oct. 9 that the east coast gas market is expected to have enough supply to meet domestic demand in January–March 2027, with a projected surplus of 5–15 petajoules (PJ). The department cited the latest forecasts from the Australian Competition and Consumer Commission (ACCC) and the Australian Energy Market Operator. The ACCC's September 2026 Gas Inquiry report puts the surplus 9 PJ lower than previously forecast, mainly because of declining production in southern states and higher export demand. The government will not launch a formal shortfall review for the quarter and will keep assessing supply quarterly until its Domestic Gas Reservation Scheme takes effect.", "url": "https://english.news.cn/20261009/d88810eb7d644df7882a1bb0f5793de0/c.html"}, {"id": "xinhua-12oct-02", "title": "China urges focus on climate change, cooperation at Arctic Circle Assembly", "source": "XINHUA", "date": "12 Oct 2026", "tags": ["Environment", "Geopolitics"], "summary": "Former Chinese vice foreign minister Fu Ying, leading China's delegation to the 2026 Arctic Circle Assembly in Reykjavik (Oct. 8–10), said climate change rather than \"imagined\" security threats is the real challenge facing the Arctic, Xinhua reports. In a plenary dialogue with former Icelandic president and Arctic Circle chairman Olafur Ragnar Grimsson, Fu urged countries to pool resources for scientific research and environmental protection instead of geopolitical competition. She cited a China–Iceland leaders' joint statement last year on climate and green energy cooperation, and said China has no intention of seeking global hegemony. The assembly drew more than 2,500 representatives from over 70 countries and regions.", "url": "https://english.news.cn/20261011/4a152f166aa64c71ae1189bed4df4fce/c.html"}, {"id": "xinhua-12oct-03", "title": "China warns against Japan's rising neo-militarism", "source": "XINHUA", "date": "12 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "Chinese Ministry of National Defense spokesperson Chen Xi said on Oct. 10 that what he called neo-militarism in Japan has become a \"mutant gray rhino running out of control,\" threatening the post-WWII order, the non-proliferation regime and regional stability, Xinhua reports. He was responding to Japanese Prime Minister Sanae Takaichi's recent speech on defence capabilities and discussions on revising Japan's three national security documents. Chen accused Tokyo of citing neighbouring security threats as an excuse to speed up remilitarisation and of trying to breach its three non-nuclear principles. He said Japan should halt attempts at constitutional revision for military expansion and nuclear weapon possession.", "url": "https://english.news.cn/20261010/2f982d4a478b43fb9977a18972680737/c.html"}, {"id": "xinhua-12oct-04", "title": "China's finance ministry pledges vigorous, effective implementation of more proactive fiscal policy", "source": "XINHUA", "date": "12 Oct 2026", "tags": ["Finance & Markets"], "summary": "China's Ministry of Finance said on Oct. 9 it will step up counter-cyclical adjustments and roll out additional measures in a timely manner, according to its report on fiscal policy in the first half of 2026 carried by Xinhua. Special treasury bonds will be issued to recapitalise eight central financial institutions, and bond issuance will be accelerated to support projects. First-half general public budget spending rose 1.5% to 14.33 trillion yuan, with healthcare up 10.8%, while GDP grew 4.7%; the 2026 deficit target is around 4% of GDP, or 5.89 trillion yuan. A new mortgage subsidy of 1 percentage point a year for eligible first-home buyers took effect on Oct. 1.", "url": "https://english.news.cn/20261009/f7051c6bdae6459da362ea2c51c6bc1e/c.html"}, {"id": "xinhua-12oct-05", "title": "China, EU reaffirm stable, balanced ties as key trading partners: commerce ministry", "source": "XINHUA", "date": "12 Oct 2026", "tags": ["Trade", "Geopolitics"], "summary": "China and the EU agreed to address trade differences within WTO rules and explore reducing tariffs on certain goods after Commerce Minister Wang Wentao and EU trade commissioner Maros Sefcovic chaired the second meeting of their trade and investment consultation mechanism in Beijing on Oct. 8–9, a Chinese commerce ministry official said, according to Xinhua. Talks covered medical devices, cosmetics, pharmaceuticals, inverters and agri-food, plus a technical dialogue on the EU's Foreign Subsidies Regulation. The official said discussions on electric and hybrid vehicles helped prevent further escalation, and that the EU will keep working on key dual-use export licensing cases involving China. A ministerial video conference is planned for January and the third meeting for March 2027.", "url": "https://english.news.cn/20261010/c358a50d65154748ba5571ff13420b14/c.html"}, {"id": "xinhua-12oct-06", "title": "Chinese military to work with U.S. side to strengthen cooperation, manage differences: spokesperson", "source": "XINHUA", "date": "12 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "Chinese Ministry of National Defense spokesperson Chen Xi said on Oct. 10 that the Chinese military stands ready to work with the US side to strengthen communication and cooperation and properly manage differences, Xinhua reports. Chen was responding to a media query about upcoming engagement between the two militaries. He said the Chinese military would \"promote steady, sound and sustainable development\" of military ties, and that both sides should help build a constructive China-US relationship of strategic stability based on respect, fairness and reciprocity. The short report gave no details of the planned engagement.", "url": "https://english.news.cn/20261010/41bae66181434d08a47a7a8361083105/c.html"}, {"id": "xinhua-12oct-07", "title": "Economic Watch: Europe's economic risks behind rising U.S. Treasury yields", "source": "XINHUA", "date": "12 Oct 2026", "tags": ["Finance & Markets", "Energy"], "summary": "A Xinhua \"Economic Watch\" analysis says the 10-year US Treasury yield climbed to around 5.36% in the week of Oct. 5–9, its highest in nearly 24 years, and that elevated US yields could strain Europe through higher sovereign borrowing costs, cross-market financial risks and a stronger dollar. It notes the UK 10-year gilt yield rose to 5.527%, highest since 2007, and cites ESM research that an unexpected US$25 billion rise in net Treasury supply can lift 10-year Bund yields by 10–15 basis points. Euro-area investors held about US$1.95 trillion in US Treasuries as of July 2026. The piece adds that a dollar up about 5% against the euro this year could worsen energy-driven inflation, with euro-area energy prices up 18.8% in September.", "url": "https://english.news.cn/20261012/eac11d6d890c45e5ac30eadec6ed1ed6/c.html"}, {"id": "xinhua-12oct-08", "title": "Global economic growth expected to slow to 2.6 pct in 2026: UNCTAD", "source": "XINHUA", "date": "12 Oct 2026", "tags": ["Finance & Markets", "Trade"], "summary": "UNCTAD projects global growth of 2.6% in 2026, down from 2.9% in 2025, in its Trade and Development Report 2026 released on Oct. 9, Xinhua reports. Developing economies are expected to grow 4%, easing from 4.7%, while trade in goods and services is projected to expand about 4% at constant prices as rising energy prices push up trade values. Asia is set to account for 59% of global growth, with East Asia at the heart of the semiconductor and advanced computing boom, and AI products now the main driver of merchandise trade. The report warns the energy shock and financial instability are testing the global economy and urges diversifying energy supply rather than broad monetary and fiscal tightening.", "url": "https://english.news.cn/20261009/433840fddfa54648b6888075d35acdd2/c.html"}, {"id": "xinhua-12oct-09", "title": "High-frequency data points to China's improving economic momentum in Q3", "source": "XINHUA", "date": "12 Oct 2026", "tags": ["Finance & Markets"], "summary": "High-frequency data from the State Information Center under the National Development and Reform Commission, released on Oct. 11, show China's economy continued to improve in Q3, according to Xinhua. Offline consumption payments rose 2.6% year on year in Q3, 0.7 percentage points faster than Q2, and 3.1% in September, while new special-purpose bond issuance jumped 50.2% in September. Capital investment in frontier sectors such as AI and humanoid robots surged 184.1% in Q3, and new-infrastructure contract values rose 34.2%. The manufacturing PMI returned to expansion at 50.1 in September; China targets 2026 growth of 4.5–5% after 4.7% in the first half.", "url": "https://english.news.cn/20261011/5dad5070d25840c5adc791e08a7df649/c.html"}, {"id": "xinhua-12oct-10", "title": "Iran not to abandon nuclear technology on a \"bullying\" power's demand: atomic chief", "source": "XINHUA", "date": "12 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "Atomic Energy Organization of Iran (AEOI) president Mohammad Eslami said on Oct. 11 that Iran will not abandon its domestically developed nuclear technology because a \"bullying\" power demands it, Xinhua reports, citing an AEOI statement. Speaking at a Tehran conference, Eslami cited US officials' threats to attack Iran's nuclear facilities and denounced US and Israeli strikes on IAEA-safeguarded sites and the agency's failure to condemn them. AEOI spokesman Behrouz Kamalvandi said the programme is peaceful and under continuous IAEA supervision, IRNA reported. Xinhua notes that US-Iran talks under a June 18 memorandum of understanding, due to conclude by Aug. 17, failed to make sufficient progress.", "url": "https://english.news.cn/20261012/87a41ff9747544fa9cc31118a252dd63/c.html"}, {"id": "xinhua-12oct-11", "title": "Iran's IRGC says hit \"giant\" LPG ship seeking to cross Hormuz Strait through \"illegal\" route", "source": "XINHUA", "date": "12 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "The navy of Iran's Islamic Revolution Guard Corps (IRGC) said on Oct. 9 its forces had hit a large LPG carrier, identified as NV Sunshine, as it tried to cross the Strait of Hormuz via what the IRGC called an \"illegal\" route south of the waterway, causing a fire in its engine room and propulsion system, Xinhua reports citing Sepah News. The IRGC blamed the US military for the incidents and said companies co-operating with Washington would be sanctioned. It said vessels using the unauthorised route will be pursued anywhere in the region, not just in the strait. Separately, President Masoud Pezeshkian told Vladimir Putin on Oct. 8 that Iran will not abandon talks with the US despite two attacks during previous negotiations.", "url": "https://english.news.cn/20261009/ab969c09fb8f4608b416775a66547d32/c.html"}, {"id": "xinhua-12oct-12", "title": "Iran's IRGC says \"violating\" supertanker caught fire after hitting mine in Hormuz Strait", "source": "XINHUA", "date": "12 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "The IRGC navy said on Oct. 11 that a crude-carrying supertanker exploded and caught fire in its engine room earlier that day after hitting a naval mine south of the Strait of Hormuz, Xinhua reports citing Sepah News. According to the IRGC, the tanker had switched off its navigation systems and entered what the IRGC calls the \"unauthorized\" route while trying to leave the strait. The IRGC said it was the third such tanker since Oct. 10 to hit mines on that route and catch fire. The vessel was not named.", "url": "https://english.news.cn/20261012/821ac14f6f804064beac931f238ed393/c.html"}, {"id": "xinhua-12oct-13", "title": "Japan's Cabinet approves bill for 1st food consumption tax cut", "source": "XINHUA", "date": "12 Oct 2026", "tags": ["Politics", "Finance & Markets"], "summary": "Japan's Cabinet on Oct. 9 approved a bill to cut the consumption tax on food and beverages from 8% to 1% for two years from fiscal 2027, starting next April, and to introduce annual cash benefits for low- and middle-income earners, Xinhua reports. The government aims to pass it in the current extraordinary Diet session, which ends on Dec. 12. The package is expected to cost about 10 trillion yen (about US$63 billion) over two years, raising concerns about Japan's already weak fiscal health, and opposition lawmakers have questioned its funding and eligibility criteria. It would be the first cut in Japan's consumption tax since its introduction in 1989.", "url": "https://english.news.cn/20261009/eb0ef7d772324bb08f93cf97cd7c022f/c.html"}, {"id": "xinhua-12oct-14", "title": "News Analysis: China's trade strength rooted in competitiveness, not currency depreciation", "source": "XINHUA", "date": "12 Oct 2026", "tags": ["Finance & Markets", "Trade"], "summary": "A Xinhua \"News Analysis\" argues China's export strength stems from industrial competitiveness rather than currency valuation, after the People's Bank of China said in an Oct. 8 policy statement that China has neither the need nor the intention to devalue for trade advantage. Citing the PBOC, it says the yuan rose about 9% against the dollar in 2020–21 while China's global export share gained 1.7 percentage points, and fell over 8% in 2022 as the share dropped 0.7 points. Chinese economists quoted say deficit countries' problems are structural, and the piece notes onshore and offshore yuan have strengthened past 6.7 per dollar this year. The PBOC says the yuan's future direction remains uncertain.", "url": "https://english.news.cn/20261010/d2faba9a974644cfb0d4bfb9bafb48ab/c.html"}, {"id": "xinhua-12oct-15", "title": "Putin says Russia ready to help Iran resolve regional conflict", "source": "XINHUA", "date": "12 Oct 2026", "tags": ["Geopolitics"], "summary": "Russian President Vladimir Putin told Iranian President Masoud Pezeshkian at a meeting in Turkmenbashi, Turkmenistan, on Oct. 8 that Moscow is ready to do everything in its power to help Tehran resolve the regional conflict, Xinhua reports citing the Kremlin. Putin said Iran had put forward new proposals for a peaceful settlement and that bilateral trade grew more than 21% last year under their comprehensive strategic partnership treaty signed in early 2025. Pezeshkian criticised the US for unilateralism and said Iran seeks to end the war quickly while ensuring its rights. He said Iran had revised the US proposal and talks would continue through mediators once initiatives are finalised.", "url": "https://english.news.cn/20261009/fa900f7fc2e14fe5aa3b725cd7fe9722/c.html"}, {"id": "xinhua-12oct-16", "title": "Putin, Trump hold phone talks on Ukraine crisis, energy supply", "source": "XINHUA", "date": "12 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "Russian President Vladimir Putin and US President Donald Trump held a 1.5-hour phone call on Oct. 9 covering Ukraine, Iran and energy, with Russia reaffirming readiness to supply oil and products to US and global markets, Xinhua reports citing the Kremlin. Trump wrote on Truth Social that Russia will immediately supply over 300,000 tons of diesel, 500,000 tons in November and 1,000,000 tons thereafter, later followed by 3,000,000 tons. The US Treasury issued a temporary general licence allowing Russian-origin diesel sales, and Deputy PM Alexander Novak said Russia will lift diesel export curbs early. Kremlin aide Yury Ushakov said Kyiv's drone attacks during the Duma elections had ruled out an immediate restart of trilateral talks.", "url": "https://english.news.cn/20261010/ca65550b25784b8d99d841bc20b3c2c9/c.html"}, {"id": "xinhua-12oct-17", "title": "Taiwan leader's speech exposes him as threat to peace: mainland defense spokesperson", "source": "XINHUA", "date": "12 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "Chinese Ministry of National Defense spokesperson Chen Xi said on Oct. 11 that Taiwan leader Lai Ching-te's Oct. 10 speech showed him to be a \"threat to peace,\" Xinhua reports, with the agency characterising the speech as reiterating a secessionist agenda. Chen accused the Democratic Progressive Party authorities of pursuing separatism for party interests and undermining stability in the Taiwan Strait. He said the PLA's regular drills around the island are meant to deter separatist activities and external interference. Chen urged people in Taiwan to join the mainland in opposing separatist forces.", "url": "https://english.news.cn/20261011/1ea110ba46a54075b3738cc8ec7264fe/c.html"}, {"id": "xinhua-12oct-18", "title": "U.S. accepts some of Iran's conditions, status of others remains unclear: security official", "source": "XINHUA", "date": "12 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "Mohsen Rezaei, secretary of Iran's Supreme National Security Council, told Press TV that the US has accepted some of Iran's seven conditions for reopening the Strait of Hormuz while others remain unclear, Xinhua reports. Rezaei said Washington had asked for Iran's proposals over the past two months through Pakistan, Qatar and Iraq, and that the strait \"will not be opened to them\" until the conditions are met. He warned that if the US attacks again, US assets in the region, including cables, data centres and AI facilities in the UAE and around the strait, would be targeted. He said Iran will not fully abandon diplomacy but will resist until its demands are met.", "url": "https://english.news.cn/20261012/693eff76bbb1466d8ef7fdff87cbb2c1/c.html"}]}, "2026-10-13": {"date": "2026-10-13", "dayOfWeek": "Tuesday", "totalArticles": 98, "sourceCounts": {"WSJ": 14, "ST": 19, "BT": 19, "SCMP": 16, "TASS": 20, "XINHUA": 10}, "executiveDigest": "The fallout from Washington's diesel deal with Moscow ran through the pack. Deputy Prime Minister Alexander Novak said Russian diesel exports could reach 3.0–3.5 million tonnes a month by year-end, well above the volumes President Trump outlined (ST), and TASS says the US has exempted the supplies from sanctions until April 7, 2027. Trump called the deal 'the right choice for the American people' (ST); Germany's Friedrich Merz called it 'out of the question' for Europe, as Xinhua reports, and a WSJ analysis says it works out to little more than 100,000 barrels a day this month, which analysts say is too small to lower US prices much before the midterms (WSJ). Russia struck Ukrainian energy targets, including gas infrastructure, a power plant and a substation, within hours of the energy ceasefire Trump announced on Oct 11, which neither side has confirmed (WSJ, ST); Kremlin spokesman Dmitry Peskov declined to comment, as TASS reports. In the Gulf, Riyadh's main airport will stay shut until Oct 17 after Houthi strikes, the deadliest of which killed 13 on Oct 10 (ST); the IRGC says it hit a supertanker in Hormuz, as TASS relays, and Xinhua, citing UKMTO, counts six vessels attacked on Oct 11. OPEC+ ministers say shipping and insurance costs now exceed a third of oil's value (TASS). The EU plans to cap Chinese hybrid imports at 350,000 a year (WSJ) as a record 25 Chinese brands open the Paris Motor Show (Xinhua). In AI, Meta unveiled its Wonder models and Microsoft its Maia chip plans (ST), while Broadcom's Hock Tan said most companies still find no return on AI (BT). At home, MAS is widely expected to tighten again on Oct 14 (BT), and PM Lawrence Wong pressed the case for an Asean single market (BT).", "briefingCards": [{"title": "Lead story - Moscow offers more diesel, Europe balks and Russia hits Ukraine's grid hours after Trump's truce call", "body": "Russia moved to widen the diesel deal Trump announced on Oct 9. Deputy Prime Minister Alexander Novak said exports could reach 3.0–3.5 million tonnes a month by year-end, back to pre-crisis levels and above Trump's outline of more than 300,000 tonnes immediately, 500,000 tonnes in November and 1 million tonnes after that, and said global diesel prices had already fallen about 5% to 6% (ST). TASS reports Russian and US companies and both energy ministries are already negotiating supplies, under a US exemption that runs until April 7, 2027. Novak also put Russian energy sold to the EU since 2022 at US$320.7 billion, against a US figure of US$250 billion (ST); presidential envoy Kirill Dmitriev called European criticism of the deal hypocritical, TASS reports. Trump defended the deal as 'the right choice for the American people' (ST). Europe pushed back: Friedrich Merz said it is 'out of the question' for Germany and Europe, as Xinhua reports, while Slovakia's Robert Fico said Bratislava will press the EU to revise its ban on Russian energy, according to TASS. A WSJ analysis says Trump's volumes work out to a little over 100,000 barrels a day this month, against about 800,000 a day Russia shipped last year; US retail diesel was about US$6.27 a gallon on Oct 12, 71% above a year earlier (WSJ). Chinese analysts quoted by SCMP expect Beijing to treat the deal as 'transactional' and wait and see (SCMP). Three people familiar with the meeting told Reuters that US envoys Steve Witkoff and Jared Kushner told Ukrainian officials in Miami on Oct 9 the deal is meant to draw Russia back to peace talks (ST). Neither side has confirmed the energy ceasefire Trump announced on Oct 11 (ST), and Zelensky said Russian strikes hit energy infrastructure within hours, including gas infrastructure, a power plant and a substation; he repeated that Ukraine would halt refinery strikes only if Russia stopped attacking its energy system (WSJ). Kremlin spokesman Dmitry Peskov declined to comment on an energy truce and said Russia wants lasting peace rather than a ceasefire, TASS reports; Xinhua carries his claim that Ukraine's proposed 60-day ceasefire is meant to let its forces regroup, not to hold an election. Ukraine expects the EU to approve the next stages of its accession talks on Oct 13 after passing a minority-rights law (ST)."}, {"title": "Markets & finance - Gilts brace for the UK budget as US retail investors keep chasing risk", "body": "UK assets face a test ahead of the Oct 28 budget: the 10-year gilt yield eased to 5.440% after a 19-year high of 5.527% last week, helped by lower oil after the diesel deal, and Ebury calls the budget a critical risk for gilts and the pound (WSJ). Higher energy costs pushed spending in the first five months of the fiscal year £7.4 billion above the OBR's March forecast; the IFS puts fiscal headroom at about £20 billion, but its director warns against 'a work of fiction' (WSJ). A WSJ feature notes sickness and disability benefit spending will top £100 billion this year (WSJ). With US and Japanese bond markets shut for holidays, money markets priced an 18% chance of a Fed rate hike this month, ahead of US September CPI on Oct 14 (WSJ). US investors show little caution: single-stock options volume is running near meme-stock-era levels of about US$700 billion notional a day, and FactSet expects S&P 500 third-quarter earnings growth of about 30% (WSJ). IMF chief Kristalina Georgieva said in Bangkok that AI investment is keeping global growth around 3% despite the energy shock, with an updated outlook due on Oct 13 (BT). In China, a WSJ analysis argues Xi Jinping's superpower drive has pushed nonfinancial-sector credit above 300% of GDP (WSJ); CSRC head Wu Qing met market participants on Oct 10 after the Star Market 50 slumped 31% in the third quarter, but no new measures were announced (SCMP). An unsigned SCMP opinion piece backs Beijing's targeted stimulus, with about 5.8 trillion yuan of a 6 trillion yuan hidden-debt swap issued, while an SCMP editorial argues a new mortgage interest subsidy will not revive demand while households shun debt (SCMP). HKEX plans a redesigned yuan gold futures contract and more derivatives as dim sum bond issuance rose 14% (SCMP). In US housing finance, FHFA chief Bill Pulte has directed Fannie Mae and Freddie Mac to approve all lenders to use VantageScore and merged their pricing grids so it is treated equally with FICO; Fair Isaac's stock is down about 60% this year (WSJ). HSBC will shift senior staff to a bonus-heavy pay model from 2028, according to a memo seen by Bloomberg News (BT), and Elon Musk has given more than US$276 million since July to support Republican majorities, according to figures first reported by the New York Times (SCMP)."}, {"title": "Asia realignment - Europe caps Chinese hybrids as Beijing and Moscow talk maritime strategy", "body": "Brussels plans to cap imports of Chinese hybrids and plug-in hybrids at 350,000 a year for four years, with a 6% annual increase limit, possibly from early December; EU imports were around 302,000 in 2025 and could reach 800,000 this year, and a senior EU official said China agreed to cut tariffs on about €4 billion of EU goods (WSJ). BT reports it is unclear whether the cap is hard or triggers tariffs once breached, and analysts say it will slow but not stop Chinese expansion while speeding up local production (BT). A record 25 Chinese brands opened the Paris Motor Show on Oct 12, as Xinhua reports, and BYD's Stella Li said its European workforce will exceed 40,000 by 2030 (ST). At home, China's retail passenger-car sales fell 28% in September, with NEVs a record 67% of sales, according to the CPCA (WSJ); Xinhua, citing CAAM data, puts the NEV share of new car sales at a record 61.6% and exports up 61.4%, and reports Beijing will cut the NEV export VAT rebate to 9% from 13% from April 1, 2027. On Russia, Xinhua says Wang Yi told presidential aide Nikolai Patrushev in Beijing that China is ready to enhance the alignment of the two countries' maritime strategies. TASS's account of the visit stresses the Northern Sea Route, where Wang called Chinese and Russian efforts 'fully aligned', and carries Patrushev's claim that London and Brussels are planning to blockade the Baltic Sea and that shipping through the Strait of Malacca can easily be disrupted. Vice Premier He Lifeng told Apple's Tim Cook that China welcomes deeper cooperation with technology firms, Xinhua reports. On Taiwan, Defence Minister Wellington Koo said Taipei is closely monitoring a week of Chinese coastal live-fire drills, none around the island (ST); Xinhua carries foreign ministry spokesperson Mao Ning's statement that China's activities east of Taiwan fall within its sovereign rights, and Beijing sanctioned ministers from Paraguay and Belize over their support for Taipei (SCMP). The US Navy aims to field Castelion's low-cost Blackbeard hypersonic missile, at about US$385,000 a unit, which experts say could challenge the air defences of Chinese warships and coastal sites (SCMP)."}, {"title": "Energy & climate - Houthis shut Riyadh airport as Hormuz attacks mount and OPEC+ flags freight costs", "body": "Saudi authorities extended the closure of Riyadh's King Khalid International Airport to Oct 17 after continuing Houthi attacks; the Oct 10 strike killed 13 and wounded more than 300, and cancellations across Saudi airports reached 46.4%, according to Cirium (ST). Counts differ: TASS cites Saudi authorities as saying at least 12 were killed in the first strike, while BT reports weekend strikes killed at least 16, including a US citizen (BT). The Houthis claimed a further ballistic-missile strike on the airport late on Oct 12 (ST, TASS), and a Houthi official warned of 'a swift and painful response targeting the US' if Washington joins the war, after Trump said he was considering joining Saudi strikes (ST). A WSJ analysis says the attacks threaten Crown Prince Mohammed bin Salman's diversification plans, with the Finance Ministry expecting GDP to shrink 3.6% in 2026 (WSJ). Iran's foreign minister offered to mediate between Riyadh and the Houthis (ST). Saudi Energy Minister Prince Abdulaziz bin Salman said the kingdom aims to lift pipeline crude export capacity to as much as 10 million barrels a day, adding up to 1.2 million within seven to eight weeks by converting a gas pipeline (BT). In the Strait of Hormuz, Xinhua, citing UKMTO advisories, reports six vessels attacked on Oct 11, and TASS relays the IRGC's claim that it struck a supertanker on Oct 12. OPEC and OPEC+ ministers meeting in Riyadh said shipping and insurance costs now exceed one-third of oil's value, according to an OPEC statement reported by TASS; Russia's Alexander Novak told Vesti that about 6-7 million barrels a day are not reaching markets through Hormuz, TASS reports. OPEC Secretary General Haitham Al-Ghais said the 2026 demand growth forecast is now 400,000 barrels a day, down from 1.4 million at the start of the year (TASS). Gulf net diesel exports averaged 390,000 barrels a day in August, just over a quarter of pre-war levels, according to IEA data (SCMP). France detained the tanker DF Peak south of Reunion as part of its fight against the so-called shadow fleet, TASS reports, and TASS says the EU's 22nd sanctions package adds about 1,600 companies and individuals, including 26 shipyards and their heads (TASS)."}, {"title": "Technology & AI - Meta and Microsoft push their own AI as executives question the returns", "body": "Meta unveiled what it calls two 'frontier' models, Wonder and Wonder Full, claiming performance comparable to OpenAI's and Anthropic's, though the benchmarking firm it cited lists Wonder among the most expensive models (ST). Microsoft said it will roll out its in-house Maia chips at massive scale from 2027 and says the TSMC-made Maia 300 will deliver 40% more AI work per unit of electricity than leading systems, a move that could reduce its reliance on Nvidia (ST). Returns were the theme at DBS's Asia Future Forward Conference: Broadcom CEO Hock Tan said most companies cannot find AI use cases that pay off, saying 'people are just wasting money, spending tokens', and sees capital as the industry's likely next bottleneck (BT). DBS CEO Tan Su Shan told Bloomberg TV the market is repricing AI financing risks, which she called healthy; DBS has originated about US$20 billion of AI deals this year (BT). An FT column carried by BT argues creditors are scrutinising Meta's US$347 billion of lease obligations on projects not yet commenced (BT). Applied Materials expects to double revenue without doubling headcount as it uses AI internally (BT), and the IMF's Kristalina Georgieva warned AI foreshadows a 'slow-moving tsunami' for jobs, with about 40% of jobs to be augmented, downgraded or eliminated (BT, SCMP). AI's demand for memory chips is hurting phones: global smartphone shipments fell 20% in the third quarter to the lowest third-quarter level since 2012, per Counterpoint (ST). China's CXMT says it has made progress on a denser 4F square DRAM design and plans a new server-memory product by end-2026 (SCMP), and a ByteDance-led paper, not peer-reviewed, says DeepSeek's compression can swing retrieval accuracy by up to 40 percentage points (SCMP). Unitree's Wang Xingxing said OpenAI's GPT-6 could bring a robotics breakthrough within one or two years (SCMP). IonQ agreed to buy cybersecurity firm Elisity for up to US$1.3 billion in stock (WSJ), and Singapore-incorporated SWI Group raised €800 million to turn data centres acquired with former FTX-linked bitcoin miner Genesis Digital Assets into AI capacity (WSJ). The Telegraph reports the US has reversed a request that American developers not share new models with Britain's AI Security Institute, according to Reuters (BT)."}, {"title": "Singapore & SEA focus - MAS decision looms as Wong pushes for an Asean single market", "body": "MAS is widely expected to tighten for a third straight time on Oct 14, with UOB, Barclays and Bank of America forecasting a steepening of the S$NEER slope to 1.5% a year from an estimated 1.25%; some see room to pause, with core inflation at 2.2% in August and 55% of forecasters in MAS's August survey expecting no change (BT). Prime Minister Lawrence Wong told the DBS conference that the region's challenge in attracting investment is bringing Asean together as a single market, calling the digital economy framework agreement due in November 'a first but important step', and said Singapore will look at giving some priority to such initiatives as Asean chair next year (BT). Analysts turned cautious on local names: Maybank cut Sheng Siong to hold, Citi downgraded OCBC to sell and Macquarie cut SGX to underperform, while Sheng Siong fell more than 2%; DBS, OCBC and UOB all rose on Oct 12 (ST). SGX's securities daily average value rose 27% year on year in September to S$1.9 billion (BT), and the exchange opens a one-hour European-hours window for its bond futures from Oct 13 (BT). The Energy Market Authority told BT its target of importing 6 GW of low-carbon electricity by 2035 is aspirational, after Wood Mackenzie said imports would likely reach only half of it; none of the 9.25 GW given conditional approval has begun construction, Wood Mackenzie says (BT). EMA also renewed its 2020 energy-cooperation MoU with Hong Kong, as Xinhua reports. PwC found 69% of Singapore workers confident about their job security, down from 84% in 2024, even though 74% used AI at work in the past year (BT); President Tharman Shanmugaratnam warned at the IMF-World Bank meetings in Bangkok that AI is reducing demand for graduates' first jobs (BT). In the region, Bain's Bridge Data Centres is seeking to upsize a Malaysian loan to about US$6.6 billion, people familiar with the matter say, while a separate Thai loan has stalled after Thailand suspended construction of 49 data centres (BT). IOI Properties advanced the
