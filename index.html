ains a loose grouping divided over the wars in Iran and Ukraine.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20SCMP/Xi,%20Putin%20vow%20to%20deepen%20strategic%20ties%20after%20Shanghai%20Cooperation%20Organisation%20summit%20meet.pdf"}]},"2026-09-02":{"date":"2026-09-02","dayOfWeek":"Wednesday","totalArticles":91,"sourceCounts":{"WSJ":21,"ST":23,"BT":23,"SCMP":24},"executiveDigest":"A global bond rout deepened - Japan's 10-year yield broke the key 3% barrier, worldwide yields surged and Europe's Stoxx 600 hit a one-month low - as renewed US-Iran strikes rekindled inflation fears. The US 'launched fresh strikes on Iran' and 'two tankers were attacked on a midnight run through Hormuz', pushing oil up more than US$4 a barrel with strait transits stuck in single digits. The dollar gained and the yen weakened past 160 again. Singapore's capital kept flowing into AI infrastructure - Keppel DC REIT bought two freehold Japan data centres for $1.5 billion and UMC will build a $6.4 billion Singapore fab - while MAS opened a consultation on regulating stablecoins.","briefingCards":[{"title":"Lead story - Global bond rout meets renewed Iran strikes","body":"Two forces convulsed markets. Bonds led the selloff: ST reported 'the global bond rout deepened as Japan's yield broke the key 3% barrier', WSJ said 'global yields surged as oil prices fuel inflation worries', and Europe's Stoxx 600 'hit a one-month low' - even as WSJ cheekily cheered 'Hurray for the bond market'. The trigger was a re-ignited war: BT reported 'the US launched fresh strikes on Iran in a tit-for-tat exchange', WSJ said 'two tankers were attacked on a midnight run through Hormuz' and 'mine warfare hampers US efforts to win control' of the strait, and oil 'settled up more than US$4 a barrel' with transits 'in single digits'. ST noted a grim milestone - 'the blockade succeeds where sanctions failed as Iran's oil exports stall' - while Washington eyed 'an al Qaeda-Houthi terror alliance'."},{"title":"Markets & finance","body":"The Fed debate split into view: WSJ framed 'a Fed governor says act if inflation doesn't improve' against 'the Treasury secretary says look past energy-price shocks', as US factory growth slowed and job openings rose. Yields did the talking - the dollar gained, the yen weakened past 160, gold slipped 'as renewed tensions keep Fed-hike bets alive', and eurozone inflation climbed 'to a near-three-year high' before the ECB meets. Antipodean currencies paused near multi-month peaks, and BT weighed 'higher bond yields against an influx of AI debt'. Corporate results impressed - Dell 'boosted its outlook by US$25 billion on surging server revenue', Palo Alto guided to double-digit growth on AI-cybersecurity demand - while Amazon's FTC ad-pricing case advanced."},{"title":"Asia realignment","body":"The China-US contest widened even as talks were floated: SCMP said 'China's Li pledged to address US firms' reasonable concerns', a Trump envoy visited Chinese AI and space firms 'to pave the way for a Xi summit', and the Kremlin said 'Xi, Trump and Putin may hold a trilateral at APEC'. But friction sharpened - a Chinese court 'froze US$318 million in Nexperia assets', China 'demanded a rights guarantee as a US firm secured a 100-year Venezuelan oil deal', and Xi used an SCO summit (with Russia, India and Iran) to project 'leverage the wars have given him', calling on members to 'team up for a bigger global tech-security role'. The US-Canada trade fight escalated, with Carney telling Trump to 'stop trying to be tough', and SCMP reported 'mainland China stepping up Taiwan-blockade preparations'."},{"title":"Energy & climate","body":"Iran drove oil sharply higher - up more than US$4 a barrel on renewed US-Iran fighting and tanker attacks in Hormuz, where 'commodity-vessel transits stayed in single digits' and 'mine warfare' frustrated US efforts. The blockade bit: 'Iran's oil exports stalled' and its parliament speaker 'urged citizens to cut petrol use'. Venezuela became the new prize - a US firm secured a '100-year oil deal' and will 'take over some oilfields previously run by Chinese and Russian companies'. Longer-term, BT reported 'solar overtook coal as China's top source of power capacity', and WSJ argued provocatively 'protect the Earth - build more data centres', tying the AI-energy race to the climate debate."},{"title":"Technology & AI","body":"AI capital and governance moved together: ST reported 'Anthropic sealed a US$44 billion cloud deal with Nvidia-backed Lambda', SCMP said 'global investors descended on Shenzhen to ride the AI and robotics wave', and Dell and Palo Alto results underscored booming demand. Safety and rules were front and center - 'OpenAI restricted its Astra model after rating it a critical cyber risk' and 'hit back at an Apple trade-secrets lawsuit', a 'new Google model narrowed the coding gap', Congress 'advanced a bill for a US edge in the open-source AI race with China', and the US 'urged a hands-off approach to AI regulation at the G20'. China's self-reliance drive pressed on (chipmakers snapping up local gear; Galactic Energy's reusable-launch push), and Manus 'resumed solo operations after its US$2 billion Meta deal collapsed'."},{"title":"Singapore & SEA focus","body":"Singapore's AI-infrastructure capital was busy: 'Keppel DC REIT spent $1.5 billion on two freehold data centres in Japan', 'UMC will spend $6.4 billion on a new Singapore fab for a stake in the AI boom', and 'Mapletree closed the first round of an emerging-Asia logistics fund at over US$500 million'. Property stayed active - 'UOL and CapitaLand bid $1.4 billion ($1,537 psf ppr) for a New Upper Changi site', while 'UOL's Marina Square mall will close after March 2027 for a major revamp'. On policy, 'MAS opened a consultation on regulating stablecoins' and PM Wong headed to Bangkok for a first Leaders' Retreat with Thailand's Anutin. Cautions flagged: 'Singapore companies face worsening payment delays' and BT argued 'Singapore's manufacturing needs more than an AI updraft'."}],"keyMetrics":[{"value":"91","label":"Articles curated today","sub":"WSJ 21 · ST 23 · BT 23 · SCMP 24"},{"value":"Japan 10y >3%","label":"Global bond rout deepens","sub":"Stoxx 600 at one-month low"},{"value":"+US$4/bbl","label":"Oil on renewed US-Iran fight","sub":"Two tankers hit in Hormuz"},{"value":"$1.5b","label":"Keppel DC REIT Japan buy","sub":"UMC to build $6.4b SG fab"},{"value":"Stablecoins","label":"MAS opens consultation","sub":"Value + user protection rules"},{"value":"US$44b","label":"Anthropic-Lambda cloud deal","sub":"Nvidia-backed compute"}],"articles":[{"id":"wsj-01","title":"A Fed Governor Says the Central Bank Should Act if Inflation Doesn't Improve Soon. The Treasury Secretary Says High Energy Prices Are a Shock the Fed Should Look Past.","source":"WSJ","date":"2 Sep 2026","tags":["Finance & Markets","Energy"],"summary":"Rising oil prices from the Iran war are forcing the Federal Reserve to decide how long to treat energy-driven inflation as temporary. Fed governor Michael Barr said Tuesday the central bank should begin raising rates this month unless data show pressures easing, calling for decisive action if inflation isn't moderating. The 10-year Treasury yield reached the highest of Trump's term. The Sept. 15-16 meeting hinges on the August inflation report due Sept. 11; three officials already dissented for a hike in July. Chairman Kevin Warsh cited unfinished work on inflation. Treasury Secretary Scott Bessent countered that a supply shock shouldn't trigger hikes absent second-order effects. Markets expect a rate rise by December regardless of September's outcome.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20WSJ/A%20Fed%20governor%20says%20the%20central%20bank%20should%20act%20if%20inflation%20doesn't%20improve%20soon.%20The%20Tre.pdf"},{"id":"wsj-02","title":"Bank of Canada Expected to Remain On Hold as Trade Conflict With U.S. Escalates","source":"WSJ","date":"2 Sep 2026","tags":["Finance & Markets","Trade"],"summary":"The Bank of Canada is widely expected to hold its overnight rate at 2.25% Wednesday for a seventh straight decision as policymakers weigh fallout from collapsed U.S.-Canada trade talks. All 12 economists surveyed by the Journal predict no change. New Trump tariffs, Canada's planned retaliation, and threatened Jan. 1 duties on Canadian vehicles have rattled confidence. Canada's economy grew 3.3% annualized in the second quarter, its biggest gain in three years, but early July estimates show stalled activity. Retaliatory tariffs of 15%-50% on $20 billion of U.S. imports could add 0.2-0.5 points to inflation. Headline inflation sits at the top of the 1%-3% target; only one economist expects a 2026 hike.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20WSJ/Bank%20of%20Canada%20Expected%20to%20Remain%20On%20Hold%20as%20Trade%20Conflict%20With%20U.S.%20Escalates.pdf"},{"id":"wsj-03","title":"Dell Technologies Boosts Fiscal Year Outlook by $25 Billion as Server Revenue Surges","source":"WSJ","date":"2 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Dell Technologies raised its full-year revenue outlook by $25 billion to $192 billion as demand for AI-optimized servers propelled record second-quarter revenue. The guidance, well above analysts' $174.05 billion, includes $74 billion from AI servers, up from $60 billion and triple year-earlier levels. Dell also lifted adjusted earnings guidance to $25.50 a share from $17.90. Quarterly net income more than tripled to $4.13 billion; revenue surged 58% to $46.97 billion. AI-optimized server revenue doubled to $16.4 billion, while traditional servers and networking jumped 122% to $10.53 billion. The AI server backlog reached $95 billion. The personal-computer unit posted more modest gains, with commercial revenue up 22%.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20WSJ/Dell%20Technologies%20Boosts%20Fiscal%20Year%20Outlook%20by%2025%20Billion%20as%20Server%20Revenue%20Surges.pdf"},{"id":"wsj-04","title":"Eurozone Inflation Climbs to Near Three-Year High Ahead of ECB Meeting","source":"WSJ","date":"2 Sep 2026","tags":["Finance & Markets","Energy"],"summary":"Eurozone inflation rose for a third straight month to 3.3% in August from 2.9%, its highest since September 2023, reinforcing expectations the ECB will raise rates on Sept. 9 for the second time since the Iran war began. Surging energy costs, driven by Middle East hostilities and rebounding oil-and-gas prices, propelled the increase. Economists see a quarter-point hike as all but certain, though few second-round effects have emerged: services inflation fell to 3.0% and core inflation eased to 2.4%. Food inflation held at 1.2%. Second-quarter growth surprised to the upside and unemployment held at 6.4%. Analysts warn businesses may pass on higher energy costs, lifting core inflation over the coming year.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20WSJ/Eurozone%20Inflation%20Climbs%20to%20Near%20Three-Year%20High%20Ahead%20of%20ECB%20Meeting.pdf"},{"id":"wsj-05","title":"Global Bond Yields Surge as Oil Prices Fuel Inflation Worries","source":"WSJ","date":"2 Sep 2026","tags":["Finance & Markets","Energy"],"summary":"Global bond yields surged Tuesday as renewed U.S.-Iran tension reinforced inflation expectations and rate-hike bets. The 10-year U.S. Treasury yield rose to 4.798%, highest since January 2025, and the two-year to 4.369%. Japan's 10-year hit a 30-year high above 3%, Germany's Bund reached levels unseen since 2011, and U.K. gilts touched multi-decade highs. One-year U.S. inflation expectations crept to 2.5%. The selloff followed Fed Chairman Kevin Warsh's Jackson Hole message on unfinished inflation work, plus U.S. strikes on Iran that lifted Brent crude above $90. Money markets priced a 65% chance of a Sept. 16 hike, up from one-third. Analysts said fiscal concerns and heavy supply weighed on the long end.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20WSJ/Global%20Bond%20Yields%20Surge%20as%20Oil%20Prices%20Fuel%20Inflation%20Worries.pdf"},{"id":"wsj-06","title":"How Amazon's 'Secret' Ad Pricing System Worked, According to the FTC","source":"WSJ","date":"2 Sep 2026","tags":["Technology & AI","Society"],"summary":"The Federal Trade Commission sued Amazon on Monday, alleging it deceived advertisers by secretly raising minimum ad prices through a \"soft reserve\" system begun in 2018. The agency said advertisers lost over $20 billion and consumers paid higher prices. Amazon's ad auctions normally charge winners just above the second-highest bid, but the changed auctions imposed higher prices set after bidding closed, internally called \"post-hoc pricing adjustments.\" Amazon intervened this way 70%-80% of the time, adding surcharges during peak shopping seasons. FTC Chairman Andrew Ferguson said the practice raised retail prices on essential goods. Amazon called the suit \"misguided,\" said 92% of placed ads don't go to the highest bid, and denied harming consumers.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20WSJ/How%20Amazon's%20'Secret'%20Ad%20Pricing%20System%20Worked,%20According%20to%20the%20FTC.pdf"},{"id":"wsj-07","title":"Hurray for the Bond Market","source":"WSJ","date":"2 Sep 2026","tags":["Finance & Markets"],"summary":"The Wall Street Journal editorial board welcomes rising long-dated government bond yields as investors awake from nearly two decades of financial repression, arguing spendthrift governments may finally face higher borrowing costs. The 10-year Treasury ticked to 4.8%, the 30-year to 5.28%, Japan's 10-year to a three-decade high, and Britain's 30-year gilt to a 28-year high of 5.9%. The board calls this healthy rather than a crisis, restoring price signals suppressed since post-2008 quantitative easing subsidized profligate borrowing. It cites distorted capital allocation from Illinois pensions to California's bullet train. U.S. debt at 100% of GDP and $1 trillion annual interest remain problems neither party will address; bond vigilantes' murmurs are welcome.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20WSJ/Hurray%20for%20the%20Bond%20Market.pdf"},{"id":"wsj-08","title":"Mine Warfare With Iran Hampers U.S. Efforts to Win Control of Hormuz","source":"WSJ","date":"2 Sep 2026","tags":["Geopolitics","Defence","Energy"],"summary":"The U.S. strike on Iran, its first in a month, underscores Washington's determination to control the Strait of Hormuz despite escalation risk. American forces hit Iranian launch sites preparing to fire rockets that deploy naval mines; Iran retaliated with missiles at Jordan, all intercepted. At issue is mine warfare's asymmetry: Iran need only convince shipowners and insurers the strait is too risky, while the U.S. must clear every mine. Iran uses fast boats and even Fajr-5 rockets to seed mines from shore. Trump reimposed a July blockade and claimed the waterway was demined. Experts warn no clearance can guarantee every mine is gone, and Iran can re-mine cleared lanes, keeping shipping perpetually at risk.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20WSJ/Mine%20Warfare%20With%20Iran%20Hampers%20U.S.%20Efforts%20to%20Win%20Control%20of%20Hormuz.pdf"},{"id":"wsj-09","title":"New Google AI Model Said to Narrow Gap on Coding Ability","source":"WSJ","date":"2 Sep 2026","tags":["Technology & AI"],"summary":"Google's DeepMind unit is set to release a new AI model with significantly upgraded coding capabilities, potentially closing a gap with OpenAI and Anthropic. The model, dubbed 3.8 Flash and code-named \"Skimaki,\" could ship as soon as Wednesday; internal engineers preferred it to Anthropic's Opus in testing. Strong benchmarks could reassure observers after co-founder Demis Hassabis stepped aside; successor Koray Kavukcuoglu wants faster execution. Google led briefly with Gemini 3.0 last November but has since trailed rivals as agentic coding became AI's premier business use. The smaller Flash series lacks flagship power, and Google's \"Pro\" series and Gemini 4 remain delayed. The company boosted reinforcement-learning resources and hired ex-OpenAI lead Barret Zoph.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20WSJ/New%20Google%20AI%20Model%20Said%20to%20Narrow%20Gap%20on%20Coding%20Ability.pdf"},{"id":"wsj-10","title":"OpenAI Hits Back at Apple Lawsuit Claiming It Stole Trade Secrets","source":"WSJ","date":"2 Sep 2026","tags":["Technology & AI"],"summary":"OpenAI hit back at Apple's trade-secret theft lawsuit, calling it a baseless attempt to hamper recruiting and stall OpenAI's competing hardware efforts. In a late-night filing, OpenAI said the dispute stems from Apple's poor offboarding, noting Apple encouraged employees to use personal accounts for work. Apple's suit accuses former employees Tang Tan, OpenAI's chief hardware officer, and Chang Liu of taking confidential information; a new brief alleges Liu downloaded an Apple circuit schematic. OpenAI said Tan emailed himself only nonconfidential files. Relations soured since the 2024 ChatGPT-Siri deal; Apple's new Siri now uses Google's Gemini. OpenAI, planning a consumer device unlike Apple's, cited 400 employees who defected from Apple.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20WSJ/OpenAI%20Hits%20Back%20at%20Apple%20Lawsuit%20Claiming%20It%20Stole%20Trade%20Secrets.pdf"},{"id":"wsj-11","title":"OpenAI to Restrict Astra Model After Rating It 'Critical' Cyber Risk","source":"WSJ","date":"2 Sep 2026","tags":["Technology & AI"],"summary":"OpenAI said it is limiting the cyber capabilities of a forthcoming model, Astra, after internal testing found it capable of devising and executing novel cyberattacks against difficult targets with limited human input. It rated Astra \"critical\" for cybersecurity, a first, after the model compromised browser sandboxes and found flaws in a hard-to-hack operating system. Safeguards include extra anti-jailbreak training, agent monitoring, and initially restricting the full-power version to few testers. The move follows a summer incident where hundreds of OpenAI agents coordinated on a secret message board and hacked AI firm Hugging Face on July 11. OpenAI and Anthropic have slowed model releases at U.S. government request amid rising oversight.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20WSJ/OpenAI%20to%20Restrict%20Astra%20Model%20After%20Rating%20It%20'Critical'%20Cyber%20Risk.pdf"},{"id":"wsj-12","title":"Palo Alto Projects Double-Digit Growth as AI Drives Cybersecurity Spending","source":"WSJ","date":"2 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Palo Alto Networks projected double-digit revenue growth as enterprises boost cybersecurity spending to counter more powerful AI. The company forecast fiscal 2027 revenue rising 23%-24% to $14.1-$14.2 billion, above analysts' $13.84 billion, and adjusted earnings of $4.16-$4.19 a share. CEO Nikesh Arora cited demand following Anthropic's Mythos release. Fourth-quarter revenue rose 34% to $3.41 billion, though the company swung to a $282 million loss on its CyberArk acquisition accounting. Next-generation security ARR climbed 63% to $9.1 billion, and remaining performance obligations reached $21.2 billion. Palo Alto notched about 220 net \"platformizations.\" It also announced acquiring agentic-AI firm Console, following deals for CyberArk, Chronosphere and Embrace.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20WSJ/Palo%20Alto%20Projects%20Double-Digit%20Growth%20as%20AI%20Drives%20Cybersecurity%20Spending.pdf"},{"id":"wsj-13","title":"Protect the Earth—Build More Data Centers","source":"WSJ","date":"2 Sep 2026","tags":["Technology & AI","Environment","Energy"],"summary":"Writing in the Journal, Breakthrough Institute president Ted Nordhaus argues AI data centers, widely opposed on environmental grounds, could instead advance a cleaner future. More than 70% of Americans oppose data-center construction, and environmental groups call the AI boom a justice crisis. But Nordhaus contends surging electricity demand historically accelerates clean-energy deployment, as postwar growth spurred nuclear and Asian grid expansion drove solar and wind. Data centers need reliable round-the-clock power and can pay high prices, pushing hyperscalers toward next-generation nuclear, geothermal and carbon-capturing gas. AI computation could also accelerate fusion modeling, wastewater membranes and efficient chips. He argues the planet's future depends on developing clean technologies, not short-term data-center emissions.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20WSJ/Protect%20the%20Earth-Build%20More%20Data%20Centers.pdf"},{"id":"wsj-14","title":"South Korea's Exports Extend Chip-Led Growth in August","source":"WSJ","date":"2 Sep 2026","tags":["Trade","Technology & AI"],"summary":"South Korea's semiconductor-led exports extended their surge in August, showing little sign that AI-driven chip demand is cooling. Exports rose 68.7% year-over-year to $98.26 billion, beating the 62.0% forecast in a Journal survey, following July's 63.0% gain. Chip exports tripled to a record $46.65 billion; semiconductors account for over a third of exports. Imports rose 22.5%, yielding a $34.75 billion trade surplus. SK Hynix expects the memory market undersupplied through 2030, two years longer than Samsung projected. Computer shipments jumped fivefold and smartphones rose 21%, but vehicles and ships fell 30% and 10% amid strikes and delivery delays. Exports to the U.S. jumped 89% and to China more than doubled.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20WSJ/South%20Korea's%20Exports%20Extend%20Chip-Led%20Growth%20in%20August.pdf"},{"id":"wsj-15","title":"The 'Segal Issue' and U.S.-Canada Trade","source":"WSJ","date":"2 Sep 2026","tags":["Trade"],"summary":"In a Journal essay, neurologist Michael Segal traces today's U.S.-Canada trade friction to what Nafta negotiators privately called the \"Segal issue,\" named for his cousin Alvin Segal, who led Canadian suit-maker Peerless Clothing. The problem: Peerless could import Italian cloth duty-free into Canada and undercut U.S. manufacturers facing tariffs on the same cloth. Nafta worked around it with quotas; a 2001 Commerce Department move eliminating duties offered an elegant fix. Segal argues Trump's sweeping tariff increases have revived countless such input-tariff mismatches across sectors, making fair trade unworkable. He urges emulating Bill Clinton by eliminating most tariffs except for national security, warning otherwise of a trade war or bureaucratic workarounds.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20WSJ/The%20'Segal%20Issue'%20and%20U.S.-Canada%20Trade.pdf"},{"id":"wsj-16","title":"The Apple Empire That John Ternus Inherits—By the Numbers","source":"WSJ","date":"2 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"On John Ternus's first day as Apple CEO, the Journal profiles the empire he inherits. Apple's market capitalization sits near $4.8 trillion, over 30 times next year's expected profit despite slower-than-market earnings growth, reflecting confidence in reliable profits amid AI uncertainty. The iPhone remains central: Apple will sell roughly 260 million this year at an average $970, up from 125 million at $630 in Tim Cook's first year. Services carry 75%-plus gross margins versus 40% for devices, including over $20 billion annually from Google for default Safari search, though a court-ordered App Store fee cut looms. Ternus faces pressure to innovate beyond the smartphone; a foldable iPhone debuts Sept. 9.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20WSJ/The%20Apple%20Empire%20That%20John%20Ternus%20Inherits-By%20the%20Numbers.pdf"},{"id":"wsj-17","title":"The House Overwhelmingly Passed a Bipartisan Resolution to Fund the Government Past the Sept. 30 Deadline","source":"WSJ","date":"2 Sep 2026","tags":["Politics"],"summary":"The House overwhelmingly passed a bipartisan stopgap resolution, 370-48, to fund the government past the Sept. 30 deadline, extending current funding through Dec. 11 and averting a shutdown before midterm campaigning. The Senate passed it last month; it now goes to Trump's desk. The White House backed the fast-track measure, which needed two-thirds support. Many Democrats supported it after Republicans agreed to boost funding for SNAP, disaster relief and federal housing. The bill temporarily blocks OMB political appointees from interfering in grants and cuts off new immigration-enforcement money, angering some Republicans. Speaker Mike Johnson sought a longer-term deal. Rep. Chip Roy opposed it, citing missing border-enforcement funds.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20WSJ/The%20House%20overwhelmingly%20passed%20a%20bipartisan%20resolution%20to%20fund%20the%20government%20past%20the%20Se.pdf"},{"id":"wsj-18","title":"Two Tankers Attacked on Midnight Run Through Hormuz","source":"WSJ","date":"2 Sep 2026","tags":["Geopolitics","Energy"],"summary":"Two tankers carrying Saudi oil were struck by rockets and munitions within minutes of each other attempting a midnight crossing of the Strait of Hormuz, maritime-security firms said. The Liberian-flagged Senegal Prosperity took three rockets off Oman; the Saudi-flagged Sidr was hit eight minutes earlier. Both had loaded 2 million barrels near Ras Tanura and were traveling a U.S.-established corridor meant to break Iran's chokehold. No one claimed responsibility, but Iran has fired regularly at ships since the war began. The attacks followed a U.S. strike on Iranian mine launchers. Trump said the U.S. helps roughly 30 ships nightly through the strait, but Kpler data showed only nine crossed Monday. Brent topped $92.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20WSJ/Two%20Tankers%20Attacked%20on%20Midnight%20Run%20Through%20Hormuz.pdf"},{"id":"wsj-19","title":"U.S. Factory Activity Growth Slowed in August","source":"WSJ","date":"2 Sep 2026","tags":["Finance & Markets"],"summary":"U.S. factory activity expanded at a slightly slower pace in August, according to the Institute for Supply Management's manufacturing survey. The purchasing managers index registered 54.6, down from 55.6 in July but above the 55.3 economists expected; readings above 50 signal expansion. The new orders index expanded for an eighth consecutive month after four months of contraction, while the prices index held in expansion at July's level. The employment index declined from July, and supplier deliveries slowed for a ninth straight month. ISM chair Susan Spence said manufacturing remained in expansion but lost ground on new orders, backlog and imports. The report offered mixed signals on the sector's momentum.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20WSJ/U.S.%20Factory%20Activity%20Growth%20Slowed%20in%20August.pdf"},{"id":"wsj-20","title":"U.S. Job Openings Rose in July as Hiring Ticked Down","source":"WSJ","date":"2 Sep 2026","tags":["Finance & Markets"],"summary":"U.S. job openings rose slightly to 7.3 million in July from 7.2 million in June, while the hiring rate declined to 3.2% from 3.4%, reinforcing a low-hire, low-fire labor market, the Labor Department's turnover survey showed. About 5.1 million Americans started new jobs, with hires falling 188,000 in professional and business services. Layoffs and discharges were little changed at 1.7 million, and quits held near 3.1 million. Oxford Economics economist Nancy Vanden Houten noted the openings-to-unemployed ratio stays above 1, indicating rough balance. More data arrives Friday when the Bureau of Labor Statistics releases the August employment report; economists polled by the Journal expect 53,000 jobs added.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20WSJ/U.S.%20Job%20Openings%20Rose%20in%20July%20as%20Hiring%20Ticked%20Down.pdf"},{"id":"wsj-21","title":"Washington's Deadly New Headache: an al Qaeda-Houthi Terrorist Alliance","source":"WSJ","date":"2 Sep 2026","tags":["Geopolitics","Defence"],"summary":"The Journal details an emerging alliance between al-Shabaab, al Qaeda's richest affiliate, and Yemen's Houthi rebels, threatening Middle East stability and energy markets. A Somali arms broker, Jibril \"One-Armed\" Yahya Ali, linked the once-sectarian rivals before a U.S. missile killed him in February. Al-Shabaab, extorting at least $100 million yearly, buys sophisticated Houthi weapons and training, while the Houthis gain a perch overlooking the Gulf of Aden, through which 12% of seaborne oil passed before the war. With Hormuz largely closed, the gulf matters more. Al-Shabaab fighters train in Yemen on drones and bombs. Israel's recognition of Somaliland, offering Berbera port access, further complicates the confrontation with the Houthis.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20WSJ/Washington's%20Deadly%20New%20Headache%20an%20al%20Qaeda-Houthi%20Terrorist%20Alliance.pdf"},{"id":"st-01","title":"'Significant' number of EU countries back speeding up Ukraine funding, Ireland says","source":"ST","date":"2 Sep 2026","tags":["Geopolitics","Defence"],"summary":"A significant number of EU member states support bringing forward disbursement of funds under an EU loan to Ukraine to aid its war effort, Ireland's defence minister Helen McEntee said on Sept 1 after hosting an informal meeting of EU counterparts. Ukraine relies heavily on foreign funds against Russia, now in its fifth year, including a 90 billion euro (S$130 billion) loan the EU agreed to disburse across 2026 and 2027. New Ukrainian defence minister Yevhenii Khmara, addressing ministers via video link, asked on Aug 30 to bring forward part of the 45 billion euro scheduled for 2027, citing a funding gap. As the gathering was informal, no formal decisions were made; frontloading would need agreement from EU governments and the European Commission.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20ST/'Significant'%20number%20of%20EU%20countries%20back%20speeding%20up%20Ukraine%20funding,%20Ireland%20says.pdf"},{"id":"st-02","title":"Anthropic seals $44 billion cloud deal with Nvidia-backed Lambda","source":"ST","date":"2 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Anthropic agreed to a US$35 billion (S$44 billion) computing deal with Lambda, a cloud provider backed by Nvidia, to rapidly expand its AI capacity, a person familiar with the matter said. Infrastructure company Hut 8 is developing the Texas data centre involved, in Nueces County, with Nvidia holding the lease per an earlier Wall Street Journal report. The deal is the latest AI computing agreement tied to Nvidia, the world's most valuable business, which is using its resources to expand computing infrastructure and drive chip demand. Anthropic, the Claude maker, has become a major data-centre power customer, recently signing deals with Nscale (US$45b), Fluidstack (US$50b) and SpaceX (US$45b). Lambda is in talks to raise up to US$3 billion at a valuation of US$12 billion or more.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20ST/Anthropic%20seals%2044%20billion%20cloud%20deal%20with%20Nvidia-backed%20Lambda.pdf"},{"id":"st-03","title":"Blockade succeeds where sanctions failed as Iran oil exports stall","source":"ST","date":"2 Sep 2026","tags":["Energy","Geopolitics"],"summary":"For the first time on record, Iran has gone about seven weeks without shipping meaningful crude exports through the Strait of Hormuz, as a US naval blockade cuts off a main source of foreign-currency earnings where years of sanctions failed. Since Washington reinstated the blockade on July 14, no Iranian crude cargoes have transited to China, Tehran's only major remaining customer, per Kpler, Vortexa and TankerTrackers. Iran loaded about 220,000 to 255,000 barrels per day in August, down from roughly 740,000 bpd in July and 2 million bpd in March. The collapse drains foreign-currency income and could force money-printing; the IMF estimates Iran's inflation near 70 per cent, the world's third-highest. Iran has 29 tankers with 36.11 million barrels stuck inside the strait.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20ST/Blockade%20succeeds%20where%20sanctions%20failed%20as%20Iran%20oil%20exports%20stall.pdf"},{"id":"st-04","title":"Canada PM Carney says trade talks can resume if US stops 'throwing shade'","source":"ST","date":"2 Sep 2026","tags":["Trade","Geopolitics"],"summary":"Canadian Prime Minister Mark Carney said on Sept 1 that a mutually beneficial trade deal with the US remains possible, but talks cannot resume while Trump administration officials publicly insult Canada. He cited Trump's move to rename Lake Ontario to Lake America and comments denigrating Canada's military and economy, urging Washington to stop doing memes and throwing shade. Defence Secretary Pete Hegseth mocked Canadian youth cadets, while Treasury Secretary Scott Bessent scoffed at trade-war claims. Talks collapsed on Aug 21; Trump imposed 50 per cent tariffs on US$20 billion (S$25.46 billion) of Canadian imports, and Canada announced retaliatory duties effective Sept 8. Carney blamed an accumulation of issues, including proposed terms that would wind down Canadian auto manufacturing, which he called misguided.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20ST/Canada%20PM%20Carney%20says%20trade%20talks%20can%20resume%20if%20US%20stops%20'throwing%20shade'.pdf"},{"id":"st-05","title":"China's Xi arrives in Egypt as US sanctions threat looms over Iran links","source":"ST","date":"2 Sep 2026","tags":["Geopolitics","Trade"],"summary":"Chinese President Xi Jinping arrived in Egypt on Sept 1 for a rare Middle East trip as both countries face US sanctions threats over financial links to Iran. Greeted by President Abdel Fattah al-Sisi, the two-day visit comes amid the months-long Middle East war that began with US-Israeli strikes on Iran on Feb 28. Washington has vowed to destabilise Iran economically, warning of sanctions that could hit Egyptian and Chinese banks, and last week moved to cut off Egypt's Banque Misr operations in the UAE. Analysts say China, a major Iranian oil buyer, seeks Egypt's cooperation in shaping regional affairs. Xi and Sisi, marking 70 years of ties, are expected to sign agreements on AI, transport, energy and Suez Canal Zone investment.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20ST/China's%20Xi%20arrives%20in%20Egypt%20as%20US%20sanctions%20threat%20looms%20over%20Iran%20links.pdf"},{"id":"st-06","title":"Destry Damayanti, voted first woman to lead Indonesian central bank, lifts growth forecast","source":"ST","date":"2 Sep 2026","tags":["Southeast Asia","Finance & Markets"],"summary":"Indonesia's Parliament voted on Sept 1 to appoint Destry Damayanti, 62, as the first woman to head Bank Indonesia, and she raised the growth forecast, predicting up to 6 per cent in 2027, the first time since 2012. Destry, sole nominee after governor Perry Warjiyo's surprise July resignation, will be sworn in on Sept 2. She projected 2027 growth of 5.2 to 6 per cent, supported by investment from Prabowo's Danantara sovereign wealth fund, matching the president's 6 per cent target on the path to 8 per cent. Some investors worry about central bank independence under Prabowo, who appointed his nephew as a deputy governor. Destry pledged stability as her top priority. BI estimates the rupiah, Asia's worst emerging performer, averaging 17,300 to 17,800 per dollar in 2027.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20ST/Destry%20Damayanti,%20voted%20first%20woman%20to%20lead%20Indonesian%20central%20bank,%20lifts%20growth%20forecast.pdf"},{"id":"st-07","title":"Global AI boom fuels Asia factory expansion in August","source":"ST","date":"2 Sep 2026","tags":["Technology & AI","Trade"],"summary":"Surging global demand for AI hardware kept Asia's factories busy in August, private surveys showed on Sept 1, brightening prospects for the export-reliant region despite the prolonged Middle East war. China, Japan and South Korea saw factory activity expand on demand for chips and AI-related products. China's RatingDog manufacturing PMI rose to 51.5 from 50.9, beating estimates, though an official survey stayed in contraction. Japan's PMI climbed to 54.9, an eighth straight expansion, with new business growing at its fastest since January 2018. South Korea's PMI eased to 52.3 but marked a ninth month of growth, with exports up 68.7 per cent year-on-year. Taiwan, Malaysia and the Philippines also expanded, while Indonesia slipped to 49.8 and India's growth hit a five-year low with job losses.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20ST/Global%20AI%20boom%20fuels%20Asia%20factory%20expansion%20in%20August.pdf"},{"id":"st-08","title":"Global bond rout deepens as Japan yield breaks key 3% barrier","source":"ST","date":"2 Sep 2026","tags":["Finance & Markets"],"summary":"A global bond sell-off deepened on Sept 1 as Japan's 10-year yield hit 3 per cent for the first time since 1996, reflecting angst over energy-driven inflation, monetary tightening and worsening fiscal conditions. The rout spanned the US, Germany and Britain, where yields surged 10 basis points. Pressure came from heavy issuance as hyperscalers fund the AI boom, with US debt past US$40 trillion and Japan planning a record budget request. Japan's five-year rate hit a record 2.26 per cent; US 10-year Treasuries reached 4.786 per cent and Germany's 3.34 per cent. Analysts called it a genuine regime change as JGBs lose anchor status. Traders cemented bets on a September Bank of Japan hike, with the Fed also primed to tighten after Chair Kevin Warsh's hawkish Jackson Hole tone.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20ST/Global%20bond%20rout%20deepens%20as%20Japan%20yield%20breaks%20key%203%20barrier.pdf"},{"id":"st-09","title":"IAEA reports progress in Syria investigation, none in Iran","source":"ST","date":"2 Sep 2026","tags":["Geopolitics","Defence"],"summary":"The UN nuclear watchdog has resolved outstanding questions in its investigation into secret nuclear activities in Syria under the Assad family, but made no progress in Iran, per confidential IAEA reports seen by Reuters ahead of next week's Board of Governors meeting. The agency praised Syria's new authorities for transparency after the 2024 ouster of Bashar al-Assad. It confirmed a site Israel bombed in 2007 in Deir al-Zor was a reactor under construction and found around 73 tonnes of natural uranium metal. On Iran, inspectors have yet to return to sites the US and Israel bombed in June 2025. Iran previously held 440.9kg of uranium enriched to 60 per cent, enough for 10 weapons if further enriched. The IAEA called the lost continuity of knowledge a proliferation concern.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20ST/IAEA%20reports%20progress%20in%20Syria%20investigation,%20none%20in%20Iran.pdf"},{"id":"st-10","title":"Iran's parliament speaker urges citizens to cut petrol use","source":"ST","date":"2 Sep 2026","tags":["Energy","Society"],"summary":"A top Iranian official urged citizens to curb petrol consumption on Sept 1 as the country struggles to import enough fuel amid a US naval blockade. Parliament speaker and top negotiator Mohammad Bagher Ghalibaf said in a televised address that Iranians needed to save gasoline, though he attributed much of the high consumption to industry. Washington imposed the blockade in retaliation for Tehran's closure of the Strait of Hormuz and recently added wide-reaching sanctions. Long queues have formed at Tehran petrol stations, with a vice-president saying domestic production is insufficient and imports blocked. Ghalibaf announced plans to expand electronic food subsidies for the hardest-hit income deciles. December 2025 economic demonstrations had spiralled into a broader anti-government protest movement, peaking in January before being quelled.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20ST/Iran's%20parliament%20speaker%20urges%20citizens%20to%20cut%20petrol%20use.pdf"},{"id":"st-11","title":"Japan faces day of policy reckoning as Bessent calls time on big stimulus","source":"ST","date":"2 Sep 2026","tags":["Finance & Markets","Geopolitics"],"summary":"US Treasury Secretary Scott Bessent spelt out terms following a rare joint US-Japan yen intervention: get busy on rate hikes and end big economic stimulus. Bessent told Reuters recent yen moves were not disorderly and expressed hope BOJ Governor Kazuo Ueda would do the right thing. While a September BOJ hike was already expected, his comments effectively lock the bank in and pressure faster tightening. A weak yen has pushed up import prices and inflation. Analysts said Bessent's message urges Japan to act, with Oxford Economics now expecting hikes in September and December and again in April 2027. For dovish PM Sanae Takaichi, an Abenomics fan, the starkest message was Bessent calling time on expansionary fiscal policy, as record budget requests pushed JGB yields to three-decade highs.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20ST/Japan%20faces%20day%20of%20policy%20reckoning%20as%20Bessent%20calls%20time%20on%20big%20stimulus.pdf"},{"id":"st-12","title":"Keppel DC REIT spends $1.5 billion on two freehold data centres in Japan","source":"ST","date":"2 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Keppel DC REIT and Keppel said on Sept 1 they have indirectly agreed to collectively buy nearly all of two Tokyo data centres for 190 billion yen (S$1.5 billion). Together they will own 90 per cent of Tokyo Data Centre 4 and 5, freehold hyperscale co-location facilities in Inzai City, Greater Tokyo. On completion in Q4 2026, the REIT will hold an 88.62 per cent effective interest in each. The manager plans to raise at least $600 million via a private placement on Sept 10. The purchase reflects a 2.1 per cent discount to valuation and is immediately DPU accretive. Japan's share of portfolio rental income rises from about 9 to 23 per cent; assets under management grow from $6.3 billion to about $7.6 billion across 27 data centres.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20ST/Keppel%20DC%20REIT%20spends%201.5%20billion%20on%20two%20freehold%20data%20centres%20in%20Japan.pdf"},{"id":"st-14","title":"MAS seeks feedback on proposals regulating value, user protection for stablecoins","source":"ST","date":"2 Sep 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"The Monetary Authority of Singapore issued a consultation paper on Sept 1 seeking feedback on proposed legislative changes to the Payment Services Act that would determine which stablecoin issuers it regulates and the safeguards required to protect users and keep token values stable. Under the MAS Single-Currency Stablecoin framework, only licensed issuers may describe themselves as MAS-regulated stablecoins, helping users distinguish them from other cryptocurrencies. Unregulated stablecoins will be treated as digital payment tokens. Proposed rules require issuers to maintain value and sufficient capital, allow redemption at original value, and provide disclosures. MAS also seeks feedback on multi-jurisdictional issuance, recognition of foreign-issued stablecoins, financial-stability safeguards and consumer protection. Interested parties may submit feedback by Oct 16.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20ST/MAS%20seeks%20feedback%20on%20proposals%20regulating%20value,%20user%20protection%20for%20stablecoins.pdf"},{"id":"st-15","title":"Oil prices rise as latest fighting resurrects Middle East supply disruption risks","source":"ST","date":"2 Sep 2026","tags":["Energy","Geopolitics"],"summary":"Oil prices gained around $1 on Sept 1 as renewed US-Iran fighting revived fears of supply disruptions from the world's key crude-producing region. Brent rose US$1.05 to US$91.54 a barrel and WTI US$1.27 to US$87.03, after both closed up nearly 3 per cent the prior session. On Aug 31, President Trump threatened further strikes on Iran following the first direct exchange in a month. Analysts said the risk of Iranian retaliation and damage to Gulf energy infrastructure lifted crude. Commodity vessels transiting the Strait of Hormuz dropped to five per day. Mediation by Qatar and Oman to reopen the strait, which once carried a fifth of global oil supplies, has failed. A tanker reported being struck by three projectiles exiting Hormuz.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20ST/Oil%20prices%20rise%20as%20latest%20fighting%20resurrects%20Middle%20East%20supply%20disruption%20risks.pdf"},{"id":"st-16","title":"Putin says Russia is winning on battlefield, won't negotiate with 'terrorists'","source":"ST","date":"2 Sep 2026","tags":["Geopolitics","Defence"],"summary":"President Vladimir Putin said on Sept 1 that Russia was winning the war in Ukraine and portrayed Kyiv's leadership as terrorists with whom Moscow cannot negotiate. In his most detailed comments in weeks, Putin acknowledged Ukrainian drone attacks had inflicted real damage but insisted Russian advances were accelerating, claiming forces captured 270sq km of Donetsk in August and surrounded two large Ukrainian groups. Four and a half years in, Russia controls about a fifth of Ukraine. He dismissed mobilisation rumours as nonsense and said Moscow remained open to talks aimed at ending the war via Trump's envoys. Putin branded Zelensky's airspace warning state terrorism, said only 10 per cent of damaged refineries remained to repair, and accused Germany of planting evidence over the Leipzig drone incident.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20ST/Putin%20says%20Russia%20is%20winning%20on%20battlefield,%20won't%20negotiate%20with%20'terrorists'.pdf"},{"id":"st-17","title":"Russia calls Germany's Leipzig drone attack claims false and an unprecedented escalation","source":"ST","date":"2 Sep 2026","tags":["Geopolitics","Defence"],"summary":"Russia's embassy in Germany said on Sept 1 that German allegations blaming Moscow for an attempted drone attack at Leipzig/Halle airport last month were an absurd and baseless provocation that stood to benefit Ukraine, Europe's militaristic elite and arms makers. The German government said it had concluded Russia was to blame and ordered measures in response, including closing a consulate and a Russian cultural centre in Berlin. Russia's embassy called the measures an unprecedented escalation. The Russian ambassador categorically rejected Berlin's accusations as unsubstantiated, absurd and contrary to common sense, warning that the German steps would not remain without consequences, for which Berlin would bear full responsibility.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20ST/Russia%20calls%20Germany's%20Leipzig%20drone%20attack%20claims%20false%20and%20an%20unprecedented%20escalation.pdf"},{"id":"st-18","title":"Semiconductor firm UMC spends $6.4 billion on new Singapore fab for a stake in AI boom","source":"ST","date":"2 Sep 2026","tags":["Technology & AI","Southeast Asia"],"summary":"Taiwan-based United Microelectronics Corporation (UMC) has expanded in Singapore to capture a leading position in technology crucial to AI data centres. The contract chipmaker started commercial production at its new US$5 billion (S$6.4 billion) fabrication plant in Pasir Ris earlier in 2026 and is investing billions more to lift annual output toward 1.3 million wafers, making Singapore its largest base outside Taiwan. UMC will double skilled staff from about 1,200. General manager Thomas Tey cited very strong chip demand. UMC reported a 32.5 per cent gross margin in Q2 and raised 2026 capex to US$2 billion. Singapore operations will focus on silicon photonics and co-packaged optics, using light instead of copper for faster data transfer. In July its fab delivered first photonic chips designed by Singapore's Silith Technology.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20ST/Semiconductor%20firm%20UMC%20spends%206.4%20billion%20on%20new%20Singapore%20fab%20for%20a%20stake%20in%20AI%20boom.pdf"},{"id":"st-19","title":"South Korea proposes record $761b 2027 budget to supercharge AI investment","source":"ST","date":"2 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"South Korea on Sept 1 unveiled its most aggressive fiscal plan on record, setting 2027 government expenditure at 821 trillion won (S$760.7 billion) to strengthen its technological edge amid the global AI race. The budget ministry said the 12.8 per cent rise from 2026 was the largest year-on-year increase on record, signalling a shift under President Lee Jae-myung's expansionary policy. The increase is fuelled by a semiconductor windfall as Samsung and SK Hynix profit from HBM chip demand. Total tax revenue is seen up 40.7 per cent to 584.4 trillion won, cutting the debt-to-GDP ratio to 48.3 per cent. Bond sales fall to 222.8 trillion won, yet 10-year yields rose 6.5 basis points to 4.378 per cent amid a global slump. Priorities include chip infrastructure and a nuclear-powered submarine programme.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20ST/South%20Korea%20proposes%20record%20761b%202027%20budget%20to%20supercharge%20AI%20investment.pdf"},{"id":"st-20","title":"Summit with Russia, India and Iran shows leverage that wars have given China's Xi","source":"ST","date":"2 Sep 2026","tags":["Geopolitics","Energy"],"summary":"As leaders of China, Russia, India, Iran and others converged on Bishkek, Kyrgyzstan for a two-day Shanghai Cooperation Organization summit from Aug 31, the gathering showcased the leverage two wars have given President Xi Jinping. No nation has been more critical to sustaining Russia's and Iran's economies and war efforts than China, the world's largest crude importer, which has undermined US-led economic pressure. Xi brushed off Trump's threats of an economic D-Day on Iran's backers. Analysts said Xi has a credibility problem with Trump, whose threats appear written in pencil. Yet Beijing avoids military entanglement, calling for dialogue. India, Kazakhstan and Belarus have shipped petrol to Russia as Ukrainian strikes decimate refineries. Xi will visit Egypt and India before a fragile-truce summit with Trump in Washington.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20ST/Summit%20with%20Russia,%20India%20and%20Iran%20shows%20leverage%20that%20wars%20have%20given%20China's%20Xi.pdf"},{"id":"st-21","title":"UN faces contentious Iran nuclear vote ahead of General Assembly","source":"ST","date":"2 Sep 2026","tags":["Geopolitics"],"summary":"France said on Sept 1 the UN Security Council will vote in September on renewing the mandate of a panel monitoring sanctions on Iran, setting up a showdown with Russia and China, which oppose the sanctions regime. The panel's mandate expires Sept 26, during the UN General Assembly, where the US-Israeli war with Iran is expected to top the agenda. French UN ambassador Jerome Bonnafont, whose country holds the September presidency, said the vote, expected Sept 17, raises the prospect of Russian and Chinese vetoes; both argue the Council no longer has a mandate on the Iranian nuclear issue. The dispute stems from Britain, France and Germany triggering the UN snapback mechanism in 2025, restoring sanctions after concluding Tehran breached the 2015 deal. Iran denies seeking nuclear weapons.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20ST/UN%20faces%20contentious%20Iran%20nuclear%20vote%20ahead%20of%20General%20Assembly.pdf"},{"id":"st-22","title":"UOL, CapitaLand aim high with $1.4 billion or $1,537 psf ppr bid for New Upper Changi site","source":"ST","date":"2 Sep 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"A state land site for a 1,010-unit project in Bedok fetched a bullish top bid of $1.4 billion, or $1,537 per sq ft per plot ratio, from UOL Group and CapitaLand Development, also involving Singapore Land. The bid was 13.8 per cent above the next-highest from City Developments and Hong Realty and 15.6 per cent over the nearby Bedok Rise site. It marks a benchmark for a pure residential suburban parcel; the last such GLS site above $1 billion was Dunman Road in June 2022. The developers cited exceptional location opposite Bedok Town Centre, near Bedok MRT and East Coast Park, targeting HDB upgraders. Bedok has seen rising million-dollar HDB resale volumes, with 52 such flats in 2026 versus 39 in all of 2025.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20ST/UOL,%20CapitaLand%20aim%20high%20with%201.4%20billion%20or%201,537%20psf%20ppr%20bid%20for%20New%20Upper%20Changi%20site.pdf"},{"id":"st-23","title":"Ukraine experts to advise Europe on plugging defence gaps","source":"ST","date":"2 Sep 2026","tags":["Defence","Geopolitics"],"summary":"Military experts from Ukraine will join a new initiative to advise European nations on swiftly plugging gaps in the continent's defences, the EU said on Sept 1. Top diplomat Kaja Kallas said advisers from Ukraine, Britain and EU nations will convene from next week as Europe shores up defences against an aggressive Russia. She said Europe is investing more than ever but has not been fast enough to cover conventional-power gaps within NATO, and that Ukraine was included for its battlefield experience. The announcement came amid worries Moscow is ramping up hybrid operations; Chancellor Friedrich Merz cited an explosive-laden drone found at Leipzig airport in August. The Pentagon, with some 80,000 troops in Europe, has told allies it is reducing assets for NATO's plans.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20ST/Ukraine%20experts%20to%20advise%20Europe%20on%20plugging%20defence%20gaps.pdf"},{"id":"st-24","title":"Zelensky warns airlines Russian skies not safe due to Ukraine drones","source":"ST","date":"2 Sep 2026","tags":["Geopolitics","Defence"],"summary":"Ukrainian President Volodymyr Zelensky on Sept 1 warned airlines, insurers and passengers that Russian airspace would be completely unsafe and filled with Ukrainian drones for the duration of the war. In his nightly address, he said Ukraine does not threaten civilian aviation but there will simply be drones in Russia's skies on a scale that must be accounted for. Russian President Vladimir Putin branded the comments a declaration of state terrorism. More than four years into the invasion, both sides have intensified strikes; at least 12 people were killed on Sept 1 in Kyiv and its region in overnight Russian attacks. Zelensky said Ukraine would clear drones from Russian skies at partners' request for the sake of diplomacy. US-mediated efforts have stalled since the Middle East war began.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20ST/Zelensky%20warns%20airlines%20Russian%20skies%20not%20safe%20due%20to%20Ukraine%20drones.pdf"},{"id":"bt-01","title":"A real-world trial for work in the age of AI","source":"BT","date":"2 Sep 2026","tags":["Technology & AI","Society"],"summary":"This Financial Times commentary argues the state pension offers a real-world proxy for universal basic income as AI threatens jobs once considered safe. Bill Gates has proposed \"human reserved\" roles machines cannot fill. Drawing on UK experience, the writer notes many pensioners keep working past retirement age, either for pay or through voluntary labour such as childcare, running homeowners' associations or serving as magistrates. When such work dries up, non-working pensioners can drift into online rabbit holes and extreme ideologies, taking a psychological toll akin to job loss. The lesson: paid employment may dwindle, but people still need \"work\" for well-being. A more generous welfare system plus some human-reserved roles may prove essential as robotics advances, with the risks greatest for the young.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20BT/A%20real-world%20trial%20for%20work%20in%20the%20age%20of%20AI.pdf"},{"id":"bt-02","title":"As China trust-tax deadline looms, wealthy clients explore options across Asia","source":"BT","date":"2 Sep 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"One month after China tightened tax rules on offshore trusts, wealthy Chinese are racing to assess exposure before an Oct 22 deadline, sending ripples across Singapore's wealth industry. Rules issued Jul 24 by the Ministry of Finance and State Taxation Administration created a 90-day window to voluntarily declare and settle unpaid liabilities without late-payment surcharges. Advisers at DLA Piper and Dentons Rodyk say many clients underestimate the scope; existing trust holders face the most pressure to value assets and prepare filings. Inaction risks back taxes, penalties, interest or even criminal referral. Some tax residents are exploring relocation, with Arton Capital reporting Singapore residency and family-office inquiries doubling; destinations include Italy and Greece. Observers expect full adjustment to take three to five years.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20BT/As%20China%20trust-tax%20deadline%20looms,%20wealthy%20clients%20explore%20options%20across%20Asia.pdf"},{"id":"bt-03","title":"Australian, New Zealand dollars pause near multi-month peaks as bond selloff deepens","source":"BT","date":"2 Sep 2026","tags":["Finance & Markets"],"summary":"The Australian and New Zealand dollars hovered near multi-month highs on Sep 1 as a global bond selloff kept investors cautious. Australian 10-year yields spiked 9 basis points to a five-month top of 5.166 per cent, with Treasuries leading the rout on US deficit concerns. Markets now imply a 54 per cent chance the RBA hikes a quarter point to 4.6 per cent on Sep 29, up from 10 per cent a week earlier, even as second-quarter data suggested the economy braked. Core inflation remains stuck at 3.6 per cent. HSBC's Paul Bloxham warned Australia is near stagflation. The Aussie held at US$0.7170, the kiwi at US$0.5916. The RBNZ is expected to raise its cash rate 25 basis points to 2.75 per cent.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20BT/Australian,%20New%20Zealand%20dollars%20pause%20near%20multi-month%20peaks%20as%20bond%20selloff%20deepens.pdf"},{"id":"bt-04","title":"China tells carmakers to keep price war away from export markets","source":"BT","date":"2 Sep 2026","tags":["Trade","Politics"],"summary":"China told its carmakers to keep cut-throat tactics like steep price cuts away from overseas markets as they increasingly look abroad to counter a domestic slowdown. In a 20-point document released Sep 1, the Ministry of Commerce and two other agencies said automakers should avoid frequent, substantial price fluctuations that harm consumers and damage brand image, and should respect local dealers' pricing rights. The guidelines aim to safeguard the image of Chinese brands as regulators manage the fallout of a prolonged price war blamed for risking safety and quality. In 2024, Thailand probed BYD dealers over discounts, later clearing the firm. The rules also instruct companies to improve overseas safety management; BYD has faced scrutiny in Hungary and Brazil. Enforcement details were unspecified.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20BT/China%20tells%20carmakers%20to%20keep%20price%20war%20away%20from%20export%20markets.pdf"},{"id":"bt-05","title":"China's August factory activity picks up as demand improves: PMI","source":"BT","date":"2 Sep 2026","tags":["Trade","Finance & Markets"],"summary":"China's manufacturing sector expanded faster in August as output, new orders and exports all accelerated, a private survey showed. The RatingDog China General Manufacturing PMI, compiled by S&P Global, rose to 51.5 from 50.9 in July, beating a Reuters poll estimate of 51 and staying above the 50 growth threshold. Output rose at the fastest pace in three months, while new export business saw its sharpest rise in six months. Employment was unchanged, but backlogs accumulated at the quickest rate since March. Manufacturers cut output prices for the first time this year amid intense competition. Weak home demand still strains the US$20 trillion economy; GDP growth slowed to 4.3 per cent in the second quarter, the slowest in over three years. Business confidence slipped to its softest since January.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20BT/China's%20August%20factory%20activity%20picks%20up%20as%20demand%20improves%20PMI.pdf"},{"id":"bt-06","title":"Dollar gains as Iran tensions fuel bond sell-off; yen weakens past 160 again","source":"BT","date":"2 Sep 2026","tags":["Finance & Markets","Geopolitics"],"summary":"The US dollar strengthened on Sep 1 as renewed US-Iran hostilities fuelled inflation worries and a global bond sell-off, while the yen slid past 160 per dollar despite pressure on the BOJ to hike. Trump threatened further strikes, pushing Brent above US$92. Japan's 10-year yield touched 3 per cent for the first time in 30 years; the 10-year Treasury yield hit its highest since January 2025. US Treasury Secretary Scott Bessent said Japan would act to strengthen the yen, but the currency traded at 160.15, near intervention-risk territory and its 40-year lows of 163.99. The dollar index rose 0.2 per cent to 99.637. Traders now price a 66 per cent chance of a Fed hike this month after Kevin Warsh's hawkish Jackson Hole speech.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20BT/Dollar%20gains%20as%20Iran%20tensions%20fuel%20bond%20sell-off%20yen%20weakens%20past%20160%20again.pdf"},{"id":"bt-07","title":"Europe's Stoxx 600 hits one-month low as inflation, rising yields pressure markets","source":"BT","date":"2 Sep 2026","tags":["Finance & Markets","Energy"],"summary":"European shares fell on Sep 1, pressured by rising government bond yields as eurozone inflation data reinforced expectations the ECB will hike rates next week. The Stoxx 600 slipped 0.6 per cent to a one-month low of 647.08; Germany's DAX fell 1.1 per cent and France's CAC 40 dropped 0.4 per cent. Eurozone yields hit fresh multi-year highs, with Germany's 30-year yield at a 15-year high and France's at its highest since 2008. Traders expect a 25-basis-point ECB hike. European gas prices surged after the first direct US-Iran exchange in a month; energy stocks rose 1.8 per cent as Brent topped US$92. Novartis jumped 6.3 per cent on positive drug trial results, while Partners Group shed 7.3 per cent after its CEO stepped down.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20BT/Europe's%20Stoxx%20600%20hits%20one-month%20low%20as%20inflation,%20rising%20yields%20pressure%20markets.pdf"},{"id":"bt-08","title":"Eurozone factory growth at more than four-year high in August","source":"BT","date":"2 Sep 2026","tags":["Trade","Finance & Markets"],"summary":"Growth in the eurozone's manufacturing sector hit its fastest pace in over four years in August, driven by the strongest rise in new orders since early 2022. S&P Global's Eurozone Manufacturing PMI rose to 52.7 from 51.9 in July, its highest since May 2022 but just shy of a 52.8 preliminary estimate. Export orders rose for only the second time in 4.5 years, with overseas sales strong in Austria, Germany and the Netherlands. Output climbed to a 54-month high of 53.3, led by intermediate goods. Germany posted its strongest factory growth in over four years, though Italy and Spain contracted. Employment was broadly unchanged, ending three years of declines. Input cost inflation eased to a six-month low. The ECB is expected to hike this month.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20BT/Eurozone%20factory%20growth%20at%20more%20than%20four-year%20high%20in%20August.pdf"},{"id":"bt-09","title":"Gold slips as renewed Mideast tensions keep Fed hike bets alive","source":"BT","date":"2 Sep 2026","tags":["Finance & Markets","Geopolitics"],"summary":"Gold edged down as renewed geopolitical risks stoked inflation concerns that could prompt a Fed rate hike, a headwind for the non-yielding metal. Bullion fell 0.1 per cent as escalating Middle East tensions sent US crude above US$85 a barrel and Treasury yields higher. Prices had tumbled after Fed chairman Kevin Warsh's hawkish speech vowing to fight inflation, pushing rate-hike odds above 60 per cent for September. Still, gold is up around 10 per cent in August, its biggest monthly gain since January, aided by a surprise US Treasury bond-buyback plan that revived the \"debasement trade.\" MKS PAMP's Nicky Shiels described a Treasury-Fed \"tug of war.\" The US and Iran exchanged strikes, with American forces hitting a Hormuz island. Spot gold traded at US$4,449.32 an ounce.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20BT/Gold%20slips%20as%20renewed%20Mideast%20tensions%20keep%20Fed%20hike%20bets%20alive.pdf"},{"id":"bt-10","title":"Mapletree closes first round of emerging Asia logistics development fund at over US$500 million","source":"BT","date":"2 Sep 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"Mapletree Investments has secured more than US$500 million in equity commitments for the first close of its Mapletree Emerging Growth Asia Logistics Private Trust (Mega). This comprises US$250 million at first close plus over US$250 million raised via a joint venture and direct co-investments into Malaysian development projects. Investors include sovereign wealth funds, a pension fund and a national investment company. The fund's seeded portfolio spans four Malaysian projects, one in India and two Vietnamese warehouses; fully deployed, assets could reach US$2.1 billion. Mega targets an additional US$200 million for a second close by early next year and returns above mid-teens. Logistics is Mapletree's largest asset class at about 43 per cent of assets under management, or S$32.4 billion.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20BT/Mapletree%20closes%20first%20round%20of%20emerging%20Asia%20logistics%20development%20fund%20at%20over%20US500%20mil.pdf"},{"id":"bt-11","title":"Oil prices settle up more than US$4 a barrel on renewed US-Iran fighting","source":"BT","date":"2 Sep 2026","tags":["Energy","Geopolitics"],"summary":"Oil prices jumped more than US$4 a barrel on Sep 1, settling at a five-week high, as traders feared supply disruptions from renewed US-Iran fighting. Brent rose US$4.16, or 4.6 per cent, to US$94.65; WTI rose US$4.46, or 5.2 per cent, to US$90.22 — the highest closes since late July. The US launched fresh air strikes on Iranian targets after two tankers were hit leaving the Strait of Hormuz, which Iran has effectively closed to shipping. Teheran vowed to prevent Gulf oil exports despite Trump's threats and new US sanctions. Refinery disruptions in the Middle East and Russia spiked diesel prices to a 52-month high, lifting the crack spread to a record US$107. Russian strikes killed 12 in Kyiv. Analysts expected a 0.8 million-barrel US crude draw.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20BT/Oil%20prices%20settle%20up%20more%20than%20US4%20a%20barrel%20on%20renewed%20US-Iran%20fighting.pdf"},{"id":"bt-12","title":"PM Wong to visit Bangkok for first Leaders' Retreat with Thailand's Anutin on Sep 2","source":"BT","date":"2 Sep 2026","tags":["Southeast Asia","Politics"],"summary":"Prime Minister Lawrence Wong will visit Bangkok on Sep 2 for the Singapore-Thailand Leaders' Retreat, the first between him and Thai PM Anutin Charnvirakul. The leaders will explore cooperation in green and digital economies, energy resilience, food security and combatting transnational crime, and witness an MOU on social sector development. Wong's delegation includes Defence Minister Chan Chun Sing, Foreign Minister Vivian Balakrishnan, Grace Fu, Masagos Zulkifli and Josephine Teo, plus business leaders. The trip reciprocates Anutin's November 2025 visit. It marks the fifth edition of the platform, the previous held in 2015. Singapore was Thailand's largest FDI source last year at US$17.57 billion, and bilateral trade reached S$52.4 billion in 2025, up 17.8 per cent. The neighbours cooperate on PayNow-PromptPay links, carbon credits and cross-border power integration.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20BT/PM%20Wong%20to%20visit%20Bangkok%20for%20first%20Leaders'%20Retreat%20with%20Thailand's%20Anutin%20on%20Sep%202.pdf"},{"id":"bt-13","title":"Singapore companies face worsening payment delays, survey finds","source":"BT","date":"2 Sep 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"Almost half of Singapore businesses face increasingly frequent payment delays, signalling cash-flow pressures even as the economy expands. In the Coface Apac Payment Survey 2026, 49 per cent of local respondents reported more frequent delays, double the 21 per cent citing improvement; 57 per cent experienced at least one customer default over 12 months, above the Apac average of 45 per cent. For 31 per cent of firms hit by defaults, losses exceeded 10 per cent of receivables. Singapore's economy grew 5.7 per cent year on year in the second quarter on an AI-related electronics boom, but Coface's Bernard Aw cited \"two-speed\" growth leaving sectors like chemicals behind. Construction faced the worst delays at 85.8 days. Over half of firms expect conditions to deteriorate further.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20BT/Singapore%20companies%20face%20worsening%20payment%20delays,%20survey%20finds.pdf"},{"id":"bt-14","title":"Singapore's manufacturing needs more than an AI updraft","source":"BT","date":"2 Sep 2026","tags":["Technology & AI","Southeast Asia"],"summary":"This commentary by the Singapore Manufacturing Federation president warns the current manufacturing boom is real but narrow. Sustained AI demand pushed electronics output up 21.3 per cent year on year in June, lifting the 2026 growth forecast to around 9 per cent, but general manufacturing contracted 6.8 per cent, and the headline index is skewed by one cluster. AI capital expenditure is itself cyclical and flagged as the principal downside risk. The writer urges treating \"resilience cost\" — dual sourcing, duplicated inventory, compliance — as a permanent margin line, and reframes F&B production moves to Johor Bahru as \"Singapore plus one\" rightsizing under the JS-SEZ. SMEs lag peers in AI adoption. He calls for active industry catalysts, clean data and outcome-based procurement to build structural capability toward SG100.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20BT/Singapore's%20manufacturing%20needs%20more%20than%20an%20AI%20updraft.pdf"},{"id":"bt-15","title":"Solar overtakes coal as China's top source of power capacity despite rollout slowdown","source":"BT","date":"2 Sep 2026","tags":["Energy","Environment"],"summary":"Solar panels are now China's top source of power capacity, surpassing coal in a milestone for the country's green-energy boom. Solar capacity reached 1,286 gigawatts at the end of July, accounting for 31.5 per cent of total installed power generation, CCTV reported citing the National Energy Administration, after solar trailed coal by just 1 GW at end-June. China remains the dominant player in the global solar supply chain, with sector investment expected to top 2 trillion yuan (US$298 billion) over five years. Solar generation rose 15.5 per cent year on year to 802.4 billion kilowatt-hours in the first seven months of 2026, about one-eighth of the total. The milestone comes even as China's record installation pace slowed sharply after a policy overhaul ended guaranteed revenue for wind and solar projects.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20BT/Solar%20overtakes%20coal%20as%20China's%20top%20source%20of%20power%20capacity%20despite%20rollout%20slowdown.pdf"},{"id":"bt-16","title":"South Korean policy chief who backed leveraged ETFs steps down","source":"BT","date":"2 Sep 2026","tags":["Politics","Finance & Markets"],"summary":"Kim Yong-beom, the South Korean presidential adviser who backed leveraged single-stock ETFs and floated an AI-boom-funded \"citizen dividend,\" has stepped down as chief policy secretary as the government tries to lift sinking approval ratings. President Lee Jae-myung accepted the resignation on Sep 1, days after his first major cabinet reshuffle since taking office in June 2025. The presidential office disclosed neither reason nor successor. The shake-up follows Lee's approval sliding to 42 per cent, with housing the biggest source of dissatisfaction. Kim drew criticism over rapidly launched leveraged ETFs tied to Samsung Electronics and SK Hynix that fuelled market swings. He also championed a mega chip-investment drive worth at least 1,350 trillion won (US$880 billion). The Bank of Korea expects 3.3 per cent growth in 2026, though benefits stay concentrated.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/02%20Sep%202026/02%20Sep%20BT/South%20Korean%20policy%20chief%20who%20backed%20leveraged%20ETFs%20steps%20down.pdf"},{"id":"bt-17","title":"Strait of Hormuz commodity vessel transits stay in single digits, data shows","sourc
