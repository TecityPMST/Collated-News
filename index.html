ed a local media report that Singapore's Temasek Holdings plans to invest directly in both firms. Shares briefly gained more than 8 per cent after Asia Business Daily's report; Samsung ended up 6.7 per cent and SK Hynix 5.5 per cent, with the Kospi up 3.7 per cent. Temasek said it did not seek Korean government advice on timing and first invested in both over two years ago. The chipmakers had suffered a brutal July sell-off of more than 20 per cent amid doubts over AI buildout pace, leaving valuations at record lows of 4.2 and 3.6 times forward earnings. Global funds added nearly US$2 billion of Kospi shares on Wednesday.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/SK%20Hynix,%20Samsung%20shares%20rally%20as%20report%20of%20Temasek's%20investment%20plans%20boosts%20optimism.pdf"}, {"id": "bt-22", "title": "S&P 500 ends higher as CoreWeave results fuel AI optimism", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "The S&P 500 and Nasdaq ended higher on Wednesday, lifted by upbeat quarterly results from CoreWeave and other AI infrastructure firms, while mild inflation data reinforced bets the Fed will hold rates in September. US consumer prices barely rose in July as petrol costs fell. CoreWeave surged 19 per cent after lifting its capex forecast; Nebius jumped 34 per cent, Super Micro 19 per cent, and Nvidia rose 3 per cent. The S&P 500 climbed 0.26 per cent to 7,748.50, the Nasdaq gained 0.54 per cent to 26,588.49, while the Dow slipped 0.04 per cent to 53,770.27. Traders price a 62 per cent chance of a September hold. The Vix fell to 14.45, its lowest since January. US-Iran tensions stayed volatile amid continued shipping attacks.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/SP%20500%20ends%20higher%20as%20CoreWeave%20results%20fuel%20AI%20optimism.pdf"}, {"id": "bt-23", "title": "STI could hit 7,000 in bull case over next 12 months: JPMorgan", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "JPMorgan Chase raised its target for Singapore stocks, saying the Straits Times Index could climb to 7,000 over the next 12 months in a bull case, implying 22 per cent upside from Tuesday's close. Analysts including Khoi Vu cited robust economic growth, a narrowing valuation gap with developed markets, strong yields, a stable currency and the Equity Market Development Programme. Singapore stocks have gained more than 23 per cent in 2026, outperforming Hong Kong, buoyed by haven demand amid geopolitical tensions and AI-driven volatility. Singapore upgraded its 2026 growth forecast on Aug 11 as the AI boom lifts trade and manufacturing. JPMorgan had raised its base case to 6,000 in January. Its top picks include DBS, SGX, Keppel and UOL.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/STI%20could%20hit%207,000%20in%20bull%20case%20over%20next%2012%20months%20JPMorgan.pdf"}, {"id": "bt-24", "title": "Ship pays near-record US$4 million to skip Panama Canal queue as Hormuz blockage fuels congestion", "source": "BT", "date": "13 Aug 2026", "tags": ["Trade", "Energy", "Geopolitics"], "summary": "A container ship, the Seaspan Benefactor, paid US$4 million to jump the Panama Canal queue, a near-record auction figure, as the Iran war forces more congestion and wait times stretch beyond a week. Vessels are seeking alternative routes as traffic is deeply curtailed at the Strait of Hormuz and Bab el-Mandeb. Buyers and sellers of oil, gas, fertiliser and chemicals, especially in Asia, are scrambling for routes. Neopanamax vessels without booked slots face 10-day waits, the longest since May for Pacific-to-Atlantic transit. The US$4 million paid Monday was more than double the previous seven-day average, with the Panama Canal Authority acknowledging some auctions have exceeded US$1 million. Maintenance outages and reduced draft from low rainfall add to the bottleneck.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Ship%20pays%20near-record%20US4%20million%20to%20skip%20Panama%20Canal%20queue%20as%20Hormuz%20blockage%20fuels%20congestion.pdf"}, {"id": "bt-25", "title": "Singapore life insurers post 21.4% growth in H1 premiums as disbursements rise", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Singapore's life insurance industry posted 21.4 per cent year-on-year growth in total weighted new business premiums in the first half of 2026, to S$3.63 billion from S$2.99 billion, driven by demand for wealth accumulation policies amid strong GDP growth of 6.3 and 5.7 per cent in Q1 and Q2, said LIA Singapore. Investment-linked policies took a dominant 44 per cent share, with premiums up 24.2 per cent to S$1.59 billion, while participating policies rose 25.4 per cent to S$903 million. About seven in 10 residents were covered by Integrated Shield Plans; IP and rider premiums soared 66.5 per cent to S$100.3 million. Insurers disbursed over S$10.6 billion in claims and maturity benefits, up from S$6.4 billion a year earlier, including S$8.02 billion for matured policies.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Singapore%20life%20insurers%20post%2021.4%20growth%20in%20H1%20premiums%20as%20disbursements%20rise.pdf"}, {"id": "bt-26", "title": "Super Micro forecasts sales of up to US$15.5 billion, topping rosiest projection", "source": "BT", "date": "13 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Super Micro Computer gave a current-quarter revenue forecast of US$14.5 billion to US$15.5 billion for the period ending September, topping even the highest analyst estimate of US$13.3 billion and an average of US$12 billion, as AI demand bolsters server sales. Profit excluding some items will be US$1.01 to US$1.10 a share. Its servers use Nvidia chips that power most AI data centres. CEO Charles Liang cited investment in technology leadership and manufacturing scale. Shares jumped about 9 per cent in extended trading after closing at US$31.60. For the full fiscal year, Super Micro sees revenue of US$65 billion to US$72 billion, versus analysts' US$54.4 billion. Q4 sales rose 93 per cent to US$11.1 billion. A co-founder faces US export-control charges.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Super%20Micro%20forecasts%20sales%20of%20up%20to%20US15.5%20billion,%20topping%20rosiest%20projection.pdf"}, {"id": "bt-27", "title": "Switzerland launches consultation on stricter bonus rules for banks", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "Switzerland launched a public consultation on tougher banking regulations, including stricter bonus rules at UBS, to boost financial stability following the 2023 collapse of Credit Suisse. Draft proposals would require banks to structure bonus schemes to reward long-term, sustainable performance and discourage excessive risk-taking, with tighter rules for systemically important lenders. A significant portion of variable pay for top executives would be deferred for several years, typically four to five, with reductions or clawbacks if misconduct or losses emerge. Banks with at least 250 employees must clearly assign decision responsibility to senior managers, and regulator FINMA would gain powers to intervene earlier, fine institutions and levy penalties. The consultation runs until November 19, 2026.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Switzerland%20launches%20consultation%20on%20stricter%20bonus%20rules%20for%20banks.pdf"}, {"id": "bt-28", "title": "UOL H1 net profit rises 23% to S$252.2 million on joint venture profits", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Property developer UOL Group posted a 23 per cent rise in first-half net profit to S$252.2 million, from S$205.5 million, driven by joint-venture profits that surged to S$83.8 million from S$24,000. CEO Liam Wee Sin cited strong residential sales, with Watten House and Skye at Holland fully sold, and solid rental reversions of 7.3 per cent for offices and 5.5 per cent for retail. Operating patmi rose 16 per cent to S$239.8 million and EPS to S$0.2980. Revenue, however, fell 7 per cent to S$1.4 billion as more projects run through joint ventures, whose earnings are booked as share of JV profits rather than revenue. Analysts focused on the proposed Marina Square redevelopment adding three towers. No interim dividend was declared. Shares ended 2.4 per cent higher at S$10.17.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/UOL%20H1%20net%20profit%20rises%2023%20to%20S252.2%20million%20on%20joint%20venture%20profits.pdf"}, {"id": "bt-29", "title": "When robots are helping, who is watching?", "source": "BT", "date": "13 Aug 2026", "tags": ["Technology & AI", "Society"], "summary": "This commentary examines privacy risks as humanoid household robots near market, using XPeng's Iron, launching next year, as a case study. Morgan Stanley calculates the humanoid robot market will be worth US$5 trillion by 2050. To function, such robots need cameras and microphones switched on continuously in every room, unlike devices whose lenses can simply be taped over. The writer cites troubling precedents: a Roomba development model captured images of a woman on the toilet that were leaked, and a Ring employee viewed thousands of private videos of female customers. Startup 1X uses VR-headset human operators to take over tasks remotely. The author argues the onus should fall on companies, backed by rules like the EU's GDPR and AI Act, to safeguard data rather than on users.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/When%20robots%20are%20helping,%20who%20is%20watching.pdf"}, {"id": "scmp-01", "title": "After China's missile test, US and allies demand 24-hour warning next time", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "The United States and 40 other nations issued a joint statement calling for at least 24 hours' advance notice before long-range ballistic missile launches, following a rare Chinese submarine-launched missile test in the Pacific on July 6. Though unnamed, China was clearly targeted; signatories including Australia, Japan, South Korea and the Philippines sought details on missile class, launch window and impact areas to reduce miscalculation risk. Beijing rejected the move as \"politically motivated,\" with foreign ministry spokesman Guo Jiakun accusing the West of double standards and abusing arms control mechanisms. Analyst Michael Bosack said Beijing gave inconsistent coordinates and notified some governments only hours ahead, prompting demands for clearer standards. China says it is not bound by the Hague Code.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/After%20China's%20missile%20test,%20US%20and%20allies%20demand%2024-hour%20warning%20next%20time.pdf"}, {"id": "scmp-02", "title": "China is sending scientists to Iran for rare earth 'exploration and processing'", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Geopolitics", "Technology & AI"], "summary": "China is expanding scientific collaboration with Iran into rare earths, listing \"exploration and processing of rare earth elements\" among five areas in a new joint workshop programme unveiled by the National Natural Science Foundation of China. Beijing will provide 30,000 yuan (US$4,200) per workshop, while Iran's science foundation covers international travel for its participants. The cooperation comes as the US-Israel war on Iran remains unresolved and Washington announced US$3 billion for critical-mineral projects to reduce Chinese dependence. China dominates global rare earth production and processing while restricting technology transfer. Iran's rare earth potential remains poorly understood, with anomalies identified across 7,000 sq km of central Iran, though extraction capabilities remain early-stage. Cooperation between the foundations dates to 2017.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/China%20is%20sending%20scientists%20to%20Iran%20for%20rare%20earth%20'exploration%20and%20processing'.pdf"}, {"id": "scmp-03", "title": "China projects 'outward confidence' amid economic anxiety, US congressional panel says", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "The US-China Economic and Security Review Commission said China projects confidence, especially over artificial intelligence, while anxiety about its economy persists beneath the surface, following a July visit to Beijing, Shanghai and Hangzhou. Chairman Randy Shriver cited \"a lot of anxiety about the state of the economy.\" Members said a key disappointment was being denied access to Hangzhou's \"Six Little Dragons,\" including AI start-up DeepSeek; vice-chairman Michael Kuiken called that the trip's most telling aspect. Chinese officials avoided specifics on the proposed US-China \"board of trade\" and an expected September visit by Xi Jinping. Taiwan was repeatedly raised, alongside US arms sales and their impact on military-to-military exchanges. The commission's annual report is due later this year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/China%20projects%20'outward%20confidence'%20amid%20economic%20anxiety,%20US%20congressional%20panel%20says.pdf"}, {"id": "scmp-04", "title": "China's EV sales slide again amid fading incentives, weak demand and persistent price war", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Deliveries of electric vehicles in China fell 3.9 per cent year on year in July, a seventh straight monthly decline, as fading government incentives and weak consumer demand weighed on the market. Domestic EV sales also dropped 5.8 per cent from June, per China Passenger Car Association data. Overall car deliveries plunged 20.9 per cent to 1.46 million units, with EVs at 65.1 per cent of sales. CnEVPost's Phate Zhang warned small firms may close and all players may need price cuts. AlixPartners forecast total 2026 deliveries falling 10 per cent to 24.6 million, predicting only seven of 30 EV-focused carmakers break even by 2030. Contrastingly, EV exports jumped 147.8 per cent to 540,000 units. BYD sold 239,370 domestically.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/China's%20EV%20sales%20slide%20again%20amid%20fading%20incentives,%20weak%20demand%20and%20persistent%20price%20war.pdf"}, {"id": "scmp-05", "title": "Erdogan wants Turkey-Saudi Arabia-Pakistan defence pact to draw more countries", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "President Recep Tayyip Erdogan said he hoped more countries would join a defence agreement signed last week between Turkey, Saudi Arabia and Pakistan, aimed at stabilising a region wracked by conflict. The so-called Mecca Joint Defence Agreement, signed Friday, contains a Nato-style clause treating an attack on one as an attack on all, and follows fallout from the five-month US-Iran war that disrupted shipping through the Strait of Hormuz and Red Sea. Foreign Minister Hakan Fidan said Turkey expected Egypt to join \"in the next stage,\" though Cairo has not commented. Erdogan said regional issues should be resolved by regional actors, warning \"solutions imported from abroad only bring disasters.\" The pact rejects Israel's hegemony and could develop joint defence-industry projects.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Erdogan%20wants%20Turkey-Saudi%20Arabia-Pakistan%20defence%20pact%20to%20draw%20more%20countries.pdf"}, {"id": "scmp-06", "title": "Fearing deflated China demand, US soybean growers pivot to new buyers and biofuel", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Trade", "Energy"], "summary": "US soybean growers are adapting to a steep decline in China-bound exports by selling to third countries and the American biofuel sector, according to American Soybean Association chief economist Scott Gerlt. Beijing committed in November to buy at least 25 million tonnes annually through 2028, but only just over 12 million tonnes of last year's crop is on track to reach China, which usually imports twice that. The association represents over 500,000 farmers across 83.6 million acres. Biofuel demand is booming on federal clean-fuel mandates, using a record 1.43 billion pounds of soybean oil in May. Chinese importers have turned to Brazil since the trade war restarted. Gerlt said the drop in production would be small, hoping China resumes normal purchases.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Fearing%20deflated%20China%20demand,%20US%20soybean%20growers%20pivot%20to%20new%20buyers%20and%20biofuel.pdf"}, {"id": "scmp-07", "title": "Fed policy outweighs geopolitical risks, China purchases as gold forecasts retreat: survey", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Finance & Markets"], "summary": "US Federal Reserve rate policies under Kevin Warsh have outweighed geopolitical tensions and Beijing's gold purchases as the decisive factor for bullion price forecasts, according to a London Bullion Market Association mid-year survey. Analysts cut 2026 projections versus six months ago; the average year-end forecast stood at US$4,500, with the highest at US$5,100, down from January bullishness that saw forecasts above US$7,000. Gold hit a record over US$5,600 in January and traded at US$4,411 on Wednesday. Ten of 16 analysts cited the Fed's inflation response as their major concern. Central banks bought a net 289 tonnes in the second quarter, a record for the period. China's reserves rose to 76.08 million ounces, a 21st straight month of accumulation.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Fed%20policy%20outweighs%20geopolitical%20risks,%20China%20purchases%20as%20gold%20forecasts%20retreat%20survey.pdf"}, {"id": "scmp-08", "title": "From solar to AI: why China may be entering its 'Go Global 3.0' era", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Technology & AI", "Trade"], "summary": "Chinese corporate expansion overseas is shifting from solar equipment to AI-enabled industrial technology, with a new generation of firms targeting global markets from inception, according to Goldman Sachs analysts led by Jacqueline Du. They wrote China has entered the \"Go Global 3.0\" era, moving beyond low-cost goods and the \"new three\" sectors of EVs, batteries and solar. Firms now target hardware across the AI value chain, from data centre infrastructure to automated systems. \"Born global\" companies like Unitree Robotics shipped over 5,500 humanoid robots last year, far above US rivals delivering about 150 each. Analysts warned of heightened regulatory and trade risks, noting recent US bans on foreign humanoid robots and power inverters. Long-term competitiveness depends on turning speed and pricing into quality advantages.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/From%20solar%20to%20AI%20why%20China%20may%20be%20entering%20its%20'Go%20Global%203.0'%20era.pdf"}, {"id": "scmp-09", "title": "Fund backed by China memory giant YMTC invests in push for alternative chipmaking route", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Technology & AI"], "summary": "A venture capital fund backed by Yangtze Memory Technologies Corp (YMTC), China's top NAND flash producer, has taken a stake in domestic semiconductor manufacturer SOI Micro, boosting the country's push for an alternative chipmaking ecosystem. Guangzhou-based SOI Micro develops fully depleted silicon-on-insulator (FD-SOI) technology, a low-power route complementary to mainstream processes. Its registered capital rose to 2.53 billion yuan (US$375 million), with Wuhan's Changcun Industry Investment Fund appearing as a new shareholder, though the stake was undisclosed. SOI Micro, founded in 2022, is led by veteran technologist Ye Tianchun, former head of the Chinese Academy of Sciences' Institute of Microelectronics. The company targets 28-nanometre-class logic processes, with Ye describing FD-SOI as a \"second track\" for the Greater Bay Area's chip sector.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Fund%20backed%20by%20China%20memory%20giant%20YMTC%20invests%20in%20push%20for%20alternative%20chipmaking%20route.pdf"}, {"id": "scmp-10", "title": "HKEX pushes ahead on extended trading hours discussions as it prepares paper: sources", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Finance & Markets"], "summary": "Hong Kong Exchanges and Clearing (HKEX) will push ahead with talks on extending stock market trading hours by releasing a discussion paper, despite brokers' concerns over longer hours and possible cancellation of the lunch break, two sources said. The paper could pave the way for the first change to the city's opening times in 14 years and would outline pros and cons without concrete proposals; a public consultation would follow if feedback is supportive. HKEX currently trades 9.30am to 4pm with a one-hour lunch break. Pressure has mounted as Nasdaq expands to 23 hours daily from December 6 and the London Stock Exchange plans an overnight venue. Over 500 Hong Kong brokerage firms have raised cost and workload concerns. Changes would be phased in.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/HKEX%20pushes%20ahead%20on%20extended%20trading%20hours%20discussions%20as%20it%20prepares%20paper%20sources.pdf"}, {"id": "scmp-11", "title": "HSBC reshuffles insurance division after CEO's surprise departure: internal memo", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Finance & Markets"], "summary": "HSBC has launched a major reshuffle of its insurance unit after global insurance CEO Edward Moncreiffe resigned to pursue external opportunities, according to an internal memo. Daisy Tsang, CEO of HSBC Life Hong Kong, and Kai Zhang, Asia head of international wealth and premier banking, were named co-CEOs of insurance, effective immediately, while retaining current roles. Moncreiffe's departure surprised the market, as insurance and wealth are key expansion focuses; the wealth arm's revenue jumped 18 per cent and insurance 32 per cent in the first half. The pair face a challenging period as Beijing tightens controls on cross-border wealth products, levying a 20 per cent tax on offshore insurance gains. The reshuffle follows HSBC's agreement to sell its Singapore insurance business to Allianz.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/HSBC%20reshuffles%20insurance%20division%20after%20CEO's%20surprise%20departure%20internal%20memo.pdf"}, {"id": "scmp-12", "title": "Hong Kong seeks tech exposure to take on Nasdaq amid Beijing's rising AI dominance", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Hong Kong is intensifying efforts to increase its stock market's technology exposure to catch up in the global AI trade and potentially challenge the Nasdaq. Several mainland hardware tech firms, particularly makers of optical transceivers used in AI data centres, are lining up for listings after Zhongji Innolight's debut last month, which raised US$6.8 billion. Hang Seng Indexes Company proposed revamping the Hang Seng Tech Index to add more constituents, potentially expanding from 30 to 50 and using revenue growth as inclusion criteria. Limited AI exposure helped Hong Kong stocks escape last month's tech sell-off, with the Hang Seng Index up 13 per cent, but the Tech Index lost over 10 per cent this year. Rebalancing decisions come August 21; MiniMax and Z.ai are candidates.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Hong%20Kong%20seeks%20tech%20exposure%20to%20take%20on%20Nasdaq%20amid%20Beijing's%20rising%20AI%20dominance.pdf"}, {"id": "scmp-13", "title": "Hong Kong stablecoin selection expands with Standard Chartered-led venture's launch", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "A Standard Chartered-led joint venture, Anchorpoint Financial, kicked off institutional use of Hong Kong dollar-backed stablecoins on Wednesday, a year after the city's stablecoin law took effect as part of its digital-asset hub ambitions. Formed with Animoca Brands and HKT, Anchorpoint began the first phase of its HKDAP coin roll-out via beta access, with retail use expected \"as early as end-2026,\" subject to market conditions. HKDAP stands for \"Hong Kong dollar at par.\" Authorised distributors may offer conversion between HKDAP and fiat for institutions and professional investors. The move aligns with the cautious stance of the Hong Kong Monetary Authority, which granted its first stablecoin licences to HSBC and Anchorpoint in April after Beijing banned onshore tokenisation of real-world assets in February.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Hong%20Kong%20stablecoin%20selection%20expands%20with%20Standard%20Chartered-led%20venture's%20launch.pdf"}, {"id": "scmp-14", "title": "Hong Kong's economic and trade network plays to city's strengths", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Trade", "Southeast Asia"], "summary": "This SCMP editorial welcomes Hong Kong's opening of a new Economic and Trade Office (ETO) in Kuala Lumpur, a strategic move to bolster relations with Asean and its 15th overseas office outside mainland China. Achieved in two years with strong Malaysian support, the office reflects deep bilateral ties. Asean is Hong Kong's second-largest merchandise trading partner, with goods trade reaching HK$1.67 trillion (US$212.83 billion) last year, 15.3 per cent of global trade. Bilateral trade with Malaysia hit US$34.8 billion in 2025. The ETO also covers Brunei, Laos and Pakistan, reinforcing Hong Kong's \"superconnector\" role linking mainland enterprises with Asian markets. It coincides with the HKTDC's \"Think Business, Think HK\" campaign, whose 200-strong delegation to Malaysia is the largest ever.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Hong%20Kong's%20economic%20and%20trade%20network%20plays%20to%20city's%20strengths.pdf"}, {"id": "scmp-15", "title": "How Hong Kong can unlock the real value of its Asean trade boom", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Trade", "Southeast Asia"], "summary": "This analysis argues Hong Kong must attach high-value services to its booming Asean trade to convert commerce into lasting returns, rather than relying on re-export volumes. Asean has been Hong Kong's second-largest trading partner since 2010, with 2025 merchandise trade of HK$1.67 trillion (US$212.8 billion) and direct investment stock exceeding HK$670 billion. But enormous volumes yield thin margins; larger profits accrue in trade finance, treasury, insurance, legal services and regional headquarters. Vietnam and Singapore account for nearly 63 per cent of Asean trade. A HKTDC-UOB survey found 73 per cent of firms planned to accelerate Asean expansion, though 47 per cent struggled finding local partners. The piece warns Hong Kong risks being bypassed as mainland firms and Singaporean institutions build direct networks.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/How%20Hong%20Kong%20can%20unlock%20the%20real%20value%20of%20its%20Asean%20trade%20boom.pdf"}, {"id": "scmp-16", "title": "Little surprise Beijing doesn't want Western advice for its economy", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "This SCMP editorial argues China's restrained economic stimulus is not policy paralysis but reflects different priorities: Beijing is preparing for prolonged strategic rivalry with the United States. Western economists prescribe transferring income to households and reducing reliance on investment and exports, but China increasingly optimises for strategic resilience over short-term GDP. The piece notes China still has fiscal room but faces diminishing returns on debt-fuelled growth. It describes a K-shaped economy: property and construction grinding to a halt while EVs, batteries, solar, robotics and AI expand, precisely the sectors colliding with Western interests. Tensions are therefore likely to intensify. Citing Japan's post-Plaza Accord struggles and the Soviet collapse, Beijing believes the more dangerous disease is dependence on others, not slow growth.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Little%20surprise%20Beijing%20doesn't%20want%20Western%20advice%20for%20its%20economy.pdf"}, {"id": "scmp-17", "title": "PLA holds first joint naval drill with Indonesia in waters east of Taiwan", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Defence", "Geopolitics", "Southeast Asia"], "summary": "China's People's Liberation Army and Indonesian forces held joint naval exercises east of Taiwan on Wednesday, signalling deeper Beijing-Jakarta military ties. The drill featured the PLA Navy's Type 054A frigate Honghe and Indonesia's KRI I Gusti Ngurah Rai, covering maritime communications, formation manoeuvres and replenishment. It marks the first time the PLA conducted drills with a foreign navy in the area. Indonesia said the exercises were not for warfighting but consistent with its non-aligned policy, while Taiwan protested the plan as a \"provocation.\" The drill follows intensified mainland patrols east of the island since June, with a China Coast Guard fleet reaching within 32 nautical miles of Hualien. Beijing has also strengthened ties with Russia and Indonesia, Southeast Asia's biggest economy.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/PLA%20holds%20first%20joint%20naval%20drill%20with%20Indonesia%20in%20waters%20east%20of%20Taiwan.pdf"}, {"id": "scmp-18", "title": "Palm oil to cool data centres? Malaysia explores option as water demand surges", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Environment", "Technology & AI", "Southeast Asia"], "summary": "Malaysia is exploring using palm oil to cool data centre servers without relying on large volumes of water, as its digital infrastructure boom strains resources. Researchers at the Malaysian Palm Oil Board are developing a palm-based liquid coolant, termed Sawit EcoTherm, nearing commercialisation with a local manufacturer. Data centres used 28.68 million litres of water daily as of January. The coolant would cost US$2.44 to US$6.10 per kilogram versus US$12.20 to US$19.52 for synthetic alternatives, could eliminate water use and cut energy consumption up to 40 per cent. However, experts warned it could drive palm plantation expansion and shift the environmental burden upstream, urging no-deforestation commitments and certified feedstock. Malaysia approved 143 data centre projects worth US$35.23 billion from 2021 to mid-2025.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Palm%20oil%20to%20cool%20data%20centres%20Malaysia%20explores%20option%20as%20water%20demand%20surges.pdf"}, {"id": "scmp-19", "title": "Putin warns of retaliation for Western seizures of Russian commercial ships", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Russian President Vladimir Putin on Wednesday threatened retaliation for Western seizures of Russian commercial vessels, calling them \"piracy and robbery.\" Speaking during a visit to a warship in a Pacific naval exercise, he described the West's detentions as breaching international maritime law and warned Moscow could respond \"in any area,\" including the Pacific. Pacific Fleet chief Admiral Viktor Liina said the navy was ready to inspect and detain vessels serving \"unfriendly nations\" and their \"shadow fleet.\" Russia is believed to use hundreds of ships to evade sanctions imposed after invading Ukraine in 2022; France and the UK have detained tankers, and the EU has sanctioned hundreds of shadow-fleet ships. Dmitry Medvedev said Russia could attack merchant vessels of hostile nations carrying enemy cargo.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Putin%20warns%20of%20retaliation%20for%20Western%20seizures%20of%20Russian%20commercial%20ships.pdf"}, {"id": "scmp-20", "title": "Singapore and South Korea eye science opportunities as last main US-China link shatters", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Geopolitics", "Technology & AI"], "summary": "As Xi Jinping prepares for summit talks with Donald Trump next month, Washington is closing one of the few remaining US-China openings by targeting scientific research through new security restrictions on federally funded collaborations. Experts say the measures will reshape where collaboration happens rather than halt Chinese progress, creating openings for intermediary hubs. US-China co-authored papers peaked in 2017-2019 before falling roughly 20 per cent, with steep declines in AI, engineering and quantum fields. In July, the Pentagon added Fudan and Shanghai Jiao Tong to its Section 1286 list. Singapore has emerged as perhaps the clearest beneficiary given its neutrality and English-language universities, alongside the Gulf states, South Korea and others. Analysts warn global science will become more fragmented, with both sides poorer off.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Singapore%20and%20South%20Korea%20eye%20science%20opportunities%20as%20last%20main%20US-China%20link%20shatters.pdf"}, {"id": "scmp-21", "title": "US-China 'Board of Investment' stalls before expected Trump-Xi meeting", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Trade", "Geopolitics"], "summary": "The US-China Board of Investment, a key outcome of the May Trump-Xi summit, is unlikely to be a deliverable for their expected September meeting in Washington, according to US-China Business Council president Sean Stein, who said neither side had initiated the consultation process. The board, announced alongside a Board of Trade, aimed to provide a government-to-government forum on investment issues. Analyst Wendy Cutler attributed the delay to differing US views on Chinese FDI risks. Chinese FDI into the US plummeted from US$55 billion in 2016 to just US$4 billion in 2025. Negotiations on the Board of Trade have intensified, racing to finalise non-sensitive sectors for tariff-free trade capped at US$30 billion each, with agriculture and aviation selected. Diplomatic activity is notably lower than previous summits.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/US-China%20'Board%20of%20Investment'%20stalls%20before%20expected%20Trump-Xi%20meeting.pdf"}, {"id": "scmp-22", "title": "Why China's traders, e-commerce merchants feel boxed in by new EU packaging rules", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Trade", "Environment"], "summary": "The European Union's Packaging and Packaging Waste Regulation (PPWR) became applicable across the bloc on Wednesday, adding a compliance layer for Chinese exporters already facing tighter trade restrictions. Replacing a 1994 directive, it sets requirements for every piece of packaging, covering chemical restrictions, recyclability and producer responsibility. Researcher Zhou Mi said the previous system letting companies find lenient entry points no longer works under the unified framework. The scope is \"unprecedentedly broad,\" spanning food, cosmetics, electronics and auto parts. Chinese exports to the EU rose to US$370 billion in the first seven months of 2026, up 16.7 per cent. Exporters face fines, customs blocks and bans for non-compliance, with strict PFAS restrictions and mandatory conformity declarations. Enforcement uncertainty could function as a trade barrier.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Why%20China's%20traders,%20e-commerce%20merchants%20feel%20boxed%20in%20by%20new%20EU%20packaging%20rules.pdf"}, {"id": "scmp-23", "title": "Why does Hong Kong need a 5-year plan – and will it crimp its free-market economy?", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Politics", "Finance & Markets"], "summary": "Hong Kong will roll out its first-ever five-year plan by end-September to align economic and social development with national strategy, marking a governance pivot from its laissez-faire tradition of annual policy addresses and budgets. The public consultation ends this Friday, with the plan (2026-30) spanning six pillars including the Northern Metropolis, finance and innovation, corresponding to China's 15th five-year plan themes. HKU economist Heiwai Tang said the lack of long-term planning contributed to housing shortages and inequality. Officials stress Hong Kong is not pivoting to a command economy but remains \"market-led and government-facilitated.\" Critics including Stephen Roach warn Chinese-style central planning could over-promise. Supporters cite Singapore, South Korea and Japan as proof strategic state guidance and free markets can coexist.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Why%20does%20Hong%20Kong%20need%20a%205-year%20plan%20-%20and%20will%20it%20crimp%20its%20free-market%20economy.pdf"}, {"id": "scmp-24", "title": "Why does SK Hynix want to sell its chip facility in southwest China?", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "South Korean chipmaker SK Hynix's potential deal to offload a packaging plant in Chongqing is part of a strategic pivot towards higher-margin AI memory products, according to analysts, who cautioned a sale faces valuation hurdles and a volatile chip cycle. SK Hynix said it was exploring solutions to enhance its packaging business competitiveness; options include a stake sale valuing the plant near US$3 billion, Bloomberg reported. The Chongqing plant handles downstream packaging and testing for NAND flash. Analysts see it as recycling capital from lower-margin legacy products towards high-bandwidth memory, potentially funding a 54 trillion won (US$38 billion) domestic expansion. Yangtze Memory Technologies and outsourced assembly specialists like JCET are seen as potential buyers. Packaging transfers may clear regulators more easily than fab transfers.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Why%20does%20SK%20Hynix%20want%20to%20sell%20its%20chip%20facility%20in%20southwest%20China.pdf"}]}, "2026-08-14": {"date": "2026-08-14", "dayOfWeek": "Friday", "totalArticles": 95, "sourceCounts": {"WSJ": 20, "ST": 25, "BT": 25, "SCMP": 25}, "executiveDigest": "The US escalated on Iran even as oil fell: Washington is weighing an 'indefinite naval blockade' and sending a fresh aircraft carrier as bombings 'fail to sway' Tehran, while Iran struck two ADNOC vessels in Hormuz and Houthis hit Aramco's Jazan refinery again - yet crude settled down 2% on weak demand and a hefty US build. Benign US inflation (producer prices flat) cemented Fed-hold bets and nudged gold lower. Singapore's earnings ran hot and cold - CapitaLand Investment will recycle up to S$9 billion and ST Engineering's profit rose 27%, but MSCI dropped Sembcorp and GoTo from its global benchmarks.", "briefingCards": [{"title": "Lead story - US escalates on Iran as oil slips", "body": "Washington hardened its Iran posture: ST reported the US 'eyes an indefinite naval blockade as the oil supply shortfall deepens', WSJ said it is 'sending a fresh aircraft carrier to the Middle East amid Iran-war strain', and SCMP framed Trump turning 'to economic pain as US bombings fail to sway Iran'. The waterway stayed hot - the UAE said Iran attacked two ADNOC vessels in Hormuz (no injuries), and Houthis struck Aramco's Jazan refinery for a second time in a week. Yet the market shrugged: oil 'settled down 2% on a weak demand outlook and a hefty US crude build'. WSJ warned of 'Washington's four wrong assumptions about the Iran war', and Trump even ordered US carriers 'back to steam catapults'."}, {"title": "Markets & finance", "body": "Benign inflation set the tone: US producer prices were 'unchanged in July', the greenback steadied and gold declined 'as sliding US inflation reinforced Fed-hold bets', while weekly jobless claims pointed to a stable labour market and Fitch kept the US at 'AA+'. WSJ's Greg Ip cautioned that although 'the stock market thinks the economy is accelerating', jobs may not follow. Corporate cash was busy - AMD is looking to raise US$4-5 billion of debt, OpenAI's revenue run-rate topped US$40 billion ahead of an IPO, and Maersk's Q2 profit 'smashed forecasts' as it raised guidance. A notable index shock hit Singapore: MSCI dropped Sembcorp and GoTo (and Ayala Land) from its global benchmarks."}, {"title": "Asia realignment", "body": "Trade enforcement sharpened: the US accused Chinese exporters of a 'Great Transshipment Scam', 'flagged dozens of trade partners as tariff-evasion risks', won a court ruling to end the small-parcel tariff exemption, and Trump slapped tariffs 'up to 100% on imported drones' - while Mexico pressed to cut auto tariffs. WSJ mused on 'how to lose friends and alienate allies'. China pushed back and out: SCMP said 'the China discount now carries a premium', Chinese carmakers could take 15-30% of Europe by 2035, and Beijing will tighten entry-exit controls from Sept 15. Security frictions grew with Taiwan 'weaponizing its coast guard', a 50% boost to China's Type 054B missile capacity, and Putin's disputed-island visit pressuring Japan."}, {"title": "Energy & climate", "body": "Oil's geopolitics and fundamentals diverged: despite the blockade threat, Hormuz vessel attacks and a second Houthi strike on Aramco's Jazan refinery, crude settled down 2% on weak demand and a US build. In a striking pivot, WSJ noted 'Elon Musk, the world's most famous EV pioneer, is now leaning into fossil fuels', while Rick Perry's Fermi 'finally found a customer for its giant Texas AI power bet' and SK Shipping and H-Line swapped tankers 'to create an LNG giant'. Climate strain mounted: Romania shut a nuclear plant as the Danube dropped, and experts said 2026 is 'likely to be the hottest year on record'."}, {"title": "Technology & AI", "body": "The model race reshuffled: BT reported 'Google shifted power in its top ranks' in a 'race to regain AI-model supremacy', unveiling Gemini 3.7 Flash while its top model stays delayed, and DeepMind's Hassabis 'pitched an AI-oversight body before the shake-up' (SCMP: 'which AI camp has Trump's ear now?'). China's chip complex surged - SMIC and Hua Hong posted triple-digit profit growth on AI demand, YMTC broke into the global top-three flash-memory suppliers, and Applied Materials eyed capacity expansion - even as WSJ flagged 'Chinese censorship leaking into answers from American AI' and Alibaba added commercial restrictions to its open-weight Qwen model. Lenovo posted record revenue toward a US$100 billion goal, and UMS profit jumped 89% on an AI 'super cycle'."}, {"title": "Singapore & SEA focus", "body": "Singapore earnings were mixed but active: CapitaLand Investment will 'restructure its portfolio and recycle up to S$9 billion' (and weighs a partial Ascott-stake sale), CDL tripled H1 profit to $300 million, ST Engineering's H1 profit rose 27.1% to S$512.1 million, and UMS jumped 89% on the AI super-cycle - but Genting Singapore (-33.5%), Singtel (-72%) and Frencken (-3.4%) slid, Sembcorp's profit fell 72% (dividend still raised), and MSCI dropped Sembcorp and GoTo from global benchmarks. The hub kept pulling in tech and talent - Lam Research will add 200 Singapore jobs 'amid the AI boom' and China's STEM students are 'turning to Singapore as Western study options shrink' - while PropNex sees lower mortgage rates supporting the 2026 property market."}], "keyMetrics": [{"value": "95", "label": "Articles curated today", "sub": "WSJ 20 · ST 25 · BT 25 · SCMP 25"}, {"value": "Blockade + carrier", "label": "US escalates on Iran", "sub": "Bombings 'fail to sway' Tehran"}, {"value": "-2%", "label": "Oil settles lower", "sub": "Weak demand; hefty US build"}, {"value": "Flat PPI", "label": "Benign US inflation", "sub": "Cements Fed-hold bets"}, {"value": "S$9b", "label": "CapitaLand Investment recycle", "sub": "ST Eng +27%; MSCI cuts Sembcorp"}, {"value": "US$40b", "label": "OpenAI revenue run-rate", "sub": "Ahead of IPO; AMD raises debt"}], "articles": [{"id": "wsj-01", "title": "Apple Showcases Texas Mac Mini Factory, New Manufacturing School", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Technology & AI", "Trade", "Politics"], "summary": "In one of his last public appearances as CEO, Tim Cook toured a Texas Foxconn plant with Commerce Secretary Howard Lutnick, unveiling a Mac Mini assembly line starting later this year and a hands-on manufacturing school for small and midsize firms. The visit spotlighted Apple's close ties with the Trump administration, which has touted Apple's pledge to invest $600 billion domestically over four years and granted it relief from the heaviest tariffs. Most of Apple's supply chain remains overseas; it is expanding iPhone assembly in India. Apple has committed to buy chips from TSMC's Arizona plant, struck deals with Intel and Broadcom, and Foxconn is funding the assembly lines. Cook becomes chairman next month; John Ternus takes over.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/Apple%20Showcases%20Texas%20Mac%20Mini%20Factory,%20New%20Manufacturing%20School.pdf"}, {"id": "wsj-02", "title": "Applied Materials Eyes Capacity Expansion as Profit, Revenue Grow", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Applied Materials plans to roughly double quarterly semiconductor-system output by 2028 and is planning another expansion for 2030, responding to AI-driven demand, CFO Brice Hill told analysts. Fiscal third-quarter net income rose to $2.54 billion, or $3.17 a share, from $1.78 billion a year earlier; adjusted earnings of $3.50 beat the $3.40 consensus. Revenue climbed to $9.12 billion from $7.3 billion, topping estimates, with semiconductor-systems revenue at $7.04 billion. CEO Gary Dickerson raised calendar-2026 expectations, citing DRAM, foundry-logic and advanced packaging. Fourth-quarter guidance is $3.82-$4.22 a share on $9.75-$10.75 billion revenue. Shares fell 5% after hours to $507.97 despite more than doubling this year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/Applied%20Materials%20Eyes%20Capacity%20Expansion%20as%20Profit,%20Revenue%20Grow.pdf"}, {"id": "wsj-03", "title": "China's SMIC Posts Earnings Beat as Mature-Node Orders Surge", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "SMIC, China's biggest chip foundry, more than tripled second-quarter net profit to $479.2 million, far above the $283.1 million analysts expected, as AI-driven capacity squeezes pushed clients to shift mature-node and specialty orders to China. Revenue rose 36% to $3.01 billion and gross margin hit 25.3%, topping guidance and reaching a multi-quarter high. Smartphone wafers made up 25.2% of revenue, up from 18.9%. Co-CEO Zhao Haijun said the firm negotiated higher prices on scarce products. SMIC guided third-quarter gross margin to 26%-28% and revenue up 2%-4% sequentially, with wafer utilization at 93.7%. It pledged to \"flexibly allocate\" capacity to ease industrywide shortages.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/China's%20SMIC%20Posts%20Earnings%20Beat%20as%20Mature-Node%20Orders%20Surge.pdf"}, {"id": "wsj-04", "title": "Chinese Censorship Is Leaking Into Answers From American AI", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "New studies find American AI models unwittingly echo Chinese censorship, absorbing state-controlled media during training. Meta's oversight board research showed models from OpenAI, Anthropic, Google and Meta were less likely to criticize repressive governments. In tests, Anthropic's Claude Sonnet 4 created fliers criticizing Trump and King Charles III but refused ones targeting Xi Jinping or Thailand's king, citing safety; Google's Gemini 3 Pro and Meta's Llama 4 Maverick sometimes declined too. Researcher Nicolas Suzor cited safety features and neglect of unequal responses. A separate Nature study found Chinese-language prompts more likely to yield pro-Beijing answers because state-scripted sources dominate that data. Researchers urge transparency about state-sourced content; Anthropic and OpenAI cited balance efforts.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/Chinese%20Censorship%20Is%20Leaking%20Into%20Answers%20From%20American%20AI.pdf"}, {"id": "wsj-05", "title": "DeepMind's Hassabis Pitched AI-Oversight Body Before Shake-Up", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Technology & AI", "Politics"], "summary": "Alphabet scientist Demis Hassabis held talks with government officials and rival AI-lab leaders about forming an independent industry safety entity in the weeks before stepping down as Google DeepMind CEO, people familiar said. He likened it to the International Atomic Energy Agency and, in a mid-July essay, proposed an industry-funded \"standards body\" modeled on FINRA, with national labs testing models for national-security risks. He previewed the idea to Treasury Secretary Scott Bessent and adviser Michael Kratsios. OpenAI's Sam Altman and Anthropic have floated similar coordination mechanisms. Hassabis, a Nobel laureate, becomes DeepMind chairman and Alphabet chief scientist, replaced as CEO by Koray Kavukcuoglu. Critics say voluntary self-regulation is inadequate.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/DeepMind's%20Hassabis%20Pitched%20AI-Oversight%20Body%20Before%20Shake-Up.pdf"}, {"id": "wsj-06", "title": "Elon Musk, the World's Most Famous EV Pioneer, Is Now Leaning Into Fossil Fuels", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Energy", "Technology & AI"], "summary": "Elon Musk, once an evangelist against fossil fuels, is turning to natural gas to power SpaceX's AI ambitions. SpaceX disclosed plans for a gas plant at its $16.8 billion \"Terafab\" chip project in Grimes County, Texas, and relies on dozens of gas turbines at data centers in Tennessee and Mississippi; Musk personally bought a turbine maker. Its data centers already supply three-quarters of 2 gigawatts of behind-the-meter power, and Musk says capacity could reach 10-15 gigawatts by end-2027, surpassing Amazon's 13. The \"Bring Your Own Power\" trend lets projects bypass slow grid connections. SpaceX struck cloud deals with Anthropic ($1.25 billion monthly) and Google ($920 million). Cleanview tracks 59 off-grid centers totaling roughly 90 gigawatts.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/Elon%20Musk,%20the%20World's%20Most%20Famous%20EV%20Pioneer,%20Is%20Now%20Leaning%20Into%20Fossil%20Fuels.pdf"}, {"id": "wsj-07", "title": "The stock market thinks the economy is accelerating. Don't expect jobs to follow, writes the WSJ's Greg Ip.", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Society"], "summary": "Greg Ip argues the U.S. is in a \"jobless boom.\" Stocks are up 13% this year despite lackluster 1.5% annualized second-quarter GDP, and the rally reflects earnings, not a bubble: excluding Amazon and Alphabet, second-quarter earnings jumped 32%, so multiples fell. Median S&P 500 earnings growth accelerated to 13% from 8% two years ago, broad-based beyond AI, with banks and small caps outpacing the Magnificent Seven. Yet hiring is stalling: total payrolls shrank in July, the fifth time in 12 months, while unemployment stays near 4% only because the labor force is shrinking amid retirements and reduced immigration. Wage growth of 3.2% is the lowest since before the pandemic. Consumer saving and debt-funded data centers can't sustain forever.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/Greg%20Ip%20-%20stock%20market%20says%20economy%20accelerating,%20jobs%20won't%20follow.pdf"}, {"id": "wsj-08", "title": "How to Lose Friends and Alienate Allies", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Geopolitics", "Trade"], "summary": "In an opinion piece, Rahm Emanuel argues both Washington and Beijing are using other nations as dumping grounds for domestic dysfunction, whipsawing middle powers between Chinese economic coercion and American political intervention. China exports excess capacity, killing Chile's Huachipato steelworks and Indonesian garment jobs; Trump exports cultural divisions, sanctioning a Brazilian judge, tariffing Brazil 50%, and courting Germany's far-right AfD. Emanuel urges Democrats to \"isolate the isolator\" via three steps: replace tariff walls with an \"economic bloc of common interest\" setting one external tariff on subsidized overcapacity; compete in markets by helping allies find alternatives to Chinese coercion; and treat allies' industrial bases as U.S. security assets. He says Trump's boorishness squanders chances to exploit China's vulnerabilities.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/How%20to%20Lose%20Friends%20and%20Alienate%20Allies.pdf"}, {"id": "wsj-09", "title": "JD.com Profit, Revenue Beat Expectations as Food-Delivery Losses Narrow", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "JD.com beat second-quarter expectations as losses narrowed at its costly food-delivery business, entered 18 months ago. Net profit rose 15% from a year earlier and 40% from the prior quarter to 7.13 billion yuan ($1.06 billion); adjusted net profit climbed 21% to 8.93 billion yuan. Revenue fell 2.9% to 346.40 billion yuan but beat the 339.93 billion yuan consensus. CEO Sandy Xu cited \"resilient and high-quality operations\" and a \"clear inflection\" in profit driven by core JD Retail and narrowing delivery losses. HSBC analysts expect further improvement as promotions ease. China's weak consumption remains a drag, with slower growth at the \"618\" shopping festival signaling persistent softness, per Syntun data.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/JD.com%20Profit,%20Revenue%20Beat%20Expectations%20as%20Food-Delivery%20Losses%20Narrow.pdf"}, {"id": "wsj-10", "title": "Lenovo Posts Record Revenue, Expects to Hit $100 Billion Goal This Year", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Lenovo posted record quarterly revenue of $26.94 billion for the three months ended June, up 43% and beating the $22.33 billion consensus, and now expects to hit its $100 billion annual revenue goal ahead of schedule. Its infrastructure-solutions business nearly doubled revenue on surging AI-server demand, producing $777 million operating profit, with a $54 billion AI-server pipeline. AI-related revenue was 35% of the total. Adjusted net profit nearly tripled to $1.075 billion, though the company swung to a $609 million net loss on a warrant-revaluation charge. Intelligent devices rose 27%; worldwide PC shipments fell 4.9% amid memory-driven price rises, yet Lenovo held 24.2% market share. Hong Kong shares jumped 20%, up over 275% year-to-date.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/Lenovo%20Posts%20Record%20Revenue,%20Expects%20to%20Hit%20100%20Billion%20Goal%20This%20Year.pdf"}, {"id": "wsj-11", "title": "Mexico Presses U.S. to Cut Auto Tariffs", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Trade", "Energy"], "summary": "Mexico is pressing the U.S. to lower North American auto tariffs as part of talks to rework the USMCA, countering Washington's push for more U.S.-made parts. The U.S. currently charges 25% on non-U.S. content from Canada and Mexico; Mexico's plan would let Mexican and Canadian parts qualify duty-free and drop the top-line rate to roughly 5%-10% for non-compliant North American cars. The bundled news brief also covers AI-driven warehouse demand (Link Logistics ties 15% of new leasing to data centers); Black Sea maritime attacks by Russia and Ukraine threatening grain and oil flows; Iran's near-halt of Strait of Hormuz traffic; OPEC cutting 2026 demand-growth forecasts to 580,000 barrels a day; and Bank of America's $250 billion infrastructure push.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/Mexico%20Presses%20U.S.%20to%20Cut%20Auto%20Tariffs.pdf"}, {"id": "wsj-12", "title": "Putin's Visit to Disputed Island Adds to Pressure on Japan", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Vladimir Putin made his first visit to the southern Kuril Islands, a chilly archipelago Russia seized from Japan in 1945 that Tokyo still claims, adding to mounting pressure on Japan from China, Russia and North Korea. Prime Minister Sanae Takaichi called the visit to Iturup \"absolutely unacceptable.\" It followed a North Korean ballistic-missile launch and months of Chinese friction after Takaichi suggested Japan could be drawn into a Taiwan conflict, prompting Beijing to cancel tourist flights and restrict critical-mineral access. China, North Korea and Russia have accused Japan of reviving militarism. Analyst James Brown said Moscow appears to be \"deliberately making common cause with China.\" Japan's defense ministry calls the environment its most severe in 80 years.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/Putin's%20Visit%20to%20Disputed%20Island%20Adds%20to%20Pressure%20on%20Japan.pdf"}, {"id": "wsj-13", "title": "Rick Perry's Fermi Finally Finds a Customer for Its Giant Texas AI Power Bet", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Energy", "Technology & AI"], "summary": "Fermi, the data-center and power startup co-founded by former Energy Secretary Rick Perry, landed its first customer and named a new CEO, aiming to turn a corner after a legal fight with ousted co-founder Toby Neugebauer. AI cloud provider TensorWave leased 222 megawatts at Fermi's Texas \"Project Matador\" campus, worth about $6.5 billion over 15 years. Board member Lee McIntire became CEO. The startup has booked no revenue and its net loss widened to $25.8 million; its market value has fallen from roughly $19 billion at October's IPO to under $5 billion. Hillcore Energy Capital will build 2.6 gigawatts of mostly gas generation. Fermi projects 4.8 gigawatts within 30 months, eventually 17 gigawatts, riding the \"Bring Your Own Power\" trend.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/Rick%20Perry's%20Fermi%20Finally%20Finds%20a%20Customer%20for%20Its%20Giant%20Texas%20AI%20Power%20Bet.pdf"}, {"id": "wsj-14", "title": "Taiwan Weaponizes Coast Guard to Prepare for Battle With China", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Taiwan is giving its coast guard an expanded national-security role, integrating it with the navy to counter a possible Chinese amphibious invasion. In recent drills near Kaohsiung, a coast guard cutter led missile boats, and the antiship-missile-armed cutter Bali escorted a commercial ship through a mock blockade, part of 33 exercises during this year's 10-day \"Han Kuang\" maneuvers. China has bulked up its own coast guard, using it to pressure Taipei with \"gray-zone\" operations. Taiwan's cutters can load Hsiung Feng II and III missiles and would fall under navy command in wartime. A 2018 plan aims to add 141 ships. Officials stress keeping sea lanes open for energy imports. The U.S. operates fast-response cutters from Singapore and the Philippines.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/Taiwan%20Weaponizes%20Coast%20Guard%20to%20Prepare%20for%20Battle%20With%20China.pdf"}, {"id": "wsj-15", "title": "Tariff Refunds Are Here—and Turbocharging Earnings", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Trade", "Finance & Markets"], "summary": "Tariff refunds are flowing to big U.S. companies with surprising speed after the Supreme Court invalidated a cornerstone of Trump's tariffs. Over 40 S&P 500 companies reported roughly $9.6 billion in refunds, including $2.1 billion in cash. Largest: Apple (nearly $2.2 billion), Nike ($986 million), FedEx (~$800 million), Amazon ($640 million) and GM ($500 million). Customs accepted $128.7 billion in refund submissions as of July 31. Apple said refunds added 11 cents to per-share earnings, about 5% of the quarter. Some firms, including FedEx and Costco, plan to pass refunds to customers. Yet many still pay far more in ongoing tariffs: Caterpillar booked $392 million in recoveries but expects $2.2 billion in total tariff costs this year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/Tariff%20Refunds%20Are%20Here-and%20Turbocharging%20Earnings.pdf"}, {"id": "wsj-16", "title": "Trump Is Starting to Look Precarious", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Politics", "Geopolitics"], "summary": "In an opinion column, Peggy Noonan argues Donald Trump's political position is eroding into new precarity amid the Iran war, economic anxiety and a resurgent left. RealClearPolitics puts his job approval at 39% against 59% disapproval; an Economist poll had him at 34%-61%. Noonan says Iran, a \"war of choice\" contradicting his anti-adventurism brand, makes him look out of his depth and less competent. On the economy, Reuters/Ipsos and Fox polls show Democrats edging or leading Republicans, denting Trump's businessman image. She warns of competitive House races in the midterms, an \"Incumbent Problem\" of accumulating bad news, and a fading mystique. She cites his remark to Tucker Carlson that things would be OK \"Because it always is,\" calling his need for drama a weakness.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/Trump%20Is%20Starting%20to%20Look%20Precarious.pdf"}, {"id": "wsj-17", "title": "U.K. Economy Continues Robust Performance in Second Quarter", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Energy"], "summary": "The U.K. economy grew 0.4% in the second quarter, matching consensus and outpacing the U.S., after a G7-leading 0.6% first-quarter rise. On an annualized basis, growth was 1.7%, above the U.S.'s 1.5% and near the eurozone's 1.8%, even as Iran's closure of the Strait of Hormuz lifted fuel prices. Services led growth; retail was buoyed by World Cup merchandise and England's hottest June on record, which boosted air-conditioning sales. The Bank of England, which held rates, is expected to hold in September but raise at least once by year-end, with inflation seen climbing to 3.2%. A 13% July energy price-cap rise threatens purchasing power. Prime Minister Andy Burnham, in office since July, has yet to detail a growth agenda.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/U.K.%20Economy%20Continues%20Robust%20Performance%20in%20Second%20Quarter.pdf"}, {"id": "wsj-18", "title": "U.S. Sending Fresh Aircraft Carrier to Middle East Amid Iran War Strain", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "The U.S. military is preparing to replace the USS Abraham Lincoln with the USS George Washington in the Middle East amid concerns over crew conditions during the Iran war. The Lincoln has been deployed over 250 days without a port call in 200, setting a record, with Senator Richard Blumenthal citing reports of supply shortages, water contamination, plumbing issues and lost mail. A sailor went overboard in early August but was rescued. Defense Secretary Pete Hegseth said the concerns were \"completely misrepresented\" and that the U.S. can sustain its blockade of Iranian ports indefinitely. The Lincoln aided Operation Epic Fury. Shifting the Japan-based George Washington leaves a Pacific void versus China; analysts warn readiness could take three years to restore.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/U.S.%20Sending%20Fresh%20Aircraft%20Carrier%20to%20Middle%20East%20Amid%20Iran%20War%20Strain.pdf"}, {"id": "wsj-19", "title": "U.S. and Ukrainian Forces Went Head-to-Head in an Exercise. Ukraine's Drones Won.", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Defence", "Technology & AI"], "summary": "At the Combined Resolve exercise in Germany in April and May, Ukrainian drone operators easily spotted and defeated U.S. troops and armored vehicles rotating from Fort Hood, eliminating a U.S. armored brigade, people familiar said. The drubbing, alongside U.S. casualties in Iran, exposes American vulnerabilities to drones years after the U.S. pioneered long-range uncrewed warfare and despite billions spent on counterdrone technology. Roughly 3,500 personnel from the 3rd Armored Brigade Combat Team faced a force reinforced by Ukraine's 412th \"Nemesis\" regiment; heavy vehicles threw up dust that reconnaissance drones easily tracked. NATO's top commander said \"You can't get training like this in the United States.\" Newer Mobile Brigade Combat Teams fared better. Scholar Eliot Cohen called mastering drones vital.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/U.S.%20and%20Ukrainian%20Forces%20Went%20Head-to-Head%20in%20an%20Exercise.%20Ukraine's%20Drones%20Won..pdf"}, {"id": "wsj-20", "title": "Washington's Four Wrong Assumptions About the Iran War", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "In an opinion piece, Nazee Moinian argues Washington keeps making four false assumptions about Iran. First, that the regime is a purely rational actor, ignoring its revolutionary self-image as leader of an \"axis of resistance.\" Second, that a fixed pain threshold exists, undercut by U.S. impatience—the April 13 oil blockade cost Tehran an estimated $500 million a day but was paused in June before concessions. Third, that battlefield losses become negotiating losses, though air campaigns alone rarely force surrender. Fourth, that domestic unrest weakens Iran abroad, when the regime treats dissent as capital \"moharebeh.\" Moinian backs resuming the financial blockade while empowering dissidents, noting Trump said he is \"only seminegotiating.\" Tehran, she writes, is wounded but not exhausted, playing a weak hand strongly.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/Washington's%20Four%20Wrong%20Assumptions%20About%20the%20Iran%20War.pdf"}, {"id": "st-01", "title": "'We don't need to hold 100%': CapitaLand Investment weighs partial sale of Ascott stake", "source": "ST", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "CapitaLand Investment (CLI) is considering divesting a stake in its hospitality arm, The Ascott Limited, to accelerate growth, chief executive Lee Chee Koon said at an Aug 13 results briefing. \"We don't need to hold 100 per cent of Ascott,\" Lee said, adding CLI is open to an investor that aids M&A ambitions but has not decided how much to sell. The move is separate from a plan to divest $7 billion to $9 billion in legacy funds and non-core holdings. CLI's first-half net profit rose 13.9 per cent to $327 million, driven by fund-management fee income up 20 per cent to $687 million, though total revenue slipped 2 per cent to about $1 billion. Some 96 per cent of Ascott's portfolio is asset-light.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/'We%20don't%20need%20to%20hold%20100'%20CapitaLand%20Investment%20weighs%20partial%20sale%20of%20Ascott%20stake.pdf"}, {"id": "st-02", "title": "Australia's Albanese says AUKUS remains 'full steam ahead' after Trump call", "source": "ST", "date": "14 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Australian Prime Minister Anthony Albanese said on Aug 14 the AUKUS defence pact remained \"full steam ahead\" after an overnight phone call with US President Donald Trump, and that he urged a full tariff exemption for Australia. Both leaders agreed the pact, which will deliver nuclear-powered submarines, would benefit Australia, the US and Britain. AUKUS, Australia's largest-ever defence project, will see US-commanded Virginia-class submarines based there from next year, and Canberra has committed A$368 billion ($259.7 billion) over three decades. Albanese called the talk \"very productive\" and said Trump agreed to consider exempting Australia from its flat 12.5 per cent tariffs. The leaders also discussed the Iran conflict and new Australian defence ties with Papua New Guinea and Fiji.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/Australia's%20Albanese%20says%20AUKUS%20remains%20'full%20steam%20ahead'%20after%20Trump%20call.pdf"}, {"id": "st-03", "title": "CDL triples first-half profit to $300m on strong residential property performance", "source": "ST", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "City Developments Limited (CDL) more than tripled first-half net profit to $301.6 million, up 230.7 per cent from $91.2 million a year earlier, as revenue jumped 61.1 per cent to $2.72 billion. Key contributors were the fully sold Lumina Grand executive condominium in Bukit Batok and strong take-up at Newport Residences. An interim dividend of six cents per share, double a year earlier, was declared, and shares briefly rose above 8 per cent. The hotel business returned to a $42 million pre-tax profit. CEO Sherman Kwek said the outcome of CDL's strategic review will be announced by end-September, that divestments will accelerate, and that Singapore property prices should end 2026 up 2 to 3 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/CDL%20triples%20first-half%20profit%20to%20300m%20on%20strong%20residential%20property%20performance.pdf"}, {"id": "st-04", "title": "China to tighten entry and exit controls from Sept 15", "source": "ST", "date": "14 Aug 2026", "tags": ["Politics", "Geopolitics"], "summary": "China will introduce stricter controls on people entering and leaving the country from Sept 15 under new 19-article State Council regulations signed by Premier Li Qiang on July 22. Applicants must state a truthful, lawful purpose, and authorities may question them and demand documents, materials and electronic data. Citizens who fraudulently obtain documents or commit crimes overseas harming national security may be barred from leaving for six months to three years, and those violating export-control rules may also be blocked. Foreigners using false documents face entry bans of one to five years. Immigration intermediaries must register within set deadlines. The rules do not establish blanket phone searches, nor revoke visa-free schemes covering 50 countries and a 240-hour transit policy for 55 nations.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/China%20to%20tighten%20entry%20and%20exit%20controls%20from%20Sept%2015.pdf"}, {"id": "st-05", "title": "Genting Singapore H1 profit falls 33.54% to $156.5 million despite stable revenue", "source": "ST", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Resort and casino operator Genting Singapore reported a 33.5 per cent drop in first-half net profit to $156.1 million from $234.7 million a year earlier, hit by higher depreciation, lower interest income and asset-refresh works. It cited a \"softer operating environment\" with lower second-quarter demand and moderating tourism arrivals. Revenue was largely stable, down 0.9 per cent at $1.2 billion, supported by non-gaming revenue up about 6 per cent to $388.6 million; gaming revenue fell about 4 per cent to $804.4 million. Adjusted Ebitda declined 8.4 per cent to $389.8 million. An unchanged interim dividend of $0.02 was declared. Resorts World Sentosa's Q2 Ebitda rose 12 per cent year on year, and the RWS 2.0 transformation remains on track for 2030.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/Genting%20Singapore%20H1%20profit%20falls%2033.54%20to%20156.5%20million%20despite%20stable%20revenue.pdf"}, {"id": "st-06", "title": "Japan's nuclear doublethink is getting harder to defend", "source": "ST", "date": "14 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "This Bloomberg Opinion column by Gearoid Reidy argues Japan's defence posture relies on \"doublethink\": opposing atomic weapons while sheltering under the US nuclear umbrella. Defence Minister Shinjiro Koizumi drew condemnation from China, Russia, North Korea and atomic-bomb survivors for saying Tokyo must \"discuss all policies, without any taboos\". The piece contends discussion does not mean adoption, and that Japan's three non-nuclear principles, adopted in 1967, are non-binding yet politically potent. It notes US plans to deploy nuclear-armed sea-launched cruise missiles on Virginia-class submarines that call at Japanese ports. Prime Minister Sanae Takaichi maintains the principles but may open debate on the third in an update of Japan's defence documents. The author says the debate's outcome should be won through discussion, not declared off-limits.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/Japan's%20nuclear%20doublethink%20is%20getting%20harder%20to%20defend.pdf"}, {"id": "st-07", "title": "Large explosion rips through Italian munitions facto
