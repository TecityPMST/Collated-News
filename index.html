ar low, signalling a stable labour market. Worker productivity grew a faster-than-expected 1.4 per cent annualised in the second quarter, curbing labour costs, with economists citing early signs AI adoption is lifting output. Contained wage pressures give the Fed room to focus on Middle East inflation fallout, though economists warn a September rate hike remains possible unless inflation eases. Challenger reported planned job cuts fell 27 per cent to 33,429 in July. Unit labour costs rose 1.3 per cent; the labour share hit a record-low 52.9 per cent. Non-farm payrolls, due Friday, were expected up 80,000 with unemployment at 4.2 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/US%20labour%20market%20stable%20worker%20productivity%20accelerates%20in%20Q2.pdf"}, {"id": "bt-20", "title": "Yen struggles to keep intervention gains; US dollar near 6-week low on Iran deal concerns, payroll jitters", "source": "BT", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "The Japanese yen struggled to hold intervention-led gains, trading flat at 157.75 per US dollar after touching 155.20 on Monday, while the dollar index hovered near a six-week low at 99.70. Traders turned cautious over a proposed Iran-Oman deal that could give Teheran control of inbound Strait of Hormuz traffic and ahead of US payroll data. Trump has called a strait-reopening deal imminent, but US officials insist they would never let Iran control the waterway. Brent slipped 0.3 per cent to US$79.25. The euro held at US$1.1548 and sterling at US$1.3456. Fed Governor Lisa Cook said the central bank may need to raise rates over \"too high\" inflation, while Daly backed holding steady. July payrolls were forecast up 80,000.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/Yen%20struggles%20to%20keep%20intervention%20gains,%20US%20dollar%20near%206-week%20low.pdf"}, {"id": "scmp-01", "title": "Argentina renews US$19 billion China currency swap, brushing off Washington's pressure", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Geopolitics", "Trade"], "summary": "Argentina's central bank and the People's Bank of China extended their 130 billion yuan (US$19 billion) currency swap line on Wednesday, a day before expiry, running the deal to 2031 - the longest term since it was first signed in 2009. The renewal ends speculation over whether President Javier Milei, a Trump ally who vowed never to deal with communists, would let it lapse. The line accounts for about 40 per cent of Argentina's gross reserves, down from nearly 60 per cent in 2023, and has funded Chinese imports, propped up the peso and covered IMF payments. Researchers including Harvard's Carmen Reinhart estimate Argentina pays 400 basis points over China's Shibor, twice what Turkey and Mongolia pay. Washington had offered a rival Treasury facility.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/Argentina%20renews%20US19%20billion%20China%20currency%20swap,%20brushing%20off%20Washington's%20pressure.pdf"}, {"id": "scmp-02", "title": "As record heatwave hits Asia, fears of energy crisis and health risks mount", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Environment", "Energy", "Society"], "summary": "A record heatwave gripping East Asia has raised fears of an energy crisis and mounting health risks. Since mid-May, about 2,200 South Koreans have been diagnosed with heat-related illnesses and 19 have died; on July 31 the country hit a record 41.4 degrees Celsius in Yangsan. In Japan, more than 18,000 people were hospitalised for heatstroke between July 20 and 26, and three lions died of suspected heatstroke at a Tokyo zoo. Scientists attribute the heat to human-induced climate change amplified by El Nino, dry soil and urban heat islands. Analysts warn surging air-conditioning demand is straining power grids while Middle East conflict lifts energy prices. The World Meteorological Organization expects above-normal temperatures to persist through October.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/As%20record%20heatwave%20hits%20Asia,%20fears%20of%20energy%20crisis%20and%20health%20risks%20mount.pdf"}, {"id": "scmp-03", "title": "China launches probe into Palo Alto Networks as US trade tensions intensify", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Technology & AI", "Trade", "Geopolitics"], "summary": "The Cyberspace Administration of China launched a cybersecurity review on Thursday into products sold in China by US firm Palo Alto Networks, saying it aimed to safeguard critical information infrastructure and national security. The move came a day after Beijing sanctioned several US companies and tightened drone supply-chain controls, retaliating for Washington's effective ban last week on foreign robotic devices and power inverters. Palo Alto, a leading cybersecurity and cloud provider, operates offices in Beijing, Shanghai and Guangzhou. Analysts said it could face a ban similar to Micron Technology, which failed a 2023 review and was barred from selling to critical-infrastructure operators. Such an outcome would hit its share in finance, energy, telecoms and transport, lawyer Shi Shenchang said.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/China%20launches%20probe%20into%20Palo%20Alto%20Networks%20as%20US%20trade%20tensions%20intensify.pdf"}, {"id": "scmp-04", "title": "China needs a stronger yuan and 'fiscal boost' to drive near-term growth: Goldman Sachs", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Trade"], "summary": "Goldman Sachs economists Kamakshya Trivedi and Hui Shan urged China to let the yuan appreciate gradually and deliver a \"fiscal boost\" to counter weak domestic demand and rising global protectionism, in a Wednesday research note. They estimated the yuan was about 20 per cent undervalued and said gradual appreciation would help restore external balance. China's trade surplus hit a record near US$1.2 trillion last year and widened by US$126 billion in June, even as exports stayed resilient despite the US-Israel war on Iran. Second-quarter GDP grew 4.3 per cent against a 4.5-5 per cent target, with domestic demand deteriorating. The economists said combining expansionary fiscal policy with structural consumption reforms would move the economy \"closer to internal balance\".", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/China%20needs%20a%20stronger%20yuan%20and%20'fiscal%20boost'%20to%20drive%20near-term%20growth%20Goldman%20Sachs.pdf"}, {"id": "scmp-05", "title": "China vs Japan: the battle for the global microphone to reshape post-war identity", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Geopolitics", "Defence", "Southeast Asia"], "summary": "The rivalry between Beijing and Tokyo has expanded into a contest to define each other's international identity, analysts say. Amid an escalating diplomatic crisis, China is intensifying rhetoric against Japan's \"new militarism\", invoking World War II history to win regional sympathy, while Japan rejects the label and casts itself as a peace-loving security defender and victim of coercion. Fudan University's Shen Yi urged Beijing to expand historical research and global communications, including AI-based visuals. Japan retained Southeast Asia's most-trusted major power status at 65.6 per cent in the ISEAS-Yusof Ishak survey, versus China's 39.8 per cent. Analysts noted Asean neutrality but warned Japan's nuclear-option debate conflicts with the region's nuclear-weapon-free zone and could fray that stance.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/China%20vs%20Japan%20the%20battle%20for%20the%20global%20microphone%20to%20reshape%20post-war%20identity.pdf"}, {"id": "scmp-06", "title": "China's MLCC supply chain expanding rapidly amid surge in global AI demand", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "China's upstream supply chain for multilayer ceramic capacitors (MLCCs) - components dubbed \"the rice of electronics\" - is racing to expand capacity as AI-driven demand surges. Shandong Sinocera Functional Materials, a major dielectric powder supplier, told investors it is boosting capacity for AI servers, with new lines already operational; first-half 2026 sales rose nearly 17 per cent to 2.5 billion yuan (US$370 million). Jiangsu Boqian pledged 201.5 million yuan for nickel powder expansion, while Zhejiang Jiemei is adding 580 million square metres of release-film output. Goldman Sachs has called this the \"largest and longest\" cycle in MLCC history. Sinocera shares rose 3.4 per cent Thursday; Jiangsu Boqian gained 3.9 per cent and Zhejiang Jiemei 3.7 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/China's%20MLCC%20supply%20chain%20expanding%20rapidly%20amid%20surge%20in%20global%20AI%20demand.pdf"}, {"id": "scmp-07", "title": "Chinese and Russian warships were seen circling Japan. What could it mean?", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "China and Russia are deepening military cooperation, with a joint patrol circling Japan sending a message to Tokyo and Washington, analysts say. Three Chinese vessels and a Russian corvette left Qingdao on July 13 for a 17-day patrol through the western Pacific, Sea of Okhotsk and Sea of Japan; on Sunday and Monday three Chinese ships passed southwest through the Korea Strait, completing a circumnavigation of Japan. It was the first time the two navies transited the Vries Strait in the disputed Kuril Islands together. Japan's defence ministry called it a serious concern and show of force. Analyst Stephen Nagy said Beijing wanted to pressure PM Takaichi over Taiwan remarks and show the pair can move freely through the first island chain.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/Chinese%20and%20Russian%20warships%20were%20seen%20circling%20Japan.%20What%20could%20it%20mean.pdf"}, {"id": "scmp-08", "title": "Chinese fund managers' pursuit of AI plays backfires as hot tech stocks wobble", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "A shift into technology stocks by China's most seasoned value-investing fund managers has backfired as AI plays unwound globally. Star manager Liu Yanchun's Great Wall Invesco fund fell 28 per cent last month after buying optical-transceiver maker Zhongji Innolight and other tech names while cutting consumer and pharmaceutical holdings. Zhang Kun of E Fund saw his flagship drop 1.2 per cent in July after pivoting to AI, adding SMIC and Dongshan Precision while cutting liquor makers Kweichow Moutai and Wuliangye by at least 47 per cent. Shanghai's Star Market 50 slumped 26 per cent in July, its worst month since 2020, and ChiNext fell 23 per cent. In contrast, CSI 300 consumer stocks rose 12 per cent and pharmaceutical shares rebounded 7.9 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/Chinese%20fund%20managers'%20pursuit%20of%20AI%20plays%20backfires%20as%20hot%20tech%20stocks%20wobble.pdf"}, {"id": "scmp-09", "title": "DeepSeek signals 'significant' price hike amid surge in demand for low-cost AI models", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Chinese AI start-up DeepSeek announced on Thursday a \"significant\" price hike for its API services in the near future, urging users to plan accordingly, amid surging demand for its ultra-cheap new model. The move highlights the challenge of sustaining rock-bottom pricing amid fierce competition. Its DeepSeek-V4-Flash-0731, a 284-billion-parameter lightweight model released a week earlier, was rated the second-strongest open-weight model behind Moonshot's Kimi K3, and costs about 3 US cents per task - roughly 105 times cheaper than Anthropic's Claude Fable 5. Epoch AI said its pricing was an \"order of magnitude cheaper\" than Zhipu's GLM-5.2. It became the fastest-growing model ever by token usage on Ollama, aided by an efficient mixture-of-experts design.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/DeepSeek%20signals%20'significant'%20price%20hike%20amid%20surge%20in%20demand%20for%20low-cost%20AI%20models.pdf"}, {"id": "scmp-10", "title": "Gold's price potential still 'explosive' amid Beijing hoarding, Hong Kong trading push", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "Gold has \"explosive\" upside potential, analysts say, boosting Hong Kong's ambitions as a trading hub as Asian central banks stockpile bullion. Deutsche Bank's Michael Hsueh expects US$4,700 an ounce by year-end, while State Street's Aakash Doshi sees US$5,000 by early 2027, underpinned by Chinese buying. Beijing has added reserves for 20 straight months and wants to link the Shanghai Gold Exchange to Hong Kong; South Korea plans its first gold purchase in 13 years. Hong Kong launched a clearing and settlement system on July 7 and targets 2,000-tonne vault capacity within three years; June gold imports hit 150.48 tonnes. Gold peaked near US$5,420 in January, fell over 25 per cent, then steadied above US$4,000, hitting US$4,300 on Thursday.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/Gold's%20price%20potential%20still%20'explosive'%20amid%20Beijing%20hoarding,%20Hong%20Kong%20trading%20push.pdf"}, {"id": "scmp-11", "title": "Has China's missile force got America's Kadena base in Japan in its sights?", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "A CCTV documentary, Securing Victory, aired Monday showed a satellite image resembling the US Kadena airbase in Okinawa as PLA Rocket Force officers discussed exercises and combat scenarios, marking the PLA's 99th anniversary. Officer Luo Tingrong told personnel that what they practise today could happen tomorrow. Kadena, the largest US airbase in East Asia and closest to Taiwan Strait flashpoints, lies about 600km from Taiwan and within range of Chinese DF-16, DF-21 and hypersonic DF-17 missiles. Analyst Tetsuo Kotani said Kadena had been a known Rocket Force target for decades and the timing was about projecting resolve, not revealing new capability. Hirohito Ogi called the image a signal to deter US intervention in a Taiwan contingency.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/Has%20China's%20missile%20force%20got%20America's%20Kadena%20base%20in%20Japan%20in%20its%20sights.pdf"}, {"id": "scmp-12", "title": "Hong Kong aims to be a global tech hub, but can it hold on to its young talent?", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Technology & AI", "Society"], "summary": "Hong Kong's push to become a global innovation hub faces a talent-retention challenge, critics warn, as a risk-averse culture and scarce early-stage support drive young founders overseas. The story contrasts two 18-year-old tech enthusiasts: Rexan Wong, who built AI app Text Behind Image with 500,000 users and is decamping to San Francisco for better incubator support, and Ken Mochizuki, who plans to stay. AI and research transformation feature among priorities in the city's first five-year plan, due later this year. Wong cited a lack of talent density, support and access to frontier tools like Anthropic and OpenAI models, some unavailable locally. Silicon Valley ranks as the world's top start-up ecosystem, well ahead of Hong Kong.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/Hong%20Kong%20aims%20to%20be%20a%20global%20tech%20hub,%20but%20can%20it%20hold%20on%20to%20its%20young%20talent.pdf"}, {"id": "scmp-13", "title": "How US became trapped in 'dreadful situation' of its own making over Iran war", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "The US faces a historic \"strategic defeat\" five months after launching the Iran war at Israel's behest, Middle East observers say. Iran is unlikely to relinquish its grip on the Strait of Hormuz - its greatest economic leverage - and is prepared to absorb military punishment while its Axis of Resistance allies escalate attacks on energy infrastructure across the Red Sea, Suez and eastern Mediterranean. Gulf State Analytics' Giorgio Cafiero said Washington is in a difficult predicament of its own making, choosing between an unwinnable war or a costly settlement. Arab Gulf States Institute's Hussein Ibish said Trump had manoeuvred into a \"dreadful situation\" pointing to two bad outcomes: acquiescing to Iranian power or waging a years-long air war.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/How%20US%20became%20trapped%20in%20'dreadful%20situation'%20of%20its%20own%20making%20over%20Iran%20war.pdf"}, {"id": "scmp-14", "title": "Iran seeks to bar US ships as Hormuz deal with Oman advances", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Geopolitics", "Energy", "Defence"], "summary": "Iran will seek to bar US and Israeli ships from the Strait of Hormuz and demand compensation from hostile countries under a proposed Iran-Oman deal to manage the waterway, local media reported. The text, now under Iranian parliamentary review, also proposes banning Israel-related cargo and a fee structure covering insurance and environmental costs. The agreement is central to hopes of reopening Hormuz and resuming energy flows throttled since the US and Israel attacked Iran in February. Former US official Thomas Warrick said the terms would not sit well in Washington. Iran also said naval forces struck \"hostile targets\" near the strait's entrance; Brent crude rose above US$82. Trump said negotiations were going \"fine\" but declined to confirm a deal.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/Iran%20seeks%20to%20bar%20US%20ships%20as%20Hormuz%20deal%20with%20Oman%20advances.pdf"}, {"id": "scmp-15", "title": "Japan's Takaichi stops short of clear pledge to maintain non-nuclear principles", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Politics", "Defence"], "summary": "Japanese Prime Minister Sanae Takaichi on Thursday stopped short of explicitly pledging to maintain the country's three non-nuclear principles, saying only that the government \"is upholding\" the policy, as Japan marked the 81st anniversary of the Hiroshima bombing. The hawkish leader, attending as premier for the first time, said it was \"premature\" to comment while her government revises key national security documents by year-end, reportedly reconsidering the principles of not possessing, producing or allowing nuclear weapons. Opposition leaders criticised her lack of firm commitment. Atomic-bomb survivors, whom she met earlier, condemned talk of a US nuclear-sharing arrangement and urged Japan to join the nuclear weapons prohibition treaty, which Tokyo has not signed given its reliance on US deterrence.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/Japan's%20Takaichi%20stops%20short%20of%20clear%20pledge%20to%20maintain%20non-nuclear%20principles.pdf"}, {"id": "scmp-16", "title": "North Korea fires 'unidentified projectile': South Korea", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "North Korea fired a short-range ballistic missile over the Sea of Japan on Thursday from the Wonsan area around 5pm, South Korea's Joint Chiefs of Staff said, a day after Pyongyang lambasted Japan's military build-up. Kim Yo-jong, sister of leader Kim Jong-un, warned Pyongyang would set up \"additional military options\" in response to Japan's transformation, after Defence Minister Shinjiro Koizumi urged boosting Japan's military. Seoul strengthened surveillance and shared information with the US and Japan; annual Ulchi Freedom Shield drills are due later this month. Analysts said the launch may have tested weapons before Kim's expected Russia visit. Tokyo raised 2025 military spending 9.7 per cent to US$62.2 billion, its highest GDP share since 1958.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/North%20Korea%20fires%20'unidentified%20projectile'%20South%20Korea.pdf"}, {"id": "scmp-17", "title": "Swire earnings show Hong Kong's prime commercial districts outpacing others in recovery", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Finance & Markets"], "summary": "Swire Properties' first-half results underscored a widening divide in Hong Kong's office recovery, with prime districts outpacing others. Pacific Place beside Central was 98 per cent occupied with positive spot rents as financial firms upgraded, while Taikoo Place in Quarry Bay saw competitive leasing amid new supply; Two Taikoo Place was 80 per cent leased. CEO Tim Blackburn cited a \"flight-to-quality\" trend. Swire's underlying profit rose 11 per cent to HK$4.9 billion (US$624.7 million) and revenue climbed 8 per cent to HK$9.41 billion, aided by luxury house sales. Central landlord Hongkong Land posted an 11 per cent underlying profit rise, while Wharf REIC, exposed to weaker districts, reported a net loss after a HK$3.55 billion property valuation deficit.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/Swire%20earnings%20show%20Hong%20Kong's%20prime%20commercial%20districts%20outpacing%20others%20in%20recovery.pdf"}, {"id": "scmp-18", "title": "US efforts to prop up the yen risk doing more harm than good", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "US efforts to support the yen risk backfiring, as reversing the currency's decline ultimately depends on Japan lifting real interest rates out of negative territory without triggering panic. The yen has fallen 36 per cent against the dollar since early 2022, hitting a post-1986 low past 163 on July 23. On July 31, Japan's finance ministry and the US Treasury jointly intervened - the first coordinated action since 1998 - strengthening the yen to 157. Notably the Treasury sold euros rather than dollars, reflecting wariness about pressuring the greenback. Treasury Secretary Scott Bessent wants Japan to use a Fed repo facility to avoid selling Treasuries. Analysts warn PM Takaichi's reflationary agenda clashes with the Bank of Japan's credibility, leaving intervention \"doomed to failure\".", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/US%20efforts%20to%20prop%20up%20the%20yen%20risk%20doing%20more%20harm%20than%20good.pdf"}, {"id": "scmp-19", "title": "Unrelenting AI demand spawns new plant for Chinese PCB maker Victory Giant", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Chinese printed circuit board maker Victory Giant Technology will invest at least 3 billion yuan (US$444 million) in a new Huizhou plant for \"AI high-end electronic circuit smart manufacturing\", underscoring booming demand across China's AI hardware sector. The Nvidia supplier, which listed in Hong Kong in April, acquired a 100,000-square-metre plot and is negotiating orders with major US firms as GPU and ASIC demand surges; its supply for Nvidia's next-generation Kyber rack is \"progressing smoothly\". Net profit soared 273.5 per cent in 2025. It entered Nvidia's Hopper supply chain in 2023 and became a tier-one supplier in 2024. Nomura expects Rubin GPU shipments to ramp in the second half. Shares rose 4.4 per cent to HK$231 on Thursday.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/Unrelenting%20AI%20demand%20spawns%20new%20plant%20for%20Chinese%20PCB%20maker%20Victory%20Giant.pdf"}, {"id": "scmp-20", "title": "Why Russia's ballistic missiles are breaking through in Ukraine", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Russia's ballistic missiles are increasingly breaking through Ukraine's air defences because interceptors are scarce, warning times are seconds, and only the US-made Patriot system can stop them, experts say. Unlike cruise missiles, ballistic weapons like the Iskander-M dive steeply at several times the speed of sound, leaving little time to intercept. A recent barrage on Kyiv targeting a brewery, warehouse and mail-sorting office killed at least 17. Ukraine has too few Patriot batteries to shield every city, and Russia mixes ballistic missiles with cruise missiles, drones and decoys. The interceptor shortage worsened as the US-Israeli war with Iran consumed Patriot and THAAD stocks; AP estimated US Patriot inventory fell at least 65 per cent. Lockheed Martin is working towards 2,000 annual interceptors.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/Why%20Russia's%20ballistic%20missiles%20are%20breaking%20through%20in%20Ukraine.pdf"}, {"id": "scmp-21", "title": "Will latest trade 'speed bump' slow China-US ties, or even stop Xi-Trump summit?", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Trade", "Geopolitics"], "summary": "Beijing and Washington's latest tit-for-tat measures are little more than a \"speed bump\" toward a potential Xi-Trump summit, analysts say. China's commerce ministry sanctioned seven US entities, tightened drone export controls and launched a security probe into imported printing equipment on Wednesday, retaliating for Washington adding 43 Chinese firms to its Uygur Forced Labour Prevention Act list and banning foreign robotic devices and power inverters. Eurasia Group's Dominic Chiu said the moves were \"calibrated to impose costs without breaking the truce\" and would not derail Xi's planned September 24 White House visit. Analysts said the summit is at risk only if Washington takes aggressive steps like restricting Chinese AI models or cloud-chip access, or acts on Taiwan.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/Will%20latest%20trade%20'speed%20bump'%20slow%20China-US%20ties,%20or%20even%20stop%20Xi-Trump%20summit.pdf"}]}, "2026-08-11": {"date": "2026-08-11", "dayOfWeek": "Tuesday", "totalArticles": 89, "sourceCounts": {"WSJ": 21, "ST": 22, "BT": 19, "SCMP": 27}, "executiveDigest": "Gulf states accepted 'a new normal' in the Strait of Hormuz - Iran is in control - as the Oman deal collapsed, both sides demanded compensation and Trump pivoted to an economic blockade, pushing oil up 5% and gold to nearly US$4,400. Singapore stood out on the upside: it raised its 2026 growth forecast to 4.5-5.5% after Q2 GDP was revised up to 5.9% and non-oil exports jumped 27.4%. The AI build-out went megascale - Nvidia partnered Wall Street to raise US$640 billion for infrastructure and Anthropic teamed with Macquarie and GIC - even as research flagged the AI-memory price boom may be near its peak.", "briefingCards": [{"title": "Lead story - Iran cements control of Hormuz", "body": "The strait's diplomacy failed and a hard reality set in: WSJ reported 'Gulf states accept a new normal in Hormuz - Iran is in control', and cast the waterway as Tehran's 'final point of leverage'. With the Oman deal gone, SCMP said Trump 'demands Iran pay compensation as hopes fade', BT reported both sides now demand compensation as 'Hormuz hopes fade', and WSJ described Trump shifting 'to economic pressure, again' via a blockade after Iran refused his demands. Markets felt it: oil climbed 5% and Asian stocks rose 'amid Gulf confusion', while an Oman tanker spill spread across 400 sq km, Libya's NOC warned of force majeure, and Trump reportedly 'flew secretly from Turkey due to an Iranian threat'."}, {"title": "Markets & finance", "body": "Inflation and rates framed the week: WSJ said 'two inflation reports will shape the Fed's September decision', gold touched US$4,400 as traders eyed the data, and the US dollar steadied after a weak payrolls print while the yen fell - prompting WSJ to ask 'will the yen need another intervention soon?'. The BOJ flagged upside price risks and possibly faster hikes, and Trump 'downplayed talks with Warsh' amid Fed-independence doubts. Capital-raising was frenetic: Nvidia partnered Wall Street giants to raise US$640 billion for AI infrastructure, Intel offered US$15 billion of stock, Anthropic moved to shore up confidence before a blockbuster IPO, and LSE's deputy CEO said London 'needs capital to revive' its public markets."}, {"title": "Asia realignment", "body": "The US recalibrated its Asia posture - the Pentagon said it is 'digging in' but wants 'partners, not dependency' - as ASEAN aimed to become the world's fourth-largest economy by 2030 and BT argued 'ASEAN matters more than ever to the UK and Singapore'. Trade friction festered: China moved to join Brazil's WTO fight over Trump's forced-labour tariffs, hit US and Mexican pecans with anti-dumping curbs, and a 'wave of US tariff refunds' flowed back to Chinese firms. Security signals sharpened around Taiwan (a drone 'hellscape', a first-ever mobile-network throttling drill, and WSJ's 'will Taiwan fight China?'), while the UK found a component in its naval drones had 'sent signals to China'."}, {"title": "Energy & climate", "body": "Oil jumped 5% as the Hormuz standoff hardened and both sides demanded compensation; the UAE's Adnoc Gas unveiled an US$8 billion expansion, US natural-gas futures rebounded on warmer weather, and an Oman tanker spill spread across 400 sq km. Longer-term supply plays advanced: 'the race for critical minerals is clearing the path for deep-sea mining', the US pledged US$2 billion for battery and materials producers, and SCMP noted China 'is building nuclear reactors faster than the West'. Climate strain persisted - Europe's fifth heatwave threatened rivers, power and crops - and the UK put up nearly £130 million for zero-emission vehicle tech."}, {"title": "Technology & AI", "body": "The build-out went megascale - Nvidia partnered Wall Street to raise US$640 billion for AI infrastructure, and Anthropic formed an AI-data-centre venture with Macquarie and GIC - even as SCMP research warned 'the AI-memory price boom may not last much longer' and enterprise AI costs hit a 2026 low on Chinese open-source price wars. Meta pushed open weights: Zuckerberg's 'AI manifesto', a new model, and a scaled-down version to run at home, though it lost a bid to pause a landmark state-AGs trial and a US court cleared social-media addiction suits. Chipmakers moved too: Intel raised US$15 billion, Microsoft plans a next-gen AI chip in September, and Sony and TSMC will invest US$6.4 billion in a Japanese sensor plant."}, {"title": "Singapore & SEA focus", "body": "Singapore delivered the day's standout upgrade: it raised its 2026 growth forecast to 4.5-5.5% after Q2 GDP was revised up to 5.9%, and lifted its key export forecast following an AI-powered 27.4% non-oil export jump in Q2. The AI-capital theme ran local - GIC joined Anthropic and Macquarie on an AI-data-centre venture, though BT noted the city's sovereign funds are 'betting big on AI' even as the central bank stays cautious, and Seatrium gave its AI projects three months to prove out to avoid 'a graveyard of pilots'. Elsewhere, Orchard Road's corporate appeal is rising, BYD's disruption of the local car market is 'turning on itself', and Indonesia's Prabowo tapped Destry Damayanti to steady Bank Indonesia."}], "keyMetrics": [{"value": "89", "label": "Articles curated today", "sub": "WSJ 21 · ST 22 · BT 19 · SCMP 27"}, {"value": "Iran in control", "label": "Hormuz 'new normal'", "sub": "Deal fails; Trump blockades"}, {"value": "+5% / US$4,400", "label": "Oil jumps, gold near record", "sub": "Compensation standoff"}, {"value": "4.5-5.5%", "label": "SG 2026 growth upgrade", "sub": "Q2 revised to 5.9%; NODX +27.4%"}, {"value": "US$640b", "label": "Nvidia + Wall Street AI raise", "sub": "Anthropic, Macquarie, GIC venture"}, {"value": "2026 low", "label": "Enterprise AI costs", "sub": "Memory price boom may be peaking"}], "articles": [{"id": "wsj-01", "title": "A Pause on the Gaza Peace Plan?", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "WSJ Opinion's \"Potomac Watch\" podcast discusses Netanyahu's rejection of the next steps in Trump's Gaza plan. Elliot Kaufman notes that 10 months after the October 2025 deal, no Hamas weapon has been surrendered, and the new Board of Peace roadmap would decommission arms into storage rather than demilitarize Gaza. Israel wasn't formally a party to the unsigned mediator-Hamas agreement, yet has halted strikes for seven days. The panel also covers Iran's insistence on Hormuz tolls and Putin's testing of NATO: an explosives-laden drone found near a Ukrainian cargo plane at a German airport, 144 suspicious European drone incidents, and Ukraine's urgent need for Patriot air defenses.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/A%20Pause%20on%20the%20Gaza%20Peace%20Plan.pdf"}, {"id": "wsj-02", "title": "Anthropic Tries to Shore Up Investor Confidence Ahead of Blockbuster IPO", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Anthropic is meeting potential investors to shore up confidence before what could be the largest IPO ever, valuing the AI firm at $965 billion. Investors pressed executives on cheaper Chinese AI systems, tensions with the Trump administration, and data-center backlash. Executives played down Chinese competition, saying Anthropic stays hyperfocused on cutting-edge models; CEO Dario Amodei argues rivals' capabilities trail by months. Propelled by its Claude Code tool, Anthropic reported run-rate revenue topping $47 billion in May and has struck computing deals with SpaceX and Google. It targets a September or early-October debut, ahead of rival OpenAI, and told some investors it will push into healthcare and biology AI. SpaceX earlier surpassed $2 trillion after its IPO.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/Anthropic%20Tries%20to%20Shore%20Up%20Investor%20Confidence%20Ahead%20of%20Blockbuster%20IPO.pdf"}, {"id": "wsj-03", "title": "Barrick Mining Settles Newmont Nevada Dispute for $1.95 Billion", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Finance & Markets", "Energy"], "summary": "Barrick Mining settled a long-running dispute with rival Newmont over their Nevada Gold Mines joint venture, securing a $1.95 billion cash payout. The deal resolves governance disputes dating to the 2019 JV, formed after Barrick dropped an $18 billion hostile bid for Newmont, and clears the way for Barrick to IPO its North American gold assets, holding nearly 100 million ounces. The planned listing, anchored by Nevada Gold Mines plus Pueblo Viejo and the Fourmile discovery, would primary-list in New York with a Toronto secondary. Barrick shares fell in premarket trading to $40.85. Second-quarter revenue rose to $5.29 billion and net income to $1.22 billion, or 73 cents a share, on soaring gold and copper prices.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/Barrick%20Mining%20Settles%20Newmont%20Nevada%20Dispute%20for%201.95%20Billion.pdf"}, {"id": "wsj-04", "title": "Data-Center Backlash Leads to New Land Rush in Texas Oil Patch", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Technology & AI", "Energy"], "summary": "Permian Basin landowners including Texas Pacific Land, LandBridge and EagleRock are pivoting from oil-and-gas royalties to leasing land, water and materials to data centers. They are betting AI developers facing community pushback elsewhere will favor the Permian's abundant land, cheap energy and light regulation. The three firms sit on 1.4 million acres. Chevron signed a 20-year deal to power a Microsoft data center; Poolside and CoreWeave plan a West Texas complex. Texas Pacific invested $50 million in Eric Schmidt-cofounded Bolt and sold land to Chevron for $43 million. LandBridge is working to host campuses, saying a 1-gigawatt site could yield tens of millions in annual free cash flow. Their stocks trade at roughly 37 to 39 times projected earnings.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/Data-Center%20Backlash%20Leads%20to%20New%20Land%20Rush%20in%20Texas%20Oil%20Patch.pdf"}, {"id": "wsj-05", "title": "Five Things to Know About Zuckerberg's AI Manifesto", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Technology & AI", "Society"], "summary": "Meta CEO Mark Zuckerberg issued a 6,500-word essay on the AI race and how Washington should regulate it. Five takeaways: Meta will resume releasing open-weight models and defend distillation, arguing \"you can learn from anything you can observe.\" It will launch a $1 billion \"Future Is For Everyone Fund\" for data-center communities, citing $50,000 teacher bonuses near its Hyperion campus in Richland Parish, Louisiana. Zuckerberg pushes back on the Trump administration's voluntary 30-day model-review order, urging proactive collaboration and sharing of intermediate training checkpoints. He is adopting a board-level safety governance structure and calls for an industrywide version. He also backs \"personal superintelligence,\" where users set the system's values, plus a fully private agent mode.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/Five%20Things%20to%20Know%20About%20Zuckerberg's%20AI%20Manifesto.pdf"}, {"id": "wsj-06", "title": "Gulf States Accept a New Normal in Hormuz: Iran Is in Control", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "Persian Gulf energy producers are concluding Iran's control over the Strait of Hormuz may become permanent, but fear returning to war is worse. Gulf states dislike a proposed deal formalizing Iranian oversight of inbound ships, yet see it as preferable to more U.S.-Iran fighting. Crude exports through Hormuz fell to about 2.2 million barrels a day, down from 8.5 million a month earlier, per Kpler. The U.A.E. said four ships were hit last week; Adnoc reported 16 vessels struck since the war began. Between Feb. 28 and July 30, Iran and allied militias conducted at least 172 attacks on Gulf infrastructure. Brent traded near $87. One analyst said the Gulf \"can no longer rely upon it for transport or trade.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/Gulf%20States%20Accept%20a%20New%20Normal%20in%20Hormuz%20Iran%20Is%20in%20Control.pdf"}, {"id": "wsj-07", "title": "Inside Europe's Shift to Draft Women for War", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Defence", "Society"], "summary": "A WSJ video report examines how the Danish military, spurred by the war in Ukraine and growing security pressures in the Arctic, has extended conscription to 11 months from four. Denmark also recently expanded mandatory conscription to include women for the first time, part of a broader European rethink of national defense as the continent confronts a more aggressive Russia. NATO allies are seeking inspiration from Denmark's gender-equal program as they weigh how to expand their own forces. WSJ journalists joined Danish recruits during training to document the demands of the lengthened service and the integration of women into compulsory military duty, illustrating how the region is reshaping who is called to fight.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/Inside%20Europe's%20Shift%20to%20Draft%20Women%20for%20War.pdf"}, {"id": "wsj-09", "title": "Israel Rejects Next Phase of Trump's Gaza Peace Plan", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "Israeli Prime Minister Benjamin Netanyahu rejected the next phase of Trump's Gaza peace plan, a rare public break with the U.S. leader who weeks earlier hailed \"a historic agreement\" to disarm Hamas. The 15-point document pairs Hamas disarmament with phased Israeli withdrawal, an international stabilization force, and a Palestinian technocratic committee. Netanyahu said the IDF won't withdraw until Hamas surrenders all weapons. The move risks angering Trump amid the Iran war and could rob him of a signature achievement. Netanyahu faces fall elections and hard-right coalition objections. Board of Peace representative Nickolay Mladenov urged Israel to give the process a chance. Israel hasn't struck Gaza in six days; over 1,200 Palestinians have died since the October 2025 ceasefire.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/Israel%20Rejects%20Next%20Phase%20of%20Trump's%20Gaza%20Peace%20Plan.pdf"}, {"id": "wsj-10", "title": "London Needs Capital to Revive its Struggling Public Markets, LSE's Deputy CEO Says", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Finance & Markets"], "summary": "LSE deputy chief executive Charlie Walker said better access to capital is key to reviving London's struggling public markets, calling capital \"the petrol\" the \"mechanically sound car\" now needs. Major U.K. companies including Arm, Flutter and Wise have shifted primary listings to New York; AstraZeneca is reportedly weighing a U.S. merger. Only seven companies listed in London this year versus 15 delistings. The LSE and regulators have eased rules, cut costs and introduced 24-hour trading for exchange-traded products. Walker said regulation rarely deters companies now; the deeper problem is shallow liquidity, requiring a cultural shift such as tax cuts on U.K. stock gains or channeling personal savings into domestic equities. He warned the consequences of failure are \"existential.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/London%20Needs%20Capital%20to%20Revive%20its%20Struggling%20Public%20Markets,%20LSE's%20Deputy%20CEO%20Says.pdf"}, {"id": "wsj-11", "title": "South Korea's Hanwha Makes $1 Billion Push Into U.S. Naval Shipbuilding", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Defence", "Trade"], "summary": "South Korean conglomerate Hanwha made a nonbinding offer of more than $1 billion, valued between $1.05 billion and $1.2 billion, to buy Austal USA, a builder of ships and submarine parts for the U.S. Navy. The deal would give Hanwha Austal's Mobile, Alabama shipyard and access to sensitive naval programs, including submarine modules supplied to General Dynamics Electric Boat for Virginia- and Columbia-class boats. Austal USA employs about 3,500 workers plus San Diego repair facilities. Hanwha is expanding U.S. shipbuilding as Trump seeks to revitalize the domestic industry; it bought Philly Shipyard under two years ago and pledged billions to modernize it. Hanwha Defense USA is also planning an Arkansas munitions and propellant factory.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/South%20Korea's%20Hanwha%20Makes%201%20Billion%20Push%20Into%20U.S.%20Naval%20Shipbuilding.pdf"}, {"id": "wsj-12", "title": "Iran Uses the Strait of Hormuz as Its Final Point of Leverage", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Geopolitics", "Energy", "Politics"], "summary": "The WSJ Politics newsletter, by Damian Paletta, argues Iran is using the Strait of Hormuz as its final point of leverage after five months of U.S. and Israeli strikes destroyed much of its military and killed top leaders. Treasury Secretary Scott Bessent said Tuesday a deal to reopen the strait could be announced; none came. On Saturday, Iranian security official Mohammad Bagher Zolghadr set conditions: permanently ending the war, lifting the naval blockade, withdrawing forces, ending sanctions, freeing frozen assets and paying reparations. Former Defense Secretary Mark Esper said Iran believes it holds \"the upper hand.\" Trump must decide whether to relaunch strikes, wait, or negotiate. The letter also flags GOP economic worries and Netanyahu's Gaza break.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/WSJ%20Politics%20Newsletter%20-%20Iran%20uses%20Hormuz%20as%20leverage.pdf"}, {"id": "wsj-13", "title": "Trump Shifts to Economic Pressure, Again, As Iran Won't Meet His Demands", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Geopolitics", "Politics", "Energy"], "summary": "Trump has settled on economic pressure over renewed war or diplomacy in the Iran conflict, U.S. officials said, giving sanctions and a naval blockade of Iranian ports more time. Aides showed him data on sanctions' damage; officials say Tehran fears Treasury Secretary Bessent more than Defense Secretary Hegseth. \"Iran is broke, totally broke,\" Trump said. Iran demanded reparations to reopen Hormuz; Trump countered Iran should compensate the U.S. Bessent said Hormuz would become \"irrelevant\" within two years as energy shifts to pipelines. Analysts warn Iran will retaliate and has a higher pain tolerance. Republicans fear the war will hurt them in the midterms. Vice President Vance said the U.S. is \"in the middle of the game.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/Trump%20Shifts%20to%20Economic%20Pressure,%20Again,%20As%20Iran%20Won't%20Meet%20His%20Demands.pdf"}, {"id": "wsj-14", "title": "Trump's Blockade Keeps the Economic Pressure on Iran", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "A WSJ editorial argues Trump's naval blockade and sanctions keep the economic upper hand over Iran, if he has the patience to sustain them. Iranian Foreign Minister Abbas Araghchi says a Hormuz deal with Oman is in its \"final stages\" but demands U.S. reparations, an end to the blockade, release of frozen assets and lifting of sanctions before traffic resumes. Iran launched at least 22 strikes in two weeks, yet oil holds near $80, aided by 8 million barrels a day sneaked out of the strait. The blockade is estimated to cost Iran's regime $435 million a day. Rather than a deal ceding the strait, the editorial favors sustained pressure despite the risk Iran strikes regional energy sites.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/Trump's%20Blockade%20Keeps%20the%20Economic%20Pressure%20on%20Iran.pdf"}, {"id": "wsj-15", "title": "Two Inflation Reports Will Shape the Fed's September Rate Decision", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Finance & Markets"], "summary": "Two inflation reports over the coming month will shape whether Federal Reserve officials push to raise rates in September or extend their pause, writes Nick Timiraos. New Fed Chairman Kevin Warsh wants decisions less tied to monthly data, but Wednesday's July CPI and the preferred gauge later this month carry outsize weight. Tariff, energy and AI-equipment price shocks have persisted, testing officials who forecast inflation would ease without tighter policy. Warsh, who made lowering inflation his signature theme, unsettled investors last month by not clearly explaining a rate hold; the 30-year Treasury yield rose. At least six voters signaled openness to raising rates and three dissented in July. Firm readings could force action or a fourth dissent, possibly addressed at Jackson Hole.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/Two%20inflation%20reports%20to%20shape%20Fed%20September%20rate%20decision.pdf"}, {"id": "wsj-16", "title": "U.A.E.'s Adnoc Gas to Invest More Than $8 Billion in Expansion Push", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Energy", "Finance & Markets"], "summary": "The U.A.E.'s Adnoc Gas said it will invest more than $8 billion to expand production capacity, months after the country left OPEC, freeing Abu Dhabi from quota limits. Already a top global gas producer, it is betting on rising demand from population growth and power-hungry data centers. Plans include a new processing unit at Habshan and an export facility at Ruwais under the Rich Gas Development project, whose combined spend reaches $13.2 billion, the company's largest. Adnoc Gas raised its 2030 earnings target above $12 billion. Second-quarter net income fell to $665 million from $1.39 billion as Hormuz shipping dwindled during the Iran war. Finance chief Peter Van Driel called the OPEC exit \"really good news.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/U.A.E.'s%20Adnoc%20Gas%20to%20Invest%20More%20Than%208%20Billion%20in%20Expansion%20Push.pdf"}, {"id": "wsj-17", "title": "U.K. Discovers Component in Its Naval Drones Sent Signals to China", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Defence", "Technology & AI", "Geopolitics"], "summary": "Cameras on British naval drones sent data to an internet address in China, U.K. officials said, highlighting military supply-chain vulnerability to Chinese parts. Britain's Ministry of Defense said the signal broadcast no sensitive information and a probe found no evidence MOD data was accessed. The component was in a K3 Scout drone boat made by Kraken Technology, which said the vulnerability has been closed; Kraken recently won a $49 million U.S. Special Operations contract. China dominates drone production and key components like motors, antennas, cameras and batteries, and has restricted critical-mineral exports. Naval drones are growing in warfare: the U.S. used them in combat against an Iranian port last month. A German maker noted Chinese engines cost far less.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/U.K.%20Discovers%20Component%20in%20Its%20Naval%20Drones%20Sent%20Signals%20to%20China.pdf"}, {"id": "wsj-18", "title": "U.S. Employment Trends Index Increased in July, Conference Board Says", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Finance & Markets"], "summary": "The Conference Board's Employment Trends Index rose to 107.71 in July from an upwardly revised 106.74 in June, suggesting continued labor-market resilience and potential payroll growth ahead. Economist Conrad Qi said the ETI \"rebounded in July\" despite a \"low-hire, low-fire\" backdrop. Positive contributions came from small firms reporting jobs they can't fill and from initial jobless claims, which fell to their lowest since September 2022, indicating limited layoffs. The share of consumers saying jobs are hard to get also declined. The index remains above its year-ago level, pointing to modest payroll growth in coming months. The largest negative contributor was the rising share of involuntary part-time workers.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/U.S.%20Employment%20Trends%20Index%20Increased%20in%20July,%20Conference%20Board%20Says.pdf"}, {"id": "wsj-19", "title": "U.S. Natural Gas Futures Rebound As Near-Term Weather Warms", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Energy", "Finance & Markets"], "summary": "U.S. natural gas futures rebounded as near-term forecasts turned hotter, boosting power-sector demand, while rising LNG feedgas and continued Middle East conflict fed global supply concerns. Gelber & Associates cited elevated cooling demand and export flows nearly matching supply despite strong production; Nymex gas settled at $2.794/mmBtu. NatGasWeather.com said 12-15 day forecasts favor hotter-than-normal temperatures across the northern U.S., and the next two EIA reports may show smaller storage builds. European TTF gas climbed about 5% on Hormuz shipping worries, with ANZ noting Europe is behind on refilling storage before winter and shippers need sustained calm before transiting the strait. The Dutch benchmark traded near 58.80 euros a megawatt-hour.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/U.S.%20Natural%20Gas%20Futures%20Rebound%20As%20Near-Term%20Weather%20Warms.pdf"}, {"id": "wsj-20", "title": "U.S. Pledges $2 Billion for Battery, Materials Producers", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Technology & AI", "Trade", "Energy"], "summary": "The Trump administration agreed to provide more than $2 billion for companies producing batteries and critical minerals, part of a push to reduce U.S. reliance on Chinese suppliers. At a roundtable with mining executives, Trump said the Defense Department will lend battery firm Sila Nanotechnologies $1.4 billion and signed deals with three other companies. More powerful batteries are needed for drones and AI data centers, making domestic production a Pentagon priority; the department has an office funneling tens of billions in loans. The column also notes shipping surcharges from low water on the Amazon, Rhine and Danube, Puerto Rico water rationing, U.S. manufacturing adding 5,000 July jobs, and cooling Chinese consumer and factory prices.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/U.S.%20Pledges%202%20Billion%20for%20Battery,%20Materials%20Producers.pdf"}, {"id": "wsj-21", "title": "War Is Helping Chinese EVs Upend the Global Car Market", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Trade", "Energy", "Southeast Asia"], "summary": "The Iran war is helping China's electric-vehicle makers export their way out of a domestic glut, as high gasoline prices push overseas drivers toward EVs. China's EV exports rose 120% in the first half of 2026; sales roughly doubled in Brazil, Australia, Korea and Vietnam and quadrupled in Colombia. The IEA now expects EVs at 29% of global new-car sales in 2026. Chinese brands hold 60% of emerging-market EV sales, and five accounted for 12.1% of EU and U.K. registrations in June. Southeast Asian governments are promoting EVs for energy security; Thailand cut EV excise taxes and Laos banned gasoline-car imports. Chinese makers lifted their regional share to 11% as Japanese brands slipped to 57%.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/War%20Is%20Helping%20Chinese%20EVs%20Upend%20the%20Global%20Car%20Market.pdf"}, {"id": "wsj-22", "title": "Will Taiwan Fight China? Just Ask Its People", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Geopolitics", "Society"], "summary": "The WSJ interviewed Taiwanese citizens about whether they would resist China's push to conquer the island of 23 million. Cony Hsieh, 33, a trained reservist, is ready to fight and fears a 2028 election win by the Beijing-friendly Kuomintang. Dov Lin, 54, who lived through KMT martial law and the White Terror, would \"fight tooth and nail\" while favoring the status quo. Artist Hsu Mei-chih, 27, identifies as Taiwanese, saying \"I can't call myself Chinese.\" Engineer Ben Chen, 63, proposes a \"Chinese Commonwealth\" and argues war isn't an option against a superpower. Eric Li, 25, says peers would \"hide, hide, hide\" and backs symbolic concessions like competing as \"Chinese Taipei.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/Will%20Taiwan%20Fight%20China%20Just%20Ask%20Its%20People.pdf"}, {"id": "st-01", "title": "'Unacceptable': Austria breaks up sanctions-evasion scheme supplying Russian arms industry", "source": "ST", "date": "11 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Austria's interior ministry said on Aug 10 it broke up a scheme in which a Vienna-based company supplied metalworking tools and CNC machines used to make engines for Russian missiles and fighter jets, breaching EU sanctions. The firm falsified end-user certificates and concealed shipments through shell companies in Turkey, the UAE, Hong Kong, Belarus, Kyrgyzstan, South Korea, Poland and Lithuania. Its 28-year-old Belarusian head was arrested in May, with authorities seizing CNC machines and tools worth about 140,000 euros. Junior intelligence minister Joerg Leichtfried called it \"unacceptable\" for European technology to be diverted to cruise missiles. Equipment went to firms affiliated with Rostec; goods worth over 3.3 million euros were delivered since 2022.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/'Unacceptable'%20Austria%20breaks%20up%20sanctions-evasion%20scheme%20supplying%20Russian%20arms%20industry.pdf"}, {"id": "st-02", "title": "Asean working to be world's fourth-largest economy by 2030, says Malaysian foreign minister", "source": "ST", "date": "11 Aug 2026", "tags": ["Southeast Asia", "Trade"], "summary": "Asean aims to become the world's fourth-largest economy by 2030, but intra-bloc trade remains under 25 per cent, Malaysian Foreign Minister Mohamad Hasan said at the 59th Asean Day in Wisma Putra on Aug 10. He urged stronger trade ties, noting members already have mechanisms such as free movement of goods to boost commerce. Mohamad said Malaysia advanced many resolutions while chairing Asean last year, with the Philippines now continuing the Kuala Lumpur Declaration agenda. He recalled Asean's founding to make South-east Asia peaceful, noted Timor-Leste's recent accession as youngest member, and said the bloc, now 59 years old, is increasingly focused on building a strong collective economy under Vision 2045.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Asean%20working%20to%20be%20world's%20fourth-largest%20economy%20by%202030,%20says%20Malaysian%20foreign%20minister.pdf"}, {"id": "st-03", "title": "Asia stocks edge higher, oil up amid Gulf confusion", "source": "ST", "date": "11 Aug 2026", "tags": ["Finance & Markets", "Energy"], "summary": "Asian shares tracked Wall Street higher on Aug 10 after a soft US jobs report eased near-term rate-hike risk, while stalled Gulf peace talks lifted oil. Iran said an Oman deal defining new Strait of Hormuz shipping lanes was near, but the waterway would reopen only once US conditions were met. Brent rose 0.9 per cent to US$84.32 and US crude gained 0.7 per cent to US$78.74 amid trickling traffic. Markets await the July US CPI report on Aug 12; futures now price a 44 per cent chance of a September Fed move, down from 67 per cent. Japan's Nikkei rose 0.6 per cent, South Korea 0.5 per cent. S&P 500 earnings per share were up 30 per cent, led by AI names.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Asia%20stocks%20edge%20higher,%20oil%20up%20amid%20Gulf%20confusion.pdf"}, {"id": "st-04", "title": "Australia tightens curbs on two Northern Minerals shareholders ordered to divest", "source": "ST", "date": "11 Aug 2026", "tags": ["Geopolitics", "Trade"], "summary": "Australia has tightened restrictions on two Northern Minerals shareholders ordered to divest over national security concerns, the miner said on Aug 10, extending scrutiny of Chinese-linked investment in the rare earths developer. Northern Minerals is building the Browns Range heavy rare earths project in Western Australia as Western governments seek to cut reliance on China for minerals used in semiconductors and defence. In May, Treasurer Jim Chalmers ordered six offshore shareholders to divest. Amended interim directions now bar Real International Resources and Qogir Trading & Service from selling shares unless the Treasurer confirms the buyer is not an associated party. The six were told to shed a combined 1.68 billion shares by July 2. Shares rose 3.9 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Australia%20tightens%20curbs%20on%20two%20Northern%20Minerals%20shareholders%20ordered%20to%20divest.pdf"}, {"id": "st-05", "title": "Europe's fifth heatwave risks straining rivers, power and crops", "source": "ST", "date": "11 Aug 2026", "tags": ["Environment", "Energy"], "summary": "Another wave of intense heat is set to sweep an already parched Europe this week, raising wildfire risk and threatening crops and rivers. A high-pressure heat dome may push northern France near 40 deg C on Aug 11, with 38 deg C possible in Frankfurt on Aug 14. Europe's fifth major heatwave of the year is likely to keep record-low rivers such as the Rhine, Po and Danube from refilling, disrupting navigation and power. Rhine levels at Kaub, the lowest since 1880, hit 16cm and could fall to 4cm by Aug 14. Evening peak power prices in France and Germany topped 170 euros per megawatt-hour. Red heat warnings cover Italy and Croatia, and Greece is battling wildfires near Attica.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Europe's%20fifth%20heatwave%20risks%20straining%20rivers,%20power%20and%20crops.pdf"}, {"id": "st-06", "title": "Libya's NOC warns of force majeure, Zawiya refinery shutdown if drone attacks continue", "source": "ST", "date": "11 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "Libya's National Oil Corporation said on Aug 10 it could declare force majeure and halt operations at the Zawiya refinery if drone attacks on oil assets continued, after a third strike over the weekend. The latest drone hit an oil blending and filling plant, falling near a main tank and pipeline network; no casualties were reported. Zawiya, about 40km west of Tripoli, has 120,000 barrels per day capacity, is linked to the Sharara oilfield and is Libya's largest operating refinery with Ras Lanuf shut. On Monday a Brega fuel tank holding 4.5 million litres of gasoline caught fire and collapsed. No party claimed responsibility. Attacks also targeted a desalination plant, prompting a state of extreme emergency.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Libya's%20NOC%20warns%20of%20force%20majeure,%20Zawiya%20refinery%20shutdown%20if%20drone%20attacks%20continue.pdf"}, {"id": "st-07", "title": "Meta launches new AI model as CEO Mark Zuckerberg champions open-weight push", "source": "ST", "date": "11 Aug 2026", "tags": ["Technology & AI"], "summary": "Meta CEO Mark Zuckerberg called for lower US barriers to open-source AI to better compete with Chinese rivals as the company released a new open-weight model, Muse Glimmer, on Aug 10. The small model targets agentic tasks and runs on a Mac or PC with a single graphics card. In a 14-page essay, Zuckerberg said concentrating AI power is \"inherently problematic\" and unveiled a US$1 billion fund to ease community concerns over data-centre build-out. He warned Chinese start-ups like Moonshot, Alibaba and DeepSeek lead in open-weight models and urged US policy to cut restrictions on training data. Meta, spending up to US$145 billion on AI infrastructure in 2026, plans to release weights of its advanced Muse Spark 1.2. Shares rose 3 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Meta%20launches%20new%20AI%20model%20as%20CEO%20Mark%20Zuckerberg%20champions%20open-weight%20push.pdf"}, {"id": "st-08", "title": "North Korea condemns Japan's White Paper, calling it 're-invasion paper'", "source": "ST", "date": "11 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "North Korea condemned Japan's 2026 defence White Paper, with a state media commentary branding it a \"re-invasion-minded\" document to legalise Tokyo's war machine. A North Korean analyst said the paper \"groundlessly described\" the North as the greatest strategic challenge to justify a \"reckless arms build-up\". Pyongyang has ratcheted up criticism of Tokyo's defence policy, issuing statements at least seven times since July. On Aug 5, Kim Yo Jong, sister of leader Kim Jong Un, warned of \"additional military options\" over Japan's transformation into a military power, after Tokyo test-fired a US-made Tomahawk cruise missile on July 29. The next day North Korea test-fired a short-range ballistic missile toward the sea, seen by some analysts as a warning to Japan.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/North%20Korea%20condemns%20Japan's%20White%20Paper,%20calling%20it%20're-invasion%20paper'.pdf"}, {"id": "st-09", "title": "Nvidia partners Wall Street giants to raise $640 billion for AI infrastructure", "source": "ST", "date": "11 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Nvidia said on Aug 10 it partnered with six major financial institutions to launch compute financing platforms aimed at raising over US$500 billion (S$640 billion) in third-party capital for AI infrastructure. It signed memorandums with Apollo, BlackRock, Blackstone, Brookfield, Goldman Sachs and KKR. CEO Jensen Huang said the platforms would help customers access scarce compute and build \"AI factories\". Big Tech's combined AI outlays are set to top US$730 billion in 2026. Nvidia's many deals have stoked concern it is inflating demand through circular arrangements; it was in talks to backstop up to US$250 billion for OpenAI's Ohio data-centre hub and finance US$350 billion of chip purchases. It also expanded a US$500 billion partnership with SK Group.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Nvidia%20partners%20Wall%20Street%20giants%20to%20raise%20640%20billion%20for%20AI%20infrastructure.pdf"}, {"id": "st-10", "title": "Oman says grounded tanker oil spill covers 400 square km", "source": "ST", "date": "11 Aug 2026", "tags": ["Environment", "Energy"], "summary": "Leaking crude from a tanker grounded off a nature reserve in Oman has created a slick covering almost 400 square kilometres, the government said on Aug 10. The Caroline Bezengi, loaded with close to one million barrels of Russian oil bound for Asia, first reported trouble on June 8 off Yemen after an apparent onboard blast; no party has claimed responsibility. The slick, near the protected Hallaniyat Islands home to humpback whales, extends within seven kilometres of the coast. Greenpeace estimated it at 600 square km. The 274-metre vessel is part of Russia's shadow fleet, sailed under the Cameroon flag, and is under EU, Ukrainian, UK, Canadian and Swiss sanctions. Experts warned oil could persist for years, citing Exxon Valdez.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Oman%20says%20grounded%20tanker%20oil%20spill%20covers%20400%20square%20km.pdf"}, {"id": "st-11", "title": "Poland and Baltics shield infrastructure, fearing a Russian false-flag strike", "source": "ST", "date": "11 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Russia's northern NATO neighbours are tightening security around dams, power plants and gas infrastructure amid concern Moscow could stage a \"false flag\" attack using Ukrainian drones. Lithuania, Poland, Latvia and Estonia warn of sabotage to test NATO's response as US commitment is questioned; the Kremlin dismissed such warnings as \"scare stories\". Lithuania deployed the military to guard its LNG terminal and a hydro plant, while Latvia boosted security at the Daugava dam and gas storage. A Baltic intelligence official said a drone attack could be launched within days of Putin's approval, with the aim being \"political chaos\" at NATO headquarters. Poland's Orlen is analysing alternative gas routes, and forged documents targeted its planned first nuclear plant.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Poland%20and%20Baltics%20shield%20infrastructure,%20fearing%20a%20Russian%20false-flag%20strike.pdf"}, {"id": "st-12", "title": "Russian attacks on Ukraine's Zaporizhzhia, Kyiv kill five, officials say", "source": "ST", "date": "11 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Russian attacks killed five people and injured 20 in the south-eastern Ukrainian city of Zaporizhzhia early on Aug 11 and also struck Kyiv, triggering fires in the capital, officials said. Zaporizhzhia Regional Governor Ivan Fedorov said Russian troops deployed missiles and aerial bombs on the city, posting pictures of buildings and vehicles ablaze. Air raid alerts sounded in both Zaporizhzhia and Kyiv, where the city's military administration said warehouses in a central district were on fire and one person was injured. Mayor Vitali Klitschko said medical personnel had been dispatched to a central district. Kyiv's air raid alert was lifted after 40 minutes and then issued again later, well after midnight.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Russian%20attacks%20on%20Ukraine's%20Zaporizhzhia,%20Kyiv%20kill%20five,%20officials%20say.pdf"}, {"id": "st-13", "title": "S'pore upgrades key exports forecast for 2026 after AI-powered 27.4% jump in Q2", "source": "ST", "date": "11 Aug 2026", "tags": ["Trade", "Technology & AI"], "summary": "Singapore upgraded its 2026 non-oil domestic exports (NODX) forecast after a 27.4 per cent surge in the second quarter, driven by electronics demand from the global AI build-out, EnterpriseSG said on Aug 11. The NODX forecast was raised to 14-16 per cent, from 3-5 per cent, after a first-half surge of 18.6 per cent, the strongest since 2010. Q2 electronics shipments jumped a record 88.1 per cent, with semiconductors up 91.9 per cent and disk media up 182.5 per cent. MTI lifted its 2026 GDP growth forecast to 4.5-5.5 per cent. Officials warned that an AI capex pullback could trigger sharp corrections; a MAS survey found 60 per cent of forecasters flagged an AI bubble burst as a downside risk. Taiwan was the top NODX market.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/S'pore%20upgrades%20key%20exports%20forecast%20for%202026%20after%20AI-powered%2027.4%20jump%20in%20Q2.pdf"}, {"id": "st-14", "title": "South Korea to launch $4.5b chip fund, speed development of semiconductor hubs", "source": "ST", "date": "11 Aug 2026", "tags": ["Technology & AI", "Politics"], "summary": "South Korea will launch a 5 trillion won (S$4.5 billion) semiconductor fund targeting chip materials, parts, equipment and fabless firms, plus 5 trillion won in trade finance for suppliers, a presidential official said on Aug 10. The measures are part of President Lee Jae Myung's semiconductor megaproject, under which Samsung Electronics and SK Hynix and partners are expected to invest more than US$576 billion in new chip projects. Seoul will seek a Mega Special Zone Act to speed permits and reviews, and Lee urged relocating a Gwangju military air base by mid-2028 for a chip complex. The government pledged secured power and water, including 14.7 gigawatts for the Yongin cluster by 2041, as it expands capacity to meet AI-driven demand.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/South%20Korea%20to%20launch%204.5b%20chip%20fund,%20speed%20development%20of%20semiconductor%20hubs.pdf"}, {"id": "st-15", "title": "South Korea, US to conduct military drills amid evolving North Korea threats", "source": "ST", "date": "11 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "South Korea and the United States will hold major joint military drills from Aug 17 to Aug 27, adding exercises to counter drones, GPS disruption and cyberattacks as they adapt to North Korea's evolving capabilities, officials said on Aug 10. The annual Ulchi Freedom Shield will test operations and government emergency readiness. Colonel Ryan Donald said the exercise reflects the changing character of war, noting DPRK soldiers who fought in Ukraine brought lessons home. About 18,000 South Korean troops will participate. Pyongyang routinely denounces the drills as provocation. North Korea, which recently fired a short-range ballistic missile, has continued developing weapons and in 2026 revised its Constitution to remove references to reunification and declare itself a nuclear weapons state.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/South%20Korea,%20US%20to%20conduct%20military%20drills%20amid%20evolving%20North%20Korea%20threats.pdf"}, {"id": "st-16", "title": "Taiwan bets on drone 'hellscape' to deter possible Chinese invasion", "source": "ST", "date": "11 Aug 2026", "tags": ["Defence", "Technology & AI"], "summary": "Taiwan is building fleets of flying drones and unmanned attack boats to repel any Chinese invasion, accelerating a US-conceived \"hellscape\" strategy of overwhelming an invading force with drones, missiles and artillery. Inspired by Ukraine, Taiwan practised drone reconnaissance during its annual Han Kuang exercises. Officials said drone and counter-drone efforts started late but have improved over two years. The government wants Taiwan making 100,000 drones a month by 2030 and the military to acquire over 210,000 drones. Experts warn Taiwan must also retool organisation, training and doctrine, and lacks the pressure of actual war. Drone exports hit US$115 million in Q1 2026, exceeding all of 2025, with the Czech Republic the top destination and many reaching Ukraine.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Taiwan%20bets%20on%20drone%20'hellscape'%20to%20deter%20possible%20Chinese%20invasion.pdf"}, {"id": "st-17", "title": "Trump flew secretly from Turkey due to Iranian threat", "source": "ST", "date": "11 Aug 2026", "tags": ["Politics", "Geopolitics"], "summary": "US President Donald Trump departed on a secret military flight from Turkey in July when the White House said he was aboard Air Force One, prompted by an Iranian assassination threat, the Washington Post reported on Aug 10. Trump had flown the newly renovated Qatari-donated jet to Ankara for the NATO summit but boarded an older Air Force One as a decoy, then was shuttled by an airport catering truck to a smaller Air Force C-32A. Journalists and some staff believed he was on the decoy plane and were told to keep window shades closed. A similar operation occurred in 2000 under Bill Clinton. The White House said the Qatari jet has high-level security protocols; the Pentagon did not comment.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Trump%20flew%20secretly%20from%20Turkey%20due%20to%20Iranian%20threat.pdf"}, {"id": "st-18", "title": "US court rules Meta, other tech firms must face thousands of lawsuits over social media addiction", "source": "ST", "date": "11 Aug
