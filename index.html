ry", "source": "ST", "date": "14 Aug 2026", "tags": ["Defence", "Society"], "summary": "A powerful explosion tore through a munitions factory near Colleferro, south-east of Rome, on Aug 13, with the blast heard for kilometres. It occurred as firefighters and police were already at the site responding to a fire. No injuries were reported, said Franco-German defence group KNDS, whose subsidiary KNDS Ammo Italy operates the plant. Colleferro mayor Giulio Calamita said it \"would have been a tragedy\" had the blast not struck during the summer holiday when the plant was closed. The plant makes medium- and large-calibre ammunition for land and naval defence systems and solid propellants for aerospace launch vehicles. The company is among contractors on European Defence Agency 155mm ammunition framework agreements concluded in 2023. Large plumes of smoke rose as emergency crews worked.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/Large%20explosion%20rips%20through%20Italian%20munitions%20factory.pdf"}, {"id": "st-08", "title": "Lower mortgage rates, policy changes to support Singapore property market in 2026: PropNex", "source": "ST", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "PropNex expects lower mortgage rates, population growth and recent policy changes to support Singapore's residential market in the second half of 2026, even as price growth moderates. It forecasts private home prices rising 3 to 4 per cent for 2026, with about 9,000 new private homes sold, and 14,000 to 15,000 resale deals. Fixed two-year loan rates now range 1.4 to 1.7 per cent. CEO Kelvin Fong said buying is \"mainly led by locals with genuine housing needs\". Removal of the 15-month wait-out period and eased ABSD remission rules should aid movement between markets. PropNex forecasts 26,000 to 27,000 HDB resale deals. First-half revenue edged up 0.7 per cent to $603 million, while net profit fell 3.1 per cent to $40.9 million.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/Lower%20mortgage%20rates,%20policy%20changes%20to%20support%20Singapore%20property%20market%20in%202026%20PropNex.pdf"}, {"id": "st-09", "title": "North Korea may increase western Russia deployment to 50,000 troops", "source": "ST", "date": "14 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Russia and North Korea are considering deploying additional North Korean troops to three western Russian regions bordering Ukraine, freeing Russian units for the front, Ukraine's military intelligence said on Aug 12. Under a provisional Russian plan obtained by Kyiv, Pyongyang's deployment would rise to 50,000 troops by end-November to help seize Ukraine's Donbas region by end-2026. Ukraine says more than 42,000 Russian soldiers were killed or wounded in July, driving Moscow to seek reinforcements. More than 10,000 North Korean troops have already fought in western Russia, mostly in Kursk, with the plan envisioning duties in Bryansk and Belgorod. Around 9,500 ground troops are currently in Russia. Pyongyang has also sent about 90 missile troops to Voronezh and supplied 40 more ballistic missiles.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/North%20Korea%20may%20increase%20western%20Russia%20deployment%20to%2050,000%20troops.pdf"}, {"id": "st-10", "title": "North Korea warns of new 'deterrent' ahead of US-South Korea drills", "source": "ST", "date": "14 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "North Korea denounced upcoming joint US-South Korea military drills and warned it could respond with stronger deterrence measures, in a Foreign Ministry statement published on Aug 14. The 11-day \"Ulchi Freedom Shield\" exercises, beginning Aug 17, will involve 18,000 South Korean troops and part of the 28,500-strong US contingent. Pyongyang, which calls the drills a rehearsal for invasion, earlier fired a ballistic missile over the Sea of Japan. \"It is our consistent principle... to respond to a new level of a threat with a new level of a deterrent,\" a spokesperson said, adding the North would not tolerate the \"confrontational situation\". A spokesman said the drills prepare troops to face North Korean forces battle-hardened from deployment alongside Russia in Ukraine.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/North%20Korea%20warns%20of%20new%20'deterrent'%20ahead%20of%20US-South%20Korea%20drills.pdf"}, {"id": "st-11", "title": "Romania shuts down nuclear plant as Danube water level drops", "source": "ST", "date": "14 Aug 2026", "tags": ["Energy", "Environment"], "summary": "Romania halted its only nuclear plant on Aug 13, a rare shutdown caused by a drought that dropped the Danube, whose waters cool the plant, to record lows. The Cernavoda plant, which usually generates a fifth of national electricity, had one of its two reactors shut in July; operator Nuclearelectrica closed the second, seeing no restart within 10 days. Romania budgeted over €2 million to divert the river's flow, including sinking barges filled with rocks. Wind power and imports are expected to cover supply, though industrial restrictions may follow, and carmakers Dacia and Ford paused production. Nearly two-thirds of the Danube saw record-low July flows in 34 years, per Copernicus. Neighbouring Hungary is trying to keep its Paks plant running.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/Romania%20shuts%20down%20nuclear%20plant%20as%20Danube%20water%20level%20drops.pdf"}, {"id": "st-12", "title": "Singtel's Q1 profit falls 72% on absence of exceptional gains", "source": "ST", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Singtel reported a 71.6 per cent drop in first-quarter net profit to $818 million from $2.88 billion, reflecting the absence of prior-year exceptional gains from an Airtel stake sale and the Intouch-Gulf Energy merger. Underlying net profit rose 21 per cent to $831 million, driven by Airtel, AIS, NCS, Optus and Digital InfraCo. Operating revenue and Ebitda grew 4.9 and 8.7 per cent. Singtel Singapore's revenue fell 3.1 per cent to $901 million amid \"continued intense price competition\", with mobile revenue down 4 per cent. Regional associate contributions rose 16.1 per cent to $543 million. Digital InfraCo revenue jumped 18.9 per cent on data-centre arm Nxera, which management may dual-list. Shares closed at $4.25, down nearly 1 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/Singtel's%20Q1%20profit%20falls%2072%20on%20absence%20of%20exceptional%20gains.pdf"}, {"id": "st-13", "title": "South Korea unveils package to boost housing supply, support young buyers", "source": "ST", "date": "14 Aug 2026", "tags": ["Politics", "Finance & Markets"], "summary": "South Korea said on Aug 13 it would raise financial support for construction and ease regulations for young homebuyers to stabilise a red-hot housing market, after earlier proposing higher taxes on wealthy homeowners. President Lee Jae Myung, whose approval has fallen on rising prices, warned the \"real estate bubble has reached a level that can no longer be left unchecked\", citing the risk of \"lost decades\". The Financial Services Commission said it would lift policy support for construction financing to at least 47.8 trillion won ($43.22 billion) from 26.3 trillion won, and add loans for young people and newlyweds while tightening speculative-demand curbs. It will manage debt growth at around 3 per cent. Lee's approval hit a one-month low of 51 per cent in late July.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/South%20Korea%20unveils%20package%20to%20boost%20housing%20supply,%20support%20young%20buyers.pdf"}, {"id": "st-14", "title": "South Korea's SK Shipping, H-Line swop tankers to create LNG giant", "source": "ST", "date": "14 Aug 2026", "tags": ["Energy", "Finance & Markets"], "summary": "South Korean shipping firms SK Shipping and H-Line Shipping, both owned by private equity firm Hahn & Co, will swop tankers and contracts to create one of the world's largest LNG carrier operators. SK Shipping will receive 16 LNG vessels and their long-term contracts from H-Line in exchange for 12 tankers, their contracts and about US$300 million ($384 million) in cash, Hahn & Co said on Aug 13. The deal makes SK Shipping the world's third-largest and Asia's biggest LNG carrier operator, while H-Line becomes a leading regional tanker and bulk-shipping company. The swop comes as months of Persian Gulf conflict upend energy trade and create opportunities for shipowners. Hahn & Co created H-Line in 2014 and bought most of SK Shipping in 2018.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/South%20Korea's%20SK%20Shipping,%20H-Line%20swop%20tankers%20to%20create%20LNG%20giant.pdf"}, {"id": "st-15", "title": "Taiwan military drills clear streets, slow internet in Taipei", "source": "ST", "date": "14 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Air raid sirens rang out and streets emptied in Taipei on Aug 13 during annual drills that included the government deliberately slowing mobile internet to simulate a Chinese attack. Taiwan is nearing the end of its 10-day Han Kuang war games, combining military exercises with civil defence. The 30-minute internet \"throttling\" exercise, first held Aug 10 in central Taiwan, slowed mobile speeds dramatically while leaving fixed-line and Wi-Fi untouched. President Lai Ching-te visited an emergency ward and supermarket accompanied by senior foreign diplomats, including the de facto US, Israeli and Canadian envoys. On Aug 12, Taiwan's armed forces held their first anti-blockade drill, using the navy and coast guard to escort a simulated merchant ship, amid fears Beijing could try to choke off the island.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/Taiwan%20military%20drills%20clear%20streets,%20slow%20internet%20in%20Taipei.pdf"}, {"id": "st-16", "title": "Taiwan throttles mobile internet speeds in defence drill", "source": "ST", "date": "14 Aug 2026", "tags": ["Defence", "Technology & AI"], "summary": "In this first-person account, ST correspondent Yip Wai Yee describes Taiwan's debut mobile-internet throttling exercise during the annual Han Kuang war games. For 30 minutes on Aug 13 in Taipei and northern Taiwan, public 4G and 5G download speeds plunged to 1 per cent of normal capacity, halting streaming and gaming, though calls and SMS worked. The drill tested public readiness for an information blockade, but many residents appeared unfazed, waiting it out in underground malls. Taiwan relies on 14 submarine cables vulnerable to sabotage; in 2023 its Matsu islands were cut off for weeks after cables were severed. Taiwan faced 2.63 million daily intrusion attempts in 2025. The author calls the flawed drill a step toward a whole-of-society defence model.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/Taiwan%20throttles%20mobile%20internet%20speeds%20in%20defence%20drill.pdf"}, {"id": "st-17", "title": "The China discount now carries a premium", "source": "ST", "date": "14 Aug 2026", "tags": ["Trade", "Southeast Asia"], "summary": "This commentary by NUS professor Ramkishen Rajan argues Chinese goods remain competitive despite geopolitical tension, with China's exports up 23.9 per cent in July and high-tech exports up 40.7 per cent. The longstanding \"China discount\" persists because of China's unbalanced growth model and an undervalued renminbi, a surge Fed researchers call China Shock 2.0. Singapore has a stake, as Chinese inputs helped its manufacturing grow 12.5 per cent in Q2. Intermediate inputs make up 60 per cent of ASEAN's imports from China. But firms serving markets under different technology rules face compliance costs from US and Chinese export controls, a \"geoeconomic premium\". The author urges preserving supplier choice while helping firms navigate fragmented rules, noting MAS tightened policy twice and Singapore offered SME support.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/The%20China%20discount%20now%20carries%20a%20premium.pdf"}, {"id": "st-18", "title": "Trump announces tariffs of up to 100% on imported drones", "source": "ST", "date": "14 Aug 2026", "tags": ["Trade", "Defence"], "summary": "US President Donald Trump announced on Aug 13 tariffs of up to 100 per cent on imports of unmanned drones and their components, aiming to cut US reliance on an industry dominated by China. Justified on national security grounds, the White House detailed a 100 per cent duty on certain unmanned aircraft systems, including those over 25kg with capabilities such as thermal imagers and docking stations, while smaller drones face a 25 per cent tariff. The measures, mostly effective Sept 3, are meant to encourage domestic production. Chinese firm DJI has captured more than two-thirds of the global drone market. Last week China restricted drone exports to the US and blacklisted six companies, days after Washington imposed fresh tariffs on China and 59 countries.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/Trump%20announces%20tariffs%20of%20up%20to%20100%20on%20imported%20drones.pdf"}, {"id": "st-19", "title": "Twitch sparks gamers' wrath with Amazon AI sharing deal", "source": "ST", "date": "14 Aug 2026", "tags": ["Technology & AI", "Society"], "summary": "Live-stream gaming platform Twitch has angered millions of users by declaring it will share their data with parent company Amazon to train the retailer's AI models. In a post on X, Twitch said users could opt out, but otherwise live audio, text, images and other channel content would be used for AI training across Amazon's platforms. Chief product officer Mike Minton said on Aug 12: \"if it was opt-in, nobody would opt in,\" adding it would be on by default. Gamers slammed the policy as a privacy incursion, with one saying \"opting people in by default is not consent\". The move is the latest front in the fight over online privacy as AI firms seek data. In 2025 Meta said public comments on its platforms would train its AI unless users opted out.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/Twitch%20sparks%20gamers'%20wrath%20with%20Amazon%20AI%20sharing%20deal.pdf"}, {"id": "st-20", "title": "US court rules Trump can end tariff exemption for small parcels", "source": "ST", "date": "14 Aug 2026", "tags": ["Trade", "Politics"], "summary": "A US trade court ruled on Aug 13 that President Donald Trump could halt the \"de minimis\" tariff exemption for small packages, rejecting a legal challenge. Trump had acted last year to end the exemption for parcels valued at US$800 ($1,024.64) or less, citing use of low-value shipments to dodge tariffs and smuggle drugs. The change had worried small businesses with less buffer than larger platforms such as Shein and Temu, both hit when Washington earlier closed the exception for Chinese products. The Court of International Trade ruled the rescission was allowed. Trump touted the \"big win\", calling the provision a \"giant loophole for tariff cheats\". His tariff agenda has faced legal pushbacks, including a February Supreme Court ruling against his global tariffs.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/US%20court%20rules%20Trump%20can%20end%20tariff%20exemption%20for%20small%20parcels.pdf"}, {"id": "st-21", "title": "US eyes indefinite Iran naval blockade as oil supply shortfall deepens", "source": "ST", "date": "14 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "The US on Aug 13 threatened to maintain a naval blockade of Iran indefinitely as ceasefire talks floundered and global oil supply dropped. Defence Secretary Pete Hegseth said the Navy could sustain it by rotating ships. With a tentative June deal in tatters, Iran has sought to control the Strait of Hormuz and attacked vessels, including two Abu Dhabi National Oil Company ships on Aug 13. Shipping through the strait fell to eight vessels on Aug 11, versus 130-140 before the war. Iran said the strait remains blocked until sanctions are lifted. The IEA forecast global oil supply falling 4.3 million barrels per day, or about 4 per cent, in 2026. Oil settled down over 2 per cent, though a reported Houthi drone strike on a Saudi Aramco refinery unsettled markets.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/US%20eyes%20indefinite%20Iran%20naval%20blockade%20as%20oil%20supply%20shortfall%20deepens.pdf"}, {"id": "st-22", "title": "US flags dozens of trade partners as risks for aiding tariff evasion", "source": "ST", "date": "14 Aug 2026", "tags": ["Trade", "Geopolitics"], "summary": "The Trump administration on Aug 13 flagged dozens of US trading partners as potential risks for aiding Chinese tariff evasion, vowing to use artificial intelligence to detect illegal practices. Those named include the European Union, Taiwan, Mexico, Canada, India, Japan, South Korea and Vietnam. The White House report targets \"illegal transshipment\", where goods are routed through third countries facing lower US tariffs. Trade adviser Peter Navarro said \"the great transshipment scam\" has let China launder exports through more than 40 countries. The report cited over 40 nations with elevated risk, grouping them by embedded trade flows, China-linked supply chains, or preferential US access. Navarro said the White House is building an AI-enabled \"detective border\" with Customs and Border Protection to assess shipments.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/US%20flags%20dozens%20of%20trade%20partners%20as%20risks%20for%20aiding%20tariff%20evasion.pdf"}, {"id": "st-23", "title": "US semiconductor equipment firm Lam Research to add 200 jobs in Singapore amid AI boom", "source": "ST", "date": "14 Aug 2026", "tags": ["Technology & AI", "Southeast Asia"], "summary": "US chip-equipment maker Lam Research will hire about 200 new employees in Singapore for roles focused on advanced technologies used in making AI chips. The Fremont, California-based firm, which runs a services hub here, said nearly 90 per cent of the positions will be specialised engineering and technical roles, mostly for local hires. \"The demand for deep engineering talent has never been greater,\" said South-east Asia general manager Andrew Goh. New roles cover high-bandwidth memory, 2.5D and 3D integration, silicon photonics and co-packaged optics. Singapore accounts for one in 10 chips and a fifth of global semiconductor equipment, with the industry near 6 per cent of GDP and over 35,000 jobs. Lam joins Micron, Applied Materials and UMC in expanding local footprints amid AI-driven demand.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/US%20semiconductor%20equipment%20firm%20Lam%20Research%20to%20add%20200%20jobs%20in%20Singapore%20amid%20AI%20boom.pdf"}, {"id": "st-24", "title": "Ukraine offers Russia truce in Black Sea as food supply fears mount, source says", "source": "ST", "date": "14 Aug 2026", "tags": ["Geopolitics", "Trade"], "summary": "Ukraine has sent Russia an offer to halt attacks on civilian targets in the Black Sea after mounting strikes on vessels and ports raised fears over global food supplies, a source told Reuters. The offer was transmitted via a third party, with Kyiv awaiting a response. Both major agricultural exporters have accused each other of intensified attacks. Kyiv turned to alternative routes after shipowners halted stops at Odesa ports in late July, while Russia suspended operations at all three Novorossiysk terminals on Aug 12-13 after a Ukrainian attack. Deputy Russian Foreign Minister Alexander Grushko said Moscow had received no formal proposal. Turkey urged a moratorium on Aug 9. The de facto blockade has sent Ukrainian grain exports tumbling 76 per cent year on year so far in August.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/Ukraine%20offers%20Russia%20truce%20in%20Black%20Sea%20as%20food%20supply%20fears%20mount,%20source%20says.pdf"}, {"id": "st-25", "title": "Yemen at highest risk of major conflict since 2022 truce, UN warns", "source": "ST", "date": "14 Aug 2026", "tags": ["Geopolitics", "Society"], "summary": "Yemen faces its most serious threat of a return to large-scale war since a UN-brokered 2022 truce, UN envoy Hans Grundberg warned on Aug 13, as the world body said more than half the population faced acute food insecurity. Fighting has escalated between the Iran-aligned Houthis and the Saudi-backed government, with Houthi attacks in Marib, Hadramawt and Mocha causing casualties. Grundberg said renewed Houthi attacks on Red Sea and Gulf of Aden shipping risk drawing Yemen into wider regional confrontation amid the Strait of Hormuz crisis. UN aid chief Tom Fletcher said 6 million people neared famine. Both called for the release of 73 detained UN personnel. The Houthis declared a naval blockade on Saudi Arabia on July 20, drawing coalition air strikes on Hodeidah.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/Yemen%20at%20highest%20risk%20of%20major%20conflict%20since%202022%20truce,%20UN%20warns.pdf"}, {"id": "bt-01", "title": "AMD looks to raise US$4 billion to US$5 billion in debt offering: source", "source": "BT", "date": "14 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Advanced Micro Devices on Aug 13 launched a four-part debt offering that could raise US$4 billion to US$5 billion, according to a source and terms reviewed by Reuters, as chipmakers turn to capital markets to fund AI-related investments. The senior unsecured notes are due in 2029, 2031, 2033 and 2036, with initial pricing discussions ranging from about 70 basis points over US Treasuries for the three-year tranche to 115 basis points for the 10-year. Proceeds are earmarked for general corporate purposes, possibly debt repayment. Bank of America, JPMorgan, Barclays and Wells Fargo are leading the sale, expected to settle Aug 17. Earlier in the week, Intel raised US$20 billion in an upsized stock offering.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/AMD%20looks%20to%20raise%20US4%20billion%20to%20US5%20billion%20in%20debt%20offering%20source.pdf"}, {"id": "bt-02", "title": "Australia housing prices drop slows economy", "source": "BT", "date": "14 Aug 2026", "tags": ["Finance & Markets"], "summary": "A fall in Australian home prices is tightening financial conditions and helping cool the economy, Reserve Bank of Australia assistant governor Chris Kent said in Sydney on Aug 13. He attributed the drop to interest rate hikes, a reaction to rapid prior-year growth and May budget changes to housing tax breaks, alongside higher living costs and heavy household debt. Values fell 0.7 per cent nationwide in July from June, led by a 1.4 per cent decline in Sydney, the steepest fall since December 2022, Cotality data showed. The RBA has hiked three times this year before pausing. Kent said inflation risks remain \"very much to the upside,\" citing the Strait of Hormuz's reopening as a key uncertainty.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Australia%20housing%20prices%20drop%20slows%20economy.pdf"}, {"id": "bt-03", "title": "CapitaLand Investment to restructure portfolio, recycle up to S$9 billion", "source": "BT", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "CapitaLand Investment is restructuring its portfolio, earmarking up to S$9 billion of non-core and legacy assets for capital recycling as it focuses on listed and private funds and lightens its balance sheet, group CEO Lee Chee Koon said on Aug 13. CFO Paul Tham said the S$7 billion to S$9 billion targeted comprises mostly balance-sheet and legacy fund investments, largely from China, with some in Singapore, India and Europe. CLI will pare \"excess holdings\" in bigger Reits including CICT and Clar toward a 15 per cent sponsor stake. For H1, net profit rose 14 per cent to S$327 million, though revenue fell 2 per cent to S$1.02 billion. Shares closed 0.7 per cent higher at S$2.75.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/CapitaLand%20Investment%20to%20restructure%20portfolio,%20recycle%20up%20to%20S9%20billion.pdf"}, {"id": "bt-04", "title": "ChatGPT maker OpenAI's revenue run rate tops US$40 billion ahead of IPO", "source": "BT", "date": "14 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "OpenAI is on track to generate annualised revenue of more than US$40 billion, roughly double its end-2025 run rate of over US$20 billion, people familiar said, bolstering its Wall Street debut plans. Growth was driven partly by its AI coding software, plus subscriptions, a nascent advertising business and its core consumer arm. OpenAI is battling Claude maker Anthropic, whose run-rate revenue crossed US$47 billion in May, though the firms may measure differently. Both have filed confidential IPO paperwork, with Anthropic expected to list as soon as this fall, ahead of OpenAI. On Aug 13, OpenAI named its second chief revenue officer in under a year. President Greg Brockman said the run rate rose over 20 per cent month-over-month in July.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/ChatGPT%20maker%20OpenAI's%20revenue%20run%20rate%20tops%20US40%20billion%20ahead%20of%20IPO.pdf"}, {"id": "bt-05", "title": "DBS names new heads for Hong Kong, Taiwan and Indonesia markets", "source": "BT", "date": "14 Aug 2026", "tags": ["Finance & Markets"], "summary": "DBS on Aug 13 announced a series of senior leadership appointments across its Hong Kong, Indonesia and Taiwan markets, effective over the coming months. Ng Sier Han, current CEO of DBS Taiwan, becomes CEO of DBS Bank (Hong Kong) from Mar 1, 2027. Lim Chu Chong, president-director of DBS Indonesia, will be CEO of DBS Taiwan from Jan 1, 2027. Adrian Chai, a managing director in DBS's Institutional Banking Group, becomes president-director of DBS Indonesia from Dec 1, 2026. The reshuffle follows Sebastian Paredes, head of North Asia and CEO of DBS Bank (Hong Kong), stepping down from executive duties on Mar 1, 2027 to become a senior adviser. Shares closed 0.9 per cent higher at S$76.50 before the news.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/DBS%20names%20new%20heads%20for%20Hong%20Kong,%20Taiwan%20and%20Indonesia%20markets.pdf"}, {"id": "bt-06", "title": "Fitch keeps United States at 'AA+', cites economic resilience amid fiscal risks", "source": "BT", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "Fitch on Aug 13 affirmed the US sovereign credit rating at \"AA+\" with a stable outlook, citing the large economy, high per-capita income and the dollar's reserve-currency status. The agency said the economy stayed resilient despite higher tariffs, spending cuts, tighter border controls and policy uncertainty, but estimated growth slowing to 1.9 per cent in 2026-2027 from 2.8 per cent in 2025, with weakening labour demand. Inflation is expected to average 3.4 per cent in 2026, above the Fed's 2 per cent target. Fitch sees the general government deficit widening to 7.4 per cent of GDP, the highest among \"AA\"-rated peers. S&P also kept its \"AA+\" rating in June; Fitch downgraded the US from triple-A in 2023, and Moody's cut its last triple-A last year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Fitch%20keeps%20United%20States%20at%20'AA',%20cites%20economic%20resilience%20amid%20fiscal%20risks.pdf"}, {"id": "bt-07", "title": "Frencken H1 net profit falls 3.4% to S$19.3 million", "source": "BT", "date": "14 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Tech solutions provider Frencken Group on Aug 13 reported a 3.4 per cent decline in H1 net profit to S$19.3 million, from S$19.9 million a year earlier, as administrative and general expenses rose 9.9 per cent to S$32.6 million and income tax expenses grew 12.4 per cent. Revenue dipped 0.8 per cent to S$427.8 million. Mechatronics revenue eased 1.5 per cent to S$383.4 million, with semiconductor down 1.1 per cent and analytical life-sciences off 13.7 per cent, partially offset by gains in medical and industrial automation. EPS was S$0.045. Frencken expects higher H2 revenue and full-year revenue and net profit above FY2025, and envisages crossing the S$1 billion annual revenue mark by 2028. Shares closed 4.1 per cent higher at S$2.79.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Frencken%20H1%20net%20profit%20falls%203.4%20to%20S19.3%20million.pdf"}, {"id": "bt-08", "title": "Gold declines as sliding US inflation reinforces Fed hold bets", "source": "BT", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Energy"], "summary": "Gold was little changed after retreating below US$4,400 an ounce, as traders weighed the Fed's rate path and prospects for a deal to reopen the Strait of Hormuz, but remained on track for a second weekly gain. A subdued US July inflation print suggested energy-price shocks from the Iran war faded, easing pressure on the Fed; money markets price a roughly one-in-three chance of a September hike. Investors await employment data and chairman Kevin Warsh's Jackson Hole remarks. Gold's recovery above US$4,000 reflected renewed investor appetite and central bank buying, notably from China. OCBC strategist Christopher Wong called the macro setup \"more constructive\" but flagged consolidation risks. Spot gold edged up 0.2 per cent to US$4,359.73; silver was flat at US$64.55.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Gold%20declines%20as%20sliding%20US%20inflation%20reinforces%20Fed%20hold%20bets.pdf"}, {"id": "bt-09", "title": "Google unveils Gemini 3.7 Flash AI model for coding and agent workflows, but top AI model still delayed", "source": "BT", "date": "14 Aug 2026", "tags": ["Technology & AI"], "summary": "Alphabet's Google released another Gemini Flash installment on Aug 13 but did not say when it would ship its most powerful model, Gemini 3.5 Pro, which has been hampered by delays. The new Gemini 3.7 Flash outperforms its predecessor on coding tasks like debugging, generates more production-ready code on the first try, completes app production in fewer prompts and lowers token prices, Google said. Its Gemini Spark productivity agent will run on 3.7 Flash. The company added stronger safety features blocking malicious hacking and CBRN misuse. Google has struggled to keep pace with OpenAI and Anthropic, and delays to Gemini 3.5 Pro have raised questions about its roadmap. CEO Sundar Pichai said Google aims to ship faster and is training its upcoming Gemini 4 model.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Google%20unveils%20Gemini%203.7%20Flash,%20top%20AI%20model%20still%20delayed.pdf"}, {"id": "bt-10", "title": "Greenback steadies after benign US inflation curbs Fed rate hike bets", "source": "BT", "date": "14 Aug 2026", "tags": ["Finance & Markets"], "summary": "The US dollar drifted on Aug 13 after a benign US consumer inflation reading led traders to pare bets on a September Fed rate hike, though the currency was still up 0.4 per cent on the week, heading for its first weekly gain in three. July CPI rose 0.1 per cent, in line with forecasts, cutting September hike odds to 40 per cent from 54 per cent a week earlier per CME FedWatch. Attention turns to producer prices and the Aug 26 core PCE. Under chair Kevin Warsh, analysts expect a broader inflation approach. The dollar eased to around 159.3 yen, about 2.7 per cent below late July's 40-year highs that sparked joint US-Japan intervention. The euro firmed to US$1.1537; sterling steadied at US$1.349 after surprise UK GDP growth.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Greenback%20steadies%20after%20benign%20US%20inflation%20curbs%20Fed%20rate%20hike%20bets.pdf"}, {"id": "bt-11", "title": "Houthis hit Aramco Jazan refinery for second time in a week", "source": "BT", "date": "14 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "Yemen's Houthis said they targeted Saudi Aramco's oil refinery in Jazan on the Red Sea coast, the second attack on the facility in less than a week. The group's forces fired two drones and hit the refinery, Houthi-controlled Saba news agency reported, citing a military source; a person familiar said the strike caused negligible damage to a tank. Saudi Arabia and Aramco did not immediately comment. The Houthis said the attack responded to the kingdom's alleged violation of Yemeni airspace and sovereignty in Sa'dah and Hajjah. On Sunday Aug 9, the group hit the refinery and set it ablaze before authorities extinguished it, with no injuries. In July, the Houthis threatened to blockade Saudi oil flows in response to a Saudi blockade of Yemeni territory.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Houthis%20hit%20Aramco%20Jazan%20refinery%20for%20second%20time%20in%20a%20week.pdf"}, {"id": "bt-12", "title": "JD.com expects second-half electronics sales to improve after quarterly revenue falls", "source": "BT", "date": "14 Aug 2026", "tags": ["Technology & AI", "Trade"], "summary": "JD.com, a major Chinese consumer-electronics platform, expects home-appliance sales to improve in the second half after reporting its first quarterly revenue decline in more than a decade. CEO Sandy Xu said electronics and home appliances suffered from a high year-earlier base and rising raw-material costs, but momentum picked up in June and growth should improve \"meaningfully.\" Total revenue fell 2.9 per cent to 346.4 billion yuan (US$51.37 billion) in the quarter ended June, beating estimates helped by a longer 618 shopping festival. US-listed shares fell 3.5 per cent. The decline underscores the challenge of reviving spending amid weak confidence tied to China's property downturn. Net profit was 7.1 billion yuan versus 6.2 billion a year earlier; non-GAAP net profit rose 20 per cent to 8.9 billion yuan.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/JD.com%20expects%20second-half%20electronics%20sales%20to%20improve%20after%20quarterly%20revenue%20falls.pdf"}, {"id": "bt-13", "title": "Japan's wholesale inflation remains high, bolstering odds of September BOJ hike", "source": "BT", "date": "14 Aug 2026", "tags": ["Finance & Markets"], "summary": "Japan's annual wholesale inflation stayed elevated in July, reinforcing market expectations of a September rate hike, data showed on Aug 13. The producer price index rose 7.2 per cent, slower than the 7.4 per cent forecast but near June's 7.3 per cent, and edged up 0.1 per cent month-on-month. Strong AI-driven demand, elevated global metal prices and Middle East conflict costs drove broad gains; non-ferrous metals surged 40.6 per cent and yen-based import prices rose 29.1 per cent. The BOJ kept policy steady in July but warned underlying inflation could exceed its target. Tokyo core inflation hit 1.9 per cent. Analysts forecast a move to 1.25 per cent from 1 per cent at the Sep 17-18 meeting, with a recent joint Japan-US yen intervention all but locking in the hike.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Japan's%20wholesale%20inflation%20remains%20high,%20bolstering%20odds%20of%20September%20BOJ%20hike.pdf"}, {"id": "bt-14", "title": "Likely that 2026 will be the hottest year on record, experts say", "source": "BT", "date": "14 Aug 2026", "tags": ["Environment", "Society"], "summary": "An unusually powerful El Nino is raising the odds that 2026 will surpass 2024 as the world's hottest year on record, with 2027 also expected to set a new high, according to a Berkeley Earth analysis. Chief scientist Robert Rohde said conditions could resemble weather \"a decade or more away.\" Projections suggest sea-surface temperatures rising 4 deg C above normal in the Eastern tropical Pacific, versus 2.75 deg C in 2015-2016. The El Nino, which began in June, has lifted the odds of 2026 becoming the hottest year from 12 per cent in July to 69 per cent in August. Last month brought heat waves and wildfires in France and Spain and a US heat dome. Scientist Zeke Hausfather called El Nino \"a giant hammer.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Likely%20that%202026%20will%20be%20the%20hottest%20year%20on%20record,%20experts%20say.pdf"}, {"id": "bt-15", "title": "MSCI drops S-E Asian heavyweights Sembcorp, GoTo and Ayala Land from global benchmarks", "source": "BT", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "South-east Asia had no additions to MSCI's Global Standard Indexes in its latest quarterly review, while four regional stocks were removed: Singapore's Sembcorp Industries, the Philippines' Ayala Land, and Indonesia's GoTo and Charoen Pokphand Indonesia. The changes take effect after Aug 31. Sembcorp is valued at about US$7.8 billion, Ayala Land US$3.6 billion, and GoTo has fallen to about US$3 billion from a US$29 billion peak in 2022, dropped on liquidity concerns. Indonesia keeps its Emerging Market status. Three of the four move to small-cap indexes; GoTo does not. Across Asia-Pacific, 45 stocks joined and 55 left, with Taiwan's Nanya Technology the largest addition at US$39 billion. Sembcorp's removal reshapes the MSCI Singapore Index top 10.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/MSCI%20drops%20S-E%20Asian%20heavyweights%20Sembcorp,%20GoTo%20and%20Ayala%20Land%20from%20global%20benchmarks.pdf"}, {"id": "bt-16", "title": "Maersk's Q2 profit smashes forecasts amid global trade turbulence, raises 2026 outlook again", "source": "BT", "date": "14 Aug 2026", "tags": ["Trade", "Finance & Markets"], "summary": "Danish shipping group Maersk on Aug 13 beat profit forecasts and raised full-year earnings guidance for a second time in 2026, as the Middle East conflict and strong demand pushed freight rates higher. April-June Ebitda hit US$3 billion, above a US$2.12 billion median forecast and up from US$2.3 billion a year ago. The world's second-largest container shipper now expects underlying Ebitda of US$10.5 billion to US$12.5 billion, up from US$8 billion to US$10 billion. Turbulence including the US-Iran war, which disrupted Strait of Hormuz traffic, and Red Sea Houthi attacks has lifted rates. Some analysts warn the freight strength is a short-term tailwind, and that normalising Red Sea traffic would pressure rates. Maersk and Hapag-Lloyd have begun resuming some Suez Canal services.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Maersk's%20Q2%20profit%20smashes%20forecasts%20amid%20global%20trade%20turbulence,%20raises%202026%20outlook%20again.pdf"}, {"id": "bt-17", "title": "Oil settles down 2% on weak demand outlook, hefty US crude build", "source": "BT", "date": "14 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "Oil settled down more than 2 per cent on Aug 13, reversing a week of gains as investors focused on weaker global demand and a sharp US crude build. Brent finished US$1.91 lower at US$87.07, while WTI closed down US$2.02 at US$81.25, paring steeper losses after reports Houthis targeted Saudi Aramco's Jazan refinery. US crude inventories rose 17.4 million barrels to 424.4 million, the biggest weekly gain since January 2023. Opec cut its 2026 world demand growth forecast to 580,000 bpd, and the IEA expects a 1.6 million bpd contraction. The US and Iran made competing claims over the Strait of Hormuz, with Trump asserting \"total control\" and Iran calling it under its \"control and management.\" Russia's product exports also fell after Ukrainian drone strikes.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Oil%20settles%20down%202%20on%20weak%20demand%20outlook,%20hefty%20US%20crude%20build.pdf"}, {"id": "bt-18", "title": "Race to regain AI model supremacy: Why Google shifted power in its top ranks", "source": "BT", "date": "14 Aug 2026", "tags": ["Technology & AI"], "summary": "Google co-founder Sergey Brin has urged key AI staff to go all in on Gemini as Alphabet seeks to close the gap with rivals, sources told Reuters. After Anthropic previewed its powerful Claude Mythos model, Brin pressed Google DeepMind to move faster. By August, Google had delayed Gemini's new flagship by two months as internal tests showed it lagging on coding. On Aug 5, Google overhauled DeepMind's leadership: chief Demis Hassabis became chair while deputy Koray Kavukcuoglu took charge, and Gemini's original technical co-leads Jeff Dean and Oriol Vinyals quit to found a startup, Discovery Loop. The news sent Google's stock down 4 per cent. Sources cite constrained computing, bureaucracy and disagreements among project leaders as reasons Google keeps falling behind despite Gemini 3's November 2025 catch-up.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Race%20to%20regain%20AI%20model%20supremacy%20Why%20Google%20shifted%20power%20in%20its%20top%20ranks.pdf"}, {"id": "bt-19", "title": "ST Engineering H1 net profit rises 27.1% to S$512.1 million on strong segment growth", "source": "BT", "date": "14 Aug 2026", "tags": ["Defence", "Finance & Markets"], "summary": "ST Engineering on Aug 13 posted a 27.1 per cent rise in H1 net profit to S$512.1 million, from S$402.8 million, driven by underlying performance and cost savings across all three business segments. CEO Vincent Chong called it \"the strongest first-half results\" on record. Revenue rose 11.1 per cent to S$6.57 billion, up 14 per cent on a rebased basis. Unit opex margin fell to 9.1 per cent, aided by AI-enabled efficiency, with procurement and productivity savings exceeding S$150 million. EPS was S$0.1643; an interim dividend of S$0.05 was declared, up from S$0.04. The order book stood at S$35.7 billion, with an US$11 billion international defence pipeline on track. Counter-drone demand is rising from Middle East and Ukraine fighting. Shares closed 0.78 per cent higher at S$10.28.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/ST%20Engineering%20H1%20net%20profit%20rises%2027.1%20to%20S512.1%20million%20on%20strong%20segment%20growth.pdf"}, {"id": "bt-20", "title": "Sembcorp raises interim dividend despite 72% H1 profit slide to S$150 million on Alinta deal costs", "source": "BT", "date": "14 Aug 2026", "tags": ["Energy", "Finance & Markets"], "summary": "Sembcorp Industries' H1 earnings fell 72 per cent to S$150 million, hit by S$155 million in Alinta acquisition costs, an S$57 million forex loss and lower contributions from gas, renewables and urban solutions. EPS dropped to 8.43 cents from 30.13 cents. Turnover rose 28 per cent to S$3.8 billion on higher Singapore energy prices and Alinta's June inclusion. Excluding exceptionals, underlying net profit fell 25 per cent to S$369 million. Renewables profit nearly halved to S$69 million on weaker wind and solar and China curtailment. Despite the slide, Sembcorp raised its interim dividend 22 per cent to S$0.11. CEO Wong Kim Yin cited a \"tsunami of AI and data centre demand.\" Shares fell 2.3 per cent to S$5.59; MSCI also dropped it from its Singapore index.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Sembcorp%20raises%20interim%20dividend%20despite%2072%20H1%20profit%20slide%20to%20S150%20million%20on%20Alinta%20deal%20costs.pdf"}, {"id": "bt-21", "title": "UAE says Iran attacked two ADNOC vessels in Strait of Hormuz; no injuries", "source": "BT", "date": "14 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "Abu Dhabi National Oil Company said two of its vessels were attacked while transiting the Strait of Hormuz on the evening of Aug 13, with no injuries, as the UAE accused Iran of carrying out the attack. It was the second such incident involving ADNOC vessels in under a week, after the UAE condemned a Saturday attack on a company-linked vessel. ADNOC said the situation was under control. The UAE Foreign Ministry called it a \"hostile Iranian attack\" and accused Iran's Revolutionary Guards of \"acts of piracy\" that threaten regional stability and energy security. Iran's Foreign Ministry and the IRGC did not immediately comment. About a fifth of the world's oil and LNG passed through the waterway before the US-Israeli war with Iran that broke out on Feb 28.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/UAE%20says%20Iran%20attacked%20two%20ADNOC%20vessels%20in%20Strait%20of%20Hormuz%20no%20injuries.pdf"}, {"id": "bt-22", "title": "UMS Integration Q2 profit up 89% buoyed by AI 'super cycle', aviation boom", "source": "BT", "date": "14 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Semiconductor company UMS Integration posted an 89 per cent jump in Q2 FY2026 net profit to S$19.4 million, with revenue up 29 per cent to S$87.1 million. CEO Andy Luong cited a \"stellar performance\" driven by the AI \"super-cycle\" and sustained aviation boom. For H1, net profit rose 66 per cent to S$33.4 million and revenue climbed 25 per cent to S$156.5 million; semiconductor sales grew 25 per cent to S$134.5 million and aerospace 37 per cent to S$15.8 million. By market, Singapore rose 18 per cent, Malaysia 50 per cent and South Korea 317 per cent. UMS declared a second interim dividend of S$0.01. Luong flagged robust customer demand forecasts for 2026-2027 and new facilities in Malaysia and Vietnam. Shares closed 5.1 per cent higher at S$2.70.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/UMS%20Integration%20Q2%20profit%20up%2089%20buoyed%20by%20AI%20'super%20cycle',%20aviation%20boom.pdf"}, {"id": "bt-23", "title": "US producer prices unchanged in July", "source": "BT", "date": "14 Aug 2026", "tags": ["Finance & Markets"], "summary": "US producer prices were unchanged in July as goods prices declined, though a rise in services costs suggested inflation could stay elevated, the Bureau of Labor Statistics said on Aug 13. The flat reading in the Producer Price Index for final demand followed a revised 0.1 per cent June drop and undershot the 0.2 per cent rebound economists had forecast. Services rose 0.2 per cent while goods prices fell 0.7 per cent, though most data predated late-July oil price spikes. Over 12 months, the PPI rose 4.7 per cent, down from 5.5 per cent in June. Following July's job losses and mild consumer inflation, the report added to the case for the Fed to hold rates at its Sep 15-16 meeting. Core PCE was forecast up 3.3 per cent year-on-year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/US%20producer%20prices%20unchanged%20in%20July.pdf"}, {"id": "bt-24", "title": "US weekly jobless claims increase moderately, point to stable labour market", "source": "BT", "date": "14 Aug 2026", "tags": ["Finance & Markets"], "summary": "The number of Americans filing for unemployment benefits rose moderately last week, suggesting the labour market remains stable despite July's surprise job losses, the Labor Department said on Aug 13. Initial claims rose 9,000 to a seasonally adjusted 209,000 for the week ended Aug 8, above the 202,000 forecast. The government reported last week that nonfarm payrolls dropped 23,000 in July, with downward revisions to May and June. Claims are hovering at the lower end of this year's 189,000-230,000 range, and an NFIB survey showed small-business employment rebounding. Stability plus mild inflation could let the Fed hold rates in September; three FOMC members dissented last month, preferring a quarter-point hike. Continuing claims fell 22,000 to 1.777 million.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/US%20weekly%20jobless%20claims%20increase%20moderately,%20point%20to%20stable%20labour%20market.pdf"}, {"id": "bt-25", "title": "Which AI camp has Trump's ear now?", "source": "BT", "date": "14 Aug 2026", "tags": ["Technology & AI", "Politics"], "summary": "The second-term Trump administration's AI policy, initially built on deregulation and out-innovating China, has curdled into indecision, the commentary argues. The trigger was Anthropic's May 2026 disclosure of Mythos, a frontier system so capable at finding and exploiting software vulnerabilities that the company held back its release, reshaping the internal debate more than a year of safety advocacy. Reporting describes a White House split into three camps: accelerationists led by AI czar David Sacks; Pentagon officials under Pete Hegseth pushing constraints; and a middle faction around Susie Wiles and Scott Bessent. A delayed June executive order emerged \"light-touch,\" gesturing at oversight without enforcement. Officials met OpenAI, Anthropic, Google and Meta in early August on a safety framework not yet public. Key tests: enforcement teeth and the state pre-emption push.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Which%20AI%20camp%20has%20Trump's%20ear%20now.pdf"}, {"id": "scmp-01", "title": "'Very smooth': passenger shares experience on C919's first commercial international flight", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "Air China flight 723 became the first international service using Comac's domestically produced C919 narrowbody jet, flying 111 passengers from Beijing to Ulaanbaatar, Mongolia, on Wednesday in one hour 41 minutes, met by a water-cannon salute. Passenger Howard Deng said the flight felt \"basically no different\" from a Boeing 737 or Airbus A320, praising cabin layout and legroom, and hoped for more routes. Central to Beijing's ambition to challenge the Boeing-Airbus duopoly, the C919 now flies 58 routes linking 26 cities via China's three biggest airlines. Analyst Li Hanming cautioned that without EASA or FAA certification and with low output, it remains reliant on foreign components. Comac delivered just 15 units in 2025 against a 75 target, aiming for 28-plus this year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/'Very%20smooth'%20passenger%20shares%20experience%20on%20C919's%20first%20commercial%20international%20flight.pdf"}, {"id": "scmp-02", "title": "AI demand drives triple-digit profit growth for Chinese chip foundries SMIC, Hua Hong", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "China's top two contract chipmakers, SMIC and Hua Hong Grace, posted second-quarter net profit surges of 261.7 per cent and 385.9 per cent year on year, to US$479.2 million and US$38.6 million respectively, amid spiking demand for domestic AI chips free of US export controls. SMIC's revenue rose 36 per cent to US$3 billion; Hua Hong reached a record US$717.5 million, up 26.8 per cent. Foundries are running plants at full capacity to meet domestic needs. Chairman Bai Peng expects price increases to continue and high demand to persist into 2027. SMIC guided third-quarter revenue of US$3.06-3.12 billion. UBS analysts see AI chip fabrication as a secular driver with a total addressable market \"far north of US$10 billion\". Lenovo shares jumped 20 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/AI%20demand%20drives%20triple-digit%20profit%20growth%20for%20Chinese%20chip%20foundries%20SMIC,%20Hua%20Hong.pdf"}, {"id": "scmp-03", "title": "Alibaba adds commercial restrictions to open-weight Qwen3.8-Max AI model", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Technology & AI"], "summary": "Alibaba made the core files of its flagship Qwen3.8-Max model free to download but introduced rules requiring large companies to pay for a separate commercial licence. The terms apply to users running a \"model as a service\" or \"AI work assistant\" business whose aggregate revenue exceeds US$50 million over any 12-month period; internal use is exempt. Releasing the weights of the 2.4-trillion-parameter model marks a shift from keeping Max models proprietary. Paid API access costs 12 yuan per million input tokens in China, or US$2 internationally, roughly 40 per cent of Anthropic's Claude Opus 5 input rate. The move echoes Moonshot AI's Kimi K3 terms. Goldman Sachs raised its China AI model market forecast 30 per cent to US$13 billion. Alibaba owns the Post.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Alibaba%20adds%20commercial%20restrictions%20to%20open-weight%20Qwen3.8-Max%20AI%20model.pdf"}, {"id": "scmp-04", "title": "As China deepens reforms, Zhu Rongji's legacy serves as an inspiration", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Politics", "Finance & Markets"], "summary": "This editorial marks the death of former premier Zhu Rongji at 97, casting his reforms as a template as China deepens change today. As vice-premier and premier between 1991 and 2003, Zhu transformed a centrally planned economy into a \"socialist market economy\", restructured state-owned enterprises despite job cuts and public anger, overhauled the tax system, and secured China's 2001 WTO accession after negotiating with the Clinton administration. He famously vowed \"100 coffins\", 99 for corrupt officials, in an anti-corruption fight. Zhu strongly backed Hong Kong during the 1997 Asian financial crisis, supporting its US-dollar peg and refusing to devalue the yuan. His death coincides with the centenary of Jiang Zemin's birth on August 17; the pair shared a Shanghai leadership background.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/As%20China%20deepens%20reforms,%20Zhu%20Rongji's%20legacy%20serves%20as%20an%20inspiration.pdf"}, {"id": "scmp-05", "title": "Beijing's offshore insurance tax tests Hong Kong wealth management", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "Reports that China is enforcing a 20 per cent tax on investment returns from offshore insurance policies held by mainland residents rattled markets, sending Prudential, HSBC and AIA shares lower. Early enforcement cases reportedly emerged in Beijing and Hangzhou. China's State Taxation Administration said the rate is not new, does not specifically target Hong Kong, and urged against overreaction. Offshore policies have long served affluent Chinese families as investment, US-dollar savings and estate-planning tools; mainland visitors generated HK$62.8 billion in new business in 2024, 28.6 per cent of the city's individual premiums. The OECD Common Reporting Standard has reduced offshore opacity. The commentary argues more transparent, systematic cross-border oversight could ultimately strengthen Hong Kong's credibility as a wealth management centre rather than weaken it.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Beijing's%20offshore%20insurance%20tax%20tests%20Hong%20Kong%20wealth%20management.pdf"}, {"id": "scmp-06", "title": "CK Hutchison Holdings reports 31-fold surge in first-half profit", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Trade"], "summary": "CK Hutchison Holdings, a flagship of Li Ka-shing's family, reported a 3,046 per cent jump in first-half profit to HK$26.8 billion (US$3.4 billion) from HK$852 million a year earlier, driven by HK$14.2 billion in one-time items, including HK$17.75 billion in gains from disposing of UK Rails and UK Power Networks. Underlying profit rose 7 per cent to HK$12.58 billion; revenue was HK$255.4 billion. Chairman Victor Li called the global environment \"exceptionally turbulent and uncertain\". The interim dividend rose to 74.55 HK cents. Ports revenue rose 4 per cent to HK$24.52 billion, aided by additional transshipment at Oman's Sohar amid Strait of Hormuz disruption. Sister firm CK Asset's net profit rose about 38 per cent to HK$8.68 billion.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/CK%20Hutchison%20Holdings%20reports%2031-fold%20surge%20in%20first-half%20profit.pdf"}, {"id": "scmp-07", "title": "CK Hutchison says 'forced termination' of Panama ports cut 1% off throughput", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Trade", "Geopolitics"], "summary": "CK Hutchison for the first time quantified the impact of losing two strategic Panama Canal ports, saying the \"forced termination\" of Balboa and Cristobal operations shaved 1 per cent off overall throughput in the first half. Total throughput fell 1 per cent to 43.6 million TEUs; excluding Panama, throughput rose 3 per cent, fuelled by Shenzhen's Yantian, Shanghai and other Asian terminals. Panama's government took over the terminals on February 23 after a Supreme Court ruling annulled the concession. CK Hutchison, which held a 90 per cent stake in Panama Ports Company, is seeking at least US$2 billion in damages via ICC arbitration, calling it an \"illegal takeover\". Despite the loss, port EBITDA rose 4 per cent to HK$9.03 billion; the division expects full-year earnings growth.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/CK%20Hutchison%20says%20'forced%20termination'%20of%20Panama%20ports%20cut%201%20off%20throughput.pdf"}, {"id": "scmp-08", "title": "China's STEM students turn to Singapore as Western study options shrink", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Society", "Southeast Asia"], "summary": "Escalating US-China tech competition and tightening immigration in the \"big four\" destinations, Australia, Canada, the UK and the US, are redirecting China's top STEM students toward Singapore. State-backed scholarships like the Senior Middle 2 (SM2) programme, launched in 1997, fund undergraduate science and engineering study at NUS and NTU in exchange for a six-year work commitment. Chinese enrolment in the US fell to nearly 266,000 in 2024-25, down 28 per cent from a 2018-19 peak, deterred partly by Proclamation 10043. Singapore ranks second among 28 study-abroad destinations for Chinese students. Experts including Denis Simon call Singapore a \"talent arbitrage hub\" and \"early-stage talent pipeline\" absorbing displaced mobility into its skilled workforce. Analysts note studying abroad has become politically sensitive within China amid espionage fears.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/China's%20STEM%20students%20turn%20to%20Singapore%20as%20Western%20study%20options%20shrink.pdf"}, {"id": "scmp-09", "title": "China's YMTC breaks into global top 3 flash-memory suppliers with 14% market share", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Yangtze Memory Technologies (YMTC) broke into the world's top three NAND flash memory suppliers by volume for the first time, capturing 14 per cent of global bit shipments in the second quarter and narrowly overtaking Japan's Kioxia, according to Counterpoint Research. Samsung led with 25 per cent and SK Hynix followed at 22 per cent. YMTC's shipments rose 22 per cent year on year, driven by domestic demand and its latest 3D NAND. Despite the volume gain, YMTC ranked only fifth by revenue due to heavy exposure to lower-margin consumer products and a small enterprise SSD footprint. Enterprise SSDs hit 48 per cent of NAND bit shipments as AI shifts toward inference. YMTC plans to add about 35,000 wafers monthly this year despite US restrictions.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/China's%20YMTC%20breaks%20into%20global%20top%203%20flash-memory%20suppliers%20with%2014%20market%20share.pdf"}, {"id": "scmp-10", "title": "Chinese banks test repo-linked corporate loans to make pricing more market-based", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Finance & Markets"], "summary": "Chinese banks are testing a new way of pricing corporate loans against short-term market funding costs, shifting toward the overnight or seven-day depository-institutions repo rate (DR) from the monthly loan prime rate (LPR), following Beijing's June decision to change lending benchmarks. Unlike LPR, DR derives from actual interbank transactions, more directly reflecting funding costs. Bank of China rolled out DR-linked loans across several provinces and launched the market's first with daily repricing. China Merchants Bank, Bank of Shanghai, ICBC and Minsheng have all extended DR-benchmarked facilities. Analyst Zhang Lin warned DR raises interest-rate volatility and \"the bar for pricing and risk management\". The PBOC said it would refine its short-term rate framework. The move mirrors the US SOFR and UK Sonia benchmarks.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Chinese%20banks%20test%20repo-linked%20corporate%20loans%20to%20make%20pricing%20more%20market-based.pdf"}, {"id": "scmp-11", "title": "Chinese carmakers could capture 15% to 30% of European market by 2035: Citi analysts", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Trade", "Finance & Markets"], "summary": "Chinese carmakers could capture 15 to 30 per cent of the European auto market by 2035, up from roughly 10 per cent this year, Citi analysts led by Harald Hendrikse said, with the outcome hinging on EU tariffs and made-in-EU rules. Current rules allow 30 per cent (base case); extending EV tariffs to plug-in hybrids caps it at 25 per cent; a \"made in Europe\" requirement in the proposed Industrial Accelerator Act would cut it to 15 per cent. Chinese share in western Europe surged to 10 per cent in April, led by BYD and MG. Citi warned European makers face a decade of volume losses, with Volkswagen shedding over 500,000 units by 2035. The premium segment stays relatively protected. Chinese gains concentrate in mid-size electric and plug-in hybrid SUVs.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Chinese%20carmakers%20could%20capture%2015%20to%2030%20of%20European%20market%20by%202035%20Citi%20analysts.pdf"}, {"id": "scmp-12", "title": "Chinese missile AI tracks F-22, F-35-like heat signatures with over 90% accuracy", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Defence", "Technology & AI"], "summary": "Chinese researchers created a lightweight AI system to help heat-seeking air-to-air missiles identify stealth fighters, demonstrating high accuracy in laboratory tests against mock-up F-22 and F-35 targets. The system exploits distinct infrared signatures from engine exhaust and air friction, rendering decoy flares less effective. Published in the Journal of Electronic Measurement and Instrumentation, the study involved the Beijing Institute of Technology, the China Airborne Missile Academy and a near-surface detection lab. First author An Jiangshan said recognition reached 97.1 per cent in testing and about 90 per cent for simulated targets, using a low-cost Zynq7020 platform costing only a few hundred yuan. The lightweight model slashed parameters to 16.1 per cent of prior methods, with 1.5-millisecond inference and 2.2-watt power. Effects on surface-to-air missiles remain unverified.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Chinese%20missile%20AI%20tracks%20F-22,%20F-35-like%20heat%20signatures%20with%20over%2090%20accuracy.pdf"}, {"id": "scmp-13", "title": "Hong Kong to reappoint insurance regulator as industry braces for tough period: sources", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "Hong Kong's government is set to reappoint Clement Cheung Wan-ching as Insurance Authority CEO on Friday for another three-year term, two sources said, to ensure continuity as the industry faces headwinds from Beijing's offshore tax clampdown. Cheung, 64, has led the regulator since 2018, overseeing record life insurance sales as mainlanders and wealthy Asian families bought policies. However, some local authorities began levying a 20 per cent tax on gains from offshore insurance policies this month. Life insurance sales soared 51 per cent in the first quarter to a record HK$141.1 billion, with mainland buyers about 25 per cent of sales. Hong Kong is the world's 12th-largest insurance market, with US$99 billion in 2025 premiums, up 31 per cent. Cheung is a career civil servant who joined government in 1983.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Hong%20Kong%20to%20reappoint%20insurance%20regulator%20as%20industry%20braces%20for%20tough%20period%20sources.pdf"}, {"id": "scmp-14", "title": "Indonesia eyes mass production of home-grown EVs by 2028", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Southeast Asia", "Energy"], "summary": "Indonesia hopes to start mass production of home-grown electric cars no later than 2028, President Prabowo Subianto said, aiming to boost EV adoption in Southeast Asia's largest economy. The government is building a factory complex in the Subang region of West Java, a 60-hectare development targeting up to 50,000 vehicles annually, later expanding to a 539-hectare facility with capacity for up to 300,000 vehicles per year. Prabowo announced the target at the launch of a national electric motorcycle programme spanning manufacturing, batteries, charging and after-sales. State lenders will offer cheap vehicle loans, and Jakarta is weighing a trade-in scheme, a 5 million rupiah (US$279.80) subsidy per electric motorcycle up to 500,000 units, and VAT exemptions. Indonesia targets 13 million electric motorcycles and 2 million electric cars by 2030.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Indonesia%20eyes%20mass%20production%20of%20home-grown%20EVs%20by%202028.pdf"}, {"id": "scmp-15", "title": "MTR Corp's profit more than doubles to HK$15.8 billion on property gains", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Finance & Markets"], "summary": "Hong Kong's rail operator MTR Corp more than doubled first-half net profit to HK$15.87 billion (US$2 billion) from HK$7.70 billion a year earlier, as strong property development gains offset flat rail and commercial operations. Property-development profit jumped 120.7 per cent to HK$12.23 billion, driven by Tai Wai station and Wong Chuk Hang projects, though CEO Jeny Yeung cautioned these are \"one-off and non-recurring\". Revenue fell 4.1 per cent to HK$26.23 billion, and Hong Kong transport operations swung to a HK$141 million loss amid frozen fares and higher depreciation. The interim dividend held at 42 HK cents. MTR is pursuing a HK$140 billion capital commitment for seven rail projects and raised HK$58 billion via bonds; the Northern Link is due by 2034.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/MTR%20Corp's%20profit%20more%20than%20doubles%20to%20HK15.8%20billion%20on%20property%20gains.pdf"}, {"id": "scmp-16", "title": "Northern Metropolis: Hong Kong seeks interest in land parcels for logistics hub", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Trade", "Politics"], "summary": "Hong Kong authorities invited expressions of interest to develop land parcels set aside for a modern logistics cluster under the Northern Metropolis megaproject, seeking industry views on development terms and land disposal. The 32-hectare cluster in the Hung Shui Kiu/Ha Tsuen New Development Area is split into five functional zones spanning high-value goods logistics, e-commerce, freight forwarding, low-altitude economy and a transit depot. Officials cited its proximity to the Shenzhen Bay checkpoint, airport and Kwai Tsing container terminals. Zone B parcels could be available by late 2027 or early 2028; submissions are due by November 13. The Northern Metropolis, announced in 2021, aims to transform 30,000 hectares near the mainland border. The push follows a setback when the flagship Hung Shui Kiu project drew only two bids.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Northern%20Metropolis%20Hong%20Kong%20seeks%20interest%20in%20land%20parcels%20for%20logistics%20hub.pdf"}, {"id": "scmp-17", "title": "PAS' latest sharia law push signals its Malaysian federal power ambition", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Southeast Asia", "Politics"], "summary": "Malaysia's Islamist party PAS is setting an early pace ahead of national polls after the Kelantan state assembly it dominates unanimously passed amendments to the Syariah Offences Enactment Bill, seeking to circumvent constitutional barriers. In 2024 the federal court struck down 16 provisions as unconstitutional for overlapping common law; the new amendments use broader terminology. Analysts say the move matters less as law than as a signal to Malay-Muslim voters that PAS is committed to Islamic values. PAS became parliament's largest party in 2022, winning 43 of 222 seats on a \"green wave\". It is within striking distance of federal power via its Umno alliance, which recently won Negeri Sembilan. Analysts warn the messaging alienates non-Malay minorities PAS needs; polls must be held by early 2028.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/PAS'%20latest%20sharia%20law%20push%20signals%20its%20Malaysian%20federal%20power%20ambition.pdf"}, {"id": "scmp-18", "title": "Russia warns of 'chaos' in global food market after Ukraine pummels grain terminals", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Geopolitics", "Trade"], "summary": "Three of Russia's largest grain terminals in the Black Sea port of Novorossiysk halted operations after a massive overnight Ukrainian drone attack, making grain shipments currently impossible due to serious infrastructure damage. A loading gallery at United Grain's plant collapsed and silos were damaged. Russia and Ukraine account for over a quarter of global wheat exports, and Chicago wheat futures jumped as much as 4 per cent. Foreign ministry spokeswoman Maria Zakharova accused Kyiv of a campaign to \"incite chaos in the global food market\" serving Western interests. A state of emergency was declared in Novorossiysk, home to oil terminals and a naval base. President Zelensky said missiles targeted the Black Sea fleet's stronghold. Kpler analysts said Russian and Ukrainian exports will fall sharply this month.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Russia%20warns%20of%20'chaos'%20in%20global%20food%20market%20after%20Ukraine%20pummels%20grain%20terminals.pdf"}, {"id": "scmp-19", "title": "Satellite images show 50 per cent boost to China's Type 054B missile capacity", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Defence"], "summary": "Satellite images suggest China is adding vertical launch system (VLS) capacity to its most advanced guided-missile frigate, the Type 054B under construction in Shanghai, allowing a larger missile reserve and stronger anti-air defence. Images taken by US firm Vantor on June 28 show a six-unit structure at the bow, implying 48 VLS cells versus the 32 on the first two in-service vessels, a 50 per cent boost. Military commentator Song Zhongping said increasing cell count directly boosts anti-saturation defence and combat capability, calling the upgrade \"entirely plausible\". The VLS launches HHQ-16 surface-to-air missiles and Yu-8 anti-submarine torpedoes. The estimated 5,000-tonne frigate uses AI for near-zero air-defence blind spots. The first two ships, Luohe and Qinzhou, were commissioned last year and have deployed with the Liaoning carrier and near Scarborough Shoal.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Satellite%20images%20show%2050%20per%20cent%20boost%20to%20China's%20Type%20054B%20missile%20capacity.pdf"}, {"id": "scmp-20", "title": "Saudi-Turkey-Pakistan Mecca pact 'far from' Nato-style defence alliance", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "The Mecca Joint Defence Agreement signed by Saudi Arabia, Turkey and Pakistan remains far from an \"Islamic Nato\" because of diverging strategic interests and weak mutual defence capacity, experts said. The pact holds that an armed attack on one is an attack on all, echoing Nato's Article 5, but Turkey's Hakan Fidan stressed it is not directed against Iran. Tehran appeared unfazed, framing it as a response to Israel and declining confidence in US guarantees. Analyst Tang Tianbo called it \"still far from a Nato-style military alliance\", noting past attempts were \"long on rhetoric and short on action\". Niu Xinchun said establishing functional mutual defence was \"extremely slim\", citing the lack of a unified command. Earlier Gulf and \"Arab Nato\" initiatives fizzled amid regional tensions.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Saudi-Turkey-Pakistan%20Mecca%20pact%20'far%20from'%20Nato-style%20defence%20alliance.pdf"}, {"id": "scmp-21", "title": "Trump orders US aircraft carriers to go back to steam catapults", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Defence", "Politics"], "summary": "President Donald Trump ordered the US Navy to return to steam catapults to launch planes off aircraft carriers, acting on a long-time complaint despite opposition from many naval officers. In a presidential memorandum, Trump directed Defence Secr
