oomberg data showed over 20,000 trades in 10-share lots versus more than 13,000 in 100-share lots. JMH saw the strongest adoption, with about a third of its trades in 10-share lots, and 55% of trades in the 11 stocks were below the old 100-share lot. Eight of the 11 had higher average daily turnover than on Oct 2, and SGX said liquidity stayed broadly stable despite softer market-wide trading.", "url": "https://www.businesstimes.com.sg/companies-markets/dbs-tops-trades-smaller-board-lots-debut-revised-sgx-framework"}, {"id": "bt-07oct-08", "title": "Gold liquidity deep enough for Asian, Western hubs to coexist, Hong Kong and Singapore say", "source": "BT", "date": "07 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Hong Kong and Singapore representatives told the LBMA's conference on Oct 6 that global gold liquidity is deep enough for Asian hubs to grow alongside Western centres, amid Western worries about competition with the London bullion market. Hong Kong plans the first central clearing and settlement system for gold in early 2027 and over 2,000 metric tons of storage within two years; Christopher Hui, secretary for financial services and the treasury, said details of renminbi physically delivered gold futures are due towards year-end. Singapore, with over 2,000 tonnes of commercial vaulting capacity, is starting central bank gold-vaulting services this month and establishing an OTC gold clearing system. MAS's Lim Cheng Khai cited strong growth in Asian gold demand, saying both hubs aim to \"complement price discovery in the Asian time zone\".", "url": "https://www.businesstimes.com.sg/companies-markets/energy-commodities/gold-liquidity-deep-enough-asian-western-hubs-coexist-hong-kong-and-singapore-say"}, {"id": "bt-07oct-09", "title": "Hong Kong property developer New World seeks more time to pay bonds with exchange offer", "source": "BT", "date": "07 Oct 2026", "tags": ["Finance & Markets"], "summary": "Hong Kong developer New World Development launched a debt exchange offer on Oct 6 letting bondholders swap notes due 2027 and 2028 for new secured debt maturing in 2032, to ease near-term repayment pressure. A new unit, New VD BondCo, plans to issue up to US$600 million of 7.375% senior secured notes due 2032 in exchange for three US dollar note series with about US$991 million outstanding. New World, one of the city's most indebted developers, is grappling with tight credit conditions and a prolonged property downturn; it said the offer, which expires on Oct 20, is intended to optimise its debt maturity profile. Last week it expanded a loan facility by around HK$1 billion and terminated its operating rights for a shopping mall next to Hong Kong International Airport.", "url": "https://www.businesstimes.com.sg/companies-markets/reits-property/hong-kong-property-developer-new-world-seeks-more-time-pay-bonds-exchange-offer"}, {"id": "bt-07oct-10", "title": "Middle East oil flows of around 14 million barrels a day help avert US$200-a-barrel oil: Vitol CEO", "source": "BT", "date": "07 Oct 2026", "tags": ["Energy", "Finance & Markets"], "summary": "Vitol CEO Russell Hardy said on Oct 6 that about 12 million bpd of crude and 2 million bpd of refined products had left the Middle East by tanker over the past 7 to 10 days, helping balance markets into winter as Western inventories are largely drained. Without that flow, he told the Energy Intelligence Forum, \"you do have that US$200 per barrel scenario\". He said this year's disruptions had moved from crude to products to shipping, and refined-product tightness will roll into winter as hits on Russian infrastructure and five lost months of Middle East refining runs leave the world short of capacity. He said diesel from the G7's 100 million-barrel strategic reserve release, agreed last week, will give Europe some relief; Brent traded around US$98 on Oct 6.", "url": "https://www.businesstimes.com.sg/companies-markets/energy-commodities/middle-east-oil-flows-around-14-million-barrels-day-help-avert-us200-barrel-oil-vitol-ceo"}, {"id": "bt-07oct-11", "title": "Scalability of digital assets hinges on ‘boring’ risk-management systems: summit participants", "source": "BT", "date": "07 Oct 2026", "tags": ["Finance & Markets", "Technology & AI", "Southeast Asia"], "summary": "Speakers at the Digital Assets Summit 2026, hosted by the Digital Assets Association (DAA) Singapore at SGX Centre on Oct 6, said digital finance's next stage hinges on innovating and scaling while managing risk. DAA co-chair Danny Chong said the harder question is whether functioning markets can be built around tokenised assets, adding \"the boring parts are usually where the real markets are built\". Senior Minister of State in the Prime Minister's Office Desmond Tan said tokenisation and distributed ledgers can cut friction but relocate rather than eliminate risk, and National Research Foundation chairman Heng Swee Keat said digital finance is at a very early stage. SGX chief risk officer Ivan Han said sound risk management is not at odds with innovation, as institutions commit capital when they understand the risk.", "url": "https://www.businesstimes.com.sg/companies-markets/scalability-digital-assets-hinges-boring-risk-management-systems-summit-participants"}, {"id": "bt-07oct-12", "title": "Singapore firms’ payment delays worsen for third straight quarter in Q3: SCCB", "source": "BT", "date": "07 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Slow payments by Singapore companies rose for a third straight quarter in Q3 2026 to 44.47% of payment transactions, up 0.02 percentage point on the quarter and 0.01 point on the year, Singapore Commercial Credit Bureau (SCCB) data released on Oct 6 showed. Prompt payments edged up 0.01 point to 41.05%, while partial payments fell 0.03 point to 14.48%. Construction had the highest share of slow payments at 55.88% after a fourth straight quarterly rise, manufacturing rose for a fourth quarter to 39.99% and retail for a third to 43.36%, while services and wholesale trade improved. SCCB CEO Audrey Chia said the continuous rise underscores \"the lingering cash-flow pressures faced by local companies\".", "url": "https://www.businesstimes.com.sg/companies-markets/singapore-firms-payment-delays-worsen-third-straight-quarter-q3-sccb"}, {"id": "bt-07oct-13", "title": "South Korea investigates possible use of AI in hacks on its banks", "source": "BT", "date": "07 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "South Korean officials are investigating whether AI agents were involved in recent hacks on the country's banks, with President Lee Jae Myung saying on Oct 6 that \"signs have emerged\" AI models were used in some attacks; no details were given on who was behind them. Lee told his Cabinet to confirm what happened swiftly; Yonhap reported the National Office of Investigation has opened an inquiry into cyberattacks on financial firms including Hana Bank, KB Kookmin Bank and Shinhan Bank. Shinhan said personal credit information of about 25,000 people had leaked, while Hana and Kookmin reported 89 and 99 customers affected, plus 20 current or former Kookmin employees. Australian officials last month disclosed government website breaches, including a June incident in which OpenAI agents infiltrated a public health insurance data portal.", "url": "https://www.businesstimes.com.sg/international/south-korea-investigates-possible-use-ai-hacks-its-banks"}, {"id": "scmp-07oct-01", "title": "After cordial Xi-Trump summit, could China’s US dollar pivot cause tremors?", "source": "SCMP", "date": "07 Oct 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "An SCMP analysis says China's gradual shift from US dollar assets loomed over last month's Xi-Trump summit, with its US Treasury holdings at an 18-year low of US$618 billion in July. Beijing is also widening yuan use and alternative payment rails, with CIPS transactions up 11.9% year on year to 100.9 trillion yuan (US$14.9 trillion) in the first half, per the People's Bank of China. Analysts including Fudan University's Charles Chang call it a defensive safety net, not a bid to replace the dollar, which held 56.7% of global central bank reserves in Q2 versus the yuan's 2.11%, per the IMF. Natixis' Alicia Garcia-Herrero warns parts of Washington will treat even a regional yuan system as a strategic threat, which could bring greater scrutiny of CIPS links and correspondent banks.", "url": "https://www.scmp.com/economy/global-economy/article/3369918/after-cordial-xi-trump-summit-could-chinas-us-dollar-pivot-cause-tremors"}, {"id": "scmp-07oct-02", "title": "As China’s AI race accelerates, ‘model fatigue’ becomes the next challenge", "source": "SCMP", "date": "07 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "An SCMP analysis says China's AI sector is suffering an intensified form of \"model fatigue\", with upgrades arriving so fast that individual breakthroughs struggle for attention. On Sept 22 alone, Xiaomi live-streamed training of its MiMo-V2.6 model, Anthropic unveiled Opus 5.5 and OpenAI released GPT-6 Sol and Luna. Analysts say the burden in China falls more heavily on developers through price wars: DeepSeek cut V4.1 Flash API prices to as low as 0.02 yuan per million cached input tokens off-peak, and Alibaba's Qwen3.8-Flash charges 1 yuan per million input tokens. Tech Buzz China's Rui Ma says firms are carving out niches, such as ByteDance in video generation and Ant Group in healthcare; the piece adds that calls to slow down, including from Anthropic CEO Dario Amodei, have met strong resistance from Chinese researchers and state media commentators.", "url": "https://www.scmp.com/tech/big-tech/article/3369757/chinas-ai-race-accelerates-model-fatigue-becomes-next-challenge"}, {"id": "scmp-07oct-03", "title": "Beijing’s policy advisers map out how post-reunification Taiwan could be governed", "source": "SCMP", "date": "07 Oct 2026", "tags": ["Geopolitics", "Politics"], "summary": "Leading mainland Chinese research institutes have finalised or nearly completed the first proposals for governing Taiwan after reunification, the SCMP has learned, seven years after Xi Jinping called for such plans in 2019. Tsinghua and Xiamen universities finished studies this year and Peking University's is close to completion, according to academic sources; the unpublished studies are not official policy. Scholars say autonomy would hinge on how reunification is achieved: Xiamen University's Chen Xiancai says a peaceful deal could leave Taiwan more room than Hong Kong and Macau, while \"compelled reunification\" through pressure, possibly including a blockade, could mean a Hong Kong- or Macau-style model or less. More than 80% of people in Taiwan oppose the one country, two systems formula, according to an August Mainland Affairs Council poll.", "url": "https://www.scmp.com/news/china/politics/article/3369782/beijings-policy-advisers-map-out-how-post-reunification-taiwan-could-be-governed"}, {"id": "scmp-07oct-04", "title": "China’s economy to slow as global growth stays solid, US think tank report says", "source": "SCMP", "date": "07 Oct 2026", "tags": ["Finance & Markets", "Trade"], "summary": "The Peterson Institute for International Economics (PIIE) projects China's growth will slow to 4.6% this year and 4.3% in 2027, from 5% in 2025, as export strength fades and weak domestic demand persists, according to its semi-annual Global Economic Prospects report released on Oct 6. The 2026 forecast is up from 4.5% in April, but the tone has shifted: the spring report called Chinese exports strong, while senior fellow Karen Dynan now expects the export boom to fade as trade restrictions increase. PIIE sees world growth of 3.2% this year and 3.1% next year despite the war with Iran, and US growth of 2.3% and 2.2%, propelled by the AI boom. Dynan also predicted three more Fed rate hikes in the coming months amid inflation concerns.", "url": "https://www.scmp.com/news/china/diplomacy/article/3369965/chinas-economy-slow-global-growth-stays-solid-us-think-tank-report-says"}, {"id": "scmp-07oct-05", "title": "Hong Kong land sale stuns market as HK$4.3b bid hits 5-year Kowloon high", "source": "SCMP", "date": "07 Oct 2026", "tags": ["Finance & Markets"], "summary": "Kerry Properties won a residential site on Fat Kwong Street in Ho Man Tin for HK$4.31 billion (US$549 million), the highest price paid for a Kowloon residential site in nearly five years, signalling developer confidence in luxury home demand. The price of HK$20,738 per square foot of gross floor area was 38% above the top market estimate of HK$15,000; the last Kowloon residential site above HK$20,000 per square foot was Lai Sun Development's Broadcast Drive purchase at HK$22,465 in October 2021. The government received 10 tenders for the plot, expected to hold around 250 flats, and Centaline Surveyors' James Cheung King-tat says the homes would need to sell at nearly HK$40,000 per square foot of saleable area. Kerry has bought four sites for a combined HK$6.47 billion this year.", "url": "https://www.scmp.com/business/article/3369948/hong-kong-land-sale-stuns-market-hk43b-bid-hits-5-year-kowloon-high"}, {"id": "scmp-07oct-06", "title": "Hong Kong’s bridge of gold completes China’s yuan ambition", "source": "SCMP", "date": "07 Oct 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "An SCMP opinion piece in a series on Beijing's gold push argues Hong Kong is becoming the offshore vaulting and delivery point in a gold-backed route to yuan internationalisation, with Shanghai the pricing and clearing centre. The writer notes gold is under 10% of China's US$3.4 trillion reserves, versus 65-75% for the US, Germany, France and Italy, and that China has imported over 1,000 tonnes so far this year. Yuan-denominated gold contracts in Shanghai and Hong Kong vaults let partners such as Brics nations and Middle Eastern oil exporters convert yuan into physical gold, making yuan far less risky to accept, the piece says. It cites Hong Kong's plan to lift gold storage capacity tenfold to 2,000 tonnes by 2028 and HKEX's yuan-denominated gold futures contract, due early next year.", "url": "https://www.scmp.com/opinion/hong-kong-opinion/article/3369468/hong-kongs-bridge-gold-completes-chinas-yuan-ambition"}, {"id": "scmp-07oct-07", "title": "Nvidia-backed Reflection AI challenges Chinese dominance in open-weight models", "source": "SCMP", "date": "07 Oct 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "Nvidia-backed US start-up Reflection AI on Oct 5 debuted Beam, its first open-weight model for coding, reasoning and agentic tasks, aiming to challenge China's dominance in freely available AI. Reflection says the mixture-of-experts model activates 23 billion of 501 billion parameters per task, needs three to four times less inference compute than comparable open models and is competitive with Z.ai's GLM-5.2, though Moonshot AI's Kimi K3 stays ahead in raw capability. Founded by former Google DeepMind researchers, Reflection has raised over US$4 billion since its 2024 launch and hit a US$25 billion valuation before releasing its first model; Nvidia backed it with US$800 million and chip access. Beam is in final red-teaming, with weights due later this month; meanwhile, Amazon said on Oct 5 that AWS had added Z.ai's GLM-5.3 to Amazon Bedrock.", "url": "https://www.scmp.com/tech/tech-trends/article/3369885/nvidia-backed-reflection-ai-challenges-chinese-dominance-open-weight-models"}, {"id": "scmp-07oct-08", "title": "Saudi-Iran war risk grows as Riyadh resumes Yemen bombing", "source": "SCMP", "date": "07 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "An SCMP analysis, citing analysts, says Saudi Arabia and Iran are edging toward direct conflict after more than 100 Saudi warplanes bombed Yemen's Houthis on Oct 5, ending a four-year lull and helping government forces retake much of the territory the Houthis seized last month. Pakistan and Turkey said they would deploy forces in Saudi Arabia under an August defence pact, Britain has agreed to provide air-to-air refuelling, French units are guarding Saudi oil-export infrastructure and the US reportedly sent over 100 military advisers. Analysts expect stepped-up Houthi drone and missile attacks, aided by Iran's Revolutionary Guards. King's College London's Andreas Krieg says Saudi strikes on embedded Iranian networks make it harder to keep the Saudi-Houthi war separate from the Saudi-Iranian confrontation, \"probably the most serious escalation risk over the coming weeks\".", "url": "https://www.scmp.com/week-asia/politics/article/3369933/saudi-iran-war-risk-grows-riyadh-resumes-yemen-bombing"}, {"id": "scmp-07oct-09", "title": "Trump says Iran could ‘take out’ Los Angeles or San Diego, drawing backlash", "source": "SCMP", "date": "07 Oct 2026", "tags": ["Politics", "Geopolitics"], "summary": "US President Donald Trump, discussing wartime economic sacrifices at a rally in Grand Island, Nebraska, on Oct 5, suggested Iran could take out a major US city: \"Let ’em take out Los Angeles, let ’em take out San Diego\". On Oct 6, White House Director of Communications Steven Cheung dismissed the criticism, saying Trump meant US cities would have been threatened had a nuclear Iran not been stopped. California Governor Gavin Newsom and Los Angeles Mayor Karen Bass, both Democrats, criticised the remark, and Republican Jim Desmond, running in a competitive district near San Diego, said he vehemently disagreed. The remark coincided with the start of early voting in California for the November midterms; San Diego hosts more than 115,000 active-duty service members.", "url": "https://www.scmp.com/news/world/united-states-canada/article/3369961/trump-says-iran-could-take-out-los-angeles-or-san-diego-drawing-backlash"}, {"id": "scmp-07oct-10", "title": "US firm to make battle-tested drones in Taiwan, boosting supply chain resilience", "source": "SCMP", "date": "07 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "California-based Aevex Aerospace is working with Taiwan's Coretronic Intelligent Robotics Corporation (CIRC) to produce its Ukraine-tested Vandal and Onyx drones locally, as the island seeks a \"drone shield\" against the People's Liberation Army. According to Aevex, the Vandal can carry a 4.5kg payload and fly more than 460km, and the larger Onyx can carry 13.6kg with a range exceeding 270km; both are designed to work when satellite navigation is degraded. CIRC chairwoman Ann Wu said capacity at its Zhunan plant could reach 4,000 aircraft a month depending on demand, and Aevex said local production could cut reliance on trans-Pacific resupply in a crisis. Economic affairs minister Kung Ming-hsin said on Oct 5 Taiwan needs more than 200,000 drones for deterrence, from a supply chain free of mainland Chinese products.", "url": "https://www.scmp.com/news/china/military/article/3369929/us-firm-make-battle-tested-drones-taiwan-boosting-supply-chain-resilience"}, {"id": "scmp-07oct-11", "title": "Would China agree to slow AI development? That’s the wrong question", "source": "SCMP", "date": "07 Oct 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "An SCMP opinion piece argues that whether China would agree to slow frontier AI is the wrong question, noting official readouts from the latest US-China summit did not address it. The writer says there is no single Chinese answer: many in China's AI safety community worry about frontier risks, while compute-restricted firms and ordinary people worried about being left behind find talk of a pause remote. It cites estimates that leading Chinese models trail US ones by about eight months to a year, and says Chinese observers may ask whether \"pacing\" is a tool for maintaining US technological superiority. The writer calls for frontier risks on the next US-China AI dialogue agenda, a Pugwash-style safe space for technical experts and pressure on companies to compete on safety evaluations and safeguards.", "url": "https://www.scmp.com/opinion/world-opinion/article/3369561/would-china-agree-slow-ai-development-thats-wrong-question"}, {"id": "tass-07oct-01", "title": "Chinese diplomat refutes reports on intel transfer to Iran in conflict with US", "source": "TASS", "date": "07 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "Chinese foreign ministry spokesman Guo Jiakun said China has not shared navigation-related intelligence with Iran during Iran's conflict with the United States, TASS reports from Beijing. TASS says Guo was responding to a Western journalist's question about reports that China had allegedly shared satellite intelligence and other location-tracking information with Iran. He said Beijing rejects \"attempts to discredit China by using military conflicts as a pretext\" and stressed that China has always been committed to its international obligations.", "url": "https://tass.com/world/2198173"}, {"id": "tass-07oct-02", "title": "Insurers stop covering risks related to Ukraine port calls — Ambrey", "source": "TASS", "date": "07 Oct 2026", "tags": ["Geopolitics", "Trade", "Finance & Markets"], "summary": "UK-based maritime security company Ambrey told TASS that many underwriters no longer offer cover for Ukraine port calls after large industry losses, even with war risk premium rates in double digits. Ambrey said Romanian and Bulgarian waters should no longer be treated as safe by default, with merchant vessels now exposed to kinetic activity within the EEZs of two NATO member states. It said that as Russian strikes degraded the Odessa-cluster ports, the Danube's share of cargo handled at Ukrainian ports rose from around 10% in January-June to 74% in August 2026, while Danube-related attacks reached 3.7 times as many events a month in July-September as in January-June. TASS attributes the higher Black Sea threat to what it calls a military campaign initiated by Ukraine and Russian \"involuntary tit-for-tat action\".", "url": "https://tass.com/world/2198453"}, {"id": "tass-07oct-03", "title": "Iran boosts arms production capacities by 2.5 times — defense ministry", "source": "TASS", "date": "07 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "Iranian defence ministry spokesman Brig. Gen. Reza Talaei-Nik said Iran has increased its weapons production capacity 2.5-fold from before its conflict with the United States, TASS reports, citing the Tasnim news agency. He said output of certain weapon types, involving the private sector, more than tripled, warning that if \"the enemy makes a wrong calculation\" it will face more advanced weapons and a heavy response. TASS says the US and Israel began a war with Iran on February 28 and that, after a June US-Iran memorandum of understanding on an immediate cessation of hostilities, the US resumed large-scale strikes on the night of July 8, accusing Iran of violating agreed terms on the Strait of Hormuz. It says Washington has since shifted from large-scale force to sanctions pressure.", "url": "https://tass.com/world/2198269"}, {"id": "tass-07oct-04", "title": "Macron views latest nuclear-capable missile launch trials as clear signal", "source": "TASS", "date": "07 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "French President Emmanuel Macron said the latest test of the M51.3 sea-based strategic ballistic missile sent a clear signal to everyone, TASS reports. In an address to troops published on X, Macron called it \"a strong and clear signal that was received where it should\" and said he had observed the trials from the Auvergne multi-purpose frigate. Describing the trials as a success, he repeated his earlier statement that one should instill fear in order to remain free, adding that instilling fear requires being strong.", "url": "https://tass.com/world/2198163"}, {"id": "tass-07oct-05", "title": "Moscow’s response to Japan’s sanctions to hurt Tokyo’s interests — Russian embassy", "source": "TASS", "date": "07 Oct 2026", "tags": ["Geopolitics", "Trade"], "summary": "The Russian Embassy in Japan said in a statement that Moscow will keep responding to Japan's sanctions with systemic countermeasures aimed at hurting Tokyo's interests in areas it finds sensitive, TASS reports. The embassy contrasted what it called Tokyo's \"bombastic proclamations about readiness to contribute to a peaceful settlement\" with its plans for further defence cooperation with Kyiv, and said full responsibility for the negative consequences, which it called inevitable, would lie with Japan. According to TASS, Japan on October 2 added 33 companies and nine individuals from Russia, as well as 35 vessels, to its Russia-related sanctions lists. Russian Foreign Ministry spokeswoman Maria Zakharova had earlier said the new sanctions proved Tokyo's foreign policy lacked independence.", "url": "https://tass.com/politics/2198151"}, {"id": "tass-07oct-06", "title": "Trump announces construction of largest US shipyard since World War II", "source": "TASS", "date": "07 Oct 2026", "tags": ["Defence", "Finance & Markets"], "summary": "US President Donald Trump announced that the US Navy is beginning construction of the country's largest new shipyard since World War II, speaking in Maryland, where the complex will be built, TASS reports. He said the workers of Baltimore and the shipyard at Sparrow's Point had been a vital part of American industrial strength for over 100 years. According to TASS, Anduril Industries, which develops and produces unmanned and uncrewed systems, earlier announced a US$3.7 billion investment in the new Arsenal-2 shipyard, expected to begin operations in 2030 and to make components for Virginia-class submarines, and signed a US$2.9 billion US Navy contract to build submarines. Trump said the US government would own a 40% stake in the new shipyard.", "url": "https://tass.com/world/2198493"}, {"id": "tass-07oct-07", "title": "Trump believes conflict in Ukraine nearing its end", "source": "TASS", "date": "07 Oct 2026", "tags": ["Geopolitics"], "summary": "US President Donald Trump told supporters in Baltimore, Maryland, that peace in Ukraine is actually getting closer even though it does not look like it, TASS reports. Trump said the Russia-Ukraine conflict had not yet been ended and that he was working on it, admitting he had thought it \"would be the easiest one for me\". Asserting that eight wars had already been ended, he said this one would end too, pretty soon.", "url": "https://tass.com/world/2198491"}, {"id": "tass-07oct-08", "title": "United States does not need Iranian oil, President Donald Trump declares", "source": "TASS", "date": "07 Oct 2026", "tags": ["Energy", "Geopolitics"], "summary": "US President Donald Trump said in Baltimore, Maryland, that the United States does not need Iranian oil and claimed the Strait of Hormuz is fully controlled by the US Navy, TASS reports. He said others need Iran's oil badly, adding \"we’re getting it out at record levels\". Trump also said Washington intends to prevent Tehran from acquiring nuclear weapons, calling that goal already a fait accompli. TASS notes that Tehran has repeatedly said it is not seeking nuclear arms, that Western intelligence agencies have found no evidence of Iran developing them, which it says The New York Times confirmed at the end of January, and that a fatwa by former supreme leader Ayatollah Ali Khamenei banning nuclear weapons production has been in effect since 2003.", "url": "https://tass.com/world/2198503"}, {"id": "xinhua-07oct-01", "title": "Australian petrol vehicle sales down 36.2 pct in September", "source": "XINHUA", "date": "07 Oct 2026", "tags": ["Finance & Markets", "Trade"], "summary": "Australian petrol vehicle sales fell 36.2% year on year in September as electric vehicle sales kept surging, the Federal Chamber of Automotive Industries (FCAI) reported on Oct 6, according to Xinhua. The FCAI said diesel sales fell 18.4%, battery electric vehicle (BEV) and plug-in hybrid sales more than doubled, and BEVs took 24.2% of new-vehicle sales, second only to August's record 24.9%. China supplied 35.5% of vehicles sold against Japan's 22.5%, the FCAI said; Xinhua says China first overtook Japan as Australia's top supplier in February, after almost 30 years of Japanese leadership. Xinhua reports BYD's 2026 Australian sales reached 76,614 vehicles by end-September, up 102%.", "url": "https://english.news.cn/20261006/3f2fc28662984915b842be9e65fe91b2/c.html"}, {"id": "xinhua-07oct-02", "title": "German industrial orders decline in August", "source": "XINHUA", "date": "07 Oct 2026", "tags": ["Finance & Markets"], "summary": "German industrial orders fell 10.6% month on month in August, reversing a strong July increase, official data showed on Oct 6, Xinhua reports. The Federal Statistical Office (Destatis) said the decline was driven largely by the volatile \"other transport equipment\" sector, where orders plunged 61.5% after more than doubling in July on exceptionally large orders for ships, rail vehicles and aircraft. Xinhua reports domestic orders fell 17.3% and foreign orders 5.4%, while the Economy Ministry put machinery orders down 4.4%, electrical equipment down 5.3% and automotive orders up 2.8%. The ministry attributed the swings to the growing importance of public procurement and said the overall order situation had improved markedly in recent months, particularly in sectors benefiting from AI expansion and government procurement.", "url": "https://english.news.cn/20261006/b575f8dcabfa4e5eb0ebcaa1bd957c01/c.html"}, {"id": "xinhua-07oct-03", "title": "Lithuania's parliament backs lifting constitutional ban on weapons of mass destruction", "source": "XINHUA", "date": "07 Oct 2026", "tags": ["Defence", "Politics"], "summary": "Lithuania's parliament has backed a constitutional amendment removing the ban on deploying weapons of mass destruction on Lithuanian territory, potentially opening the way for allied nuclear weapons to be stationed there, Xinhua reports, citing local news. According to Xinhua, the amendment, which keeps the ban on foreign military bases, passed its first reading on Oct 6 by 106 votes to 18 with six abstentions; the final vote, at least three months away, needs at least 94 of the Seimas's 141 members. Parliament Speaker Juozas Olekas said the final vote is expected on Jan 12. Opposition conservative leader Laurynas Kasciunas said the current restriction stops Lithuania fully participating in NATO's nuclear deterrence plans, while lawmakers opposing the change want it put to a referendum.", "url": "https://english.news.cn/20261006/ad8ba5b7075948d19c0235af5bd9e2f4/c.html"}, {"id": "xinhua-07oct-04", "title": "Poland to invest over 26 bln USD in population protection, civil defense", "source": "XINHUA", "date": "07 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "Poland plans to invest 102.4 billion zlotys (US$26.45 billion) from 2027 to 2031 in a population protection and civil defence programme, Prime Minister Donald Tusk said on Oct 6, Xinhua reports. According to Xinhua, the programme covers protective structures, rescue equipment and facilities, emergency stockpiles, secure water and energy supplies and communications security, continuing 2025-2026 work for which the government allocated nearly 34 billion zlotys (US$8.78 billion). Xinhua says the Russia-Ukraine conflict has brought security concerns closer to Poland's borders, and that the government has accelerated the construction and modernisation of shelters, distributed emergency preparedness guides and expanded nationwide training on responding to air raids and other emergencies.", "url": "https://english.news.cn/20261006/d02633a42a4847569c5e766f7fc83dc9/c.html"}, {"id": "xinhua-07oct-05", "title": "World Bank lifts Malaysia's 2026 growth forecast to 5.1 pct on AI-related activities", "sourc
