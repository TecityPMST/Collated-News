logy & AI", "Geopolitics"], "summary": "China is framing artificial intelligence risks differently from Silicon Valley, focusing on threats to social stability rather than human extinction. In an essay on Sept 13, Minister of State Security Chen Yixin cited deepfakes, influence operations, cognitive warfare and cyberthreats as top concerns. The piece points to a recent episode in which California researchers simulated a major breach of Tencent's WeChat super-app, using AI to seize control of accounts; Tencent said it mitigated the flaw. Researchers argued the lesson is not to slow AI but to boost transparency and cross-border collaboration on finding and fixing vulnerabilities. President Xi Jinping used a BRICS summit in New Delhi to push for an open, consensus-based AI governance framework not dictated solely by Washington.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20ST/AI%20Armageddon%20looks%20different%20from%20China.pdf"}, {"id": "st-16sep-02", "title": "Airbus sees no softening in demand despite geopolitical headwinds", "source": "ST", "date": "16 Sep 2026", "tags": ["Finance & Markets", "Trade"], "summary": "Airbus has seen no softening in aircraft demand or deliveries despite geopolitical and supply-chain headwinds, its Asia-Pacific president Anand Stanley said in Hong Kong on Sept 15. Deliveries rose 9 per cent so far in 2026 versus a year earlier. The planemaker forecasts about 42,000 new aircraft will be needed globally over the next 20 years, with roughly 45 per cent going to the Asia-Pacific region. China alone will require 8,830 new passenger aircraft, India 3,480 and the rest of Asia-Pacific 6,880. Airbus raised India's domestic traffic growth forecast to 9.3 per cent while trimming China's to 4.7 per cent, citing macroeconomic factors. Executives noted urbanisation is shifting toward smaller cities, unlocking new routes for models like the A220 and A321XLR.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20ST/Airbus%20sees%20no%20softening%20in%20demand%20despite%20geopolitical%20headwinds.pdf"}, {"id": "st-16sep-03", "title": "Australia 'on the same page' as Canada as it seeks deeper EU alliance, says minister", "source": "ST", "date": "16 Sep 2026", "tags": ["Trade", "Geopolitics"], "summary": "Australian Trade Minister Don Farrell said on Sept 15 that Canberra was aligned with Canada's push for deeper ties with the European Union, amid Ottawa's escalating trade war with the United States. Canadian Prime Minister Mark Carney has said he is seeking a \"unique alliance\" with the EU, though not membership, after reports he was exploring associate-member status. Farrell said Australia would watch Carney's moves closely and remained open to possibilities, though he ruled out extra fibre-optic cables given the distances. Australia has sought to diversify trade after facing US tariffs despite its security alliance with Washington. Canberra and the EU signed a free trade agreement in March after eight years of negotiations, removing tariffs on almost all goods.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20ST/Australia%20'on%20the%20same%20page'%20as%20Canada%20as%20it%20seeks%20deeper%20EU%20alliance,%20says%20minister.pdf"}, {"id": "st-16sep-04", "title": "Gates Foundation to spend US$1.27 billion to expand AI access to poor, remote communities", "source": "ST", "date": "16 Sep 2026", "tags": ["Technology & AI", "Society"], "summary": "The Gates Foundation pledged on Sept 15 to spend at least US$1 billion (S$1.27 billion) globally over the next two years to expand access to artificial intelligence, particularly for lower-income and rural communities. Chief executive Mark Suzman, whose foundation opened a Singapore office in May, said it is exploring how people in the region could benefit from AI in education, agriculture and health, citing the Asia Pathogen Genomics Initiative and its AI-enabled PathGen program. Of the sum, 40 per cent will go to education, 40 per cent to healthcare, 10 per cent to agriculture and 10 per cent to digital foundations for equitable access. The foundation's Goalkeepers report warned AI must narrow, not widen, gaps between rich and poor.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20ST/Gates%20Foundation%20to%20spend%201.27%20billion%20to%20expand%20AI%20access%20to%20poor,%20remote%20communities.pdf"}, {"id": "st-16sep-05", "title": "Germany, US sign agreement to deepen defense cooperation between industries", "source": "ST", "date": "16 Sep 2026", "tags": ["Defence", "Geopolitics"], "summary": "German Defence Minister Boris Pistorius and US counterpart Pete Hegseth signed a political agreement in Washington on Sept 15 to deepen cooperation between their defence manufacturers, allowing European firms to produce certain US weapons under licence and vice versa. The move aims to boost output and replenish low stocks of air-defence missiles and deep-strike weapons for NATO. Pistorius cited existing German production of F-35 fuselage sections and PAC-2 Patriot missiles, with further projects under discussion including ATACMS, Stinger and AMRAAM missiles. Hegseth praised Germany's higher defence spending and its NATO burden-sharing role. German officials are pressing for European production of the advanced PAC-3 interceptor and Tomahawk cruise missiles, though US manufacturers Lockheed Martin and Raytheon have shown little interest in granting those licences.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20ST/Germany,%20US%20sign%20agreement%20to%20deepen%20defense%20cooperation%20between%20industries.pdf"}, {"id": "st-16sep-06", "title": "Google ramps up hiring for its Singapore engineering centre as AI drives demand for tech talent", "source": "ST", "date": "16 Sep 2026", "tags": ["Technology & AI", "Southeast Asia"], "summary": "Google is expanding engineering hiring in Singapore, betting that artificial intelligence will boost demand for skilled tech workers even as it automates some tasks. The company has hired more than 85 specialists in under six months for the first phase of its Google Cloud Singapore Engineering Center, officially launched on Sept 15 and co-located with Google DeepMind's Singapore AI research lab. The hiring builds on a February 2026 plan to fill more than 150 roles. Executive Moe Abdula said Singapore offers abundant talent without compromising standards. Alphabet's global headcount reached 198,933 by June 2026, and Google now employs more than 3,000 people in Singapore. Demand extends beyond AI to cybersecurity, data analytics and software engineering, Abdula said.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20ST/Google%20ramps%20up%20hiring%20for%20its%20Singapore%20engineering%20centre%20as%20AI%20drives%20demand%20for%20tech%20t.pdf"}, {"id": "st-16sep-07", "title": "Hong Kong-based crypto exchange CoinEx to cease operations amid prolonged market downturn", "source": "ST", "date": "16 Sep 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Hong Kong-based cryptocurrency exchange CoinEx said on Sept 15 it will cease operations and begin an orderly wind-down, as a prolonged downturn in digital assets squeezes smaller players. Bitcoin languished near two-year lows of about US$60,000 for months after slumping more than 50 per cent from its October 2025 peak of nearly US$130,000; a rebound above US$77,000 proved fleeting. CoinEx cited weak markets, shrinking trading volume and liquidity, and rising regulatory requirements that had \"exceeded reasonable boundaries.\" Services will wind down gradually from Sept 15, with withdrawals available until Dec 22. Average daily Bitcoin spot volume fell to about US$1.8 billion in August, near three-year lows. CoinEx said user assets were fully backed with a reserve ratio above 100 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20ST/Hong%20Kong-based%20crypto%20exchange%20CoinEx%20to%20cease%20operations%20amid%20prolonged%20market%20downturn.pdf"}, {"id": "st-16sep-08", "title": "Internet connection for about 2,000 in Bishan, Thomson restored: NetLink Trust", "source": "ST", "date": "16 Sep 2026", "tags": ["Southeast Asia", "Society"], "summary": "Fibre services in parts of Bishan and Thomson that were disrupted on Sept 15 have been restored, NetLink Trust said on Sept 16. The disruption affected about 2,000 connections and was caused by damage to NetLink's fibre infrastructure during construction works by a third-party contractor. NetLink, which operates the passive fibre network of Singapore's Nationwide Broadband Network, said teams worked through the night, completing repairs at 5.40am, and apologised for the inconvenience. Recovery was complicated by water ingress and obstructions limiting access to underground cables. Telcos Singtel, StarHub and M1 said some subscribers may have been affected. NetLink previously suffered an April outage affecting 5,000 connections for about 20 hours, which also disrupted bus arrival timing systems.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20ST/Internet%20connection%20for%20about%202,000%20in%20Bishan,%20Thomson%20restored%20NetLink%20Trust.pdf"}, {"id": "st-16sep-09", "title": "Japan may spend 3.5% of GDP on defence after US pressure", "source": "ST", "date": "16 Sep 2026", "tags": ["Defence", "Geopolitics"], "summary": "Japan is considering a new midterm defence spending target of 3.5 per cent of GDP, in line with NATO and other US allies, a move that could unsettle financial markets wary of Prime Minister Sanae Takaichi's spending plans. Officials have signalled willingness to sharply raise outlays in talks with US counterparts, with one scenario matching South Korea's pledge to reach 3.5 per cent over 10 years; a lower 3 per cent target is also possible. Takaichi has already lifted spending to almost 2 per cent of GDP, two years ahead of schedule. A five-year plan is expected at end-2026. Higher spending could rattle bond markets, with the 10-year yield hitting 3 per cent in September for the first time since 1996.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20ST/Japan%20may%20spend%203.5%20of%20GDP%20on%20defence%20after%20US%20pressure.pdf"}, {"id": "st-16sep-10", "title": "Japan's land prices up for fifth straight year on housing, tourism demand", "source": "ST", "date": "16 Sep 2026", "tags": ["Finance & Markets"], "summary": "The average price of land in Japan as at July 1 rose for the fifth straight year, government data showed on Sept 15, led by major metropolitan areas with strong housing demand and tourist destinations drawing more inbound visitors. The nationwide average gained 1.5 per cent, matching a year earlier and the sharpest pace since the asset bubble burst in the early 1990s. Commercial land rose 2.9 per cent and residential land 1 per cent. Prices in Tokyo, Osaka and Nagoya climbed 4.4 per cent, while growth elsewhere was flat, highlighting a widening disparity. Ski-resort areas Furano and Hakuba saw the sharpest gains. Tokyo's Ginza retained the highest price per square metre at 52.5 million yen for a 21st consecutive year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20ST/Japan's%20land%20prices%20up%20for%20fifth%20straight%20year%20on%20housing,%20tourism%20demand.pdf"}, {"id": "st-16sep-11", "title": "Malaysian developer Eco World tops bids for Sin Ming area housing plot with $1,612 psf ppr bid", "source": "ST", "date": "16 Sep 2026", "tags": ["Southeast Asia", "Finance & Markets"], "summary": "A private housing site near Bright Hill MRT station and Ai Tong School in Singapore's Thomson-Bishan area drew a robust response at a state tender that closed on Sept 15. Malaysian developer Eco World Development topped six other bidders with an offer of $208.1 million, or nearly $1,612 per square foot per plot ratio, about 11 per cent above the second-highest bid from Intrepid Investments and TID Residential at $1,451 psf ppr. Other bidders included Sunway MCL, EL Development and JBE Capital. The 46,106 sq ft, 99-year leasehold plot can yield about 140 units. Analysts said rising land costs could push up new home prices, though job-market weakness and possible higher interest rates may temper buyer demand. Bright Hill will become a Cross Island Line interchange in 2030.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20ST/Malaysian%20developer%20Eco%20World%20tops%20bids%20for%20Sin%20Ming%20area%20housing%20plot%20with%201,612%20psf%20ppr.pdf"}, {"id": "st-16sep-12", "title": "North Korea says US-driven nuclear submarine push justifies its own weapons build-up", "source": "ST", "date": "16 Sep 2026", "tags": ["Defence", "Geopolitics"], "summary": "North Korea on Sept 16 accused the United States of expanding a \"nuclear submarine alliance\" that it said undermines global nuclear security, as the fifth anniversary of the AUKUS pact arrived. State news agency KCNA cited an analyst who said a senior US naval official was encouraging Japan and South Korea to pursue nuclear-powered submarines, using AUKUS, under which the US and Britain are helping Australia acquire such vessels, as a template to extend to other allies. Pyongyang said these developments justified its continued nuclear build-up. North Korea has been advancing its own nuclear-powered, nuclear-armed submarine, with December state photos showing an 8,700-ton-class hull inspected by leader Kim Jong Un. A defence delegation departed on Sept 15 for a security forum in Beijing.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20ST/North%20Korea%20says%20US-driven%20nuclear%20submarine%20push%20justifies%20its%20own%20weapons%20build-up.pdf"}, {"id": "st-16sep-13", "title": "OpenAI, Anthropic and Google are working to create an AI standards body", "source": "ST", "date": "16 Sep 2026", "tags": ["Technology & AI"], "summary": "The world's biggest AI companies are working to create a standards body, OpenAI said on Sept 15, as concerns rise over the technology's dangers. OpenAI said it is collaborating with Anthropic and Google on an idea originating from Google DeepMind's Demis Hassabis for a self-regulatory body modelled on the Financial Industry Regulatory Authority, which would test the most powerful AI systems before public release. OpenAI chief Sam Altman backed industry-wide coordination on safety. Critics warned the effort could squeeze out smaller rivals, with Cohere's Aiden Gomez accusing dominant US labs of forming a \"cartel.\" Safety concerns have escalated, with researchers resigning from major labs and Anthropic's Dario Amodei calling for a slowdown. Senator Bernie Sanders said tech leaders could not be trusted to self-regulate.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20ST/OpenAI,%20Anthropic%20and%20Google%20are%20working%20to%20create%20an%20AI%20standards%20body.pdf"}, {"id": "st-16sep-14", "title": "Saudi cancels some oil cargoes after pipeline hit, top buyer chasing alternatives", "source": "ST", "date": "16 Sep 2026", "tags": ["Energy", "Geopolitics"], "summary": "Saudi Arabia has cut oil shipments to Europe after drone attacks damaged its key export pipeline to the Red Sea, trade sources told Reuters, prompting customers such as Poland to rush for alternatives as cargo prices topped US$120 a barrel. The attacks, which Riyadh blamed on Iraqi militia, forced the kingdom to shut its East-West pipeline on Sept 11. Some September-loading cargoes will be cancelled and loadings at Yanbu suspended. Saudi Arabia is expected to export more via the Strait of Hormuz using \"dark shipments.\" Brent futures traded near US$108 a barrel, with dated Brent around US$122. Poland's Orlen, which relies on Aramco for about 40 per cent of its oil, scrambled to buy North Sea and other grades.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20ST/Saudi%20cancels%20some%20oil%20cargoes%20after%20pipeline%20hit,%20top%20buyer%20chasing%20alternatives.pdf"}, {"id": "st-16sep-15", "title": "South Korea, Kazakhstan sign MoU on atomic energy, explore mineral trade", "source": "ST", "date": "16 Sep 2026", "tags": ["Energy", "Geopolitics"], "summary": "South Korea and Kazakhstan signed a memorandum of understanding on the peaceful use of nuclear energy as their leaders met on Sept 15, pledging cooperation on trade, energy, critical minerals and AI, Seoul said. President Lee Jae Myung and Kazakhstan's President Kassym-Jomart Tokayev discussed deeper ties amid global economic turbulence, with Lee calling Kazakhstan a key partner in future high-tech industries. The atomic energy MoU was among 13 documents signed, which also covered crude oil and science and technology. Lee was to host Tokayev and four other Central Asian leaders at a multilateral summit. Seoul, pursuing its New Northern Policy, seeks to diversify energy and mineral supplies, with officials urging cooperation beyond oil and uranium to include lithium and other critical minerals.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20ST/South%20Korea,%20Kazakhstan%20sign%20MoU%20on%20atomic%20energy,%20explore%20mineral%20trade.pdf"}, {"id": "st-16sep-16", "title": "South Korean lawmaker says Trump due to announce US investment details on Friday", "source": "ST", "date": "16 Sep 2026", "tags": ["Trade", "Geopolitics"], "summary": "A South Korean lawmaker, Yoon Hu-duk of the ruling Democratic Party, said on Sept 15 that US President Donald Trump was due to announce details of Seoul's planned investment in the United States on Sept 18. Speaking during questioning of finance minister nominee Lee Hyoung-il, Yoon referred to the proposed $350 billion investment commitment and said reported projects included a Texas gas project, construction of eight nuclear reactors, an Alaskan LNG scheme, reprocessing of nuclear material and carbon capture. Lee said matters were still under consultation. Under a trade deal reached last October, South Korea committed $350 billion to US manufacturing in return for a 15 per cent cap on tariffs, with $150 billion earmarked for shipbuilding, though implementation has faced delays.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20ST/South%20Korean%20lawmaker%20says%20Trump%20due%20to%20announce%20US%20investment%20details%20on%20Friday.pdf"}, {"id": "st-16sep-17", "title": "Spanish data watchdog publicises first AI agent-linked data breach report", "source": "ST", "date": "16 Sep 2026", "tags": ["Technology & AI", "Society"], "summary": "Spain's data protection watchdog, the AEPD, said it has received the first reported notification of a personal data breach allegedly carried out by an artificial intelligence agent, suggesting autonomous systems are starting to play a direct role in cyberattacks. In a Sept 14 blog post, the agency said the incident involved an AI agent using a widely known large language model to identify vulnerabilities, gain access to a system, and then modify personal data and access invoices. It did not name the model or the targeted organisation, and stressed the case remains under review. The AEPD said AI does not create new threats but increases the speed, scale and adaptability of existing techniques, and urged data controllers to prepare for faster attacks.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20ST/Spanish%20data%20watchdog%20publicises%20first%20AI%20agent-linked%20data%20breach%20report.pdf"}, {"id": "st-16sep-18", "title": "Trump administration plans US$3.6 billion munitions sale to Israel, sources say", "source": "ST", "date": "16 Sep 2026", "tags": ["Defence", "Geopolitics"], "summary": "The Trump administration is planning to sell Israel a munitions package worth US$2.8 billion (S$3.6 billion), including tens of thousands of highly destructive 2,000-pound bombs, a US official said. The sale, informally communicated to relevant congressional committees, includes 20,000 MK 84s and 20,000 BLU-117s. The package was first reported by the Washington Post. US public support for Israel has fallen since the Gaza war began in 2023, particularly among Democrats, with a June Quinnipiac poll finding 48 per cent of voters believe the US is too supportive of Israel. The 2,000-pound bombs have been widely used in Gaza and Lebanon, drawing scrutiny; Gaza health authorities say more than 73,000 Palestinians have been killed. A UN inquiry found Israel committed genocide, a charge it rejects.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20ST/Trump%20administration%20plans%203.6%20billion%20munitions%20sale%20to%20Israel,%20sources%20say.pdf"}, {"id": "st-16sep-19", "title": "Trump is no longer China's biggest trade problem", "source": "ST", "date": "16 Sep 2026", "tags": ["Trade", "Geopolitics"], "summary": "As Chinese President Xi Jinping prepares to visit Washington on Sept 24, this commentary argues China looks economically vulnerable at home but formidable abroad, with its export machine both a source of bargaining power and a growing diplomatic liability. Chinese exports surged 25 per cent year on year in August, lifting the monthly trade surplus to US$119.1 billion and the eight-month total to US$806 billion, on course to challenge 2025's record US$1.2 trillion. Xi has showcased China's global reach through summits in Bishkek, Cairo and New Delhi, presenting Beijing as a champion of a multipolar order. Yet at a G-20 finance meeting China stood isolated, alone objecting to language urging surplus nations to reduce export reliance. The EU's goods deficit with China has widened toward 360 billion euros.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20ST/Trump%20is%20no%20longer%20China's%20biggest%20trade%20problem.pdf"}, {"id": "st-16sep-20", "title": "US energy chief says Saudi Arabia oil pipeline should be back online within days", "source": "ST", "date": "16 Sep 2026", "tags": ["Energy", "Geopolitics"], "summary": "Crude oil should flow again through Saudi Arabia's vital East-West Pipeline within days, US Energy Secretary Chris Wright told CNBC on Sept 15, after the kingdom closed it following attacks by Iran-aligned groups. Speaking on the sidelines of a G20 energy meeting in Houston, Wright said Saudi Arabia was taking steps to move more oil out of the Strait of Hormuz with US military assistance. Other sources gave varying repair estimates, with one saying it could take five to six weeks. The 1,200-km pipeline had been the main route for Middle Eastern oil for six months while the strait was largely shut by the Iran war, moving 4 million to 5 million barrels per day. Washington has resisted Saudi requests for direct military intervention beyond intelligence support.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20ST/US%20energy%20chief%20says%20Saudi%20Arabia%20oil%20pipeline%20should%20be%20back%20online%20within%20days.pdf"}, {"id": "st-16sep-21", "title": "US task force aiding Saudis with intel, planning support: US official", "source": "ST", "date": "16 Sep 2026", "tags": ["Defence", "Geopolitics"], "summary": "A US military task force is working to enhance intelligence sharing and planning assistance for Saudi forces, a US official said on Sept 15, as the kingdom faces attacks from Yemen's Iran-backed Houthi fighters. US Central Command said it has a task force in place and maintains a strong security alliance with Saudi partners. The Houthis have renewed fighting against Saudi-backed government forces since Yemen's civil war reignited in July, declaring a maritime blockade and seizing Yemen's Red Sea coast and the Bab al-Mandab Strait, increasingly vital as the US-Iran war chokes the Strait of Hormuz. The group has also struck Saudi oil infrastructure. Saudi Arabia's crown prince reportedly asked Trump for direct US intervention but was turned down; Trump said the Houthis urged Washington to stay out.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20ST/US%20task%20force%20aiding%20Saudis%20with%20intel,%20planning%20support%20US%20official.pdf"}, {"id": "st-16sep-22", "title": "Ukraine's Zelenskiy says Russian drones attacked Moldova twice while he was in transit", "source": "ST", "date": "16 Sep 2026", "tags": ["Defence", "Geopolitics"], "summary": "Ukrainian President Volodymyr Zelenskiy said in an interview broadcast on Sept 15 that Russian drones attacked Moldovan airspace twice while his presidential jet was in transit at Chisinau airport on his way to and from a trip abroad. \"Maybe they didn't want to attack me personally,\" he told CBS, adding the same occurred on his return. On Sept 9, Moldova closed its airspace over a drone alert, delaying Zelenskiy's departure for Norway; two Russian drones entered its airspace, one landing in a field and another continuing into Romania. Moldovan authorities said two more drones entered on Sept 14. Zelenskiy had not previously mentioned the second incident. Separately, on Sept 13 a Russian drone hit a passenger train near Ukraine's border with Poland, with no casualties.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20ST/Ukraine's%20Zelenskiy%20says%20Russian%20drones%20attacked%20Moldova%20twice%20while%20he%20was%20in%20transit.pdf"}, {"id": "st-16sep-23", "title": "Ukraine's Zelenskiy says new anti-drone weapon being tested", "source": "ST", "date": "16 Sep 2026", "tags": ["Defence", "Geopolitics"], "summary": "Ukrainian President Volodymyr Zelenskiy said on Sept 15 that Ukraine was testing a new weapon to intercept drones and had recorded a successful hit overnight. \"It's a Ukrainian development and it scored a hit, the 'shahed' was destroyed,\" he said in his nightly address, referring to Iranian-designed drones, though he noted some technical refinements were still needed. Ukraine's military said its forces downed 187 airborne targets overnight, with Zelenskiy saying 93 per cent of Russian drones were intercepted. Since Russia's full-scale invasion in February 2022, Ukraine has rapidly developed anti-drone technology and now shares expertise with other countries, including in the Middle East. It has focused on cheaper interceptors, while pressing Western allies for more supplies against ballistic missiles and backing a European air-defence system called Freyja.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20ST/Ukraine's%20Zelenskiy%20says%20new%20anti-drone%20weapon%20being%20tested.pdf"}, {"id": "bt-16sep-01", "title": "An AI deal with China could get Trump his Nobel Prize", "source": "BT", "date": "16 Sep 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "This opinion piece argues that US President Donald Trump could win the Nobel Prize he has sought by striking an AI collaboration deal with China at his one-day summit with President Xi Jinping on Sep 24. The writer contends the AI race is not zero-sum and that Beijing has signalled openness to joint restrictions. He proposes a three-strand relationship: adversarial (drones, autonomous weapons), competitive (chips) and collaborative. Promising collaboration areas include cancer research and drug trials, where China's immunotherapy drug Ivonescimab outperformed Keytruda, and cybersecurity to prevent runaway AI attacks on banking or infrastructure. The essay follows calls by Altman, Musk and Anthropic's Dario Amodei to slow AI development, warning inaction risks global-scale catastrophe.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20BT/An%20AI%20deal%20with%20China%20could%20get%20Trump%20his%20Nobel%20Prize.pdf"}, {"id": "bt-16sep-02", "title": "As AI firms call for accountability and limits, an opportunity beckons for Singapore", "source": "BT", "date": "16 Sep 2026", "tags": ["Technology & AI", "Southeast Asia"], "summary": "As overseas AI heavyweights call for a slowdown citing accountability and safety, analysts say Singapore is well positioned to lead in AI governance. Anthropic CEO Dario Amodei's three-step plan urges third-party evaluators, common safety standards and coordination with authoritarian governments. NTU's Professor Bo An backs a targeted slowdown but stresses extra time must deliver safeguards. NUS AI Institute's Professor Anthony Tung says rules lack teeth and pace should be set by evaluation throughput. SGTech's Gunasekharan Chellappan favours parallel investment in security over slowing development. Analysts cite Singapore's agentic AI framework, AI Verify and Tester Accreditation programmes, and its established business, financial and legal sectors as a foundation, while a Bain study warns US$4.7 trillion in global profits is at stake through 2035.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20BT/As%20AI%20firms%20call%20for%20accountability%20and%20limits%2C%20an%20opportunity%20beckons%20for%20Singapore.pdf"}, {"id": "bt-16sep-03", "title": "Asean is disproportionately affected by climate change. This also presents opportunities", "source": "BT", "date": "16 Sep 2026", "tags": ["Environment", "Southeast Asia"], "summary": "This commentary argues South-east Asia is disproportionately exposed to climate change but that the crisis also creates opportunities. Asean secretary-general Kao Kim Hourn warned of extreme weather threats, with Asean and wider Asia accounting for 41 per cent of global flooding. By 2050 the region may face around 60 more days of extreme heat annually and 100 climate disasters affecting 80 million people. Former US vice-president Al Gore noted the Iran crisis is pushing the region from fossil fuels, with renewables investment up 51 per cent in the first half of 2026. The piece highlights adaptation finance gaps, Just Energy Transition partnerships for Indonesia and Vietnam, the Asean Power Grid, and speculation Beijing may host COP33 in 2028, while noting energy demand may double by 2040.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20BT/Asean%20is%20disproportionately%20affected%20by%20climate%20change.%20This%20also%20presents%20opportunities.pdf"}, {"id": "bt-16sep-04", "title": "Bessent defends Trump's economic policies, reveals plans to meet Chinese official", "source": "BT", "date": "16 Sep 2026", "tags": ["Finance & Markets", "Politics"], "summary": "US Treasury Secretary Scott Bessent defended Trump administration economic policies before the House Financial Services Committee on Sep 15, disclosing plans to meet his Chinese counterpart this weekend. He said Trump and Xi Jinping would continue discussions next week on Iran and China's financial links to Teheran, as Washington seeks to shut Iran out of Western financial systems. Protesters interrupted the hearing calling for an end to sanctions and the war. Bessent tied rising 10-year Treasury yields, at peaks not seen since 2007, to global issues and the deficit, and defended debt buybacks and joint yen intervention with Japan. He cited a record-low poverty rate of 10.2 per cent, addressed Trump's proposed US$5,000 payments, and argued AI labs should be liable rather than exempt.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20BT/Bessent%20defends%20Trump's%20economic%20policies%2C%20reveals%20plans%20to%20meet%20Chinese%20official.pdf"}, {"id": "bt-16sep-05", "title": "China and US discuss cutting tariffs on agriculture and energy", "source": "BT", "date": "16 Sep 2026", "tags": ["Trade", "Geopolitics"], "summary": "The US and China are discussing cutting tariffs on certain goods, including American energy and agricultural shipments, a potential sign next week's leaders' summit will extend the one-year trade truce. Talks are also likely to lower duties on Chinese manufacturing inputs, with moves carried out under an earlier plan for reciprocal cuts on roughly US$30 billion in trade. Representatives from state food trader Cofco may join Xi Jinping's US trip, and a CEO delegation is being considered. Bilateral trade topped US$400 billion in the first eight months. China is progressing on its pledge to buy 25 million tons of US soybeans annually through 2028 and at least US$17 billion of other farm goods. Trump said Xi would visit the White House on Sep 24.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20BT/China%20and%20US%20discuss%20cutting%20tariffs%20on%20agriculture%20and%20energy.pdf"}, {"id": "bt-16sep-06", "title": "China new home prices fall for third straight month as prolonged property slump weighs on economy", "source": "BT", "date": "16 Sep 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "China's new home prices fell 0.1 per cent in August, matching declines in July and June and underscoring persistent housing-market weakness. On an annual basis prices fell 3 per cent, narrowing from July's 3.2 per cent drop, the slowest pace of decline in 2026. Centaline's Zhang Dawei said the downward trend has been contained but a broad recovery is unlikely near term. Tier-one cities saw prices rise 0.1 per cent while smaller markets kept struggling. The government issued measures in August to move developers away from the pre-sale model and extended mortgage terms to 40 years, though analysts doubt near-term demand gains. Household loans shrank, second-quarter growth slowed to 4.3 per cent, and Oxford Economics expects the downturn to persist, cutting its 2027 growth forecast to 4.3 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20BT/China%20new%20home%20prices%20fall%20for%20third%20straight%20month%20as%20prolonged%20property%20slump%20weighs%20on.pdf"}, {"id": "bt-16sep-07", "title": "China's consumption falters, investment slump deepens despite factory rebound", "source": "BT", "date": "16 Sep 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "China's consumer spending and investment languished in August even as industrial output beat expectations, adding pressure on officials to support the economy. Retail sales rose just 0.4 per cent year on year, below the 0.8 per cent forecast, while fixed-asset investment plunged 7.2 per cent in the first eight months and the jobless rate ticked up to 5.3 per cent. Industrial output climbed 5.2 per cent, driven by double-digit export growth linked to the global data-centre buildout and AI demand. Economists at Barclays, Oxford Economics and Macquarie estimate third-quarter GDP growth of 4.3 per cent, risking a second straight quarter below the 4.5-5 per cent target. Property investment slumped 19.9 per cent and car sales fell 18.5 per cent, while oil prices above US$100 squeezed downstream industries.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20BT/China's%20consumption%20falters%2C%20investment%20slump%20deepens%20despite%20factory%20rebound.pdf"}, {"id": "bt-16sep-08", "title": "Chinese state media dismisses 'self-serving' AI slowdown call", "source": "BT", "date": "16 Sep 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "Chinese state media accused leading US AI executives of using calls for slower frontier-model development to blunt competition from China, calling the push a self-serving effort to preserve American dominance. A China Daily editorial said proposals by Anthropic's Dario Amodei, OpenAI's Sam Altman and SpaceXAI's Elon Musk amounted to a coordinated play, and that a global AI-safety framework excluding China is not truly global. Amodei had urged easing AI's pace while tightening curbs on China's model makers. China's foreign ministry criticised the executives' fearmongering. Beijing separately released an updated AI safety governance framework citing risks of recursive self-improvement, the same dynamic Amodei flagged. Chinese cybersecurity stocks rallied, with Shenzhen Sinovatio up as much as 10 per cent, days before US-China AI talks ahead of the Sep 24 Trump-Xi summit.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20BT/Chinese%20state%20media%20dismisses%20'self-serving'%20AI%20slowdown%20call.pdf"}, {"id": "bt-16sep-09", "title": "Citigroup CFO Luchetti expects equity return above 11% this year", "source": "BT", "date": "16 Sep 2026", "tags": ["Finance & Markets"], "summary": "Citigroup chief financial officer Gonzalo Luchetti said on Sep 14 the bank expects its return on tangible common equity (ROTCE) to be slightly above 11 per cent this year. Speaking at a conference in New York, he said Citi will increase stock buybacks from the US$13 billion acquired in 2025 and accelerate around US$500 million in investments through year-end, including higher severance to reduce headcount and marketing spending on credit cards and wealth management. Luchetti said the bank expects to remove Mexico's Banamex from its balance sheet next year, incurring a currency translation adjustment loss of US$9 billion. Citi is focused on organic growth but could still buy small companies offering add-on services, though it would not do anything transformative.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20BT/Citigroup%20CFO%20Luchetti%20expects%20equity%20return%20above%2011%20this%20year.pdf"}, {"id": "bt-16sep-10", "title": "Gold holds ground as investors await Fed policy cues", "source": "BT", "date": "16 Sep 2026", "tags": ["Finance & Markets", "Energy"], "summary": "Gold held steady on Sep 15 after touching a more than one-month low, as investors awaited the US Federal Reserve's policy decision. Spot gold was little changed at US$4,302.13 an ounce, while US gold futures slipped 0.2 per cent. Markets are betting heavily the Fed will lift its benchmark rate a quarter point to a 3.75-4 per cent range, with analysts saying chair Kevin Warsh's framing matters more than the hike itself. Gold often loses appeal when rates rise. US consumer prices accelerated in August, while Yemen's Houthis launched fresh attacks on Saudi Arabia, lifting oil on supply-disruption concerns. US 10-year Treasury yields hit 5 per cent for the first time since October 2023. Silver steadied at US$63.25, platinum gained and palladium fell.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20BT/Gold%20holds%20ground%20as%20investors%20await%20Fed%20policy%20cues.pdf"}, {"id": "bt-16sep-11", "title": "Iran war cost hits US$38 billion, forecast to rise US$3 billion a month", "source": "BT", "date": "16 Sep 2026", "tags": ["Defence", "Geopolitics"], "summary": "The six-month-old US war against Iran has cost US$38 billion so far, with expenses projected to rise US$3 billion a month, the Congressional Budget Office reported on Sep 15. The war is expected to lift inflation by 0.5 per cent in the first three months of 2027. Mounting costs have strained munitions stockpiles, which the CBO says could take five years to replenish, and driven up energy prices. Eighteen US service members have died in the conflict. The figures exclude recent strikes in the Strait of Hormuz and borrowing costs. The deficit in critical munitions risks hampering a Pentagon response to another conflict, such as over Taiwan. Defense Secretary Pete Hegseth has sought nearly US$90 billion in emergency restocking funds. US public debt surpassed US$40 trillion in August.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20BT/Iran%20war%20cost%20hits%20US38%20billion%2C%20forecast%20to%20rise%20US3%20billion%20a%20month.pdf"}, {"id": "bt-16sep-12", "title": "Japan's centenarian ranks reach 100,000 as welfare costs rise", "source": "BT", "date": "16 Sep 2026", "tags": ["Society"], "summary": "The number of centenarians in Japan has exceeded 100,000 for the first time, reaching a record 107,677 as at Sep 15, highlighting the country's longevity and the mounting costs of caring for its aging population. The tally has risen from just 153 when records began in 1963. Women make up about 88 per cent of centenarians. Roughly one in three residents, around 40 million people, now receive public pensions while a shrinking workforce finances rising spending. The health ministry sought about 33.7 trillion yen (US$218 billion) for pensions and medical care next fiscal year, nearly a quarter of overall requests. Japan's fertility rate fell for a 10th straight year in 2025. The country is recruiting more foreign care workers, with numbers under a skilled-worker visa reaching about 66,000 in 2025.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20BT/Japan's%20centenarian%20ranks%20reach%20100%2C000%20as%20welfare%20costs%20rise.pdf"}, {"id": "bt-16sep-13", "title": "Junk debt from Asia is beating bonds almost everywhere in 2026", "source": "BT", "date": "16 Sep 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Asian high-yield debt has emerged as a surprising global winner in 2026, returning 4.3 per cent so far this year versus 1.8 per cent for US peers and beating two dozen key global debt gauges, Bloomberg data show. The outperformance reflects near record-low borrowing costs in China, faster regional growth and fewer defaults, with Chinese borrowers the largest share. Moody's counted 43 corporate defaults in the US this year through July but only one in Asia-Pacific. Risks include a likely Fed rate hike, higher oil prices and pressure on Asian central banks. Issuance is rebounding from a low base as property developers retreat, with SoftBank planning a US$10-20 billion offering. Investors including Lombard Odier and UOB Asset Management see continued high single-digit returns and value in overlooked credits.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20BT/Junk%20debt%20from%20Asia%20is%20beating%20bonds%20almost%20everywhere%20in%202026.pdf"}, {"id": "bt-16sep-14", "title": "Micron Taiwan union presses profit-sharing demand, keeps strike preparations alive", "source": "BT", "date": "16 Sep 2026", "tags": ["Technology & AI", "Trade"], "summary": "A Taiwanese union representing Micron Technology workers warned on Sep 15 it could move toward a strike unless the US memory chipmaker agrees to a permanent profit-sharing system, escalating a dispute at its largest manufacturing hub. Taiwan is crucial for Micron's DRAM and high-bandwidth memory chips used in AI servers, and any labour action could amplify supply concerns in a tight market. The union, citing profit-sharing at rivals Samsung and SK Hynix, wants 15 per cent of Micron's operating profit allocated to employees globally. Micron last week announced fiscal 2026 rewards for over 60,000 employees, including a T$1 million (US$31,498) bonus for Taiwan staff, but the union said this did not address its demand. Further mediation sessions are scheduled; unions represent over 80 per cent of Micron's 15,000 Taiwan employees.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20BT/Micron%20Taiwan%20union%20presses%20profit-sharing%20demand%2C%20keeps%20strike%20preparations%20alive.pdf"}, {"id": "bt-16sep-15", "title": "Musk's X Corp and SpaceXAI resolve antitrust lawsuit against Apple", "source": "BT", "date": "16 Sep 2026", "tags": ["Technology & AI"], "summary": "Elon Musk's X Corp and SpaceXAI said on Sep 14 they have resolved their claims against Apple in a lawsuit alleging the iPhone maker conspired with OpenAI to unlawfully monopolise smartphone and generative AI chatbot markets. In a court filing the companies moved to dismiss claims against Apple, without explaining reasons or confirming a settlement, but said they will continue pursuing claims against OpenAI. The suit alleged Apple illegally shut out rivals by exclusively integrating OpenAI's ChatGPT into Apple Intelligence. A judge ruled in November the case could proceed. OpenAI said it was not involved in the agreement and asked X to make it available. Apple and OpenAI denied wrongdoing, with OpenAI accusing Musk of lawfare. Musk's xAI acquired X last year for US$33 billion.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20BT/Musk's%20X%20Corp%20and%20SpaceXAI%20resolve%20antitrust%20lawsuit%20against%20Apple.pdf"}, {"id": "bt-16sep-16", "title": "Oil settles US$3 higher on Yanbu disruption, Saudi cargo cancellations", "source": "BT", "date": "16 Sep 2026", "tags": ["Energy", "Geopolitics"], "summary": "Oil prices settled US$3 higher on Sep 15 after shipping sources said crude loadings at Saudi Arabia's Red Sea export hub of Yanbu had been suspended and Riyadh cancelled some European cargo deliveries, deepening concerns over a critical export route. Brent finished up 2.9 per cent at US$108.75 a barrel and WTI up 4.38 per cent at US$105.83, both the highest since May 19. Yanbu gained importance after the US-Israeli war on Iran closed the Strait of Hormuz. Houthi attacks on the East-West Pipeline forced the kingdom to shut the route. Goldman Sachs said repair estimates range from very soon to eight weeks and raised the probability of Brent above US$120. In Libya, three oil fields were suspended, while Russia-Ukraine strikes drove US diesel futures to a record close.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20BT/Oil%20settles%20US3%20higher%20on%20Yanbu%20disruption%2C%20Saudi%20cargo%20cancellations.pdf"}, {"id": "bt-16sep-17", "title": "Oil tankers earn US$1 million a day as Iran war leaves ship shortage", "source": "BT", "date": "16 Sep 2026", "tags": ["Energy", "Geopolitics"], "summary": "The cost of hiring an oil tanker on the industry's benchmark trade route topped US$1 million a day for the first time, as the Iran war leaves too few ships willing to cross the Strait of Hormuz. Vessels hauling oil from the Persian Gulf to China were hired at US$1.035 million a day, Baltic Exchange data showed. The benchmark route has become less relevant as exporters shuttle barrels through Hormuz for collection outside the strait. Costs have been driven by the war and by refining margins spiralling because wars in Iran and Ukraine mean the world is not making enough fuel. Houthi disruptions to Saudi flows have forced some ships to sail 30 days longer around Africa. Hormuz transits fell to four on Monday from 10 a day earlier.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20BT/Oil%20tankers%20earn%20US1%20million%20a%20day%20as%20Iran%20war%20leaves%20ship%20shortage.pdf"}, {"id": "bt-16sep-18", "title": "Portfolio reviews, client meeting prep: Anthropic launches Claude tool for financial advisers", "source": "BT", "date": "16 Sep 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "AI lab Anthropic on Sep 14 launched a set of tools for financial advisers, connecting its Claude chatbot to investment analytics and wealth-management software from firms including BlackRock, Charles Schwab and Addepar. The product, called Claude for Financial Advisors, is designed to help firms prepare for client meetings, review portfolios and handle follow-up work. It also connects Claude with data and software from Envestnet, iCapital, Orion, Wealthbox, Wealth.com and Zocks. The launch comes after rival OpenAI on Sep 10 introduced a version of ChatGPT for the industry, targeting investment bankers and equity researchers with tools for research, modelling and client materials. It builds on Anthropic's broader push into financial services, and comes as the pace and cost of AI development faces growing scrutiny amid fears of misuse.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20BT/Portfolio%20reviews%2C%20client%20meeting%20prep%20Anthropic%20launches%20Claude%20tool%20for%20financial%20advise.pdf"}, {"id": "bt-16sep-19", "title": "The only guardrail AI needs is a 'high IQ' president, Trump says, dismissing calls for more safeguards", "source": "BT", "date": "16 Sep 2026", "tags": ["Technology & AI", "Politics"], "summary": "US President Donald Trump said on Sep 14 that the US already has guardrails to regulate and prosecute AI companies, playing down industry leaders' weekend warnings about AI misuse. Public alarm has grown after Anthropic researcher Jacob Coxon resigned, saying builders believe AI could kill everyone by the decade's end, and AI stocks fell worldwide. Trump wrote on Truth Social that the only guardrail AI needs is a strong, high-IQ president, and called the industry's regulation calls a hoax. Vice-President JD Vance said he was sceptical of AI firms begging to be regulated. Anthropic CEO Dario Amodei had urged independent audits of frontier models in a three-step framework endorsed by Musk and Altman. Three senators are drafting a bill; the administration remains in a dispute with Anthropic over military contracts.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20BT/The%20only%20guardrail%20AI%20needs%20is%20a%20'high%20IQ'%20president%2C%20Trump%20says%2C%20dismissing%20calls%20for%20mor.pdf"}, {"id": "bt-16sep-20", "title": "Trump claims Russia-Ukraine energy truce; Kyiv says not yet", "source": "BT", "date": "16 Sep 2026", "tags": ["Geopolitics", "Energy"], "summary": "US President Donald Trump and Ukraine offered differing accounts of a supposed agreement with Russia to stop attacks on energy infrastructure, as strikes on oil refineries drive diesel prices to record levels. Trump posted on Sep 14 that Moscow and Kyiv agreed to halt the strikes, blaming them rather than the Iran war for surging diesel. Ukrainian President Volodymyr Zelensky said no deal was finalised but acknowledged a strong US proposal for a mutual halt, adding Russia showed no genuine desire to end the war. Markets largely shrugged off the claim, with diesel futures still up about 1 per cent. US retail diesel topped US$6 a gallon for the first time. The issue poses political peril for Trump ahead of the November midterms.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20BT/Trump%20claims%20Russia-Ukraine%20energy%20truce%20Kyiv%20says%20not%20yet.pdf"}, {"id": "bt-16sep-21", "title": "UK payrolls drop more than expected in weak jobs market", "source": "BT", "date": "16 Sep 2026", "tags": ["Finance & Markets"], "summary": "Britain's weak jobs market saw employers shed more workers last month, according to figures released ahead of the Bank of England's interest-rate decision on Sep 17. The number of employees on company payrolls slipped 26,000 in August after a downwardly revised 19,000 fall the previous month, worse than the 5,000 drop economists expected, the Office for National Statistics said. Job vacancies fell 8,000 to a fresh five-year low of 702,000, while unemployment held steady at 4.9 per cent in the three months through July. The figures suggest a low hire, low fire economy amid uncertainty from the US-Iran conflict and the first budget under Prime Minister Andy Burnham on Oct 28. Wage growth excluding bonuses was unchanged at 3.5 per cent, though oil above US$109 lifted rate-hike bets.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20BT/UK%20payrolls%20drop%20more%20than%20expected%20in%20weak%20jobs%20market.pdf"}, {"id": "bt-16sep-22", "title": "US dollar ticks up as oil prices climb, Fed rate hike chances firm", "source": "BT", "date": "16 Sep 2026", "tags": ["Finance & Markets", "Energy"], "summary": "The euro was pinned at a one-month low against a broadly strengthening US dollar on Sep 15, as surging oil prices lifted Treasury yields and reinforced expectations the Federal Reserve will hike interest rates this week. Benchmark 10-year Treasury yields surged to their highest since 2007, last up 4.1 basis points at 5.004 per cent. Oil held near a four-month peak above US$105 a barrel after Houthi attacks on Saudi Arabia and postponed Gulf-Iran talks. Markets see a Fed hike on Wednesday as near certain, with CME's FedWatch pricing more than a 92 per cent chance. The euro slipped to US$1.154 and sterling to US$1.348 ahead of a Bank of England decision, while the yen eased before an expected Bank of Japan hike.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20BT/US%20dollar%20ticks%20up%20as%20oil%20prices%20climb%2C%20Fed%20rate%20hike%20chances%20firm.pdf"}, {"id": "bt-16sep-23", "title": "US facing strategic inventory munitions shortfalls due to attacks on Iran, Pentagon says", "source": "BT", "date": "16 Sep 2026", "tags": ["Defence", "Geopolitics"], "summary": "The US fired so many munitions at Iranian targets during the first months of Operation Epic Fury that it has resulted in strategic inventory shortfalls and revealed industrial-base bottlenecks for resupply, Pentagon officials acknowledged to the Defense Department's independent watchdog. The inspector general report, covering operations through Jun 30, marks official confirmation of a problem the Trump administration has repeatedly downplayed, with Trump claiming the US has virtually unlimited munitions. Acquisition officials said they are working to streamline procurement and stockpile critical materials. The department estimated US$22.3 billion in expended munitions and over US$33 billion in overall costs through June. Iran damaged hundreds of buildings at US bases; the report listed 11 killed in action and over 400 wounded through the end of June.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20BT/US%20facing%20strategic%20inventory%20munitions%20shortfalls%20due%20to%20attacks%20on%20Iran%2C%20Pentagon%20says.pdf"}, {"id": "bt-16sep-24", "title": "Waymo to start Tokyo robotaxi service next year in Asia push", "source": "BT", "date": "16 Sep 2026", "tags": ["Technology & AI", "Society"], "summary": "Alphabet's Waymo plans to bring its robotaxis to Japan next year as the US market leader continues its global expansion. Waymo will partner with Japanese taxi firms Go and Nihon Kotsu to start a fully autonomous service in Tokyo in 2027, beginning with a small fleet before expanding to 100 vehicles. Shares of Go, which manages Japan's top taxi-booking app, rose as much as 9.7 per cent and are up more than 40 per cent since its June IPO. Waymo, which is also preparing a London service, has been testing in Tokyo for the past year; the service would be the first on Japanese public roads. It said robotaxis would help address Japan's aging population and labour shortages.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20BT/Waymo%20to%20start%20Tokyo%20robotaxi%20service%20next%20year%20in%20Asia%20push.pdf"}, {"id": "scmp-16sep-01", "title": "'Doing a North Korea'? Why the Middle East could be entering a new nuclear age", "source": "SCMP", "date": "16 Sep 2026", "tags": ["Geopolitics", "Defence"], "summary": "Analysts warn the Middle East may be entering a new nuclear age as Saudi Arabia moves to acquire American uranium enrichment technology and Turkey signals interest in following suit, while Iran weighs withdrawing from the Non-Proliferation Treaty. Momentum has built after the United States and Israel threatened fresh strikes on Iran's nuclear facilities, accusing Tehran of trying to revive its programme. The warnings followed a September 9 CSIS study claiming construction at the so-called Pickaxe Mountain site likely indicated an underground enrichment or weapons-relevant complex. Trump said intelligence flagged the facility and warned Iran not to 'get cute'. Nuclear weapons expert David Albright disputed the CSIS findings, underscoring uncertainty over Iran's intentions and the region's proliferation risks.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20SCMP/'Doing%20a%20North%20Korea'%20Why%20the%20Middle%20East%20could%20be%20entering%20a%20new%20nuclear%20age.pdf"}, {"id": "scmp-16sep-02", "title": "China bets on chips and AI in new 5-year road map to challenge US tech dominance", "source": "SCMP", "date": "16 Sep 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "China has placed chips and artificial intelligence at the centre of its latest five-year plan for the electronics and information technology sector, seeking self-reliance amid an intensifying tech race with the United States. The Ministry of Industry and Information Technology and the National Development and Reform Commission outlined priorities including comprehensive progress across the integrated-circuit industry, development of open-standard RISC-V chips, and expanded use of the BeiDou satellite system to rival GPS. The plan prioritises high-end processors, high-density memory, advanced process nodes, and next-generation battery and solar technologies. It also calls for substantially increasing compute-power supply for AI. The blueprint forecasts operating revenue in related sectors will exceed 30 trillion yuan by 2030.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20SCMP/China%20bets%20on%20chips%20and%20AI%20in%20new%205-year%20road%20map%20to%20challenge%20US%20tech%20dominance.pdf"}, {"id": "scmp-16sep-03", "title": "China is beating the US in consumer AI adoption, thanks to super apps: Morgan Stanley", "source": "SCMP", "date": "16 Sep 2026", "tags": ["Technology & AI"], "summary": "China is surging ahead of the United States in consumer AI adoption as technology giants like Tencent and Alibaba embed artificial intelligence directly into popular everyday apps, even though American models still lead in capability, according to Morgan Stanley. A bank survey found 80 per cent of Chinese respondents used AI for personal purposes at least weekly, versus 54 per cent in the US. China's generative AI user base grew from about 249 million in December 2024 to 602 million a year later. ByteDance's Doubao led native AI apps with about 399 million monthly active users, followed by Alibaba's Qwen at 161 million. Multi-homing is common, with 64 per cent using five or more AI tools, preventing a winner-take-all outcome.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20SCMP/China%20is%20beating%20the%20US%20in%20consumer%20AI%20adoption%2C%20thanks%20to%20super%20apps%20Morgan%20Stanley.pdf"}, {"id": "scmp-16sep-04", "title": "China targets offshore operations of brokerages in crackdown on pay loopholes, corruption", "source": "SCMP", "date": "16 Sep 2026", "tags": ["Finance & Markets", "Politics"], "summary": "China's securities regulator and its industry body are moving to close compensation loopholes for brokerage management and staff, extending anti-corruption oversight to overseas operations for the first time as Beijing pushes the sector to build world-class investment banks. The Securities Association of China circulated a revised draft of its 'clean practices' rules, seeking industry feedback by September 29. Offshore operations, long viewed as a grey zone vulnerable to illicit transfers and kickbacks, are explicitly targeted. Brokerages would have to establish clawback mechanisms to recover bonuses from staff who breach rules and prepare board-reviewed annual integrity reports. Regulators also propose positive incentives, prioritising promotions for employees who resist improper transfers. The overhaul follows earlier CSRC crackdowns and targets innovation and digital operations.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20SCMP/China%20targets%20offshore%20operations%20of%20brokerages%20in%20crackdown%20on%20pay%20loopholes%2C%20corruption.pdf"}, {"id": "scmp-16sep-05", "title": "China urges 'constructive dialogue' with EU in high-level call with France", "source": "SCMP", "date": "16 Sep 2026", "tags": ["Geopolitics", "Trade"], "summary": "Chinese Foreign Minister Wang Yi urged the European Union to avoid escalating trade disputes and engage in 'constructive dialogue' during a phone call with French counterpart Jean-Noel Barrot on Monday. The conversation, requested by Paris, came as Brussels tightens investment screening, public procurement rules and anti-subsidy measures, particularly on electric vehicles, over what it calls unfair Chinese competition. Wang said the two sides should keep to their partnership, pursue mutually beneficial cooperation and resolve frictions constructively while avoiding confrontation, warning that protectionism would raise inflation and hamper the green transition. The call took place as France holds the rotating UN Security Council presidency and ahead of the UN General Assembly. Paris remains a pivotal player in EU debates on China policy.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20SCMP/China%20urges%20'constructive%20dialogue'%20with%20EU%20in%20high-level%20call%20with%20France.pdf"}, {"id": "scmp-16sep-06", "title": "Chinese firms' export share to reach 31% by 2035 as global expansion deepens: Goldman Sachs", "source": "SCMP", "date": "16 Sep 2026", "tags": ["Trade", "Finance & Markets"], "summary": "Chinese companies 'going global' are moving from the periphery to the core of world business, with their average market share in export markets projected to rise to 31 per cent by 2035 from 18 per cent this year, according to a Goldman Sachs report. The bank said this expansion is not yet fully reflected in share prices, but the firms' revenue would grow 3.6-fold by 2035. The report, covering 40 companies across 11 sectors, said the biggest opportunities favour 'latecomers' in fields such as robotaxis, e-commerce, surgical robots, dental aligners and power equipment. The outlook is less favourable for 'early achievers' like carmakers in Europe. Goldman estimated non-Chinese companies' aggregate revenue would reach 1.6 times current levels by 2035.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20SCMP/Chinese%20firms'%20export%20share%20to%20reach%2031%20by%202035%20as%20global%20expansion%20deepens%20Goldman%20Sachs.pdf"}, {"id": "scmp-16sep-07", "title": "DeepSeek AI engineer slams Anthropic, OpenAI over 'pacing' calls, invokes Nazi Germany", "source": "SCMP", "date": "16 Sep 2026", "tags": ["Technology & AI"], "summary": "A DeepSeek engineer has issued a stark warning about the potential concentration of advanced artificial intelligence in proprietary US developers Anthropic and OpenAI, intensifying a debate in China over calls by US industry leaders to 'pace' AI development amid safety concerns. Liu Shengyu, who worked on DeepSeek's V4.1 models, said he did not trust Anthropic or OpenAI to make cutting-edge AI 'open and affordable', contrasting their closed-source approach with DeepSeek's open-source stance. He compared the prospect of Anthropic controlling the most advanced AI to Nazi Germany acquiring nuclear weapons before the Allies. The comments preceded an expected Xi-Trump meeting on September 24. Anthropic CEO Dario Amodei recently urged frontier firms to slow development, a call backed by Sam Altman and Elon Musk.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20SCMP/DeepSeek%20AI%20engineer%20slams%20Anthropic%2C%20OpenAI%20over%20'pacing'%20calls%2C%20invokes%20Nazi%20Germany.pdf"}, {"id": "scmp-16sep-08", "title": "Hong Kong's first 5-year plan to set goals, not alter economic system: John Lee", "source": "SCMP", "date": "16 Sep 2026", "tags": ["Politics"], "summary": "Hong Kong's first five-year plan will include both binding and anticipatory targets but will not signal a move towards a planned economy, Chief Executive John Lee Ka-chiu has said. Lee revealed the plan will be unveiled alongside his annual policy address the following day and will feature a blue cover symbolising blue skies, openness, progress and steadiness. He stressed that some indicators would be binding on the government while others reflect aspirations requiring broad cooperation, though he stopped short of confirming specific targets for major initiatives such as the Northern Metropolis megaproject. 'I want to make it very clear: the five-year plan is not a planned economy,' he said, describing it as a strategic blueprint for the next five years.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20SCMP/Hong%20Kong's%20first%205-year%20plan%20to%20set%20goals%2C%20not%20alter%20economic%20system%20John%20Lee.pdf"}, {"id": "scmp-16sep-09", "title": "Hong Kong's next policy address is just around the corner. Here's what to expect", "source": "SCMP", "date": "16 Sep 2026", "tags": ["Politics"], "summary": "Hong Kong leader John Lee Ka-chiu's coming policy address will introduce measures to remove hurdles for businesses setting up in the Northern Metropolis and include proactive initiatives to strengthen innovation hubs, research and technology applications, sources told the South China Morning Post. Support for the northern New Territories megaproject and backing for innovation are expected to be major highlights of Wednesday's address, delivered the same day Lee unveils the city's first five-year plan. The speech is expected to last no more than three hours, split evenly between the plan and the address. The five-year plan will include aspirational and binding key performance indicators. Officials plan deregulation and streamlining measures, including faster approvals, while safeguarding urban planning, environmental protection and safety.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20SCMP/Hong%20Kong's%20next%20policy%20address%20is%20just%20around%20the%20corner.%20Here's%20what%20to%20expect.pdf"}, {"id": "scmp-16sep-10", "title": "How Canada's Trump headache is fuelling a China trade boom", "source": "SCMP", "date": "16 Sep 2026", "tags": ["Trade", "Geopolitics"], "summary": "Canada's exports to China jumped 30.1 per cent in the first half of 2026, led by crude oil, copper and other energy and mineral products, as Ottawa stepped up efforts to diversify trade ties amid growing tensions with the United States. Exports reached C$21.74 billion (US$15.63 billion), the highest first-half value since 1997, according to a report by the Canada China Business Council and the China Institute at the University of Alberta. Energy products made up 35.8 per cent of shipments, surging 81.8 per cent, while metal ores and minerals rose 29 per cent. Crude petroleum exports more than doubled. Analysts said the growth reflected strong alignment between Canadian supply and Chinese demand, with Ottawa pursuing 'de-risking' from Washington.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20SCMP/How%20Canada's%20Trump%20headache%20is%20fuelling%20a%20China%20trade%20boom.pdf"}, {"id": "scmp-16sep-11", "title": "How Okinawa's political shift could make Japan more prepared for a Taiwan contingency", "source": "SCMP", "date": "16 Sep 2026", "tags": ["Defence", "Geopolitics"], "summary": "Okinawa's election on Sunday of a governor backed by Japan's ruling party ended 12 years of local leadership opposed to relocating a US airbase and elements of Tokyo's defence build-up, potentially making Japan more prepared for a Taiwan contingency. Analysts say Genta Koja's victory grants Tokyo no new military authority but could enable closer integration of civilian infrastructure into Japan's defence network and support the 'Nansei shift', concentrating forces in the southwest to deter China. With a prefectural government aligned with Prime Minister Sanae Takaichi's Liberal Democratic Party, the process would be less contentious and perhaps faster. However, Koja opposes deploying long-range missiles in Okinawa 'at present' and maintains a distinct stance on the long-disputed Futenma airbase relocation.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20SCMP/How%20Okinawa's%20political%20shift%20could%20make%20Japan%20more%20prepared%20for%20a%20Taiwan%20contingency.pdf"}, {"id": "scmp-16sep-12", "title": "Iran's top diplomat heads to China for talks as Middle East diplomacy falters", "source": "SCMP", "date": "16 Sep 2026", "tags": ["Geopolitics", "Energy"], "summary": "Iranian Foreign Minister Abbas Araghchi will meet Chinese counterpart Wang Yi in China on Wednesday amid stalled efforts to de-escalate Middle East conflicts. The talks come during the countdown to President Xi Jinping's US summit with Donald Trump next week, when the war on Iran and disruption of energy shipments through the Strait of Hormuz are expected to feature prominently. Fighting has erupted again between Yemen's Houthis and government forces and Saudi Arabia, and a regional meeting expected to address the conflicts and the strait's reopening was postponed indefinitely. The talks could lay groundwork for a visit by Parliament Speaker Mohammad Bagher Ghalibaf, Iran's special representative for China affairs. Reports that Beijing set conditions, including reopening the strait, were denied.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20SCMP/Iran's%20top%20diplomat%20heads%20to%20China%20for%20talks%20as%20Middle%20East%20diplomacy%20falters.pdf"}, {"id": "scmp-16sep-13", "title": "Price of Epic Fury: Iran war's toll on US bases, weapons and more", "source": "SCMP", "date": "16 Sep 2026", "tags": ["Defence", "Geopolitics"], "summary": "A US government watchdog released its first report on the impact of the Iran war, acknowledging the military's advanced weapons shortfalls and offering the first public look at damage to American aircraft, bases and diplomatic outposts in the Middle East. The Pentagon inspector general's report on Operation Epic Fury said the conflict 'resulted in strategic inventory shortfalls and revealed industrial base bottlenecks' for munitions resupply, with experts estimating three years to replenish advanced missiles and interceptors. The Pentagon disputed reports of shortages, and Trump claimed the US was producing more weapons than ever. Covering April 1 to June 30, the report said Iranian strikes damaged hundreds of structures at US bases across the Gulf, including the naval hub in Bahrain.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20SCMP/Price%20of%20Epic%20Fury%20Iran%20war's%20toll%20on%20US%20bases%2C%20weapons%20and%20more.pdf"}, {"id": "scmp-16sep-14", "title": "Sanders and Bannon call for AI limits, as public unease grows", "source": "SCMP", "date": "16 Sep 2026", "tags": ["Technology & AI", "Politics"], "summary": "Progressive US Senator Bernie Sanders and Steve Bannon, a close ally of President Donald Trump, called on Tuesday for restrictions on AI systems, uniting two political adversaries around concerns the technology will harm humans. Appearing at the same Washington gathering, they warned of potentially catastrophic consequences as unease spreads beyond Washington and Silicon Valley. Sanders warned AI could eliminate tens of millions of jobs and escape human control, and said the industry needed binding safety rules. He cited AI's reported use to create new viruses, raising bioweapon risks, and criticised tech executives including Elon Musk for centralising control. Sanders urged Trump to negotiate a treaty with Xi Jinping to pause AI development. Bannon called AI the defining issue of our time.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20SCMP/Sanders%20and%20Bannon%20call%20for%20AI%20limits%2C%20as%20public%20unease%20grows.pdf"}, {"id": "scmp-16sep-15", "title": "Taiwan tests US-made MQ-9B drones to counter PLA 'grey-zone' operations", "source": "SCMP", "date": "16 Sep 2026", "tags": ["Defence", "Technology & AI"], "summary": "Taiwan has begun flight testing its newly acquired US-made MQ-9B drones, giving the island a long-range reconnaissance platform to monitor People's Liberation Army and grey-zone activities across surrounding waters. The first two of four MQ-9B SeaGuardians ordered from the United States took off from Hualien Air Base on Monday, their first test flight since arriving by sea in June. They will serve with the 12th Tactical Reconnaissance Squadron and be used mainly for intelligence, surveillance and reconnaissance rather than strike missions, particularly tracking PLA warships and mainland coastguard vessels. Taiwan has allocated NT$21.7 billion (US$684 million) between 2022 and 2029 for the drones and related equipment. The MQ-9B is a larger, more advanced derivative of the MQ-9A Reaper.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20SCMP/Taiwan%20tests%20US-made%20MQ-9B%20drones%20to%20counter%20PLA%20'grey-zone'%20operations.pdf"}, {"id": "scmp-16sep-16", "title": "The world is not so much embracing China as recoiling from Trump's US", "source": "SCMP", "date": "16 Sep 2026", "tags": ["Geopolitics"], "summary": "This commentary argues that China's rising global popularity reflects revulsion at Donald Trump's United States rather than genuine embrace of Beijing, which still must build trustworthiness and credibility to win hearts and minds. It cites two recent summits as evidence: the Shanghai Cooperation Organisation gathering in Bishkek and the Group of 20 meeting in the US. The Bishkek Declaration condemned military strikes on Iran as violations of international law and the UN Charter, and SCO members opposed 'unilateral coercive measures' such as sanctions, challenging Washington's long-standing practice. Signatories included Xi Jinping, Narendra Modi and Shehbaz Sharif. At the G20, European allies used the platform to voice displeasure over American unilateralism, underscoring eroding US goodwill worldwide.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20SCMP/The%20world%20is%20not%20so%20much%20embracing%20China%20as%20recoiling%20from%20Trump's%20US.pdf"}, {"id": "scmp-16sep-17", "title": "Tighter scrutiny of Hong Kong IPOs could slow deal flow, analysts say", "source": "SCMP", "date": "16 Sep 2026", "tags": ["Fina
