g_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20WSJ/U.K.%20Government%20Borrowing%20Rose%20Despite%20Record%20Income%20Tax%20Revenue.pdf"},{"id":"wsj-21","title":"Week Ahead for FX, Bonds: Warsh Speech at Jackson Hole, U.S. PCE Data in Focus","source":"WSJ","date":"24 Aug 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"Fed Chairman Kevin Warsh's Jackson Hole speech (Aug. 27-29) headlines the week as investors seek clarity on when U.S. rates might rise; money markets almost fully price a 25 basis-point increase by December. Wednesday's July PCE inflation data, the Fed's preferred gauge, is also key, alongside GDP and Treasury note auctions after long-dated yields hit multiyear highs. In Asia, three central-bank decisions feature amid Middle East-driven inflation: the Bank of Korea may hike again, while the Philippines is expected to raise rates to 5.00% and Thailand to hold at 1.00%. The ECB is seen likely hiking to 2.5% in September. Singapore inflation, due Monday, likely accelerated to 2.4% in July as energy and higher electricity tariffs filtered through.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20WSJ/Week%20Ahead%20for%20FX,%20Bonds%20Warsh%20Speech%20at%20Jackson%20Hole,%20U.S.%20PCE%20Data%20in%20Focus.pdf"},{"id":"st-01","title":"AI has made us more productive. Why do we still feel so busy?","source":"ST","date":"24 Aug 2026","tags":["Technology & AI","Society"],"summary":"In this commentary, Singapore Institute of Technology associate professor May Lim argues that AI clearly helps people work faster, but productivity gains rarely convert into free time or deeper connection. When tasks take less time, organisational expectations simply rise, absorbing the savings into more meetings, reports and deliverables; virtual meetings, for instance, spawned more meetings, not fewer. She invokes a \"kiasu\" instinct where Singaporeans fill saved time with extra output rather than rest. Real value, she writes, comes from intentionality: deliberately protecting reclaimed time for upskilling, mentoring, relationships and well-being. She cites Novo Nordisk's GenAI rollout, guided by the idea that \"time is the ultimate currency,\" where staff reinvested time in people and creative work. The greatest productivity gain, she concludes, is using time better.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20ST/AI%20has%20made%20us%20more%20productive.%20Why%20do%20we%20still%20feel%20so%20busy.pdf"},{"id":"st-02","title":"Australia's battery boom is reshaping the grid, but few are sharing the power","source":"ST","date":"24 Aug 2026","tags":["Energy","Environment"],"summary":"Australia's household battery boom is turning homes into miniature power plants, but few owners share stored power with the grid. One in three homes (4.3 million) has rooftop solar, the world's highest per-capita rate, totalling 28.3 gigawatts. A federal Cheaper Home Batteries Programme subsidy of about 30 per cent drove installations past 500,000, lifting capacity to 14,000 megawatt-hours, more than the US. Yet only about 24 per cent of battery owners join virtual power plants (VPPs), short of AEMO's 50 per cent target that could avoid A$7.2 billion in investment. Owners distrust ceding control and unequal reward splits; retailers like Amber pass through wholesale prices for a flat fee. Gas generation hit its lowest since 2003 as batteries cover evening peaks.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20ST/Australia's%20battery%20boom%20is%20reshaping%20the%20grid,%20but%20few%20are%20sharing%20the%20power.pdf"},{"id":"st-03","title":"British PM Burnham to visit Ukraine with plan to support long-range missile production","source":"ST","date":"24 Aug 2026","tags":["Geopolitics","Defence"],"summary":"Ukraine on Aug 24, its independence day and 4.5 years since Russia's 2022 invasion, hosts a Coalition of the Willing meeting chaired by Britain, France and Germany to press for air defences and more pressure on Moscow. British PM Andy Burnham, on his first foreign trip since entering Downing Street, will announce authorisation for defence firm MBDA to release classified information helping Ukraine and France set up local production of the long-range SCALP missile. Russian ballistic-missile strikes have pushed civilian deaths to their highest since early 2022. Zelensky disclosed that Patriot interceptor deliveries halved from 675 in 2023 to 364 in 2025, with just 264 projected for 2026, seeking at least 300 for winter. Macron pledged new interceptors.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20ST/British%20PM%20Burnham%20to%20visit%20Ukraine%20with%20plan%20to%20support%20long-range%20missile%20production.pdf"},{"id":"st-04","title":"Canada to retaliate against US tariffs, worsening ties after talks fail","source":"ST","date":"24 Aug 2026","tags":["Trade","Geopolitics"],"summary":"Canada will impose \"dollar for dollar\" tariffs on US steel, dairy, appliances, electronics and other goods from Sept 8 in retaliation for President Donald Trump's 50 per cent levies, PM Mark Carney said on Aug 22 after three days of trade talks collapsed. Trump's new tariffs hit wine, furniture, cement and hockey equipment, covering about US$20 billion (S$25 billion) of Canadian exports, and do not exempt USMCA-covered goods. \"You're at war when you get attacked,\" Carney said, pledging support measures for hit industries. A key sticking point was larger vehicles; Carney said US terms would have excluded Canadian-made trucks. US Trade Representative Jamieson Greer called it a missed opportunity, with no new talks planned. Canada depends on the US for nearly 70 per cent of exports.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20ST/Canada%20to%20retaliate%20against%20US%20tariffs,%20worsening%20ties%20after%20talks%20fail.pdf"},{"id":"st-05","title":"China 'actively committed' to Iran talks with tensions rising","source":"ST","date":"24 Aug 2026","tags":["Geopolitics","Energy"],"summary":"China said it continues to support a diplomatic end to the US-Iran war, in a delayed statement released shortly before Washington was set to unveil measures punishing Tehran's economic partners. Vice-Foreign Minister Miao Deyu told Iran's Deputy Foreign Minister Kazem Gharibabadi in Beijing on Aug 17 that China was \"actively committed to promoting peace talks\"; the meeting was disclosed only on Aug 23. The timing precedes US Treasury Secretary Scott Bessent's plan to shift the conflict toward full economic isolation. Trump has threatened Iran and its trading partners after strikes and a maritime blockade failed to force capitulation. China buys the bulk of Iran's oil and was its second-largest trading partner in 2025, behind the UAE, which cut all economic ties with Tehran.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20ST/China%20'actively%20committed'%20to%20Iran%20talks%20with%20tensions%20rising.pdf"},{"id":"st-06","title":"China's property crisis grinds on after Evergrande sentencing","source":"ST","date":"24 Aug 2026","tags":["Finance & Markets","Geopolitics"],"summary":"Evergrande founder Hui Ka Yan, once Asia's richest person, was sentenced to life in prison last week, but China's property collapse grinds into its sixth year with no clear end. Millions of partially built homes sit derelict; new-home price recovery in Beijing and Shanghai has stalled, land sales are plunging, and second-hand prices in smaller inland cities are down nearly a quarter from 2020. China's economy grew 4.3 per cent in the second quarter, its slowest in over three years. With domestic demand in reverse, China leans on exports, more than doubling its trade surplus since 2019 and fuelling \"China Shock 2.0\" fears. Analyst Sam Radwan says prices must fall a further 40 per cent to reach equilibrium; state-owned developers now dominate.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20ST/China's%20property%20crisis%20grinds%20on%20after%20Evergrande%20sentencing.pdf"},{"id":"st-07","title":"Fusion is no longer science fiction, but affordable fusion might be","source":"ST","date":"24 Aug 2026","tags":["Energy","Technology & AI"],"summary":"In this commentary, ETH Zurich researcher Tang Lingxi argues fusion power will become real within our lifetime but is unlikely to be economically competitive. Investors and governments are betting big: US start-ups hold over US$8 billion in funding, China commits about US$1.5 billion annually, and Commonwealth Fusion Systems (backed by Nvidia, Bill Gates and Temasek) raised another US$1 billion. Singapore's NRF allocated $11.6 million to NTU's fusion programme plus $6 million for a chair. But since electricity carries no premium, fusion must beat renewables-plus-storage, geothermal and small modular reactors. ITER is over a decade late and quadruple its budget; his Nature Energy paper found fusion's cost-learning rates unrealistically optimistic. He urges funding fusion as basic research, backing transferable knowledge over any single reactor design.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20ST/Fusion%20is%20no%20longer%20science%20fiction,%20but%20affordable%20fusion%20might%20be.pdf"},{"id":"st-08","title":"Germany's AfD eyes Saxony-Anhalt win as first step toward federal power","source":"ST","date":"24 Aug 2026","tags":["Politics","Geopolitics"],"summary":"Germany's far-right Alternative for Germany (AfD) is banking on a breakthrough in the Sept 6 Saxony-Anhalt state election to build momentum for a future national victory, co-leader Alice Weidel said on Aug 23. \"We will form the government in Saxony-Anhalt,\" she said, expressing confidence the party can govern the eastern state alone. An Infratest dimap poll shows AfD at 41 per cent, well ahead of Chancellor Friedrich Merz's CDU at 24 per cent. Weidel said the CDU's \"firewall\" policy of refusing cooperation would weaken conservatives and eventually let the AfD govern nationally, declaring \"the CDU will never win another federal election.\" The AfD also leads national polls at 27 per cent. Saxony-Anhalt is the first of three September state votes, with Berlin and Mecklenburg-Western Pomerania on Sept 20.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20ST/Germany's%20AfD%20eyes%20Saxony-Anhalt%20win%20as%20first%20step%20toward%20federal%20power.pdf"},{"id":"st-09","title":"Higher BTO, resale flat demand expected after income ceiling raised, but supply can keep up: Analysts","source":"ST","date":"24 Aug 2026","tags":["Society","Finance & Markets"],"summary":"Property analysts expect Singapore's higher public-housing income ceilings to lift demand, but say a strong pipeline of new and resale flats will keep supply apace. In his Aug 23 National Day Rally, PM Lawrence Wong raised the BTO income ceiling to $16,000 for families and $8,000 for singles (from $14,000 and $7,000), with the same applying to resale-grant buyers. About 13,500 flats reach their MOP in 2026, rising to 19,500 by 2028, while HDB will launch around 19,600 BTO flats in 2026. Analysts said higher-income buyers may opt for larger BTO units or resale flats eligible for up to $80,000 in grants, potentially pushing up resale prices. The EC income ceiling rises to $18,000; HDB resale prices dipped 0.3 per cent in the second quarter.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20ST/Higher%20BTO,%20resale%20flat%20demand%20expected%20after%20income%20ceiling%20raised,%20but%20supply%20can%20keep%20u.pdf"},{"id":"st-10","title":"Iran says it has discovered more than 200 billion cubic m of gas","source":"ST","date":"24 Aug 2026","tags":["Energy","Geopolitics"],"summary":"Iran has discovered more than 212.4 billion cubic metres of gas in a field in the south of its Fars province, Oil Minister Mohsen Paknejad said via state media on Aug 23. Given the recovery ratio, about 161.41 billion cubic metres could be extracted. Iran estimates pre-war output at around 650 million cubic metres per day, or roughly 240 billion per year. Tehran has been repairing energy infrastructure damaged in its war with Israel and the United States, and now faces planned US sanctions. In July, an official said Iran expected to restore about 100 million cubic metres per day within months, after strikes cut output by about 230 million cubic metres per day. Paknejad said the gas was \"sweet,\" reducing development and operating costs.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20ST/Iran%20says%20it%20has%20discovered%20more%20than%20200%20billion%20cubic%20m%20of%20gas.pdf"},{"id":"st-11","title":"Major Japan defence firms stepping up drone development","source":"ST","date":"24 Aug 2026","tags":["Defence","Technology & AI"],"summary":"Major Japanese defence firms such as Mitsubishi Heavy Industries are stepping up drone development as the government makes unmanned systems and AI central to its new defence strategy. The push reflects a global race intensified since Russia's invasion of Ukraine, though rising drone use has raised concerns over civilian casualties. Mitsubishi Heavy said in May it developed a prototype interceptor drone capable of shooting down attack drones in just three months, and can mass-produce faster than start-ups by drawing on helicopter expertise. Kawasaki Heavy is working with Airbus on an unmanned aircraft with submarine-detection systems. Start-ups like Terra Drone and Rakuten (partnering a German firm) are also involved, though Rakuten's move drew criticism. Japan's 2026 defence white paper urges adopting cutting-edge private-sector technology.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20ST/Major%20Japan%20defence%20firms%20stepping%20up%20drone%20development.pdf"},{"id":"st-12","title":"NDR 2026: PM Wong announces major reset in family support","source":"ST","date":"24 Aug 2026","tags":["Society","Politics"],"summary":"At his third National Day Rally on Aug 23, PM Lawrence Wong announced a fundamental reset in family support, shifting help across the child-raising journey rather than concentrating it around birth. Every working parent will get 8 to 12 days of childcare leave, each Singaporean child nearly $70,000 in direct support, and full-day childcare fees will fall to $150 a month by 2030. The BTO income ceiling rises to $16,000 ($18,000 for ECs), with first-timers gaining an extra ballot chance per child. The measures respond to a record-low total fertility rate of 0.87 in 2025. Wong also unveiled long-term plans to merge southern islands into a new western island for power and defence, study undersea tunnels to Pulau Tekong, and impose tighter social-media safeguards for minors.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20ST/NDR%202026%20PM%20Wong%20announces%20major%20reset%20in%20family%20support.pdf"},{"id":"st-13","title":"NDR 2026: S'pore will not allow itself to be used as a conduit for illegal trade practices, says PM Wong","source":"ST","date":"24 Aug 2026","tags":["Trade","Geopolitics"],"summary":"At the Aug 23 National Day Rally, PM Lawrence Wong said Singapore will not allow itself to be a conduit for illegal trade practices, but cannot verify the entire supply chain behind every product passing through as a major re-export and transshipment hub. He addressed the higher 12.5 per cent US tariffs imposed over alleged forced labour, plus US concerns about Chinese goods routed through South-east Asia to circumvent tariffs. Wong said tariffs are one symptom of deeper tensions in a more unstable world, as China becomes a US peer competitor and power disperses. He cited pandemic, Ukraine and Middle East shocks exposing supply vulnerabilities, oil above US$100 a barrel, and grey-zone tactics like cyberattacks. This, he said, is the \"new normal\" Singapore must endure.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20ST/NDR%202026%20S'pore%20will%20not%20allow%20itself%20to%20be%20used%20as%20a%20conduit%20for%20illegal%20trade%20practices,.pdf"},{"id":"st-14","title":"NDR 2026: S'poreans to remain majority; Govt to continue managing size of foreign workforce: PM Wong","source":"ST","date":"24 Aug 2026","tags":["Society","Politics"],"summary":"At the Aug 23 National Day Rally, PM Lawrence Wong assured that Singaporeans will remain the majority even as the country welcomes newcomers to sustain its population, and that the current ethnic balance will be broadly maintained. With the total fertility rate likely to stay far below replacement, relying on births alone would shrink and age the citizen population, so Singapore will refresh citizenship at a measured pace. Wong said the foreign workforce will be managed in a careful, controlled way; because work-permit holders are already the largest group, even modest easing could sharply raise numbers, a path Singapore will not take. Overall population and labour force will grow more slowly, with future growth coming from technology and productivity. He stressed integration must go both ways.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20ST/NDR%202026%20S'poreans%20to%20remain%20majority%20Govt%20to%20continue%20managing%20size%20of%20foreign%20workforce.pdf"},{"id":"st-15","title":"NDR 2026: Singapore won't leave workers to fend for themselves when embracing new tech","source":"ST","date":"24 Aug 2026","tags":["Technology & AI","Society"],"summary":"At the Aug 23 National Day Rally, PM Lawrence Wong said Singapore will embrace disruptive technologies like autonomous vehicles but will not leave affected workers to fend for themselves. Driverless shuttle trials by ComfortDelGro and Grab launched in Punggol, and self-driving buses will be tested from end-2026 in Marina Bay, Shenton Way and one-north. As bus-captain recruitment gets harder and two in three cabbies are aged 60-plus, AVs can ease manpower gaps, but the Government will scale up progressively while retraining drivers. Wong likened this to how Singapore welcomed ride-hailing with rules to protect drivers. He praised AI agents for empowering small firms, cited healthcare benefits, but warned of risks after OpenAI, Anthropic and Meta reported AI models going rogue during testing, pledging coalitions around practical safeguards.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20ST/NDR%202026%20Singapore%20won't%20leave%20workers%20to%20fend%20for%20themselves%20when%20embracing%20new%20tech.pdf"},{"id":"st-16","title":"NDR 2026 gives S'poreans reasons to be confident in the future despite external uncertainty: Analysts","source":"ST","date":"24 Aug 2026","tags":["Politics","Society"],"summary":"Analysts said the central theme of PM Lawrence Wong's third National Day Rally on Aug 23 was that Singapore will manage change skilfully and give citizens confidence amid geopolitical and technological uncertainty. SMU's Eugene Tan noted a \"tenor of defiance\" and quiet optimism, while IPS's Mathew Mathews cited a strong emphasis on future confidence. The star announcement was the reset of family support, including boosted childcare leave, lower pre-school fees and raised BTO/EC income ceilings, which IPS's Gillian Koh said shows how far the state will go to promote parenthood. MP Cassandra Lee and NTUC's K. Thanaletchimi stressed employer implementation. Analysts welcomed clear assurances on sustainable immigration without loosening work-permit policy, and Wong's measured approach to AI risks and social-media safeguards, engaging technology on Singapore's own terms.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20ST/NDR%202026%20gives%20S'poreans%20reasons%20to%20be%20confident%20in%20the%20future%20despite%20external%20uncertaint.pdf"},{"id":"st-17","title":"Norway pledges $11 billion as Baltic, Nordic leaders gather in Kyiv","source":"ST","date":"24 Aug 2026","tags":["Geopolitics","Defence"],"summary":"Norway will give Ukraine US$9 billion (S$11.4 billion) in 2027, a record high, PM Jonas Gahr Store said on Aug 23 as Baltic and Nordic leaders gathered in Kyiv in a show of support. Most of the aid will go to Ukraine's military. On Aug 24, Kyiv hosts a French-British-led Coalition of the Willing meeting to discuss ramping up support and pressure on Russia ahead of winter. Zelensky said his army faces a US$27-billion deficit and urged the EU to advance payments on part of a €90 billion (S$133 billion) loan to cover the 2026 gap. Without some US$10 billion by year-end, he warned, his soldiers would not have enough weapons. Since 2022, Kyiv has relied on tens of billions in support to keep its economy and army functioning.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20ST/Norway%20pledges%2011%20billion%20as%20Baltic,%20Nordic%20leaders%20gather%20in%20Kyiv.pdf"},{"id":"st-18","title":"Nvidia customers notified of AI-related price hikes of above 15%: Sources","source":"ST","date":"24 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Some of Nvidia's biggest customers have been told that prices of servers containing its AI chips are in many cases rising more than 15 per cent, as memory chip costs soar. The increases take effect on systems shipped in early 2027, including those with flagship Vera Rubin and Grace Blackwell chips, and depend on chip generation and memory configuration. Contract server builders for Microsoft, Google and Oracle have notified customers. The move shows the leverage of DRAM makers Samsung, SK Hynix and Micron amid surging AI-infrastructure demand; Apple and Qualcomm have also raised prices over shortages. Nvidia, with a 75 per cent gross margin, cannot fully absorb the costs. The hikes add complexity to data-centre build-outs already hit by delays and labour shortages. Nvidia reports fiscal second-quarter earnings next week.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20ST/Nvidia%20customers%20notified%20of%20AI-related%20price%20hikes%20of%20above%2015%20Sources.pdf"},{"id":"st-19","title":"Russia's Putin says Ukraine opened 'Pandora's box' with strikes on economic targets","source":"ST","date":"24 Aug 2026","tags":["Geopolitics","Energy"],"summary":"Russian President Vladimir Putin said in comments published on Aug 22 that Kyiv had opened \"Pandora's box\" with strikes on Russian economic targets, vowing to hit back at Ukraine's \"most sensitive economic sectors.\" Ukraine has this summer escalated a drone campaign against Russian oil refineries and online retailers' warehouses, targeting infrastructure it says is central to Moscow's war effort. Russia has responded with strikes on Ukrainian economic infrastructure, including Black Sea grain exports. Putin claimed the strikes on Ukraine's agricultural exports would not cause global food shortages because Russia could replace Ukrainian supplies. Russia exited a Turkish-brokered grain deal in 2023. He restated that Moscow remains open to peace talks, but only on the basis of \"realities on the ground,\" rejecting what he called \"exotic\" proposals from Kyiv.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20ST/Russia's%20Putin%20says%20Ukraine%20opened%20'Pandora's%20box'%20with%20strikes%20on%20economic%20targets.pdf"},{"id":"st-20","title":"SGX seeks to shake off 'boring' image, draw more young investors as trading hits 12-year high","source":"ST","date":"24 Aug 2026","tags":["Finance & Markets","Society"],"summary":"As market-revival measures bear fruit, the Singapore Exchange is recording stronger retail participation, with retail securities daily average value up 52 per cent year on year to a 12-year high in the financial year ended June 30. SGX's Emelia Tan said the exchange is working to dispel the myth that the local market is \"boring\" versus US growth stocks, noting Singapore's five-year total return of 125 per cent beat the US's 73 per cent. From Oct 5, standard board lots fall from 100 to 10 units for 11 stocks priced above $10. ETF assets under management rose 43 per cent, and a Global Listing Board will allow concurrent SGX-Nasdaq listings. Chan Kum Kong even envisions a \"baby bonus\" earmarked for stocks so children hold investments from birth.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20ST/SGX%20seeks%20to%20shake%20off%20'boring'%20image,%20draw%20more%20young%20investors%20as%20trading%20hits%2012-year%20h.pdf"},{"id":"st-21","title":"South Korea sends first container ship through Arctic route","source":"ST","date":"24 Aug 2026","tags":["Trade","Environment"],"summary":"South Korea sent its first trial container ship through the Arctic on Aug 22 as the Middle East war roils global shipping, though environmental groups warn the route could accelerate polar ice melt. The PanStar Acro sailed from Busan New Port toward Felixstowe, Rotterdam and Gdansk on a roughly 45-day voyage, following China's Dubai Tower earlier in August. The Arctic route can cut the Asia-Europe journey by about 7,000km and 10 days versus the Suez Canal. Vice-Oceans Minister Nam Jae-hon said it is \"bound to become an alternative\" to Middle Eastern lanes. Experts warned South Korean ships could risk breaching Western sanctions by using Russian navigation services. Major carriers CMA CGM, MSC and Hapag-Lloyd have pledged to avoid Arctic routes.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20ST/South%20Korea%20sends%20first%20container%20ship%20through%20Arctic%20route.pdf"},{"id":"st-22","title":"Syria, Israel hold US-mediated talks to ease tensions","source":"ST","date":"24 Aug 2026","tags":["Geopolitics","Defence"],"summary":"Syria and Israel held high-level, US-mediated talks in Jordan on Aug 23 aimed at easing tensions after recent Israeli strikes on Syrian territory, Syria's SANA news agency reported. Talks focused on halting Israeli strikes, arrests and targeted operations, and reviving negotiations toward a security agreement, while also addressing Israel-Turkey friction. Syrian Foreign Minister Asaad al-Shaibani said security talks, suspended during the Iran war and cut off after Israeli strikes on the Abu al-Duhur airbase on Aug 18, should resume soon despite a lack of trust. Damascus demanded an Israeli withdrawal to pre-Dec 2024 positions and full restoration of a 1974 disengagement agreement, and rejected limits on rebuilding its armed forces. Washington has sought a Syria-Israel deal for over a year under President Ahmed al-Sharaa.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20ST/Syria,%20Israel%20hold%20US-mediated%20talks%20to%20ease%20tensions.pdf"},{"id":"st-23","title":"Why Singapore's singles have a stake in its new baby push","source":"ST","date":"24 Aug 2026","tags":["Society","Politics"],"summary":"In this commentary, Bhavan Jaipragas argues PM Lawrence Wong's SG Child Support Package marks a shift asking all taxpayers, including a rising pool of singles and childless couples, to shoulder more of the cost of raising children. The measures move from partial to full employer reimbursement of child-related leave, more childcare leave, nearly $70,000 per child, and universal cuts to infant-care and pre-school fees. The columnist frames this as treating parenthood as a quasi-public service and children as \"human infrastructure,\" echoing economist Nancy Folbre. He notes even Nordic states fail to cover parenthood's true cost, and cites Singapore's old-age support ratio falling to 3.3 in 2025 from 10.5 in 1990. He warns the push must not justify easing immigration, which remains essential given below-replacement fertility.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20ST/Why%20Singapore's%20singles%20have%20a%20stake%20in%20its%20new%20baby%20push.pdf"},{"id":"st-24","title":"Why the key shift in Singapore's baby policy: From incentivising births to supporting parenthood","source":"ST","date":"24 Aug 2026","tags":["Society","Politics"],"summary":"In this analysis, Theresa Tan explains the philosophical shift in PM Lawrence Wong's Aug 23 National Day Rally family measures: moving from incentivising births to sustained support for parenthood. Unlike past enhancements tied to birth dates and higher-order births, the new SG Child Support Package extends to all Singaporean children born in 2026 or aged one to 17, giving each an equal $10,000 cash gift and $2,000 annual child credits. The change acknowledges that over 20 years of birth incentives failed to arrest the falling total fertility rate, which sank from 1.41 in 2001 to a record 0.87 in 2025, driven largely by more women staying single. The Marriage and Parenthood Reset Workgroup targets dating, workplace culture and parenting fears. The Government will also fully cover statutory child-related leave costs.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20ST/Why%20the%20key%20shift%20in%20Singapore's%20baby%20policy%20From%20incentivising%20births%20to%20supporting%20paren.pdf"},{"id":"st-25","title":"Will Japan rewire global rare earth supply chains with its deep-sea breakthrough?","source":"ST","date":"24 Aug 2026","tags":["Geopolitics","Technology & AI"],"summary":"Japan's world-first extraction of rare earth deposits from nearly 5,600m beneath the Pacific near Minamitorishima has ignited hope it can break Beijing's grip on critical minerals. The clay-like sludge is rich in coveted medium and heavy rare earths used in defence, semiconductors and EVs; JAMSTEC's vessel Chikyu recovered 50 tonnes over three days, with 54 per cent medium and heavy rare earths, virtually free of radioactive contaminants. China commands about 70 per cent of mining and over 90 per cent of refining. But economics remain daunting: a February 2027 pilot targets 350 tonnes of mud daily, a tenth of the 3,500 tonnes deemed commercially viable, and Japan lacks refining facilities. Analyst Kazuto Suzuki warns dependence on China persists without processing infrastructure.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20ST/Will%20Japan%20rewire%20global%20rare%20earth%20supply%20chains%20with%20its%20deep-sea%20breakthrough.pdf"},{"id":"st-26","title":"Zelensky says Ukraine not behind Nord Stream blasts, cooperating with probe","source":"ST","date":"24 Aug 2026","tags":["Geopolitics","Energy"],"summary":"Ukrainian President Volodymyr Zelensky repeated on Aug 23 that Kyiv did not take part in the 2022 attack on the Nord Stream pipeline, which carried Russian gas to Europe. German prosecutors said in July the blasts were ordered by the Ukrainian state, an allegation that could complicate relations with a key military backer. \"Ukraine has never officially taken part in any operation related to the blowing up of Nord Stream,\" Zelensky told reporters, adding Germany was \"well aware\" Kyiv did not stand behind it. He said Kyiv was helping Berlin's investigation and hoped it would not cause a rift, stressing the importance of not losing European trust and partnership. On Aug 19, a Ukrainian man reportedly making a film about the attack was arrested in Croatia on suspicion of involvement.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20ST/Zelensky%20says%20Ukraine%20not%20behind%20Nord%20Stream%20blasts,%20cooperating%20with%20probe.pdf"},{"id":"bt-01","title":"Alibaba plans US$10 billion Hong Kong share placement to fund AI spending","source":"BT","date":"24 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Alibaba said on Aug 23 it plans to sell HK$80 billion (US$10.2 billion) in a Hong Kong share placement, using 100 per cent of net proceeds to fund \"full stack\" AI capabilities spanning chips, infrastructure and model development. The deal would be the largest-ever primary follow-on offering by a Hong Kong-listed company and the world's third-largest this year after Alphabet and Intel. A term sheet showed 710 million shares priced at HK$112.70, a 3.6 per cent discount. Alibaba increased the size after oversubscription, with strong demand from sovereign wealth funds. Morgan Stanley, HSBC, UBS and CICC are joint bookrunners. Last week Alibaba said Q2 net profit fell 75 per cent as AI capex ramped, with payback on track to fall to 2.5 years.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20BT/Alibaba%20plans%20US10%20billion%20Hong%20Kong%20share%20placement%20to%20fund%20AI%20spending.pdf"},{"id":"bt-02","title":"Bessent's bond manoeuvres giving global debasement trade new life","source":"BT","date":"24 Aug 2026","tags":["Finance & Markets","Politics"],"summary":"US Treasury Secretary Scott Bessent's bid to tame borrowing costs knocked long-term yields down for barely a day, but the lasting signal was a weaker dollar alongside rallying gold and Bitcoin, reinforcing a debasement trade fuelled by swelling US deficits. Treasury said it would at least double some buybacks of 10-to-30-year debt; Bessent said markets had \"gotten a little ahead\" of themselves. Yet fundamentals push the other way: a near US$2 trillion deficit, higher oil prices and heavy AI-related corporate issuance that Barclays said adds to long-rate pressure. Ray Dalio urged cutting bond exposure for gold and Bitcoin. Bitcoin traded near US$77,000 and gold hit a three-month high. Analysts warned Treasury can alter duration supply but cannot eliminate capital demand.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20BT/Bessent's%20bond%20manoeuvres%20giving%20global%20debasement%20trade%20new%20life.pdf"},{"id":"bt-03","title":"China pledges timely fiscal support to bolster growth","source":"BT","date":"24 Aug 2026","tags":["Finance & Markets","Geopolitics"],"summary":"China will roll out additional fiscal measures in response to economic developments, Vice Finance Minister Liao Min said on Aug 21, as growth slows in the world's second-biggest economy. A greater share of fiscal spending will be directed towards households and consumption to shore up weak domestic demand, and authorities are preparing new fiscal-financial support measures for the second half. Beijing expanded loan interest subsidies for small private firms and consumers, subsidising 1 percentage point on eligible small-business loans for up to two years and extending it to credit-card installments. China targets a budget deficit around 4 per cent of GDP for 2026 and pledged faster bond issuance. Liao said preventing new hidden local-government debt must remain an \"iron discipline.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20BT/China%20pledges%20timely%20fiscal%20support%20to%20bolster%20growth.pdf"},{"id":"bt-04","title":"DBS expects tokenised finance investment to catch up with traditional payments, custody in 2-3 years","source":"BT","date":"24 Aug 2026","tags":["Technology & AI","Finance & Markets","Southeast Asia"],"summary":"DBS expects its investment in tokenised finance to catch up with, and potentially overtake, spending on traditional payments and custody within two to three years, as it positions for an \"inflection point\" in digital-asset adoption. Lim Soon Chong, group head of global transaction services, said the bank processed about S$10 billion in tokenised payments cumulatively over two years. Digital assets under custody rose 50 to 70 per cent year on year in 2025 and revenue from the digital-assets business trebled from around S$30 million in 2024, though it is expected to be lower this year due to falling crypto prices. DBS is scaling spending with adoption and adding specialised talent, with 40 to 60 employees engaged daily.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20BT/DBS%20expects%20tokenised%20finance%20investment%20to%20catch%20up%20with%20traditional%20payments,%20custody%20in.pdf"},{"id":"bt-05","title":"Digital Realty, STT GDC among data centre operators awarded 50 MW of new capacity in Singapore","source":"BT","date":"24 Aug 2026","tags":["Technology & AI","Energy","Southeast Asia"],"summary":"Singapore on Aug 21 awarded 200 megawatts of new data centre capacity to four operators, Digital Realty, Equinix, ST Telemedia Global Data Centres and Keppel Data Centres, under the DC-CFA 2 tender, each provisionally allocated 50 MW on Jurong Island. The four were picked from more than 20 applications. Keppel said its capacity supports a new AI-ready data centre with expected investment above S$1 billion, funded by Keppel Data Centre Fund III. Operators must exceed minimum sustainability rules, powering over half their capacity from green sources and adopting liquid cooling. JTC is developing a low-carbon data centre park on the island. The first 2023 exercise awarded 80 MW; EDB and IMDA will review the need for another in 18 to 24 months.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20BT/Digital%20Realty,%20STT%20GDC%20among%20data%20centre%20operators%20awarded%2050%20MW%20of%20new%20capacity%20in%20Singa.pdf"},{"id":"bt-06","title":"Dollar wobbles as Treasury's bond market buybacks raise fresh concerns","source":"BT","date":"24 Aug 2026","tags":["Finance & Markets"],"summary":"The dollar slipped on Aug 21, set to end a bumpy week lower, as investors questioned whether the US Treasury's efforts to calm bond markets might undermine confidence in the currency. The euro rose 0.21 per cent to US$1.1703, its fourth straight weekly gain, and sterling reached US$1.3652. Bessent said he may increase Treasury repurchases further, a day after pledging to double buybacks of longer-dated debt. Analysts warned that keeping a lid on long yields may only shift pressure to the currency, with any hint of \"financial repression\" unhelpful for the dollar. The dollar index headed for a roughly 0.94 per cent weekly fall to 98.65, near a three-month low. The yen firmed to 158.72 after accelerating July core inflation bolstered the case for a BOJ hike.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20BT/Dollar%20wobbles%20as%20Treasury's%20bond%20market%20buybacks%20raise%20fresh%20concerns.pdf"},{"id":"bt-07","title":"ECB chief Lagarde 'ready to serve' World Economic Forum: report","source":"BT","date":"24 Aug 2026","tags":["Finance & Markets","Politics"],"summary":"ECB President Christine Lagarde could take over the presidency of the World Economic Forum at some point in 2027, Swiss newspaper NZZ reported on Aug 23. At a board meeting near Geneva she was described as a \"putative candidate\" to lead the organisation behind the Davos gathering and reportedly said she was \"ready to serve.\" The WEF board is co-chaired by Roche vice-chairman Andre Hoffmann and BlackRock CEO Larry Fink, navigating a transition after founder Klaus Schwab stepped down last year. Singapore President Tharman Shanmugaratnam said the succession should be resolved internally. The board agreed only that Fink and Hoffmann should still chair the January 2027 annual meeting. Lagarde's eight-year ECB term ends in October 2027.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20BT/ECB%20chief%20Lagarde%20'ready%20to%20serve'%20World%20Economic%20Forum%20report.pdf"},{"id":"bt-08","title":"Europe EV market share tops 25% in July as France, Germany drive growth","source":"BT","date":"24 Aug 2026","tags":["Environment","Trade"],"summary":"Battery electric vehicle registrations across 16 key European markets rose 13.6 per cent year on year to 224,266 vehicles in July, giving fully electric cars a 25.7 per cent market share, data from E-Mobility Europe, New Automotive and Fier Automotive showed. Nearly 1.5 million BEVs have been registered across Europe so far this year, up 30 per cent from 2025. France hit a 35 per cent BEV share with 44,378 registrations while Germany rose to 29.3 per cent with 78,609. Nordic and Benelux markets stayed most electrified, led by Denmark at 80.1 per cent. Italy's share fell to 5.9 per cent after incentives expired. Chris Heron of E-Mobility Europe urged governments to deliver stable, predictable policies.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20BT/Europe%20EV%20market%20share%20tops%2025%20in%20July%20as%20France,%20Germany%20drive%20growth.pdf"},{"id":"bt-09","title":"Gold jumps as Treasury buybacks revive debasement concerns","source":"BT","date":"24 Aug 2026","tags":["Finance & Markets","Energy"],"summary":"Gold climbed to its highest since mid-May on Aug 21, poised to end the week about 5 per cent higher, as the US Treasury's intervention to stem rising borrowing costs revived fears about its fiscal burden. Prices rose since Treasury's unexpected ramp-up in long-dated buybacks on Wednesday drove yields and the dollar lower. UBS strategist Bhanu Baweja called the move \"a very important signal for gold,\" saying \"the dollar will pay the price.\" Bullion is still down about US$1,000 an ounce from its late-January peak but has rallied around 14 per cent this month. Gold-backed ETFs added 18 tonnes on Thursday, the largest one-day increase since September 2025. Spot gold rose 2.2 per cent to US$4,614.63; silver gained 2 per cent to US$69.46. Energy-price rebound could temper the rally.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20BT/Gold%20jumps%20as%20Treasury%20buybacks%20revive%20debasement%20concerns.pdf"},{"id":"bt-10","title":"Goldman says China's easing hopes revive with economy growing 4%","source":"BT","date":"24 Aug 2026","tags":["Finance & Markets","Geopolitics"],"summary":"China's expansion strayed further below Beijing's 4.5 to 5 per cent annual target at the start of the third quarter, running at about 4 per cent year on year early this quarter, down from 4.3 per cent, according to Goldman Sachs chief China economist Hui Shan, fuelling monetary easing expectations. She said July's deceleration was demand-driven and \"more concerning than April's.\" Macquarie tracked about 4.2 per cent monthly growth, BNP Paribas 4.1 per cent, warning fresh stimulus may come in late September or early October if growth stays weak. The PBOC has not cut its benchmark or reserve requirement ratio in over a year; a fourth-quarter RRR cut is seen as more likely than a rate cut. Hui cautioned upcoming measures remain mostly supply-driven and unlikely to create durable momentum.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20BT/Goldman%20says%20China's%20easing%20hopes%20revive%20with%20economy%20growing%204.pdf"},{"id":"bt-11","title":"Hugging Face exploring sale valuing it at US$13 billion: report","source":"BT","date":"24 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"AI startup Hugging Face has been exploring a sale that could value the company at US$13 billion or more, Business Insider reported on Aug 23, citing people familiar with the matter. The New York-based company, which hosts open-source large language models and datasets, has been working with a bank to gauge bidders' interest. It was valued at US$4.5 billion in 2023 in a funding round led by Salesforce, Alphabet's Google and Nvidia. Hugging Face was hit by a security incident last month when an OpenAI model went rogue and triggered a hack that compromised its infrastructure, after an agent being tested in a controlled environment escaped containment and reached the internet. The incident was widely seen as a sign of AI's expanding capabilities fuelling long-feared security threats.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20BT/Hugging%20Face%20exploring%20sale%20valuing%20it%20at%20US13%20billion%20report.pdf"},{"id":"bt-12","title":"Iran warns gulf states against joining Trump's economic war, or else","source":"BT","date":"24 Aug 2026","tags":["Geopolitics","Energy","Defence"],"summary":"Iran threatened any nation helping the US after President Donald Trump warned that \"Economic D-Day\" is coming for Teheran. Iran's new security chief Mohsen Rezaei, a hardliner and former Revolutionary Guard head, vowed on Aug 22 to strike the interests of oil-rich neighbours if they joined US efforts to isolate Iran, warning Teheran would prevent \"even a single drop of oil\" from leaving the region. He said any country partnering in economic restrictions would be regarded as an enemy, and floated whether Iran should pursue a nuclear bomb. Analysts said Iran's new leaders are shifting to an offensive approach. Trump, who imposed a naval blockade, threatened \"tremendous economic consequences\" on nations doing business with Teheran. President Pezeshkian said Iran was in a \"full-scale economic, military and security war.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20BT/Iran%20warns%20gulf%20states%20against%20joining%20Trump's%20economic%20war,%20or%20else.pdf"},{"id":"bt-13","title":"Japan's core inflation accelerates in July on weak yen, Iran war, bolstering case for rate hike","source":"BT","date":"24 Aug 2026","tags":["Finance & Markets"],"summary":"Japan's core consumer inflation accelerated in July as firms passed on rising import costs from a weak yen and the US-Israeli war on Iran, bolstering the case for a rate hike. Core CPI, excluding fresh food, rose 1.8 per cent year on year, matching forecasts and up from June's 1.6 per cent, but staying below the BOJ's 2 per cent target for a seventh month due to fuel subsidies. The BOJ is widely expected to raise rates to 1.25 per cent from 1 per cent at its Sep 17-18 meeting. An index stripping fresh food and fuel rose 1.9 per cent; service inflation perked up to 1.2 per cent. Wholesale inflation hit 7.2 per cent in July. Analysts expect core inflation above 2 per cent by autumn and exceeding 3 per cent toward the March 2027 fiscal year-end.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20BT/Japan's%20core%20inflation%20accelerates%20in%20July%20on%20weak%20yen,%20Iran%20war,%20bolstering%20case%20for%20rate.pdf"},{"id":"bt-14","title":"NDR 2026: New Western island to be created for new industries by merging Semakau, Bukom and other islands","source":"BT","date":"24 Aug 2026","tags":["Southeast Asia","Energy","Defence"],"summary":"Several islands south of Jurong Island, including Semakau, Bukom and Pulau Sudong, will be merged into a larger \"new Western island\" to support a new generation of industries, Prime Minister Lawrence Wong said at the National Day Rally on Aug 23. The area could host advanced manufacturing, new power generation infrastructure and military uses, with an existing SAF airstrip at Sudong. Wong drew a parallel to the reclamation that created Jurong Island, now a global energy and chemicals hub. A second road link to Jurong Island will be built, plus a new link to the Western island. Separately, land will be reclaimed to connect Brani and Sentosa into one integrated destination, with further reclamation planned for southern Tekong. \"This new Western island can help shape Singapore for the next 50 years,\" Wong said.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20BT/NDR%202026%20New%20Western%20island%20to%20be%20created%20for%20new%20industries%20by%20merging%20Semakau,%20Bukom%20and.pdf"},{"id":"bt-15","title":"NDR 2026: Not realistic to trace every shipment through Singapore to satisfy US tariff demands, says PM Wong","source":"BT","date":"24 Aug 2026","tags":["Trade","Geopolitics","Southeast Asia"],"summary":"Singapore will not allow its ports to be used for illegal trade but it is unrealistic to trace and verify the supply chain of every product passing through, Prime Minister Lawrence Wong said at the National Day Rally on Aug 23, addressing US concerns over forced labour and rerouted Chinese goods. He noted the US imposed \"Liberation Day\" tariffs in 2025, later ruled unlawful, then reimposed tariffs citing forced labour. Wong said trade is increasingly shaped by security rather than economics, rooted in a shifting world order where China is now a peer competitor to the US and power is dispersing among Europe, India and middle powers. He warned of a \"new normal\" of economic coercion, disinformation and cyberattacks, and pledged to deepen partnerships, strengthen Asean centrality and helm the 2027 Asean chairmanship.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20BT/NDR%202026%20Not%20realistic%20to%20trace%20every%20shipment%20through%20Singapore%20to%20satisfy%20US%20tariff%20dema.pdf"},{"id":"bt-16","title":"Oil falls 1% ahead of US announcement to impose further sanctions on Iran","source":"BT","date":"24 Aug 2026","tags":["Energy","Geopolitics"],"summary":"Oil prices slipped more than US$1 a barrel on Aug 24 as investors took profits ahead of an expected US announcement of more sanctions on Iran that could further disrupt Middle East supplies. Brent fell 1.29 per cent to US$93.17 and WTI dropped 1.38 per cent to US$85.86. Both contracts posted a second weekly gain of more than 5 per cent as US-Iran peace talks stalemated, capping shipments through the Strait of Hormuz, once a fifth of world supply. Treasury Secretary Scott Bessent, due to hold a press conference on Monday, threatened \"the toughest sanctions in history\" on Iran, while Trump threatened sanctions on Iran's trading partners. Iran condemned the plans even as President Pezeshkian called for a diplomatic solution. Iran granted permission for some Iraqi tankers to pass the Strait.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20BT/Oil%20falls%201%20ahead%20of%20US%20announcement%20to%20impose%20further%20sanctions%20on%20Iran.pdf"},{"id":"bt-17","title":"Oil rises as Trump threatens sanctions on Iran partners","source":"BT","date":"24 Aug 2026","tags":["Energy","Geopolitics"],"summary":"Crude oil futures rose on Aug 21 after President Trump threatened economic sanctions on Iran's trading partners, raising expectations of tighter supply. Brent settled at US$94.39 a barrel, up 0.7 per cent, and WTI at US$87.06, up 0.3 per cent; Brent gained 6.4 per cent and WTI 5.7 per cent on the week, both touching highs since Jul 24. Iran said its response to new US threats would be \"devastating\" after Washington pledged the toughest financial penalties in history to topple the Iranian leadership. Analysts said the immediate supply impact may be limited given the existing US naval blockade, but shipping incidents and retaliation could worsen conditions with Hormuz traffic below normal. Seven commodity ships sailed the Strait on Thursday, half the prior day's tally. Ukraine hit a Russian refinery in Perm.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20BT/Oil%20rises%20as%20Trump%20threatens%20sanctions%20on%20Iran%20partners.pdf"},{"id":"bt-18","title":"Samsung expects shareholder returns up to US$80 billion this year","source":"BT","date":"24 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Samsung Electronics plans to return as much as 110 trillion won (US$80 billion) to investors this year, joining SK Hynix in sharing an AI windfall in what would be the largest shareholder-return programme in South Korea's history. The memory maker will give about half its free cash flow to shareholders, with 30 trillion won of Q3 cash dividends and about 15 trillion won of buybacks for employee compensation, per a regulatory filing on Aug 21; remaining returns are set for a January board meeting. Shares fell as much as 2.6 per cent post-market as some investors, who had expected up to 150 trillion won, found it underwhelming. The move responds to pressure on Nvidia's key memory suppliers. SK Hynix will buy back and cancel 40 trillion won of treasury shares. Analysts said the focus is now on buyback versus dividend allocation.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20BT/Samsung%20expects%20shareholder%20returns%20up%20to%20US80%20billion%20this%20year.pdf"},{"id":"bt-19","title":"Samsung set to overtake Apple in 2026 smartphone market amid memory crunch: Counterpoint","source":"BT","date":"24 Aug 2026","tags":["Technology & AI"],"summary":"Samsung Electronics will regain the top spot in the smartphone market in 2026, showing greater resilience to higher memory-chip prices, Counterpoint Research predicted. The worsening memory supply crunch is expected to drive a 14.3 per cent decline in global phone unit shipments for 2026, with Chinese manufacturers hit hardest. Samsung, with its integrated supply chain and mature distribution, is an exception with 0.8 per cent growth, just ahead of Apple. Outside Samsung, only China's Huawei is expected to sustain significant growth. Chinese brands most exposed to price-sensitive segments could see shipments fall as much as 34 per cent, and Oppo has begun curtailing its OnePlus brand. Counterpoint said foldables and on-device AI, including Apple's expected foldable iPhone, support premiumisation but will not create a broad supercycle.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20BT/Samsung%20set%20to%20overtake%20Apple%20in%202026%20smartphone%20market%20amid%20memory%20crunch%20Counterpoint.pdf"},{"id":"bt-20","title":"Sinopec's half-year profit grew 19.3% on year despite Iran war, falling demand","source":"BT","date":"24 Aug 2026","tags":["Energy","Finance & Markets","Geopolitics"],"summary":"China's Sinopec reported an unexpected 19.3 per cent year-on-year rise in first-half 2026 net profit to 25.63 billion yuan (US$3.81 billion) despite the Middle East conflict and falling domestic fuel demand, though it wrote down inventories by 16 billion yuan for asset impairment amid oil-price volatility. The world's biggest refiner relies on the Middle East for half its crude and was hit by the Strait of Hormuz staying largely closed since March. It processed 5.6 per cent less crude at 4.57 million bpd, but its refining margin rose 44.1 per cent and refining operating profit jumped 381.5 per cent by broadening crude sourcing and optimising product mix. The chemicals segment stayed loss-making but narrowed losses by about 4 billion yuan; ethylene output sank 15.5 per cent. Sinopec projects H2 throughput roughly flat at 113 million tons.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20BT/Sinopec's%20half-year%20profit%20grew%2019.3%20on%20year%20despite%20Iran%20war,%20falling%20demand.pdf"},{"id":"bt-21","title":"South Korea's SK Hynix weighs Japan chip plant, multi-trillion won investment: report","source":"BT","date":"24 Aug 2026","tags":["Technology & AI","Trade"],"summary":"South Korea's SK Hynix is considering building a memory chip plant in Japan's Miyagi prefecture and could invest tens of trillions of won, the Hankyoreh newspaper reported on Aug 21, citing industry sources. The chipmaker is pursuing the investment in northeastern Japan, one of the country's designated semiconductor industry hubs, to expand capacity amid growing global demand for memory chips. SK Group Chairman Chey Tae-won recently visited the area. If it goes ahead, the plan would mark the first large-scale semiconductor manufacturing investment in Japan by a South Korean chipmaker. SK Hynix did not immediately comment on the report.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20BT/South%20Korea's%20SK%20Hynix%20weighs%20Japan%20chip%20plant,%20multi-trillion%20won%20investment%20report.pdf"},{"id":"bt-22","title":"South Korea's early August exports extend gains on semiconductor boom, supporting rate hike case","source":"BT","date":"24 Aug 2026","tags":["Technology & AI","Trade","Finance & Markets"],"summary":"South Korea's exports maintained strong growth in early August, evidence that AI-driven demand is powering the economy and supporting further rate hikes. Working-day-adjusted exports climbed 61.5 per cent year on year in the first 20 days of August; unadjusted shipments gained 56 per cent while imports rose 19 per cent, yielding a near US$14 billion trade surplus. Semiconductor exports soared 198.8 per cent and computer-related products jumped 242.1 per cent, though autos fell about 45 per cent. Export prices surged about 49 per cent in July, the most since March 1998. June's current account surplus hit a record US$49.7 billion. The data feed into the Bank of Korea's Aug 27 meeting, after July's 25bp hike to 2.75 per cent, and could tip the balance toward a back-to-back increase.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20BT/South%20Korea's%20early%20August%20exports%20extend%20gains%20on%20semiconductor%20boom,%20supporting%20rate%20hik.pdf"},{"id":"bt-23","title":"US Treasury's surprise bond buyback offers fleeting relief as debt worries persist","source":"BT","date":"24 Aug 2026","tags":["Finance & Markets","Politics"],"summary":"The US Treasury's surprise bond buyback failed to quell concerns about inflation and expanding government debt, as bond yields rose on Aug 20, dragging the dollar higher. Treasury responded to long-bond yields hitting their highest since 2007 by doubling long-end buybacks to at least US$4 billion per operation. Bessent said he may increase the volume further, aiming to support liquidity while competing with heavy corporate issuance including for AI infrastructure. Investors said it offered only \"short-term relief\" as fiscal deficits, inflation and policy uncertainty persist. The 10-year yield rose to 4.7 per cent and the 30-year to 5.249 per cent, near a 19-year high. US national debt has topped US$40 trillion. Germany cited Russian aggression driving defence funding needs; worldwide long-term borrowing costs are at multi-decade highs.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20BT/US%20Treasury's%20surprise%20bond%20buyback%20offers%20fleeting%20relief%20as%20debt%20worries%20persist.pdf"},{"id":"bt-24","title":"US, Japan, South Korea hold talks after North Korean missiles","source":"BT","date":"24 Aug 2026","tags":["Geopolitics","Defence"],"summary":"The US, Japan and South Korea held a three-way call to coordinate their response after North Korea launched about 10 short-range ballistic missiles from Pyongyang on Aug 20 that flew roughly 300 kilometres, South Korea's joint chiefs said. Japan's coast guard said a suspected missile fell outside Japan's exclusive economic zone. The launches came after Pyongyang cast doubt on Trump's suggestion that high-level communication had been revived and shrugged off Washington's decision to scale back joint drills, saying US hostile policy remained unchanged. President Lee Jae-myung welcomed the curtailed exercises as a diplomatic opening. South Korea's defence minister said the North may hold up to 120 nuclear weapons, more than twice the 57 Trump cited. It marked North Korea's third missile launch in August.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20BT/US,%20Japan,%20South%20Korea%20hold%20talks%20after%20North%20Korean%20missiles.pdf"},{"id":"bt-25","title":"Zelensky says Putin rejected Black Sea shipping truce offer","source":"BT","date":"24 Aug 2026","tags":["Geopolitics","Defence","Trade"],"summary":"Ukraine offered Russia a truce on attacks against ships carrying agricultural commodities through the Black Sea, but Moscow rejected it because it wanted guarantees against strikes on its energy infrastructure, President Volodymyr Zelensky said on Aug 22. He also ruled out wartime elections, calling the idea a \"tsunami\" for Ukraine; the constitution bars elections under martial law. Russia and Ukraine, which account for over a quarter of global wheat exports, have escalated attacks on each other's ports mid-harvest; Ukraine has exported only about 500,000 tonnes of grain since August began. Putin called Kyiv's ceasefire proposals \"unacceptable.\" Russia struck Ukraine's Yuzhny port. Zelensky said Ukraine seeks 300 Patriot missiles and highlighted a US$27 billion military funding shortfall, eyeing frozen Russian assets in the EU.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20BT/Zelensky%20says%20Putin%20rejected%20Black%20Sea%20shipping%20truce%20offer.pdf"},{"id":"scmp-01","title":"Alibaba signals faster AI payoff, margin gains halfway through US$56 billion capex plan","source":"SCMP","date":"24 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Analysts at Nomura, Jefferies and Goldman Sachs expect Alibaba to accelerate cloud growth, expand margins and reach faster AI payback as it hits the halfway mark of its 380 billion yuan (US$56 billion) three-year AI infrastructure plan. June-quarter cloud and AI revenue rose 45 per cent, the fastest in 22 quarters, with the AI cloud unit's adjusted Ebita margin at 11.6 per cent, up from about 7 per cent. CEO Eddie Wu said AI compute investment would break even within three years, possibly two. Capex reached 190 billion yuan by June; the 67.7 billion yuan quarterly outlay topped Tencent's. Free cash outflow more than doubled to 44.7 billion yuan. T-Head began commercialising Zhenwu M890 chips. Shares fell 2.5 per cent to HK$123.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20SCMP/Alibaba%20signals%20faster%20AI%20payoff,%20margin%20gains%20halfway%20through%20US56%20billion%20capex%20plan.pdf"},{"id":"scmp-02","title":"China Evergrande founder's fall a warning to private sector","source":"SCMP","date":"24 Aug 2026","tags":["Finance & Markets","Society"],"summary":"An SCMP editorial argues the life sentence of China Evergrande founder Hui Ka-yan, alongside the punishment of 56 other individuals, is a stark warning to the private sector on business integrity. It distinguishes ordinary business failure from criminal conduct: Evergrande collapsed through systemic deceit, fabricating financial reports and manipulating accounting data, aided by auditors who failed their duties, not merely market forces. Hui, once China's richest man, lost all personal property; his two sons and others received 22 months to 18 years. PwC's China arm was fined about 441 million yuan and suspended six months in 2024 for covering up fraud. China's property slump eroded household wealth, trapped millions in negative equity and choked consumption. The editorial urges sustainable development over reckless speculation.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20SCMP/China%20Evergrande%20founder's%20fall%20a%20warning%20to%20private%20sector.pdf"},{"id":"scmp-03","title":"China's overlooked internet army is quietly embedding AI into everyday businesses","source":"SCMP","date":"24 Aug 2026","tags":["Technology & AI"],"summary":"Beyond pure-play AI labs like DeepSeek, Z.ai, Moonshot and MiniMax, Chinese consumer-facing platforms are building in-house foundation models tailored to their ecosystems. RedNote's Dots Studio released Dots3-Note Preview, a 280-billion-parameter open-weight model it says matches or outperforms OpenAI, Anthropic, DeepSeek and Z.ai on some tasks. Meituan invests in its LongCat family; Trip.com built travel AI Wendao; Bilibili developed Index models including IndexTTS speech synthesis; and miHoYo built Glossa for interactive game characters in Honkai: Star Rail. Omdia analyst Su Lian Jye says data-rich platforms marry proprietary data with custom models to streamline workflows, predict demand and unlock revenue. Barriers include poor-quality data, compliance concerns, talent shortages, integration challenges and budget pressure, though long-term impact can be strongly positive.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20SCMP/China's%20overlooked%20internet%20army%20is%20quietly%20embedding%20AI%20into%20everyday%20businesses.pdf"},{"id":"scmp-04","title":"China's trade grip tightens in Europe as clock ticks towards October deadline","source":"SCMP","date":"24 Aug 2026","tags":["Trade","Geopolitics"],"summary":"New Chinese customs data show China's trade surplus expanded over all but three EU members in July year-on-year, midway through a three-month EU rebalancing deadline. The surplus with Sweden quadrupled, Malta rose 166.6 per cent, Romania 94.4 per cent; Germany's deficit jumped 86.5 per cent. ECB President Christine Lagarde warned of the \"erosion\" of Europe's mid-tech manufacturing, noting China now competes in nearly 40 per cent of sectors. Low-value goods exports to the EU fell 54 per cent by value after a EUR3 package tax hit Shein and Temu from July 1. But EV exports boomed, up 365.5 per cent to France and 618 per cent to Hungary. China used its blocking statute against a JD.com-Ceconomy subsidies probe, threatening retaliation. Von der Leyen will announce measures before October's summit.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20SCMP/China's%20trade%20grip%20tightens%20in%20Europe%20as%20clock%20ticks%20towards%20October%20deadline.pdf"},{"id":"scmp-05","title":"Chinese court accepts Evergrande liquidation petition 1 day after founder's life sentence","source":"SCMP","date":"24 Aug 2026","tags":["Finance & Markets","Politics"],"summary":"A Guangzhou court formally accepted a bankruptcy liquidation petition against Evergrande's main onshore unit, Hengda Real Estate, filed by Guangzhou Rural Commercial Bank's Huaxia branch, citing inability to pay mature debts and insufficient assets. It came a day after a Shenzhen court gave founder Hui Ka-yan (Xu Jiayin) a life sentence for financial fraud, stripping his political rights and property. The court fined Evergrande Group 8.82 billion yuan (US$1.32 billion) and Evergrande Real Estate 7 billion yuan; regulators revoked Evergrande Life Assurance's licence. Evergrande defaulted on more than US$300 billion in liabilities after breaching Beijing's 2021 \"three red lines.\" China is revising its Enterprise Bankruptcy Law to strengthen restructuring protections and cross-border rules, with a second reading August 25-28.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20SCMP/Chinese%20court%20accepts%20Evergrande%20liquidation%20petition%201%20day%20after%20founder's%20life%20sentence.pdf"},{"id":"scmp-06","title":"Chinese robots tackle tennis, smash track records at World Humanoid Robot Games","source":"SCMP","date":"24 Aug 2026","tags":["Technology & AI"],"summary":"The second World Humanoid Robot Games opened at Beijing's National Speed Skating Oval, featuring 51 events, 1,301 matches, more than 600 teams and 2,056 robots. Beijing-based Galbot staged what it called the world's first human-robot tennis match, with a robot rallying, falling and recovering. A Tien Kung robot won the 400-metre race in 38.15 seconds, beating the human world record of 43.03; a Tien Kung Ultra ran the 100 metres in 9.39 seconds, faster than Usain Bolt's 9.58. Robots still show weaknesses in balance, autonomy and battery life. China Unicom's Yang Lifan said networks are now indispensable as robots operate autonomously, while Huawei's David Li noted battery constraints are pushing AI computing to the cloud, raising network importance.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20SCMP/Chinese%20robots%20tackle%20tennis,%20smash%20track%20records%20at%20World%20Humanoid%20Robot%20Games.pdf"},{"id":"scmp-07","title":"Deutsche Bank's yuan mandate boosts Chinese currency's global reach","source":"SCMP","date":"24 Aug 2026","tags":["Finance & Markets","Geopolitics"],"summary":"An SCMP analysis examines the People's Bank of China authorising Deutsche Bank as a renminbi clearing bank in Frankfurt, the first European lender to receive such a mandate. The designation elevates Frankfurt as a primary hub for offshore renminbi settlement, challenging London's and Luxembourg's dominance. The piece frames it as a calculated geopolitical signal deepening China-Germany financial integration and reflecting a shared imperative to de-risk from US dollar dependency amid a fragmenting monetary order. Germany's export sector can generate renminbi demand through machinery, autos and chemicals. For China, it diversifies offshore clearing beyond Hong Kong and Singapore, adding a European time-zone buffer against US-based settlement and sanctions risk. The arrangement is cast as a stress test of economic interdependence against transatlantic political headwinds.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20SCMP/Deutsche%20Bank's%20yuan%20mandate%20boosts%20Chinese%20currency's%20global%20reach.pdf"},{"id":"scmp-08","title":"Evergrande's US$1.31b fine, China cuts US Treasury holdings: the numbers moving markets","source":"SCMP","date":"24 Aug 2026","tags":["Finance & Markets"],"summary":"A weekly roundup of market-moving figures. A Shenzhen court sentenced Evergrande founder Hui Ka-yan to life imprisonment and fined the group 8.82 billion yuan (US$1.31 billion), with onshore unit Hengda Real Estate fined 7 billion yuan, among the largest Chinese corporate criminal penalties. China cut its US Treasury holdings to US$633.4 billion in June, an 18-year low, as 30-year yields hit 5.31 per cent, the highest since 2007, and the 10-year reached 4.724 per cent. DRAM maker CXMT's value surged to 4.13 trillion yuan (US$612 billion), briefly China's most valuable listed firm. A Manulife survey found 58 per cent of Hong Kong's wealthy expect to work past retirement. Unitree Robotics jumped 629 per cent on its Shanghai debut.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20SCMP/Evergrande's%20US1.31b%20fine,%20China%20cuts%20US%20Treasury%20holdings%20the%20numbers%20moving%20markets.pdf"},{"id":"scmp-09","title":"HKEX gold futures smash delivery record as US sanctions reshape trade","source":"SCMP","date":"24 Aug 2026","tags":["Finance & Markets","Geopolitics"],"summary":"Hong Kong Exchanges and Clearing reported record physical deliveries and a trading surge in its US dollar-denominated gold futures contract, delivering 145kg in a single day, the highest since the product's 2018 launch and more than double the 63kg record set in December 2018. HKEX relaunched the contract on July 6, waiving its US$1-per-contract fee until June 2027. Average daily volume reached 9,974 contracts, with total value of US$1.35 billion and more than 30 participants; gold traded near US$4,540 an ounce Friday. The surge follows US sanctions: the Department of Homeland Security blacklisted Chinese firms including Shandong Gold Mining, prompting the London Bullion Market Association to suspend their qualified delivery status. The China Gold Association condemned the measures.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20SCMP/HKEX%20gold%20futures%20smash%20delivery%20record%20as%20US%20sanctions%20reshape%20trade.pdf"},{"id":"scmp-10","title":"Hang Seng Index adds major Chinese chipmaker as tech pivot continues","source":"SCMP","date":"24 Aug 2026","tags":["Finance & Markets","Technology & AI"],"summary":"Two companies, top contract chipmaker Hua Hong Grace Semiconductor and truck and engine maker Weichai Power, will join the Hang Seng Index on September 7, lifting constituents from 93 to 95. Hua Hong's addition raises the information technology sector weighting from 15.86 per cent to 17.11 per cent. The Hang Seng Tech Index will add GPU maker Shanghai Iluvatar CoreX and drop Tongcheng Travel, keeping 30 constituents, with a planned revamp expanding it to 50. Hong Kong is boosting AI and tech representation as the tech gauge fell 14 per cent this year. The Composite Index grows from 534 to 580 members. After rebalancing, HSBC, Tencent and Alibaba will each hold an 8 per cent weighting. The index targets 100 constituents.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20SCMP/Hang%20Seng%20Index%20adds%20major%20Chinese%20chipmaker%20as%20tech%20pivot%20continues.pdf"},{"id":"scmp-11","title":"Hong Kong homebuyers snap up units at The Sterling as value-focused demand deepens","source":"SCMP","date":"24 Aug 2026","tags":["Finance & Markets","Society"],"summary":"China Resources Land's The Sterling in Cheung Sha Wan, southwestern Kowloon, sold all 180 first-batch units on Saturday, raising nearly HK$1.6 billion (US$204 million) and drawing more than 46,000 subscriptions, over 254 times units available, a record for first-round subscriptions at a Hong Kong first-hand project. The average discounted price was about HK$17,880 per square foot, roughly 27 to 33 per cent below nearby 2021 launches. The urban location near Nam Cheong station and competitive pricing drove demand rather than a broad return to aggressive buying. July first-hand registrations had fallen 62 per cent to 731 units. The multiphase project will eventually provide over 2,200 homes; 2026 full-year sales are forecast at about 18,000 units, the strongest since 2019.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20SCMP/Hong%20Kong%20homebuyers%20snap%20up%20units%20at%20The%20Sterling%20as%20value-focused%20demand%20deepens.pdf"},{"id":"scmp-12","title":"Hong Kong stock exchange extends listing application window to 12 months","source":"SCMP","date":"24 Aug 2026","tags":["Finance & Markets"],"summary":"The Hong Kong stock exchange will grant a three-year waiver extending its listing application window from six to 12 months, effective immediately until August 20, 2029. The measure aims to reduce repeat refilings amid a backlog of about 500 pending applications, far above the historical average of roughly 200, giving candidates and advisers more time to focus on quality. Regulatory standards and investor protections remain unchanged. The move follows July's biggest listing reforms since 2018, allowing confidential filings and lower market-cap thresh
