eign Ministry called it a \"hostile Iranian attack\" and accused Iran's Revolutionary Guards of \"acts of piracy\" that threaten regional stability and energy security. Iran's Foreign Ministry and the IRGC did not immediately comment. About a fifth of the world's oil and LNG passed through the waterway before the US-Israeli war with Iran that broke out on Feb 28.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/UAE%20says%20Iran%20attacked%20two%20ADNOC%20vessels%20in%20Strait%20of%20Hormuz%20no%20injuries.pdf"}, {"id": "bt-22", "title": "UMS Integration Q2 profit up 89% buoyed by AI 'super cycle', aviation boom", "source": "BT", "date": "14 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Semiconductor company UMS Integration posted an 89 per cent jump in Q2 FY2026 net profit to S$19.4 million, with revenue up 29 per cent to S$87.1 million. CEO Andy Luong cited a \"stellar performance\" driven by the AI \"super-cycle\" and sustained aviation boom. For H1, net profit rose 66 per cent to S$33.4 million and revenue climbed 25 per cent to S$156.5 million; semiconductor sales grew 25 per cent to S$134.5 million and aerospace 37 per cent to S$15.8 million. By market, Singapore rose 18 per cent, Malaysia 50 per cent and South Korea 317 per cent. UMS declared a second interim dividend of S$0.01. Luong flagged robust customer demand forecasts for 2026-2027 and new facilities in Malaysia and Vietnam. Shares closed 5.1 per cent higher at S$2.70.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/UMS%20Integration%20Q2%20profit%20up%2089%20buoyed%20by%20AI%20'super%20cycle',%20aviation%20boom.pdf"}, {"id": "bt-23", "title": "US producer prices unchanged in July", "source": "BT", "date": "14 Aug 2026", "tags": ["Finance & Markets"], "summary": "US producer prices were unchanged in July as goods prices declined, though a rise in services costs suggested inflation could stay elevated, the Bureau of Labor Statistics said on Aug 13. The flat reading in the Producer Price Index for final demand followed a revised 0.1 per cent June drop and undershot the 0.2 per cent rebound economists had forecast. Services rose 0.2 per cent while goods prices fell 0.7 per cent, though most data predated late-July oil price spikes. Over 12 months, the PPI rose 4.7 per cent, down from 5.5 per cent in June. Following July's job losses and mild consumer inflation, the report added to the case for the Fed to hold rates at its Sep 15-16 meeting. Core PCE was forecast up 3.3 per cent year-on-year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/US%20producer%20prices%20unchanged%20in%20July.pdf"}, {"id": "bt-24", "title": "US weekly jobless claims increase moderately, point to stable labour market", "source": "BT", "date": "14 Aug 2026", "tags": ["Finance & Markets"], "summary": "The number of Americans filing for unemployment benefits rose moderately last week, suggesting the labour market remains stable despite July's surprise job losses, the Labor Department said on Aug 13. Initial claims rose 9,000 to a seasonally adjusted 209,000 for the week ended Aug 8, above the 202,000 forecast. The government reported last week that nonfarm payrolls dropped 23,000 in July, with downward revisions to May and June. Claims are hovering at the lower end of this year's 189,000-230,000 range, and an NFIB survey showed small-business employment rebounding. Stability plus mild inflation could let the Fed hold rates in September; three FOMC members dissented last month, preferring a quarter-point hike. Continuing claims fell 22,000 to 1.777 million.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/US%20weekly%20jobless%20claims%20increase%20moderately,%20point%20to%20stable%20labour%20market.pdf"}, {"id": "bt-25", "title": "Which AI camp has Trump's ear now?", "source": "BT", "date": "14 Aug 2026", "tags": ["Technology & AI", "Politics"], "summary": "The second-term Trump administration's AI policy, initially built on deregulation and out-innovating China, has curdled into indecision, the commentary argues. The trigger was Anthropic's May 2026 disclosure of Mythos, a frontier system so capable at finding and exploiting software vulnerabilities that the company held back its release, reshaping the internal debate more than a year of safety advocacy. Reporting describes a White House split into three camps: accelerationists led by AI czar David Sacks; Pentagon officials under Pete Hegseth pushing constraints; and a middle faction around Susie Wiles and Scott Bessent. A delayed June executive order emerged \"light-touch,\" gesturing at oversight without enforcement. Officials met OpenAI, Anthropic, Google and Meta in early August on a safety framework not yet public. Key tests: enforcement teeth and the state pre-emption push.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Which%20AI%20camp%20has%20Trump's%20ear%20now.pdf"}, {"id": "scmp-01", "title": "'Very smooth': passenger shares experience on C919's first commercial international flight", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "Air China flight 723 became the first international service using Comac's domestically produced C919 narrowbody jet, flying 111 passengers from Beijing to Ulaanbaatar, Mongolia, on Wednesday in one hour 41 minutes, met by a water-cannon salute. Passenger Howard Deng said the flight felt \"basically no different\" from a Boeing 737 or Airbus A320, praising cabin layout and legroom, and hoped for more routes. Central to Beijing's ambition to challenge the Boeing-Airbus duopoly, the C919 now flies 58 routes linking 26 cities via China's three biggest airlines. Analyst Li Hanming cautioned that without EASA or FAA certification and with low output, it remains reliant on foreign components. Comac delivered just 15 units in 2025 against a 75 target, aiming for 28-plus this year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/'Very%20smooth'%20passenger%20shares%20experience%20on%20C919's%20first%20commercial%20international%20flight.pdf"}, {"id": "scmp-02", "title": "AI demand drives triple-digit profit growth for Chinese chip foundries SMIC, Hua Hong", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "China's top two contract chipmakers, SMIC and Hua Hong Grace, posted second-quarter net profit surges of 261.7 per cent and 385.9 per cent year on year, to US$479.2 million and US$38.6 million respectively, amid spiking demand for domestic AI chips free of US export controls. SMIC's revenue rose 36 per cent to US$3 billion; Hua Hong reached a record US$717.5 million, up 26.8 per cent. Foundries are running plants at full capacity to meet domestic needs. Chairman Bai Peng expects price increases to continue and high demand to persist into 2027. SMIC guided third-quarter revenue of US$3.06-3.12 billion. UBS analysts see AI chip fabrication as a secular driver with a total addressable market \"far north of US$10 billion\". Lenovo shares jumped 20 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/AI%20demand%20drives%20triple-digit%20profit%20growth%20for%20Chinese%20chip%20foundries%20SMIC,%20Hua%20Hong.pdf"}, {"id": "scmp-03", "title": "Alibaba adds commercial restrictions to open-weight Qwen3.8-Max AI model", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Technology & AI"], "summary": "Alibaba made the core files of its flagship Qwen3.8-Max model free to download but introduced rules requiring large companies to pay for a separate commercial licence. The terms apply to users running a \"model as a service\" or \"AI work assistant\" business whose aggregate revenue exceeds US$50 million over any 12-month period; internal use is exempt. Releasing the weights of the 2.4-trillion-parameter model marks a shift from keeping Max models proprietary. Paid API access costs 12 yuan per million input tokens in China, or US$2 internationally, roughly 40 per cent of Anthropic's Claude Opus 5 input rate. The move echoes Moonshot AI's Kimi K3 terms. Goldman Sachs raised its China AI model market forecast 30 per cent to US$13 billion. Alibaba owns the Post.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Alibaba%20adds%20commercial%20restrictions%20to%20open-weight%20Qwen3.8-Max%20AI%20model.pdf"}, {"id": "scmp-04", "title": "As China deepens reforms, Zhu Rongji's legacy serves as an inspiration", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Politics", "Finance & Markets"], "summary": "This editorial marks the death of former premier Zhu Rongji at 97, casting his reforms as a template as China deepens change today. As vice-premier and premier between 1991 and 2003, Zhu transformed a centrally planned economy into a \"socialist market economy\", restructured state-owned enterprises despite job cuts and public anger, overhauled the tax system, and secured China's 2001 WTO accession after negotiating with the Clinton administration. He famously vowed \"100 coffins\", 99 for corrupt officials, in an anti-corruption fight. Zhu strongly backed Hong Kong during the 1997 Asian financial crisis, supporting its US-dollar peg and refusing to devalue the yuan. His death coincides with the centenary of Jiang Zemin's birth on August 17; the pair shared a Shanghai leadership background.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/As%20China%20deepens%20reforms,%20Zhu%20Rongji's%20legacy%20serves%20as%20an%20inspiration.pdf"}, {"id": "scmp-05", "title": "Beijing's offshore insurance tax tests Hong Kong wealth management", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "Reports that China is enforcing a 20 per cent tax on investment returns from offshore insurance policies held by mainland residents rattled markets, sending Prudential, HSBC and AIA shares lower. Early enforcement cases reportedly emerged in Beijing and Hangzhou. China's State Taxation Administration said the rate is not new, does not specifically target Hong Kong, and urged against overreaction. Offshore policies have long served affluent Chinese families as investment, US-dollar savings and estate-planning tools; mainland visitors generated HK$62.8 billion in new business in 2024, 28.6 per cent of the city's individual premiums. The OECD Common Reporting Standard has reduced offshore opacity. The commentary argues more transparent, systematic cross-border oversight could ultimately strengthen Hong Kong's credibility as a wealth management centre rather than weaken it.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Beijing's%20offshore%20insurance%20tax%20tests%20Hong%20Kong%20wealth%20management.pdf"}, {"id": "scmp-06", "title": "CK Hutchison Holdings reports 31-fold surge in first-half profit", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Trade"], "summary": "CK Hutchison Holdings, a flagship of Li Ka-shing's family, reported a 3,046 per cent jump in first-half profit to HK$26.8 billion (US$3.4 billion) from HK$852 million a year earlier, driven by HK$14.2 billion in one-time items, including HK$17.75 billion in gains from disposing of UK Rails and UK Power Networks. Underlying profit rose 7 per cent to HK$12.58 billion; revenue was HK$255.4 billion. Chairman Victor Li called the global environment \"exceptionally turbulent and uncertain\". The interim dividend rose to 74.55 HK cents. Ports revenue rose 4 per cent to HK$24.52 billion, aided by additional transshipment at Oman's Sohar amid Strait of Hormuz disruption. Sister firm CK Asset's net profit rose about 38 per cent to HK$8.68 billion.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/CK%20Hutchison%20Holdings%20reports%2031-fold%20surge%20in%20first-half%20profit.pdf"}, {"id": "scmp-07", "title": "CK Hutchison says 'forced termination' of Panama ports cut 1% off throughput", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Trade", "Geopolitics"], "summary": "CK Hutchison for the first time quantified the impact of losing two strategic Panama Canal ports, saying the \"forced termination\" of Balboa and Cristobal operations shaved 1 per cent off overall throughput in the first half. Total throughput fell 1 per cent to 43.6 million TEUs; excluding Panama, throughput rose 3 per cent, fuelled by Shenzhen's Yantian, Shanghai and other Asian terminals. Panama's government took over the terminals on February 23 after a Supreme Court ruling annulled the concession. CK Hutchison, which held a 90 per cent stake in Panama Ports Company, is seeking at least US$2 billion in damages via ICC arbitration, calling it an \"illegal takeover\". Despite the loss, port EBITDA rose 4 per cent to HK$9.03 billion; the division expects full-year earnings growth.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/CK%20Hutchison%20says%20'forced%20termination'%20of%20Panama%20ports%20cut%201%20off%20throughput.pdf"}, {"id": "scmp-08", "title": "China's STEM students turn to Singapore as Western study options shrink", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Society", "Southeast Asia"], "summary": "Escalating US-China tech competition and tightening immigration in the \"big four\" destinations, Australia, Canada, the UK and the US, are redirecting China's top STEM students toward Singapore. State-backed scholarships like the Senior Middle 2 (SM2) programme, launched in 1997, fund undergraduate science and engineering study at NUS and NTU in exchange for a six-year work commitment. Chinese enrolment in the US fell to nearly 266,000 in 2024-25, down 28 per cent from a 2018-19 peak, deterred partly by Proclamation 10043. Singapore ranks second among 28 study-abroad destinations for Chinese students. Experts including Denis Simon call Singapore a \"talent arbitrage hub\" and \"early-stage talent pipeline\" absorbing displaced mobility into its skilled workforce. Analysts note studying abroad has become politically sensitive within China amid espionage fears.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/China's%20STEM%20students%20turn%20to%20Singapore%20as%20Western%20study%20options%20shrink.pdf"}, {"id": "scmp-09", "title": "China's YMTC breaks into global top 3 flash-memory suppliers with 14% market share", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Yangtze Memory Technologies (YMTC) broke into the world's top three NAND flash memory suppliers by volume for the first time, capturing 14 per cent of global bit shipments in the second quarter and narrowly overtaking Japan's Kioxia, according to Counterpoint Research. Samsung led with 25 per cent and SK Hynix followed at 22 per cent. YMTC's shipments rose 22 per cent year on year, driven by domestic demand and its latest 3D NAND. Despite the volume gain, YMTC ranked only fifth by revenue due to heavy exposure to lower-margin consumer products and a small enterprise SSD footprint. Enterprise SSDs hit 48 per cent of NAND bit shipments as AI shifts toward inference. YMTC plans to add about 35,000 wafers monthly this year despite US restrictions.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/China's%20YMTC%20breaks%20into%20global%20top%203%20flash-memory%20suppliers%20with%2014%20market%20share.pdf"}, {"id": "scmp-10", "title": "Chinese banks test repo-linked corporate loans to make pricing more market-based", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Finance & Markets"], "summary": "Chinese banks are testing a new way of pricing corporate loans against short-term market funding costs, shifting toward the overnight or seven-day depository-institutions repo rate (DR) from the monthly loan prime rate (LPR), following Beijing's June decision to change lending benchmarks. Unlike LPR, DR derives from actual interbank transactions, more directly reflecting funding costs. Bank of China rolled out DR-linked loans across several provinces and launched the market's first with daily repricing. China Merchants Bank, Bank of Shanghai, ICBC and Minsheng have all extended DR-benchmarked facilities. Analyst Zhang Lin warned DR raises interest-rate volatility and \"the bar for pricing and risk management\". The PBOC said it would refine its short-term rate framework. The move mirrors the US SOFR and UK Sonia benchmarks.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Chinese%20banks%20test%20repo-linked%20corporate%20loans%20to%20make%20pricing%20more%20market-based.pdf"}, {"id": "scmp-11", "title": "Chinese carmakers could capture 15% to 30% of European market by 2035: Citi analysts", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Trade", "Finance & Markets"], "summary": "Chinese carmakers could capture 15 to 30 per cent of the European auto market by 2035, up from roughly 10 per cent this year, Citi analysts led by Harald Hendrikse said, with the outcome hinging on EU tariffs and made-in-EU rules. Current rules allow 30 per cent (base case); extending EV tariffs to plug-in hybrids caps it at 25 per cent; a \"made in Europe\" requirement in the proposed Industrial Accelerator Act would cut it to 15 per cent. Chinese share in western Europe surged to 10 per cent in April, led by BYD and MG. Citi warned European makers face a decade of volume losses, with Volkswagen shedding over 500,000 units by 2035. The premium segment stays relatively protected. Chinese gains concentrate in mid-size electric and plug-in hybrid SUVs.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Chinese%20carmakers%20could%20capture%2015%20to%2030%20of%20European%20market%20by%202035%20Citi%20analysts.pdf"}, {"id": "scmp-12", "title": "Chinese missile AI tracks F-22, F-35-like heat signatures with over 90% accuracy", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Defence", "Technology & AI"], "summary": "Chinese researchers created a lightweight AI system to help heat-seeking air-to-air missiles identify stealth fighters, demonstrating high accuracy in laboratory tests against mock-up F-22 and F-35 targets. The system exploits distinct infrared signatures from engine exhaust and air friction, rendering decoy flares less effective. Published in the Journal of Electronic Measurement and Instrumentation, the study involved the Beijing Institute of Technology, the China Airborne Missile Academy and a near-surface detection lab. First author An Jiangshan said recognition reached 97.1 per cent in testing and about 90 per cent for simulated targets, using a low-cost Zynq7020 platform costing only a few hundred yuan. The lightweight model slashed parameters to 16.1 per cent of prior methods, with 1.5-millisecond inference and 2.2-watt power. Effects on surface-to-air missiles remain unverified.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Chinese%20missile%20AI%20tracks%20F-22,%20F-35-like%20heat%20signatures%20with%20over%2090%20accuracy.pdf"}, {"id": "scmp-13", "title": "Hong Kong to reappoint insurance regulator as industry braces for tough period: sources", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "Hong Kong's government is set to reappoint Clement Cheung Wan-ching as Insurance Authority CEO on Friday for another three-year term, two sources said, to ensure continuity as the industry faces headwinds from Beijing's offshore tax clampdown. Cheung, 64, has led the regulator since 2018, overseeing record life insurance sales as mainlanders and wealthy Asian families bought policies. However, some local authorities began levying a 20 per cent tax on gains from offshore insurance policies this month. Life insurance sales soared 51 per cent in the first quarter to a record HK$141.1 billion, with mainland buyers about 25 per cent of sales. Hong Kong is the world's 12th-largest insurance market, with US$99 billion in 2025 premiums, up 31 per cent. Cheung is a career civil servant who joined government in 1983.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Hong%20Kong%20to%20reappoint%20insurance%20regulator%20as%20industry%20braces%20for%20tough%20period%20sources.pdf"}, {"id": "scmp-14", "title": "Indonesia eyes mass production of home-grown EVs by 2028", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Southeast Asia", "Energy"], "summary": "Indonesia hopes to start mass production of home-grown electric cars no later than 2028, President Prabowo Subianto said, aiming to boost EV adoption in Southeast Asia's largest economy. The government is building a factory complex in the Subang region of West Java, a 60-hectare development targeting up to 50,000 vehicles annually, later expanding to a 539-hectare facility with capacity for up to 300,000 vehicles per year. Prabowo announced the target at the launch of a national electric motorcycle programme spanning manufacturing, batteries, charging and after-sales. State lenders will offer cheap vehicle loans, and Jakarta is weighing a trade-in scheme, a 5 million rupiah (US$279.80) subsidy per electric motorcycle up to 500,000 units, and VAT exemptions. Indonesia targets 13 million electric motorcycles and 2 million electric cars by 2030.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Indonesia%20eyes%20mass%20production%20of%20home-grown%20EVs%20by%202028.pdf"}, {"id": "scmp-15", "title": "MTR Corp's profit more than doubles to HK$15.8 billion on property gains", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Finance & Markets"], "summary": "Hong Kong's rail operator MTR Corp more than doubled first-half net profit to HK$15.87 billion (US$2 billion) from HK$7.70 billion a year earlier, as strong property development gains offset flat rail and commercial operations. Property-development profit jumped 120.7 per cent to HK$12.23 billion, driven by Tai Wai station and Wong Chuk Hang projects, though CEO Jeny Yeung cautioned these are \"one-off and non-recurring\". Revenue fell 4.1 per cent to HK$26.23 billion, and Hong Kong transport operations swung to a HK$141 million loss amid frozen fares and higher depreciation. The interim dividend held at 42 HK cents. MTR is pursuing a HK$140 billion capital commitment for seven rail projects and raised HK$58 billion via bonds; the Northern Link is due by 2034.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/MTR%20Corp's%20profit%20more%20than%20doubles%20to%20HK15.8%20billion%20on%20property%20gains.pdf"}, {"id": "scmp-16", "title": "Northern Metropolis: Hong Kong seeks interest in land parcels for logistics hub", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Trade", "Politics"], "summary": "Hong Kong authorities invited expressions of interest to develop land parcels set aside for a modern logistics cluster under the Northern Metropolis megaproject, seeking industry views on development terms and land disposal. The 32-hectare cluster in the Hung Shui Kiu/Ha Tsuen New Development Area is split into five functional zones spanning high-value goods logistics, e-commerce, freight forwarding, low-altitude economy and a transit depot. Officials cited its proximity to the Shenzhen Bay checkpoint, airport and Kwai Tsing container terminals. Zone B parcels could be available by late 2027 or early 2028; submissions are due by November 13. The Northern Metropolis, announced in 2021, aims to transform 30,000 hectares near the mainland border. The push follows a setback when the flagship Hung Shui Kiu project drew only two bids.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Northern%20Metropolis%20Hong%20Kong%20seeks%20interest%20in%20land%20parcels%20for%20logistics%20hub.pdf"}, {"id": "scmp-17", "title": "PAS' latest sharia law push signals its Malaysian federal power ambition", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Southeast Asia", "Politics"], "summary": "Malaysia's Islamist party PAS is setting an early pace ahead of national polls after the Kelantan state assembly it dominates unanimously passed amendments to the Syariah Offences Enactment Bill, seeking to circumvent constitutional barriers. In 2024 the federal court struck down 16 provisions as unconstitutional for overlapping common law; the new amendments use broader terminology. Analysts say the move matters less as law than as a signal to Malay-Muslim voters that PAS is committed to Islamic values. PAS became parliament's largest party in 2022, winning 43 of 222 seats on a \"green wave\". It is within striking distance of federal power via its Umno alliance, which recently won Negeri Sembilan. Analysts warn the messaging alienates non-Malay minorities PAS needs; polls must be held by early 2028.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/PAS'%20latest%20sharia%20law%20push%20signals%20its%20Malaysian%20federal%20power%20ambition.pdf"}, {"id": "scmp-18", "title": "Russia warns of 'chaos' in global food market after Ukraine pummels grain terminals", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Geopolitics", "Trade"], "summary": "Three of Russia's largest grain terminals in the Black Sea port of Novorossiysk halted operations after a massive overnight Ukrainian drone attack, making grain shipments currently impossible due to serious infrastructure damage. A loading gallery at United Grain's plant collapsed and silos were damaged. Russia and Ukraine account for over a quarter of global wheat exports, and Chicago wheat futures jumped as much as 4 per cent. Foreign ministry spokeswoman Maria Zakharova accused Kyiv of a campaign to \"incite chaos in the global food market\" serving Western interests. A state of emergency was declared in Novorossiysk, home to oil terminals and a naval base. President Zelensky said missiles targeted the Black Sea fleet's stronghold. Kpler analysts said Russian and Ukrainian exports will fall sharply this month.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Russia%20warns%20of%20'chaos'%20in%20global%20food%20market%20after%20Ukraine%20pummels%20grain%20terminals.pdf"}, {"id": "scmp-19", "title": "Satellite images show 50 per cent boost to China's Type 054B missile capacity", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Defence"], "summary": "Satellite images suggest China is adding vertical launch system (VLS) capacity to its most advanced guided-missile frigate, the Type 054B under construction in Shanghai, allowing a larger missile reserve and stronger anti-air defence. Images taken by US firm Vantor on June 28 show a six-unit structure at the bow, implying 48 VLS cells versus the 32 on the first two in-service vessels, a 50 per cent boost. Military commentator Song Zhongping said increasing cell count directly boosts anti-saturation defence and combat capability, calling the upgrade \"entirely plausible\". The VLS launches HHQ-16 surface-to-air missiles and Yu-8 anti-submarine torpedoes. The estimated 5,000-tonne frigate uses AI for near-zero air-defence blind spots. The first two ships, Luohe and Qinzhou, were commissioned last year and have deployed with the Liaoning carrier and near Scarborough Shoal.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Satellite%20images%20show%2050%20per%20cent%20boost%20to%20China's%20Type%20054B%20missile%20capacity.pdf"}, {"id": "scmp-20", "title": "Saudi-Turkey-Pakistan Mecca pact 'far from' Nato-style defence alliance", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "The Mecca Joint Defence Agreement signed by Saudi Arabia, Turkey and Pakistan remains far from an \"Islamic Nato\" because of diverging strategic interests and weak mutual defence capacity, experts said. The pact holds that an armed attack on one is an attack on all, echoing Nato's Article 5, but Turkey's Hakan Fidan stressed it is not directed against Iran. Tehran appeared unfazed, framing it as a response to Israel and declining confidence in US guarantees. Analyst Tang Tianbo called it \"still far from a Nato-style military alliance\", noting past attempts were \"long on rhetoric and short on action\". Niu Xinchun said establishing functional mutual defence was \"extremely slim\", citing the lack of a unified command. Earlier Gulf and \"Arab Nato\" initiatives fizzled amid regional tensions.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Saudi-Turkey-Pakistan%20Mecca%20pact%20'far%20from'%20Nato-style%20defence%20alliance.pdf"}, {"id": "scmp-21", "title": "Trump orders US aircraft carriers to go back to steam catapults", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Defence", "Politics"], "summary": "President Donald Trump ordered the US Navy to return to steam catapults to launch planes off aircraft carriers, acting on a long-time complaint despite opposition from many naval officers. In a presidential memorandum, Trump directed Defence Secretary Pete Hegseth to produce a plan within 60 days for using hydraulic catapults in the next Gerald Ford-class carrier, the planned USS Doris Miller. The Navy has struggled with the modern electromagnetic launch system on the USS Gerald R. Ford. Trump recounted a servicemember saying \"steam is better\", adding it could be fixed \"with a hammer and a blowtorch\". The decision is likely to cost hundreds of millions of dollars given the required redesign. The memo also directs Hegseth to plan a fifth Navy shipyard and a new surface-ship acquisition approach.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Trump%20orders%20US%20aircraft%20carriers%20to%20go%20back%20to%20steam%20catapults.pdf"}, {"id": "scmp-22", "title": "Trump turns to economic pain as US bombings fail to sway Iran", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "With its military campaign failing to force Iran to capitulate, the Trump administration is again betting that economic pressure will do the job. Facing a munitions shortfall and wary of an unpopular war, officials are returning to \"maximum pressure\", relying on sanctions and a naval blockade to stifle oil exports. UN ambassador Mike Waltz said \"Operation Economic Fury\", led by Treasury Secretary Scott Bessent, is \"devastating the Iranian economy\". The US has added some 2,200 sanctions since 2018, about 350 under Bessent's push. Critics note decades of sanctions on Iran, North Korea and Cuba have not sparked political change; analyst David Tannenbaum said \"the regime is entrenched\". A key option is hitting China and India, Iran's biggest oil buyers, though targeting major Chinese banks carries diplomatic costs.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Trump%20turns%20to%20economic%20pain%20as%20US%20bombings%20fail%20to%20sway%20Iran.pdf"}, {"id": "scmp-23", "title": "US accuses Chinese exporters of masterminding 'Great Transshipment Scam'", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Trade", "Geopolitics"], "summary": "The Trump administration released a 25-page report accusing Chinese exporters of orchestrating \"illegal transshipment\" through more than 40 third countries to dodge US tariffs, branding it \"The Great Transshipment Scam\". It alleges firms use limited assembly, relabelling and false country-of-origin declarations since the 2018 trade war began. Trade adviser Peter Navarro said the scheme let China \"launder its exports\" and \"rob our treasury of tens of billions\". China's embassy opposed \"overstretching the concept of national security\". Named countries include Canada, Mexico, Japan, South Korea, the EU and most of Southeast Asia. The report cites suspect transshipment of US$40-303 billion annually and estimates 450,000 displaced US jobs, using AI monitoring dubbed \"Detective Border\". Mexico and Vietnam face particular scrutiny; the findings precede an expected Xi-Trump summit.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/US%20accuses%20Chinese%20exporters%20of%20masterminding%20'Great%20Transshipment%20Scam'.pdf"}, {"id": "scmp-24", "title": "What the Mecca military pact means for China", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "This analysis argues the Mecca defence agreement between Saudi Arabia, Turkey and Pakistan presents a complex strategic calculus for Beijing. The tripartite pact, treating an attack on one as an assault on all, fuses Saudi capital, Turkish military technology and Pakistani manpower into an autonomous bloc born of eroding confidence in Western security guarantees. Beijing welcomes the erosion of America's Persian Gulf security monopoly, which validates its multipolar vision and could protect Belt and Road trade and energy routes. But liabilities loom: the pact, engineered as a deterrent against Iran, threatens China's strategic partnership with Tehran and its neutral-broker role from the 2023 Saudi-Iran rapprochement. Turkey's Kaan jet and drones also compete with Chinese defence exports. Beijing's stance will remain pragmatic and cautiously supportive under \"regional ownership of security\".", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/What%20the%20Mecca%20military%20pact%20means%20for%20China.pdf"}, {"id": "scmp-25", "title": "Zhu Rongji's legacy: how the late premier reshaped state firms, Pudong and China's economy", "source": "SCMP", "date": "14 Aug 2026", "tags": ["Politics", "Finance & Markets"], "summary": "Former Chinese premier Zhu Rongji, who died on Wednesday at 97, is remembered as a candid, decisive reformer who championed entrepreneurship, welcomed foreign management expertise and brought urgency to economic policymaking, according to four people who knew him for decades. Zhang Chongqing recalled Zhu as \"intelligent, insightful, outspoken and decisive\", sharing his office phone number with foreign guests. As premier, Zhu launched China's biggest state-owned enterprise reform, bankrupting tens of thousands of inefficient \"zombies\" and laying off millions, measures that revitalised the economy and made room for private and foreign firms. He helped set up Tsinghua's School of Economics and Management in 1984 and advocated adopting advanced foreign textbooks. His April 1999 Washington trip underpinned WTO accession and market opening, now a subject of reflection amid US-China rivalry.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20SCMP/Zhu%20Rongji's%20legacy%20how%20the%20late%20premier%20reshaped%20state%20firms,%20Pudong%20and%20China's%20economy.pdf"}]}};</script>
