 incorporate Upper House members collapsed on Aug 28 amid CDPJ resistance. Komeito head Toshiko Takeya said her party was \"extremely disappointed.\" A departure of all 28 former Komeito members would leave the alliance with 21 seats. The bloc won just 49 Lower House seats, down from 167. Prime Minister Sanae Takaichi's LDP and coalition partner Japan Innovation Party control over two-thirds of the 465-seat chamber; analysts say opposition fragmentation benefits the ruling parties.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20ST/Japan's%20main%20opposition%20party%20in%20Lower%20House%20signals%20break-up.pdf"},{"id":"st-13","title":"Land betterment charges up by 3.4% for non-landed, 3.5% for landed residential","source":"ST","date":"1 Sep 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"The Singapore Government has raised average land betterment charge (LBC) rates in most property sectors in its latest half-yearly review, with only the hotels-and-hospitals use group left untouched. The rates, announced Aug 31, take effect for the six months from Sept 1. Developers pay LBC for the right to enhance a site's use or build larger projects, with rates set by the SLA and the chief valuer across 118 sectors. Landed residential rates rose 3.5 per cent on average, non-landed residential 3.4 per cent (up to 29 per cent in some sectors), industrial 3.9 per cent, commercial 1.7 per cent, and place of worship/civic and community institution use 2.9 per cent, to keep pace with growth in land values.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20ST/Land%20betterment%20charges%20up%20by%203.4%20for%20non-landed%20residential,%203.5%20for%20landed%20residential%20u.pdf"},{"id":"st-14","title":"Macron seals $6 billion French frigate deal in Sweden","source":"ST","date":"1 Sep 2026","tags":["Defence","Geopolitics"],"summary":"President Emmanuel Macron on Aug 31 oversaw the signing of a €4.3 billion (S$6.3 billion) deal for Sweden to buy four French frigates, as Paris and Stockholm tighten cooperation against growing Russian threats. Macron and Swedish Prime Minister Ulf Kristersson signed the contract aboard the French frigate Amiral Ronarc'h in Stockholm, stressing greater European defence autonomy amid doubts over Washington's commitment under Trump. The frigates, built by Naval Group with first delivery in 2030, will carry Aster 30 interceptor missiles. Sweden will help support a Paris-led nuclear deterrence scheme. The leaders eyed a more sovereign European defence ecosystem, possibly joint fighter programmes after the Franco-German FCAS collapse. The deal follows France's purchase of two Saab GlobalEye aircraft.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20ST/Macron%20seals%206%20billion%20French%20frigate%20deal%20in%20Sweden.pdf"},{"id":"st-15","title":"New $300m grant to fund nascent technologies in Singapore under RIE2030","source":"ST","date":"1 Sep 2026","tags":["Technology & AI","Southeast Asia"],"summary":"A new $300 million grant in Singapore has been set up to turn promising research into commercially investable technologies, the National Research Foundation said. Each project can receive up to $2 million, rising to $3 million with backing from selected deep-tech venture builders; applications open in September. The grant is part of the Research, Innovation and Enterprise 2030 (RIE2030) plan, released in full on Aug 31, which allocates a record $37 billion (about 1 per cent of GDP) over 2026-2030, up 32 per cent from RIE2025. Funding covers two Flagships (semiconductors and transport/connectivity, $800 million each) and two Grand Challenges (longevity $350 million, decarbonisation $800 million), plus $1 billion more for Startup SG Equity. NRF chairman Heng Swee Keat outlined three focus areas.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20ST/New%20300m%20grant%20to%20fund%20nascent%20technologies%20in%20Singapore%20under%20RIE2030.pdf"},{"id":"st-16","title":"North Korea says hostile US policy unchanged, vows to strengthen nuclear force","source":"ST","date":"1 Sep 2026","tags":["Geopolitics","Defence"],"summary":"North Korea said on Aug 31 that US hostile policy remained unchanged and vowed to keep strengthening its nuclear force, rejecting repeated US denuclearisation calls. A Foreign Ministry spokesperson, via KCNA, accused Washington of a confrontational stance through its \"complete denuclearisation\" commitment, human rights criticism and planned joint drills with South Korea and Japan, saying the Trump administration \"fully reconfirmed its invariable hostile policy.\" Pyongyang called its nuclear weapons \"an absolute guarantee\" of sovereignty and said easing tensions was \"pointless.\" The statement came after Trump ordered a major scaling back of the Ulchi Freedom Shield exercises, citing his relationship with Kim Jong Un. The US, South Korea and Japan plan the Freedom Edge drill from Sept 7-11, which North Korea denounces.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20ST/North%20Korea%20says%20hostile%20US%20policy%20unchanged,%20vows%20to%20strengthen%20nuclear%20force.pdf"},{"id":"st-17","title":"Poland starts 'terrorist' investigation after drone factory fire","source":"ST","date":"1 Sep 2026","tags":["Geopolitics","Defence"],"summary":"Polish prosecutors announced on Aug 31 that they had launched a terrorism investigation into a fire at a drone factory, which they said was started deliberately. The blaze at the WB Electronics factory in the central city of Skarzysko-Kamienna took firefighters two hours to control early on Aug 31, and the ABW intelligence agency joined the police probe. Authorities did not name a suspect, but Poland, a key ally of neighbouring Ukraine, has accused Russia several times of attempted sabotage since the 2022 invasion. The prosecution statement cited participation in a foreign intelligence service's activities against Poland and a terrorist offence involving a device with flammable materials. Several eastern European countries report spying and sabotage they blame on a Russian \"hybrid war.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20ST/Poland%20starts%20'terrorist'%20investigation%20after%20drone%20factory%20fire.pdf"},{"id":"st-18","title":"Singapore, Indonesia operationalise local currency transaction framework","source":"ST","date":"1 Sep 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"Singapore and Indonesia have operationalised a framework letting bilateral transactions settle in their respective local currencies, jointly launched by the Monetary Authority of Singapore and Bank Indonesia. It aims to support bilateral trade and wider use of local currencies in intra-Asean transactions. Appointed cross currency dealers will settle current account transactions, direct investment and cross-border payments in rupiah and Singapore dollar. Singapore's dealers are DBS, OCBC and UOB; Indonesia's include Bank Mandiri, Bank Central Asia and Bank Negara Indonesia. The framework promotes direct rupiah-Singdollar quotations and aims to reduce exchange-rate risks and costs. It follows a 2022 memorandum and April 2026 operational guidelines. Bank executives said it will ease direct conversions and hedging for corporates operating across the two countries.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20ST/Singapore,%20Indonesia%20operationalise%20local%20currency%20transaction%20framework.pdf"},{"id":"st-19","title":"Smaller countries like Singapore, Uzbekistan must stay open as global rivalries grow: SM Lee","source":"ST","date":"1 Sep 2026","tags":["Geopolitics","Trade"],"summary":"Growing major-power rivalries and the weaponisation of trade dependencies are leaving smaller countries with less room to chart their own paths, Senior Minister Lee Hsien Loong told Uzbekistan's Parliament in Tashkent on Aug 31. But countries like Singapore and Uzbekistan cannot turn inwards and must stay open, strengthening ties with like-minded partners, he said, as multilateralism erodes. Lee welcomed Uzbekistan's impending WTO accession, targeted for 2026, and its planned accession to Asean's Treaty of Amity and Cooperation. He noted parallels between the two states and growing cooperation since President Mirziyoyev's 2023 Singapore visit, including free trade talks and a US$100 million Wilmar-Indorama agribusiness facility. Singapore chairs Asean in 2027; Lee returns home Sept 1.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20ST/Smaller%20countries%20like%20Singapore,%20Uzbekistan%20must%20stay%20open%20as%20global%20rivalries%20grow%20SM%20Le.pdf"},{"id":"st-20","title":"Trump vows to hit Iran 'hard' after first exchange of fire in weeks","source":"ST","date":"1 Sep 2026","tags":["Geopolitics","Defence"],"summary":"US President Donald Trump threatened on Aug 31 to hit Iran \"hard\" after the two foes traded fire for the first time in weeks, as Treasury Secretary Scott Bessent vowed to sustain economic pressure on Tehran. After six months of war, Iran keeps the Strait of Hormuz closed while the US maintains a naval counter-blockade. On Aug 30 the US struck Iranian rocket launchers on Larak island, killing three per state media; Iran retaliated with missiles and drones aimed at Jordan and the UAE, though President Masoud Pezeshkian called for dialogue. Trump said all missiles were shot down and branded Iran \"a Failed Nation.\" One-fifth of world oil passed through Hormuz before the war, triggered by US-Israeli strikes on Feb 28.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20ST/Trump%20vows%20to%20hit%20Iran%20'hard'%20after%20first%20exchange%20of%20fire%20in%20weeks.pdf"},{"id":"st-21","title":"Trump was sending message to Iran with Kharg Island post, says Vance","source":"ST","date":"1 Sep 2026","tags":["Geopolitics","Energy"],"summary":"US President Donald Trump was sending a message to Iran with his social media post about Iran's energy hub of Kharg Island being blown to smithereens, Vice-President J.D. Vance said on Aug 31. Vance said Trump likes to \"switch it up\" on social media and would be the first to say he doesn't announce military actions there, but was signalling to Tehran. Trump's one-line Aug 30 post was accompanied by an AI-generated video clip. A US official said the military had not targeted Kharg in overnight strikes, and an Iranian official dismissed the post as \"laughable.\" Kharg handled 90 per cent of Iran's oil exports before the war; attacking it would severely disrupt energy trade. US forces struck two launchers on Larak island.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20ST/Trump%20was%20sending%20message%20to%20Iran%20with%20Kharg%20Island%20post,%20says%20Vance.pdf"},{"id":"st-22","title":"Turkey says it has Black Sea grain plan and is in contact with Russia, Ukraine","source":"ST","date":"1 Sep 2026","tags":["Geopolitics","Trade"],"summary":"Turkey has prepared a plan for the safe passage of grain via the Black Sea and is in contact with both Russia and Ukraine regarding it, Foreign Minister Hakan Fidan said on Aug 31. Ankara has repeatedly expressed willingness to revive the UN-brokered wartime grain deal. \"We have prepared a plan and we are in contact with both sides,\" Fidan told a press conference in Istanbul, adding Turkey is working to achieve another agreement similar to the grain deal if conditions allow. Turkey and the United Nations mediated the 2022 Black Sea Grain Initiative, which allowed the safe export of nearly 33 million metric tons of Ukrainian grain despite the war. Russia withdrew in 2023, citing obstacles to its own food and fertiliser exports.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20ST/Turkey%20says%20it%20has%20Black%20Sea%20grain%20plan%20and%20is%20in%20contact%20with%20Russia,%20Ukraine.pdf"},{"id":"st-23","title":"US draws European pushback with Russia G-20 finance invite","source":"ST","date":"1 Sep 2026","tags":["Geopolitics","Finance & Markets"],"summary":"Russia's attendance at the opening of US-hosted G-20 finance meetings sparked European pushback on Aug 31, adding a surprise element to talks already clouded by the Iran war and Trump's trade policies. Russian finance minister Anton Siluanov made an unexpected appearance in Asheville, North Carolina, frustrating European leaders seeking to isolate Moscow. Trump said he likes \"getting along with everybody.\" German Finance Minister Lars Klingbeil called receiving Siluanov a troubling signal and refused a joint photo, in line with the EU's common position. Washington, holding the rotating presidency, is rallying partners to pressure Iran. Also weighing on talks were Trump's trade wars, notably with Canada. Bessent met Siluanov bilaterally; South Africa was excluded and Poland invited.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20ST/US%20draws%20European%20pushback%20with%20Russia%20G-20%20finance%20invite.pdf"},{"id":"st-24","title":"US-Taiwan ties 'never been stronger', says top diplomat in Taipei","source":"ST","date":"1 Sep 2026","tags":["Geopolitics","Technology & AI"],"summary":"The US-Taiwan relationship has \"never been stronger\" and Taiwan is helping re-industrialise the US with its tech investments, the top American diplomat in Taipei said on Aug 31. Raymond Greene, the de facto US Ambassador, praised deepening cooperation in high-tech and advanced manufacturing, noting 2025 was a record year for Taiwan's foreign direct investment in the US, led by TSMC's US$265 billion (S$337.4 billion) Arizona investment. He spoke ahead of the SEMICON chip trade show in Taipei. Trump has criticised Taiwan for \"stealing\" American semiconductor business, a view Taipei calls unfair. A Commerce official said the Chips Act is \"securing American prosperity,\" with the administration committed to reshoring semiconductor manufacturing and creating US jobs.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20ST/US-Taiwan%20ties%20'never%20been%20stronger',%20says%20top%20diplomat%20in%20Taipei.pdf"},{"id":"st-25","title":"Ukraine revamps security protocols amid Russian drone strikes aimed at 'paralysing' capital","source":"ST","date":"1 Sep 2026","tags":["Geopolitics","Defence"],"summary":"Kyiv on Aug 31 announced a review of security protocols, especially for public transport, after a dramatic surge in Russian drone attacks it says aim to \"paralyse\" the Ukrainian capital. Jet-powered drones have attacked Kyiv since last week, triggering a dozen air-raid alerts a day and partially shutting economic activity; the metro no longer crosses the Dnieper River, causing traffic chaos. Mayor Vitali Klitschko met officials to discuss keeping one metro line open, and city hall prepared remote learning as school begins Sept 1. Prime Minister Sergiy Koretskyi said the enemy is trying to paralyse economic activity. Overnight Aug 28-29, a strike on an ammunition depot killed 38 in the suburbs, and an attack killed a two-year-old girl in a park on Aug 29.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20ST/Ukraine%20revamps%20security%20protocols%20amid%20Russian%20drone%20strikes%20aimed%20at%20'paralysing'%20capita.pdf"},{"id":"bt-01","title":"'I'm not sure where the bond market turmoil is': Bessent pushes back on US debt fears","source":"BT","date":"1 Sep 2026","tags":["Finance & Markets","Politics"],"summary":"US Treasury Secretary Scott Bessent dismissed concerns about turbulence in the government bond market, telling Reuters ahead of a G20 finance leaders' gathering in Asheville, North Carolina, that the US bond market was \"the best performing\" among global peers in 2026. He argued that worries over rising debt and yields overlook a still-growing economy running large deficits. The 10-year note ended Aug 28 near 4.73 per cent. Bessent attributed higher yields to energy prices and Iran-conflict inflation he expects to fade. He defended the Treasury's surprise decision to at least double longer-dated debt buybacks to US$4 billion per operation, which begin Sep 10, drawing parallels with Draghi-era ECB and Bank of Japan interventions, and said his aim was to prevent disorderly markets, not set prices.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/'I'm%20not%20sure%20where%20the%20bond%20market%20turmoil%20is'%20Bessent%20pushes%20back%20on%20US%20debt%20fears.pdf"},{"id":"bt-02","title":"Amazon sued by US Federal Trade Commission, 22 states over ad sales practices","source":"BT","date":"1 Sep 2026","tags":["Technology & AI","Politics"],"summary":"The US Federal Trade Commission, joined by a bipartisan group of 22 states, sued Amazon in federal court in Washington state, alleging it illegally inflated advertising auction prices by surreptitiously raising the minimum price to place ads, costing advertisers US$20 billion or more. The agency said Amazon sometimes entered its own concealed bids in split-second ad auctions, with intervention in up to 80 per cent of sponsored-products auctions, and will seek \"tens of billions\" in damages. Amazon denied wrongdoing, saying average cost-per-click stayed flat from 2019 to 2024 and it saved advertisers US$8 billion between 2021 and 2025. Now the world's third-largest digital ad company after Google and Meta, Amazon booked US$68.6 billion in 2025 ad sales. Its shares fell about 2.5 per cent.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/Amazon%20sued%20by%20US%20Federal%20Trade%20Commission,%2022%20states%20over%20ad%20sales%20practices.pdf"},{"id":"bt-03","title":"As supply shocks multiply, monetary policy will shape corporate resilience","source":"BT","date":"1 Sep 2026","tags":["Finance & Markets","Energy"],"summary":"This commentary argues that recurring supply-side shocks, exemplified by the closure of the Strait of Hormuz, expose a policy trap: monetary tightening raises borrowing costs for the very capital-intensive \"resilience projects\", such as renewables, needed to reduce future exposure. It cites MAS managing director Chia Der Jiun's call for economies to invest in resilience amid thinning fiscal space and eroding insurability. The author advocates targeted central bank instruments, such as preferential refinancing facilities used by the BoJ, ECB and MAS's pandemic-era Facility for ESG Loans, that shield strategic energy diversification, supply-chain reshoring and climate adaptation from rate rises while preserving policy objectives. Singapore is cited as an economy that entered the oil shock from strength. The writer is a senior fellow at the Council on Economic Policies.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/As%20supply%20shocks%20multiply,%20monetary%20policy%20will%20shape%20corporate%20resilience.pdf"},{"id":"bt-04","title":"Asian shares slip as Fed rate-hike bets keep US yields elevated","source":"BT","date":"1 Sep 2026","tags":["Finance & Markets","Geopolitics"],"summary":"Asian equities slipped on Aug 31 as fresh US-Iran fighting lifted oil and elevated US yields kept markets on edge. Brent climbed 2.7 per cent to US$90.51 after US forces struck Iranian launchers on Larak Island and Iran retaliated against US forces in Jordan. Fed chair Kevin Warsh's Friday emphasis on controlling inflation pushed markets to price a 57 per cent chance of a September hike, flattening the curve. JPMorgan still expects December while calling September \"live\"; Barclays sees 25bp hikes in both months. Japan's Nikkei fell 0.4 per cent and Chinese blue chips 0.4 per cent as property developers slid on new rules. The yen traded near 159.78, the euro at US$1.1590. US crude rose 2.6 per cent to US$85.57; gold slipped to US$4,425.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/Asian%20shares%20slip%20as%20Fed%20rate-hike%20bets%20keep%20US%20yields%20elevated.pdf"},{"id":"bt-05","title":"Australia's home prices extend declines in August as downturn deepens","source":"BT","date":"1 Sep 2026","tags":["Finance & Markets","Society"],"summary":"Australian home prices fell for a fifth straight month in August, dropping 0.9 per cent nationally from July, as the housing downturn spread to more cities and regional areas, data from consultant Cotality showed. Values are now 3.6 per cent below their peak but still above a year earlier. Sydney and Melbourne led declines, falling 1.4 and 1.1 per cent, while boom markets Brisbane and Perth fell 1.0 and 0.8 per cent. Sydney's 7.1 per cent drop from its February peak now outpaces the 2022-23 correction. Research director Tim Lawless cited weaker transaction activity, with sales down 15.5 per cent over three months. The Reserve Bank of Australia has lifted the cash rate to 4.35 per cent, with markets pricing another hike after a hot July inflation print.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/Australia's%20home%20prices%20extend%20declines%20in%20August%20as%20downturn%20deepens.pdf"},{"id":"bt-06","title":"BYD profit rises for first time in 5 quarters on overseas growth, pointing the way out of China car slump","source":"BT","date":"1 Sep 2026","tags":["Technology & AI","Trade"],"summary":"BYD's overseas revenue exceeded its domestic China sales for the first time, ending one of its longest profit slumps and underscoring why Chinese carmakers are pushing abroad. First-half overseas sales rose 34 per cent to 181.3 billion yuan (US$27 billion), or 53 per cent of the total, while Greater China shrank 31 per cent, lifting profit for the first time in five quarters. Second-quarter net income climbed 30 per cent to 8.2 billion yuan on fatter overseas margins, such as the Seal U SUV priced above 39,900 euros in Germany. China's passenger-vehicle sales fell 21 per cent in July amid a 10th-month downturn, while overseas Chinese exports surged 88 per cent. Challenges loom from EU tariffs and a stalled Hungary factory facing labour and subsidy probes.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/BYD%20profit%20rises%20for%20first%20time%20in%205%20quarters%20on%20overseas%20growth,%20pointing%20the%20way%20out%20of.pdf"},{"id":"bt-07","title":"Bessent says Iranian money 'not ok', warns banks of weekly sanctions to pressure country","source":"BT","date":"1 Sep 2026","tags":["Geopolitics","Finance & Markets"],"summary":"US Treasury Secretary Scott Bessent told Reuters the department is likely to unveil weekly new secondary sanctions to increase economic pressure on Iran, with an initial focus on banks. Speaking ahead of a G20 finance leaders meeting in Asheville, he said the next step could be cutting an institution entirely off from the US dollar-based financial system, after penalties were imposed on the UAE branches of Egypt's Banque Misr over alleged financial links to Iran. \"You're going to see a lot more of these every week,\" Bessent said, adding \"we're telling the banks it's not okay to have Iranian money and to aid the regime.\" He said he intends to press G20 finance ministers and central bank governors to cut economic ties to Iran or face secondary sanctions.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/Bessent%20says%20Iranian%20money%20'not%20ok',%20warns%20banks%20of%20weekly%20sanctions%20to%20pressure%20country.pdf"},{"id":"bt-08","title":"Bitcoin slips below US$80,000 after Kevin Warsh's inflation vow","source":"BT","date":"1 Sep 2026","tags":["Finance & Markets"],"summary":"Bitcoin slipped back below US$80,000 on Aug 28 after Federal Reserve chair Kevin Warsh pledged to bring inflation back to target, pushing short-term Treasury yields higher and cooling risk-on momentum. Warsh said financial conditions are not restrictive and inflation must move clearly toward the Fed's target, reinforcing tighter-for-longer expectations. Bitcoin dropped as much as 4 per cent to US$76,871, leaving it little changed on the week after a 23 per cent gain the prior one, and still down about 40 per cent from its roughly US$126,000 record last October. Traders eyed the 50-week moving average as a key test after a record liquidation of leveraged bearish bets. A US$6.4 billion Bitcoin options expiry on Deribit left market makers facing positioning decisions, with skew shifting more call-heavy.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/Bitcoin%20slips%20below%20US80,000%20after%20Kevin%20Warsh's%20inflation%20vow.pdf"},{"id":"bt-09","title":"China orders military supply chain checks in self-reliance push","source":"BT","date":"1 Sep 2026","tags":["Defence","Geopolitics"],"summary":"China will begin checking the security of its military supply chains, joining other nations ramping up defence-industry self-reliance. A survey of military hardware, supplies and special production equipment by the Central Military Commission and State Council departments is required under the revised National Defense Mobilization Law passed Aug 28, which takes effect Oct 1 and also mandates measures to improve supply-chain resilience. The move mirrors US efforts to have contractors identify sources in adversary countries, spurred by China's 2025 curbs on rare earths and magnets, and India's push to localise production after the Iran war. China has progressed on choke points like specialised alloys and hypersonics but still relies on foreign high-end chips and design software. Beijing is also replacing Microsoft Windows with homemade operating systems in sensitive sectors.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/China%20orders%20military%20supply%20chain%20checks%20in%20self-reliance%20push.pdf"},{"id":"bt-10","title":"China's property stocks fall as new rules upend presale funding playbook","source":"BT","date":"1 Sep 2026","tags":["Finance & Markets","Politics"],"summary":"Chinese property developer shares slid on Aug 31 after regulators moved to restructure the presale system, sparking cash-flow worries. New central bank and financial-regulator rules issued Friday would issue mortgages only after residential projects are completed, ending developers' reliance on early buyer funds. The CSI300 Real Estate Index fell 4.7 per cent and a Hong Kong-listed developers gauge dropped 6.2 per cent. State-backed names led losses, with Greentown China down 17.6 per cent and China Jinmao 15.9 per cent. Presales made up 68 per cent of 2025 new home sales by floor space and account for 40 per cent of development capital. Rules also extend maximum mortgage tenors to 40 years. Analysts expect consolidation favouring state developers, with land sales revenue already down 30.8 per cent.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/China's%20property%20stocks%20fall%20as%20new%20rules%20upend%20presale%20funding%20playbook.pdf"},{"id":"bt-11","title":"Fed's Warsh tells G20 that past global savings glut is turning into investment surge","source":"BT","date":"1 Sep 2026","tags":["Finance & Markets"],"summary":"US Federal Reserve chairman Kevin Warsh told G20 finance leaders in Asheville, North Carolina, on Aug 31 that the world is experiencing a global investment surge that is powering growth, reversing the past savings gluts that kept capital idle for lack of investment opportunities. Attending his first international economic policy meeting since taking office in May, Warsh told the opening plenary he looked forward to learning more about member economies' growth prospects. He noted that during past G20 meetings, even before the 2008 global financial crisis and in years since, participants would have discussed \"a global savings glut,\" but that situation has reversed. \"If I were to try to characterise this moment, it would be one of a global investment surge,\" he said, adding that secular stagnation no longer applied.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/Fed's%20Warsh%20tells%20G20%20that%20past%20global%20savings%20glut%20is%20turning%20into%20investment%20surge.pdf"},{"id":"bt-12","title":"German inflation edges higher, adding to case for ECB hike","source":"BT","date":"1 Sep 2026","tags":["Finance & Markets","Energy"],"summary":"German inflation inched higher in August, reinforcing the case for a European Central Bank rate rise next month. Consumer prices rose an annual 2.9 per cent after 2.8 per cent in July, the strongest reading since April but below the 3.1 per cent median estimate. Energy was again the driver as a Middle East peace deal remained elusive, while services and food eased. The report follows evidence from France and Spain that oil and gas prices are stoking regional inflation, increasing pressure on the ECB, which has lifted rates once and is set to move again on Sep 10. The deposit rate sits at 2.25 per cent, and officials have discussed becoming \"mildly restrictive.\" Eurozone inflation likely picked up to 3.3 per cent, per a Bloomberg poll.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/German%20inflation%20edges%20higher,%20adding%20to%20case%20for%20ECB%20hike.pdf"},{"id":"bt-13","title":"Gold hits near two-week low on Fed chief's hawkish stance","source":"BT","date":"1 Sep 2026","tags":["Finance & Markets","Energy"],"summary":"Gold fell on Aug 31 to its lowest in nearly two weeks after Fed chair Kevin Warsh signalled rate hikes may be needed to ease price pressures, while escalating Middle East tensions fuelled inflation fears. Spot gold slipped 0.8 per cent to US$4,417.04 an ounce, its weakest since Aug 19, after dropping more than 3 per cent on Friday; US futures fell to US$4,466.80. Analysts noted gold loses appeal as rates rise since it yields no interest. Warsh said at Jackson Hole the Fed would \"have work to do\" if inflation does not head toward 2 per cent, and markets see a 60 per cent chance of a September hike. Oil rose more than 2 per cent after US strikes on Iran. Silver, platinum and palladium also fell.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/Gold%20hits%20near%20two-week%20low%20on%20Fed%20chief's%20hawkish%20stance.pdf"},{"id":"bt-14","title":"Indonesia puts US$70 billion commodity exports under closer watch as Danantara's platform goes live","source":"BT","date":"1 Sep 2026","tags":["Southeast Asia","Trade"],"summary":"Indonesia's commodity exporters face a new compliance regime as Danantara Sumberdaya Indonesia (DSI), the export arm of sovereign wealth manager Danantara, launches its export monitoring platform on Sep 1. The government-backed mechanism initially covers coal, palm oil and ferro-alloys, together worth more than US$70 billion in annual exports, to improve visibility and detect under-invoicing and transfer pricing that President Prabowo Subianto says has cost billions in lost revenue. DSI acts as an intermediary verifying export data, pricing and repatriation of proceeds; full implementation is targeted by year-end. The plan was scaled back from making DSI the sole commodity exporter. So far DSI has monitored over 6,500 declarations covering US$14 billion. Exporters and the coal and nickel industries seek clarity on costs and obligations.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/Indonesia%20puts%20US70%20billion%20commodity%20exports%20under%20closer%20watch%20as%20Danantara's%20platform%20g.pdf"},{"id":"bt-15","title":"Japan's factory output edges up despite Mid-East headwinds","source":"BT","date":"1 Sep 2026","tags":["Trade","Technology & AI"],"summary":"Japan's industrial production rose for a fourth straight month, gaining 0.1 per cent in July from June, beating forecasts for a 0.7 per cent drop and following a 1.9 per cent June jump; output was up 4.1 per cent year on year. The resilience suggests manufacturers weathered Middle East disruptions better than expected, aided by a weak yen. Retail sales rose 2.4 per cent in July. The data keeps the Bank of Japan on track for a near-term hike, with its next decision on Sep 18. Strong AI and chip demand supported output. Japan has diversified crude supplies through March 2028 as the Strait of Hormuz stays largely closed, with US crude now 36 per cent of imports. The government plans around 100 trillion yen for AI and semiconductors.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/Japan's%20factory%20output%20edges%20up%20despite%20Mid-East%20headwinds.pdf"},{"id":"bt-16","title":"Mapletree Industrial Trust says 'no certainty' of any deal, after report on potential US data centre divestment","source":"BT","date":"1 Sep 2026","tags":["Finance & Markets","Technology & AI"],"summary":"Mapletree Industrial Trust (MIT) said there is \"no certainty or assurance\" that any transaction will arise as it evaluates selective divestments in North America, in a late-night bourse filing on Aug 31 responding to media reports on a potential sale of its US data centre assets. Real estate outlet Mingtiandi had reported on Aug 28 that MIT put 22 US data centres across 15 states on the market, spanning over 3.1 million square feet. MIT's manager said it regularly reviews its portfolio to optimise asset performance, unlock value and recycle capital, and is pursuing selective North American divestments as part of portfolio rejuvenation, but cautioned no transaction was assured. MIT units closed Monday at S$1.94, up S$0.02 or 1 per cent.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/Mapletree%20Industrial%20Trust%20says%20'no%20certainty'%20of%20any%20deal,%20after%20report%20on%20potential%20US%20d.pdf"},{"id":"bt-17","title":"Nvidia to invest US$3.5 billion in chipmaker MediaTek","source":"BT","date":"1 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Nvidia is investing US$3.5 billion in Taiwanese chipmaker MediaTek by buying bonds convertible into its shares, deepening a partnership as it works to persuade more firms to build chips that plug into its data centre ecosystem. The deal will see MediaTek use Nvidia's NVLink Fusion and NVHBM technology, as the smaller firm challenges Broadcom and Marvell by helping data centre owners create their own components. It follows Amazon's pledge to deploy 2 million more Nvidia components. CEO Jensen Huang is tightening ties with MediaTek, whose market value has roughly tripled after a Google partnership. The moves help Nvidia stay central even as customers deploy in-house chips. Nvidia forecasts 70 per cent sales growth next year; MediaTek targets 15 per cent of an US$80 billion data centre segment.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/Nvidia%20to%20invest%20US3.5%20billion%20in%20chipmaker%20MediaTek.pdf"},{"id":"bt-18","title":"Oil settles up by more than 2.5% as US and Iran resume military attacks","source":"BT","date":"1 Sep 2026","tags":["Energy","Geopolitics"],"summary":"Oil settled more than 2.5 per cent higher on Aug 31 after a resumption of military action between the US and Iran rekindled global supply fears, as the conflict entered its sixth month. Brent crude settled up 2.71 per cent at US$90.49 a barrel, reaching US$91.52 intraday, its highest since Aug 25; WTI rose 2.83 per cent to US$85.76. President Trump promised to \"hit them hard\" after Iran launched missiles at two US air bases in Jordan in response to a US strike on Larak Island. US Strategic Petroleum Reserve stocks fell 3.1 million barrels to 286.6 million, near a 44-year low. Mediators seeking to reopen the Strait of Hormuz, through which a fifth of global oil once passed, have stalled; weekend transits fell to five vessels a day.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/Oil%20settles%20up%20by%20more%20than%202.5%20as%20US%20and%20Iran%20resume%20military%20attacks.pdf"},{"id":"bt-19","title":"ROEs of SGX mid-caps are a mixed bag, small-caps lag","source":"BT","date":"1 Sep 2026","tags":["Finance & Markets"],"summary":"A study of five-year adjusted average return-on-equity (ROE) figures from Bloomberg data found the average SGX small-cap posts negative 4.44 per cent ROE, though the median is a positive 1.58 per cent, reflecting wide dispersion. Standouts like Aztech Global (58.9 per cent) and HC Surgical (47.9 per cent) contrast with Mercurius Capital at negative 66.8 per cent. Mid-caps show a roughly 300-basis-point average-median gap, with PropNex at 44.8 per cent and StarHub at 40.9 per cent. Large-caps cluster tighter: DBS 14 per cent, OCBC 10.7 per cent. CGS International's Chia Tse Chern says the market has \"split into two\", driven by uneven AI adoption and interest-rate pressure on asset-heavy firms. Analysts urge reading ROE alongside ROA, ROIC and cash flow, noting Reits are structured to distribute rather than compound.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/ROEs%20of%20SGX%20mid-caps%20are%20a%20mixed%20bag,%20small-caps%20lag.pdf"},{"id":"bt-20","title":"Singapore firms dominate S-E Asia data centre funding, account for 98% of US$11.5 billion raised: report","source":"BT","date":"1 Sep 2026","tags":["Southeast Asia","Technology & AI"],"summary":"Five Singapore-headquartered data centre firms accounted for 98 per cent of the US$11.5 billion in equity funding raised across South-east Asia, research firm Tracxn found. The firms are DayOne, Princeton Digital Group, ST Telemedia Global Data Centres, Singtel's Nxera and Digital Edge, with funding concentrated in 19 rounds, about 85 per cent since 2024. From the start of 2026 to Aug 25, US$4.7 billion was raised, a record year. DayOne led with US$6.4 billion, or 55 per cent of the total, followed by Princeton Digital at US$2.2 billion. KKR bought minority stakes directly from Singtel in Nxera and STT GDC. Although all five are Singapore-based, most capacity sits regionally due to land and power constraints, with Singapore functioning as the sector's financing domicile.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/Singapore%20firms%20dominate%20S-E%20Asia%20data%20centre%20funding,%20account%20for%2098%20of%20US11.5%20billion%20ra.pdf"},{"id":"bt-21","title":"Singapore overtaken by Ningbo-Zhoushan as second busiest container port in H1","source":"BT","date":"1 Sep 2026","tags":["Trade","Southeast Asia"],"summary":"Singapore slipped to the world's third busiest container port in the first half of 2026, overtaken by China's Ningbo-Zhoushan despite handling 4.7 per cent more volume at 22.7 million TEUs. Ningbo-Zhoushan led for the first time with 22.9 million TEUs, up 8.8 per cent, while Shanghai stayed top at 28.7 million TEUs. Linerlytica's Tan Hua Joo attributed the Chinese port's faster growth to capacity expansion, and said South-east Asian competition from Haiphong, Cai Mep and Tanjung Pelepas diluted Singapore's gains. Analysts stressed the lead was only 158,310 TEUs, so the full-year ranking remains open and depends on second-half cargo flows. Singapore set a record 44.7 million TEUs in 2025. Dubai's Jebel Ali plunged from 10th to 32nd as the Middle East war halved its throughput.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/Singapore%20overtaken%20by%20Ningbo-Zhoushan%20as%20second%20busiest%20container%20port%20in%20H1.pdf"},{"id":"bt-22","title":"Singapore's inaugural RIE2025 report card shows business R&D spending up 64% at S$9 billion","source":"BT","date":"1 Sep 2026","tags":["Technology & AI","Society"],"summary":"Businesses raised R&D spending in Singapore 64 per cent to S$9 billion between 2018 and 2023, according to the inaugural report on the concluded Research, Innovation and Enterprise 2025 (RIE2025) plan, released Aug 31 alongside the RIE2030 roadmap. RIE2025 ran April 2021 to March 2026 on a S$28 billion budget; RIE2030 is backed by S$37 billion. For every public R&D dollar in 2023, businesses spent S$1.87, up from S$1.48; R&D-performing firms rose to 1,030 and industry R&D jobs grew 33 per cent to 32,509. Deep-tech exits included Horizon Quantum's US$567 million Nasdaq listing. But licensing revenue fell to S$18.6 million and deep-tech deals dropped to 91 in 2025. RIE2030 adds S$1 billion for Startup SG Equity and a S$300 million Research Translation Grant to close commercialisation gaps.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/Singapore's%20inaugural%20RIE2025%20report%20card%20shows%20business%20RD%20spending%20up%2064%20at%20S9%20billion.pdf"},{"id":"bt-23","title":"The AI push is becoming an energy race: Sembcorp","source":"BT","date":"1 Sep 2026","tags":["Energy","Technology & AI"],"summary":"In this commentary, a Sembcorp executive argues the global race to lead in AI is becoming a race to secure energy, with access to power emerging as a critical differentiator for attracting data centre investment. The IEA projects global AI-facility electricity use will reach about 1,000 TWh annually by 2030, more than doubling from around 415 TWh today, requiring major investment in generation, storage and grids. Sembcorp says it supplies close to one-third of the electricity demand from Singapore's data centre and semiconductor sectors, serving Equinix, STT GDC and Singtel, and recently expanded a Micron PPA to 600 MW. It is developing AI-ready infrastructure in the UK, Vietnam, Batam and Australia, while deploying AI tools like its Hyperspace predictive-maintenance platform. The writer is chief operating officer of Sembcorp Industries.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/The%20AI%20push%20is%20becoming%20an%20energy%20race%20Sembcorp.pdf"},{"id":"bt-24","title":"Trump's moves on the Korean peninsula are examples of how not to do diplomacy","source":"BT","date":"1 Sep 2026","tags":["Geopolitics","Defence"],"summary":"This commentary argues that President Donald Trump's interventions over South Korea have undercut US efforts to reassure Asian allies. On Aug 17, Trump cut short annual bilateral military drills hours before they began, criticising their cost and Seoul's ties with Pyongyang. He later confirmed he will try to meet North Korean leader Kim Jong Un around November near an Apec summit, and, against protocol, publicly stated North Korea has 57 \"very powerful\" nuclear weapons. The author notes about 28,500 US troops are stationed in South Korea, with Seoul paying US$1.1 billion in 2026. Trump's tirade set back outreach including Rubio's US$2.5 billion Asean pledge. The piece warns renewed engagement with Kim is unlikely to yield denuclearisation, damaging US-Asian alliances. The writer is an associate at LSE IDEAS.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/Trump's%20moves%20on%20the%20Korean%20peninsula%20are%20examples%20of%20how%20not%20to%20do%20diplomacy.pdf"},{"id":"bt-25","title":"US dollar inches lower as markets weigh Fed rate outlook; yen hovers near 160","source":"BT","date":"1 Sep 2026","tags":["Finance & Markets"],"summary":"The US dollar nudged lower on Aug 31 but stayed near a roughly two-week high as markets ramped up rate-hike bets after hawkish remarks from Fed chair Kevin Warsh and renewed Gulf tensions, with the yen near 160 per dollar. Warsh said the Fed would \"have work to do\" if inflation does not head toward 2 per cent, lifting the implied September hike probability to 60 per cent. The euro rose to US$1.1602 and sterling to US$1.3543. The dollar index fell 0.14 per cent to 99.51 but headed for a second monthly decline as buyback plans revived debasement trades. Brent rose 3.4 per cent to US$91.06 after US strikes on Larak Island. The yen firmed to 159.65 after breaching 160; Bessent called recent moves \"pretty well contained.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/US%20dollar%20inches%20lower%20as%20markets%20weigh%20Fed%20rate%20outlook%20yen%20hovers%20near%20160.pdf"},{"id":"bt-26","title":"Vessels crossing Strait of Hormuz drop to 5 per day over weekend","source":"BT","date":"1 Sep 2026","tags":["Energy","Geopolitics"],"summary":"The number of visible commodity vessels transiting the Strait of Hormuz dropped to five per day over the weekend, shipping data showed on Aug 31, as companies tread cautiously amid continued attacks on ships. The actual figure could be higher as some vessels switched off their automatic identification systems to evade attacks. Weekend traffic from commodities firm Kpler was limited to small vessels, including two liquefied petroleum gas carriers. On Friday, 14 vessels passed, including a very large crude carrier laden with two million barrels of Qatari oil that exited with its transponder off. The UK Maritime Trade Operations reported a tanker struck by an unknown projectile inbound on Saturday, the third attack in a week. Tensions rose after US forces struck two Iranian launchers on Larak Island on Sunday.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/Vessels%20crossing%20Strait%20of%20Hormuz%20drop%20to%205%20per%20day%20over%20weekend.pdf"},{"id":"bt-27","title":"Warsh charts a forward-looking path for Fed at Jackson Hole","source":"BT","date":"1 Sep 2026","tags":["Finance & Markets","Technology & AI"],"summary":"This commentary assesses Kevin Warsh's first Jackson Hole speech as new Fed chair, calling it a masterclass in central bank communication that deftly navigated short and long-term issues. Warsh addressed criticism about his unclear \"reaction function\" and delivered a somewhat hawkish read on the economy, reaffirming the PCE index as his preferred inflation target. He restated that forward guidance has \"outlived its role\", risking a \"hall of mirrors\" where the Fed and markets echo each other, and cited the 2021-22 mistake that let inflation surge past 9 per cent. The author argues the most consequential part addressed AI as a \"new factor of production\" with major implications for the economy, monetary policy and financial stability. The writer is chief economic adviser at Allianz.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20BT/Warsh%20charts%20a%20forward-looking%20path%20for%20Fed%20at%20Jackson%20Hole.pdf"},{"id":"scmp-01","title":"China's 6 biggest state banks post rare shared growth as margins show tentative rebound","source":"SCMP","date":"1 Sep 2026","tags":["Finance & Markets"],"summary":"China's six largest state-owned lenders – ICBC, CCB, ABC, BOC, Bocom and PSBC – recorded their first simultaneous rise in first-half revenue and net profit since 2022, according to interim results. Combined operating income topped 2 trillion yuan (US$297 billion) and net profit reached about 712.6 billion yuan, with revenue up 4-11 per cent and profit 4-6 per cent. The gains rested on a tentative rebound in net interest margins after two years of compression that dragged the industry average to a record low near 1.4 per cent. Disciplined liability-cost management helped, though analysts including Citic's Ming Ming and Dong Ximiao warned it was an \"L-shaped bottoming\" rather than a confirmed reversal. Interim dividends exceeded 220 billion yuan.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20SCMP/China's%206%20biggest%20state%20banks%20post%20rare%20shared%20growth%20as%20margins%20show%20tentative%20rebound.pdf"},{"id":"scmp-02","title":"China's AI chip drive: MetaX and Iluvatar swing to profit, as Biren narrows losses","source":"SCMP","date":"1 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"China's home-grown AI chipmakers are cashing in on Beijing's self-reliance drive, though first-half earnings reveal a stark divide. MetaX Integrated Circuits posted a net profit of 612 million yuan (US$90.9 million), reversing a 186 million yuan loss, as revenue jumped 44.7 per cent to 1.32 billion yuan; its Shanghai stock rose 2.4 per cent. Iluvatar Corex swung to a 106 million yuan profit from a 609 million yuan loss, with revenue up over 191 per cent. Biren Technology stayed in the red with a 377 million yuan loss, narrowed sharply, but revenue skyrocketed nearly 1,998 per cent to 1.24 billion yuan. The general-purpose GPU designers benefit from an aggressive national AI infrastructure buildout amid tightening US export controls.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20SCMP/China's%20AI%20chip%20drive%20MetaX%20and%20Iluvatar%20swing%20to%20profit,%20as%20Biren%20narrows%20losses.pdf"},{"id":"scmp-03","title":"China's Z.ai revenue jumps 400% as total losses narrow on explosive cloud gains","source":"SCMP","date":"1 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Chinese AI company Z.ai reported a 400 per cent jump in first-half revenue to 953.89 million yuan (US$142 million), driven by explosive growth in its open platform and API business. Cloud-based deployment revenue soared 2,736 per cent to 825 million yuan, accounting for 86.5 per cent of the total, as the firm shifted from on-premise deployment. Total loss narrowed 12.1 per cent to 2.07 billion yuan even as R&D spending rose 33.6 per cent to 2.13 billion yuan. Annual recurring revenue hit US$1.6 billion by end-August, double rival MiniMax's. Gross margin fell to 26.4 per cent from 50 per cent. Hong Kong-listed shares closed up 9.63 per cent but remain about 60 per cent below their June record.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20SCMP/China's%20Z.ai%20revenue%20jumps%20400%20as%20total%20losses%20narrow%20on%20explosive%20cloud%20gains.pdf"},{"id":"scmp-04","title":"China, US bond markets diverge as Warsh strikes hawkish tone at Jackson Hole","source":"SCMP","date":"1 Sep 2026","tags":["Finance & Markets"],"summary":"The divergence between Chinese and US bond markets risks widening as weak Chinese data and Federal Reserve chairman Kevin Warsh's hawkish Jackson Hole tone pressure Treasuries. China's 10-year yield traded at 1.692 per cent on Monday, near a one-year low, with brokerages such as Great Wall Securities predicting a drop to 1.65 per cent after July retail sales, industrial output and investment missed estimates. The US 30-year yield hovered near a two-decade high of 5.304 per cent despite Treasury Secretary Scott Bessent doubling a buy-back programme. Warsh's scrapping of forward guidance may add volatility. The disconnect reshapes global capital flows as investors seek diversification from US assets, with foreign holdings of Chinese bonds rising a third straight month in July.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20SCMP/China,%20US%20bond%20markets%20diverge%20as%20Warsh%20strikes%20hawkish%20tone%20at%20Jackson%20Hole.pdf"},{"id":"scmp-05","title":"Citi's China-US corridor thrives as mainland firms hedge risks amid trade turbulence","source":"SCMP","date":"1 Sep 2026","tags":["Finance & Markets","Trade"],"summary":"Escalating US-China trade friction has failed to dampen corporate activity, with Citi reporting a 44 per cent year-on-year revenue surge across its North America-China corridor in the first half. Instead of retreating, mainland firms leaned on global banks for foreign-exchange hedging, trade-exposure management and capital reconfiguration, China CEO Zhang Wenjie said. He described a \"Going Global 3.0\" phase where companies export entire hi-tech supply-chain ecosystems in green energy, EVs and AI. A \"dual-hub strategy\" routes treasury operations through Hong Kong, whose corridor is now Citi's largest and most active globally, up 20 per cent. Central Asia business doubled. Total capital raised for mainland clients reached US$30 billion by August. Citi is adding China desks in Brazil and Europe.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20SCMP/Citi's%20China-US%20corridor%20thrives%20as%20mainland%20firms%20hedge%20risks%20amid%20trade%20turbulence.pdf"},{"id":"scmp-06","title":"Former top European official adopts bullish tone on China-EU trade talks as deadline nears","source":"SCMP","date":"1 Sep 2026","tags":["Trade","Geopolitics"],"summary":"Charles Michel, European Council president from 2019 to 2024, struck a bullish tone on China-EU trade talks, telling reporters in Shanghai he expects progress by end-October, November or year-end across four tracks: trade and investment, export controls, intellectual property and WTO reform. Brussels set a three-month deadline for rebalancing ties amid fears cheap Chinese imports are deindustrialising Europe. Michel said China needs EU market access and lacks alternatives, giving Brussels leverage. Commission President Ursula von der Leyen is expected to announce new measures in September. A new tax on parcels under EUR150 cut low-value Chinese imports 54 per cent in July, but anti-subsidy EV tariffs of 17.8-45.3 per cent have not curbed surging Chinese vehicle sales.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20SCMP/Former%20top%20European%20official%20adopts%20bullish%20tone%20on%20China-EU%20trade%20talks%20as%20deadline%20nears.pdf"},{"id":"scmp-07","title":"Golden hour: why Hong Kong may finally succeed in becoming precious metal's trading hub","source":"SCMP","date":"1 Sep 2026","tags":["Finance & Markets","Geopolitics"],"summary":"Hong Kong's ambition to become a global gold trading hub rivalling New York and London is gaining credibility after it launched a central clearing and settlement system in July, alongside a delivery connect with the Shanghai Gold Exchange. Eleven Chinese and international banks, including JPMorgan, HSBC and UBS, have joined. Geopolitical tensions and de-dollarisation are driving demand: central banks bought 289 tonnes in the second quarter, and the PBOC lifted reserves for a 21st straight month while cutting US Treasury holdings to an 18-year low. Gold traded near US$4,607 an ounce. The airport depository targets 2,000 tonnes within three years, and firms like SF Express, ICBC and Standard Chartered are building vaults and refineries, supporting renminbi internationalisation.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20SCMP/Golden%20hour%20why%20Hong%20Kong%20may%20finally%20succeed%20in%20becoming%20precious%20metal's%20trading%20hub.pdf"},{"id":"scmp-08","title":"Hong Kong and Singapore property shrug off fund tax breaks","source":"SCMP","date":"1 Sep 2026","tags":["Finance & Markets"],"summary":"As Hong Kong and Singapore compete for investment talent through fund-manager tax incentives, analysts say the spillover into office and residential property is negligible. A Hong Kong bill would offer preferential carried-interest treatment; Singapore's central bank responded on August 19 with measures exempting a share of fund managers' profits. Citigroup called Hong Kong's reform a \"structural catalyst\", estimating 1,500 new asset-management jobs could add 150,000 sq ft of Grade A office take-up. But JLL and CBRE say tax competition is not a key driver. Mainland China's influence, Singapore's safe-haven status, differing supply-demand dynamics and Hong Kong's decentralised office market matter more. Singaporeans made up 90 per cent of luxury home sales; mainland buyers drove Hong Kong's.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20SCMP/Hong%20Kong%20and%20Singapore%20property%20shrug%20off%20fund%20tax%20breaks.pdf"},{"id":"scmp-09","title":"Hong Kong can play unique role in fostering robotics industry: Paul Chan","source":"SCMP","date":"1 Sep 2026","tags":["Technology & AI"],"summary":"Financial Secretary Paul Chan Mo-po said Hong Kong can play an \"important and unique role\" in robotics, welcoming the city's first convenience stores run by humanoid robots. Beijing-based Galbot will open its first \"Galbot stores\" in Hung Hom, Kai Tak and Wan Chai, its first outlets outside the mainland, where it operates about 200 stores across 50 cities. Chan cited three strengths: application scenarios, an R&D ecosystem and a supporting capital chain, referencing a Morgan Stanley projection of nearly 1 billion humanoid robots by 2050, with China accounting for 300 million. HKIC CEO Clara Chan said it invested in Galbot two years ago. The wheeled robots, powered by AstraBrain, take orders and prepare drinks, and understand Cantonese, expecting to break even within 12-18 months.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20SCMP/Hong%20Kong%20can%20play%20unique%20role%20in%20fostering%20robotics%20industry%20Paul%20Chan.pdf"},{"id":"scmp-10","title":"Hot property: Big banks, fashion stores seek 'cheaper', eye-catching Hong Kong retail","source":"SCMP","date":"1 Sep 2026","tags":["Finance & Markets"],"summary":"Banks and fashion brands are seizing lower rents for prime Hong Kong retail space to boost visibility, agents say. HSBC will open its first flagship branch at Capitol Centre in Causeway Bay on October 20, previously home to Chanel and Forever 21, paying HK$4 million (US$510,200) a month – well below prior tenants – while closing two nearby branches. The 161-year-old bank becomes the site's first non-fashion long-term tenant since 2008. Colliers noted growing demand from private banks and insurers using street-front premises as client hubs. On Paterson Street, fast-fashion brand W. Management will take space vacated by H&M in Fashion Walk for over HK$2 million monthly. Hong Kong retail sales rose 7.1 per cent in the second quarter; online surged 25.3 per cent.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20SCMP/Hot%20property%20Big%20banks,%20fashion%20stores%20seek%20'cheaper',%20eye-catching%20Hong%20Kong%20retail.pdf"},{"id":"scmp-11","title":"Huawei and Apple bend to a tougher market with foldable phones as memory crunch bites","source":"SCMP","date":"1 Sep 2026","tags":["Technology & AI"],"summary":"Highly anticipated foldable launches from Apple and Huawei are expected to offer a lifeline to a subdued smartphone market bracing for a record 16.7 per cent decline in 2026. Apple's September 9 event, the keynote debut of new CEO John Ternus, is expected to unveil its first foldable iPhone, two days after Huawei's Mate XT 2 trifold. IDC's Nabila Popal projects Apple shipping over 17 million foldables by 2027, capturing 40 per cent of the segment, the market's \"only silver lining\" set to grow 13 per cent this year. A severe memory crunch driven by AI infrastructure demand is lifting average smartphone prices about 27 per cent to US$581. Action-camera maker Insta360 reported a 94 per cent profit drop on memory costs.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20SCMP/Huawei%20and%20Apple%20bend%20to%20a%20tougher%20market%20with%20foldable%20phones%20as%20memory%20crunch%20bites.pdf"},{"id":"scmp-12","title":"Huawei, with an eye on self-reliance, ploughs 25% of revenue into R&D at expense of profits","source":"SCMP","date":"1 Sep 2026","tags":["Technology & AI"],"summary":"Huawei Technologies poured more than a quarter of its first-half revenue into R&D, prioritising technological independence over earnings as profit plunged 36 per cent. R&D expenses jumped 25 per cent to 121.4 billion yuan (US$18 billion) for the six months through June. Net profit fell to 23.8 billion yuan from 37.2 billion yuan, the second straight year of first-half declines, while operating cash flow swung to negative 39.9 billion yuan. Revenue rose 9.55 per cent to 467.8 billion yuan on a smartphone rebound and AI-chip demand. Huawei led China's smartphone market with a 22.6 per cent share, the only top-10 vendor to grow. Its Ascend AI chips are gaining adoption from DeepSeek, Z.ai and iFlyTek, with the Kirin 2026 processor expected this autumn.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20SCMP/Huawei,%20with%20an%20eye%20on%20self-reliance,%20ploughs%2025%20of%20revenue%20into%20RD%20at%20expense%20of%20profits.pdf"},{"id":"scmp-13","title":"Israel and Greece sign US$3.5 billion defence deal, largest ever between the 2","source":"SCMP","date":"1 Sep 2026","tags":["Defence","Geopolitics"],"summary":"Israel signed a nearly EUR3 billion (US$3.5 billion) weapons deal with Greece, the largest between the two Mediterranean countries, as Israeli defence exports soar. The agreement, coined Achilles Shield, includes a multilayered air-defence system using Israeli technology and marks the first time Israel would supply a complete array of defences against threats from ballistic missiles to drones, including David's Sling and SPYDER systems. A complementary US$30 million deal covers Rafael's Drone Dome. Defence Minister Israel Katz cited shared regional challenges; Greece's Nikos Dendias stressed modern warfare. Israeli weapons exports reached a record US$19 billion last year, up 30 per cent, and Israel surpassed the UK to become the world's seventh-biggest arms supplier, per SIPRI. Greece is modernising to match Nato rival Turkey.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20SCMP/Israel%20and%20Greece%20sign%20US3.5%20billion%20defence%20deal,%20largest%20ever%20between%20the%202.pdf"},{"id":"scmp-14","title":"Move over Strait of Hormuz. Innovation chokepoints are the ones to watch","source":"SCMP","date":"1 Sep 2026","tags":["Geopolitics","Trade"],"summary":"This commentary argues that in great-power rivalry the most consequential chokepoints are not resource corridors but innovation ones. Blocking oil routes like the Strait of Hormuz inflicts severe short-term damage but leaves little economic \"memory\" as alternative routes emerge. Rare earths carry a longer memory: an IMF paper estimates an 80 per cent supply cut would cost about 1.8 per cent of GDP in Japan, 1.5 per cent in the US and 1.2 per cent in Germany, since processing capacity cannot be built quickly. The deepest impact comes from advanced semiconductors, lithography and AI, where lost time at the technological frontier is almost impossible to recover. IMF estimates suggest trade fragmentation plus technological lag could cut some countries' long-term output by up to 12 per cent.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20SCMP/Move%20over%20Strait%20of%20Hormuz.%20Innovation%20chokepoints%20are%20the%20ones%20to%20watch.pdf"},{"id":"scmp-15","title":"PetroChina's first-half profit jumps 22% as higher oil prices offset Iran war supply hit","source":"SCMP","date":"1 Sep 2026","tags":["Energy","Finance & Markets"],"summary":"PetroChina reported a 22 per cent jump in first-half net profit to 103.9 billion yuan (US$15.4 billion) as higher crude prices offset weaker output and softening domestic fuel demand. Revenue rose 5.3 per cent to 1.53 trillion yuan. The company is restoring Middle East operations after the US-Israeli war in Iran, with regional output back to nearly 90 per cent of pre-conflict levels, president Ren Lixin said. Average realised crude prices rose 15.6 per cent to US$76.53 a barrel, lifting oil-and-gas operating profit 15.3 per cent, though total crude output fell 2.8 per cent as overseas production dropped 14.2 per cent. Refined-fuel sales declined amid EV and LNG adoption. Vehicle LNG sales jumped 78.7 per cent. An interim dividend of 0.26 yuan per share was declared.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20SCMP/PetroChina's%20first-half%20profit%20jumps%2022%20as%20higher%20oil%20prices%20offset%20Iran%20war%20supply%20hit.pdf"},{"id":"scmp-16","title":"Prediction markets have priced the Trump-Xi summit. Do the bets have any value?","source":"SCMP","date":"1 Sep 2026","tags":["Geopolitics","Politics"],"summary":"Prediction markets have heavily priced a Trump-Xi summit, which President Trump says will occur September 24 in Washington, though Beijing has not formally confirmed Xi's visit. As of August 27, Polymarket put a September meeting at about 95 per cent and Kalshi a pre-October visit at 88 per cent. As the summit nears, traders will price outcomes on tariffs, AI, semiconductor controls and Taiwan. Analysts including the Council on Foreign Relations' Samuel Lazarus warn markets price tactical shifts but miss the summit's most valuable possible result – greater stability. Cases like a White House teleprompter operator betting on Kalshi highlight insider-information risks. Beijing, experts say, will disregard the noise and focus on actions and commitments rather than words.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20SCMP/Prediction%20markets%20have%20priced%20the%20Trump-Xi%20summit.%20Do%20the%20bets%20have%20any%20value.pdf"},{"id":"scmp-17","title":"Singapore to invest US$173m over 3 years to boost fintech innovation","source":"SCMP","date":"1 Sep 2026","tags":["Technology & AI","Southeast Asia"],"summary":"Singapore will commit S$220 million (US$173 million) over three years to boost its fintech sector, including co-funding at least 1,000 internships to build talent for AI and emerging technologies. The funds come under FSTI 4.0, the latest iteration of the Financial Sector Technology and Innovation Scheme. The industry has more than 1,800 firms employing close to 10,000 professionals, with 2025 investment of S$2.9 billion, per the Monetary Authority of Singapore. MAS will fund up to 80 per cent of each internship, facilitated through a new portal by the Singapore FinTech Association. FSTI 4.0 also includes an AI Pathfinder track and infrastructure track. Deputy Prime Minister Gan Kim Yong stressed talent-building and said finance is \"not a zero-sum game\" versus Hong Kong.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20SCMP/Singapore%20to%20invest%20US173m%20over%203%20years%20to%20boost%20fintech%20innovation.pdf"},{"id":"scmp-18","title":"Trump praises China for remaining 'relatively inactive' during Strait of Hormuz crisis","source":"SCMP","date":"1 Sep 2026","tags":["Geopolitics","Energy"],"summary":"US President Donald Trump praised China for remaining \"relatively inactive\" during the prolonged closure of the Strait of Hormuz, weeks before Xi Jinping is expected to visit Washington. Trump said he has \"a lot of respect\" for Xi and believes it is mutual. His remarks came as Treasury Secretary Scott Bessent indicated Chinese banks may not be targeted under \"Economic D-Day\" secondary sanctions, appearing to mark a climbdown after threats to sanction Chinese lenders and refiners over Iranian links. Bessent had announced sanctions on 60 entities worldwide. China, the largest buyer of Iranian oil at over 80 per cent of exports, rejected \"illicit unilateral sanctions.\" US strikes resumed on Iran's Larak Island; Tehran retaliated against bases in Jordan and the UAE.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20SCMP/Trump%20praises%20China%20for%20remaining%20'relatively%20inactive'%20during%20Strait%20of%20Hormuz%20crisis.pdf"},{"id":"scmp-19","title":"Trump to meet US oil executives as Iran war keeps fuel prices high","source":"SCMP","date":"1 Sep 2026","tags":["Energy","Politics"],"summary":"US President Donald Trump will meet oil refining executives on Tuesday as he tries to tame fuel prices sent spiralling by the Iran war ahead of November's midterm elections, the White House said. The talks come days after Trump announced a deal for a large US stake in Venezuela's oil reserves, whose leader Nicolas Maduro was toppled by US forces in January. Republicans fear voters will punish them over high fuel costs. The White House said the meeting would include a mix of small, medium and large refiners to discuss increasing refining capacity and lowering prices, calling it timely as Venezuelan crude flows to US refineries increase. Trump said the Venezuela deal would give \"majority US control\" of 65 billion barrels of reserves.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20SCMP/Trump%20to%20meet%20US%20oil%20executives%20as%20Iran%20war%20keeps%20fuel%20prices%20high.pdf"},{"id":"scmp-20","title":"US export controls on tungsten, battery 'black mass' seen pressuring Chinese recyclers","source":"SCMP","date":"1 Sep 2026","tags":["Trade","Geopolitics"],"summary":"Washington's new one-year measure barring exports of tungsten scrap and lithium-ion battery \"black mass\" will deprive Chinese refiners of low-cost feedstock and prompt Beijing to seek alternatives, analysts say. The directive mandates suppliers offer 100 per cent of monthly output to US buyers and keep materials domestic. Tungsten is used in semiconductors, AI chips, aerospace and weapons. The move follows China's February 2025 tungsten export controls. Willamette University's Liang Yan said the US lacks processing capacity, with new refineries taking two to five years, so China is hit short-term. US black-mass exports reached 100,667 tonnes in 2025, up 48.7 per cent. China imported 111,657 tonnes of industrial waste from the US in seven months. Analysts expect controls to expand to rare earths, antimony and gallium.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20SCMP/US%20export%20controls%20on%20tungsten,%20battery%20'black%20mass'%20seen%20pressuring%20Chinese%20recyclers.pdf"},{"id":"scmp-21","title":"What do China's new housing presale rules mean for real estate developers?","source":"SCMP","date":"1 Sep 2026","tags":["Finance & Markets"],"summary":"China rolled out a stronger-than-expected package to transition its housing market away from presales, a double-edged sword for developers. Under new People's Bank of China rules, presales remain but down payments and mortgage funds are disbursed only when projects are fully completed, rather than when topped out, delaying cash inflows by six to 12 months. Caitong Securities' Fang Chengqi estimates developers' average levered return could drop about 60 per cent, favouring large state-owned players over aggressive mid-tier private firms. Developer stocks including China Jinmao and Greentown tumbled more than 10 per cent in Hong Kong. Regulators also extended the maximum mortgage term from 30 to 40 years. Analysts say the reform aims to restore buyer confidence and stabilise prices over time.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20SCMP/What%20do%20China's%20new%20housing%20presale%20rules%20mean%20for%20real%20estate%20developers.pdf"},{"id":"scmp-22","title":"Why Japan's hypersonic and underwater weapon plans might worry China","source":"SCMP","date":"1 Sep 2026","tags":["Defence","Geopolitics"],"summary":"China has criticised Japan's plans to arm submarine drones with long-range missiles and test hypersonic weapons in Australia, moves analysts say could threaten PLA amphibious groups within the first island chain and affect operations in a Taiwan conflict. Defence ministry spokesman Zhang Xiaogang likened the \"dangerous\" moves to pre-World War II militarisation. Japan has expanded strike capabilities since its 2022 counterstrike policy, deploying the Type-25 HVGP and developing scramjet-powered hypersonic cruise missiles and unmanned underwater vehicles. Analysts including RAND's Timothy Heath said missile-armed UUVs could be hard to detect and deployed cheaply in numbers. Advanced HVGP variants could reach 2,000-3,000km, putting mainland targets within range. Japan and Australia agreed on August 18 to use Australian missile ranges over the next decade.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20SCMP/Why%20Japan's%20hypersonic%20and%20underwater%20weapon%20plans%20might%20worry%20China.pdf"},{"id":"scmp-23","title":"Will fixing Hong Kong's childcare bottleneck help lift the city's birth rate?","source":"SCMP","date":"1 Sep 2026","tags":["Society"],"summary":"Parents and social welfare groups say demand for Hong Kong childcare services remains high even as births fall below 30,000 for the first time since records began in 1962. The city recorded 29,700 births between mid-2025 and mid-2026, down 15.6 per cent year on year. Nurse Erica Lam's daughter only secured a day-care place at eight months old, while her son never got one. SKH St Christopher's Home, which can enrol 88 under-threes, has a waiting list exceeding 70. The Social Welfare Department said 553 childcare centres served 43,000 children as of the first quarter but does not track waiting times. Advocates including chief executive Silvia Mak and lawmaker Nixie Lam urged stationing social workers at every centre to better support working parents.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/01%20Sep%202026/01%20Sep%20SCMP/Will%20fixing%20Hong%20Kong's%20childcare%20bottleneck%20help%20lift%20the%20city's%20birth%20rate.pdf"},{"id":"scmp-24","title":"Xi, Putin vow to deepen strategic ties after Shanghai Cooperation Organisation summit meet","source":"SCMP","date":"1 Sep 2026","tags":["Geopolitics"],"summary":"Chinese President Xi Jinping and Russian President Vladimir Putin vowed to strengthen the Shanghai Cooperation Organisation and deepen strategic coordination amid mounting tensions with Washington, meeting on the sidelines of the SCO summit in Bishkek, Kyrgyzstan. It was their second face-to-face meeting this year after Putin's May visit to China. Putin praised bilateral relations as a model, offering cooperation in trade, energy, industry and technology. Trade rose about 25 per cent year on year in the first half, approaching US$159 billion over seven months. Energy featured prominently, including the stalled Power of Siberia 2 pipeline, unresolved on pricing and financing. The SCO, marking its 25th anniversary with 10 members, rem
