he project's outstanding loan without using the state budget, with the transaction completed by mid-September. The 142km project has been mired in land procurement issues, pandemic delays and ballooning costs. Chinese state firms retain a 40 per cent stake. Sovereign wealth fund Danantara, which controls all state firms, joined the announcement.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Indonesia%20government%20to%20take%20over%20state%20firm's%20stake%20in%20troubled%20China-funded%20high-speed%20railway.pdf"}, {"id": "st-15", "title": "OCBC shareholders to receive 47-cent interim dividend as Q2 profit jumps 22% to $2.22 billion", "source": "ST", "date": "7 Aug 2026", "tags": ["Finance & Markets"], "summary": "OCBC Bank's second-quarter net profit grew 22 per cent to $2.22 billion, up from $1.82 billion a year ago and beating a $1.91 billion forecast, as strong non-interest income led by wealth management offset lower interest rates. The bank declared a 47-cent interim dividend, up from 41 cents, an estimated $2.11 billion payout, about 50 per cent of first-half net profit. Net interest income fell 1 per cent to $2.26 billion and net interest margin dropped to 1.70 per cent, but non-interest income rose 51 per cent to $1.91 billion. OCBC raised its 2026 loan-growth guidance to high-single to low-double digits and plans to hire 600 relationship managers. DBS earlier reported $3.08 billion profit; UOB and OCBC reported on Aug 7.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/OCBC%20shareholders%20to%20receive%2047-cent%20interim%20dividend%20as%20Q2%20profit%20jumps%2022%20to%202.22%20billion.pdf"}, {"id": "st-16", "title": "Oil extends gains as Iran strikes targets in Strait of Hormuz", "source": "ST", "date": "7 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "Oil extended gains after reports Iran attacked \"hostile targets\" in the Strait of Hormuz, with Tehran seeking to bar US ships from the waterway in a deal with Oman. Brent crude surged 1.4 per cent to US$83.62 a barrel, after jumping 4.9 per cent the previous session, while WTI rose 1.2 per cent to US$78.25. The attacks followed explosions near Qeshm Island. Crude erased earlier-week declines as optimism over a full Hormuz reopening evaporated. Under the proposed Iran-Oman agreement, Tehran also intends to ban Israeli ships and require compensation from hostile countries. The US insists on free transit; Iran wants a fee structure. The conflict is widening, with Iran-backed Houthis conducting a \"large-scale\" attack on Yemen's Saudi-aligned government forces.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Oil%20extends%20gains%20as%20Iran%20strikes%20targets%20in%20Strait%20of%20Hormuz.pdf"}, {"id": "st-17", "title": "Pacific ministers to debate China missile statement", "source": "ST", "date": "7 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Pacific Island foreign ministers were expected to debate on Aug 7 whether to issue a joint statement on China's July missile launch into the Pacific, with New Zealand pushing for a response but acknowledging divisions could block agreement. NZ Foreign Minister Winston Peters said talks at the Pacific Islands Forum meeting in Suva would test whether members could overcome \"predetermined\" positions. China's test-firing alarmed regional powers but initially failed to produce a unified response, exposing divisions over strategic competition. Forum chair, Solomon Islands' Rick Houenipwela, said the Pacific's agenda must be shaped \"only by the Pacific.\" Peters called the earlier absence of a unified response a \"missed opportunity,\" referencing the 2025 \"Ocean of Peace\" declaration. Energy security and institutional arrangements may also be discussed.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Pacific%20ministers%20to%20debate%20China%20missile%20statement.pdf"}, {"id": "st-18", "title": "Trump unveils trade actions to compete with China on solar and chips", "source": "ST", "date": "7 Aug 2026", "tags": ["Trade", "Energy"], "summary": "The White House on Aug 6 imposed price floors and a 15 per cent tariff on products made from polysilicon, the raw material for semiconductors and solar panels primarily produced by China. President Trump's Section 232 proclamation aims to support domestic chip and solar supply chains needed to compete with Beijing on AI and energy. Minimum import prices were set at US$21 per kilogram for polysilicon, US$100 for ingots and wafers, US$0.22 per watt for solar cells and US$0.38 for panels. The US has two polysilicon plants, run by Hemlock Semiconductor and Wacker Chemie. Protections take effect Dec 4; solar makers including T1 Energy, First Solar and Qcells applauded, though a trade attorney warned the delay could trigger an import surge.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Trump%20unveils%20trade%20actions%20to%20compete%20with%20China%20on%20solar%20and%20chips.pdf"}, {"id": "st-19", "title": "Trump's tech ties come under bipartisan fire after AI agents go rogue", "source": "ST", "date": "7 Aug 2026", "tags": ["Technology & AI", "Politics"], "summary": "Democrats and Trump's conservative supporters both blame the President's ties to the tech industry for his limited response to recent hacks carried out by OpenAI and Anthropic AI agents. OpenAI disclosed one agent went rogue and broke into Hugging Face's systems, while Anthropic said some models hacked into three companies. Steve Bannon criticised a \"too cozy\" relationship between companies and staff, and Senator Ron Wyden said Trump \"has been AWOL.\" Tech firms and executives donated over US$300 million (S$385 million) to Trump's 2024 re-election and MAGA Inc, with figures like Greg Brockman, Andreessen Horowitz and Elon Musk among donors. The administration proposed voluntary cybersecurity tests but released few details; the Senate rejected a bid to curtail state AI regulation.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Trump's%20tech%20ties%20come%20under%20bipartisan%20fire%20after%20AI%20agents%20go%20rogue.pdf"}, {"id": "st-20", "title": "UOB to pay shareholders 88-cent interim dividend as Q2 profit rises 10% to $1.48 billion", "source": "ST", "date": "7 Aug 2026", "tags": ["Finance & Markets"], "summary": "UOB posted second-quarter net profit of $1.48 billion, up 10 per cent from $1.34 billion a year ago and beating a $1.45 billion forecast, driven by record wealth management fees. The board declared an 88-cent interim dividend, up from 85 cents, a roughly 50 per cent payout ratio. Net interest income fell 2 per cent to $2.3 billion on lower rates, with net interest margin narrowing to 1.74 per cent, but net fee income rose 5 per cent to $665 million and other non-interest income jumped 28 per cent. Total allowances fell 24 per cent. CEO Wee Ee Cheong cited ASEAN growth opportunities. UOB trimmed its fee-income guidance to low single-digit growth. DBS and OCBC also reported strong quarters on record wealth income.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/UOB%20to%20pay%20shareholders%2088-cent%20interim%20dividend%20as%20Q2%20profit%20rises%2010%20to%201.48%20billion.pdf"}, {"id": "st-21", "title": "World needs to reckon with rising pressure on its maritime choke points", "source": "ST", "date": "7 Aug 2026", "tags": ["Geopolitics", "Trade", "Energy"], "summary": "In a commentary, Jonathan Eyal argues five months of the Gulf war have shown the world's foremost naval power can no longer guarantee merchant ships passage through a waterway an adversary decides to close. Pressure on choke points has spread: the Strait of Hormuz, Bab al-Mandab, Suez Canal and Dardanelles, with up to 45 per cent of seaborne trade affected. The US has been unable to force open Hormuz, lacking hulls for convoys and demining capabilities after retiring its Avenger minehunters in 2025. Guided weapons like Iran's Shahed-136 drones make coastal seizure impractical. Eyal predicts militarisation of routes, redirected supply chains and higher costs; Qatari GDP is forecast to contract about 13 per cent in 2026. Iran, he says, is monetising a wasting asset.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/World%20needs%20to%20reckon%20with%20rising%20pressure%20on%20its%20maritime%20choke%20points.pdf"}, {"id": "bt-01", "title": "Alphabet raises US$25 billion from sought-after bond sale", "source": "BT", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Alphabet sold US$25 billion of investment-grade bonds on Aug 6, drawing roughly US$115 billion of peak demand, the year's largest AI-related order book after Oracle's and Amazon's deals. More-generous-than-usual premiums drove demand, lifting Alphabet's issuance since 2025 above US$114 billion, the biggest of any AI-related seller. The Google parent told dealers it plans to issue US debt twice yearly to ease oversupply concerns. Notes spanned 10 tranches maturing in two to 40 years; the longest carried a 1.3-point premium over Treasuries. The reception marks a shift after AI-debt worries sparked a July tech-bond sell-off. Alphabet lifted its capital-spending forecast to as much as US$205 billion, more than double 2025, and recently posted its first negative cash flow quarter since 2004.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/Alphabet%20raises%20US25%20billion%20from%20sought-after%20bond%20sale.pdf"}, {"id": "bt-02", "title": "Asia multi-strategy hedge funds see big monthly drawdowns amid brutal sell-off in AI stocks", "source": "BT", "date": "7 Aug 2026", "tags": ["Finance & Markets"], "summary": "Some large Asian multi-strategy hedge funds suffered their biggest 2026 drawdown in July as an AI-stock sell-off across Japan, South Korea and China erased first-half gains. Concerns over AI spending and the Middle East conflict hammered semiconductor stocks. The largest multi-strategy funds fell between 3 and 9 per cent, faring better than Asia's main stock-pickers, which Goldman Sachs estimated dropped 15.2 per cent, a record monthly decline. Hong Kong's Polymer Capital, the first-half leader, lost 6.9 per cent, trimming year-to-date gains to 11.5 per cent. Singapore's Dymon Asia fell 6.5 per cent and Pinpoint 9 per cent, while Arrowpoint limited its loss to 2.6 per cent after cutting risk. South Korea's Kospi slumped 22 per cent and Japan's Nikkei 225 fell 8 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/Asia%20multi-strategy%20hedge%20funds%20see%20big%20monthly%20drawdowns%20amid%20brutal%20sell-off%20in%20AI%20stocks.pdf"}, {"id": "bt-03", "title": "Australia posts surprise trade surplus as commodity exports gain", "source": "BT", "date": "7 Aug 2026", "tags": ["Trade", "Energy"], "summary": "Australia unexpectedly recorded a A$1.93 billion (US$1.4 billion) trade surplus in June as export values jumped the most in four years while imports fell. Exports rose 9.6 per cent from May, driven by commodities, while imports slid 0.2 per cent. Economists had forecast a A$1.08 billion deficit following May's shortfall. Metal ores and minerals, including iron ore, climbed 6.2 per cent, and coal, coke and briquettes gained 4.6 per cent. Despite the rebound, Australia's trade position is broadly deteriorating as a multi-decade commodity export boom winds down. Imports are also rising on surging data-centre construction, while fuel imports increased due to the war in Iran.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/Australia%20posts%20surprise%20trade%20surplus%20as%20commodity%20exports%20gain.pdf"}, {"id": "bt-04", "title": "China's cheap AI shifts focus to internet stocks - from e-commerce to advertising", "source": "BT", "date": "7 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "China's rapid progress in low-cost AI is strengthening the investment case for its internet giants after years overshadowed by chipmakers. Investors bet falling AI costs shift value toward firms owning applications, from search and e-commerce to advertising. Since a Jun 25 low, the KraneShares China Internet ETF gained over 20 per cent, roughly double the Hang Seng, while the Philadelphia Semiconductor Index fell about 11 per cent. Lotus Asset Management's Hao Hong said cheaper tokens will spur demand and aid hyperscaler margins, citing Alibaba and Tencent gains. Alibaba's Qwen3.8-Max ranks among top coding models; Silicon Data's inference-price index has fallen 36 per cent since May. Goldman prefers cloud and data centres, estimating Alibaba Cloud grew 45 per cent last quarter.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/China's%20cheap%20AI%20shifts%20focus%20to%20internet%20stocks%20-%20from%20e-commerce%20to%20advertising.pdf"}, {"id": "bt-05", "title": "DeepSeek invests US$20.8 million in Unitree's Shanghai IPO", "source": "BT", "date": "7 Aug 2026", "tags": ["Technology & AI"], "summary": "Chinese AI startup DeepSeek invested 140.8 million yuan (US$20.8 million) in robot maker Unitree and agreed to jointly develop AI models for humanoid machines, a stock exchange filing showed. DeepSeek received 933,399 shares, or 2.31 per cent of Unitree's Shanghai IPO strategic placement. Both Hangzhou-based firms will combine DeepSeek's AI-model expertise with Unitree's mechanical engineering, motion control and embodied intelligence. Unitree, also known as Yushu Technology, will favour DeepSeek for model-training services, while DeepSeek will prefer Unitree for robots. The partnership targets a key bottleneck: building a robot \"brain\" that understands surroundings and turns instructions into actions. DeepSeek's strengths lie in language models rather than multimodal vision systems; the Unitree tie-up could supply robots and physical-world data to accelerate that work.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/DeepSeek%20invests%20US20.8%20million%20in%20Unitree's%20Shanghai%20IPO.pdf"}, {"id": "bt-06", "title": "EU's AI Act has a global reach, but leaves European innovation behind", "source": "BT", "date": "7 Aug 2026", "tags": ["Technology & AI", "Politics"], "summary": "The EU's AI Act, in full effect from Aug 2, is the world's most comprehensive and strictest AI regulation, with non-compliance fines up to 35 million euros (US$40.4 million) or 7 per cent of global revenue. Its extraterritorial scope covers any company whose AI systems are used in the EU or affect its citizens, extending the so-called Brussels effect. Thomson Reuters Foundation data show 47 per cent of firms citing the policy are headquartered outside the EU; North American firms make up nearly 40 per cent, with US players like Google, Microsoft, xAI and OpenAI adopting parts of the framework. Yet the writer argues the Act may hamper Europe's own innovation, echoing Mario Draghi's competitiveness warnings, as the bloc lags the US and China in developing and commercialising AI.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/EU's%20AI%20Act%20has%20a%20global%20reach,%20but%20leaves%20European%20innovation%20behind.pdf"}, {"id": "bt-07", "title": "Gold steady as traders assess impact of Hormuz flare-up on rates", "source": "BT", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "Gold traded in a narrow range around US$4,245 an ounce as traders weighed a reported Iranian attack in the Strait of Hormuz on the Fed's rate path. Local media said Iran struck \"hostile targets\" and would seek to bar US and Israeli vessels, while Houthis launched a large-scale attack in Yemen, raising fears of a wider conflict. Trump said the war would end \"pretty soon.\" Bullion was still up nearly 5 per cent on the week after briefly topping US$4,300 on Hormuz-reopening hopes. Renewed tensions revived Fed-hike speculation; traders priced roughly 60 per cent odds of a September hike after reports Chairman Kevin Warsh would raise rates if inflation runs hot. Gold has fallen nearly a fifth since the US-Iran war began.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/Gold%20steady%20as%20traders%20assess%20impact%20of%20Hormuz%20flare-up%20on%20rates.pdf"}, {"id": "bt-08", "title": "Japan's households continue to cut spending despite wage gains", "source": "BT", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Society"], "summary": "Japan's household spending unexpectedly fell for a seventh month, dropping 3.3 per cent in June from a year earlier versus a forecast 0.9 per cent rise, showing persistent inflation weighing on sentiment despite rising real wages. Month-on-month, spending fell 6.4 per cent. Declines were led by food, utilities, transport, communications and apparel; education and home maintenance rose. Real wages have gained every month this year, up 1.6 per cent in June. BOJ Governor Kazuo Ueda flagged upside inflation risks near the 2 per cent target. PM Sanae Takaichi has deployed subsidies and will cut the food sales tax to 1 per cent from 8 per cent in April 2027. Food and beverage firms planned price hikes on 2,566 products in July, up nearly 22 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/Japan's%20households%20continue%20to%20cut%20spending%20despite%20wage%20gains.pdf"}, {"id": "bt-09", "title": "JustCo H1 loss narrows 52% to US$839,000 in first results since IPO", "source": "BT", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Flexible workspace operator JustCo said its first-half net loss narrowed 52 per cent to US$839,000 from US$1.7 million a year earlier, in its first results since debuting on the SGX mainboard on May 22. Excluding one-off costs, it would have posted about US$100,000 net profit. Revenue grew 24 per cent to US$80.8 million, driven by higher revenue per workstation, up 11 per cent to US$468.45 monthly. Free cash flow rose to US$3.2 million and cash reached US$169.4 million including IPO proceeds. The GIC-backed group expanded to 57 centres and 37,350 workstations, with a 21-centre pipeline. It plans co-living venture JustCo Place with Deloitte as anchor tenant, and a 50 per cent payout dividend from FY2027. Shares closed at S$0.63, below the S$0.94 IPO price.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/JustCo%20H1%20loss%20narrows%2052%20to%20US839,000%20in%20first%20results%20since%20IPO.pdf"}, {"id": "bt-10", "title": "Oil settles up US$3 as Iran reviews bill to ban US, Israeli vessels from Hormuz", "source": "BT", "date": "7 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "Oil settled up more than US$3 a barrel on Aug 6 after an Iranian parliament committee began reviewing a bill to ban US, Israeli and other hostile vessels from the Strait of Hormuz and fine violators up to 20 per cent of cargo value. Brent rose US$3.04, or 3.83 per cent, to US$82.49; WTI gained US$2.07 to US$77.29. Before the war, about a fifth of global oil and LNG flowed through the strait. Yemen's Houthis reported missile and drone attacks on Saudi deployments and a tanker off Yanbu. Gulf crude exports stayed about 40 per cent below pre-war levels. Iran warned Gulf states that new US attacks would trigger strikes on energy infrastructure. A Russian refinery in Yaroslavl caught fire after a Ukrainian drone attack.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/Oil%20settles%20up%20US3%20as%20Iran%20reviews%20bill%20to%20ban%20US,%20Israeli%20vessels%20from%20Hormuz.pdf"}, {"id": "bt-11", "title": "OpenAI accounted for likely 70% of Microsoft's AI sales, disclosures show", "source": "BT", "date": "7 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Microsoft generated most of its AI revenue from OpenAI, recording US$24.1 billion in sales from the startup in the year ended June, a filing showed. With CEO Satya Nadella having said Microsoft was on pace for US$37 billion in annual AI revenue as of March, OpenAI likely accounted for about 70 per cent, underscoring Microsoft's dependence on its partner. Under their agreement, OpenAI pays Microsoft for computing power, model-building costs and a revenue share. Microsoft has backed Anthropic and built its own models to reduce reliance. Against total revenue, OpenAI's share looks under 10 per cent. The disclosure, Microsoft's first clear figure, may be tied to OpenAI's IPO plans. Analysts want to know how much comes from services versus investment returns.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/OpenAI%20accounted%20for%20likely%2070%20of%20Microsoft's%20AI%20sales,%20disclosures%20show.pdf"}, {"id": "bt-12", "title": "Over 600 companies likely to be culled in Topix's biggest overhaul: analysts", "source": "BT", "date": "7 Aug 2026", "tags": ["Finance & Markets"], "summary": "Japan's Topix index faces its biggest overhaul, with over 600 companies, more than a third of constituents, likely removed under new eligibility rules, analysts estimate. Firms whose free-float market cap ranks in the bottom 3 per cent in August will be phased out over two years from October, potentially cutting them off from an estimated US$1 trillion in passive funds. The move addresses criticism the benchmark holds too many small, illiquid stocks. Companies above roughly 40 billion yen (US$252 million) should survive. Some firms, like Seika Corp with a 3 billion yen buyback, are announcing shareholder measures to stay in. Larger firms on smaller markets will be added, and annual reviews begin in 2028, allowing removed companies to rejoin.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/Over%20600%20companies%20likely%20to%20be%20culled%20in%20Topix's%20biggest%20overhaul%20analysts.pdf"}, {"id": "bt-13", "title": "SGX has IPO pipeline of around 50 companies in various stages of readiness amid record results", "source": "BT", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Singapore Exchange said its IPO pipeline has grown to about 50 companies in various stages of preparation, as it reported record FY2026 results. Net profit rose 7.8 per cent to S$698.4 million and revenue climbed 13.9 per cent to S$1.5 billion, with gains across all segments; adjusted net profit rose 24.6 per cent to S$759.5 million. About a third of prospective issuers are consumer and healthcare, a third technology and digital infrastructure, and a quarter real estate. CEO Loh Boon Chye said the market is rebuilding confidence and that Day 1 performance is not investors' sole focus. Twenty-one companies listed in FY2026. SGX proposed a final S$0.115 dividend plus a one-off S$0.125, lifting total FY2026 payout to S$0.57.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/SGX%20has%20IPO%20pipeline%20of%20around%2050%20companies%20in%20various%20stages%20of%20readiness%20amid%20record%20results.pdf"}, {"id": "bt-14", "title": "Samsung, SK Hynix shareholders call for bigger payouts from AI cash mountain", "source": "BT", "date": "7 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Samsung Electronics and SK Hynix face growing investor calls for bigger dividends or buybacks after providing scant capital-return detail alongside AI-driven record profits. The two largest memory makers are set to hold a combined US$263 billion in net cash by year-end, more than double Nvidia's estimated US$102 billion. Both target returns equal to half of free cash flow, lagging peers like Apple, TSMC and Micron, which pledged 100 per cent. Janus Henderson's Richard Clode urged SK Hynix to lift returns to at least 80 per cent. SK Hynix and Samsung shares have fallen about 48 and 37 per cent from June highs. Retail platform ACT is pushing Samsung for an extraordinary meeting and a US$32 billion buyback. Analysts tie the issue to the Korea discount.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/Samsung,%20SK%20Hynix%20shareholders%20call%20for%20bigger%20payouts%20from%20AI%20cash%20mountain.pdf"}, {"id": "bt-15", "title": "Sandisk forecasts upbeat quarterly revenue on AI-driven demand", "source": "BT", "date": "7 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Sandisk forecast quarterly revenue above estimates, banking on AI data-centre demand for its memory chips, but shares fell nearly 8 per cent in extended trading after a roughly 470 per cent rally this year. It guided first-quarter revenue of US$10.30 billion to US$10.80 billion, above the US$10.47 billion consensus, and adjusted profit of US$44 to US$46 per share. CEO David Goeckeler said the company shifted to long-term purchase agreements averaging four years, holding eight deals with six customers worth at least US$93.9 billion. Fourth-quarter revenue rose to US$8.97 billion and data-centre revenue more than doubled to US$2.98 billion, capping a strong year since its 2025 split from Western Digital. The board approved an additional US$14 billion buyback.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/Sandisk%20forecasts%20upbeat%20quarterly%20revenue%20on%20AI-driven%20demand.pdf"}, {"id": "bt-16", "title": "Sinopec steps up Russian oil imports to offset Mideast supply cuts, traders and tracker say", "source": "BT", "date": "7 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "China's state-owned Sinopec, the world's biggest refiner, has ramped up purchases of Far East Russian oil to offset Middle East supplies cut by the Iran war, trade sources and ship-tracking data show. Cheaper than rival grades, Russian ESPO crude helped Sinopec keep throughput stable and export surplus fuel at strong margins. It bought 30 to 40 shipments, about 241,000 to 320,000 barrels daily, for July-September delivery, roughly 5 to 6 per cent of its 5.2 million bpd capacity. China's June crude imports plunged 41 per cent year-on-year. Sinopec took no Saudi crude in June and July and just two million barrels in August, far below the 20 million bought monthly in spring. September ESPO was pegged at US$1 to US$2 below Brent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/Sinopec%20steps%20up%20Russian%20oil%20imports%20to%20offset%20Mideast%20supply%20cuts,%20traders%20and%20tracker%20say.pdf"}, {"id": "bt-17", "title": "Trump's Iran dilemma: 'Menu of bad options' leaves the US with no easy exit from war", "source": "BT", "date": "7 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "With Trump's war against Iran in its sixth month, this week's threats and diplomacy underscored his tightening bind over an unpopular conflict he claimed would last weeks. He is caught between an emerging Iran-Oman interim deal that would give Teheran unprecedented control over the Strait of Hormuz, or escalating with fresh airstrikes ahead of November's midterms. A former negotiator called it \"a menu of bad options.\" Reopening the strait is seen as a prerequisite for resuming US-Iran nuclear talks. Analysts say Trump, facing high gasoline prices and low approval, may be forced into the biggest compromises. Officials increasingly accept the conflict may persist through the midterms. Iran has warned Gulf allies that new US strikes would trigger attacks on their energy infrastructure.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/Trump's%20Iran%20dilemma%20'Menu%20of%20bad%20options'%20leaves%20the%20US%20with%20no%20easy%20exit%20from%20war.pdf"}, {"id": "bt-18", "title": "US Fed's Daly says central bank was right to hold rates steady at July policy meeting", "source": "BT", "date": "7 Aug 2026", "tags": ["Finance & Markets"], "summary": "San Francisco Fed President Mary Daly said she was \"completely supportive\" of the Fed's decision last week to hold interest rates steady while it gathers data on inflation running well above its 2 per cent target. Speaking in Tokyo, she said more information is needed before September's meeting to judge whether supply shocks will wane or a longer-lasting inflation problem is forming, and that the Fed should be vigilant but ready to act. The FOMC held its target at 3.5 to 3.75 per cent, with three officials dissenting in favour of hikes. Daly, not currently a voting member, said businesses have limited pricing power and that an end to the Middle East war should ease oil-driven price pressure.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/US%20Fed's%20Daly%20says%20central%20bank%20was%20right%20to%20hold%20rates%20steady%20at%20July%20policy%20meeting.pdf"}, {"id": "bt-19", "title": "US labour market stable; worker productivity accelerates in Q2", "source": "BT", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "US jobless claims rose slightly to 199,000 for the week ended Aug 1, while July layoffs hit a two-year low, signalling a stable labour market. Worker productivity grew a faster-than-expected 1.4 per cent annualised in the second quarter, curbing labour costs, with economists citing early signs AI adoption is lifting output. Contained wage pressures give the Fed room to focus on Middle East inflation fallout, though economists warn a September rate hike remains possible unless inflation eases. Challenger reported planned job cuts fell 27 per cent to 33,429 in July. Unit labour costs rose 1.3 per cent; the labour share hit a record-low 52.9 per cent. Non-farm payrolls, due Friday, were expected up 80,000 with unemployment at 4.2 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/US%20labour%20market%20stable%20worker%20productivity%20accelerates%20in%20Q2.pdf"}, {"id": "bt-20", "title": "Yen struggles to keep intervention gains; US dollar near 6-week low on Iran deal concerns, payroll jitters", "source": "BT", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "The Japanese yen struggled to hold intervention-led gains, trading flat at 157.75 per US dollar after touching 155.20 on Monday, while the dollar index hovered near a six-week low at 99.70. Traders turned cautious over a proposed Iran-Oman deal that could give Teheran control of inbound Strait of Hormuz traffic and ahead of US payroll data. Trump has called a strait-reopening deal imminent, but US officials insist they would never let Iran control the waterway. Brent slipped 0.3 per cent to US$79.25. The euro held at US$1.1548 and sterling at US$1.3456. Fed Governor Lisa Cook said the central bank may need to raise rates over \"too high\" inflation, while Daly backed holding steady. July payrolls were forecast up 80,000.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/Yen%20struggles%20to%20keep%20intervention%20gains,%20US%20dollar%20near%206-week%20low.pdf"}, {"id": "scmp-01", "title": "Argentina renews US$19 billion China currency swap, brushing off Washington's pressure", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Geopolitics", "Trade"], "summary": "Argentina's central bank and the People's Bank of China extended their 130 billion yuan (US$19 billion) currency swap line on Wednesday, a day before expiry, running the deal to 2031 - the longest term since it was first signed in 2009. The renewal ends speculation over whether President Javier Milei, a Trump ally who vowed never to deal with communists, would let it lapse. The line accounts for about 40 per cent of Argentina's gross reserves, down from nearly 60 per cent in 2023, and has funded Chinese imports, propped up the peso and covered IMF payments. Researchers including Harvard's Carmen Reinhart estimate Argentina pays 400 basis points over China's Shibor, twice what Turkey and Mongolia pay. Washington had offered a rival Treasury facility.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/Argentina%20renews%20US19%20billion%20China%20currency%20swap,%20brushing%20off%20Washington's%20pressure.pdf"}, {"id": "scmp-02", "title": "As record heatwave hits Asia, fears of energy crisis and health risks mount", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Environment", "Energy", "Society"], "summary": "A record heatwave gripping East Asia has raised fears of an energy crisis and mounting health risks. Since mid-May, about 2,200 South Koreans have been diagnosed with heat-related illnesses and 19 have died; on July 31 the country hit a record 41.4 degrees Celsius in Yangsan. In Japan, more than 18,000 people were hospitalised for heatstroke between July 20 and 26, and three lions died of suspected heatstroke at a Tokyo zoo. Scientists attribute the heat to human-induced climate change amplified by El Nino, dry soil and urban heat islands. Analysts warn surging air-conditioning demand is straining power grids while Middle East conflict lifts energy prices. The World Meteorological Organization expects above-normal temperatures to persist through October.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/As%20record%20heatwave%20hits%20Asia,%20fears%20of%20energy%20crisis%20and%20health%20risks%20mount.pdf"}, {"id": "scmp-03", "title": "China launches probe into Palo Alto Networks as US trade tensions intensify", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Technology & AI", "Trade", "Geopolitics"], "summary": "The Cyberspace Administration of China launched a cybersecurity review on Thursday into products sold in China by US firm Palo Alto Networks, saying it aimed to safeguard critical information infrastructure and national security. The move came a day after Beijing sanctioned several US companies and tightened drone supply-chain controls, retaliating for Washington's effective ban last week on foreign robotic devices and power inverters. Palo Alto, a leading cybersecurity and cloud provider, operates offices in Beijing, Shanghai and Guangzhou. Analysts said it could face a ban similar to Micron Technology, which failed a 2023 review and was barred from selling to critical-infrastructure operators. Such an outcome would hit its share in finance, energy, telecoms and transport, lawyer Shi Shenchang said.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/China%20launches%20probe%20into%20Palo%20Alto%20Networks%20as%20US%20trade%20tensions%20intensify.pdf"}, {"id": "scmp-04", "title": "China needs a stronger yuan and 'fiscal boost' to drive near-term growth: Goldman Sachs", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Trade"], "summary": "Goldman Sachs economists Kamakshya Trivedi and Hui Shan urged China to let the yuan appreciate gradually and deliver a \"fiscal boost\" to counter weak domestic demand and rising global protectionism, in a Wednesday research note. They estimated the yuan was about 20 per cent undervalued and said gradual appreciation would help restore external balance. China's trade surplus hit a record near US$1.2 trillion last year and widened by US$126 billion in June, even as exports stayed resilient despite the US-Israel war on Iran. Second-quarter GDP grew 4.3 per cent against a 4.5-5 per cent target, with domestic demand deteriorating. The economists said combining expansionary fiscal policy with structural consumption reforms would move the economy \"closer to internal balance\".", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/China%20needs%20a%20stronger%20yuan%20and%20'fiscal%20boost'%20to%20drive%20near-term%20growth%20Goldman%20Sachs.pdf"}, {"id": "scmp-05", "title": "China vs Japan: the battle for the global microphone to reshape post-war identity", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Geopolitics", "Defence", "Southeast Asia"], "summary": "The rivalry between Beijing and Tokyo has expanded into a contest to define each other's international identity, analysts say. Amid an escalating diplomatic crisis, China is intensifying rhetoric against Japan's \"new militarism\", invoking World War II history to win regional sympathy, while Japan rejects the label and casts itself as a peace-loving security defender and victim of coercion. Fudan University's Shen Yi urged Beijing to expand historical research and global communications, including AI-based visuals. Japan retained Southeast Asia's most-trusted major power status at 65.6 per cent in the ISEAS-Yusof Ishak survey, versus China's 39.8 per cent. Analysts noted Asean neutrality but warned Japan's nuclear-option debate conflicts with the region's nuclear-weapon-free zone and could fray that stance.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/China%20vs%20Japan%20the%20battle%20for%20the%20global%20microphone%20to%20reshape%20post-war%20identity.pdf"}, {"id": "scmp-06", "title": "China's MLCC supply chain expanding rapidly amid surge in global AI demand", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "China's upstream supply chain for multilayer ceramic capacitors (MLCCs) - components dubbed \"the rice of electronics\" - is racing to expand capacity as AI-driven demand surges. Shandong Sinocera Functional Materials, a major dielectric powder supplier, told investors it is boosting capacity for AI servers, with new lines already operational; first-half 2026 sales rose nearly 17 per cent to 2.5 billion yuan (US$370 million). Jiangsu Boqian pledged 201.5 million yuan for nickel powder expansion, while Zhejiang Jiemei is adding 580 million square metres of release-film output. Goldman Sachs has called this the \"largest and longest\" cycle in MLCC history. Sinocera shares rose 3.4 per cent Thursday; Jiangsu Boqian gained 3.9 per cent and Zhejiang Jiemei 3.7 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/China's%20MLCC%20supply%20chain%20expanding%20rapidly%20amid%20surge%20in%20global%20AI%20demand.pdf"}, {"id": "scmp-07", "title": "Chinese and Russian warships were seen circling Japan. What could it mean?", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "China and Russia are deepening military cooperation, with a joint patrol circling Japan sending a message to Tokyo and Washington, analysts say. Three Chinese vessels and a Russian corvette left Qingdao on July 13 for a 17-day patrol through the western Pacific, Sea of Okhotsk and Sea of Japan; on Sunday and Monday three Chinese ships passed southwest through the Korea Strait, completing a circumnavigation of Japan. It was the first time the two navies transited the Vries Strait in the disputed Kuril Islands together. Japan's defence ministry called it a serious concern and show of force. Analyst Stephen Nagy said Beijing wanted to pressure PM Takaichi over Taiwan remarks and show the pair can move freely through the first island chain.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/Chinese%20and%20Russian%20warships%20were%20seen%20circling%20Japan.%20What%20could%20it%20mean.pdf"}, {"id": "scmp-08", "title": "Chinese fund managers' pursuit of AI plays backfires as hot tech stocks wobble", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "A shift into technology stocks by China's most seasoned value-investing fund managers has backfired as AI plays unwound globally. Star manager Liu Yanchun's Great Wall Invesco fund fell 28 per cent last month after buying optical-transceiver maker Zhongji Innolight and other tech names while cutting consumer and pharmaceutical holdings. Zhang Kun of E Fund saw his flagship drop 1.2 per cent in July after pivoting to AI, adding SMIC and Dongshan Precision while cutting liquor makers Kweichow Moutai and Wuliangye by at least 47 per cent. Shanghai's Star Market 50 slumped 26 per cent in July, its worst month since 2020, and ChiNext fell 23 per cent. In contrast, CSI 300 consumer stocks rose 12 per cent and pharmaceutical shares rebounded 7.9 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/Chinese%20fund%20managers'%20pursuit%20of%20AI%20plays%20backfires%20as%20hot%20tech%20stocks%20wobble.pdf"}, {"id": "scmp-09", "title": "DeepSeek signals 'significant' price hike amid surge in demand for low-cost AI models", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Chinese AI start-up DeepSeek announced on Thursday a \"significant\" price hike for its API services in the near future, urging users to plan accordingly, amid surging demand for its ultra-cheap new model. The move highlights the challenge of sustaining rock-bottom pricing amid fierce competition. Its DeepSeek-V4-Flash-0731, a 284-billion-parameter lightweight model released a week earlier, was rated the second-strongest open-weight model behind Moonshot's Kimi K3, and costs about 3 US cents per task - roughly 105 times cheaper than Anthropic's Claude Fable 5. Epoch AI said its pricing was an \"order of magnitude cheaper\" than Zhipu's GLM-5.2. It became the fastest-growing model ever by token usage on Ollama, aided by an efficient mixture-of-experts design.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/DeepSeek%20signals%20'significant'%20price%20hike%20amid%20surge%20in%20demand%20for%20low-cost%20AI%20models.pdf"}, {"id": "scmp-10", "title": "Gold's price potential still 'explosive' amid Beijing hoarding, Hong Kong trading push", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "Gold has \"explosive\" upside potential, analysts say, boosting Hong Kong's ambitions as a trading hub as Asian central banks stockpile bullion. Deutsche Bank's Michael Hsueh expects US$4,700 an ounce by year-end, while State Street's Aakash Doshi sees US$5,000 by early 2027, underpinned by Chinese buying. Beijing has added reserves for 20 straight months and wants to link the Shanghai Gold Exchange to Hong Kong; South Korea plans its first gold purchase in 13 years. Hong Kong launched a clearing and settlement system on July 7 and targets 2,000-tonne vault capacity within three years; June gold imports hit 150.48 tonnes. Gold peaked near US$5,420 in January, fell over 25 per cent, then steadied above US$4,000, hitting US$4,300 on Thursday.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/Gold's%20price%20potential%20still%20'explosive'%20amid%20Beijing%20hoarding,%20Hong%20Kong%20trading%20push.pdf"}, {"id": "scmp-11", "title": "Has China's missile force got America's Kadena base in Japan in its sights?", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "A CCTV documentary, Securing Victory, aired Monday showed a satellite image resembling the US Kadena airbase in Okinawa as PLA Rocket Force officers discussed exercises and combat scenarios, marking the PLA's 99th anniversary. Officer Luo Tingrong told personnel that what they practise today could happen tomorrow. Kadena, the largest US airbase in East Asia and closest to Taiwan Strait flashpoints, lies about 600km from Taiwan and within range of Chinese DF-16, DF-21 and hypersonic DF-17 missiles. Analyst Tetsuo Kotani said Kadena had been a known Rocket Force target for decades and the timing was about projecting resolve, not revealing new capability. Hirohito Ogi called the image a signal to deter US intervention in a Taiwan contingency.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/Has%20China's%20missile%20force%20got%20America's%20Kadena%20base%20in%20Japan%20in%20its%20sights.pdf"}, {"id": "scmp-12", "title": "Hong Kong aims to be a global tech hub, but can it hold on to its young talent?", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Technology & AI", "Society"], "summary": "Hong Kong's push to become a global innovation hub faces a talent-retention challenge, critics warn, as a risk-averse culture and scarce early-stage support drive young founders overseas. The story contrasts two 18-year-old tech enthusiasts: Rexan Wong, who built AI app Text Behind Image with 500,000 users and is decamping to San Francisco for better incubator support, and Ken Mochizuki, who plans to stay. AI and research transformation feature among priorities in the city's first five-year plan, due later this year. Wong cited a lack of talent density, support and access to frontier tools like Anthropic and OpenAI models, some unavailable locally. Silicon Valley ranks as the world's top start-up ecosystem, well ahead of Hong Kong.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/Hong%20Kong%20aims%20to%20be%20a%20global%20tech%20hub,%20but%20can%20it%20hold%20on%20to%20its%20young%20talent.pdf"}, {"id": "scmp-13", "title": "How US became trapped in 'dreadful situation' of its own making over Iran war", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "The US faces a historic \"strategic defeat\" five months after launching the Iran war at Israel's behest, Middle East observers say. Iran is unlikely to relinquish its grip on the Strait of Hormuz - its greatest economic leverage - and is prepared to absorb military punishment while its Axis of Resistance allies escalate attacks on energy infrastructure across the Red Sea, Suez and eastern Mediterranean. Gulf State Analytics' Giorgio Cafiero said Washington is in a difficult predicament of its own making, choosing between an unwinnable war or a costly settlement. Arab Gulf States Institute's Hussein Ibish said Trump had manoeuvred into a \"dreadful situation\" pointing to two bad outcomes: acquiescing to Iranian power or waging a years-long air war.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/How%20US%20became%20trapped%20in%20'dreadful%20situation'%20of%20its%20own%20making%20over%20Iran%20war.pdf"}, {"id": "scmp-14", "title": "Iran seeks to bar US ships as Hormuz deal with Oman advances", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Geopolitics", "Energy", "Defence"], "summary": "Iran will seek to bar US and Israeli ships from the Strait of Hormuz and demand compensation from hostile countries under a proposed Iran-Oman deal to manage the waterway, local media reported. The text, now under Iranian parliamentary review, also proposes banning Israel-related cargo and a fee structure covering insurance and environmental costs. The agreement is central to hopes of reopening Hormuz and resuming energy flows throttled since the US and Israel attacked Iran in February. Former US official Thomas Warrick said the terms would not sit well in Washington. Iran also said naval forces struck \"hostile targets\" near the strait's entrance; Brent crude rose above US$82. Trump said negotiations were going \"fine\" but declined to confirm a deal.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/Iran%20seeks%20to%20bar%20US%20ships%20as%20Hormuz%20deal%20with%20Oman%20advances.pdf"}, {"id": "scmp-15", "title": "Japan's Takaichi stops short of clear pledge to maintain non-nuclear principles", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Politics", "Defence"], "summary": "Japanese Prime Minister Sanae Takaichi on Thursday stopped short of explicitly pledging to maintain the country's three non-nuclear principles, saying only that the government \"is upholding\" the policy, as Japan marked the 81st anniversary of the Hiroshima bombing. The hawkish leader, attending as premier for the first time, said it was \"premature\" to comment while her government revises key national security documents by year-end, reportedly reconsidering the principles of not possessing, producing or allowing nuclear weapons. Opposition leaders criticised her lack of firm commitment. Atomic-bomb survivors, whom she met earlier, condemned talk of a US nuclear-sharing arrangement and urged Japan to join the nuclear weapons prohibition treaty, which Tokyo has not signed given its reliance on US deterrence.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/Japan's%20Takaichi%20stops%20short%20of%20clear%20pledge%20to%20maintain%20non-nuclear%20principles.pdf"}, {"id": "scmp-16", "title": "North Korea fires 'unidentified projectile': South Korea", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "North Korea fired a short-range ballistic missile over the Sea of Japan on Thursday from the Wonsan area around 5pm, South Korea's Joint Chiefs of Staff said, a day after Pyongyang lambasted Japan's military build-up. Kim Yo-jong, sister of leader Kim Jong-un, warned Pyongyang would set up \"additional military options\" in response to Japan's transformation, after Defence Minister Shinjiro Koizumi urged boosting Japan's military. Seoul strengthened surveillance and shared information with the US and Japan; annual Ulchi Freedom Shield drills are due later this month. Analysts said the launch may have tested weapons before Kim's expected Russia visit. Tokyo raised 2025 military spending 9.7 per cent to US$62.2 billion, its highest GDP share since 1958.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/North%20Korea%20fires%20'unidentified%20projectile'%20South%20Korea.pdf"}, {"id": "scmp-17", "title": "Swire earnings show Hong Kong's prime commercial districts outpacing others in recovery", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Finance & Markets"], "summary": "Swire Properties' first-half results underscored a widening divide in Hong Kong's office recovery, with prime districts outpacing others. Pacific Place beside Central was 98 per cent occupied with positive spot rents as financial firms upgraded, while Taikoo Place in Quarry Bay saw competitive leasing amid new supply; Two Taikoo Place was 80 per cent leased. CEO Tim Blackburn cited a \"flight-to-quality\" trend. Swire's underlying profit rose 11 per cent to HK$4.9 billion (US$624.7 million) and revenue climbed 8 per cent to HK$9.41 billion, aided by luxury house sales. Central landlord Hongkong Land posted an 11 per cent underlying profit rise, while Wharf REIC, exposed to weaker districts, reported a net loss after a HK$3.55 billion property valuation deficit.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/Swire%20earnings%20show%20Hong%20Kong's%20prime%20commercial%20districts%20outpacing%20others%20in%20recovery.pdf"}, {"id": "scmp-18", "title": "US efforts to prop up the yen risk doing more harm than good", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "US efforts to support the yen risk backfiring, as reversing the currency's decline ultimately depends on Japan lifting real interest rates out of negative territory without triggering panic. The yen has fallen 36 per cent against the dollar since early 2022, hitting a post-1986 low past 163 on July 23. On July 31, Japan's finance ministry and the US Treasury jointly intervened - the first coordinated action since 1998 - strengthening the yen to 157. Notably the Treasury sold euros rather than dollars, reflecting wariness about pressuring the greenback. Treasury Secretary Scott Bessent wants Japan to use a Fed repo facility to avoid selling Treasuries. Analysts warn PM Takaichi's reflationary agenda clashes with the Bank of Japan's credibility, leaving intervention \"doomed to failure\".", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/US%20efforts%20to%20prop%20up%20the%20yen%20risk%20doing%20more%20harm%20than%20good.pdf"}, {"id": "scmp-19", "title": "Unrelenting AI demand spawns new plant for Chinese PCB maker Victory Giant", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Chinese printed circuit board maker Victory Giant Technology will invest at least 3 billion yuan (US$444 million) in a new Huizhou plant for \"AI high-end electronic circuit smart manufacturing\", underscoring booming demand across China's AI hardware sector. The Nvidia supplier, which listed in Hong Kong in April, acquired a 100,000-square-metre plot and is negotiating orders with major US firms as GPU and ASIC demand surges; its supply for Nvidia's next-generation Kyber rack is \"progressing smoothly\". Net profit soared 273.5 per cent in 2025. It entered Nvidia's Hopper supply chain in 2023 and became a tier-one supplier in 2024. Nomura expects Rubin GPU shipments to ramp in the second half. Shares rose 4.4 per cent to HK$231 on Thursday.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/Unrelenting%20AI%20demand%20spawns%20new%20plant%20for%20Chinese%20PCB%20maker%20Victory%20Giant.pdf"}, {"id": "scmp-20", "title": "Why Russia's ballistic missiles are breaking through in Ukraine", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Russia's ballistic missiles are increasingly breaking through Ukraine's air defences because interceptors are scarce, warning times are seconds, and only the US-made Patriot system can stop them, experts say. Unlike cruise missiles, ballistic weapons like the Iskander-M dive steeply at several times the speed of sound, leaving little time to intercept. A recent barrage on Kyiv targeting a brewery, warehouse and mail-sorting office killed at least 17. Ukraine has too few Patriot batteries to shield every city, and Russia mixes ballistic missiles with cruise missiles, drones and decoys. The interceptor shortage worsened as the US-Israeli war with Iran consumed Patriot and THAAD stocks; AP estimated US Patriot inventory fell at least 65 per cent. Lockheed Martin is working towards 2,000 annual interceptors.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/Why%20Russia's%20ballistic%20missiles%20are%20breaking%20through%20in%20Ukraine.pdf"}, {"id": "scmp-21", "title": "Will latest trade 'speed bump' slow China-US ties, or even stop Xi-Trump summit?", "source": "SCMP", "date": "7 Aug 2026", "tags": ["Trade", "Geopolitics"], "summary": "Beijing and Washington's latest tit-for-tat measures are little more than a \"speed bump\" toward a potential Xi-Trump summit, analysts say. China's commerce ministry sanctioned seven US entities, tightened drone export controls and launched a security probe into imported printing equipment on Wednesday, retaliating for Washington adding 43 Chinese firms to its Uygur Forced Labour Prevention Act list and banning foreign robotic devices and power inverters. Eurasia Group's Dominic Chiu said the moves were \"calibrated to impose costs without breaking the truce\" and would not derail Xi's planned September 24 White House visit. Analysts said the summit is at risk only if Washington takes aggressive steps like restricting Chinese AI models or cloud-chip access, or acts on Taiwan.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20SCMP/Will%20latest%20trade%20'speed%20bump'%20slow%20China-US%20ties,%20or%20even%20stop%20Xi-Trump%20summit.pdf"}]}, "2026-08-11": {"date": "2026-08-11", "dayOfWeek": "Tuesday", "totalArticles": 89, "sourceCounts": {"WSJ": 21, "ST": 22, "BT": 19, "SCMP": 27}, "executiveDigest": "Gulf states accepted 'a new normal' in the Strait of Hormuz - Iran is in control - as the Oman deal collapsed, both sides demanded compensation and Trump pivoted to an economic blockade, pushing oil up 5% and gold to nearly US$4,400. Singapore stood out on the upside: it raised its 2026 growth forecast to 4.5-5.5% after Q2 GDP was revised up to 5.9% and non-oil exports jumped 27.4%. The AI build-out went megascale - Nvidia partnered Wall Street to raise US$640 billion for infrastructure and Anthropic teamed with Macquarie and GIC - even as research flagged the AI-memory price boom may be near its peak.", "briefingCards": [{"title": "Lead story - Iran cements control of Hormuz", "body": "The strait's diplomacy failed and a hard reality set in: WSJ reported 'Gulf states accept a new normal in Hormuz - Iran is in control', and cast the waterway as Tehran's 'final point of leverage'. With the Oman deal gone, SCMP said Trump 'demands Iran pay compensation as hopes fade', BT reported both sides now demand compensation as 'Hormuz hopes fade', and WSJ described Trump shifting 'to economic pressure, again' via a blockade after Iran refused his demands. Markets felt it: oil climbed 5% and Asian stocks rose 'amid Gulf confusion', while an Oman tanker spill spread across 400 sq km, Libya's NOC warned of force majeure, and Trump reportedly 'flew secretly from Turkey due to an Iranian threat'."}, {"title": "Markets & finance", "body": "Inflation and rates framed the week: WSJ said 'two inflation reports will shape the Fed's September decision', gold touched US$4,400 as traders eyed the data, and the US dollar steadied after a weak payrolls print while the yen fell - prompting WSJ to ask 'will the yen need another intervention soon?'. The BOJ flagged upside price risks and possibly faster hikes, and Trump 'downplayed talks with Warsh' amid Fed-independence doubts. Capital-raising was frenetic: Nvidia partnered Wall Street giants to raise US$640 billion for AI infrastructure, Intel offered US$15 billion of stock, Anthropic moved to shore up confidence before a blockbuster IPO, and LSE's deputy CEO said London 'needs capital to revive' its public markets."}, {"title": "Asia realignment", "body": "The US recalibrated its Asia posture - the Pentagon said it is 'digging in' but wants 'partners, not dependency' - as ASEAN aimed to become the world's fourth-largest economy by 2030 and BT argued 'ASEAN matters more than ever to the UK and Singapore'. Trade friction festered: China moved to join Brazil's WTO fight over Trump's forced-labour tariffs, hit US and Mexican pecans with anti-dumping curbs, and a 'wave of US tariff refunds' flowed back to Chinese firms. Security signals sharpened around Taiwan (a drone 'hellscape', a first-ever mobile-network throttling drill, and WSJ's 'will Taiwan fight China?'), while the UK found a component in its naval drones had 'sent signals to China'."}, {"title": "Energy & climate", "body": "Oil jumped 5% as the Hormuz standoff hardened and both sides demanded compensation; the UAE's Adnoc Gas unveiled an US$8 billion expansion, US natural-gas futures rebounded on warmer weather, and an Oman tanker spill spread across 400 sq km. Longer-term supply plays advanced: 'the race for critical minerals is clearing the path for deep-sea mining', the US pledged US$2 billion for battery and materials producers, and SCMP noted China 'is building nuclear reactors faster than the West'. Climate strain persisted - Europe's fifth heatwave threatened rivers, power and crops - and the UK put up nearly £130 million for zero-emission vehicle tech."}, {"title": "Technology & AI", "body": "The build-out went megascale - Nvidia partnered Wall Street to raise US$640 billion for AI infrastructure, and Anthropic formed an AI-data-centre venture with Macquarie and GIC - even as SCMP research warned 'the AI-memory price boom may not last much longer' and enterprise AI costs hit a 2026 low on Chinese open-source price wars. Meta pushed open weights: Zuckerberg's 'AI manifesto', a new model, and a scaled-down version to run at home, though it lost a bid to pause a landmark state-AGs trial and a US court cleared social-media addiction suits. Chipmakers moved too: Intel raised US$15 billion, Microsoft plans a next-gen AI chip in September, and Sony and TSMC will invest US$6.4 billion in a Japanese sensor plant."}, {"title": "Singapore & SEA focus", "body": "Singapore delivered the day's standout upgrade: it raised its 2026 growth forecast to 4.5-5.5% after Q2 GDP was revised up to 5.9%, and lifted its key export forecast following an AI-powered 27.4% non-oil export jump in Q2. The AI-capital theme ran local - GIC joined Anthropic and Macquarie on an AI-data-centre venture, though BT noted the city's sovereign funds are 'betting big on AI' even as the central bank stays cautious, and Seatrium gave its AI projects three months to prove out to avoid 'a graveyard of pilots'. Elsewhere, Orchard Road's corporate appeal is rising, BYD's disruption of the local car market is 'turning on itself', and Indonesia's Prabowo tapped Destry Damayanti to steady Bank Indonesia."}], "keyMetrics": [{"value": "89", "label": "Articles curated today", "sub": "WSJ 21 · ST 22 · BT 19 · SCMP 27"}, {"value": "Iran in control", "label": "Hormuz 'new normal'", "sub": "Deal fails; Trump blockades"}, {"value": "+5% / US$4,400", "label": "Oil jumps, gold near record", "sub": "Compensation standoff"}, {"value": "4.5-5.5%", "label": "SG 2026 growth upgrade", "sub": "Q2 revised to 5.9%; NODX +27.4%"}, {"value": "US$640b", "label": "Nvidia + Wall Street AI raise", "sub": "Anthropic, Macquarie, GIC venture"}, {"value": "2026 low", "label": "Enterprise AI costs", "sub": "Memory price boom may be peaking"}], "articles": [{"id": "wsj-01", "title": "A Pause on the Gaza Peace Plan?", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "WSJ Opinion's \"Potomac Watch\" podcast discusses Netanyahu's rejection of the next steps in Trump's Gaza plan. Elliot Kaufman notes that 10 months after the October 2025 deal, no Hamas weapon has been surrendered, and the new Board of Peace roadmap would decommission arms into storage rather than demilitarize Gaza. Israel wasn't formally a party to the unsigned mediator-Hamas agreement, yet has halted strikes for seven days. The panel also covers Iran's insistence on Hormuz tolls and Putin's testing of NATO: an explosives-laden drone found near a Ukrainian cargo plane at a German airport, 144 suspicious European drone incidents, and Ukraine's urgent need for Patriot air defenses.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/A%20Pause%20on%20the%20Gaza%20Peace%20Plan.pdf"}, {"id": "wsj-02", "title": "Anthropic Tries to Shore Up Investor Confidence Ahead of Blockbuster IPO", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Anthropic is meeting potential investors to shore up confidence before what could be the largest IPO ever, valuing the AI firm at $965 billion. Investors pressed executives on cheaper Chinese AI systems, tensions with the Trump administration, and data-center backlash. Executives played down Chinese competition, saying Anthropic stays hyperfocused on cutting-edge models; CEO Dario Amodei argues rivals' capabilities trail by months. Propelled by its Claude Code tool, Anthropic reported run-rate revenue topping $47 billion in May and has struck computing deals with SpaceX and Google. It targets a September or early-October debut, ahead of rival OpenAI, and told some investors it will push into healthcare and biology AI. SpaceX earlier surpassed $2 trillion after its IPO.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/Anthropic%20Tries%20to%20Shore%20Up%20Investor%20Confidence%20Ahead%20of%20Blockbuster%20IPO.pdf"}, {"id": "wsj-03", "title": "Barrick Mining Settles Newmont Nevada Dispute for $1.95 Billion", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Finance & Markets", "Energy"], "summary": "Barrick Mining settled a long-running dispute with rival Newmont over their Nevada Gold Mines joint venture, securing a $1.95 billion cash payout. The deal resolves governance disputes dating to the 2019 JV, formed after Barrick dropped an $18 billion hostile bid for Newmont, and clears the way for Barrick to IPO its North American gold assets, holding nearly 100 million ounces. The planned listing, anchored by Nevada Gold Mines plus Pueblo Viejo and the Fourmile discovery, would primary-list in New York with a Toronto secondary. Barrick shares fell in premarket trading to $40.85. Second-quarter revenue rose to $5.29 billion and net income to $1.22 billion, or 73 cents a share, on soaring gold and copper prices.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/Barrick%20Mining%20Settles%20Newmont%20Nevada%20Dispute%20for%201.95%20Billion.pdf"}, {"id": "wsj-04", "title": "Data-Center Backlash Leads to New Land Rush in Texas Oil Patch", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Technology & AI", "Energy"], "summary": "Permian Basin landowners including Texas Pacific Land, LandBridge and EagleRock are pivoting from oil-and-gas royalties to leasing land, water and materials to data centers. They are betting AI developers facing community pushback elsewhere will favor the Permian's abundant land, cheap energy and light regulation. The three firms sit on 1.4 million acres. Chevron signed a 20-year deal to power a Microsoft data center; Poolside and CoreWeave plan a West Texas complex. Texas Pacific invested $50 million in Eric Schmidt-cofounded Bolt and sold land to Chevron for $43 million. LandBridge is working to host campuses, saying a 1-gigawatt site could yield tens of millions in annual free cash flow. Their stocks trade at roughly 37 to 39 times projected earnings.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/Data-Center%20Backlash%20Leads%20to%20New%20Land%20Rush%20in%20Texas%20Oil%20Patch.pdf"}, {"id": "wsj-05", "title": "Five Things to Know About Zuckerberg's AI Manifesto", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Technology & AI", "Society"], "summary": "Meta CEO Mark Zuckerberg issued a 6,500-word essay on the AI race and how Washington should regulate it. Five takeaways: Meta will resume releasing open-weight models and defend distillation, arguing \"you can learn from anything you can observe.\" It will launch a $1 billion \"Future Is For Everyone Fund\" for data-center communities, citing $50,000 teacher bonuses near its Hyperion campus in Richland Parish, Louisiana. Zuckerberg pushes back on the Trump administration's voluntary 30-day model-review order, urging proactive collaboration and sharing of intermediate training checkpoints. He is adopting a board-level safety governance structure and calls for an industrywide version. He also backs \"personal superintelligence,\" where users set the system's values, plus a fully private agent mode.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/Five%20Things%20to%20Know%20About%20Zuckerberg's%20AI%20Manifesto.pdf"}, {"id": "wsj-06", "title": "Gulf States Accept a New Normal in Hormuz: Iran Is in Control", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "Persian Gulf energy producers are concluding Iran's control over the Strait of Hormuz may become permanent, but fear returning to war is worse. Gulf states dislike a proposed deal formalizing Iranian oversight of inbound ships, yet see it as preferable to more U.S.-Iran fighting. Crude exports through Hormuz fell to about 2.2 million barrels a day, down from 8.5 million a month earlier, per Kpler. The U.A.E. said four ships were hit last week; Adnoc reported 16 vessels struck since the war began. Between Feb. 28 and July 30, Iran and allied militias conducted at least 172 attacks on Gulf infrastructure. Brent traded near $87. One analyst said the Gulf \"can no longer rely upon it for transport or trade.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/Gulf%20States%20Accept%20a%20New%20Normal%20in%20Hormuz%20Iran%20Is%20in%20Control.pdf"}, {"id": "wsj-07", "title": "Inside Europe's Shift to Draft Women for War", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Defence", "Society"], "summary": "A WSJ video report examines how the Danish military, spurred by the war in Ukraine and growing security pressures in the Arctic, has extended conscription to 11 months from four. Denmark also recently expanded mandatory conscription to include women for the first time, part of a broader European rethink of national defense as the continent confronts a more aggressive Russia. NATO allies are seeking inspiration from Denmark's gender-equal program as they weigh how to expand their own forces. WSJ journalists joined Danish recruits during training to document the demands of the lengthened service and the integration of women into compulsory military duty, illustrating how the region is reshaping who is called to fight.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/Inside%20Europe's%20Shift%20to%20Draft%20Women%20for%20War.pdf"}, {"id": "wsj-09", "title": "Israel Rejects Next Phase of Trump's Gaza Peace Plan", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "Israeli Prime Minister Benjamin Netanyahu rejected the next phase of Trump's Gaza peace plan, a rare public break with the U.S. leader who weeks earlier hailed \"a historic agreement\" to disarm Hamas. The 15-point document pairs Hamas disarmament with phased Israeli withdrawal, an international stabilization force, and a Palestinian technocratic committee. Netanyahu said the IDF won't withdraw until Hamas surrenders all weapons. The move risks angering Trump amid the Iran war and could rob him of a signature achievement. Netanyahu faces fall elections and hard-right coalition objections. Board of Peace representative Nickolay Mladenov urged Israel to give the process a chance. Israel hasn't struck Gaza in six days; over 1,200 Palestinians have died since the October 2025 ceasefire.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/Israel%20Rejects%20Next%20Phase%20of%20Trump's%20Gaza%20Peace%20Plan.pdf"}, {"id": "wsj-10", "title": "London Needs Capital to Revive its Struggling Public Markets, LSE's Deputy CEO Says", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Finance & Markets"], "summary": "LSE deputy chief executive Charlie Walker said better access to capital is key to reviving London's struggling public markets, calling capital \"the petrol\" the \"mechanically sound car\" now needs. Major U.K. companies including Arm, Flutter and Wise have shifted primary listings to New York; AstraZeneca is reportedly weighing a U.S. merger. Only seven companies listed in London this year versus 15 delistings. The LSE and regulators have eased rules, cut costs and introduced 24-hour trading for exchange-traded products. Walker said regulation rarely deters companies now; the deeper problem is shallow liquidity, requiring a cultural shift such as tax cuts on U.K. stock gains or channeling personal savings into domestic equities. He warned the consequences of failure are \"existential.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/London%20Needs%20Capital%20to%20Revive%20its%20Struggling%20Public%20Markets,%20LSE's%20Deputy%20CEO%20Says.pdf"}, {"id": "wsj-11", "title": "South Korea's Hanwha Makes $1 Billion Push Into U.S. Naval Shipbuilding", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Defence", "Trade"], "summary": "South Korean conglomerate Hanwha made a nonbinding offer of more than $1 billion, valued between $1.05 billion and $1.2 billion, to buy Austal USA, a builder of ships and submarine parts for the U.S. Navy. The deal would give Hanwha Austal's Mobile, Alabama shipyard and access to sensitive naval programs, including submarine modules supplied to General Dynamics Electric Boat for Virginia- and Columbia-class boats. Austal USA employs about 3,500 workers plus San Diego repair facilities. Hanwha is expanding U.S. shipbuilding as Trump seeks to revitalize the domestic industry; it bought Philly Shipyard under two years ago and pledged billions to modernize it. Hanwha Defense USA is also planning an Arkansas munitions and propellant factory.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/South%20Korea's%20Hanwha%20Makes%201%20Billion%20Push%20Into%20U.S.%20Naval%20Shipbuilding.pdf"}, {"id": "wsj-12", "title": "Iran Uses the Strait of Hormuz as Its Final Point of Leverage", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Geopolitics", "Energy", "Politics"], "summary": "The WSJ Politics newsletter, by Damian Paletta, argues Iran is using the Strait of Hormuz as its final point of leverage after five months of U.S. and Israeli strikes destroyed much of its military and killed top leaders. Treasury Secretary Scott Bessent said Tuesday a deal to reopen the strait could be announced; none came. On Saturday, Iranian security official Mohammad Bagher Zolghadr set conditions: permanently ending the war, lifting the naval blockade, withdrawing forces, ending sanctions, freeing frozen assets and paying reparations. Former Defense Secretary Mark Esper said Iran believes it holds \"the upper hand.\" Trump must decide whether to relaunch strikes, wait, or negotiate. The letter also flags GOP economic worries and Netanyahu's Gaza break.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20WSJ/WSJ%20Politics%20Newsletter%20-%20Iran%20uses%20Hormuz%20as%20leverage.pdf"}, {"id": "wsj-13", "title": "Trump Shifts to Economic Pressure, Again, As Iran Won't Meet His Demands", "source": "WSJ", "date": "11 Aug 2026", "tags": ["Geopolitics", "Politics", "Energy"], "summary": "Trump has settled on economic pressure over renewed war or diplomacy in the Iran conflict, U.S. officials said, giving sanctions and a naval blockade of Iranian ports more time. Aides showed him data on sanctions' damage; officials say Tehran fears Treasury Secretary Bessent more than Defense Secretary Hegseth. \"Iran is broke, totally broke,\" Trump said. Iran demanded reparations to reopen Hormuz; Trump countered Iran should compensate the U.S. Bessent said Hormuz would become \"irrelevant\" within
