ps://www.straitstimes.com/world/europe/zelenskiy-visits-britain-as-burnham-pledges-fresh-support-for-ukraine"}, {"id": "bt-14oct-01", "title": "AI models may soon self-replicate without access to data centres, Anthropic warns", "source": "BT", "date": "14 Oct 2026", "tags": ["Technology & AI"], "summary": "Anthropic said on Oct 13 its experiments suggest small AI models may be months away from being able to self-replicate on poorly secured commercial internet-of-things devices such as smart ovens and off-brand Android TV boxes. Models under 30 billion parameters could complete the many individual steps needed but struggled with the full sequence; in simplified tests with some security steps removed, GLM-5.2 and stronger models achieved end-to-end replication. Anthropic warned such replicators would be hard to shut down, with no central switch-off point, and could work out unfamiliar devices on their own. If small models keep improving at their historical rate they could replicate autonomously by end-2026, it said, urging stronger systems to limit their spread.", "url": "https://www.businesstimes.com.sg/companies-markets/telcos-media-tech/ai-models-may-soon-self-replicate-without-access-data-centres-anthropic-warns"}, {"id": "bt-14oct-02", "title": "Apple unveils new smart home products, showcasing updated Siri AI", "source": "BT", "date": "14 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Apple on Oct 13 unveiled a round of smart home products led by HomeView, a wall- or table-mounted iPad-like device with a 7-inch screen and face recognition that showcases its AI-upgraded Siri, priced from US$299 and shipping next month. HomeView costs more than Amazon's Echo Show 8 at US$199.99 and Google's Nest Hub at US$99.99, while the new Apple TV 4K, also US$299, is more than double its predecessor's price. Apple also updated HomePod and introduced doorbells, cameras and thermostats made by LG and Schneider Electric. HomeView will not be sold in the EU because Siri AI is unavailable there under EU regulations; analysts said interoperability with third-party gadgets and Siri's limited usefulness remain key hurdles.", "url": "https://www.businesstimes.com.sg/companies-markets/telcos-media-tech/apple-unveils-new-smart-home-products-showcasing-updated-siri-ai"}, {"id": "bt-14oct-03", "title": "Australia central bank saw upside risks to inflation lingering after September rate hike", "source": "BT", "date": "14 Oct 2026", "tags": ["Finance & Markets"], "summary": "Minutes of the Reserve Bank of Australia's Sep 28-29 meeting, released on Oct 13, show the board only \"briefly\" considered holding before unanimously hiking to 4.6%, citing stronger-than-thought demand and global cost pressures as oil surged amid the Middle East conflict. The nine-member board judged financial conditions only modestly restrictive and said it would raise the cash rate further if required, leaving the door open to a fifth hike this year. Arguments for holding included falling house prices and the risk that the conflict hits demand. Markets price a 30% chance of a rise to 4.85% at the Nov 3-4 meeting, 50% for December, and a move by May 2027 fully.", "url": "https://www.businesstimes.com.sg/companies-markets/banking-finance/australia-central-bank-saw-upside-risks-inflation-lingering-after-september-rate-hike"}, {"id": "bt-14oct-04", "title": "CGSI upgrades DBS to ‘add’, raises target price to S$79.50", "source": "BT", "date": "14 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "CGS International upgraded DBS to add from hold and raised its target price to S$79.50 from S$77.10, citing a best-in-class 20% return on equity and a projected FY2027 dividend yield of 4.8%, above the sector's 4.3%. The target implies 8.4% upside from Friday's close of S$73.36; the shares closed up 0.7% at S$74.47 on Oct 13. CGSI expects Q3 net profit of S$2.86 billion, down 3.2% year on year on high base effects, with net interest income falling 2.4% to S$3.49 billion and NIM narrowing to 1.86%, while wealth management fees rise 7.4% to S$855 million. Catalysts include upbeat FY2027 guidance and a Sora rebound; CGSI flagged DBS's LSEG ESG score slipping to C+ in 2025 and a S$1.3 billion 1MDB-linked lawsuit filed in September 2026.", "url": "https://www.businesstimes.com.sg/companies-markets/banking-finance/cgsi-upgrades-dbs-add-raises-target-price-s79-50"}, {"id": "bt-14oct-05", "title": "Citi profit jumps 40% with higher investment banking, services and wealth revenue", "source": "BT", "date": "14 Oct 2026", "tags": ["Finance & Markets"], "summary": "Citigroup's third-quarter profit rose 40% year on year to US$5.25 billion, or US$2.85 a share, from US$3.8 billion, helped by investment banking, services and wealth management, though net income was 10% below the second quarter. Investment banking revenue rose 9% to US$1.35 billion but fell 13% quarter on quarter as underwriting slowed amid multi-decade-high Treasury yields; trading revenue rose 6% to US$6.11 billion. Services revenue grew 15% and profit 27%, while card profit fell 8% on reward costs and provisions, with US consumer card loss provisions at US$1.9 billion. ROTCE was 11.5%, and CEO Jane Fraser said Citi expects to exceed its 11% target for the year; shares fell about 1.4% premarket.", "url": "https://www.businesstimes.com.sg/companies-markets/banking-finance/citi-profit-jumps-40-higher-investment-banking-services-and-wealth-revenue"}, {"id": "bt-14oct-06", "title": "City Plaza owners in private talks after close of S$970 million en bloc tender", "source": "BT", "date": "14 Oct 2026", "tags": ["Southeast Asia", "Finance & Markets"], "summary": "City Plaza's owners have entered a 10-week private treaty period after the S$970 million en bloc tender for the freehold Geylang Road development closed on Oct 13 with no formal bids, though expressions of interest were received and talks are ongoing, marketing agent Huttons Asia said. It is the third en bloc attempt: a 2018 try at S$1.05 billion won 53% owner support and a 2021 bid at S$970 million won 79.3%, both short of the 80% threshold. The 13,146 sq m site, zoned commercial with a plot ratio of three under Master Plan 2025, could be redeveloped into a residential-led mixed-use project, subject to approvals. Built in the 1970s by City Developments, it has 450 units near Paya Lebar MRT.", "url": "https://www.businesstimes.com.sg/property/city-plaza-owners-private-talks-after-close-s970-million-en-bloc-tender"}, {"id": "bt-14oct-07", "title": "Cracks grow across the AI trade as memory-chip stocks tumble", "source": "BT", "date": "14 Oct 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "A deepening chip-stock sell-off is pressuring the global AI trade, with South Korea's Kospi plunging 5.5% on Oct 13 as Samsung Electronics fell about 7% and SK Hynix about 10%, and the Philadelphia Semiconductor index down more than 7% from this month's high. Triggers included China's CXMT declaring a chip-technology breakthrough, stoking fears of extra capacity and a price war, and Broadcom CEO Hock Tan likening some AI investing to gambling. The Kospi is now a third below its June record, while JPMorgan and Goldman Sachs have taken the rare step of limiting their exposure to a loan for Volta Infrastructure Holdings and Firmus Grid's IPO collapsed. Earnings from ASML and TSMC this week and US inflation data on Oct 14 are the next tests.", "url": "https://www.businesstimes.com.sg/companies-markets/telcos-media-tech/cracks-grow-across-ai-trade-memory-chip-stocks-tumble"}, {"id": "bt-14oct-08", "title": "DayOne’s Johor data centre project gets RM15 billion boost in financing from seven lenders", "source": "BT", "date": "14 Oct 2026", "tags": ["Southeast Asia", "Technology & AI", "Finance & Markets"], "summary": "Seven lenders — CIMB, Credit Agricole CIB, DBS, Maybank, OCBC, Standard Chartered and UOB — have arranged an expanded RM15 billion (US$3.7 billion) multi-currency financing for Singapore-headquartered DayOne's data centre platform in Johor, Malaysia. The new tranche comprises a US$2.4 billion offshore term loan and a RM5.5 billion Murabahah facility, lifting the platform to RM30 billion with the RM15 billion raised in 2025, the lenders said on Oct 13. Citing Boston Consulting Group data, the article says Malaysia's data centre capacity is projected to grow at nearly 39% a year from 2023 to 4.2-6.1 gigawatts by 2030. DayOne filed on Oct 6 for a Nasdaq IPO to raise up to US$5 billion at a potential US$20 billion valuation.", "url": "https://www.businesstimes.com.sg/international/asean/dayones-johor-data-centre-project-gets-rm15-billion-boost-financing-seven-lenders"}, {"id": "bt-14oct-09", "title": "Development finance needs more than one currency", "source": "BT", "date": "14 Oct 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "In a Project Syndicate commentary carried by BT, former World Bank chief economist Justin Yifu Lin and Boston University's Yan Wang argue developing countries should diversify development borrowing beyond the US dollar, with the renminbi increasingly attractive. They say low Chinese rates and a stable exchange rate have, in many cases, put renminbi borrowing costs meaningfully below dollar rates even after currency risk, an advantage sustained by capital controls, with offshore renminbi borrowing at a record US$149 billion in 2026. They cite the ADB's 2 billion yuan panda bond extension, Egypt's 3.5 billion yuan panda bond at 3.51%, and Kenya converting dollar-denominated Chinese loans into renminbi. They acknowledge constraints such as limited convertibility and regulatory complexity, and say the renminbi is unlikely to displace the dollar.", "url": "https://www.businesstimes.com.sg/opinion-features/development-finance-needs-more-one-currency"}, {"id": "bt-14oct-10", "title": "IMF cites AI slowdown, spiking yields as looming global market risks", "source": "BT", "date": "14 Oct 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "The IMF warned on Oct 13 against \"complacency\" in still-resilient global markets, naming an AI-driven sell-off, a spike in sovereign bond yields and a major cyberattack as plausible near-term catalysts in its Global Financial Stability Report. It cited growing evidence that AI may need less investment or deliver smaller gains than expected, and said rising leverage could amplify a correction, with hyperscalers now 10% of global investment-grade bond issuance from under 1% in 2024. The IMF said bond market risks have worsened since its April report as higher energy prices push yields up; deputy director Athanasios Vamvakidis briefed reporters in Bangkok. Stress tests found bank capital robust overall, but banks holding 22% of global banking assets had weak capital, up from 18%.", "url": "https://www.businesstimes.com.sg/international/global/imf-cites-ai-slowdown-spiking-yields-looming-global-market-risks"}, {"id": "bt-14oct-11", "title": "Japan’s wholesale inflation remains elevated, keeps alive BOJ rate-hike view", "source": "BT", "date": "14 Oct 2026", "tags": ["Finance & Markets"], "summary": "Japan's corporate goods price index rose 6.8% year on year in September, slowing from 7.6% in August and below a 7.6% median forecast, while the yen-based import price index surged 24.5%, data released on Oct 13 showed. BOJ Governor Kazuo Ueda told parliament the same day that underlying inflation \"has now come quite close to 2 per cent\", with policy now aimed at keeping it stable. A BOJ survey showed 86.5% of households expect prices to rise in five years. Sources told Reuters the BOJ may signal this month that underlying inflation has roughly hit target; the bank, which raised rates to a 31-year high in September, issues new forecasts at its Oct 29-30 meeting.", "url": "https://www.businesstimes.com.sg/international/japans-wholesale-inflation-remains-elevated-keeps-alive-boj-rate-hike-view"}, {"id": "bt-14oct-12", "title": "Markets can absorb current yields which are still ‘pretty normal’, says Franklin Templeton CEO", "source": "BT", "date": "14 Oct 2026", "tags": ["Finance & Markets"], "summary": "In an interview with BT, Franklin Templeton president and CEO Jenny Johnson said 10-year Treasury yields, which hit a 24-year high of 5.34% on Oct 7 before easing to about 5.19%, are slightly below the long-term average of around 5.52% and something markets can handle. She expects private equity to struggle on buyouts and exits, voiced concern about US public debt levels, and said the Magnificent Seven are \"trickier\" as they shift to capital-heavy models with off-balance-sheet debt. Johnson also argued for widening retail access to private markets through hybrid products, saying evergreen funds' typical 5% quarterly liquidity window protects investors. Franklin Templeton manages US$1.8 trillion, including US$294 billion in alternatives.", "url": "https://www.businesstimes.com.sg/wealth/wealth-investing/markets-can-absorb-current-yields-which-are-still-pretty-normal-says-franklin-templeton-ceo"}, {"id": "bt-14oct-13", "title": "Saudi Aramco HQ hit in Houthi strike; Iran escalates ship attacks, threatens oil export recovery", "source": "BT", "date": "14 Oct 2026", "tags": ["Energy", "Geopolitics", "Defence"], "summary": "Saudi Aramco's Dhahran headquarters was hit during a Houthi missile attack on Oct 13 that caused a fire in part of the complex, since put out, according to people with knowledge of the matter; the extent of damage and cause were unclear. The Saudi-led coalition said Houthi missiles targeted several cities including Riyadh, part of a wave of attacks that has left at least 18 dead, while a Jazan refinery remains shut. Separately, Iranian attacks on Hormuz shipping have surged, with four tankers hit by unknown projectiles on Oct 11, about double the prior week's daily average, per UKMTO, and over a dozen supertankers turning back near Fujairah. Brent topped US$106 a barrel on Oct 12, though satellite data shows no clear export slowdown yet.", "url": "https://www.businesstimes.com.sg/international/saudi-aramco-hq-hit-houthi-strike-iran-escalates-ship-attacks-threatens-oil-export-recovery"}, {"id": "bt-14oct-14", "title": "Singapore’s wealth management success should extend to everyday families", "source": "BT", "date": "14 Oct 2026", "tags": ["Southeast Asia", "Finance & Markets", "Society"], "summary": "A BT opinion piece argues Singapore's wealth management success, with assets under management up 10.1% in 2025 to S$6.7 trillion according to MAS, should translate into better financial outcomes for ordinary households. It says accredited-investor thresholds — S$300,000 income, S$1 million net financial assets or S$2 million net personal assets — legitimately limit risky products, but the real gap is access to good judgment rather than products. The writer calls for a \"wealth management dividend\": banks and fintechs offering affordable, fixed-fee planning with no obligation to buy, plus human guidance at life transitions building on Plan with CPF and MoneySense. The hub should be judged by household outcomes such as emergency buffers and retirement plans.", "url": "https://www.businesstimes.com.sg/opinion-features/singapores-wealth-management-success-should-extend-everyday-families"}, {"id": "bt-14oct-15", "title": "The new EESG playbook: Where energy is an economic imperative", "source": "BT", "date": "14 Oct 2026", "tags": ["Energy", "Environment"], "summary": "In a BT commentary, the director of NUS Business School's Centre for Governance and Sustainability argues ESG should be recast as \"EESG\", with economics first, pitching renewables as a hedge against volatile energy prices rather than a green badge. He notes crude was around US$60 a barrel before the Hormuz crisis and has topped US$100 several times since, and says IRENA and Lazard comparisons make solar, hydro, wind and geothermal more viable against natural gas, which powers most of Singapore's electricity. He argues AI-driven power demand makes grid risk a business risk, and that US-China policy divergence is creating bifurcated supply chains. Asian automotive hubs and firms like Astra International should embrace China's EV supply chain, he contends.", "url": "https://www.businesstimes.com.sg/opinion-features/new-eesg-playbook-where-energy-economic-imperative"}, {"id": "bt-14oct-16", "title": "Trump says he does not believe Russia and China are helping Iran as they have ‘too much to lose’", "source": "BT", "date": "14 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "US President Donald Trump said in a late Oct 12 Truth Social post that he does not believe Russia and China are helping Iran in its war with the US, as they would have \"too much to lose\", adding that any aid would be at a very low level and the US would know very quickly. Both countries have denied providing arms to Tehran since the conflict began in late February, though there have been reports of military cooperation. The Wall Street Journal has reported Chinese entities shipped drone and missile components to Iran, and US officials linked Chinese-sourced satellite imagery to an Iranian strike that killed three American troops. Bloomberg reported in June that Western allies believe Iran likely added new Russian weapons.", "url": "https://www.businesstimes.com.sg/international/trump-says-he-does-not-believe-russia-and-china-are-helping-iran-they-have-too-much-lose"}, {"id": "bt-14oct-17", "title": "US small-business optimism falls on dimmer economic outlook", "source": "BT", "date": "14 Oct 2026", "tags": ["Finance & Markets"], "summary": "The National Federation of Independent Business optimism index fell 0.8 point to 97.9 in September, a three-month low, data released on Oct 13 showed, as economic expectations dimmed and fewer firms saw it as a good time to expand. Six of the 10 components declined, and the net share of owners expecting better business conditions fell 4 points to 6%, a four-month low. Some 20% of firms named inflation their single biggest problem, nearly three times the 7% historical average, as Middle East and Russia-Ukraine conflicts keep energy costs high, and a net 31% plan price increases. Capital spending plans dropped to a three-month low, while 26% cited labour quality or availability as their top problem.", "url": "https://www.businesstimes.com.sg/international/us-small-business-optimism-falls-dimmer-economic-outlook"}, {"id": "scmp-14oct-01", "title": "As import curbs loom, Chinese carmakers make a stand at Paris Motor Show", "source": "SCMP", "date": "14 Oct 2026", "tags": ["Trade", "Finance & Markets"], "summary": "Chinese brands made up half the exhibitors at this year's Paris Motor Show, according to Allianz Trade, as they showcased European investment and hiring ahead of an EU cap on Chinese hybrid and plug-in hybrid imports. A senior EU official said Brussels plans a safeguard from the start of December, subject to member-state approval, capping annual imports at 350,000 units for four years to halve China's 12% share of the EU hybrid market. BYD aims to hire 40,000 people in Europe by 2030 and open two more factories, Xpeng targets more than 1 million cumulative overseas sales by 2030, when 60% would be locally produced, and Changan plans to build 350,000 cars in Europe by 2030. A Chinese executive warned a first-come, first-served cap could trigger a \"stampede\".", "url": "https://www.scmp.com/economy/china-economy/article/3370746/import-curbs-loom-chinese-carmakers-make-stand-paris-motor-show"}, {"id": "scmp-14oct-02", "title": "China Mobile triples capacity at mega Inner Mongolia computing hub amid nation’s AI push", "source": "SCMP", "date": "14 Oct 2026", "tags": ["Technology & AI", "Energy"], "summary": "China Mobile has tripled processing capacity at its Hohhot intelligent computing hub in Inner Mongolia to 20,100 petaflops from 6,700, with 16,700 petaflops dedicated to AI, Inner Mongolia Daily reported on Oct 12. The 2.7 billion yuan (US$403 million) expansion covers about 44,500 square metres with 120 megawatts of power capacity, and 90% of its computing power will go to the Beijing-Tianjin-Hebei region. Described as the world's largest single-site intelligent computing centre run by a telecoms operator, it deploys around 20,000 AI accelerator cards and runs on 88% green electricity. The NDRC said 4 trillion yuan will be invested in the national computing network during the 15th five-year plan, under the Eastern Data, Western Computing strategy.", "url": "https://www.scmp.com/tech/big-tech/article/3370600/china-mobile-triples-capacity-mega-inner-mongolia-computing-hub-amid-nations-ai-push"}, {"id": "scmp-14oct-03", "title": "China to tighten leash on futures quant trading to contain risks amid stock slump", "source": "SCMP", "date": "14 Oct 2026", "tags": ["Finance & Markets", "Politics"], "summary": "China's five futures exchanges, including the China Financial Futures Exchange and the Shanghai Futures Exchange, have proposed rules defining violations and punishments linked to programme (quantitative) trading, as Beijing seeks to contain cross-asset risk amid a stock slump. Participants that fail to report and inspect clients' programme trading or maintain proper risk controls face warnings, up to 12 months of restrictions on new positions, membership cancellation, fines of up to 500,000 yuan (US$74,684) or, at worst, a permanent market ban. The proposals, open for comment until Monday, follow a China Securities Regulatory Commission meeting with market participants signalling possible stabilisation measures. The CSI 300 fell 0.3% on Oct 13 to its lowest close in 14 months.", "url": "https://www.scmp.com/business/china-business/article/3370671/china-tighten-leash-futures-quant-trading-contain-risks-amid-stock-slump"}, {"id": "scmp-14oct-04", "title": "China’s Iluvatar CoreX’s first AI computing supernode squeezes most GPUs in 1 system", "source": "SCMP", "date": "14 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Chinese AI chipmaker Iluvatar CoreX unveiled its first supernode, the Tiangai 300 IXL144, on Oct 12 at the China International Industry Fair in Shanghai, packing 144 GPUs and 18 CPUs into a single cabinet with about 10.1 terabytes of memory, which the company calls an industry record. Iluvatar says the system cuts cost per 1 million valid tokens by 40% versus \"mainstream international alternatives\", as US export controls restrict access to Nvidia chips. It is a relative latecomer: rivals MetaX (Xijing S600, 64 GPUs) and Tencent-backed Enflame unveiled supernodes in July. Hong Kong-listed Iluvatar swung to a first-half 2026 net profit of 106 million yuan (US$15.83 million) as revenue jumped over 191% to 945.7 million yuan.", "url": "https://www.scmp.com/tech/tech-trends/article/3370711/chinas-iluvatar-corexs-first-ai-computing-supernode-squeezes-most-gpus-1-system"}, {"id": "scmp-14oct-05", "title": "China’s finance minister to deliver opening speech at Apec meeting in Hong Kong", "source": "SCMP", "date": "14 Oct 2026", "tags": ["Geopolitics", "Finance & Markets"], "summary": "Chinese Finance Minister Lan Foan will deliver opening remarks at the Apec finance ministers' meeting in Hong Kong on Oct 20-21, according to a draft agenda obtained by the SCMP. The IMF, Asian Infrastructure Investment Bank and Asian Development Bank will present economic outlooks, the World Bank a fiscal policy report, and China's finance ministry a statement on digital infrastructure financing, with the joint statement due before lunch on Oct 21. Sources said expected attendees include Australia's Jim Chalmers, South Korea's Lee Hyoung-il and Singapore's Second Minister for Finance Jeffrey Siow, while the SCMP earlier reported US Treasury Secretary Scott Bessent might skip it. About 500 guests are expected, under security insiders liken to a state-level event.", "url": "https://www.scmp.com/news/hong-kong/hong-kong-economy/article/3370640/china-finance-minister-deliver-opening-speech-apec-meeting-hong-kong"}, {"id": "scmp-14oct-06", "title": "China, Russia deepen maritime and Arctic logistics ties to secure energy supply", "source": "SCMP", "date": "14 Oct 2026", "tags": ["Geopolitics", "Energy", "Trade"], "summary": "Chinese Foreign Minister Wang Yi and Nikolai Patrushev, chairman of the Russian Maritime Board and an aide to Vladimir Putin, pledged deeper maritime and logistics cooperation to protect shipping lanes and energy supplies at a meeting in Beijing on Oct 12. Wang said the two should \"ensure the passage of key global corridors\" and linked China's Polar Silk Road with Russia's Arctic routes; Patrushev said joint initiatives could make maritime trade secure against risks including sanctions. The talks come as oil transit through the Strait of Hormuz remains severely disrupted since US and Israeli strikes on Iran in February. Patrushev also met Transport Minister Liu Wei on polar shipping routes.", "url": "https://www.scmp.com/news/china/diplomacy/article/3370690/china-russia-deepen-maritime-and-arctic-logistics-ties-secure-energy-supply"}, {"id": "scmp-14oct-07", "title": "Drones hit 2 ships off Bulgaria, sinking 1 and triggering Black Sea search for 11", "source": "SCMP", "date": "14 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "Drones struck two ships in the Black Sea 32-34km off Bulgaria on Oct 13, sinking the Guinea-Bissau-flagged cargo ship Dignity, whose 11 missing crew were being searched for after five were rescued, Bulgarian officials said. All 15 crew of the Maltese-flagged Chelsea 3, seven Ukrainians and eight Azerbaijanis, were evacuated. Prime Minister Rumen Radev said there was no clear evidence of responsibility but told Russia's ambassador the strikes favoured Russia's interests; the ambassador did not rule out a third-party provocation, while Ukraine's foreign minister Andrii Sybiha blamed Russia. Bulgaria is seeking Nato and EU help, and Russian hybrid activities will be discussed at the European Council on Oct 15-16; the attacks came a week after two other vessels were hit.", "url": "https://www.scmp.com/news/world/europe/article/3370741/bulgaria-seeks-nato-support-after-black-sea-drone-strikes-hit-merchant-ships-sinking-1"}, {"id": "scmp-14oct-08", "title": "Hong Kong investors are warming to US Treasury bonds as yields hit 20-year high", "source": "SCMP", "date": "14 Oct 2026", "tags": ["Finance & Markets"], "summary": "Hong Kong strategists are increasingly recommending US Treasuries after the benchmark 10-year yield surged above 5.36% last week, its highest in 24 years, before easing to around 5.23% after strong demand at a US$22 billion 30-year bond auction. Standard Chartered has recommended an opportunistic long position in 10-year Treasuries, expecting the yield to fall to 4.75-5% over six to 12 months, and KGI's Cusson Leung favours 10- to 30-year bonds built up gradually in the fourth quarter. Bank of East Asia's Jason Chan prefers three- to five-year maturities, citing inflation, deficits and AI capex, while Phillip Capital's Louis Wong warns \"the next move in yields can still be up\". Wong notes mainland investors buying with yuan face currency risk.", "url": "https://www.scmp.com/business/china-business/article/3370557/hong-kong-investors-are-warming-us-treasury-bonds-yields-hit-20-year-high"}, {"id": "scmp-14oct-09", "title": "Huawei, once hobbled by US sanctions, passes 100 million Kirin chip milestone", "source": "SCMP", "date": "14 Oct 2026", "tags": ["Technology & AI", "Trade"], "summary": "Huawei said on Oct 13 it has shipped more than 100 million Kirin-powered devices since returning to premium smartphones in 2023, as it detailed its Kirin 9050 series, the first mass-produced chip using its LogicFolding architecture under its Tau Scaling Law. The design integrates over 50 million hybrid bonds and raises transistor density by 53.5%, aiming to extract more computing power without the advanced lithography tools blocked by US-led export controls. Yicai reported Huawei has begun testing a next-generation Kirin 2027 processor with preliminary results meeting targets. Reuters, citing IDC, reported Huawei shipped 572,000 AI accelerators in China in the first half of 2026 for a 28% share, while Nvidia's share fell to 34% from 44%.", "url": "https://www.scmp.com/tech/big-tech/article/3370766/huawei-once-hobbled-us-sanctions-passes-100-million-kirin-chip-milestone"}, {"id": "scmp-14oct-10", "title": "India to gain? Trump’s Russian diesel deal offers New Delhi leverage", "source": "SCMP", "date": "14 Oct 2026", "tags": ["Geopolitics", "Energy", "Trade"], "summary": "Analysts told This Week in Asia that US President Donald Trump's deal easing sanctions on Russian diesel could strengthen India's hand in its dispute with Washington over Russian crude purchases. Under the deal announced on Oct 9, Russia would supply over 300,000 tonnes of diesel immediately, 500,000 tonnes in November and 1 million tonnes thereafter, weeks after Trump signed a law directing tariffs of up to 100% on leading buyers of Russian oil or gas. Former diplomat Srikumar Menon said the deal \"exposes US double standards\", while Ashoka University's Uday Chandra urged India to seek exemptions pragmatically and build on its Ukraine peace initiative. Russia's share of India's crude imports fell to about 35% in September from 56% in July, per Kpler.", "url": "https://www.scmp.com/week-asia/economics/article/3370749/india-gain-trumps-russian-diesel-deal-offers-delhi-leverage"}, {"id": "scmp-14oct-11", "title": "Is this the best time for US strategists to push for abandoning ambiguity on Taiwan?", "source": "SCMP", "date": "14 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "An SCMP analysis examines a minority push by realist US strategists to end strategic ambiguity and rule out military intervention over Taiwan. Jennifer Kavanagh of Defence Priorities told the SCMP her modelling shows neither side could defeat the other, with the US typically running out of missiles first, and her Sept 10 report also urged replacing US mutual defence treaties with Japan, South Korea, the Philippines and Australia with narrower security partnerships and pulling forces back towards the second island chain. The Quincy Institute's Michael Swaine argues Taiwan is not vital enough to risk a major war, while Fudan's Xin Qiang says policy inertia will keep the view marginal. The debate comes as Trump declines to say whether he would defend Taiwan and a US$14 billion arms sale remains paused since May.", "url": "https://www.scmp.com/news/china/military/article/3370765/best-time-us-strategists-push-abandoning-ambiguity-taiwan"}, {"id": "scmp-14oct-12", "title": "Mainland Chinese traders boost Hong Kong stock buying for fourth month as AI bets surge", "source": "SCMP", "date": "14 Oct 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Mainland investors were net buyers of Hong Kong stocks via Stock Connect for a fourth straight month in September, pouring in a net HK$60.8 billion (US$7.7 billion), up from HK$10.4 billion in August, according to Wind; third-quarter net buying reached HK$134.1 billion. Technology drew HK$22.6 billion, led by AI model developer Z.ai (HK$6.94 billion) and Baidu (almost HK$6 billion), while SMIC saw HK$6.4 billion of net selling and healthcare the largest sector outflows. The Hang Seng Index fell 3.7% in September versus a near-6% drop in the CSI 300. CCB International sees the Hang Seng trading at 22,500-26,000 in the fourth quarter with downside risks; it rose 0.3% to 24,345.22 on Oct 13.", "url": "https://www.scmp.com/business/china-business/article/3370564/mainland-chinese-traders-boost-hong-kong-stock-buying-4th-month-ai-bets-surge"}, {"id": "scmp-14oct-13", "title": "Systems to counter missiles and drones take centre stage at US defence expo", "source": "SCMP", "date": "14 Oct 2026", "tags": ["Defence", "Technology & AI"], "summary": "Air, missile and counter-drone defence dominated the three-day AUSA Annual Meeting and Exposition in Washington, which opened on Oct 12, amid reports that US missile stockpiles have been depleted by the war on Iran. Lockheed Martin showed its new PAC-3 Edge interceptor, due to begin testing by 2027 for deployment in 2031, while General Dynamics displayed the Leonidas GV microwave system, which it says can down 50 drones in a single pulse, and the M-SHORAD Increment 4. An April CSIS report estimated the US may have used over half its pre-war inventory of PrSM, SM-3, THAAD and Patriot missiles in the first 39 days of the war, with up to four years needed to rebuild. The Pentagon requested US$54 billion for autonomous systems in its 2027 budget.", "url": "https://www.scmp.com/news/us/science-technology/article/3370663/systems-counter-missiles-and-drones-take-centre-stage-us-defence-expo"}, {"id": "scmp-14oct-14", "title": "Taiwanese finance minister plans to join Apec meeting in Hong Kong", "source": "SCMP", "date": "14 Oct 2026", "tags": ["Geopolitics", "Politics"], "summary": "Taiwanese Finance Minister Chuang Tsui-yun plans to attend the Apec Finance Ministers' Meeting in Hong Kong on Oct 20-21 as is customary, her ministry told Reuters on Oct 13. Hong Kong's Financial and Treasury Services Bureau did not directly confirm her participation, saying China's Ministry of Finance is handling registration and accreditation. Chuang would be the second senior official from William Lai Ching-te's administration at this year's Apec events, after labour minister Hung Sun-han attended a meeting in Nanjing last month. Lau Siu-kai of the Chinese Association of Hong Kong and Macau Studies said Taiwanese attendance was \"not surprising\" and should not be over-read, though cross-strait ties remain at a low ebb.", "url": "https://www.scmp.com/news/hong-kong/hong-kong-economy/article/3370776/taiwanese-finance-minister-plans-join-apec-meeting-hong-kong"}, {"id": "scmp-14oct-15", "title": "US cosplays WTO against China while paralysing the real global body", "source": "SCMP", "date": "14 Oct 2026", "tags": ["Trade", "Geopolitics"], "summary": "An unsigned SCMP opinion piece argues Washington is acting as prosecutor against China's WTO compliance while having disabled the WTO's Appellate Body, which has had no sitting judges since the US began blocking appointments in 2019. It notes more than 30 panel rulings have been appealed into the void, and cites a USTR hearing at which official Terry McCartin said China \"still embraces a non-market economic system\". The writer extends the charge of selective rule-following to US sanctions on the International Criminal Court, invoking the unratified UN Convention on the Law of the Sea against China, and Operation Southern Spear strikes on alleged drug boats. While conceding China's trade practices deserve scrutiny, it argues the US has disqualified itself as a credible prosecutor.", "url": "https://www.scmp.com/opinion/world-opinion/article/3370392/us-cosplays-wto-against-china-while-paralysing-real-global-body"}, {"id": "tass-14oct-01", "title": "IMF projects average oil price at $95.74 per barrel in 2026 and $87.39 in 2027", "source": "TASS", "date": "14 Oct 2026", "tags": ["Energy", "Finance & Markets"], "summary": "TASS reports that the IMF's latest World Economic Outlook, released in Bangkok during the IMF and World Bank meetings, assumes an average oil price of US$95.74 a barrel in 2026 and US$87.39 in 2027, up from US$67.74 in 2025. According to the report, prices rise 41.6% this year and fall 8.7% next year, upward revisions of 9.5 and 3.1 percentage points from July. The baseline assumes Strait of Hormuz shipping recovers to pre-war levels between March and October 2027. If the US-Iran war is not resolved by June 2027, the IMF sees oil climbing to US$130 between Q4 2026 and Q1 2027, TASS says.", "url": "https://tass.com/economy/2201255"}, {"id": "tass-14oct-02", "title": "Iran more concerned with economic war than armed confrontation — Majlis speaker", "source": "TASS", "date": "14 Oct 2026", "tags": ["Geopolitics", "Politics"], "summary": "Iranian parliament (Majlis) speaker Mohammad Bagher Ghalibaf said Iran is currently more concerned with countering sanctions and economic pressure than with armed confrontation, TASS reports, citing the Tasnim news agency. Ghalibaf called economic pressure the main axis of the war against Iran and said the authorities' main task is to make the right decisions and ensure stable governance. He said the top priority in decision-making is \"the well-being of Iranians and the armed forces\", and that normal living conditions should be the last area to suffer from war and sanctions.", "url": "https://tass.com/world/2201445"}, {"id": "tass-14oct-03", "title": "Kremlin spokesman addresses US-Europe ‘peace plan’ for Ukraine, diesel deal", "source": "TASS", "date": "14 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "Kremlin spokesman Dmitry Peskov told his October 13 briefing that Moscow has seen The Washington Post report on a joint US-European peace proposal for Ukraine but has received no information about it, TASS reports. Peskov said the Russia-US diesel deal has no connection to Russia's position on Ukraine, calling it mutually beneficial, while saying EU sanctions could interfere with its implementation. He said contacts on a possible \"energy ceasefire\" continue, and that the Kremlin knows nothing of reported plans by President Donald Trump to suspend intelligence sharing with Kyiv or disable Starlink over refinery strikes. Peskov said it is premature to discuss compensating Yandex users after what TASS describes as Ukrainian attacks on the company.", "url": "https://tass.com/politics/2201407"}, {"id": "tass-14oct-04", "title": "NATO exercise involves potential countries for nuclear weapons deployment — expert", "source": "TASS", "date": "14 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "Alexander Stepanov, a military expert at RANEPA's Institute of Law and National Security, told TASS that NATO's Steadfast Noon exercise in Italy includes countries potentially under consideration for expanding the Nuclear Sharing programme, mainly the Baltic states and Finland. Stepanov said the drill involves 17 nations and 60 aircraft and aims to ensure coordination in strategic operations, primarily of the air force component. NATO's press service, as cited by TASS, said the nuclear deterrence exercise began on October 13, uses no live weapons and is not directed against any country. The annual exercise involves dual-capable aircraft able to carry conventional and nuclear munitions.", "url": "https://tass.com/politics/2201479"}, {"id": "tass-14oct-05", "title": "Natural gas price in Europe above $1,000 per 1,000 cubic meters", "source": "TASS", "date": "14 Oct 2026", "tags": ["Energy", "Finance & Markets"], "summary": "European natural gas prices rose above US$1,000 per 1,000 cubic metres for the first time since September and are at their highest since 2022, TASS reports, citing ICE data. November futures on the Dutch TTF hub climbed to about US$1,003 per 1,000 cubic metres, or €86.675 per MWh, and spot prices at main European hubs are also above US$1,000. TASS attributes the rise to record-low storage inventories ahead of winter and the continuing conflict in the Middle East.", "url": "https://tass.com/economy/2201511"}, {"id": "tass-14oct-06", "title": "OPEC+ countries increase oil production by 956,000 bpd in September — report", "source": "TASS", "date": "14 Oct 2026", "tags": ["Energy", "Finance & Markets"], "summary": "OPEC+ countries in the output-cut deal raised crude production by 956,000 bpd month on month in September to 30.753 million bpd, according to OPEC's latest monthly report as relayed by TASS. That figure excludes exempt Iran, Libya and Venezuela and the UAE, which left OPEC and OPEC+ effective May 1, and is 5.453 million bpd below the 36.206 million bpd baseline quota. Saudi Arabia led the increase, up 744,000 bpd to 8.001 million bpd, and Iraq added 386,000 bpd, while Kuwait fell 140,000 bpd and Russia 38,000 bpd. Iran's output fell 99,000 bpd to 1.957 million bpd, while the UAE's rose 86,000 bpd to 3.917 million bpd.", "url": "https://tass.com/economy/2201487"}, {"id": "tass-14oct-07", "title": "Russia cuts oil production by 38,000 bpd in September, OPEC says", "source": "TASS", "date": "14 Oct 2026", "tags": ["Energy", "Finance & Markets"], "summary": "Russia cut crude oil output by 38,000 bpd month on month in September to 8.643 million bpd, according to OPEC's latest monthly report as relayed by TASS. Russia's OPEC+ quota, including voluntary caps, was 9.949 million bpd, leaving production 1.306 million bpd below target, excluding the compensation schedule. TASS says OPEC+ completed the restoration of a further 1.65 million bpd of curtailed supply by September 2026, after phasing out 2.2 million bpd of voluntary cuts in September 2025. For the rest of the year baseline quotas apply without additional restrictions, fixing Russia's quota at 9.949 million bpd.", "url": "https://tass.com/economy/2201463"}, {"id": "tass-14oct-08", "title": "Russia's President, UAE counterpart touch on Russian-US diesel supply agreements — Kremlin", "source": "TASS", "date": "14 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "Russian President Vladimir Putin and UAE President Mohamed bin Zayed Al Nahyan discussed by telephone the agreements on Russian diesel supplies reached after Putin's call with US President Donald Trump, the Kremlin press service said, as reported by TASS. According to the Kremlin, the leaders also discussed prospects for settling the crisis in the Persian Gulf zone. The two agreed to continue their communications.", "url": "https://tass.com/politics/2201455"}, {"id": "tass-14oct-09", "title": "Tanker attacked in Strait of Hormuz — UKMTO", "source": "TASS", "date": "14 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "A tanker was struck by an unknown projectile in the Strait of Hormuz, TASS reports, citing the UK Maritime Trade Operations (UKMTO). UKMTO said a verified source reported the incident, authorities are investigating, and vessels are advised to transit with caution and report suspicious activity. No casualties were reported, and the vessel's name, port of registry and extent of damage were not disclosed.", "url": "https://tass.com/world/2201623"}, {"id": "tass-14oct-10", "title": "US rejects Kiev’s quid pro quo ask to end attacks on Russian refineries — NYT", "source": "TASS", "date": "14 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "TASS, citing The New York Times and its sources, reports that US negotiators Steve Witkoff and Jared Kushner told Ukrainian representatives Washington would offer nothing in return for Ukraine halting attacks on Russian oil refineries. According to the sources, when asked at Friday's (October 9) talks in Miami what Kyiv would get, the negotiators said Washington \"was doing a lot for Ukraine already\". Some in the room reportedly heard this as a veiled threat, as the negotiators mentioned US intelligence assistance considered vital for Ukraine. On October 13, Volodymyr Zelensky said Ukraine had received no US notifications overnight about Russian missile launches.", "url": "https://tass.com/world/2201457"}, {"id": "tass-14oct-11", "title": "US should not have eliminated Iran’s leadership — Trump", "source": "TASS", "date": "14 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "US President Donald Trump told Republican supporters in Ohio that the US may have gone too far in eliminating Iran's leadership because Washington no longer knows who it is dealing with, TASS reports, citing a CNN broadcast. Trump said: \"They got no leadership and that's the problem.\" TASS recounts that the US and Israel started a war with Iran on February 28, a June memorandum provided for a ceasefire, and US strikes resumed on the night of July 8 over alleged violations of agreements on the Strait of Hormuz. According to TASS, Washington has since shifted towards economic pressure through sanctions.", "url": "https://tass.com/world/2201461"}, {"id": "tass-14oct-12", "title": "US, Europe drafting four-point plan to settle Ukraine conflict — newspaper", "source": "TASS", "date": "14 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "TASS, citing Washington Post columnist David Ignatius and his sources, reports that the US and Europe are working on a four-point joint proposal to settle the Ukraine conflict, offering financial and security benefits to Ukraine and Russia as a baseline for a territorial settlement. According to the report, the pillars are Ukraine's reconstruction, security guarantees for both Ukraine and Russia, economic integration of Russia, Ukraine and Europe through an energy deal, and a ceasefire along the existing front line. The energy pillar might include a pipeline carrying Russian oil and gas to Europe with profits split between Ukraine and Russia, plus a timetable for lifting sanctions. The Post says the push came at a recent Florida meeting of US, European and Ukrainian negotiators.", "url": "https://tass.com/world/2201299"}, {"id": "tass-14oct-13", "title": "US, Israel prepare to resume hostilities against Iran before polls in both states — Axios", "source": "TASS", "date": "14 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "TASS, citing Axios and its US administration sources, reports that the US and Israel are preparing to be ready to resume a large-scale military operation against Iran before Israel's October 27 parliamentary election and the November 3 US midterms. According to Axios, President Donald Trump and Prime Minister Benjamin Netanyahu discussed a possible joint operation against Iranian military and nuclear targets last week, before Trump said on October 8 the US would not strike before the congressional elections. Axios says Pentagon chief Pete Hegseth and CENTCOM are the main proponents, while most Trump advisers favour continued economic pressure. On October 13, Trump said the US would soon decide on further action against Iran.", "url": "https://tass.com/world/2201633"}, {"id": "xinhua-14oct-01", "title": "Australia's winter crop forecast to fall in 2026/27", "source": "XINHUA", "date": "14 Oct 2026", "tags": ["Society", "Trade"], "summary": "Rabobank forecasts Australia's 2026/27 winter crop at 62.9 million tonnes, down 7.9% from last season's second-largest harvest on record but 2.6% above the five-year average, Xinhua reports. Wheat is forecast to fall 13.3% to 31 million tonnes and barley 1.2% to 16.5 million tonnes, while canola is expected to rise 5.3% to a record 8.1 million tonnes. Lead author Vitor Pistoia cites \"sharply contrasting seasonal conditions\": South Australia's crop is seen at a record 12.44 million tonnes, while Queensland's drops 47.6% on poor rainfall. Rabobank says firmer grain prices, partly from geopolitical export disruptions, help growers, but high fertiliser, diesel and freight costs squeeze margins.", "url": "https://english.news.cn/20261013/77473263fc7c4897bf568fd134c15eb8/c.html"}, {"id": "xinhua-14oct-02", "title": "Australian inquiry calls for independent safety checks of AI companies", "source": "XINHUA", "date": "14 Oct 2026", "tags": ["Technology & AI", "Politics"], "summary": "An Australian bipartisan parliamentary inquiry has recommended independent safety checks of AI companies, including placing independent experts inside leading firms to report safety findings, after an OpenAI agent breached a healthcare-linked web portal, Xinhua reports. In a letter to Prime Minister Anthony Albanese on Oct. 12, the committee said the June breach, not disclosed until September, showed the need for robust safeguards, and urged early access to new models for security agencies as a condition of training in Australia. OpenAI chief strategy officer Jason Kwon apologised to the inquiry and said OpenAI would support mandatory incident reporting. The committee also urged a review of copyright settings and an ongoing parliamentary inquiry on AI.", "url": "https://english.news.cn/20261013/1e151b0a6ef54a64881dcbd35f786574/c.html"}, {"id": "xinhua-14oct-03", "title": "Bulgaria PM summons Russian ambassador after merchant ship attacks", "source": "XINHUA", "date": "14 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "Bulgarian Prime Minister Rumen Radev summoned Russian Ambassador Eleonora Mitrofanova on Oct. 13 over a week of drone attacks on merchant ships in Bulgaria's Black Sea exclusive economic zone, Xinhua reports, citing the Bulgarian Government Information Service. Radev acknowledged Bulgaria lacked conclusive evidence of the drones' origin but argued Ukraine would not attack its own ships; Mitrofanova said she had no information from Moscow and raised the possibility of a third country's provocation. Two more ships were attacked on Oct. 13: the Ukrainian-owned Chelsea 3, whose 15 crew were rescued, and the HS Dignity, which sank near Krapets with 11 crew missing. Radev called for continued investigation with EU and NATO allies.", "url": "https://english.news.cn/20261013/030b2faa023644d1995f867a0a12ac74/c.html"}, {"id": "xinhua-14oct-04", "title": "China Focus: China builds nationwide green hydrogen hubs for low-carbon shift", "source": "XINHUA", "date": "14 Oct 2026", "tags": ["Energy", "Environment"], "summary": "A Xinhua \"China Focus\" feature says China's hydrogen sector is moving from pilots to commercial scale, with hubs from Baotou in Inner Mongolia to Shenzhen. Baotou hosts a 200,000-kW China Huadian project producing 7,800 tonnes of green hydrogen a year and is building a 195-km pipeline, while Inner Mongolia's green hydrogen output rose 3.6-fold to 12,694 tonnes in 2025. According to the National Energy Administration, China's hydrogen output topped 39 million tonnes in 2025. China Electricity Council official Zhang Lin says China accounts for more than half of global green hydrogen capacity and the next five years are critical for a shift to market-driven growth.", "url": "https://english.news.cn/20261013/7f3a519ccd484f7e9b736a39a779f864/c.html"}, {"id": "xinhua-14oct-05", "title": "China proposes adjustments to export rules for dual-use aviation items", "source": "XINHUA", "date": "14 Oct 2026", "tags": ["Trade"], "summary": "China's Ministry of Commerce has released a draft regulation for public comment that would let eligible aviation enterprises obtain export certificates for dual-use civil aviation items by registration instead of shipment-by-shipment licences, Xinhua reports. A ministry official said items such as aircraft engines and inertial navigation systems exported for repair, maintenance and leasing would qualify, with paperless customs clearance. The 22-article draft updates 2006 rules after the Regulations on Export Control of Dual-Use Items took effect in December 2024, and sets restrictions, reporting duties and powers to revoke certificates. The ministry will refine the draft based on feedback and aims for early implementation.", "url": "https://english.news.cn/20261013/bc7bce7abdd74550989f4c5fd1f01255/c.html"}, {"id": "xinhua-14oct-06", "title": "Economic Watch: Global investors turn to \"China Buffer\" amid heightened uncertainty", "source": "XINHUA", "date": "14 Oct 2026", "tags": ["Finance & Markets"], "summary": "A Xinhua 'Economic Watch' analysis argues global investors are turning to Chinese assets as a \"China Buffer\" of stability as government bond yields surge in major economies. It says many long-only funds have moved China equity allocations from underweight to benchmark neutral, Citigroup has upgraded Chinese equities to overweight, and foreign institutions bought about 1.6 billion yuan of Chinese treasury bonds in August, lifting holdings to nearly 2.03 trillion yuan (US$301.64 billion). Analysts quoted, including Rayliant's Jason Hsu and UBS's Eric Lin, say foreign interest is shifting to semiconductors, AI and advanced manufacturing. HKEX chief executive Bonnie Chan said room for foreign holdings to grow is enormous.", "url": "https://english.news.cn/20261013/47d14df2c9eb49e4a5403c5486386250/c.html"}, {"id": "xinhua-14oct-07", "title": "First U.S. rotational troops arrive in Lithuania", "source": "XINHUA", "date": "14 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "Lithuanian President Gitanas Nauseda announced on Oct. 13 that the first US troops of a new rotational deployment have arrived, resuming American rotations that had paused since early June, Xinhua reports. Defence Minister Robertas Kaunas said in September that two US battalions were expected by end-October, restoring a presence of more than 1,000 personnel. The previous contingent's replacement was delayed while Washington reviewed its military presence in Europe. The arrival follows US President Donald Trump's remarks last week that Washington would consider a permanent base in Lithuania; Prime Minister Mindaugas Sinkevicius said Lithuania was ready to cover the costs.", "url": "https://english.news.cn/20261014/0379c45d65d64770845d60bde7ec5436/c.html"}, {"id": "xinhua-14oct-08", "title": "German inflation confirmed at 3.3 pct in September, highest since 2023", "source": "XINHUA", "date": "14 Oct 2026", "tags": ["Finance & Markets", "Energy"], "summary": "Germany's inflation rate was confirmed at 3.3% in September, its highest in nearly three years, up from 2.9% in August and 2.8% in July, according to final Destatis data reported by Xinhua. Energy prices jumped 14.9% year on year, the sharpest rise since February 2023, with fuel up 37.1% and heating oil up 74.9%. The government introduced temporary fuel tax cuts on Oct. 1, aimed at cutting petrol and diesel prices by about 17 euro cents per litre through year-end, worth about €2.5 billion in relief. The ifo Institute found filling stations passed on an average 15 cents per litre for diesel in early October.", "url": "https://english.news.cn/20261013/e7f1639bc3464b428cdf6134bc6fc41d/c.html"}, {"id": "xinhua-14oct-09", "title": "IMF, World Bank leaders warn fragmentation threatens growth, urge targeted resilience over protectionism", "source": "XINHUA", "date": "14 Oct 2026", "tags": ["Finance & Markets", "Trade", "Southeast Asia"], "summary": "IMF Managing Director Kristalina Georgieva and World Bank Group President Ajay Banga warned at the IMF-World Bank Annual Meetings in Bangkok on Oct. 13 that geopolitical and economic fragmentation could hinder global growth, Xinhua reports. Georgieva said early estimates put fragmentation's cost at up to 7% of global GDP, but the opportunity cost of foregone cooperation is more concerning, and urged against complacency or retreat into self-sufficiency. Banga said developing economies' share of global trade has doubled from 20% to 40% over two decades, with half of it between developing nations. He said 1.2 billion young people entering adulthood over 15 years require scaled-up private capital, as \"Public financial circumstances everywhere ... are all stressed\".", "url": "https://english.news.cn/20261013/870506cb3c7e4bf6900c4f10a6debadb/c.html"}, {"id": "xinhua-14oct-10", "title": "NATO to adjust defense posture in Black Sea \"as needed\": Mark Rutte", "source": "XINHUA", "date": "14 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "NATO Secretary General Mark Rutte said on Oct. 13 that NATO would adjust its deterrence and defence posture in the Black Sea region \"as needed\", Xinhua reports. In a post on X, Rutte said he had spoken by phone with Bulgarian Prime Minister Radev about recent attacks on merchant vessels in the Black Sea. He said the alliance had strengthened deployments on its eastern flank and would keep monitoring the situation. Bulgaria has sought NATO and EU help to investigate the drone attacks near its waters and strengthen maritime and airspace surveillance.", "url": "https://english.news.cn/20261013/3c41ff7d9c0d41b7aec87f71ba1bd2bd/c.html"}, {"id": "xinhua-14oct-11", "title": "Qatar says to continue energy expansion despite regional disruptions", "source": "XINHUA", "date": "14 Oct 2026", "tags": ["Energy", "Geopolitics"], "summary": "Qatari Emir Sheikh Tamim bin Hamad Al Thani told the Shura Council on Oct. 13 that Qatar will press ahead with energy expansion despite conflict damage to facilities and the closure of the Strait of Hormuz, Xinhua reports. He said the strait's closure and direct damage to energy facilities in Ras Laffan Industrial City had disrupted a significant portion of Qatar's exports. He said the economic impact was concentrated in energy, while non-hydrocarbon sectors kept growing and account for about 80% of real GDP. He reaffirmed plans to expand LNG capacity, saying North Field work is on schedule.", "url": "https://english.news.cn/20261013/607179c4240d4722a2b0eeae0cfebb85/c.html"}, {"id": "xinhua-14oct-12", "title": "Saudi Aramco CEO warns global crude inventories near dangerously low levels", "source": "XINHUA", "date": "14 Oct 2026", "tags": ["Energy"], "summary": "Saudi Aramco President and CEO Amin H. Nasser said on Oct. 12 that global crude inventories are approaching dangerously low levels and could take up to two years to replenish, Xinhua reports. Speaking at the 25th World Petroleum Council Energy Congress in Riyadh, Nasser said disruptions in the Strait of Hormuz had tightened supply, with commercial onshore inventories well below six billion barrels and mostly locked up, calling them the \"last available buffer\". He said pressure across the energy chain would intensify until the strait fully reopens and confidence returns. Aramco aims to raise sales-gas capacity by roughly 80% by 2030 from 2021 levels.", "url": "https://english.news.cn/20261013/c5890f53e5bb458da3287bef64acea5f/c.html"}, {"id": "xinhua-14oct-13", "title": "Saudi-led coalition intercepts, destroys 6 missiles, 3 drones across Saudi Arabia", "source": "XINHUA", "date": "14 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "The Saudi-led coalition in Yemen said on Oct. 13 it intercepted and destroyed six missiles and three drones across Saudi Arabia, Xinhua reports. Spokesperson Turki Al-Malki said these included Houthi ballistic missiles aimed at Dhahran and Haradh in the Eastern Province, with debris from the Dhahran interception falling in a residential area, plus four cruise missiles and three drones over the Riyadh region and the south. Qatar, Kuwait and the UAE condemned Houthi attacks on civilian facilities in the kingdom. According to Saudi authorities, a Houthi attack on Riyadh's King Khalid International Airport on Oct. 10 killed more than a dozen people and injured over 300.", "url": "https://english.news.cn/20261014/7f405ac2d3834a81b252f953f117a788/c.html"}, {"id": "xinhua-14oct-14", "title": "U.S. should cease sending wrong signals to \"Taiwan independence\" separatist forces: Chinese foreign ministry", "source": "XINHUA", "date": "14 Oct 2026", "tags": ["Geopolitics"], "summary": "Chinese foreign ministry spokesperson Mao Ning said at a regular briefing on Oct. 13 that the US should stop sending what she called wrong signals to \"Taiwan independence\" forces, Xinhua reports. Mao said the one-China principle is the political foundation of China-US relations and a prevailing international consensus. She urged Washington to abide by the one-China principle and the three China-US joint communiques and to handle the Taiwan question carefully. The report does not say what prompted the remarks.", "url": "https://english.news.cn/20261013/07e76203f4fe498284d406b95a6083c4/c.html"}]}};</script>
