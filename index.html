"url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20ST/Erdogan%20urges%20Trump%20to%20pursue%20talks%20with%20Iran,%20offers%20support.pdf"}, {"id": "st-06", "title": "German drone maker Helsing enlists Rakuten to broker Japan military deal", "source": "ST", "date": "18 Aug 2026", "tags": ["Defence", "Technology & AI"], "summary": "German drone maker Helsing has enlisted Japanese e-commerce and finance firm Rakuten to help finalise a deal selling its unmanned systems to Japan's army, a Rakuten spokesperson said on Aug 17. Japan's Ground Self-Defence Forces are testing Helsing's HX-2 strike drone through end-September as Tokyo modernises its military to counter an assertive China. Helsing struck an \"initial agreement\" earlier this year via an unnamed local brokerage partner. Rakuten, with limited defence experience, aims to help startups break into Japan's defence industry, said executive Hideaki Mukai. Japan's military-spending splurge and eased arms-export rules have drawn overseas interest. Rakuten earlier helped Ukrainian firm Swarmer demonstrate drone-swarm software. Munich-based Helsing raised US$1.8 billion in July, becoming Europe's best-funded defence-tech startup, according to Reuters.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20ST/German%20drone%20maker%20Helsing%20enlists%20Rakuten%20to%20broker%20Japan%20military%20deal.pdf"}, {"id": "st-07", "title": "Houthis say they attacked Saudi vessels off Yemen's Mocha", "source": "ST", "date": "18 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Yemen's Iran-aligned Houthis said they attacked a Saudi military ship and four escort vessels in the Red Sea with missiles, according to military spokesperson Yahya Saree on Telegram on Aug 17. There was no immediate confirmation from Saudi authorities. Mocha is a Red Sea port near the Bab el-Mandeb Strait, a strategic chokepoint connecting the Red Sea with the Gulf of Aden and a key international shipping route. Last Tuesday, the Houthis attacked a ship in the Bab el-Mandeb Strait, and Yemen's transport ministry said four crew members were killed. The Houthis imposed a naval blockade in July against Saudi Arabia in response to what they described as a Saudi siege on Yemen, an allegation Riyadh has denied, Reuters reported.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20ST/Houthis%20say%20they%20attacked%20Saudi%20vessels%20off%20Yemen's%20Mocha.pdf"}, {"id": "st-08", "title": "Japan's 10-year bond yield hits 3-decade high as inflation, central bank pressures mount", "source": "ST", "date": "18 Aug 2026", "tags": ["Finance & Markets"], "summary": "Japan's 10-year government bond yield jumped to a three-decade high on Aug 17, tracking a global debt slide as inflation pressures mounted and central-bank rate-hike expectations solidified. The benchmark 10-year JGB yield climbed five basis points to 2.925 per cent, a level last seen in September 1996, rising for a sixth consecutive session. The two-year yield, most sensitive to Bank of Japan policy, added 3.5 basis points to 1.685 per cent, the highest since May 1995, while 30-year and 40-year yields also advanced. Mitsubishi UFJ Morgan Stanley strategist Keisuke Tsuruta cited a globally spreading bearish outlook and uncertainty over the BOJ's hiking pace. Data showed Japan's economy grew an annualised 1.1 per cent in April-June, below the 2 per cent forecast, per Reuters.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20ST/Japan's%2010-year%20bond%20yield%20hits%203-decade%20high%20as%20inflation,%20central%20bank%20pressures%20mount.pdf"}, {"id": "st-09", "title": "Kallang Distripark set to be redeveloped for thousands of new private homes", "source": "ST", "date": "18 Aug 2026", "tags": ["Society", "Southeast Asia"], "summary": "The Urban Redevelopment Authority on Aug 14 published a proposed Master Plan amendment to redevelop Kallang Distripark, a disused rubber-factory warehouse site, for private housing. The 13ha site, zoned for housing since 2003 and owned by entities linked to Lee Rubber Company, would be carved into three housing plots, a 2ha park, new roads and a 1.8ha reserve site. Analysts estimate the plots could yield roughly 2,250 to 2,550 condominium units combined. The site includes three iconic octagonal Lee Rubber Godowns designed by pioneer architect Victor Chew; URA is studying retaining one as a heritage marker. Analysts cite the central waterfront location and proximity to Geylang Bahru MRT as draws. Redevelopment plans were first showcased in 2017, reports Straits Times journalist Ng Keng Gene.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20ST/Kallang%20Distripark%20set%20to%20be%20redeveloped%20for%20thousands%20of%20new%20private%20homes.pdf"}, {"id": "st-10", "title": "Kushner's talks with Israel, Hamas end without breakthrough on Trump Gaza plan", "source": "ST", "date": "18 Aug 2026", "tags": ["Geopolitics"], "summary": "Trump envoy and son-in-law Jared Kushner left Jerusalem on Aug 17 without a breakthrough after two days of talks with Israeli and Hamas leaders over a stalled US plan to end the Gaza war, with both sides firm on key demands. Kushner met Netanyahu a day after meeting Hamas's political leader in Egypt. Netanyahu, trailing in polls before an Oct 27 election, insists Israel will not pull back until Hamas fully disarms. A Board of Peace official said both agreed there would be \"no redeployment\" until Gaza is demilitarised, covering \"every weapon, light and heavy.\" Reconstruction would not start until disarmament. More than 1,200 Palestinians and four Israeli soldiers have been killed since October 2025, per Gazan and Israeli figures, Reuters reported.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20ST/Kushner's%20talks%20with%20Israel,%20Hamas%20end%20without%20breakthrough%20on%20Trump%20Gaza%20plan.pdf"}, {"id": "st-11", "title": "OpenAI to lease massive new AI data centre in US, backed by Nvidia", "source": "ST", "date": "18 Aug 2026", "tags": ["Technology & AI", "Energy"], "summary": "ChatGPT-maker OpenAI will lease a massive new US data centre for 20 years, backed by a US$105 billion financing commitment from Nvidia, per a regulatory filing published Aug 17. Built on a former Cold War-era uranium enrichment site in Ohio, it could grow to 8GW of capacity, the largest single AI data centre, running exclusively on Nvidia chips. SoftBank and owner SB Energy will invest over US$4 billion in local energy and build at least 10GW of new generation; Nvidia will add US$1.5 billion into SB Energy. Nvidia pushed back on \"circular financing\" fears, saying \"OpenAI will pay the lease.\" The project promises 35,000 construction jobs amid public hostility to power-hungry data centres, with over 70 per cent of Americans opposing nearby sites, AFP reported.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20ST/OpenAI%20to%20lease%20massive%20new%20AI%20data%20centre%20in%20US,%20backed%20by%20Nvidia.pdf"}, {"id": "st-12", "title": "Taiwan president says record defence spending is investment in peace", "source": "ST", "date": "18 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Taiwan plans record defence spending in 2027, with President Lai Ching-te describing his military budget proposal on Aug 17 as an investment in peace. The Cabinet unveils the budget on Aug 20, but Lai confirmed the overall defence budget would exceed NT$1 trillion (S$40 billion) for the first time, reaching NT$1.1225 trillion, above 3 per cent of GDP. The move comes as China ramps up military and political pressure and Washington presses Taipei to spend more. Lai said it \"demonstrates Taiwan's determination.\" China's military operates almost daily around Taiwan, honing coast-guard patrols off the east coast. Taiwan recently finished Han Kuang drills simulating breaking a Chinese blockade; Beijing called them a \"wasteful charade,\" according to Reuters.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20ST/Taiwan%20president%20says%20record%20defence%20spending%20is%20investment%20in%20peace.pdf"}, {"id": "st-13", "title": "Thai growth slows to 1.9% as energy prices counter stimulus", "source": "ST", "date": "18 Aug 2026", "tags": ["Southeast Asia", "Finance & Markets"], "summary": "Thailand's economic growth slowed sharply in the second quarter, lagging South-east Asian peers as higher energy prices countered stronger investment and government stimulus. GDP rose 1.9 per cent year-on-year in the three months through June, beating a 1.8 per cent median forecast but well below the first quarter's 2.8 per cent, the National Economic and Social Development Council said on Aug 17. On a seasonally adjusted quarterly basis, GDP contracted 0.2 per cent. Prime Minister Anutin Charnvirakul's government is using 400 billion baht of emergency borrowing for cash handouts and energy projects. Thailand, heavily reliant on Middle East oil and gas, was exposed to Iran-war supply disruptions. Vietnam led ASEAN at 8.39 per cent, aided by AI-linked supply chains, Bloomberg reported.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20ST/Thai%20growth%20slows%20to%201.9%20per%20cent%20as%20energy%20prices%20counter%20stimulus.pdf"}, {"id": "st-14", "title": "Trump envoy says Hamas disarmament could begin within 30 days", "source": "ST", "date": "18 Aug 2026", "tags": ["Geopolitics"], "summary": "US envoy Jared Kushner said on Aug 17 that progress toward disarming Hamas and advancing a Gaza peace plan could begin within a month after meeting Netanyahu, telling Fox News he hoped to start removing weapons \"in as little as 30 days.\" Kushner and Netanyahu agreed an American general would verify Hamas's disarmament, with no Israeli pullout until then. A senior official said no redeployment or reconstruction would occur before Hamas disarms throughout Gaza, supervised by the International Stabilization Force led by US Major General Jasper Jeffers. Netanyahu, facing an Oct 27 election, has defied Trump, including over halting the Iran war. Far-right minister Itamar Ben Gvir drew attention urging nightly Gaza killings. Israeli operations have killed at least 1,265 Palestinians since the ceasefire, AFP reported.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20ST/Trump%20envoy%20says%20Hamas%20disarmament%20could%20begin%20within%2030%20days.pdf"}, {"id": "st-15", "title": "Trump orders US-S. Korea military drills trimmed as he seeks to re-engage Pyongyang", "source": "ST", "date": "18 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Hours before South Korea and the US began a major combined military exercise on Aug 17, President Trump announced on Truth Social he was \"substantially\" reducing the drills, calling them costly and a \"totally inappropriate and hostile\" signal to an \"unthreatening and respectful\" North Korea. The move appears part of Trump's push to re-engage Pyongyang and revive diplomacy with Kim Jong Un, but analysts doubt Kim, now close to Moscow, would reciprocate. North Korea fired short-range missiles on Aug 6 and 12. South Korea's Defence Ministry said the current exercise, running to Aug 27, remains unaffected. Analysts warned Kim extracted a drill reduction without any reciprocal step, amid separate US trade pressure including a new 12.5 per cent tariff on South Korean goods, reports Straits Times journalist Wendy Teo.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20ST/Trump%20orders%20US-S.%20Korea%20military%20drills%20trimmed%20as%20he%20seeks%20to%20re-engage%20Pyongyang.pdf"}, {"id": "st-16", "title": "Trump says North Korea's Kim has responded to his overtures", "source": "ST", "date": "18 Aug 2026", "tags": ["Geopolitics"], "summary": "President Trump said on Aug 17 that North Korean leader Kim Jong Un had responded to his overtures, after Trump ordered the US to scale back military exercises with South Korea. Asked in the Oval Office why Kim had not responded, Trump answered \"He has,\" without details; White House officials and North Korea's UN mission did not immediately comment. Trump on Aug 16 instructed the Pentagon to \"substantially reduce\" the joint drills, citing cost and Seoul's refusal to act against Iran. Since the pair last met in 2019, North Korea has deepened ties with Russia, sending troops and missiles for its Ukraine war, while maintaining close China relations. Analysts including CSIS's Victor Cha said Kim would likely bide his time but another summit remained possible, Reuters reported.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20ST/Trump%20says%20North%20Korea's%20Kim%20has%20responded%20to%20his%20overtures.pdf"}, {"id": "bt-01", "title": "'Dim sum', 'panda', 'kangaroo': Why foreign borrowers are flocking to Asia-Pacific bond markets", "source": "BT", "date": "18 Aug 2026", "tags": ["Finance & Markets", "Trade"], "summary": "Foreign issuers are diversifying funding into once-niche Asia-Pacific bond markets amid record global borrowing. Commerzbank, Engie, Henkel, Singapore Airlines and Portugal's government sold their first Australian-dollar or yuan bonds this year. Foreign \"kangaroo\" issuance hit a record A$60 billion (US$42 billion) in 2026, up 40 per cent; onshore \"panda\" and offshore \"dim sum\" yuan sales reached records of about 160 billion yuan and 350 billion yuan in the first half, up over 60 per cent, per Goldman Sachs. Yen issuance by foreigners doubled, aided by Alphabet's record sale. Drivers include diversification away from the US dollar, lower China and Japan rates, and Beijing's currency internationalisation. Global syndicated bond sales topped US$4 trillion by late July.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/'Dim%20sum',%20'panda',%20'kangaroo'%20Why%20foreign%20borrowers%20are%20flocking%20to%20Asia-Pacific%20bond%20mar.pdf"}, {"id": "bt-02", "title": "Adoption is not capability - the real AI test for Singapore's SMEs", "source": "BT", "date": "18 Aug 2026", "tags": ["Technology & AI", "Southeast Asia"], "summary": "Singapore's strong AI-adoption numbers mask a shallow capability base, argues this AWS commentary ahead of Asean's Digital Economy Framework Agreement (Defa), expected to be signed by the bloc's 11 members in November. An AWS-commissioned study of 1,500 firms found three-quarters of financial-services SMEs use AI, but the writer's research found 60 per cent of firms would see AI work stall if one champion left. Value lands with domain experts, not engineers; a global hackathon was won by a cardiologist and a lawyer. About a third of firms still doubt AI output accuracy, per SBF's survey. AWS committed US$1 billion to embed \"forward deployed engineers\". Deeper capability transfer, not more tools, is the prerequisite for regional scaling under Defa.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/Adoption%20is%20not%20capability%20-%20the%20real%20AI%20test%20for%20Singapore's%20SMEs.pdf"}, {"id": "bt-03", "title": "Anthropic's revenue run rate tops US$65 billion: source", "source": "BT", "date": "18 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Anthropic's annual revenue run rate topped US$65 billion by the end of July, a person familiar said, underscoring the Claude creator's rapid growth ahead of a potential public listing later this year. The metric, which extrapolates current sales, was up from US$47 billion in May and about US$9 billion at end-2025. Anthropic is projecting 2028 revenue of roughly US$190 billion to US$200 billion, with its IPO valuation hinging on those forecasts, Reuters reported. Its Claude coding agent has drawn steady enterprise dollars. The firm confidentially filed for an IPO as it races rival OpenAI to market. Anthropic was valued at US$965 billion in May after a US$65 billion Series H round, more than double its US$380 billion February valuation.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/Anthropic's%20revenue%20run%20rate%20tops%20US65%20billion%20source.pdf"}, {"id": "bt-04", "title": "Asian refiners resist Saudi Aramco request to load oil at Red Sea port amid Houthi threat", "source": "BT", "date": "18 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "Some Asian refiners are pushing back against Saudi Aramco's request to collect crude at Yanbu on the Red Sea, given the difficulty of finding ships willing to sail the dangerous waterway after Houthi attacks on tankers. Yanbu became crucial after the war snarled Strait of Hormuz traffic. At least two Asian refiners asked to take September cargoes from Egypt's Mediterranean port of Sidi Kerir instead, while one may skip its monthly allocation over higher costs. Aramco asked Japanese and South Korean refiners to load at Sidi Kerir, but told most Chinese, Taiwanese and Indian processors to use Yanbu. For September, Aramco cut its main Asian crude price to the lowest since 2020, though buyers loading elsewhere pay more.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/Asian%20refiners%20resist%20Saudi%20Aramco%20request%20to%20load%20oil%20at%20Red%20Sea%20port%20amid%20Houthi%20threat.pdf"}, {"id": "bt-05", "title": "BHP reports better-than-expected profit on higher copper prices", "source": "BT", "date": "18 Aug 2026", "tags": ["Finance & Markets", "Energy"], "summary": "BHP Group posted a better-than-expected full-year underlying profit, fuelled by higher copper prices as the red metal cemented its lead over iron ore. Copper prices climbed to records above US$14,000 a tonne this year on AI data-centre buildout and clean-power demand. Copper, including byproducts, generated US$18.19 billion in operating earnings for the year ended June 30, surpassing iron ore's US$14.53 billion. Underlying attributable profit was US$13.20 billion, beating the US$12.66 billion consensus and up from US$10.16 billion a year earlier. BHP declared a US$1.72 full-year dividend, its highest in four years. New CEO Brandon Craig said copper demand should grow from 34 Mtpa today to over 50 Mtpa by 2050. Net debt fell to US$8.69 billion.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/BHP%20reports%20better-than-expected%20profit%20on%20higher%20copper%20prices.pdf"}, {"id": "bt-06", "title": "Bank of Japan should raise rates at every meeting, ex-currency chief says", "source": "BT", "date": "18 Aug 2026", "tags": ["Finance & Markets"], "summary": "The Bank of Japan should raise its benchmark rate at every meeting toward above 2 per cent to narrow the US rate gap and ease yen pressure, former vice-finance minister Takehiko Nakao said on TV Tokyo. He noted real rates remain negative even after the BOJ lifted its policy rate to 1 per cent, and said 2.25 to 2.5 per cent would not be unusual given inflation near 2 per cent. After holding in July, governor Kazuo Ueda flagged upside inflation risks; swaps priced a 79 per cent chance of a Sept 18 hike, with PM Takaichi's government supportive. The yen traded at 159.09 versus a four-decade low of 163.99 last month; 10-year yields hit 2.91 per cent. Japan holds US$1.2 trillion in reserves.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/Bank%20of%20Japan%20should%20raise%20rates%20at%20every%20meeting,%20ex-currency%20chief%20says.pdf"}, {"id": "bt-07", "title": "Bitcoin ETFs see largest outflow in six weeks as token stagnates", "source": "BT", "date": "18 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Spot Bitcoin exchange-traded funds recorded their largest outflows since late June, reversing a strong start to August. The 13 US-listed funds saw a net US$389.7 million drained in the week of Aug 10, after pulling in US$853.5 million the prior week, Bloomberg data showed. Early-August inflows, the biggest since April, followed a rare hack of Coldcard-branded cold wallets made by Coinkite, which renewed interest in safeguarding assets through traditional finance. Bitcoin languishes around US$63,000, down about 50 per cent from its October record, weighed by higher-rate risk and stalled US Clarity Act legislation. CertiK's Esme Pau said sentiment is \"cautious, bordering on pessimistic\". Bitcoin traded near US$63,400; its implied volatility index sat around 37, below the yearly average.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/Bitcoin%20ETFs%20see%20largest%20outflow%20in%20six%20weeks%20as%20token%20stagnates.pdf"}, {"id": "bt-08", "title": "China new home prices stagnant in July as demand stays weak", "source": "BT", "date": "18 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "China's new home prices were stagnant in July, underscoring challenges for a broad housing recovery as demand stayed subdued. New home prices fell 0.1 per cent month-on-month, matching June, while annual prices declined 3.2 per cent, slightly narrower than June's 3.3 per cent. Only 17 of 70 surveyed cities recorded monthly gains, reinforcing a \"K-shaped recovery\" said Centaline's Zhang Dawei. Tier-one prices were unchanged after June's 0.1 per cent rise; tier-two fell 0.1 per cent and tier-three dropped 0.3 per cent. The prolonged property slump has weighed on consumption and investment even as manufacturing and exports hold up. Separate data showed retail sales and industrial output slowing. Beijing further relaxed home-buying curbs in early August.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/China%20new%20home%20prices%20stagnant%20in%20July%20as%20demand%20stays%20weak.pdf"}, {"id": "bt-09", "title": "China's economy loses momentum in July as factory output, retail sales and investment all miss forecasts", "source": "BT", "date": "18 Aug 2026", "tags": ["Geopolitics", "Finance & Markets"], "summary": "China's economy started the second half sluggishly, reviving pressure on policymakers as output, consumption and investment all missed forecasts. Industrial production grew 4.5 per cent year-on-year in July, below the 5 per cent forecast; retail sales rose just 0.6 per cent. Fixed-asset investment fell 6.7 per cent over seven months, and the urban jobless rate climbed to 5.2 per cent. ING's Lynn Song called it \"a slate of disappointing data\". Weak domestic demand and extreme-weather disruptions compounded fiscal austerity; growth slid below the 4.5-5 per cent target in Q2. Real estate investment plunged 19.2 per cent, a record low, and passenger-vehicle sales fell 21 per cent. The data release was delayed five hours amid a Jiang Zemin centenary ceremony.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/China's%20economy%20loses%20momentum%20in%20July%20as%20factory%20output,%20retail%20sales%20and%20investment%20all.pdf"}, {"id": "bt-10", "title": "China's premier calls for stabilising external demand as growth sputters", "source": "BT", "date": "18 Aug 2026", "tags": ["Geopolitics", "Trade"], "summary": "China's Premier Li Qiang called for efforts to stabilise external demand and expand international trade cooperation as weak domestic demand weighs on growth and external risks loom. \"Insufficient domestic demand remains prominent,\" Li told a state council meeting, per Xinhua. The world's second-largest economy has relied on exports to offset a prolonged property crisis, leaving it vulnerable to trade frictions and the Middle East war. July data showed industrial output and retail sales slowing after Q2 growth cooled to a three-and-a-half-year low of 4.3 per cent, below the 4.5-5 per cent target. Booming exports of AI-related high-tech goods remained a key engine. Li pledged practical new policies, expanded domestic demand, and support for employment, income and infrastructure investment.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/China's%20premier%20calls%20for%20stabilising%20external%20demand%20as%20growth%20sputters.pdf"}, {"id": "bt-11", "title": "Economists raise full-year NODX growth forecasts after July's 24.2% rise", "source": "BT", "date": "18 Aug 2026", "tags": ["Trade", "Southeast Asia"], "summary": "Economists raised their full-year forecasts for Singapore's key exports, expecting AI-related demand to keep supporting electronics, even after July's NODX reading disappointed. Non-oil domestic exports grew 24.2 per cent year-on-year, extending June's 20.8 per cent and marking a fifth straight month of double-digit gains, but below the 26.5 per cent forecast. Electronics surged 112 per cent, led by disk media (339.1 per cent) and PCs; non-electronics fell 2.3 per cent. EnterpriseSG earlier lifted its 2026 forecast to 14-16 per cent; RHB raised its to 15.5 per cent and Maybank to 18 per cent, calling the AI buildout a \"durable tailwind\". Risks include a possible AI correction and the US's 12.5 per cent Section 301 tariff. NODX to the US jumped 62.8 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/Economists%20raise%20full-year%20NODX%20growth%20forecasts%20after%20July's%2024.2%20rise.pdf"}, {"id": "bt-12", "title": "Gold advances as US dollar pushes lower on easing Fed hike bets", "source": "BT", "date": "18 Aug 2026", "tags": ["Finance & Markets", "Energy"], "summary": "Gold extended a two-week advance as easing expectations for further US Federal Reserve rate hikes pressured the dollar, making bullion cheaper. The metal rose as much as 1.1 per cent to around US$4,425 an ounce, with a dollar gauge at its lowest since May. Swaps no longer fully price another 2026 hike; \"markets don't believe the Fed is truly hawkish,\" said Global X ETFs' Justin Lin. Renewed investor demand and central-bank buying, notably from China, helped gold reclaim US$4,000. Bullion topped its 100-day moving average for the first time since April. Middle East violence kept tightening risk alive after Trump signalled no hurry to end the Iran war. Silver rose 2.5 per cent to US$66.33; platinum and palladium advanced.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/Gold%20advances%20as%20US%20dollar%20pushes%20lower%20on%20easing%20Fed%20hike%20bets.pdf"}, {"id": "bt-13", "title": "Gold, silver, platinum and palladium: What Singapore investors should know about these precious metals", "source": "BT", "date": "18 Aug 2026", "tags": ["Finance & Markets"], "summary": "This explainer maps the diverging characteristics of gold, silver, platinum and palladium after sharp 2026 swings driven by rate expectations and geopolitics. Gold hit a record US$5,589.38 on Jan 28, slipped below US$4,000 in July, then rebounded to US$4,400 on Aug 12. Analysts see gold with the strongest upside on central-bank buying and de-dollarisation, and OCBC expects gold and silver above US$4,600 and US$60 by H1 2027. Silver, near US$65, is more industrial and cheaper by the gold-silver ratio of around 81. Platinum fell about 39 per cent to US$1,750 and palladium to US$1,334, both supply-concentrated in Russia and South Africa. Experts including eToro's Josh Gilbert and Saxo's Charu Chanana question owning all four given high correlations.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/Gold,%20silver,%20platinum%20and%20palladium%20What%20Singapore%20investors%20should%20know%20about%20these%20prec.pdf"}, {"id": "bt-14", "title": "Greenback slips to lowest since early June as rate hike bets fade", "source": "BT", "date": "18 Aug 2026", "tags": ["Finance & Markets"], "summary": "The US dollar fell to its lowest in more than two months on Monday as traders trimmed rate-hike bets amid softer economic data, leaving the euro at two-month highs and the battered yen firmer. The yen strengthened 0.13 per cent to about 159.15 per dollar, shrugging off weak Japanese growth data; the euro hit around US$1.1614. Traders now see just a 30.6 per cent chance of a September Fed hike, down from 52.2 per cent a week ago, per CME FedWatch. Markets await the Fed's Jackson Hole symposium. \"Ask 10 people about Fed policy, you'll get 20 answers,\" said Jefferies' Thomas Simons. The dollar hit its weakest versus the yuan since 2023 as China data softened; Brent rose to about US$89.07 amid the Middle East stalemate.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/Greenback%20slips%20to%20lowest%20since%20early%20June%20as%20rate%20hike%20bets%20fade.pdf"}, {"id": "bt-15", "title": "How Singapore can outsmart AI age bias and redesign work for longevity", "source": "BT", "date": "18 Aug 2026", "tags": ["Technology & AI", "Society"], "summary": "This commentary argues Singapore should use AI-driven hiring's age-bias risk to rebuild its talent system for a multi-generational, AI-augmented economy. Nearly 40 per cent of the resident workforce is aged 50 and above, while AI recruitment tools screen candidates using proxies such as graduation year and \"digital-native\" language that correlate with age. US litigation has alleged such tools disadvantage applicants over 40. First-quarter MOM data showed residents aged 50-59 had the highest retrenchment incidence, at 3.1 per 1,000. Citing lessons from British coal-mine mechanisation and IBM's skills-based shift, the writer proposes five shifts: skills-based screening, human final judgment, disparate-impact audits, age-inclusive fair-hiring rules, and multi-generational team design. Singapore raised re-employment ages to 69 and passes the Workplace Fairness Act by end-2027.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/How%20Singapore%20can%20outsmart%20AI%20age%20bias%20and%20redesign%20work%20for%20longevity.pdf"}, {"id": "bt-16", "title": "Iran threatens 'full offensive' in Hormuz if diplomacy with US fails; Trump rejects truce extension", "source": "BT", "date": "18 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Iran will shift to a \"fully offensive\" military posture as talks to end its war with the US have stalled, a senior Iranian official told Reuters, while Washington ruled out extending a ceasefire. A June memorandum gave both sides until Monday to reach a deal, but it unravelled over control of the Strait of Hormuz, through which a fifth of global oil once flowed. Trump said he would not extend the interim pact and threatened to \"bomb\" ally Oman if it \"got in the way\" of strait negotiations. Media reports said Trump opened back-channel talks with the IRGC. Thousands have died since the US and Israel attacked Iran on Feb 28. Brent, which peaked at US$126, edged up to about US$89; Houthis attacked vessels in Bab el-Mandeb.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/Iran%20threatens%20'full%20offensive'%20in%20Hormuz%20if%20diplomacy%20with%20US%20fails%20Trump%20rejects%20truce%20e.pdf"}, {"id": "bt-17", "title": "Meta faces potential penalty of up to US$1.4 trillion as landmark social media trial begins", "source": "BT", "date": "18 Aug 2026", "tags": ["Technology & AI", "Society"], "summary": "Meta heads to federal court in Oakland on Tuesday for a jury trial against a coalition of state attorneys general alleging it deliberately designed Facebook and Instagram to encourage compulsive use among young users. The top legal officers of 29 states seek massive penalties and orders to change how Meta operates. Fines run up to US$20,000 per violation; by Meta's own reckoning, a loss could mean up to US$1.4 trillion, near its market value, though California put the figure closer to US$193 billion. Meta denies the claims, calling them an \"outlandish payout\". The jury is advisory; Judge Yvonne Gonzalez Rogers decides liability. States want addictive features like infinite scroll removed. The trial follows a nearly US$1 billion New Mexico ruling.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/Meta%20faces%20potential%20penalty%20of%20up%20to%20US1.4%20trillion%20as%20landmark%20social%20media%20trial%20begins.pdf"}, {"id": "bt-18", "title": "National Australia Bank's Q3 cash earnings rise as lower impairments offset slower home lending", "source": "BT", "date": "18 Aug 2026", "tags": ["Finance & Markets"], "summary": "National Australia Bank reported a slight rise in third-quarter cash earnings, driven by lower credit-impairment charges and lending-volume growth. The country's top business lender posted cash earnings of A$1.83 billion (US$1.30 billion) for the three months ended June 30, 2 per cent above the prior two quarters' average. NAB logged a 15 per cent quarter-on-quarter drop in Australian home-loan applications, reflecting subdued demand after tax reforms aimed at housing affordability. CEO Andrew Irvine cited the Middle East conflict, higher rates and Federal Budget tax changes as customer headwinds. Net interest margin was 1.79 per cent, and the CET1 ratio slipped to 11.93 per cent. NAB closed a bank earnings season marked by anxiety over scrapped property-investment tax concessions; the \"Big Four\" all reported double-digit application slowdowns.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/National%20Australia%20Bank's%20Q3%20cash%20earnings%20rise%20as%20lower%20impairments%20offset%20slower%20home%20le.pdf"}, {"id": "bt-19", "title": "Oil settles up over US$2 as Iran war stalemate stokes supply concerns", "source": "BT", "date": "18 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "Oil prices rose on Tuesday as a Middle East peace deal looked further away, with Iran adopting a more offensive stance and the US ruling out extending a ceasefire, heightening supply worries. Brent climbed 27 cents to US$91.14, after hitting its highest since Jul 30; WTI rose 42 cents to US$85.04. Both contracts gained more than 5 per cent last week following tanker attacks. Only five commodity vessels transited the Strait of Hormuz on Saturday, with none Sunday, versus 31 the prior weekend, Kpler data showed. Yemen's Houthis attacked a Saudi military ship and escorts in the Red Sea. KCM's Tim Waterer flagged the \"dual chokehold\" on Hormuz and Bab el-Mandeb. Iran nears a strait deal with Oman, which Trump threatened to bomb.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/Oil%20settles%20up%20over%20US2%20as%20Iran%20war%20stalemate%20stokes%20supply%20concerns.pdf"}, {"id": "bt-20", "title": "Sembcorp says potential IPO of Indian renewable unit remains preliminary", "source": "BT", "date": "18 Aug 2026", "tags": ["Energy", "Finance & Markets"], "summary": "Sembcorp Industries said \"no definitive decision\" has been made on a potential IPO of any business unit, responding to reports on a listing of its Indian renewable arm, Sembcorp Green Infra. Bloomberg reported the offering could raise as much as US$500 million, with draft documents possibly submitted as early as August. Sembcorp said it regularly reviews strategic options but stressed any evaluation remains preliminary, urging investors not to rely on speculation. If it proceeds, it would be Green Infra's second listing attempt after a withdrawn 2018 filing. The unit ranks among India's 10 largest renewable independent power producers, with over 75 assets across 18 states and 7.6 gigawatts installed or under development. India is a key growth market; Sembcorp acquired ReNew Sun Bright in December 2025.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/Sembcorp%20says%20potential%20IPO%20of%20Indian%20renewable%20unit%20remains%20preliminary.pdf"}, {"id": "bt-21", "title": "Shipping slows through Strait of Hormuz after tanker attacks, data shows", "source": "BT", "date": "18 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "Shipping through the Strait of Hormuz slowed sharply over the weekend following attacks on tankers, while US-Iran talks stalled, Kpler data showed. Five commodity vessels transited the strait on Saturday, with none registered for Sunday, versus 31 the prior weekend. Ships that passed included an empty Very Large Crude Carrier with its transponder off and an Indian-flagged gas carrier using the Iranian route. Traffic ground to a near-standstill after the UAE said three Adnoc-operated vessels were attacked; Washington said it could maintain an indefinite naval blockade. The figures are far below the 130-plus daily transits before the war. Foreign Minister Abbas Araqchi said shipping resumes only if the US meets Iran's strait conditions. Bab el-Mandeb saw 49 weekend transits, with no tracked Saudi oil shipments.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/Shipping%20slows%20through%20Strait%20of%20Hormuz%20after%20tanker%20attacks,%20data%20shows.pdf"}, {"id": "bt-22", "title": "Should SGX follow Hong Kong's lead on longer trading hours?", "source": "BT", "date": "18 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "This commentary weighs whether the Singapore Exchange should scrap its lunch break in response to the Hong Kong Stock Exchange's proposal for continuous trading from 9am to close. It recalls that SGX removed its 90-minute lunch break in 2011 for continuous trading, then reinstated a one-hour break in 2017 after brokers found the longer day demanding and retail investors saw few benefits. While Hong Kong's move would align it with London and New York and aid price discovery, the writer argues longer hours are not an objective in themselves. SGX's real challenge is liquidity, which is unrelated to opening hours; extended trading could spread orders thinly while raising brokerage costs. A public consultation is urged, since listing quality and governance matter more than lunch closures.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/Should%20SGX%20follow%20Hong%20Kong's%20lead%20on%20longer%20trading%20hours.pdf"}, {"id": "bt-23", "title": "Singapore business sentiment recovers in Q2, outlook still cautious: SBF poll", "source": "BT", "date": "18 Aug 2026", "tags": ["Southeast Asia", "Finance & Markets"], "summary": "Singapore business confidence improved slightly in the second quarter as cost pressures eased, a Singapore Business Federation poll of over 500 firms showed. The Business Sentiment Index rose two points to 53.3 for April-June, nearly reversing Q1's 2.1-point dip, though the reading still signals neutral sentiment with limited expansion. SBF credited resilient domestic growth, AI investment and a more moderate Middle East fallout. Banking, insurance and health services were most upbeat; retail, education and wholesale trade least optimistic. The cost expectations index fell to 71.2 from 75.9, and the hiring outlook edged up to 56.3, though IT hiring sentiment fell for a second straight quarter. Singapore's Q2 GDP grew 5.9 per cent. Some 32 per cent of firms expect conditions to worsen, down from 41 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/Singapore%20business%20sentiment%20recovers%20in%20Q2,%20outlook%20still%20cautious%20SBF%20poll.pdf"}, {"id": "bt-24", "title": "Singapore's financial sector must resist risk aversion, be bolder to stay at cutting edge: former DBS chief Piyush Gupta", "source": "BT", "date": "18 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Singapore's financial sector must keep innovating and avoid becoming risk-averse to stay ahead, banking veteran Piyush Gupta said at the launch of his book at NUS. The former DBS chief warned that the city-state's success makes it easy to \"focus too much on stability\", but the extraordinary pace of change demands boldness \"as we were in the 1960s and 70s\". He said \"trust is the product\" in finance, praising Singapore's balance of innovation and stability. Minister Chee Hong Tat, also MAS deputy chairman, urged calculated risk-taking, citing the Global Listing Board and the S$6.5 billion Equity Market Development Programme. Noting Hong Kong's lead on fiat-backed digital currencies, Gupta recommended Singapore explore a Singapore dollar-backed stablecoin. \"The future is ours for the taking,\" he said.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/Singapore's%20financial%20sector%20must%20resist%20risk%20aversion,%20be%20bolder%20to%20stay%20at%20cutting%20edge.pdf"}, {"id": "bt-25", "title": "Singapore, China ink deal on peaceful nuclear technology cooperation", "source": "BT", "date": "18 Aug 2026", "tags": ["Energy", "Southeast Asia"], "summary": "Singapore's Ministry of Trade and Industry signed a memorandum of understanding with the China Atomic Energy Authority to cooperate on peaceful uses of nuclear technology. The agreement, signed on Aug 17, supports developing capabilities to assess deploying nuclear energy. It was signed by MTI Permanent Secretary Augustin Lee and CAEA vice-chairman Liu Jing, witnessed by Minister Tan See Leng and CAEA chairman Shan Zhongde. Partnership areas include safety and technical assessments of reactor technologies, manpower training, public education, nuclear safeguards and security, and nuclear technology applications. The MOU adds to Singapore's engagements with the US, France and South Korea, and will feed into preparations for the International Atomic Energy Agency's Integrated Nuclear Infrastructure Review Phase 1 Mission, set for 2027.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/Singapore,%20China%20ink%20deal%20on%20peaceful%20nuclear%20technology%20cooperation.pdf"}, {"id": "bt-26", "title": "Stocks to watch: Straits Trading, OUE, Hotel Properties", "source": "BT", "date": "18 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Several Singapore-listed companies posted developments that may affect trading. Straits Trading narrowed its first-half net loss to S$11.1 million, from S$40.8 million a year earlier, on stronger resources-segment performance and the absence of a prior remeasurement loss on exchangeable bonds; H1 revenue rose 49.5 per cent to S$400 million. OUE swung to a S$114.6 million loss, from a S$35.6 million profit, after a S$47 million impairment on its Hong Kong-headquartered Gemdale Properties investment, though revenue rose 5.3 per cent to S$308.3 million. Hotel Properties posted a S$39.1 million net loss, from an S$11.4 million profit, as Middle East conflict disrupted air travel and lifted airfares; revenue slipped 1.9 per cent to S$371.1 million. Counters closed flat or little changed before the results.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/Stocks%20to%20watch%20Straits%20Trading,%20OUE,%20Hotel%20Properties.pdf"}, {"id": "bt-27", "title": "Thai baht rally may fade on dovish central bank, analysts say", "source": "BT", "date": "18 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "A nascent Thai baht rally may prove short-lived as the central bank keeps a dovish stance to support an economy hit by elevated oil prices, analysts said. The baht has strengthened 0.9 per cent in August, the region's second-best performer, but BNP Paribas sees it dipping to 33.50 per US dollar by end-2026, and MUFG expects a 4 per cent slide to 34.4 in Q4 as higher oil weighs on trade. Thailand's current account swung to a US$17.7 billion deficit from a US$1.4 billion surplus on costlier energy imports. The Bank of Thailand is expected to hold at 1 per cent, emerging Asia's lowest, on Aug 26. Fiscal concerns mount over a US$12 billion borrowing plan, with Kasikornbank's Kobsidthi Silpachai citing a \"twin deficit problem\".", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/Thai%20baht%20rally%20may%20fade%20on%20dovish%20central%20bank,%20analysts%20say.pdf"}, {"id": "bt-28", "title": "Thailand revises factory gauge after US transhipment concerns", "source": "BT", "date": "18 Aug 2026", "tags": ["Trade", "Southeast Asia"], "summary": "Thailand is overhauling a key factory-output measure after US officials cited a widening gap between surging exports and declining domestic production as possible evidence of tariff-dodging transhipment. Exports jumped 20.8 per cent in June, a fourth straight double-digit gain, even as the Manufacturing Production Index contracted 3.1 per cent. Thai officials reject the transhipment claim, arguing the MPI is outdated and fails to capture fast-growing semiconductor and electronics output tied to the AI boom. \"This has become our weak spot in the tariff negotiations,\" said planning chief Danucha Pichayanan, with a revision sought by September. Manufacturing is about a quarter of GDP and employs over 6.2 million. Officials plan to rebase the index to 2024 from 2021 to better reflect newer AI-linked industries.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/Thailand%20revises%20factory%20gauge%20after%20US%20transhipment%20concerns.pdf"}, {"id": "bt-29", "title": "Thailand's Q2 GDP beats forecast as full-year outlook is raised", "source": "BT", "date": "18 Aug 2026", "tags": ["Southeast Asia", "Finance & Markets"], "summary": "Thailand's economy slowed in the second quarter but beat forecasts, with stronger private investment offsetting softer consumption and lower public investment, prompting the government to raise its outlook. GDP expanded 1.9 per cent year-on-year in April-June, above the 1.7 per cent forecast, while the planning agency lifted full-year growth to 2-2.5 per cent from 1.5-2.5 per cent. Q2 was \"hit quite hard by the conflict in the Middle East\", said agency chief Danucha Pichayanan, who expects stronger Q3 growth. On a quarterly basis, the economy shrank 0.2 per cent. The agency raised its 2026 export forecast to 15.1 per cent and kept tourism at 32 million arrivals. High household debt and living costs weighed on spending. The central bank, at 1 per cent, next reviews rates on Aug 26.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/Thailand's%20Q2%20GDP%20beats%20forecast%20as%20full-year%20outlook%20is%20raised.pdf"}, {"id": "bt-30", "title": "US to announce steps to help refiners produce more fuel, energy chief Wright says", "source": "BT", "date": "18 Aug 2026", "tags": ["Energy", "Politics"], "summary": "US Energy Secretary Chris Wright said Washington will announce steps within days to help refiners boost fuel output, as President Trump seeks to rein in high petrol prices that spiked during the US-Israeli war on Iran. Speaking in Midland, Texas, Wright said US refineries are running at record rates while Middle East refineries are turned down, and called increasing refinery output the key to lowering prices. Average US regular petrol tops US$4.06 a gallon, nearly 30 per cent higher than a year ago, a risk for Republicans in November's midterms. Trump has said paying more is worth preventing Iran from getting a nuclear weapon. Wright said 30 ships transited Hormuz over the weekend and Iran \"can't export any oil right now\", adding Trump is \"playing the long game\".", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20BT/US%20to%20announce%20steps%20to%20help%20refiners%20produce%20more%20fuel,%20energy%20chief%20Wright%20says.pdf"}, {"id": "scmp-01", "title": "AI chipmaker Biren projects up to 22-fold revenue surge amid China's hi-tech boom", "source": "SCMP", "date": "18 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Chinese GPU maker Biren Technology projects first-half 2026 revenue of 1.15 billion to 1.3 billion yuan (US$170.5 million-plus), a year-on-year jump of 1,852 to 2,107 per cent, as demand for home-grown AI chips surges. Net loss is expected to narrow to 320-400 million yuan from 1.6 billion yuan. Biren, listed in Hong Kong in January, cited accelerating commercialisation of general-purpose GPUs and a low 2025 baseline. Peers echoed the boom: Hygon posted 66.5 per cent revenue growth and Cambricon a 108 per cent surge. Biren shares rose 5.1 per cent to HK$38.28. Sinolink's Liu Gaochang warned weaker entrants could face pricing pressure as competition and government support intensify.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20SCMP/AI%20chipmaker%20Biren%20projects%20up%20to%2022-fold%20revenue%20surge%20amid%20China's%20hi-tech%20boom.pdf"}, {"id": "scmp-02", "title": "Alibaba sells gaming arm Lingxi Games as tech giant sharpens focus on AI and e-commerce", "source": "SCMP", "date": "18 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Alibaba has agreed to sell its wholly owned gaming business Lingxi Games to Trustar Capital, the private equity arm of Citic Capital, as it pivots toward e-commerce, cloud and AI, per an internal letter signed by Lingxi CEO Zhou Bingshu. Terms were undisclosed, though the Wall Street Journal valued the studio at more than US$1.5 billion. The sale extends Alibaba's exit from noncore assets including Sun Art Retail and Intime. Lingxi, established as a brand in 2019, is led by strategy game Three Kingdoms Tactics, which had generated over US$1 billion in player spending by early 2021. Rival ByteDance sold studio Moonton to Saudi-backed Savvy Games for over US$6 billion in March. Alibaba owns the SCMP.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20SCMP/Alibaba%20sells%20gaming%20arm%20Lingxi%20Games%20as%20tech%20giant%20sharpens%20focus%20on%20AI%20and%20e-commerce.pdf"}, {"id": "scmp-03", "title": "America is arguing over the wrong AI obstacle", "source": "SCMP", "date": "18 Aug 2026", "tags": ["Technology & AI", "Politics"], "summary": "This opinion piece argues that sluggish US AI adoption stems from management failures, not overregulation, and that restricting access to frontier models is no defence against open-source Chinese rivals. After Moonshot's Kimi K3 and Alibaba's Qwen3.8-Max launched, global chip stocks shed about US$3 trillion, repricing the assumption that top systems stay expensive, American and controllable. The US has no comprehensive federal AI statute; barriers are institutional, such as siloed patient records and slow procurement. Firms worldwide can download open-weight Chinese models and run them locally, keeping data at home. Echoing Jensen Huang, the author says advantage goes to whoever reorganises around the technology fastest, warning blanket containment \"buys time nobody is using\".", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20SCMP/America%20is%20arguing%20over%20the%20wrong%20AI%20obstacle.pdf"}, {"id": "scmp-04", "title": "CXMT value tops 4 trillion yuan as AI-fuelled memory rally lifts China's chip champion", "source": "SCMP", "date": "18 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Shares of ChangXin Memory Technologies (CXMT), China's leading DRAM maker, jumped 12 per cent Monday to a record 61.80 yuan (US$9.16), lifting its market value to 4.13 trillion yuan and cementing its status as China's most valuable listed company, ahead of Tencent. The rally was largely sector-driven after SanDisk surged nearly 30 per cent and reinforced expectations that AI demand will keep memory supplies tight. Bernstein said AI was shifting from \"compute-centric\" to \"memory-centric\" architecture. UBS initiated coverage with a Buy and 70 yuan target, expecting global DRAM undersupply until at least Q2 2028. CXMT's first-quarter revenue jumped 719 per cent year on year to 50.8 billion yuan, with net profit of 24.8 billion yuan.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20SCMP/CXMT%20value%20tops%204%20trillion%20yuan%20as%20AI-fuelled%20memory%20rally%20lifts%20China's%20chip%20champion.pdf"}, {"id": "scmp-05", "title": "Can China follow its own 'technological path' amid growing AI rivalry with US?", "source": "SCMP", "date": "18 Aug 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "Analyst Zheng Yongnian, dean at the Chinese University of Hong Kong (Shenzhen), argues China's ability to set its own technological course under sustained US export restrictions may be decisive in the AI contest. Writing in the preface to a book on Huawei's Atlas 950 SuperPoD, he says true autonomy is not just \"having chips\" but \"having the ability to define the technological path\". He frames competition over chips, computing power and AI infrastructure as shifting from economic to security logic, identifying three needs: control of foundational hardware, ability to organise developer ecosystems, and capacity to set standards. He warns China's state-mobilised model may struggle with \"unknown problems\" and stresses continuous breakthroughs over single wins.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20SCMP/Can%20China%20follow%20its%20own%20'technological%20path'%20amid%20growing%20AI%20rivalry%20with%20US.pdf"}, {"id": "scmp-06", "title": "China's first-tier new home prices flat in July, ending 4-month rebound", "source": "SCMP", "date": "18 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "New home prices in China's four first-tier cities were flat on average in July from June, ending a four-month rebound, as seasonal headwinds and an unusually rainy summer weighed. Shanghai and Shenzhen rose 0.2 per cent and Guangzhou 0.1 per cent, while Beijing fell 0.3 per cent. Among 70 cities tracked, 23 saw month-on-month increases or flat readings, two more than June. Second-tier prices slipped 0.1 per cent. Year on year, first-tier prices fell 1.1 per cent, narrowing the decline; Shanghai was the only first-tier city with a gain, up 3 per cent. HSBC's Michelle Kwok expects a robust September-October peak season, citing resilient luxury demand and healthy secondary-market liquidity as supports.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20SCMP/China's%20firsttier%20new%20home%20prices%20flat%20in%20July,%20ending%204month%20rebound.pdf"}, {"id": "scmp-07", "title": "China's pharma contractors rally as US supply chain pressures face industry resistance", "source": "SCMP", "date": "18 Aug 2026", "tags": ["Finance & Markets", "Trade"], "summary": "China's pharmaceutical contractors are showing resilience against Washington's push to curb reliance on Chinese supply chains, as industry players resist giving up China's cost advantages. WuXi AppTec shares gained 3 per cent Monday to a record HK$203.40, while Genscript Biotech rose 4.8 per cent. Genscript posted adjusted net profit of US$62.52 million for the six months to June 30, a 203 per cent year-on-year surge, driven by AI-driven drug discovery demand, and raised full-year life-science guidance to 25-30 per cent growth. WuXi AppTec, added to the Pentagon's 2026 Section 1260H list, won a preliminary injunction in August blocking the designation; its interim net profit rose 33.7 per cent to 11.08 billion yuan. Macquarie called WuXi \"too big to ban\".", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20SCMP/China's%20pharma%20contractors%20rally%20as%20US%20supply%20chain%20pressures%20face%20industry%20resistance.pdf"}, {"id": "scmp-08", "title": "Chinese hedge funds rotate out of Nvidia and US hyperscalers in evolving AI trade", "source": "SCMP", "date": "18 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "China's biggest hedge funds cut US hyperscaler and Nvidia holdings in the second quarter, rotating into AI hardware makers, per 13F filings. Perseverance Asset slashed its Nvidia position 72 per cent while adding Micron and SanDisk; it also liquidated Nio, Xpeng and Futu Holdings. Greenwoods cleared Nvidia, Meta and Amazon and trimmed Alphabet 38 per cent, building a new ASML stake. Oriental Harbor exited Meta and pared Amazon and Nvidia, piling into SanDisk and doubling Micron. Micron shares surged 242 per cent in the quarter and SanDisk 256 per cent, while Nvidia rose just 15 per cent. SPI's Stephen Innes said \"this is the point where the AI trade begins growing up\", with focus shifting to who earns economic rent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20SCMP/Chinese%20hedge%20funds%20rotate%20out%20of%20Nvidia%20and%20US%20hyperscalers%20in%20evolving%20AI%20trade.pdf"}, {"id": "scmp-09", "title": "Claims Hegseth 'on verge of losing job' raise questions about future US-China defence ties", "source": "SCMP", "date": "18 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Multiple sources say Pentagon chief Pete Hegseth is \"on the verge of losing his job\", citing the stalled Iran war and negative reports, including concerns over the USS Abraham Lincoln crew after nine months at sea. Sources say a lack of breakthrough on Iran angered President Trump. The speculation comes as US-China defence ties have improved since the May Beijing summit, described as the best in over a decade. Fudan's Zhao Minghao said Hegseth's removal could affect military communication, but US sources said his exit need not derail ties, noting Elbridge Colby has been the point man for talks. Analysts expect continuity if Colby stays, with military-to-military relations likely on the agenda for Xi's expected Washington visit next month.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20SCMP/Claims%20Hegseth%20'on%20verge%20of%20losing%20job'%20raise%20questions%20about%20future%20US-China%20defence%20ties.pdf"}, {"id": "scmp-10", "title": "EU plans most far-reaching sanctions on Russia in coming months", "source": "SCMP", "date": "18 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "EU foreign policy chief Kaja Kallas told Die Welt she will propose the most far-reaching sanctions listings against Russia since the start of its war in Ukraine, saying measures have already deprived Russia's war machine of over EUR1 trillion (US$1.16 trillion). Once adopted, they would raise the total number of sanctioned Russian entities by a third. Diplomatic sources said the European External Action Service would propose about 1,600 individuals and entities tied to Moscow's military-industrial complex, using travel bans, transaction bans and asset freezes; the EU has already listed nearly 3,000. The list is expected to be presented in early September for adoption in October, without sectoral measures to speed unanimous approval. Further listings target child trafficking and hybrid activities.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20SCMP/EU%20plans%20most%20far-reaching%20sanctions%20on%20Russia%20in%20coming%20months.pdf"}, {"id": "scmp-11", "title": "Foreign capital is dipping its toes into China's property sector. Is a rebound in store?", "source": "SCMP", "date": "18 Aug 2026", "tags": ["Finance & Markets", "Trade"], "summary": "A wave of deals by foreign funds is injecting liquidity into China's strained property sector, from malls to logistics. Global asset manager PAG acquired three Wanda Plaza properties in June and July as cash-strapped Dalian Wanda offloads assets. Five years after the Evergrande crisis, renewed \"smart money\" activity has raised hopes of an inflection point. Savills' James Macdonald said investors see valuations adjusted enough for favourable risk-adjusted returns, not necessarily calling the bottom. Blackstone, KKR, CapitaLand and AEW remain active. National industrial and logistics transactions reached 58.5 billion yuan in the year to March 15, up 19.3 per cent. Analysts stress foreign interest reflects confidence in specific assets, not a broad recovery, with the residential market on a separate track.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20SCMP/Foreign%20capital%20is%20dipping%20its%20toes%20into%20China's%20property%20sector.%20Is%20a%20rebound%20in%20store.pdf"}, {"id": "scmp-12", "title": "Hong Kong exchange extends CEO Bonnie Chan's term for 3 more years", "source": "SCMP", "date": "18 Aug 2026", "tags": ["Finance & Markets"], "summary": "Hong Kong Exchanges and Clearing (HKEX) has extended CEO Bonnie Chan Yiting's tenure by three years, from March 1, 2027 to February 28, 2030, amid a push to boost international competitiveness. Chairman Carlson Tong praised her for strengthening Hong Kong's role as a financial centre. Chan, 57, the first woman to lead the bourse, was appointed in March 2024. HKEX reclaimed the top global IPO spot in 2025 with 114 companies raising US$37.22 billion, a 229 per cent jump. In the first half of 2026, it hosted 87 IPOs and raised HK$210.2 billion (US$26.8 billion), up 92 per cent, though it trailed Nasdaq after SpaceX's June listing. Under Chan, HKEX has pushed reforms including confidential filings and extended trading hours.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20SCMP/Hong%20Kong%20exchange%20extends%20CEO%20Bonnie%20Chan's%20term%20for%203%20more%20years.pdf"}, {"id": "scmp-13", "title": "Hong Kong firm bets on Chinese open-weight models to rival CoreWeave", "source": "SCMP", "date": "18 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "New Hong Kong-based \"neo-cloud\" provider Antimatter is helping businesses shift from US frontier AI models to Chinese open-weight ones, promising lower costs and greater data sovereignty. CMO Queenie Chan said inquiries are coming from the Middle East and Europe. Established in May by US energy firm Data Factory, French operator PoliCloud and Swiss platform HiveNet, Antimatter targets the neo-cloud sector led by CoreWeave and Nebius. It helped a French accounting firm deploy Alibaba's Qwen models on French infrastructure, cutting AI costs 40 per cent. It aims to deploy 100 data centres with over 40,000 GPUs by year-end, scaling to 1,000 by 2030, and expects revenue to reach EUR1 billion in 2028. It is raising EUR300 million in equity. Alibaba owns the SCMP.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20SCMP/Hong%20Kong%20firm%20bets%20on%20Chinese%20open-weight%20models%20to%20rival%20CoreWeave.pdf"}, {"id": "scmp-14", "title": "Hong Kong tax reforms for treasury centres will lure multinationals, mainland firms: PwC", "source": "SCMP", "date": "18 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "Hong Kong's plan to boost tax incentives for corporate treasury centres will attract multinationals and mainland firms, PwC tax experts said. The government is soliciting comment until September 4, with a bill due at the Legislative Council in the first half of 2027. A corporate treasury centre acts as an internal bank managing group cash flows and financing. The proposed two-tier system offers smaller firms a 50 per cent tax deduction, while tier two gives a five-year pre-approval for large companies with at least HK$100 million revenue and six subsidiaries, spending over HK$4 million yearly. Hong Kong is competing with Singapore and Dubai. Central state-owned enterprises hold nearly 8 trillion yuan (US$1.1 trillion) in overseas assets; China Mobile and others have set up centres in the city.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20SCMP/Hong%20Kong%20tax%20reforms%20for%20treasury%20centres%20will%20lure%20multinationals,%20mainland%20firms%20PwC.pdf"}, {"id": "scmp-15", "title": "Is Hong Kong's property market recovery running out of gas? UBS flags 4 risks", "source": "SCMP", "date": "18 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "UBS forecasts Hong Kong's property recovery will moderate, with home prices likely flat in the second half and in 2027 and rental growth slowing from 2028. Analyst Mark Leung said the market has yet to price four risks: AI disruption to jobs, slower population inflows, deepening Greater Bay Area integration, and new supply in the Northern Metropolis. AI has cut graduate job opportunities by over 70 per cent since 2023, lifting youth unemployment. Net population inflow averaged just 32,000 a year in 2023-2025, far below the 153,000 needed for the 2042 planning target. Secondary prices fell up to 28.4 per cent from their September 2021 peak before recovering 13.4 per cent. JLL is more upbeat, forecasting stable prices on steady mainland demand.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20SCMP/Is%20Hong%20Kong's%20property%20market%20recovery%20running%20out%20of%20gas%20UBS%20flags%204%20risks.pdf"}, {"id": "scmp-16", "title": "Job losses mount in German automotive sector as challenge from China intensifies", "source": "SCMP", "date": "18 Aug 2026", "tags": ["Trade", "Geopolitics"], "summary": "Germany's automotive industry shed 42,300 jobs in the year to June, a 5.8 per cent decline sending employment to its lowest since 2005, as carmakers grappled with falling China profits and Chinese competition in Europe. Manufacturing overall lost 144,100 jobs. Volkswagen reported a roughly 30 per cent first-half profit drop and Mercedes-Benz cut its sales forecast, both citing weak China demand. The German Economic Institute's Thomas Puls cited overcapacity and the EV shift, with plants at about 30 per cent excess capacity. Citi analysts said Chinese carmakers could capture 15-30 per cent of Europe's market by 2035. The Federation of German Industries warned of a \"China shock 2.0\". The main lobby expects 225,000 jobs lost by 2035 versus 2019.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20SCMP/Job%20losses%20mount%20in%20German%20automotive%20sector%20as%20challenge%20from%20China%20intensifies.pdf"}, {"id": "scmp-17", "title": "Nvidia to provide up to US$105 billion guarantee for OpenAI's Ohio data centre", "source": "SCMP", "date": "18 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Nvidia has agreed to provide a guarantee of up to US$105 billion to help OpenAI lease a sprawling Ohio data centre being developed by SoftBank-backed SB Energy, one of the chipmaker's largest infrastructure financing commitments. Nvidia will also invest US$1.5 billion in SB Energy and be the exclusive chip provider for the Pike County site, which will have up to 8 gigawatts of capacity, with the first 800 megawatts online in 2028. OpenAI is leasing the site for 20 years. CEO Jensen Huang denied it was circular financing, saying Nvidia is using \"its scale and long-term visibility\". The deal follows Nvidia's partnership with six financial institutions targeting over US$500 billion in third-party AI funding. AJ Bell's Danni Hewson flagged worries about a loop of AI deals.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20SCMP/Nvidia%20to%20provide%20up%20to%20US105%20billion%20guarantee%20for%20OpenAI's%20Ohio%20data%20centre.pdf"}, {"id": "scmp-18", "title": "Pentagon orders 30 US universities to scrutinise ties with Chinese research partners", "source": "SCMP", "date": "18 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "The Pentagon has ordered 30 US universities to audit foreign research partnerships, including with Chinese institutions and former Confucius Institutes, or risk losing eligibility for federal funding. Institutions must review academic, financial and research ties with \"entities of concern\" and report findings, including proposed terminations, by August 31, giving two weeks. The department did not name the universities or specify how many notifications concern China. Undersecretary Emil Michael said there is \"zero tolerance\" for partnerships that compromise security. In July the Pentagon added 130 institutions in China, Russia and Iran to its Section 1286 list, including 88 in mainland China such as Fudan and Shanghai Jiao Tong. The move follows a congressional report accusing Harvard of inadequate scrutiny. Critics warn of stigmatising Chinese-origin researchers.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20SCMP/Pentagon%20orders%2030%20US%20universities%20to%20scrutinise%20ties%20with%20Chinese%20research%20partners.pdf"}, {"id": "scmp-19", "title": "Russia summons Japan ambassador over disputed Kuril Islands row after Putin visit", "source": "SCMP", "date": "18 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "Moscow summoned Japanese ambassador Akira Muto after Tokyo condemned President Vladimir Putin's recent visit to the far-eastern Kuril Islands, which Japan also claims and calls the Northern Territories. The islands, seized by the Soviet Union in 1945, have long dogged relations. Putin travelled there after visiting Sakhalin, prompting Japan to summon Russia's ambassador in protest, and Moscow retaliated. Foreign Minister Sergey Lavrov said Japanese officials had \"crossed the line of decency\", and complained Tokyo initially said Muto was unavailable or unwell. Spokeswoman Maria Zakharova said the envoy had \"suddenly started feeling better\" and would attend Tuesday. Ties have worsened since 2022, with Japan joining G7 sanctions on Russia and giving non-lethal aid to Kyiv.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20SCMP/Russia%20summons%20Japan%20ambassador%20over%20disputed%20Kuril%20Islands%20row%20after%20Putin%20visit.pdf"}, {"id": "scmp-20", "title": "Taiwan teams up with US start-up on underwater drones to boost island's defences", "source": "SCMP", "date": "18 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Taiwan has signed a deal with US defence start-up Vatn Systems to develop autonomous underwater vehicles and strengthen asymmetric warfare capabilities amid growing pressure from Beijing. Executed through the National Chung-Shan Institute of Science and Technology (NCSIST), the memorandum covers AI-enabled command-and-control, deployment of AUVs and local supply-chain support, including Vatn's S12 vehicle. Taiwan increasingly looks to unmanned systems for surveillance, seabed mapping, mine countermeasures and protecting critical infrastructure. NCSIST is also acquiring Anduril's Dive-LD, which can dive to 6,000 metres and operate about 10 days, and runs its own Huilong programme. Former missile-command official Chou Yu-ping said Taiwan had a \"structural gap\" in low-cost underwater capabilities and urged relaxed testing rules.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20SCMP/Taiwan%20teams%20up%20with%20US%20start-up%20on%20underwater%20drones%20to%20boost%20island's%20defences.pdf"}, {"id": "scmp-21", "title": "The next silicon? AI data centre material faces price spike amid China supply crunch", "source": "SCMP", "date": "18 Aug 2026", "tags": ["Technology & AI", "Trade"], "summary": "The AI boom is driving surging demand for indium phosphide (InP), a substrate used to make lasers for ultra-fast optical data transmission in data centres. As a major producer, China has seen prices climb: two-inch InP substrates surged to as much as 880 yuan (US$130.54) per wafer in June from 500 yuan at end-2025. An InP index of over 20 mainland-listed firms gained 4.2 per cent Monday. Japan's JX Advanced Metals is raising prices two to three times. A looming US ban on Chinese optical transceivers and Beijing's February 2025 export controls threaten supply chains; California's AXT makes all its InP substrates in China. Coherent prepaid AXT US$22.3 million and Lumentum reserved capacity with US$87 million in deposits. JX will invest up to 120 billion yen expanding capacity.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20SCMP/The%20next%20silicon%20AI%20data%20centre%20material%20faces%20price%20spike%20amid%20China%20supply%20crunch.pdf"}, {"id": "scmp-22", "title": "Trump approval rating falls to 33%, lowest of his presidency, poll finds", "source": "SCMP", "date": "18 Aug 2026", "tags": ["Politics", "Energy"], "summary": "US President Donald Trump's approval rating has fallen to 33 per cent, the lowest of his presidency, with 64 per cent disapproving, according to a Reuters/Ipsos poll concluded Monday. That is down from 35 per cent earlier this month and ties the lowest of his first term, reached in December 2017. His popularity took a hit after he ordered strikes on Iran alongside Israel; the ensuing conflict paralysed a fifth of the global oil trade and triggered a petrol price surge weighing on households ahead of November midterms. Some 80 per cent of Americans, including 71 per cent of Republicans, think US involvement in Iran \"will go on for an extended period\". The online poll surveyed 1,166 US adults with a 3-point margin of error.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20SCMP/Trump%20approval%20rating%20falls%20to%2033,%20lowest%20of%20his%20presidency,%20poll%20finds.pdf"}, {"id": "scmp-23", "title": "Trump lets 60-day deadline for Iran peace deal expire, threatens to 'bomb' Oman", "source": "SCMP", "date": "18 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "President Trump said Monday he would not extend the memorandum of understanding with Iran, saying Iran wants a deal but not \"the kind of a deal that I feel is necessary\". The Pakistan-brokered agreement, signed with President Masoud Pezeshkian on June 17, aimed to end the war and restore navigation through the Strait of Hormuz but stalled amid mutual accusations. Trump reiterated Iran cannot have a nuclear weapon and floated declaring the strait a US territory. He earlier threatened to bomb Oman if it \"gets in the way\". Trump also criticised South Korea's president for declining to help against Iran, noting US troops there, and cited scaling back joint drills given his \"good relatio
