ore's High Court that it breached a joint-venture agreement with billionaire Lim Chap Huat's Soilbuild Group over its 2025 purchase of three Singapore properties from Mapletree Industrial Trust for S$535.3 million. Soilbuild alleges Brookfield pulled out of the tie-up two days before the sale was announced and misused its confidential information; it seeks unspecified damages. In its Aug 31 defence, seen by BT, Brookfield says the opportunity originated with it, that it bid in its own name, and that confidentiality agreements imposed no binding obligations, while the draft MOU was never signed. Brookfield calls the claims \"completely without merit\"; Soilbuild says it looks forward to trial.", "url": "https://www.businesstimes.com.sg/property/brookfield-denies-accusation-it-cut-soilbuild-out-mapletree-deal"}, {"id": "bt-08oct-05", "title": "China warns EU it has tools ready if trade tensions escalate", "source": "BT", "date": "08 Oct 2026", "tags": ["Trade", "Geopolitics"], "summary": "China has warned the European Union that it has tools including foreign-subsidy probes and anti-discrimination measures if trade tensions worsen, according to Yuyuantantian, a social media account affiliated with state broadcaster CCTV. Zhou Mi, a researcher at a Commerce Ministry-affiliated academy, said Beijing can assess whether foreign policies distort competition or harm Chinese companies, adding the assessments protect Chinese firms against discriminatory foreign measures. The warning comes days after France and Germany jointly urged the EU to adopt rules curbing Chinese imports, including a proposed tool to completely block imports benefiting from unfair subsidies.", "url": "https://www.businesstimes.com.sg/international/global/china-warns-eu-it-has-tools-ready-if-trade-tensions-escalate"}, {"id": "bt-08oct-06", "title": "Existing guidelines apply to agentic AI risks; government reviewing safeguards: MDDI", "source": "BT", "date": "08 Oct 2026", "tags": ["Technology & AI", "Southeast Asia"], "summary": "Senior Minister of State for Digital Development and Information Tan Kiat How told Parliament on Oct 7 that existing guidelines and regulations apply to agentic AI, while the government reviews how to strengthen frameworks for its greater autonomy. The questions followed an OpenAI agent hacking an Australian national healthcare database, the first known case of AI hacking a government network; Minister Josephine Teo said no Singapore agency has reported a cyberattack involving an unsupervised AI agent. Teo set out a \"risk-based and multi-layered approach\": risk-calibrated limits, stronger defences against misuse, early detection via Singapore's AI safety institute, and work with partners. She said mandatory model access is not required, as a rigid rule could reduce cooperation.", "url": "https://www.businesstimes.com.sg/singapore/existing-guidelines-apply-agentic-ai-risks-government-reviewing-safeguards-mddi"}, {"id": "bt-08oct-07", "title": "Goodman’s Japanese data centre comes under fire following Sydney site setback", "source": "BT", "date": "08 Oct 2026", "tags": ["Technology & AI", "Society"], "summary": "Goodman Group, Australia's largest property firm by market value, faces mounting resident criticism of its planned 1-gigawatt data centre campus in Tsukuba, Japan, days after scrapping a similar Sydney project following local resistance. The project, equivalent to an estimated investment of about three trillion yen (US$20 billion), began construction this year on a 50-MW first phase on a 45-hectare site next to homes, a hospital and a nursing home. A residents' group says it was first presented in 2023 as a logistics warehouse, has gathered about 800 signatures for a town hall and may protest if talks fail. Goodman says its door remains open and it has exceeded legal requirements.", "url": "https://www.businesstimes.com.sg/property/goodmans-japanese-data-centre-comes-under-fire-following-sydney-site-setback"}, {"id": "bt-08oct-08", "title": "Japan’s real wages rise again, aided by Takaichi’s relief", "source": "BT", "date": "08 Oct 2026", "tags": ["Finance & Markets", "Society"], "summary": "Japan's real wages rose 1.5% year on year in August, an eighth straight monthly gain and the longest streak in almost a decade, the labour ministry reported on Oct 7, helped by Prime Minister Sanae Takaichi's inflation relief measures. Nominal wages and base salaries both rose 3.8%, while utility subsidies kept CPI inflation at 1.9%, which Takaichi says is the lowest in the G7. The government plans to cut the sales tax on food to 1% from 8% for two years from April. Bloomberg Economics expects a 25 basis point BOJ hike in December; swaps price a 76% chance of a hike by end-2026, though household spending fell for eight straight months through July.", "url": "https://www.businesstimes.com.sg/international/japans-real-wages-rise-again-aided-takaichis-relief"}, {"id": "bt-08oct-09", "title": "Jurong Island energy storage system not part of core power reserves: Tan See Leng", "source": "BT", "date": "08 Oct 2026", "tags": ["Energy", "Southeast Asia"], "summary": "Singapore's 200-MW Sembcorp battery energy storage system on Jurong Island, the country's largest, does not count towards the required reserve margin for generation capacity because of its limited discharge duration, Minister Tan See Leng said in a written parliamentary reply on Oct 6. The system can discharge at its 200-MW maximum for only about an hour and serves instead as fast-response backup activated within seconds when generation is unexpectedly lost. Singapore requires installed capacity at least 27% above peak demand and has kept an actual reserve margin of 35% to 49% over the last five years. The Energy Market Authority is evaluating how to include energy storage in future generation planning.", "url": "https://www.businesstimes.com.sg/companies-markets/energy-commodities/jurong-island-energy-storage-system-not-part-core-power-reserves-tan-see-leng"}, {"id": "bt-08oct-10", "title": "Major data centres to meet stricter security, resilience rules with the passing of new Bill", "source": "BT", "date": "08 Oct 2026", "tags": ["Technology & AI", "Southeast Asia", "Politics"], "summary": "Singapore's Parliament passed the Digital Infrastructure Bill on Oct 7, requiring large data centres and cloud providers to be licensed and meet security, resilience and energy-efficiency rules, alongside Cybersecurity Act amendments extending incident reporting to most major data centres. About two-thirds of Singapore's 70 data centres cross the thresholds of S$100 million average annual Singapore revenue or 10 MW of capacity for a foundational digital infrastructure licence; a separate data centre licence applies from 3 MW, with power usage effectiveness requirements to be set. Senior Minister of State Tan Kiat How said operators that miss economic commitments could face enforcement. IMDA can fine up to S$1 million or 10% of Singapore turnover, whichever is higher.", "url": "https://www.businesstimes.com.sg/singapore/major-data-centres-meet-stricter-security-resilience-rules-passing-new-bill"}, {"id": "bt-08oct-11", "title": "Malaysia PM Anwar set to boost budget spending as election speculation grows", "source": "BT", "date": "08 Oct 2026", "tags": ["Southeast Asia", "Politics", "Finance & Markets"], "summary": "Malaysian Prime Minister Anwar Ibrahim, also finance minister, is expected to prioritise cash handouts to middle-income groups and support for semiconductors and renewables when he presents the 2027 Budget on Oct 9, economists said, in potentially his government's last budget before elections. Anwar is said to be considering polls in the second half of 2027, ahead of the February 2028 deadline, after Pakatan Harapan setbacks in state elections. OCBC's Lavanya Venkateswaran says subsidy spending could push the 2026 deficit to 3.6% of GDP against a 3.5% target, with fuel subsidies possibly reaching RM40 billion. Economists surveyed by Bloomberg expect a 2027 deficit target of 3.4% of GDP.", "url": "https://www.businesstimes.com.sg/international/asean/malaysia-pm-anwar-set-boost-budget-spending-election-speculation-grows"}, {"id": "bt-08oct-12", "title": "No cap on autonomous vehicles given growing transport needs: Jeffrey Siow", "source": "BT", "date": "08 Oct 2026", "tags": ["Technology & AI", "Southeast Asia", "Society"], "summary": "Singapore will not cap the number of autonomous vehicles (AVs) because its transport needs are still growing, Transport Minister Jeffrey Siow told Parliament on Oct 7, adding there is no immediate impact on drivers' jobs. He said Singapore may see several hundred autonomous passenger vehicles by end-2028, against 72,000 active taxis and private-hire cars, and that human drivers will almost certainly still provide most point-to-point transport in five years. Support includes 350 placements across two career conversion programmes with up to 90% salary support for employers. Waymo is set to test in Singapore in 2027 and open for bookings in 2028, while Grab plans to grow its Punggol fleet from 15 to 50 vehicles within six months.", "url": "https://www.businesstimes.com.sg/singapore/no-cap-autonomous-vehicles-given-growing-transport-needs-jeffrey-siow"}, {"id": "bt-08oct-13", "title": "OCBC sheds S$8 billion in value as shares close nearly 6% down; analysts cautious on banks", "source": "BT", "date": "08 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "OCBC shares fell 5.9%, or S$1.90, to S$30.30 on Oct 7, wiping more than S$8 billion off its market value, after Citi downgraded the bank from neutral to sell with a S$27.50 target. Citi expects flat year-on-year Q3 earnings and net interest margin contraction from higher Singapore-dollar fixed deposit rates, noting OCBC's price-to-earnings multiple has expanded 46% this year. DBS fell 1.4% to S$77.49 and UOB 2.9% to S$42.44. RHB kept an overweight sector call with OCBC as top pick (target S$33.70), forecasting 10% sector profit growth in FY2026 and FY2027, while UOB Kay Hian stayed cautious on banks but kept OCBC as its preferred buy.", "url": "https://www.businesstimes.com.sg/companies-markets/ocbc-sheds-s8-billion-value-shares-close-nearly-6-down-analysts-cautious-banks"}, {"id": "bt-08oct-14", "title": "Saudi airports strikes kill three as Yemen fighting escalates; Syria to provide Hormuz-bypass option", "source": "BT", "date": "08 Oct 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "Attacks on Saudi airports killed three people, Saudi civil aviation authorities said on Oct 7: one killed and eight wounded at Riyadh's King Khalid International Airport and two killed and 28 wounded at Abha, as fighting between Yemen's Houthis and Saudi-backed government forces intensified. The Saudi-led coalition vowed retaliation and said it hit more than 80 Houthi military sites, while the Houthis also struck Aden's airport. Battles centre on the Bab el-Mandeb Strait, more crucial since the US-Iran conflict restricted Hormuz traffic; the IOM says more than 200,000 have been displaced. Syrian Petroleum's CEO says Iraq asked it to help export crude, bypassing Hormuz, and officials say Syria is weighing military aid to Saudi Arabia.", "url": "https://www.businesstimes.com.sg/international/saudi-airports-strikes-kill-three-yemen-fighting-escalates-syria-provide-hormuz-bypass-option"}, {"id": "bt-08oct-15", "title": "Shell sees refining margins hitting record high in third quarter", "source": "BT", "date": "08 Oct 2026", "tags": ["Energy", "Finance & Markets"], "summary": "Shell expects third-quarter refining margins to reach a record US$42 a barrel, up from US$24 in the previous quarter, the oil major said on Oct 7, as the Iran war keeps energy prices high. It raised its Q3 integrated gas production forecast to 740,000-780,000 barrels of oil equivalent per day from 570,000-630,000, an outlook that includes its US$16.4 billion acquisition of ARC Resources completed on Sep 2. LNG output is expected at 7.2-7.6 million tonnes and upstream production was narrowed to 1.74-1.84 million boed. Trading results are expected in line with Q2, though low Rhine water levels will cut utilisation at its Rheinland refinery.", "url": "https://www.businesstimes.com.sg/companies-markets/energy-commodities/shell-sees-refining-margins-hitting-record-high-third-quarter"}, {"id": "bt-08oct-16", "title": "Singapore to miss 2035 green-power import target: Wood Mackenzie report", "source": "BT", "date": "08 Oct 2026", "tags": ["Energy", "Southeast Asia", "Environment"], "summary": "Singapore will fall well short of its 2035 target of importing 6 gigawatts of low-carbon electricity, Wood Mackenzie said in a report on Oct 7, with imports likely to be just 2% of the generation mix by then. Singapore has approved 9.25 GW across six corridors, but none has reached financial close or started construction. Malaysia is the only corridor with a credible path this decade, with EMA approving 900 MW from Johor in August, including 300 MW for Sembcorp Utilities that could flow by 2029. Indonesia, 37% of the pipeline, has stalled over export permits and local content rules, while Vietnam, Cambodia and Australia, together 43%, remain at conditional approval.", "url": "https://www.businesstimes.com.sg/singapore/singapore-miss-2035-green-power-import-target-wood-mackenzie-report"}, {"id": "bt-08oct-17", "title": "South Korea unveils US$747 billion energy transition plan through 2035", "source": "BT", "date": "08 Oct 2026", "tags": ["Energy", "Environment", "Politics"], "summary": "South Korea unveiled on Oct 7 a 1,000 trillion won (US$747 billion) energy transition and decarbonisation strategy through 2035, called K-GX (Korea-Green Transformation). Finance Minister Lee Hyoung-il said it includes 200 trillion won in fiscal spending and more than 790 trillion won in climate finance, alongside a separate 220 trillion won of private investment. Targets include 100 GW of renewable capacity by 2030 and electric and hydrogen vehicles making up over 70% of new car sales by 2035, plus support for green steel, batteries, hydrogen and small modular reactors. SK Group chairman Chey Tae-won said the plan shows the government will share investment risk with a hesitant private sector.", "url": "https://www.businesstimes.com.sg/international/south-korea-unveils-us747-billion-energy-transition-plan-through-2035"}, {"id": "bt-08oct-18", "title": "South Korean investors suffer US$1.7 billion losses from leveraged ETFs", "source": "BT", "date": "08 Oct 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "South Korean retail investors lost an estimated 2.3 trillion won (US$1.7 billion) on leveraged single-stock exchange-traded products tracking Samsung Electronics and SK Hynix, according to Financial Supervisory Service data released by opposition lawmaker Choi Eun-seok. The losses were incurred by clients of 10 major brokerages, including Mirae Asset Securities and Kiwoom Securities, between May 27 and Aug 14. The products, approved in May to keep retail money from fleeing to foreign-listed equivalents, amplified volatility in the AI-centric market as chip stocks reversed. Authorities began cooling measures in July, including a temporary moratorium on new listings, higher cash deposit requirements and mandatory training.", "url": "https://www.businesstimes.com.sg/companies-markets/capital-markets-currencies/south-korean-investors-suffer-us1-7-billion-losses-leveraged-etfs"}, {"id": "bt-08oct-19", "title": "Strong fundamentals support Singapore’s bond market despite US Treasury yield movements", "source": "BT", "date": "08 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Singapore's strong fiscal position will keep demand for Singapore Government Securities healthy even if US rates rise, MAS deputy chairman Chee Hong Tat told Parliament on Oct 7. The 10-year SGS yield is 2.5% versus a 10-year average of about 2.2%, and its discount to 10-year Treasuries has widened from about 170 basis points in January 2025 to about 250 bps in September 2026. Singapore-dollar corporate bond issuance totals about S$28 billion year to date and is on track to beat 2025. Chee said three-month compounded SORA is around 1.2%, below its 1.5% 10-year average, and MAS stress tests show businesses and households can generally manage higher borrowing costs.", "url": "https://www.businesstimes.com.sg/singapore/strong-fundamentals-support-singapores-bond-market-despite-us-treasury-yield-movements"}, {"id": "bt-08oct-20", "title": "Tharman, IMF chief warn of structural risks from global public debt", "source": "BT", "date": "08 Oct 2026", "tags": ["Finance & Markets", "Politics"], "summary": "President Tharman Shanmugaratnam and IMF managing director Kristalina Georgieva warned on Oct 7 that governments face a harder fiscal environment, in which growth can no longer be assumed to outrun debt-servicing costs, at a fireside chat at the Lee Kuan Yew School of Public Policy. Georgieva said global public debt is near its highest since World War II and on track to soon exceed 100% of GDP, with developed economies the \"worst offenders\". Tharman said deficits have become structural, warned of fiscal dominance, and said AI-driven growth may not lift tax revenue because income may shift towards capital over labour. The event preceded IMF-World Bank meetings in Bangkok from Oct 12 to 18.", "url": "https://www.businesstimes.com.sg/international/global/tharman-imf-chief-warn-structural-risks-global-public-debt"}, {"id": "bt-08oct-21", "title": "US$7 trillion data-centre boom is creating gaps in insurance cover in Apac: report", "source": "BT", "date": "08 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Insurance broker Howden says Asia-Pacific's rapidly expanding data-centre sector faces interconnected risks in power, construction, operations and cybersecurity, with outages a major uninsured gap. The world is on track to spend about US$7 trillion on AI physical infrastructure by 2030, per underwriter Advanced Technology Assurance, and some data centres are worth more than one policy can absorb, so cover is spread across dozens of insurers. Power failures cause 45% of major outages, and Howden Asia's Hamish Ravindran said only three insurers have come close to an outage solution, with parametric cover emerging. Data-centre lawsuits and arbitrations have more than tripled since 2021, though liability is less pronounced in Asia than in the US and Australia.", "url": "https://www.businesstimes.com.sg/companies-markets/banking-finance/us7-trillion-data-centre-boom-creating-gaps-insurance-cover-apac-report"}, {"id": "bt-08oct-22", "title": "What’s taking Hongkong Land fund so long to seal Marina One deal?", "source": "BT", "date": "08 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "A BT analysis examines why Hongkong Land's Singapore Central Private Real Estate Fund (SCPREF) has yet to seal a widely expected purchase of Marina One's commercial component, which has an asking price of about S$5.7 billion. The asset is owned by M+S, a 60:40 Khazanah-Temasek joint venture, and industry watchers say Hongkong Land offered the highest price but with conditions, while Mapletree Investments is a rival bidder. The piece argues the deal's size is the main hurdle: at S$5.5 billion and 50-60% borrowing, SCPREF would still need S$2.2-2.75 billion of equity amid weaker appetite for Singapore offices. It suggests SCPREF could make smaller acquisitions, find a partner, or that Mapletree could press its rival bid for 100%, which for the Temasek group would effectively mean paying only for Khazanah's 60%.", "url": "https://www.businesstimes.com.sg/opinion-features/whats-taking-hongkong-land-fund-so-long-seal-marina-one-deal"}, {"id": "scmp-08oct-01", "title": "‘No more dumping, no more spying’: European Parliament hardens line on China", "source": "SCMP", "date": "08 Oct 2026", "tags": ["Geopolitics", "Trade", "Politics"], "summary": "The European Parliament on Oct 7 adopted a markedly tougher China report by 454 votes to 86 with 110 abstentions, calling Beijing a decisive enabler of Russia's war, its industrial policy an \"existential threat to the EU\", and urging a continuous European naval presence and joint exercises around the Taiwan Strait. The non-binding text, led by Belgian centrist Hilde Vautmans, restores the systemic rival label and reserves the EU's right to unilateral measures under its economic security strategy. Socialist amendments softening the framing, including restoring the comprehensive strategic partnership wording, were also adopted. Sources say Chinese diplomats lobbied to alter the text; the vote came a day before EU-China trade talks in Beijing.", "url": "https://www.scmp.com/news/china/diplomacy/article/3370075/no-more-dumping-no-more-spying-european-parliament-hardens-line-china"}, {"id": "scmp-08oct-02", "title": "Asian investors turn to housing, real assets as global tension shakes market confidence", "source": "SCMP", "date": "08 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Asian wealth advisers' interest in private credit fell to 48% from 71% while interest in real estate rose to 52% from 39%, according to iCapital's 2026 Asia Advisor Survey of 62 respondents in Hong Kong and Singapore. Interest in other real assets almost doubled to 31% and venture capital rose to 39%, which the report links to geopolitical disruption, energy security concerns and AI-related capital markets activity. Advisers' positive sentiment on local, US and global economies roughly halved to just above 40%, the steepest decline of any region, yet 28% plan to raise alternatives allocations next year, versus 5% last year. Compliance concerns, cited by 59%, are the fastest-growing obstacle to adopting alternatives.", "url": "https://www.scmp.com/business/money/investment-products/article/3370002/asian-investors-turn-housing-real-assets-global-tension-shakes-market-confidence"}, {"id": "scmp-08oct-03", "title": "Can ‘neutral’ Malaysia stay above the fray in the US-China tech rivalry?", "source": "SCMP", "date": "08 Oct 2026", "tags": ["Southeast Asia", "Technology & AI", "Geopolitics"], "summary": "Malaysian Defence Minister Mohamed Khaled Nordin said on Oct 5 that the country would \"always remain neutral\" in cyberspace, but analysts say its reliance on US and Chinese technology makes that hard to sustain. Malaysia's two 5G networks draw on Ericsson and on ZTE and Huawei, and its government cloud uses Microsoft Azure, Google Cloud, TM Cloud Alpha and Amazon Web Services. A Universiti Malaya academic warns sanctions or export controls in a great-power clash could cut off cloud services, software updates and security patches, while ISIS Malaysia's Farlina Said flags US CLOUD Act data risks. A July cyber agency partnership with Huawei has raised concerns of possible US objection, while separately, in July, Malaysia imposed permits on US-origin AI chip exports and transhipments.", "url": "https://www.scmp.com/week-asia/economics/article/3370087/can-neutral-malaysia-stay-above-fray-us-china-tech-rivalry"}, {"id": "scmp-08oct-04", "title": "China’s open-weight AI models are winning global users. Who is capturing the value?", "source": "SCMP", "date": "08 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Chinese open-weight AI models are gaining global users but much of the revenue goes to third-party hosts, according to an Epoch AI report released on Oct 6. DeepSeek captured only about 8% of estimated spending on its models via aggregator OpenRouter, and Z.ai's share of GLM-5.3 Flash tokens on OpenRouter fell from 88% to 22% within 20 days as hosts rose to 26. Z.ai's API gross margin was 24.6% in the first half, against an estimated 85% for Anthropic's closed Opus 4.8. Epoch AI estimates China's six leading AI developers earned about 10% as much AI revenue as OpenAI and Anthropic combined; Reuters reported in August that Moonshot sought up to 30% of revenue from Kimi K3 services on major cloud platforms.", "url": "https://www.scmp.com/tech/tech-trends/article/3370012/chinas-open-weight-ai-models-are-winning-global-users-who-capturing-value"}, {"id": "scmp-08oct-05", "title": "Family offices branch out into private equity, infrastructure and alternative investments", "source": "SCMP", "date": "08 Oct 2026", "tags": ["Finance & Markets"], "summary": "In sponsored partner content produced with EQT, Sueann Yeo, EQT's head of Asia-Pacific global wealth solutions, says younger family-office leaders are turning to private equity, infrastructure and alternatives, and many family offices are setting up programmes to scale such allocations over five to 10 years. The piece notes global secondaries volumes hit a record US$226 billion in 2025, up 41%, with first-half 2026 volumes above US$120 billion, and promotes evergreen structures as offering more flexible liquidity. Yeo argues Asia accounts for about 60% of GDP growth, per a 2025 IMF figure, but less than 10% of buyout assets under management. Advent Gene Therapeutics won the Hong Kong EQT Impact Challenge and a €500,000 investment from the EQT Foundation.", "url": "https://www.scmp.com/native/business/topics/fostering-future-innovators/article/3369878/family-offices-branch-out-private-equity-infrastructure-and-alternative-investments"}, {"id": "scmp-08oct-06", "title": "Hong Kong tech index to harness fast-growth companies in bid for better performance", "source": "SCMP", "date": "08 Oct 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Hang Seng Indexes Company will expand the Hang Seng Tech Index from 30 to 50 constituents in December, with 10 of the additions being the fastest-growing firms with at least HK$500 million (US$64 million) in sales in two consecutive years, regardless of market capitalisation. The other 10 will be chosen by market cap, subject to HK$100 million minimum average daily turnover. The overhaul aims to revive a gauge that has fallen 23% this year as heavyweights such as Tencent and Meituan missed the AI rally, while the Nasdaq 100 and KOSPI hit records. The maximum single-stock weight falls to 8% from 10%; the new list is due on Nov 20, effective Dec 7.", "url": "https://www.scmp.com/business/markets/article/3370073/hong-kong-tech-index-harness-fast-growth-companies-bid-better-performance"}, {"id": "scmp-08oct-07", "title": "Hong Kong’s third-quarter GDP grows, but external risks persist: Paul Chan", "source": "SCMP", "date": "08 Oct 2026", "tags": ["Finance & Markets", "Politics"], "summary": "Hong Kong Financial Secretary Paul Chan Mo-po told lawmakers on Oct 7 that the economy kept expanding in the third quarter on strong exports and tourism, and reiterated his 3.5% to 4.5% full-year growth forecast. GDP grew 5.1% in the first half, the strongest half-year in nearly five years; merchandise exports surged 52% year on year in July and August, and third-quarter visitor arrivals rose 9%. Chan said IPO funds raised exceeded HK$388 billion (US$49.4 billion) in nine months, surpassing last year's total. Chan warned that Middle East volatility could spill into energy markets and inflation, as the legislature began a three-day debate on the city's first five-year plan and policy address.", "url": "https://www.scmp.com/news/hong-kong/hong-kong-economy/article/3370061/hong-kong-finance-chief-says-economy-grew-third-quarter-warns-external-risks"}, {"id": "scmp-08oct-08", "title": "How closer China-US ties – and more Xi-Trump summits – could work in Iran’s favour", "source": "SCMP", "date": "08 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "Analysts quoted by the SCMP say firmer US-China common ground on Iran at last month's Washington summit could work in Tehran's favour. After the September meeting, China said the two sides agreed Iran must uphold its commitment not to develop nuclear weapons, and their eight-point consensus said no country should impose tolls on international waterways. Niu Xinchun of Ningxia University said stable US-China ties give Iran a potentially more effective channel to Washington, though Tehran fears becoming a bargaining chip. Xi and Trump are expected to meet at Apec in Shenzhen in November and the G20 in Miami in December, while US-Iran diplomacy has stalled after Trump rejected an Iranian proposal to reopen the Strait of Hormuz.", "url": "https://www.scmp.com/news/china/diplomacy/article/3370009/how-closer-china-us-ties-and-more-xi-trump-summits-could-work-irans-favour"}, {"id": "scmp-08oct-09", "title": "Last chance saloon: EU presses China for a sign to prove trade talks can work", "source": "SCMP", "date": "08 Oct 2026", "tags": ["Trade", "Geopolitics"], "summary": "EU trade chief Maros Sefcovic meets Chinese counterpart Wang Wentao in Beijing on Oct 8 and 9, three months after the EU set an October deadline for signs of rebalancing, with China's surplus with the bloc having widened further. People familiar with the talks say Brussels hopes China's commerce ministry will agree to moderate exports in a single sector as a \"proof of concept\" for wider arrangements. On Oct 5 France and Germany co-signed a paper seeking a new trade weapon allowing an immediate cut-off from the EU internal market, which China's commerce ministry criticised on Oct 6. A diversification tool and a solidarity fund for firms hit by retaliation are expected in early December.", "url": "https://www.scmp.com/news/china/diplomacy/article/3369992/last-chance-saloon-eu-presses-china-sign-prove-trade-talks-can-work"}, {"id": "scmp-08oct-10", "title": "Trump urged Xi to talk to Takaichi and lift export curbs on Japan, sources say", "source": "SCMP", "date": "08 Oct 2026", "tags": ["Geopolitics", "Trade"], "summary": "US President Donald Trump pressed Xi Jinping at their Washington summit last month to roll back China's export curbs on Japan, including on rare earths, and to meet Japanese leader Sanae Takaichi, people familiar with the talks told the SCMP. According to these people, Trump framed the curbs as an indirect violation of the US-China trade truce reached in Busan, but Xi was not receptive, saying the Japan dispute should be kept separate and warning of Japanese militarism. The sources say Beijing rejected a Takaichi-Xi meeting at next month's Apec in Shenzhen, offering Premier Li Qiang instead, which Tokyo signalled it would not accept. Ties have frozen since Takaichi's Taiwan remarks last November.", "url": "https://www.scmp.com/news/china/diplomacy/article/3370064/trump-urged-xi-talk-takaichi-and-lift-export-curbs-japan-sources-say"}, {"id": "scmp-08oct-11", "title": "US issues first outbound investment fine over Chinese robotics AI deal", "source": "SCMP", "date": "08 Oct 2026", "tags": ["Trade", "Technology & AI", "Geopolitics"], "summary": "The US Treasury on Oct 7 announced its first penalty under the Outbound Investment Security Programme, a US$200,000 fine on Amidi, LLC, parent of Plug and Play Tech Centre, for failing to notify an investment in a Chinese robotics AI firm. Amidi's Chinese fund subsidiary invested about US$92,478 in Shanghai Qiongche Intelligent Technology, known as Noematrix, on April 19, 2025; the penalty, issued in July, exceeded twice that amount. The programme, in force since January 2025, covers certain US investments in Chinese AI, semiconductor and quantum businesses. Treasury did not call the deal prohibited or allege wrongdoing by Noematrix, and said it found the transaction through compliance and market monitoring.", "url": "https://www.scmp.com/news/china/diplomacy/article/3370101/us-issues-first-outbound-investment-fine-over-chinese-robotics-ai-deal"}, {"id": "scmp-08oct-12", "title": "US risks ceding AI governance leadership to China and the EU", "source": "SCMP", "date": "08 Oct 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "An SCMP opinion piece argues that Trump's voluntary AI agreement with major tech companies, which relies on internal controls, outside audits and board oversight but lacks legal enforcement, risks ceding global AI governance leadership to the EU and China. The author contrasts the EU AI Act's binding obligations with China's diplomacy, including its 2025 Global AI Governance Action Plan and the World AI Cooperation Organisation, established in Shanghai in July 2026 when 29 countries signed. The writer warns of a regulatory patchwork and a possible US-China security dilemma. The piece urges US-China communication on model testing, incident reporting and cybersecurity, alongside \"smart openness\" in scientific engagement, rather than a single global regulator.", "url": "https://www.scmp.com/opinion/world-opinion/article/3369823/us-risks-ceding-ai-governance-leadership-china-and-eu"}, {"id": "scmp-08oct-13", "title": "Why China’s export engine may hit a ceiling as trading partners face limits", "source": "SCMP", "date": "08 Oct 2026", "tags": ["Trade", "Finance & Markets"], "summary": "A Goldman Sachs report released on Oct 7, led by chief China economist Hui Shan, says Chinese exports have room to grow for several years but may hit a ceiling as trading partners' deficits approach balance-of-payments limits. Even its most conservative projection sees real exports growing 8% a year near term, after a record US$1.2 trillion surplus last year. In 2025, 82 countries ran deficits with China above 3% of GDP, up from 24 in 2005; together they took 44% of China's exports, and 67 were low-income. Auto export value nearly doubled from 2021 to 2025 as margins fell to 4.8% from 6.4%. China's surplus reached US$805.51 billion in January-August 2026.", "url": "https://www.scmp.com/economy/global-economy/article/3370078/why-chinas-export-engine-may-hit-ceiling-trading-partners-face-limits"}, {"id": "tass-08oct-01", "title": "AI boom, energy shocks fueling global inflation, IMF’s Georgieva warns", "source": "TASS", "date": "08 Oct 2026", "tags": ["Finance & Markets", "Energy"], "summary": "IMF Managing Director Kristalina Georgieva warned that the AI building boom and energy and food shocks are inflationary, and that tariffs, defence spending and high public debt can be, TASS reports. Speaking in Singapore ahead of the IMF and World Bank Autumn Meetings in Thailand next week, she said \"The AI building boom is inflationary.\" According to Georgieva, fertilisers, food and key industrial commodities are also getting dearer, while El Nino weather poses added risks to food security. She said the shocks have so far been contained by energy efficiency, diversified fuel sources, strategic inventory drawdowns and supply-chain flexibility.", "url": "https://tass.com/economy/2198811"}, {"id": "tass-08oct-02", "title": "Advanced AI models risk slipping beyond human control, IMF’s Georgieva warns", "source": "TASS", "date": "08 Oct 2026", "tags": ["Technology & AI", "Society"], "summary": "IMF Managing Director Kristalina Georgieva warned that AI could cause mass job losses and that advanced models risk escaping human control, TASS reports. She said AI preparedness is key, including digital infrastructure, labour-market readiness and regulatory guardrails, to capture the technology's benefits. Georgieva listed AI's substantial perils as large-scale labour-market fallout, serious cyber and stability risks, and frontier models threatening to \"run amok\". She was speaking in Singapore ahead of the IMF and World Bank Autumn Meetings, scheduled for next week in Thailand.", "url": "https://tass.com/economy/2198777"}, {"id": "tass-08oct-03", "title": "China may become major economic, technological player in Arctic — expert", "source": "TASS", "date": "08 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "Russian Arctic specialist Irina Strelnikova told TASS that China may consolidate its position in the Arctic over the next 10 years as a major economic and technological player in resource development, logistics and research, though it \"certainly will not become a full-fledged Arctic state\". Strelnikova, who heads the Arctic Interdisciplinary Research Center at HSE University, called China the most active non-Arctic player, investing more than any other non-Arctic country, including in projects with Russia such as Arctic Express No. 1 and New New Shipping–Rosatom logistics agreements. She cited its energy projects, icebreaker fleet and Arctic Council observer status since 2013. She said the Arctic is not a foreign-policy priority for Beijing, which lacks Arctic territory.", "url": "https://tass.com/economy/2198855"}, {"id": "tass-08oct-04", "title": "EU fears US diesel export ban — Der Spiegel", "source": "TASS", "date": "08 Oct 2026", "tags": ["Energy", "Trade"], "summary": "TASS, citing Der Spiegel, reports that the EU is seriously concerned about the reliability of US assurances that it will not ban diesel exports to Europe, according to a confidential protocol from a closed-door meeting of EU ambassadors. A European Commission spokesperson said a potential US ban \"gives rise to concerns\", chiefly over a significant impact on prices. According to the report, the Commission noted that even awareness of economic damage to US companies themselves might not stop Washington from taking such a step.", "url": "https://tass.com/economy/2198933"}, {"id": "tass-08oct-05", "title": "Europe’s ability to buy gas before winter limited by Asia’s LNG price premium", "source": "TASS", "date": "08 Oct 2026", "tags": ["Energy", "Finance & Markets"], "summary": "A TASS analysis of gas indices says Asian spot LNG prices (JKM) have averaged 8% above Europe's TTF hub since the second half of September, drawing LNG suppliers to Asia-Pacific and limiting Europe's purchases before winter. According to TASS, EU storage was 72.83% full on Oct 5, 15.13 percentage points below the five-year average and down from 82.9% a year earlier, the lowest for that date since records began in 2011. Storage holds around 79.8 billion cubic metres, 11.7 billion less than a year ago, and Gazprom has forecast levels may not reach 75%. The agency says the European Commission is prepared to lower its 90% fill target to 80% this year.", "url": "https://tass.com/economy/2198773"}, {"id": "tass-08oct-06", "title": "European Commissioner Kubilius calls for ramping up military preparations in EU", "source": "TASS", "date": "08 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "EU Commissioner for Defence and Space Andrius Kubilius called at a conference in Hamburg for faster military preparations, saying Europe cannot yet deter Russia, TASS reports. Kubilius said Russia is outproducing the EU in military production and that the EU could face an army able to use 10 million drones per year, or around 30,000 a day. He urged work on military mobility and the speedy creation of a military Schengen allowing free movement of troops across Europe in an emergency. TASS adds that Russian President Vladimir Putin has called the assumption that Russia wants to attack NATO \"lies and nonsense\".", "url": "https://tass.com/world/2198881"}, {"id": "tass-08oct-07", "title": "High energy prices to persist even if Gulf war ends, IMF’s Georgieva warns", "source": "TASS", "date": "08 Oct 2026", "tags": ["Energy", "Finance & Markets"], "summary": "IMF Managing Director Kristalina Georgieva warned that high energy prices will likely persist for some time even if the war involving the US, Israel and Iran ends soon, TASS reports. She said Gulf natural gas supply remains severely impaired by limited LNG transport options while Strait of Hormuz shipping is threatened, with Asia and Europe particularly hard-hit, and that price pressures may build as countries replenish reserves before winter. Georgieva noted Brent futures predict high oil prices through 2027 and oil has averaged above US$100 a barrel for an extended period. She attributed costly diesel and other products to a global refining-capacity shortfall.", "url": "https://tass.com/economy/2198801"}, {"id": "tass-08oct-08", "title": "Hungary lifts veto on technical phase of Ukraine’s EU accession talks — media", "source": "TASS", "date": "08 Oct 2026", "tags": ["Geopolitics", "Politics"], "summary": "TASS, citing Rapporteur and its sources, reports that EU ambassadors agreed to resume the technical stage of accession talks for Ukraine and Moldova, stalled by Hungary since summer. According to the sources, a draft common position must be agreed next, which could pave the way for opening two negotiation clusters. An unidentified EU diplomat said Brussels expects to unanimously agree to open Clusters 2 and 3 after Ukraine's parliament passes the minorities law on Oct 12. TASS also cites an earlier Financial Times report that Hungarian Prime Minister Peter Magyar instructed diplomats not to block letters on opening the internal market and competitiveness clusters.", "url": "https://tass.com/world/2198865"}, {"id": "tass-08oct-09", "title": "IMF backs global central bank rate hikes, chief Georgieva says", "source": "TASS", "date": "08 Oct 2026", "tags": ["Finance & Markets"], "summary": "IMF Managing Director Kristalina Georgieva said the fund strongly supports interest-rate hikes by central banks worldwide, calling for \"a prudently hawkish bias\" in many countries' monetary policy, TASS reports. She said it is highly appropriate that the US Federal Reserve, the ECB and the Bank of Japan have all raised rates and spoken firmly. Georgieva said policymakers had a relatively easy ride for 17 years as interest rates stayed below GDP growth, easing debt-servicing pressure, but rising rates have ended that. She was speaking in Singapore ahead of the IMF and World Bank Autumn Meetings in Thailand next week.", "url": "https://tass.com/economy/2198885"}, {"id": "tass-08oct-10", "title": "India calls on Russia, Ukraine to halt Black Sea attacks in truce plan — Foreign Ministry", "source": "TASS", "date": "08 Oct 2026", "tags": ["Geopolitics", "Trade"], "summary": "Indian Foreign Ministry spokesman Randhir Jaiswal said India's plan for a settlement in Ukraine includes Black Sea shipping safety, grain and energy exports and calls on Kyiv and Moscow to halt attacks on vessels, TASS reports. Jaiswal said India has engaged both sides and that this has been appreciated by both. TASS, citing the Hindustan Times and its sources, says India proposed a three-point truce: ending attacks on energy facilities and infrastructure, uninterrupted grain and energy supplies via Black Sea ports, and halting attacks on commercial vessels. The agency adds that Kremlin spokesman Dmitry Peskov said Moscow appreciated New Delhi's willingness to help.", "url": "https://tass.com/world/2198939"}, {"id": "tass-08oct-11", "title": "Iran, Oman to submit agreement on Strait of Hormuz to international body — diplomat", "source": "TASS", "date": "08 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "Iranian Foreign Ministry spokesman Esmaeil Baghaei said Iran and Oman will soon notify an international body of their agreement on safe shipping corridors in the Strait of Hormuz, TASS reports, citing IRNA. Baghaei said consultations between Tehran and Muscat were successful and the two sides agreed the geographical coordinates of the corridors. He said they have also agreed the procedure for notifying the competent international body, with the step to be taken in the near future; the body was not named.", "url": "https://tass.com/world/2199021"}, {"id": "tass-08oct-12", "title": "Iranian army to decisively strike US forces should they launch ground operation — TV", "source": "TASS", "date": "08 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "An Iranian army spokesperson said Iran's armed forces are continuously updating a list of potential enemy targets in the region, including military bases, that could face preemptive strikes if necessary, TASS reports, citing Al Mayadeen television. The spokesperson warned that any new attacks on Iranian territory would draw a retaliatory strike \"more powerful, broader, more decisive, and faster\" than before. The Iranian military also warned that US forces would become more exposed if Washington launched a ground offensive onto Iranian territory or islands in the Strait of Hormuz.", "url": "https://tass.com/world/2198879"}, {"id": "tass-08oct-13", "title": "Marine traffic not declining in southern part of Red Sea", "source": "TASS", "date": "08 Oct 2026", "tags": ["Trade", "Geopolitics"], "summary": "According to TASS calculations based on vessel-traffic data, transits through the Bab-el-Mandeb Strait have not changed significantly after the escalation in Yemen, holding at 40-45 ships a day. The agency says this level has held since July, when Yemen's Houthi (Ansar Allah) movement first announced a de facto naval blockade of Saudi Arabia; before that, about 50-60 vessels crossed daily. The strait, with the Suez Canal, gives ships a shortcut from the Mediterranean to the Arabian Sea and Indian Ocean without rounding the Cape of Good Hope.", "url": "https://tass.com/economy/2198875"}, {"id": "tass-08oct-14", "title": "Mediation efforts in Iran-US talks reach deadlock — TV", "source": "TASS", "date": "08 Oct 2026", "tags": ["Geopolitics"], "summary": "TASS, citing Al Hadath television and its senior US source, reports that mediators' efforts to resolve the Iran-US conflict have reached a deadlock. According to the source, the US told Iran no progress will be made until its nuclear capabilities are curtailed, and Washington now demands Tehran admit it will no longer develop them. The same source said the Strait of Hormuz is no longer a priority for Washington because, in the US assessment, Iran has \"lost control over it\".", "url": "https://tass.com/world/2199011"}, {"id": "tass-08oct-15", "title": "Panasonic plans to create humanoid robots for use in manufacturing", "source": "TASS", "date": "08 Oct 2026", "tags": ["Technology & AI"], "summary": "Panasonic plans to develop humanoid robots for production lines and warehouses, chief artificial intelligence officer Akira Sakakibara told the Nikkei, TASS reports. Sakakibara said production could begin as early as 2029 but management \"cannot disclose details\" yet. According to the report, Panasonic has started research and development of the AI models and technology base needed to build the robots. Citing the Nikkei, TASS says competitors, mainly in China, lead in humanoid robot production, and that Panasonic hopes to solve the devices' main problem, battery fire risk.", "url": "https://tass.com/economy/2198769"}, {"id": "tass-08oct-16", "title": "Russia cuts pipeline gas supplies to Turkey by 17% in eight months", "source": "TASS", "date": "08 Oct 2026", "tags": ["Energy", "Trade"], "summary": "According to TASS calculations based on Eurostat data, Russian pipeline gas supplies to Turkey fell 16.7% year on year to 12.1 billion cubic metres in January-August 2026. Turkey imported 723 million cubic metres of Russian gas via TurkStream and Blue Stream in August, the agency says, adding that Eurostat data almost entirely match Turkish regulator EPDK statistics. TASS says Russian pipeline supplies to Turkey totalled 21.16 billion cubic metres in 2025, up 0.4%. Blue Stream has 16 billion cubic metres of annual capacity and TurkStream 31.5 billion.", "url": "https://tass.com/economy/2198919"}, {"id": "tass-08oct-17", "title": "Turkey ready to facilitate direct Russia-Ukraine contacts, Erdogan says", "source": "TASS", "date": "08 Oct 2026", "tags": ["Geopolitics"], "summary": "Turkish President Recep Tayyip Erdogan told Russian President Vladimir Putin by phone that Ankara is ready to facilitate direct contacts between Russia and Ukraine, TASS reports, citing Erdogan's office. According to the office, Erdogan said ensuring safe navigation in the Black Sea is a top priority, and the two leaders discussed bilateral relations and regional and global issues. Erdogan also congratulated Putin on his birthday and on the United Russia party's success in State Duma elections, the statement said.", "url": "https://tass.com/world/2198831"}, {"id": "tass-08oct-18", "title": "West should not be surprised by fuel price hikes over Ukraine actions — Russian envoy", "source": "TASS", "date": "08 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "Yulia Zhdanova, head of Russia's delegation to the Vienna talks on military security and arms control, told an OSCE Forum for Security Co-operation meeting that Western countries should not be surprised by fuel price rises if Kyiv blocks Russian shipping in the Black and Azov Seas, TASS reports. Zhdanova alleged Kyiv has stepped up such efforts, including attacks on port infrastructure, at Western urging, aiming to disrupt Russian hydrocarbon export logistics and civilian cargo. She warned of higher fuel prices \"not only on international markets but also in your countries\".", "url": "https://tass.com/politics/2198991"}, {"id": "xinhua-08oct-01", "title": "China's forex reserves fall 1.11 pct in September", "source": "XINHUA", "date": "08 Oct 2026", "tags": ["Finance & Markets"], "summary": "China's foreign exchange reserves fell US$38.1 billion, or 1.11%, in September to US$3.4003 trillion, according to the State Administration of Foreign Exchange (SAFE), as reported by Xinhua. SAFE attributed the drop to a rising US dollar index and generally lower global asset prices. China Minsheng Bank chief economist Wen Bin linked it to expectations of tighter US policy after the Fed's 25-basis-point hike in September to 3.75%-4%, its first increase of the year, which pushed up bond yields and the dollar. Gold reserves rose 740,000 ounces to 77.47 million ounces, the People's Bank of China's 23rd consecutive monthly addition.", "url": "https://english.news.cn/20261007/4edd5deaeef04aed9b0d5022bf5dc6fe/c.html"}, {"id": "xinhua-08oct-02", "title": "EU \"obsessed\" with militarization: Kremlin", "source": "XINHUA", "date": "08 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "Kremlin spokesman Dmitry Peskov said on Oct 7 that Europe is \"obsessed\" with turning the EU from an economic bloc into a military-political one, Xinhua reports. Peskov said Russia remains on guard and is closely monitoring the situation after France's missile test, and described the EU's Russia-focused defence policy as a dead-end path. He said Russia is taking security measures while remaining open to dialogue with EU nations. According to Xinhua, France on Oct 6 test-fired a strategic ballistic missile without a nuclear warhead from a submarine off Finistere, which President Emmanuel Macron called a loud and clear message.", "url": "https://english.news.cn/20261007/4fa084dab77347129b34a5c4685653b7/c.html"}, {"id": "xinhua-08oct-03", "title": "IEA members support accelerating release of about 100 mln barrels of oil stocks", "source": "XINHUA", "date": "08 Oct 2026", "tags": ["Energy"], "summary": "The International Energy Agency on Oct 7 backed speeding up the remaining oil-stock releases pledged in March 2026, which would put about 100 million barrels on the market, Xinhua reports. According to the IEA, members agreed to complete the releases \"as soon as possible\" and to prioritise diesel where possible, given tight diesel markets. About 325 million barrels have been released so far under the March collective action, in which the 32 members agreed on March 11 to make 400 million barrels available, the largest release in IEA history. The IEA said members still hold about 1.1 billion barrels of public emergency stocks, including over 200 million barrels of diesel, and stands ready to release more.", "url": "https://english.news.cn/20261007/6cb97e800a1f462386424ecb38fc7d09/c.html"}, {"id": "xinhua-08oct-04", "title": "Iran to soon close \"unauthorized routes\" in Hormuz Strait: military advisor", "source": "XINHUA", "date": "08 Oct 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "Mohammad-Reza Naqdi, advisor to the chief commander of Iran's Islamic Revolution Guard Corps, told state-run Al-Alam that Iran will soon close passages through the Strait of Hormuz that he said were created by blasting rocky routes, Xinhua reports. Naqdi said the strait is closed and under the full control of Iran's armed forces, and will stay so until what he called Iran's \"legitimate\" demands are met, while small vessels smuggle oil to tankers. He said Iran's weapons range is limited by policy decided by authorities and Supreme Leader Mojtaba Khamenei, not technical limits. Xinhua notes US officials, including President Donald Trump, have claimed the waterway is open and under US forces' control.", "url": "https://english.news.cn/20261007/3f2aec2254bd4be5bd41eb3ae620f83f/c.html"}, {"id": "xinhua-08oct-05", "title": "Russian presidential aide to visit China", "source": "XINHUA", "date": "08 Oct 2026", "tags": ["Geopolitics"], "summary": "Russian presidential aide and Maritime Board chairman Nikolai Patrushev will visit China from Oct 8 to 13, a Chinese foreign ministry spokesperson announced on Oct 7, Xinhua reports. According to the spokesperson, Wang Yi, a member of the Political Bureau of the CPC Central Committee and director of the Office of the Central Commission for Foreign Affairs, will hold talks and exchanges with Patrushev. No agenda was given.", "url": "https://english.news.cn/20261007/eba356c75abe4c8a8021a3919db64238/c.html"}]}, "2026-10-09": {"date": "2026-10-09", "dayOfWeek": "Friday", "totalArticles": 108, "sourceCounts": {"WSJ": 19, "ST": 24, "BT": 14, "SCMP": 22, "TASS": 15, "XINHUA": 14}, "executiveDigest": "The Gulf war spread further. Projectiles struck the tanker Acers about 51 nautical miles off Qatar late on Oct 7, and a senior regional official told Reuters that Iran will treat any new oil export route through Hormuz as hostile (ST). December Brent rose 4.4% to US$104.73 a barrel, also lifted by Hurricane Isaias, which has shut in 25% of US Gulf of Mexico output (WSJ). President Trump said the US will not strike Iran before the Nov 3 midterms while keeping the blockade (WSJ), and Treasury sanctioned 17 more shadow-fleet vessels (ST). The state agencies stress diplomacy. TASS quotes Iran's foreign minister as saying written messages are still passing through intermediaries, and reports Putin telling Iran's president that Tehran is seeking an end to the conflict. Xinhua relays an Axios report that the Pentagon has told CENTCOM to prepare to resume major combat. Treasuries got a reprieve, with the 10-year yield ending at 5.232% (WSJ). The AI boom drove the WTO to more than double its 2026 goods-trade growth forecast, to 3.9% from 1.9% (WSJ), and Samsung guided to a record 107.4 trillion won quarterly operating profit (ST). At home, PM Lawrence Wong set out how Singapore will share AI's gains (ST), and OUE Reit confirmed exclusive talks with IOI Properties and CapitaLand Investment on One Raffles Place (BT).", "briefingCards": [{"title": "Lead story - Attacks spread deeper into the Gulf as Washington pairs a midterm strike pause with more sanctions", "body": "Several projectiles struck the chemical tanker Acers north of Qatar late on Oct 7, causing casualties and raising fears that attacks on shipping are spreading beyond the Strait of Hormuz (WSJ). A senior regional official close to Tehran told Reuters that Iran has warned Gulf states that any attempt to open new oil export routes through the strait would be considered hostile, and a diplomat said this could mean missile and drone attacks (ST). Kpler counted 10 tankers struck inside the strait from Sept 28 to Oct 4, a weekly record, and Hormuz-linked flows fell 27% that week (WSJ). President Trump said on Oct 8 that the US will not attack Iran before the Nov 3 midterms, citing 'productive discussions', while the naval blockade stays in force and a fresh carrier strike group heads to the region (WSJ). The Treasury sanctioned 17 more vessels under 'Operation Economic Outcast', and a Treasury official said Iran has only about 20 million barrels of crude left on ships outside the blockade (ST). Around Saudi Arabia, the Houthis fired a ballistic missile at Riyadh airport (ST), and Turkey is weighing air-defence and electronic-warfare support for Riyadh under the Mecca pact but has ruled out offensive operations (ST). The state agencies frame the war through diplomacy. TASS reports Iranian Foreign Minister Abbas Araghchi as saying written messages are still being exchanged with Washington through intermediaries over Iran's 'seven-day plan' (TASS). It also quotes Putin telling Iranian President Masoud Pezeshkian that the conflict did not break out through Iran's fault (TASS), and carries Rubio's claim that Hormuz oil flows are back to nearly 80% of February levels (TASS). Xinhua leads instead on an Axios report that the Pentagon ordered CENTCOM to prepare to resume major combat, possibly before the midterms (Xinhua)."}, {"title": "Markets & finance - Treasuries get a reprieve as the US deficit nears US$2 trillion", "body": "The 10-year Treasury yield ended Oct 8 at 5.232%, down from as high as 5.365% early on Oct 7, and investors say mortgage-hedging and futures pressures behind the selloff may be fading; the S&P 500 fell 0.5% and the Nasdaq more than 1.2% (WSJ). Fed Governor Christopher Waller said more hikes are likely needed but that there is 'flexibility' on timing, leaving room for a pause on Oct 27-28 after September's rise to 3.75%-4% (BT). Initial jobless claims fell for a fifth straight week to 197,000 (WSJ). The CBO put the fiscal 2026 deficit at US$1.993 trillion, up 12%, with net interest above US$1.1 trillion (WSJ). In Europe, German exports fell 0.8% in August, the biggest drop since November 2025 (WSJ), yet Berlin raised its 2026 growth forecast to 1.3% from 0.5% (Xinhua), and ECB chief economist Philip Lane said he has seen no 'noticeable pickup' in wages (WSJ). UK card defaults have risen for six straight quarters, the first such run since 2008-09 (BT). In Asia, more than 60% of Hong Kong's third-quarter IPOs trade below issue price and cornerstone investors are getting cold feet, people familiar say (SCMP), even as Bank of America finds global funds have moved to neutral on Chinese equities after four years underweight (SCMP). Japanese bankruptcies hit a 13-year high for April-September (Xinhua). Panmure Liberum's Joachim Klement warned that the AI trade could unwind in 2027 or 2028 and set the most bearish target of the strategists Bloomberg tracks, 5,000 for the S&P 500 (ST). The PBOC said the yuan has risen 23% against the dollar since 2005 and that China has 'no need or intent' to devalue (Xinhua)."}, {"title": "Asia realignment - EU-China talks open with low hopes while Moscow courts Beijing", "body": "China and the EU began trade talks in Beijing on Oct 8 with little hope of a breakthrough. France and Germany had proposed on Oct 5 a tool that would let Brussels quickly shut a threatening country out of the single market, and Chinese firms in autos, medical equipment and chemicals expect more friction (SCMP). People familiar with the plans say German President Frank-Walter Steinmeier plans his first official China visit since 2018 even as Berlin blocked a Cosco deal for Hamburg logistics firm Zippel (SCMP). Analysts doubt the Xi-Trump summit has produced a 'G2', and one NUS fellow says it stirred unease in India (SCMP). Former US officials warned that Taiwan policy has become transactional, and one former strike-group commander said the Iran war has left no US carriers or destroyers in the western Pacific (SCMP). Taiwan's Apex Aviation recorded the first known Chinese militia boat off Taiwan's east coast (ST), and Japan and the US will rehearse deploying anti-ship missiles to Yonaguni in Keen Sword 27 from Oct 19 (SCMP). South Korea test-flew its first home-grown hypersonic weapon (SCMP) and recalled its ambassador from Ukraine over North Korean prisoners of war (ST), and an ST analysis argues that Seoul is drifting towards Moscow (ST). Over Ukraine, Rubio called the war a dangerous stalemate and the Kremlin agreed (ST); Witkoff and Kushner meet Ukrainians in Miami on Oct 9 (ST) and plan a Moscow trip in late October, TASS reports, citing Axios (TASS). The SCMP ties Nikolai Patrushev's China trip to talk of a three-way Xi-Putin-Trump meeting at Apec (SCMP). In the agencies, Xinhua reports a He Lifeng video call with the UK Chancellor and French adviser Emmanuel Bonne's Oct 9-13 visit (Xinhua). TASS carries the Russian embassy's line that the new UK sanctions will not change Moscow's course (TASS)."}, {"title": "Energy & climate - Hurricane Isaias and Gulf attacks lift oil while Middle East LNG exports halve", "body": "December Brent rose 4.4% to US$104.73 a barrel on Oct 8 and WTI 4.4% to US$91.41, as Gulf shipping risks combined with shut-ins ahead of Hurricane Isaias (WSJ). The Marine Minerals Administration said 511,619 barrels a day, about 25% of US Gulf of Mexico output, was shut in by midday Oct 7. Chevron, Shell, Harbour Energy and BP are cutting output or evacuating staff ahead of a landfall expected late Friday or early Saturday (WSJ). The IEA said members backed speeding up the remaining emergency stock releases, which would add about 100 million barrels to the 325 million already released (WSJ). The WTO says Middle East crude exports fell about 24% and LNG exports about 47% in the first half, but higher shipments elsewhere, including Malaysia's LNG, held global declines to about 6% and 1% (WSJ); TASS leads its version on the 47% LNG drop (TASS). The Houthis told workers at all Saudi oil facilities to stay away from targeted sites, TASS reports (TASS), and Iran's atomic energy chief Mohammad Eslami said IAEA inspections of attacked facilities are impossible (TASS). Fitch unit BMI says India's purchases of Russian oil, about 50.8% of its July imports, remain a main obstacle to a US-India trade deal, TASS reports (TASS). Devon Energy is selling its Eagle Ford assets to Crescent Energy for US$4.2 billion in cash to capitalise on high prices (WSJ). On climate and water, Batam residents protested at Nongsa Digital Park over months-long water cuts that an official blames on El Nino (ST). Xinhua reports highway charging of new energy vehicles rose 51.42% over the National Day holiday (Xinhua) and the start of construction on Australia's Nolans rare earths project (Xinhua)."}, {"title": "Technology & AI - Record chip numbers as OpenAI narrows the gap with Anthropic", "body": "Samsung estimated third-quarter operating profit of 107.4 trillion won, the first time any tech company has topped 100 trillion won in a quarter, as an AI-driven memory shortage lifts DRAM, NAND and HBM prices (ST). TSMC's third-quarter revenue rose 50% to a record NT$1.49 trillion, beating forecasts (BT). Among the model makers, an OpenRouter analysis found business spending on OpenAI roughly level with Anthropic in September, against Anthropic's three-quarter share at the start of the year, after OpenAI cut prices (WSJ). The FT reports that OpenAI's annualised revenue is closer to US$50 billion than the US$70 billion previously reported (BT). Funding signals are mixed. Nvidia-backed Firmus scrapped what would have been Australia's largest IPO in almost 30 years (WSJ), while SK Hynix's Solidigm has picked banks for a US IPO in 2027 that could raise about US$10 billion, people familiar say (BT). Tencent is weighing a bond sale of up to US$5 billion, people familiar say (ST). Biren fell 11.9% on a HK$4 billion placement (SCMP), and Alibaba's AI cloud revenue is forecast to grow about 50% (SCMP). The Pentagon announced a quantum push worth about US$350 million (SCMP), and quantum start-up Oratomic is now valued at US$5.4 billion (WSJ). CrowdStrike says a suspect in the South Korean bank hacks may be a Guangdong resident who used Anthropic's Claude Code (BT). Anthropic has added Chinese-language options to Claude while still blocking mainland China (SCMP), and JD Vance suspended Microsoft from the H-1B green-card route (WSJ). TASS quotes Deputy Defence Minister Yunus-Bek Yevkurov as saying AI-equipped drones can now seek and engage targets on their own (TASS). Yandex said it cannot yet confirm whether equipment at its Sasovo data centre, hit by a Ukrainian drone strike, can be restored; the site houses two of its three AI supercomputers (ST)."}, {"title": "Singapore & SEA focus - Wong's AI compact, UOB's graduate hiring and a CBD office deal", "body": "Speaking at the Forbes Global CEO Conference on Oct 8, PM Lawrence Wong said Singapore will protect every worker rather than every job, relying on its tripartite compact, and called for international rules on frontier AI. He credited chipmakers such as GlobalFoundries and Micron for three straight years of 5% growth but warned that no boom lasts forever (ST). UOB plans to hire 1,000 young graduates over the next 12 months and train 5,500 managers for AI by end-2027 (ST). At the Milken Institute Asia Summit, Goldman Sachs' Kevin Sneader said new hires now oversee AI agents from day one, and MAS managing director Chia Der Jiun said banks will need fewer fresh graduates for analysis work (BT). On property, OUE Reit confirmed exclusive talks with IOI Properties and CapitaLand Investment over One Raffles Place, which market estimates value at S$2.3 billion to S$2.4 billion (BT); IOI chief Lee Yeow Seng told ST that Marina Bay is 'the best address in Singapore' (ST). Temasek's Seviora will merge Azalea, SeaTown and Seviora Capital from Jan 1, 2027 (BT). A BT opinion piece argues that the SGX-Nasdaq Global Listing Board's 15% local-raise rule is a hurdle, since DayOne would have needed S$750 million from Singapore (BT). A source told the SCMP that the HKMA has questioned HSBC over putting its new AI centre in Singapore (SCMP). Elsewhere in the region, Penang is reclaiming a 930ha 'Silicon Island' financed by Gamuda (ST), four Malaysian chip designers and Singapore's Quest Global joined Rapidus' 2nm design ecosystem (BT), and Batam residents blame the data-centre boom for months-long water cuts (ST). Xinhua reports Australia's rents have stalled at an affordability ceiling (Xinhua)."}], "keyMetrics": [{"value": "108", "label": "Articles curated today", "sub": "WSJ 19 · ST 24 · BT 14 · SCMP 22 · TASS 15 · Xinhua 14"}, {"value": "US$104.73", "label": "December Brent, Oct 8", "sub": "+4.4% on the Gulf tanker attack and Hurricane Isaias shut-ins (WSJ)"}, {"value": "25%", "label": "US Gulf of Mexico oil output shut in", "sub": "511,619 b/d as of midday Oct 7, ahead of Hurricane Isaias (WSJ)"}, {"value": "5.232%", "label": "US 10-year yield, Oct 8 close", "sub": "Down from as high as 5.365% early Oct 7 (WSJ)"}, {"value": "107.4T won", "label": "Samsung Q3 operating profit estimate", "sub": "First tech company above 100 trillion won in a quarter (ST)"}, {"value": "2.14B", "label": "Cross-regional trips, China's Oct 1-7 holiday", "sub": "306 million a day, per the Ministry of Transport (Xinhua)"}], "articles": [{"id": "wsj-09oct-01", "title": "AI Investment Boom to Drive Fastest Global Trade Growth Since Financial Crisis, WTO Forecasts", "source": "WSJ", "date": "09 Oct 2026", "tags": ["Trade", "Technology & AI", "Finance & Markets"], "summary": "The WTO on Oct 8 raised its 2026 forecast for global goods trade volume growth to 3.9% from 1.9% and its 2027 projection to 4.1% from 2.6%, citing an AI investment boom that has accelerated rather than slowed. After 4.2% growth in 2025, volumes would be more than 12% higher in 2027 than in 2024, a pace last seen before the 2008-09 crisis; AI-related goods made up almost half of trade growth in the first half of 2026. Gains are concentrated: the top 10 exporters of AI-enabling goods held 85% of such sales in 2025, and Asian exports are seen rising 9% this year while Europe's fall 0.1%. The US-Iran war cuts services trade growth to 3.3% in 2026, from 4.8% projected in March.", "url": "https://www.wsj.com/economy/trade/ai-investment-boom-to-drive-fastest-global-trade-growth-since-financial-crisis-wto-forecasts-ef3b309f"}, {"id": "wsj-09oct-02", "title": "Brent Gains More Than 4% on U.S.-Iran Tensions, Hurricane Isaias", "source": "WSJ", "date": "09 Oct 2026", "tags": ["Energy", "Finance & Markets", "Geopolitics"], "summary": "Oil prices jumped on Oct 8, with December Brent futures up 4.4% to US$104.73 a barrel and December WTI up 4.4% to US$91.41, as Persian Gulf shipping risks, US-Iran tensions and Gulf of Mexico shut-ins ahead of Hurricane Isaias combined. DNB Carnegie analyst Helge Andre Martinsen cited a tanker attack off Qatar, Houthi attacks on Saudi airports and reports of possible renewed US strikes on Iran. The US Marine Minerals Administration said 511,619 barrels a day, about 25% of Gulf output, was shut in as of midday Oct 7. The IEA said members backed accelerating remaining emergency stock releases, which would add roughly another 100 million barrels to the 325 million already released.", "url": "https://www.wsj.com/world/middle-east/oil-prices-rise-more-than-2-amid-houthi-attacks-u-s-gulf-shut-ins-51687549"}, {"id": "wsj-09oct-03", "title": "China Is Offering Half Measures to Its Mounting Economic Problems", "source": "WSJ", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Politics"], "summary": "A WSJ analysis says Beijing has answered a deepening slowdown with piecemeal steps rather than large stimulus, according to economists, as Xi Jinping prioritises technological self-sufficiency. Second-quarter GDP grew 4.3% year on year, the slowest in more than three years and below the 4.5%-5% target, with AI-related electronics driving more than half of quarter-on-quarter growth in the second half, per Capital Economics. Recent measures include a one-year, 1-percentage-point mortgage subsidy for first-time buyers that Morgan Stanley estimates covers only 16% of transactions, cheaper pledged supplementary lending, and a US$54 billion capital injection into eight large banks and insurers. HSBC's Frederic Neumann warns \"The risk is that you are too conservative for too long\".", "url": "https://www.wsj.com/world/china/china-is-offering-half-measures-to-its-mounting-economic-problems-3074211f"}, {"id": "wsj-09oct-04", "title": "Democrats expect to win he House. Here’s their to-do list.", "source": "WSJ", "date": "09 Oct 2026", "tags": ["Politics", "Society"], "summary": "House Democratic Leader Hakeem Jeffries said on Oct 7 he was \"very confident\" Democrats would win the House in the Nov 3 midterms and would move quickly to reverse Trump-era healthcare cuts and lower household costs. He said a Democratic House would target Trump's 2025 tax-and-spending law, which slashed more than US$1 trillion in healthcare spending, reversing Medicaid cuts and restoring expired enhanced ACA tax credits. Democrats need a net gain of three seats; Speaker Mike Johnson predicts Republicans will hold on. Jeffries also pledged to push back on the Iran war and tariffs and to investigate alleged corruption, led by Reps. Jamie Raskin and Robert Garcia, though any legislation faces a Senate filibuster and Trump's veto.", "url": "https://www.wsj.com/politics/elections/democrats-expect-to-win-the-house-heres-their-to-do-list-4e5976d8"}, {"id": "wsj-09oct-05", "title": "Devon Energy Sells Eagle Ford Assets to Crescent Energy for $4.2 Billion", "source": "WSJ", "date": "09 Oct 2026", "tags": ["Energy", "Finance & Markets"], "summary": "Devon Energy agreed to sell its Eagle Ford assets in Texas to Crescent Energy for US$4.2 billion in cash, exiting the basin to capitalise on elevated energy prices. The assets cover about 90,000 net acres in Karnes, DeWitt and Gonzales counties and account for roughly 4% of Devon's production; Crescent puts the net price at about US$3.85 billion after adjustments and says it gains about 68,000 oil-equivalent barrels a day of net production adjacent to its operations. Devon CEO Clay Gaspar said proceeds will accelerate share buybacks and cut debt. The deal, effective July 1, is expected to close around year-end, following Devon's roughly US$21.5 billion takeover of Coterra Energy in May.", "url": "https://www.wsj.com/business/energy-oil/devon-energy-sells-eagle-ford-assets-to-crescent-energy-for-4-2-billion-33e48b1c"}, {"id": "wsj-09oct-06", "title": "ECB’s Lane Not Seeing ‘Noticeable’ Pickup in Eurozone Wages", "source": "WSJ", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Society"], "summary": "ECB chief economist Philip Lane said on Oct 8 the central bank had not detected \"any noticeable pickup\" in eurozone wages, despite inflation rising to a three-year high in September. Investors expect the ECB to add to the two rate rises it has announced since June, with the key concern whether higher energy prices since the US-Iran war began in late February trigger larger pay demands. Speaking in London, Lane said worries about AI replacing workers and Chinese competition should temper wage claims, and firms facing weaker demand have not raised prices as they did in 2022. He said catch-up pay rises were likely, but demands driven by expectations of persistently high inflation would be worrying.", "url": "https://www.wsj.com/economy/global/ecbs-lane-not-seeing-noticeable-pickup-in-eurozone-wages-bec01297"}, {"id": "wsj-09oct-07", "title": "German Exports Fall Further, Clouding Picture of Resilience", "source": "WSJ", "date": "09 Oct 2026", "tags": ["Trade", "Finance & Markets"], "summary": "German exports fell 0.8% month on month in August to €137.6 billion, after a 0.5% drop in July, the statistics agency said on Oct 8, the largest decline since November 2025. Imports rose 0.9%, narrowing the trade surplus to €19.5 billion; exports to the US fell 6.3% after a fresh 10% US tariff on EU goods in July, while exports to the UK jumped 16.7%. ING's Carsten Brzeski said the data \"dents the narrative of German resilience\", also pointing to record-low Rhine water levels, while new factory orders plunged 10.6% in August. Trade association BGA nonetheless raised its 2026 export growth forecast to 1% from 0.6%.", "url": "https://www.wsj.com/economy/trade/german-exports-fall-further-651601c8"}, {"id": "wsj-09oct-08", "title": "Nvidia-Backed Firmus Scraps Australian IPO, Citing Market Conditions", "source": "WSJ", "date": "09 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Nvidia-backed cloud-computing firm Firmus Grid said on Oct 9 it had withdrawn its application to list on the ASX, scrapping what would have been Australia's largest IPO in almost 30 years, citing market volatility. The Sydney-based company had sought to raise almost US$5 billion at a market capitalisation above US$30 billion and will instead pursue private-market capital; it has a US$10 billion debt facility led by Blackstone. Some analysts questioned the valuation given Firmus has two data centres operating and five in development across Australia, Malaysia and Indonesia, versus CoreWeave's 50-plus at about US$37 billion. The move follows Oura's suspended Nasdaq listing last month amid surging bond yields and rate rises.", "url": "https://www.wsj.com/tech/nvidia-backed-firmus-scraps-australian-ipo-citing-market-conditions-4793fe60"}, {"id": "wsj-09oct-09", "title": "Oil Majors Cut Production in Gulf of Mexico as Hurricane Isaias Strengthens", "source": "WSJ", "date": "09 Oct 2026", "tags": ["Energy", "Environment"], "summary": "Oil companies in the Gulf of Mexico are curbing output and evacuating staff as Hurricane Isaias intensifies, with landfall on the northern Gulf Coast expected late Friday or early Saturday, the National Hurricane Center said. Chevron began shut-ins at four of its Gulf assets while five others remain normal, Shell is halting production at five sites, and Harbour Energy and BP are also cutting output or removing nonessential staff. The US Marine Minerals Administration said 511,619 barrels a day, 25% of current Gulf production, was shut in as of midday Oct 7. The shut-ins, plus Houthi attacks in Saudi Arabia and Persian Gulf tanker strikes, lifted December Brent 5% to US$105.23 a barrel on Oct 8.", "url": "https://www.wsj.com/business/harbour-energy-curbs-gulf-of-mexico-production-ahead-of-storm-isaias-48734408"}, {"id": "wsj-09oct-10", "title": "Quantum Startup Oratomic Now Worth $5.4 Billion After Series-B Funding", "source": "WSJ", "date": "09 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Pasadena-based quantum computing startup Oratomic raised US$475 million in a Series-B round just three months after its Series A, lifting its valuation to US$5.4 billion from US$1.5 billion. ARCH Venture Partners, Spark Capital, Khosla Ventures, Index Ventures, General Catalyst and Bezos Expeditions co-led the round, taking total funding to US$775 million. Founded in 2025, Oratomic is building a large-scale, fault-tolerant, error-corrected quantum computer, and CEO Dolev Bluvstein says its error-correction method could make a commercial machine possible with only 10,000 qubits versus the previous industry consensus of 1 million. Bluvstein says the new money will go to technical and engineering hurdles, and he expects the computer to be ready by 2030.", "url": "https://www.wsj.com/cio-journal/quantum-startup-oratomic-now-worth-5-4-billion-after-series-b-funding-538a80fc"}, {"id": "wsj-09oct-11", "title": "Tanker Attacks Push Deeper Into Gulf, Rattle Oil Markets", "source": "WSJ", "date": "09 Oct 2026", "tags": ["Energy", "Geopolitics", "Defence"], "summary": "The oil and chemical tanker Acers was struck by several projectiles north of Qatar late on Oct 7, causing casualties, according to Vanguard and the UK Maritime Trade Operations agency, raising fears that attacks on shipping are spreading beyond the Strait of Hormuz. It was not confirmed that Iran was responsible, though Iranian state-linked media have reported Iranian strikes on several tankers in recent weeks. Brent rose around 5% to more than US$105 a barrel on Oct 8; Kpler counted 10 tankers struck inside the strait from Sept 28 to Oct 4, a weekly record for the year, and Hormuz-linked flows fell 27% that week. Analysts say Tehran, whose crude loadings fell to zero in September under the US blockade, aims to pressure Washington before the midterms.", "url": "https://www.wsj.com/world/middle-east/tanker-attacks-push-deeper-into-the-gulf-and-rattle-oil-markets-24666ef9"}, {"id": "wsj-09oct-12", "title": "The AI Price War Is Heating Up—and OpenAI Is Gaining Ground on Anthropic", "source": "WSJ", "date": "09 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "OpenAI is closing the gap with Anthropic in business AI spending as cost-conscious companies shift to cheaper models, with an OpenRouter analysis of some 120,000 companies finding spending roughly even between the two in September, versus Anthropic's three-quarters share at the start of the year. Founders cite OpenAI's June GPT-5.6 lineup (Sol, Terra, Luna) as a turning point, after which it cut Luna's price by 80% and Terra's by 20%; some users also balked at guardrails and 30-day data retention on Anthropic's Fable 5. Ramp data briefly showed OpenAI ahead in mid-September before Anthropic regained a slim lead. The contest matters as Anthropic works toward an IPO as soon as November and OpenAI likely lists next year.", "url": "https://www.wsj.com/tech/ai/the-ai-price-war-is-heating-upand-openai-is-gaining-ground-on-anthropic-48b8525b"}, {"id": "wsj-09oct-13", "title": "The U.S. budget deficit widened to nearly $2 trillion in the fiscal year that ended Sept. 30, deepening the federal government’s persistent red-ink trend", "source": "WSJ", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Politics"], "summary": "The US budget d
