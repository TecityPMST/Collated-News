, "Geopolitics"], "summary": "TASS, citing a report by Fitch unit BMI, says US efforts to get India to stop buying Russian oil and to open its market to US farm products remain the main obstacles to a US-India trade deal. BMI expects the two sides eventually to conclude a narrow interim deal but sees a near-term breakthrough as unlikely, noting Middle East disruption has reinforced India's incentive to keep alternative energy sources. Russian oil made up about 50.8% of India's oil imports in July 2026, and India's effective tariff rate on US goods is 13.6%, well below the roughly 35% set in February, according to the report. The US goods trade deficit with India stood at US$58.42 billion in 2025.", "url": "https://tass.com/economy/2199347"}, {"id": "tass-09oct-13", "title": "Talks between Tehran, Washington ongoing — Iranian foreign minister", "source": "TASS", "date": "09 Oct 2026", "tags": ["Geopolitics"], "summary": "Iranian Foreign Minister Abbas Araghchi said indirect dialogue with the US is continuing, with the sides exchanging written messages through intermediaries, TASS reports, citing the Tasnim news agency. Araghchi said Tehran had put forward its proposal, the so-called seven-day plan, and Iranian representatives heard the US side's views on it. He said Iran is studying the US position and expects to respond within the next few days.", "url": "https://tass.com/world/2199321"}, {"id": "tass-09oct-14", "title": "US helped transport over 1.25 billion barrels of oil via Strait of Hormuz — CENTCOM", "source": "TASS", "date": "09 Oct 2026", "tags": ["Energy", "Defence", "Geopolitics"], "summary": "US Central Command said on X that US forces have supported the shipment of over 1.25 billion barrels of crude oil from Gulf partners and through the Strait of Hormuz in recent months, TASS reports. TASS recounts that the US and Israel launched a war against Iran on Feb 28, that a June memorandum envisaged a ceasefire on all fronts including Lebanon, and that the US resumed large-scale attacks overnight to July 8, accusing Iran of breaching the Hormuz terms. According to TASS, the Trump administration has recently signalled a shift from large-scale force to economic pressure through sanctions.", "url": "https://tass.com/world/2199595"}, {"id": "tass-09oct-15", "title": "Witkoff plans to discuss Ukrainian settlement in Moscow in late October — Axios", "source": "TASS", "date": "09 Oct 2026", "tags": ["Geopolitics", "Politics"], "summary": "TASS, citing Axios and its sources, reports that US President Donald Trump's envoys Steve Witkoff and Jared Kushner plan to visit Moscow in late October to discuss a Ukraine settlement. According to the sources, the administration hopes for a diplomatic breakthrough before the Nov 3 US congressional midterm elections and before winter. Axios reported that on Oct 8 Witkoff and Kushner presented their proposals to Trump and received instructions ahead of talks with a Ukrainian delegation in Miami, expected to last two days.", "url": "https://tass.com/world/2199603"}, {"id": "xinhua-09oct-01", "title": "Australian rare earths project begins construction", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Technology & AI", "Trade"], "summary": "According to Xinhua, the Australian government announced on Oct 8 that construction has begun on the Arafura Rare Earths Nolans Project in the Northern Territory, backed by A$1.2 billion (about US$850 million) in federal investment. The project, about 135 km north of Alice Springs, is expected to supply 4% to 5% of global rare earths demand, according to a joint statement by three Australian ministers cited by Xinhua. The government said the project would strengthen Australia's economic and national security by supplying critical materials for clean energy technologies and the defence industry.", "url": "https://english.news.cn/20261008/1963ec6e4d2b4f7da69ef575e77fbe8f/c.html"}, {"id": "xinhua-09oct-02", "title": "Australian rents stagnate as tenants hit affordability ceiling: report", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Society", "Finance & Markets"], "summary": "Median rent growth in Australia's capital cities stalled in the September quarter as tenants hit an affordability ceiling, Xinhua reports, citing a quarterly report released on Oct 8 by property marketplace Domain. Median asking rent for capital-city houses was A$700 a week in September, unchanged from June, while unit rents rose 1.5% to A$690; in Sydney, house asking rents fell 0.6% and unit rents were flat. Domain chief residential economist Nicola Powell said rents are absorbing a greater share of household incomes and smaller investors could be forced to sell if they cannot raise rents to offset holding costs. Xinhua notes Australia's central bank raised the cash rate at the end of September for the fourth time in 2026, to a 15-year high of 4.60%.", "url": "https://english.news.cn/20261008/cadf967b93ca4118bf5f20c943da1459/c.html"}, {"id": "xinhua-09oct-03", "title": "China Focus: China remains committed to letting market play decisive role in determining exchange rate: central bank", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "The People's Bank of China (PBOC) said in a statement on Oct 8 that China remains committed to letting market forces play a decisive role in setting the RMB exchange rate under its managed floating regime, Xinhua reports. The PBOC said the RMB has strengthened 23% against the US dollar since the 2005 reform, from 8.27 to around 6.7 per dollar, and by about 9% since 2025, while its BIS nominal effective rate is up over 50%. The bank said China has \"no need or intent\" to gain advantage through devaluation, and called citing idiosyncratic models as official evidence of RMB undervaluation a misuse of those findings. Huafu Securities chief economist Guan Tao said factors favouring a stronger RMB have the upper hand in the short term.", "url": "https://english.news.cn/20261008/f5024951b8954d30b5bcd0674031d9d3/c.html"}, {"id": "xinhua-09oct-04", "title": "China proposes new labor protections for gig workers", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Society", "Politics"], "summary": "China's Ministry of Human Resources and Social Security on Oct 8 released draft measures to protect workers in new forms of employment, inviting public feedback until Nov 8, Xinhua reports. If adopted, the rules would bring under labour-law protection workers managed by enterprises whose arrangements do not fully meet the criteria for a labour relationship, the first time China has done so through departmental rules. The draft covers basic labour rights, regulation of labour rules and algorithms, employment arrangements, dispute resolution and legal liabilities. Xinhua puts the number of workers in new forms of employment, including delivery riders and ride-hailing drivers, at about 84 million.", "url": "https://english.news.cn/20261008/43ff73f257e340f494ac0a7e1a5b9aaf/c.html"}, {"id": "xinhua-09oct-05", "title": "China unveils plan to expand, improve rehabilitation, nursing care services", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Society", "Technology & AI"], "summary": "China on Oct 8 unveiled an implementation plan by the National Health Commission and the National Development and Reform Commission to expand medical rehabilitation and nursing care services, Xinhua reports. Populous, rapidly ageing cities with growing demand are expected to have at least one public rehabilitation hospital and one public nursing care facility by 2030, with targets of about 0.48 beds per 1,000 people and 0.7 rehabilitation physicians and 1.6 therapists per 10,000 people. The plan prioritises prefecture-level cities with more than 1 million urban residents, calls for expanded university and vocational training, and encourages rehabilitation robots, smart wearables and other AI tools.", "url": "https://english.news.cn/20261008/45f343aabe7a4fad9ced11ffecfca521/c.html"}, {"id": "xinhua-09oct-06", "title": "China's highway NEV charging volume posts strong growth over National Day holiday", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Energy", "Technology & AI"], "summary": "China's highway new energy vehicle (NEV) charging volume reached 163 million kilowatt-hours over the Oct 1-7 National Day holiday, averaging 23.26 million kWh a day, up 51.42% year on year, according to National Energy Administration data reported by Xinhua. Official data cited by Xinhua show NEV ownership at 48.97 million, or 13.19% of all vehicles, with NEVs nearly half of new registrations in the first half of 2026. According to Xinhua, China has more than 24 million charging connectors and about 89,000 facilities at expressway service areas, which added around 11,000 high-power units from January to August. Xinhua says that by 2030 charging facilities are expected to exceed 40 million, including about 300,000 high-power units.", "url": "https://english.news.cn/20261008/561649bf4ed6411a80a5ffe99d841190/c.html"}, {"id": "xinhua-09oct-07", "title": "Chinese vice premier holds video call with British chancellor of the exchequer on economic, financial cooperation", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Geopolitics", "Finance & Markets"], "summary": "Chinese Vice Premier He Lifeng held a video call on Oct 8 with British Chancellor of the Exchequer John Healey on strengthening economic and financial cooperation, Xinhua reports. According to Xinhua, He, who leads the Chinese side of the China-UK Economic and Financial Dialogue, said the two sides should implement the consensus reached by their leaders, respect each other's core interests and promote stable bilateral economic relations. Healey, the British head of the dialogue, said Britain is willing to enhance economic and financial dialogue and cooperation with China, Xinhua reports.", "url": "https://english.news.cn/20261008/0d688fc67cdb445e8bbc0e304f14113c/c.html"}, {"id": "xinhua-09oct-08", "title": "Economic Watch: Holiday travel, spending boom mirror vitality of China's vast market", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Society"], "summary": "A Xinhua \"Economic Watch\" analysis says the Oct 1-7 National Day holiday showed the resilience of China's holiday economy, citing Ministry of Transport data of 2.14 billion cross-regional trips, averaging 306 million a day. Official data cited show average daily service-sector sales up 19.5% year on year, with tourism and entertainment up 23.6%, while the consumer goods trade-in programme drove 33.48 billion yuan in sales in the first six days. Xinhua cites Qunar data showing long-haul flight bookings up over 40% and county hotel bookings up 32%, and immigration data of 682,000 foreign entrants, up 5.4%. The NDRC said this year's trade-in bond allocation totals 250 billion yuan.", "url": "https://english.news.cn/20261008/5fca0e89d4a047918eda92117c3a5ecc/c.html"}, {"id": "xinhua-09oct-09", "title": "European Commission backs Italy's bid for defense, energy spending flexibility", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Politics", "Defence", "Energy"], "summary": "The European Commission has backed Italy's request for flexibility under EU fiscal rules to raise defence and energy security spending, a Commission spokesperson said on Oct 8, Xinhua reports. Italy filed on Sept 11, becoming the 19th EU member to seek activation of the national escape clause; the spokesperson said activation \"does not endanger fiscal sustainability over the medium term\" for Italy. The request now goes to the Council of the EU, which has one month to give final approval. The clause allows extra defence spending of up to 1.5% of GDP a year over 2025-2028, and energy security spending up to 0.3% of GDP a year within that ceiling.", "url": "https://english.news.cn/20261008/ba131c0ec1b1489cbf72c40e1b80f00a/c.html"}, {"id": "xinhua-09oct-10", "title": "French president's diplomatic adviser to come to China for China-France Strategic Dialogue", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Geopolitics"], "summary": "French presidential diplomatic adviser Emmanuel Bonne will be in China from Oct 9 to 13, a Chinese foreign ministry spokesperson announced on Oct 8, Xinhua reports. Wang Yi, a member of the Political Bureau of the Communist Party of China Central Committee and director of the Office of the Central Commission for Foreign Affairs, will hold a new round of the China-France Strategic Dialogue with Bonne, the spokesperson said.", "url": "https://english.news.cn/20261008/b4e74939b0f84fd4937628e17aae012b/c.html"}, {"id": "xinhua-09oct-11", "title": "German gov't raises 2026 growth forecast to 1.3 pct", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Politics"], "summary": "The German government on Oct 8 raised its 2026 growth forecast to 1.3% from 0.5%, citing stronger-than-expected resilience despite higher energy prices and geopolitical uncertainty, Xinhua reports. Economy Minister Katherina Reiche said exports and government consumption drove growth in the first half, while energy-driven inflation keeps private consumption subdued; growth is forecast to slow to 1.1% in 2027 and 0.6% in 2028, depending heavily on the Middle East and Ukraine. DIHK chief executive Helena Melnikov warned the recovery, driven by EU exports and debt-financed spending, could be short-lived without reforms, saying \"This upswing comes at a high cost\".", "url": "https://english.news.cn/20261008/e2e318085a2141af8172a02b5ca0e730/c.html"}, {"id": "xinhua-09oct-12", "title": "Japan bankruptcies hit 13-year high in April-Sept. period", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Society"], "summary": "Japanese corporate bankruptcies hit a 13-year high for the April-September period, credit research firm Tokyo Shoko Research said on Oct 8, according to Xinhua. It counted 5,373 failures with liabilities of at least 10 million yen, up 3.9% year on year and the most for a fiscal first half since 2013, while total liabilities rose 23.5% to 856.1 billion yen, the first annual increase in four years. Labour-shortage-related failures rose 17.1% to a first-half record 240, and price-related failures rose 17.8% to 436. The firm expects higher borrowing costs from Bank of Japan rate hikes to show up in bankruptcies in the second half of the fiscal year.", "url": "https://english.news.cn/20261008/428635784c504f6cb0a2c70cac39bc6a/c.html"}, {"id": "xinhua-09oct-13", "title": "Japan logs 4.06 trln yen current account surplus in August", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Finance & Markets", "Trade"], "summary": "Japan posted a current account surplus of 4.06 trillion yen (about US$25.7 billion) in August, up 12.0% year on year, according to preliminary Finance Ministry data reported by Xinhua on Oct 8. The goods trade balance swung to a 687.7 billion yen deficit from a 113.8 billion yen surplus a year earlier, owing to higher imports of crude oil and other commodities, with exports up 16.9% to 9.86 trillion yen and imports up 26.7% to 10.55 trillion yen. Primary income from overseas investments rose 21.6% to 5.13 trillion yen.", "url": "https://english.news.cn/20261008/b381e3791e37452a89fdba52824bf216/c.html"}, {"id": "xinhua-09oct-14", "title": "U.S. military ordered to prepare for possible Iran strikes ahead of midterm elections: report", "source": "XINHUA", "date": "09 Oct 2026", "tags": ["Geopolitics", "Defence", "Politics"], "summary": "Xinhua, citing an Axios report on Oct 7 that quoted US officials, says the Pentagon instructed US Central Command several days earlier to complete preparations for resuming major combat operations in Iran. US and Israeli sources told Axios the strikes could come before the Nov 3 US midterm elections and possibly before Israel's elections a week earlier, and could include massive bombing of Iranian energy, infrastructure and nuclear facilities. Xinhua adds that the Iran war has pushed up gas prices and that a Reuters/Ipsos poll released Oct 5 put President Donald Trump's approval at a record-low 32%.", "url": "https://english.news.cn/20261008/4efa49c5c8ee4f66a9d3f67fd6c62237/c.html"}]}};</script>
