<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tecity News Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#fbfbfa; --surface:#ffffff; --surface-2:#f6f6f4;
    --text:#16181d; --muted:#6c727e; --faint:#9aa0ab;
    --border:#ececec; --border-2:#e2e2e0; --ink:#16181d;
    --hover:#f4f4f2; --ring:rgba(20,23,28,.10);
    --shadow:0 1px 2px rgba(16,18,22,.04), 0 8px 24px rgba(16,18,22,.05);
    --shadow-sm:0 1px 2px rgba(16,18,22,.05);
    --wsj:#D85A30; --st:#1D9E75; --bt:#378ADD; --scmp:#D4537E;
    --maxw:1120px;
  }
  html[data-theme="dark"]{
    --bg:#0c0d10; --surface:#15171c; --surface-2:#1b1e25;
    --text:#eceef2; --muted:#9aa1ad; --faint:#6b7280;
    --border:#252830; --border-2:#2d313b; --ink:#eceef2;
    --hover:#1c1f26; --ring:rgba(255,255,255,.12);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-feature-settings:"cv02","cv03","cv04","ss01";
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    line-height:1.6;
  }
  ::selection{background:rgba(120,120,120,.18)}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px}
  .num{font-variant-numeric:tabular-nums}
  .eyebrow{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); font-weight:600}

  /* header */
  header.top{position:sticky; top:0; z-index:20; backdrop-filter:saturate(180%) blur(14px);
    background:color-mix(in srgb, var(--bg) 82%, transparent); border-bottom:1px solid var(--border)}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 28px; max-width:var(--maxw); margin:0 auto}
  .brand{display:flex; flex-direction:column; gap:2px; min-width:0}
  .brand .title{font-size:16px; font-weight:600; letter-spacing:-.01em}
  .brand .meta{font-size:12.5px; color:var(--muted)}
  .controls{display:flex; align-items:center; gap:10px}
  select.date{appearance:none; font:inherit; font-size:13px; font-weight:500; color:var(--text);
    background:var(--surface); border:1px solid var(--border-2); border-radius:10px; padding:8px 32px 8px 12px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239aa0ab' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right 10px center; cursor:pointer; transition:border-color .15s}
  select.date:hover{border-color:var(--ink)}
  .toggle{display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; cursor:pointer;
    background:var(--surface); border:1px solid var(--border-2); border-radius:10px; color:var(--muted); transition:.15s}
  .toggle:hover{color:var(--text); border-color:var(--ink)}
  .toggle svg{width:17px; height:17px}

  /* hero digest */
  .hero{padding:48px 0 14px}
  .hero .eyebrow{margin-bottom:16px}
  .digest{font-size:clamp(25px,3.6vw,37px); line-height:1.22; font-weight:400; letter-spacing:-.02em;
    max-width:none; color:var(--text)}
  .digest .lead{max-width:none}

  /* metrics */
  .metrics{display:grid; grid-template-columns:repeat(6,1fr); gap:14px; padding:30px 0 8px}
  .metric{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 18px 16px; box-shadow:var(--shadow-sm); transition:.18s}
  .metric:hover{box-shadow:var(--shadow); transform:translateY(-2px)}
  .metric .v{font-size:27px; font-weight:600; letter-spacing:-.03em; line-height:1.05}
  .metric .l{font-size:12.5px; font-weight:500; margin-top:8px}
  .metric .s{font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.4}

  /* tabs */
  .tabs{display:flex; gap:26px; margin:34px 0 0; border-bottom:1px solid var(--border)}
  .tab{position:relative; cursor:pointer; padding:0 0 14px; font-size:14px; font-weight:500; color:var(--muted); transition:color .15s}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--text)}
  .tab.active::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--ink); border-radius:2px}

  .section{padding:30px 0 0}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px}
  .section-head h2{margin:0; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:600}
  .section-head .hint{font-size:12.5px; color:var(--muted)}

  /* lead briefing card */
  .lead-card{background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:30px 32px; box-shadow:var(--shadow); margin-bottom:16px}
  .lead-card .k{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); font-weight:600; margin-bottom:12px}
  .lead-card h3{margin:0 0 12px; font-size:23px; font-weight:600; letter-spacing:-.02em; line-height:1.2}
  .lead-card p{margin:0; font-size:15.5px; color:var(--text); line-height:1.65; max-width:none; column-width:34ch; column-gap:48px; column-fill:balance}

  /* briefing grid */
  .cards{display:grid; grid-template-columns:repeat(2,1fr); gap:16px}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px 26px; box-shadow:var(--shadow-sm); transition:.18s}
  .card:hover{box-shadow:var(--shadow); transform:translateY(-2px)}
  .card h3{margin:0 0 10px; font-size:16.5px; font-weight:600; letter-spacing:-.01em; line-height:1.3}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.62}

  /* coverage / bars */
  .split{display:grid; grid-template-columns:1.5fr 1fr; gap:16px; align-items:start}
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px 26px; box-shadow:var(--shadow-sm)}
  .bar-row{display:flex; align-items:center; gap:14px; margin:14px 0}
  .bar-row .name{width:42px; font-size:12.5px; font-weight:600; letter-spacing:.02em}
  .bar-track{flex:1; height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden}
  .bar-fill{height:100%; border-radius:99px}
  .bar-row .cnt{width:26px; text-align:right; font-size:12.5px; color:var(--muted); font-weight:600}

  /* article */
  .feed-controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:4px 0 18px}
  .search{flex:1 1 260px; position:relative}
  .search svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--faint)}
  .search input{width:100%; font:inherit; font-size:14px; color:var(--text); background:var(--surface);
    border:1px solid var(--border-2); border-radius:12px; padding:11px 14px 11px 38px; outline:none; transition:.15s}
  .search input:focus{border-color:var(--ink); box-shadow:0 0 0 4px var(--ring)}
  .pills{display:flex; flex-wrap:wrap; gap:8px}
  .pill{cursor:pointer; font-size:12.5px; font-weight:500; color:var(--muted); background:var(--surface);
    border:1px solid var(--border-2); border-radius:99px; padding:7px 13px; user-select:none; transition:.14s; line-height:1}
  .pill:hover{border-color:var(--ink); color:var(--text)}
  .pill.active{color:#fff; border-color:transparent}
  .tagrow{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .count{font-size:12.5px; color:var(--muted); margin-bottom:14px}

  .article{padding:22px 4px; border-bottom:1px solid var(--border)}
  .article:first-child{padding-top:6px}
  .article .head{display:flex; align-items:center; gap:12px; margin-bottom:9px; flex-wrap:wrap}
  .src{display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:600; letter-spacing:.04em; color:var(--muted)}
  .src .dot{width:8px; height:8px; border-radius:99px}
  .article h4{margin:0; font-size:16.5px; font-weight:600; letter-spacing:-.01em; line-height:1.32; flex:1; min-width:240px}
  .article h4 a{color:inherit; text-decoration:none; transition:color .15s}
  .article h4 a:hover{color:var(--wsj-hover, var(--muted))}
  .article .date{font-size:12px; color:var(--faint); white-space:nowrap}
  .article p{margin:6px 0 12px; font-size:14.5px; color:var(--muted); line-height:1.62; max-width:88ch}
  .tags{display:flex; flex-wrap:wrap; gap:7px}
  .tag{font-size:11px; font-weight:600; letter-spacing:.01em; border-radius:99px; padding:3px 10px; border:1px solid transparent}

  .empty{text-align:center; color:var(--muted); padding:60px 0; font-size:14px}
  footer{padding:48px 0 60px; color:var(--faint); font-size:12px; text-align:center}

  @media(max-width:980px){
    .metrics{grid-template-columns:repeat(3,1fr)}
    .cards{grid-template-columns:1fr}
    .split{grid-template-columns:1fr}
  }
  @media(max-width:560px){
    .wrap,.topbar{padding-left:18px; padding-right:18px}
    .metrics{grid-template-columns:repeat(2,1fr)}
    .hero{padding-top:34px}
  }
</style>
</head>

<script>window.ALL_DAYS = {"2026-09-03":{"date":"2026-09-03","dayOfWeek":"Thursday","totalArticles":92,"sourceCounts":{"WSJ":22,"ST":24,"BT":22,"SCMP":24},"executiveDigest":"The global bond rout ran to multi-decade-high yields as oil-fuelled inflation fears and G-20 discord strained markets - the US dollar hit a seven-week high and gold a three-week low, while WSJ said 'G-20 squabbling overshadowed the summit'. Iran kept the pressure on: the US and Iran 'traded strikes for control of Hormuz', oil settled 1% higher, and Trump floated renaming the strait 'Trump Strait' even as his aides pushed to keep the war 'quiet' before the midterms. For Singapore, the picture brightened - economists lifted the 2026 growth forecast to 5% on the AI boom (MAS survey), factory activity expanded, and Keppel DC REIT upsized a placement to S$625 million - though DBS steered clients toward S-Reits over bank dividends amid the rate backdrop.","briefingCards":[{"title":"Lead story - Bond rout hits multi-decade-high yields","body":"The selloff intensified into the G-20: BT reported 'the global bond rout deepens as oil-fuelled inflation fears drive yields to multi-decade highs', WSJ said 'G-20 squabbling overshadowed the summit as global bond markets strain', and 'nothing this week suggested an end to the deficits, inflation and geopolitical disruptions roiling investors'. The dollar hit a seven-week high, gold a three-week low, and European shares fell - while ST explained 'how Japan's bond rout is turning the tide of global capital' as its yield climbed and the BOJ signalled a possible September hike (the yen surged on intervention alert). The Bank of Canada held 'as inflation worries intensified', the US House passed a bill 'to avert a shutdown', and the UK PM pledged to be 'grounded in fiscal responsibility'."},{"title":"Markets & finance","body":"Rates and safe havens dominated: gold slid 'as Middle East tensions fanned rate-hike fears', the dollar rose to multi-week highs, and US private payroll growth 'slowed in August' even as factory orders beat. G-20 finance chiefs 'backed action against trade-distorting policies' (China 'held out'), and SCMP reported 'the Dutch shifting 86 tonnes of gold from the US and Canada to the UK over geopolitical unrest'. Corporate results leaned AI: Broadcom's profit 'soared on custom-chip demand', HPE lifted its outlook, and Microsoft 'revealed Azure cloud sales in a reporting shift'. Big future numbers landed too - PwC projected 'global data-centre spending reaching US$31.6 trillion by 2050' - while Goldman, BofA and others 'plan to issue a joint dollar stablecoin in 2027'."},{"title":"Asia realignment","body":"'Xiplomacy' accelerated - BT said Xi 'began his busiest travel month since 2019' ahead of Trump talks, bolstering Mideast ties on an Egypt visit (with China-Egypt joint drills) and using an SCO summit to project reach: SCMP reported 'the SCO took a landmark stand on nuclear security as Iran came under renewed attack', 'Iran won SCO backing against US strikes', and analysts weighed 'how the SCO chips away at US power'. A trilateral 'Xi-Trump-Putin at APEC' is floated. Trade friction hardened: 'EU enforcers descended on Beijing demanding it fix untenable imbalances', the US 'said it's fed up with China's overcapacity - and more countries agree', and China opened up - 'handing out nearly US$7 billion in QDII quotas' and prepping the 'US$10.8 billion Pinglu Canal' to supercharge ASEAN shipments."},{"title":"Energy & climate","body":"Iran stayed the swing factor: the US and Iran 'traded strikes for control of Hormuz', oil 'settled 1% higher' as US crude stockpiles fell more than expected, and Trump 'floated renaming the strait Trump Strait' while pressing 'squeezed US refiners to ease pump prices' and wanting 'Big Oil to build more refineries (a tough sell)'. Supply reshuffled - Chevron will 'invest US$7 billion in Venezuela, doubling production', Iraq's exports rose to ~2.34 million bpd - and a Saudi nuclear agreement 'could open a path to 20% enrichment'. Closer to home, ST reported 'if Singapore decides on nuclear power, major grid changes may not be required', a 2015-style haze is 'unlikely due to a later El Nino onset', and MPs will 'push for food resilience as climate and geopolitical crises lift prices'."},{"title":"Technology & AI","body":"AI capex and IP policy advanced together: HPE and Broadcom results underscored demand, PwC pegged data-centre spending at US$31.6 trillion by 2050, and 'tech CEOs and the Trump administration asked the G-20 to adopt pro-AI policies' - with the US 'backing OpenAI in a copyright fight with publishers' and urging that 'AI be allowed to train on creators' work'. Google 'avoided a breakup of its ad business'. China's self-reliance surged: 'AMEC unveiled six chip-making machines in a day', 'Hua Hong is investing US$2 billion in a new fab', its 'tech push fuelled the fastest profit growth in four years', and Beijing 'cracked down on AI slop'. SCMP assessed what 'Anthropic's Fable 5.1 means for the US-China model race', and Tencent's Hy4 gained in open-source rankings."},{"title":"Singapore & SEA focus","body":"Singapore's outlook brightened: 'economists raised the 2026 growth forecast to 5% on the AI boom' (MAS survey), 'factory activity expanded in August' despite an Iran-war supply-chain crunch, and analysts said 'falling AI token costs could fuel the next leg of the Singapore semiconductor rally'. Capital kept moving - 'Keppel DC REIT upsized a private placement to S$625 million on strong demand' - though 'DBS analysts bet on S-Reits over bank dividends' amid the rate backdrop, and observers said a 'heavy EV incentive cut could ease COE premiums'. Regionally, Singapore and Indonesia 'pushed ahead with an AI trade platform (eyeing a 2027 Jakarta forum)', Singapore and Thailand will 'develop a multi-year agenda for successive ASEAN chairmanships', and SCMP asked whether Singapore can be 'the natural choice to bridge ASEAN and Central Asia'."}],"keyMetrics":[{"value":"92","label":"Articles curated today","sub":"WSJ 22 · ST 24 · BT 22 · SCMP 24"},{"value":"Multi-decade","label":"Bond yields surge","sub":"Dollar 7-wk high; gold 3-wk low"},{"value":"5%","label":"SG 2026 growth forecast","sub":"Raised on AI boom (MAS survey)"},{"value":"'Trump Strait'","label":"US-Iran trade strikes","sub":"Oil settles 1% higher"},{"value":"S$625m","label":"Keppel DC REIT placement","sub":"Upsized on 'strong demand'"},{"value":"US$31.6t","label":"Data-centre spend by 2050","sub":"PwC on the AI boom"}],"articles":[{"id":"wsj-01","title":"A jittery Treasury market and the prospect of Fed rate increases risk making life more expensive for already cost-pressured Americans","source":"WSJ","date":"3 Sep 2026","tags":["Finance & Markets","Society"],"summary":"Worries over a protracted Iran conflict, swelling fiscal deficits and possible rate hikes are rattling global bond markets, with effects rippling far beyond Treasurys. Rising yields lift borrowing costs on mortgages, auto loans and corporate bonds, deepening housing-affordability strains as 30-year mortgage rates near 7%. Regular gasoline averages about $4.10 a gallon versus $3.19 a year ago. With inflation at 3.7% in July, futures imply roughly 70% odds of a September quarter-point hike and about 90% for at least one increase by year-end. Fed Chairman Kevin Warsh signaled more work ahead. Higher rates threaten the AI-fueled S&P 500 rally, up nearly 20%, which has propped up consumer spending and record data-center construction.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/A%20jittery%20Treasury%20market%20and%20the%20prospect%20of%20Fed%20rate%20increases%20risk%20making%20life%20more%20exp.pdf"},{"id":"wsj-02","title":"Apple to Give New CEO $3 Million Salary","source":"WSJ","date":"3 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Apple plans to pay new Chief Executive John Ternus an annual salary of $3 million plus a targeted annual stock award of $55 million for fiscal 2027, according to an SEC filing. Ternus's salary rose effective Tuesday, the day he officially took the helm of the iPhone maker. Of the targeted equity award, 75% will be granted in performance-based restricted stock units vesting on Apple's total shareholder return relative to other S&P 500 companies; the rest are time-based RSUs vesting semiannually over four years. Ternus will also get a prorated RSU award targeted at $2.5 million for his time as CEO in fiscal 2026. Apple will pay former CEO Tim Cook a $2 million salary, effective Sept. 26, and a $45 million targeted equity award.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/Apple%20to%20Give%20New%20CEO%203%20Million%20Salary.pdf"},{"id":"wsj-03","title":"Australia's Second-Quarter Growth Stronger Than Expected","source":"WSJ","date":"3 Sep 2026","tags":["Finance & Markets"],"summary":"Australia's economy grew 0.4% in the second quarter and 2.1% from a year earlier, beating market expectations of around 1.8% annual growth, the Australian Bureau of Statistics said. The result strengthens the case for the Reserve Bank of Australia to raise rates further amid sticky inflation, with some economists expecting a fourth increase this year this month. Households stayed cautious: consumption rose 0.4%, with fuel use falling on elevated prices and reduced travel tied to the Middle East conflict, while vehicle purchases jumped 10.3% as EV adoption continued. Private business investment fell 0.5%, dragged by weaker data-center spending. Weak growth alongside high inflation reflects poor productivity. Rising rates and higher property taxes have driven house prices down sharply over five months.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/Australia's%20Second-Quarter%20Growth%20Stronger%20Than%20Expected.pdf"},{"id":"wsj-04","title":"Bank of Canada Keeps Rate Steady as Inflation Worries Intensify","source":"WSJ","date":"3 Sep 2026","tags":["Finance & Markets","Trade"],"summary":"The Bank of Canada left its main interest rate unchanged at 2.25% for a seventh straight decision but adopted a more alarmed tone on inflation risks amid new cross-border tariffs and no end to the Middle East war. Governor Tiff Macklem said inflation, around 3%, remains too high and could rise as crude prices stay elevated, warning the bank is prepared to raise rates more than once if needed. The hawkish stance surprised economists, all of whom had expected the pause to emphasize growth risks from U.S.-Canada trade friction. The Canadian dollar strengthened and two-year yields climbed above 3.1%. Second-quarter growth reached 3.3% annualized, beating forecasts. New U.S. tariffs of 50% on certain goods, plus retaliation, pose fresh risks.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/Bank%20of%20Canada%20Keeps%20Rate%20Steady%20as%20Inflation%20Worries%20Intensify.pdf"},{"id":"wsj-05","title":"Broadcom Third-Quarter Profit Soars on Growing Custom Chip Demand","source":"WSJ","date":"3 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Broadcom more than tripled profit and nearly doubled revenue in its third quarter, driven by demand for custom AI chips it designs for labs such as OpenAI, Anthropic and Google. CEO Hock Tan said compute needs will \"inflect even more in 2027 and 2028.\" Custom chips made up 73% of the quarter's $16.7 billion in AI semiconductor revenue, expected to reach $21.7 billion next quarter. Broadcom has secured supply to double AI chip revenue to $115 billion in fiscal 2027, with a path to $230 billion in 2028. Profit was $13.09 billion, or $2.68 a share; adjusted earnings of $3.32 beat the $3.22 estimate. Revenue rose to $29.59 billion. Shares were roughly flat after-hours amid a memory-chip bottleneck.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/Broadcom%20Third-Quarter%20Profit%20Soars%20on%20Growing%20Custom%20Chip%20Demand.pdf"},{"id":"wsj-06","title":"Chevron to Invest $7 Billion in Venezuela, Doubling Production","source":"WSJ","date":"3 Sep 2026","tags":["Energy","Geopolitics"],"summary":"Chevron, Italy's ENI and other energy firms signed deals in Caracas to pour billions into Venezuela's oil fields, the first big win for the Trump administration's push to revitalize the industry since it ousted Nicolas Maduro in January. Chevron will invest more than $7 billion over five years, doubling its output to 600,000 barrels a day and adding two heavy-oil fields to its Petroindependencia joint venture with PdVSA, at costs near $20 a barrel. Energy Secretary Chris Wright touted working at \"Trump speed.\" CEO Mike Wirth said new contract terms make investment more economic. The deals are separate from Trump's move to take a 35% stake in North American Blue Energy Partners. ExxonMobil and ConocoPhillips stayed on the sidelines, still seeking restitution over 2007 nationalizations.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/Chevron%20to%20Invest%207%20Billion%20in%20Venezuela,%20Doubling%20Production.pdf"},{"id":"wsj-07","title":"China's Xi Bolsters Mideast Ties With Egypt Visit Ahead of Planned U.S. Trip","source":"WSJ","date":"3 Sep 2026","tags":["Geopolitics","Politics"],"summary":"Chinese leader Xi Jinping opened a state visit to Egypt aimed at reinforcing Beijing's ties with a key U.S. partner, part of a diplomatic offensive before an expected Washington trip. Xi told President Abdel Fattah Al Sisi that China backs a new regional security architecture and opposes interference by \"external forces,\" clear swipes at the U.S. six months after its attacks on Iran. With Strait of Hormuz shipping disrupted, Xi offered to help \"safeguard the security of international shipping lanes.\" Analysts said the timing signals China has many friends as the U.S. alienates allies. Trump said he invited Xi to visit Sept. 24, unconfirmed by Beijing. The trip follows Xi's Shanghai Cooperation Organization speech in Bishkek attacking \"hegemonism\" and protectionism.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/China's%20Xi%20Bolsters%20Mideast%20Ties%20With%20Egypt%20Visit%20Ahead%20of%20Planned%20U.S.%20Trip.pdf"},{"id":"wsj-08","title":"Defunding the U.S. Military","source":"WSJ","date":"3 Sep 2026","tags":["Defence","Politics"],"summary":"The Journal's editorial board argues U.S. military readiness is deteriorating in the Middle East while Washington fails to fund it. The Navy's top officer says the fleet is $6 billion to $8 billion short of what it needs this fiscal year owing to the Iran conflict. The administration sought $67 billion in supplemental Pentagon funding, but Democrats are blocking it, while the proposed $1.5 trillion defense budget relies on Republicans passing $350 billion through reconciliation. Planners warn U.S. forces lack air cover for a long war with China or Russia after firing half its Patriot interceptors within weeks in Iran. The Pentagon wants 3,200 advanced Patriots; about 2,900 sit in a stalled reconciliation bill. Golden Dome funding is also at risk.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/Defunding%20the%20U.S.%20Military.pdf"},{"id":"wsj-09","title":"G-20 Squabbling Overshadows Summit as Global Bond Markets Strain","source":"WSJ","date":"3 Sep 2026","tags":["Finance & Markets","Geopolitics","Trade"],"summary":"The G-20 finance ministers' gathering in Asheville, N.C., closed amid a global bond selloff, tariff spats, public insults and a fight over a group photo. As the summit ended, the 10-year Treasury yield rose to 4.795%, the highest of Trump's second term, with the U.S. carrying $40 trillion in government debt. Treasury Secretary Scott Bessent argued growth can outrun debt, but China's objection blocked a consensus statement. Bessent mocked Canada's military and Trump renamed Lake Ontario; Europeans bristled at Russia's finance minister being invited, excluding him from the family photo. Bessent said China agrees Iran cannot have a nuclear weapon and backs Hormuz navigation. He likened Iran to a decapitated snake. Warsh weighs a rate hike; the July labor market lost 23,000 jobs.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/G-20%20Squabbling%20Overshadows%20Summit%20as%20Global%20Bond%20Markets%20Strain.pdf"},{"id":"wsj-10","title":"Google Avoids Breakup of Dominant Ad Business","source":"WSJ","date":"3 Sep 2026","tags":["Technology & AI","Politics"],"summary":"A federal judge rejected the Justice Department's request to dismantle Google's online advertising business, the second time a court denied government efforts to break up the company after it was found liable for illegal monopoly tactics. U.S. District Judge Leonie Brinkema in Alexandria, Va., adopted more restrained remedies curbing Google's control over how publishers use its ad technology instead of forcing a sale of its ad exchange. The ruling effectively closes nearly two decades of U.S. antitrust risk for Alphabet's Google and deals another blow to the antimonopoly movement. It follows setbacks in the Google search case and Meta's FTC breakup case. Brinkema had earlier found Google charged a 20% fee that reduced publisher earnings. Google made $7.3 billion from network ads last quarter.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/Google%20Avoids%20Breakup%20of%20Dominant%20Ad%20Business.pdf"},{"id":"wsj-11","title":"HPE Boosts Outlook as AI Demand Drives Surge in Third-Quarter Profit","source":"WSJ","date":"3 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Hewlett Packard Enterprise lifted long-term growth targets after gains across both segments drove a more than fivefold profit increase in its third quarter, powered by broad AI adoption. Profit reached $1.54 billion, or $1.06 a share, versus $305 million a year earlier; adjusted earnings of $1.11 beat the 93-cent estimate. Revenue rose to $12.21 billion. CFO Marie Myers cited exceptional demand and flagged two pending multibillion-dollar deals. HPE now expects fiscal-year revenue growth of 34% to 37%, up from 29% to 33%, and adjusted EPS of $3.75 to $3.85. Cloud & AI revenue rose 25% to $9.04 billion, with server revenue up 35%. Networking revenue surged 75% to $2.89 billion following the Juniper acquisition. Fourth-quarter revenue is guided to $13.9 billion-$14.8 billion.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/HPE%20Boosts%20Outlook%20as%20AI%20Demand%20Drives%20Surge%20in%20Third-Quarter%20Profit.pdf"},{"id":"wsj-12","title":"Iran Regime Change Returns—Again","source":"WSJ","date":"3 Sep 2026","tags":["Geopolitics","Politics"],"summary":"In this opinion column, Barton Swaim argues the Trump administration again sees Iranian regime collapse as plausible. Treasury Secretary Scott Bessent said Iran's collapse could come \"within weeks or months\" given a shrinking economy, worthless currency and humiliated military. A port blockade has caused severe fuel shortages, echoing conditions before nationwide protests seven years ago. Swaim writes the regime must fall for Trump to call the war a success, and notes Trump has refused an easy exit despite unpopularity and reported weapons shortages. He cites Iran-linked assassination attempts on Trump and state media offering $10 million for his son Barron's life. Swaim urges Reaganesque rhetoric aimed at Iran's downtrodden, arguing words slip across borders despite censorship, invoking Trump's \"hour of your freedom\" address.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/Iran%20Regime%20Change%20Returns-Again.pdf"},{"id":"wsj-13","title":"Nothing in this week's G-20 suggested an end to the deficits, inflation and geopolitical disruptions that are roiling investors","source":"WSJ","date":"3 Sep 2026","tags":["Finance & Markets","Geopolitics"],"summary":"Greg Ip argues the G-20 summit gave bond investors no relief from out-of-control deficits, stubborn inflation and geopolitical disruption. U.S. 10-year yields hit 4.8%, the highest of Trump's presidency, but yields rose more in Japan, where the 10-year reached 3% for the first time in 30 years, and across Europe; France's is 4.21%, Britain's 5.15%. Bessent's claim that the U.S. can \"grow our way out\" of debt is not credible, Ip writes: growth hasn't rescued finances, an AI boom alone won't stabilize debt, and faster growth lifts rates. U.S. debt recently hit $40 trillion. Barclays' Ajay Rajadhyaksha says markets expect higher sustained short rates and warns a fiscal risk premium may eventually emerge, making bond markets harder for G-20 leaders to ignore.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/Nothing%20in%20this%20week's%20G-20%20suggested%20an%20end%20to%20the%20deficits,%20inflation%20and%20geopolitical%20d.pdf"},{"id":"wsj-14","title":"Russia Is Testing NATO's Ability to Hold Back From a Hot War","source":"WSJ","date":"3 Sep 2026","tags":["Defence","Geopolitics"],"summary":"Russia's growing string of small-scale attacks in Europe poses a dilemma for leaders wary of stumbling into a shooting war. NATO Secretary-General Mark Rutte said Russia has grown \"increasingly reckless,\" citing arson at arms factories and a failed Leipzig drone attack targeting a Ukrainian cargo plane. Germany said Russia crossed a line but kept its response measured, pledging fresh air-defense batteries and thousands of strike drones for Ukraine. Europeans favor pressuring Putin by boosting support for Kyiv, which is striking deep inside Russia and crippling resupply to Crimea. Critics like Nico Lange urge blocking Russia's \"shadow fleet\" and restricting diplomats. European officials attributed 20 recent sabotage incidents to Russia. Von der Leyen vowed to increase pressure and advance a new loan for air defenses within a EUR 90 billion package.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/Russia%20Is%20Testing%20NATO's%20Ability%20to%20Hold%20Back%20From%20a%20Hot%20War.pdf"},{"id":"wsj-16","title":"Tech CEOs, Trump Administration Ask G-20 to Adopt Pro-AI Policies","source":"WSJ","date":"3 Sep 2026","tags":["Technology & AI","Politics"],"summary":"Tech executives and Trump officials urged G-20 policymakers to minimize AI regulation, arguing strict rules could strangle an industry capable of supercharging growth and curing diseases. Nvidia's Jensen Huang, OpenAI's Sam Altman, Meta's Mark Zuckerberg and Elon Musk spoke at an innovation summit near Chapel Hill, N.C. Huang said, \"Don't regulate hypothetical, theoretical harm.\" Commerce Secretary Howard Lutnick and AI adviser David Sacks touted the light-touch strategy. The talks followed AI-model hacks and Bernie Sanders's call for a development pause; protesters decried data-center build-out amid a local moratorium. Musk said AI could grow the global economy 20% to 30%. The U.S. urged countries to avoid cheaper Chinese models; China signed broad innovation principles. Altman and Demis Hassabis noted the need for some global standards.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/Tech%20CEOs,%20Trump%20Administration%20Ask%20G-20%20to%20Adopt%20Pro-AI%20Policies.pdf"},{"id":"wsj-17","title":"The Navy's Overstretched Carrier Fleet","source":"WSJ","date":"3 Sep 2026","tags":["Defence","Politics"],"summary":"This editorial warns the U.S. Navy is dangerously short on combat power as heavy demands and a shrinking carrier fleet produce longer deployments that wear out crews and ships. The USS Abraham Lincoln spent more than 200 consecutive days at sea; the Gerald Ford returned after 326 days. A retention crisis looms among midcareer fighter pilots: the Navy needed 52 department heads in 2025 but only 31 accepted orders. Accident reports cite high operational tempo, chronic manning shortfalls and fatigue. As the Nimitz floats past its planned retirement, the fleet risks dropping below Congress's 11-carrier floor. The board argues new technology cannot compensate for deficits facing a possible protracted war with China, urging Trump to sustain his $1.5 trillion defense budget as the U.S. spends only 3% of GDP.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/The%20Navy's%20Overstretched%20Carrier%20Fleet.pdf"},{"id":"wsj-18","title":"Trump Wants Big Oil to Build More Refineries. That's a Tough Sell.","source":"WSJ","date":"3 Sep 2026","tags":["Energy","Politics"],"summary":"President Trump urged oil executives at the White House to build more refineries to lower gasoline prices before the November midterms, but the industry is unwilling. Owning a refinery is highly profitable now, with U.S. plants running above 97% of capacity and diesel crack spreads topping $100 a barrel, lifting the top six refiners' fuel-making profit to a combined $24.7 billion in the second quarter. But companies expect the war-driven boom to fade and won't spend billions on plants taking three to five years to build. Americans paid about $4.10 a gallon Tuesday, up from $2.98 before the Iran conflict. ExxonMobil skipped the meeting. The U.S. has 128 fewer refineries than in 1982; firms instead upgrade existing plants and shift toward diesel and petrochemicals as EVs erode gasoline demand.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/Trump%20Wants%20Big%20Oil%20to%20Build%20More%20Refineries.%20That's%20a%20Tough%20Sell..pdf"},{"id":"wsj-19","title":"U.S. Crude Oil Stockpiles See Larger-Than-Expected Drop","source":"WSJ","date":"3 Sep 2026","tags":["Energy","Finance & Markets"],"summary":"U.S. commercial crude oil inventories fell more than expected last week as refineries ran near full capacity, the Energy Information Administration said. Stocks excluding the Strategic Petroleum Reserve dropped 4.5 million barrels to 424.5 million, about 1% above the five-year average; analysts had expected only a 300,000-barrel decline. SPR oil fell 3.1 million barrels to 286.6 million. Crude production rose 19,000 barrels a day to 13.86 million, while imports climbed to 6.8 million and exports to 4.5 million barrels a day. Refinery capacity use rose to 98% from 97.4%. Gasoline inventories fell 1.2 million barrels to 205.7 million, 6% below the five-year average, with demand down 121,000 barrels a day. Distillate stocks rose 796,000 barrels but stayed 14% below average.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/U.S.%20Crude%20Oil%20Stockpiles%20See%20Larger-Than-Expected%20Drop.pdf"},{"id":"wsj-20","title":"U.S. Government Backs OpenAI in Copyright Fight With Publishers","source":"WSJ","date":"3 Sep 2026","tags":["Technology & AI","Politics"],"summary":"The U.S. government filed a statement supporting OpenAI in its legal battle with the New York Times and other publishers, arguing that training AI on news content falls within \"fair use\" under copyright law. A Justice Department letter said making it harder for large language models to train on copyrighted material would be inconsistent with copyright principles and thwart progress, calling such training \"exceedingly transformative.\" The Times, which sued Microsoft and OpenAI in December 2023, said the administration is siding with trillion-dollar AI companies at the expense of creators whose work was stolen. News Corp, the Journal's owner, has a licensing partnership with OpenAI. The filing reflects the administration's light-touch AI stance and argument that restrictive rules would benefit foreign adversaries in the race against China.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/U.S.%20Government%20Backs%20OpenAI%20in%20Copyright%20Fight%20With%20Publishers.pdf"},{"id":"wsj-21","title":"U.S. Says It's Fed Up With China's Overcapacity—and More Countries Agree","source":"WSJ","date":"3 Sep 2026","tags":["Trade","Geopolitics"],"summary":"A Group of 20 statement implicitly criticizing Beijing for overreliance on exports marks a new stage in international pressure on China's manufacturing juggernaut. Issued Tuesday at the Asheville, N.C., finance ministers' meeting, it said countries with \"excessive and persistent external surpluses\" should end policies causing harmful spillovers. China, which ran a $1.2 trillion trade surplus last year, was the sole dissenter, noted in a footnote. Analysts called the consensus unusual, driven by fears across Europe and Asia that industries in autos, electronics and machinery cannot survive China's export push. Japan's finance minister said feelings have \"crossed a threshold.\" A French report dubbed China \"The Chinese Steamroller.\" Still, analysts doubt swift coordinated action, citing fears of Chinese retaliation such as rare-earth curbs and an unpredictable U.S.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/U.S.%20Says%20It's%20Fed%20Up%20With%20China's%20Overcapacity-and%20More%20Countries%20Agree.pdf"},{"id":"wsj-22","title":"U.S. and Iran Trade Strikes in Latest Fight for Control of Hormuz","source":"WSJ","date":"3 Sep 2026","tags":["Geopolitics","Defence","Energy"],"summary":"The U.S. and Iran exchanged fire Tuesday as they battled for control of the Strait of Hormuz. Trump said U.S. strikes retaliated for Iran's attempt to mine the strait and target American servicemembers. Iran fired missiles and drones across the Persian Gulf; Jordan reported engaging 13 ballistic missiles, and Kuwait and Bahrain took hostile fire. U.S. forces struck Iranian air-defense sites, radar and mine-laying capabilities. Trump threatened harder strikes, warning \"there will be very little left of the Islamic Republic of Iran!\" More than 50,000 American servicemembers remain in the region enforcing a port blockade. Two tankers carrying Saudi oil were hit near Oman while crossing the strait. Brent crude rose 4.4% to $94.47. Officials fear the protracted conflict undermines U.S. deterrence of China and Russia.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/U.S.%20and%20Iran%20Trade%20Strikes%20in%20Latest%20Fight%20for%20Control%20of%20Hormuz.pdf"},{"id":"wsj-23","title":"UK Prime Minister Says Government Will Be 'Grounded in Fiscal Responsibility'","source":"WSJ","date":"3 Sep 2026","tags":["Finance & Markets","Politics"],"summary":"U.K. Prime Minister Andy Burnham told lawmakers the government is acting to cut debt and will stick to its self-imposed budget rules, seeking to reassure investors amid a worldwide bond selloff. U.K. government bond yields have risen sharply, partly reflecting inflation worries as the Middle East conflict continues to block Strait of Hormuz energy shipments. \"We are taking the action needed to get debt down,\" Burnham said, pledging a government \"grounded in fiscal responsibility.\" Burnham took office in July, inheriting a sluggish economy and debt near 94% of output. Investors fear he will raise spending without matching tax revenue, with a new budget due Oct. 28. He said the U.K. is cutting its deficit faster than any other G7 country, though economists estimate it near 4% of GDP.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20WSJ/UK%20Prime%20Minister%20Says%20Government%20Will%20Be%20'Grounded%20in%20Fiscal%20Responsibility'.pdf"},{"id":"st-01","title":"Australia, US commit $739 million to support Pacific Island nations","source":"ST","date":"3 Sep 2026","tags":["Geopolitics","Southeast Asia"],"summary":"Australia and the United States on Sept 2 announced a combined US$580 million (S$739 million) in funding for Pacific Island nations as they contest China's rising regional influence. The US contribution of US$150 million, including US$60 million for fuel storage and grid stability amid the energy crisis, is among the clearest signals the Trump administration remains engaged in the Pacific after dismantling USAID in 2025. Deputy Secretary of State Christopher Landau unveiled it at the Pacific Islands Forum in Palau. Australia pledged A$600 million (S$545 million) to combat drug smuggling via aerial surveillance and police training. The forum, running to Sept 4, has been dominated by a spat over Taiwan's participation, which Beijing opposes.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/Australia,%20US%20commit%20739%20million%20to%20support%20Pacific%20Island%20nations.pdf"},{"id":"st-02","title":"BOJ chief signals chance of September rate hike, debate on price risks","source":"ST","date":"3 Sep 2026","tags":["Finance & Markets","Politics"],"summary":"Bank of Japan governor Kazuo Ueda said on Sept 1 the central bank will debate raising interest rates in September, focusing on whether inflationary risks are heightening, signalling a strong chance of a hike. His remarks followed a US Treasury statement that Secretary Scott Bessent had urged \"decisive\" steps to combat the weak yen. The BOJ has already raised rates five times, reaching a 31-year high of 1 per cent in June. Hawkish board member Hajime Takata urged nimble hikes. Two-year JGB yields hit 1.830 per cent, the highest since 1995, and the 10-year yield reached 3 per cent for the first time since 1996. Key risks cited include the Middle East conflict, AI-related demand and yen weakness. Markets near fully price a September hike ahead of the Sept 17-18 meeting.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/BOJ%20chief%20signals%20chance%20of%20September%20rate%20hike,%20debate%20on%20price%20risks.pdf"},{"id":"st-03","title":"China's Xi urges new Middle East security framework during Egypt visit","source":"ST","date":"3 Sep 2026","tags":["Geopolitics","Trade"],"summary":"Chinese President Xi Jinping, visiting Egypt on Sept 2, urged Middle East nations to oppose external interference and consider a new regional security architecture, as Beijing seeks influence amid the US war against Iran. It was Xi's first regional trip in four years, coming as US partners reassess strategic ties after conflict disrupted trade and shipping through the Strait of Hormuz and Bab al-Mandeb. Welcomed by President Abdel Fattah al-Sisi, Xi pledged cooperation on safeguarding shipping routes, data centres, semiconductors and critical metals, plus greater use of both currencies. Egypt, which receives US$1.3 billion in annual US military aid, pursues \"strategic balance.\" China imported US$10 billion of Egyptian-bound goods in early 2026; the Suez Canal zone has drawn US$4 billion in Chinese investment.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/China's%20Xi%20urges%20new%20Middle%20East%20security%20framework%20during%20Egypt%20visit.pdf"},{"id":"st-04","title":"EU summons Russia envoys, eyes sanctions after Germany drone 'attack'","source":"ST","date":"3 Sep 2026","tags":["Geopolitics","Defence"],"summary":"EU countries on Sept 2 summoned Russian envoys and discussed fresh sanctions after an explosive-laden drone incident at Leipzig airport that foreign policy chief Kaja Kallas said bore the hallmarks of \"state-sponsored terrorism.\" The EU and NATO frame it as part of a Russian sabotage campaign to destabilise Ukraine's backers. Ministers agreed to keep working on sanctions targeting 1,600 individuals and entities tied to Russia's military industry, aiming to adopt them in October. Germany blamed Moscow, shut a Russian consulate and identified two suspects. Ursula von der Leyen called it \"a new escalation\" using military-grade material by Russian operatives on EU soil. Discussion resurfaced on tapping some 200 billion euros of frozen Russian central bank assets to fund Ukraine.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/EU%20summons%20Russia%20envoys,%20eyes%20sanctions%20after%20Germany%20drone%20'attack'.pdf"},{"id":"st-05","title":"Economists raise Singapore's 2026 growth forecast to 5% on AI boom: MAS survey","source":"ST","date":"3 Sep 2026","tags":["Finance & Markets","Technology & AI"],"summary":"Private-sector economists lifted their 2026 growth forecast for Singapore to 5 per cent, up from 3.5 per cent, after a surge in exports and manufacturing output, according to the MAS quarterly survey released Sept 2. It follows MTI's Aug 11 upgrade of its GDP forecast to 4.5-5.5 per cent and Enterprise Singapore's raised NODX forecast of 14-16 per cent. The economy grew 5.9 per cent year on year in Q2, after 6.3 per cent in Q1. Manufacturing forecasts jumped to 8.4 per cent amid AI-related demand for semiconductors. All respondents cited a sustained AI-driven tech upturn as key support, while flagging risks from Iran war escalation and a possible AI bubble burst. Some 45 per cent expect MAS to tighten in October.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/Economists%20raise%20Singapore's%202026%20growth%20forecast%20to%205%20on%20AI%20boom%20MAS%20survey.pdf"},{"id":"st-06","title":"Gold hits over 3-week low as Middle East tensions fan rate-hike fears","source":"ST","date":"3 Sep 2026","tags":["Finance & Markets","Energy"],"summary":"Gold fell on Sept 2 to its lowest in over three weeks as the escalating Middle East conflict lifted oil prices and stoked inflation and rate-hike fears, while investors awaited US jobs data. Spot gold slipped 0.6 per cent to US$4,302.99 per ounce, its lowest since Aug 7, headed for a fourth straight session of losses below its 200-day moving average. The US launched airstrikes against Iran on Sept 1, prompting Iranian retaliation, and oil rose for a third session. Traders priced in a 67 per cent chance of a Fed rate hike in September. Higher rates dull gold's appeal as it yields nothing. Silver, platinum and palladium also fell.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/Gold%20hits%20over%203-week%20low%20as%20Middle%20East%20tensions%20fan%20rate-hike%20fears.pdf"},{"id":"st-07","title":"Goldman Sachs, BofA and others plan to issue dollar stablecoin together in 2027","source":"ST","date":"3 Sep 2026","tags":["Finance & Markets","Technology & AI"],"summary":"A group of 21 financial institutions, including Goldman Sachs, Bank of America, Citi and Deutsche Bank, plans to create a company in 2026 to issue a dollar-pegged cryptocurrency in the first half of 2027, it said on Sept 1. First announced in October 2025 with 10 banks, the group also aims to issue stablecoins pegged to other G7 currencies, prioritising the euro. It will compete with a 37-member consortium, Qivalis, planning a euro stablecoin in 2026. Demand for bank-issued stablecoins remains scant; the market is dominated by Tether, which has issued over US$180 billion. Societe Generale's 2025 dollar token has just US$12.5 million in circulation. ECB President Christine Lagarde has warned private stablecoins pose monetary and financial-stability risks.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/Goldman%20Sachs,%20BofA%20and%20others%20plan%20to%20issue%20dollar%20stablecoin%20together%20in%202027.pdf"},{"id":"st-08","title":"Haze caused by many factors, but repeat of 2015 crisis unlikely due to later onset of El Nino: Experts","source":"ST","date":"3 Sep 2026","tags":["Environment","Southeast Asia"],"summary":"Since August, South-east Asia including Indonesia and Malaysia has been choking in persistent haze from raging Indonesian fires, worsened by a \"Godzilla\" El Nino. Dense smoke has covered Sumatra and Kalimantan since Aug 21, evoking the 2015 crisis when Singapore's PSI soared above 300. But experts told The Straits Times a repeat seems unlikely in 2026 because El Nino began around June, later than April in 2015, giving a shorter overlap with the dry season. By end-July over 202,000ha had burned, versus 2.6 million ha in 2015. NEA warned haze periods remain possible during dry spells. Experts stressed the fires are a man-made disaster from land clearing on drained peatlands; Indonesia arrested 89 suspects and faces a shrunken firefighting budget.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/Haze%20caused%20by%20many%20factors,%20but%20repeat%20of%202015%20crisis%20unlikely%20due%20to%20later%20onset%20of%20El%20N.pdf"},{"id":"st-09","title":"How Japan's bond rout is turning the tide of global capital","source":"ST","date":"3 Sep 2026","tags":["Finance & Markets"],"summary":"With Japanese 10-year bond yields breaking 3 per cent on Sept 1 for the first time since 1996, higher domestic returns are luring capital home and reversing a dependable flow into global bond markets. Japan is the biggest owner of US Treasuries; Japanese investors have already sold a net 3 trillion yen (S$24 billion) in overseas debt through Aug 22, the largest year-to-date outflow since 2022. Fund managers in Sydney, London and Singapore report a pullback, with a home-market bias emerging. A JP Morgan survey of 82 corporate pension funds showed the highest net share planning to boost domestic bonds since 2008. Yields have been pushed up by PM Sanae Takaichi's fiscal spending. Analysts say Japan is gradually ceasing to be the marginal buyer of foreign bonds, lifting global term premiums.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/How%20Japan's%20bond%20rout%20is%20turning%20the%20tide%20of%20global%20capital.pdf"},{"id":"st-10","title":"If S'pore decides on nuclear power, major grid changes may not be required","source":"ST","date":"3 Sep 2026","tags":["Energy","Society"],"summary":"Nuclear power plants provide a stable electricity supply similar to Singapore's current fossil-fuel plants, so tapping the source may not require major grid changes, SP PowerGrid chief executive Jimmy Khoo said on Sept 2. Singapore has not decided on nuclear but is studying its feasibility while pursuing imports and renewables. Khoo noted nuclear reactors drive steam engines like existing gas turbines and behave like any other generator, unlike intermittent solar. Speaking during a tour of the Ayer Rajah control centre, he stressed the grid must be finely balanced between demand and supply across 28,000km of underground cables, citing the 2025 Spain-Portugal outage. As Singapore raises its solar target from 2 to 3 GWp by 2030, SP Group is deploying batteries, including a 9.6MW storage system, to integrate renewables. The nation targets net-zero emissions by 2050.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/If%20S'pore%20decides%20on%20nuclear%20power,%20major%20grid%20changes%20may%20not%20be%20required.pdf"},{"id":"st-11","title":"MPs to push for food resilience in Parliament as prices rise due to climate, geopolitical crises","source":"ST","date":"3 Sep 2026","tags":["Society","Politics"],"summary":"Four PAP MPs will table a private member's motion on food resilience in Parliament next week, urging the Government to strengthen support for local farmers and cut food waste amid rising prices from hotter weather and Middle East conflicts. The MPs, from the GPC for Sustainability and the Environment, are Poh Li San, Nadia Ahmad Samdin, Valerie Lee and Ng Shi Xuan. Poh noted Singapore imports over 90 per cent of its food yet generated 800,000 tonnes of food waste in 2025, about 130kg per person, with only 0.3 per cent rescued. Grace Fu earlier warned Strait of Hormuz disruptions could raise fertiliser and logistics costs. The motion follows the dropped \"30 by 30\" goal; some grant-backed farms have closed. Food resilience is eyed for Singapore's 2027 ASEAN chairmanship agenda.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/MPs%20to%20push%20for%20food%20resilience%20in%20Parliament%20as%20prices%20rise%20due%20to%20climate,%20geopolitical.pdf"},{"id":"st-12","title":"Moscow vows to avoid airspace disruption despite Zelenskiy's warning","source":"ST","date":"3 Sep 2026","tags":["Geopolitics","Defence"],"summary":"Russia vowed on Sept 2 to head off disruption to civil aviation after Ukrainian President Volodymyr Zelenskiy warned that Ukrainian drones had made Russian airspace dangerous, saying \"the war started by Russia is closing its own skies.\" Ukraine officially notified the ICAO that Russian airspace was not safe. While Western carriers avoid Russia, airlines from China, Turkey, the UAE and Gulf states still use it. Transport minister Andrei Nikitin said Russia would not allow significant disruption, and aviation authority Rosaviatsia dismissed Ukraine's approaches as having \"no legal force.\" Flightradar24 showed cancellations and delays at Moscow's airports; flydubai and Pegasus Airlines cancelled flights. Russia has intensified strikes on Kyiv, while Ukraine hits Russian oil targets. Osprey Flight Solutions warned daily deep-strike attacks are likely through 2026.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/Moscow%20vows%20to%20avoid%20airspace%20disruption%20despite%20Zelenskiy's%20warning.pdf"},{"id":"st-13","title":"Netanyahu says Israel 'not retreating' during Gaza visit","source":"ST","date":"3 Sep 2026","tags":["Geopolitics","Defence"],"summary":"Prime Minister Benjamin Netanyahu visited Israeli forces in Gaza on Sept 2, vowing not to pull back troops despite a mediator push to advance a US-backed ceasefire calling for withdrawal. It was his first visit since the October 2025 ceasefire. \"We control the area. We are not retreating,\" he said near the Yellow Line, claiming control of 60 per cent of the Strip and vowing no pullout until Hamas is \"genuinely\" disarmed. Facing October elections, Netanyahu in August rejected advancing the plan. Israel said it captured a Hamas internal-security figure. Defence Minister Israel Katz said Israel has plans to remove Palestinians from Gaza, awaiting a US destination, drawing concern over forced displacement. Israeli operations have killed at least 1,334 people since the ceasefire, per Gaza's health ministry.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/Netanyahu%20says%20Israel%20'not%20retreating'%20during%20Gaza%20visit.pdf"},{"id":"st-14","title":"Ships adopt makeshift anti-drone defences as Black Sea attacks intensify","source":"ST","date":"3 Sep 2026","tags":["Geopolitics","Trade"],"summary":"Tankers and cargo ships are transiting the Bosphorus fitted with nets, water tanks and tyres to fend off growing Russian and Ukrainian drone strikes in the Black Sea, security experts and Reuters video showed. The abandoned Russian-flagged Omskiy-107, its deck burned out, drifted to an Istanbul beach. Ukraine has stepped up attacks on ships and infrastructure facilitating Russian oil and grain exports since July, when Russia intensified strikes on Odesa and other hubs. Increasingly common \"cope cages\" protect superstructures, but experts say such measures fail against larger military drones. Turkey summoned Ukraine's ambassador after attacks near Tuapse; President Erdogan warned the strikes renewed global grain shortages. Russia said on Sept 2 it sees no grounds to resume the Black Sea grain deal.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/Ships%20adopt%20makeshift%20anti-drone%20defences%20as%20Black%20Sea%20attacks%20intensify.pdf"},{"id":"st-15","title":"Singapore factory activity expands in August, even as supply chain crisis from Iran war deepens","source":"ST","date":"3 Sep 2026","tags":["Finance & Markets","Technology & AI"],"summary":"Lifted by AI demand, Singapore's factory activity expanded in August for the 13th straight month, reaching its highest in nearly eight years, despite a deepening Middle East supply chain crisis. The PMI rose to 51.5 from 51.4 in July, its highest since November 2018; the electronics PMI hit 52.6 in its 15th month of expansion. Officials cited an AI-driven semiconductor super-cycle driving record order backlogs, echoed by regional expansions in China, Japan and South Korea. But supplier deliveries contracted for an eighth month as ships reroute around the Cape of Good Hope to avoid the Strait of Hormuz, and energy-driven input prices surged. The Sept 2 MAS survey raised the manufacturing forecast to 8.4 per cent; OCBC's Selena Ling sees around 9 per cent.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/Singapore%20factory%20activity%20expands%20in%20August,%20even%20as%20supply%20chain%20crisis%20from%20Iran%20war%20de.pdf"},{"id":"st-16","title":"Singapore, Indonesia business chambers push ahead with AI trade platform, eye 2027 Jakarta forum","source":"ST","date":"3 Sep 2026","tags":["Trade","Southeast Asia"],"summary":"An AI-powered platform guiding Indonesian exporters on trade requirements is on track for launch, with a full roll-out expected to coincide with the Singapore Regional Business Forum in Jakarta in 2027. The Singapore Business Federation and Indonesia's Kadin said on Sept 2 that TAIA-ID, an Indonesian version of SBF's Trade AI Advisor, will offer guidance on tariffs and free trade agreements in Bahasa Indonesia, targeting a Q4 2026 launch. The two-year MOU, signed July 6 at the Leaders' Retreat, anchors the Indonesia Global Trading Initiative. Kadin chairman Anindya Bakrie said Indonesia exports about US$300 billion of goods annually and wants to grow its US$240 billion in diversified exports. Both sides will jointly organise the 10th SRBF in mid-2027, timed to the 60th anniversary of ties and Singapore's ASEAN chairmanship.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/Singapore,%20Indonesia%20business%20chambers%20push%20ahead%20with%20AI%20trade%20platform,%20eye%202027%20Jakarta.pdf"},{"id":"st-17","title":"South Korea's Lee calls for conditions to resume US-North Korea dialogue","source":"ST","date":"3 Sep 2026","tags":["Geopolitics","Politics"],"summary":"South Korean President Lee Jae Myung said on Sept 2 that conditions should be created to resume dialogue between the United States and North Korea, according to the presidential Blue House. Speaking to overseas advisers on Korean Peninsula peace, Lee said the armistice system should be transformed into a peace system based on cooperation, urging an end to confrontation. The two Koreas remain technically at war since the 1950-53 conflict ended without a peace treaty. Lee also pledged to complete the return of wartime operational control from the US before his term ends in 2030. He has consistently pushed engagement despite Pyongyang designating the South a hostile state. Seoul's intelligence agency said the US and North Korea show signs of resuming dialogue, though no contacts are confirmed.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/South%20Korea's%20Lee%20calls%20for%20conditions%20to%20resume%20US-North%20Korea%20dialogue.pdf"},{"id":"st-18","title":"Taiwan's defence spending plan shows determination to protect itself: President Lai","source":"ST","date":"3 Sep 2026","tags":["Defence","Geopolitics"],"summary":"Taiwan's plan for 2027 defence spending to exceed NT$1 trillion (S$40 billion) for the first time shows the international community the island's determination to strengthen its defences, President Lai Ching-te said on Sept 2. Speaking to military officers on Armed Forces Day, Lai said only continuously enhancing defence and deterrent power can better ensure national security and regional peace. The government will pursue defence self-reliance, develop the military-industrial sector, artificial intelligence and unmanned vehicles. Beijing, which views democratically governed Taiwan as its territory, has ramped up military and political pressure. China's Taiwan Affairs Office accused Lai of inciting cross-strait confrontation and \"squandering the people's hard-earned money,\" warning his resistance to reunification would bring disaster. Lai maintains only Taiwan's people can decide their future.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/Taiwan's%20defence%20spending%20plan%20shows%20determination%20to%20protect%20itself%20President%20Lai.pdf"},{"id":"st-19","title":"Trump aides, fearing a midterm rout, push to keep Iran war 'quiet' for now","source":"ST","date":"3 Sep 2026","tags":["Geopolitics","Politics"],"summary":"Top aides to US President Donald Trump are pushing to keep the Iran war from escalating before November's midterms to limit Republican losses, four people familiar said, a strategy already strained as both sides resume attacks. Officials will weigh ramping up military action after the Nov 3 vote, focusing for now on economic pressure. Only 31 per cent of Americans approve of the war, with voters unhappy over high petrol prices; Trump's approval has fallen from 40 to 33 per cent. A pause could also let the military replenish depleted precision-missile stocks. Over the weekend the US struck Iran's Larak Island, prompting Iranian missiles towards Jordan and the UAE. Vance and Rubio back keeping the conflict \"quiet.\" Bessent warned the pressure campaign could itself stoke escalation; China has declined to isolate Iran.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/Trump%20aides,%20fearing%20a%20midterm%20rout,%20push%20to%20keep%20Iran%20war%20'quiet'%20for%20now.pdf"},{"id":"st-20","title":"UN agency urges civilian aircraft safety after Zelensky warns Russian airspace 'not safe'","source":"ST","date":"3 Sep 2026","tags":["Geopolitics","Defence"],"summary":"The UN's International Civil Aviation Organization called on members on Sept 2 to ensure the safety of civilian aircraft, shortly after Ukraine formally told the body that Russian airspace was \"not safe\" amid the war. The Montreal-based agency said long-range weapons, unmanned aircraft systems, satellite navigation interference and advanced air defences are among military technologies jeopardising civilian aviation, without naming any country. It reiterated calls for stronger commitments to protect aircraft from conflict-zone risks as the danger of being targeted or caught in crossfire increases. Ukrainian President Volodymyr Zelensky warned on Sept 1 that skies over Russia were becoming \"extremely dangerous\" due to Kyiv's drones, saying \"the safe days in the Russian sky are over,\" while insisting civilian flights are not being targeted.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/UN%20agency%20urges%20civilian%20aircraft%20safety%20after%20Zelensky%20warns%20Russian%20airspace%20'not%20safe'.pdf"},{"id":"st-21","title":"US dollar hits 7-week high; Middle East conflict and rate paths in focus","source":"ST","date":"3 Sep 2026","tags":["Finance & Markets","Energy"],"summary":"The US dollar hit a seven-week high on Sept 2 as investors sought the currency amid concerns over the energy shock and diverging monetary policy paths. The US and Iran returned to a war footing after the most significant exchange of fire in weeks. The greenback benefits from higher oil prices as the US economy is less exposed to energy shocks. The dollar index rose to 99.808, its highest since Aug 17, while the euro fell to US$1.1570. The US 10-year yield reached 4.812 per cent, its firmest since November 2023, and Japan's 10-year yield extended past the three-decade 3 per cent milestone. Markets price a 70 per cent chance of a September Fed hike. The yen rose to 159.50 per dollar; the New Zealand dollar slumped after a less hawkish-than-expected rate rise.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/US%20dollar%20hits%207-week%20high%20Middle%20East%20conflict%20and%20rate%20paths%20in%20focus.pdf"},{"id":"st-22","title":"US urges G-20 countries to allow AI training on creators' work","source":"ST","date":"3 Sep 2026","tags":["Technology & AI","Trade"],"summary":"The US urged G-20 countries on Sept 2 to develop rules letting AI companies train systems on copyrighted material, as American tech firms face mounting lawsuits. Companies including Anthropic, OpenAI, Google and Meta have been sued by authors, publishers and creators alleging misuse of their work. Commerce Secretary Howard Lutnick told a tech-focused meeting in North Carolina that countries should embrace \"fair use\" while finding ways to \"protect artists,\" offering no specifics. The Justice Department filed a brief backing OpenAI against the New York Times. Nvidia CEO Jensen Huang urged officials to avoid regulating \"theoretical harms.\" A US-released joint statement said G-20 nations will avoid new AI-specific rules, addressing only \"novel considerations.\" China, which already has broad AI rules, was a signatory.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/US%20urges%20G-20%20countries%20to%20allow%20AI%20training%20on%20creators'%20work.pdf"},{"id":"st-23","title":"US, China arm for space warfare: hunter satellites and orbital weapons","source":"ST","date":"3 Sep 2026","tags":["Defence","Technology & AI"],"summary":"The US and China are arming for possible conflict in space, a Reuters review of documents and tracking data found. In June a secretive Chinese spaceplane released a small satellite that looped around another Chinese satellite before returning, echoing a similarly secretive US spaceplane. Chinese military-linked researchers are developing satellites to pursue, capture and refuel spacecraft, while the US and Britain conducted their first joint military space operation near a suspected Chinese spy satellite. Space Force's Gen Chance Saltzman called China's threat \"substantial.\" Militaries increasingly view satellites as weapons platforms capable of jamming, dazzling or capturing rivals. Trump's Golden Dome envisions space-based interceptors. China has shown orbital \"dogfighting\" and refuelling attempts; the US unveiled an L3Harris electromagnetic weapon. Beijing says it opposes space weaponisation and accuses Washington of an arms race.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/US,%20China%20arm%20for%20space%20warfare%20hunter%20satellites%20and%20orbital%20weapons.pdf"},{"id":"st-24","title":"Ukraine is finalising drone deal with Germany, Zelenskiy says","source":"ST","date":"3 Sep 2026","tags":["Defence","Geopolitics"],"summary":"Ukraine is finalising a drone deal with Germany, President Volodymyr Zelenskiy said on Sept 2 after a call with Chancellor Friedrich Merz. The agreement, proposed by Ukraine several months ago, is expected to cover joint development of various drones, missiles and related software, providing both countries additional defence capabilities. It builds on existing German-Ukrainian cooperation, including a multi-million-euro programme to supply Kyiv 15,000 Strila interceptor drones designed to counter Shahed-type attack drones. In April, Germany's Quantum Systems and Ukraine's WIY Drones formed Quantum WIY Industries to boost interceptor-drone production. Germany is also funding an order for 50,000 Shrike attack drones from Ukrainian manufacturer SkyFall, one of the largest known drone purchases for Kyiv by a Western government. Zelenskiy said he and Merz also discussed air-defence support and an in-person meeting.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/Ukraine%20is%20finalising%20drone%20deal%20with%20Germany,%20Zelenskiy%20says.pdf"},{"id":"bt-01","title":"'Xiplomacy': China's Xi begins busiest travel month since 2019 in diplomatic push before Trump talks","source":"BT","date":"3 Sep 2026","tags":["Geopolitics","Politics","Technology & AI"],"summary":"Chinese leader Xi Jinping is embarking on his busiest foreign travel schedule in more than seven years, seeking to convince nations that Beijing offers better global leadership than Washington. Xi visits Kyrgyzstan and Egypt, is expected at a Brics summit hosted by India's Narendra Modi, and plans a late-September Washington stop to meet Donald Trump to preserve the trade truce. In Bishkek for the Shanghai Cooperation Organization, Xi took a veiled swipe at the US, urging major powers to observe international rules, and will meet Vladimir Putin and Iran's Masoud Pezeshkian. Analysts say the tour lets Xi arrive in DC showing diplomatic breadth. The itinerary also lets Xi promote China's cheaper AI technology and tokens; Huawei is bidding to build AI data centres in Cairo.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/'Xiplomacy'%20China's%20Xi%20begins%20busiest%20travel%20month%20since%202019%20in%20diplomatic%20push%20before%20Tr.pdf"},{"id":"bt-02","title":"European shares hit by rising bond yields, energy-driven inflation concerns","source":"BT","date":"3 Sep 2026","tags":["Finance & Markets","Energy"],"summary":"European shares edged lower on Wednesday (Sep 2), pressured by elevated bond yields as escalating Middle East tensions stoked energy-induced inflation worries. The pan-European Stoxx 600 closed down 0.2 per cent at 645.94, with retailers leading a 2.3 per cent drop after hitting one-month lows. Brent crude traded above US$95 a barrel as the US and Iran traded fresh strikes. Germany's 10-year bond yield hit its highest since April 2011; markets see near-certain ECB rate hikes ahead. Germany's DAX fell 0.5 per cent and France's CAC 40 dropped 0.3 per cent on fiscal concerns. Banking stocks limited losses, jumping 0.6 per cent, led by ING after a Morgan Stanley upgrade. Volkswagen fell 3.2 per cent after being replaced by Nokia in the Euro Stoxx 50.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/European%20shares%20hit%20by%20rising%20bond%20yields,%20energy-driven%20inflation%20concerns.pdf"},{"id":"bt-03","title":"Falling AI token costs could fuel next leg of Singapore semiconductor rally: analysts","source":"BT","date":"3 Sep 2026","tags":["Technology & AI","Finance & Markets","Southeast Asia"],"summary":"Falling AI token costs could spur wider use of AI models and drive a fresh wave of infrastructure spending benefiting Singapore-listed chip equipment suppliers, analysts say. Silicon Data's LLM Token Expenditure index stood at US$0.9665 on Aug 31, less than half its May peak. DBS said broader open-weight adoption should widen semiconductor beneficiaries. AEM, UMS Integration and Frencken are positioned to capture profits; their shares are up 403.5 per cent, 123.6 per cent and 64.5 per cent year-to-date respectively. AEM raised 2026 revenue guidance to S$630 million-S$680 million; UMS lifted H1 net profit 66 per cent to S$33.4 million; Frencken saw H1 profit dip 3.4 per cent. Analysts flag capacity constraints, skilled-manpower bottlenecks in Penang and stretched valuations as key risks.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Falling%20AI%20token%20costs%20could%20fuel%20next%20leg%20of%20Singapore%20semiconductor%20rally%20analysts.pdf"},{"id":"bt-04","title":"G20 finance chiefs back action against trade-distorting policies; China holds out","source":"BT","date":"3 Sep 2026","tags":["Trade","Geopolitics","Finance & Markets"],"summary":"The Trump administration won backing from all G20 financial leaders except China's on Tuesday (Sep 1) to act against non-market policies and distortions causing over-reliance on exports. US Treasury Secretary Scott Bessent said 19 countries wanting to address the issue showed its enormity. A chair's statement urged countries with excessive external surpluses to remove distortions constraining domestic consumption. China, with weak domestic demand, has doubled down on exports, which rose 23.9 per cent in July year on year; its goods surplus with the EU hit 360.6 billion euros in 2025. The meeting came amid a global bond sell-off, with Japan's 10-year yield hitting 3 per cent for the first time since 1996. Russia attended for the first time since invading Ukraine, drawing European and Canadian dismay.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/G20%20finance%20chiefs%20back%20action%20against%20trade-distorting%20policies%20China%20holds%20out.pdf"},{"id":"bt-05","title":"Global bond rout deepens as oil-fuelled inflation fears drive yields to multi-decade highs","source":"BT","date":"3 Sep 2026","tags":["Finance & Markets","Energy"],"summary":"Global bonds sold off sharply on Wednesday (Sep 2), extending a rout lifting borrowing costs to multi-decade highs as the Middle East conflict pushed energy prices up, feeding fears about inflation and swelling government debt. The 10-year US Treasury yield hit a near three-year high of 4.81 per cent, with 5 per cent seen as plausible. Japan's 10-year yield held above 3 per cent, a 30-year high; Australia's hit a 15-year high; French OAT futures fell to a record low. Big-tech bond issuance to fund the AI boom added pressure. Analysts invoked 'bond vigilantes' demanding fiscal discipline. Brent crude rose 1 per cent to US$95.61. Traders priced a Sep 10 ECB hike and a 68 per cent chance of a US hike on Sep 16.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Doc
