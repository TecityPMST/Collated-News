<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tecity News Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#fbfbfa; --surface:#ffffff; --surface-2:#f6f6f4;
    --text:#16181d; --muted:#6c727e; --faint:#9aa0ab;
    --border:#ececec; --border-2:#e2e2e0; --ink:#16181d;
    --hover:#f4f4f2; --ring:rgba(20,23,28,.10);
    --shadow:0 1px 2px rgba(16,18,22,.04), 0 8px 24px rgba(16,18,22,.05);
    --shadow-sm:0 1px 2px rgba(16,18,22,.05);
    --wsj:#D85A30; --st:#1D9E75; --bt:#378ADD; --scmp:#D4537E;
    --maxw:1120px;
  }
  html[data-theme="dark"]{
    --bg:#0c0d10; --surface:#15171c; --surface-2:#1b1e25;
    --text:#eceef2; --muted:#9aa1ad; --faint:#6b7280;
    --border:#252830; --border-2:#2d313b; --ink:#eceef2;
    --hover:#1c1f26; --ring:rgba(255,255,255,.12);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-feature-settings:"cv02","cv03","cv04","ss01";
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    line-height:1.6;
  }
  ::selection{background:rgba(120,120,120,.18)}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px}
  .num{font-variant-numeric:tabular-nums}
  .eyebrow{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); font-weight:600}

  /* header */
  header.top{position:sticky; top:0; z-index:20; backdrop-filter:saturate(180%) blur(14px);
    background:color-mix(in srgb, var(--bg) 82%, transparent); border-bottom:1px solid var(--border)}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 28px; max-width:var(--maxw); margin:0 auto}
  .brand{display:flex; flex-direction:column; gap:2px; min-width:0}
  .brand .title{font-size:16px; font-weight:600; letter-spacing:-.01em}
  .brand .meta{font-size:12.5px; color:var(--muted)}
  .controls{display:flex; align-items:center; gap:10px}
  select.date{appearance:none; font:inherit; font-size:13px; font-weight:500; color:var(--text);
    background:var(--surface); border:1px solid var(--border-2); border-radius:10px; padding:8px 32px 8px 12px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239aa0ab' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right 10px center; cursor:pointer; transition:border-color .15s}
  select.date:hover{border-color:var(--ink)}
  .toggle{display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; cursor:pointer;
    background:var(--surface); border:1px solid var(--border-2); border-radius:10px; color:var(--muted); transition:.15s}
  .toggle:hover{color:var(--text); border-color:var(--ink)}
  .toggle svg{width:17px; height:17px}

  /* hero digest */
  .hero{padding:48px 0 14px}
  .hero .eyebrow{margin-bottom:16px}
  .digest{font-size:clamp(25px,3.6vw,37px); line-height:1.22; font-weight:400; letter-spacing:-.02em;
    max-width:none; color:var(--text)}
  .digest .lead{max-width:none}

  /* metrics */
  .metrics{display:grid; grid-template-columns:repeat(6,1fr); gap:14px; padding:30px 0 8px}
  .metric{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 18px 16px; box-shadow:var(--shadow-sm); transition:.18s}
  .metric:hover{box-shadow:var(--shadow); transform:translateY(-2px)}
  .metric .v{font-size:27px; font-weight:600; letter-spacing:-.03em; line-height:1.05}
  .metric .l{font-size:12.5px; font-weight:500; margin-top:8px}
  .metric .s{font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.4}

  /* tabs */
  .tabs{display:flex; gap:26px; margin:34px 0 0; border-bottom:1px solid var(--border)}
  .tab{position:relative; cursor:pointer; padding:0 0 14px; font-size:14px; font-weight:500; color:var(--muted); transition:color .15s}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--text)}
  .tab.active::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--ink); border-radius:2px}

  .section{padding:30px 0 0}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px}
  .section-head h2{margin:0; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:600}
  .section-head .hint{font-size:12.5px; color:var(--muted)}

  /* lead briefing card */
  .lead-card{background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:30px 32px; box-shadow:var(--shadow); margin-bottom:16px}
  .lead-card .k{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); font-weight:600; margin-bottom:12px}
  .lead-card h3{margin:0 0 12px; font-size:23px; font-weight:600; letter-spacing:-.02em; line-height:1.2}
  .lead-card p{margin:0; font-size:15.5px; color:var(--text); line-height:1.65; max-width:none; column-width:34ch; column-gap:48px; column-fill:balance}

  /* briefing grid */
  .cards{display:grid; grid-template-columns:repeat(2,1fr); gap:16px}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px 26px; box-shadow:var(--shadow-sm); transition:.18s}
  .card:hover{box-shadow:var(--shadow); transform:translateY(-2px)}
  .card h3{margin:0 0 10px; font-size:16.5px; font-weight:600; letter-spacing:-.01em; line-height:1.3}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.62}

  /* coverage / bars */
  .split{display:grid; grid-template-columns:1.5fr 1fr; gap:16px; align-items:start}
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px 26px; box-shadow:var(--shadow-sm)}
  .bar-row{display:flex; align-items:center; gap:14px; margin:14px 0}
  .bar-row .name{width:42px; font-size:12.5px; font-weight:600; letter-spacing:.02em}
  .bar-track{flex:1; height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden}
  .bar-fill{height:100%; border-radius:99px}
  .bar-row .cnt{width:26px; text-align:right; font-size:12.5px; color:var(--muted); font-weight:600}

  /* article */
  .feed-controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:4px 0 18px}
  .search{flex:1 1 260px; position:relative}
  .search svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--faint)}
  .search input{width:100%; font:inherit; font-size:14px; color:var(--text); background:var(--surface);
    border:1px solid var(--border-2); border-radius:12px; padding:11px 14px 11px 38px; outline:none; transition:.15s}
  .search input:focus{border-color:var(--ink); box-shadow:0 0 0 4px var(--ring)}
  .pills{display:flex; flex-wrap:wrap; gap:8px}
  .pill{cursor:pointer; font-size:12.5px; font-weight:500; color:var(--muted); background:var(--surface);
    border:1px solid var(--border-2); border-radius:99px; padding:7px 13px; user-select:none; transition:.14s; line-height:1}
  .pill:hover{border-color:var(--ink); color:var(--text)}
  .pill.active{color:#fff; border-color:transparent}
  .tagrow{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .count{font-size:12.5px; color:var(--muted); margin-bottom:14px}

  .article{padding:22px 4px; border-bottom:1px solid var(--border)}
  .article:first-child{padding-top:6px}
  .article .head{display:flex; align-items:center; gap:12px; margin-bottom:9px; flex-wrap:wrap}
  .src{display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:600; letter-spacing:.04em; color:var(--muted)}
  .src .dot{width:8px; height:8px; border-radius:99px}
  .article h4{margin:0; font-size:16.5px; font-weight:600; letter-spacing:-.01em; line-height:1.32; flex:1; min-width:240px}
  .article h4 a{color:inherit; text-decoration:none; transition:color .15s}
  .article h4 a:hover{color:var(--wsj-hover, var(--muted))}
  .article .date{font-size:12px; color:var(--faint); white-space:nowrap}
  .article p{margin:6px 0 12px; font-size:14.5px; color:var(--muted); line-height:1.62; max-width:88ch}
  .tags{display:flex; flex-wrap:wrap; gap:7px}
  .tag{font-size:11px; font-weight:600; letter-spacing:.01em; border-radius:99px; padding:3px 10px; border:1px solid transparent}

  .empty{text-align:center; color:var(--muted); padding:60px 0; font-size:14px}
  footer{padding:48px 0 60px; color:var(--faint); font-size:12px; text-align:center}

  @media(max-width:980px){
    .metrics{grid-template-columns:repeat(3,1fr)}
    .cards{grid-template-columns:1fr}
    .split{grid-template-columns:1fr}
  }
  @media(max-width:560px){
    .wrap,.topbar{padding-left:18px; padding-right:18px}
    .metrics{grid-template-columns:repeat(2,1fr)}
    .hero{padding-top:34px}
  }
</style>
</head>

<script>window.ALL_DAYS = {"2026-08-21":{"executiveDigest":"Trump escalated to 'economic warfare' on Iran - vowing the 'toughest sanctions in history' and threatening countries that support Tehran - sending oil up more than 2%, even as Iran 'found its Hormuz control slipping'. A US Treasury bond buyback pushed the dollar to a three-month low, sent Bitcoin past US$70,000 and gold near US$4,500, and WSJ called the bond 'chaos' a sign 'Warsh's plan is working'. AI earnings underwhelmed - Alibaba and Walmart disappointed - yet Samsung and SK Hynix unveiled record shareholder returns, and Singapore pressed fund-management reforms as competition with Hong Kong heated up.","briefingCards":[{"title":"Lead story - Trump declares 'economic warfare' on Iran","body":"The pressure campaign went maximal: Trump 'pledged economic warfare on Iran' (prompting Tehran's derision), the US vowed 'the toughest sanctions in history' as Bessent prepared new measures and fresh Hezbollah designations, and oil 'settled up more than 2% after Trump threatened countries supporting Iran'. SCMP said 'Iran goes on the offensive as diplomacy with the US stalls', while ST reported Iran 'finds control over the Hormuz strait slipping away' even as 'the US is far from victorious'. Analysts parsed 'the message behind Trump's threats', and commentators asked where 'US-led recidivism in geopolitics' is heading - as the war's economic front widened well beyond the battlefield."},{"title":"Markets & finance","body":"A Treasury intervention reshaped the tape: the US dollar hit a three-month low, Bitcoin 'roared past US$70,000 as yields sank', gold held near US$4,500, and crypto's surge 'triggered a record US$3.4 billion of short liquidations'. WSJ argued 'the bond chaos is a sign Kevin Warsh's plan is working', though Fed officials were 'cautious over the impact' and Australia's debt 'breached A$1 trillion'. Corporate signals were mixed - Walmart shares slumped on their 'weakest sales growth in over six years', Broadcom sought more than US$76 billion in AI debt, and Anthropic 'expects to match or top SpaceX's record IPO size'. Japan inflation picked up, firming rate-hike bets."},{"title":"Asia realignment","body":"Korea diplomacy stayed jagged: North Korea 'answered a US olive branch with a missile launch' and rapped Seoul's 'double-dealing', even as it 'appeared to show interest in Trump's overtures' and Beijing's Wang Yi sought to 'improve Seoul ties amid US-South Korea friction'. Trade friction sharpened - China 'firmly opposes' Trump's drone tariffs and warned of 'global supply-chain fallout', while Beijing branded a US tariff report a 'false narrative' and named-hub Mexico planned new China curbs. Taiwan proposed a 'record US$35 billion defence budget', Malaysia's Anwar will visit China, and China Evergrande founder Hui Ka-yan's saga 'ended with a life sentence'."},{"title":"Energy & climate","body":"Oil rose on the widening Iran conflict - up more than 2% after Trump's threats against Tehran's partners - stoking US inflation worries even as gold wavered. On the ground, a jet fighter 'destroyed a naval drone near a Black Sea gas platform', and Romania downed a marine drone near its Neptun Deep project. Singapore looked ahead: Tuas Power will 'build a hydrogen-ready power plant by 2031'. Low Rhine water levels 'will slow the German economy', the Bundesbank said, while Norway boosted its defence footprint with an expanded Arctic brigade - the resource-and-security nexus running through the day's energy news."},{"title":"Technology & AI","body":"AI's cost side pressed on earnings and hardware: Alibaba 'posted weaker earnings amid heavy AI investments', Broadcom sought over US$76 billion in AI debt, and SCMP found 'Chinese AI chips fall short on coding, forcing firms to stretch scarce Nvidia supply' (Nvidia denied a year-end China chip). Memory makers rewarded holders - SK Hynix launched a US$29 billion buyback and Samsung planned up to US$79 billion in returns 'in the AI boom'. Unitree's CEO said robots are 'poised for a ChatGPT moment', ChatGPT 'can now control iMessage', Japan launched a 'large-scale Gen-AI pilot for civil servants', and hyperscalers' 'off-grid power push comes with risks'."},{"title":"Singapore & SEA focus","body":"Singapore moved on funds and skills: analysts called Singapore's reforms 'timely as competition for fund managers with Hong Kong heats up', SCS launched an AI skills pathway and IMDA introduced 'AI-fluency programmes for the legal sector', and BT asked 'who gets carried along' as 'Singapore's AI boom lifts GDP'. Singapore and India agreed to deepen telecom and food-safety cooperation, and BT flagged that rising bond yields triggering a tech sell-off could make 'S-Reits the casualty nobody notices'. Regionally, Malaysia's PM ordered a probe into a sovereign-wealth-fund unit, and Japan's real-estate investment is 'set to hit a record for a second year'."}],"keyMetrics":[{"value":"94","label":"Articles curated today","sub":"WSJ 15 · ST 27 · BT 27 · SCMP 25"},{"value":"'Economic warfare'","label":"Trump vs Iran","sub":"'Toughest sanctions in history'"},{"value":">US$70k","label":"Bitcoin roars","sub":"As yields sink on Treasury buyback"},{"value":"3-mo low","label":"US dollar","sub":"Gold near US$4,500"},{"value":"US$29b / US$79b","label":"SK Hynix, Samsung returns","sub":"Record payouts in AI boom"},{"value":"-6yr low","label":"Walmart sales growth","sub":"Shares slump"}],"date":"2026-08-21","dayOfWeek":"Friday","totalArticles":94,"sourceCounts":{"WSJ":15,"ST":27,"BT":27,"SCMP":25},"articles":[{"id":"wsj-01","title":"Alibaba Posts Weaker Earnings Amid Heavy AI Investments","source":"WSJ","date":"21 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Alibaba's fiscal first-quarter net profit dropped 76% to 10.54 billion yuan ($1.57 billion), missing expectations, while revenue grew 8.6% to 268.95 billion yuan, beating estimates. The e-commerce giant blamed lower operating income and reduced investment-disposal gains. Adjusted net profit fell 38% to 20.715 billion yuan. Capital expenditure surged 75% to 67.68 billion yuan as Alibaba races to preserve its AI lead, recently rolling out its Qwen3.8-Max model. Cloud external revenue accelerated 45%, with AI-related products posting triple-digit growth for a 12th straight quarter. CEO Eddie Wu cited \"improving commercialization of our full-stack AI capabilities.\" Alibaba agreed to sell videogame unit Lingxi Games to Trustar Capital, valuing it above $1.5 billion. ADRs fell about 4% premarket.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20WSJ/Alibaba%20Posts%20Weaker%20Earnings%20Amid%20Heavy%20AI%20Investments.pdf"},{"id":"wsj-02","title":"Canada Trade Official Says Tariff Deal With U.S. 'Very Close'","source":"WSJ","date":"21 Aug 2026","tags":["Trade","Politics"],"summary":"Canada's minister for U.S. trade, Dominic LeBlanc, said Ottawa and Washington are \"very close\" to finalizing an agreement, speaking after a roughly three-hour meeting with senior Trump administration trade officials. Both sides signaled a tentative pact is taking shape that would halve U.S. tariffs on Canadian steel and aluminum and lower duties on autos. Failure to reach a deal would trigger a 50% tariff on about $20 billion of Canadian imports as early as Saturday. Some provincial premiers said Prime Minister Mark Carney asked them to prepare to lift bans on U.S. wine and spirits sales. Washington linked the 50% tariff to the alcohol ban and alleged mistreatment of U.S. autos and dairy.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20WSJ/Canada%20Trade%20Official%20Says%20Tariff%20Deal%20With%20U.S.%20'Very%20Close'.pdf"},{"id":"wsj-03","title":"Dissent Grows Among Russia's Political Elites","source":"WSJ","date":"21 Aug 2026","tags":["Geopolitics","Politics"],"summary":"Growing dissent among Russia's elites over the Ukraine war is straining the Kremlin, argues Amy Knight. Andrei Klepach, prominent macroeconomist and chief economist at state bank VEB, was dismissed Sunday after a May speech at Moscow's Nikitsky Club warning Russia's economy neared stagnation, with 2027 GDP growth possibly capped at 1% to 1.5%. He said Russia was \"losing the global race\" technologically and economically, even to Ukraine, and warned a social crisis could erupt unexpectedly. VEB chief Igor Shuvalov, Sberbank CEO German Gref and Moscow Mayor Sergei Sobyanin have also questioned a war economy. Russia's Supreme Court upheld disqualifying the antiwar Yabloko party from September elections; its leader Lev Shlosberg was jailed 11 years.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20WSJ/Dissent%20Grows%20Among%20Russia's%20Political%20Elites.pdf"},{"id":"wsj-04","title":"Dwindling Patriot Supplies Leave Kyiv in the Line of Fire","source":"WSJ","date":"21 Aug 2026","tags":["Geopolitics","Defence"],"summary":"A massive Russian missile and drone attack on Kyiv killed at least 15 people and injured around 40 on Wednesday night, hitting a children's hospital and a school. Ukraine's capital has been left exposed as Middle East wars drain the West's supply of Patriot interceptor missiles, allowing more Russian missiles to reach targets. Ukraine's air force shot down 39 of 44 missiles and 145 of 168 Shahed-type drones. President Zelensky said \"Patriot interceptors cannot yet be replaced\" and warned Russia will not seek peace while Ukraine lacks defenses. Residents fear more assaults before Monday's independence day and worry about surviving winter after last year's power outages. Russia also struck a Ukraine-Moldova crossing and Chernihiv gas infrastructure.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20WSJ/Dwindling%20Patriot%20Supplies%20Leave%20Kyiv%20in%20the%20Line%20of%20Fire.pdf"},{"id":"wsj-05","title":"Hyperscalers' Off-Grid Power Push Comes With Risks","source":"WSJ","date":"21 Aug 2026","tags":["Technology & AI","Energy"],"summary":"Big tech firms are rushing to build off-grid power systems for AI data centers, but early projects reveal costly operating risks. Of four operational U.S. off-grid data centers tracked by Cleanview, three have reported problems, including cracked turbines at xAI's Colossus in Memphis and a July power failure at Vantage's Loudoun County, Virginia campus. AI workloads cause massive power swings that stress and shorten equipment life. Anthropic pays xAI $1.25 billion monthly for Colossus compute, implying outages could cost tens of millions daily. Power providers, often oil-and-gas firms lacking data-center experience, risk penalties and replacement costs. Solaris trades at a premium. Amazon plans a 7.65-gigawatt Texas campus. Analysts call the scale still experimental.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20WSJ/Hyperscalers'%20Off-Grid%20Power%20Push%20Comes%20With%20Risks.pdf"},{"id":"wsj-06","title":"Japan Inflation Picks Up as Rate-Boost Bets Firm","source":"WSJ","date":"21 Aug 2026","tags":["Finance & Markets"],"summary":"Japan's consumer inflation accelerated in July as higher oil prices tied to the Middle East conflict broadened. Consumer prices excluding fresh food rose 1.8% year-on-year, up from June's 1.6% and matching the consensus in a Quick poll of economists. The uptick strengthens expectations that a Bank of Japan rate increase is imminent, with markets rapidly pricing in a higher chance of a hike at September's meeting. Policymakers expect elevated energy prices to filter through to a wider range of consumer goods over the summer, despite government measures softening the hit. The yen's continued weakness remains another threat to the inflation outlook, following joint U.S.-Japan efforts to support the currency.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20WSJ/Japan%20Inflation%20Picks%20Up%20as%20Rate-Boost%20Bets%20Firm.pdf"},{"id":"wsj-07","title":"Jet Fighter Destroys Naval Drone Near Black Sea Gas Platform 'to Protect Lives'","source":"WSJ","date":"21 Aug 2026","tags":["Defence","Energy"],"summary":"Romania deployed two F-16 jet fighters to destroy a Russia-launched explosive marine drone spotted a few hundred meters from the Neptun Deep gas platform, 80 miles east of Constanta. Defense Minister Radu Miruta said the decision, taken with NATO, protected several hundred workers; Ukraine said the drone wasn't theirs. President Nicusor Dan condemned Russia's \"irresponsible incidents.\" NATO's eastern frontier has faced near-daily drone incursions this summer, often caused by Russian electromagnetic warfare disrupting Ukrainian strike drones. European Commission President Ursula von der Leyen warned of \"an escalating campaign of threats\" and \"hybrid warfare.\" Neptun Deep, holding roughly 100 billion cubic meters of gas, is set to become Romania's largest producer, strengthening EU energy security from next year.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20WSJ/Jet%20Fighter%20Destroys%20Naval%20Drone%20Near%20Black%20Sea%20Gas%20Platform%20'to%20Protect%20Lives'.pdf"},{"id":"wsj-08","title":"Low Rhine Water Levels to Slow German Economy, Bundesbank Says","source":"WSJ","date":"21 Aug 2026","tags":["Environment","Finance & Markets"],"summary":"Low water levels on the River Rhine, caused by recent heatwaves, are likely to impede German economic growth in the third quarter, the Bundesbank said in its August monthly report. The water gauge at the Kaub bottleneck in western Germany hit a record low, forcing ships to carry fewer goods and driving up transport costs, delivery delays and material shortages. Western Europe endured its hottest June and July on record. The central bank expects at best marginal third-quarter expansion, following GDP growth of 0.4% and 0.2% in the first two quarters, largely driven by exports that could unwind. Robust manufacturing orders and pledged government defense and infrastructure investment should support recovery despite the Iran war's energy-price effects.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20WSJ/Low%20Rhine%20Water%20Levels%20to%20Slow%20German%20Economy,%20Bundesbank%20Says.pdf"},{"id":"wsj-09","title":"Philadelphia Area Manufacturing Activity Continued to Expand in August","source":"WSJ","date":"21 Aug 2026","tags":["Finance & Markets"],"summary":"Manufacturing activity in the Philadelphia area continued to expand past expectations in August, according to the Philly Fed's manufacturing business outlook survey. The current-activity index rose to 47.4 from 41.4 in July, far above the 25 reading economists polled by The Wall Street Journal expected; a reading above zero indicates increasing activity. Current new orders and shipments indexes both declined but stayed above their long-run nonrecession averages. Price pressures eased somewhat, with the prices paid index falling 13 points to 40.9, though both price indexes remained elevated. The employment index rose 18 points to 27.9, its highest since April 2022. The survey covers Delaware and parts of eastern Pennsylvania and southern New Jersey.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20WSJ/Philadelphia%20Area%20Manufacturing%20Activity%20Continued%20to%20Expand%20in%20August.pdf"},{"id":"wsj-10","title":"SpaceX Is Racking Up Wins in Washington","source":"WSJ","date":"21 Aug 2026","tags":["Technology & AI","Defence"],"summary":"Elon Musk's SpaceX has been securing major government business and favorable regulatory treatment in Washington. This year it won billions in military-satellite contracts, including a roughly $4.2 billion missile-tracking deal, even after lawmakers pushed to involve other suppliers; the Space Force later awarded rivals up to $615 million. SpaceX is in line for over $8 billion in Trump's Golden Dome program, at least a third of budgeted funds. The FCC waived requirements to approve its satellite-to-phone spectrum purchase, and transportation officials proposed cutting environmental reviews of launches. The FCC is weighing SpaceX's plan for up to one million AI satellites, opposed by Amazon. Senator Jack Reed cited concerns about SpaceX's \"near monopoly position\" in launch and constellations.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20WSJ/SpaceX%20Is%20Racking%20Up%20Wins%20in%20Washington.pdf"},{"id":"wsj-11","title":"Sweden's Central Bank Holds Key Rate and Still Sees Chance of a Hike Later This Year","source":"WSJ","date":"21 Aug 2026","tags":["Finance & Markets"],"summary":"Sweden's Riksbank held its key policy rate at 1.75%, in line with a Wall Street Journal poll, and said a rate hike remains possible later this year as it warned the Middle East conflict could push inflation higher. Policymakers have held rates steady for seven consecutive meetings, adopting a wait-and-see stance. Both growth and inflation have run higher than forecast over the summer, and the bank said it will act if unexpectedly high inflation signals a larger, more lasting upturn. It noted uncertainty over Middle East developments remains considerable, though economic effects have been smaller than feared as markets and companies adapt. \"There is considerable uncertainty and developments call for vigilance,\" the central bank said.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20WSJ/Sweden's%20Central%20Bank%20Holds%20Key%20Rate%20and%20Still%20Sees%20Chance%20of%20a%20Hike%20Later%20This%20Year.pdf"},{"id":"wsj-12","title":"The Bond 'Chaos' Is a Sign Kevin Warsh's Plan Is Working","source":"WSJ","date":"21 Aug 2026","tags":["Finance & Markets","Politics"],"summary":"In this Joseph Sternberg column, a surge in U.S. Treasury yields, with the 30-year briefly hitting a level last seen in 2007, is read as a sign new Fed Chairman Kevin Warsh's approach is working, not failing. Yields fell after Treasury Secretary Scott Bessent said Treasury would accelerate buybacks of long-dated bonds and issue shorter-term debt. Sternberg argues the rise reflects higher growth expectations, driven partly by tech firms borrowing to invest in AI, and the unwinding of \"financial repression\" that let government borrow cheaply since 2008. Warsh's push to shrink the Fed's balance sheet and end forward guidance removes those subsidies. The big losers are lawmakers facing market-rate debt and looming political crisis.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20WSJ/The%20Bond%20'Chaos'%20Is%20a%20Sign%20Kevin%20Warsh's%20Plan%20Is%20Working.pdf"},{"id":"wsj-13","title":"Trump Wants a Summit That Kim Jong Un Doesn't Need","source":"WSJ","date":"21 Aug 2026","tags":["Geopolitics","Politics"],"summary":"President Trump wants to meet Kim Jong Un again, but the North Korean leader has spurned U.S. outreach and insists on being recognized as a nuclear-armed state. Kim negotiates from strength, with a growing economy, expanding arsenal and closer ties to Russia and China. Trump said he expects to meet Kim later this year after abruptly curtailing U.S.-South Korea military drills, but Pyongyang called the pullback immaterial and disputed recent communication. On Thursday, North Korea launched around 10 short-range ballistic missiles. Analysts say Kim faces fewer vulnerabilities, leaving Trump little leverage; a peace deal ending the 1953 armistice could offer Trump a foreign-policy win. Trump and Kim met three times in 2018-2019.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20WSJ/Trump%20Wants%20a%20Summit%20That%20Kim%20Jong%20Un%20Doesn't%20Need.pdf"},{"id":"wsj-14","title":"U.S. Leading Indicators Ticked Up in July","source":"WSJ","date":"21 Aug 2026","tags":["Finance & Markets"],"summary":"U.S. leading economic indicators edged higher in July, with every component except consumer expectations improving, signaling moderate growth ahead. The Conference Board's Leading Economic Index rose 0.2% to 99.5, following an upwardly revised 0.1% June decline. The index's six-month growth rate turned positive, up 0.2% between January and July, a sharp reversal from the prior six months' 1.3% contraction and the first positive reading in four years. Consumer expectations remain a notable drag. Senior manager Justyna Zabinska-La Monica said the economy should keep expanding, driven by business AI investments, while higher living costs may curb consumer spending among lower- and middle-income households. The Conference Board forecasts real GDP growth of 1.9% this year and in 2027.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20WSJ/U.S.%20Leading%20Indicators%20Ticked%20Up%20in%20July.pdf"},{"id":"wsj-15","title":"Walmart Shares Slump on Weakest Sales Growth in Over Six Years","source":"WSJ","date":"21 Aug 2026","tags":["Finance & Markets","Society"],"summary":"Walmart reported its smallest sales gain in over six years as cautious consumers spent less in physical stores. U.S. comparable sales rose 2.6% in the quarter ended July 31, the smallest increase since 2020 and below analysts' 3.8% estimate; new pharmacy-pricing rules cut the figure, which would otherwise have been 3.4%. Shares fell 9.2% to $103.84, the biggest one-day drop in over four years, down 23% from May's record. Growth came from a 24% jump in U.S. e-commerce, while in-store comps fell in low single digits. Net sales rose 5.9% to $186.1 billion; net income fell 9.4% to $6.37 billion. Walmart used part of $2.9 billion in tariff refunds to cut prices and raised full-year guidance.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20WSJ/Walmart%20Shares%20Slump%20on%20Weakest%20Sales%20Growth%20in%20Over%20Six%20Years.pdf"},{"id":"st-01","title":"Australia jobless rate hits near five-year high of 4.5% in July","source":"ST","date":"21 Aug 2026","tags":["Finance & Markets"],"summary":"Australian employment unexpectedly fell by 15,800 in July, and the jobless rate ticked up to 4.5 per cent, its highest since late 2021 and above the 4.4 per cent forecast, official data showed on Aug 20. The soft report, which sent the Australian dollar down 0.2 per cent to 71 US cents, eased pressure on the Reserve Bank of Australia to raise rates after three hikes in 2026 left the cash rate at 4.35 per cent. The participation rate slipped to 66.9 per cent and underemployment held at a two-year high of 6.4 per cent. Economists said offshore risks, rising bond yields, the US-Israeli war on Iran, the AI boom and a possible El Nino hitting wheat harvests remain the bigger threats.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/Australia%20jobless%20rate%20hits%20near%20five-year%20high%20of%204.5%20in%20July.pdf"},{"id":"st-02","title":"Australia passes law to levy tech giants that fail to pay for local news","source":"ST","date":"21 Aug 2026","tags":["Technology & AI","Politics"],"summary":"Australia passed the News Bargaining Incentive on Aug 20, forcing large tech platforms to pay millions in levies unless they strike commercial deals with local media outlets. The scheme taxes companies 2.5 per cent of advertising revenue and applies to Meta, Alphabet's Google, TikTok and Microsoft's LinkedIn that hold a significant search or social media service in Australia and local ad revenue above A$250 million (S$226 million). Platforms can avoid the charge by reaching agreements with at least eight publishers, with spending on large publishers carrying a 150 per cent offset and smaller outlets 200 per cent; single deals are capped at 25 per cent of levy liability. The government called it an important day for Australian journalism. It follows laws restricting gambling ads.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/Australia%20passes%20law%20to%20levy%20tech%20giants%20that%20fail%20to%20pay%20for%20local%20news.pdf"},{"id":"st-03","title":"Broadcom seeks more than $76 billion in latest AI debt deal: Sources","source":"ST","date":"21 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Broadcom is in talks with lenders to raise more than US$60 billion (S$76 billion) in debt for an AI chip financing deal that would benefit Anthropic and others, sources said. The package may include a roughly US$30 billion junior tranche, and Broadcom would guarantee part of a senior-secured tranche of US$60 billion to US$70 billion, potentially bringing the total to as much as US$100 billion. Blackstone and Apollo Global Management are in talks to participate, extending a June partnership, with debt issued via a special-purpose vehicle. The deal echoes an earlier US$35 billion agreement that launched the group's AI XPV platform, which plans to finance more than 20 gigawatts of computing. It adds to a rush of novel AI infrastructure debt deals, including Nvidia's US$500 billion coalition.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/Broadcom%20seeks%20more%20than%2076%20billion%20in%20latest%20AI%20debt%20deal%20Sources.pdf"},{"id":"st-04","title":"ChatGPT can now control iMessage, potentially raising Apple privacy concerns","source":"ST","date":"21 Aug 2026","tags":["Technology & AI","Society"],"summary":"OpenAI rolled out support on Aug 20 for controlling Apple's iMessage via ChatGPT on the Mac, allowing the system to read, write, send and search text messages and summarise conversations. The move risks raising privacy concerns for Apple, a self-styled privacy advocate that sued OpenAI in July over alleged theft of product information. OpenAI stressed the feature requires user consent, does not index all messages, and runs locally using AppleScript and Accessibility tools, with opt-in permission screens and System Settings changes such as Full Disk Access. The integration threatens to encroach on the upcoming Siri AI's ability to comb user content. Apple has previously blocked similar apps, such as Beeper Mini, which brought iMessage to Android. ChatGPT already works with Xcode, Notes and Terminal.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/ChatGPT%20can%20now%20control%20iMessage,%20potentially%20raising%20Apple%20privacy%20concerns.pdf"},{"id":"st-05","title":"China says it 'firmly opposes' Trump drone tariffs","source":"ST","date":"21 Aug 2026","tags":["Trade","Geopolitics"],"summary":"China said on Aug 20 it firmly opposes new US tariffs of up to 100 per cent on imports of unmanned drones and their components, after President Donald Trump announced the duties on national security grounds. Most of the measures take effect on Sept 3 as Washington seeks to cut reliance on imports in an industry China dominates. Commerce Ministry spokesman He Yadong said the tariffs overstretch the concept of national security, discriminate against Chinese products and disrupt the global drone supply chain, and urged Washington to immediately withdraw them. Chinese company DJI, founded in 2006, has captured more than two-thirds of the global drone market and has been on a US military-linked entity list since 2022, which it has fought, insisting it is not military-owned.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/China%20says%20it%20'firmly%20opposes'%20Trump%20drone%20tariffs.pdf"},{"id":"st-06","title":"China tests a new maritime presence east of Taiwan: Report","source":"ST","date":"21 Aug 2026","tags":["Geopolitics","Defence"],"summary":"China is expanding its presence east of Taiwan in an apparent bid to assert jurisdiction over the Philippine Sea, according to the Asia Maritime Transparency Initiative (AMTI). The unprecedented operations, including sustained law-enforcement patrols, surveys and the questioning of nearly 200 commercial vessels, followed a May agreement between Japan and the Philippines to negotiate a maritime boundary. AMTI said the activity, mainly involving two ships between June and August, could normalise a Chinese presence near Taiwan and test tactics for a future quarantine or blockade, employing grey-zone methods common in the South China Sea. The moves escalate tensions with Tokyo and Manila as the Trump administration softens its Taiwan stance ahead of Xi Jinping's September White House visit. China issued a legal warning in July, calling the talks a provocation against the One-China principle.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/China%20tests%20a%20new%20maritime%20presence%20east%20of%20Taiwan%20Report.pdf"},{"id":"st-07","title":"China urges South Korea not to take sides, blames US policy for Korea tensions","source":"ST","date":"21 Aug 2026","tags":["Geopolitics","Politics"],"summary":"Chinese Foreign Minister Wang Yi urged South Korea not to take sides between Beijing and Washington and said the US should abandon its hostile policy towards North Korea to ease peninsula tensions, during an Aug 20 visit to Seoul where he met President Lee Jae Myung and security adviser Wi Sung-lac. Wang's remarks followed Trump's Aug 19 statement that he planned to meet Kim Jong Un in 2026, his claim the North holds 57 nuclear weapons, and his order to cut short joint US-South Korea drills. South Korea condemned the North's launch of more than 10 short-range ballistic missiles on Aug 20. Wang said bilateral ties had fully recovered, pushed for early completion of free trade talks, and won Seoul's pledge to support China's APEC summit in Shenzhen.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/China%20urges%20South%20Korea%20not%20to%20take%20sides,%20blames%20US%20policy%20for%20Korea%20tensions.pdf"},{"id":"st-08","title":"Crypto surge triggers record $3.4 billion of short liquidations","source":"ST","date":"21 Aug 2026","tags":["Finance & Markets"],"summary":"The crypto market rebounded sharply, sending Bitcoin up nearly 8 per cent to around US$69,500 on Aug 19 and triggering the biggest wave of short liquidations since records began in 2021. More than US$1 billion of Bitcoin shorts were liquidated in about an hour, and across tokens a record US$2.7 billion (S$3.43 billion) in bearish bets were wiped out. Ether jumped 16 per cent. The rally came as Trump met crypto executives at the White House and the SEC proposed exempting some digital-asset offerings from registration. It was amplified when the US Treasury said it would at least double liquidity-support buybacks of 10- to 30-year debt, sending yields and the dollar lower. Coinbase rose 10 per cent, Strategy 13 per cent and Circle nearly 10 per cent.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/Crypto%20surge%20triggers%20record%203.4%20billion%20of%20short%20liquidations.pdf"},{"id":"st-09","title":"Hong Kong's CK Hutchison seeks $1.9 billion for loss of Panama assets in treaty dispute","source":"ST","date":"21 Aug 2026","tags":["Geopolitics","Trade"],"summary":"CK Hutchison Holdings has begun international arbitration against Panama, seeking more than US$1.5 billion (S$1.9 billion) in damages over the loss of its investments in the Balboa and Cristobal ports on the Panama Canal. The Li Ka-shing-founded firm said Panama breached an investment protection treaty in 2025 and 2026, culminating in the termination of its concession and takeover of the terminals. The dispute is a flashpoint in US-China rivalry: Beijing warned Panama would pay a heavy price after it annulled the concession under US pressure. The ports were part of CK Hutchison's planned US$19 billion sale of 43 terminals to a BlackRock-backed consortium, which angered Beijing and stalled; the firm later invited China Cosco Shipping to join. Beijing has advised state firms to halt Panama projects.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/Hong%20Kong's%20CK%20Hutchison%20seeks%201.9%20billion%20for%20loss%20of%20Panama%20assets%20in%20treaty%20dispute.pdf"},{"id":"st-10","title":"Iran finds control over Hormuz strait slipping away but US far from becoming victorious","source":"ST","date":"21 Aug 2026","tags":["Geopolitics","Energy"],"summary":"Jonathan Eyal argues that Iran is losing its grip on the Strait of Hormuz even as the US is far from victory. Trump vowed the most crushing economic operation ever against Iran, but Tehran dismissed it as delusional. What is crushing Iran is a physical naval blockade, imposed on April 13, that has halted its 1.7-1.8 million barrels-a-day oil exports and costs it around US$170 million daily. The US Navy is batching tankers through Hormuz at night via the Omani route, with Kpler reporting over 80 per cent of Gulf transits now avoid Iranian waters. The UAE suspended all trade with Iran on Aug 19. Yet oil prices remain 20 per cent above pre-war levels, and Iran gambles the US will eventually leave, letting it retake the strait.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/Iran%20finds%20control%20over%20Hormuz%20strait%20slipping%20away%20but%20US%20far%20from%20becoming%20victorious.pdf"},{"id":"st-11","title":"Japan govt launches large-scale Gen AI pilot programme for civil servants","source":"ST","date":"21 Aug 2026","tags":["Technology & AI","Politics"],"summary":"The Japanese government has launched a large-scale pilot of an in-house generative AI platform to support civil servants, covering around 180,000 employees including field offices. Named Genai after 18th-century inventor Hiraga Gennai and playing on the term generative AI, the system enables AI-assisted writing and translation and will help bureaucrats draft responses to parliamentary questions. Developed by the Digital Agency and trialled there from May 2025, the wider pilot began in May 2026, with full implementation targeted for fiscal 2027. Drafting parliamentary answers currently averages seven hours and 16 minutes; Genai offers search across transcripts and laws and is developing an auto-drafting function for late 2026. Human staff will still verify accuracy and make policy judgments. The platform also classifies public comments and transcribes meetings.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/Japan%20govt%20launches%20large-scale%20Gen%20AI%20pilot%20programme%20for%20civil%20servants.pdf"},{"id":"st-12","title":"Japan's exports grow at fastest pace since 2022 on chip, car demand","source":"ST","date":"21 Aug 2026","tags":["Trade","Finance & Markets"],"summary":"Japan's export growth accelerated to 23.2 per cent year on year in July, the fastest since October 2022, fuelled by robust chip and car demand and a yen at a 40-year low, the Finance Ministry reported on Aug 20. The result beat the 20.1 per cent forecast, though imports rose 27.8 per cent and the trade deficit widened to 634.5 billion yen (S$5 billion), a third straight monthly shortfall. Electronic-component shipments jumped about 49 per cent on the AI boom and passenger cars rose 21 per cent; exports to the US climbed 22 per cent. The yen averaged 161.83 per dollar, 11.2 per cent weaker than a year earlier. The Iran war continued to reshape energy sourcing, with oil-import value up nearly 88 per cent and US-sourced volumes rising to 36 per cent from 7 per cent in February.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/Japan's%20exports%20grow%20at%20fastest%20pace%20since%202022%20on%20chip,%20car%20demand.pdf"},{"id":"st-13","title":"Malaysia's July exports jump 38% year on year, higher than forecast","source":"ST","date":"21 Aug 2026","tags":["Trade","Southeast Asia"],"summary":"Malaysia's exports rose 38 per cent from a year earlier in July, faster than the 34.3 per cent expected by 14 economists surveyed by Reuters, government data showed on Aug 20. Imports grew 36.4 per cent, above the forecast 32.4 per cent rise. The country recorded a trade surplus of 22.5 billion ringgit (S$7.07 billion) for the month, well ahead of the poll's forecast of 17.5 billion ringgit.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/Malaysia's%20July%20exports%20jump%2038%20year%20on%20year,%20higher%20than%20forecast.pdf"},{"id":"st-14","title":"North Korea raps South's 'double-dealing' remarks on US drills move","source":"ST","date":"21 Aug 2026","tags":["Geopolitics","Defence"],"summary":"North Korea's Kim Yo Jong, sister of leader Kim Jong Un, on Aug 20 dismissed South Korean President Lee Jae Myung's reaction to a US move to reduce joint drills as double-dealing remarks revealing uneasiness and impatience, KCNA reported. Lee had welcomed Trump's will to create conditions for dialogue after Washington ordered a substantial cut in US participation, with the exercises ending Aug 21. Kim Yo Jong called Seoul's description a lame excuse and, on Aug 19, said she was unaware of any recent communication between her brother and Trump, insisting US hostile policy was unchanged. Russia welcomed the reduced drills, with Foreign Ministry spokeswoman Maria Zakharova saying such exercises risked destabilising the region and any measures reducing conflict potential were welcome.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/North%20Korea%20raps%20South's%20'double-dealing'%20remarks%20on%20US%20drills%20move.pdf"},{"id":"st-15","title":"Norway boosts defence footprint with expansion of Arctic brigade","source":"ST","date":"21 Aug 2026","tags":["Defence","Geopolitics"],"summary":"Norway expanded its Finnmark Brigade, headquartered in the Arctic, on Aug 20, the latest move by a NATO nation to strengthen defences after the Ukraine war. Established last year as the country's second brigade and its first since the Cold War, the unit previously mainly patrolled the 198-km border with Russia. It is being expanded to include an artillery battalion, air defence battery and communications company, enabling it to strike land targets about 40 km away and coordinate fire with Norwegian and NATO planes and ships. Brigade head Brigadier John Olav Fuglem called it a completely different level of firepower. Norway now spends an estimated 3.17 per cent of GDP on defence, up from 1.5 per cent in 2014. Defence Minister Tore Sandvik vowed to defend every centimetre against any threat.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/Norway%20boosts%20defence%20footprint%20with%20expansion%20of%20Arctic%20brigade.pdf"},{"id":"st-16","title":"Robots poised for 'ChatGPT moment', Unitree CEO says","source":"ST","date":"21 Aug 2026","tags":["Technology & AI"],"summary":"The CEO of Chinese humanoid robot maker Unitree, Wang Xingxing, said on Aug 20 the industry is nearing a ChatGPT moment for robot brains, after the firm's blockbuster Shanghai listing soared nearly sixfold before falling 11 per cent. He said robots may soon complete around 80 per cent of tasks in unfamiliar homes via simple voice or text commands, though a major software leap could take two to three years optimistically or five to 10 years at the latest. Unitree, the world's largest robot-dog producer and second-biggest humanoid maker, is focused on world models but is lagging in real-world application. China delivered over 40,000 humanoids in the first half of 2026 and accounts for 97 per cent of global shipments. In July, the US FCC banned future imports of foreign-made humanoid and quadruped robots on security grounds.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/Robots%20poised%20for%20'ChatGPT%20moment',%20Unitree%20CEO%20says.pdf"},{"id":"st-17","title":"Romania destroys marine drone near Neptun Deep gas project, minister says","source":"ST","date":"21 Aug 2026","tags":["Defence","Energy"],"summary":"Romania scrambled F-16 fighter jets to destroy a marine drone spotted a few hundred metres from the Black Sea gas project Neptun Deep, Defence Minister Radu Miruta said on Aug 20. The drone, later confirmed to contain explosives, was hit by the jet and finished off by a ship. The incident underscores the growing threat to Black Sea energy infrastructure from drones and mines linked to Russia's war in Ukraine; Neptun Deep is set to make Romania the EU's largest gas producer when it comes onstream in 2027. NATO-member Romania shares a 614-km border with Ukraine. President Nicusor Dan blamed Russia, and European Commission chief Ursula von der Leyen called it part of an escalating campaign of threats. Romania, Bulgaria and Turkey have neutralised over 150 drifting mines. Neptun Deep is owned by OMV Petrom and Romgaz.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/Romania%20destroys%20marine%20drone%20near%20Neptun%20Deep%20gas%20project,%20minister%20says.pdf"},{"id":"st-18","title":"Russian strikes kill 17 in Ukraine, Zelensky says lack of Patriots costing lives","source":"ST","date":"21 Aug 2026","tags":["Geopolitics","Defence"],"summary":"Russian air strikes killed 17 people and injured more than 40 in Kyiv and its region on Aug 20, in an attack President Volodymyr Zelensky called one of the most cynical and large-scale of the 4.5-year war. Russia launched dozens of cruise, ballistic and hypersonic missiles and 168 drones; the air force downed nearly 90 per cent of drones and most cruise missiles. Upper floors of a nine-storey Kyiv block were destroyed, killing at least eight, and 30 residential buildings, a school, a children's hospital and a kindergarten were damaged. Zelensky pleaded for Patriot interceptor replenishment, saying allied response was not adequate. EU chief Ursula von der Leyen called anti-ballistic capabilities the most urgent priority. Drones came down in Romania and Moldova; Ukraine struck Russia's TANECO refinery in Tatarstan.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/Russian%20strikes%20kill%2017%20in%20Ukraine,%20Zelensky%20says%20lack%20of%20Patriots%20costing%20lives.pdf"},{"id":"st-19","title":"Samsung, SK Hynix prep record shareholder returns in AI boom","source":"ST","date":"21 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Samsung Electronics and SK Hynix are preparing record shareholder returns after their stocks tumbled on concerns over the durability of AI hardware spending. Samsung will soon announce a plan worth more than 100 trillion won (S$91.17 billion), MoneyToday reported on Aug 20, with about half its free cash flow directed to returns focused on dividends. After SK Hynix unveiled a 40 trillion won buyback, JPMorgan said it may follow with returns of at least US$130 billion (S$165.13 billion). Samsung shares gained as much as 10.3 per cent and SK Hynix 14.7 per cent. On Aug 19, SK Hynix said it will buy back up to 24 million shares by mid-November and raised its return pledge to more than 50 per cent of cumulative free cash flow from 2025 to 2027, about US$170 billion. Surging high-bandwidth memory demand has strengthened balance sheets.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/Samsung,%20SK%20Hynix%20prep%20record%20shareholder%20returns%20in%20AI%20boom.pdf"},{"id":"st-20","title":"Singapore reforms timely as competition for fund managers with Hong Kong heats up: Analysts","source":"ST","date":"21 Aug 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"Singapore's bid to become the region's leading asset management hub could get a boost from measures the MAS announced on Aug 19, including a new foreign work pass track, tax exemption for profit-related returns and a hedge fund investment programme, analysts say, as it competes with Hong Kong for talent. Details await Budget 2027, but observers said timing is crucial. Hong Kong's assets under management grew 20 per cent to a record HK$42.2 trillion (S$6.8 trillion) in 2025, versus Singapore's S$6.7 trillion, up around 10 per cent, and some managers have relocated staff to Hong Kong for lower personal taxes. Analysts said the reforms target senior professionals but neglect junior hiring, and that the contest will be decided at the margins. The rivalry mirrors competition for IPOs, where Hong Kong hosted 85 first-half listings to SGX's eight in 2026.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/Singapore%20reforms%20timely%20as%20competition%20for%20fund%20managers%20with%20Hong%20Kong%20heats%20up%20Analysts.pdf"},{"id":"st-21","title":"The US-led recidivism in geopolitics - where is this going?","source":"ST","date":"21 Aug 2026","tags":["Geopolitics","Trade"],"summary":"In a commentary, former Singapore Defence Minister Ng Eng Hen argues the world is witnessing a US-led reversion to protectionism and narrow nationalism that echoes past mistakes. He notes 80 years of gains since World War II, with global GDP up tenfold, 1.5 billion lifted from extreme poverty and trade openness rising to 60 per cent of GDP, underpinned by US leadership from FDR and Truman through Reagan and Clinton. Today, figures like Marco Rubio and Scott Bessent call the post-war order obsolete and a weapon, while the National Security and Defence Strategies enshrine America First, rejecting free-riding and the rules-based order. Ng warns that as the largest geopolitical tectonic plate shifts course, surrounding states will buckle or transfer pressure, and great disruptions are a question of when, not if, for all countries including Australia and Singapore.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/The%20US-led%20recidivism%20in%20geopolitics%20-%20where%20is%20this%20going.pdf"},{"id":"st-22","title":"The message behind Trump's threats of 'economic warfare' against Iran","source":"ST","date":"21 Aug 2026","tags":["Geopolitics","Politics"],"summary":"US Treasury Secretary Scott Bessent tried on Aug 20 to reassure investors that a resumption of large-scale fighting with Iran was unlikely, even as Trump promised an economic D-Day and crushing measures. The subtext, this New York Times analysis argues, is that Trump does not want to return to war after weeks of bombing Iran earlier in 2026, leaving him with limited leverage and an emboldened adversary. Bessent said maximum economic pressure signals no imminent kinetic restart, but for now. Trump warned any country offering Iran a lifeline faces tremendous consequences, yet Iran's key lifeline is China, which buys most of its oil. Analysts said Trump is unlikely to risk an economic war with Beijing before Xi Jinping's Sept 24 visit, and warned Iran, sensing US weakness amid high gas prices and looming midterms, could lash out.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/The%20message%20behind%20Trump's%20threats%20of%20'economic%20warfare'%20against%20Iran.pdf"},{"id":"st-23","title":"Trump pledges 'economic warfare' on Iran, prompting Tehran derision","source":"ST","date":"21 Aug 2026","tags":["Geopolitics","Energy"],"summary":"US President Donald Trump pledged economic warfare against Iran and threatened any country trading with it, prompting Tehran to dismiss the plan on Aug 20 as a continuation of failed policies. The US-Israel war, started in February, appears stalemated, with peace talks stalled, Tehran keeping the Strait of Hormuz largely shut and Washington maintaining a naval counter-blockade. On Truth Social, Trump announced the most crushing economic operation ever taken against any country and warned of tremendous consequences for those aiding Iran. Foreign Minister Abbas Araghchi called it a diversion from America's own debt crisis. Analysts said Iran has taken a more confrontational stance, believing diplomacy is doomed, with Supreme Leader Mojtaba Khamenei appointing hardliners. The war has reignited Yemen's conflict, with the Houthis declaring a maritime blockade of Saudi Arabia.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/Trump%20pledges%20'economic%20warfare'%20on%20Iran,%20prompting%20Tehran%20derision.pdf"},{"id":"st-24","title":"Tuas Power to build hydrogen-ready power plant by 2031","source":"ST","date":"21 Aug 2026","tags":["Energy","Southeast Asia"],"summary":"Local generator Tuas Power will build a hydrogen-ready natural gas power plant at Tuas Power Station, slated to begin operations by December 2031, the Energy Market Authority announced on Aug 20. The combined cycle gas turbine facility will have a 670MW capacity, enough to power about 1.2 million four-room flats a year, and can burn up to 30 per cent hydrogen with natural gas, using diesel as back-up. The industry benchmark cost is $700 million to $1 billion. With the award, Singapore will have at least 11 hydrogen-ready gas plants by 2032. EMA forecasts peak electricity demand growing 2.4 to 4.8 per cent annually over the next decade, driven by economic growth, transport electrification, semiconductor manufacturing and data centres, reaching 9.6GW to 11.4GW by 2031 from around 8GW in 2025. The plant will also replace ageing retiring generators.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/Tuas%20Power%20to%20build%20hydrogen-ready%20power%20plant%20by%202031.pdf"},{"id":"st-25","title":"US targets Hezbollah with fresh sanctions, emphasizes ties to Iranian government","source":"ST","date":"21 Aug 2026","tags":["Geopolitics","Politics"],"summary":"The United States will issue fresh sanctions targeting Lebanon's Hezbollah, re-designating it under a terrorism authority to emphasise its links to the Iranian government, according to a statement seen by Reuters. The Treasury Department is re-designating Hezbollah as a Specially Designated Global Terrorist for service to the Iranian regime under the command of Iran's Islamic Revolutionary Guard Corps-Qods Force. A US official said the move aims to show Hezbollah acts on behalf of Tehran and to update the public record. Hezbollah was first designated in 2001 and is also a Foreign Terrorist Organization; the US also designated 10 people accused of smuggling cash for the group. The measures are separate from further planned action against Iran, with Treasury Secretary Scott Bessent set to unveil the toughest sanctions in history.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/U.S.%20targets%20Hezbollah%20with%20fresh%20sanctions,%20emphasizes%20ties%20to%20Iranian%20government.pdf"},{"id":"st-26","title":"US dollar hits 3-month low against euro, pares losses after Treasury move","source":"ST","date":"21 Aug 2026","tags":["Finance & Markets"],"summary":"The US dollar fell to a three-month low against the euro on Aug 20 before paring losses after the Treasury moved to calm a bond sell-off that pushed long-end yields to their highest since 2007. On Aug 19 the Treasury said it would double buybacks of 10- to 30-year debt to at least US$4 billion (S$5 billion) per operation, but the move triggered a dollar sell-off on worries over the growing US fiscal deficit and inflation, boosting gold and bitcoin in a debasement trade. Markets pushed back on Aug 20 as yields resumed climbing, with strategists doubting the Treasury's credibility. It was Bessent's second intervention in weeks, after a July 31 yen operation. Traders now price a 35 per cent chance of a September Fed rate hike, rising to 68 per cent by December, ahead of Chairman Kevin Warsh's Jackson Hole speech.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/US%20dollar%20hits%203-month%20low%20against%20euro,%20pares%20losses%20after%20Treasury%20move.pdf"},{"id":"st-27","title":"What property giant Evergrande's court rulings mean for China's economy","source":"ST","date":"21 Aug 2026","tags":["Finance & Markets","Geopolitics"],"summary":"An excruciating saga for Evergrande, the face of China's real estate woes, culminated on Aug 20 as a Shenzhen court sentenced founder Xu Jiayin to life in prison and fined the group and an affiliate more than US$2 billion (S$2.54 billion) for fraud and other offences. Once China's leading developer with a peak market value above US$50 billion, Evergrande's fortunes reversed in 2020 amid Beijing's borrowing curbs, leading to a 2021 default, a 2024 Hong Kong liquidation order and a 2025 delisting. The property slump has hit consumer confidence and dented growth just as China needs a consumption-led model. Analysts said the rulings signal Beijing will not bail out the sector and that firms must be debt-conscious. Beijing targets 2026 GDP growth of 4.5 to 5 per cent, its lowest in decades, with real estate investment down nearly a fifth.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20ST/What%20property%20giant%20Evergrande's%20court%20rulings%20mean%20for%20China's%20economy.pdf"},{"id":"bt-01","title":"'These are early days': US Fed officials cautious over impact of Treasury's bond market intervention","source":"BT","date":"21 Aug 2026","tags":["Finance & Markets","Politics"],"summary":"Two US Federal Reserve officials struck a cautious note on how the Treasury Department's debt management changes could affect monetary policy. St Louis Fed President Alberto Musalem said policy is set independently of debt management, adding financial conditions are \"pretty accommodative\" and hinting he leans toward a September hike after favouring one in July. San Francisco Fed President Mary Daly said long-term yields give little signal for policy calibration and declined to be \"pre-emptive\" on Treasury's shift toward shorter-dated issuance. The Treasury's surprise buyback of longer-dated debt eased conditions on Wednesday, but yields rebounded Thursday. Analysts warn the move risks friction with a Fed that may still raise rates to cool inflation running above its 2 per cent target.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/'These%20are%20early%20days'%20US%20Fed%20officials%20cautious%20over%20impact%20of%20Treasury's%20bond%20market%20int.pdf"},{"id":"bt-02","title":"Anthropic expects to match or top SpaceX's record IPO size","source":"BT","date":"21 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Anthropic expects to match or beat SpaceX's record US$75 billion initial public offering, sources said, as it prepares to file publicly for a mega-IPO as soon as end-August. SpaceX's sale, the biggest first-time share sale ever, rose to US$86.2 billion with the overallotment option. The Claude developer raised US$65 billion in May at a US$965 billion valuation, surpassing OpenAI's US$852 billion. Despite positive adjusted operating income in Q2, it posted a near US$42 billion net loss in 2025. Preliminary Q2 revenue topped US$11.5 billion versus US$787 million a year earlier, with run rate hitting US$65 billion by July's end. Anthropic is working with Morgan Stanley, Goldman Sachs and JPMorgan, and weighing super-voting shares for CEO Dario Amodei.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/Anthropic%20expects%20to%20match%20or%20top%20SpaceX's%20record%20IPO%20size.pdf"},{"id":"bt-03","title":"Apple's camera-equipped AI AirPods remain on track for 2027 despite video leak","source":"BT","date":"21 Aug 2026","tags":["Technology & AI","Society"],"summary":"Apple's camera-equipped AirPods remain slated for 2027, despite a leak suggesting an earlier arrival. Designed to push Apple into the AI wearables market, the earbuds were once planned for 2026 but were postponed by supply chain and software snags. A developer Mac software update accidentally included a video of the AirPods, first published by MacRumors, corroborating that they rely on Visual Intelligence to analyse surroundings. The product remains off Apple's 2026 schedule. The devices, which some critics dub \"pervertpods\", use low-resolution sensors to scan environments and feed context to Siri rather than take photos. If launched in 2027, they join a wave of new products under incoming CEO John Ternus, including a foldable iPhone, smart glasses and a touch-screen MacBook.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/Apple's%20camera-equipped%20AI%20AirPods%20remain%20on%20track%20for%202027%20despite%20video%20leak.pdf"},{"id":"bt-04","title":"Australia debt breaches A$1 trillion amid global borrowing spree","source":"BT","date":"21 Aug 2026","tags":["Finance & Markets","Politics"],"summary":"Australia's outstanding national debt temporarily exceeded A$1 trillion (US$711 billion), underscoring developed nations' struggle to rein in pandemic-era borrowing. Gross debt stood near A$984 billion at last week's end; adding A$17 billion in bonds sold this week pushed it beyond the symbolic mark, though it will dip below on Friday. PM Anthony Albanese's budget forecasts gross debt hitting nearly A$1.25 trillion by decade's end. The milestone comes as global borrowing costs surge amid inflation and AI-boom angst, with 10-year yields at multi-month highs. Still, Australia's debt is modest versus peers, with the US hitting US$40 trillion. Bond demand stayed strong, drawing five times the bids available, and Moody's and S&P kept the nation's AAA rating with stable outlook.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/Australia%20debt%20breaches%20A1%20trillion%20amid%20global%20borrowing%20spree.pdf"},{"id":"bt-05","title":"Bessent flags bigger debt buyback potential, coming fiscal plan","source":"BT","date":"21 Aug 2026","tags":["Finance & Markets","Politics"],"summary":"US Treasury Secretary Scott Bessent said he is prepared to expand buybacks of costlier debt and will unveil a new fiscal initiative addressing the highest borrowing costs in years, announcing an \"increased focus on fiscal consolidation\" tasked by Trump to himself and Budget Director Russ Vought. The Treasury said Wednesday it would at least double buybacks of longer-dated securities; Bessent said the move aimed to ensure orderly trading in a thin summer market and refocus investors on fundamentals. The impact was short-lived, with 30-year bonds erasing gains. He flagged operations could exceed the planned US$4 billion. Bessent pointed to a fraud task force and spending cuts, argued the deficit may have peaked, and reaffirmed a strong dollar policy while blaming energy for inflation.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/Bessent%20flags%20bigger%20debt%20buyback%20potential,%20coming%20fiscal%20plan.pdf"},{"id":"bt-06","title":"Bitcoin roars past US$70,000 as yields sink, Trump sparks optimism","source":"BT","date":"21 Aug 2026","tags":["Finance & Markets","Technology & AI"],"summary":"Bitcoin surpassed US$70,000 for the first time in over two months, rising more than 3 per cent to over US$71,500, its highest since June 1. The rally was propelled by Treasury Secretary Scott Bessent's move to push US bond yields lower and a high-stakes meeting Trump held with crypto industry leaders. A token tied to offshore exchange Hyperliquid jumped 23 per cent after Trump signalled the US is weighing options to let the derivatives platform operate domestically. The US plan to buy back longer-dated treasuries sent yields tumbling and the dollar to a three-month low, lifting risk assets. The move built on Bitcoin's 7 per cent surge a day earlier, which wiped out US$2.7 billion in short positions, and revived optimism around the stalled Clarity Act.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/Bitcoin%20roars%20past%20US70,000%20as%20yields%20sink,%20Trump%20sparks%20optimism.pdf"},{"id":"bt-07","title":"Gold holds near $4,500 as US Treasury buyback sends bond yields lower","source":"BT","date":"21 Aug 2026","tags":["Finance & Markets","Energy"],"summary":"Gold held its biggest gain in six months after the US Treasury's surprise move to rein in long-term borrowing costs. Bullion traded above US$4,500 an ounce after surging more than 4 per cent, as the Treasury said it would at least double buybacks of debt dated from the 10-year to 30-year sector. Hours later it disclosed total US public debt topped US$40 trillion for the first time, up a third in under five years. The move signals easier financial conditions, lowering the opportunity cost of holding gold. Gains may be tempered by energy-led inflation, with oil holding firm amid dim US-Iran peace prospects and a UAE-Iran spat. Spot gold rose 0.1 per cent to US$4,520.05; silver, platinum and palladium also edged higher.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/Gold%20holds%20near%204,500%20as%20US%20Treasury%20buyback%20sends%20bond%20yields%20lower.pdf"},{"id":"bt-08","title":"Gold wavers as bond yields rebound, oil jump fuels US inflation worries","source":"BT","date":"21 Aug 2026","tags":["Finance & Markets","Energy"],"summary":"Gold wavered as bond yields rebounded, with the Treasury's surprise buyback plan seen as a short-term fix while rising oil stoked fears of Fed rate hikes. Bullion was little changed after slipping as much as 1.4 per cent; the 30-year Treasury yield rose a day after the boost to repurchases did little to ease debt worries. Brent hovered near US$94 as Trump's threat to crush Iran's economy clouded war-ending prospects. Gold held most of its biggest six-month gain, supported by the Treasury's signal to back the long end. Citigroup strategists said the \"debasement trade\" needs a new expression, likely pushing investors back into gold and dollar shorts. Spot gold fell 0.1 per cent to US$4,510.55; it remains down around 15 per cent since the US-Iran conflict began in February.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/Gold%20wavers%20as%20bond%20yields%20rebound,%20oil%20jump%20fuels%20US%20inflation%20worries.pdf"},{"id":"bt-09","title":"Japan real estate investment set to hit record for second year","source":"BT","date":"21 Aug 2026","tags":["Finance & Markets","Trade"],"summary":"Japan's real estate investment is likely to hit a record for a second straight year, after office demand fuelled first-half transactions, according to Jones Lang LaSalle. Investment volume is forecast to climb to seven trillion yen (US$44 billion) this year as companies relocate offices and sell property to pursue asset-light strategies. Property investment jumped to a record 3.8 trillion yen in the January-June period, with foreign investors accounting for 30 per cent as they sought high returns by adding value. Rising interest rates have yet to deter investors as inflation returns. KKR and Blackstone are among bidders for Fuji Media Holdings' real estate business, with offers exceeding one trillion yen. Tokyo ranked second among global cities for first-half investment, trailing only Singapore.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/Japan%20real%20estate%20investment%20set%20to%20hit%20record%20for%20second%20year.pdf"},{"id":"bt-10","title":"Malaysia PM orders probe into unit of sovereign wealth fund","source":"BT","date":"21 Aug 2026","tags":["Southeast Asia","Politics"],"summary":"Malaysia's Prime Minister Anwar Ibrahim ordered an investigation into Xeraya Capital, a subsidiary of sovereign wealth fund Khazanah Nasional, after its board identified governance irregularities linked to past transactions. Xeraya manages Khazanah's life sciences investments, and the probe was decided at a Khazanah board meeting on Thursday, Anwar said via Facebook livestream. Anwar, who chairs Khazanah, said the board ordered a comprehensive investigation into potential governance breaches. Bernama reported Khazanah raised legacy issues involving Xeraya during its third board meeting of 2026, after Xeraya's board in July flagged irregularities in documentation relating to past transactions. Anwar said he instructed management to initiate a forensic investigation to the highest standards and, where necessary, bring in external authorities. Khazanah, owned by the finance ministry, invests across energy, healthcare, IT and real estate.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/Malaysia%20PM%20orders%20probe%20into%20unit%20of%20sovereign%20wealth%20fund.pdf"},{"id":"bt-11","title":"Move over, CSI 300? Why the Star 50 is the index that matters amid China's AI boom","source":"BT","date":"21 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Investors tracking China's hottest companies are shifting away from traditional benchmarks toward the technology-dominated Star 50 Index, less than a decade after its creation. With 86 per cent of firms in IT, it has outstripped the financials-heavy CSI 300 by about 30 per cent in 2026, offering a concentrated bet on AI hard tech as China pours trillions into self-sufficiency. Unveiled by Xi Jinping in 2018, the Star Market has fast-tracked IPOs for strategically critical firms. Nine of its top 10 constituents are semiconductors, and memory chipmaker CXMT, now China's most valuable company, is expected to join by end-2026. Unitree Robotics surged 46
