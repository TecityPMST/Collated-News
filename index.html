ousehold spending and sustained investment offset Middle East conflict risks, Bank Negara Malaysia and the Statistics Department said. Quarter on quarter, GDP grew 2.5 per cent. All sectors improved except agriculture, which contracted 3.7 per cent on lower palm oil output. Governor Abdul Rasheed Ghaffour said growth could reach 5 per cent or higher, aided by a tech-investment boom supporting AI infrastructure. Headline and core inflation each rose 1.9 per cent. The benchmark rate has been held at 2.75 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20BT/Malaysia's%20central%20bank%20upbeat%20as%20Q2%20growth%20beats%20expectations.pdf"}, {"id": "bt-13", "title": "Money managers chase US$577 billion historic German pension shift", "source": "BT", "date": "17 Aug 2026", "tags": ["Finance & Markets", "Society"], "summary": "One of the biggest reforms to Germany's pension system since Bismarck founded it is set to hand fund managers a vast new pool of cash, moving the nation from conservative guaranteed products toward index funds and private credit. The private pension pot alone could double to around 500 billion euros (US$577 billion) this coming decade, per fund lobby BVI. DWS, JPMorgan Asset Management, Vanguard, BlackRock and State Street are racing to ready products for the Jan 1, 2027 launch, which replaces the low-return Riester system with subsidised brokerage accounts capping fees at 1 per cent. S&P estimates the reform could unlock 26 billion to 56 billion euros of annual inflows. The shift, moving Germany closer to US-style retirement accounts, intensifies competition for insurers like Allianz and challengers like Trade Republic.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20BT/Money%20managers%20chase%20US577%20billion%20historic%20German%20pension%20shift.pdf"}, {"id": "bt-14", "title": "Nvidia has US$21 billion SpaceX stake, US$30 billion in Intel shares", "source": "BT", "date": "17 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Nvidia on Friday disclosed a nearly US$21 billion stake in Elon Musk's SpaceX and a US$30 billion stake in Intel. As at Jun 30 it held about 122.8 million SpaceX shares and roughly 214.8 million Intel shares, a regulatory filing showed. It is the first time Nvidia has given the value of its SpaceX position since investing in Musk's AI startup xAI, which was folded into SpaceX ahead of a public debut this year; Nvidia had put as much as US$2 billion into xAI in 2025. The value of its Intel stake has skyrocketed from about US$9.5 billion three months earlier, tracing to a US$5 billion investment last year alongside a chip co-development deal. Nvidia also held stakes in Coherent, Generate Biomedicines, Nebius Group, Nokia and Synopsys.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20BT/Nvidia%20has%20US21%20billion%20SpaceX%20stake,%20US30%20billion%20in%20Intel%20shares.pdf"}, {"id": "bt-15", "title": "Nvidia in talks to invest US$3 billion in SoftBank subsidiary for OpenAI data centre project: report", "source": "BT", "date": "17 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Nvidia is in talks to invest as much as US$3 billion in SB Energy, a SoftBank subsidiary developing a massive planned Ohio data centre for OpenAI, The Information reported. The proposed investment is part of Nvidia's discussions with OpenAI and SB Energy on providing around US$100 billion in credit support for the Ohio campus. Nvidia has discussed investing half the US$3 billion when the project deal is signed and the rest via SB Energy's planned IPO, which could come as soon as September and raise at least US$5 billion. SB Energy, also backed by OpenAI, builds large-scale power and data centre infrastructure for AI workloads. The Wall Street Journal reported Nvidia has revised its Ohio support to initially guarantee less than US$120 billion, down from US$250 billion previously discussed.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20BT/Nvidia%20in%20talks%20to%20invest%20US3%20billion%20in%20SoftBank%20subsidiary%20for%20OpenAI%20data%20centre%20projec.pdf"}, {"id": "bt-16", "title": "Oil climbs over US$1 on tanker attacks, no progress on peace", "source": "BT", "date": "17 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "Crude oil futures climbed over US$1 a barrel on Friday on tanker attacks and a lack of progress on a peace agreement between the Trump administration and Iran. Brent settled at US$88.52, up 1.7 per cent, and WTI at US$82.40, up 1.4 per cent, putting them on track for weekly gains of 6 and 5.4 per cent. Two Abu Dhabi National Oil Company vessels were attacked in the Strait of Hormuz, which the UAE blamed on Iran. Treasury Secretary Scott Bessent warned of unprecedented economic measures against Tehran, and the US signalled it could maintain an indefinite naval blockade. Crude exports from Russia's Novorossiysk terminal were suspended after a drone attack. Analysts noted US inventories posted their largest weekly build in over 3.5 years, which could pull prices lower.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20BT/Oil%20climbs%20over%20US1%20on%20tanker%20attacks,%20no%20progress%20on%20peace.pdf"}, {"id": "bt-17", "title": "Oil edges higher as Middle East tensions linger", "source": "BT", "date": "17 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "Oil prices barely moved in early Monday trade as tanker traffic through the Strait of Hormuz slowed over the weekend with no US-Iran peace deal in sight. Brent rose US$0.20, or 0.2 per cent, to US$88.72, while WTI slipped to US$82.35. Both contracts gained more than 5 per cent last week after attacks on Adnoc-operated tankers and a Saudi Aramco refinery. Iranian Foreign Minister Abbas Araqchi said Iran had not decided to resume talks, while President Trump urged Americans to accept slightly higher petrol prices. Five commodity vessels transited the strait on Saturday, none registered for Sunday, versus 31 the prior weekend, Kpler data showed. The UAE accused Iran of attacking a third Adnoc vessel on Friday. \"The status quo remains,\" said IG's Tony Sycamore.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20BT/Oil%20edges%20higher%20as%20Middle%20East%20tensions%20linger.pdf"}, {"id": "bt-18", "title": "OpenAI steps up Singapore footprint, in talks to lease 100,000 sq ft in Shaw Tower", "source": "BT", "date": "17 Aug 2026", "tags": ["Technology & AI", "Southeast Asia"], "summary": "ChatGPT creator OpenAI is in talks to lease about 100,000 square feet across five floors at the new Shaw Tower in Beach Road, a big step-up from the roughly 100 desks it now leases at CapitaSpring. In May, OpenAI announced its first Applied AI Lab outside the US in Singapore, pledging a S$300 million investment and 200-plus specialist hires under an MOU with the Ministry of Digital Development and Information. Rival Anthropic has leased about 100 desks at Ocean Financial Centre; Singapore leads Claude usage per capita globally. Other AI firms sinking roots include France's Mistral (Asia Square), Sierra and Manus AI at Keppel South Central. Manus is exiting Meta's offices after China blocked Meta's US$2 billion acquisition. Savills' Alan Cheong cautioned AI office demand is not yet stable.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20BT/OpenAI%20steps%20up%20Singapore%20footprint,%20in%20talks%20to%20lease%20100,000%20sq%20ft%20in%20Shaw%20Tower.pdf"}, {"id": "bt-19", "title": "Singapore may be expected to tighten measures after US 'transshipment scam' report: economists", "source": "BT", "date": "17 Aug 2026", "tags": ["Trade", "Southeast Asia", "Geopolitics"], "summary": "Singapore may be pressed to enforce tougher trade-fraud measures after being named in the White House's \"The Great Transshipment Scam\" report, economists said. The Aug 13 report placed Singapore in \"Tier 3\" as a \"small, opportunistic Chinese target\" among 40 lower-tariff markets used to evade US tariffs. Maybank's Chua Hak Bin said Singapore may be asked to enforce rules of origin and step up checks, but expects targeted penalties rather than blanket tariffs, with limited impact on hub activity. SDAX's Song Seng Wun called the naming geopolitical signalling, noting Singapore \"sits in the middle\" of US-China competition and is the largest US FDI source at over S$35 billion in 2025. Song expects tighter audits and documentation, though Singapore cannot legally block transiting ships. MTI vowed firm action against violations.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20BT/Singapore%20may%20be%20expected%20to%20tighten%20measures%20after%20US%20'transshipment%20scam'%20report%20economi.pdf"}, {"id": "bt-20", "title": "Straits Trading H1 net loss narrows by 72.7% to S$11.1 million", "source": "BT", "date": "17 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "The Straits Trading Company reported a net loss of S$11.1 million for the first half ended Jun 30, narrowing 72.7 per cent from S$40.8 million a year earlier, driven by a stronger resources segment and the absence of a prior non-cash bond remeasurement loss. Revenue rose 49.5 per cent to S$400 million. Resources net profit reached S$12.9 million, up from S$3.5 million, as tin mining and smelting revenue grew to S$351.2 million on higher prices, volume and a stronger ringgit. The real estate segment's net loss widened to S$16.1 million. Net gearing eased to 57.5 per cent. The firm expects tin demand from clean energy, electronics and AI to stay strong. Chairperson Chew Gek Khim said it is cutting debt amid a difficult real estate market.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20BT/Straits%20Trading%20H1%20net%20loss%20narrows%20by%2072.7%20to%20S11.1%20million.pdf"}, {"id": "bt-21", "title": "Stripe clinches over US$7 billion deal to buy AI firm OpenRouter", "source": "BT", "date": "17 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Payments firm Stripe has finalised an agreement to acquire OpenRouter, a startup that helps companies switch between AI models, for more than US$7 billion, sources said. The deal comes just months after OpenRouter raised money at a reported US$1.3 billion valuation and underscores demand for cost-friendly AI solutions while strengthening Stripe's footing in AI. Founded in 2023, OpenRouter provides access to more than 400 AI models and served 8 million developers as of May, backed by CapitalG, Andreessen Horowitz and Menlo Ventures, having raised over US$150 million. Its growth stems from developers experimenting with models for agentic software, amid rising scrutiny of AI costs and cheaper Chinese alternatives. The Wall Street Journal had earlier reported talks at about US$10 billion. CEO Alex Atallah co-founded NFT marketplace OpenSea.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20BT/Stripe%20clinches%20over%20US7%20billion%20deal%20to%20buy%20AI%20firm%20OpenRouter.pdf"}, {"id": "bt-22", "title": "Traders are spoiling for a fight over the yen", "source": "BT", "date": "17 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "Two weeks after the historic joint US-Japan intervention, markets are again reloading bets against the yen, setting a collision course. The first bilateral yen action since 1998, using euros bought by Treasury Secretary Scott Bessent, pulled the dollar from 164 to about 156 yen, but consistent selling since has taken it back to 159. The carry trade, where investors borrow cheap yen to buy higher-yielding US bonds and tech stocks, is a key driver, thriving in the current low-volatility environment. US 30-year yields hit their highest since 2001, outpacing Japanese yields. Mizuho's Masayuki Nakajima sees modest carry-trade pressure and low disorderly-unwind risk, though an unwind could hit US tech equities and EM assets. As long as US yields stay high and the BOJ moves cautiously, the yen remains a sell.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20BT/Traders%20are%20spoiling%20for%20a%20fight%20over%20the%20yen.pdf"}, {"id": "bt-23", "title": "Trump instructs Pentagon to reduce military exercises with South Korea, cites Seoul's Iran war stance", "source": "BT", "date": "17 Aug 2026", "tags": ["Defence", "Geopolitics", "Politics"], "summary": "President Donald Trump instructed the Pentagon to \"substantially reduce\" 10 days of joint military exercises with South Korea, citing their cost and Seoul's refusal to join actions against Iran. On Truth Social, hours before the annual Ulchi Freedom Shield drills, Trump said the exercises sent a \"totally inappropriate and hostile\" signal and highlighted his relationship with Kim Jong Un. The drills, running Aug 17-27 with about 18,000 South Korean personnel, began Monday as scheduled, Seoul's Joint Chiefs said. Trump revealed Seoul declined to join the \"denuclearisation of the Islamic Republic of Iran.\" North Korea recently fired ballistic missiles, and a US Northern Command official warned it had tested ICBMs able to deliver a nuclear payload anywhere in North America. Analysts saw a bid to open diplomacy with Pyongyang.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20BT/Trump%20instructs%20Pentagon%20to%20reduce%20military%20exercises%20with%20South%20Korea,%20cites%20Seoul's%20Iran.pdf"}, {"id": "bt-24", "title": "US$70 billion in 'phantom liabilities': Why bond traders are worried about AI firms' credit backstops", "source": "BT", "date": "17 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Even before Nvidia's US$500 billion financing partnership on Aug 11, investors were fretting over roughly US$70 billion in \"phantom liabilities\" that do not appear on major AI firms' balance sheets but could materialise in a downturn. Nvidia is poised to provide \"residual value\" support for AI debt deals, letting firms lean on its credit rating; Meta pioneered such guarantees and Broadcom applied them to chip financing, backstopping Anthropic. Analysts warn the arrangements are pro-cyclical and \"exacerbate boom-bust potential.\" CEO Jensen Huang said Nvidia may support up to 25 per cent of an opportunity to ease \"circular financing\" concerns. Broadcom's AI XPV platform could amass US$370 billion of senior debt by 2029. Moody's and S&P flag rising contingent obligations, though Janus Henderson's John Lloyd calls doomsday fears overblown.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20BT/US70%20billion%20in%20'phantom%20liabilities'%20Why%20bond%20traders%20are%20worried%20about%20AI%20firms'%20credit.pdf"}, {"id": "bt-25", "title": "What's stopping Asia's chipmakers from taking on Nvidia? The answer lies in this bottleneck", "source": "BT", "date": "17 Aug 2026", "tags": ["Technology & AI", "Southeast Asia"], "summary": "Nvidia's rise has spawned thousands of fabless AI chip startups across Asia, but access to advanced foundries like TSMC and Samsung is a critical bottleneck. South Korea's FuriosaAI, having raised US$246 million, secured TSMC 5 nm production for its RNGD inference chip, targeting 20,000 units in 2026 at about US$10,000 each. India's Agrani Labs, backed by Peak XV, is raising over US$100 million but may still struggle to secure TSMC capacity. Startups also need scarce high-bandwidth memory from SK Hynix, Samsung or Micron, and advanced packaging like TSMC's CoWoS; Singapore's Silicon Box offers panel-level packaging. Many India and South-east Asia firms, boxed out of frontier fabs, focus on edge-AI ASICs on mature nodes. TSMC's pure-play foundry share rose to 73.7 per cent in Q1 2026, per Counterpoint.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20BT/What's%20stopping%20Asia's%20chipmakers%20from%20taking%20on%20Nvidia%20The%20answer%20lies%20in%20this%20bottleneck.pdf"}, {"id": "bt-26", "title": "White House says transshipped goods lost up to US$26 billion in tariffs revenue", "source": "BT", "date": "17 Aug 2026", "tags": ["Trade", "Geopolitics", "Politics"], "summary": "The White House said the US is losing some US$19 billion to US$26 billion in annual tariff revenue to goods, largely from China, transshipped through third countries to avoid import duties. The report by trade adviser Peter Navarro identifies about 40 countries at elevated risk of illegal transshipments, often involving minimal processing, relabelling and repackaging of Chinese-origin components. It estimates transshipped goods at US$34 billion to US$303 billion per year, using a \"central case\" of US$75 billion, which it says displaces some 450,000 US jobs. Routing Chinese products through Mexico or Canada could eliminate duties entirely. Chinese imports fell to a 16-year low of US$308.7 billion in 2025 while Mexico and Vietnam imports rose. US Customs is deploying AI tools analysing X-ray imaging and packaging to detect cargo mismatches.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20BT/White%20House%20says%20transshipped%20goods%20lost%20up%20to%20US26%20billion%20in%20tariffs%20revenue.pdf"}, {"id": "scmp-01", "title": "AIIB warns climate inaction could downgrade a third of sovereign borrowers by 2050", "source": "SCMP", "date": "17 Aug 2026", "tags": ["Finance & Markets", "Environment"], "summary": "The Asian Infrastructure Investment Bank warned that more than a third, nearly 34 per cent, of its sovereign borrowers could face credit-rating downgrades by 2050 under a current-policy scenario where warming reaches about 2.9 degrees Celsius. That share falls to just over 11 per cent on a Paris-aligned 1.5-degree pathway. Downgrades would materialise between 2035 and 2040, driven by delayed physical impacts such as rising seas, heatwaves and flooding. The Beijing-based lender directed 71 per cent of 2025 regular financing to climate projects, approving US$7.47 billion, with 73 per cent for mitigation. Climate-assessed exposure stood at US$82 billion. Non-sovereign portfolios instead face higher transition risks under aggressive decarbonisation. Cumulative approvals should exceed US$50 billion between 2021 and 2030.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20SCMP/AIIB%20warns%20climate%20inaction%20could%20downgrade%20a%20third%20of%20sovereign%20borrowers%20by%202050.pdf"}, {"id": "scmp-02", "title": "Beijing issues ecological report to solidify South China Sea claims amid US row", "source": "SCMP", "date": "17 Aug 2026", "tags": ["Geopolitics", "Environment", "Southeast Asia"], "summary": "China's Ministry of Natural Resources South China Sea Bureau issued a 2025 marine ecological monitoring bulletin and a restoration report covering nine disputed features across the Paracels, Spratlys and Macclesfield Bank, framed as the first comprehensive assessment. Beijing blamed the Philippines for \"severe degradation\" at Sandy Cay and Second Thomas Shoal, saying live coral at Sandy Cay fell nearly 70 per cent from 2016, citing Philippine construction and the grounded BRP Sierra Madre. The releases came amid a row with Washington, which rejected China's \"national nature reserve\" at Scarborough Shoal as coercive. China implemented 66 restoration projects last year worth nearly 5 billion yuan and designated 2.7 million hectares under conservation red lines.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20SCMP/Beijing%20issues%20ecological%20report%20to%20solidify%20South%20China%20Sea%20claims%20amid%20US%20row.pdf"}, {"id": "scmp-03", "title": "China rattled by Trump White House chaos weeks ahead of Xi visit. It has happened before", "source": "SCMP", "date": "17 Aug 2026", "tags": ["Geopolitics", "Politics", "Trade"], "summary": "With under six weeks until Xi Jinping's planned state visit to Washington, his first since 2015, Chinese officials are unsettled by disorganisation in the Trump administration, sources told the Post. No US official or agency has taken charge of the visit, and the State Department remains largely uninvolved, echoing frustrations before Trump's earlier Beijing trip. Anxiety runs deeper because the summit is on foreign soil, with protocol controlled by the White House. The only concrete item discussed is a roughly US$30 billion tariff reduction on Chinese goods. Ties have been tested by tit-for-tat measures, including US entity-list additions and Chinese sanctions. Trump floated September 24; analysts fear a surprise announcement catching Xi off guard.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20SCMP/China%20rattled%20by%20Trump%20White%20House%20chaos%20weeks%20ahead%20of%20Xi%20visit.%20It%20has%20happened%20before.pdf"}, {"id": "scmp-04", "title": "China's 1MW perovskite solar farm beats silicon system in industrial-scale test", "source": "SCMP", "date": "17 Aug 2026", "tags": ["Energy", "Technology & AI"], "summary": "A China-led team from Nanjing University, with Canadian collaborators, developed a super-stable coating that lets large perovskite solar modules withstand heat, humidity and temperature extremes, clearing a key hurdle to commercialising the leading alternative to silicon. A dining-table-sized panel reached 22 per cent efficiency at 158.4 watts. In a field test, a 1-megawatt perovskite system beat a 3.5MW silicon facility, generating 3.42 per cent more electricity in March, 3.79 in April and 5.81 in May. Panels using the new coating lost just 2 per cent efficiency after 1,300 hours at 85 degrees Celsius and 85 per cent humidity, versus 39 per cent for conventional treatments, passing international reliability tests. Published in Nature, the results set a manufacturability benchmark.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20SCMP/China's%201MW%20perovskite%20solar%20farm%20beats%20silicon%20system%20in%20industrial-scale%20test.pdf"}, {"id": "scmp-05", "title": "China's richest province taps Alibaba to power its AI and chip push", "source": "SCMP", "date": "17 Aug 2026", "tags": ["Technology & AI", "Trade"], "summary": "Guangdong, China's wealthiest province, signed a strategic cooperation framework with Alibaba in Guangzhou, deepening ties across artificial intelligence, semiconductors and smart public services. The Hangzhou-based firm plans to increase investment in computing power, AI models and digital services. Party secretary Huang Kunming urged Alibaba to step up technology innovation and research, highlighting synergies with energy and telecoms firms and AI deployment across electronics, manufacturing and healthcare. CEO Eddie Wu called Guangdong a \"core region\". The province led China with first-half GDP of 7.23 trillion yuan (US$1.07 trillion). Alibaba's footprint already includes a Shaoguan computing cluster powered by proprietary Zhenwu chips and rack-climbing robots in Dongguan. The deal aligns with Guangdong's 15th five-year plan. Alibaba owns the Post.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20SCMP/China's%20richest%20province%20taps%20Alibaba%20to%20power%20its%20AI%20and%20chip%20push.pdf"}, {"id": "scmp-06", "title": "Chokepoints and the cost of cutting off access", "source": "SCMP", "date": "17 Aug 2026", "tags": ["Geopolitics", "Trade"], "summary": "This analysis argues every chokepoint poses three questions: how much depends on it, what it takes to use it, and who decides. It recalls Elon Musk's 2022 refusal to extend Starlink for a Ukrainian attack near Sevastopol, showing how concentrated discretion can hinge on one person. China's \"Malacca dilemma\" spurred a naval build-up; Iran's blockade of Hormuz, which carries a fifth of oil and gas shipments, imposes costs on everyone. Technological chokepoints, from Japan's 2019 curbs on South Korea to China's rare-earth controls, push buyers to find substitutes, weakening leverage over time. The 2018 ZTE denial order showed abrupt political reversals. The next arena is low Earth orbit, with Starlink, China's Guowang and Amazon's Leo constellations.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20SCMP/Chokepoints%20and%20the%20cost%20of%20cutting%20off%20access.pdf"}, {"id": "scmp-07", "title": "Communist Party of China invokes Jiang's legacy in call to rally round Xi's leadership", "source": "SCMP", "date": "17 Aug 2026", "tags": ["Politics", "Geopolitics"], "summary": "A Communist Party research group, the Institute of Party History and Literature, invoked late leader Jiang Zemin's legacy in a People's Daily article marking his birth centenary, urging cadres to rally behind Xi Jinping amid economic and geopolitical \"rough waters\". It credited Jiang's third-generation leadership with weathering crises and stressed upholding the Party Central Committee's authority with Xi at its core. The call precedes a key party meeting in October, the most important event before next year's congress and an expected leadership overhaul. The article urged accelerating technological self-reliance amid competition with Washington, while China grapples with youth unemployment and weak consumer confidence. Commemorations include a documentary, stamps and a Beijing gathering where Xi will speak.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20SCMP/Communist%20Party%20of%20China%20invokes%20Jiang's%20legacy%20in%20call%20to%20rally%20round%20Xi's%20leadership.pdf"}, {"id": "scmp-08", "title": "From cargo to combat: China urged to prepare civilian ships for wartime use", "source": "SCMP", "date": "17 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "A defence researcher at China's top economic planning agency urged Beijing to accelerate plans to commandeer civilian ships for wartime use, drawing lessons from Britain's 1982 Falklands mobilisation. Writing in Defence Industry Conversion in China, Li Jin of the National Development and Reform Commission called for a comprehensive database of civilian fleets, noting speed, capacity, ownership and crew, especially tankers and semi-submersibles, plus command plans, frequent rehearsals and vessels designed to defence requirements. He cited a 2018 case where the air force moved a unit over 1,000 nautical miles by ship, and the Zhen Hua 33 semi-submersible as dual-use. China is exploring rapid conversions; a \"containerised weapon module suite\" was spotted on cargo ship Zhong Da 79.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20SCMP/From%20cargo%20to%20combat%20China%20urged%20to%20prepare%20civilian%20ships%20for%20wartime%20use.pdf"}, {"id": "scmp-09", "title": "Home province of DeepSeek, Moonshot founders seeks to retain, attract future AI talent", "source": "SCMP", "date": "17 Aug 2026", "tags": ["Technology & AI", "Society"], "summary": "Guangdong is courting AI talent, welcoming nearly 40 Tsinghua University computer-science students to bridge a gap in China's AI race after failing to retain homegrown stars Moonshot's Yang Zhilin and DeepSeek's Liang Wenfeng. Per Hurun, Beijing hosts 19 of China's top 50 AI firms and Shanghai 14, while Guangzhou and Shenzhen hold 10 combined. Experts cite weaker academic heritage, though the province touts its manufacturing base as a testing ground. Incentives include Guangzhou subsidies up to 10 million yuan and Shenzhen talent grants up to 1.8 million yuan; Haizhu district offered token-usage subsidies. A tour featured the Tianhe-2 supercomputer and Pony AI. Polled students split between Beijing and Guangdong, with high living costs favouring the south.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20SCMP/Home%20province%20of%20DeepSeek,%20Moonshot%20founders%20seeks%20to%20retain,%20attract%20future%20AI%20talent.pdf"}, {"id": "scmp-10", "title": "Hong Kong raises growth forecast after best half-yearly showing in nearly 5 years", "source": "SCMP", "date": "17 Aug 2026", "tags": ["Finance & Markets", "Trade"], "summary": "Hong Kong raised its 2026 full-year growth forecast to 3.5-4.5 per cent, up from 2.5-3.5, after the economy expanded 5.1 per cent in the first half, its best half-yearly showing in nearly five years, with 4.3 per cent second-quarter growth. Goods exports surged 28.9 per cent, private consumption rose 2.8 per cent and investment 4.4 per cent. Government economist Irina Fan cited the AI boom: AI-related products made up about 70 per cent of merchandise exports, rising 63.7 per cent year on year. Tech and AI firms raised HK$97.9 billion via IPOs. Tourism reached 26.71 million visitors. Economists warned growth was uneven; HSBC lifted its forecast to 4.5 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20SCMP/Hong%20Kong%20raises%20growth%20forecast%20after%20best%20half-yearly%20showing%20in%20nearly%205%20years.pdf"}, {"id": "scmp-11", "title": "Hong Kong to list first Shanghai free-trade zone bond to defend yuan hub status", "source": "SCMP", "date": "17 Aug 2026", "tags": ["Finance & Markets", "Trade"], "summary": "Hong Kong will host its first Shanghai free-trade zone offshore bond, using the listing to defend its status as the pre-eminent offshore yuan hub. HKEX said Shanghai Electric Global Capital will list a 1.5 billion yuan (US$222.4 million) three-year green bond on August 20 with a 1.8 per cent coupon, the first non-financial corporate free-trade zone offshore bond. Bank of China arranged the cross-border issuance. The move counters mainland efforts to strengthen Shanghai's offshore capabilities after the PBOC's Lujiazui pilot foreign-exchange programme. Hong Kong retains 1.1 trillion yuan in offshore deposits and handles over 70 per cent of global offshore yuan payments. HKEX's new bond listings have topped 153 this year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20SCMP/Hong%20Kong%20to%20list%20first%20Shanghai%20free-trade%20zone%20bond%20to%20defend%20yuan%20hub%20status.pdf"}, {"id": "scmp-12", "title": "I gave Tencent's WeChat AI agent control for 24 hours: where it excelled - and stumbled", "source": "SCMP", "date": "17 Aug 2026", "tags": ["Technology & AI"], "summary": "The writer spent nearly 24 hours letting Tencent's new WeChat AI agent, Xiaowei, run daily digital tasks. Highlighted for the first time in Wednesday's earnings, Xiaowei promises hands-free control across WeChat's ecosystem of messaging, payments and mini-programs, a home-field edge over rivals like Alibaba's Qwen. It smoothly sent messages, made calls, set reminders and navigated food orders, leaving only final confirmation. But it stumbled: menu navigation was slower than doing tasks manually, and it looped on a phonetically similar contact. Xiaowei runs on the in-house WeLM model, at 80 billion and 617 billion parameters, not flagship Hy3. The verdict: clunky and not autonomous, but positioned on an unrivalled launch pad. Alibaba owns the Post.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20SCMP/I%20gave%20Tencent's%20WeChat%20AI%20agent%20control%20for%2024%20hours%20where%20it%20excelled%20-%20and%20stumbled.pdf"}, {"id": "scmp-13", "title": "Impact of US trade policy shifts on Hong Kong 'primarily psychological': Paul Chan", "source": "SCMP", "date": "17 Aug 2026", "tags": ["Finance & Markets", "Trade"], "summary": "Hong Kong Financial Secretary Paul Chan said US trade-policy and interest-rate shifts would significantly affect the city but the impact would be \"primarily psychological\", driving market volatility rather than fundamental harm. He expected interest rates to change little, with one 0.25-point increase already priced in, and called second-half risks manageable despite US midterms. Chan noted the US is only Hong Kong's fourth-largest export market. He revealed 31 million visitors in the first seven months, up 12 per cent, and airport traffic of 32.8 million. Two days after the government lifted its growth forecast to 3.5-4.5 per cent, Chan cited AI-driven investment, pledged aviation-hub expansion, and flagged gold stockpiling toward a commodity-trading centre.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20SCMP/Impact%20of%20US%20trade%20policy%20shifts%20on%20Hong%20Kong%20'primarily%20psychological'%20Paul%20Chan.pdf"}, {"id": "scmp-14", "title": "In Malaysia, DAP's vote to stay in Anwar's alliance secures stability - but at what cost?", "source": "SCMP", "date": "17 Aug 2026", "tags": ["Southeast Asia", "Politics"], "summary": "Malaysia's Democratic Action Party voted on Sunday to remain in Prime Minister Anwar Ibrahim's Pakatan Harapan government, with nearly 90 per cent of over 2,200 delegates backing the move, securing stability until the term ends in early 2028. The decision gives Anwar breathing room but raises the stakes for the DAP, whose credibility analysts say will erode unless it delivers concrete reforms before GE16, due by February 2028. The party holds 40 parliamentary seats crucial to Anwar's legitimacy. Pressure had mounted after DAP's Sabah wipeout and Umno's state-poll wins in Johor and Negeri Sembilan. Secretary General Anthony Loke acknowledged they must keep working with Umno federally. Analysts warned of continued Malay-nationalist drift.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20SCMP/In%20Malaysia,%20DAP's%20vote%20to%20stay%20in%20Anwar's%20alliance%20secures%20stability%20-%20but%20at%20what%20cost.pdf"}, {"id": "scmp-15", "title": "Launch of DeepSeek's Harness marks its strategic pivot towards autonomous agentic AI", "source": "SCMP", "date": "17 Aug 2026", "tags": ["Technology & AI"], "summary": "Chinese AI company DeepSeek launched a developer preview of Harness, a software framework that turns AI models into autonomous agents able to operate external software, run code and complete complex jobs. The Thursday release marks a strategic pivot beyond large language models toward foundational agent scaffolding. Harness is highly modular, each element a swappable plug-in, offering four modes, standard, code-focused, creative and minimal, contrasting with Anthropic's integrated, ready-to-use Claude Code. DeepSeek hired ex-Jane Street engineer Cui Tianyu in March for its harness group. The launch coincides with steep API price rises: cache-hit input for the premium V4-Pro model jumps from 0.36 US cents to 2.20 off-peak and 4.40 peak per million tokens.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20SCMP/Launch%20of%20DeepSeek's%20Harness%20marks%20its%20strategic%20pivot%20towards%20autonomous%20agentic%20AI.pdf"}, {"id": "scmp-16", "title": "Luxury home sales rebound in mainland China but overall market recovery unlikely: analysts", "source": "SCMP", "date": "17 Aug 2026", "tags": ["Finance & Markets", "Society"], "summary": "Luxury-home sales are rebounding in mainland China's top cities as tech-boom millionaires upgrade housing, but analysts said the trend is too narrow to signal a broad recovery after a six-year property slump. Data from Purui showed 1,636 homes priced 30-50 million yuan sold in the first half, up 38 per cent, while units above 10 million yuan fell 13 per cent to 18,000. Real estate and related industries make up about a quarter of GDP. Buyers are largely semiconductor, AI and robotics executives, concentrated in Hangzhou, home to the \"Six Little Dragons\". First-tier new-home prices rose 0.1 per cent in June; Hangzhou climbed 1.9 per cent. Brokers warned buoyant high-end deals may not lift the wider market.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20SCMP/Luxury%20home%20sales%20rebound%20in%20mainland%20China%20but%20overall%20market%20recovery%20unlikely%20analysts.pdf"}, {"id": "scmp-17", "title": "Moscow strikes Ukrainian steel plant as Kyiv targets Russian economy", "source": "SCMP", "date": "17 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Russia launched overnight air strikes on Ukraine, killing two and injuring 14 at ArcelorMittal's steel plant in Kryvyi Rih, President Zelensky's hometown, damaging power and blast-furnace facilities. Kyiv retaliated with a heavy drone attack on the Moscow region that killed an 83-year-old man and set ablaze a Wildberries e-commerce warehouse in Podolsk, which Ukraine accuses of handling military goods. Russia said it downed 822 Ukrainian drones. A missile strike on Kyiv injured several. Romania said an F-18 on a Nato air-policing mission shot down a drone, apparently Russian, that breached its airspace via Moldova. The exchanges continue a pattern of both sides targeting energy infrastructure, ports and Black Sea vessels since the 2022 invasion.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20SCMP/Moscow%20strikes%20Ukrainian%20steel%20plant%20as%20Kyiv%20targets%20Russian%20economy.pdf"}, {"id": "scmp-18", "title": "SMIC weighs more capacity as AI-related chip demand exceeds forecasts", "source": "SCMP", "date": "17 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "China's largest foundry, SMIC, is weighing adding equipment after demand for mature-node chips used alongside AI processors surged beyond forecasts, with co-CEO Zhao Haijun saying future wafer starts were \"far exceeding\" expectations. Shortages are spreading to supporting chips, including logic, power-management and optical components, with BCD power orders visible through end-2027. Second-quarter capacity utilisation hit 93.7 per cent, near its practical limit; SMIC intends to cap at about 95 per cent. Revenue rose 20 per cent sequentially to US$3.01 billion, up 36.1 per cent year on year, with gross margin at 25.3 per cent. It guides third-quarter growth of 2-4 per cent. China contributed about 90 per cent of revenue. Further price rises look likely.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20SCMP/SMIC%20weighs%20more%20capacity%20as%20AI-related%20chip%20demand%20exceeds%20forecasts.pdf"}, {"id": "scmp-19", "title": "Saudi Arabia-Turkey-Pakistan pact a sign of a realigning global order", "source": "SCMP", "date": "17 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "This analysis frames the new Saudi Arabia-Turkey-Pakistan security agreement, dubbed an \"Islamic Nato\" or Mecca Joint Defence Agreement, as a sign of a realigning global order and eroding confidence in US security guarantees, worsened by the US-Israeli war on Iran. It notes concern that nuclear-armed Pakistan's inclusion in a collective-defence commitment could carry global consequences, though some analysts see mainly political signalling. China may view the pact as a chance to expand Middle East and South Asian influence, positioning itself as mediator, having brokered the 2023 Saudi-Iran rapprochement. India watches warily amid rivalry with Pakistan, while a more self-reliant regional bloc challenges Israel's hegemonic ambitions. Beijing's core interest remains energy supply.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20SCMP/Saudi%20Arabia-Turkey-Pakistan%20pact%20a%20sign%20of%20a%20realigning%20global%20order.pdf"}, {"id": "scmp-20", "title": "Taiwan drone defences fall short against Beijing's evolving technology, audit reveals", "source": "SCMP", "date": "17 Aug 2026", "tags": ["Defence", "Technology & AI"], "summary": "A Taiwan Audit Office report found the military's NT$3.55 billion (US$111 million) fixed-site counter-drone programme has significant shortcomings, unable to detect or jam the 5.1GHz frequency used by newer PLA drones, missing BeiDou-3 coverage and lacking capability against fibre-optic and AI-guided drones. The NCSIST-built system is six to 12 months behind schedule. Separately, an NT$980 million army procurement for 26 systems collapsed after contractor Tron Future Tech failed acceptance testing. Defence Minister Wellington Koo cited poor target identification. The ministry said many threats emerged after the 2021 launch and pledged upgrades. Analysts called the response \"extremely disappointing\", warning jamming is ineffective against fibre-optic drones and unified command integration is not expected until end-2027.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20SCMP/Taiwan%20drone%20defences%20fall%20short%20against%20Beijing's%20evolving%20technology,%20audit%20reveals.pdf"}, {"id": "scmp-21", "title": "Trump says he'll soon declare Strait of Hormuz to be US territory", "source": "SCMP", "date": "17 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "President Donald Trump said he would \"soon\" declare the Strait of Hormuz part of US territory after defeating Iran, telling a New York rally the move would follow the war's end. It was unclear how seriously he meant the remark or whether it signalled new policy. Iran's Deputy Foreign Minister Kazem Gharibabadi said the waterway would open or close only under Iran's authority and Tehran would not be intimidated. Trump, who launched the war with Israel on February 28, said the US maintains a blockade, \"No ships get through unless we want them to\", and urged Americans to accept higher petrol prices. About 20 per cent of global oil and LNG shipments usually transit the strait.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20SCMP/Trump%20says%20he'll%20soon%20declare%20Strait%20of%20Hormuz%20to%20be%20US%20territory.pdf"}, {"id": "scmp-22", "title": "US shifts Iran war goal, says cheaper oil for Americans is top priority", "source": "SCMP", "date": "17 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "US officials signalled the top priority in the Iran war is now lowering petrol prices for American consumers rather than Iran's nuclear programme, underscoring the leverage Tehran gained by shutting the Strait of Hormuz. Vice-President J.D. Vance said on Fox News keeping oil and gas cheap was \"goal number one\", with preventing a nuclear weapon second. Treasury Secretary Scott Bessent threatened economic isolation \"like the world has never seen before\", with new measures expected within a week. The comments confirm a cautious approach: blockading Iranian ports and blocking oil sales while diplomacy stalls. Trump's approval is falling ahead of November midterms as soaring petrol prices threaten Republican control of Congress. The military has depleted costly missile stockpiles.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20SCMP/US%20shifts%20Iran%20war%20goal,%20says%20cheaper%20oil%20for%20Americans%20is%20top%20priority.pdf"}, {"id": "scmp-23", "title": "US team sent to Taiwan to train coastguards amid surge in mainland Chinese activity", "source": "SCMP", "date": "17 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "The United States sent a coastguard team to Taiwan for a two-week training programme, begun Monday, focused on small-boat operations and team coordination, as Beijing steps up its presence east of the island. Taiwan's Coast Guard Administration said instructors aimed to deepen partnership and maritime security; the American Institute in Taiwan recently publicised such exchanges. Friday's statement omitted Beijing, but China Coast Guard and government vessels operated around Taiwan on 252 occasions in the first half, an 89 per cent jump, including 110 in June, suggesting efforts to normalise a permanent presence. PLA aircraft sightings, by contrast, halved. The deployments intensified after Japan-Philippines maritime boundary talks began June 1.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20SCMP/US%20team%20sent%20to%20Taiwan%20to%20train%20coastguards%20amid%20surge%20in%20mainland%20Chinese%20activity.pdf"}, {"id": "scmp-24", "title": "US-China tech war is coming for AI's plumbing", "source": "SCMP", "date": "17 Aug 2026", "tags": ["Technology & AI", "Trade"], "summary": "This analysis examines a reported FCC proposal to ban Chinese optical transceivers, small fibre-optic devices that move data in AI data centres, as the US-China tech war expands beyond chips. Washington cites data-theft, disruption and dependence risks, applying preventive logic to avoid another Huawei situation. But an abrupt ban could disrupt US hyperscalers like Amazon and Microsoft, since US suppliers Coherent and Lumentum cannot match Chinese scale. North America holds about 36 per cent of the transceiver market; China accounts for roughly 64 per cent of demand, while final products rely on Western components. News of the proposal moved shares of Zhongji Innolight, Eoptolink, Coherent and Marvell. Beijing vowed countermeasures, warning decoupling will be costly.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20SCMP/US-China%20tech%20war%20is%20coming%20for%20AI's%20plumbing.pdf"}, {"id": "scmp-25", "title": "Why US Indo-Pacific 'burden sharing' risks deepening polarisation and big power rivalry", "source": "SCMP", "date": "17 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "This analysis examines Washington's \"burden sharing\" push in the Indo-Pacific, as defence undersecretary Elbridge Colby urged allies to boost spending, saying the US seeks \"partners, not protectorates\" and is quietly increasing deterrent capability while toning down China rhetoric. Analysts say the strategy reflects resource constraints amid the Iran war and aims to reassure risk-averse Southeast Asian states unwilling to pick sides. But experts warn it intensifies great-power rivalry and polarisation, deepening China-Russia and Russia-North Korea coordination. Tsinghua's Sun Chenghao and the CIIS's Xiang Haoyu describe a shift toward a networked, alliance-centred denial model spanning the Quad and Aukus, though credibility risks erosion from Trump's transactional \"America first\" style. Beijing, they say, avoids bloc confrontation.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20SCMP/Why%20US%20Indo-Pacific%20'burden%20sharing'%20risks%20deepening%20polarisation%20and%20big%20power%20rivalry.pdf"}, {"id": "scmp-26", "title": "Why the Chinese yuan could soon be Africa's most important currency", "source": "SCMP", "date": "17 Aug 2026", "tags": ["Finance & Markets", "Trade"], "summary": "Africa is becoming fertile ground for Beijing's push to internationalise the yuan and cut dollar reliance as more banks join China's CIPS payment network, a Swift alternative. After Libya-China central bank talks, Libyan banks will join CIPS and plan panda-bond issuance; other members include Afreximbank and South Africa's Standard Bank, authorised to clear yuan across 19 nations and processing 8 billion yuan (US$1.2 billion) since late last year. Zambia now collects mining taxes in yuan; Angola's Banco de Fomento is preparing to join. China, Africa's largest trading partner, saw bilateral trade hit a record US$203.5 billion in the first half. Analysts say CIPS also buffers against Western sanctions, though the dollar won't be displaced soon.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/17%20Aug%202026/17%20Aug%20SCMP/Why%20the%20Chinese%20yuan%20could%20soon%20be%20Africa's%20most%20important%20currency.pdf"}]}, "2026-08-18": {"date": "2026-08-18", "dayOfWeek": "Tuesday", "totalArticles": 86, "sourceCounts": {"WSJ": 14, "ST": 16, "BT": 30, "SCMP": 26}, "executiveDigest": "The Iran war hardened into a dangerous stalemate: Trump let his 60-day peace deadline expire and threatened to 'bomb' Oman as Iran vowed a 'full offensive' in Hormuz if diplomacy fails, pushing oil up over US$2, slowing Strait shipping and driving the US diesel crack above US$100 a barrel for the first time. Fading Fed-hike bets sent the dollar to a since-June low, lifted gold and pushed emerging currencies to a record. Singapore stayed firm - economists raised full-year export forecasts after July's 24.2% NODX jump - while OpenAI locked a giant Ohio data centre backed by up to a US$105 billion Nvidia guarantee.", "briefingCards": [{"title": "Lead story - Iran war stalemate deepens", "body": "Diplomacy collapsed into brinkmanship: SCMP reported Trump 'let the 60-day deadline for an Iran peace deal expire and threatened to bomb Oman', while BT said Iran 'threatens a full offensive in Hormuz if diplomacy fails' as Trump 'rejected a truce extension'. WSJ described 'Trump's Iran-war Gordian knot' and revealed 'Iran's secret plan to escalate', even as its rulers stay 'wary of more economic pain and unrest'. The energy fallout was immediate: oil 'settled up over US$2 as the stalemate stoked supply concerns', shipping slowed through Hormuz after tanker attacks, Houthis struck Saudi vessels, Asian refiners resisted an Aramco Red Sea request, and the US diesel crack 'surpassed US$100 a barrel for the first time'. Erdogan urged Trump back to talks."}, {"title": "Markets & finance", "body": "Fed-hike bets faded across the board: the greenback slipped to its lowest since early June, gold advanced, and emerging-market currencies 'rose to a record high'. Japan was the outlier - its 10-year yield hit a three-decade high on inflation and BOJ pressure (an ex-currency chief urged hikes 'at every meeting') even as weak spending clouded the outlook. US signals were mixed: New York manufacturing accelerated but home-builder sentiment stayed muted, and the SEC floated letting firms 'report earnings quarterly and ditch some filings'. WSJ argued 'Big Tech's AI spending is US$3 trillion higher than it seems', Bitcoin ETFs saw their largest outflow in six weeks, and BHP beat on higher copper prices."}, {"title": "Asia realignment", "body": "China's slowdown set the tone: BT reported 'China's economy lost momentum in July as factory output, retail sales and investment all missed', new-home prices stagnated, and the premier 'called for stabilising external demand as growth sputters'. The US kept up pressure - the Pentagon 'ordered 30 universities to scrutinise ties with Chinese research partners', and German auto job losses mounted 'as the China challenge intensifies'. Regional friction simmered: Russia summoned Japan's ambassador over the Kuril Islands after Putin's visit, Taiwan teamed with a US start-up on underwater drones and called record defence spending 'an investment in peace', and Trump trimmed US-South Korea drills while saying Kim 'has responded to his overtures'."}, {"title": "Energy & climate", "body": "Oil firmed on the Iran stalemate, up over US$2, with shipping slowing through Hormuz and the US diesel crack topping US$100 a barrel for the first time on supply disruptions; the US energy chief said Washington 'will announce steps to help refiners produce more fuel', and Asian refiners balked at loading Saudi crude at a Red Sea port under Houthi threat. Strategic-resource themes ran alongside: Singapore and China 'inked a deal on peaceful nuclear-technology cooperation', Sembcorp said an IPO of its Indian renewable unit 'remains preliminary', BHP profited from higher copper, and SCMP examined 'why the Arctic sea route has become so important for China and Russia'."}, {"title": "Technology & AI", "body": "The AI-capex debate intensified even as deals ballooned: OpenAI 'locked in a lease for a huge Ohio data centre', with SCMP reporting Nvidia will provide 'up to a US$105 billion guarantee', and Anthropic's revenue run-rate 'topped US$65 billion'. Yet WSJ warned 'Big Tech's AI spending is US$3 trillion higher than it seems', Chinese hedge funds are 'rotating out of Nvidia and US hyperscalers', and Meta 'faces a potential US$1.4 trillion penalty as a landmark social-media trial begins'. China's chip champions surged - CXMT topped 4 trillion yuan and Biren projected a 22-fold revenue jump - while a key AI-data-centre material faces 'a price spike amid a China supply crunch' and warehouses keep 'rolling in more robots'."}, {"title": "Singapore & SEA focus", "body": "Singapore's data stayed constructive: economists 'raised full-year NODX forecasts after July's 24.2% jump', business sentiment recovered in Q2 (though the SBF poll kept the outlook cautious), and former DBS chief Piyush Gupta urged the financial sector to 'resist risk aversion and be bolder'. Strategic deals landed - Singapore and China signed a peaceful-nuclear cooperation pact - and property moved, with Kallang Distripark set for redevelopment into thousands of new private homes. Markets chatter flagged Straits Trading, OUE and Hotel Properties as 'stocks to watch', debated whether SGX should follow Hong Kong on longer trading hours, and BT pressed the 'real AI test for Singapore's SMEs: adoption is not capability'. Thailand's Q2 GDP beat, lifting its full-year outlook."}], "keyMetrics": [{"value": "86", "label": "Articles curated today", "sub": "WSJ 14 · ST 16 · BT 30 · SCMP 26"}, {"value": "Deadline expires", "label": "Iran war stalemate", "sub": "Oil up US$2; Hormuz shipping slows"}, {"value": ">US$100/bbl", "label": "US diesel crack record", "sub": "First time, on supply disruption"}, {"value": "+24.2%", "label": "Singapore July NODX", "sub": "Economists lift export forecasts"}, {"value": "Since-June low", "label": "US dollar slips", "sub": "Gold up; EM FX at record"}, {"value": "US$105b", "label": "Nvidia OpenAI guarantee", "sub": "For huge new Ohio data centre"}], "articles": [{"id": "wsj-01", "title": "ArcelorMittal Says Two Killed in Missile Strike on Ukraine Facility", "source": "WSJ", "date": "18 Aug 2026", "tags": ["Geopolitics", "Trade"], "summary": "Steelmaker ArcelorMittal said two people, one staff member and one contractor, were killed and 13 others injured in a weekend missile strike on its ArcelorMittal Kryvih Rih facility in southern Ukraine, the company said Monday. Energy-production facilities and the site's blast furnace were damaged, partially halting production processes. Specialists are assessing the extent of the damage and considering options for restoring operations. The injured are being treated at medical facilities in Kryvih Rih, a city west of the Dnipro river. \"Our focus is on the families and loved ones of our colleagues,\" the company said. The attack underscores continued targeting of Ukrainian industrial and energy infrastructure amid the ongoing war.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20WSJ/ArcelorMittal%20Says%20Two%20Killed%20in%20Missile%20Strike%20on%20Ukraine%20Facility.pdf"}, {"id": "wsj-02", "title": "From missile detection to battlefield surveillance, U.S. space capabilities are reshaping modern warfare—and facing new threats from China", "source": "WSJ", "date": "18 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "In a Wall Street Journal video interview, Shelby Holliday spoke with Gen. B. Chance Saltzman about the U.S. Space Force's pivotal year and how the military must prepare for a future in which adversaries such as China challenge America's advantage in space. From Venezuela to Iran, the U.S. has used satellites and other space capabilities to gain an edge in warfare, the report notes. Space technologies can help detect missile launches, synchronize strikes, provide a clear view of the battlefield and degrade an enemy's ability to operate. The piece frames space as central to modern warfare while flagging emerging Chinese threats to U.S. orbital dominance.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20WSJ/From%20missile%20detection%20to%20battlefield%20surveillance,%20U.S.%20space%20capabilities%20are%20reshaping.pdf"}, {"id": "wsj-03", "title": "How Wall Street Sussed Out That Situational Awareness Was On the Ropes", "source": "WSJ", "date": "18 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Leopold Aschenbrenner's hedge fund Situational Awareness collapsed in late July, losing roughly 67 percent, about $30 billion, in a single month, though it remained up 80 percent for the year. The heavily leveraged AI-focused fund, which peaked near $100 billion in assets and borrowed about $3 per $1 of capital, faced margin calls as its long positions such as Bloom Energy, Sandisk and Nebius tumbled and its shorted software stocks rallied. Scrambling for cash, it sold much of its stock portfolio to Citadel at a discount and part of its $5 billion Anthropic stake. Jane Street, an investor, lost about $15 billion. The fund now manages roughly $15 billion and is rebuilding its portfolio.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20WSJ/How%20Wall%20Street%20Sussed%20Out%20That%20Situational%20Awareness%20Was%20On%20the%20Ropes.pdf"}, {"id": "wsj-04", "title": "Iran's Secret Plan to Escalate the War", "source": "WSJ", "date": "18 Aug 2026", "tags": ["Geopolitics", "Energy", "Defence"], "summary": "Despite a mid-June memorandum of understanding meant to reopen the Strait of Hormuz and wind down the war, Iran's hard-line leaders spent two months preparing to widen the conflict, Iranian and Arab officials said. Steps include giving the Revolutionary Guard more control over the regular army, appointing veteran hardliners, expanding counterintelligence and ramping up missile and drone production. Iran attacked ships to tighten its Hormuz grip, extended fighting to the Red Sea via Yemen's Houthis, struck U.S. troops in Jordan and hit UAE vessels. \"The baseline is war,\" a former U.S. negotiator said. Analysts describe current clashes as \"salami-slicing\" before a larger confrontation, dimming prospects for a durable deal.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20WSJ/Iran's%20Secret%20Plan%20to%20Escalate%20the%20War.pdf"}, {"id": "wsj-05", "title": "Japan's Economy Keeps Growing, But Weak Spending Could Vex BOJ", "source": "WSJ", "date": "18 Aug 2026", "tags": ["Finance & Markets"], "summary": "Japan's economy grew for a third straight quarter, with real GDP up 0.3 percent in April-June from the prior quarter, slower than the first quarter's 0.5 percent and short of expectations. On an annualized basis, growth was 1.1 percent, also missing consensus. External demand added 0.5 percentage point, but that largely reflected falling Middle East energy imports rather than export strength. Private consumption was flat and capital expenditure fell 1.2 percent. Economists warn war-driven oil price hikes and a weak yen could squeeze household and corporate budgets and lift inflation above the Bank of Japan's 2 percent target in the second half. The data sharpens focus on a possible September rate hike; the BOJ held at 1 percent last month.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20WSJ/Japan's%20Economy%20Keeps%20Growing,%20But%20Weak%20Spending%20Could%20Vex%20BOJ.pdf"}, {"id": "wsj-06", "title": "L3Harris Ousts CEO After Investigation Into Conduct", "source": "WSJ", "date": "18 Aug 2026", "tags": ["Defence", "Finance & Markets"], "summary": "Defense contractor L3Harris Technologies ousted Christopher Kubasik as chairman and chief executive after an investigation found he violated the company's code of conduct. The alleged conduct didn't involve financial reporting, controls, customer relationships or operations, L3Harris said Monday. Kubasik keeps some vested stock options but receives no severance; shares closed down 4.6 percent. Sam Mehta, head of the space and communications business, which accounts for over 80 percent of revenue, becomes president and CEO, while Lewis Hay III becomes chairman. Kubasik helped merge L3 and Harris and secured a $1 billion government investment in the Aerojet missile unit; he had earlier lost Lockheed Martin's top job over a relationship with a subordinate. L3Harris affirmed its 2026 financial targets.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20WSJ/L3Harris%20Ousts%20CEO%20After%20Investigation%20Into%20Conduct.pdf"}, {"id": "wsj-07", "title": "Many Companies Would Announce Earnings Quarterly, Ditch Filings Under SEC Proposal", "source": "WSJ", "date": "18 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "A KPMG survey of 156 finance executives suggests most companies would keep releasing quarterly earnings even if the SEC allows semiannual filing. Thirty-nine percent would publish quarterly press releases but file regulatory reports twice yearly; another 39 percent would make no changes and keep filing 10-Qs. Only 3 percent would drop quarterly updates entirely, while 12 percent were undecided. The SEC is expected to advance the proposal despite opposition; supporters say it could encourage IPOs, while investors want frequent data. Companies including Eli Lilly plan semiannual filings but quarterly releases. Executives noted financing agreements often require quarterly data, and 94 percent would keep quarterly internal governance. Former Netflix finance chief David Wells warned looser cycles could enable fraud.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20WSJ/Many%20Companies%20Would%20Announce%20Earnings%20Quarterly,%20Ditch%20Filings%20Under%20SEC%20Proposal.pdf"}, {"id": "wsj-08", "title": "New York Manufacturing Activity Accelerates in August", "source": "WSJ", "date": "18 Aug 2026", "tags": ["Finance & Markets"], "summary": "Factory activity in New York State accelerated in August, with the Federal Reserve Bank of New York's Empire State Manufacturing Survey headline index rising to 20.6, its highest reading in four years and far above the 12 that economists polled by the Wall Street Journal had expected. The new orders index came in at 17.3 and shipments at 11.7, signaling solid gains. The number-of-employees index eased to 9.3, but the average workweek index rose to 6.9, pointing to expanding hours. The prices paid index climbed six points, indicating faster input cost increases, while prices received dipped five points. The survey also showed delivery times lengthened substantially and inventories declined, hinting at supply pressures amid the broader growth.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20WSJ/New%20York%20Manufacturing%20Activity%20Accelerates%20in%20August.pdf"}, {"id": "wsj-09", "title": "OpenAI Locks In Lease for Huge Data Center in Ohio With Backing From Nvidia", "source": "WSJ", "date": "18 Aug 2026", "tags": ["Technology & AI", "Finance & Markets", "Energy"], "summary": "OpenAI signed a 10-gigawatt, 20-year data-center lease in southern Ohio with SoftBank's SB Energy, partly backed by Nvidia, in one of the largest AI hubs to date. Nvidia agreed to backstop a portion of the completed site's value, starting with the first roughly 5-gigawatt phase, to help raise debt financing without taking on major risk; it will be the exclusive chip provider for the first half and take an equity stake in SB Energy. If OpenAI walked away, Nvidia would cover value shortfalls up to $105 billion once the initial phase completes. The campus sits partly on a former DOE uranium-enrichment site and could power seven million homes. Nvidia expects to sell hundreds of billions in chips.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20WSJ/OpenAI%20Locks%20In%20Lease%20for%20Huge%20Data%20Center%20in%20Ohio%20With%20Backing%20From%20Nvidia.pdf"}, {"id": "wsj-10", "title": "Trump Says Israel Should Stop Striking Gaza", "source": "WSJ", "date": "18 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "President Trump said Israel shouldn't be striking targets in Gaza, a rare public break with Prime Minister Benjamin Netanyahu, as envoy Jared Kushner met Netanyahu on Monday to salvage Trump's plan to disarm Hamas and end the war. Netanyahu last week rejected the phased-disarmament plan, and Israel resumed near-daily strikes. Trump told Fox News that Hamas has agreed to lay down its weapons: \"Ultimately, they are giving up their guns.\" The three-hour meeting concluded Israel won't redeploy until Hamas disarms but retains the right to respond to threats. Kushner had met Hamas officials, including Khalil Al-Hayya, in Egypt on Sunday, pressing them to take first steps toward transferring authority and decommissioning weapons over 60 to 90 days.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20WSJ/Trump%20Says%20Israel%20Should%20Stop%20Striking%20Gaza.pdf"}, {"id": "wsj-11", "title": "Trump's Iran War Gordian Knot", "source": "WSJ", "date": "18 Aug 2026", "tags": ["Geopolitics", "Energy", "Politics"], "summary": "In a Wall Street Journal opinion piece, Ludovic Hood argues Trump faces a \"Gordian Knot\" in Iran: political constraints bar sufficient military force, while a defiant Tehran endures economic pain. Washington has settled on economic pressure, a pause until after the Nov. 3 midterms, risking a stalemate Tehran claims as victory with de facto control of the Strait of Hormuz. Hood urges giving Treasury's Scott Bessent and State's Marco Rubio a \"blank check\" to strangle Revolutionary Guard revenue and rally Arab allies against Iran's proxies in Iraq, Yemen and Lebanon. Iran's economy is reeling from an estimated $270 billion in airstrike damage and a drop of more than 70 percent in oil exports under the U.S. naval blockade, he notes.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20WSJ/Trump's%20Iran%20War%20Gordian%20Knot.pdf"}, {"id": "wsj-12", "title": "U.S. Home-Builder Sentiment Still Muted by Affordability Concerns", "source": "WSJ", "date": "18 Aug 2026", "tags": ["Finance & Markets"], "summary": "U.S. home-builder confidence barely rose in August as high mortgage rates, rising construction costs and economic uncertainty weighed on the market. The NAHB/Wells Fargo Housing Market Index inched up to 35 from 34 in July, beating economists' expectation of a drop to 33. A reading below 50 signals net-negative sales conditions; sentiment has stayed below 40 for 16 straight months. It also marked the 16th consecutive month in which at least 30 percent of builders cut prices, with 35 percent reducing prices in August, said NAHB chief economist Robert Dietz. Custom builders and smaller markets outperformed spec builders and larger metros. Sales-condition gauges rose slightly, while future-sales and prospective buyer traffic indexes held steady.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20WSJ/U.S.%20Home-Builder%20Sentiment%20Still%20Muted%20by%20Affordability%20Concerns.pdf"}, {"id": "wsj-13", "title": "Why Big Tech's AI Spending Is $3 Trillion Higher Than It Seems", "source": "WSJ", "date": "18 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "A Wall Street Journal analysis of securities-filing footnotes found nine top tech companies hold about $3 trillion in off-balance-sheet commitments, mostly AI-related, roughly triple their disclosed leases and long-term debt and growing faster than the $600 billion in trailing capital expenditure. Uncommenced leases totaled $1.2 trillion, four times a year earlier, while purchase obligations reached $1.9 trillion. Meta's Louisiana \"Hyperion\" project shows how lease guarantees stay off the books until rent begins. Alphabet's commitments hit $811 billion by June 30, some energy deals running to 2054. With Alphabet and Amazon posting negative free cash flow, analysts warn these largely uncancelable obligations make total leverage hard to assess if AI demand disappoints.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20WSJ/Why%20Big%20Tech's%20AI%20Spending%20Is%203%20Trillion%20Higher%20Than%20It%20Seems.pdf"}, {"id": "wsj-14", "title": "Why Warehouses Are Rolling In More Robots", "source": "WSJ", "date": "18 Aug 2026", "tags": ["Technology & AI", "Trade"], "summary": "Rising wages and consumer demand for fast delivery are pushing logistics operators to automate warehouses. North American companies ordered nearly 18,000 robots worth about $1.2 billion in the first half, up 2 percent in units and 7 percent in value from a year earlier; last year's 36,700 orders were the most since 2022. Firms are investing despite new U.S. tariffs and surging fuel prices to rein in costs, executives say. GXO Logistics has spent nearly $1 billion in five years on automation. Average U.S. warehouse wages reached $26.85 an hour in June, up 41 percent in a decade, while about 392,000 transport-and-warehousing jobs sat open. Locus Robotics said its deal pipeline is up 50 percent; managers are \"buying resilience,\" its CEO said.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20WSJ/Why%20Warehouses%20Are%20Rolling%20In%20More%20Robots.pdf"}, {"id": "st-01", "title": "Battered by war, Iran's rulers wary of more economic pain and unrest if US tightens pressure", "source": "ST", "date": "18 Aug 2026", "tags": ["Geopolitics", "Energy", "Society"], "summary": "Iran's leaders fear fresh US economic punishment could deepen hardship and reignite unrest after nearly six months of war. Trump vowed on Aug 14 to hit Iran hard economically, a day after Treasury Secretary Scott Bessent promised measures \"never been seen.\" Iran's annual inflation hit 66 per cent in July, with food inflation at 128 per cent year-on-year and the rial eroding minimum-wage purchasing power. US strikes damaged factories, power plants and transport, while a naval blockade lifted costs and cut petrol imports; daily petrol output of 130 million litres trails 137 million litres of consumption. Hossein Taeb's appointment to lead the Basij militia signals concern over renewed protests, which authorities have met with executions and arrests, according to Reuters interviews.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20ST/Battered%20by%20war,%20Iran's%20rulers%20wary%20of%20more%20economic%20pain%20and%20unrest%20if%20US%20tightens%20pressu.pdf"}, {"id": "st-02", "title": "ByteDance signs AI copyright pact with Hollywood trade group", "source": "ST", "date": "18 Aug 2026", "tags": ["Technology & AI", "Trade"], "summary": "ByteDance and the Motion Picture Association signed an agreement on Aug 17 to strengthen copyright safeguards on the Chinese company's AI video and image-generation models, months after the Hollywood trade group challenged its intellectual-property handling. The deal covers ByteDance's Seedance video and Seedream image models and follows a cease-and-desist letter the MPA sent in February. Disney and other studios had raised concerns the tools could generate content featuring copyrighted characters and celebrity likenesses without authorisation. ByteDance said newer model versions include stronger IP protections. The models are offered through services including TikTok, CapCut and Dreamina. Both sides said they will keep collaborating on safeguards for copyrighted content as AI technology evolves, according to Reuters.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20ST/ByteDance%20signs%20AI%20copyright%20pact%20with%20Hollywood%20trade%20group.pdf"}, {"id": "st-03", "title": "Ditch inflation targets? Better to overhaul them instead", "source": "ST", "date": "18 Aug 2026", "tags": ["Finance & Markets"], "summary": "This Bloomberg Opinion column by Daniel Moss argues central-bank inflation targets, typically around 2 per cent, need rethinking rather than scrapping for a more volatile 21st-century world of supply shocks, political upheaval and AI disruption. Targets will be missed more frequently, so policymakers should articulate alternative scenarios and clearer timeframes for restoring inflation after prolonged misses, as MIT's Kristin Forbes suggests. The euro zone's rate has climbed near 3 per cent since the Iran war began, while US and UK gains sit marginally above threshold. New Fed chairman Kevin Warsh has criticised fixation on \"two numbers to the right of the decimal point\" but backs keeping targets. Moss traces the 2 per cent benchmark to New Zealand in 1988 and urges nimble, credible communication.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20ST/Ditch%20inflation%20targets%20Better%20to%20overhaul%20them%20instead.pdf"}, {"id": "st-04", "title": "Emerging currencies rise to record high as Fed hike bets ease", "source": "ST", "date": "18 Aug 2026", "tags": ["Finance & Markets"], "summary": "Emerging-market currencies rose to a record high on Aug 17 as bets on a Federal Reserve rate hike cooled, spurring demand for risk assets. A gauge tracking EM currencies advanced as much as 0.2 per cent to an all-time high of 1,906.98, while an equities gauge climbed as much as 0.6 per cent. A weaker dollar, driven by softer US retail-sales data, supported gains; the Bloomberg Dollar Spot Index fell 0.2 per cent for a third straight loss. US swaps now fully price a 25-basis-point hike by January 2027, a shift from earlier year-end expectations. BNY strategist Wee Khoon Chong cited softer dollar and risk recovery, while Societe Generale's Galvin Chia noted quiet geopolitics and Brent below US$90 helped Asian currencies.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/18%20Aug%202026/18%20Aug%20ST/Emerging%20currencies%20rise%20to%20record%20high%20as%20Fed%20hike%20bets%20ease.pdf"}, {"id": "st-05", "title": "Erdogan urges Trump to pursue talks with Iran, offers support", "source": "ST", "date": "18 Aug 2026", "tags": ["Geopolitics"], "summary": "Turkish President Tayyip Erdogan urged US President Donald Trump in a phone call to pursue talks with Iran to de-escalate tensions, offering Ankara's support for peace efforts, the Turkish presidency said on Aug 18. Turkey, with NATO's second-largest army and a border with Iran, has repeatedly called for an end to the war and maintains contact with Washington, Tehran and mediators. The call followed a senior Iranian official's statement that Iran would shift to a \"fully offensive\" posture as negotiations stalled and Washington ruled out extending a ceasefire. Progress on resuming oil tanker traffic through the Strait of Hormuz has stalled. Erdogan and Trump also discussed Gaza and a defence pact between Turkey, Saudi Arabia and Pakistan, according to Reuters.",
