d higher credit risks, the SFC said such funds must enhance disclosure. Complex products are subject to selling requirements including suitability checks. The move follows heightened attention to private credit risks; last December HSBC Asset Management suspended a retail fund involving private credit. New fund applications may face closer scrutiny outside the FASTrack process.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/Hong%20Kong%20regulator%20reclassifies%20certain%20funds%20with%20exposure%20to%20private%20markets.pdf"},{"id":"scmp-14","title":"Iran targets US bases in Kuwait despite warnings from Trump","source":"SCMP","date":"4 Sep 2026","tags":["Geopolitics","Defence"],"summary":"Iran attacked US military bases in Kuwait on Thursday with missiles and drones, despite President Donald Trump threatening further strikes six months into the war. Trump said the US was prepared to attack Iran \"any time we want\" after bombardment left at least 19 Iranians dead. Tehran retaliated by hitting US targets in Kuwait, Jordan, the UAE, Bahrain and Iraq's Kurdistan region. Iran maintains a stranglehold on the Strait of Hormuz oil route while the US presses a counter-blockade of Iranian ports. The latest round began when Washington struck Iranian targets on Sunday, saying it was stopping Tehran from placing sea mines. Energy Secretary Chris Wright pledged \"maximum pressure\" sanctions; Trump mused renaming the strait \"Trump Strait\".","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/Iran%20targets%20US%20bases%20in%20Kuwait%20despite%20warnings%20from%20Trump.pdf"},{"id":"scmp-15","title":"Mexican foreign minister to meet Wang Yi in China as US demands trade ties rollback","source":"SCMP","date":"4 Sep 2026","tags":["Geopolitics","Trade"],"summary":"Mexican Foreign Affairs Secretary Roberto Velasco arrives in China on Sunday for his first official visit, as Mexico navigates US pressure to roll back Chinese trade ties. The two-day trip comes at the invitation of Foreign Minister Wang Yi; Velasco will meet Wang in Beijing then inaugurate Mexico's new Chongqing consulate. Beijing said it expects the visit to deepen political trust and promote steady growth of ties. Velasco faces a delicate balance, with the US pressuring Mexico to mirror its barriers against Chinese steel and aluminium amid the USMCA review. Chinese firms including BYD have expanded in Mexico under nearshoring, prompting US concerns about transshipment. Mexico is weighing anti-dumping measures and already imposed tariffs up to 50 per cent on 1,400 products.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/Mexican%20foreign%20minister%20to%20meet%20Wang%20Yi%20in%20China%20as%20US%20demands%20trade%20ties%20rollback.pdf"},{"id":"scmp-16","title":"Moonshot AI – creator of Kimi K3 model – has filed for Hong Kong IPO: sources","source":"SCMP","date":"4 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Chinese AI start-up Moonshot AI, developer of the Kimi K3 model, has confidentially filed for a Hong Kong IPO, according to two people familiar with the matter, as it seeks public funds for rapid expansion. The Beijing-based company targets a listing as early as the first quarter of 2027, subject to regulatory approvals and market conditions, and is pursuing a final pre-IPO financing round that could value it around US$50 billion. Moonshot declined to comment on rumours. Its Kimi K3, released in July, is the world's largest open-weight model with over 2.8 trillion parameters, approaching leading proprietary systems while keeping a price edge. It ranks as the top Chinese model on the Artificial Analysis Intelligence Index alongside Z.ai's GLM-5.3.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/Moonshot%20AI%20-%20creator%20of%20Kimi%20K3%20model%20-%20has%20filed%20for%20Hong%20Kong%20IPO%20sources.pdf"},{"id":"scmp-17","title":"Norway seizes Russian ship over US$4.2 billion claim by Ukrainian energy firm","source":"SCMP","date":"4 Sep 2026","tags":["Geopolitics","Energy"],"summary":"Norway seized a Russian ship in the Arctic to enforce a US$4.22 billion compensation claim won by Ukrainian energy firm Naftogaz over Moscow's seizure of its assets when Russia annexed Crimea in 2014, officials said late Wednesday. The vessel, the Professor Molchanov, was seized off Svalbard, according to Covington, the US law firm representing Naftogaz. Russia's foreign ministry called the action \"piracy\", lodged a formal protest and demanded the vessel's release. The Svalbard governor's office confirmed the ship would be held, and would care for crew and passengers with Trust Arktikugol. The ship had arrived Tuesday in Barentsburg carrying Russian scientists. Svalbard, Norwegian territory since 1925, is governed under a 1920 treaty allowing signatory citizens, including Russians, to settle visa-free.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/Norway%20seizes%20Russian%20ship%20over%20US4.2%20billion%20claim%20by%20Ukrainian%20energy%20firm.pdf"},{"id":"scmp-18","title":"Tech race flashpoint: Huang, Musk push back on AI guard rails amid heated US-China rivalry","source":"SCMP","date":"4 Sep 2026","tags":["Technology & AI","Geopolitics"],"summary":"US tech leaders including Nvidia CEO Jensen Huang and Tesla's Elon Musk are pressing global powers to curb AI regulations, warning strict guard rails could suffocate innovation amid an intensifying US-China technological arms race. Speaking at a G20 meeting in Chapel Hill, North Carolina, alongside Commerce Secretary Howard Lutnick, Huang urged regulations targeting \"actual and pragmatic harm\" rather than \"hypothetical theoretical harm\", warning the worst outcome is being left behind. Musk said countries should create an environment \"relatively free of regulation\" where new technologies are \"default legal\", singling out the EU as overly restrictive. Meta CEO Mark Zuckerberg cautioned against restricting open-source AI, arguing wide distribution aids safety. The comments come as Washington eases rules for home-grown developers, drawing rebukes from Beijing.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/Tech%20race%20flashpoint%20Huang,%20Musk%20push%20back%20on%20AI%20guard%20rails%20amid%20heated%20US-China%20rivalry.pdf"},{"id":"scmp-19","title":"Trump calls Xi's Washington visit 'exciting', but claims US leads China in AI race","source":"SCMP","date":"4 Sep 2026","tags":["Geopolitics","Technology & AI"],"summary":"President Donald Trump claimed on Wednesday the US holds a substantial lead over China in AI and said he was thrilled about President Xi Jinping's Washington visit later this month. \"We're leading China in AI very substantially,\" Trump told reporters, adding Xi arrives on the 24th with \"a lot of good things to discuss\". The bravado comes amid rising inflation and oil prices, the ongoing Iran war and low polling ahead of November midterms. Analysts expect few deliverables; AEI's Zack Cooper said \"there's not going to be much\". Treasury Secretary Scott Bessent criticised China for not signing the G20 communique. Trump touted a claimed US$20 trillion of inbound investment, though analysts say figures are hard to verify, amid a new trade war with Canada.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/Trump%20calls%20Xi's%20Washington%20visit%20'exciting',%20but%20claims%20US%20leads%20China%20in%20AI%20race.pdf"},{"id":"scmp-20","title":"US export curbs have reshaped China's tech scene around 'chokepoints': report","source":"SCMP","date":"4 Sep 2026","tags":["Technology & AI","Trade"],"summary":"Years of US export controls have reshaped China's pipeline of stock market hopefuls, concentrating them in areas where Beijing seeks to break reliance on foreign technology, a Morgan Stanley report found. About 20 per cent of companies launching IPOs on Shanghai's Star Market this year address key technological \"chokepoints\", up from 8.1 per cent in 2022, based on analysis of 229 IPOs between 2022 and mid-July 2026. Around 60 per cent of 2026 firms contributed to supply chain self-sufficiency, up from 41 per cent four years ago. Of 21 chokepoint firms this year, 19 are in the semiconductor supply chain, with 15 in electronics. Bottlenecks have narrowed and moved upstream to raw materials, machinery and core manufacturing tools since Washington's controls began in 2022.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/US%20export%20curbs%20have%20reshaped%20China's%20tech%20scene%20around%20'chokepoints'%20report.pdf"},{"id":"scmp-21","title":"US looks to warship designs from Japan, South Korea and Turkey, reports say","source":"SCMP","date":"4 Sep 2026","tags":["Defence","Geopolitics"],"summary":"Washington is considering using Japanese, South Korean or Turkish frigate designs to expand its naval fleet as the US shipbuilding industry struggles to meet demand, according to US media reports. The move follows a National Security Presidential Memorandum Trump signed on August 13 calling for foreign shipbuilding capacity and investment, though the plan is likely to face strong congressional opposition. Potential contenders for the Navy's new guided-missile frigate include Japan's Mogami-class, South Korea's Chungnam-class and Turkey's Istanbul-class, USNI News reported. Cooperation could follow the \"Finland model\", with foreign shipbuilders constructing the first two hulls and investing in US facilities before production transfers to American shipyards. It would be the first US purchase of a major surface combatant from a foreign partner since World War II.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/US%20looks%20to%20warship%20designs%20from%20Japan,%20South%20Korea%20and%20Turkey,%20reports%20say.pdf"},{"id":"scmp-22","title":"US military's cyber unit plan threatens South Korea's diplomatic balancing act","source":"SCMP","date":"4 Sep 2026","tags":["Defence","Geopolitics"],"summary":"A potential US deployment of an army specialist unit capable of integrated operations across domains, including cyberspace, to South Korea could further reorient the US military's peninsula role from deterring North Korea towards containing China, analysts say. Reports say the Pentagon is considering moving elements of the Second Multi-Domain Task Force from Germany to South Korea, affecting the 28,500-strong US Forces Korea. Hundreds of troops from the MDTF's Multi-Domain Effects Battalion, handling cyber, information and space operations, could be deployed. Seoul's defence ministry declined to comment. The MDTF was developed partly to counter anti-access/area-denial capabilities of China and Russia. Washington reportedly aims to complete deployment this year, part of a broader restructuring including a new Western Hemisphere Command.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/US%20military's%20cyber%20unit%20plan%20threatens%20South%20Korea's%20diplomatic%20balancing%20act.pdf"},{"id":"scmp-23","title":"US urged to consider military strikes to stop China achieving AGI first","source":"SCMP","date":"4 Sep 2026","tags":["Technology & AI","Defence","Geopolitics"],"summary":"The US should prepare for scenarios requiring extreme measures to stop China from achieving artificial general intelligence, including state-backed espionage and military strikes on Chinese data centres, according to former White House official Jacob Stokes of the Centre for a New American Security. Speaking at an online event on Thursday, Stokes said agencies including the Defense Department and NSA should assess what intelligence would justify such actions. In a CNAS report titled \"Superpowers and AGI\", the former Obama national security staffer called for considering diplomatic, espionage, cyber and kinetic measures, including preventive strikes. The US currently holds a months-long lead over China in frontier AI per Epoch AI, but Beijing could make a surprise breakthrough via robotics and embodied AI.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/US%20urged%20to%20consider%20military%20strikes%20to%20stop%20China%20achieving%20AGI%20first.pdf"},{"id":"scmp-24","title":"US$1.6 billion levy complicates sale of Singapore land by Malaysian king's son","source":"SCMP","date":"4 Sep 2026","tags":["Southeast Asia","Finance & Markets"],"summary":"A plan by a Malaysian royal to sell a tract of land in central Singapore faces a tax bill that may exceed US$1 billion. A land betterment charge has become a sticking point in negotiations between prospective buyers and the owner, Tunku Ismail Ibrahim, eldest son of Malaysia's billionaire king, who wants any buyer to foot the bill, people familiar said. The tax, imposed when planning approvals raise land value, may run north of S$2 billion (US$1.6 billion) per three local analysts. Ismail is selling 16.6 hectares (41 acres), including a plot from a 2025 land swap with Singapore's government near the Botanic Gardens. In March, the Urban Redevelopment Authority said he applied to develop the land for residential use, proposing rezoning for good class bungalows.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/US1.6%20billion%20levy%20complicates%20sale%20of%20Singapore%20land%20by%20Malaysian%20king's%20son.pdf"},{"id":"scmp-25","title":"Xi Jinping's call for Mideast to build own security framework is a message to US: expert","source":"SCMP","date":"4 Sep 2026","tags":["Geopolitics"],"summary":"Chinese President Xi Jinping urged Middle Eastern nations to build a self-led security model, nudging them to cut reliance on Washington following further US-Iran military clashes, but did not position Beijing as an alternative security guarantor. On his first Egypt visit in a decade, Xi made the proposal during talks with President Abdel-Fattah el-Sisi in Cairo on Wednesday. Beijing and Cairo aligned on Gaza, Red Sea security and Sudan, and China gave greater weight to Egypt's concerns over an Ethiopian megadam on the Nile. \"The people of the Middle East should be masters of their own affairs,\" Xi said, opposing outside interference. El-Sisi praised China's \"objective and impartial position\". Analyst John Calabrese said Xi's \"common security\" emphasis carried a message about Washington's role.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20SCMP/Xi%20Jinping's%20call%20for%20Mideast%20to%20build%20own%20security%20framework%20is%20a%20message%20to%20US%20expert.pdf"}]},"2026-09-07":{"date":"2026-09-07","dayOfWeek":"Monday","totalArticles":90,"sourceCounts":{"WSJ":23,"ST":17,"BT":21,"SCMP":29},"executiveDigest":"A strong US jobs report - 162,000 added - sent Treasury yields jumping and lifted rate-hike odds, bouncing the dollar before it pared gains ahead of this week's CPI, even as Trump 'threatened to cut trade if the Fed doesn't lower rates' and record fuel prices dogged him. OPEC held output steady, oil ended the week higher and diesel hit a record. The Iran squeeze turned: WSJ said 'time is no longer on Iran's side' as its Hormuz leverage waned and Tehran raised petrol prices. For Singapore, experts said the EU's landmark AI rules offer a 'blueprint to rein in AI harms', Shanmugam insisted Temasek and its firms make commercial decisions 'without politicisation', and property watchers warned Q4 launches will test homebuying - 'no longer a rising tide'.","briefingCards":[{"title":"Lead story - Strong US jobs jolt yields as Iran squeeze bites","body":"A robust payrolls print reset the rates picture: WSJ reported 'a strong US jobs report boosted rate-hike odds and Treasury yields jumped', with the economy 'adding 162,000 jobs' as a labour-market bright spot, and 'the dollar bounced on the jobs data then pared gains ahead of CPI'. The politics turned sharp - 'Trump threatened to cut trade if the Fed doesn't lower rates' - while 'record fuel prices' complicated his standing. On the war, the balance shifted against Tehran: WSJ said 'time is no longer on Iran's side' in the battle of blockades, ST reported 'Iran's Hormuz leverage wanes as the squeeze bites', and Iran 'raised petrol prices' and warned of a 'prohibited zone' near the strait, threatening a 'more painful' response as Lloyd's flagged a £1.4 billion loss from the conflict."},{"title":"Markets & finance","body":"Rates and energy drove the tape: the jobs beat lifted yields and the dollar before CPI, and the ECB 'is expected to raise rates next week'. Oil ended the week higher after OPEC 'kept output steady', with 'diesel hitting a record' and record pump prices in focus. Big capital kept flowing to AI and compute - Nvidia and Hugging Face anchored a US$13 billion founders' round, 'Anthropic is targeting an IPO in mid-October', and 'Nscale raised US$3.5 billion in a pre-IPO round' - while 'PC prices are set to rise 20% on a memory shortage'. Pimco 'cut its Magnificent Seven bets in favour of Asia', and China unveiled a 'US$54 billion package for banks and insurers'. Chinese banks were 'buying up Treasuries', and 'he's letting AI agents invest' captured the retail mood."},{"title":"Asia realignment","body":"Great-power diplomacy thawed at the edges even as rivalry ran deep: 'US-China military commanders resumed talks in Canada', 'China and Canada restarted military dialogue after eight years', and Trump 'will host Xi for a state dinner' with 'mid-September AI safety talks' planned - the US having 'used Nvidia chips to help broker an Armenia-Azerbaijan peace'. Trade chief Greer 'sounded optimistic' on China. But hard security persisted: 'the Singapore navy began a maritime exercise with China', North Korea's Kim 'unveiled a nuclear-capable destroyer', NATO braced for 'hybrid' threats, and Germany's Merz wrestled a 'far-right dilemma', an 'anti-sabotage shield' and explosives found at substations. Trump's envoys pushed a Ukraine peace track as Zelensky warned 'the war may run into winter'."},{"title":"Energy & climate","body":"The oil story tilted Tehran's way and toward records: OPEC 'kept output steady' into October, crude 'ended the week higher', 'diesel hit a record' and pump prices set records that pressured Trump. Crucially, Iran's coercive edge dulled - WSJ argued 'time is no longer on Iran's side' as the blockade cut both ways, ST said its 'Hormuz leverage wanes as the squeeze bites', and Tehran 'raised petrol prices' while declaring a 'prohibited zone' near the strait and threatening a 'more painful' response. Insurers counted the cost, with 'Lloyd's flagging a £1.4 billion loss from the US-Iran war'. On the tech-energy nexus, WSJ examined 'how to build AI data centres people won't hate' as compute demand reshaped power planning."},{"title":"Technology & AI","body":"AI capital, compute and geopolitics fused: Nvidia and Hugging Face anchored a US$13 billion founders' round, 'Anthropic is eyeing a mid-October IPO', 'Nscale raised US$3.5 billion pre-IPO', and 'a memory shortage will push PC prices up 20%' (Apple's next iPhone tipped as 'its most expensive yet'). China pressed self-reliance: 'Huawei unveiled a Tau scaling-law chip and Kirin 2026', 'China's AI giants stretched their compute', and analysts weighed 'token economics favouring Chinese models', even as 'a 33-year-old AI hotshot headed to Beijing'. Governance advanced - 'US-China AI safety talks are set for mid-September', and Singapore-relevant experts said the EU's rules offer a template. Oddities abounded: 'a robot guide dog', 'OpenAI's German-Wikipedia misuse', and a healthcare-AI cost debate."},{"title":"Singapore & SEA focus","body":"Singapore threaded governance, markets and property: experts told ST 'the EU's landmark AI rules give Singapore a blueprint to rein in AI harms', and Shanmugam said 'Temasek and its portfolio companies must make commercial decisions without fear of politicisation'. Defence and diplomacy featured as 'the Singapore navy began a maritime exercise with China'. On housing, watchers warned 'it's no longer a rising tide' - 'Q4 launches will test homebuying' sentiment - while professional services expanded abroad, with 'Singapore lawyers and accountants following clients to Jakarta'. Regionally, the AI-compute build-out and China's US$54 billion bank package framed capital flows, and Pimco's tilt 'toward Asia' underscored the region's pull even as Mag-7 exposure was trimmed."}],"keyMetrics":[{"value":"90","label":"Articles curated today","sub":"WSJ 23 · ST 17 · BT 21 · SCMP 29"},{"value":"+162,000","label":"US jobs added","sub":"Yields jump; rate-hike odds up"},{"value":"Leverage wanes","label":"Iran's Hormuz squeeze","sub":"'Time no longer on Iran's side'"},{"value":"US$54b","label":"China bank/insurer package","sub":"Support for lenders"},{"value":"+20%","label":"PC prices to rise","sub":"On a memory shortage"},{"value":"No politicisation","label":"Temasek (Shanmugam)","sub":"Commercial decisions to stand"}],"articles":[{"id":"wsj-01","title":"After Far-Right Election Breakthrough, Germany's Merz Faces Painful Dilemma","source":"WSJ","date":"7 Sep 2026","tags":["Politics","Geopolitics"],"summary":"Germany's Alternative for Germany won about 44% in Sunday's Saxony-Anhalt regional election, more than double the CDU, but fell just short of the majority needed to form the country's first far-right government since World War II. The result confronts Chancellor Friedrich Merz with a stark choice: uphold the decades-old \"firewall\" barring cooperation with the AfD, risking a party rebellion, or let CDU state lawmakers deal with the AfD, likely fracturing his coalition with the Social Democrats. The far-left BSW called for ending the firewall. An AfD state government would gain control over police and domestic intelligence, which surveils the party as extremist, alarming security officials given the AfD's pro-Russia stance.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20WSJ/After%20Far-Right%20Election%20Breakthrough,%20Germany%E2%80%99s%20Merz%20Faces%20Painful%20Dilemma.pdf"},{"id":"wsj-02","title":"BOE Survey Points to Cooling Price Pressures","source":"WSJ","date":"7 Sep 2026","tags":["Finance & Markets"],"summary":"A Bank of England survey of 2,012 chief financial officers, conducted August 7-21, found U.K. businesses expect to raise prices 3.8% over the coming 12 months, down from 3.9% expected in July. Firms reported their prices rose 3.7% in the year to August. The signs of slowing planned price increases suggest the jump in energy costs since the U.S.-Iran war began, now in its seventh month, has yet to trigger broader inflation. The BOE's rate setters, meeting later this month, are expected to hold the key rate at 3.75%. Businesses expect wages to rise 3.4% over the next year, unchanged from July, though actual wage growth of 4% points to cooling pay.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20WSJ/BOE%20Survey%20Points%20to%20Cooling%20Price%20Pressures.pdf"},{"id":"wsj-03","title":"Carmakers Have a New Idea to Boost EV Range: Add a Gas Engine","source":"WSJ","date":"7 Sep 2026","tags":["Energy","Society"],"summary":"Automakers are turning to extended-range electric vehicles (EREVs) to ease Americans' fears of running out of charge. Stellantis plans to launch the trend with its Jeep Grand Wagoneer and Ram 1500 REV, which pairs a large battery with a gas V-6 generator promising up to 690 miles. Hyundai, Genesis and Ford are following. EREVs are designed as EVs, with the engine acting solely as a generator, cutting battery costs and enabling towing. EV sales have slumped since the Trump administration removed the $7,500 incentive and rolled back regulations. Skeptics warn the middle-ground technology adds complexity; earlier plug-in hybrids never exceeded 1-2% of the U.S. market, and EREVs will likely cost more than comparable gas vehicles.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20WSJ/Carmakers%20Have%20a%20New%20Idea%20to%20Boost%20EV%20Range%20Add%20a%20Gas%20Engine.pdf"},{"id":"wsj-04","title":"DOJ Staff Were Told to Pause Antitrust Work With Canadian Government","source":"WSJ","date":"7 Sep 2026","tags":["Trade","Politics"],"summary":"The Justice Department's antitrust division was instructed this week to pause all work with the Canadian government, according to emails reviewed by the Journal, amid an escalating trade dispute. In a Wednesday email titled \"Pause on Canada,\" international section chief Lynda Marshall ordered officials to stop cooperation on cases and policy. After the article published, DOJ said the official had misunderstood a directive to reschedule a meeting, and Marshall said cooperation could continue. The two countries have longstanding antitrust cooperation agreements. Trade tensions intensified after talks broke down: the Trump administration imposed 50% tariffs on $20 billion of Canadian goods, prompting Prime Minister Mark Carney to retaliate. Trump signed an order renaming Lake Ontario \"Lake America.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20WSJ/DOJ%20Staff%20Were%20Told%20to%20Pause%20Antitrust%20Work%20With%20Canadian%20Government.pdf"},{"id":"wsj-05","title":"Eurozone Retail Sales Fall 0.6% While German Factory Orders Climb","source":"WSJ","date":"7 Sep 2026","tags":["Finance & Markets"],"summary":"Eurozone retail sales fell 0.6% in July, the largest monthly decline in over a year, against expectations of a 0.3% rise, as high energy prices from the Iran war weighed on consumers. Germany was hit hardest, down 3.4%. Yet German manufacturing orders climbed 2.5% in July, a third straight monthly gain and 13.1% above a year earlier, driven largely by transport equipment. Analysts note stockpiling amid the Strait of Hormuz closure may be propping up industry, with intermediate goods orders up 4.3% while consumer products fell 4.8%. Eurozone inflation hit a near-three-year high in August. The ECB is expected to raise its key rate next week. The Ifo Institute raised its 2026 growth forecast.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20WSJ/Eurozone%20Retail%20Sales%20Fall%200.6%25%20While%20German%20Factory%20Orders%20Climb.pdf"},{"id":"wsj-06","title":"He's Letting AI Agents Invest His Money. They Even Have Names.","source":"WSJ","date":"7 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Everyday investors are handing control of stock portfolios to AI agents. Colin Edsman, a hairstylist and stay-at-home dad, runs a team of named Claude agents from his kitchen table that scan markets, check positions and report performance, outperforming his own accounts. Brokerages including Robinhood, Webull and Moomoo have launched features letting agents like Claude and Codex buy and sell autonomously. Moomoo's U.S. chief estimates 20% of trading volume could be agent-executed by year-end. Enthusiasts cite emotion-free, superhuman analysis and impressive returns; one investor grew a $3,000 account to $8,000. Skeptics, including a former quant, warn AI recommends concentrated, high-valuation portfolios, could amplify herd behavior and create volatility, echoing the 2007 \"quant meltdown.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20WSJ/He%E2%80%99s%20Letting%20AI%20Agents%20Invest%20His%20Money.%20They%20Even%20Have%20Names..pdf"},{"id":"wsj-07","title":"How to Build AI Data Centers People Won't Hate","source":"WSJ","date":"7 Sep 2026","tags":["Technology & AI","Energy","Environment"],"summary":"Community pushback over noise, pollution, water use, secrecy and rising utility rates is stalling AI data-center construction: at least 15 states have weighed moratoriums and 100 localities approved them, per Brookings. Christopher Mims outlines fixes drawn from industry experts: greater transparency (Microsoft dropped nondisclosure agreements), mitigating rate hikes, and cleaner power. Meta pledged to lower local energy bills; OpenAI committed $80 million to community projects in Effingham County, Georgia. Companies increasingly build their own gas plants, but some explore geothermal, nuclear and Bloom Energy fuel cells, as Oracle did in New Mexico. Google's Hamina, Finland site, cooled by seawater and heating the town, is cited as a benchmark. Speed, experts warn, comes at a cost.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20WSJ/How%20to%20Build%20AI%20Data%20Centers%20People%20Won%E2%80%99t%20Hate.pdf"},{"id":"wsj-08","title":"Japan Finance Minister Vows to Keep Eye on Fiscal Balance","source":"WSJ","date":"7 Sep 2026","tags":["Finance & Markets"],"summary":"Japanese Finance Minister Satsuki Katayama said Japan will balance fiscal sustainability and growth, even as ministries submitted record budget requests of 143 trillion yen ($917.85 billion). She said the sum aligns with Prime Minister Sanae Takaichi's push to reduce reliance on supplementary budgets and disputed characterizing it as a significant increase. Fiscal concerns have driven up government bond yields, with the 10-year JGB yield recently hitting 3%, the highest since September 1996, and weighed on the yen, though the currency is recovering after historic Japan-U.S. intervention backed by Treasury Secretary Scott Bessent. Katayama pushed back on speculation that Bessent pressured Japan to raise rates. The yen last traded at 156.05 per dollar.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20WSJ/Japan%20Finance%20Minister%20Vows%20to%20Keep%20Eye%20on%20Fiscal%20Balance.pdf"},{"id":"wsj-09","title":"OPEC, Allies Agree to Keep Oil Output Steady in October","source":"WSJ","date":"7 Sep 2026","tags":["Energy","Geopolitics"],"summary":"Key OPEC+ members agreed to hold oil production steady in October after six straight monthly increases, shifting focus to 2027 quotas. Brent crude ended above $96 a barrel Friday as the U.S. and Iran exchanged strikes for the first time in about a month. Seven members had agreed to raise September output by 188,000 barrels a day, completing the unwinding of 1.65 million barrels a day of voluntary cuts from 2023. OPEC cut its 2026 demand-growth forecast to 580,000 barrels a day amid the Hormuz closure. The U.S.-Iran war has entered its seventh month; the U.S. struck three Iranian tankers after Iran fired missiles at Navy warships. The group meets again October 4.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20WSJ/OPEC,%20Allies%20Agree%20to%20Keep%20Oil%20Output%20Steady%20in%20October.pdf"},{"id":"wsj-10","title":"PC Prices Projected to Rise 20% This Year Due to Memory Chip Shortage","source":"WSJ","date":"7 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"PC makers are selling fewer computers at far higher prices, driven by a memory-chip shortage stemming from the massive AI infrastructure buildout. Worldwide PC shipments fell 4.9% in the second quarter, and IDC projects prices will rise 20% this year and keep climbing modestly in 2027 as shipments fall. Manufacturers offset lower volumes with higher pricing: HP's personal systems revenue rose 18% even as units fell 16%, and Dell's client group posted a 20% revenue gain. Companies are prioritizing premium AI PCs, which carry better margins; the commercial market is about 75% of volume. IDC's Jitesh Ubrani doesn't expect the shortage to ease until at least 2028, advising: \"The best time to buy a PC was yesterday.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20WSJ/PC%20Prices%20Projected%20to%20Rise%2020%25%20This%20Year%20Due%20to%20Memory%20Chip%20Shortage.pdf"},{"id":"wsj-11","title":"Record Fuel Prices Pose Fresh Challenge for Trump Ahead of Midterms","source":"WSJ","date":"7 Sep 2026","tags":["Energy","Politics"],"summary":"President Trump, who pledged to lower energy prices, is presiding over record fuel costs. Diesel hit an average $5.85 a gallon Friday, surpassing the 2022 peak, while gasoline reached about $4.15, nearly 95 cents above last year. Rising diesel threatens to feed inflation, as trucks, trains and farmers depend on it; food giants J.M. Smucker and Campbell's cited higher logistics costs. The monthslong Strait of Hormuz closure, Iranian strikes on Middle East plants, and Ukrainian drone attacks on Russian refineries have taken roughly 5 million barrels of refining capacity offline, while heavy U.S. diesel exports push domestic prices higher. Diesel has soared 56% since the war began. The White House ruled out export restrictions.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20WSJ/Record%20Fuel%20Prices%20Pose%20Fresh%20Challenge%20for%20Trump%20Ahead%20of%20Midterms.pdf"},{"id":"wsj-12","title":"The 33-Year-Old AI Hotshot Taking Silicon Valley Swagger Back to Beijing","source":"WSJ","date":"7 Sep 2026","tags":["Technology & AI","Geopolitics"],"summary":"Yang Zhilin, 33, is co-founder and CEO of Moonshot AI, one of China's top AI labs, whose latest funding round values it at $50 billion and which confidentially filed for a Hong Kong IPO. Trained at Tsinghua and Carnegie Mellon under Ruslan Salakhutdinov, Yang chose to return to China despite Apple's interest. He infuses the Beijing startup with Western flair, eschewing hierarchy and naming rooms after rock bands. Moonshot's open-weight Kimi models, including July's Kimi K3, rival U.S. models at a fraction of the cost, threatening the valuations of Anthropic and OpenAI ahead of their listings. Some officials have suggested banning such Chinese models, alleging they use \"distillation\" of U.S. model outputs to train.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20WSJ/The%2033-Year-Old%20AI%20Hotshot%20Taking%20Silicon%20Valley%20Swagger%20Back%20to%20Beijing.pdf"},{"id":"wsj-13","title":"The Teamsters Return to Ugly Type","source":"WSJ","date":"7 Sep 2026","tags":["Society","Politics"],"summary":"A Wall Street Journal editorial criticizes the Teamsters after their campaign to organize Amazon workers led to a bloody confrontation in Riverside, California. Following a familiar playbook, the union claimed workers signed support cards, demanded Amazon bargain without a secret-ballot election, then launched a one-day \"unfair labor practice strike\" blocking a facility, staffed mostly by non-Amazon organizers. Video showed Teamsters beating a motorcyclist who tried to bypass the blockade; three people were hospitalized. The board argues Amazon has no legal obligation to bargain without an election. The union cites the Biden NLRB's 2023 Cemex decision, but the editorial urges the Trump NLRB, now with a 3-1 Republican majority, to reverse Cemex and police union thuggery.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20WSJ/The%20Teamsters%20Return%20to%20Ugly%20Type.pdf"},{"id":"wsj-14","title":"The 'Deeply Nerdy' Hugging Face Founders Behind Nvidia's $13 Billion AI Bet","source":"WSJ","date":"7 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Nvidia agreed Thursday to buy Hugging Face for roughly $13 billion, deepening its push to challenge proprietary AI models from OpenAI and Anthropic by backing the ecosystem for open-weight tools. Founders Clement Delangue, Julien Chaumond and Thomas Wolf, French \"deeply nerdy\" technologists, started in 2016 at Betaworks' New York program building a sassy teen chatbot named after their favorite emoji, seven years before ChatGPT. The platform now hosts 18 million developers. Delangue said he approached Nvidia over the summer to preserve access to open-weight models. Wolf noted the exact price, $12,930,300,000, hid \"nerdy meanings\": the first six digits translate to 1F917 in hexadecimal, the Unicode code for the hugging-face emoji.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20WSJ/The%20%E2%80%98Deeply%20Nerdy%E2%80%99%20Hugging%20Face%20Founders%20Behind%20Nvidia%E2%80%99s%20%2413%20Billion%20AI%20Bet.pdf"},{"id":"wsj-15","title":"Time Is No Longer on Iran's Side in the Battle of the Blockades","source":"WSJ","date":"7 Sep 2026","tags":["Geopolitics","Energy"],"summary":"Six months into the U.S.-Iran conflict over the Strait of Hormuz, the trend is turning against Tehran. The U.S. naval blockade has prevented Iran from shipping Persian Gulf oil since July, while Washington has helped Gulf Arab states move significant crude, keeping prices below $100 a barrel. TankerTrackers estimated about 5 million barrels a day still exit the Gulf, over 40% of prewar flows. Iran's shutdown failed to trigger a global crisis or force Trump to end the war, but the U.S. blockade hasn't sparked an uprising or changed Iranian behavior. Analysts say Iran, under severe economic strain with its rial collapsing, may escalate rather than cave, aiming to inflict political pain on Trump before November's midterms.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20WSJ/Time%20Is%20No%20Longer%20on%20Iran%E2%80%99s%20Side%20in%20the%20Battle%20of%20the%20Blockades.pdf"},{"id":"wsj-16","title":"Trump Envoys Visit Ukraine in New Push for Peace Talks","source":"WSJ","date":"7 Sep 2026","tags":["Geopolitics"],"summary":"President Trump's envoys Jared Kushner and Steve Witkoff visited Moscow then Kyiv this weekend to jump-start Russia-Ukraine peace talks, achieving a brief pause in Russia's bombing of Kyiv. Sunday's talks produced no breakthrough, but Ukrainian President Volodymyr Zelensky thanked the pair for restarting mediation and discussed a potential winter aid package including air defense and American LNG. After meeting Putin on Saturday, a White House official said substantive next steps would be announced \"in the coming weeks.\" Russia maintains its demand that Ukraine cede the Donbas; Ukraine refuses territorial concessions and seeks security guarantees. Russia's summer offensive failed, gaining only small patches at roughly 1,000 casualties a day, but analysts expect renewed pressure over winter.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20WSJ/Trump%20Envoys%20Visit%20Ukraine%20in%20New%20Push%20for%20Peace%20Talks.pdf"},{"id":"wsj-17","title":"U.S. Adds a Whopping 162,000 Jobs in a Bright Spot for the Economy","source":"WSJ","date":"7 Sep 2026","tags":["Finance & Markets"],"summary":"The U.S. added 162,000 jobs in August, the Labor Department reported, far above the 53,000 economists forecast, and the unemployment rate held steady at 4.1%. The result dispelled fears of renewed cooling after weak June and July hiring, both of which were revised higher. Gains were broad-based, led by food services (59,000) and local-government education (42,000), while information and finance shed jobs. Average hourly earnings rose 3.1% from a year earlier, lagging 3.4% inflation, capping consumer spending. The strong report removed an objection to a Fed rate hike this month; investors raised rate-hike bets and stocks fell. Trump urged the Fed to cut rates. The consumer inflation report comes next Friday.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20WSJ/U.S.%20Adds%20a%20Whopping%20162,000%20Jobs%20in%20a%20Bright%20Spot%20for%20the%20Economy.pdf"},{"id":"wsj-18","title":"U.S. Treasury Yields Jump After Strong Jobs Report Boosts Interest Rate Hike Odds","source":"WSJ","date":"7 Sep 2026","tags":["Finance & Markets"],"summary":"U.S. Treasury yields jumped after August employment data came in far stronger than expected, lifting odds of a Federal Reserve rate hike at the September 16 meeting. The economy created 162,000 jobs, roughly three times the 53,000 forecast, with July revised upward. Money-market expectations of a hike this month surged to 61% from 50% before the release, per LSEG. Yields, which had been dropping, reversed sharply: the 30-year last at 5.258%, the 10-year at 4.802%, the two-year at 4.412%. Analysts said next week's inflation data is the next hurdle, referencing Fed Chairman Kevin Warsh's Jackson Hole speech. Norway's $2.4 trillion sovereign-wealth fund proposed cutting its government-debt weighting to 50% from 70%.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20WSJ/U.S.%20Treasury%20Yields%20Jump%20After%20Strong%20Jobs%20Report%20Boosts%20Interest%20Rate%20Hike%20Odds.pdf"},{"id":"wsj-19","title":"U.S. Used Promise of Nvidia Chips to Broker Armenia-Azerbaijan Peace Deal","source":"WSJ","date":"7 Sep 2026","tags":["Geopolitics","Technology & AI"],"summary":"U.S. negotiators used the promise of access to Nvidia AI chips to help secure a preliminary peace deal between Armenia and Azerbaijan, people involved said, in a striking case of \"chip diplomacy.\" Expanded approvals for an Armenian data-center project, called Firebird, were offered as an inducement. The $5 billion Hrazdan project, near the Azerbaijan border, plans to house 70,000 Nvidia servers, about 300 megawatts, by end of next year. After the August agreement was reached, U.S. officials approved tens of thousands of leading-edge GB300 processors. The deal is part of a broader U.S. push, including the \"Trump Route\" transport corridor, to build economic interdependence and durable peace after a decadeslong conflict over Nagorno-Karabakh.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20WSJ/U.S.%20Used%20Promise%20of%20Nvidia%20Chips%20to%20Broker%20Armenia-Azerbaijan%20Peace%20Deal.pdf"},{"id":"wsj-20","title":"Ukraine's Next Goal Is to Shut Down Russia's Commercial Airspace","source":"WSJ","date":"7 Sep 2026","tags":["Geopolitics","Defence"],"summary":"Ukraine plans to intensify drone activity near Russian airports to force their closure and pressure Moscow's economy, warning airlines and insurers that Russian airspace \"is becoming completely unsafe.\" The scaled-up \"Operation Carpet\" aims to turn increasingly common temporary closures into a full shutdown. In August, about 16,000 Ukrainian drones crossed into airspace Russia keeps open to civilian aircraft, forcing daily temporary closures of 32 airports on average. Kyiv vows to avoid targeting airliners, but experts warn of rising risks from Russian air defenses and GPS spoofing. Some carriers, including El Al, Pegasus and Flydubai, have cut Russia flights. Putin called Zelensky's warning a \"declaration of terrorism.\" Two civilian airliners have already been downed during the war.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20WSJ/Ukraine%E2%80%99s%20Next%20Goal%20Is%20to%20Shut%20Down%20Russia%E2%80%99s%20Commercial%20Airspace.pdf"},{"id":"wsj-21","title":"Week Ahead for FX, Bonds: U.S. Inflation Data in Focus; ECB Expected to Raise Rates","source":"WSJ","date":"7 Sep 2026","tags":["Finance & Markets"],"summary":"The coming week centers on U.S. August inflation data as investors gauge whether the Federal Reserve could raise rates at its September 16 meeting, following much stronger-than-expected jobs data. Money markets priced a 59% chance of a 25-basis-point hike this month, fully pricing December. CPI is due Friday, PPI Thursday, with Fed Chairman Kevin Warsh stressing the need to lower inflation. The ECB decision is the eurozone's key event, with a 25-basis-point hike widely expected and fully priced. Poland is expected to hold at 3.75%. Other highlights include China trade and inflation data, the BRICS summit in New Delhi, and central-bank decisions in Turkey and Japan, where markets nearly fully price a BOJ hike.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20WSJ/Week%20Ahead%20for%20FX,%20Bonds%20U.S.%20Inflation%20Data%20in%20Focus%3B%20ECB%20Expected%20to%20Raise%20Rates.pdf"},{"id":"wsj-22","title":"Why Big Oil Is Wary of Trump's Foray Into Venezuela's Oil Patch","source":"WSJ","date":"7 Sep 2026","tags":["Energy","Geopolitics"],"summary":"U.S. oil executives are wary of the Trump administration's push into Venezuela, home to some of the world's largest proven reserves. The administration is backing North American Blue Energy Partners, led by Venezuelan businessman Alejandro Betancourt, which now controls one-fifth of Venezuela's reserves and is poised to rival Chevron. Officials frame the deal as a way to police corruption via U.S.-backed audits, but executives fear a state-backed giant with a monopoly over 65 billion barrels, and worry the arrangement won't survive future governments. Secretary of State Marco Rubio called it a \"professionalized operation.\" After the U.S. captured Nicolas Maduro in January, Trump urged firms to invest $100 billion, but most remain on the sidelines.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20WSJ/Why%20Big%20Oil%20Is%20Wary%20of%20Trump%E2%80%99s%20Foray%20Into%20Venezuela%E2%80%99s%20Oil%20Patch.pdf"},{"id":"wsj-23","title":"Why Putin's Friends Are Now Confronting Him Over the War","source":"WSJ","date":"7 Sep 2026","tags":["Geopolitics"],"summary":"Some of Moscow's longtime partners are publicly pressing President Vladimir Putin to end the war in Ukraine, now in its fifth year, as its toll grows. At a Kyrgyzstan summit, Indian Prime Minister Narendra Modi urged Putin \"to move on from an endless war,\" while Kazakhstan's President Kassym-Jomart Tokayev earlier told him the conflict's nature \"isn't entirely clear.\" The war's fallout is spilling over: a Russian missile killed four Indian crew in the Black Sea, and drone strikes disrupted the Caspian Pipeline Consortium that Kazakhstan relies on. India faces U.S. tariffs up to 50% over Russian oil purchases. Analysts say Moscow's waning influence in Central Asia and the South Caucasus, where U.S. investment is rising, emboldens critics.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20WSJ/Why%20Putin%E2%80%99s%20Friends%20Are%20Now%20Confronting%20Him%20Over%20the%20War.pdf"},{"id":"st-01","title":"At flood-destroyed China-Nepal border, no sign of a once-busy port","source":"ST","date":"7 Sep 2026","tags":["Environment","Society"],"summary":"About 20 Chinese rescue workers used excavators, shovels and ground-penetrating radar on Sept 6 to search for hundreds missing after a tsunami-like mudslide destroyed the Gyirong crossing, China's main border with Nepal, following an Aug 26 glacier collapse. Reuters visited on the first foreign-media trip organised by China's foreign ministry; the five-storey customs building had vanished, leaving only a water tower fragment and a Chinese flag where the 20m gate stood. The disaster killed more than 1,300 on both sides with over 5,000 missing; China confirmed 31 dead and 531 missing as of Sept 4, including 261 foreigners from 23 countries, among them 49 Indians, many Hindu pilgrims bound for Mount Kailash. The only land route reopened Sept 2.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20ST/At%20flood-destroyed%20China-Nepal%20border,%20no%20sign%20of%20a%20once-busy%20port.pdf"},{"id":"st-02","title":"Brokered ceasefire comes into effect for repairs at Ukraine's occupied nuclear plant","source":"ST","date":"7 Sep 2026","tags":["Geopolitics","Energy"],"summary":"A local ceasefire brokered by the International Atomic Energy Agency took effect on Sept 5 to allow repairs restoring external power to the Russian-controlled Zaporizhzhia nuclear power plant in south-eastern Ukraine, the IAEA said. Europe's largest nuclear station has been without external power since Aug 20, relying on emergency diesel generators to cool safety systems, and the UN watchdog warned it could face a station blackout within days unless power is restored or fuel delivered. Ukrainian technicians were to begin work on the damaged Ferosplavna line after demining. Rosatom chief Alexei Likhachev said the truce, expected to last about a week, would not guarantee resumed supply, citing Ukrainian inaction on a July 23 repair. Russia seized the plant in 2022.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20ST/Brokered%20ceasefire%20comes%20into%20effect%20for%20repairs%20at%20Ukraine's%20occupied%20nuclear%20plant.pdf"},{"id":"st-03","title":"EU landmark rules for ChatGPT give Singapore the blueprint to rein in AI harms: Experts","source":"ST","date":"7 Sep 2026","tags":["Technology & AI","Society"],"summary":"The European Union's late-August move to bring ChatGPT, Roblox and Reddit under its strictest online-safety rules gives Singapore more evidence to curb potential harms, experts told The Straits Times. EU measures include age checks barring minors from adult content, safer content-recommendation systems, and private-by-default child accounts. SMU's Dirk Hartung said companies would struggle to argue they cannot deploy the same tools locally. Lawyer Ben Chester Cheong cited US precedents, including Meta's settlement adding safeguards on Facebook and Instagram. Singapore is already aligning: it required app stores to block under-18s from unsuitable apps in April, launched the Online Safety Commission in June, and expects age-check enforcement for social media in early 2027. Experts said Singapore will calibrate rather than copy, balancing innovation and safety.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20ST/EU%20landmark%20rules%20for%20ChatGPT%20give%20Singapore%20the%20blueprint%20to%20rein%20in%20AI%20harms%20Experts.pdf"},{"id":"st-04","title":"Explosives found at two more electricity substations in Germany","source":"ST","date":"7 Sep 2026","tags":["Energy","Society"],"summary":"Explosives were found near two electricity substations in Germany, with authorities investigating links to similar attacks earlier in the week, police said on Sept 5. Germany has been rattled by strikes on substations apparently aimed at cutting power from coal-fired stations and causing blackouts, described by authorities as likely \"climate extremism\" after a 48-year-old man, named as Daniel V., sent letters claiming responsibility and suspected explosives were found at his apartment. On Sept 5, regional authorities said 12 improvised explosive devices were discovered near high-voltage lines close to the Baerwalde and Graustein substations; bomb disposal units disabled them. On Sept 4, an elite team stormed a truck in the symbolic Hambach Forest but failed to apprehend the suspect. A January Berlin attack cut power for nearly a week.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20ST/Explosives%20found%20at%20two%20more%20electricity%20substations%20in%20Germany.pdf"},{"id":"st-05","title":"France's far-right chief Jordan Bardella wants Ukraine to pay for Europe's help","source":"ST","date":"7 Sep 2026","tags":["Politics","Geopolitics"],"summary":"Jordan Bardella, president of France's far-right National Rally and likely prime minister if Marine Le Pen wins the 2027 presidential vote, said France's unconditional support for Ukraine should give way to a transactional relationship. Speaking to Bloomberg TV on Sept 5 at Italy's Ambrosetti Forum, the 30-year-old cited France's debt and deficits, praising the US for demanding rare-earth access in return for aid, and suggested European financial support be tied to buying equipment from those states' defence industries. He said France would not abandon Kyiv but that \"everything needs to be reviewed.\" Le Pen once had close ties to Vladimir Putin, cooled since 2022. Aligning with Donald Trump's worldview, Bardella criticised EU tech regulation and touted France's nuclear power and AI startups like Mistral.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20ST/France's%20far-right%20chief%20Jordan%20Bardella%20wants%20Ukraine%20to%20pay%20for%20Europe's%20help.pdf"},{"id":"st-06","title":"Iran raises price of petrol as US applies economic pressure","source":"ST","date":"7 Sep 2026","tags":["Energy","Geopolitics"],"summary":"Iran announced on Sept 6 it would raise petrol prices for heavier consumers as the US steps up sanctions to isolate its economy. Under Iran's three-tier quota system, spokeswoman Fatemeh Mohajerani said the third-tier rate would double to 10,000 tomans per litre (about 5.7 Singapore cents) from Sept 8, while the first two tiers, at 1,500 and 3,000 tomans, stay unchanged. Iran, a major producer with among the world's cheapest, heavily subsidised fuel, finds pricing politically sensitive. The rial traded above 2.2 million to the US dollar on the black market, versus 1.7 million before the Feb 28 war. US Treasury Secretary Scott Bessent has laid out plans for Iran's \"economic asphyxiation,\" building on 2018 sanctions, with a naval blockade aiming to cut oil exports to zero.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20ST/Iran%20raises%20price%20of%20petrol%20as%20US%20applies%20economic%20pressure.pdf"},{"id":"st-07","title":"Iran says it will declare 'prohibited zone' near Hormuz Strait in coming days","source":"ST","date":"7 Sep 2026","tags":["Geopolitics","Defence"],"summary":"Iran's top security chief Mohsen Rezaei said on Sept 6 that Tehran would establish a \"prohibited zone\" near the Strait of Hormuz, starting from the US Navy's blockade line and covering parts of the Persian Gulf, with any ship entering placed on Iran's sanctions list. Parliament speaker and chief negotiator Mohammad Bagher Ghalibaf warned \"the era of proportionate responses has come to an end,\" threatening faster, more painful retaliation. The threats followed an escalation: on Sept 5 US Central Command said Iran unsuccessfully fired at an aircraft carrier and a destroyer, and the US struck three oil tankers linked to the Revolutionary Guards. Iran retaliated against tankers and claimed hitting a US drone, which CENTCOM denied. Trump has threatened to claim sovereignty over the strait.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20ST/Iran%20says%20it%20will%20declare%20'prohibited%20zone'%20near%20Hormuz%20Strait%20in%20coming%20days.pdf"},{"id":"st-08","title":"Iran to tackle economic issues, threatens 'more painful' response to US attacks","source":"ST","date":"7 Sep 2026","tags":["Geopolitics","Energy"],"summary":"Tehran said on Sept 6 it would step up efforts against US sanctions crippling its economy, even as officials warned of a \"more painful response\" to further attacks. Six months after the US and Israel struck Iran, the war is at a stalemate after a June ceasefire unravelled. Tit-for-tat strikes resumed: CENTCOM said it hit three Iranian tankers, M/T Downy, M/T Stark 1 and M/T Kylo, on Sept 5 after the IRGC launched ballistic missiles at two US Navy ships. Parliament speaker Ghalibaf said Iran's main battle is now over production and livelihoods, citing currency swings, inflation and unemployment. Economy Minister Ali Madanizadeh vowed reforms, rejecting that sanctions would change Iran's course. Kharg Island, hit some 550 times, still operates.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20ST/Iran%20to%20tackle%20economic%20issues,%20threatens%20'more%20painful'%20response%20to%20US%20attacks.pdf"},{"id":"st-09","title":"Iran's Hormuz leverage wanes as US economic squeeze bites","source":"ST","date":"7 Sep 2026","tags":["Geopolitics","Energy"],"summary":"Six months after the conflict, the tide may be turning against Iran as Washington's unprecedented economic offensive achieves what force could not, Iranian insiders and regional sources said. A US naval blockade and tougher sanctions are curbing oil exports, restricting foreign-currency access and straining the economy. US and regional officials wager mounting pressure can force Tehran to allow free passage through Hormuz, which carries about a fifth of global oil and LNG. Analyst Arash Azizi said Iran is losing leverage because it could not fully close the strait, and markets have adapted. Treasury Secretary Scott Bessent called it a \"one-two punch\" to collapse the regime. Sceptics, including former negotiator Dennis Ross, cited Iran's resilience; Ross suggested a face-saving deal over shipping fees could reopen the strait.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20ST/Iran's%20Hormuz%20leverage%20wanes%20as%20US%20economic%20squeeze%20bites.pdf"},{"id":"st-10","title":"Malaysia PM Anwar to consider calling general election on an earlier date","source":"ST","date":"7 Sep 2026","tags":["Politics","Southeast Asia"],"summary":"Malaysian Prime Minister Anwar Ibrahim said calls for an earlier general election will be considered, though his government is currently prioritising reviving the economy, improving well-being and combating corruption and abuse of power. He said the federal government is stable with a mandate to govern, telling the Cabinet on Sept 2 that anti-corruption efforts are not based on race or aimed at protecting any group. Barisan Nasional secretary-general Zambry Abd Kadir said BN remains committed to the unity government and stability, adding that while UMNO and BN may want an earlier poll, they are not overconfident of winning. Deputy PM and BN chairman Ahmad Zahid Hamidi had earlier voiced support for an earlier 16th General Election. The current Parliament's full term ends Dec 18, 2027.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20ST/Malaysia%20PM%20Anwar%20to%20consider%20calling%20general%20election%20on%20an%20earlier%20date.pdf"},{"id":"st-11","title":"Moscow has not ruled out trilateral meeting between presidents of Russia, US, China, TASS reports","source":"ST","date":"7 Sep 2026","tags":["Geopolitics"],"summary":"Russia's Deputy Foreign Minister Sergei Ryabkov said on Sept 6 that Moscow has not ruled out a trilateral meeting between the presidents of Russia, the US and China, state news agency TASS reported. However, before actual preparations begin, it is necessary to understand the meeting's agenda, Ryabkov said, noting the main question is how its substance would be formulated and what results could be expected. Earlier in September, Kremlin aide Yuri Ushakov raised the possibility of such a meeting between Vladimir Putin, Donald Trump and Xi Jinping at the Asia-Pacific Economic Cooperation summit in Shenzhen, China, in November.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20ST/Moscow%20has%20not%20ruled%20out%20trilateral%20meeting%20between%20presidents%20of%20Russia,%20US,%20China,%20TASS.pdf"},{"id":"st-12","title":"NATO will not tolerate hybrid actions against members, US envoy says","source":"ST","date":"7 Sep 2026","tags":["Defence","Geopolitics"],"summary":"NATO members should not tolerate deliberate acts of hybrid war, and the United States will stand by countries dealing with such incidents, US ambassador to NATO Matthew Whitaker said on Sept 5 at a business conference in Cernobbio, Italy. He described last month's attempted drone attack at Germany's Leipzig/Halle Airport, which Berlin blamed on Russia, as more concerning than incidents involving Russian drones targeting Ukraine that strayed off course, likening it to events in Poland. Whitaker said members must be prepared, vigilant and deliver a strong message when challenged, and that when a perpetrator can be identified, as Germany did, they should express strongly that it is unacceptable. He added that critical infrastructure, including energy assets, could be targeted and should be monitored nationally.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20ST/NATO%20will%20not%20tolerate%20hybrid%20actions%20against%20members,%20US%20envoy%20says.pdf"},{"id":"st-13","title":"North Korea's Kim Jong Un says new destroyer will be part of nuclear response system","source":"ST","date":"7 Sep 2026","tags":["Defence","Geopolitics"],"summary":"North Korean leader Kim Jong Un said the country's newest destroyer would form part of a nuclear response system and could deliver \"annihilating retaliatory strikes,\" state media KCNA reported on Sept 7, though it did not say whether the vessel would carry nuclear weapons. At a Sept 6 commissioning ceremony in the eastern port of Wonsan, Kim said the ship's deployment to the sea east of the Korean Peninsula signalled to adversaries that \"the time has come for us to exercise our sovereignty at sea and under water.\" The 5,000-ton-class destroyer Kang Kon is the second of its class after the Choe Hyon, sharing the same weapons systems, which analysts say can carry nuclear-capable missiles. Kim said naval bases were under construction and pledged another build-up stage in eight months.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20ST/North%20Korea's%20Kim%20Jong%20Un%20says%20new%20destroyer%20will%20be%20part%20of%20nuclear%20response%20system.pdf"},{"id":"st-14","title":"Russia's Lavrov accuses Germany of moving towards war with it","source":"ST","date":"7 Sep 2026","tags":["Geopolitics","Defence"],"summary":"Russian Foreign Minister Sergei Lavrov accused Germany of moving towards direct confrontation with Russia, criticising Berlin's decision to close some diplomatic offices after a drone incident at Leipzig airport. \"This is, broadly speaking, kind of the beginning of a real war,\" Lavrov said in comments on Telegram via state TV channel Vesti, likening it to Germany closing missions before World War II. Germany blamed Russia after a drone carrying an explosive was found at Leipzig in August; Russia denied it, with Putin accusing Berlin of planting evidence. Germany ordered closure of the Russian consulate general in Bonn and the Russian House, and will tighten border controls for Russian nationals. Moscow retaliated by closing Goethe Institut branches. Lavrov said Chancellor Friedrich Merz is \"essentially moving to declare war on us.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20ST/Russia's%20Lavrov%20accuses%20Germany%20of%20moving%20towards%20war%20with%20it.pdf"},{"id":"st-15","title":"Singapore navy begins maritime cooperation exercise with Chinese counterpart","source":"ST","date":"7 Sep 2026","tags":["Defence","Southeast Asia"],"summary":"The Republic of Singapore Navy is taking part in a bilateral maritime cooperation exercise with the Chinese navy from Sept 5 to 9, the Ministry of Defence said. The opening ceremony of Exercise Maritime Cooperation was held at Ma Xie Naval Base in Zhanjiang, China, on Sept 5, co-officiated by Singapore's deputy fleet commander Colonel Ng Yen Meng and Rear Admiral Xia Ziming of the PLA Navy's Southern Theater Command. Now in its fifth edition since 2015, the drill features Singapore's Formidable-class frigate RSS Steadfast and China's Jiangkai II-class frigate PLANS Dali, with a shore phase from Sept 5 to 7 and a sea phase off Zhanjiang on Sept 8 to 9 covering gunnery, manoeuvring and search-and-rescue serials. RSS Steadfast is concluding a three-month deployment including RIMPAC.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20ST/Singapore%20navy%20begins%20maritime%20cooperation%20exercise%20with%20Chinese%20counterpart.pdf"},{"id":"st-16","title":"Temasek, portfolio firms need to make commercial decisions without fear of politicisation: Shanmugam","source":"ST","date":"7 Sep 2026","tags":["Finance & Markets","Politics"],"summary":"Temasek portfolio companies must not fear making investment decisions due to political pressure or politically motivated criticism, Senior Minister K. Shanmugam said on Sept 5, addressing racist online comments over Singapore Airlines' Air India stake. Air India is seeking US$1.5 billion in fresh equity after a record US$2 billion loss; SIA holds a 25.1 per cent stake via its former Vistara joint venture with Tata. Shanmugam said the shareholder is SIA, not Temasek, and the decision is SIA's, noting SIA holds over $10 billion cash and $3 billion undrawn credit. He rebutted attacks on Temasek CEO Dilhan Pillay Sandrasegara, citing India as Temasek's best-performing geography. WP MP Kenneth Tiong, who filed a parliamentary question, condemned the racism, saying his concerns were purely commercial.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20ST/Temasek,%20portfolio%20firms%20need%20to%20make%20commercial%20decisions%20without%20fear%20of%20politicisation.pdf"},{"id":"st-17","title":"Tokyo reverses baby bust with AI matchmaking and generous subsidies","source":"ST","date":"7 Sep 2026","tags":["Society","Technology & AI"],"summary":"Tokyo Governor Yuriko Koike, marking 10 years in office, told The Straits Times that births in the capital are finally rising, calling it among her proudest achievements. In 2025 Tokyo registered 85,064 Japanese births, up 1.02 per cent, its first increase in a decade, alongside a second consecutive rise in marriages. Japan recorded 342,068 births in the first half of 2026, its first nationwide first-half gain in 11 years, despite Tokyo's fertility rate of 0.96, the lowest in Japan. Koike's \"children first\" policies include the AI matchmaking app Tokyo Enmusubi, launched September 2024 with over 38,000 users and 300-plus marriages, subsidised egg freezing and epidural deliveries, free childcare, and campaigns that lifted paternity leave uptake from 7.4 per cent in 2016 to 61.2 per cent in 2025.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20ST/Tokyo%20reverses%20baby%20bust%20with%20AI%20matchmaking%20and%20generous%20subsidies.pdf"},{"id":"bt-01","title":"'An ideal trade': Investors eye China stock options as South Korea and Japan AI bets grow crowded","source":"BT","date":"7 Sep 2026","tags":["Finance & Markets","Technology & AI"],"summary":"Investors seeking to diversify beyond crowded AI trades in South Korea and Japan are increasingly turning to Chinese equity derivatives. Trading desks at Barclays and UBS report rising client demand for bullish options and swaps tied to China's CSI indexes, while strategists at BNP Paribas and Bank of America cite capital-market reforms, self-reliant tech advances and an improving hardware earnings outlook. UBS highlighted the CSI 500 as an alternative AI bet. The CSI 1000 remains 16 per cent below its May high, and slumping implied volatility makes derivatives cheaper. Bank of America's Lars Naeckter recommends CSI 1000 call spreads, calling it \"an ideal trade\" as investors stay on edge. UBS said its largest weekly Asian derivatives flow came from bullish China bets.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20BT/'An%20ideal%20trade'%20Investors%20eye%20China%20stock%20options%20as%20South%20Korea%20and%20Japan%20AI%20bets%20grow%20c.pdf"},{"id":"bt-02","title":"'No longer a rising tide': Upcoming Q4 launches will test homebuying demand","source":"BT","date":"7 Sep 2026","tags":["Southeast Asia","Finance & Markets"],"summary":"Singapore's residential market has cooled after 2025's dramatic rebound, though analysts say demand is being tested rather than fundamentally weakening. Developers sold 4,885 new private homes (excluding ECs) in the first seven months of 2026, down 11.6 per cent, as launches fell 28.7 per cent to 4,516 units. A Q4 line-up including the 1,268-unit Thomson Reserve, plus Lucerne Grand and Amberwood, will serve as \"litmus tests.\" ERA's Marcus Chu says every project now must \"earn demand.\" July take-up rates slipped below 55 per cent versus 63.9 per cent in May. Buyers are more selective amid higher prices; homes above S$2 million made up 61 per cent of new non-landed sales. PropNex forecasts about 9,000 sales for 2026, down from 10,815 units in 2025.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20BT/'No%20longer%20a%20rising%20tide'%20Upcoming%20Q4%20launches%20will%20test%20homebuying%20demand.pdf"},{"id":"bt-03","title":"AI cloud firm Nscale seeks US$3.5 billion in pre-IPO financing","source":"BT","date":"7 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"London-based AI cloud firm Nscale is in talks to raise up to US$3.5 billion ahead of a planned IPO, including as much as US$1.5 billion of convertible notes led by Daniel Loeb's Third Point, with Goldman Sachs advising. It also seeks about US$2 billion from Nvidia, while the IPO could raise a further US$3 billion. Convertibles are offered at the IPO price minus a double-digit discount, adjusted up to a US$30 billion valuation. Nscale tells investors its contracts total about US$103 billion, following a US$45 billion deal to supply Anthropic, and projects US$18.1 billion in annual revenue. It has contracted for roughly 194,000 Nvidia Vera Rubin GPUs and is building campuses in Norway and West Virginia. Its board includes Sheryl Sandberg and Nick Clegg.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20BT/AI%20cloud%20firm%20Nscale%20seeks%20US3.5%20billion%20in%20pre-IPO%20financing.pdf"},{"id":"bt-04","title":"Anthropic IPO launch shifts toward mid-October, sources say","source":"BT","date":"7 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Anthropic is now expected to begin marketing its IPO in mid-October at the earliest, completing the listing days before November's US midterm elections, people familiar said. The AI company had been expected to publish its prospectus as early as next week, but that step is now not anticipated until late September. The delay pushes back what some investors say could be a US$2 trillion listing, among the largest ever and a major test of public-market appetite for AI. As part of the process, Anthropic is finalising a US$15 billion revolving credit facility before analyst meetings. Morgan Stanley, Goldman Sachs, JPMorgan and Citi are working on the offering, which could come alongside listings from rivals including OpenAI. SpaceX went public in June at a record US$1.77 trillion valuation.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20BT/Anthropic%20IPO%20launch%20shifts%20toward%20mid-October,%20sources%20say.pdf"},{"id":"bt-05","title":"Chinese banks purchasing Treasuries after wooing dollar deposits, sources say","source":"BT","date":"7 Sep 2026","tags":["Finance & Markets","Geopolitics"],"summary":"Chinese banks have been quietly buying US Treasuries in recent months after lifting dollar deposit rates, moves that could slow yuan gains amid a spike in US yields, sources told Reuters. With Chinese government bond yields very low, Treasuries look attractive: the 10-year yield has risen more than 30 basis points since June to 4.76 per cent. Big Five lenders capped most dollar deposits at 2.8 per cent since 2023, but holders above US$50,000 now negotiate above 3 per cent, or near 4 per cent at smaller banks. China's forex deposits hit US$1.18 trillion at end-July, up 17.9 per cent. Higher rates soak up dollars, easing upward yuan pressure. Chinese Treasury holdings via US custodians fell 13 per cent to US$633.4 billion in June, the lowest since 2008.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20BT/Chinese%20banks%20purchasing%20Treasuries%20after%20wooing%20dollar%20deposits,%20sources%20say.pdf"},{"id":"bt-06","title":"Economists see final ECB hike next week in split with markets","source":"BT","date":"7 Sep 2026","tags":["Finance & Markets","Energy"],"summary":"Economists expect the European Central Bank to raise its deposit rate a quarter-point to 2.5 per cent next Thursday, then hold through 2027 - a far more dovish view than markets, which price about three more hikes by mid-next year. The divergence reflects the ECB's challenge as renewed Middle East fighting jolts energy markets, with oil heading back toward US$100 a barrel and gas at 2023 highs. Most survey respondents see little evidence of entrenched inflation or second-round wage effects, though officials such as Isabel Schnabel warn early vigilance is critical. Economists foresee an upward revision to 2026 growth. The Strait of Hormuz \"has become the swing factor,\" said TU Berlin's Dennis Shen, as a prolonged disruption could turn an energy shock into a broader inflation problem.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20BT/Economists%20see%20final%20ECB%20hike%20next%20week%20in%20split%20with%20markets.pdf"},{"id":"bt-07","title":"German startup Isar reaches orbit in boost to Europe's homegrown launch ambitions","source":"BT","date":"7 Sep 2026","tags":["Technology & AI","Geopolitics"],"summary":"German startup Isar Aerospace launched its Spectrum rocket into orbit from Arctic Norway on Sep 5, the first commercial flight to reach orbit from continental Europe and a breakthrough for the continent's homegrown launch ambitions. \"We're in orbit! And just made European history,\" Isar posted on X. The uncrewed rocket carried five small satellites plus an in-flight experiment. It was Isar's second attempt, 18 months after its first rocket exploded shortly after take-off from the same site. Norwegian officials said the Andoeya capability strengthens European security amid a shifting global order under Trump. Global rivals include SpaceX and ArianeGroup, with Sweden and Britain also competing. Isar recently secured about 200 million euros (US$232 million) from the European Space Agency and is developing a Canadian site.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/07%20Sep%202026/07%20Sep%20BT/German%20startup%20Isar%20reaches%20orbit%20in%20boost%20to%20Europe's%20homegrown%20launch%20ambitions.pdf"},{"id":"bt-08","title":"Lloyd's insurance market expects £1.4 billion loss from US-Iran War","source":"BT","date":"7 Sep 2026","tags":["Finance & Markets","Geopolitics"],"summary":"Lloyd's of London expects about £1.4 billion (US$1.9 billion) of losses from the Middle East conflict, its first estimate of the US-Iran war's impact. The insurance marketplace reported £3.5 billion pretax profit for the six months to June, down 17 per cent year on year and in line with guidance. Iran's drone and missile strikes damaged infrastructure and energy facilities, though the extent has been slow to emerge. Commercial insu
