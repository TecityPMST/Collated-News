20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/DBS,%20Citi%20bypass%20traditional%20banking%20hours%20with%20weekend%20tokenised%20deposit%20payment.pdf"},{"id":"st-08sep-05","title":"Europe's biggest mobile operators in talks for satellite-to-mobile venture","source":"ST","date":"08 Sep 2026","tags":["Technology & AI"],"summary":"Some of Europe's biggest mobile operators are in early talks to create a consortium to bid on satellite spectrum and offer direct-to-mobile service, which would rival Elon Musk's Starlink on the continent, people familiar with the matter said. Deutsche Telekom, Orange, Vodafone Group and Telefonica would jointly bid for airwaves the EU has proposed reserving for a local operator, part of a plan to boost sovereign satellite capabilities. No final decisions have been made. The EU is weighing rules for the 2 GHz spectrum in an upcoming auction that would keep a third of the band for local companies; current licences expire in 2027. Any satellite operator would need to be majority European-controlled. Another third would be reserved for the IRIS2 constellation, entering service in 2029.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/Europe's%20biggest%20mobile%20operators%20in%20talks%20for%20satellite-to-mobile%20venture.pdf"},{"id":"st-08sep-06","title":"Europe's largest carbon capture facility opens in the Netherlands","source":"ST","date":"08 Sep 2026","tags":["Environment","Energy"],"summary":"The largest carbon capture facility in Europe opened in the Netherlands on Sept 7, developed by Norwegian fertiliser company Yara International. The carbon capture and storage facility in Sluiskil, in the Dutch province of Zeeland, will cut emissions at one of Europe's largest fertiliser sites and transport captured carbon to Norway. From 2026, Yara Sluiskil will capture and liquefy up to 800,000 tonnes of CO2 a year, stored 2.6km beneath the seabed by operator Northern Lights. Over 15 years, Yara expects to remove about 12 million tonnes of CO2. Norwegian PM Jonas Gahr Stoere called it scientifically advanced and commercially viable. The EU plans to use carbon capture to help meet its 2050 net-zero target, though critics say it can prolong oil and gas production.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/Europe's%20largest%20carbon%20capture%20facility%20opens%20in%20the%20Netherlands.pdf"},{"id":"st-08sep-07","title":"From dance floor to war: China readies humanoid robots for combat","source":"ST","date":"08 Sep 2026","tags":["Defence","Technology & AI"],"summary":"China's defence establishment is accelerating research into humanoid robots' military uses and planning for eventual wartime deployment, a Reuters review of more than 100 procurement notices, studies, patents and defence materials found. Days after August's World Humanoid Robot Games, the PLA Daily urged researchers to speed the transfer of technologies to military training for robotic combatants. Military institutions are testing humanoids against battlefield requirements and studying how they might work alongside troops, with momentum building in 2025 and 2026. Chinese manufacturers accounted for about 95 per cent of global humanoid shipments in 2025. A NUDT paper envisioned combat robots clearing buildings in urban warfare within five to 10 years. The US Army launched a competition in 2025 but trails China. Reuters found no armed humanoid deployed with a PLA unit.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/From%20dance%20floor%20to%20war%20China%20readies%20humanoid%20robots%20for%20combat.pdf"},{"id":"st-08sep-08","title":"German leader Friedrich Merz 'shocked' by polls loss to far-right AfD, vows to push on with reforms","source":"ST","date":"08 Sep 2026","tags":["Politics"],"summary":"German Chancellor Friedrich Merz said on Sept 7 he was deeply shocked after his centre-right CDU suffered a heavy loss to the far-right AfD in the eastern state of Saxony-Anhalt, but vowed to push on with reforms. The CDU scored just 17 per cent against almost 44 per cent for the anti-immigration, Russia-friendly AfD. AfD co-leader Alice Weidel called Merz a major burden, while its lead candidate Ulrich Siegmund said voters had sent a signal to Berlin and reached out to build a coalition. Merz conceded his low poll ratings and slow reforms played a role, but pledged to continue overhauling the economy, pensions and healthcare and to keep backing Ukraine. Supporters of Donald Trump, including Elon Musk, cheered the AfD result. Analysts expect Merz's coalition to soldier on.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/German%20leader%20Friedrich%20Merz%20'shocked'%20by%20polls%20loss%20to%20far-right%20AfD,%20vows%20to%20push%20on%20wit.pdf"},{"id":"st-08sep-09","title":"Graduates can stay confident that S'pore is still creating jobs amid tighter job market: Ong Ye Kung","source":"ST","date":"08 Sep 2026","tags":["Society","Technology & AI"],"summary":"Graduates can remain confident that Singapore is still competitive and creating jobs, Coordinating Minister for Social Policies Ong Ye Kung said on Sept 7, while acknowledging a tighter graduate job market. Addressing about 250 students at the Kent Ridge Ministerial Forum, he urged employers to cool an arms race over grades and internships and to look beyond GPAs for resilience and character. The proportion of graduates employed six months after graduation fell from 92.9 per cent in 2023 to 88.9 per cent in 2025. Ong attributed the tightening to more graduates, employer differentiation and higher expectations, plus AI creating a broken ladder syndrome by automating entry-level tasks. He said AI is not causing mass displacement, cited investments by firms like Micron and Google, and urged graduates to build mastery.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/Graduates%20can%20stay%20confident%20that%20S'pore%20is%20still%20creating%20jobs%20amid%20tighter%20job%20market%20On.pdf"},{"id":"st-08sep-10","title":"Huawei launches new foldable smartphone as competition with Xiaomi, Apple heats up","source":"ST","date":"08 Sep 2026","tags":["Technology & AI"],"summary":"Huawei launched a new version of its flagship foldable smartphone on Sept 7 as it seeks to defend its lead in China's premium handset market against Apple and Xiaomi. The new Mate XT2 folds out twice into a tablet-sized screen and features Huawei's new Kirin 9050 Pro chip, a redesigned folding mechanism and 42 per cent better performance. Xiaomi is launching a rival foldable, while Apple unveils its latest iPhone on Sept 9, expected to include a foldable priced above US$2,000 (S$2,500). Huawei leads China's smartphone market with a 22.6 per cent share, ahead of Apple's 18.1 per cent, and holds 68 per cent of foldable shipments. Smartphones are headed for their worst contraction on record in 2026, with shipments likely to fall 14 per cent amid surging component prices.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/Huawei%20launches%20new%20foldable%20smartphone%20as%20competition%20with%20Xiaomi,%20Apple%20heats%20up.pdf"},{"id":"st-08sep-11","title":"Israel threatens 'full-scale war' with Palestinian Authority, warning against Oct 7-style attack","source":"ST","date":"08 Sep 2026","tags":["Geopolitics","Defence"],"summary":"Israel on Sept 7 threatened a full-scale war against the Palestinian Authority if it prepared an Oct 7-style attack against Israeli forces or settlements, an unusual warning that Palestinian officials denounced as an attempt to fuel conflict during Israel's election season. Defence Minister Israel Katz said Prime Minister Benjamin Netanyahu and he had instructed the IDF to prepare, with any campaign targeting the PA's senior leadership and infrastructure, including targeted killings and resident evacuations. The remarks followed a fatal stabbing in the northern occupied West Bank, where the military shot the Palestinian assailant. The PA does not officially take part in militancy. Violence has surged since 2023, with Israeli forces or settlers killing at least 1,106 Palestinians in the West Bank and at least 48 Israelis killed in that period.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/Israel%20threatens%20'full-scale%20war'%20with%20Palestinian%20Authority,%20warning%20against%20Oct%207-style.pdf"},{"id":"st-08sep-12","title":"Japan PM Takaichi's reflationist aide projects Bank of Japan rate hike in September","source":"ST","date":"08 Sep 2026","tags":["Finance & Markets"],"summary":"The Bank of Japan is likely to raise interest rates in September and keep hiking about once a quarter until January 2027, said Takuji Aida, an economic adviser to Prime Minister Sanae Takaichi, on Sept 7. Aida, a reflationist and vocal opponent of BOJ hikes, brought forward his forecast from January 2027, noting September offers a narrow window before an extraordinary parliamentary session in early October. Markets have nearly fully priced in a 25-basis-point hike to 1.25 per cent at the Sept 17-18 meeting. Prospects rose as US Treasury Secretary Scott Bessent called for decisive steps to combat yen weakness, and BOJ Governor Kazuo Ueda said the bank would debate a hike. His remarks suggest broadening consensus within dovish Takaichi's administration for further hikes to arrest yen falls.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/Japan%20PM%20Takaichi's%20reflationist%20aide%20projects%20Bank%20of%20Japan%20rate%20hike%20in%20September.pdf"},{"id":"st-08sep-13","title":"Japan's August foreign reserves post largest drop after record intervention","source":"ST","date":"08 Sep 2026","tags":["Finance & Markets"],"summary":"Japan's foreign reserves posted their biggest-ever drop in August after Tokyo launched another round of record dollar-selling, yen-buying intervention to stem currency weakness, government data showed on Sept 7. Reserves fell a record US$79.6 billion, or 6.18 per cent, to US$1.208 trillion (S$1.53 trillion) from US$1.287 trillion a month earlier. The fall was led by a drop in foreign securities, mostly US Treasuries. Japan spent 15.4 trillion yen (S$125 billion) between July 30 and Aug 26, the largest single-month intervention on record, lifting the yen from 40-year lows near 164 per dollar to as high as 155.2. Part of the operation was conducted jointly with the US, the first coordinated intervention since 2011. Tokyo and Washington said Japan could tap a Covid-era Federal Reserve backstop.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/Japan's%20August%20foreign%20reserves%20post%20largest%20drop%20after%20record%20intervention.pdf"},{"id":"st-08sep-14","title":"John Ternus' first test at Apple - selling a US$2,000 foldable iPhone","source":"ST","date":"08 Sep 2026","tags":["Technology & AI"],"summary":"Apple's John Ternus is set to unveil his first products as chief executive on Sept 9, hoping to sell customers on a foldable screen and a price tag above US$2,000 (S$2,500). The design has been in development for at least eight years inside the hardware division Ternus led until this week, with outgoing CEO Tim Cook handing him the high-stakes launch. The company needs customers to absorb price increases across the iPhone range amid supply-chain cost pressures, particularly memory chips. Foldables make up about 2 per cent of global smartphone sales, and growth has slowed since 2019. IDC projects 12 per cent foldable growth in 2026, with Apple capturing a 40 per cent share by 2027. UBS's David Vogt expects at least 10 million foldables sold in the first year.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/John%20Ternus'%20first%20test%20at%20Apple%20-%20selling%20a%20US2,000%20foldable%20iPhone.pdf"},{"id":"st-08sep-15","title":"Kremlin says it does not rule out restart of peace talks with Ukraine and US","source":"ST","date":"08 Sep 2026","tags":["Geopolitics"],"summary":"The Kremlin said on Sept 7 it did not rule out the resumption of trilateral peace talks between Russia, Ukraine and the United States, but that it was too early to say when or where such talks might take place. Spokesman Dmitry Peskov made the comments when asked about a weekend visit to Moscow and Kyiv by US envoys Steve Witkoff and Jared Kushner, who are trying to revive stalled efforts to end the war in Ukraine. Peskov declined to detail the latest US proposals, but did not rule out a phone call between President Vladimir Putin and President Donald Trump. He praised the American negotiators' peace-building efforts and said Putin holds Trump's efforts in high regard. Moscow had not yet received information about the envoys' Kyiv contacts.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/Kremlin%20says%20it%20does%20not%20rule%20out%20restart%20of%20peace%20talks%20with%20Ukraine%20and%20US.pdf"},{"id":"st-08sep-16","title":"Latest flare-up between the US and Iran: Will there be major escalation or just more of the same stand-off?","source":"ST","date":"08 Sep 2026","tags":["Geopolitics","Energy"],"summary":"With the US midterm campaign under way, the Trump administration is trying to divert attention from its six-month military showdown with Iran, even as both sides weigh moves that could spark another wave of warfare, writes Jonathan Eyal. On Sept 5, the US struck three Iranian tankers, with Defence Secretary Pete Hegseth warning that if Iran fires at US vessels, the US will sink Iranian tankers. A US naval blockade since mid-July has cut Iranian oil through the Strait of Hormuz to no more than 250,000 barrels a day. Iranian officials including parliamentary Speaker Mohammad Bagher Ghalibaf warned the rules of the game have changed. Some voices in Tehran argue for widening the war, possibly targeting Israel, which is on alert ahead of Jewish new year celebrations.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/Latest%20flare-up%20between%20the%20US%20and%20Iran%20Will%20there%20be%20major%20escalation%20or%20just%20more%20of%20the.pdf"},{"id":"st-08sep-17","title":"North Korean defence minister criticizes joint military drills by US, Japan and South Korea","source":"ST","date":"08 Sep 2026","tags":["Defence","Geopolitics"],"summary":"North Korea's newly appointed defence minister, Kim Song-gi, called joint military drills by South Korea, Japan and the United States a provocation, state media KCNA reported on Sept 7. Kim vowed to take strong and reflective countermeasures if the US and its allies sought a new military confrontation. South Korea, the United States and Japan began their annual Freedom Edge exercise on Monday in international waters southeast and south of Jeju Island, according to Seoul's Joint Chiefs of Staff. The trilateral exercise comes after US President Donald Trump scaled back a major joint exercise with South Korea the previous month.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/North%20Korean%20defence%20minister%20criticizes%20joint%20military%20drills%20by%20US,%20Japan%20and%20South%20Kore.pdf"},{"id":"st-08sep-18","title":"Panama Canal considering more cuts in transits due to El Nino","source":"ST","date":"08 Sep 2026","tags":["Trade","Environment"],"summary":"The number of ships sailing through the Panama Canal could be cut further due to drought caused by the El Nino weather pattern, the waterway's new administrator told AFP on Sept 7. Panama has declared a nationwide emergency over El Nino, expected to be the strongest since record-keeping began four decades ago. The canal, which handles 5 per cent of global maritime trade, has already reduced daily transits from 36 last month to 32 by mid-September, and administrator Ilya Espino de Marotta said limits could drop to around 29 by February or March. Each ship requires about 200 million litres of water. Restrictions come even as canal use rises: shippers are seeking an alternative to the Iran-blocked Strait of Hormuz, making the canal a fallback route for energy shipments.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/Panama%20Canal%20considering%20more%20cuts%20in%20transits%20due%20to%20El%20Nino.pdf"},{"id":"st-08sep-19","title":"Police in eastern German state defuse 21 explosive devices found near power grid","source":"ST","date":"08 Sep 2026","tags":["Society","Energy"],"summary":"Prosecutors in the eastern German state of Saxony said on Sept 7 that authorities had found a total of 21 explosive devices as part of investigations into attacks on the electricity grid that have kept authorities on high alert. Investigators discovered nine additional homemade devices over the weekend near high-voltage power lines south of the Graustein substation in the Goerlitz district. Germany has been a focus of European fears about critical-infrastructure vulnerability after a series of sabotage incidents last week and an August drone attack at Leipzig/Halle that the government blamed on Russia. Police said on Sept 4 they were searching for a man, still at large, who claimed responsibility. A Berlin substation fire on Sept 7 was found to be a technical fault.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/Police%20in%20eastern%20German%20state%20defuse%2021%20explosive%20devices%20found%20near%20power%20grid.pdf"},{"id":"st-08sep-20","title":"Samsung appliance workers escalate bonus fight with protests, Times Square ad in New York City","source":"ST","date":"08 Sep 2026","tags":["Society","Technology & AI"],"summary":"A Samsung Electronics union representing consumer-device workers is escalating a campaign over a widening pay gap with the semiconductor division. The Donghaeng union, concentrated in the Device eXperience (DX) division, plans rallies of about 200 people near founding-family member Lee's Yongsan home from Sept 18, plus relay one-person protests, and has placed a video on a Times Square billboard reading Great products begin with people and We are still here. The union says management unfairly blames DX's weak performance on employees while paying them far less than chip-focused staff. It demands 1,000 shares per DX employee and equal base-pay increases. DX posted 48 trillion won (S$45.22 billion) in second-quarter revenue and an 800 billion won operating loss, its first quarterly loss.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/Samsung%20appliance%20workers%20escalate%20bonus%20fight%20with%20protests,%20Times%20Square%20ad%20in%20New%20York.pdf"},{"id":"st-08sep-21","title":"Saudi Arabia preparing to grant IAEA more intrusive powers, Grossi says","source":"ST","date":"08 Sep 2026","tags":["Geopolitics"],"summary":"A planned US-Saudi atomic deal does not include Riyadh signing the Additional Protocol that gives the UN nuclear watchdog sweeping inspection powers, but something close to it on some points is in the works, IAEA chief Rafael Grossi said on Sept 7. The US and Saudi Arabia reached a civil nuclear cooperation agreement in July that would let Riyadh enrich uranium and build reactors using US technology. Non-proliferation groups criticised the planned 123 agreement for omitting the Additional Protocol, which allows snap inspections at undeclared sites. Grossi said Riyadh is preparing to go beyond its core safeguards obligations, adding provisions on enrichment, conversion and reprocessing that give the agency authorisations very similar to the Additional Protocol. The bilateral agreement will be presented to the IAEA's 35-nation board once finalised.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/Saudi%20Arabia%20preparing%20to%20grant%20IAEA%20more%20intrusive%20powers,%20Grossi%20says.pdf"},{"id":"st-08sep-22","title":"Singapore retail sales growth slows to 1.5% in July as food, department store takings fall","source":"ST","date":"08 Sep 2026","tags":["Finance & Markets","Society"],"summary":"Singapore's retail sales growth slowed to 1.5 per cent year on year in July, moderating from June's 4 per cent expansion, according to Singapore Department of Statistics data released on Sept 7. Excluding motor vehicles, sales also rose 1.5 per cent. On a seasonally adjusted month-on-month basis, sales rose 0.9 per cent. Total retail sales were estimated at $4.4 billion, with online transactions at 15.4 per cent. Recreational goods led growth at 13.9 per cent, and watches and jewellery rose 11.1 per cent, while food and alcohol fell 5.1 per cent and department stores declined 3.5 per cent, their sixth drop in seven months. Analysts cited a high base from SG60 vouchers spent in July 2025 and structural e-commerce competition. F&B services sales fell 1.9 per cent year on year.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/Singapore%20retail%20sales%20growth%20slows%20to%201.5%20in%20July%20as%20food,%20department%20store%20takings%20fall.pdf"},{"id":"st-08sep-23","title":"South Korea pension fund suspends FX hedging as won hits two-year high, source says","source":"ST","date":"08 Sep 2026","tags":["Finance & Markets"],"summary":"South Korea's National Pension Service (NPS) has suspended foreign exchange hedging operations as the won strengthened to a near two-year high, a market source told Reuters on Sept 7. The NPS, the world's third-largest public pension fund, had been hedging flexibly in 2026 with a raised hedging limit to help curb won weakness; its operations effectively raise onshore dollar supply. The suspension came amid dollar-buying demand and worries about one-sided volatility after a sharp won rebound. Foreign exchange authorities recently bought about US$20 billion (S$25.4 billion) in dollars that chipmaker SK Hynix sold after its US share listing. The won strengthened as much as 1.15 per cent to 1,334.7 per dollar, its highest since October 2024, and is up 16 per cent this quarter.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/South%20Korea%20pension%20fund%20suspends%20FX%20hedging%20as%20won%20hits%20two-year%20high,%20source%20says.pdf"},{"id":"st-08sep-24","title":"South Korea, US agree on more than US$20 billion gas plant investment in Texas, media reports","source":"ST","date":"08 Sep 2026","tags":["Energy","Trade"],"summary":"South Korea and the United States have agreed on the size of Seoul's planned investment in a Texas gas project at around US$22.3 billion, Korean media outlet Edaily reported on Sept 7, citing unidentified officials and politicians. The project, Seoul's first US investment under last year's trade agreement, aims to build a 6.3-gigawatt gas plant in Encinal, Texas, to meet rising power demand for AI data centres. The investment would form part of the trade deal under which Seoul pledged US$350 billion of US investments in exchange for favourable tariffs on South Korean goods. Reports said Seoul is also weighing a large-scale nuclear plant or an Alaska LNG project. South Korea's Industry Ministry said the reports were inaccurate and that consultations were continuing.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/South%20Korea,%20US%20agree%20on%20more%20than%2020%20billion%20gas%20plant%20investment%20in%20Texas,%20media%20reports.pdf"},{"id":"st-08sep-25","title":"Syrian nuclear reactor could have been useful for weapons, IAEA chief says","source":"ST","date":"08 Sep 2026","tags":["Geopolitics"],"summary":"The nuclear reactor Syria had nearly completed in 2007, when Israeli jets destroyed it, was of a type that could quickly produce fissile material usable in nuclear weapons, UN nuclear watchdog chief Rafael Grossi said on Sept 7. The IAEA described its recent investigation into secret nuclear activities under the Assad family's rule as a historic breakthrough, uncovering around 73 metric tonnes of natural uranium metal, mainly as reactor fuel. In a report to member states, the IAEA confirmed the bombed site in Deir al-Zor was a reactor under construction with Syrian-made fuel, all of which should have been declared. Grossi called it a very serious proliferation concern. Since Bashar al-Assad's ouster in late 2024, Syria's new authorities have cooperated to resolve outstanding safeguards issues.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/Syrian%20nuclear%20reactor%20could%20have%20been%20useful%20for%20weapons,%20IAEA%20chief%20says.pdf"},{"id":"st-08sep-26","title":"Taiwan flexes chip diplomacy muscles as it faces pressure to share AI wealth with allies","source":"ST","date":"08 Sep 2026","tags":["Technology & AI","Trade"],"summary":"Taiwan portrayed itself as a democratic and reliable supplier for the AI revolution at the Semicon Taiwan trade show, signalling willingness to share its semiconductor benefits with like-minded partners while facing pressure to shift more chip manufacturing abroad. Home to TSMC, which is investing US$265 billion (S$336 billion) in Arizona factories, diplomatically isolated Taiwan has long leveraged its tech prowess for international support, something Beijing seeks to block. President Lai Ching-te said Taiwanese firms were expanding globally to let resilience create shared prosperity. Economy Minister Kung Ming-hsin said companies planned an additional US$20 billion of US investment. US Commerce Secretary Howard Lutnick warned of semiconductor tariffs for companies not making chips in the US. Taiwan is also deepening ties with the EU, which is pitching its Chips Act 2.0.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/Taiwan%20flexes%20chip%20diplomacy%20muscles%20as%20it%20faces%20pressure%20to%20share%20AI%20wealth%20with%20allies.pdf"},{"id":"st-08sep-27","title":"The coming food price shock: How war, weather and fuel are colliding","source":"ST","date":"08 Sep 2026","tags":["Environment","Energy"],"summary":"Global food markets face a rare convergence of shocks in the second half of 2026, writes Vikram Khanna: a war-driven fertiliser shortage, fuel and grain shortages, and an intensifying El Nino. The FAO Food Price Index averaged 133.3 points in August, its highest since November 2022. The Strait of Hormuz has been effectively closed since the US-Iran war began on Feb 28, choking a third of seaborne fertiliser trade; the World Bank projects fertiliser prices up 38 per cent in 2026. Diesel is the tightest fuel market, worsened by Ukrainian strikes on Russian refineries, while Russia's renewed Black Sea blockade has pushed wheat up about 25 per cent. A strong El Nino threatens Asian rice and corn belts, and import-reliant Singapore will be hit.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/The%20coming%20food%20price%20shock%20How%20war,%20weather%20and%20fuel%20are%20colliding.pdf"},{"id":"st-08sep-28","title":"UK's Burnham, Trump discuss working towards Ukraine-Russia ceasefire, Downing Street says","source":"ST","date":"08 Sep 2026","tags":["Geopolitics"],"summary":"British Prime Minister Andy Burnham spoke with US President Donald Trump on Sept 7, with the two leaders agreeing on the need to continue working towards a ceasefire to end Russia's war in Ukraine, Downing Street said. Burnham reiterated the UK's support for Ukraine and for recent US-led peace negotiations, a Downing Street spokesperson said. The two leaders also discussed the Middle East, with Burnham stressing the importance of the two-state solution, the reopening of the Strait of Hormuz, and ensuring that Iran never acquires a nuclear weapon. The call came after US peace envoys Jared Kushner and Steve Witkoff met Ukrainian President Volodymyr Zelenskiy in Kyiv on Sunday, having spoken with Russian President Vladimir Putin in Moscow the previous day.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/UK's%20Burnham,%20Trump%20discuss%20working%20towards%20Ukraine-Russia%20ceasefire,%20Downing%20Street%20says.pdf"},{"id":"st-08sep-29","title":"UN rights chief 'horrified' by reports of fully autonomous killer drones in Ukraine","source":"ST","date":"08 Sep 2026","tags":["Defence","Geopolitics"],"summary":"The United Nations rights chief voiced alarm on Sept 7 at reports of fully autonomous drones killing people in Ukraine, calling for an urgent ban on weapons that can kill without human involvement. Speaking before the UN Human Rights Council, Volker Turk said he was horrified by reports that fully autonomous drones launched by Russia killed three Ukrainians last month, and noted reports that Ukraine had field-tested such weapons. The New York Times reported in August that a Russian AI-guided drone killed three civilians in Zaporizhzhia on July 6, choosing its target without human intervention. Pressure has grown to regulate lethal autonomous weapons, or killer robots. On Sept 5, 128 countries agreed on a definition of autonomous weapons, and will decide in November whether to launch treaty talks.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/UN%20rights%20chief%20'horrified'%20by%20reports%20of%20fully%20autonomous%20killer%20drones%20in%20Ukraine.pdf"},{"id":"st-08sep-30","title":"Warning signs abound for Republicans as midterm campaign begins final sprint","source":"ST","date":"08 Sep 2026","tags":["Politics"],"summary":"As the US midterm campaign sprint begins on Labour Day, Sept 7, President Donald Trump's deep unpopularity is imperilling Republican chances of holding their narrow congressional majorities two months before November's elections. Midterms are largely a referendum on the president, and Trump's approval is mired at an all-time low amid dissatisfaction with the war in Iran and the economy, a Reuters/Ipsos survey found. Democrats appear likely to win the House, enabling investigations into Trump, while the Senate is too close to call. Republicans hold a 218-214 House edge and structural advantages, including gains from mid-decade redistricting and Trump's US$400 million (S$506 million) super PAC war chest. All 435 House seats and about a third of the Senate are on the Nov 3 ballot.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20ST/Warning%20signs%20abound%20for%20Republicans%20as%20midterm%20campaign%20begins%20final%20sprint.pdf"},{"id":"bt-08sep-01","title":"America’s naval disaster","source":"BT","date":"08 Sep 2026","tags":["Defence","Geopolitics"],"summary":"Economist Anne O Krueger argues US shipbuilding cannot recover while it shields domestic shipyards from foreign competition. Once the world's largest naval power, America has fallen sharply behind China, which now accounts for over 50 per cent of global shipbuilding by tonnage and produced 1,700 ships in 2025 versus just five in the US. China's fleet reached 350 warships by 2020 and aims for 435 by 2030, while the US Navy's plan to add 58 ships by 2031 is deemed far-fetched. Fleet readiness fell to 68 per cent in 2025. Krueger blames the 1920 Jones Act, which mandates US-built, US-crewed vessels for domestic cargo, for making American shipbuilding four to five times costlier and uncompetitive.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20BT/America%E2%80%99s%20naval%20disaster.pdf"},{"id":"bt-08sep-02","title":"Are developers over-optimistic with bullish housing land bids?","source":"BT","date":"08 Sep 2026","tags":["Southeast Asia","Finance & Markets","Society"],"summary":"Business Times columnist Leslie Yee examines whether Singapore developers are overpaying in bullish government land sale (GLS) tenders. A Hong Leong-GuocoLand tie-up won the former Keppel Club site in Berlayar Drive for S$576.78 million, or a record S$1,515 per square foot per plot ratio for a 99-year city-fringe private residential plot. A UOL-CapitaLand Development venture secured a New Upper Changi Road site near Bedok for about S$1.43 billion (S$1,537 psf ppr), exceeding the next bid by 13.8 per cent, implying future selling prices above S$3,100 psf. Yee cautions on risks to new condo demand from potential job market weakness, higher home loan rates and property cooling measures, questioning whether such optimistic bids are justified.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20BT/Are%20developers%20over-optimistic%20with%20bullish%20housing%20land%20bids.pdf"},{"id":"bt-08sep-03","title":"China insurer capital injections could boost stock investments, analysts say","source":"BT","date":"08 Sep 2026","tags":["Finance & Markets","Politics"],"summary":"Analysts say Beijing's plan to inject capital into big state-owned insurers should ease capital and solvency constraints that have limited their long-term equity investments. Five state insurers and three banks said they would raise up to a combined 360 billion yuan (US$53.6 billion) via injections from the Ministry of Finance and other shareholders, with the ministry issuing 300 billion yuan in special bonds - the first time China has used such bonds to support insurers. Five insurers will receive 70 billion yuan combined: China Life gets 35 billion yuan, China Taiping seven billion, and PICC up to 15 billion. Citi noted the package is smaller than the 200 billion yuan expected, signalling healthier capital positions among Chinese insurers.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20BT/China%20insurer%20capital%20injections%20could%20boost%20stock%20investments,%20analysts%20say.pdf"},{"id":"bt-08sep-04","title":"China unveils 2030 funding push for food security and rural modernisation","source":"BT","date":"08 Sep 2026","tags":["Politics","Environment","Finance & Markets"],"summary":"China unveiled a plan on Monday to bolster funding for rural revitalisation, aiming by 2030 to build a more sustainable, efficient investment system combining fiscal support, credit, insurance, bonds and private capital to strengthen food security and modernise rural areas. Agriculture and rural areas would get priority in budget allocations, with increased compensation for major grain-producing regions. Local governments may use eligible bond proceeds for rural infrastructure, industry and public services, while banks are encouraged to lend more to grain- and seed-producing counties. China will expand agricultural insurance covering staple crops such as rice, wheat, corn and soybeans, and promote loans backed by livestock and farm machinery. The policy invites private capital through rural revitalisation funds and market-based channels.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20BT/China%20unveils%202030%20funding%20push%20for%20food%20security%20and%20rural%20modernisation.pdf"},{"id":"bt-08sep-05","title":"China’s new home-presale rules could cut land sales by 30%: Goldman","source":"BT","date":"08 Sep 2026","tags":["Finance & Markets","Politics"],"summary":"Goldman Sachs economists estimate China's overhaul of how homes are sold will deepen local governments' fiscal strain, fuelling a 30 per cent drop in land sale revenues - up from an earlier forecast of a 20 per cent decline. Economist Wang Lisheng cited Beijing's move shifting developers away from presales toward selling completed properties, which could make it harder for cash-strapped developers to buy land. In the first seven months of 2026, national land sales revenue fell 30.8 per cent to 1.2 trillion yuan (US$179 billion). Goldman expects the downturn to last until 2027 or beyond, with revenues falling up to 90 per cent from a mid-2021 peak. Under the new model, developers collect only small deposits, and buyers can walk away if homes are not delivered on schedule.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20BT/China's%20new%20home-presale%20rules%20could%20cut%20land%20sales%20by%2030%20Goldman.pdf"},{"id":"bt-08sep-06","title":"Foxconn says third quarter to outperform market expectations on AI strength","source":"BT","date":"08 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Foxconn said its third-quarter performance is expected to outperform market expectations on strong AI-related demand, though it cautioned about volatile global politics. The Taiwanese contract electronics maker - Nvidia's biggest server maker and a major Apple supplier - reported in August a 35 per cent rise in second-quarter profit that beat forecasts. It said AI demand continues to grow while ICT products enter their peak season, improving visibility for the quarter. Foxconn, formally Hon Hai Precision Industry, does not give numerical forecasts. August revenue rose 51.98 per cent year on year to NT$921.8 billion (US$29.15 billion), the highest ever for August and the second straight month above NT$900 billion. Its shares closed up 3.4 per cent on Sep 4.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20BT/Foxconn%20says%20third%20quarter%20to%20outperform%20market%20expectations%20on%20AI%20strength.pdf"},{"id":"bt-08sep-07","title":"Gold holds decline as traders weigh prospects for US Fed rate hike","source":"BT","date":"08 Sep 2026","tags":["Finance & Markets","Geopolitics"],"summary":"Gold held a decline after stronger-than-expected US payrolls data raised the prospect of a US Federal Reserve interest-rate hike as early as its Sep 15-16 meeting. Bullion was little changed near US$4,430 an ounce after falling 1 per cent the previous session, as a firmer US dollar made the metal costlier. Traders raised bets on a September hike to roughly 60 per cent, and higher borrowing costs typically weigh on non-yielding bullion. Gold has traded in a narrow range since rebounding from near US$4,000 in July. Upcoming US consumer price data will offer further clues. Escalating Middle East tensions, including Iran targeting oil tankers in the Strait of Hormuz, added to inflation concerns as oil prices gained.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20BT/Gold%20holds%20decline%20as%20traders%20weigh%20prospects%20for%20US%20Fed%20rate%20hike.pdf"},{"id":"bt-08sep-08","title":"Hormuz traffic dips to lowest since May after US, Iranian strikes on ships","source":"BT","date":"08 Sep 2026","tags":["Energy","Geopolitics"],"summary":"An average of 10 commodity ships transited the Strait of Hormuz per day over the past 10 days - the lowest since May - after US and Iranian strikes on tankers, according to Kpler data. The 10-day moving average fell to 10 on Sunday from over 15 on Friday. US forces struck three Iranian oil tankers on Saturday, including one off Kharg Island, following IRGC attacks on US warships; in retaliation the IRGC said it targeted three tankers and three US vessels. Maritime intelligence firm Marisks called it a major escalation, warning commercial tankers are now used as instruments of reciprocal economic pressure. There have been 27 projectile strike incidents since Jul 6, and no very large crude carrier has exited the strait since Sep 2.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20BT/Hormuz%20traffic%20dips%20to%20lowest%20since%20May%20after%20US,%20Iranian%20strikes%20on%20ships.pdf"},{"id":"bt-08sep-09","title":"How Singapore can become the ‘Switzerland of chips’","source":"BT","date":"08 Sep 2026","tags":["Technology & AI","Southeast Asia","Trade"],"summary":"This commentary argues Singapore can become the 'Switzerland of chips' - a neutral hub where chips, capital, talent and data converge. As semiconductor leadership shifts from ever-smaller chips toward advanced packaging, high-bandwidth memory, power management and system integration, Singapore's strengths in packaging, testing, R&D and equipment position it well. The city-state already accounts for about 10 per cent of global semiconductor output and 20 per cent of equipment production, with Micron building a US$7 billion advanced packaging plant and GlobalFoundries committing US$4 billion. Like Switzerland connecting finance, trade and rival blocs, Singapore can work with both Washington and Beijing, complemented by Malaysia's assembly and testing expertise. To win, it should double down on advanced packaging, AI infrastructure and talent.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20BT/How%20Singapore%20can%20become%20the%20'Switzerland%20of%20chips'.pdf"},{"id":"bt-08sep-10","title":"Malaysia eyes Huawei chips for AI project despite US warning","source":"BT","date":"08 Sep 2026","tags":["Technology & AI","Geopolitics","Southeast Asia"],"summary":"Malaysia is leaning toward using Huawei Technologies' AI chips to power its sovereign AI efforts, a potential major win for Chinese technology despite strong opposition from the Trump administration. The country is seriously evaluating Huawei hardware as the backbone of a RM2 billion (US$494 million) initiative to gain greater control over national data, sources said, though the number of chips is unclear. It would mark the first known instance of a foreign government officially choosing Chinese AI accelerators over American ones. The chips under review are Huawei's Ascend 910C, not the more advanced Ascend 950; Washington warned last year that using 910C chips could violate US export rules. Prime Minister Anwar Ibrahim wants Malaysia to be more than a technology consumer and regards the decision as commercial.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20BT/Malaysia%20eyes%20Huawei%20chips%20for%20AI%20project%20despite%20US%20warning.pdf"},{"id":"bt-08sep-11","title":"Oil prices rise to six-week highs on worsening Middle East conflict","source":"BT","date":"08 Sep 2026","tags":["Energy","Geopolitics"],"summary":"Oil prices rose to a six-week high on Monday as Iran vowed to strike energy infrastructure across the Middle East in response to further US attacks, the latest escalation in a conflict that has sharply cut regional supply. Brent crude settled up US$1.03, or 1.1 per cent, at US$97.31 a barrel after touching US$98.06, its highest since Jul 24; WTI rose 1.3 per cent to US$92.65. Goldman Sachs warned prices could reach US$120 if attacks on shipping intensify. The US and Iran traded strikes on tankers and warships over the weekend, and Israeli strikes on southern Lebanon killed at least 12. Saudi Aramco's Jazan refinery was also reportedly attacked. Brent rose about 8 per cent last week; WTI gained nearly 10 per cent.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20BT/Oil%20prices%20rise%20to%20six-week%20highs%20on%20worsening%20Middle%20East%20conflict.pdf"},{"id":"bt-08sep-12","title":"Singapore and Luxembourg working to deepen ties in quantum tech, AI, space, satellite communications","source":"BT","date":"08 Sep 2026","tags":["Technology & AI","Southeast Asia","Geopolitics"],"summary":"Singapore and Luxembourg are working to deepen cooperation in emerging and critical areas including quantum computing, artificial intelligence, and space and satellite communications, Prime Minister Lawrence Wong said during a lunch for his Luxembourg counterpart Luc Frieden. Frieden is on his first official visit as prime minister, from Sept 6 to 8. Wong called Luxembourg a kindred spirit, noting both are small, resource-scarce states surrounded by larger neighbours that turned openness into strength and became major financial hubs. Luxembourg is the largest EU investor in Singapore, which is in turn its second-largest investment destination in the bloc. Wong said the two can bring Asean and the EU closer, marking 50 years of diplomatic ties amid strain on the open, rules-based order.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20BT/Singapore%20and%20Luxembourg%20working%20to%20deepen%20ties%20in%20quantum%20tech,%20AI,%20space,%20satellite%20comm.pdf"},{"id":"bt-08sep-13","title":"Singapore, Hong Kong banks to benefit most as Asia capital markets deepen in H2: Morgan Stanley","source":"BT","date":"08 Sep 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"A Morgan Stanley report says Singapore and Hong Kong banks stand to be key beneficiaries as Asia's capital markets deepen in the second half of the year, driven by rising household wealth, urbanisation and an expanding middle class. Analysts Nick Lord and Selvie Jusman said savings are shifting from deposits and property toward financial assets, moving financial systems from bank-lending-driven to more market-based. Demand for wealth management and private banking should grow, benefiting the two leading financial centres. DBS, OCBC and UOB have built integrated corporate, transaction banking, wealth and capital-markets platforms across Asean, while HSBC, Standard Chartered and Bank of China (Hong Kong) also gain from international flows. Select Malaysian and Thai banks can benefit too.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20BT/Singapore,%20Hong%20Kong%20banks%20to%20benefit%20most%20as%20Asia%20capital%20markets%20deepen%20in%20H2%20Morgan%20Sta.pdf"},{"id":"bt-08sep-14","title":"Thai inflation rises more than expected to 2.53% in August, remains within central bank target","source":"BT","date":"08 Sep 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"Thailand's inflation accelerated more than expected in August but stayed within the central bank's target range, giving policymakers little reason to change course as they focus on supporting a slowing economy. The consumer price index rose 2.53 per cent year on year, up from 1.95 per cent in July and above the 2.43 per cent median forecast, accelerating for the first time in four months. Core inflation rose to 1.44 per cent. The Bank of Thailand kept its benchmark rate at 1 per cent for a third straight meeting in August, within its 1-3 per cent target. Governor Vitai Ratanakorn said weak growth, not prices, is the main risk. The commerce ministry expects full-year inflation of 1.5 to 2.5 per cent, rising near 2.7 per cent in the fourth quarter.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20BT/Thai%20inflation%20rises%20more%20than%20expected%20to%202.53%20in%20August,%20remains%20within%20central%20bank%20tar.pdf"},{"id":"bt-08sep-15","title":"The most AI-confident organisations are often the most exposed","source":"BT","date":"08 Sep 2026","tags":["Technology & AI","Southeast Asia"],"summary":"This commentary warns that the most AI-confident organisations are often the most exposed, as the gap between what firms believe they control and what they can prove widens. Singapore's AI strategy - four National AI missions and a National AI Impact Programme supporting 10,000 SMEs - is accelerating adoption, with 72 per cent of local businesses planning to deploy agentic AI within two years, per Deloitte. Yet only 14 per cent of Singapore leaders report mature governance for agentic AI. AvePoint's 2026 State of AI report found 82.7 per cent of organisations are confident in preventing unauthorised data access, but 62 per cent still had at least one AI-related incident in the past year. It urges shifting from policy-led to infrastructure-led governance via a continuous trust layer.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20BT/The%20most%20AI-confident%20organisations%20are%20often%20the%20most%20exposed.pdf"},{"id":"bt-08sep-16","title":"Trump says Canada’s Bombardier cannot sell in US unless it builds there","source":"BT","date":"08 Sep 2026","tags":["Trade","Politics"],"summary":"US President Donald Trump said Canadian private jet maker Bombardier would no longer be allowed to sell planes in the United States unless it began manufacturing there, posting on Truth Social that its products 'aren't good enough' and demanding it build in the country. The threat comes amid a growing US-Canada trade dispute, with Canada set to introduce a wave of counter tariffs. The White House did not say how Trump would enforce the move or bar deliveries of FAA-approved jets that comply with the USMCA deal. Analyst Richard Aboulafia doubted customers would cancel orders, noting most Bombardier jets use US engines from Honeywell and GE. Bombardier employs 3,500 in the US with 2,800 suppliers, and builds Global 8000 wings in Texas.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20BT/Trump%20says%20Canada's%20Bombardier%20cannot%20sell%20in%20US%20unless%20it%20builds%20there.pdf"},{"id":"bt-08sep-17","title":"UK finance minister Healey seeks to set out brighter vision before tough Budget","source":"BT","date":"08 Sep 2026","tags":["Politics","Finance & Markets"],"summary":"Britain's Chancellor of the Exchequer John Healey used his first major speech since taking office seven weeks ago to set out a brighter economic vision ahead of a tough Budget on Oct 28. Speaking at a manufacturing hub in central England, he announced plans to give city regions greater powers to attract private investment, part of Prime Minister Andy Burnham's devolution agenda, and pledged a 25 per cent cut in regulatory costs by the 2029 election. Much echoed predecessor Rachel Reeves and former PM Keir Starmer. His message was undercut by news that Jaguar Land Rover would cut 4,000 jobs worldwide. Healey declined to detail tax plans as investors worry about inflation from rising oil prices, shrinking budget headroom and spending commitments.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20BT/UK%20finance%20minister%20Healey%20seeks%20to%20set%20out%20brighter%20vision%20before%20tough%20Budget.pdf"},{"id":"bt-08sep-18","title":"UK house prices fall for first time since November 2023","source":"BT","date":"08 Sep 2026","tags":["Finance & Markets","Society"],"summary":"British house prices recorded their first annual fall in nearly three years in August as some buyers held back amid higher borrowing costs following the US-Iran war, Lloyds data showed. Prices fell 0.4 per cent year on year - the first such decline since November 2023 - against economists' expectations for a 0.2 per cent rise. On the month, prices dropped 0.2 per cent, while July's reading was revised to a 0.1 per cent fall. Lloyds' Andrew Asaam said more homeowners are sitting tight rather than cutting prices. By contrast, Nationwide reported 1.6 per cent annual growth. Capital Economics' Ruth Gregory expects further weakness, with two-year fixed mortgage rates nearing 5 per cent, forecasting prices to roughly flatline over the rest of the year.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20BT/UK%20house%20prices%20fall%20for%20first%20time%20since%20November%202023.pdf"},{"id":"bt-08sep-19","title":"What America’s high bond yields and China’s low rates tell us","source":"BT","date":"08 Sep 2026","tags":["Finance & Markets","Geopolitics"],"summary":"Economist Anoop Singh argues that neither high nor low sovereign bond yields are inherently reassuring, as the long-standing distinction between cheap-borrowing advanced economies and premium-paying emerging ones blurs. The US, UK, France and Japan now rank among leaders in government bond yields, while the world's two largest economies diverge: US yields rise as China's fall. The US 30-year Treasury yield recently neared 5.34 per cent, its highest since 2007, driven by persistent fiscal deficits, heavy issuance, a changing investor base and surging corporate borrowing to finance AI - investment-grade issuance may hit a record US$1.9 trillion. Higher yields raise both AI financing and government debt-service costs. Japan, the UK and France face their own variants, pointing to a structurally higher cost of capital.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20BT/What%20America%E2%80%99s%20high%20bond%20yields%20and%20China%E2%80%99s%20low%20rates%20tell%20us.pdf"},{"id":"bt-08sep-20","title":"Why America’s debt binge is starting to matter","source":"BT","date":"08 Sep 2026","tags":["Finance & Markets","Technology & AI"],"summary":"This commentary argues America's long-dismissed debt warnings are finally starting to matter, with runaway debt triggering a global government bond sell-off in August. The first material impact could be higher US interest rates short-circuiting the artificial intelligence boom. Historically, major bubbles popped when borrowing costs rose sharply for the companies at their core. This cycle differs because borrowing excesses have piled up on government books: the US has run deficits near 6 per cent of GDP, more than twice earlier averages, while tech hyperscalers only began heavy borrowing in 2025 to fund AI infrastructure. Interest payments on public debt have more than doubled to over 3 per cent of GDP, a record. The author warns that decisively breaching a 5 per cent long-term rate could derail the AI boom.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20BT/Why%20America's%20debt%20binge%20is%20starting%20to%20matter.pdf"},{"id":"scmp-08sep-01","title":"AI titans' 'circular deals' are starting to look like 'daisy chains'","source":"SCMP","date":"08 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"An SCMP opinion piece argues that the interconnected 'circular deals' among AI titans increasingly resemble the 'daisy chains' of the 1980s savings-and-loan crisis, when interlocking transactions obscured risks and inflated valuations before a third of US thrift banks failed. It describes an ecosystem of multi-year commitments to provide financing, buy semiconductors, secure power and lease data centres. OpenAI has struck deals with Nvidia and CoreWeave, while Anthropic signed a US$35 billion cloud deal with Lambda and a US$45 billion arrangement with Nscale. Nvidia is tied to over US$750 billion in AI investments. The five largest hyperscalers carry roughly US$1.65 trillion in debt via off-balance-sheet structures, raising concerns that revenue may fail to outpace costs.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/AI%20titans'%20'circular%20deals'%20are%20starting%20to%20look%20like%20'daisy%20chains'.pdf"},{"id":"scmp-08sep-02","title":"As clock counts down to Trump summit, Xi boosts global clout with diplomatic blitz","source":"SCMP","date":"08 Sep 2026","tags":["Geopolitics","Politics"],"summary":"With his summit with US President Donald Trump about two weeks away, Xi Jinping has undertaken one of his busiest recent stretches of diplomacy. He wrapped up the Shanghai Cooperation Organisation summit in Bishkek, made a state visit to Egypt, and is expected to visit New Delhi for the Brics summit before travelling to Washington. Observers say the activity aims to strengthen China's negotiating hand and demonstrate that Beijing's foreign relations do not revolve solely around Washington. Analysts including Tsinghua's Sun Chenghao and Columbia's Julian Gewirtz said Xi is showing that China has friends and options globally at a moment when the US is alienating allies, emphasising multilateralism and global governance.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/As%20clock%20counts%20down%20to%20Trump%20summit%2C%20Xi%20boosts%20global%20clout%20with%20diplomatic%20blitz.pdf"},{"id":"scmp-08sep-03","title":"Can gold hit US$5,000? Wall Street turns bullish despite US job growth fuelling rate fears","source":"SCMP","date":"08 Sep 2026","tags":["Finance & Markets","Energy"],"summary":"Investment banks forecast gold will probably test US$5,000 an ounce by end-2026, driven by strong central-bank demand for reserve diversification, countering fears of US monetary tightening after robust labour data and hawkish Federal Reserve signals. RBC Capital Markets forecasts US$4,929 by year-end and US$5,296 in 2027, aligning with Goldman Sachs (US$4,900) and State Street (US$5,000), implying at least a 10 per cent gain from current levels. Gold remains in favour even as expectations mount for higher US rates, which traditionally weigh on the non-yielding metal. State Street's Aakash Doshi said the inverse correlation between gold and borrowing costs is breaking down amid fiscal-discipline concerns and relentless Treasury sales, fuelling the so-called debasement trade.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/Can%20gold%20hit%20US5%2C000%20Wall%20Street%20turns%20bullish%20despite%20US%20job%20growth%20fuelling%20rate%20fears.pdf"},{"id":"scmp-08sep-04","title":"Canada set to hit back at Trump tariffs, risking wider trade war","source":"SCMP","date":"08 Sep 2026","tags":["Trade","Geopolitics"],"summary":"Canada is poised to impose tariffs of 15 to 50 per cent on hundreds of US products from Tuesday, as Prime Minister Mark Carney bets that standing up to President Donald Trump will strengthen Ottawa's negotiating position with its biggest trading partner. The import tax on many US steel items rises to 50 per cent from 25 per cent, with tariffs also applied to motorcycles, cosmetics, cheese and other consumer goods. The measures will hit exporters hard in states such as Michigan and Ohio. Trump officials have said they will not tolerate retaliation, noting only Canada and China have used counter-tariffs. Negotiators had appeared close to a deal in August before talks fell apart.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/Canada%20set%20to%20hit%20back%20at%20Trump%20tariffs%2C%20risking%20wider%20trade%20war.pdf"},{"id":"scmp-08sep-05","title":"China and Russia launch first sea ice survey aboard Xuelong 2 as Arctic tensions swell","source":"SCMP","date":"08 Sep 2026","tags":["Environment","Geopolitics"],"summary":"China and Russia have conducted their first joint on-site sea ice survey in the Arctic Ocean aboard the Xuelong 2 research icebreaker, as tensions rise over economic opportunities in the warming region. Two researchers from Russia's Arctic and Antarctic Research Institute joined China's 16th Arctic Ocean Expedition, according to state broadcaster CCTV. Lin Long, captain of the Xuelong 2 sea ice team, called the joint observation more practical than previous voyages, with teams recording ice concentration, thickness, snow cover and atmospheric factors. The observations could complement satellite sensing and improve understanding of climate change. Rapid melting has opened new shipping routes, drawing attention from Russia, the US and China, which sees itself as a 'near Arctic' nation.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/China%20and%20Russia%20launch%20first%20sea%20ice%20survey%20aboard%20Xuelong%202%20as%20Arctic%20tensions%20swell.pdf"},{"id":"scmp-08sep-06","title":"China hits critical Japanese chipmaking chemical with steep anti-dumping measures","source":"SCMP","date":"08 Sep 2026","tags":["Trade","Technology & AI"],"summary":"China will impose provisional anti-dumping duties of up to 99.2 per cent on Japanese dichlorosilane, a critical chemical used in chipmaking, after an eight-month investigation found dumped imports had harmed local manufacturers. The Ministry of Commerce announced the preliminary ruling on Monday, requiring importers to pay corresponding cash deposits from Tuesday. Shipments from Denal Silane face a lower 80.8 per cent rate, while others including Shin-Etsu Chemical face the maximum. Japan dominates production, with top three producers Shin-Etsu, Nippon Sanso and Sumitomo Seika all Japanese, while China has relied heavily on imports. Dichlorosilane is mainly used in thin-film deposition. The move comes amid continued bilateral friction between Beijing and Tokyo.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/China%20hits%20critical%20Japanese%20chipmaking%20chemical%20with%20steep%20anti-dumping%20measures.pdf"},{"id":"scmp-08sep-07","title":"China vows deeper cooperation with Qatar in energy, AI and Middle East de-escalation","source":"SCMP","date":"08 Sep 2026","tags":["Geopolitics","Energy"],"summary":"Chinese Premier Li Qiang pledged to deepen cooperation with Qatar in energy, investment, AI and diplomatic efforts to de-escalate Middle East tensions, during a Monday meeting in Beijing with Qatari Prime Minister and Foreign Minister Sheikh Mohammed bin Abdulrahman Al Thani, on a two-day state visit. The talks came as Beijing and Doha navigate a volatile regional security environment and seek to ensure navigation through the Strait of Hormuz, a chokepoint for China's energy imports and Qatar's LNG exports, which supply nearly a third of China's LNG demand. Iran said talks with Oman on temporary safe passage through the strait were in their final stage. Li called Qatar an important strategic partner and backed its regional mediation role.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/China%20vows%20deeper%20cooperation%20with%20Qatar%20in%20energy%2C%20AI%20and%20Middle%20East%20de-escalation.pdf"},{"id":"scmp-08sep-08","title":"China warns against 'third party' interference after reports of US pressure on Mexico","source":"SCMP","date":"08 Sep 2026","tags":["Geopolitics","Trade"],"summary":"China's Foreign Minister Wang Yi warned that relations between China and Mexico should not be influenced by outside powers, following reports that the United States was pressuring its neighbour over ties to Beijing. Meeting Mexican counterpart Roberto Velasco Alvarez on Monday, Wang said China-Mexico relations are not directed at any third party and pledged support for Mexico in safeguarding its sovereignty, security and independence against external interference. Velasco, on his first official Beijing visit since April, emphasised shared respect for sovereignty and equality and a willingness to deepen pragmatic cooperation. He noted Mexico will host the Apec forum in 2028. Both sides exchanged views on international issues and pledged to jointly promote the unity of the Global South.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/China%20warns%20against%20'third%20party'%20interference%20after%20reports%20of%20US%20pressure%20on%20Mexico.pdf"},{"id":"scmp-08sep-09","title":"China's Moonshot and Z.ai bring AI model subscription race to Tmall's retail shelves","source":"SCMP","date":"08 Sep 2026","tags":["Technology & AI","Trade"],"summary":"China's AI developers are competing for paying users on a new consumer front: Alibaba's Tmall, where AI subscription plans are sold alongside smartphones, skincare and luxury fashion. Moonshot AI, developer of the Kimi K3 model, and MiniMax were in talks to open official flagship stores, sources told the SCMP. Beijing-based Z.ai, or Zhipu AI, kicked off the trend by selling subscriptions to its GLM Coding Plan, after which Tmall launched an 'AI Space Station' marketplace for buying subscriptions and topping up tokens from Alibaba Cloud, Z.ai, MiniMax and DeepSeek. Within 48 hours of Z.ai's launch, transactions involving AI tokens across Taobao and Tmall jumped over 160 per cent, as developers seek to convert soaring user numbers into recurring revenue.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/China's%20Moonshot%20and%20Z.ai%20bring%20AI%20model%20subscription%20race%20to%20Tmall's%20retail%20shelves.pdf"},{"id":"scmp-08sep-10","title":"China's Xiaomi unveils folding phone with home-grown chip as it takes on Apple, Huawei","source":"SCMP","date":"08 Sep 2026","tags":["Technology & AI"],"summary":"Xiaomi unveiled new products on Monday, from a flagship foldable phone with proprietary chips to new Skynomad SUV models, underscoring its push to compete with Tesla, Apple and Huawei. The Beijing-based firm launched the 18 Fold, a foldable with a 7.58-inch inner display, a proprietary Xring O3 system-on-chip and LPDDR6 memory from CXMT. Founder Lei Jun said the phone features a new hinge, high-strength aluminium frame and strengthened cover glass. The Xring O3, an AI processor with 24 billion transistors, offers 60 per cent higher CPU performance than the O1 with 25 per cent lower power consumption in some tasks. The 18 Fold sells from 10,999 yuan (US$1,639), with sales from Thursday. Xiaomi has earmarked 50 billion yuan for its chip effort.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/China's%20Xiaomi%20unveils%20folding%20phone%20with%20home-grown%20chip%20as%20it%20takes%20on%20Apple%2C%20Huawei.pdf"},{"id":"scmp-08sep-11","title":"China's brokers expected to continue robust performance with blockbuster IPO offerings","source":"SCMP","date":"08 Sep 2026","tags":["Finance & Markets"],"summary":"Chinese brokers delivered strong first-half profits, driven by active A-share trading that boosted brokerage revenues by over 50 per cent, with blockbuster IPOs expected to make underwriting a key growth engine in the second half. The industry recorded robust performance, with 150 brokers posting an average 23.5 per cent year-on-year net profit increase and a 31 per cent surge in operating revenue, according to the Securities Association of China. Brokerage income jumped 51 per cent, while investment advisory net revenue soared 57.24 per cent. Citibank forecast covered Chinese brokers would achieve a return on equity of about 11 per cent in 2026, implying 36 per cent upside for H-share brokers. Top players Citic Securities and Guotai Haitong generated 96.9 billion yuan in first-half revenue.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/China's%20brokers%20expected%20to%20continue%20robust%20performance%20with%20blockbuster%20IPO%20offerings.pdf"},{"id":"scmp-08sep-12","title":"China's leading EV battery makers' profits nearly double that of industry's carmakers","source":"SCMP","date":"08 Sep 2026","tags":["Finance & Markets","Energy"],"summary":"China's EV battery makers saw combined first-half net profit nearly double that of the country's major carmakers, widening the profitability gap amid weakening domestic EV demand. Seven major battery manufacturers, including CATL, recorded net profit of over 50 billion yuan (US$7.4 billion) in the January-June period, up 49 per cent year on year. By contrast, China's 11 major EV makers, from BYD to Great Wall Motor, saw combined interim net profit shrink 19 per cent to 28.8 billion yuan. The battery makers' combined profit was 75 per cent higher than the carmakers', versus a minor lag a year earlier. China's retail EV sales fell 14 per cent to about 4.7 million units amid a subsidy pullback. Analysts said price wars are squeezing downstream operators.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/China's%20leading%20EV%20battery%20makers'%20profits%20nearly%20double%20that%20of%20industry's%20carmakers.pdf"},{"id":"scmp-08sep-13","title":"China's new property presale rules risk prolonging sector downturn","source":"SCMP","date":"08 Sep 2026","tags":["Finance & Markets","Society"],"summary":"An SCMP analysis examines China's new property presale rules, which put homebuyers first but risk transferring financial risk to already-strained developers and prolonging the sector downturn. On August 28, Beijing announced measures to rebuild trust in the completion of pre-sold homes and put the residential market on firmer footing. A key reform raised the threshold for presales to topping out the main building structure and required mortgage proceeds to be held in supervised escrow accounts until completion. Nomura said deferring funding release effectively dismantles the financing function of presales, while Standard Chartered noted a shift towards project-based financing. At the 2020-21 peak, presales accounted for nearly 90 per cent of residential floor space sales, contributing to excessive leverage.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/China's%20new%20property%20presale%20rules%20risk%20prolonging%20sector%20downturn.pdf"},{"id":"scmp-08sep-14","title":"Chinese firms' green-tech expansion hinges on Hong Kong, senior bankers say","source":"SCMP","date":"08 Sep 2026","tags":["Finance & Markets","Environment"],"summary":"Hong Kong is poised to play a bigger role in financing Chinese green-technology firms' expansion into emerging markets, as geopolitical fragmentation and high funding costs reshape capital deployment in the energy transition, senior bankers said. The city's deep sustainable-finance market and offshore yuan liquidity could channel capital into green and climate-resilience projects across developing economies, executives from Bank of China (Hong Kong), DBS, HSBC and Standard Chartered said at a Monday forum organised by the Hong Kong Green Finance Association. Chinese firms in solar, wind and batteries are increasingly taking solutions to the Global South. Bank of China (Hong Kong) deputy CEO Wang Huabin called the city a bridge for Chinese green tech going global, though finding projects with strong returns remains a challenge.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/Chinese%20firms'%20green-tech%20expansion%20hinges%20on%20Hong%20Kong%2C%20senior%20bankers%20say.pdf"},{"id":"scmp-08sep-15","title":"How China's green tech is undercutting Trump's 'drill, baby, drill' oil strategy in Africa","source":"SCMP","date":"08 Sep 2026","tags":["Energy","Geopolitics"],"summary":"An SCMP feature contrasts the US 'drill, baby, drill' oil strategy with China's push into renewables, arguing China's green tech is undercutting Washington's approach in Africa. With China's advances in solar and battery technology making acquisitions cheaper, a consensus is coalescing across the continent around renewables, driven by cost. Global Solar Council CEO Sonia Dunlop said Africa's solar revolution is spreading to new markets, with rooftop and distributed systems empowering households. She noted wars in Ukraine and the Middle East delivered two major fossil-fuel supply shocks in four years. Africa's solar additions surged a record 54 per cent in 2025, adding up to 4.5 gigawatts. China has developed projects including Egypt's 1.8GW Benban Solar Park, allowing nations to bypass fossil-fuel price shocks.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/How%20China's%20green%20tech%20is%20undercutting%20Trump's%20'drill%2C%20baby%2C%20drill'%20oil%20strategy%20in%20Africa.pdf"},{"id":"scmp-08sep-16","title":"How Tokyo is widening regional defence ties to complicate Beijing's Taiwan calculus","source":"SCMP","date":"08 Sep 2026","tags":["Defence","Geopolitics"],"summary":"In the first of a three-part series, SCMP examines how Japan is building a network of defence partnerships to strengthen strategic endurance amid the risk of conflict over Taiwan. Tokyo is rapidly building a web of partnerships spanning the Indo-Pacific and beyond, a move that may bolster its ability to withstand a prolonged conflict and complicate Beijing's calculations. The push was on display in Australia, where Tokyo and Canberra deepened cooperation from defence planning to warship construction. Japan is connecting regional military ties with defence-industrial partnerships across North America and Europe. While the US remains its only treaty ally, Tokyo is complementing that with cooperation involving Australia, the Philippines and others. Analysts say the aim is not a Nato-style coalition.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/How%20Tokyo%20is%20widening%20regional%20defence%20ties%20to%20complicate%20Beijing's%20Taiwan%20calculus.pdf"},{"id":"scmp-08sep-17","title":"How can Hong Kong, Central Asia build momentum on growing ties and go beyond MOUs?","source":"SCMP","date":"08 Sep 2026","tags":["Trade","Finance & Markets"],"summary":"About three months after Hong Kong Chief Executive John Lee visited Central Asia, momentum is building for closer economic ties, with potential cooperation extending beyond finance to tourism, professional services, mining, agriculture and digital infrastructure. Officials and industry figures discussed prospects at the SCMP's inaugural China Conference: Central Asia 2026, held in Astana, Kazakhstan. Business leaders said the real test over the next 12 to 24 months would be whether agreements translate into lasting commercial relationships beyond memorandums of understanding. Nicholas Ho, Hong Kong's commissioner for Belt and Road, said interest had increased on both sides, including from mainland companies wanting to use Hong Kong as a hub to access Central Asia. Lee's June trip yielded 96 agreements worth over US$1.65 billion.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/How%20can%20Hong%20Kong%2C%20Central%20Asia%20build%20momentum%20on%20growing%20ties%20and%20go%20beyond%20MOUs.pdf"},{"id":"scmp-08sep-18","title":"How generative AI helps SenseTime turn a profit even as Chinese peers struggle","source":"SCMP","date":"08 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Chinese AI pioneer SenseTime is carving a unique path to profitability by steering away from a blind chase for model size, focusing instead on helping clients complete enterprise tasks, executives told the SCMP. After reporting net profit of 617.3 million yuan (US$92.0 million) for the first half of 2026, CEO Xu Li and CFO Wang Zheng outlined a pivot towards AI productivity tools and solo entrepreneurs. It marks SenseTime's first-ever first-half profit under IFRS since its 2021 Hong Kong listing, with revenue up 23.4 per cent to 2.91 billion yuan. The result contrasts with peers MiniMax and Z.ai, which posted net losses despite triple-digit revenue growth. Xu said SenseTime's core capabilities each form an independent commercial closed loop, driven by rapid generative-
