ctions on entities helping Russia bypass restrictions have been paused for 17 months, even as peace talks stalled. In a letter to Secretary of State Marco Rubio and Treasury Secretary Scott Bessent, they noted the last major sanctions came in October 2025 against oil firms Rosneft and Lukoil, which they call a one-off that Russia easily evades. They cited Bessent's February pledge to \"see where the peace talks go\" and Rubio's May remark that talks were not fruitful. The senators seek a response by Aug 28. A new Senate sanctions bill passed this month but faces an uncertain future over tariff powers.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/Senators%20press%20Rubio,%20Bessent%20on%20lack%20of%20counter-evasion%20sanctions%20on%20Russia.pdf"}, {"id": "st-14", "title": "Taiwan's Foxconn reports 35% rise in Q2 profit on AI demand, beats forecasts", "source": "ST", "date": "13 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Taiwan's Foxconn, the world's largest contract electronics maker, reported on Aug 12 a 35 per cent rise in second-quarter net profit to NT$59.97 billion (S$2.38 billion), beating an LSEG consensus of NT$58.8 billion, driven by strong AI demand. Its cloud and networking segment, including AI servers, exceeded 50 per cent of revenue for the first time at 51 per cent, while smart consumer electronics, including iPhones, made up 29 per cent. Rotating CEO Michael Chiang said Nvidia's Vera Rubin server racks enter mass-production prep in the third quarter, with shipments beginning in the fourth, cautioning that 2027 output hinges on TSMC's CoWoS capacity. Foxconn forecasts a 30 per cent capex rise in 2026 and is building factories in Mexico and Texas.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/Taiwan's%20Foxconn%20reports%2035%20per%20cent%20rise%20in%20Q2%20profit%20on%20AI%20demand,%20beats%20forecasts.pdf"}, {"id": "st-15", "title": "Two-thirds of Sentosa Cove properties resold at a loss, with average loss topping $1m since 2023", "source": "ST", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Society"], "summary": "Nearly two-thirds of Sentosa Cove properties changed hands at a loss over the past three years, with Mogul.sg data showing 64.5 per cent of resale deals between May 2023 and June 2026 were unprofitable, up from 62.8 per cent earlier. The average loss narrowed to $1.28 million, while gross gains on profitable resales fell about 62 per cent to $655,590. Steep stamp-duty hikes for foreign buyers since 2023 have curtailed demand at the 99-year-leasehold enclave, Singapore's only spot where foreigners may buy landed homes. Landed homes fared slightly better, with about half above water. Cushman & Wakefield and Newmark echoed the trend. Analysts cite a small buyer pool, decaying leases and no new land sales since 2008.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/Two-thirds%20of%20Sentosa%20Cove%20properties%20resold%20at%20a%20loss,%20with%20average%20loss%20topping%201m%20since%202023.pdf"}, {"id": "st-16", "title": "US consumer inflation slows in July, giving Fed room to breathe", "source": "ST", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Energy"], "summary": "US consumer inflation slowed slightly to 3.4 per cent in July despite turbulent oil prices from the Iran war, government data showed on Aug 12, potentially giving the Federal Reserve room on interest rates. The consumer price index rose 0.1 per cent from a month earlier but fell year on year, in line with economists' forecasts. Inflation remains well above the Fed's 2 per cent target after spiking to a three-year high of 4.2 per cent in May from 2.4 per cent in February. Energy led price gains, with petrol up 24.6 per cent and fuel oil up 39.1 per cent year on year, though the energy index fell 1.5 per cent from a month ago. Core CPI rose 2.5 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/US%20consumer%20inflation%20slows%20in%20July,%20giving%20Fed%20room%20to%20breathe.pdf"}, {"id": "st-17", "title": "Ukraine halts strikes on tankers using Russian port at US request, FT says", "source": "ST", "date": "13 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "Ukraine has paused drone strikes on oil tankers using Russia's Black Sea port of Novorossiysk after a request from US Vice-President JD Vance, the Financial Times reported on Aug 12, citing Ukrainian officials. Last month's request followed US alarm that Ukraine was destabilising oil markets and harming US firms by targeting tankers carrying Kazakh crude piped to a Caspian Pipeline Consortium terminal. Washington warned Kyiv to \"cease and desist\" from hitting non-Russian vessels and CPC infrastructure, which it views as an alternative to Russian energy. Ukraine reaffirmed it will refrain from such targeting. Black Sea drone attacks took out up to a fifth of CPC oil loadings in July, and Kazakhstan's output fell 14 per cent versus June.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/Ukraine%20halts%20strikes%20on%20tankers%20using%20Russian%20port%20at%20US%20request,%20FT%20says.pdf"}, {"id": "st-18", "title": "Yen intervention puts China's renminbi under more pressure", "source": "ST", "date": "13 Aug 2026", "tags": ["Finance & Markets"], "summary": "China's renminbi has come under more upward pressure since the US and Japan moved to strengthen the yen, according to Bloomberg Economics, potentially draining growth support as the currency gains despite falling bond yields and a sluggish economy. Economists David Qu and Chang Shu said the late-July intervention spilled over to Asian currencies, exacerbating a yuan rally at odds with its widening yield disadvantage against the dollar. The won, Singapore dollar and Taiwan dollar are most correlated to the yen. Booming export demand has made the renminbi Asia's best performer, up about 3.6 per cent in 2026. Bloomberg Economics says a stronger currency \"opens a window\" for a 10-basis-point PBOC rate cut to 1.3 per cent before year-end.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/Yen%20intervention%20puts%20China's%20renminbi%20under%20more%20pressure.pdf"}, {"id": "bt-01", "title": "ABN Amro beats on profit, boosts key revenue source outlook", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets"], "summary": "ABN Amro reported second-quarter net income of 780 million euros (US$900 million), beating the 660.1 million euro average analyst estimate on higher fees and lending income, and lifted its 2026 commercial net interest income outlook to 6.8 billion euros from about 6.4 billion. Fees rose 25 per cent and net interest income 11 per cent, both boosted by geopolitical-driven market activity in clearing and wealth. CEO Marguerite Berard is expanding clearing and private banking while cutting jobs and deploying AI. Shares rose as much as 6.3 per cent to their highest since ABN's 2015 relisting. The bank recently completed its 875 million euro NIBC Bank acquisition from Blackstone. The Dutch state's stake is now about a fifth.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/ABN%20Amro%20beats%20on%20profit,%20boosts%20key%20revenue%20source%20outlook.pdf"}, {"id": "bt-02", "title": "AEM's H1 net profit rises 10 times to S$30.8 million on stronger AI chip demand", "source": "BT", "date": "13 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Semiconductor test-equipment maker AEM posted a first-half net profit of about S$31 million for the half year ended Jun 30, up from S$3.1 million a year earlier, driven by stronger demand from AI chipmakers. Revenue grew 30 per cent to S$247.2 million, led by its fabless AI and high-performance computing customer, which became its largest contributor. Earnings per share reached S$0.0979, from S$0.0098. AEM raised FY2026 revenue guidance to S$630 million-S$680 million, from S$550 million-S$600 million, citing customer ramp-ups and its first memory final test handler shipment in Q4. Its AMPS platform backlog exceeds S$400 million. An interim dividend of S$0.024 was declared. Shares rose 0.9 per cent to S$9.63.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/AEM's%20H1%20net%20profit%20rises%2010%20times%20to%20S30.8%20million%20on%20stronger%20AI%20chip%20demand.pdf"}, {"id": "bt-03", "title": "After a strong Q2, what's next for Singapore banks? Analysts see DBS, OCBC ahead on wealth", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Analysts are split on Singapore's three banks after Q2 results, with wealth management the key differentiator in a lower-rate environment. All beat expectations: DBS net profit rose 9 per cent to S$3.08 billion, OCBC 22 per cent to S$2.22 billion, and UOB 10 per cent to S$1.48 billion. Analysts favoured DBS and OCBC for strong wealth performances and positive earnings outlooks, with Maybank citing DBS's over-17 per cent medium-term ROE. UOB faces asset-quality concerns over Greater China commercial real estate, a weaker fee outlook, and a S$200 million non-recurring divestment boost; RHB upgraded it as a \"value play\" on a 48 per cent discount. Shares: DBS S$76.99, OCBC S$31.36, UOB S$42.16.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/After%20a%20strong%20Q2,%20what's%20next%20for%20Singapore%20banks%20Analysts%20see%20DBS,%20OCBC%20ahead%20on%20wealth.pdf"}, {"id": "bt-04", "title": "Analysts raise DBS targets to as high as S$81 after record Q2 net profit", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Analysts raised DBS target prices after the bank posted a record Q2 net profit of S$3.08 billion, with at least two forecasting shares to touch S$80. RHB lifted its target to S$81.20 from S$75.70 with a \"buy\", while UOB Kay Hian's Jonathan Koh raised his to S$80 from S$76.85, citing a 42 per cent jump in wealth management fees and wealth AUM topping S$500 billion at S$516 billion. OCBC's Carmen Lee raised her target to S$78 from S$60.93 but kept a \"hold\", while Macquarie held S$70.86 with \"outperform\". Net interest margin slipped two basis points to 1.87 per cent. DBS declared a total Q2 dividend of S$0.81 and has S$2.6 billion left of its buyback programme. Shares stood at S$76.99.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Analysts%20raise%20DBS%20targets%20to%20as%20high%20as%20S81%20after%20record%20Q2%20net%20profit.pdf"}, {"id": "bt-05", "title": "Bank of America launches US$250 billion initiative for US tech, energy infrastructure", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Energy", "Technology & AI"], "summary": "Bank of America said it plans to deploy US$250 billion through July 2027 to support US digital and infrastructure projects under its \"Critical Infrastructure Finance Initiative\", launched around the nation's 250th anniversary. The programme will include primary market lending, investments, capital markets services and advisory, spanning digital infrastructure such as data centres, energy and power infrastructure including renewables and storage, and core infrastructure such as transportation and natural gas. The bank says it will bolster economic growth and create tens of thousands of jobs. It follows Morgan Stanley's pledge to facilitate roughly US$1.5 trillion over the next decade. The amount is based on eligible activity over 18 months from January 1, 2026, through July 4, 2027.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Bank%20of%20America%20launches%20US250%20billion%20initiative%20for%20US%20tech,%20energy%20infrastructure.pdf"}, {"id": "bt-06", "title": "CICT H1 DPU up 7.1% at S$0.0602, bolstered by CapitaSpring and Gallileo tower in Germany", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "CapitaLand Integrated Commercial Trust posted a first-half distribution per unit of S$0.0602 for the period ended June, up 7.1 per cent from S$0.0562, despite an enlarged unit base from a private placement funding its Paragon acquisition. Net property income rose 8.7 per cent to S$630.5 million and revenue 7.5 per cent to S$846.8 million, led by CapitaSpring and lease commencement at Gallileo in Germany. Distributable income climbed 13.3 per cent to S$466.7 million. CEO Tan Choon Siang expects robust performance to continue, citing Paragon contributions, positive rental reversions and upgraded suburban malls. Portfolio occupancy was 95.6 per cent and aggregate leverage 37.4 per cent. Units closed 0.8 per cent lower at S$2.49.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/CICT%20H1%20DPU%20up%207.1%20at%20S0.0602,%20bolstered%20by%20CapitaSpring%20and%20Gallileo%20tower%20in%20Germany.pdf"}, {"id": "bt-07", "title": "Can the G20 survive Trump and deepening global fractures?", "source": "BT", "date": "13 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "This commentary argues the G20, created in 1999 with US help, is increasingly riven by geopolitical splits and enjoys only fragile support from the Trump administration, weakening its ability to defuse the next crisis. It contrasts the 2009 summit's coordinated US$1.1 trillion stimulus with Trump's disinterest in multilateralism. In 2025 the US boycotted South Africa's G20 over discredited \"white genocide\" claims; this year South Africa was not invited to US-hosted events, with Poland given a seat instead. The Miami Leaders Summit will be held at Trump's Doral golf club. Russia alleges the US failed as host, and a US-pushed \"new G20\" agenda favours energy, AI and immigration while sidelining climate. The writer is an LSE IDEAS associate.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Can%20the%20G20%20survive%20Trump%20and%20deepening%20global%20fractures.pdf"}, {"id": "bt-08", "title": "Commonwealth Bank of Australia's record profit is clouded by 15% mortgage application slump", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets"], "summary": "Commonwealth Bank of Australia posted a record full-year cash profit of A$10.98 billion (US$7.75 billion), up 7.1 per cent and beating consensus, but flagged a 15 per cent drop in mortgage applications since May property tax changes and warned of a slowing economy. Investor lending applications fell 28 per cent. Rivals Westpac and NAB reported similar declines of 20 and 15 per cent. Auction clearance rates hit six-year lows and prices fell about 2 per cent over four months. Net interest margin slipped three basis points to 2.05 per cent, and loan impairment expense rose 9 per cent to A$788 million. CBA, up 7.1 per cent this year, remains richly valued. It declared a record final dividend of A$2.70.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Commonwealth%20Bank%20of%20Australia's%20record%20profit%20is%20clouded%20by%2015%20mortgage%20application%20slump.pdf"}, {"id": "bt-09", "title": "Dollar ticks up on Iran tension, with US data in focus", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "The dollar ticked higher on renewed Gulf tensions as markets awaited US inflation data for Fed policy signals. Oil edged up after the US and Yemen's Houthis reported separate shipping attacks, with Teheran keeping the Strait of Hormuz closed. Investors sought the safe-haven dollar amid energy-shock concerns. Analysts said Friday's soft jobs data did not weigh heavily, with inflation seen driving the Fed's next move; Chicago Fed's Goolsbee stressed inflation over labour weakness. Fed funds futures imply a 50 per cent chance of no September change. The dollar index rose 0.05 per cent to 99.85 and the euro slipped to US$1.1536. The yen weakened to 159.38 despite joint US-Japan intervention, while the NZ dollar fell after PM Luxon won a confidence vote.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Dollar%20ticks%20up%20on%20Iran%20tension,%20with%20US%20data%20in%20focus.pdf"}, {"id": "bt-10", "title": "Global 2026 oil supply shortfall to deepen as Hormuz reopening remains elusive", "source": "BT", "date": "13 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "The International Energy Agency said global oil supply will fall 4.3 million barrels per day, or about 4 per cent, in 2026 as renewed Middle East hostilities disrupt supplies, deepening the market deficit. The forecast worsened from July's 3.7 million bpd drop, taking total supply to a low of 102.02 million bpd, around 1.27 million bpd below demand. Middle East loadings dropped from 20 million bpd in early July to 12 million bpd later. The IEA sees a 1.8 million bpd deficit in July-September, the deepest since Q4 2021, and cut 2026 demand by 1.6 million bpd. It expects a 4.61 million bpd surplus in 2027 assuming de-escalation. Opec, by contrast, still sees demand growing 580,000 bpd. Russian refining stayed near a 20-year low.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Global%202026%20oil%20supply%20shortfall%20to%20deepen%20as%20Hormuz%20reopening%20remains%20elusive.pdf"}, {"id": "bt-11", "title": "Global data centre insurance premiums projected to be over US$24 billion by 2030", "source": "BT", "date": "13 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "The global data centre insurance market is projected to exceed US$24 billion by 2030, up from around US$11 billion today, as rising capacity and complexity make comprehensive cover a financing prerequisite for large AI infrastructure projects, Allianz Commercial said in a report. Single AI campus construction costs can exceed US$20 billion. Fire was the most expensive loss cause, accounting for nearly 60 per cent of 677 million euros (US$781.6 million) in analysed industry claims across 221 cases; natural catastrophes and wilful acts followed. Europe made up 38 per cent of claims value, North America 36 per cent and Asia 21 per cent. Business interruption was the primary severity driver. The US and China are expected to account for about 62 per cent of new capacity additions to 2030.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Global%20data%20centre%20insurance%20premiums%20projected%20to%20be%20over%20US24%20billion%20by%202030.pdf"}, {"id": "bt-12", "title": "Gold rises to over two-month high as US inflation data dampens rate hike bets", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets"], "summary": "Gold advanced to a two-month high after a subdued US inflation report eased near-term pressure on the Federal Reserve to hike rates, reducing the likelihood of tightening at its September meeting. Bullion climbed as much as 0.9 per cent to near US$4,450 an ounce, building on a similar Wednesday gain after data showed consumer prices rose just 0.1 per cent in July, suggesting the Iran-war energy shock continued to fade. Investors also await Fed chairman Kevin Warsh's Jackson Hole remarks. Gold has rallied above the US$4,000 threshold, backed by central bank buying notably from China, and topped its 100-day moving average for the first time since April. Spot gold rose 0.5 per cent to US$4,429.70; silver gained 1 per cent to US$65.94.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Gold%20rises%20to%20over%20two-month%20high%20as%20US%20inflation%20data%20dampens%20rate%20hike%20bets.pdf"}, {"id": "bt-13", "title": "Iran says no progress on reviving interim peace deal with US", "source": "BT", "date": "13 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "Iran and the US remain at loggerheads over ending the Gulf war, with a senior Iranian source saying there had been no progress reviving the interim deal agreed in June, which quickly unravelled. The US accuses Iran of failing to reopen the Strait of Hormuz; Teheran says Washington reneged on lifting a port blockade and releasing frozen assets. Trump said the US has \"total control\" over Hormuz, but Iran's Persian Gulf Strait Authority said it stays blocked until conditions are met. The Iranian source dismissed reports of a 60-day extension. Thousands have died since US-Israel attacks on Iran began Feb 28. Brent peaked at US$126 during the war and traded around US$88; WTI around US$83. Tuesday saw fresh shipping attacks.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Iran%20says%20no%20progress%20on%20reviving%20interim%20peace%20deal%20with%20US.pdf"}, {"id": "bt-14", "title": "Jane Street repaying US$5.5 billion loan in overhaul of debt load", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets"], "summary": "Jane Street is repaying US$5.5 billion of floating-rate loans as part of a broader overhaul of its US$11 billion debt load, S&P Global Ratings said. The market-making giant is also poised to refinance US$5.6 billion of bonds via US$14.6 billion of new senior-secured notes maturing in 2031, 2033 and 2036, and is expected to use some proceeds to fund technology infrastructure and expand trading strategies, per Fitch. S&P rated the deal BB, two rungs below investment grade, citing Jane Street's strong profitability and expanding franchise; Fitch's issuer default rating is BBB-. The firm generated a record US$39.6 billion of trading revenue in 2025 and is in talks with Pimco among others. A refinancing could limit disclosures to a smaller group of investors.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Jane%20Street%20repaying%20US5.5%20billion%20loan%20in%20overhaul%20of%20debt%20load.pdf"}, {"id": "bt-15", "title": "MAS eases family office tax rules, widens AML checks as Singapore vies for global wealth", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "The Monetary Authority of Singapore has made it simpler for single-family offices to qualify for tax incentives, easing hiring, AUM-monitoring and local-spending requirements even as it tightens scrutiny over sources of wealth, per a Jul 31 circular effective Aug 1. New applicants can start with fewer investment professionals, continuous AUM tracking is scrapped, and eligible donations and local investments count at double value. Separately, the 5 per cent cap on precious metals was removed. AML screening was widened to include anyone contributing to the source of funds, applied retroactively, with a three-month grace period to open a local bank account. Singapore had over 2,000 incentivised SFOs at end-2025; industry AUM grew 10.1 per cent to S$6.7 trillion.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/MAS%20eases%20family%20office%20tax%20rules,%20widens%20AML%20checks%20as%20Singapore%20vies%20for%20global%20wealth.pdf"}, {"id": "bt-16", "title": "Norway wealth fund posts record US$184 billion profit in first half of 2026", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Norway's US$2.3 trillion sovereign wealth fund, the world's largest, posted a record profit of 1.75 trillion crowns (US$184.3 billion) for the first half, lifted by technology stocks, particularly Asian names. The fund owns on average 1.5 per cent of all listed companies globally. CEO Nicolai Tangen said the top 10 holdings now represent 20 per cent of the fund's value, mostly tech, raising concentration risk: \"It's chips, chips, chips.\" The fund disclosed a 0.05 per cent SpaceX stake worth US$1.22 billion, modest against holdings such as US$62 billion in Nvidia, US$52 billion in Apple and US$50 billion in Alphabet. It is invested in around 7,100 companies. Management warned future wars and depression could wipe out much of its value.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Norway%20wealth%20fund%20posts%20record%20US184%20billion%20profit%20in%20first%20half%20of%202026.pdf"}, {"id": "bt-17", "title": "Nvidia-backed CoreWeave boosts 2026 spending plan, beats quarterly estimates on AI demand surge", "source": "BT", "date": "13 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "CoreWeave lifted its annual capital spending forecast after beating second-quarter estimates, betting on surging AI cloud demand and sending shares more than 14 per cent higher in extended trading. The Nvidia-backed neocloud raised 2026 revenue and adjusted operating profit targets, citing a ballooning order book. Revenue backlog reached US$104.2 billion, up from US$99.4 billion, with over US$25 billion of net new commitments this quarter. Q2 revenue more than doubled to US$2.58 billion, beating estimates, with a smaller-than-expected adjusted loss of US$1.03 per share. Full-year capex was raised to US$35 billion-US$39 billion from US$31 billion-US$35 billion. CEO Michael Intrator said near-term capacity is effectively sold out, letting it secure increasingly favourable terms. Customers include Meta, Anthropic and Microsoft.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Nvidia-backed%20CoreWeave%20boosts%202026%20spending%20plan,%20beats%20quarterly%20estimates%20on%20AI%20demand%20surge.pdf"}, {"id": "bt-18", "title": "Oil prices edge up as investors weigh US-Iran talks deadlock against lower demand", "source": "BT", "date": "13 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "Oil prices rose slightly on Wednesday as Middle East shipping attacks continued and US-Iran talks hit an impasse, though gains were limited by cuts to 2026 demand forecasts. Brent settled up US$0.07 at US$88.98 a barrel and WTI up US$0.07 at US$83.27. A senior Iranian source said there were no talks to extend the ceasefire since, from Teheran's view, it had no start date. The US and Houthis reported separate attacks in the Strait of Hormuz and Bab el-Mandeb; Hormuz vessel transits fell to a one-week low of eight, versus 125-140 daily before the war. Opec cut its 2026 demand growth forecast to 580,000 bpd, while the IEA now expects a 1.6 million bpd contraction. US crude stocks posted a surprise build, their largest since January 2023.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Oil%20prices%20edge%20up%20as%20investors%20weigh%20US-Iran%20talks%20deadlock%20against%20lower%20demand.pdf"}, {"id": "bt-19", "title": "SGX securities trading value for July rises 37% year on year to S$46.2 billion", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Singapore Exchange's securities market turnover rose 37 per cent year on year in July to S$46.2 billion, with securities daily average value also up 37 per cent and surpassing S$2 billion for a sixth straight month. Derivatives traded volume climbed 16 per cent to 33.9 million contracts. The Straits Times Index advanced 8.9 per cent to 5,628.5, its biggest monthly rise in over five years, aided by rotation into defensive financials, and is up 21 per cent year to date. Retail investors were net buyers for a sixth month with inflows up 92 per cent to S$545.2 million. STI ETFs logged a 17th month of inflows. FX futures volume jumped 54 per cent to 9.3 million contracts, with Korean won futures DAV up 182 per cent. Market cap reached S$1.2 trillion.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/SGX%20securities%20trading%20value%20for%20July%20rises%2037%20year%20on%20year%20to%20S46.2%20billion.pdf"}, {"id": "bt-20", "title": "SGX's record year masks Singapore's equities challenge", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "This commentary argues SGX's record results mask weakness in Singapore's primary equity market, where several 2026 IPOs ended in immediate trading losses and secondary fundraising fell to S$3.6 billion in FY2026 from S$4.3 billion. SGX dismisses first-day drops as amplified single data points and cyclical fundraising, but the writer says bad debuts destroy retail appetite and boards may be avoiding dilution at current valuations. Yet SGX Group posted record FY2026 revenue of S$1.5 billion and a 25 per cent jump in adjusted net profit to S$759.5 million, with dividends up 52 per cent. The paradox: SGX thrives less on domestic stock-picking than on clearing FX (ADV up 33 per cent to US$190 billion), commodities and offshore derivatives for global institutions.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/SGX's%20record%20year%20masks%20Singapore's%20equities%20challenge.pdf"}, {"id": "bt-21", "title": "SK Hynix, Samsung shares rally as report of Temasek's investment plans boosts optimism", "source": "BT", "date": "13 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "South Korean chipmakers Samsung Electronics and SK Hynix rallied as risk appetite returned and traders weighed a local media report that Singapore's Temasek Holdings plans to invest directly in both firms. Shares briefly gained more than 8 per cent after Asia Business Daily's report; Samsung ended up 6.7 per cent and SK Hynix 5.5 per cent, with the Kospi up 3.7 per cent. Temasek said it did not seek Korean government advice on timing and first invested in both over two years ago. The chipmakers had suffered a brutal July sell-off of more than 20 per cent amid doubts over AI buildout pace, leaving valuations at record lows of 4.2 and 3.6 times forward earnings. Global funds added nearly US$2 billion of Kospi shares on Wednesday.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/SK%20Hynix,%20Samsung%20shares%20rally%20as%20report%20of%20Temasek's%20investment%20plans%20boosts%20optimism.pdf"}, {"id": "bt-22", "title": "S&P 500 ends higher as CoreWeave results fuel AI optimism", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "The S&P 500 and Nasdaq ended higher on Wednesday, lifted by upbeat quarterly results from CoreWeave and other AI infrastructure firms, while mild inflation data reinforced bets the Fed will hold rates in September. US consumer prices barely rose in July as petrol costs fell. CoreWeave surged 19 per cent after lifting its capex forecast; Nebius jumped 34 per cent, Super Micro 19 per cent, and Nvidia rose 3 per cent. The S&P 500 climbed 0.26 per cent to 7,748.50, the Nasdaq gained 0.54 per cent to 26,588.49, while the Dow slipped 0.04 per cent to 53,770.27. Traders price a 62 per cent chance of a September hold. The Vix fell to 14.45, its lowest since January. US-Iran tensions stayed volatile amid continued shipping attacks.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/SP%20500%20ends%20higher%20as%20CoreWeave%20results%20fuel%20AI%20optimism.pdf"}, {"id": "bt-23", "title": "STI could hit 7,000 in bull case over next 12 months: JPMorgan", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "JPMorgan Chase raised its target for Singapore stocks, saying the Straits Times Index could climb to 7,000 over the next 12 months in a bull case, implying 22 per cent upside from Tuesday's close. Analysts including Khoi Vu cited robust economic growth, a narrowing valuation gap with developed markets, strong yields, a stable currency and the Equity Market Development Programme. Singapore stocks have gained more than 23 per cent in 2026, outperforming Hong Kong, buoyed by haven demand amid geopolitical tensions and AI-driven volatility. Singapore upgraded its 2026 growth forecast on Aug 11 as the AI boom lifts trade and manufacturing. JPMorgan had raised its base case to 6,000 in January. Its top picks include DBS, SGX, Keppel and UOL.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/STI%20could%20hit%207,000%20in%20bull%20case%20over%20next%2012%20months%20JPMorgan.pdf"}, {"id": "bt-24", "title": "Ship pays near-record US$4 million to skip Panama Canal queue as Hormuz blockage fuels congestion", "source": "BT", "date": "13 Aug 2026", "tags": ["Trade", "Energy", "Geopolitics"], "summary": "A container ship, the Seaspan Benefactor, paid US$4 million to jump the Panama Canal queue, a near-record auction figure, as the Iran war forces more congestion and wait times stretch beyond a week. Vessels are seeking alternative routes as traffic is deeply curtailed at the Strait of Hormuz and Bab el-Mandeb. Buyers and sellers of oil, gas, fertiliser and chemicals, especially in Asia, are scrambling for routes. Neopanamax vessels without booked slots face 10-day waits, the longest since May for Pacific-to-Atlantic transit. The US$4 million paid Monday was more than double the previous seven-day average, with the Panama Canal Authority acknowledging some auctions have exceeded US$1 million. Maintenance outages and reduced draft from low rainfall add to the bottleneck.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Ship%20pays%20near-record%20US4%20million%20to%20skip%20Panama%20Canal%20queue%20as%20Hormuz%20blockage%20fuels%20congestion.pdf"}, {"id": "bt-25", "title": "Singapore life insurers post 21.4% growth in H1 premiums as disbursements rise", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Singapore's life insurance industry posted 21.4 per cent year-on-year growth in total weighted new business premiums in the first half of 2026, to S$3.63 billion from S$2.99 billion, driven by demand for wealth accumulation policies amid strong GDP growth of 6.3 and 5.7 per cent in Q1 and Q2, said LIA Singapore. Investment-linked policies took a dominant 44 per cent share, with premiums up 24.2 per cent to S$1.59 billion, while participating policies rose 25.4 per cent to S$903 million. About seven in 10 residents were covered by Integrated Shield Plans; IP and rider premiums soared 66.5 per cent to S$100.3 million. Insurers disbursed over S$10.6 billion in claims and maturity benefits, up from S$6.4 billion a year earlier, including S$8.02 billion for matured policies.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Singapore%20life%20insurers%20post%2021.4%20growth%20in%20H1%20premiums%20as%20disbursements%20rise.pdf"}, {"id": "bt-26", "title": "Super Micro forecasts sales of up to US$15.5 billion, topping rosiest projection", "source": "BT", "date": "13 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Super Micro Computer gave a current-quarter revenue forecast of US$14.5 billion to US$15.5 billion for the period ending September, topping even the highest analyst estimate of US$13.3 billion and an average of US$12 billion, as AI demand bolsters server sales. Profit excluding some items will be US$1.01 to US$1.10 a share. Its servers use Nvidia chips that power most AI data centres. CEO Charles Liang cited investment in technology leadership and manufacturing scale. Shares jumped about 9 per cent in extended trading after closing at US$31.60. For the full fiscal year, Super Micro sees revenue of US$65 billion to US$72 billion, versus analysts' US$54.4 billion. Q4 sales rose 93 per cent to US$11.1 billion. A co-founder faces US export-control charges.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Super%20Micro%20forecasts%20sales%20of%20up%20to%20US15.5%20billion,%20topping%20rosiest%20projection.pdf"}, {"id": "bt-27", "title": "Switzerland launches consultation on stricter bonus rules for banks", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "Switzerland launched a public consultation on tougher banking regulations, including stricter bonus rules at UBS, to boost financial stability following the 2023 collapse of Credit Suisse. Draft proposals would require banks to structure bonus schemes to reward long-term, sustainable performance and discourage excessive risk-taking, with tighter rules for systemically important lenders. A significant portion of variable pay for top executives would be deferred for several years, typically four to five, with reductions or clawbacks if misconduct or losses emerge. Banks with at least 250 employees must clearly assign decision responsibility to senior managers, and regulator FINMA would gain powers to intervene earlier, fine institutions and levy penalties. The consultation runs until November 19, 2026.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/Switzerland%20launches%20consultation%20on%20stricter%20bonus%20rules%20for%20banks.pdf"}, {"id": "bt-28", "title": "UOL H1 net profit rises 23% to S$252.2 million on joint venture profits", "source": "BT", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Property developer UOL Group posted a 23 per cent rise in first-half net profit to S$252.2 million, from S$205.5 million, driven by joint-venture profits that surged to S$83.8 million from S$24,000. CEO Liam Wee Sin cited strong residential sales, with Watten House and Skye at Holland fully sold, and solid rental reversions of 7.3 per cent for offices and 5.5 per cent for retail. Operating patmi rose 16 per cent to S$239.8 million and EPS to S$0.2980. Revenue, however, fell 7 per cent to S$1.4 billion as more projects run through joint ventures, whose earnings are booked as share of JV profits rather than revenue. Analysts focused on the proposed Marina Square redevelopment adding three towers. No interim dividend was declared. Shares ended 2.4 per cent higher at S$10.17.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/UOL%20H1%20net%20profit%20rises%2023%20to%20S252.2%20million%20on%20joint%20venture%20profits.pdf"}, {"id": "bt-29", "title": "When robots are helping, who is watching?", "source": "BT", "date": "13 Aug 2026", "tags": ["Technology & AI", "Society"], "summary": "This commentary examines privacy risks as humanoid household robots near market, using XPeng's Iron, launching next year, as a case study. Morgan Stanley calculates the humanoid robot market will be worth US$5 trillion by 2050. To function, such robots need cameras and microphones switched on continuously in every room, unlike devices whose lenses can simply be taped over. The writer cites troubling precedents: a Roomba development model captured images of a woman on the toilet that were leaked, and a Ring employee viewed thousands of private videos of female customers. Startup 1X uses VR-headset human operators to take over tasks remotely. The author argues the onus should fall on companies, backed by rules like the EU's GDPR and AI Act, to safeguard data rather than on users.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20BT/When%20robots%20are%20helping,%20who%20is%20watching.pdf"}, {"id": "scmp-01", "title": "After China's missile test, US and allies demand 24-hour warning next time", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "The United States and 40 other nations issued a joint statement calling for at least 24 hours' advance notice before long-range ballistic missile launches, following a rare Chinese submarine-launched missile test in the Pacific on July 6. Though unnamed, China was clearly targeted; signatories including Australia, Japan, South Korea and the Philippines sought details on missile class, launch window and impact areas to reduce miscalculation risk. Beijing rejected the move as \"politically motivated,\" with foreign ministry spokesman Guo Jiakun accusing the West of double standards and abusing arms control mechanisms. Analyst Michael Bosack said Beijing gave inconsistent coordinates and notified some governments only hours ahead, prompting demands for clearer standards. China says it is not bound by the Hague Code.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/After%20China's%20missile%20test,%20US%20and%20allies%20demand%2024-hour%20warning%20next%20time.pdf"}, {"id": "scmp-02", "title": "China is sending scientists to Iran for rare earth 'exploration and processing'", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Geopolitics", "Technology & AI"], "summary": "China is expanding scientific collaboration with Iran into rare earths, listing \"exploration and processing of rare earth elements\" among five areas in a new joint workshop programme unveiled by the National Natural Science Foundation of China. Beijing will provide 30,000 yuan (US$4,200) per workshop, while Iran's science foundation covers international travel for its participants. The cooperation comes as the US-Israel war on Iran remains unresolved and Washington announced US$3 billion for critical-mineral projects to reduce Chinese dependence. China dominates global rare earth production and processing while restricting technology transfer. Iran's rare earth potential remains poorly understood, with anomalies identified across 7,000 sq km of central Iran, though extraction capabilities remain early-stage. Cooperation between the foundations dates to 2017.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/China%20is%20sending%20scientists%20to%20Iran%20for%20rare%20earth%20'exploration%20and%20processing'.pdf"}, {"id": "scmp-03", "title": "China projects 'outward confidence' amid economic anxiety, US congressional panel says", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "The US-China Economic and Security Review Commission said China projects confidence, especially over artificial intelligence, while anxiety about its economy persists beneath the surface, following a July visit to Beijing, Shanghai and Hangzhou. Chairman Randy Shriver cited \"a lot of anxiety about the state of the economy.\" Members said a key disappointment was being denied access to Hangzhou's \"Six Little Dragons,\" including AI start-up DeepSeek; vice-chairman Michael Kuiken called that the trip's most telling aspect. Chinese officials avoided specifics on the proposed US-China \"board of trade\" and an expected September visit by Xi Jinping. Taiwan was repeatedly raised, alongside US arms sales and their impact on military-to-military exchanges. The commission's annual report is due later this year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/China%20projects%20'outward%20confidence'%20amid%20economic%20anxiety,%20US%20congressional%20panel%20says.pdf"}, {"id": "scmp-04", "title": "China's EV sales slide again amid fading incentives, weak demand and persistent price war", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Deliveries of electric vehicles in China fell 3.9 per cent year on year in July, a seventh straight monthly decline, as fading government incentives and weak consumer demand weighed on the market. Domestic EV sales also dropped 5.8 per cent from June, per China Passenger Car Association data. Overall car deliveries plunged 20.9 per cent to 1.46 million units, with EVs at 65.1 per cent of sales. CnEVPost's Phate Zhang warned small firms may close and all players may need price cuts. AlixPartners forecast total 2026 deliveries falling 10 per cent to 24.6 million, predicting only seven of 30 EV-focused carmakers break even by 2030. Contrastingly, EV exports jumped 147.8 per cent to 540,000 units. BYD sold 239,370 domestically.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/China's%20EV%20sales%20slide%20again%20amid%20fading%20incentives,%20weak%20demand%20and%20persistent%20price%20war.pdf"}, {"id": "scmp-05", "title": "Erdogan wants Turkey-Saudi Arabia-Pakistan defence pact to draw more countries", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "President Recep Tayyip Erdogan said he hoped more countries would join a defence agreement signed last week between Turkey, Saudi Arabia and Pakistan, aimed at stabilising a region wracked by conflict. The so-called Mecca Joint Defence Agreement, signed Friday, contains a Nato-style clause treating an attack on one as an attack on all, and follows fallout from the five-month US-Iran war that disrupted shipping through the Strait of Hormuz and Red Sea. Foreign Minister Hakan Fidan said Turkey expected Egypt to join \"in the next stage,\" though Cairo has not commented. Erdogan said regional issues should be resolved by regional actors, warning \"solutions imported from abroad only bring disasters.\" The pact rejects Israel's hegemony and could develop joint defence-industry projects.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Erdogan%20wants%20Turkey-Saudi%20Arabia-Pakistan%20defence%20pact%20to%20draw%20more%20countries.pdf"}, {"id": "scmp-06", "title": "Fearing deflated China demand, US soybean growers pivot to new buyers and biofuel", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Trade", "Energy"], "summary": "US soybean growers are adapting to a steep decline in China-bound exports by selling to third countries and the American biofuel sector, according to American Soybean Association chief economist Scott Gerlt. Beijing committed in November to buy at least 25 million tonnes annually through 2028, but only just over 12 million tonnes of last year's crop is on track to reach China, which usually imports twice that. The association represents over 500,000 farmers across 83.6 million acres. Biofuel demand is booming on federal clean-fuel mandates, using a record 1.43 billion pounds of soybean oil in May. Chinese importers have turned to Brazil since the trade war restarted. Gerlt said the drop in production would be small, hoping China resumes normal purchases.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Fearing%20deflated%20China%20demand,%20US%20soybean%20growers%20pivot%20to%20new%20buyers%20and%20biofuel.pdf"}, {"id": "scmp-07", "title": "Fed policy outweighs geopolitical risks, China purchases as gold forecasts retreat: survey", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Finance & Markets"], "summary": "US Federal Reserve rate policies under Kevin Warsh have outweighed geopolitical tensions and Beijing's gold purchases as the decisive factor for bullion price forecasts, according to a London Bullion Market Association mid-year survey. Analysts cut 2026 projections versus six months ago; the average year-end forecast stood at US$4,500, with the highest at US$5,100, down from January bullishness that saw forecasts above US$7,000. Gold hit a record over US$5,600 in January and traded at US$4,411 on Wednesday. Ten of 16 analysts cited the Fed's inflation response as their major concern. Central banks bought a net 289 tonnes in the second quarter, a record for the period. China's reserves rose to 76.08 million ounces, a 21st straight month of accumulation.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Fed%20policy%20outweighs%20geopolitical%20risks,%20China%20purchases%20as%20gold%20forecasts%20retreat%20survey.pdf"}, {"id": "scmp-08", "title": "From solar to AI: why China may be entering its 'Go Global 3.0' era", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Technology & AI", "Trade"], "summary": "Chinese corporate expansion overseas is shifting from solar equipment to AI-enabled industrial technology, with a new generation of firms targeting global markets from inception, according to Goldman Sachs analysts led by Jacqueline Du. They wrote China has entered the \"Go Global 3.0\" era, moving beyond low-cost goods and the \"new three\" sectors of EVs, batteries and solar. Firms now target hardware across the AI value chain, from data centre infrastructure to automated systems. \"Born global\" companies like Unitree Robotics shipped over 5,500 humanoid robots last year, far above US rivals delivering about 150 each. Analysts warned of heightened regulatory and trade risks, noting recent US bans on foreign humanoid robots and power inverters. Long-term competitiveness depends on turning speed and pricing into quality advantages.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/From%20solar%20to%20AI%20why%20China%20may%20be%20entering%20its%20'Go%20Global%203.0'%20era.pdf"}, {"id": "scmp-09", "title": "Fund backed by China memory giant YMTC invests in push for alternative chipmaking route", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Technology & AI"], "summary": "A venture capital fund backed by Yangtze Memory Technologies Corp (YMTC), China's top NAND flash producer, has taken a stake in domestic semiconductor manufacturer SOI Micro, boosting the country's push for an alternative chipmaking ecosystem. Guangzhou-based SOI Micro develops fully depleted silicon-on-insulator (FD-SOI) technology, a low-power route complementary to mainstream processes. Its registered capital rose to 2.53 billion yuan (US$375 million), with Wuhan's Changcun Industry Investment Fund appearing as a new shareholder, though the stake was undisclosed. SOI Micro, founded in 2022, is led by veteran technologist Ye Tianchun, former head of the Chinese Academy of Sciences' Institute of Microelectronics. The company targets 28-nanometre-class logic processes, with Ye describing FD-SOI as a \"second track\" for the Greater Bay Area's chip sector.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Fund%20backed%20by%20China%20memory%20giant%20YMTC%20invests%20in%20push%20for%20alternative%20chipmaking%20route.pdf"}, {"id": "scmp-10", "title": "HKEX pushes ahead on extended trading hours discussions as it prepares paper: sources", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Finance & Markets"], "summary": "Hong Kong Exchanges and Clearing (HKEX) will push ahead with talks on extending stock market trading hours by releasing a discussion paper, despite brokers' concerns over longer hours and possible cancellation of the lunch break, two sources said. The paper could pave the way for the first change to the city's opening times in 14 years and would outline pros and cons without concrete proposals; a public consultation would follow if feedback is supportive. HKEX currently trades 9.30am to 4pm with a one-hour lunch break. Pressure has mounted as Nasdaq expands to 23 hours daily from December 6 and the London Stock Exchange plans an overnight venue. Over 500 Hong Kong brokerage firms have raised cost and workload concerns. Changes would be phased in.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/HKEX%20pushes%20ahead%20on%20extended%20trading%20hours%20discussions%20as%20it%20prepares%20paper%20sources.pdf"}, {"id": "scmp-11", "title": "HSBC reshuffles insurance division after CEO's surprise departure: internal memo", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Finance & Markets"], "summary": "HSBC has launched a major reshuffle of its insurance unit after global insurance CEO Edward Moncreiffe resigned to pursue external opportunities, according to an internal memo. Daisy Tsang, CEO of HSBC Life Hong Kong, and Kai Zhang, Asia head of international wealth and premier banking, were named co-CEOs of insurance, effective immediately, while retaining current roles. Moncreiffe's departure surprised the market, as insurance and wealth are key expansion focuses; the wealth arm's revenue jumped 18 per cent and insurance 32 per cent in the first half. The pair face a challenging period as Beijing tightens controls on cross-border wealth products, levying a 20 per cent tax on offshore insurance gains. The reshuffle follows HSBC's agreement to sell its Singapore insurance business to Allianz.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/HSBC%20reshuffles%20insurance%20division%20after%20CEO's%20surprise%20departure%20internal%20memo.pdf"}, {"id": "scmp-12", "title": "Hong Kong seeks tech exposure to take on Nasdaq amid Beijing's rising AI dominance", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Hong Kong is intensifying efforts to increase its stock market's technology exposure to catch up in the global AI trade and potentially challenge the Nasdaq. Several mainland hardware tech firms, particularly makers of optical transceivers used in AI data centres, are lining up for listings after Zhongji Innolight's debut last month, which raised US$6.8 billion. Hang Seng Indexes Company proposed revamping the Hang Seng Tech Index to add more constituents, potentially expanding from 30 to 50 and using revenue growth as inclusion criteria. Limited AI exposure helped Hong Kong stocks escape last month's tech sell-off, with the Hang Seng Index up 13 per cent, but the Tech Index lost over 10 per cent this year. Rebalancing decisions come August 21; MiniMax and Z.ai are candidates.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Hong%20Kong%20seeks%20tech%20exposure%20to%20take%20on%20Nasdaq%20amid%20Beijing's%20rising%20AI%20dominance.pdf"}, {"id": "scmp-13", "title": "Hong Kong stablecoin selection expands with Standard Chartered-led venture's launch", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "A Standard Chartered-led joint venture, Anchorpoint Financial, kicked off institutional use of Hong Kong dollar-backed stablecoins on Wednesday, a year after the city's stablecoin law took effect as part of its digital-asset hub ambitions. Formed with Animoca Brands and HKT, Anchorpoint began the first phase of its HKDAP coin roll-out via beta access, with retail use expected \"as early as end-2026,\" subject to market conditions. HKDAP stands for \"Hong Kong dollar at par.\" Authorised distributors may offer conversion between HKDAP and fiat for institutions and professional investors. The move aligns with the cautious stance of the Hong Kong Monetary Authority, which granted its first stablecoin licences to HSBC and Anchorpoint in April after Beijing banned onshore tokenisation of real-world assets in February.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Hong%20Kong%20stablecoin%20selection%20expands%20with%20Standard%20Chartered-led%20venture's%20launch.pdf"}, {"id": "scmp-14", "title": "Hong Kong's economic and trade network plays to city's strengths", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Trade", "Southeast Asia"], "summary": "This SCMP editorial welcomes Hong Kong's opening of a new Economic and Trade Office (ETO) in Kuala Lumpur, a strategic move to bolster relations with Asean and its 15th overseas office outside mainland China. Achieved in two years with strong Malaysian support, the office reflects deep bilateral ties. Asean is Hong Kong's second-largest merchandise trading partner, with goods trade reaching HK$1.67 trillion (US$212.83 billion) last year, 15.3 per cent of global trade. Bilateral trade with Malaysia hit US$34.8 billion in 2025. The ETO also covers Brunei, Laos and Pakistan, reinforcing Hong Kong's \"superconnector\" role linking mainland enterprises with Asian markets. It coincides with the HKTDC's \"Think Business, Think HK\" campaign, whose 200-strong delegation to Malaysia is the largest ever.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Hong%20Kong's%20economic%20and%20trade%20network%20plays%20to%20city's%20strengths.pdf"}, {"id": "scmp-15", "title": "How Hong Kong can unlock the real value of its Asean trade boom", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Trade", "Southeast Asia"], "summary": "This analysis argues Hong Kong must attach high-value services to its booming Asean trade to convert commerce into lasting returns, rather than relying on re-export volumes. Asean has been Hong Kong's second-largest trading partner since 2010, with 2025 merchandise trade of HK$1.67 trillion (US$212.8 billion) and direct investment stock exceeding HK$670 billion. But enormous volumes yield thin margins; larger profits accrue in trade finance, treasury, insurance, legal services and regional headquarters. Vietnam and Singapore account for nearly 63 per cent of Asean trade. A HKTDC-UOB survey found 73 per cent of firms planned to accelerate Asean expansion, though 47 per cent struggled finding local partners. The piece warns Hong Kong risks being bypassed as mainland firms and Singaporean institutions build direct networks.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/How%20Hong%20Kong%20can%20unlock%20the%20real%20value%20of%20its%20Asean%20trade%20boom.pdf"}, {"id": "scmp-16", "title": "Little surprise Beijing doesn't want Western advice for its economy", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "This SCMP editorial argues China's restrained economic stimulus is not policy paralysis but reflects different priorities: Beijing is preparing for prolonged strategic rivalry with the United States. Western economists prescribe transferring income to households and reducing reliance on investment and exports, but China increasingly optimises for strategic resilience over short-term GDP. The piece notes China still has fiscal room but faces diminishing returns on debt-fuelled growth. It describes a K-shaped economy: property and construction grinding to a halt while EVs, batteries, solar, robotics and AI expand, precisely the sectors colliding with Western interests. Tensions are therefore likely to intensify. Citing Japan's post-Plaza Accord struggles and the Soviet collapse, Beijing believes the more dangerous disease is dependence on others, not slow growth.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Little%20surprise%20Beijing%20doesn't%20want%20Western%20advice%20for%20its%20economy.pdf"}, {"id": "scmp-17", "title": "PLA holds first joint naval drill with Indonesia in waters east of Taiwan", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Defence", "Geopolitics", "Southeast Asia"], "summary": "China's People's Liberation Army and Indonesian forces held joint naval exercises east of Taiwan on Wednesday, signalling deeper Beijing-Jakarta military ties. The drill featured the PLA Navy's Type 054A frigate Honghe and Indonesia's KRI I Gusti Ngurah Rai, covering maritime communications, formation manoeuvres and replenishment. It marks the first time the PLA conducted drills with a foreign navy in the area. Indonesia said the exercises were not for warfighting but consistent with its non-aligned policy, while Taiwan protested the plan as a \"provocation.\" The drill follows intensified mainland patrols east of the island since June, with a China Coast Guard fleet reaching within 32 nautical miles of Hualien. Beijing has also strengthened ties with Russia and Indonesia, Southeast Asia's biggest economy.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/PLA%20holds%20first%20joint%20naval%20drill%20with%20Indonesia%20in%20waters%20east%20of%20Taiwan.pdf"}, {"id": "scmp-18", "title": "Palm oil to cool data centres? Malaysia explores option as water demand surges", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Environment", "Technology & AI", "Southeast Asia"], "summary": "Malaysia is exploring using palm oil to cool data centre servers without relying on large volumes of water, as its digital infrastructure boom strains resources. Researchers at the Malaysian Palm Oil Board are developing a palm-based liquid coolant, termed Sawit EcoTherm, nearing commercialisation with a local manufacturer. Data centres used 28.68 million litres of water daily as of January. The coolant would cost US$2.44 to US$6.10 per kilogram versus US$12.20 to US$19.52 for synthetic alternatives, could eliminate water use and cut energy consumption up to 40 per cent. However, experts warned it could drive palm plantation expansion and shift the environmental burden upstream, urging no-deforestation commitments and certified feedstock. Malaysia approved 143 data centre projects worth US$35.23 billion from 2021 to mid-2025.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Palm%20oil%20to%20cool%20data%20centres%20Malaysia%20explores%20option%20as%20water%20demand%20surges.pdf"}, {"id": "scmp-19", "title": "Putin warns of retaliation for Western seizures of Russian commercial ships", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Russian President Vladimir Putin on Wednesday threatened retaliation for Western seizures of Russian commercial vessels, calling them \"piracy and robbery.\" Speaking during a visit to a warship in a Pacific naval exercise, he described the West's detentions as breaching international maritime law and warned Moscow could respond \"in any area,\" including the Pacific. Pacific Fleet chief Admiral Viktor Liina said the navy was ready to inspect and detain vessels serving \"unfriendly nations\" and their \"shadow fleet.\" Russia is believed to use hundreds of ships to evade sanctions imposed after invading Ukraine in 2022; France and the UK have detained tankers, and the EU has sanctioned hundreds of shadow-fleet ships. Dmitry Medvedev said Russia could attack merchant vessels of hostile nations carrying enemy cargo.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Putin%20warns%20of%20retaliation%20for%20Western%20seizures%20of%20Russian%20commercial%20ships.pdf"}, {"id": "scmp-20", "title": "Singapore and South Korea eye science opportunities as last main US-China link shatters", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Geopolitics", "Technology & AI"], "summary": "As Xi Jinping prepares for summit talks with Donald Trump next month, Washington is closing one of the few remaining US-China openings by targeting scientific research through new security restrictions on federally funded collaborations. Experts say the measures will reshape where collaboration happens rather than halt Chinese progress, creating openings for intermediary hubs. US-China co-authored papers peaked in 2017-2019 before falling roughly 20 per cent, with steep declines in AI, engineering and quantum fields. In July, the Pentagon added Fudan and Shanghai Jiao Tong to its Section 1286 list. Singapore has emerged as perhaps the clearest beneficiary given its neutrality and English-language universities, alongside the Gulf states, South Korea and others. Analysts warn global science will become more fragmented, with both sides poorer off.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Singapore%20and%20South%20Korea%20eye%20science%20opportunities%20as%20last%20main%20US-China%20link%20shatters.pdf"}, {"id": "scmp-21", "title": "US-China 'Board of Investment' stalls before expected Trump-Xi meeting", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Trade", "Geopolitics"], "summary": "The US-China Board of Investment, a key outcome of the May Trump-Xi summit, is unlikely to be a deliverable for their expected September meeting in Washington, according to US-China Business Council president Sean Stein, who said neither side had initiated the consultation process. The board, announced alongside a Board of Trade, aimed to provide a government-to-government forum on investment issues. Analyst Wendy Cutler attributed the delay to differing US views on Chinese FDI risks. Chinese FDI into the US plummeted from US$55 billion in 2016 to just US$4 billion in 2025. Negotiations on the Board of Trade have intensified, racing to finalise non-sensitive sectors for tariff-free trade capped at US$30 billion each, with agriculture and aviation selected. Diplomatic activity is notably lower than previous summits.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/US-China%20'Board%20of%20Investment'%20stalls%20before%20expected%20Trump-Xi%20meeting.pdf"}, {"id": "scmp-22", "title": "Why China's traders, e-commerce merchants feel boxed in by new EU packaging rules", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Trade", "Environment"], "summary": "The European Union's Packaging and Packaging Waste Regulation (PPWR) became applicable across the bloc on Wednesday, adding a compliance layer for Chinese exporters already facing tighter trade restrictions. Replacing a 1994 directive, it sets requirements for every piece of packaging, covering chemical restrictions, recyclability and producer responsibility. Researcher Zhou Mi said the previous system letting companies find lenient entry points no longer works under the unified framework. The scope is \"unprecedentedly broad,\" spanning food, cosmetics, electronics and auto parts. Chinese exports to the EU rose to US$370 billion in the first seven months of 2026, up 16.7 per cent. Exporters face fines, customs blocks and bans for non-compliance, with strict PFAS restrictions and mandatory conformity declarations. Enforcement uncertainty could function as a trade barrier.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Why%20China's%20traders,%20e-commerce%20merchants%20feel%20boxed%20in%20by%20new%20EU%20packaging%20rules.pdf"}, {"id": "scmp-23", "title": "Why does Hong Kong need a 5-year plan – and will it crimp its free-market economy?", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Politics", "Finance & Markets"], "summary": "Hong Kong will roll out its first-ever five-year plan by end-September to align economic and social development with national strategy, marking a governance pivot from its laissez-faire tradition of annual policy addresses and budgets. The public consultation ends this Friday, with the plan (2026-30) spanning six pillars including the Northern Metropolis, finance and innovation, corresponding to China's 15th five-year plan themes. HKU economist Heiwai Tang said the lack of long-term planning contributed to housing shortages and inequality. Officials stress Hong Kong is not pivoting to a command economy but remains \"market-led and government-facilitated.\" Critics including Stephen Roach warn Chinese-style central planning could over-promise. Supporters cite Singapore, South Korea and Japan as proof strategic state guidance and free markets can coexist.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Why%20does%20Hong%20Kong%20need%20a%205-year%20plan%20-%20and%20will%20it%20crimp%20its%20free-market%20economy.pdf"}, {"id": "scmp-24", "title": "Why does SK Hynix want to sell its chip facility in southwest China?", "source": "SCMP", "date": "13 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "South Korean chipmaker SK Hynix's potential deal to offload a packaging plant in Chongqing is part of a strategic pivot towards higher-margin AI memory products, according to analysts, who cautioned a sale faces valuation hurdles and a volatile chip cycle. SK Hynix said it was exploring solutions to enhance its packaging business competitiveness; options include a stake sale valuing the plant near US$3 billion, Bloomberg reported. The Chongqing plant handles downstream packaging and testing for NAND flash. Analysts see it as recycling capital from lower-margin legacy products towards high-bandwidth memory, potentially funding a 54 trillion won (US$38 billion) domestic expansion. Yangtze Memory Technologies and outsourced assembly specialists like JCET are seen as potential buyers. Packaging transfers may clear regulators more easily than fab transfers.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20SCMP/Why%20does%20SK%20Hynix%20want%20to%20sell%20its%20chip%20facility%20in%20southwest%20China.pdf"}]}, "2026-08-14": {"date": "2026-08-14", "dayOfWeek": "Friday", "totalArticles": 95, "sourceCounts": {"WSJ": 20, "ST": 25, "BT": 25, "SCMP": 25}, "executiveDigest": "The US escalated on Iran even as oil fell: Washington is weighing an 'indefinite naval blockade' and sending a fresh aircraft carrier as bombings 'fail to sway' Tehran, while Iran struck two ADNOC vessels in Hormuz and Houthis hit Aramco's Jazan refinery again - yet crude settled down 2% on weak demand and a hefty US build. Benign US inflation (producer prices flat) cemented Fed-hold bets and nudged gold lower. Singapore's earnings ran hot and cold - CapitaLand Investment will recycle up to S$9 billion and ST Engineering's profit rose 27%, but MSCI dropped Sembcorp and GoTo from its global benchmarks.", "briefingCards": [{"title": "Lead story - US escalates on Iran as oil slips", "body": "Washington hardened its Iran posture: ST reported the US 'eyes an indefinite naval blockade as the oil supply shortfall deepens', WSJ said it is 'sending a fresh aircraft carrier to the Middle East amid Iran-war strain', and SCMP framed Trump turning 'to economic pain as US bombings fail to sway Iran'. The waterway stayed hot - the UAE said Iran attacked two ADNOC vessels in Hormuz (no injuries), and Houthis struck Aramco's Jazan refinery for a second time in a week. Yet the market shrugged: oil 'settled down 2% on a weak demand outlook and a hefty US crude build'. WSJ warned of 'Washington's four wrong assumptions about the Iran war', and Trump even ordered US carriers 'back to steam catapults'."}, {"title": "Markets & finance", "body": "Benign inflation set the tone: US producer prices were 'unchanged in July', the greenback steadied and gold declined 'as sliding US inflation reinforced Fed-hold bets', while weekly jobless claims pointed to a stable labour market and Fitch kept the US at 'AA+'. WSJ's Greg Ip cautioned that although 'the stock market thinks the economy is accelerating', jobs may not follow. Corporate cash was busy - AMD is looking to raise US$4-5 billion of debt, OpenAI's revenue run-rate topped US$40 billion ahead of an IPO, and Maersk's Q2 profit 'smashed forecasts' as it raised guidance. A notable index shock hit Singapore: MSCI dropped Sembcorp and GoTo (and Ayala Land) from its global benchmarks."}, {"title": "Asia realignment", "body": "Trade enforcement sharpened: the US accused Chinese exporters of a 'Great Transshipment Scam', 'flagged dozens of trade partners as tariff-evasion risks', won a court ruling to end the small-parcel tariff exemption, and Trump slapped tariffs 'up to 100% on imported drones' - while Mexico pressed to cut auto tariffs. WSJ mused on 'how to lose friends and alienate allies'. China pushed back and out: SCMP said 'the China discount now carries a premium', Chinese carmakers could take 15-30% of Europe by 2035, and Beijing will tighten entry-exit controls from Sept 15. Security frictions grew with Taiwan 'weaponizing its coast guard', a 50% boost to China's Type 054B missile capacity, and Putin's disputed-island visit pressuring Japan."}, {"title": "Energy & climate", "body": "Oil's geopolitics and fundamentals diverged: despite the blockade threat, Hormuz vessel attacks and a second Houthi strike on Aramco's Jazan refinery, crude settled down 2% on weak demand and a US build. In a striking pivot, WSJ noted 'Elon Musk, the world's most famous EV pioneer, is now leaning into fossil fuels', while Rick Perry's Fermi 'finally found a customer for its giant Texas AI power bet' and SK Shipping and H-Line swapped tankers 'to create an LNG giant'. Climate strain mounted: Romania shut a nuclear plant as the Danube dropped, and experts said 2026 is 'likely to be the hottest year on record'."}, {"title": "Technology & AI", "body": "The model race reshuffled: BT reported 'Google shifted power in its top ranks' in a 'race to regain AI-model supremacy', unveiling Gemini 3.7 Flash while its top model stays delayed, and DeepMind's Hassabis 'pitched an AI-oversight body before the shake-up' (SCMP: 'which AI camp has Trump's ear now?'). China's chip complex surged - SMIC and Hua Hong posted triple-digit profit growth on AI demand, YMTC broke into the global top-three flash-memory suppliers, and Applied Materials eyed capacity expansion - even as WSJ flagged 'Chinese censorship leaking into answers from American AI' and Alibaba added commercial restrictions to its open-weight Qwen model. Lenovo posted record revenue toward a US$100 billion goal, and UMS profit jumped 89% on an AI 'super cycle'."}, {"title": "Singapore & SEA focus", "body": "Singapore earnings were mixed but active: CapitaLand Investment will 'restructure its portfolio and recycle up to S$9 billion' (and weighs a partial Ascott-stake sale), CDL tripled H1 profit to $300 million, ST Engineering's H1 profit rose 27.1% to S$512.1 million, and UMS jumped 89% on the AI super-cycle - but Genting Singapore (-33.5%), Singtel (-72%) and Frencken (-3.4%) slid, Sembcorp's profit fell 72% (dividend still raised), and MSCI dropped Sembcorp and GoTo from global benchmarks. The hub kept pulling in tech and talent - Lam Research will add 200 Singapore jobs 'amid the AI boom' and China's STEM students are 'turning to Singapore as Western study options shrink' - while PropNex sees lower mortgage rates supporting the 2026 property market."}], "keyMetrics": [{"value": "95", "label": "Articles curated today", "sub": "WSJ 20 · ST 25 · BT 25 · SCMP 25"}, {"value": "Blockade + carrier", "label": "US escalates on Iran", "sub": "Bombings 'fail to sway' Tehran"}, {"value": "-2%", "label": "Oil settles lower", "sub": "Weak demand; hefty US build"}, {"value": "Flat PPI", "label": "Benign US inflation", "sub": "Cements Fed-hold bets"}, {"value": "S$9b", "label": "CapitaLand Investment recycle", "sub": "ST Eng +27%; MSCI cuts Sembcorp"}, {"value": "US$40b", "label": "OpenAI revenue run-rate", "sub": "Ahead of IPO; AMD raises debt"}], "articles": [{"id": "wsj-01", "title": "Apple Showcases Texas Mac Mini Factory, New Manufacturing School", "source": "WSJ", "da
