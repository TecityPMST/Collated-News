ges US$320 billion in Asia, around 12% of the total. Schroders will operate independently under Oldfield for 12 to 18 months with unchanged investment strategies, while sales teams collaborate. Oldfield cited Wealth Management Connect and Hong Kong's first five-year plan, and remains bullish on Hong Kong and the mainland despite Beijing tightening cross-border investment controls since May and adding a 20% tax levy on overseas investments in July.", "url": "https://www.scmp.com/business/banking-finance/article/3369699/asset-manager-schroders-expand-hong-kong-after-merger-nuveen-ceo-says"}, {"id": "scmp-06oct-02", "title": "Days after Xi-Trump summit, top Taiwan diplomat opens de facto consulate in the US", "source": "SCMP", "date": "06 Oct 2026", "tags": ["Geopolitics", "Technology & AI"], "summary": "Taiwan's foreign minister Lin Chia-lung arrived in Phoenix late on Oct 3 for a three-day visit to open the Taipei Economic and Cultural Office, Taiwan's 14th representative office in the US, and tour Arizona's semiconductor corridor, days after a Sept 23-25 Trump-Xi summit in Washington. Two sources familiar with the matter said the trip includes no Washington stops or State Department meetings; a Washington visit could have risked a blow-up with Beijing. Taipei framed the trip as economic, and Lin will call on Arizona Governor Katie Hobbs and Phoenix Mayor Kate Gallego, accompanied by American Institute in Taiwan managing director Ingrid Larson. The office is seen as serving companies and families that followed TSMC to Phoenix, where its workforce of about 3,000 is targeted to reach about 6,000.", "url": "https://www.scmp.com/news/china/diplomacy/article/3369770/days-after-xi-trump-summit-top-taiwan-diplomat-opens-de-facto-consulate-us"}, {"id": "scmp-06oct-03", "title": "Hong Kong poised for first listed property debt fund as banks pull back", "source": "SCMP", "date": "06 Oct 2026", "tags": ["Finance & Markets"], "summary": "Hong Kong-based private equity firm Gaw Capital filed on Oct 2 to list its Gaw Capital Real Estate Private Debt OFC, seeking to become the first property-focused private debt fund on the Hong Kong stock exchange's main board, as banks retreat from riskier commercial real estate lending under stricter Basel capital rules. The fund has identified a HK$2.29 billion (US$291 million) pipeline of deals across Hong Kong, Australia, South Korea, Thailand and the Maldives, with most targeting internal rates of return above 10% a year. Gaw Capital said the Asia-Pacific and Middle East real estate and infrastructure private debt market was expected to reach US$372.7 billion by 2030. The closed-ended fund does not permit redemptions and aims to pay quarterly distributions, though these are not guaranteed; Jefferies is the sponsor.", "url": "https://www.scmp.com/business/banking-finance/article/3369764/hong-kong-poised-first-listed-property-debt-fund-banks-pull-back"}, {"id": "scmp-06oct-04", "title": "Japan, Australia boost economic security ties with finance dialogue", "source": "SCMP", "date": "06 Oct 2026", "tags": ["Geopolitics", "Trade"], "summary": "Japan and Australia signed a memorandum of understanding on Oct 5 establishing an annual finance ministers' dialogue to deepen cooperation on financial and economic policy and strengthen bilateral collaboration on economic security. The framework, effective for five years, will focus on energy and fuel security, investment in critical minerals and secure supply chains, including in the defence industry sector. Japan's finance chief Satsuki Katayama said the two would work to promote stable economic growth in the Indo-Pacific, while Australian Treasurer Jim Chalmers called closer cooperation \"more important now than ever\". It is Japan's third ministerial-level finance dialogue with a major regional partner after frameworks with South Korea and China set up in 2006, though no Japan-China finance ministers' dialogue has been held since 2018.", "url": "https://www.scmp.com/news/asia/east-asia/article/3369822/japan-australia-boost-economic-security-ties-finance-dialogue"}, {"id": "scmp-06oct-05", "title": "Southeast Asia starts to rethink its AI data centre boom: ‘at what cost?’", "source": "SCMP", "date": "06 Oct 2026", "tags": ["Southeast Asia", "Technology & AI", "Energy"], "summary": "Southeast Asian governments that spent years courting data centres are finding the AI buildout strains power grids, land and regulatory systems, analysts say. Thailand paused 166 projects on Sept 4 (49 under construction, 117 awaiting approval) pending nationwide standards, and last week Indonesia's West Java governor ordered a halt to construction at a site run by Singapore's BDx Data Centres, reportedly because key permits had yet to be issued. Analyst Alvin Camba says Malaysia is becoming more selective as its pipeline pressures power and water, and cites Singapore as an example of reliable infrastructure and predictable rules aiding competitiveness. Projects also face local pushback: a Kota Damansara application was withdrawn after nearly 300 objections, and protests in the Philippines' Iloilo led a Norwegian investor to drop a 50MW project.", "url": "https://www.scmp.com/week-asia/economics/article/3369788/southeast-asia-starts-rethink-its-ai-data-centre-boom-what-cost"}, {"id": "scmp-06oct-06", "title": "US bombers moved from UK airbase due to Iran-linked threats, Trump says", "source": "SCMP", "date": "06 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "US President Donald Trump said on Oct 5 an Iran-linked threat prompted the removal of B-1 bombers, recently used in US strikes on Iran, from RAF Fairford; asked about an Iran link, he said: \"They would be linked to Iran.\" Vice-President J.D. Vance cited an abundance of caution, but Secretary of State Marco Rubio said there was no direct link to the suspected Iranian plot; The New York Times, citing two US officials, said the move was rushed after new threats. Five British men were arrested near the base on Sept 27 on suspicion of preparing terrorist acts, as was a dual UK-Iranian national four days later; all are on bail. British Prime Minister Andy Burnham said any plot was probably Iran-backed; Iran calls the accusations baseless.", "url": "https://www.scmp.com/news/world/europe/article/3369843/us-bombers-moved-uk-airbase-due-iran-linked-threats-trump-says"}, {"id": "scmp-06oct-07", "title": "US defence experts to work inside Taiwan military HQ under reported pact", "source": "SCMP", "date": "06 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "According to Taiwanese media reports at the weekend, the Pentagon plans to station an official from the Office of the Under Secretary of Defence for Policy and an Institute for Defence Analyses expert long-term at Taiwan's defence ministry headquarters. The reports put the budget of the expanded cooperation programme, running to 2028, at more than NT$471 million (US$14.8 million), including NT$152.5 million this year; Taiwan's defence ministry did not confirm the details and the US Department of Defence had no comment. Ruling Democratic Progressive Party legislator Wang Ting-yu called it a \"major upgrade\", but opposition Kuomintang legislator Ma Wen-chun said the programme's annual budget had risen more than twelvefold and questioned its concrete benefits. Analyst Zivon Wang said Beijing is certain to protest, while others warned of eroding defence autonomy.", "url": "https://www.scmp.com/news/china/military/article/3369795/us-defence-experts-work-inside-taiwan-military-hq-under-reported-pact"}, {"id": "scmp-06oct-08", "title": "Why protecting home values is Beijing’s new priority", "source": "SCMP", "date": "06 Oct 2026", "tags": ["Finance & Markets", "Society"], "summary": "An SCMP opinion piece argues that China's housing market has structurally shifted from building new homes to trading existing ones, making preserving confidence in the existing housing stock a separate economic priority. It cites National Bureau of Statistics figures, published in September, showing secondary-market home transactions surpassed new residential builds in volume, with registered resales reaching 549 million square metres, while urban living space has risen to 42 square metres per person. The piece says buyers now prize the certainty of existing homes after stalled projects and developer defaults, and that sharp falls in home values make families feel poorer and more cautious. It notes resales generate neither land transfer revenue for local governments nor presale cash for developers, offering no easy substitute for the old growth model.", "url": "https://www.scmp.com/opinion/china-opinion/article/3369213/why-protecting-home-values-beijings-new-priority"}, {"id": "tass-06oct-01", "title": "Demand for ship protection against drones surges — FT", "source": "TASS", "date": "06 Oct 2026", "tags": ["Defence", "Energy"], "summary": "TASS, citing the Financial Times, reports that shipping companies' demand for services protecting vessels against drones has surged amid numerous attacks in the Red Sea, Black Sea and Persian Gulf. D-Fend Solutions Chief Marketing Officer Jeffrey Starr told the FT the drone threat is no longer confined to high-intensity war zones, and experts quoted by the paper said most inquiries come from oil and gas transporters seeking to use riskier routes and command higher risk premiums. The FT says tanker charter costs for Strait of Hormuz transits are at a record, with voyages to China up more than 15-fold from around US$79,000 to US$1.2 million a day.", "url": "https://tass.com/economy/2197743"}, {"id": "tass-06oct-02", "title": "EU faces 'difficult winter' amid high energy prices, European Commission says", "source": "TASS", "date": "06 Oct 2026", "tags": ["Energy", "Geopolitics"], "summary": "European Commission Spokesperson Anna-Kaisa Itkonen told a briefing that Europe is heading towards \"a very difficult winter in terms of energy prices\", TASS reports. She welcomed the EU and G7 decision to release 50 million barrels of oil and 50 million barrels of diesel from strategic reserves, saying it was done to shield households and businesses from price shocks. TASS asserts the release was in reality made under US pressure, saying Washington demanded allies release up to 120 million barrels of diesel or face a US diesel export ban. A source earlier told TASS such a ban would cause the first physical fuel shortage in EU history.", "url": "https://tass.com/economy/2197809"}, {"id": "tass-06oct-03", "title": "Former Hungarian foreign minister denies helping China’s BYD in violation of Hungary’s law", "source": "TASS", "date": "06 Oct 2026", "tags": ["Politics", "Finance & Markets"], "summary": "Hungary's former Minister of Foreign Affairs and Trade Peter Szijjarto has rejected claims that he facilitated government agreements with Chinese carmaker BYD in violation of Hungarian law, TASS reports. Tisza MP Pal Czako-Czirbus, citing Foreign Ministry documents, said Szijjarto as minister transferred roads, railways and water supply networks worth billions of forints to BYD, and the ruling Tisza party's parliamentary group said his move to a senior BYD role raises national security, conflict-of-interest and ethical concerns. Before a closed-door national security committee hearing he attended voluntarily, Szijjarto told reporters that government support for BYD's Szeged EV plant, its first in Europe, fell within the standard framework for such investments.", "url": "https://tass.com/world/2197737"}, {"id": "tass-06oct-04", "title": "Fourteen commercial ships attacked in Strait of Hormuz in September", "source": "TASS", "date": "06 Oct 2026", "tags": ["Geopolitics", "Trade"], "summary": "Fourteen commercial vessels were attacked in the Strait of Hormuz in September, according to TASS's own calculations, putting the month level with July in second place behind March, which saw 20 incidents. TASS says International Maritime Organization statistics show the September attacks left three seafarers dead, two injured and two missing. The agency recalls that the US and Israel launched a war against Iran on February 28 and that, after a June memorandum envisaging an immediate ceasefire, the US resumed large-scale attacks overnight to July 8, accusing Iran of breaching agreements concerning the Strait of Hormuz.", "url": "https://tass.com/world/2197705"}, {"id": "tass-06oct-05", "title": "Global trade to feel impact of US-Iran war for long time — Russian minister", "source": "TASS", "date": "06 Oct 2026", "tags": ["Trade", "Geopolitics"], "summary": "Russian Economic Development Minister Maxim Reshetnikov told TASS that global trade will feel the consequences of the US-Israeli war with Iran for a long time and experts have yet to assess their full extent, summing up a G20 meeting in Milwaukee, Wisconsin, held September 30 to October 1. He cited World Trade Organization calculations that shipping disruptions in the Strait of Hormuz cut the region's exports by 9.7% and imports by nearly 12% in the first quarter. Reshetnikov said higher hydrocarbon and fertiliser prices and rising production and logistics costs intensified pressure on global food markets, with import-dependent developing and least-developed countries particularly vulnerable.", "url": "https://tass.com/economy/2197747"}, {"id": "tass-06oct-06", "title": "Increased strikes on Ukraine aimed at preventing attacks on Russian economy — envoy", "source": "TASS", "date": "06 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "Russian Foreign Ministry ambassador-at-large Rodion Miroshnik told Izvestia that intensified Russian strikes on military facilities in Ukraine aim to limit Vladimir Zelensky's ability to escalate the conflict and damage the Russian economy, TASS reports. TASS says the Russian Defence Ministry earlier announced the intensified strikes on military facilities and the defence industry in Kyiv and other regions after Zelensky said Ukraine would increase strikes on Russian oil refineries. Miroshnik said Ukraine's summer actions, including what he called a 40-day effort to force Russia into negotiations, had led to escalation and more Russian strikes.", "url": "https://tass.com/politics/2197709"}, {"id": "tass-06oct-07", "title": "Japan’s sanctions against Russia show lack of independence of Tokyo’s foreign policy — MFA", "source": "TASS", "date": "06 Oct 2026", "tags": ["Geopolitics"], "summary": "Russian Foreign Ministry Spokeswoman Maria Zakharova said Japan's new sanctions against Russia confirm that Tokyo's foreign policy is not independent, TASS reports. Zakharova said Tokyo on October 2 announced what she called its 27th package of illegitimate measures against Russia, targeting 33 Russian legal entities, nine individuals and a number of companies abroad; Japan's Foreign Ministry confirmed the measures concern 33 Russian entities and nine individuals. She said Tokyo's policy is dictated not by national interests but by unquestioning solidarity with Euro-Atlantic partners that she described as pathologically fixated on inflicting a strategic defeat on Russia.", "url": "https://tass.com/politics/2197813"}, {"id": "tass-06oct-08", "title": "Lower grain exports because of port destruction could be disaster for Ukraine — FT", "source": "TASS", "date": "06 Oct 2026", "tags": ["Trade", "Geopolitics"], "summary": "TASS, citing the Financial Times, reports that lower grain exports due to port destruction could be catastrophic for Kyiv, with severe damage to Black Sea ports leaving Ukraine practically without its main export route and shipping in the Odessa Region suspended. According to the FT, Agrarian Policy and Food Minister Taras Vysotsky warned that if the shutdown continues, losses from June 2026 to June 2027 will reach at least US$8 billion, or 20% of 2025 export revenue, and farmers say wheat prices have fallen from US$220 to US$130 per tonne. The FT notes Russia and Ukraine accounted for a third of world wheat exports and 20% of corn exports before 2022.", "url": "https://tass.com/economy/2197657"}, {"id": "tass-06oct-09", "title": "Merz goes to Kiev to 'escape' low ratings in Germany — Berliner Zeitung", "source": "TASS", "date": "06 Oct 2026", "tags": ["Politics", "Geopolitics"], "summary": "TASS, citing Berliner Zeitung, reports that Harald Neuber, head of the paper's news and international departments, wrote that German Chancellor Friedrich Merz visited Ukraine last weekend to escape low ratings at home and regional election defeats. Neuber noted Merz's approval had hit a record low, with only 10% of Germans rating his performance positively and 88% negatively, against 64% positive in an August poll in Ukraine. He cited a recent Infratest poll in which 42% of Germans, the highest since February 2022, called current military aid to Ukraine excessive, arguing Germans oppose \"help without an end goal\" rather than helping Ukraine as such.", "url": "https://tass.com/world/2197801"}, {"id": "tass-06oct-10", "title": "Rubio says US could suspend operations of embassy in Kiev", "source": "TASS", "date": "06 Oct 2026", "tags": ["Geopolitics"], "summary": "TASS reports that US Secretary of State Marco Rubio did not rule out suspending operations of the US Embassy in Ukraine, telling reporters Washington will determine whether it is safe for staff to stay. Commenting on Russian warnings to foreign diplomats, Rubio said Moscow had been warning them to leave for months and it was no surprise to anyone that Kyiv is under attack, adding that the US had not changed its posture there so far. TASS recalls that Kremlin Spokesman Dmitry Peskov said Moscow had warned foreign embassies in Kyiv by all available means and that it is up to each country to decide whether to stay.", "url": "https://tass.com/world/2197749"}, {"id": "tass-06oct-11", "title": "Russia discusses possible energy cooperation with US — Kremlin", "source": "TASS", "date": "06 Oct 2026", "tags": ["Energy", "Geopolitics"], "summary": "Russian Presidential Spokesman Dmitry Peskov told reporters that the possibility of cooperation in the energy sector comes up in Russia's discussions with US counterparts, TASS reports. Peskov declined to comment on The New York Times' claims that the sale of Lukoil's foreign assets is among the issues Moscow and Washington are discussing as part of talks on resolving the Ukrainian conflict. \"I will not comment specifically on this report,\" he said at the briefing.", "url": "https://tass.com/politics/2197667"}, {"id": "tass-06oct-12", "title": "Tanker struck by projectile in Strait of Hormuz — UKMTO", "source": "TASS", "date": "06 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "TASS, citing the United Kingdom Maritime Trade Operations Coordination Center (UKMTO), reports that a tanker was hit by an unidentified projectile in the Strait of Hormuz and caught fire. According to UKMTO, the tanker's master reported a fire in the engine room that the crew were fighting, with no reported casualties or environmental impact at the time of the warning. UKMTO said authorities are investigating, and the incident was marked as an attack.", "url": "https://tass.com/world/2197847"}, {"id": "tass-06oct-13", "title": "Trump links rising gas prices to Kiev strikes, Democratic policies", "source": "TASS", "date": "06 Oct 2026", "tags": ["Energy", "Politics"], "summary": "US President Donald Trump wrote on Truth Social that what is driving up gasoline prices is \"no longer the Strait of Hormuz\", where he said record numbers of barrels are coming out almost daily, but refineries, TASS reports. He pointed to Russian refineries being blown up by Ukraine and to refinery closures in Democratic-led US states such as California, which he blamed on Democrats. TASS recalls that on October 4 the Russian Defence Ministry said Russian forces would intensify strikes on military facilities and defence industry sites in Kyiv and other regions, after Vladimir Zelensky said Ukraine would step up attacks on Russian oil refineries.", "url": "https://tass.com/economy/2197875"}, {"id": "xinhua-06oct-01", "title": "AMRO slightly raises ASEAN+3 2027 growth forecast to 4.1 pct", "source": "XINHUA", "date": "06 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "The ASEAN+3 Macroeconomic Research Office (AMRO) on Oct 5 raised its 2027 growth forecast for the ASEAN+3 region (ASEAN member states plus China, Japan and South Korea) by 0.1 percentage point to 4.1%, citing stronger AI-related exports and investment, Xinhua reports from Singapore. AMRO kept its 2026 forecast unchanged at 4.1%. AMRO Chief Economist Dong He said the AI investment cycle is supporting a widening range of regional activities though domestic demand remains uneven, and that energy and industrial-input disruptions proved less severe than feared, while higher energy and logistics costs still weigh on households and businesses. AMRO said the outlook is particularly sensitive to AI-related demand, with downside risks from renewed Middle East energy disruptions, a more persistent El Nino, financial-market volatility and further protectionist measures.", "url": "https://english.news.cn/20261005/a81e4dd1acb0487e87d48a3c68171584/c.html"}, {"id": "xinhua-06oct-02", "title": "Chinese military expels Philippine aircraft from Huangyan Dao airspace", "source": "XINHUA", "date": "06 Oct 2026", "tags": ["Geopolitics", "Defence", "Southeast Asia"], "summary": "The PLA Southern Theater Command said it expelled a Philippine C-208 aircraft from airspace over Huangyan Dao (Scarborough Shoal) on Oct 3, saying the plane had \"illegally intruded\" without Chinese government approval, Xinhua reports. Spokesperson Zhai Shichen said on Oct 5 that the command dispatched naval and air forces to track and monitor the aircraft and issued warnings to expel it. Zhai asserted that Huangyan Dao is China's inherent territory and said the Philippine side's acts seriously violate China's sovereignty and are highly likely to cause unintended maritime and air incidents. He warned the Philippine side to stop what he called rights violations and provocative acts, saying the command's forces remain on high alert.", "url": "https://english.news.cn/20261005/e14cde4a30aa46bcbdc88cc95baafea8/c.html"}, {"id": "xinhua-06oct-03", "title": "Economic Watch: Holiday travel highlights China's transport strength, economic vitality", "source": "XINHUA", "date": "06 Oct 2026", "tags": ["Finance & Markets", "Trade"], "summary": "A Xinhua 'Economic Watch' feature says China's Oct 1–7 National Day holiday travel rush showcases its transport network and economic vitality. According to the Ministry of Transport, cross-regional passenger trips exceeded 300 million on each of the first three days, while China Railway said railways handled over 25.2 million passenger trips on Oct 1, a single-day record. Xinhua points to a transport network of more than 6 million km by end-2025, four high-speed rail sections totalling over 1,100 km opened on Sept 28, and more than 24 million EV charging facilities, with the ministry expecting expressway NEV trips at 1.8 times usual levels. It adds that the route from Nanning Port via the Pinglu Canal, opened Sept 16, handles an extra 20,000 tonnes of cargo a day.", "url": "https://english.news.cn/20261005/298f278383cf4dcbbe78526d8aad48da/c.html"}, {"id": "xinhua-06oct-04", "title": "Foreign issuers take majority share of panda bond proceeds in H1", "source": "XINHUA", "date": "06 Oct 2026", "tags": ["Finance & Markets"], "summary": "Foreign issuers took 54% of panda bond proceeds in China in the first half of 2026, exceeding Chinese issuers' share for the first time, according to the State Administration of Foreign Exchange (SAFE), as reported by Xinhua. SAFE's H1 balance-of-payments report said foreign issuers raised 58.7 billion yuan (about US$8.7 billion) for intended overseas use, 68% of their total proceeds. Xinhua says cumulative issuance exceeds 1.3 trillion yuan from issuers in 26 countries and regions and, citing Wind Information, that issuance this year had passed 240 billion yuan as of Sept 17, up 81% year on year. Analysts cited by Xinhua see lower renminbi financing costs as a major reason for this year's record issuance; the People's Bank of China said it will support more eligible overseas entities to issue panda bonds.", "url": "https://english.news.cn/20261005/a12d8a0664c14b9ca6488b3ea326b023/c.html"}, {"id": "xinhua-06oct-05", "title": "World Insights: Three risks weigh on Europe's growth", "source": "XINHUA", "date": "06 Oct 2026", "tags": ["Finance & Markets", "Energy"], "summary": "A Xinhua 'World Insights' analysis says costly energy, rising inflation and higher borrowing costs threaten Europe's recovery, even though the ECB raised its 2026 and 2027 growth forecasts in September. It argues the G7's Oct 2 agreement to release 100 million barrels of oil and diesel through the International Energy Agency may buy time but cannot solve insufficient refining capacity, citing FuelsEurope's count of 35 European refinery closures since 2009. Citing Eurostat's flash estimate, it puts September euro-area inflation at 3.8%, up from 3.2% in August, with energy prices up 18.8%, while ECB hikes in June and September have lifted the deposit rate to 2.5%. It adds that the French-German 10-year bond spread widened to 145.5 basis points on Oct 5 as investors questioned France's ability to curb its deficit.", "url": "https://english.news.cn/20261006/fd5bd010dfb44d579d5950a14b1d415a/c.html"}, {"id": "xinhua-06oct-06", "title": "Xinhua Headlines: Longer trips, richer experiences: China's National Day holiday reveals shifting tourism trends", "source": "XINHUA", "date": "06 Oct 2026", "tags": ["Society", "Finance & Markets"], "summary": "A Xinhua feature says Chinese travellers are venturing farther this National Day holiday, with family trips and experience-oriented travel on the rise, according to travel agencies. Tuniu data show tours of 10 days or more account for 26% of holiday bookings, while foot traffic and revenue at 78 major shopping streets and commercial districts monitored by the Ministry of Commerce rose 3.4% and 5.3% year on year over Oct 1–3. The feature also highlights red tourism, robots at tourist sites and rural destinations, citing Fliggy data showing nearly 50% more users buying nature and village travel products. The National Immigration Administration expects about 2.15 million border passenger trips a day, and the commerce ministry says overseas visitors spent 263.6 billion yuan in the first seven months of 2026, up 27.8%.", "url": "https://english.news.cn/20261005/fe2bb924fb164cc9a2631ac501727a72/c.html"}]}, "2026-10-07": {"date": "2026-10-07", "dayOfWeek": "Wednesday", "totalArticles": 66, "sourceCounts": {"WSJ": 12, "ST": 17, "BT": 13, "SCMP": 11, "TASS": 8, "XINHUA": 5}, "executiveDigest": "Gulf oil is flowing again but the risks around it are multiplying: Hormuz crude cargoes are back to 76% of prewar levels, yet UKMTO has reported nine attacks in the strait so far in October, Gulf-to-China tanker costs hit a record US$1.3 million a day and refined products stay scarce after US diesel hit a record in late September. The war is also widening, as Riyadh resumed major air strikes on the Houthis and Houthi attacks damaged two Saudi airports. US 10-year yields are around 5.3% and Ray Dalio warns China and Japan may pull back from Treasuries, while Fed officials have cooled bets on an October hike. China's AI labs are lining up huge raises, with DeepSeek close to at least 80 billion yuan and Moonshot valued at about US$50 billion. From the state agencies, TASS carries Trump's claim that the US Navy fully controls Hormuz and Beijing's denial that it shared navigation intelligence with Iran. Singapore is studying an energy cluster on Pulau Tekong.", "briefingCards": [{"title": "Lead story - Gulf oil flows recover toward prewar levels as Iran steps up tanker attacks", "body": "Crude cargoes leaving the Strait of Hormuz reached a seven-day average of 10.3 million barrels a day as of Oct 3, 76% of the prewar baseline, but refined products were just 1.3 million b/d, or 11% of flows against more than 20% before the war, Kpler data show (WSJ). Vitol chief executive Russell Hardy said about 12 million bpd of crude and 2 million bpd of products had left the Middle East by tanker in the past 7 to 10 days, and that without that flow 'you do have that US$200 per barrel scenario' (BT). The attacks are rising with the flows: UKMTO has reported nine attacks in the strait so far in October, half its September total for Hormuz and the Persian Gulf combined, Oman's defence ministry said it rescued 10 crew from the On Peace, a tanker that caught fire after an attack, and the cost of carrying oil from the Gulf to China hit a record US$1.3 million a day on Oct 5, Baltic Exchange data show (BT). Consumers feel the products squeeze: US diesel hit a record national average of US$6.53 a gallon in late September, and on Oct 5 Trump ordered temporary highway use of tax-exempt dyed diesel (WSJ). The war is widening on the Red Sea flank: more than 100 Saudi warplanes bombed the Houthis on Oct 5, ending a four-year lull, and Pakistan and Turkey said they would deploy forces in Saudi Arabia under an August defence pact (SCMP), while Saudi Arabia's civil aviation authority said Houthi strikes damaged airports in Jazan and Najran, wounding three (WSJ). Vice-President J.D. Vance told Reuters Iran must make a 'meaningful' cut to its enrichment capacity to end the war (ST). Framing differs: TASS leads on Trump's claim in Baltimore that the US does not need Iranian oil and that the Strait of Hormuz is fully controlled by the US Navy (TASS), while BT's Bloomberg report leads on Iran stepping up attacks, which a Marisks note says appear aimed at asserting greater control through 'fear and uncertainty' (BT)."}, {"title": "Markets & finance - Treasury yields near 2002 highs as Fed officials cool October-hike bets", "body": "US 10-year Treasury yields are around 5.3%, levels last seen in 2002, and Bridgewater founder Ray Dalio warned in Singapore that China and Japan may pull back from US debt, as the US relies on foreign capital for about a third of its borrowing (BT). China's Treasury holdings fell to an 18-year low of US$618 billion in July, and analysts quoted by SCMP call Beijing's shift a defensive safety net rather than a bid to replace the dollar, with CIPS transaction value up 11.9% to 100.9 trillion yuan in the first half (SCMP). New York Fed President John Williams and Vice Chair Philip Jefferson signalled no hurry to hike at the Oct 27-28 meeting, and the odds of an October move, around 70% after September's increase, fell to around 25% before the Oct 2 jobs report, a WSJ analysis says (WSJ); the BOJ may signal that underlying inflation has roughly hit 2%, three sources say, reinforcing expectations of a December hike (BT). The US trade deficit widened 13.7% to US$105.6 billion in August as imports hit a record US$420.8 billion (ST), and Canada's surplus widened to C$4.2 billion as tariff front-running lifted exports to the US (WSJ). The IMF raised its 2026 global inflation forecast to 4.7% and warned of a 'lasting deterioration in the affordability of essentials' (ST), and PIIE sees China's growth slowing to 4.6% this year and 4.3% in 2027 (SCMP). In Europe, Finance Minister Roland Lescure says France is ready to bypass a National Assembly vote if needed to pass a budget with €43 billion of cuts (WSJ), eurozone retail sales rose just 0.1% in August (WSJ), and German industrial orders fell 10.6%, mainly on a 61.5% plunge in volatile other-transport-equipment orders, Xinhua reports, citing Destatis (Xinhua). In deals, CD&R and McKesson will buy Option Care Health for about US$5.8 billion including debt (WSJ)."}, {"title": "Asia realignment - Beijing's advisers draft post-reunification plans as Taiwan seeks a drone shield", "body": "Leading mainland research institutes have finalised or nearly completed the first proposals for governing Taiwan after reunification, the SCMP has learned; the studies are unpublished and not official policy, and scholars say a peaceful deal could leave more autonomy than 'compelled reunification' (SCMP). In Taipei, Defence Minister Wellington Koo said he had not heard of any US plan to split a potential US$14 billion arms sale, which Trump has withheld to maintain warm relations and a fragile trade truce with Xi, and that Washington's commitments had not changed (ST), while California's Aevex Aerospace will build Ukraine-tested drones with Taiwan's CIRC as the economy minister says the island needs more than 200,000 drones for deterrence (SCMP). North Korea's KCNA accused Washington of fuelling Taiwan Strait tensions after the first two of 66 F-16V jets arrived, and Kim Jong Un pledged continued support for Russia in a birthday message to Putin (ST). The US has discussed reciprocal visits to nuclear sites with China, CNN reported, citing sources, though Reuters could not immediately verify it (ST). Beijing's line came through TASS: foreign ministry spokesman Guo Jiakun said China has not shared navigation-related intelligence with Iran and rejects 'attempts to discredit China' (TASS). So did Moscow's: the Russian Embassy in Japan said Moscow will keep answering Tokyo's sanctions, which on Oct 2 added 33 Russian companies, nine individuals and 35 vessels, with countermeasures aimed at hurting Japanese interests (TASS). On Ukraine, Zelensky said intelligence shows Russia is preparing a 'massive attack' (ST), while Ambrey told TASS that many underwriters no longer cover Ukraine port calls (TASS). Framing differs: TASS carries Trump's remark in Baltimore that peace is getting closer and blames the higher Black Sea threat on what it calls a campaign initiated by Ukraine (TASS). Lithuania's parliament backed lifting its constitutional ban on weapons of mass destruction at a first reading, Xinhua reports (Xinhua)."}, {"title": "Energy & climate - Big Tech locks in nuclear power as Vitol warns of a tight winter for fuels", "body": "Google and Constellation Energy agreed a 20-year, 890-megawatt deal to raise output at 11 existing reactors in Illinois, Pennsylvania and New Jersey, the largest uprate project between a nuclear-power provider and a tech company, with Constellation investing more than US$4.3 billion; a separate 15-year deal covers 2,700 megawatts in the PJM market, and Constellation shares rose 12% (WSJ). Energy Transfer plans to buy Vaquero Midstream, a gathering and gas-processing business, for about US$2.63 billion in cash and units (WSJ). Refined products are the pinch point: Vitol's Hardy says the world is still short of refining capacity after hits on Russian infrastructure and five lost months of Middle East refining runs, so tightness will roll into winter (BT), and eurozone auto-fuel sales fell 1.9% in August as crude prices climbed (WSJ). Brussels is easing the burden: exporters are set to get an extra year to comply with EU methane-emission rules, Ursula von der Leyen said, and the commission will set up a dialogue on European refineries (WSJ). In South-east Asia, energy ministers meet in Manila as the region imports more than half its refinery crude from the Middle East and Chinese refiners have suspended product exports for October, and the IEA sees the region's energy import bill rising to about US$245 billion by 2035 without structural change (ST). The shift away from petrol is visible in Australia, where petrol vehicle sales fell 36.2% in September and battery EVs took 24.2% of new sales, with China supplying 35.5% of vehicles against Japan's 22.5%, Xinhua reports, citing the FCAI (Xinhua)."}, {"title": "Technology & AI - Chinese labs line up mega-rounds and IPOs as AI-linked hacks raise cyber alarms", "body": "DeepSeek is close to securing at least 80 billion yuan in its latest round, beating an initial target of about 50 billion yuan, with CATL and Tencent among the largest backers ahead of a planned IPO in early 2027, sources said (ST), and Moonshot AI has closed a final private round at about US$50 billion and is heading for a Hong Kong IPO in the first quarter of 2027, sources said (ST). In the US, Lambda is raising up to US$4 billion at a US$14.5 billion valuation excluding the new money, people familiar said, and a letter to investors says its backlog reached US$50 billion, driven by a US$35 billion commitment from Anthropic (WSJ); banks are now financing GPU purchases in Asia, where PwC sees data-centre spending reaching US$8.2 trillion by 2050 (BT). Open-weight rivals are multiplying: Mistral unveiled Le Chonk, its biggest open-weight model (ST), and Nvidia-backed Reflection AI debuted Beam to challenge Chinese dominance of open models (SCMP), as an SCMP analysis describes 'model fatigue' and price wars among Chinese labs (SCMP). Cyber risk is the worry: JPMorgan's Jamie Dimon said AI risks 'went up 10-fold after Mythos' (BT), South Korea's President Lee Jae Myung said signs have emerged that AI models were used in some recent attacks on banks, and Shinhan says about 25,000 people's credit data leaked (BT), and OpenAI and Anthropic told an Australian inquiry they would welcome breach-reporting rules after OpenAI took three months to disclose an agent's breach of the main health portal (ST). An SCMP opinion piece argues that asking whether China would slow frontier AI is the wrong question (SCMP)."}, {"title": "Singapore & SEA focus - Tekong energy hub study and a busy debut for SGX's smaller lots", "body": "The Energy Market Authority is studying a 200ha energy cluster on Pulau Tekong that could host a third LNG terminal, hydrogen-compatible gas power plants and electricity import facilities, assessing about 6 gigawatts of domestic generation and 2 gigawatts of imports against national capacity of about 13 gigawatts (ST). On the Oct 5 debut of smaller board lots, over 20,000 trades went through in 10-share lots across the 11 stocks against more than 13,000 in 100-share lots, led by DBS with about 5,000, and 55% of trades were below the old 100-share lot (BT). Singapore-headquartered DayOne Data Centers filed for a US IPO, reporting a first-half net loss of US$81.9 million on revenue of US$512 million (ST), and UOB is leading talks on a fresh US$6 billion raise for Zankore after co-underwriting its US$3.1 billion Indonesian loan, Zankore's chairman said (BT). Flows are building: Citi's Singapore commercial-banking revenue rose 21% in the first seven months as geopolitical de-risking pushes firms to centralise regional decisions here (BT), and Singapore is starting central-bank gold-vaulting services this month (BT). Cash flow is tighter, though: slow payments rose for a third straight quarter to 44.47% of transactions, with construction worst at 55.88% (BT). In Parliament, MPs filed questions on reporting requirements for rogue AI incidents and on mandatory safety requirements for frontier AI models (ST). Regionally, the World Bank raised Malaysia's 2026 growth forecast by 0.7 points to 5.1% on AI-related demand, Xinhua reports (Xinhua), and the US posted record goods deficits with Vietnam and Malaysia in August (ST)."}], "keyMetrics": [{"value": "66", "label": "Articles curated today", "sub": "WSJ 12 · ST 17 · BT 13 · SCMP 11 · TASS 8 · Xinhua 5"}, {"value": "76%", "label": "Hormuz crude cargoes vs prewar, Oct 3", "sub": "10.3M b/d seven-day average; refined products just 11% of flows (WSJ)"}, {"value": "~5.3%", "label": "US 10-year Treasury yield", "sub": "Levels last seen in 2002; Dalio warns China and Japan may pull back (BT)"}, {"value": "US$105.6B", "label": "US trade deficit, August", "sub": "Widest since March 2025; imports a record US$420.8B (ST)"}, {"value": "5.1%", "label": "World Bank 2026 Malaysia growth forecast", "sub": "Raised 0.7pt on AI-related demand (Xinhua)"}, {"value": "20,000+", "label": "SGX trades in 10-share lots, Oct 5 debut", "sub": "vs 13,000+ in 100-share lots; DBS led with about 5,000 (BT)"}], "articles": [{"id": "wsj-07oct-01", "title": "AI-Computing Startup Lambda Is Raising $4 Billion in Final Round Before Planned IPO", "source": "WSJ", "date": "07 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Nvidia-backed cloud-computing company Lambda is raising up to US$4 billion in a final round before its planned IPO, at a US$14.5 billion valuation excluding the new money, according to people familiar with the matter. Blackstone and Coatue Management lead the round, and a letter to limited partners reviewed by the WSJ says management targets a 2027 IPO, subject to execution and market conditions. The letter says Lambda's backlog grew from US$15 billion in June to US$50 billion in September, driven primarily by a US$35 billion commitment from Anthropic. In moves that appear aimed at preparing for public-market scrutiny, Lambda replaced co-founder Stephen Balaban as CEO with Michel Combes in May and hired Charles Fisher as CFO.", "url": "https://www.wsj.com/tech/ai/ai-neocloud-lambda-is-raising-4-billion-in-final-round-before-planned-ipo-568182f9"}, {"id": "wsj-07oct-02", "title": "After Kevin Warsh took over the Fed this spring, he said he wanted investors to watch the economy, not the Fed: Play the ball, not the referee. Last week, the referees stepped in", "source": "WSJ", "date": "07 Oct 2026", "tags": ["Finance & Markets", "Politics"], "summary": "A WSJ analysis by Nick Timiraos says New York Fed President John Williams and Vice Chair Philip Jefferson reset expectations last week, signalling no hurry to raise rates at the Oct 27-28 meeting without requiring Chair Kevin Warsh to depart from his approach of not previewing decisions. Odds of an October hike, which had climbed to around 70% after Warsh explained September's increase, tumbled to around 25% before the Oct 2 jobs report pushed them lower. Goldman Sachs and RBC Capital Markets dropped October-hike forecasts, joining most analysts in expecting a December hike. Bond yields kept rising, the 10-year Treasury yield reaching around 5.25% from 5% after the Sept 16 increase, and any surprise carries political risk as the meeting falls six days before the midterm elections.", "url": "https://www.wsj.com/economy/central-banking/why-weaning-markets-off-fed-speak-is-harder-than-it-sounds-d202aefb"}, {"id": "wsj-07oct-03", "title": "Americans Want AI’s Benefits Without Costs", "source": "WSJ", "date": "07 Oct 2026", "tags": ["Technology & AI", "Politics"], "summary": "In a WSJ letter, Tomas J. Philipson, a former acting chairman of the President's Council of Economic Advisers who serves on Anthropic's Economic Advisory Board, argues data-centre opposition is a public-goods problem: Americans want AI's benefits but would prefer others bear the local costs. He notes 52% of US workers use AI on the job, according to Gallup, yet roughly 70% of Americans oppose data centres near them and more than 400 local moratoriums are recorded across 44 states. He cites New York's July statewide moratorium on large data centres and a Texas directive in August that halted as many as 1,800 projects. Philipson proposes putting servers on vacant federal land, noting the federal government owns about 28% of the nation's land, and argues innovation will shrink data centres.", "url": "https://www.wsj.com/opinion/americans-want-ais-benefits-without-costs-b48477d5"}, {"id": "wsj-07oct-04", "title": "CD&R, McKesson to Acquire At-Home Infusion Therapy Provider for $5.8 Billion", "source": "WSJ", "date": "07 Oct 2026", "tags": ["Finance & Markets", "Society"], "summary": "Private-investment firm CD&R and healthcare services provider McKesson will acquire at-home infusion therapy provider Option Care Health for about US$5.8 billion including debt, paying US$32.05 a share, a roughly 37% premium to the Oct 5 close, the companies said on Oct 6. CD&R will hold a majority interest of about 51%, while McKesson will invest roughly US$1.4 billion for about 49%. The deal will take Option Care Health private and end its Nasdaq listing, though it will remain a separate company under its own management; its shares jumped 33% to US$31.17 in premarket trading. Closing is expected in the first half of 2027, subject to shareholder and regulatory approvals.", "url": "https://www.wsj.com/business/deals/cd-r-mckesson-to-acquire-at-home-infusion-therapy-provider-for-5-8-billion-1beddf40"}, {"id": "wsj-07oct-05", "title": "Canada’s August Trade Surplus Widens Sharply Ahead of Fresh Tariffs", "source": "WSJ", "date": "07 Oct 2026", "tags": ["Trade", "Finance & Markets"], "summary": "Canada's goods-trade surplus widened to C$4.2 billion (about US$2.94 billion) in August from C$787 million in July, the largest since May 2022 and well above the roughly C$1.5 billion economists expected, Statistics Canada said on Oct 6. Exports rose 2.5% to C$77.91 billion, the second-highest on record, driven largely by front-running of new 50% US tariffs on about 5% of Canadian goods that took effect in late August. Shipments to the US jumped 8.1%, offsetting an 8.5% drop to other countries, and the surplus with the US widened to C$11.22 billion in the biggest positive shift ever. Analysts expect the balance to narrow as trade tensions weigh, with CIBC's Katherine Judge warning exports will stay under pressure in the fourth quarter without a US trade deal.", "url": "https://www.wsj.com/economy/trade/canadas-august-trade-surplus-widens-sharply-ahead-of-fresh-tariffs-48955372"}, {"id": "wsj-07oct-06", "title": "Energy Transfer to Acquire Vaquero Midstream for $2.63 Billion", "source": "WSJ", "date": "07 Oct 2026", "tags": ["Energy", "Finance & Markets"], "summary": "Pipeline transportation company Energy Transfer plans to acquire Vaquero Midstream for about US$2.63 billion, comprising US$1.95 billion in cash and about 33.3 million newly issued Energy Transfer common units, it said on Oct 6. Energy Transfer said Vaquero brings a rapidly growing midstream services business, including wellhead gathering and intrabasin transportation pipelines and a natural gas processing complex. It said the assets are poised to benefit from continued development across the Delaware Basin and will offer further long-term growth as production expands around its existing infrastructure network. The deal is expected to close in the fourth quarter, subject to regulatory approval and customary closing conditions.", "url": "https://www.wsj.com/business/energy-oil/energy-transfer-to-acquire-vaquero-midstream-for-2-63-billion-79c90c47"}, {"id": "wsj-07oct-07", "title": "Eurozone Retail Sales Edge Higher Despite Slump in Fuel Sales", "source": "WSJ", "date": "07 Oct 2026", "tags": ["Finance & Markets", "Energy"], "summary": "Eurozone retail sales volumes rose 0.1% month on month in August, swinging from a 0.6% fall in July but missing the 0.3% gain economists polled by the WSJ expected, Eurostat said on Oct 6. Food, drinks and other non-fuel sales rose slightly, with German retail in particular strengthening, but auto-fuel sales fell 1.9% as crude prices climbed on uncertainty over hostilities in the Persian Gulf. Sales were 0.8% above a year earlier, though Pantheon Macroeconomics' Claus Vistesen said July–August sales averaged about 0.3% below second-quarter levels. With Brent above US$105 a barrel at points in September, Capital Economics' Harry Chambers said fuel sales could fall again, but forecasts consumption growth to stay resilient, even if it slows from the second quarter's 0.4%.", "url": "https://www.wsj.com/business/retail/eurozone-retail-sales-edge-higher-despite-slump-in-fuel-sales-7dd2c5a2"}, {"id": "wsj-07oct-08", "title": "Exporters to Get Extra Year for EU’s Methane Emission Rules, Von Der Leyen Says", "source": "WSJ", "date": "07 Oct 2026", "tags": ["Energy", "Environment"], "summary": "Exporters are set to get an extra year to adapt to incoming EU methane-emission rules, European Commission President Ursula von der Leyen said, telling EU lawmakers on Oct 6 that the move would save additional costs during a crisis period. Under the rulebook, oil and gas importers in the bloc would have faced stricter methane-emissions reporting requirements on their suppliers from January 2027. It comes as policymakers race to shield industry from high fuel costs triggered by conflicts in the Middle East and Ukraine; the G7 agreed earlier in October to release 100 million barrels of diesel and crude oil. Von der Leyen also said the commission would set up a dialogue on European refineries to lower prices and ensure sufficient energy supplies.", "url": "https://www.wsj.com/world/europe/exporters-to-get-extra-year-for-eus-methane-emission-rules-von-der-leyen-says-b5ecf787"}, {"id": "wsj-07oct-09", "title": "French Government Is Willing to Bypass Parliament to Pass Billions in Cuts", "source": "WSJ", "date": "07 Oct 2026", "tags": ["Politics", "Finance & Markets"], "summary": "French Finance Minister Roland Lescure said in an interview the government is ready to invoke constitutional clause 49.3, bypassing a National Assembly vote, if lawmakers won't pass next year's budget; his red lines are a deficit capped at 5% of GDP and no growth-hurting changes. The budget's €43 billion (about US$48 billion) of cuts face criticism from presidential front-runners Marine Le Pen and Jean-Luc Mélenchon, amid investor worries over political paralysis that have fuelled a surge in borrowing costs. A 49.3 move invites a no-confidence vote, which felled the previous two prime ministers, though Prime Minister Sébastien Lecornu's government could use executive orders if no final vote occurs within 70 days of submission. On Oct 6, as more than 260,000 people joined education protests, Le Pen called the budget ineffective and unfair.", "url": "https://www.wsj.com/world/europe/french-government-is-willing-to-bypass-parliament-to-pass-billions-in-cuts-699d99c5"}, {"id": "wsj-07oct-10", "title": "Google and Constellation Energy Strike a Sweeping Nuclear-Power Deal", "source": "WSJ", "date": "07 Oct 2026", "tags": ["Energy", "Technology & AI", "Finance & Markets"], "summary": "Google and Constellation Energy unveiled a 20-year, 890-megawatt power-purchase deal on Oct 6 to boost output at 11 existing Constellation reactors in Illinois, Pennsylvania and New Jersey, the largest-ever uprate project between a nuclear-power provider and a tech company. Constellation plans to invest more than US$4.3 billion, adding power roughly equivalent to a new large reactor, with the first uprate targeted for 2028 and construction on the others continuing through 2032 or 2033. The firms also agreed a 15-year deal for another 2,700 megawatts in the PJM market; Constellation shares rose 12%, sparking a rally that lifted Talen Energy 12%, Vistra 11% and NRG Energy 7%. It follows a 20-year Constellation deal with Amazon announced last week that included a 190-megawatt uprate, as tech firms seek power for new data centres.", "url": "https://www.wsj.com/business/energy-oil/google-and-constellation-energy-strike-a-sweeping-nuclear-power-deal-4287b372"}, {"id": "wsj-07oct-11", "title": "Oil Is Flowing From Hormuz Again—Just Not the Kind the World Needs Most", "source": "WSJ", "date": "07 Oct 2026", "tags": ["Energy", "Geopolitics"], "summary": "Crude cargoes leaving the Strait of Hormuz hit a seven-day average of 10.3 million barrels a day as of Oct 3, 76% of the prewar baseline, but refined products were just 1.3 million barrels a day, 11% of flows versus more than 20% before the Iran war, Kpler data show. Refineries in Saudi Arabia, Kuwait, the UAE and Iraq are down after missile strikes and other outages, and US diesel hit a record national average of US$6.53 a gallon in late September. The G7 agreed on Oct 2 to release 100 million barrels of crude and fuel, and on Oct 5 President Trump ordered temporary highway use of tax-exempt dyed diesel, deferring a 24.4-cent-a-gallon federal tax through year-end. Analysts say a full recovery, if current flows hold, wouldn't come until well into 2027.", "url": "https://www.wsj.com/business/energy-oil/diesel-strait-of-hormuz-e1940e50"}, {"id": "wsj-07oct-12", "title": "Yemen’s Houthi Rebels Strike Two Airports in Saudi Arabia", "source": "WSJ", "date": "07 Oct 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "Yemen's Houthi rebels damaged two Saudi airports, in Jazan and Najran, wounding three people, the kingdom's civil aviation authority said on Oct 6, the latest escalation in fighting that threatens global energy markets. The attacks follow a counteroffensive by the kingdom and its allies in Yemen to retake Red Sea territory; the Iranian-backed Houthis launched a new offensive in September, seizing a strategic Red Sea island. Late on Oct 5 the Houthis warned international airlines off Saudi airspace except over Mecca and Medina, while the EU's aviation safety agency has warned of an increased risk of misidentifying civil aircraft. Crown Prince Mohammed bin Salman asked President Trump for military help in September, but the president has limited US involvement to intelligence and other indirect support, a US military official said.", "url": "https://www.wsj.com/world/middle-east/yemens-houthi-rebels-strike-two-airports-in-saudi-arabia-072f4dd3"}, {"id": "st-07oct-01", "title": "DeepSeek set to raise at least $15 billion in Tencent-backed funding", "source": "ST", "date": "07 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "DeepSeek is close to securing at least 80 billion yuan in its latest funding round, beating an initial target of about 50 billion yuan ahead of a planned IPO in early 2027, sources familiar with the matter said. CATL and Tencent Holdings have committed among the largest amounts, and signed term sheets could take the total close to 100 billion yuan, the sources said; DeepSeek had originally targeted a valuation of about 500 billion yuan. Investor interest outstripped expectations after the release of its latest AI model, they said, and the company plans to deploy at least 160,000 Huawei accelerators at a data centre it is building in Inner Mongolia. Once the round closes, the next step should be restructuring for the IPO, according to the sources.", "url": "https://www.straitstimes.com/business/deepseek-set-to-raise-at-least-15-billion-in-tencent-backed-funding"}, {"id": "st-07oct-02", "title": "France’s Mistral unveils ‘Le Chonk’, its latest model in sovereign AI push", "source": "ST", "date": "07 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "French AI start-up Mistral on Oct 6 unveiled Le Chonk, its biggest open-weight model, pitching it to clients that want to keep their data private rather than rely on closed models from Anthropic and OpenAI. It is Mistral's first major launch since it raised €3 billion in September in Europe's biggest technology fund-raising, at a valuation of over €21 billion. Mistral said the model, still being refined, was built on 4,000 Nvidia chips over two months at its own data centres in Europe, and that its benchmark scores make it \"by far the best in Europe and the US\" among open-weight models. It was trained on more than 160 languages and can run on clients' own servers or Mistral's infrastructure, including a sovereign region under EU jurisdiction.", "url": "https://www.straitstimes.com/world/europe/frances-mistral-unveils-le-chonk-its-latest-model-in-sovereign-ai-push"}, {"id": "st-07oct-03", "title": "IMF warns cost-of-living shocks cause ‘lasting deterioration’ in affordability", "source": "ST", "date": "07 Oct 2026", "tags": ["Finance & Markets", "Society"], "summary": "The IMF warned on Oct 6 that price rises for necessities such as food and energy, fuelled by the wars in Iran and Ukraine, are more persistent than previously expected, leaving people facing a \"lasting deterioration in the affordability of essentials\". The report, part of its World Economic Outlook release, finds the relative prices of necessities keep rising for more than a year after a typical episode begins, and inflation expectations stay above pre-crisis levels for years, which may complicate central banks' efforts to control inflation. The Iran war, launched in February 2026, led the IMF to raise its 2026 global inflation forecast to 4.7%, compared with 4.1% the year before. It urged targeted, temporary transfers rather than broad-based subsidies, though many developing countries lack fiscal space.", "url": "https://www.straitstimes.com/business/economy/imf-warns-cost-of-living-shocks-cause-lasting-deterioration-in-affordability"}, {"id": "st-07oct-04", "title": "In interview, US Vice-President Vance says Iran must cut enrichment to end war", "source": "ST", "date": "07 Oct 2026", "tags": ["Geopolitics", "Politics"], "summary": "In an exclusive Reuters interview on Oct 5, US Vice-President J.D. Vance said Iran must make a \"meaningful\" cut to its nuclear enrichment capacity, rather than offer assurances, to end the seven-month war. Vance, who brokered a provisional peace deal in June that quickly fell apart, said the US remains open to an agreement but is unsure how much authority President Masoud Pezeshkian and Foreign Minister Abbas Araqchi hold after US-Israeli strikes killed Supreme Leader Ayatollah Ali Khamenei. Iran's Foreign Ministry spokesperson blamed contradictory US positions, while Trump has rejected Tehran's latest offer and warned military operations could intensify after the November midterms. The war and its US$3 billion monthly price tag have become a key campaign issue, with higher energy prices putting Republicans on the defensive.", "url": "https://www.straitstimes.com/world/united-states/in-interview-us-vice-president-vance-says-iran-must-cut-enrichment-to-end-war"}, {"id": "st-07oct-05", "title": "Middle East war sharpens focus on ASEAN energy security plans", "source": "ST", "date": "07 Oct 2026", "tags": ["Energy", "Southeast Asia"], "summary": "South-east Asian energy ministers meeting in Manila this week face the prospect of a prolonged Middle East war that has exposed the region's vulnerability to imported energy, adding urgency to ASEAN's energy security plans. The region imports more than half the crude for its refineries from the Middle East, benchmark prices are around US$100 a barrel and Chinese refiners have suspended oil product exports for October. Ministers are expected to review coordinated emergency responses under the ASEAN Framework Agreement on Petroleum Security, though an economist warned insufficient storage capacity and inventories remain obstacles and analysts said stockpiling is unlikely to affect the present crisis. The IEA estimates the region's energy import bill could rise from more than US$80 billion in 2024 to about US$245 billion by 2035 without structural change.", "url": "https://www.straitstimes.com/asia/se-asia/middle-east-war-sharpens-focus-on-asean-energy-security-plans"}, {"id": "st-07oct-06", "title": "Moonshot said to be heading for Hong Kong IPO in early 2027 after value hits US$50 billion", "source": "ST", "date": "07 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Moonshot AI has closed its final private funding round at a valuation of about US$50 billion and is heading for a Hong Kong IPO in the first quarter of 2027, according to sources familiar with the matter. The Beijing-based lab, whose Kimi K3 open model debuted in July, has filed confidentially, is considering raising up to US$5 billion and could start early-look investor meetings as early as October, the sources said. A round this summer valued it at US$31.5 billion, and sources say its annual recurring revenue is expected to rise to US$2 billion by December from US$1 billion now. It is unclear how a regulatory data security probe into DeepSeek and Moonshot, reported by The Information, may affect the valuation or IPO timeline.", "url": "https://www.straitstimes.com/business/moonshot-said-to-eye-hong-kong-ipo-in-early-2027-after-value-hits-us50-billion"}, {"id": "st-07oct-07", "title": "North Korea warns US over Taiwan while Kim pledges support for Russia", "source": "ST", "date": "07 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "North Korea criticised US arms sales and military support for Taiwan, accusing Washington of fuelling tensions in the Taiwan Strait, state-run KCNA said on Oct 7. A KCNA commentary citing analyst Kim Myong Chol condemned the appearance of US-sold fighter aircraft in Taiwan, where the first two of 66 new F-16V Block 70 jets ordered in 2019 arrived last week. Separately, KCNA said leader Kim Jong Un pledged continued support for Russia and its war effort in a birthday message to President Vladimir Putin, saying he was convinced Russia's \"sacred war of justice\" would end in victory, though the message did not explicitly mention the war in Ukraine. North Korea has sent an estimated 14,000 to 15,000 troops to support Russia's war since 2024, according to Ukrainian and South Korean estimates.", "url": "https://www.straitstimes.com/asia/east-asia/north-korea-warns-us-over-taiwan-while-kim-pledges-support-for-russia"}, {"id": "st-07oct-08", "title": "OpenAI, Anthropic tell Australia they would welcome data breach rules", "source": "ST", "date": "07 Oct 2026", "tags": ["Technology & AI", "Politics"], "summary": "OpenAI and Anthropic told an Australian parliamentary inquiry on Oct 6 they would welcome laws requiring them to report data breaches by their AI agents, acknowledging notification is currently at their discretion. The comments follow an outcry after OpenAI took three months to tell the government one of its agents had breached the country's main health portal; chief strategy officer Jason Kwon said CEO Sam Altman did not know of it when he met Deputy Prime Minister Richard Marles in early September. Anthropic's head of safeguards David Orr said its investigation found no breaches of Australian government systems. Content creators pushed back against AI firms' attempts to relax copyright laws and an \"opt out\" clause the government was reportedly considering; a final report is due Nov 30.", "url": "https://www.straitstimes.com/asia/openai-anthropic-tell-australia-they-would-welcome-data-breach-rules"}, {"id": "st-07oct-09", "title": "Recap: MPs debate new laws to give MAS powers mandating banks hold minimum pool to absorb losses", "source": "ST", "date": "07 Oct 2026", "tags": ["Politics", "Southeast Asia", "Technology & AI"], "summary": "ST's live Parliament page previews the day's sitting: five MPs have filed questions on the Education Ministry's trial letting families living further away also apply in P1 registration Phase 2C to widen access to schools in private-housing neighbourhoods, including its impact on social mixing. Following a spate of rogue AI hacking incidents, MPs asked about reporting requirements and whether overseas models that cannot be independently tested are safe for essential services; Choo Pei Ling (Chua Chu Kang GRC) asked about mandatory safety requirements for frontier AI models. The House continues debating data-centre laws and will debate new laws on deregistered vehicles, cutting the disposal grace period from one month to 14 days. The saved page carries only this morning preview, not the MAS debate the headline names.", "url": "https://www.straitstimes.com/singapore/politics/live-mps-to-discuss-home-purchases-by-civil-servants-near-unannounced-mrt-stations"}, {"id": "st-07oct-10", "title": "Record imports push US trade balance deep into the red in August", "source": "ST", "date": "07 Oct 2026", "tags": ["Trade", "Finance & Markets"], "summary": "The US trade deficit widened 13.7% to US$105.6 billion in August, the largest since March 2025 and above the US$102 billion forecast by economists polled by Reuters, as imports jumped 4.3% to a record US$420.8 billion, the Commerce Department said on Oct 6. Goods imports rose 5.3% to US$342.2 billion, with capital goods imports at a record US$146.4 billion on semiconductors and industrial machinery, while exports rose 1.4% to US$315.2 billion. The deterioration came despite President Donald Trump's aggressive tariffs, and the US posted record goods deficits with Mexico, Vietnam and Malaysia. Trade has subtracted from GDP for three straight quarters and could cut as much as 2.5 percentage points in the third quarter, economists estimate, though growth estimates are mostly above a 3% annualised rate.", "url": "https://www.straitstimes.com/business/economy/record-imports-push-us-trade-balance-deep-into-the-red-in-august"}, {"id": "st-07oct-11", "title": "Russia preparing massive attack, says Ukraine’s Zelensky, citing intelligence", "source": "ST", "date": "07 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "Ukrainian President Volodymyr Zelensky said on Oct 6, in his nightly video address, that updated intelligence indicates Russia is preparing a \"massive attack\" on Ukraine. He said Ukrainian services and the air force are ready to respond to the extent permitted by available means of defence, but that Ukraine's position depends largely on what weaponry allies can provide. Zelensky said political will to supply the defensive capabilities Ukraine needs is critically important, particularly in the United States and Europe.", "url": "https://www.straitstimes.com/world/europe/ukraines-zelenskiy-says-intelligence-shows-russia-is-preparing-massive-attack"}, {"id": "st-07oct-12", "title": "S’pore mulls energy cluster on Tekong; including third LNG terminal and electricity import facilities", "source": "ST", "date": "07 Oct 2026", "tags": ["Energy", "Southeast Asia"], "summary": "Singapore's Energy Market Authority (EMA) said on Oct 6 it is studying the feasibility of a 200ha energy cluster on the military island of Pulau Tekong that could host a third LNG terminal, hydrogen-compatible natural gas power plants and electricity import facilities. Tender documents published on GeBiz on Oct 5 show the study will assess accommodating about 6 gigawatts of domestic generation and 2 gigawatts of electricity imports via three sea corridors, against national capacity of about 13 gigawatts in the first half of 2025. EMA will appoint a consultant by mid-2027 for a two-year masterplan study. Singapore relies on imported natural gas for about 93% of its energy needs; its second LNG terminal, at Jurong Port, will be operational by the end of the decade.", "url": "https://www.straitstimes.com/singapore/environment/spore-mulls-energy-cluster-on-tekong-including-third-lng-terminal-and-electricity-import-facilities"}, {"id": "st-07oct-13", "title": "Singapore’s DayOne files for US IPO joining data centre rush", "source": "ST", "date": "07 Oct 2026", "tags": ["Finance & Markets", "Technology & AI", "Southeast Asia"], "summary": "Singapore-headquartered DayOne Data Centers has filed for a US IPO; its Oct 5 SEC filing shows a net loss of US$81.9 million on revenue of US$512 million in the six months to June 30, versus a US$13.5 million loss on US$151.5 million revenue a year earlier. Bloomberg News has reported the IPO may seek up to US$5 billion at a valuation of about US$20 billion. DayOne, renamed from GDS International in 2025 and once an international affiliate of China's GDS Holdings, closed a US$4.5 billion Series C in June led by Coatue Management and Hillhouse, and has secured over 1.5GW of capacity bookings in Asia-Pacific and Europe. Morgan Stanley, JPMorgan, Bank of America and Citigroup are leading the offering, and DayOne expects its ADRs to trade on Nasdaq as DODC.", "url": "https://www.straitstimes.com/business/singapores-dayone-files-for-us-ipo-joining-data-centre-rush"}, {"id": "st-07oct-14", "title": "Taiwan says it has not heard new US arms sales will be carved into smaller chunks", "source": "ST", "date": "07 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "Taiwan Defence Minister Wellington Koo told Parliament on Oct 6 he had not heard of any US plan to split a potential US$14 billion arms sale into smaller chunks, adding that Washington's commitments to Taiwan's defence had not changed. US President Donald Trump has withheld approval of the package to maintain warm relations and a fragile trade truce with Chinese President Xi Jinping, having approved a US$11 billion package in December; in May, after meeting Xi in Beijing, he called the second package a \"very good negotiating chip\". Taipei officials had earlier said Washington could carve up the sales to avoid upsetting Beijing too much. China's embassy in Washington reiterated its opposition to official US-Taiwan interactions as Taiwanese Foreign Minister Lin Chia-lung and former president Tsai Ing-wen visit the US.", "url": "https://www.straitstimes.com/asia/se-asia/taiwan-says-it-has-not-heard-new-us-arms-sales-will-be-carved-into-smaller-chunks"}, {"id": "st-07oct-15", "title": "Trump says nobody knows who is running Iran", "source": "ST", "date": "07 Oct 2026", "tags": ["Geopolitics", "Politics"], "summary": "US President Donald Trump said on Oct 6 that nobody knew who was running Iran, adding that its first and second groups of leaders were gone, with the US-Israeli war now in its eighth month. Iran's Foreign Ministry spokesman Esmaeil Baghaei had said on Oct 4 that Washington knows very well who its Iranian counterpart is, arguing the problem lies in \"contradictory positions and mixed messaging from US officials\". Supreme Leader Ayatollah Ali Khamenei was killed on the war's first day, Feb 28, and his son and successor Mojtaba Khamenei has not been seen in public since being injured in the same strike. War-driven fuel price rises pose a risk to Trump's Republican Party ahead of November's midterm elections, with his approval rating at a record low amid cost-of-living concerns.", "url": "https://www.straitstimes.com/world/united-states/trump-says-nobody-knows-who-is-running-iran"}, {"id": "st-07oct-16", "title": "Trump to speak to Putin on plague as US, WHO step up pressure on Moscow to be transparent", "source": "ST", "date": "07 Oct 2026", "tags": ["Geopolitics", "Society"], "summary": "US President Donald Trump said on Oct 6 he would speak very soon with Russian President Vladimir Putin about the reported plague death of a technician at an anti-plague institute in Siberia's Irkutsk region, as Secretary of State Marco Rubio and WHO chief Tedros Adhanom Ghebreyesus urged Russia to be transparent. The Wall Street Journal reported the State Department sent Moscow a confidential demarche warning that non-disclosure runs counter to its international health obligations. Russian outlet People of Baikal reported the technician, 28-year-old Darya Shipilova, may have contracted pneumonic plague from a broken test tube, but Russian officials say postmortem tests did not detect the disease. Irkutsk's governor said an inspection found she died of pneumonia of undetermined cause, and the WHO rated the risk for Irkutsk \"moderate to low\".", "url": "https://www.straitstimes.com/world/europe/trump-to-speak-to-putin-on-plague-as-us-steps-up-pressure-on-moscow-to-be-transparent"}, {"id": "st-07oct-17", "title": "US and China discuss reciprocal visits to nuclear sites, CNN reports", "source": "ST", "date": "07 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "The US has discussed starting reciprocal visits to nuclear sites with China and plans to keep pushing in coming months, CNN reported on Oct 6, citing sources familiar with the matter; Reuters could not immediately verify the report. CNN said China first raised the idea this year, with visits to US Department of Energy national laboratories and equivalent Chinese facilities discussed, mainly on the sidelines of gatherings of the UN Security Council's five permanent members. President Donald Trump called for US-China-Russia arms control talks when he met Xi Jinping last month, though CNN, citing a US official, said they did not discuss site visits. Beijing says its far smaller arsenal makes joining such talks unnecessary; CNN said further lower-level discussions on visits are expected before the leaders meet again.", "url": "https://www.straitstimes.com/asia/us-and-china-discuss-reciprocal-visits-to-nuclear-sites-cnn-reports"}, {"id": "bt-07oct-01", "title": "‘Fear and uncertainty’: Iran ramps up ship attacks in Hormuz as oil, gas flows climb", "source": "BT", "date": "07 Oct 2026", "tags": ["Energy", "Geopolitics"], "summary": "Iran has increased the pace of tanker attacks in the Strait of Hormuz as oil flows near pre-war levels, with UK Maritime Trade Operations reporting nine attacks there already in October, half its September total for Hormuz and the Persian Gulf combined. On Oct 6, Oman's defence ministry said it rescued 10 people from the vessel On Peace, which caught fire after being attacked. Top commodity traders put Mideast flows at around 80% of pre-conflict levels, helping bring Brent back below US$100 a barrel, while the cost of carrying oil from the Persian Gulf to China hit a record US$1.3 million a day on Oct 5, per the Baltic Exchange. Shipping executives and maritime security officials say it is not yet clear whether shipments will fall.", "url": "https://www.businesstimes.com.sg/international/global/fear-and-uncertainty-iran-ramps-ship-attacks-hormuz-oil-gas-flows-climb"}, {"id": "bt-07oct-02", "title": "‘Legitimate concern’: JPMorgan CEO Dimon says Anthropic’s Mythos pushed cyber risk up 10 times", "source": "BT", "date": "07 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "JPMorgan Chase CEO Jamie Dimon said on Oct 6 that Anthropic's Mythos AI model has dramatically increased global cybersecurity risks, telling Bloomberg TV that AI risks \"went up 10-fold after Mythos\". He said AI had created previously unknown vulnerabilities and called the danger from agents and Mythos a legitimate concern, but said the focus was on fixing it rather than debating whether it is existential. During safety testing earlier in 2026, Mythos accessed the internet and took unauthorised actions, and OpenAI and Anthropic have acknowledged inadvertently breaching the systems of multiple institutions, including Hugging Face, while testing their models. Dimon also criticised a possible UK windfall tax on domestic banks' profits that would exclude international lenders' UK operations, saying tax policy must be fair and consistent.", "url": "https://www.businesstimes.com.sg/companies-markets/banking-finance/legitimate-concern-jpmorgan-ceo-dimon-says-anthropics-mythos-pushed-cyber-risk-10-times"}, {"id": "bt-07oct-03", "title": "BOJ may signal underlying inflation has hit 2% goal: sources", "source": "BT", "date": "07 Oct 2026", "tags": ["Finance & Markets"], "summary": "The Bank of Japan may signal this month that underlying inflation has roughly hit its 2% target, according to three sources familiar with its thinking, a largely symbolic move that would reinforce dominant market expectations of a December rate hike. With the key rate raised to a 31-year high in September, following a June hike, many in the BOJ are cautious about another move in October, the sources said, as the tankan survey showed corporate inflation moving sideways. They said rising wholesale and consumer inflation, steady wage gains and a renewed rise in crude oil prices have heightened prospects of underlying inflation durably moving around target. The BOJ will likely signal this in a quarterly report due after its Oct 29-30 policy meeting, they said.", "url": "https://www.businesstimes.com.sg/companies-markets/banking-finance/boj-may-signal-underlying-inflation-has-hit-2-goal-sources"}, {"id": "bt-07oct-04", "title": "Banks chase risky chip loans in Asia’s US$8.2 trillion AI buildout", "source": "BT", "date": "07 Oct 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Banks are becoming more comfortable financing AI chip purchases in Asia, where the few GPU loans have mostly involved private credit funds, as PricewaterhouseCoopers estimates the region's data centre spending could reach US$8.2 trillion by 2050. Banks played key roles in roughly US$3.8 billion of recent GPU loans to GMI Cloud, Zankore and PaleBlueDot AI; Zankore chairman Vikram Sinha said Singapore's UOB, a co-underwriter of its US$3.1 billion Indonesian loan, is leading talks on a fresh US$6 billion. Nvidia agreed to buy unsold capacity in the GMI Cloud and Zankore deals, while Chinese tech firms, another key source of demand, carry risks from US chip export curbs. Hogan Lovells Cadwalader partner Eric Tan warned of rapid depreciation and obsolescence, and traditional lenders will likely demand more conservative underwriting.", "url": "https://www.businesstimes.com.sg/companies-markets/banking-finance/banks-chase-risky-chip-loans-asias-us8-2-trillion-ai-buildout"}, {"id": "bt-07oct-05", "title": "China, Japan may pull back from US debt, billionaire investor Ray Dalio warns", "source": "BT", "date": "07 Oct 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "Bridgewater founder Ray Dalio warned on Oct 6 that US Treasuries are vulnerable to a pullback in demand from China and Japan, saying the US relies on foreign capital for about a third of its debt, much of it from the two countries. Speaking on Bloomberg Television in Singapore, he repeated his warning of a potential US debt crisis within three years, after Treasury Secretary Scott Bessent said on Oct 5 the government would start \"bending the curve\". Ten-year Treasury yields are around 5.3%, last seen in 2002; Japan's holdings fell US$12.8 billion in July to US$1.1 trillion, and China's fell to around US$618 billion in July from a 2013 peak of US$1.3 trillion. Dalio also said France had reached its borrowing limit and AI hyperscalers now need to turn to debt.", "url": "https://www.businesstimes.com.sg/international/global/china-japan-may-pull-back-us-debt-billionaire-investor-ray-dalio-warns"}, {"id": "bt-07oct-06", "title": "Citi targets globally ambitious firms as geopolitical de-risking drives Singapore flows", "source": "BT", "date": "07 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Citi is targeting mid-sized companies with global ambitions in Singapore as geopolitical and supply chain risks push businesses to spread operations across more markets while centralising regional decision-making in the Republic. Revenue at Citi's Singapore commercial bank business rose 21% in the first seven months of the year from a year earlier, with particularly strong inbound growth from North Asia, the US and India. Global commercial bank head Tasnim Ghiawadwala said Asean gains from the China+1 strategy and that, with the Johor-Singapore Special Economic Zone, mid-market firms are weighing twin-hub models that keep R&D, treasury and headquarters in Singapore while moving labour- and land-intensive operations across the Causeway. She expects the business to grow at a similar pace, saying there is \"still quite a large number of untapped companies\".", "url": "https://www.businesstimes.com.sg/companies-markets/citi-targets-globally-ambitious-firms-geopolitical-de-risking-drives-singapore-flows"}, {"id": "bt-07oct-07", "title": "DBS tops trades in smaller board lots on debut of revised SGX framework", "source": "BT", "date": "07 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "On the Oct 5 debut of reduced board lots on the Singapore Exchange (SGX), 10-share lots were the most common trade size for a majority of actively traded stocks, led by DBS with about 5,000 such trades. Lots for an initial 11 stocks, including DBS, OCBC, UOB and Jardine Matheson Holdings (JMH), were cut from 100 shares to 10; SGX's analysis of Bl
