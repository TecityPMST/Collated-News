nics%20up%2011.2.pdf"},{"id":"bt-14","title":"Singapore's asset management ambitions face next test as industry seeks speed and clarity","source":"BT","date":"27 Aug 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"Singapore's latest push to boost its asset-management industry has been welcomed, but industry players are seeking greater clarity, speed and workable rules on eligibility and tax treatment. Earlier in August, the Monetary Authority of Singapore announced three measures: tax exemptions on profit-related returns, a new hedge-fund investment programme and a foreign work-pass track, responding to Hong Kong's June tax-incentive package. Practitioners want clarity on whether the carried-interest exemption is agnostic to fund types and covers existing funds. MAS scoped it to funds under Income Tax Act sections 13D, 13O, 13OA, 13U and 13V. Observers said Singapore's scope may be broader than Hong Kong's but excludes proprietary trading. They urged measuring success beyond AUM, stressing speed, certainty and practical support.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20BT/Singapore's%20asset%20management%20ambitions%20face%20next%20test%20as%20industry%20seeks%20speed%20and%20clarity.pdf"},{"id":"bt-15","title":"Singapore's new data centres must use renewables. Can they overcome the hurdles?","source":"BT","date":"27 Aug 2026","tags":["Energy","Technology & AI","Southeast Asia"],"summary":"Singapore's newest data-centre operators face a test of whether they can overcome barriers to clean-energy adoption, from price uncertainty to supply bottlenecks. On Aug 21, Singapore awarded 200 MW of capacity under its second Data Centre-Call For Application tender (DC-CFA2), 50 MW each to Equinix, Digital Realty, Keppel Data Centres and ST Telemedia Global Data Centres for Jurong Island facilities that must be at least 50% powered by eligible green pathways. Options include vertical solar, biomethane, low-carbon hydrogen and fuel cells with carbon capture, each with cost and supply-chain challenges. Biomethane, abundant from regional agricultural waste, is seen as low-hanging fruit but supplies only 0.01% of South-east Asia's gas; Singapore set up an imports sandbox in October 2025. The sub-50 MW facilities could pioneer best practices.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20BT/Singapore's%20new%20data%20centres%20must%20use%20renewables.%20Can%20they%20overcome%20the%20hurdles.pdf"},{"id":"bt-16","title":"US inflation remains elevated as energy costs push on prices","source":"BT","date":"27 Aug 2026","tags":["Finance & Markets","Energy"],"summary":"US consumer prices rose 3.7% in July from a year earlier, unchanged from June and well above the Fed's 2% target, according to the personal consumption expenditures price index, the central bank's preferred gauge. Core prices, excluding food and energy, rose 3.3%, also unchanged. On a monthly basis, overall and core prices each gained 0.2%. The data underscored the dilemma facing Fed policymakers weighing a rate move next month. Inflation jumped this spring after the US went to war with Iran, lifting energy prices, but has since eased with few broad spillovers. Some officials favour waiting; others warn AI-driven chip costs and a renewed Canada trade war threaten prices. Fed chair Kevin Warsh speaks Friday at Jackson Hole; consumer confidence fell again in August.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20BT/US%20inflation%20remains%20elevated%20as%20energy%20costs%20push%20on%20prices.pdf"},{"id":"bt-17","title":"Will the US-Canada tariff war irrevocably damage bilateral ties?","source":"BT","date":"27 Aug 2026","tags":["Trade","Geopolitics"],"summary":"A commentary asks whether the US-Canada tariff war will irrevocably damage bilateral ties. After three days of talks collapsed, the US on Aug 22 imposed 50% tariffs on roughly US$20 billion of Canadian goods; Prime Minister Mark Carney vowed to match \"dollar for dollar\" and announced retaliatory tariffs on about US$20 billion of US imports, effective Sep 8. The conflict traces to February 2025, when Trump imposed sweeping tariffs citing border security and trade imbalances, triggering more than a year of tit-for-tat measures. The current tariffs cover only about 5% of Canadian exports within a US$760 billion relationship, but the piece argues the deeper cost is eroded predictability and a hardened Canadian public desire to rely less on the US that will outlast any deal.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20BT/Will%20the%20US-Canada%20tariff%20war%20irrevocably%20damage%20bilateral%20ties.pdf"},{"id":"scmp-01","title":"'Massive casualties' after flash floods, landslide strike China-Nepal border","source":"SCMP","date":"27 Aug 2026","tags":["Society","Environment"],"summary":"Dozens were dead and hundreds missing, many of them foreign tourists, after massive flash floods and landslides engulfed the China-Nepal border on Wednesday. The disaster struck Nepal around 9am, spilling into Gyirong county in Tibet and causing major casualties at the Gyirong Port checkpoint, Tibet's main foreign trade port with Nepal. State broadcaster CCTV reported three dead and 265 missing in the county by 8pm, while Nepalese police said 97 were killed and 54 rescued in Nepal. Nepal's tourism board listed 384 people missing, 93 Nepalese and 291 foreigners, including citizens of India, Australia, the US, Britain and the Netherlands. Researchers said an ice avalanche may have triggered the surge.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20SCMP/'Massive%20casualties'%20after%20flash%20floods,%20landslide%20strike%20China-Nepal%20border.pdf"},{"id":"scmp-02","title":"AI boom, profit surge fuel China's ambitious chip assembly buildout","source":"SCMP","date":"27 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"China's three leading outsourced chip packaging and testing firms, JCET, Tongfu Microelectronics and Huatian Technology, have launched a combined capacity expansion exceeding 15 billion yuan (US$2.2 billion), riding surging AI demand and Beijing's push for tech self-sufficiency. JCET, the largest, posted net profit up 79.4 per cent to 845 million yuan and record 19.5 billion yuan revenue, and unveiled a 7.8 billion yuan Shanghai facility with phase one due in late 2028. Tongfu, tied to AMD's next-generation processors, forecast profit surging up to 337 per cent and won approval for a 4.2 billion yuan share placement. Huatian reported a 259 per cent profit jump to 813 million yuan and a 3 billion yuan Nanjing plant.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20SCMP/AI%20boom,%20profit%20surge%20fuel%20China's%20ambitious%20chip%20assembly%20buildout.pdf"},{"id":"scmp-03","title":"AI server boom fuels record supply crunch for the 'rice of electronics'","source":"SCMP","date":"27 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Global inventories of multilayer ceramic capacitors (MLCCs), tiny components dubbed the \"rice of the electronics industry,\" have fallen to a record low as AI infrastructure demand surges. UBS Evidence Lab data showed worldwide distributor inventory volume down 8 per cent by August 9 from four weeks earlier, while rising prices pushed inventory value up 10 per cent. Year-on-year to end-July, the unit price index rose 13 per cent and distributor volumes plunged 22 per cent. Murata and Samsung Electro-Mechanics saw volume declines of 8 and 20 per cent. Goldman Sachs called it the sector's \"largest and longest\" cycle; Citrini projected AI server MLCC demand growing about 80 per cent annually. Defiance ETFs launched the first US-listed MLCC ETF.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20SCMP/AI%20server%20boom%20fuels%20record%20supply%20crunch%20for%20the%20'rice%20of%20electronics'.pdf"},{"id":"scmp-04","title":"As the US and China compete over AI, Asean must secure strategic autonomy","source":"SCMP","date":"27 Aug 2026","tags":["Southeast Asia","Technology & AI","Geopolitics"],"summary":"This opinion piece argues that as the US and China build competing AI ecosystems, Asean's real challenge is securing enough control over infrastructure, knowledge and systems to shape its own future rather than renting intelligence from others. Southeast Asia is becoming a physical centre of the AI economy, with data centres expanding and the International Energy Agency expecting the region's data-centre electricity demand to more than double by 2030. Malaysia and Singapore are emerging as hubs, with Indonesia and Thailand seeking a share. The author warns of a subtler dependency: Asean may supply land, power and connectivity while relying on foreign chips, models, cloud platforms and standards, citing Washington's Pax Silica initiative pressing countries to choose between frameworks.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20SCMP/As%20the%20US%20and%20China%20compete%20over%20AI,%20Asean%20must%20secure%20strategic%20autonomy.pdf"},{"id":"scmp-05","title":"Before Xi's India visit, China and India agree on 8 steps to ease border tensions","source":"SCMP","date":"27 Aug 2026","tags":["Geopolitics","Politics"],"summary":"China and India released a matching \"eight points of outcomes and consensus\" from the 25th round of Special Representatives talks on their disputed Himalayan boundary, held in Beijing on Tuesday between Foreign Minister Wang Yi and Indian security adviser Ajit Doval. The move sets the stage ahead of President Xi Jinping's expected trips: a brief encounter with Prime Minister Narendra Modi at the SCO summit in Bishkek on August 31 to September 1, and a fuller New Delhi visit on September 12-13 for the Brics summit, Xi's first India visit in seven years, with a reported 400-strong delegation. Sources and experts cautioned that the offers lock in a work plan but fall well short of a breakthrough or grand bargain.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20SCMP/Before%20Xi's%20India%20visit,%20China%20and%20India%20agree%20on%208%20steps%20to%20ease%20border%20tensions.pdf"},{"id":"scmp-06","title":"Bill Gates warns of AI's impact, urges the US and China to cooperate","source":"SCMP","date":"27 Aug 2026","tags":["Technology & AI","Geopolitics"],"summary":"Bill Gates argued in a new 6,000-word essay published Wednesday that cooperation between the US and China is required to manage the unprecedented societal impacts of rapidly advancing artificial intelligence. The Microsoft co-founder warned AI is ushering in \"one of the most turbulent times in human history\" and could become \"the greatest equaliser ever invented, or the worst source of injustice.\" He urged countries hosting leading AI developers to begin setting shared norms now, before competitive pressure makes cooperation harder. Gates said he supports a global slowdown in theory but does not believe it likely, and highlighted three urgent risk areas: labour displacement, AI-enabled crimes and surveillance, and impacts on children. The US and China plan AI governance talks next month during Xi's US visit.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20SCMP/Bill%20Gates%20warns%20of%20AI's%20impact,%20urges%20the%20US%20and%20China%20to%20cooperate.pdf"},{"id":"scmp-07","title":"Brain-tech push gains pace as China draws up standards and firms challenge Neuralink","source":"SCMP","date":"27 Aug 2026","tags":["Technology & AI"],"summary":"China is drafting an extensive set of standards for brain-computer interface (BCI) technology to accelerate commercialisation as domestic start-ups increasingly compete with Elon Musk's Neuralink. Under draft guidelines from the Ministry of Industry and Information Technology, Beijing aims to formulate or revise more than 40 standards by 2028, encourage at least 100 companies to adopt them, and help develop over 10 international standards, targeting more than 80 standards by 2030. BCI is one of six \"industries of the future\" in China's 15th five-year plan. Leading firms include Neuracle, StairMed, NeuroXess and BrainCo, while Beijing, Tianjin and Hebei have launched a joint initiative to strengthen the supply chain covering electrodes, chips, systems and algorithms.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20SCMP/Brain-tech%20push%20gains%20pace%20as%20China%20draws%20up%20standards%20and%20firms%20challenge%20Neuralink.pdf"},{"id":"scmp-08","title":"China makes officials liable for environmental damage for life","source":"SCMP","date":"27 Aug 2026","tags":["Environment","Politics"],"summary":"China has reinforced officials' lifelong responsibility for serious environmental damage, tying green performance more closely to cadre assessments. Under revised rules released Tuesday by the Communist Party and the State Council, officials will be held to account \"regardless of whether they have been transferred, reassigned, promoted, left their jobs or retired.\" The changes are linked to Xi Jinping's \"new development philosophy\" and the drive to build an \"ecological civilisation,\" supporting the \"dual carbon\" goals of peaking emissions before 2030 and neutrality before 2060. The rules, based on a 2015 trial and revised by the Politburo Standing Committee in July, widen accountability to leaders of state-owned enterprises and public institutions, and take effect immediately amid a nationwide leadership reshuffle.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20SCMP/China%20makes%20officials%20liable%20for%20environmental%20damage%20for%20life.pdf"},{"id":"scmp-09","title":"China rushes to develop Moderna-style cancer vaccines amid market frenzy","source":"SCMP","date":"27 Aug 2026","tags":["Finance & Markets","Society"],"summary":"Hong Kong-listed Chinese biotech firms have seen shares surge following Moderna's breakthrough cancer vaccine trial, as they push similar programmes. Companies from Jiangsu Hengrui Pharmaceuticals to Li Ka-shing-backed CK Life Sciences already have vaccines in development, with Jefferies' Cui Cui noting China has built a pipeline of more than 100 cancer vaccine programmes. An estimated 2.58 million people died of cancer in China in 2024. Moderna and Merck said their personalised mRNA vaccine cut the risk of melanoma returning or spreading in a phase three trial of about 1,140 patients. Everest Medicines rose 34 per cent over five days and CK Life Sciences more than 11 per cent. Analysts flagged the challenge of replicating results beyond melanoma and manufacturing personalised vaccines affordably.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20SCMP/China%20rushes%20to%20develop%20Moderna-style%20cancer%20vaccines%20amid%20market%20frenzy.pdf"},{"id":"scmp-10","title":"China targets hi-tech pillars by 2030 to fuel economic growth","source":"SCMP","date":"27 Aug 2026","tags":["Technology & AI","Politics"],"summary":"Beijing has vowed to develop emerging industries into new drivers of economic growth by 2030, while curbing cutthroat competition in the auto sector. Vice-minister of Industry and Information Technology Xin Guobin outlined plans to build hi-tech pillars from next-generation 6G communications and quantum technology to brain-computer interfaces and nuclear fusion, speaking at a State Council press conference Wednesday. The ministry said it would accelerate AI commercialisation in manufacturing, highlighting embodied AI, while official Liu Yulin called 6G a \"top priority.\" The push comes as China leans on technological self-reliance amid sluggish consumer spending, a property slump and industrial overcapacity. Xin acknowledged that \"irrational competition remains a prominent issue\" in the electric vehicle industry.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20SCMP/China%20targets%20hi-tech%20pillars%20by%202030%20to%20fuel%20economic%20growth.pdf"},{"id":"scmp-11","title":"China vows payback for US Iran sanctions, testing stability ahead of Xi-Trump summit","source":"SCMP","date":"27 Aug 2026","tags":["Geopolitics","Trade"],"summary":"Beijing has vowed to retaliate against Washington's expanded Iran sanctions targeting Chinese entities, threatening a new flashpoint weeks before President Xi Jinping visits the US. The US on Monday announced fresh sanctions against Iran and its trading partners, including entities in mainland China and Hong Kong, seeking to squeeze Tehran after a six-month conflict. Foreign ministry spokesman Lin Jian dismissed the sanctions as \"illicit\" with \"no basis in international law.\" Analyst Sun Chenghao of Tsinghua University said the risk hinges on whether Washington extends secondary sanctions to major Chinese banks; limited action against individual firms could stay contained. This week's semi-official Track 1.5 dialogue could help control risk. Xi's first US state visit in more than a decade is expected next month.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20SCMP/China%20vows%20payback%20for%20US%20Iran%20sanctions,%20testing%20stability%20ahead%20of%20Xi-Trump%20summit.pdf"},{"id":"scmp-12","title":"China's CNOOC rakes in record first-half profit on high oil prices amid Iran war","source":"SCMP","date":"27 Aug 2026","tags":["Energy","Finance & Markets"],"summary":"China National Offshore Oil Corporation (CNOOC), the country's largest offshore oil and gas producer, saw net profit jump 23.4 per cent to a record 85.8 billion yuan (US$12.7 billion) in the first half, up from 69.5 billion yuan a year earlier, as higher oil prices and increased output boosted earnings amid the Iran war. Revenue rose 16.9 per cent to a record 242.7 billion yuan, with oil and gas sales up 20 per cent to 206.1 billion yuan and net production up 3.7 per cent to a record 398.7 million barrels of oil equivalent. Both domestic and overseas output hit records. CNOOC declared an interim dividend of HK$0.94 per share, up 28.8 per cent and its highest since listing. Shares fell 0.8 per cent to HK$24.92.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20SCMP/China's%20CNOOC%20rakes%20in%20record%20first-half%20profit%20on%20high%20oil%20prices%20amid%20Iran%20war.pdf"},{"id":"scmp-13","title":"China's robotics IPO wave gains steam as 2 more firms eye Hong Kong listings","source":"SCMP","date":"27 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Two Hangzhou-based robotics start-ups, both founded by former Alibaba executives, have confirmed plans to launch Hong Kong initial public offerings as early as next year, boosting the city's role as a fundraising hub for China's fast-growing embodied AI sector. Infiforce Technology Group, developer of a robot cognitive system called \"AtomBrain,\" is targeting a 2027 listing; it completed a funding round of nearly 1 billion yuan (US$149 million) this month and secured a 1,000-unit order in Saudi Arabia, said founder Isabella Bai, a former Alibaba vice-president. UDeer.ai is restructuring red-chip and shareholding structures and plans to submit its IPO application in the first half of next year, with Hong Kong its first choice while also evaluating A shares.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20SCMP/China's%20robotics%20IPO%20wave%20gains%20steam%20as%202%20more%20firms%20eye%20Hong%20Kong%20listings.pdf"},{"id":"scmp-14","title":"China's steel sector must avoid US rust belt's fate: party journal","source":"SCMP","date":"27 Aug 2026","tags":["Trade","Finance & Markets"],"summary":"China's steel sector, the world's largest, must avoid the mistakes of America's rust belt, according to an article in the Communist Party's top theoretical journal, Qiushi, written jointly with the China Iron and Steel Association. The piece argued China should not let its steel sector contract to redirect resources toward emerging industries, warning that de-industrialisation would trigger regional recession, job losses and sluggish innovation. Industries underpinning national economic security \"must never be allowed to undergo market-driven liquidation or passive contraction,\" it said. China has led global crude-steel output for three decades, exceeding 960 million tonnes in 2025, more than half of world output, but faces trade barriers, oversupply and falling export prices squeezing margins.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20SCMP/China's%20steel%20sector%20must%20avoid%20US%20rust%20belt's%20fate%20party%20journal.pdf"},{"id":"scmp-15","title":"Chinese navy fires new radar-absorbing YJ-18A anti-ship missile in sea trial, expert says","source":"SCMP","date":"27 Aug 2026","tags":["Defence"],"summary":"China has tested a new variant of the YJ-18A anti-ship cruise missile bearing a black radar-absorbing stealth coating, according to specialists who say the finish improves its penetration ability. The coating was highlighted in CCTV footage released Saturday showing an extreme-performance test fired from a navy ship's vertical launch system. The YJ-18A, or \"Eagle Strike,\" cruises at subsonic speed before a supersonic terminal attack and is often equipped on 7,500-tonne Type 052D and 12,000-tonne Type 055 destroyers. Military commentator Song Zhongping said the black coating both absorbs radar energy, reducing detectability, and provides visual camouflage against dark deep-sea water. CCTV said the test collected several times more data than planned to support further improvements.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20SCMP/Chinese%20navy%20fires%20new%20radar-absorbing%20YJ-18A%20anti-ship%20missile%20in%20sea%20trial,%20expert%20says.pdf"},{"id":"scmp-16","title":"In a small Virginia town, distrust of Big Tech hampers Trump's AI push","source":"SCMP","date":"27 Aug 2026","tags":["Technology & AI","Society"],"summary":"In Danville, southern Virginia, local distrust is complicating Trump's data-centre and AI push. Vic Ingram, chair of the Danville-Pittsylvania Regional Industrial Facility Authority, helped secure a proposed data-centre campus at the 3,500-acre Berry Hill site, described as the biggest economic development project in the region's history. But residents questioned its environmental impact, power requirements and secretive approval, prompting Ingram to blame online \"propaganda\" on the \"Communist Chinese.\" Supporters have framed the data centres as essential to competing with Beijing in AI, echoing Trump. Three-quarters of Americans now oppose data centres being built near them, up from 42 per cent a year earlier, per Heatmap. Residents say their concerns stem from distrust of officials and broken investment promises, not China.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20SCMP/In%20a%20small%20Virginia%20town,%20distrust%20of%20Big%20Tech%20hampers%20Trump's%20AI%20push.pdf"},{"id":"scmp-17","title":"Iran and Oman reach Hormuz deal, but reopening hinges on US compliance","source":"SCMP","date":"27 Aug 2026","tags":["Energy","Geopolitics"],"summary":"Iran and Oman have reached agreement on their respective shares of the Strait of Hormuz and its revenues, but the vital waterway will not reopen unless the US accepts their conditions, Iran's Revolutionary Guards said Wednesday. The strait handled one-fifth of global oil and liquefied natural gas shipments before the war began in February; most shipping has since been shut, driving global energy prices higher as Tehran and Washington imposed separate blockades. IRGC spokesman Hossein Mohebbi said the strait \"belongs to Iran and the country of Oman,\" and accused the US of obstructing negotiations and delaying the deal. He warned the strait \"will not be opened under any circumstances\" if Washington refuses the demands. Passage remains perilous amid stalled peace talks.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20SCMP/Iran%20and%20Oman%20reach%20Hormuz%20deal,%20but%20reopening%20hinges%20on%20US%20compliance.pdf"},{"id":"scmp-18","title":"Meta agrees to pay US$17 billion to settle teen social media addiction case in US","source":"SCMP","date":"27 Aug 2026","tags":["Technology & AI","Society"],"summary":"Meta Platforms has agreed to pay US$17 billion and add child-safety measures to Facebook and Instagram to end a landmark trial over teen social media addiction and settle claims by 47 US states, attorneys general announced Wednesday. California, Colorado, Kentucky and New Jersey were among 29 states that sued the company in 2023; the deal averts CEO Mark Zuckerberg testifying before a jury in California. The agreement is worth US$353 million in Virginia alone. Attorney General Jay Jones said Meta \"intentionally deceived the public about the addictive and harmful design features that have wreaked havoc on youth mental health.\" The settlement is a fraction of Meta's 2025 revenue of US$201 billion. The lawsuit also alleged unlawful data collection on children under 13.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20SCMP/Meta%20agrees%20to%20pay%20US17%20billion%20to%20settle%20teen%20social%20media%20addiction%20case%20in%20US.pdf"},{"id":"scmp-19","title":"MiniMax revenue surges 283% but remains behind pace to meet forecast amid crowded AI race","source":"SCMP","date":"27 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Chinese AI firm MiniMax posted a 283 per cent surge in first-half revenue to US$116.6 million, powered by a more than 700 per cent jump in its enterprise business, though top-line growth remains off pace to hit full-year analyst forecasts. The half accounted for roughly 32 per cent of the US$363.77 million analysts expect for 2026; full-year 2025 revenue was US$79 million. Revenue from its Open Platform and enterprise services jumped over 703 per cent to US$73.9 million, or 63.4 per cent of total. Total loss narrowed 11 per cent to US$358 million, but adjusted net loss widened 111.2 per cent to US$293 million. Gross profit rose more than fivefold to US$20.8 million, with margin at 17.9 per cent. Hong Kong-listed shares closed up 1.13 per cent at HK$303.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20SCMP/MiniMax%20revenue%20surges%20283%20but%20remains%20behind%20pace%20to%20meet%20forecast%20amid%20crowded%20AI%20race.pdf"},{"id":"scmp-20","title":"PwC International must face trial of Evergrande scandals claims: Hong Kong High Court","source":"SCMP","date":"27 Aug 2026","tags":["Finance & Markets"],"summary":"The liquidators of collapsed developer China Evergrande Group have won a legal victory, with Hong Kong's High Court ruling that PricewaterhouseCoopers (PwC) International must face trial over Evergrande audit-failure claims. Deputy High Court Judge Patrick Fung Pak-tung rejected PwC International's application to be dismissed, finding it \"did owe a duty of care\" to Evergrande and had power to control and govern its member firms, so it should not be struck out without a trial. The ruling means PwC International, PwC Hong Kong and PwC China must jointly face the suits. Liquidators are seeking about 57.9 billion yuan (US$8.6 billion) in total, of which roughly 38.1 billion yuan is also claimed against PwC International. Alvarez & Marsal's Tiffany Wong and Eddie Middleton filed the claims in early 2025.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20SCMP/PwC%20International%20must%20face%20trial%20of%20Evergrande%20scandals%20claims%20Hong%20Kong%20High%20Court.pdf"},{"id":"scmp-21","title":"Trump declares 'Mission Accomplished' in Iran, as conflict drags on","source":"SCMP","date":"27 Aug 2026","tags":["Geopolitics","Politics"],"summary":"US President Donald Trump on Wednesday declared \"Mission Accomplished\" in Iran even as the unpopular and costly war drags on with no end in sight. Trump posted an image of himself alongside Iran's slain former Supreme Leader Ali Khamenei against a stylised backdrop of US air and missile attacks, captioned \"2026 Mission Accomplished,\" and mockingly included George W. Bush, whose infamous 2003 banner aboard the USS Abraham Lincoln the slogan evokes. A Reuters/Ipsos poll showed just 31 per cent of American voters back his handling of Iran, a risk to Republicans in November's midterms, with much of his base opposing the war. Key aims remain unmet: ending Iran's nuclear programme and regime change, with Khamenei's son Mojtaba having taken power.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20SCMP/Trump%20declares%20'Mission%20Accomplished'%20in%20Iran,%20as%20conflict%20drags%20on.pdf"},{"id":"scmp-22","title":"US critical minerals proposals to Brazil go unanswered as China looms","source":"SCMP","date":"27 Aug 2026","tags":["Trade","Geopolitics"],"summary":"Brazil has not answered two American proposals to formalise critical minerals cooperation, a senior US diplomat said at Latin America's largest mining fair, leaving Washington without a bilateral deal as it races to build rare earth supply chains outside China. Matthew Lowe, economic counsellor at the US embassy in Brasilia, said the US invited Brazil years ago to join the Minerals Security Partnership and sent a draft framework in February, both unanswered, adding they will \"probably have to wait till the election\" in October. Officials from France, Canada, Australia and Britain also attended Exposibram in Belo Horizonte. Brazil holds the world's second-largest rare earth reserves after China, which handles close to 90 per cent of global mineral separation. A US-backed rare earth acquisition in Brazil nears completion.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20SCMP/US%20critical%20minerals%20proposals%20to%20Brazil%20go%20unanswered%20as%20China%20looms.pdf"},{"id":"scmp-23","title":"Zelensky urges China to use its diplomatic weight to end Russia's war with Ukraine","source":"SCMP","date":"27 Aug 2026","tags":["Geopolitics"],"summary":"Ukrainian President Volodymyr Zelensky has urged China to play a \"strong diplomatic role\" to help end the war between Russia and Ukraine, citing an Independence Day congratulatory letter from Chinese President Xi Jinping. \"We count on further cooperation and on China playing a strong diplomatic role in bringing Russia's war against our country to an end,\" Zelensky wrote on social media Wednesday, adding \"Peace can be our shared achievement.\" It is the second consecutive year Beijing has sent Kyiv a public congratulatory message since Russia's 2022 invasion; Xi and Zelensky last spoke in April 2023. Xi's letter praised \"China-Ukraine friendship.\" More than four years into the war, fighting continues with no breakthrough, and Beijing's close partnership with Russia remains a stumbling block in ties with the EU.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/27%20Aug%202026/27%20Aug%20SCMP/Zelensky%20urges%20China%20to%20use%20its%20diplomatic%20weight%20to%20end%20Russia's%20war%20with%20Ukraine.pdf"}]},"2026-08-28":{"date":"2026-08-28","dayOfWeek":"Friday","totalArticles":86,"sourceCounts":{"WSJ":19,"ST":25,"BT":20,"SCMP":22},"executiveDigest":"Nvidia added a record US$442 billion in market value - its second-biggest surge ever - after a robust forecast, and went on an AI deal spree (agreeing to buy Hugging Face for US$16.4 billion and shipping its first H200 chips to China), even as it 'paused revenue-sharing deals' and faced a US$279 billion supply-chain gamble. Markets awaited Warsh's Jackson Hole debut amid a global bond-market revolt, and oil rose as US-Iran talks 'sputtered' with Trump spurning his June deal. For Singapore, the US chip crackdown hit home - a Singapore-based freight firm is 'fully cooperating' in a US Nvidia-smuggling probe and DPM Gan said the city 'does not support cheating on tariffs' - as ministers warned AI growth may not create as many jobs.","briefingCards":[{"title":"Lead story - Nvidia's record surge and deal spree","body":"Nvidia dominated: BT reported it 'added US$442 billion after a robust forecast sparked the second-biggest stock surge ever', while WSJ examined 'Nvidia's US$279 billion supply-chain gamble' and noted it 'paused revenue-sharing deals with AI cloud companies'. The deal-making was frenetic - ST said 'Nvidia agreed to buy Hugging Face for US$16.4 billion', and SCMP reported it 'shipped its first H200 chips to China but forecasts no data-centre computing revenue' there. The wider AI complex ran hot: DeepSeek is 'poised for a US$74 billion valuation', Aker climbed after Nscale won a US$45 billion contract, Marvell lifted long-term targets, SoftBank is eyeing humanoid developer 1X at a US$6 billion valuation, and China's Zhipu jumped as its viral 'Ox Alpha' model was revealed to run on Chinese chips."},{"title":"Markets & finance","body":"The macro focus was Jackson Hole and the Fed's independence: WSJ framed 'Warsh taking the stage with a Treasury secretary stepping onto Fed terrain' and ran 'Trump vs Lisa Cook, Round II', as Fed's Collins said 'a rate increase is warranted if inflation disappoints'. SCMP called it a 'bond-market revolt signalling fading confidence in US economic leadership', with WSJ detailing an even sharper overseas Treasury-style rout. The dollar recouped some losses and gold drifted higher, while the US goods-trade deficit 'widened to its largest since March 2025' and jobless claims stayed low. Rate-hike pressure built abroad - the BOJ deputy urged more hikes, the RBA may move in September, South Korea raised again, and the ECB weighed 'mildly restrictive' policy."},{"title":"Asia realignment","body":"The pre-summit choreography advanced: SCMP said 'Chinese executives may join Xi's US trip as a trade-truce extension looks almost certain', Wang Yi urged Washington to 'overcome obstacles', but Trump 'hinted at sanctions on Chinese banks over Iran ties'. Security pressure intensified - China 'deployed a record number of ships around Taiwan', Taiwan lined up a US$7 billion drone boost (though its parliament rejected the government's plan for its own), and a US Patriot-missile shortage in Europe was called 'beyond critical' due to the Iran war. On defence burden-sharing, the Pentagon told NATO allies the US 'wants a European-led defence of the continent', and SCMP noted 'South-east Asia isn't buying the US offer of flexible realism'."},{"title":"Energy & climate","body":"Iran diplomacy stalled again: WSJ said 'Iran talks sputter as Trump spurns a return to his June deal', ST reported 'Trump says the US is not talking to Iran with economic war in focus', and oil 'rose on fresh doubts over US-Iran diplomacy' - even as BT noted 'Hormuz oil flows are rising as Gulf giants ramp up' and Iran's Rezaei 'set conditions for reopening the strait'. Strategy shifted around the war: Thailand will 'shift from LNG toward renewables in its wake', Seatrium and Petrobras are eyeing gas collaboration for Asian demand, and BT argued 'energy security cannot be the forgotten pillar of the transition'. SCMP added that 'climate extremes will not stop the expansion of China's nuclear industry'."},{"title":"Technology & AI","body":"The chip-and-model race widened around Nvidia's blockbuster: Marvell and SK Telecom (a new AI data-centre company) leaned in, Alibaba 'pushed into South America with Brazil data centres', and BT flagged that 'Meta took aim at Anthropic - while remaining one of its largest customers'. Governments circled the supply chain: the US 'weighs a new round of tariffs on semiconductors', is 'urged to use a Beijing playbook to secure Chinese tech transfers', and Google agreed to a £449.3 million settlement with UK app developers. Crucially for the region, a Singapore-based freight firm is 'fully cooperating in a US probe into alleged Nvidia-chip smuggling', underscoring how export-control enforcement is reaching into Asia's logistics hubs."},{"title":"Singapore & SEA focus","body":"The US chip crackdown landed on Singapore: ST reported a 'Singapore-based Apex Logistics is fully cooperating in a US probe into alleged smuggling of Nvidia chips', and DPM Gan said Singapore 'does not support cheating on tariffs' and is in talks with the US on trade probes. Ministers set expectations on AI - Gan Kim Yong warned Singapore 'cannot assume growth will create as many jobs amid the AI shift', echoing Tan See Leng, while SM Lee said the country 'must keep reinventing itself'. On markets, UOB priced a 'landmark US$1.2 billion euro covered bond', HSBC is mulling restructuring its Singapore units, and BT framed Singapore 'playing the premium data-centre game as Johor and Batam take on scale'; a Singapore MP opposed Temasek funding for Air India's US$1.5 billion plea."}],"keyMetrics":[{"value":"86","label":"Articles curated today","sub":"WSJ 19 · ST 25 · BT 20 · SCMP 22"},{"value":"+US$442b","label":"Nvidia's record surge","sub":"2nd-biggest ever; buys Hugging Face"},{"value":"Jackson Hole","label":"Warsh's debut","sub":"Amid a global bond revolt"},{"value":"Sputter","label":"US-Iran talks stall","sub":"Oil rises; Trump spurns June deal"},{"value":"Chip probe","label":"SG freight firm cooperating","sub":"DPM Gan: no tariff 'cheating'"},{"value":"AI jobs","label":"Gan Kim Yong warns","sub":"Growth may not add as many jobs"}],"articles":[{"id":"wsj-01","title":"A Walk Around Dubai Shows No Signs of Trump's 'D-Day' for Iran","source":"WSJ","date":"28 Aug 2026","tags":["Geopolitics","Finance & Markets"],"summary":"Despite Treasury Secretary Scott Bessent's declared \"Economic D-Day\" pressuring nations that support Iranian commerce, Iranian business thrives openly in Dubai. Iranian banks, including a Bank Melli Iran branch Bessent singled out for closure, remained open this week, with tellers serving Farsi-speaking customers. Employees said they received no closure notice. Dubai-based Iranians are planning alternatives such as the centuries-old hawala trust-based transfer system, but say conditions have improved since a spring U.A.E. crackdown that closed a hospital and club and revoked visas. Widespread, unannounced visa cancellations have stopped and some visas were restored. Iranian airlines still run direct flights between Iran and the U.A.E., though Emirates, Etihad and FlyDubai avoid direct Iran routes.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20WSJ/A%20Walk%20Around%20Dubai%20Shows%20No%20Signs%20of%20Trump's%20'D-Day'%20for%20Iran.pdf"},{"id":"wsj-02","title":"AI Startup DeepSeek Poised to Reach $74 Billion Valuation","source":"WSJ","date":"28 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Chinese AI startup DeepSeek is set to secure funding valuing it at $74 billion, building its war chest ahead of a planned Shanghai IPO next year. The Hangzhou-based company is raising $7.4 billion to fund research, development and computing infrastructure, people familiar said. The round steps up from a June valuation above $50 billion led by investors including Tencent. Existing shareholders Monolith Management, Shixiang and battery giant CATL, plus government-backed funds, are injecting capital, and the company will permit more direct investment. DeepSeek's annual recurring revenue has reached $500 million. The raise is part of a broader Chinese AI funding rush: Moonshot AI is nearing a $50 billion valuation and Alibaba raised $10.2 billion.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20WSJ/AI%20Startup%20DeepSeek%20Poised%20to%20Reach%2074%20Billion%20Valuation.pdf"},{"id":"wsj-03","title":"Aker Shares Climb After Nscale Gets $45 Billion Contract","source":"WSJ","date":"28 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Shares in Norwegian industrial investment group Aker jumped 8.2% in early European trade after portfolio company Nscale won a $45 billion contract for AI computing power. Aker said late Wednesday that U.K.-based Nscale, which builds and operates data centers, signed the deal with an undisclosed customer to provide AI compute capacity at its Monarch site in West Virginia. Nscale is backed by Nvidia, Dell, Nokia and Aker, among others; Nokia shares rose 4.9% in Helsinki trading. Aker and Nscale also run a joint venture, Aker Nscale, working with ChatGPT maker OpenAI on a renewable-powered AI data-center project in Norway known as Stargate Norway.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20WSJ/Aker%20Shares%20Climb%20After%20Nscale%20Gets%2045%20Billion%20Contract.pdf"},{"id":"wsj-04","title":"Bank Lending to Eurozone Businesses Fell Again in July","source":"WSJ","date":"28 Aug 2026","tags":["Finance & Markets"],"summary":"Lending to eurozone businesses fell again in July, signaling that rising borrowing costs may be weakening the currency area's economy ahead of a European Central Bank meeting. The ECB said bank loans to businesses totaled 22 billion euros ($25.64 billion), down from 27 billion in June and 34 billion in May. The central bank raised its key rate to 2.25% from 2% in June, responding to inflation driven by the U.S.-Iran war's energy-price surge. The steepest drop came in loans maturing beyond five years. Investors expect a further rise to 2.5% on Sept. 10. July-meeting minutes showed some council members favored hiking into \"mildly restrictive territory.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20WSJ/Bank%20Lending%20to%20Eurozone%20Businesses%20Fell%20Again%20in%20July.pdf"},{"id":"wsj-05","title":"Donald Trump vs. Lisa Cook, Round II","source":"WSJ","date":"28 Aug 2026","tags":["Politics","Finance & Markets"],"summary":"The Wall Street Journal editorial board criticizes President Trump's renewed effort to fire Federal Reserve Governor Lisa Cook. Trump's first attempt, alleging she lied on a 2021 mortgage filing by claiming two properties as primary residences, lost at the Supreme Court in June, which ruled she was entitled to notice and a chance to respond. After an exchange of letters, Cook's attorney called it an \"inadvertent oversight\" and noted Trump himself reportedly obtained two primary-residence mortgages weeks apart in 1993. The board calls the mortgage claims a pretext dug up by Bill Pulte, stresses the importance of Fed independence, and anticipates a possible \"Trump v. Cook II.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20WSJ/Donald%20Trump%20vs.%20Lisa%20Cook,%20Round%20II.pdf"},{"id":"wsj-06","title":"Fed Chairman Kevin Warsh takes the stage in Jackson Hole on Friday with an unusual presence looming over him: a Treasury secretary stepping closer to terrain long treated as the Fed's","source":"WSJ","date":"28 Aug 2026","tags":["Finance & Markets","Politics"],"summary":"Fed Chairman Kevin Warsh takes the stage at the Kansas City Fed's Jackson Hole symposium overshadowed by Treasury Secretary Scott Bessent's encroachment on Fed turf. Bessent surprised markets by announcing Treasury would at least double buybacks of long-term debt to push down yields at 19-year highs, potentially loosening financial conditions just as the Fed may want to tighten. He has also pressed the Fed to supply more dollars to foreign central banks, taken interest in the vacant Atlanta Fed leadership, and argued the Fed is too focused on inflation. Treasury rejects the idea it reaches for new power. The FOMC is divided, with three officials dissenting last month in favor of a rate increase.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20WSJ/Fed%20Chairman%20Kevin%20Warsh%20takes%20the%20stage%20in%20Jackson%20Hole%20on%20Friday%20with%20an%20unusual%20presenc.pdf"},{"id":"wsj-07","title":"Fed's Collins Says Rate Increase Warranted If Inflation Disappoints","source":"WSJ","date":"28 Aug 2026","tags":["Finance & Markets"],"summary":"Boston Fed President Susan Collins said she could support raising interest rates at an upcoming meeting if incoming data fail to show inflation declining as expected. \"I am open to supporting an increase,\" Collins said on the sidelines of the Kansas City Fed's Jackson Hole symposium, adding disinflation evidence is what she seeks. She said Wednesday's July inflation report was broadly in line with her outlook, though core inflation ran higher than expected. Collins, who doesn't vote this year, wrote it may be appropriate to tighten \"soon.\" Inflation has exceeded the Fed's 2% goal for over five years since the Iran war lifted energy prices. Markets see a roughly one-in-three chance of a September hike.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20WSJ/Fed's%20Collins%20Says%20Rate%20Increase%20Warranted%20If%20Inflation%20Disappoints.pdf"},{"id":"wsj-08","title":"German Consumer Confidence Rises on Economic Resilience","source":"WSJ","date":"28 Aug 2026","tags":["Finance & Markets"],"summary":"German consumer confidence rose, with economic perceptions bolstered by resilient growth despite lingering inflation. The GfK/NIM consumer-climate index climbed to minus 26.6 for September from minus 29.4 in August, beating economists' forecast of minus 29.2, driven by a fourth straight monthly rise in economic expectations. Germany's economy grew 0.3% in the second quarter, led by stronger exports and better-than-expected retail. Income expectations hit a six-month high. Still, confidence remains below prewar levels amid Middle East uncertainty, and the Bundesbank expects only slight third-quarter growth. With eurozone inflation near a point above the ECB's 2% target, Santander forecasts German inflation rising to 3.4% in August and 3.5% in September.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20WSJ/German%20Consumer%20Confidence%20Rises%20on%20Economic%20Resilience.pdf"},{"id":"wsj-09","title":"Iran Talks Sputter as Trump Spurns a Return to His June Deal","source":"WSJ","date":"28 Aug 2026","tags":["Geopolitics"],"summary":"The Trump administration has repeatedly told mediators it has no interest in returning to the memorandum of understanding it reached with Iran in June, complicating efforts to restart diplomacy, people familiar said. The preliminary deal, signed at Versailles and negotiated with Vice President JD Vance's help, aimed to reopen the Strait of Hormuz and start nuclear talks in exchange for sanctions relief, but collapsed after Iran attacked ships to assert control over the waterway. Trump has settled on squeezing Iran economically. White House spokeswoman Anna Kelly said no talks are scheduled and \"the naval blockade remains in full force.\" Iranian hard-liners insist the U.S. recognize Tehran's authority over the strait.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20WSJ/Iran%20Talks%20Sputter%20as%20Trump%20Spurns%20a%20Return%20to%20His%20June%20Deal.pdf"},{"id":"wsj-10","title":"Marvell Lifts Long-Term Targets as AI Demand Boosts Second-Quarter Profit, Revenue","source":"WSJ","date":"28 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Marvell Technology lifted guidance for the current and upcoming fiscal years after AI demand boosted fiscal second-quarter profit and revenue. Data-center revenue rose 46% year-over-year to $2.17 billion. CEO Matt Murphy said data-center strength \"continues to exceed our prior expectations.\" Marvell now expects current-year revenue of $12 billion, up $500 million, and fiscal 2028 revenue of $18 billion, up $1.5 billion. Overall revenue rose to $2.74 billion from $2.01 billion, with adjusted earnings of 94 cents beating estimates. Shares fell 6.5% after hours despite nearly tripling this year. Murphy cited accelerating demand from AI hyperscalers designing custom chips; customers include Amazon and Google.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20WSJ/Marvell%20Lifts%20Long-Term%20Targets%20as%20AI%20Demand%20Boosts%20Second-Quarter%20Profit,%20Revenue.pdf"},{"id":"wsj-11","title":"Nvidia Pauses Revenue-Sharing Deals With AI Cloud Companies","source":"WSJ","date":"28 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Nvidia paused some deals in a new financing initiative that offered credit support to AI cloud providers in exchange for a share of revenue, people familiar said. Some Nvidia employees worried the program could draw antitrust scrutiny and that dictating how customers operate raised sensitivities. Nvidia stepped back last week, under two months after announcing the effort, though it may revamp or fold it into another initiative. The move follows growing scrutiny of Nvidia using its balance sheet to fuel demand for its chips; it recently scaled back a backstop for OpenAI's Ohio data center. The program, called the AI Compute Partnership, aimed to help smaller cloud providers finance costly GPU purchases.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20WSJ/Nvidia%20Pauses%20Revenue-Sharing%20Deals%20With%20AI%20Cloud%20Companies.pdf"},{"id":"wsj-12","title":"Nvidia's $279 Billion Supply-Chain Gamble","source":"WSJ","date":"28 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Nvidia's supplier commitments to secure components for its AI chips and systems reached $279 billion last quarter, more than doubling from $119 billion, as it races to skirt supply constraints and hit lofty growth forecasts. Executives said securing components is the only thing preventing faster growth; Nvidia forecast 70% revenue growth for the fiscal year ending January 2028. CEO Jensen Huang said demand far exceeds 70% but supply allows confident delivery of that. The surge mainly reflects tight high-bandwidth memory, which will squeeze gross margins from about 74% to 71.5%. The article warns such commitments can become liabilities in a downturn, as they did for Cisco Systems after the dot-com bust.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20WSJ/Nvidia's%20279%20Billion%20Supply-Chain%20Gamble.pdf"},{"id":"wsj-13","title":"SK Telecom to Create AI Data-Center Company","source":"WSJ","date":"28 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"KKR and a consortium of South Korean firms are investing $2.2 billion in an AI data-center company being created by SK Telecom through a spinoff. SK Telecom will carve data-center and submarine-cable businesses out of subsidiary SK Broadband to form a new company, SK Horizon, securing 3.08 trillion won in combined equity from KKR, IMM Investment and Stonebridge Capital. KKR and IMM will hold 29% and 20% stakes, with SK Telecom keeping 51%. The move completes SK Telecom's AI data-center infrastructure plan, following July's SK Hyper subsidiary. South Korea is racing to build a full domestic AI ecosystem and secure \"AI sovereignty,\" with chipmakers and government planning about $2 trillion in spending.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20WSJ/SK%20Telecom%20to%20Create%20AI%20Data-Center%20Company.pdf"},{"id":"wsj-14","title":"Taiwan Lines Up $7 Billion Boost for Drone Builders to Counter China","source":"WSJ","date":"28 Aug 2026","tags":["Defence","Geopolitics"],"summary":"Taiwan's legislature approved spending over $7 billion on drones over six years to deter a Chinese attack and build a domestic industry aiming to lead globally. The plan covers a full fleet of uncrewed aerial and undersea systems intended to make China think twice about invading. Military planners are drawing lessons from Ukraine and Iran, but China holds a formidable lead in drone production, adding urgency to building a supply chain free of Chinese components. Vice President Hsiao Bi-khim said \"better late than never.\" Taiwan exported over 85,000 drones in this year's first two months, versus 3,473 in all of 2024, and its drone sector's value grew to $155 million in 2024.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20WSJ/Taiwan%20Lines%20Up%207%20Billion%20Boost%20for%20Drone%20Builders%20to%20Counter%20China.pdf"},{"id":"wsj-15","title":"The selloff in U.S. Treasurys has captured global attention, but bond markets overseas have been getting hit even harder. Here's a breakdown of the forces fueling the overseas rout.","source":"WSJ","date":"28 Aug 2026","tags":["Finance & Markets"],"summary":"The selloff in U.S. Treasurys has drawn global attention, but overseas bond markets have been hit even harder. The jump in U.S. borrowing costs and Treasury Secretary Scott Bessent's intervention to lower them have spotlighted a worldwide debt problem. Global debt exceeds $350 trillion, about 305% of world GDP, and advanced-economy governments are expected to borrow $18 trillion this year, increasingly competing with U.S. tech companies for buyers. Yields remain near decade-plus highs, with heavily indebted France, Italy, the U.K. and Japan under most pressure; France's 10-year yield rose about half a point since June. Analysts cite Iran-war inflation fears, political volatility and retreating pension and insurer buyers.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20WSJ/The%20selloff%20in%20U.S.%20Treasurys%20has%20captured%20global%20attention,%20but%20bond%20markets%20overseas%20hav.pdf"},{"id":"wsj-16","title":"Top White House Aides Were in the Dark on Ratcliffe Russia Trip","source":"WSJ","date":"28 Aug 2026","tags":["Geopolitics"],"summary":"CIA Director John Ratcliffe's diplomatic mission to Russia this week was so sensitive that even some senior White House officials, trusted aides and military leaders were kept in the dark beforehand, U.S. officials said. Trump personally dispatched the spy chief after previous envoys failed to halt the Ukraine war. Ratcliffe flew into Moscow on an unmarked C-17 from Latvia, sending European officials scrambling. He reinforced U.S. commitment to NATO's Article 5 and warned Russia not to attack alliance members, following intelligence that Moscow might test NATO within years. He also discussed re-energizing Ukraine talks, which Kyiv officials said could restart in September, and pressed Russia to cut economic and security ties with Iran.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20WSJ/Top%20White%20House%20Aides%20Were%20in%20the%20Dark%20on%20Ratcliffe%20Russia%20Trip.pdf"},{"id":"wsj-17","title":"U.S. Jobless Claims Pull Back Again","source":"WSJ","date":"28 Aug 2026","tags":["Finance & Markets"],"summary":"U.S. jobless claims fell again last week, continuing a volatile summer for unemployment data. Initial claims for unemployment benefits were 203,000 in the week through Aug. 22, down 4,000 from the upwardly revised 207,000 a week earlier and below economists' 208,000 forecast. Continuing claims, which track the total unemployed population, totaled just under 1.78 million in the week through Aug. 15, falling 18,000 from a downwardly revised figure; that data lag initial claims by a week. Unemployment levels have ebbed and flowed in recent months but remain near historic lows despite slow hiring, as companies continue to forgo major layoffs.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20WSJ/U.S.%20Jobless%20Claims%20Pull%20Back%20Again.pdf"},{"id":"wsj-18","title":"What JD Vance Gets Wrong About Hamilton","source":"WSJ","date":"28 Aug 2026","tags":["Politics","Society"],"summary":"In a Wall Street Journal opinion piece, Andrew Langer argues Vice President JD Vance is wrong to embrace Alexander Hamilton over Milton Friedman as the model for conservative economics. Vance told a podcast the right has moved \"much more Alexander Hamilton,\" endorsing government-directed development, and claimed Friedman's ideas suited the 1980s because America then had powerful \"institutional Christianity.\" Langer counters that markets require individual liberty, property rights, honest dealing and enforceable contracts, not Christian guardrails, and that these principles suit people of any faith. He defends Friedman's moral case for voluntary exchange and warns that concentrating economic and political power threatens prosperity and liberty. Hamilton favored energetic national power, public debt, tariffs and subsidies.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20WSJ/What%20JD%20Vance%20Gets%20Wrong%20About%20Hamilton.pdf"},{"id":"wsj-19","title":"Would Putin Really Tangle With NATO?","source":"WSJ","date":"28 Aug 2026","tags":["Geopolitics","Defence"],"summary":"The Wall Street Journal editorial board weighs whether Vladimir Putin would risk war with NATO after CIA Director John Ratcliffe flew to Moscow to warn him off attacking alliance members. Reason suggests not, given Russia's poor performance in Ukraine, where it gains little territory at an estimated 30,000 casualties monthly while spending perhaps 10% of GDP on the military. Trump said Putin \"won't be attacking a NATO territory.\" But the board warns the West has misjudged adversaries before: Putin might stage a lightning Baltic raid to expose NATO as weak. He already wages gray-zone warfare, using shadow ships to launch drones across Europe and sabotaging undersea cables. Trump's Iran struggles may weaken deterrence.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20WSJ/Would%20Putin%20Really%20Tangle%20With%20NATO.pdf"},{"id":"st-01","title":"'Much more to be done': US sounds out NATO allies on how they're stepping up to defend Europe","source":"ST","date":"28 Aug 2026","tags":["Defence","Geopolitics"],"summary":"US Defence Under Secretary Elbridge Colby pressed NATO allies in Brussels on Aug 27 to show how they are stepping up to meet US demands to shoulder Europe's defence, as Washington runs a six-month review of its force deployments launched in July. Colby sought a \"down-to-business conversation\" about Europe, a wealthy continent, taking primary responsibility for conventional defence, flagging issues over access, basing and overflights tied to European responses to the Iran war. NATO chief Mark Rutte said allies were ramping up spending and capabilities: \"much more to be done. We will get there.\" The Pentagon, with some 80,000 troops in Europe, is already reducing assets for NATO plans; allies pledged 5 per cent of GDP on security by 2035.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20ST/'Much%20more%20to%20be%20done'%20US%20sounds%20out%20NATO%20allies%20on%20how%20they're%20stepping%20up%20to%20defend%20Euro.pdf"},{"id":"st-02","title":"Bank of Japan deputy chief calls for more rate hikes as market bets on September lift","source":"ST","date":"28 Aug 2026","tags":["Finance & Markets"],"summary":"Bank of Japan deputy governor Ryozo Himino said on Aug 27 the central bank should keep raising its key policy rate, stressing upside inflation risks from a weaker yen, higher crude prices tied to the Middle East conflict, and rising AI-driven semiconductor costs. Markets widely expect a hike at the Sept 17-18 meeting, after the BOJ held rates in July having lifted them to a 31-year high of 1 per cent in June. Governor Kazuo Ueda's July reference to \"speeding up the pace of rate hikes\" fuelled the bets, as did a July 31 joint Japan-US yen-buying intervention, the first in 15 years. The yen, which hit 163.99 in July, its weakest since 1986, trades near 159 amid concerns over PM Sanae Takaichi's expansionary fiscal policy.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20ST/Bank%20of%20Japan%20deputy%20chief%20calls%20for%20more%20rate%20hikes%20as%20market%20bets%20on%20September%20lift.pdf"},{"id":"st-03","title":"Bulgaria will get seven minehunter ships from Belgium and Netherlands to protect Black Sea","source":"ST","date":"28 Aug 2026","tags":["Defence","Geopolitics"],"summary":"Bulgaria's parliament approved buying seven minehunter ships from Belgium and the Netherlands to bolster NATO's ability to clear naval mines and secure Black Sea shipping routes, local media reported on Aug 27. Under a Dutch sale agreement Bulgaria gets three mine-hunting vessels, while a separate Belgium-Netherlands-Bulgaria transfer covers four more. The Netherlands will restore the ships' technical capabilities before transfer, with Bulgaria paying for repairs to reach NATO readiness standards. Along with Romania and Turkey, Bulgaria agreed at a July NATO summit to expand a joint Black Sea de-mining task force, formed in 2024 after Russia's 2022 invasion of Ukraine, to protect critical infrastructure. Defence Minister Dimitar Stoyanov said the vessels would complement three existing ships. A memorandum covers crew training, spare parts and equipment.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20ST/Bulgaria%20will%20get%20seven%20minehunter%20ships%20from%20Belgium%20and%20Netherlands%20to%20protect%20Black%20Sea.pdf"},{"id":"st-04","title":"Canada's fight with the US has far bigger stakes than trade","source":"ST","date":"28 Aug 2026","tags":["Trade","Geopolitics"],"summary":"In a commentary, Jonathan Eyal analyses Canadian PM Mark Carney's Aug 21 walkout from US trade talks, unprecedented among Trump's partners despite the US buying about 70 per cent of Canadian exports. Washington sought hefty tariffs on autos, steel, aluminium and lumber plus a veto over Canada's future trade deals and curbs on French-language protections tied to Quebec. Carney refused, calling it a \"war,\" triggering US 50 per cent tariffs on US$20 billion of exports and dollar-for-dollar Canadian retaliation from Sept 8; Trump threatened 50 per cent auto duties from 2027. Eyal frames the sovereignty fight against Canada's building of an alternative trade architecture with the EU and CPTPP. Tariffs could push inflation to 4 per cent and cost 90,000 jobs, while three elections corner Carney.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20ST/Canada's%20fight%20with%20the%20US%20has%20far%20bigger%20stakes%20than%20trade.pdf"},{"id":"st-05","title":"China deploys record number of ships around Taiwan as pressure grows","source":"ST","date":"28 Aug 2026","tags":["Geopolitics","Defence"],"summary":"China deployed a record 244 coast guard, research and other government ships around Taiwan's main island in July, nearly eight a day, up from 55 in June and 58 in July 2025, Taiwan's coast guard said, warning of an \"increasingly severe\" situation. About 60 per cent were coast guard vessels; 152 more were detected in the first 21 days of August, with 1,247 counted since May. The figures exclude near-daily warship deployments. Analysts say China is mapping waters for anti-submarine warfare, sharing civilian research-vessel data with its military; the Xiang Yang Hong 03 was escorted by maritime militia over the Ryukyu and East Taiwan trenches. Experts called it a \"clear escalation\" of Beijing's \"grey zone\" pressure undermining Taiwan's sovereignty.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20ST/China%20deploys%20record%20number%20of%20ships%20around%20Taiwan%20as%20pressure%20grows.pdf"},{"id":"st-06","title":"Collective sale reforms may spark more deals, but not a repeat of 2018 boom cycle","source":"ST","date":"28 Aug 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"Grace Leong analyses how two Singapore policy moves could revive the tepid collective sale (en bloc) market: extending additional buyer's stamp duty remission timelines for large redevelopment sites to six years (700-1,400 units) and seven years for mega sites over 1,400 units, and lowering consent thresholds for older projects, to 70 per cent for those aged 40-59 years and 65 per cent for those 60 and above. The reforms could help elderly owners cash out ageing homes and ease reliance on state land sales; Pine Grove could yield 2,000 units, Braddell View 2,600. But analysts stress realistic reserve pricing remains decisive, as developers base bids on land value, construction and financing costs. A shorter six-month signature window and hefty ABSD penalties draw concern; a more disciplined cycle, not a 2018-style boom, is expected.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20ST/Collective%20sale%20reforms%20may%20spark%20more%20deals,%20but%20not%20a%20repeat%20of%202018%20boom%20cycle.pdf"},{"id":"st-07","title":"Four EU countries seek to reopen debate on Russian frozen assets for Ukraine","source":"ST","date":"28 Aug 2026","tags":["Geopolitics","Finance & Markets"],"summary":"The Netherlands, Poland, Spain and Sweden urged the EU on Aug 27 to reopen debate on using Russia's frozen assets to fund Ukraine, arguing a 90 billion euro ($104.86 billion) loan agreed last December for 2026-2027 is insufficient. In a letter to EU foreign policy chief Kaja Kallas and Ireland's presidency, the ministers want the issue raised at the Sept 1-2 foreign ministers meeting. The EU immobilised some 210 billion euros of Russian central bank assets after the 2022 invasion, about 185 billion held at Euroclear. A Commission proposal for a 165 billion euro loan was dropped after Belgium, fearing legal liability, objected, and its position is unchanged. Poland's Radoslaw Sikorski said the money is better spent defending Ukraine than on reconstruction.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20ST/Four%20EU%20countries%20seek%20to%20reopen%20debate%20on%20Russian%20frozen%20assets%20for%20Ukraine.pdf"},{"id":"st-08","title":"Google agrees to settle Britain app developers' lawsuit for $449.3 million","source":"ST","date":"28 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Google agreed to settle a mass London lawsuit brought on behalf of UK app developers for £260 million (S$449.3 million), per a deal published on Aug 27. The claim, previously valued above £1 billion, alleged Google abused its dominant Play Store position to block alternative app distribution and charged an unfair commission, usually 30 per cent. Led by academic Barry Rodger, the case was due for trial in September at London's Competition Appeal Tribunal, the fourth such action against a major tech firm since 2025 after Apple, Qualcomm and Sony. Google made no admission of liability, saying it had \"strong defences.\" Under the deal, £160 million goes to developers who sold apps between August 2018 and July 2026, with £100 million for legal and funding costs.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20ST/Google%20agrees%20to%20settle%20Britain%20app%20developers'%20lawsuit%20for%20449.3%20million.pdf"},{"id":"st-09","title":"Greek-operated air defence system shoots down drones over Saudi","source":"ST","date":"28 Aug 2026","tags":["Defence","Energy"],"summary":"A US-made Patriot air defence battery operated by Greek military personnel in Saudi Arabia intercepted a swarm of drones on Aug 27 in the wider Yanbu region, home to major oil refining facilities, Greek security sources told Reuters. The battery, coordinating with Saudi air defences, launched three missiles, though sources did not specify how many drones were downed or their origin. It was the third combat use of the Greek-operated system since the US-Israeli war on Iran began, underscoring European allies' widening role in defending Gulf energy infrastructure. Greece has deployed the Patriot battery in Saudi Arabia since 2021 under an agreement to help protect the kingdom's energy facilities.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20ST/Greek-operated%20air%20defence%20system%20shoots%20down%20drones%20over%20Saudi.pdf"},{"id":"st-10","title":"Le Pen seeks to woo French business leaders at first presidential debate","source":"ST","date":"28 Aug 2026","tags":["Politics"],"summary":"Far-right leader Marine Le Pen sought to reassure French business leaders at a first presidential debate on Aug 27 organised by employers' lobby MEDEF, pledging to fix public finances and repay debt, unlike hard-left rival Jean-Luc Melenchon. France carries one of the euro zone's highest deficits and record debt at 117 per cent of output. Polls show Le Pen winning the first round next April, with Melenchon or centre-right Edouard Philippe as possible run-off rivals. Candidates clashed over debt and pensions; centre-left Raphael Glucksmann attacked her immigration plans. Blue-chip stocks hit a one-month low on budget and political worries, and 82 per cent of business owners polled were pessimistic. PM Sebastien Lecornu's minority government must submit a 2027 budget by Oct 6.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20ST/Le%20Pen%20seeks%20to%20woo%20French%20business%20leaders%20at%20first%20presidential%20debate.pdf"},{"id":"st-11","title":"No signs Russia prepping military attack on NATO countries, says EU official","source":"ST","date":"28 Aug 2026","tags":["Geopolitics","Defence"],"summary":"European intelligence agencies see no sign Russia is preparing a military attack on European NATO countries, a senior EU official said on Aug 27, after US reports that CIA director John Ratcliffe warned Moscow against striking the alliance during a Moscow visit. The Wall Street Journal reported Russia might test NATO with a \"limited assault\" within a few years. The official said the assessment of no imminent risk \"has not changed,\" but stressed Russia is \"actively\" creating difficulties through \"hybrid and not-so-hybrid attacks\" — drone incursions, cyberattacks, disinformation and political meddling — with eastern member states most exposed. \"This escalation by Russia is clearly there,\" she said. The Kremlin dismissed reports of attack preparations as \"scare stories.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20ST/No%20signs%20Russia%20prepping%20military%20attack%20on%20NATO%20countries,%20says%20EU%20official.pdf"},{"id":"st-12","title":"Nvidia agrees to buy Hugging Face for $16.4 billion","source":"ST","date":"28 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Nvidia has agreed to buy AI platform Hugging Face, a repository of open-source AI models and data sets, for US$12.9 billion (S$16.4 billion), The Information reported on Aug 26, marking one of Nvidia's largest acquisitions. The deal signals Jensen Huang's bet that AI demand is expanding, and gives Nvidia control of a hub for open-source models as closed-source rivals such as Anthropic and OpenAI pursue their own chips as alternatives to Nvidia's GPUs. The price dwarfs Hugging Face's US$150 million annualised revenue; the firm was valued at US$4.5 billion in a 2023 round Nvidia backed and rejected a US$500 million Nvidia offer in 2025. Nvidia recently forecast a 70 per cent revenue jump next fiscal year and committed US$18 billion to equity investments through fiscal 2027.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20ST/Nvidia%20agrees%20to%20buy%20Hugging%20Face%20for%2016.4%20billion.pdf"},{"id":"st-13","title":"Pentagon policy chief tells NATO allies U.S. wants European-led defense of continent","source":"ST","date":"28 Aug 2026","tags":["Defence","Geopolitics"],"summary":"The Pentagon's policy chief Elbridge Colby told NATO ambassadors in Brussels on Aug 27 that the alliance \"must change\" and that a US review of forces in Europe aims to enable a \"more durable and powerful European-led conventional defense.\" Washington announced the six-month review in June and sent members a questionnaire spanning defence spending, strategy, procurement and support for US foreign policy priorities. The review will produce at least four options for Defense Secretary Pete Hegseth by November 6, ahead of a December deadline. Colby said consultations were \"a vital part\" of the process and Europe remains critical for the US. Diplomats called the talks positive but preliminary, describing them as \"mainly sounding out,\" with allies signalling they are stepping up and that unity is key.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20ST/Pentagon%20policy%20chief%20tells%20NATO%20allies%20U.S.%20wants%20European-led%20defense%20of%20continent.pdf"},{"id":"st-14","title":"Qatar PM visits Tehran to pursue mediation efforts","source":"ST","date":"28 Aug 2026","tags":["Geopolitics","Energy"],"summary":"Qatar's Prime Minister Mohammed bin Abdulrahman al-Thani visited Tehran on Aug 27 to relaunch diplomacy after the US and Iran traded recriminations over Washington's plan to intensify economic pressure, which one Iranian official called \"all-out economic war.\" Meeting Foreign Minister Abbas Araghchi, Qatar, which helped broker a June ceasefire, discussed a phased framework including a temporary joint Iranian-Omani shipping corridor through the Strait of Hormuz and a mine-clearing project. The war nears its sixth month with fighting paused but no breakthrough; both sides dispute control of the strait, where flows fell to a three-month low of five million barrels a day. Brent rose 0.6 per cent to US$88.35. Iran and Oman gave conflicting accounts of a revenue-sharing deal.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20ST/Qatar%20PM%20visits%20Tehran%20to%20pursue%20mediation%20efforts.pdf"},{"id":"st-15","title":"Russia says it could strike UK military targets in response to Kyiv's use of British missiles","source":"ST","date":"28 Aug 2026","tags":["Geopolitics","Defence"],"summary":"Russia warned on Aug 27 it could strike British military targets inside and outside Ukraine in response to Ukrainian attacks on Russian territory using long-range British cruise missiles. Foreign Ministry spokeswoman Maria Zakharova said London was \"one step away\" from complicity in \"terrorism\" against Russian civilians and warned of \"inevitable catastrophic consequences,\" referencing Franco-British Storm Shadow/SCALP strikes. Analysts linked the sharpened rhetoric to Britain's decision, made public Monday, to grant Kyiv classified technology to produce
