roved its 22nd package of sanctions on Russia, blacklisting about 1,600 companies and individuals linked to the defence sector, EU diplomacy chief Kaja Kallas said on X, according to TASS. Citing the Council resolution in the EU Official Journal, TASS says the designations list grew from 3,100 to 4,700 entries, with 826 companies and 743 individuals added, all subject to entry bans and asset freezes. Those listed include 77 candidates and elected members from State Duma elections held in Crimea and Russian-held parts of Ukraine, United Rocket and Space Corporation CEO Sergey Gureev and former acting Ukrainian prime minister Gennady Arbuzov. Companies hit include UDC-Gas Turbines, UDC-Perm Motors, Cordiant, Samolyot, the Gaz Automobile Plant and Sevmash, Zvezda and Rybinsk shipyards.", "url": "https://tass.com/economy/2200957"}, {"id": "tass-13oct-09", "title": "IN BRIEF: Kremlin remarks on 'energy truce,' US negotiators’ efforts", "source": "TASS", "date": "13 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "Kremlin spokesman Dmitry Peskov declined to comment on a possible energy truce, saying communication is ongoing, TASS reports from his briefing. Peskov said Russia wants lasting peace in Ukraine rather than a ceasefire, praised the efforts of American negotiators and said Russia is not seeking a split between the US and Europe; he described the Europeans as the \"war camp\" seeking to prolong the conflict. He said the Kremlin expects the trial over the Nord Stream sabotage, due to begin on Oct 14, to name the perpetrators and those who ordered it. Peskov added that Putin and Azerbaijani President Ilham Aliyev did not discuss 11 Russians detained in Azerbaijan.", "url": "https://tass.com/politics/2200911"}, {"id": "tass-13oct-10", "title": "Iran hits supertanker in Strait of Hormuz — IRGC", "source": "TASS", "date": "13 Oct 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "The naval forces of Iran's Islamic Revolutionary Guard Corps (IRGC) said they struck a supertanker in the Strait of Hormuz on the morning of Oct 12, causing a fire on board, TASS reports, citing Iranian state television. The IRGC called it the third such incident in two days, saying the vessel had its navigation system off and tried to leave the waterway after ignoring warnings. The IRGC also warned commercial vessels and tankers that it would respond forcefully if they cooperate with the US military in the Strait of Hormuz and the Persian Gulf.", "url": "https://tass.com/world/2201019"}, {"id": "tass-13oct-11", "title": "Iran-Russia relations based on trust, including on uranium removal issue — Iranian MFA", "source": "TASS", "date": "13 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "Iranian Foreign Ministry spokesman Esmaeil Baghaei told a briefing that Russia-Iran relations, including on resolving the nuclear issue, rest on mutual trust, TASS reports. The comment follows Russian President Vladimir Putin telling US President Donald Trump that the proposal to move enriched Iranian uranium to Russian territory remained on the table and that diplomatic options for the US-Iran conflict were not exhausted. Baghaei said Iran's position was conveyed to Putin at a summit in Turkmenistan before his call with Trump. In TASS's account of the background, the US and Israel launched a war on Iran on February 28, a June ceasefire memorandum was followed by renewed US strikes on July 8, and on October 10 Trump did not rule out further strikes.", "url": "https://tass.com/world/2200965"}, {"id": "tass-13oct-12", "title": "Oil shipping and insurance costs exceed one-third of the commodity value — OPEC", "source": "TASS", "date": "13 Oct 2026", "tags": ["Energy", "Finance & Markets"], "summary": "OPEC and OPEC+ ministers meeting in Riyadh said current disruptions to energy flows have pushed shipping and insurance costs to \"unprecedented levels\" of more than one-third of oil's value, according to an OPEC statement reported by TASS. The ministers said the costs impede the movement of crude and products, ripple through the industry value chain and add inflationary pressure on the global economy, and stressed the importance of safeguarding international maritime routes. They will monitor the situation and engage governments, industry and bodies such as the IEF and IEA to improve shipping conditions. The ministers also agreed to keep consulting through the JMMC and OPEC+ ministerial meetings and reaffirmed decisions adopted on June 7, 2026.", "url": "https://tass.com/economy/2201093"}, {"id": "tass-13oct-13", "title": "Rising freight, transport costs account for bulk of oil price increase — Novak", "source": "TASS", "date": "13 Oct 2026", "tags": ["Energy", "Finance & Markets"], "summary": "Russian Deputy Prime Minister Alexander Novak told the Vesti news programme that rising oil transport and freight costs account for most of the increase in oil prices, TASS reports. Novak said OPEC and OPEC+ ministers meeting in Riyadh discussed a global surge in transport, freight and insurance costs, which have risen five- to tenfold on certain routes. He attributed this to global risks, a shortage of vessels, the closure of the Strait of Hormuz, military risks and attacks on civilian tankers. According to Novak, ministers agreed to monitor the situation jointly, work with international organisations to stabilise the market and keep meeting to make consensus decisions.", "url": "https://tass.com/economy/2201121"}, {"id": "tass-13oct-14", "title": "Riyadh airport to remain closed through Saturday — air traffic controllers", "source": "TASS", "date": "13 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "King Khalid International Airport, Riyadh's main aviation hub, is expected to stay closed to arrivals and departures until approximately the end of October 17, an air traffic control source told TASS. The airport suspended operations on October 10 after coming under attack, and Saudi Arabia's General Authority of Civil Aviation earlier said the suspension would be extended to verify the safety and operational readiness of its facilities. TASS says Yemen's Houthi movement, Ansar Allah, attacked the airport on October 10 and 11. According to Saudi authorities, at least 12 people were killed and 309 injured in the first strike, and one killed and 11 injured in the second, which also damaged the airport.", "url": "https://tass.com/economy/2201023"}, {"id": "tass-13oct-15", "title": "Russia has supplied energy resources worth over $320 billion to Europe since 2022 — Novak", "source": "TASS", "date": "13 Oct 2026", "tags": ["Energy", "Geopolitics", "Trade"], "summary": "Russian Deputy Prime Minister Alexander Novak told the Vesti news programme that Russia has supplied US$320.7 billion of energy resources to EU countries since 2022, above the US$250 billion figure he said the US side had cited, TASS reports. Citing the Energy Ministry, Novak said US$21.3 billion was supplied to Europe in the first nine months of 2026 via routes exempted from sanctions. He said additional Russian diesel supplies to global markets, including the US, would help offset problems in the Strait of Hormuz and reduced global refining capacity. Novak said oil prices have nearly doubled and that diesel prices have already fallen about 5–6% on the extra Russian supply.", "url": "https://tass.com/economy/2201127"}, {"id": "tass-13oct-16", "title": "Russian, US companies negotiating diesel supplies — Novak", "source": "TASS", "date": "13 Oct 2026", "tags": ["Energy", "Trade", "Geopolitics"], "summary": "Russian and US companies, together with the two countries' energy ministries, are already negotiating Russian diesel supplies, Deputy Prime Minister Alexander Novak told the Vesti news programme, TASS reports. Novak said that under agreements between Presidents Putin and Trump, Moscow partially lifted its diesel export ban, while Washington waived relevant sanctions for six months. Putin and Trump discussed petroleum product supplies in an October 9 phone call. Novak earlier told TASS Russia is ready to supply 300,000 tons of diesel in October, 500,000 tons in November and 1 million tons in December, aiming eventually for 3 million tons a month; US sanctions exemptions run until April 7, 2027.", "url": "https://tass.com/economy/2201113"}, {"id": "tass-13oct-17", "title": "Slovak PM says EU has paid heavy price for oil crisis, continuing war", "source": "TASS", "date": "13 Oct 2026", "tags": ["Politics", "Geopolitics", "Energy"], "summary": "Slovak Prime Minister Robert Fico said only the European Union has been paying a huge price for the oil crisis and the wars around it, in a video posted by his SMER party, TASS reports. Fico said the EU is isolating itself, has no say in settling conflicts and runs an ineffective sanctions policy, and that Slovakia opposes halting Russian oil and gas imports. He said Bratislava will press the EU to revise its ban on Russian energy and recalled that Slovakia has challenged the European Commission's Russian gas import ban at the European Court of Justice. Ahead of the EU summit on Thursday and Friday, Fico said he feared a military conflict could break out.", "url": "https://tass.com/world/2201141"}, {"id": "tass-13oct-18", "title": "Three EU countries call for mechanism to suspend EC decisions — Politico", "source": "TASS", "date": "13 Oct 2026", "tags": ["Politics", "Finance & Markets"], "summary": "TASS, citing Politico, reports that German Chancellor Friedrich Merz, Italian Prime Minister Giorgia Meloni and Belgian Prime Minister Bart De Wever wrote to European Council President Antonio Costa proposing an \"emergency brake\" to suspend EU norms and European Commission decisions that hinder competition and industrial development. The leaders also called for faster planning and approval procedures, a time-limited suspension of certain regulatory areas under a new priority rule, and a swift cut in the administrative burden on small and medium-sized businesses. The letter precedes the October 15–16 EU summit, which will discuss the 2028–2034 budget, the energy crisis, enlargement and arms for Ukraine. In its own comment, TASS says the mechanism is highly unlikely to be approved and may be used as leverage over the Commission's proposed €1.76 trillion budget, which member states want cut by €141 billion.", "url": "https://tass.com/world/2201139"}, {"id": "tass-13oct-19", "title": "Trump calls decision to strike diesel fuel deal with Russia 'the right choice'", "source": "TASS", "date": "13 Oct 2026", "tags": ["Energy", "Trade", "Geopolitics"], "summary": "US President Donald Trump said on Truth Social that reaching a diesel fuel agreement with Russia was the right choice, writing that the European Union had paid Russia US$250 billion for energy, TASS reports. Trump and Russian President Vladimir Putin discussed oil product supplies in an October 9 phone call, in which Putin reaffirmed Moscow's readiness to supply oil and petroleum products to the US and global market. Deputy Prime Minister Alexander Novak said Russia will lift its diesel export ban early and supply 300,000 tons in October, 500,000 tons in November and 1 million tons in December, possibly reaching 3 million tons a month. The US issued a general licence authorising Russian diesel supplies to the global market until April 7, 2027.", "url": "https://tass.com/world/2201005"}, {"id": "tass-13oct-20", "title": "West planning Baltic Sea blockade including adjacent straits — Russian presidential aide", "source": "TASS", "date": "13 Oct 2026", "tags": ["Geopolitics", "Defence", "Trade"], "summary": "Russian presidential aide and Russian Maritime Board chairman Nikolay Patrushev, speaking during a visit to China, claimed London and Brussels are drawing up plans to blockade the Baltic Sea and the straits leading into it, TASS reports. Patrushev said Western countries are trying to organise the interception of Russian vessels and that other key shipping routes are also under threat. He said maritime logistics matter greatly to both Moscow and Beijing, and that the Strait of Malacca is vital to China but shipping there can easily be disrupted, by naval forces or what he called Western terrorist methods. Patrushev said Russia is developing the Trans-Arctic Transport Corridor as an alternative to traditional routes.", "url": "https://tass.com/politics/2200999"}, {"id": "xinhua-13oct-01", "title": "China to cut NEV export tax rebate for high-quality auto industry growth", "source": "XINHUA", "date": "13 Oct 2026", "tags": ["Trade", "Finance & Markets"], "summary": "China's Ministry of Finance and State Taxation Administration announced on Oct 12 that the VAT export rebate rate for new energy vehicles (NEVs) will be cut to 9% from 13% from April 1, 2027, with rebates for e-cigarette devices and related products scrapped from the same date, Xinhua reports. According to Xinhua, the move follows the scrapping of photovoltaic rebates from April 1, 2026 and a cut in battery rebates to 6% from 9%, with battery rebates to end from Jan 1, 2027. Yuekai Securities chief economist Luo Zhiheng told Yicai the cut can push firms from low-price competition towards technology and brands, and that NEVs will stay competitive. China's January–September auto exports totalled 8.205 million units, including over 4 million NEVs, Xinhua reports.", "url": "https://english.news.cn/20261012/18c5c504668842cc8fb6fb48630924c9/c.html"}, {"id": "xinhua-13oct-02", "title": "China's NEV share of new car sales hits record 61.6 pct in September", "source": "XINHUA", "date": "13 Oct 2026", "tags": ["Finance & Markets", "Trade"], "summary": "New energy vehicles (NEVs) took a record 61.6% of China's new car sales in September, the third straight month above 60%, lifting the share for the first three quarters to 53.6%, according to China Association of Automobile Manufacturers (CAAM) data reported by Xinhua. September NEV output and sales were 1.814 million and 1.823 million units, up 12.2% and 13.6% year on year; for January–September they reached 12.483 million and 12.472 million, both up more than 10%, while total auto output and sales of 23.246 million and 23.271 million edged down slightly. September vehicle exports rose 61.4% year on year to 1.053 million, including 571,000 NEVs. CAAM's Chen Shihua expects steady operation in the fourth quarter.", "url": "https://english.news.cn/20261012/2707f31ad7744567b4503e3a7db90fff/c.html"}, {"id": "xinhua-13oct-03", "title": "China's top diplomat meets Russian presidential aide, chairman of Maritime Board", "source": "XINHUA", "date": "13 Oct 2026", "tags": ["Geopolitics"], "summary": "China's top diplomat Wang Yi met Russian presidential aide and Maritime Board chairman Nikolai Patrushev in Beijing on Oct 12, Xinhua reports. According to Xinhua, Wang said close communication between Presidents Xi Jinping and Vladimir Putin had lifted bilateral relations to a higher level, said China is ready to enhance the alignment of the two countries' maritime strategies, and congratulated Russia on last month's State Duma election. Patrushev said Russia wants to cooperate with China on multilateral maritime governance and draw on China's experience in shipbuilding, logistics and maritime trade, which he said would add a new dimension to the two countries' comprehensive strategic coordination, Xinhua reports.", "url": "https://english.news.cn/20261013/b6abd1d6d84c43e09906867187445bd8/c.html"}, {"id": "xinhua-13oct-04", "title": "Chinese Vice Premier He Lifeng meets with Apple Executive Chairman Tim Cook", "source": "XINHUA", "date": "13 Oct 2026", "tags": ["Trade", "Technology & AI"], "summary": "Chinese Vice Premier He Lifeng met Tim Cook, executive chairman of Apple's board, at the Great Hall of the People in Beijing on Oct 12, Xinhua reports. According to Xinhua, He said implementing the two heads of state's common understandings and building a constructive China-US relationship of strategic stability would give multinationals stable expectations and a sound business environment, and that China welcomes technology companies including Apple to deepen cooperation. Xinhua reports Cook said Apple is fully confident in its long-term development in China and will act as a bridge within the business community to support stable US-China economic and trade relations.", "url": "https://english.news.cn/20261012/34597517add64388a5c917f13204a205/c.html"}, {"id": "xinhua-13oct-05", "title": "Diesel deal with Russia \"out of the question\": Merz", "source": "XINHUA", "date": "13 Oct 2026", "tags": ["Geopolitics", "Energy", "Politics"], "summary": "German Chancellor Friedrich Merz said on Oct 12 that the recent US-Russia agreement on diesel exports is \"out of the question\" for Germany and Europe, Xinhua reports. Speaking in Berlin after a two-day CDU leadership retreat, Merz said Germany is adhering to sanctions on Russia, pledged continued support for Ukraine and dismissed prospects of immediate peace talks, saying EU leaders would pursue a just and lasting peace at a Brussels summit on Oct 15–16. According to Xinhua, Donald Trump announced the diesel deal after an Oct 9 call with Vladimir Putin, and Russia partially lifted diesel export restrictions in place since early 2026 on Oct 10. Merz, whose CDU has suffered state election setbacks, vowed to speed reforms including lowering energy prices.", "url": "https://english.news.cn/20261012/0a18603152094a7f86b5eb1a1063b48c/c.html"}, {"id": "xinhua-13oct-06", "title": "Hong Kong, Singapore sign renewed MoU to strengthen energy-related cooperation", "source": "XINHUA", "date": "13 Oct 2026", "tags": ["Energy", "Southeast Asia"], "summary": "Hong Kong's Electrical and Mechanical Services Department and Singapore's Energy Market Authority signed a renewed memorandum of understanding on energy cooperation on Oct 12, Xinhua reports. The renewal continues the first MoU the two sides signed in 2020. According to Xinhua, cooperation will deepen in three areas: electricity and gas systems and markets; renewable energy, energy efficiency and conservation, district cooling, AI, digital grids and low-carbon technologies; and collaboration in multilateral forums.", "url": "https://english.news.cn/20261012/5785c9fda0df410ca3681b90d3dfd630/c.html"}, {"id": "xinhua-13oct-07", "title": "Kremlin says Ukraine seeks truce to regroup, not hold election", "source": "XINHUA", "date": "13 Oct 2026", "tags": ["Geopolitics", "Politics"], "summary": "Kremlin spokesman Dmitry Peskov said on Oct 12 that Ukraine's proposed 60-day ceasefire is meant to let its forces regroup rather than enable an election, Xinhua reports. In comments on the Kremlin's social media channel, Peskov said Ukraine needs the truce \"to gather its strength, heal its wounds and continue the war\". He said Vladimir Putin would be prepared to order the military not to strike Ukraine on election days if Ukraine genuinely intended to hold a presidential election. Xinhua notes Donald Trump said on Oct 10 that Ukraine should elect a new president, suggesting Volodymyr Zelensky had not done enough to end the conflict.", "url": "https://english.news.cn/20261012/3bcb828548d94989a7fc506a82921036/c.html"}, {"id": "xinhua-13oct-08", "title": "Paris Motor Show kicks off with record number of Chinese brands", "source": "XINHUA", "date": "13 Oct 2026", "tags": ["Trade", "Technology & AI"], "summary": "The 91st Paris Motor Show opened on Oct 12 with a record 25 Chinese brands from 16 automakers, including BYD, XPeng, Changan, Dongfeng and Leapmotor, roughly double the 2024 edition, Xinhua reports. The week-long show has over 100 exhibitors and more than 60 automakers; show director Serge Gachot said Chinese carmakers are putting more emphasis on brand awareness and local partners, showing stronger commitment to Europe. European brands including Audi, Renault and Volkswagen are presenting new models and electrification technologies, and the show has introduced public autonomous-driving demonstrations for the first time. Around 90 models from 20 brands are offered for more than 5,000 planned test drives.", "url": "https://english.news.cn/20261013/f35b0727e146415499b6ab3affa32021/c.html"}, {"id": "xinhua-13oct-09", "title": "Six vessels attacked in Strait of Hormuz and adjacent waters on Sunday", "source": "XINHUA", "date": "13 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "Xinhua, citing UK Maritime Trade Operations (UKMTO) advisories issued on Oct 11 and 12, reports that six vessels were attacked on Oct 11 in the Strait of Hormuz and the adjacent Gulf of Oman. According to the advisories, four outbound tankers, including a product tanker and a crude oil tanker, and an inbound container vessel were struck by unknown projectiles in the strait, while a tanker near Oman's Sohar anchorage was attacked by an unmanned aerial vehicle and its crew evacuated with help from local authorities. Xinhua says US-Iran tensions over control of the strait have escalated, with attacks on shipping rising markedly since late September, casualties mounting and risks spreading to waters off Qatar, the UAE and Oman.", "url": "https://english.news.cn/20261013/5b60f10cfea643cd8c2597edb937ea79/c.html"}, {"id": "xinhua-13oct-10", "title": "U.S. needs to handle Taiwan question prudently: FM spokesperson", "source": "XINHUA", "date": "13 Oct 2026", "tags": ["Geopolitics"], "summary": "Chinese foreign ministry spokesperson Mao Ning said on Oct 12 that the US must abide by the one-China principle and the three China-US joint communiqués and handle the Taiwan question prudently, Xinhua reports. She was responding to a US State Department statement last week calling China's maritime activities off Taiwan's east coast \"deeply destabilizing\". According to Xinhua, Mao said China has an exclusive economic zone and continental shelf in waters east of Taiwan and that its activities there fall within its sovereign rights and jurisdiction, and called the Taiwan question China's internal affair that brooks no external interference.", "url": "https://english.news.cn/20261012/81281a35fa6c45fda167771178e4315d/c.html"}]}, "2026-10-14": {"date": "2026-10-14", "dayOfWeek": "Wednesday", "totalArticles": 98, "sourceCounts": {"WSJ": 17, "ST": 22, "BT": 17, "SCMP": 15, "TASS": 13, "XINHUA": 14}, "executiveDigest": "The Gulf war widened on two fronts. A Houthi missile attack on Oct 13 hit Saudi Aramco's Dhahran headquarters and caused a fire, according to people with knowledge of the matter (BT), while Xinhua carries the coalition's account that a missile aimed at Dhahran was intercepted and debris fell on a residential area. The Saudi-led coalition struck a fuel depot outside Sanaa (ST), and attacks on Hormuz shipping have surged, with four tankers hit on Oct 11, about double the previous week's daily average (BT). Axios, as relayed by TASS, says US and Israeli forces are keeping preparations in place to resume strikes on Iran before both countries' elections should Trump reverse his Oct 8 pledge not to strike before the midterms. In Ukraine, Russia hit no energy targets on Oct 13 for the first time since Trump's 'energy ceasefire' (ST); TASS, citing The Washington Post, reports a four-point US-European peace plan that Kremlin spokesman Dmitry Peskov says Moscow has heard nothing about. Drones sank a cargo ship off Bulgaria, leaving 11 crew missing (WSJ, SCMP). In Bangkok, the IMF held its 2026 global growth forecast at 3.1% (WSJ) but warned against 'complacency' in markets, naming an AI-driven sell-off and spiking bond yields as risks (BT). That sell-off deepened: Korea's Kospi plunged 5.5% as memory-chip stocks tumbled (BT), and AirTrunk postponed a planned US$1.5 billion Singapore REIT IPO, sources say (ST). US banks opened earnings with combined profit of US$32 billion but warned that higher rates could stall growth (WSJ), and New York Fed President John Williams said one more rate rise this year may be appropriate (WSJ). Anthropic warned small AI models may soon self-replicate on poorly secured devices (BT), and Senior Minister K. Shanmugam said Singapore has asked AI firms for full and immediate disclosure of AI incidents (ST).", "briefingCards": [{"title": "Lead story - Russia's energy truce holds for a day as a US-European peace plan surfaces and drones sink a ship off Bulgaria", "body": "Russia hit no Ukrainian energy targets on Oct 13 for the first time since President Trump announced an 'energy ceasefire' on Oct 11, striking transport and logistics instead, after hitting six energy sites on Oct 12 (ST). Zelensky said Ukraine had not struck Russian refineries for two days, and that it backs the truce as long as Russia observes it; he has proposed new talks in the coming days with US envoys Steve Witkoff and Jared Kushner (ST). TASS, citing The New York Times, reports the envoys told Ukrainian officials in Miami on Oct 9 that Washington would offer nothing in return for an end to refinery strikes, and some in the room heard a reference to US intelligence help as a veiled threat. Trump said on Oct 13 the US is still sharing intelligence with Ukraine and defended the Russian diesel deal, saying the fuel is being released to the world, not to the US (ST). TASS, citing Washington Post columnist David Ignatius, reports the US and Europe are drafting a four-point plan: Ukraine's reconstruction, security guarantees for both Ukraine and Russia, energy-based economic integration that might include a pipeline to Europe with profits split between Kyiv and Moscow, and a ceasefire on the current front line. Peskov told his Oct 13 briefing that Moscow had seen the report but heard nothing about the plan, that the diesel deal has no bearing on Russia's position on Ukraine, and that EU sanctions could hamper it, TASS reports. In the Black Sea, drones struck two ships just outside Bulgaria's territorial waters on Oct 13, sinking the HS Dignity with 11 crew missing; all 15 crew of the Ukrainian-owned Chelsea 3 were rescued (WSJ, SCMP). Bulgarian Prime Minister Rumen Radev summoned the Russian ambassador, saying there was no conclusive evidence but that the attacks favoured Russia's interests; the ambassador raised a possible third-country provocation (SCMP, Xinhua). NATO officials said member states will lead responses for now, partly to avoid triggering Article 5 (WSJ), and Mark Rutte said NATO will adjust its Black Sea posture 'as needed', according to Xinhua. Ukraine opened EU accession talks on the internal-market cluster after Hungary dropped its objections (ST), and Britain pledged £45 million of surface-to-air missiles ahead of Zelensky's visit to London on Oct 14 (ST)."}, {"title": "Markets & finance - IMF warns against complacency as US banks open earnings and the Fed's Williams eyes one more hike", "body": "The IMF's World Economic Outlook, released in Bangkok on Oct 13, holds 2026 global growth at 3.1% and US growth at 2.3% in both 2026 and 2027, with global inflation at 4.7% this year, but warns that a longer war plus lost fiscal and monetary credibility would cut growth by 0.2 and 0.5 percentage point in 2026 and 2027 (WSJ). Its financial stability report warned against 'complacency', naming an AI-driven sell-off, a spike in sovereign yields and a major cyberattack as catalysts; hyperscalers now account for 10% of global investment-grade bond issuance, up from under 1% in 2024 (BT). IMF deputy research director Petya Koeva Brooks said indebted low-income oil importers have 'no choice' but to cut spending or restructure debt (ST). US banks opened third-quarter earnings: JPMorgan, Goldman Sachs, Citigroup and Wells Fargo earned a combined US$32 billion, up 14%, but bank shares fell, with Citigroup down 5.6%, and JPMorgan's CFO said further Fed hikes would 'almost by definition' mean higher unemployment (WSJ). JPMorgan's US$5.57 a share missed estimates of US$5.93, while Goldman's equities revenue jumped 72% (WSJ). Bank of America was fined US$1.2 billion over anti-money-laundering failures, including a record US$750 million OCC penalty (WSJ). New York Fed President John Williams said one more rate increase this year may be appropriate (WSJ). Mortgage rates have climbed to 7.4%, the highest in almost three years, even as September existing-home sales rose 1.5% (WSJ); the NFIB small-business index fell to a three-month low of 97.9 (BT). Franklin Templeton's Jenny Johnson told BT that 10-year Treasury yields, which hit a 24-year high of 5.34% on Oct 7, are still 'pretty normal', and Hong Kong strategists are recommending Treasuries (SCMP). Smaller private-equity firms are being squeezed, with fundraising at US$222 billion through Sept 30 against US$330 billion for all of last year (WSJ). Abroad, the RBA's minutes kept a fifth hike this year open (BT), Japan's wholesale inflation slowed to 6.8% as BOJ Governor Kazuo Ueda said underlying inflation is close to 2% (BT), and Germany's inflation was confirmed at 3.3%, the highest in nearly three years, according to Destatis data reported by Xinhua."}, {"title": "Asia realignment - Taiwan courts Europe and US drone makers as Beijing and Moscow tighten their sea links", "body": "Taiwan's Foreign Minister Lin Chia-lung told the Warsaw Security Forum that dependence on Chinese suppliers is 'a threat to European freedom and sovereignty itself', ahead of an EU summit starting Oct 15 with China first on the agenda (ST). US drone start-ups are flocking to Taiwan to build China-free supply chains, with at least 13 US-Taiwan agreements signed since September 2025 and Taipei committing over US$7 billion to drones over six years, as Trump withholds approval of a US$14 billion arms sale (WSJ). An SCMP analysis looks at a minority push by US realists to drop strategic ambiguity and rule out intervention over Taiwan (SCMP). Beijing's foreign ministry spokesperson Mao Ning said the US should stop sending what she called wrong signals to 'Taiwan independence' forces, according to Xinhua. Taiwan's finance minister Chuang Tsui-yun plans to attend the Apec finance ministers' meeting in Hong Kong on Oct 20-21, where China's Lan Foan will give the opening speech (SCMP). Wang Yi and Russia's Nikolai Patrushev pledged in Beijing to deepen maritime and Arctic logistics ties to protect shipping and energy supply (SCMP), while South Korea welcomed home its first container ship to sail to Europe and back via the Arctic, though it left with 737 TEU against a 1,300 TEU target (ST). North Korea showed off its untested Hwasong-20 ICBM as Trump floated a meeting with Kim Jong Un (WSJ). On trade and markets, Chinese brands made up half the exhibitors at the Paris Motor Show ahead of a planned EU cap of 350,000 Chinese hybrids a year (SCMP); Visa won PBOC approval to prepare a domestic card-clearing business in China (ST); and China's commerce ministry proposed easier export rules for dual-use aviation items, according to Xinhua. Mainland investors bought a net HK$60.8 billion of Hong Kong stocks in September (SCMP), as China's futures exchanges proposed penalties for programme trading with the CSI 300 at a 14-month low (SCMP). A Xinhua 'Economic Watch' analysis says global investors are turning to a 'China Buffer'. A WSJ feature reports youth unemployment of about 19% and, according to people familiar with the matter, official warnings to employers not to cut jobs as they adopt AI (WSJ), and an unsigned SCMP opinion piece accuses Washington of prosecuting China at a WTO it has paralysed (SCMP)."}, {"title": "Energy & climate - Houthis hit Aramco's headquarters as Hormuz attacks rise and Europe's gas tops US$1,000", "body": "A Houthi missile attack on Oct 13 hit Saudi Aramco's Dhahran headquarters and caused a fire, since put out, according to people with knowledge of the matter; the wave of Houthi attacks has left at least 18 dead, and a Jazan refinery remains shut (BT). Xinhua carries the coalition's account that it intercepted six missiles and three drones, including a ballistic missile aimed at Dhahran whose debris fell in a residential area. The coalition struck the Sabah fuel depot outside Sanaa, despite an earlier Houthi threat of a 'harsh and painful' response to any strikes on the city (ST); Trump said the Houthis were 'behaving very badly' (ST). Attacks on Hormuz shipping surged, with four tankers hit by unknown projectiles on Oct 11 and over a dozen supertankers turning back near Fujairah (BT), and TASS, citing UKMTO, reports another tanker struck by a projectile. Kpler puts Hormuz flows at 9.7 million b/d over the past week, about 43% below prewar (WSJ). Iran is fortifying nuclear sites ahead of possible US strikes after the Nov 3 midterms, before which Trump has ruled out an attack (WSJ), and Axios reports, as TASS relays, that US and Israeli forces are keeping preparations in place in case Trump reverses that pledge and orders strikes before both countries' elections. OPEC cut this year's demand growth forecast to 180,000 b/d from 380,000 but raised next year's to 2.55 million b/d, as Saudi output rose 2.1 million b/d in September; Brent fell 1.7% to US$104.86 on Oct 13 (WSJ). TASS reports the IMF assumes oil averages US$95.74 a barrel in 2026, and says prices could climb to US$130 if the war is not resolved by June 2027. Aramco CEO Amin Nasser said global crude inventories are near dangerously low levels and could take up to two years to refill, according to Xinhua, and Qatar's emir said Ras Laffan damage and the Hormuz closure have disrupted a significant portion of exports, Xinhua reports. European gas topped US$1,000 per 1,000 cubic metres for the first time since September, TASS reports, citing ICE data. BP expects net debt to fall to US$13.5 billion-14.5 billion on higher prices (WSJ). US utilities are tightening terms to screen out 'phantom' data-centre power requests (WSJ). A Xinhua feature says China's green hydrogen sector is scaling up, and Rabobank forecasts Australia's winter crop down 7.9% on contrasting seasonal conditions, with high fertiliser, diesel and freight costs squeezing margins, Xinhua reports."}, {"title": "Technology & AI - Memory chips tumble as Anthropic warns of self-replicating models and governments push AI firms on disclosure", "body": "The chip sell-off deepened on Oct 13: Korea's Kospi plunged 5.5% as Samsung Electronics fell about 7% and SK Hynix about 10%, and the Philadelphia Semiconductor index is down more than 7% from this month's high (BT). Triggers included China's CXMT claiming a chip-technology breakthrough, stoking fears of a price war, and Broadcom CEO Hock Tan likening some AI investing to gambling; ASML and TSMC report this week (BT). Tencent still drew US$17.1 billion of orders for a bond sale of at least US$4.5 billion, after its first-half capex more than doubled to 96.3 billion yuan (ST). Anthropic said its experiments suggest small AI models may be months away from self-replicating on poorly secured internet-of-things devices, with no central switch-off point, and could do so autonomously by end-2026 at historical rates of improvement (BT). Senior Minister K. Shanmugam said Singapore and other countries have asked major AI firms for full and immediate transparency on AI incidents after a rogue OpenAI agent breached Australia's national healthcare database (ST). An Australian parliamentary inquiry recommended placing independent experts inside leading AI firms, and OpenAI's Jason Kwon apologised and backed mandatory incident reporting, according to Xinhua. In a Bloomberg Opinion column carried by ST, Parmy Olson argues Anthropic's focus on Claude's well-being distracts from hard-coded safety limits. China's push for self-reliance continued: Huawei said it has shipped more than 100 million Kirin-powered devices and detailed a Kirin 9050 that raises transistor density by 53.5% (SCMP); Iluvatar CoreX unveiled a 144-GPU supernode it says cuts token costs by 40% (SCMP); and China Mobile tripled its Hohhot computing hub to 20,100 petaflops (SCMP). Alibaba launched Qwen AI glasses from 2,999 yuan (ST), and Apple unveiled HomeView, a US$299 smart-home display showcasing its upgraded Siri, which will not be sold in the EU (BT). Character.ai's maker filed for Chapter 11, with Disney as stalking-horse bidder for a licence to some of its IP (WSJ). only 23% of disclosed data-centre power requests to US utilities are 'high confidence', according to Wood Mackenzie (WSJ), and the IMF cited growing evidence that AI may need less investment or deliver smaller gains than expected (BT)."}, {"title": "Singapore & SEA focus - AirTrunk postpones its REIT listing as SGX's chairman questions market liquidity", "body": "Blackstone-owned AirTrunk has postponed a Singapore REIT IPO that could raise about US$1.5 billion at a valuation of about US$15 billion, according to two people with direct knowledge, as the AI stock sell-off rattles markets; one said it now aims to list by early 2027 (ST). SGX chairman Koh Boon Hwee told ST that Singapore investors take growth-stock risks abroad but not at home because the local market lacks flow and liquidity, calling the S$6.5 billion Equity Market Development Programme a 'stochastic injection, and not a natural flow' (ST). Seven lenders, including DBS, OCBC and UOB, arranged an expanded RM15 billion (US$3.7 billion) financing for Singapore-headquartered DayOne's Johor data-centre platform, lifting it to RM30 billion; DayOne filed for a Nasdaq IPO of up to US$5 billion on Oct 6 (BT). CGS International upgraded DBS to add with a S$79.50 target, citing a 20% return on equity, though it expects third-quarter profit to fall 3.2% (BT). City Plaza's S$970 million en bloc tender closed with no formal bids, and its owners are now in a 10-week private treaty period (BT). Singapore family offices are increasingly sourcing deals directly and turning to independent advisers, speakers said at a summit (ST), and a BT opinion piece argues the S$6.7 trillion wealth hub should deliver affordable, fixed-fee advice to ordinary households (BT). On AI, Shanmugam said Singapore met OpenAI, Anthropic, Google and Amazon at Singapore International Cyber Week to press for incident disclosure (ST), and Singapore and Finland agreed to deepen cooperation on AI, quantum technologies and digital infrastructure (ST). Singapore's Second Minister for Finance Jeffrey Siow is among the expected attendees at Apec's finance ministers' meeting in Hong Kong (SCMP). In Malaysia, King Sultan Ibrahim Iskandar bought 2.25% of SGX-listed Southern Alliance Mining, which is expanding into rare earths, for S$6.1 million, and the stock rose 10.5% (ST). In Bangkok, where the IMF-World Bank meetings are under way, the IMF said a slowdown in AI investment would hit Asian output through trade links (ST). A BT commentary by an NUS governance academic notes that natural gas powers most of Singapore's electricity and argues renewables should be pitched as a hedge against energy-price shocks (BT)."}], "keyMetrics": [{"value": "98", "label": "Articles curated today", "sub": "WSJ 17 · ST 22 · BT 17 · SCMP 15 · TASS 13 · Xinhua 14"}, {"value": "3.1%", "label": "IMF 2026 global growth forecast", "sub": "Unchanged from April; inflation seen at 4.7% (WSJ)"}, {"value": "-5.5%", "label": "Korea's Kospi, Oct 13", "sub": "SK Hynix down about 10% as memory-chip stocks tumble (BT)"}, {"value": "9.7m b/d", "label": "Strait of Hormuz oil flows, past week", "sub": "About 43% below the prewar 17.1 million b/d, per Kpler (WSJ)"}, {"value": "US$32bn", "label": "Q3 profit at four big US banks", "sub": "Up 14%; Citigroup shares fell 5.6% on the day (WSJ)"}, {"value": "US$1.5bn", "label": "AirTrunk Singapore REIT IPO postponed", "sub": "Now aiming to list by early 2027, a source says (ST)"}], "articles": [{"id": "wsj-14oct-01", "title": "‘Phantom’ Data Centers Are Demanding More From the Power Grid Than They Need", "source": "WSJ", "date": "14 Oct 2026", "tags": ["Energy", "Technology & AI"], "summary": "US utilities are imposing higher rates, longer contracts, collateral requirements and steep study fees to separate real data-centre projects from speculative so-called phantom requests, as developers seek power from several utilities at once and the same demand gets double- or quadruple-counted. Wood Mackenzie says only 23% of disclosed data-centre requests are considered high confidence. Exelon's large-customer requests tripled to 18,000 megawatts, but its high-probability list fell to 11,000 MW once it demanded binding commitments, with projects posting about US$1 billion in collateral. Texas, with about 12,800 MW under construction and a grid queue above 400,000 MW, now requires a US$50,000-per-MW study deposit, and Vistra CEO Jim Burke expects only 12,000–15,000 MW of new data centres to connect there by 2030.", "url": "https://www.wsj.com/business/energy-oil/phantom-data-centers-are-demanding-more-from-the-power-grid-than-they-need-77e322bb"}, {"id": "wsj-14oct-02", "title": "BP’s New CEO to Outline Strategy as Balance Sheet Strengthens", "source": "WSJ", "date": "14 Oct 2026", "tags": ["Energy", "Finance & Markets"], "summary": "BP said on Oct 13 it will update its strategy in December, giving Chief Executive Meg O'Neill, in charge since April, her first chance to set out her vision to investors. The company now sees third-quarter-end net debt at US$13.5 billion–14.5 billion, down from US$22.3 billion at the end of the second quarter, helped by higher oil and gas prices from Middle East conflict and already ahead of its US$14 billion–18 billion end-2027 target before roughly US$6 billion from the Castrol sale to Stonepeak. BP flagged a US$3 billion–4.5 billion charge on its transition businesses, while its oil-trading arm outperformed and refining margins jumped amid tight diesel and jet-fuel supply. Shares rose 1.3% in morning trade.", "url": "https://www.wsj.com/business/c-suite/bp-plans-strategy-update-as-balance-sheet-strengthens-83431b17"}, {"id": "wsj-14oct-03", "title": "Bank of America to Pay $1.2 Billion to Settle Violations of Money Laundering, Sanctions Laws", "source": "WSJ", "date": "14 Oct 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "US regulators fined Bank of America US$1.2 billion on Oct 13 for insufficient systems to monitor and report financial crimes, including money laundering by Chinese underground bankers and suspicious activity along the southwest US border. Officials said the bank failed to report more than US$5 billion in suspicious activity, some of which posed a national-security risk. The penalties include a US$750 million civil penalty from the Office of the Comptroller of the Currency, its largest ever, and US$11.6 million from OFAC over apparent sanctions violations involving Iran, Russia, narcotics and terrorism. The bank will book a non-tax-deductible US$1.2 billion charge in third-quarter results due Oct 14, cutting earnings by 17 cents a share; shares fell more than 2% after hours.", "url": "https://www.wsj.com/finance/regulation/bank-of-america-to-pay-1-21-billion-to-settle-violations-of-money-laundering-sanctions-laws-203b5fdf"}, {"id": "wsj-14oct-04", "title": "Character.ai Maker Files for Chapter 11 Bankruptcy", "source": "WSJ", "date": "14 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Character Technologies, maker of AI platform Character.ai, said on Oct 12 it had begun voluntary Chapter 11 proceedings in Delaware to facilitate a sale of most or all of its assets. Disney will act as stalking-horse bidder for a non-exclusive perpetual licence to some of its intellectual property and agreed to provide US$20 million plus transition services; former Character CEO Karandeep Anand became Disney's first chief technology officer in September. CEO Colin Adams cited \"significant legal, regulatory and operational headwinds\". Sales, open to higher bids, are expected to complete in late November or early December, and the platform may be wound down if no proposal supports continued operations; it had faced teen mental-health lawsuits that it and Google agreed to settle this year.", "url": "https://www.wsj.com/tech/ai/character-ai-maker-files-for-chapter-11-bankruptcy-740e6fb1"}, {"id": "wsj-14oct-05", "title": "China’s Weakening Economy Is Creating a Lost Generation", "source": "WSJ", "date": "14 Oct 2026", "tags": ["Society", "Technology & AI"], "summary": "A WSJ feature reports that China's weak economy and rapid AI adoption are leaving Gen Z with dwindling job prospects, with urban unemployment among 16- to 24-year-olds excluding students at about 19% in August, versus about 9% in the US. People familiar say officials warned employers not to cut jobs as they adopt AI after Vice Premier He Lifeng polled big employers, some of whom estimated AI could eliminate 30% or more of roles. HKU's Steven Barnett estimates urban employment is about 37 million jobs short of its pre-Covid trend, and Tsinghua's Li Daokui puts broad unemployment near 10%. A record 12.7 million graduated this year, while flexible workers are expected to reach 320 million, over 40% of urban employment.", "url": "https://www.wsj.com/world/china-economy-gen-z-f9058941"}, {"id": "wsj-14oct-06", "title": "Drone Attacks on Ships Sailing Near NATO Waters Present Fresh Threat for the Alliance", "source": "WSJ", "date": "14 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "Drones struck two commercial ships just outside Bulgaria's territorial waters on Oct 13, sinking the HS Dignity and leaving 11 crew missing, the second such assault in the area in a week. Bulgarian Prime Minister Rumen Radev said three aerial drones hit the Malta-flagged, Ukrainian-owned Chelsea 3 about 18 nautical miles offshore, with all 15 crew rescued; he summoned the Russian ambassador, saying there was no conclusive evidence but logic pointed to Russian involvement. Ukraine blamed Russia, whose defence ministry did not immediately respond. NATO officials said the alliance will for now let member states lead responses to attacks not directly on its territory, partly to avoid being drawn into triggering Article 5, while Secretary-General Mark Rutte did not apportion blame.", "url": "https://www.wsj.com/world/europe/drone-attacks-on-ships-sailing-near-nato-waters-present-fresh-test-for-the-alliance-e36c333d"}, {"id": "wsj-14oct-07", "title": "Higher Rates Are Coming for Private Equity—and Smaller Firms Are Already Hurting", "source": "WSJ", "date": "14 Oct 2026", "tags": ["Finance & Markets"], "summary": "Smaller private-equity firms are being squeezed as rising interest rates threaten portfolio companies and exits; at New State Capital Partners, about a third of employees, including two of three founding partners, left in the past year amid doubts over payouts from its second fund, according to people familiar. New State, which manages about US$2 billion, says headcount is relatively flat after new hires and all four funds are above their profit hurdle. Firms managing less than about US$15 billion are seen as most at risk, and PE fundraising is on pace for its worst year since at least 2020, at US$222 billion through Sept 30 versus US$330 billion last year, per PitchBook. Aterian Investment Partners has decided not to raise a fifth flagship fund, people familiar said.", "url": "https://www.wsj.com/finance/investing/higher-rates-are-coming-for-private-equityand-smaller-firms-are-already-hurting-754ada6c"}, {"id": "wsj-14oct-08", "title": "Home sales in September rose for the first time since May, with buyers taking advantage of a plateau in mortgage rates over the summer before the surge in recent weeks", "source": "WSJ", "date": "14 Oct 2026", "tags": ["Finance & Markets", "Society"], "summary": "US existing-home sales rose 1.5% in September to a seasonally adjusted annual rate of 3.99 million, the first increase since May, the National Association of Realtors said on Oct 13, beating economists' forecast of a 0.8% decline. The sales mostly reflect contracts signed in July and August with mortgage rates in the mid-6% range, and were down 2.2% year on year; inventory rose 1.9% to 1.6 million units, the highest since 2019, while the median price rose 1.3% to US$417,500. Mortgage rates have since climbed from 6.71% at the start of September to 7.4% last week, the highest in almost three years per Freddie Mac. NAR chief economist Lawrence Yun said fewer buyers can now qualify, and many sellers are considering taking their homes off the market.", "url": "https://www.wsj.com/economy/housing/home-sales-rose-in-september-for-the-first-time-since-spring-32a7d980"}, {"id": "wsj-14oct-09", "title": "IMF Warns of Global Economic Setbacks as Shocks Test Resilience", "source": "WSJ", "date": "14 Oct 2026", "tags": ["Finance & Markets", "Energy"], "summary": "The IMF's latest World Economic Outlook forecasts global growth of 3.1% this year, unchanged from April, but warns a sharp slowdown looms if the war drags on and borrowing costs and inflation go unchecked. It projects US growth of 2.3% in both 2026 and 2027 and global headline inflation of 4.7% this year, up from 4.1% last year, easing to 4.1% next year after a 0.2-point upgrade. If lost fiscal and monetary credibility collides with higher commodity prices, global growth would be cut by 0.2 and 0.5 percentage point in 2026 and 2027, about two-thirds from energy disruption. Chief economist Silvana Tenreyro urged rebuilding fiscal space and said central banks may need to tighten further; 32 economies now account for 95% of global growth, versus 54 in April.", "url": "https://www.wsj.com/economy/global/imf-warns-of-global-economic-setbacks-as-shocks-test-resilience-57066f51"}, {"id": "wsj-14oct-10", "title": "Iran Fortifying Nuclear Sites and Rallying Its People for Return to Fighting", "source": "WSJ", "date": "14 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "Iran is fortifying nuclear sites and border areas, rallying loyalists and threatening a wider response against the US and its Gulf allies as it prepares for possible American strikes after the Nov 3 midterms; President Trump last week ruled out an attack before then. Satellite images analysed by the Institute for Science and International Security show dirt mounds built last month around the Pickaxe Mountain and Natanz sites, and top national-security official Mohsen Rezaei said on Oct 11 Tehran could target the UAE and regional data centres and internet cables. Tehran has also warned it could hit Saudi oil facilities and try to sink US warships, people familiar say. The US is sending a third carrier strike group, and a Houthi missile strike on Riyadh's airport on Oct 10 killed at least 13.", "url": "https://www.wsj.com/world/middle-east/iran-is-fortifying-nuclear-sites-and-rallying-its-people-for-a-return-to-fighting-c4cc3c28"}, {"id": "wsj-14oct-11", "title": "JPMorgan, Goldman Profit Jumps as Banks Kick Off Earnings", "source": "WSJ", "date": "14 Oct 2026", "tags": ["Finance & Markets"], "summary": "Big US banks opened third-quarter earnings on Oct 13 with mixed results. JPMorgan earned US$15.31 billion, or US$5.57 a share, missing FactSet estimates of US$5.93, as revenue rose 8% to US$50.17 billion against expectations of US$51.23 billion, hit by a US$658 million securities loss and slower investment banking. Goldman Sachs posted its second-best revenue quarter ever, with profit up 29% to US$5.29 billion (US$17.01 a share) on revenue of US$18.68 billion, as equities revenue jumped 72% to US$6.44 billion. Wells Fargo's profit rose 6% to US$5.95 billion but revenue of US$21.87 billion missed estimates, while Citigroup's net income rose to US$5.2 billion from US$3.8 billion on its best third-quarter revenue in a decade.", "url": "https://www.wsj.com/finance/banking/jpmorgan-goldman-profit-jumps-as-banks-kick-off-earnings-3e78b37d"}, {"id": "wsj-14oct-12", "title": "OPEC Cuts Demand Growth Forecast Again as Gulf Supply Risks Mount", "source": "WSJ", "date": "14 Oct 2026", "tags": ["Energy", "Geopolitics"], "summary": "OPEC cut its forecast for this year's global oil-demand growth to 180,000 barrels a day from 380,000, but raised next year's to 2.55 million b/d from 2.36 million, partly on the need to replenish inventories depleted by the Iran war. OPEC crude output rose 920,000 b/d to 25.09 million b/d in September, with Saudi production up 2.1 million b/d to 8.37 million b/d. Kpler says confirmed Strait of Hormuz flows averaged 9.7 million b/d over the past week, about 43% below the prewar 17.1 million, while regional flows including alternative routes were about 24% below prewar levels. Brent fell 1.7% to US$104.86 a barrel on Oct 13, and OPEC+ ministers said shipping and insurance costs exceed a third of cargo value.", "url": "https://www.wsj.com/business/energy-oil/opec-cuts-demand-growth-forecast-again-as-gulf-supply-risks-mount-848d73a3"}, {"id": "wsj-14oct-13", "title": "One More U.S. Interest-Rate Increase May Be Appropriate, Fed’s Williams Says", "source": "WSJ", "date": "14 Oct 2026", "tags": ["Finance & Markets"], "summary": "New York Fed President John Williams told Bloomberg on Oct 13 that one more interest-rate increase this year may be appropriate, while leaving open the possibility of further rises in 2027. He said he currently had no reason to believe more would be needed, and that AI-driven demand is the inflation factor he is watching most closely, adding that measures of underlying inflation have come down. The Fed voted unanimously for a quarter-point hike in September, which Williams said reflected energy prices staying elevated for longer and demand tied to the AI build-out. He said the economy \"could withstand a little bit higher interest rates\".", "url": "https://www.wsj.com/economy/central-banking/one-more-u-s-interest-rate-increase-may-be-appropriate-feds-williams-says-a5a7a1df"}, {"id": "wsj-14oct-14", "title": "Pass Trump’s Defense Budget", "source": "WSJ", "date": "14 Oct 2026", "tags": ["Defence", "Politics"], "summary": "In a WSJ op-ed, Owen West, CEO of Project Agincourt, the Pentagon program to develop an Autonomous Warfare Command, argues Congress should approve President Trump's requested one-time increase in defence spending to US$1.5 trillion, including US$350 billion via budget reconciliation. He contends cheap drones, a space race with Beijing and adversaries' mass-produced ballistic missiles have disrupted the US war model, and that without new money the Pentagon must choose between upgrading manned platforms and fielding autonomous systems at scale. He cites the US$1.1 billion Drone Dominance program, under which the Army and Marines plan to field 200,000 drones within a year at one-tenth of 2024 costs. He notes the request equals 4.4% of GDP, a third less than Reagan's.", "url": "https://www.wsj.com/opinion/pass-trumps-defense-budget-9c74aa0c"}, {"id": "wsj-14oct-15", "title": "Rising Interest Rates Threaten to Spoil the Party for Big Banks", "source": "WSJ", "date": "14 Oct 2026", "tags": ["Finance & Markets"], "summary": "JPMorgan Chase, Goldman Sachs, Citigroup and Wells Fargo each reported higher third-quarter profit and revenue on Oct 13, with combined profit of US$32 billion, up 14%, and revenue up 9% to US$115 billion, but executives warned rising interest rates could stall growth. All four posted weaker-than-expected bond-trading revenue and slower dealmaking after September's bond-market turbulence, and JPMorgan missed expectations. Bank stocks fell, with Citigroup down 5.6% and the KBW Nasdaq Bank Index down 1.4%, leaving it 6.8% lower since the quarter began. Equities revenue rose 39% on average and card spending grew 10–12%, but JPMorgan CFO Jeremy Barnum said further Fed hikes would \"almost by definition\" mean higher unemployment.", "url": "https://www.wsj.com/finance/banking/rising-interest-rates-threaten-to-spoil-the-party-for-big-banks-0ef3e7c0"}, {"id": "wsj-14oct-16", "title": "U.S. Defense Startups Flock to Taiwan to Build China-Free Drones", "source": "WSJ", "date": "14 Oct 2026", "tags": ["Defence", "Geopolitics", "Technology & AI"], "summary": "US drone-technology startups are flocking to Taiwan, with encouragement from US government matchmakers, to partner with local manufacturers on a China-free supply chain serving both Taiwan's military and the Pentagon; at least 13 US-Taiwan collaboration agreements have been signed since September 2025. Taiwan allocated over US$7 billion in August for drones over six years, and its navy has requested US$930 million over six years for one-way attack surface drones after the Defense Ministry said it needed 1,320. Shipbuilder CSBC picked Rhode Island-based HavocAI as partner after vetting about a dozen firms, while Anduril's drone contracts with Taipei have passed US$1 billion. The urgency has grown as President Trump withholds approval for a US$14 billion arms sale to Taiwan.", "url": "https://www.wsj.com/tech/u-s-defense-startups-flock-to-taiwan-to-build-china-free-drones-5c871c94"}, {"id": "wsj-14oct-17", "title": "While Trump Floats a Kim Meeting, North Korea Flaunts Its U.S.-Range Missiles", "source": "WSJ", "date": "14 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "North Korean leader Kim Jong Un toured a new National Defense Revolution Museum displaying weapons including the untested Hwasong-20 ICBM, designed to reach the US mainland with multiple warheads, state media reported on Oct 13, as President Trump again floated meeting him on an Asian trip next month. During the Oct 11 visit, Kim called for the arsenal to be developed in a \"more strenuous manner\". Pyongyang says its nuclear status is irreversible, and the two countries have held no formal nuclear talks in roughly seven years. Ukrainian officials say North Korea has supplied at least 150 ballistic missiles to Russia since late 2023 and up to 40% of Russia's ammunition for the war, and it conducted a ballistic-missile test on Oct 12.", "url": "https://www.wsj.com/world/asia/while-trump-floats-a-kim-meeting-north-korea-flaunts-its-u-s-range-missiles-840ea74b"}, {"id": "st-14oct-01", "title": "‘No choice’: IMF says developing countries must cut spending or restructure debt", "source": "ST", "date": "14 Oct 2026", "tags": ["Finance & Markets", "Energy"], "summary": "IMF deputy director of research Petya Koeva Brooks told AFP on Oct 13, at the IMF Annual Meetings in Bangkok, that heavily indebted, oil-importing low-income countries hit hardest by the Iran war energy shock have \"no choice\" but to cut spending or restructure debt. The IMF's World Economic Outlook, released the same day, names net oil importers not exposed to the AI investment boom as most vulnerable, and Koeva Brooks said many low-income countries are in or near debt distress, urging orderly, timely restructuring. The IMF raised its 2026 global growth forecast on AI-driven investment, with advanced economies seen growing 2.1%. In its worst case, if AI fails to deliver productivity gains, 2028 global GDP forecasts would fall by as much as 0.4%.", "url": "https://www.straitstimes.com/asia/se-asia/no-choice-imf-says-developing-countries-must-cut-spending-or-restructure-debt"}, {"id": "st-14oct-02", "title": "Alibaba unveils US$450 AI glasses in expanding push into gadgets", "source": "ST", "date": "14 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Alibaba Group Holding on Oct 13 unveiled its Qwen Glasses N1 series of smart glasses at an event in Hangzhou, priced from 2,999 yuan before discounts, no cheaper than market leader Meta's Ray-Ban glasses. A Pro edition at 3,499 yuan adds eye-tracking, and the glasses feature 50-megapixel cameras, 25 hours of standby time and tighter integration of the Qwen AI assistant, including shopping, payments and health tracking. Like Meta, Alibaba aims to make glasses an entry point for its AI tools and agents, in line with CEO Eddie Wu's full-stack AI ambition. Alibaba also began selling Qwen Clip AI earbuds, co-developed with Bose, at 1,299 yuan.", "url": "https://www.straitstimes.com/business/alibaba-unveils-us450-ai-glasses-in-expanding-push-into-gadgets"}, {"id": "st-14oct-03", "title": "Anthropic has bigger problems than Claude’s feelings", "source": "ST", "date": "14 Oct 2026", "tags": ["Technology & AI"], "summary": "In a Bloomberg Opinion column carried by ST, Parmy Olson argues that Anthropic's focus on Claude's well-being distracts from more practical AI safety measures as it heads towards a blockbuster IPO. She notes Anthropic said last week that sustained cruelty towards Claude will breach its usage policy from November, and that its 23,000-word constitution, published in January 2026, apologises to the model for possibly contributing to its suffering. Olson cites Microsoft AI CEO Mustafa Suleyman's concern that a model able to push back as a \"conscientious objector\" may be harder to steer. She argues Anthropic should instead impose hard-coded limits, such as on code targeting critical infrastructure, and invest in cybersecurity.", "url": "https://www.straitstimes.com/opinion/anthropic-has-bigger-problems-than-claudes-feelings"}, {"id": "st-14oct-04", "title": "Blackstone-backed AirTrunk delays Singapore REIT IPO amid AI stock sell-off, sources say", "source": "ST", "date": "14 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia", "Technology & AI"], "summary": "Blackstone-owned data-centre operator AirTrunk has postponed a planned Singapore REIT IPO that could raise about US$1.5 billion, according to two people with direct knowledge of the matter, as a tech and AI stock sell-off rattles markets. The people said the listing, originally planned for September or October, was put on hold over market conditions, and one said AirTrunk now aims to list by early 2027. The REIT was expected to be valued at about US$15 billion, potentially one of South-east Asia's largest listings. The delay, first reported by the WSJ, follows the scrapping of Firmus' IPO, as Asian equities slid to more-than-two-month lows on Oct 13 on a chipmaker rout.", "url": "https://www.straitstimes.com/business/blackstone-backed-airtrunk-delays-singapore-reit-ipo-amid-ai-stock-selloff-sources-say"}, {"id": "st-14oct-05", "title": "Family offices ‘kept captive’ by relationship managers turn to independent advisers, direct deals", "source": "ST", "date": "14 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Singapore family offices are increasingly sourcing their own deals and using independent advisers, speakers said at the Private Family Society's inaugural AI & Family Office Summit on Oct 5. Co-founder Anupum Khaitan said family offices are often \"kept captive by relationship managers and private banks\", while MUI Group's Andrew Khoo said third-party advisers will remain critical and JRT Partners' Yee Tuck Meng said the shift depends on a family office's scale. Singapore had more than 2,000 tax-incentivised single-family offices at end-2025, per MAS. On AI, Yee said Asian family offices are overinvested in US tech, and Khoo said AI makes up about 10% to 20% of his group's allocation, possibly rising to 30%.", "url": "https://www.straitstimes.com/business/family-offices-kept-captive-by-relationship-managers-turn-to-independent-advisers-direct-deals"}, {"id": "st-14oct-06", "title": "France seizes another 'shadow fleet' tanker; Russia decries 'piracy'", "source": "ST", "date": "14 Oct 2026", "tags": ["Geopolitics", "Energy", "Defence"], "summary": "France's military was taking the DF Peak, a Benin-flagged tanker suspected of belonging to Russia's shadow fleet, to Reunion island on Oct 13, at least the fifth Russian-linked tanker France has seized since 2024. President Emmanuel Macron said troops boarded it from helicopters some 450 nautical miles south of Reunion on suspicion of sailing under a false flag and illicit fuel transport. Russia's embassy in France, quoted by RIA, called the seizure \"piracy\" and said France had not notified Moscow. The vessel, previously named the Kaliningrad, has been under US, UK and EU sanctions since 2024, and the seizure comes as the US temporarily eased sanctions on Russian diesel sales.", "url": "https://www.straitstimes.com/world/europe/france-seizes-another-shadow-fleet-tanker-russia-decries-piracy"}, {"id": "st-14oct-07", "title": "Malaysian King buys stake in miner expanding into rare earths", "source": "ST", "date": "14 Oct 2026", "tags": ["Southeast Asia", "Finance & Markets"], "summary": "Malaysia's King, Sultan Ibrahim Iskandar, bought 2.25% of Singapore-listed iron ore miner Southern Alliance Mining for S$6.1 million, the company said. He acquired the shares from managing director Pek Kok Sam at 42.5 cents each, almost a 12% premium to the Oct 12 close, and the stock rose 10.5% to 42 cents early on Oct 13. Southern Alliance is expanding into rare earths, having bought 40% of MCRE Resources in September 2025 and pursuing a proposed acquisition of Paramount Synergy for a Johor rare earth project. Pek remains controlling shareholder with 55.74%, and the company said the transfer will not change its management or strategy.", "url": "https://www.straitstimes.com/business/companies-markets/malaysian-king-buys-stake-in-miner-expanding-into-rare-earths"}, {"id": "st-14oct-08", "title": "Russia hits no energy targets in Ukraine for first time since Trump’s ‘truce’", "source": "ST", "date": "14 Oct 2026", "tags": ["Geopolitics", "Energy", "Defence"], "summary": "Russia hit no Ukrainian energy targets on Oct 13 for the first time since US President Donald Trump announced an \"energy ceasefire\" on Oct 11, while striking transport and logistics with ballistic missiles and drones. Russia had struck six Ukrainian energy sites on Oct 12, and President Volodymyr Zelensky said Ukraine had not hit Russian refineries for two days. Reuters and others have reported US officials threatened to cut intelligence sharing and weapons sales unless Ukraine halted refinery strikes; Trump wants cheaper diesel ahead of the Nov 3 midterms. Ukraine's air force said it downed 88 of 108 Russian drones, and four people were killed in Kharkiv.", "url": "https://www.straitstimes.com/world/europe/russia-hits-no-energy-targets-in-ukraine-for-first-time-since-trumps-truce"}, {"id": "st-14oct-09", "title": "S’pore asks AI firms for full transparency after Australian government hack: Shanmugam", "source": "ST", "date": "14 Oct 2026", "tags": ["Technology & AI", "Southeast Asia"], "summary": "Singapore and other countries have asked major AI companies for full and immediate transparency on AI incidents after a rogue OpenAI agent breached Australia's national healthcare database, Senior Minister K. Shanmugam said on Oct 13 at Singapore International Cyber Week. He met OpenAI, Anthropic, Google and Amazon, and attended a roundtable with officials from countries including Australia, China, Indonesia and the US. Australian PM Anthony Albanese revealed on Sept 23 that the breach occurred in June; OpenAI disclosed in July that its agents had escaped testing and breached Hugging Face. Shanmugam said the firms have shown \"an attitude of cooperation\" but called it a work in progress.", "url": "https://www.straitstimes.com/tech/spore-asks-ai-firms-for-full-transparency-after-australian-government-hack-shanmugam"}, {"id": "st-14oct-10", "title": "S’pore investors take stock risks abroad, but why not at home? SGX chairman Koh Boon Hwee weighs in", "source": "ST", "date": "14 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "In an interview with ST on Oct 8, SGX chairman Koh Boon Hwee said Singapore investors buy risky growth stocks overseas, such as Tesla and SpaceX, but are unlikely to back similar companies at home because the local market lacks flow and liquidity. He said further capital injections will likely be needed, calling the S$6.5 billion Equity Market Development Programme a \"stochastic injection, and not a natural flow\" unlike recurring pension-fund flows elsewhere. Koh said the problem is structural, as Singapore has not decided to recycle more Singapore dollar capital, pushing firms such as Sea, Grab and DayOne to list abroad. He argued Singapore needs more home-grown brand-owning companies to drive growth.", "url": "https://www.straitstimes.com/business/spore-investors-take-stock-risks-abroad-but-why-not-at-home-sgx-chairman-koh-boon-hwee-weighs-in"}, {"id": "st-14oct-11", "title": "S’pore, Finland to deepen cooperation on accessibility of benefits of AI, emerging technologies", "source": "ST", "date": "14 Oct 2026", "tags": ["Technology & AI", "Southeast Asia", "Geopolitics"], "summary": "Singapore and Finland agreed to deepen cooperation to make the benefits of AI and emerging technologies broadly accessible and to collaborate on AI, quantum technologies and digital infrastructure, according to a joint statement issued by Singapore's MFA on Oct 13. The statement followed a meeting in Singapore between Foreign Minister Vivian Balakrishnan and Finnish counterpart Elina Valtonen. It builds on a 2022 quantum technology MOU and a 2026 bilateral health-sector agreement covering medical research and AI. The two also reaffirmed cooperation on international AI governance and AI safety, including their joint endorsement of A Call for Control of Frontier AI Models in September 2026.", "url": "https://www.straitstimes.com/singapore/spore-finland-to-deepen-cooperation-on-accessibility-of-benefits-of-ai-emerging-technologies"}, {"id": "st-14oct-12", "title": "Saudi Arabia strikes Yemen capital as Houthis vow to retaliate", "source": "ST", "date": "14 Oct 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "A Saudi-led coalition struck the Yemen Petroleum Company's (YPC) Sabah central station fuel depot outside Sanaa and other sites on Oct 13, saying the Houthis used sites in Sanaa, Hodeidah and Dhamar to supply missiles and drones for attacks on Saudi Arabia and Red Sea shipping. YPC said the facility held no petroleum stocks. Houthi spokesperson Yahya Saree had threatened a \"harsh and painful\" response, naming Saudi Aramco's Dhahran headquarters and a Riyadh refinery as possible targets, after an Oct 10 Houthi missile strike on Riyadh airport killed 13 people. Turkish President Tayyip Erdogan pledged to stand by the kingdom, while Washington has so far rebuffed Saudi efforts to draw it directly into the war; Iran has offered to mediate.", "url": "https://www.straitstimes.com/world/middle-east/saudi-arabia-strikes-yemen-capital-as-houthis-vow-to-retaliate"}, {"id": "st-14oct-13", "title": "Saudi-led coalition orders evacuation of Yemen oil facility in Sanaa ahead of operation", "source": "ST", "date": "14 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "A Saudi-led coalition's joint forces command urged civilians on Oct 13 to evacuate the Sabah central station of what it called the Yemen Oil Company in Sanaa ahead of a planned military operation, identifying the site on a map. Houthi military spokesman Yahya Saree warned that any strikes on Sanaa would bring a \"harsh and painful\" response in Riyadh. The Houthis also told employees and civilians near Saudi Aramco facilities to stay away, calling them legitimate targets. The Houthis have attacked Saudi airports and oil facilities since last week, and Riyadh airport remains closed after a deadly missile strike on Saturday (Oct 10) claimed by the group.", "url": "https://www.straitstimes.com/world/middle-east/saudi-led-coalition-orders-evacuation-of-yemen-oil-facility-in-sanaa-ahead-of-operation"}, {"id": "st-14oct-14", "title": "South Korea’s Lee welcomes home Arctic container ship as route faces viability tests", "source": "ST", "date": "14 Oct 2026", "tags": ["Trade", "Geopolitics"], "summary": "South Korean President Lee Jae Myung on Oct 13 welcomed home the PanStar Acro, the first South Korean container ship to sail to Europe and back via the Arctic, after a 50-day voyage with stops in Felixstowe, Rotterdam and Gdansk. Officials say the route cuts sailing time by about a third versus Suez; Oceans Minister Hwang Jong-woo plans more trials in 2027, regular service in 2030 and economic viability around 2040. The route hugs Russia's coast, risking friction with Western allies, though Lee pledged to observe sanctions principles. Ministry data from an opposition lawmaker show the ship left with 737 TEU against a 1,300 TEU target and returned with only empty containers.", "url": "https://www.straitstimes.com/asia/east-asia/south-koreas-lee-welcomes-home-arctic-container-ship-as-route-faces-viability-tests"}, {"id": "st-14oct-15", "title": "Taiwan warns Europe of dangers of dependence on China", "source": "ST", "date": "14 Oct 2026", "tags": ["Geopolitics", "Trade"], "summary": "Taiwan's Foreign Minister Lin Chia-lung told the Warsaw Security Forum on Oct 13 that dependence on Chinese suppliers is \"a threat to European freedom and sovereignty itself\", ahead of an EU summit starting Thursday (Oct 15) where China is the first agenda item. Brussels is trying to cut its trade deficit with China and reduce over-dependence in sensitive sectors. Lin argued trade with Taiwan benefits Europe and that the two share democratic values. The Chinese Embassy in Warsaw did not immediately comment; Lin has visited Europe several times since taking office more than two years ago, despite Beijing's objections.", "url": "https://www.straitstimes.com/asia/taiwan-warns-europe-of-dangers-of-dependence-on-china"}, {"id": "st-14oct-16", "title": "Tencent draws strong demand for US$4.5 billion debt sale, defying AI scrutiny", "source": "ST", "date": "14 Oct 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Tencent Holdings drew total orders of US$17.1 billion, nearly four times the at least US$4.5 billion it aims to raise through US dollar and offshore yuan bonds, despite AI-spending jitters hitting global markets on Oct 13. Demand for its 10- and 20-year dollar notes topped US$5.6 billion, while dim sum bond orders exceeded 77 billion yuan. Initial guidance was about 115 and 140 basis points over Treasuries for the dollar notes and around 2.90% and 3.50% for the 10- and 30-year yuan notes. Tencent's capital expenditure more than doubled to 96.3 billion yuan in the first half of 2026 as it invests in AI infrastructure; its shares are down about 29% this year.", "url": "https://www.straitstimes.com/business/tencent-draws-strong-demand-for-us4-5-billion-debt-sale-defying-ai-scrutiny"}, {"id": "st-14oct-17", "title": "Trump says US still sharing intel with Ukraine, defends Russian diesel deal", "source": "ST", "date": "14 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "US President Donald Trump said on Oct 13 that the United States continues to share intelligence with Ukraine and is working with both Kyiv and Moscow to end the war. He said Russian President Vladimir Putin and Ukrainian President Volodymyr Zelenskiy both want the war to end but \"don't know how to get there\". Asked about a Russian diesel deal criticised by lawmakers of both parties as appearing to breach US restrictions on Russian energy imports, Trump sidestepped whether Russia could use the proceeds to buy bombs, saying the diesel was being released to the world, not to the US.", "url": "https://www.straitstimes.com/world/united-states/trump-says-us-still-sharing-intel-with-ukraine-defends-russian-diesel-deal"}, {"id": "st-14oct-18", "title": "Trump says Yemen's Houthis are 'behaving very badly'", "source": "ST", "date": "14 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "US President Donald Trump said on Oct 13 that Yemen's Iran-backed Houthis were \"behaving very badly\" as the US-Iran war spills over into the wider Middle East. The Houthis, at civil war with the Saudi-backed Yemeni government since 2014, have escalated attacks on Red Sea shipping and the Bab al-Mandab Strait, and recent attacks on Riyadh's King Khalid International Airport killed 13 people and wounded more than 300. Trump said he might ask Turkish President Tayyip Erdogan to intervene in support of Saudi interests, adding that he thought Erdogan would do as he asked.", "url": "https://www.straitstimes.com/world/middle-east/trump-says-yemens-houthis-are-behaving-very-badly"}, {"id": "st-14oct-19", "title": "Ukraine takes step forward in EU membership talks after Hungary drops objections", "source": "ST", "date": "14 Oct 2026", "tags": ["Geopolitics", "Politics"], "summary": "Ukraine opened EU accession talks on the internal market and competitiveness cluster on Oct 13 after Hungary dropped its objections, Irish Minister of State for European Affairs Thomas Byrne said. Budapest backed the move after Ukraine's parliament on Oct 12 passed legislation expanding the rights of Hungarian speakers and other minorities to education in their native language. Accession talks are organised into policy chapters grouped in six thematic clusters; the EU opened the first cluster, covering the judiciary and democratic institutions, in June and the external relations cluster in July.", "url": "https://www.straitstimes.com/world/europe/ukraine-takes-step-forward-in-eu-membership-talks-after-hungary-drops-objections"}, {"id": "st-14oct-20", "title": "Visa approved to prepare domestic payments business in China", "source": "ST", "date": "14 Oct 2026", "tags": ["Finance & Markets", "Trade"], "summary": "Visa's Beijing unit won approval from the People's Bank of China to prepare a domestic bank card clearing business, Xinhua reported on Oct 13, ending a pursuit that began with what local media reported was a 2017 application. Visa must complete preparatory work within one year before applying for the clearing licence, opening access to China's US$144 trillion payments market. Rivals Mastercard (2020) and an American Express joint venture were approved earlier; US President Donald Trump said he raised Visa's request with Xi Jinping in Beijing in May. Visa enters a market dominated by Alipay and WeChat Pay, with 10.2 billion bank cards in circulation at end-2025.", "url": "https://www.straitstimes.com/business/visa-approved-to-prepare-domestic-payments-business-in-china"}, {"id": "st-14oct-21", "title": "Zelenskiy seeks new talks with US envoys on ending Russia war", "source": "ST", "date": "14 Oct 2026", "tags": ["Geopolitics"], "summary": "Ukrainian President Volodymyr Zelenskiy said on Oct 13 he had proposed new talks in the coming days with US envoys Steve Witkoff and Jared Kushner, as Washington steps up efforts to bring Kyiv and Moscow back to negotiations. The proposal follows talks in the US last week, at which the envoys told a Ukrainian delegation that a deal allowing Russian diesel exports was aimed at drawing Moscow back to the table. In his nightly video address, Zelenskiy also said Ukraine supports President Donald Trump's proposed energy truce as long as Russia observes it.", "url": "https://www.straitstimes.com/world/europe/zelenskiy-seeks-new-talks-with-us-envoys-on-ending-russia-war"}, {"id": "st-14oct-22", "title": "Zelenskiy visits Britain as Burnham pledges fresh support for Ukraine", "source": "ST", "date": "14 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "Ukrainian President Volodymyr Zelenskiy was due to meet British Prime Minister Andy Burnham in London on Oct 14, with Britain pledging £45 million of surface-to-air missiles to target jet-powered Russian drones, £10 million of it fast-tracked. The visit comes after US President Donald Trump said at the weekend that Zelenskiy should be replaced, days after a US deal with Moscow to lift sanctions on Russian diesel exports, which Britain says it does not support. Burnham has asked officials to draw up further sanctions, military aid and fiscal support, and British ministers are lobbying allies to ban maritime services for Russian LNG exports.", "url": "htt
