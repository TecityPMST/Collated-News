uments/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Global%20bond%20rout%20deepens%20as%20oil-fuelled%20inflation%20fears%20drive%20yields%20to%20multi-decade%20highs.pdf"},{"id":"bt-06","title":"Global data centre spending to reach US$31.6 trillion by 2050 on AI boom: PwC","source":"BT","date":"3 Sep 2026","tags":["Technology & AI","Finance & Markets","Environment"],"summary":"Global data centre spending is set to reach US$31.6 trillion through 2050 to meet surging AI demand, an investment boom with no historical precedent, PwC said in its inaugural Global Data Center Outlook. Spending could hit US$50 trillion if AI adoption accelerates; for comparison, US GDP is roughly US$30 trillion. The US will capture nearly half at US$15.1 trillion, followed by Asia-Pacific (US$8.2 trillion), Europe (US$5.6 trillion), the Middle East (US$1.1 trillion) and Africa (US$255 billion). Recurring chip upgrades, resetting every four to six years, will dominate outlays. Annual spending rises from about US$800 billion in 2026 to US$1.8 trillion by 2050, with China and India leading demand growth. Power availability is the key constraint; a backlash blocked or delayed 75 projects worth US$130 billion in early 2026.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Global%20data%20centre%20spending%20to%20reach%20US31.6%20trillion%20by%202050%20on%20AI%20boom%20PwC.pdf"},{"id":"bt-07","title":"Heavy EV incentive cut will slow adoption but could ease COE premiums: observers","source":"BT","date":"3 Sep 2026","tags":["Southeast Asia","Environment","Society"],"summary":"Singapore's Land Transport Authority announced on Wednesday (Sep 2) that incentives for electric heavy vehicles with a maximum laden weight of 3,501 to 7,000 kg will be cut sharply to S$15,000 from S$40,000, effective Thursday, as more lower-emission models become available. Vehicles above 7,000 kg keep the S$40,000 incentive. Observers said the move, targeting the largest EHV segment, will slow adoption but could ease record Category C COE premiums, which hit S$95,000 in July. EHVs made up 30 per cent of heavy-vehicle registrations in July, up from under 1 per cent in 2025. Industry players said the previous scheme was gamed by dealers adding weight to light vehicles to qualify for larger rebates. Some called the change too sudden, preferring a tiered system.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Heavy%20EV%20incentive%20cut%20will%20slow%20adoption%20but%20could%20ease%20COE%20premiums%20observers.pdf"},{"id":"bt-08","title":"Hunting for yield? DBS analysts bet on S-Reits over bank dividends","source":"BT","date":"3 Sep 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"Investors chasing dividend income should look beyond Singapore banks towards real estate investment trusts, DBS Research Group said, as the yield gap between the two hits a multi-year high. S-Reits yield about 6.2 per cent on average versus around 4 per cent for DBS, OCBC and UOB, a 2.2 percentage-point spread exceeding 2022-2024 levels. Falling short-term rates give Reits an earnings buffer as they refinance cheaply, with DPUs seen growing about 3 per cent in FY2026. Small and mid-cap Reits are expected to lead DPU growth. DBS prefers office Reits given record-low CBD Grade A vacancy of 3.3 per cent, followed by industrials, retail and hotels. Top picks include CICT, Parkway Life, Centurion Accommodation, NTT DC and Lendlease Global Commercial. Rising US Treasury yields remain a risk.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Hunting%20for%20yield%20DBS%20analysts%20bet%20on%20S-Reits%20over%20bank%20dividends.pdf"},{"id":"bt-09","title":"Iraq's oil exports rose to around 2.34 million bpd in August","source":"BT","date":"3 Sep 2026","tags":["Energy","Geopolitics"],"summary":"Iraq's oil exports rose to around 2.34 million barrels per day in August, up from about 1.35 million bpd in July, two Iraqi energy officials said. The recovery came after Opec's second-largest producer had been severely curtailed by the near-closure of the Strait of Hormuz since the Iran war began on February 28. One official said an increase in the number of tankers reaching Iraq's export terminals and loading crude helped boost shipments. Iraq has been granted permission by Teheran for a number of its tankers to pass through the strait, Iran's IRNA reported. September shipments are set to climb further, industry sources told Reuters, as buyers have been encouraged by the Iranian approval and by Baghdad offering attractive discounts.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Iraq's%20oil%20exports%20rose%20to%20around%202.34%20million%20bpd%20in%20August.pdf"},{"id":"bt-10","title":"Keppel DC Reit's private placement upsized to S$625 million after 'strong demand'","source":"BT","date":"3 Sep 2026","tags":["Finance & Markets","Technology & AI","Southeast Asia"],"summary":"Keppel DC Reit's private placement to partially fund the majority acquisitions of two Japan data centres was upsized to S$625 million from S$600 million on strong investor demand, its manager said on Wednesday (Sep 2). DBS, OCBC, Jefferies Singapore and UOB were joint bookrunners; the placement was about 3.4 times covered, mostly allocated to long-only investors and real estate specialists. The issue price was fixed at S$2.10 per new unit, a 4.4 per cent discount, with 297.6 million new units to be issued. About S$615.8 million will help fund 90 per cent stakes in Tokyo Data Centre 4 and 5 in Inzai City for about 171 billion yen (US$1.1 billion). New units trade from Sep 10. The counter closed 0.5 per cent lower at S$2.19.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Keppel%20DC%20Reit's%20private%20placement%20upsized%20to%20S625%20million%20after%20'strong%20demand'.pdf"},{"id":"bt-11","title":"Microsoft reveals Azure cloud sales in financial reporting shift","source":"BT","date":"3 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Microsoft on Wednesday (Sep 2) reported Azure cloud sales on a quarterly basis for the first time, enabling direct comparison with rivals Amazon and Google amid an AI data centre boom. Azure had US$29.4 billion in sales in its most recent quarter and US$101.9 billion for the fiscal year ended Jun 30. That places Microsoft behind Amazon, whose cloud sales were US$42.2 billion in its latest quarter, but ahead of Google's US$24.8 billion. Microsoft will move from three reporting segments to two: 'Agents and Infra', covering cloud and AI software, and 'Devices and Consumer', covering Windows, Xbox and advertising. CEO Satya Nadella said AI is reshaping the business. Microsoft slightly trimmed its Azure revenue forecast, reflecting a reclassification of GitHub sales. Shares rose about 1.4 per cent after-hours.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Microsoft%20reveals%20Azure%20cloud%20sales%20in%20financial%20reporting%20shift.pdf"},{"id":"bt-12","title":"Nokia set to rejoin Euro Stoxx 50, Volkswagen dropped","source":"BT","date":"3 Sep 2026","tags":["Finance & Markets","Technology & AI"],"summary":"Finnish telecom equipment maker Nokia Oyj is set to rejoin the blue-chip Euro Stoxx 50 index a year after being dropped, while Volkswagen will be removed, index provider Stoxx said in its annual review on Tuesday (Sep 1). Nokia shares hit a near-18-year high in June, more than double their year-earlier price, helped by its shift towards selling fibre-optic equipment to companies building AI data centres. Volkswagen shares have dropped nearly 27 per cent this year as Europe's largest automaker struggles against Chinese competition and pursues restructuring. French utility Engie will also join, while Wolters Kluwer is removed; changes take effect Sep 21. In the broader Stoxx 600, Greek banks join after a reclassification to developed-market status, while JD Sports, Thule Group and Fraport exit.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Nokia%20set%20to%20rejoin%20Euro%20Stoxx%2050,%20Volkswagen%20dropped.pdf"},{"id":"bt-13","title":"Oil settles 1% higher, as US-Iran strikes threaten supplies","source":"BT","date":"3 Sep 2026","tags":["Energy","Geopolitics"],"summary":"Brent crude settled 1 per cent higher in a volatile session on Wednesday (Sep 2), driven by renewed military strikes between the US and Iran that have restricted world oil supply. The war is now in its seventh month, with the latest attacks the biggest exchange since July as US forces struck Iran's southern coast and Iran fired on American bases. Brent settled up 98 cents at US$95.63; WTI rose 79 cents to US$91.01, with session highs the loftiest since Jul 24. Iran has largely shut Hormuz shipping since late February; only four commodity vessels transited on Wednesday versus a 10-day average near 13, and two tankers hit sea mines. Opec+ is likely to keep October output policy unchanged. US crude inventories fell 4.5 million barrels last week.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Oil%20settles%201%20higher,%20as%20US-Iran%20strikes%20threaten%20supplies.pdf"},{"id":"bt-14","title":"Putin says Russia seeks to end, not freeze, Ukraine conflict and is ready for talks","source":"BT","date":"3 Sep 2026","tags":["Geopolitics","Defence","Politics"],"summary":"Russian President Vladimir Putin said on Tuesday (Sep 2) that Russia wants to end, rather than freeze, the conflict in Ukraine and is ready to hold talks. Speaking after the Shanghai Cooperation Organisation summit in Bishkek, he said Moscow remained open to negotiations to achieve lasting peace across Ukraine and Europe with anyone willing. Yet he portrayed Ukraine's leadership as 'terrorists' with whom talks were not possible, while claiming Russia was winning and advancing on the battlefield. Putin acknowledged Ukrainian attacks had inflicted real damage, with drones posing a particular challenge, but dismissed mobilisation rumours as nonsense. He said Russian troops captured 270 sq km of Donetsk in August and are advancing on Sloviansk and Kramatorsk, preparing massive strikes on Ukrainian energy infrastructure.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Putin%20says%20Russia%20seeks%20to%20end,%20not%20freeze,%20Ukraine%20conflict%20and%20is%20ready%20for%20talks.pdf"},{"id":"bt-15","title":"Rise in US factory orders beats expectations in July","source":"BT","date":"3 Sep 2026","tags":["Finance & Markets","Trade"],"summary":"New orders for US factory goods increased more than expected in July amid a rebound in aircraft demand. Factory orders rose 0.9 per cent after a revised 0.2 per cent drop in June, the Commerce Department's Census Bureau said on Wednesday (Sep 2), beating economists' forecast of a 0.6 per cent gain. Orders advanced 6.5 per cent year-over-year. Manufacturing, 9.4 per cent of the economy, is getting a tailwind from the AI buildout, though the US-Israeli war with Iran is straining supply chains and keeping input prices high. The rebound was led by a 12.7 per cent surge in civilian aircraft orders. Non-defence capital goods orders excluding aircraft, a proxy for business spending, were unchanged rather than up 0.2 per cent. The core slowdown is seen as temporary.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Rise%20in%20US%20factory%20orders%20beats%20expectations%20in%20July.pdf"},{"id":"bt-16","title":"Singapore, Thailand to develop multi-year agenda for successive Asean chairmanships","source":"BT","date":"3 Sep 2026","tags":["Southeast Asia","Trade","Politics"],"summary":"Singapore and Thailand agreed on Wednesday (Sep 2) to cooperate closely on a multi-year Asean agenda focused on continuity and momentum, as Singapore prepares to chair the bloc in 2027 before Thailand takes over. PM Lawrence Wong and PM Anutin Charnvirakul held their first Leaders' Retreat in Bangkok, the fifth edition after an 11-year hiatus. They agreed to identify collaboration in fintech and the digital economy, building on the 2021 PayNow-PromptPay linkage, and in physical connectivity, semiconductors and AI. On food security, Thailand pledged to supply 100,000 tonnes of rice over five years, building on a rice trade pact. Both leaders reaffirmed Asean's role supporting Myanmar and discussed Thailand-Cambodia relations, energy resilience via the Asean Power Grid, and carbon-credit cooperation.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Singapore,%20Thailand%20to%20develop%20multi-year%20agenda%20for%20successive%20Asean%20chairmanships.pdf"},{"id":"bt-17","title":"Taiwan says its companies plan to invest another US$20 billion in US","source":"BT","date":"3 Sep 2026","tags":["Technology & AI","Trade","Geopolitics"],"summary":"Taiwanese companies are planning another US$20 billion of investments in the US, driven by demand for AI applications, the island's economy minister said on Wednesday (Sep 2), without naming firms. The US, Taiwan's key backer despite lacking formal ties, has pushed Taiwanese tech companies to expand US investment to boost domestic chip manufacturing. Economy Minister Kung Ming-hsin said companies were investing 'very actively' and that a new assessment since May's SelectUSA summit, excluding TSMC, yielded the extra US$20 billion, spurred by lively AI and chip orders. TSMC in July announced a further US$100 billion Arizona investment, bringing its total to US$265 billion. A US Commerce Department official welcomed the move. Trump has at times accused Taiwan of 'stealing' American semiconductor business, a charge Taipei calls unfair.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Taiwan%20says%20its%20companies%20plan%20to%20invest%20another%20US20%20billion%20in%20US.pdf"},{"id":"bt-18","title":"UK fines Citibank London US$6 million over Russia sanctions breaches","source":"BT","date":"3 Sep 2026","tags":["Finance & Markets","Geopolitics"],"summary":"Britain on Wednesday (Sep 2) fined Citibank 4.7 million pounds (US$6.35 million) under its Russia sanctions regime, saying the US bank's CBNA London unit had made funds available for the benefit of sanctioned parties. The Office of Financial Sanctions Implementation said the majority of breaches occurred between February and November 2022, and that CBNA London had voluntarily disclosed most of them. Since Russia's February 2022 invasion of Ukraine, Britain, the US and the EU have imposed thousands of sanctions on individuals, entities and ships. OFSI said many breaches arose amid strain on the bank's alert-handling and investigation processes after sanctions were first imposed. It found no intent to breach, but said the errors were, in aggregate, material and significant across many business areas. Citi did not immediately comment.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/UK%20fines%20Citibank%20London%20US6%20million%20over%20Russia%20sanctions%20breaches.pdf"},{"id":"bt-19","title":"US House passes funding Bill to avert government shutdown before midterm elections","source":"BT","date":"3 Sep 2026","tags":["Politics","Finance & Markets"],"summary":"The US House of Representatives on Tuesday (Sep 1) overwhelmingly approved legislation, by 370-48, to keep federal agencies operating beyond October 1, extending current spending through December 11 and sending it to President Donald Trump. The Senate passed the measure on August 8. The stopgap was needed because Congress has failed to finish any of the 12 full-year spending Bills. Since Trump's second term began, contentious fights have produced three partial shutdowns totalling an unprecedented 161 days. Neither party wanted a fourth shutdown before the November 3 midterms, amid voter anger over food and housing costs, the Iran war and tariffs. The Bill leaves major fiscal problems unaddressed as national debt crossed US$40 trillion, and sets up an arduous December spending fight.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/US%20House%20passes%20funding%20Bill%20to%20avert%20government%20shutdown%20before%20midterm%20elections.pdf"},{"id":"bt-20","title":"US dollar rises to 2-week high; Middle East conflict and rate paths in focus","source":"BT","date":"3 Sep 2026","tags":["Finance & Markets","Energy"],"summary":"The US dollar hit a two-week high on Wednesday (Sep 2) as investors sought safety amid the energy shock and weighed diverging monetary policy paths. Iran and its Arab neighbours were plunged back into war by the biggest US-Iran exchange of fire since July, and the greenback tends to benefit from higher oil prices given America's lower energy exposure. Economists expect the ECB near the end of its tightening cycle while the Fed may only be starting to raise rates, favouring the dollar. The dollar index rose 0.20 per cent to 99.865; the euro fell to US$1.1575. The 10-year Treasury yield reached 4.8182 per cent, its firmest since November 2023, and Japan's hit 3.01 per cent. Markets price a 68 per cent chance of a September Fed hike. The New Zealand dollar slumped 1.01 per cent.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/US%20dollar%20rises%20to%202-week%20high%20Middle%20East%20conflict%20and%20rate%20paths%20in%20focus.pdf"},{"id":"bt-21","title":"US private payrolls growth slows in August, ADP says","source":"BT","date":"3 Sep 2026","tags":["Finance & Markets","Society"],"summary":"US private payrolls increased moderately in August, the ADP National Employment Report showed on Wednesday (Sep 2). Private employment rose by 38,000 jobs last month after an upwardly revised 46,000 in July. Economists polled by Reuters had forecast a 48,000 gain, after a previously reported 44,000 July rise. The ADP report, jointly developed with the Stanford Digital Economy Lab, was published ahead of the Bureau of Labor Statistics' more comprehensive employment report for August due Friday; ADP has been a poor gauge of the BLS estimate. The BLS reported 1.05 open jobs per unemployed person in July, consistent with stable labour conditions. Private payrolls were expected to rise 45,000 in August and nonfarm payrolls to rebound 56,000 after a surprise July decline, with unemployment steady at 4.1 per cent.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/US%20private%20payrolls%20growth%20slows%20in%20August,%20ADP%20says.pdf"},{"id":"bt-22","title":"Yen surges with traders on high alert for further intervention","source":"BT","date":"3 Sep 2026","tags":["Finance & Markets","Politics"],"summary":"The Japanese yen strengthened sharply against the US dollar on Wednesday (Sep 2), leaving traders hyper-vigilant for signs of fresh intervention. The currency rallied as much as 1.2 per cent to 158.22 per dollar, having gained after hawkish BOJ board member Hajime Takata left the door open to an outsized rate move and back-to-back hikes. The Bloomberg Dollar Spot Index fell 0.3 per cent, its biggest intraday drop since Aug 21. The move fell short of a month earlier, when Tokyo and Washington's first coordinated yen-buying since 1998 sparked a 5 per cent rally from a four-decade low near 164. Japan spent a record US$96.4 billion over the past month supporting the yen. PM Takaichi's government reportedly backs a near-term BOJ hike; Treasury's Scott Bessent expects Governor Ueda to 'do the right thing'.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Yen%20surges%20with%20traders%20on%20high%20alert%20for%20further%20intervention.pdf"},{"id":"scmp-01","title":"Can Singapore be the 'natural choice' to bridge Asean and Central Asia?","source":"SCMP","date":"3 Sep 2026","tags":["Southeast Asia","Trade","Geopolitics"],"summary":"Singapore is positioning itself as a bridge between Central Asia and Asean amid trade disruption and superpower rivalry, Senior Minister Lee Hsien Loong told Uzbekistan's parliament during an August 24-31 visit to Kazakhstan and Uzbekistan. Set to chair Asean next year, Singapore will explore cooperation in transport, connectivity and energy, and has agreed to begin free-trade talks with Tashkent. Analysts including Nazarbayev University's Sabina Insebayeva call Singapore a \"natural choice\" given institutional credibility and technical expertise, though geography, landlocked routes, regulatory gaps and weak connectivity remain constraints. ISEAS's Joanne Lin says Singapore should be a facilitator, not sole gateway, with success dependent on commercially viable opportunities and participation from Indonesia, Vietnam and Malaysia.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/Can%20Singapore%20be%20the%20'natural%20choice'%20to%20bridge%20Asean%20and%20Central%20Asia.pdf"},{"id":"scmp-02","title":"China cracks down on AI 'slop', clearing out clutter from WeChat, RedNote, Douyin","source":"SCMP","date":"3 Sep 2026","tags":["Technology & AI","Society","Politics"],"summary":"China's Cyberspace Administration (CAC) said on Wednesday it scrubbed more than 5.61 million pieces of harmful or illegal content and removed some 49,000 accounts in its latest drive against AI-generated \"slop\" - low-grade, mass-produced synthetic content. The clampdown swept 2,400 websites and apps including Douyin, Kuaishou, RedNote and Tencent's WeChat, targeting AI-driven fake news, explicit material, impersonation and minor-safety violations. Creators had turned classics like Romance of the Three Kingdoms into sensationalised \"digital swill,\" while AI \"digital humans\" ran deceptive marketing at elderly users. Developers behind ByteDance's Doubao and Alibaba's Qwen tightened training-data reviews and synthetic-content labelling. Alibaba owns the Post. The CAC pledged continued monitoring while supporting the technology's development.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/China%20cracks%20down%20on%20AI%20'slop',%20clearing%20out%20clutter%20from%20WeChat,%20RedNote,%20Douyin.pdf"},{"id":"scmp-03","title":"China urges global AI cooperation, not rivalry, ahead of Xi-Trump summit","source":"SCMP","date":"3 Sep 2026","tags":["Technology & AI","Geopolitics","Politics"],"summary":"China's science and technology minister Yin Hejun called for global cooperation to manage AI's opportunities and risks at the G20 Innovation Ministerial Meeting held in the US on Monday and Tuesday, saying countries urgently need to work together. The appeal came amid renewed US-China trade and tech tensions ahead of Xi Jinping's planned September 24 visit to Washington. The US has restricted foreign-made advanced drones, robots and connected power inverters, and is weighing curbs on Chinese data-centre equipment and open-weight models; Beijing tightened dual-use drone export controls. Citi analysts said the flare-up was unlikely to materially disrupt China's AI exports. US host Michael Kratsios urged a hands-off \"Carolina Principles\" approach, highlighting divergent US-China governance stances.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/China%20urges%20global%20AI%20cooperation,%20not%20rivalry,%20ahead%20of%20Xi-Trump%20summit.pdf"},{"id":"scmp-04","title":"China widens access to overseas stocks, handing out nearly US$7b in QDII quotas","source":"SCMP","date":"3 Sep 2026","tags":["Finance & Markets"],"summary":"China's foreign-exchange regulator granted US$6.84 billion of qualified domestic institutional investor (QDII) quotas to mutual funds, insurers and banks' wealth-management units by end-August, easing tight supply of cross-border investment products. Eighteen managers, including China Asset Management and GF Fund Management, received US$100 million each, while over 20 banks' wealth arms won quotas for the first time. The move follows a crackdown on non-compliant offshore stock accounts and rising demand for diversification amid falling home prices and fixed-income returns. China has approved US$183 billion in QDII quotas for 196 institutions since 2006. A South Korea semiconductor ETF is this year's best QDII performer, up 76 per cent; Hong Kong tech funds are worst, down nearly 30 per cent.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/China%20widens%20access%20to%20overseas%20stocks,%20handing%20out%20nearly%20US7b%20in%20QDII%20quotas.pdf"},{"id":"scmp-05","title":"China's AMEC unveils 6 chip-making machines in a day, boosting self-reliance ambitions","source":"SCMP","date":"3 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Chinese chip-equipment maker Advanced Micro-Fabrication Equipment (AMEC) unveiled six new machines in a single day at a Wuxi conference on Tuesday, spanning etching, deposition and silicon-carbide power-chip tools, as it transforms from etching specialist to all-around supplier. Four of the six are deposition tools, markets dominated by Lam Research, Applied Materials and Tokyo Electron. AMEC cut its development cycle to under two years and spent 2.04 billion yuan (US$303.5 million) on R&D in the first half, up 36.9 per cent. It has developed 54 equipment types and aims to cover over 60 per cent of high-end IC equipment within five years. Bernstein estimates Chinese suppliers held 31 per cent of China's dry-etch market in 2025; Goldman sees 38 per cent of wafer-fab equipment revenue by 2028.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/China's%20AMEC%20unveils%206%20chip-making%20machines%20in%20a%20day,%20boosting%20self-reliance%20ambitions.pdf"},{"id":"scmp-06","title":"China's No 2 foundry Hua Hong invests US$2b in new fab to meet surging AI-driven demand","source":"SCMP","date":"3 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"China's second-largest contract chipmaker Hua Hong Grace Semiconductor is investing US$2 billion in a new 12-inch speciality line in Wuxi, its third facility there, to meet surging AI-infrastructure demand and bypass US tech curbs, per a Hong Kong exchange filing Tuesday. The plant, dubbed Fab 9B, will add 55,000 wafers monthly, a roughly 30 per cent capacity increase in Wuxi. Carried out via a joint venture with state-backed entities including the \"Big Fund\" vehicle Hua Xin Fund, total project funding reaches US$4.2 billion, with Hua Hong holding a 51 per cent controlling stake. Existing Shanghai and Jiangsu plants ran at 103 per cent utilisation in Q2. Second-quarter net profit jumped 385.9 per cent to US$38.6 million on record revenue of US$717.5 million.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/China's%20No%202%20foundry%20Hua%20Hong%20invests%20US2b%20in%20new%20fab%20to%20meet%20surging%20AI-driven%20demand.pdf"},{"id":"scmp-07","title":"China's US$10.8b trade short cut: new Pinglu Canal prepares to supercharge Asean shipments","source":"SCMP","date":"3 Sep 2026","tags":["Trade","Southeast Asia"],"summary":"China delivered the Pinglu 001, the first command and management vessel for the Pinglu Canal, on Monday, marking a final step before the 72.7 billion yuan (US$10.8 billion) megaproject opens later this month, likely aligned with the September 17-21 China-Asean Expo in Nanning. The 134km canal, China's first river-to-sea waterway, links Nanning to the Gulf of Tonkin near Vietnam, cutting the inland Guangxi-to-ocean route by 560km and accommodating 5,000-tonne vessels. It gives landlocked Yunnan, Guizhou and Sichuan faster access to Asean shipping lanes for textiles, timber, electronics and steel. China-Asean trade rose 24.7 per cent to US$744.4 billion in seven months; Vietnam trade surged 33.7 per cent to US$215.1 billion. The first route serves Hainan.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/China's%20US10.8b%20trade%20short%20cut%20new%20Pinglu%20Canal%20prepares%20to%20supercharge%20Asean%20shipments.pdf"},{"id":"scmp-08","title":"China's pension fund doubles offshore investments to new high in quest for higher returns","source":"SCMP","date":"3 Sep 2026","tags":["Finance & Markets"],"summary":"China's National Social Security Fund (NSSF) more than doubled offshore investments over three years to a record 580.02 billion yuan (US$86 billion) by end-2025, a record 15.23 per cent of total assets, up from 9.8 per cent in 2022, as it seeks higher returns amid lower domestic growth and rates. Hong Kong is a key beneficiary, with PBOC governor Pan Gongsheng pledging in July to increase reserve allocations there. Analysts cite the Stock Connect scheme, deep US-dollar bond pools, and access to tech firms absent from A shares. Hong Kong IPOs raised HK$209.9 billion in the first half, up 92 per cent. The NSSF generated 390.7 billion yuan in investment income last year, a 13.2 per cent return, with total assets reaching 3.8 trillion yuan.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/China's%20pension%20fund%20doubles%20offshore%20investments%20to%20new%20high%20in%20quest%20for%20higher%20returns.pdf"},{"id":"scmp-09","title":"China's tech push fuels fastest profit growth in 4 years amid signs of economic divide","source":"SCMP","date":"3 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"AI demand and domestic chip substitution drove profit growth for Chinese listed companies to its fastest pace in four years in the first half of 2026, underscoring a \"K-shaped\" economy. Profit on Shanghai's chip-heavy Star Market surged more than fourfold year on year, while Shenzhen's ChiNext rose 33 per cent, outpacing the 19.5 per cent gain for all 5,557 mainland-listed firms. Memory maker CXMT, the Star Market's most valuable at 3.8 trillion yuan, posted a 77.6 billion yuan profit, swinging from a loss; Cambricon more than doubled net income and Zhongji Innolight jumped 241 per cent. About one-fifth of firms unveiled buy-backs worth over 200 billion yuan. Investors expect Beijing to bolster tech rather than broad stimulus.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/China's%20tech%20push%20fuels%20fastest%20profit%20growth%20in%204%20years%20amid%20signs%20of%20economic%20divide.pdf"},{"id":"scmp-10","title":"China-Egypt joint drills a show of Beijing's military reach","source":"SCMP","date":"3 Sep 2026","tags":["Defence","Geopolitics"],"summary":"China is matching its overseas economic presence with military reach, as shown by recent air drills in Egypt where Chinese J-16 fighters, refuelled mid-air by YU-20 tankers, joined Egypt's \"Eagles of Civilisation\" exercise alongside Rafales and MiG-29s - the first time China sent the jets to Africa. The drills coincide with Xi Jinping's visit marking 70 years of ties. Chinese firms are embedded around the Suez Canal; Beijing's first-half 2026 investment is estimated up to US$2 billion, though Egypt's trade deficit with China exceeded US$18 billion. Huawei has bid to build AI data centres using Ascend chips against a US Nvidia-AMD-Microsoft proposal. Cairo balances China with US military aid, French and Russian aircraft, and Brics membership, extracting leverage from great-power competition.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/China-Egypt%20joint%20drills%20a%20show%20of%20Beijing's%20military%20reach.pdf"},{"id":"scmp-11","title":"Denmark sends conscripts to Greenland, signalling aim to boost Arctic defences","source":"SCMP","date":"3 Sep 2026","tags":["Defence","Geopolitics"],"summary":"For the first time in recent history, Danish conscripts have been deployed to Greenland as Denmark bolsters its Arctic presence following US demands to acquire the semi-autonomous territory. President Donald Trump has repeatedly sought the island, citing national security and accusing Copenhagen of neglecting Arctic defence; Denmark and Greenland firmly reject the idea. The conscripts, the first cohort under Denmark's extended conscription programme, are taking part in Arctic Endurance, a cold-weather combat and survival exercise, itself part of Arctic Sentry, a Nato mission launched this year to strengthen the alliance's Arctic presence. Copenhagen has pledged billions after acknowledging years of underinvestment. Russia, which holds the Arctic's largest military footprint, criticised Nato's growing activity as a security threat; China has increased regional activity, mostly with Moscow.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/Denmark%20sends%20conscripts%20to%20Greenland,%20signalling%20aim%20to%20boost%20Arctic%20defences.pdf"},{"id":"scmp-12","title":"Dutch shift 86 tonnes of gold from US and Canada to UK over 'geopolitical unrest'","source":"SCMP","date":"3 Sep 2026","tags":["Finance & Markets","Geopolitics"],"summary":"The Dutch central bank (DNB) said Wednesday it moved 86 tonnes of gold reserves out of the US and Canada to London, citing \"increasing geopolitical unrest\" and noting London holdings can be traded and deployed more easily in a crisis. The Netherlands' total gold stock was 612.4 tonnes, valued at 72.2 billion euros (US$83.7 billion) at end-2025. New York and Ottawa each fell to 18.5 per cent of reserves, while London's share rose from 18.1 to 32.1 per cent. The operation ran from March to August, combining buying, selling and physical transport via Zeist. Analyst John Plassard called it a \"fairly one-off move\" but warned that if other central banks followed, it could damage confidence in the US. Germany's Bundesbank has kept its reserves in New York.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/Dutch%20shift%2086%20tonnes%20of%20gold%20from%20US%20and%20Canada%20to%20UK%20over%20'geopolitical%20unrest'.pdf"},{"id":"scmp-13","title":"EU trade enforcers descend on Beijing demanding China fix 'untenable' imbalances","source":"SCMP","date":"3 Sep 2026","tags":["Trade","Geopolitics"],"summary":"A European Commission delegation led by top trade enforcement officer Denis Redonnet held talks in Beijing seeking a diplomatic off-ramp from a looming trade war before an October deadline. The EU wants China to commit to reducing surging exports; in July alone China widened its surplus over all but three EU members. Trade official Ditte Juul Jorgensen, who will follow to Beijing this month, called the deficit an \"untenable situation,\" citing suspected undeclared subsidies, an undervalued currency and industrial overcapacity. Brussels is developing a \"diversification instrument\" to compel supplier diversification. Von der Leyen's September 16 State of the Union will set tone for an October Sefcovic-Wang Wentao meeting. Germany's Merz and the Dutch government have shifted toward tougher measures on Chinese goods.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/EU%20trade%20enforcers%20descend%20on%20Beijing%20demanding%20China%20fix%20'untenable'%20imbalances.pdf"},{"id":"scmp-14","title":"Frontier AI at a cost: what Anthropic's Fable 5.1 means for the US-China model race","source":"SCMP","date":"3 Sep 2026","tags":["Technology & AI","Geopolitics"],"summary":"Anthropic's new Claude Fable 5.1, with a restricted-access version Mythos 5.1, widened the US lead over Chinese rivals, scoring 66 on Artificial Analysis' Intelligence Index - top globally, six points clear of Moonshot's Kimi K3 and Z.ai's GLM-5.3 - and first on Vals AI's index. But a stark price gap persists: despite cache-read cuts, Fable 5.1 costs US$3.69 per task versus US$0.84 for Kimi K3 and US$0.68 for GLM-5.3, splitting the market between cheap open models and premium frontier work. Alibaba, the Post's owner, released Qwen3.8-Max-0902, topping Arena AI's front-end benchmark. Z.ai's coming GLM-6.0 targets recursive self-improvement. OpenAI teased its Astra model with \"critical\" cybersecurity capability, alarming safety researchers over its opaque \"recurrent depth\" architecture.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/Frontier%20AI%20at%20a%20cost%20what%20Anthropic's%20Fable%205.1%20means%20for%20the%20US-China%20model%20race.pdf"},{"id":"scmp-15","title":"How Japan aims to convert ageing warships into leverage to counter China","source":"SCMP","date":"3 Sep 2026","tags":["Defence","Geopolitics","Southeast Asia"],"summary":"Japan's plans to transfer ageing warships to the Philippines and Indonesia could turn older hardware into geopolitical leverage, deepening security ties and counterbalancing China without demanding alignment, observers say. Manila expects five Abukuma-class destroyer escorts within two to three years; Tokyo and Jakarta are discussing Asagiri-class destroyers. A National Institute for Defence Studies analysis suggests Japan could retire equipment early to expand the transfer pool. Central to the push is the Official Security Assistance framework, a grant-based aid programme whose budget rose from 2 billion yen in 2023 to a record 18.1 billion yen. Analysts describe the approach toward Indonesia as \"influence without demanding alignment,\" with Japan moving from building production networks to establishing defence networks across the Indo-Pacific.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/How%20Japan%20aims%20to%20convert%20ageing%20warships%20into%20leverage%20to%20counter%20China.pdf"},{"id":"scmp-16","title":"How the SCO chips away at US power without an alliance system","source":"SCMP","date":"3 Sep 2026","tags":["Geopolitics","Politics"],"summary":"The Shanghai Cooperation Organisation (SCO), born 25 years ago to manage borders among China, Russia and four Central Asian states, looked more consequential at its Bishkek anniversary summit amid the unresolved Ukraine war and the Iran-US conflict. Its 10 full members represent more than 3.4 billion people and roughly a quarter of global GDP. Xi Jinping presented it as a model of cooperation without formal alliances, though members' interests diverge - India and China compete, India and Pakistan clash. Lacking Nato's command or the EU's institutions, the SCO's significance is practical: giving states that resist Washington's dominance a forum to coordinate and hedge. Members discuss national-currency use and an SCO development bank. The article argues US tariff and technology pressure encourages exactly such hedging.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/How%20the%20SCO%20chips%20away%20at%20US%20power%20without%20an%20alliance%20system.pdf"},{"id":"scmp-17","title":"In Bishkek, US envoys shadow the SCO summit in challenge on Beijing and Moscow's turf","source":"SCMP","date":"3 Sep 2026","tags":["Geopolitics","Politics"],"summary":"As China and Russia rallied dozens of countries at the SCO summit in Bishkek, US Senator Steve Daines and special envoy Sergio Gor met Kyrgyzstan's Sadyr Japarov, Tajikistan's Emomali Rahmon and Uzbekistan's Shavkat Mirziyoyev separately on Monday, seeking to blunt Beijing's influence. Xi Jinping and Vladimir Putin held their own talks with the Central Asian leaders. Washington emphasises the \"C5+1\" framework and covets the region's tungsten, uranium, antimony, molybdenum and rare earths for a China-alternative supply chain. Kazakhstan has joined both Beijing's World AI Cooperation Organisation and the US-led Pax Silica, which reportedly warned members against dual membership. Fudan's Wu Xinbo called forcing Central Asia to choose an \"unrealistic goal,\" noting economic ties with China far exceed those with the US.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/In%20Bishkek,%20US%20envoys%20shadow%20the%20SCO%20summit%20in%20challenge%20on%20Beijing%20and%20Moscow's%20turf.pdf"},{"id":"scmp-18","title":"Iran war: Trump floats renaming Strait of Hormuz as 'Trump Strait'","source":"SCMP","date":"3 Sep 2026","tags":["Geopolitics","Energy","Politics"],"summary":"US President Donald Trump on Wednesday suggested renaming the Strait of Hormuz as \"Trump Strait,\" asserting US control of the waterway even as fighting with Iran raged there. The White House posted a Gulf map marking \"Trump Strait,\" adding it \"got a nice ring to it.\" It is the latest in a series of renamings, following Lake Ontario to \"Lake America\" and the Gulf of Mexico to \"Gulf of America\"; neither Mexico nor Canada accepted the changes. Iran has effectively shut the chokepoint, through which a fifth of the world's oil passes, for six months in retaliation for the war Trump began with Israel in late February. Oil prices rose after fresh US strikes near the strait on Tuesday; Trump said the renewed campaign would not last \"too long.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/Iran%20war%20Trump%20floats%20renaming%20Strait%20of%20Hormuz%20as%20'Trump%20Strait'.pdf"},{"id":"scmp-19","title":"Iran wins SCO backing against US strikes. Will it be enough?","source":"SCMP","date":"3 Sep 2026","tags":["Geopolitics","Politics"],"summary":"As the US resumed strikes to force an end to the six-month war, Iran turned to the SCO and Brics for diplomatic cover. The Bishkek Declaration explicitly condemned military strikes on Iranian territory as violations of international law and backed Iran's sovereignty, though analysts say support may prove more symbolic than substantial. President Masoud Pezeshkian held sideline talks with Putin, Pakistan's Shehbaz Sharif and India's Narendra Modi. Xi Jinping indirectly criticised the US, warning against \"external forces\" undermining stability. Fudan's Sun Degang said sanctions would not end China's resilient trade and energy cooperation with Iran and might backfire on Washington. Griffith University's Ian Hall said Iran gained diplomatically but the SCO and Brics, not military alliances, are unlikely to provide material support or peacemaking.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/Iran%20wins%20SCO%20backing%20against%20US%20strikes.%20Will%20it%20be%20enough.pdf"},{"id":"scmp-20","title":"SCO takes landmark stand on nuclear security as Iran comes under renewed attack","source":"SCMP","date":"3 Sep 2026","tags":["Geopolitics","Defence","Politics"],"summary":"The Shanghai Cooperation Organisation issued its first dedicated declaration on nuclear safety and security at its 25th anniversary Bishkek summit on Tuesday, adopted by all 10 members, condemning attacks on peaceful nuclear facilities and outlining cooperation on regulation, emergency response and anti-trafficking while affirming each state's sovereign responsibility. Without naming Iran, it condemned attacks on peaceful nuclear facilities as violations of international law amid US-Israeli strikes. Xi Jinping linked it to his Global Security Initiative; Putin denounced Western \"double standards.\" The proposal was first raised at the 2025 Tianjin summit by Uzbekistan's Mirziyoyev. The declaration comes amid stalled US-Russia arms control after New Start expired in February. Analyst Zhu Yongbiao cautioned its intent \"lies more in asserting autonomy than direct rivalry.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/SCO%20takes%20landmark%20stand%20on%20nuclear%20security%20as%20Iran%20comes%20under%20renewed%20attack.pdf"},{"id":"scmp-21","title":"South China Sea island build-up heightens Vietnam's security concerns","source":"SCMP","date":"3 Sep 2026","tags":["Geopolitics","Defence","Southeast Asia"],"summary":"Vietnam faces heightened South China Sea tensions after reports of Chinese construction in the Paracels (Xisha Islands), which analysts say could alter the strategic balance. Hanoi strongly objected after satellite imagery showed new infrastructure on Yagong (Ba Ba) Island; the Asia Maritime Transparency Initiative reported completed land reclamation and a \"likely airstrip\" at Antelope Reef. Foreign Ministry spokeswoman Pham Thu Hang called the activities \"completely illegal and null and void.\" China controls seven fortified Spratly outposts on roughly 1,300 hectares and has held the Paracels since seizing them from South Vietnam in 1974. Analysts say new installations tighten Vietnam's operating environment and risk escalation. Hanoi, expanding its own Spratly bases to about 1,100 hectares, signals willingness to internationalise the dispute under Unclos.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/South%20China%20Sea%20island%20build-up%20heightens%20Vietnam's%20security%20concerns.pdf"},{"id":"scmp-22","title":"Tencent's Hy4 model gains in open-source AI rankings after ecosystem-driven training","source":"SCMP","date":"3 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Tencent's new Hy4 preview model, trained on data from its vast product ecosystem, returns its Hunyuan suite to the top tier of open-source offerings, analysts say. Goldman Sachs highlighted a \"differentiated product-plus-model strategy\" deploying preview models across Tencent products to gather user data for retraining. Released Friday, Hy4 ranked eighth globally on Code Arena's WebDev leaderboard, just behind Anthropic's Claude Fable 5, and scored 64.3 on DeepSWE, surpassing Alibaba's Qwen-3.8 Max (56.6) and DeepSeek-V4 Pro (62.7). Alibaba owns the Post. Hy4 features 770 billion parameters, a 2.6-fold increase over Hy3, and a 1-million-token context window. Tencent compressed the 1.5-terabyte model to 214 gigabytes. Second-quarter capital expenditure surged 176 per cent to 52.8 billion yuan (US$7.8 billion).","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/Tencent's%20Hy4%20model%20gains%20in%20open-source%20AI%20rankings%20after%20ecosystem-driven%20training.pdf"},{"id":"scmp-23","title":"Trump puts pressure on squeezed US oil refiners to ease pump prices","source":"SCMP","date":"3 Sep 2026","tags":["Energy","Politics"],"summary":"President Donald Trump pressed US oil refiners to boost petrol and diesel output during a closed-door White House meeting Tuesday, contending with high prices before November's midterms. US fuel prices are at record seasonal levels, with petrol above US$4 a gallon and diesel near US$6. Roughly a dozen executives from firms including Delek, PBF Energy, Marathon and Valero attended; discussion touched regulatory changes, faster permitting and Venezuelan crude processing. Refiners pushed back on the Renewable Fuel Standard's record-high biofuel-blending quotas as driving up costs, after the EPA granted small-refinery exemptions Monday. Trump is seeking more Venezuelan crude via North American Blue Energy Partners. Prices remain about US$1 above the February 28 war start; Trump could not guarantee they would drop before the election.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/Trump%20puts%20pressure%20on%20squeezed%20US%20oil%20refiners%20to%20ease%20pump%20prices.pdf"},{"id":"scmp-24","title":"Xi, Trump and Putin may hold trilateral meeting at next Apec forum, Kremlin says","source":"SCMP","date":"3 Sep 2026","tags":["Geopolitics","Politics"],"summary":"Kremlin aide Yuri Ushakov suggested on Tuesday that Xi Jinping, Donald Trump and Vladimir Putin could hold a trilateral meeting at the Apec summit in Shenzhen on November 18-19, saying the possibility \"was discussed\" at the SCO summit in Bishkek. It would set up a fourth Xi-Trump meeting this year. Putin confirmed his attendance; Trump has not, with his presence possibly hinging on whether Xi attends the December G20 at his Doral resort. Treasury Secretary Scott Bessent criticised China for refusing to agree to a G20 finance communique, calling it the \"dissenter.\" US analyst Zack Cooper warned a three-way meeting would send a \"problematic message\" to allies and could accelerate their drive to reduce reliance on Washington. Trump's outreach to North Korea's Kim may also shape his Apec decision.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/Xi,%20Trump%20and%20Putin%20may%20hold%20trilateral%20meeting%20at%20next%20Apec%20forum,%20Kremlin%20says.pdf"}]},"2026-09-04":{"date":"2026-09-04","dayOfWeek":"Friday","totalArticles":93,"sourceCounts":{"WSJ":18,"ST":26,"BT":24,"SCMP":25},"executiveDigest":"The yen rallied sharply on rising Bank of Japan rate-hike bets, knocking the dollar and lifting Asian currencies - China's renminbi hit a 3.5-year high and analysts said 'dollar debasement is favouring Singapore's currency' - while global bond markets 'took a breather'. The US-Iran standoff ground on: Washington's pressure is 'starting to tell' as sanctions and the blockade bite, yet WSJ said its 'Economic D-Day faces steep odds' and Hegseth extended Mideast deployments into 2027. For Singapore, the labour and wealth picture turned mixed - CapitaLand Investment cut 90 staff, over half of employers plan a hiring freeze, and the wealth of the 50 richest diverged as OCBC and Sheng Siong boomed while tech slid.","briefingCards":[{"title":"Lead story - Yen surge, dollar debasement, bonds breathe","body":"Currencies drove the day: BT reported 'the yen rallied sharply as markets raised bets on BOJ rate hikes, dropping the US dollar', with traders 'bracing for holiday intervention risk'. ST said 'China's renminbi hit a 3.5-year high as yen strength weighed on the dollar' and, crucially for the region, that 'dollar debasement is favouring Singapore's currency'. WSJ noted 'global bond markets took a breather' even as the Fed's Waller argued 'the safety premium for Treasuries is gone, pushing the neutral rate higher'. The Fed called its outlook 'positive but facing heightened uncertainty', US services expanded and jobless claims ticked up, while the July trade gap 'hit its biggest in over a year on the AI build-out'. Australia's dollar neared a 13-year high on the kiwi."},{"title":"Markets & finance","body":"Beyond FX, the tape was mixed: Germany's Ifo revised growth up and Japan's services PMI hit a five-month high, but Swiss inflation jumped on energy and Airbus flagged A330neo quality issues. Big financings landed - ByteDance secured a US$37.6 billion loan ('Asia's second-largest in 2026') - and safe-haven anxiety showed as 'the Dutch central bank moved ~86 tonnes of gold from New York and Ottawa to London'. Singapore drew inflows: BT reported 'S$1.3 billion of net fund inflows in Q2' (Morningstar), even as 'the wealth of Singapore's 50 richest diverged, with OCBC and Sheng Siong booming and tech sliding'. AI names outperformed - Nvidia agreed to buy Hugging Face for US$13 billion, and Soitec and Zscaler jumped on AI demand."},{"title":"Asia realignment","body":"The pre-summit jockeying sharpened: Trump called Xi's Washington visit 'exciting' but 'claimed the US leads China in the AI race', a Mexican minister will meet Wang Yi 'as the US demands a trade-ties rollback', and China 'rejected G-20 trade-imbalance claims, saying no need to devalue the yuan'. Security friction persisted - 'Chinese warships cruised too close for comfort off Japan', Beijing 'ramped up coastguard patrols and surveys near Taiwan' (whose defence spending 'passed NT$1 trillion for the first time'), and the US 'looked to warship designs from Japan, South Korea and Turkey'. Alliance strains showed as 'Seoul risks being sidelined in Trump-Kim talks' and a US cyber-unit plan 'threatens South Korea's balancing act'."},{"title":"Energy & climate","body":"Iran pressure intensified but stayed inconclusive: ST said 'US pressure is starting to tell as sanctions and the blockade bite', yet WSJ warned 'the Economic D-Day faces steep odds' and 'Trump's Venezuela oil grab is no quick fix for gas prices'. Oil was 'mixed as investors weighed Middle East escalation against a chance of a Ukraine peace deal', and Hegseth 'extended Mideast deployments into 2027'. Climate was front and centre - the UN said 'El Nino is yet to peak', a 'rare trio of Pacific hurricanes' formed, and COP31 in Turkey will focus on clean energy - while 'ASEAN can be self-sufficient in energy and food with an integrated market', Singapore's chief climate negotiator argued, and a green jet-fuel levy for air cargo was 'deferred for a year'."},{"title":"Technology & AI","body":"AI capital and copyright/safety themes ran together: OpenAI 'began rolling out GPT-6 Astra' and 'committed US$1 billion to cyberdefence amid safety scrutiny', Nvidia agreed to buy Hugging Face for US$13 billion, and ByteDance took a huge loan and will 'expand a massive AI data-centre cluster in Inner Mongolia'. Governance turned combative - Huang and Musk 'pushed back on AI guard rails', and some 'urged the US to consider military strikes to stop China achieving AGI first'. China's constraints were laid bare: 'China is 15 years behind in top chipmaking tools', per an ASML supplier, and 'US export curbs have reshaped its tech scene around chokepoints'. Data-centre demand even 'turned copper into a hot commodity', and Moonshot (Kimi K3) filed for a Hong Kong IPO."},{"title":"Singapore & SEA focus","body":"Singapore's read was mixed. On the soft side: 'CapitaLand Investment retrenched 90 Singapore staff' in a restructuring, an SNEF poll found 'over half of employers plan a hiring freeze and wage moderation despite a better outlook', and 'the wealth of Singapore's 50 richest diverged' (OCBC and Sheng Siong up, tech down). On the firmer side: 'the Singdollar is benefiting from dollar debasement', Q2 saw S$1.3 billion of fund inflows, and Google Cloud is 'expanding its Singapore push' as AI costs shift 'from tokens to outcomes'. On defence, 'eight of Singapore's 20 F-35 jets will be based at Tengah'. Regionally, Malaysia's central bank held rates, and a US$1.6 billion levy 'complicated the sale of Singapore land by the Malaysian king's son'."}],"keyMetrics":[{"value":"93","label":"Articles curated today","sub":"WSJ 18 · ST 26 · BT 24 · SCMP 25"},{"value":"Yen surges","label":"BOJ-hike bets rise","sub":"US dollar drops"},{"value":"3.5-yr high","label":"China renminbi","sub":"Singdollar benefits from debasement"},{"value":"Hiring freeze","label":"Over half SG employers","sub":"SNEF poll; CapInvest cuts 90"},{"value":"US$13b","label":"Nvidia buys Hugging Face","sub":"AI deal spree continues"},{"value":"Steep odds","label":"US 'Economic D-Day' on Iran","sub":"But pressure 'starting to tell'"}],"articles":[{"id":"wsj-01","title":"BOE's Chief Economist Sees Need for Rate Rise as War's Course Remains Uncertain","source":"WSJ","date":"4 Sep 2026","tags":["Finance & Markets","Geopolitics"],"summary":"Bank of England Chief Economist Huw Pill argued Thursday for raising the key interest rate to curb the risk that inflation stays above the 2% target, despite deep uncertainty over the U.S.-Iran war and future energy prices. Pill, long favoring higher rates, was joined by two colleagues voting for a July rise, with six backing a hold. UK annual inflation was 2.9% in July, above target and set to climb as home energy prices rise. He said acting now would limit second-round effects during early-2027 pay talks, avoiding more aggressive later moves. Pill stressed, \"Raising Bank Rate on this basis need not be the start of a prolonged and aggressive series of increases,\" as gilt yields already tightened conditions.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20WSJ/BOE's%20Chief%20Economist%20Sees%20Need%20for%20Rate%20Rise%20as%20War's%20Course%20Remains%20Uncertain.pdf"},{"id":"wsj-02","title":"Chinese Warships Are Cruising Too Close for Comfort Off Japan's Shores","source":"WSJ","date":"4 Sep 2026","tags":["Geopolitics","Defence"],"summary":"Chinese destroyers repeatedly transit a narrow channel near Japan's Amami-Oshima island, unnerving locals like Mayor Naruhito Kamada, who fears a collision. Japanese surveillance recorded such passages at least 10 times this year, after zero in 2025 and 15 in 2024, a pace one scholar called \"a provocation.\" Japan describes its most severe security environment since World War II as China flexes military might, presses maritime claims and pushes into the Western Pacific where the U.S. long dominated. Deepening ties among China, North Korea and Russia raise concerns over vital sea lanes; North Korea fields shorter-range missiles with tactical nukes, and Russia conducts live drills near the disputed Kuril Islands. Japan's U.S. alliance faces pressure as Trump criticizes perceived freeloading allies.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20WSJ/Chinese%20Warships%20Are%20Cruising%20Too%20Close%20for%20Comfort%20Off%20Japan's%20Shores.pdf"},{"id":"wsj-03","title":"El Nino Is Yet to Peak, Bringing Heat and Agricultural Damage in Tow, UN Says","source":"WSJ","date":"4 Sep 2026","tags":["Environment","Finance & Markets"],"summary":"This year's El Nino is on track to be the strongest in at least 70 years, threatening widescale disruption to global agricultural markets, the World Meteorological Organization said. The UN agency puts the likelihood of El Nino persisting through February 2027 near 100%, an unusually unequivocal forecast. Strong events bring extreme heat and irregular rainfall, hitting crops from sugar to wheat. Corn prices are up roughly 33% from their late-June low, also boosted by Black Sea supply disruption, while sugar trades up about 23% from its late-July low at 18 cents a pound. Rabobank and Barclays analysts warn of tightening global stocks, with drier conditions expected in India and excess rain in Brazil. Pacific temperatures ran over eight degrees Celsius above normal.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20WSJ/El%20Nino%20Is%20Yet%20to%20Peak,%20Bringing%20Heat%20and%20Agricultural%20Damage%20in%20Tow,%20UN%20Says.pdf"},{"id":"wsj-04","title":"Germany's Ifo Institute Revises Up Growth Estimates","source":"WSJ","date":"4 Sep 2026","tags":["Finance & Markets"],"summary":"Germany's Ifo Institute raised its 2026 growth forecast to 1.4%, up from 0.8% in June, citing healthy exports and rising public investment in infrastructure, climate and defense that cushion an energy-price shock and low river water levels. Second-quarter GDP was revised to 0.3% growth from 0.2%, on stronger exports despite surging energy costs tied to the war in Iran; first-quarter growth was 0.4%. Head of forecasts Timo Wollmershaeuser cited \"rays of hope\" for the crisis-stricken industrial sector as output climbed. Ifo now sees 1.2% growth in 2027 and 0.8% in 2028. Bundesbank chief Joachim Nagel expects about 1% this year. Ifo projects inflation rising to 3.0% next year, not nearing the ECB's 2% target until 2028.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20WSJ/Germany's%20Ifo%20Institute%20Revises%20Up%20Growth%20Estimates.pdf"},{"id":"wsj-05","title":"Global Bond Markets Take a Breather","source":"WSJ","date":"4 Sep 2026","tags":["Finance & Markets"],"summary":"Government bond yields fell Thursday as expectations of a U.S. Federal Reserve rate increase cooled. Fed governor Christopher Waller said he would support holding rates steady if August inflation data allows, a day after New York Fed President John Williams signaled current data doesn't warrant a hike. Lukewarm job data ahead of Friday's payrolls report further weakened hike odds. The 10-year Treasury yield traded near 4.754%, down from 4.781%, after a recent 33-month high; the German Bund fell to 3.354% and the UK gilt to 5.157% from a 19-year peak. Money markets priced a 56% chance of a hike this month, down from nearly 70%. The dollar weakened, dropping 2% against the yen, while Brent rose 1.3% to $96.88.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20WSJ/Global%20Bond%20Markets%20Take%20a%20Breather.pdf"},{"id":"wsj-06","title":"Hegseth Extends Mideast Deployments Into 2027, Escalating Strain on Troops","source":"WSJ","date":"4 Sep 2026","tags":["Defence","Geopolitics"],"summary":"Defense Secretary Pete Hegseth is quietly extending U.S. troop deployments in the Middle East into next year, signaling the six-month campaign against Iran could drag on, people familiar said. The open-ended strategy aims to give President Trump options, but deploying 19 warships, air-defense units, fighter squadrons and paratroopers strains servicemembers and creates a maintenance backlog that could take years to clear. The U.S. keeps 50,000 troops in the region. Trump has embraced economic pressure to force Iran to negotiate, but Tehran shows no sign of backing down as both sides exchange fire over the Strait of Hormuz. Trump privately weighs declaring the war over. Aides warn escalation could hurt Republicans in November midterms, though Trump says electoral consequences aren't factored in.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20WSJ/Hegseth%20Extends%20Mideast%20Deployments%20Into%202027,%20Escalating%20Strain%20on%20Troops.pdf"},{"id":"wsj-07","title":"Nvidia Agrees to Buy AI Platform Hugging Face for $13 Billion","source":"WSJ","date":"4 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Nvidia agreed to buy New York-based AI startup Hugging Face in a deal worth roughly $13 billion, its latest acquisition at the center of the AI boom. The purchase accelerates Nvidia's push to promote open-weight AI models that challenge proprietary systems from OpenAI and Anthropic and open models developed in China. Founded a decade ago, Hugging Face is a leading platform where engineers collaborate on machine-learning projects. CEO Jensen Huang pledged it would remain open, saying open weights broaden AI access. Hugging Face approached Nvidia earlier in the summer, said CEO Clement Delangue, who called it \"a perfect home.\" The company was founded in New York in 2016 by three French entrepreneurs, originally aiming to build a chatbot for teenagers before pivoting to developer tools.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20WSJ/Nvidia%20Agrees%20to%20Buy%20AI%20Platform%20Hugging%20Face%20for%2013%20Billion.pdf"},{"id":"wsj-08","title":"Saudi Nuclear Agreement Could Open a Path to 20% Enrichment","source":"WSJ","date":"4 Sep 2026","tags":["Geopolitics","Energy"],"summary":"New details of the Trump administration's agreement to give Saudi Arabia a civilian nuclear program are spurring criticism it does too little to prevent proliferation. The accord, shared with lawmakers, outlines a road map for enriching uranium in the kingdom after further consultations, including to nearly 20%, a level that could power a small modular reactor but nears weapons-relevant work. Former official Scott Roecker said there is a civilian case, but at that level \"you are most of your way toward producing weapons grade material.\" Trump publicly said the accord wouldn't allow enrichment, yet signed a July memo endorsing its potential pathway. The U.S. spent years capping Iran's enrichment; under the 2015 deal Iran was limited to 3.67%, later reaching 60%. Bomb grade is 90%.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20WSJ/Saudi%20Nuclear%20Agreement%20Could%20Open%20a%20Path%20to%2020%20Enrichment.pdf"},{"id":"wsj-09","title":"Soitec Shares Jump After Guidance Upgrade on Strong AI Demand","source":"WSJ","date":"4 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Shares of Soitec, a French semiconductor-materials maker, jumped after it lifted revenue guidance on booming AI-infrastructure demand. The group said it expects year-on-year revenue growth of around 50% at constant currency in the fiscal second quarter ending September, above prior guidance of more than 30%. Paris-listed shares gained more than 15% Thursday and are up more than fivefold this year as companies pledge hundreds of billions in data-center capex. Grenoble-based Soitec supplies substrates used in chips for smartphones, tablets and data centers. Photonics-SOI revenue should reach about three times last year's roughly $25 million this quarter, and $250 million-$300 million for fiscal 2027 versus just over $100 million in fiscal 2026. Citi analysts expect high-single-digit consensus upgrades for fiscal 2027.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20WSJ/Soitec%20Shares%20Jump%20After%20Guidance%20Upgrade%20on%20Strong%20AI%20Demand.pdf"},{"id":"wsj-10","title":"Swiss Inflation Jumps on Higher Energy Prices","source":"WSJ","date":"4 Sep 2026","tags":["Finance & Markets","Energy"],"summary":"Swiss inflation jumped in August, reversing months of cooling as renewed Middle East tensions pushed global energy costs higher. The annual rate rose to 0.8% from 0.4% in July, the highest since 2024, data agency FSO said. Higher prices for petrol, diesel and heating oil, plus rising housing rentals, drove the uptick, with imported product costs climbing sharply. Eurozone inflation also neared a three-year high. Switzerland is relatively insulated via hydroelectric and nuclear power, but inflation has risen from near zero at the start of 2026. Pantheon Macroeconomics economist Ankita Amajuri sees inflation averaging 1.0% in the second half and 1.2% in 2027, within the SNB's 0%-2% range. The SNB held rates in June; a hike could come early next year.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20WSJ/Swiss%20Inflation%20Jumps%20on%20Higher%20Energy%20Prices.pdf"},{"id":"wsj-11","title":"The Dutch central bank said it moved around 86 metric tons of gold from New York and Ottawa to London as a result of \"increasing geopolitical unrest\"","source":"WSJ","date":"4 Sep 2026","tags":["Finance & Markets","Geopolitics"],"summary":"The Dutch central bank (DNB) shifted around 78 metric tons of gold, worth $11 billion, from Manhattan vaults to London to improve its ability to trade the metal in a crisis, and also moved some gold from Canada. The months-long operation involved selling some gold in the U.S. and repurchasing in the UK, while other bars were flown to Europe. Almost a third of Dutch reserves now sit in London and 19% in New York, reversing prior positions. \"In view of increasing geopolitical unrest, DNB is strengthening its crisis preparedness,\" the bank said, without specifying the threat. The move follows 18 months of frayed U.S.-Europe relations over tariffs, Trump's Greenland threats and wavering military backing. Central banks have added gold since the 2008 crisis and amid proliferating sanctions.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20WSJ/The%20Dutch%20central%20bank%20said%20it%20moved%20around%2086%20metric%20tons%20of%20gold%20from%20New%20York%20and%20Ottaw.pdf"},{"id":"wsj-12","title":"U.S. Failed to Give Assurances on Tariff Levels, Canada's Carney Says","source":"WSJ","date":"4 Sep 2026","tags":["Trade","Politics"],"summary":"Canadian Prime Minister Mark Carney said any trade pact with the U.S. must ensure agreed tariff levels on certain goods cannot be changed, and such assurances weren't provided in last month's talks. Those negotiations collapsed, triggering new U.S. tariffs on Canadian goods and proposed retaliatory tariffs from Ottawa set to take effect Tuesday. Carney said Canada sought guarantees on steel, aluminum and automobile tariffs, noting the two sides had tentatively agreed to sharp sectoral reductions before protections were withdrawn. The White House said Canada was offered the most generous deal among trading partners but rejected it and made further demands. Trump has threatened a 50% tariff on Canadian-made vehicles and auto parts starting Jan. 1, saying the U.S. doesn't need Canadian goods.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20WSJ/U.S.%20Failed%20to%20Give%20Assurances%20on%20Tariff%20Levels,%20Canada's%20Carney%20Says.pdf"},{"id":"wsj-13","title":"U.S. Jobless Claims Ticked Back Up Last Week","source":"WSJ","date":"4 Sep 2026","tags":["Finance & Markets"],"summary":"U.S. jobless claims edged higher last week but stayed broadly flat as job creation slows. Initial claims for unemployment benefits reached 206,000 in the week through August 29, 2,000 above the upwardly revised 204,000 a week earlier, the Labor Department said. Economists surveyed by The Wall Street Journal had expected 205,000. Continuing claims, which track the total unemployed population, totaled just under 1.78 million in the week through August 15, up 8,000 from a downwardly revised figure; that data lags initial claims by a week. Payroll firm ADP reported businesses added 38,000 jobs in August, the slowest pace since January. Economists expected unemployment to hold at 4.1% in the Bureau of Labor Statistics report due Friday.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20WSJ/U.S.%20Jobless%20Claims%20Ticked%20Back%20Up%20Last%20Week.pdf"},{"id":"wsj-14","title":"U.S. Services-Sector Activity Expanded Again in August","source":"WSJ","date":"4 Sep 2026","tags":["Finance & Markets"],"summary":"U.S. services-sector activity expanded again last month, extending a 26-month streak, a survey of managers found. The Institute for Supply Management's purchasing managers index for services rose to 55.4 in August from 54.1 in July, beating economists' expectations for a steady reading; a level above 50 signals growth. The new orders index climbed to 60.9 from 57.2, while the employment index stayed in contraction for a second straight month. The prices index registered above 70 for the fifth time in six months, indicating persistent cost pressure. Supplier deliveries continued to show slower performance. \"Tariffs and the Middle East conflict returned as the most-cited issues impacting respondents' supply chains,\" said Steve Miller, chair of the ISM Services Business Survey Committee.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20WSJ/U.S.%20Services-Sector%20Activity%20Expanded%20Again%20in%20August.pdf"},{"id":"wsj-15","title":"Why Trump's Venezuela Oil Grab Is No Quick Fix for Gas Prices","source":"WSJ","date":"4 Sep 2026","tags":["Energy","Geopolitics"],"summary":"President Trump plans to use Venezuelan oil the U.S. will control through a deal with a private company to refill the Strategic Petroleum Reserve, gaining access to fields said to hold one-fifth of the country's crude reserves. But analysts say it offers no quick relief for high U.S. gasoline prices: it could take months to yield barrels, and the administration hasn't explained how procurement would work, while future elections in both countries could jeopardize it. The U.S. has released more than 128 million barrels from Gulf Coast salt caverns to offset the Strait of Hormuz closure, dropping reserves to their lowest since autumn 1982. Trump wants gasoline below $4 a gallon. The administration says the deal secures \"energy dominance for the next century.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20WSJ/Why%20Trump's%20Venezuela%20Oil%20Grab%20Is%20No%20Quick%20Fix%20for%20Gas%20Prices.pdf"},{"id":"wsj-16","title":"Why Washington's 'Economic D-Day' Against Iran Faces Steep Odds","source":"WSJ","date":"4 Sep 2026","tags":["Geopolitics","Politics"],"summary":"The Trump administration unveiled an \"Economic D-Day\" aimed at forcing Iran to reopen the Strait of Hormuz and return to negotiations, but history suggests steep odds. Western sanctions on autocracies like Cuba, North Korea, Venezuela and Syria show strongmen can withstand economic pain for years using violence, adaptation and political suppression. Sanctions typically push activity underground, spawning black markets, while dictators rally populations against outside pressure. Cuba leans on its diaspora; North Korea steals cryptocurrency; Russia reoriented trade toward China. Tehran, branding the campaign \"economic terrorism,\" has decades of sanctions experience and built a parallel financial system with China that bypasses U.S. banking. Economist Djavad Salehi-Isfahani doubts pressure will force compromise. Sometimes only military action unseats autocrats, as with Venezuela's Maduro and Syria's Assad.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20WSJ/Why%20Washington's%20'Economic%20D-Day'%20Against%20Iran%20Faces%20Steep%20Odds.pdf"},{"id":"wsj-17","title":"With conservative figures such as Steve Bannon joining the opposition to data centers, AI is the latest \"horseshoe issue\" that unites the left and right populist flanks of each party","source":"WSJ","date":"4 Sep 2026","tags":["Technology & AI","Politics"],"summary":"Steve Bannon, President Trump's former chief strategist, has joined Democrats in warning about AI's dangers and fighting the data centers that power it, making AI a \"horseshoe issue\" uniting left and right populists. The far-right podcast host backs a proposal from Sen. Bernie Sanders and Rep. Alexandria Ocasio-Cortez to ban new data-center construction, and supports Sanders's call for AI companies to pause development, putting him at odds with Trump. Bannon said he is looking past disagreements with progressives because AI will be the defining issue of the future. Trump countered on social media that only communities wanting to end up \"backwards and poor\" would reject data centers. The bipartisan opposition is fueled by concerns over power and water use, job losses and distrust of Big Tech.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/04%20Sep%202026/04%20Sep%20WSJ/With%20conservative%20figures%20such%20as%20Steve%20Bannon%20joining%20the%20opposition%20to%20data%20centers,%20AI.pdf"},{"id":"wsj-18","title":"Zscaler Loss Narrows As Revenue Soars, Boosted by AI","source":"WSJ","date":"4 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Cybersecurity firm Zscaler posted a narrower fiscal fourth-quarter loss as revenue rose 25%, with AI driving demand for its offerings. The San Jose-based company said it would restructure and cut 3% of its workforce to reallocate resources toward AI and growth. It reported a loss of $3.37 million, or 2 cents a share, versus a $17.6 million loss a year earlier; adjusted earnings of $1.19 beat the $1.09 expected. Revenue reached $898.2 million, top
