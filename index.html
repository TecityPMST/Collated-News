signalling intensifying scrutiny of the city's booming share sales, sources said. At an Aug 17 meeting, an SFC enforcement director instructed firms to train front-desk staff to handle search warrants, escort search teams and allow same-day access to employee emails and systems. There have been about eight raids of brokerages or funds in 2026, a sharp uptick, including units of Citic, Guotai Junan and Huatai International. Hong Kong is experiencing an unprecedented IPO boom, with funds raised up 76 per cent to HK$651 billion (US$83.5 billion) in the first eight months. The SFC's focus has shifted toward listing abuses such as misused proceeds and fabricated demand, recently suspending Cloudbreak Pharma.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20BT/Hong%20Kong%20watchdog%20briefs%20banks%20on%20handling%20raids%20as%20IPO%20scrutiny%20intensifies%20sources.pdf"}, {"id": "bt-15sep-14", "title": "How high might natural gas prices go?", "source": "BT", "date": "15 Sep 2026", "tags": ["Energy", "Geopolitics"], "summary": "This commentary examines the sudden September surge in international natural gas prices, now trading near the oil-equivalent of US$150 per barrel, as the market shifts from expecting a return to supply toward fears of an extended outage. LNG trade through the Strait of Hormuz has no obvious solution, with less than 10 per cent of prewar traffic getting through, making it among the hardest-hit commodities of the Middle East conflict. Unlike oil, the US has no incentive to bring Middle Eastern LNG back, as it would compete with American exports. Current prices around US$25 per MMBtu could climb toward US$30, but the writer argues a repeat of the US$50-75 spikes of 2022 is unlikely, given weaker Asian demand, strong North American supply and cautious European storage strategies.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20BT/How%20high%20might%20natural%20gas%20prices%20go.pdf"}, {"id": "bt-15sep-15", "title": "JPMorgan to launch long-awaited 'frontier' local currency debt index", "source": "BT", "date": "15 Sep 2026", "tags": ["Finance & Markets"], "summary": "JPMorgan is set to launch its long-awaited \"frontier\" market local-currency government bond index, the GBI-EM Edge, by the end of September, giving investors a benchmark for nearly US$330 billion of debt across 26 fast-growing economies. Coming almost 20 years after its hard-currency NEXGEM index, the benchmark will give the biggest weightings to Egypt, Vietnam, Morocco, Kazakhstan, Bangladesh, Pakistan, Nigeria and Sri Lanka. African countries will make up almost 45 per cent, and \"Frontier Asia\" nearly a third. Bonds must be at least US$250 million in size with 2.5 years to maturity, and no country can exceed an 8 per cent weighting. The index yields about 10.4 per cent, roughly 440 basis points above the mainstream EM local-currency index, reflecting growing investor appetite for high-yielding frontier debt.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20BT/JPMorgan%20to%20launch%20long-awaited%20'frontier'%20local%20currency%20debt%20index.pdf"}, {"id": "bt-15sep-16", "title": "New Houthi attacks on Saudi Arabia wound 13 civilians as Gulf-Iran talks over Hormuz stall", "source": "BT", "date": "15 Sep 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "Yemen's Iran-aligned Houthis launched a new wave of missile and drone attacks on Saudi Arabia, wounding 13 civilians and targeting a military airbase in Khamis Mushait, as Gulf Arab states postponed planned talks with Iran over reopening the Strait of Hormuz. The Houthi advances, including seizing Perim Island, added pressure on Saudi oil exports after a Sep 10 attack knocked the kingdom's east-west pipeline offline; traders said a prolonged shutdown could cut up to 4 per cent of global supply. Washington has so far rebuffed Saudi requests for direct military help beyond intelligence support. Iran's Revolutionary Guard reiterated that the Strait of Hormuz, which carried 20 per cent of world oil exports before the war, remains closed under its control.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20BT/New%20Houthi%20attacks%20on%20Saudi%20Arabia%20wound%2013%20civilians%20as%20Gulf-Iran%20talks%20over%20Hormuz%20stall.pdf"}, {"id": "bt-15sep-17", "title": "Petronas, Thailand's PTT secure approvals for new gas block sharing contract", "source": "BT", "date": "15 Sep 2026", "tags": ["Energy", "Southeast Asia"], "summary": "Malaysian state energy firm Petronas said its unit and subsidiaries of Thailand's PTT have secured government approvals for a new production-sharing contract covering a major gas-producing block in their joint development area, as Asian buyers seek greater supply certainty amid Middle East-driven disruptions. PC JDA, PTTEP JDX and the Malaysia-Thailand Joint Authority signed agreements for Block A-18-01, extending development of the existing Block A-18 beyond its April 2029 expiry and adding an adjacent exploration area. The 7,250 sq km Malaysia-Thailand Joint Development Area holds gas fields with combined capacity of about 700 million standard cubic feet per day, shared equally. A gas sales agreement will support continued supply to both countries. Malaysia's economy minister said the deal paves the way for developing Block B-17-01.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20BT/Petronas%2C%20Thailand's%20PTT%20secure%20approvals%20for%20new%20gas%20block%20sharing%20contract.pdf"}, {"id": "bt-15sep-18", "title": "S-Reits an 'oasis of calm' amid global bond yield surge: UOBKH", "source": "BT", "date": "15 Sep 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "UOB Kay Hian has maintained an \"overweight\" stance on Singapore real estate investment trusts (S-Reits), favouring domestic plays as an \"oasis of calm\" while rising global bond yields drag on overseas-exposed assets. The brokerage updated its dividend discount model to weight risk-free rates by each Reit's asset location. Singapore's 10-year yield rose just 24 basis points to 2.36 per cent, far more resilient than US Treasuries at 4.8 per cent and Japan at 2.88 per cent. It kept target prices for Singapore-focused CICT, Frasers Centrepoint Trust and Lendlease Global Commercial Reit, but cut targets for CapitaLand Ascott Trust and Frasers Logistics & Commercial Trust over Australian, UK and US exposure. UOBKH cited deteriorating fiscal sustainability abroad versus Singapore's surpluses and safe-haven status.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20BT/S-Reits%20an%20'oasis%20of%20calm'%20amid%20global%20bond%20yield%20surge%20UOBKH.pdf"}, {"id": "bt-15sep-19", "title": "SGX to offer crypto perpetual futures to US institutions as regulated exchanges join race", "source": "BT", "date": "15 Sep 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Singapore Exchange (SGX) is preparing to offer its cryptocurrency perpetual futures to US institutions, becoming the first major traditional exchange to bring the popular trade into the mainstream. SGX filed with the US Commodity Futures Trading Commission in August and, as a registered overseas exchange, can offer the products if it receives no objection within 10 days. The move gives access to a deeper pool of hedge funds and asset managers after SGX launched Bitcoin and Ether perpetual futures in November 2025. Its contracts trade 22.5 hours a day, five days a week, requiring 35 per cent margin and fiat collateral. SGX has recorded about US$6 billion in volume, far behind crypto-native Hyperliquid's US$80-100 billion monthly. Rivals including Kalshi and Coinbase are also pursuing regulated perps.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20BT/SGX%20to%20offer%20crypto%20perpetual%20futures%20to%20US%20institutions%20as%20regulated%20exchanges%20join%20race.pdf"}, {"id": "bt-15sep-20", "title": "Samsung, SK Hynix reject US$18 billion power prepayment to fund new grids: reports", "source": "BT", "date": "15 Sep 2026", "tags": ["Technology & AI", "Energy"], "summary": "Samsung Electronics and SK Hynix have rejected a proposal from Korea Electric Power Corp (Kepco) that would have had the two chipmakers pay in advance for electricity to help finance grid construction for new technology clusters, according to local media reports. The plan, estimated at a combined 25 trillion won (US$18 billion) - equivalent to five years of bills - was an effort to bridge the funding gap as cash-strapped Asian utilities struggle to meet surging demand from the semiconductor and AI industries. A Kepco spokesman confirmed the firms ultimately rejected the proposal. The chipmakers were concerned about committing such large sums upfront given uncertainty over whether the current semiconductor boom would last five years. The scheme would have reduced Kepco's reliance on bond issuance.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20BT/Samsung%2C%20SK%20Hynix%20reject%20US18%20billion%20power%20prepayment%20to%20fund%20new%20grids%20reports.pdf"}, {"id": "bt-15sep-21", "title": "Singapore bond issuance hits record US$95 billion in 2025, up 21.8%: MAS", "source": "BT", "date": "15 Sep 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Singapore's bond market issuance jumped 21.8 per cent year on year to a record US$95 billion in 2025, driven by refinancing needs and regional demand for capital for AI, technology and infrastructure, the Monetary Authority of Singapore said in its annual corporate debt market update. The figure surpassed the previous record of US$77 billion set in 2023, as global bond issuance rose 7.7 per cent to US$9.8 trillion. The US dollar accounted for 65.6 per cent of issuance and the Singapore dollar 21.4 per cent. New Singdollar issuance rose 10 per cent to S$339 billion, with first-time issuers including Equinix Asia Financing, Wee Hur and IReit Global. Covered bond issuance hit a record S$11 billion. MAS expects Asian bond markets to remain resilient despite a less favourable 2026 funding environment.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20BT/Singapore%20bond%20issuance%20hits%20record%20US95%20billion%20in%202025%2C%20up%2021.8%20MAS.pdf"}, {"id": "bt-15sep-22", "title": "Singapore sells less marine fuel in August as higher prices bite", "source": "BT", "date": "15 Sep 2026", "tags": ["Energy", "Southeast Asia"], "summary": "Singapore, the world's largest bunkering hub, posted a 3.9 per cent year-on-year dip in marine fuel sales in August as higher prices deterred buyers, though volumes continued improving from an April trough after the Middle East war began. Sales reached nearly 4.8 million tonnes, the second straight month of annual decline, in line with fewer vessels calling for refuelling - 3,588 in August versus 3,675 in July. Low sulphur fuel oil consumption fell 12.3 per cent to 2.2 million tonnes, the biggest drag, as tight supply and reduced Russian exports kept prices high. Bunker prices spiked after the Feb 28 US-Israel attacks on Iran cut Hormuz crude flows. Container throughput rose 2.3 per cent, though Singapore slipped to the world's third-busiest port, overtaken by Ningbo-Zhoushan.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20BT/Singapore%20sells%20less%20marine%20fuel%20in%20August%20as%20higher%20prices%20bite.pdf"}, {"id": "bt-15sep-23", "title": "SoftBank gets upsized US$11.9 billion loan in OpenAI funding push: sources", "source": "BT", "date": "15 Sep 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "SoftBank has secured an US$11.87 billion loan to support its investment in US artificial intelligence firm OpenAI, up from an earlier target of US$10 billion, people familiar with the matter said. The Japanese conglomerate sealed the two-year facility last week, attracting commitments from around 20 banks. The financing comes as OpenAI chief Sam Altman said his company would not pursue a public offering this year due to safety concerns. SoftBank shares tumbled as much as 13 per cent on Monday. The borrowing adds to SoftBank's debt wave tied to OpenAI, including a US$10 billion margin loan and a potential US$20 billion bond sale. Founder Masayoshi Son plans to invest close to US$65 billion in OpenAI by October, having already raised about US$37 billion this year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20BT/SoftBank%20gets%20upsized%20US11.9%20billion%20loan%20in%20OpenAI%20funding%20push%20sources.pdf"}, {"id": "bt-15sep-24", "title": "Xi pitches China-led open-source AI ecosystem at Brics summit amid US rivalry", "source": "BT", "date": "15 Sep 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "Chinese President Xi Jinping has sought to turn the Brics summit into a platform for championing Beijing's vision of artificial intelligence, pledging that China will lead the creation of a Brics \"community\" for open-source AI. Speaking in New Delhi, he said the initiative would support cooperation in developing large language models and hosting AI seminars and training. Xi also welcomed Brics nations to join a new group of nearly 30 countries, the World AI Cooperation Organization. Beijing is building an open-source ecosystem offering a cheaper alternative to US technology, while American developers such as OpenAI and Anthropic favour closed models. A joint Brics declaration did not explicitly endorse Xi's pitch. China is expected to push AI governance again when it hosts the 2027 summit, though Beijing maintains limits on openness.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20BT/Xi%20pitches%20China-led%20open-source%20AI%20ecosystem%20at%20Brics%20summit%20amid%20US%20rivalry.pdf"}, {"id": "scmp-15sep-01", "title": "Beijing hails Taiwanese scholar's rare proposal on reunification", "source": "SCMP", "date": "15 Sep 2026", "tags": ["Geopolitics", "Politics"], "summary": "Beijing has issued a rare positive statement on a detailed 'one country, two systems' proposal for Taiwan drafted by Li Ci-ze, an associate professor at Taiwan's National Changhua University of Education. Li submitted the plan in late August to a mainland social media channel focused on cross-strait issues. Taiwan Affairs Office spokesman Chen Binhua welcomed the discussion, saying more Taiwanese are engaging with reunification. Beijing has long favoured reunification under the framework but never detailed how the island would be governed. Li proposed Taiwan retain direct elections for its top executive and legislature and 'fully retain' opposition parties after peaceful reunification. Taiwan's major parties, historically lukewarm or opposed to such calls, have yet to respond to Li's proposal.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20SCMP/Beijing%20hails%20Taiwanese%20scholar's%20rare%20proposal%20on%20reunification.pdf"}, {"id": "scmp-15sep-02", "title": "Beijing threatens 'serious consequences' after Panama lawmakers support Taiwan", "source": "SCMP", "date": "15 Sep 2026", "tags": ["Geopolitics", "Politics"], "summary": "China warned Panama of 'serious consequences' after most of its lawmakers set up a parliamentary exchange group with Taiwan, defying pressure from Beijing's embassy and a public disavowal by President Jose Raul Mulino. Foreign ministry spokesman Guo Jiakun said the group seriously violated the one-China principle and urged 'those few politicians' to reconsider, while also pressing Washington to abide by the one-China principle. Panamanian deputies installed the body on September 8, nine years after Panama switched recognition from Taipei to Beijing. Deputy Medin Jimenez said 45 of 71 members signed, framing it as a commercial project tied to a free-trade agreement in force since 2004 and over US$158 million in trade, arguing it breaks no rules.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20SCMP/Beijing%20threatens%20'serious%20consequences'%20after%20Panama%20lawmakers%20support%20Taiwan.pdf"}, {"id": "scmp-15sep-03", "title": "Beijing's 'trust issue' with Hong Kong and what the city can promise in its 5-year plan", "source": "SCMP", "date": "15 Sep 2026", "tags": ["Politics", "Finance & Markets"], "summary": "In the final part of an SCMP series previewing Hong Kong's five-year plan and policy address, due September 16, experts examine how national security ties into economic development. Chief Executive John Lee Ka-chiu's inaugural five-year plan will dedicate a full chapter to national security, the Post has learned. Analysts argue security is inextricably linked to economic growth rather than a deterrent to investors, following the recent sentencing of former Tiananmen vigil leaders. Authorities are expected to lay institutional safeguards across key domains, notably finance and technology among China's 11 critical areas, to shield the city and consolidate its international financial centre status. Experts say Hong Kong's openness is both a strength and vulnerability requiring robust frameworks.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20SCMP/Beijing's%20'trust%20issue'%20with%20Hong%20Kong%20and%20what%20the%20city%20can%20promise%20in%20its%205-year%20plan.pdf"}, {"id": "scmp-15sep-04", "title": "Brics leaders act to hedge - not revolt - against US dollar dominance", "source": "SCMP", "date": "15 Sep 2026", "tags": ["Geopolitics", "Finance & Markets"], "summary": "As the Brics summit closed in New Delhi, leaders including Xi Jinping, Vladimir Putin, Masoud Pezeshkian and Narendra Modi projected unity for an 11-nation bloc spanning four continents. Analysts say the New Delhi Declaration was neither a revolt against the dollar nor a blueprint for a new order, but a hedge treating de-dollarisation as insurance. By promoting local-currency settlement, linked payment rails and a louder voice within the IMF and World Bank, members aim to keep trade moving if Washington weaponises the dollar. UN chief Antonio Guterres, WTO's Ngozi Okonjo-Iweala and WHO's Tedros Adhanom Ghebreyesus attended, with Guterres urging reform of multilateral institutions to reflect a multipolar world as the US leans on tariffs.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20SCMP/Brics%20leaders%20act%20to%20hedge%20-%20not%20revolt%20-%20against%20US%20dollar%20dominance.pdf"}, {"id": "scmp-15sep-05", "title": "China rejects calls for 'pacing' on AI development, fearing it would entrench US tech lead", "source": "SCMP", "date": "15 Sep 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "Calls by US tech leaders for a voluntary slowdown in AI development have drawn sharp pushback from Chinese researchers and state media, who question whether 'pacing' is genuine responsibility or an effort to entrench America's lead. OpenAI's Sam Altman joined Anthropic's Dario Amodei and xAI's Elon Musk in urging industry-wide restraint amid safety concerns, after incidents where experimental models hacked real-world systems. Amodei called for 'worldwide pacing of the frontier' but acknowledged it would require cooperation with China. Chinese researchers argue a slowdown would protect established US incumbents while freezing latecomers out of the market. The debate intensified as Beijing seeks a leading role in AI while criticising US restrictions.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20SCMP/China%20rejects%20calls%20for%20'pacing'%20on%20AI%20development,%20fearing%20it%20would%20entrench%20US%20tech%20lead.pdf"}, {"id": "scmp-15sep-06", "title": "China's J-10CE has foreign buyers, but not yet a market", "source": "SCMP", "date": "15 Sep 2026", "tags": ["Defence", "Trade"], "summary": "China's J-10CE fighter jet is gaining export traction but has not yet won a clean contest against Western rivals, analysts say. Uzbekistan recently confirmed the jets entered service, joining Pakistan, which used J-10CEs in combat against India last year, and Bangladesh, which has drafted a procurement paper. Pakistan claimed five Indian aircraft were downed, including three Rafales, though Dassault's CEO disputed the count and Reuters reported at least one Rafale lost. Pakistan remains the only operator with a combat record. Bangladesh cited that performance to justify a proposed purchase of 20 jets for over US$2.3 billion, with a flyaway price of US$62.7 million each. The deal awaits budget approval, underscoring the jet's limited market reach.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20SCMP/China's%20J-10CE%20has%20foreign%20buyers,%20but%20not%20yet%20a%20market.pdf"}, {"id": "scmp-15sep-07", "title": "China's intelligence chief warns of risks from AI as 'new arena for strategic rivalry'", "source": "SCMP", "date": "15 Sep 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "China's state security minister Chen Yixin has warned of rising national security risks from artificial intelligence, calling for robust risk-prevention frameworks and stronger global governance. Writing in the journal China Cyberspace, Chen described AI as 'a new arena for strategic rivalry among major powers'. He warned the technology could threaten ideological security, be leveraged by hostile forces to generate rumours and harmful information, and pose serious risks to critical infrastructure. Next-generation US-led models could lower the threshold and cost of cyberattacks, he argued, while foreign intelligence agencies exploit web crawlers and data mining to harvest state data, business secrets and personal information. His call comes as Xi Jinping proposed an AI initiative at the Brics summit and Beijing seeks to shape global AI governance.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20SCMP/China's%20intelligence%20chief%20warns%20of%20risks%20from%20AI%20as%20'new%20arena%20for%20strategic%20rivalry'.pdf"}, {"id": "scmp-15sep-08", "title": "Chinese researchers chart 5-stage path toward 'last AI built by humans'", "source": "SCMP", "date": "15 Sep 2026", "tags": ["Technology & AI"], "summary": "Researchers from ByteDance, Tsinghua University, the Shanghai Artificial Intelligence Laboratory and others have outlined a five-stage road map for recursive self-improvement (RSI), aiming to build AI systems that can improve themselves without human intervention. Their joint paper, titled 'The Last AI Built by Humans', describes progressive stages of autonomy: from an AI executing human-designed procedures, to choosing how to upgrade itself, determining what information it needs, and ultimately refining the very methods used to improve AI. Unlike a chatbot correcting one response, RSI requires improvements to persist and be inherited by successor systems. Automating AI research has become a core battleground in US-China competition, though US firms retain an early lead due to superior access to compute resources.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20SCMP/Chinese%20researchers%20chart%205-stage%20path%20toward%20'last%20AI%20built%20by%20humans'.pdf"}, {"id": "scmp-15sep-09", "title": "Handshake or arm-wrestling match? What China's stock traders expect from Xi-Trump meeting", "source": "SCMP", "date": "15 Sep 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "The upcoming meeting between Xi Jinping and Donald Trump, scheduled for September 24 in the US, is on the radar of stock traders in mainland China and Hong Kong, though expectations for substantial results are minimal. Observers say investors have placed the event low among variables likely to jolt markets, paying less attention than to Trump's May state visit. Analysts expect the leaders to extend the current trade agreement and sign some industry-specific pacts while leaving key structural issues unresolved. BNP Paribas' William Bratton cautioned against excitement, forecasting an ongoing commitment to 'constructive strategic stability' and an extension of the tariff truce. Reactions have been subdued: the CSI 300 fell nearly 4 per cent over the past month and the Hang Seng dropped 1 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20SCMP/Handshake%20or%20arm-wrestling%20match%20What%20China's%20stock%20traders%20expect%20from%20Xi-Trump%20meeting.pdf"}, {"id": "scmp-15sep-10", "title": "Hong Kong 5-year plan to stick with capitalism, uphold 'one country, two systems': John Lee", "source": "SCMP", "date": "15 Sep 2026", "tags": ["Politics", "Finance & Markets"], "summary": "Hong Kong's inaugural five-year plan will not change the city's capitalist system but will fully exploit its advantages to map long-term development, Chief Executive John Lee Ka-chiu wrote in an opinion piece in the South China Morning Post. Lee will unveil the plan on Wednesday alongside his annual policy address, aligning with the national blueprint for 2026-2030. Addressing concerns that adopting the mainland practice signalled abandoning laissez-faire, Lee said the plan would uphold the rule of law, capitalist system and 'one country, two systems' without distorting Hong Kong, ensuring free flow of capital, people, goods and information. He said the blueprint ultimately aims to 'enable citizens to flourish' through jobs and upward mobility, citing Xi Jinping's endorsement of the governing principle.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20SCMP/Hong%20Kong%205-year%20plan%20to%20stick%20with%20capitalism,%20uphold%20'one%20country,%20two%20systems'%20John%20Lee.pdf"}, {"id": "scmp-15sep-11", "title": "Hong Kong faces pressure to speed up trading hours review after South Korea's move", "source": "SCMP", "date": "15 Sep 2026", "tags": ["Finance & Markets"], "summary": "Hong Kong's stock market faces renewed pressure to accelerate its review of longer trading hours after South Korea's main bourse extended its session by four hours on Monday, an industry player said. The Korea Exchange launched a real-time after-market from 4pm to 8pm on top of regular trading, signalling ambitions toward nearly 24-hour trading, following Nasdaq and the London Stock Exchange. South Korea now trades 10-and-a-half hours on weekdays, almost double Hong Kong's five-and-a-half hours. In July, HKEX and the Securities and Futures Commission said they were exploring longer hours but gave no details. Tom Chan Pak-lam of the Institute of Securities Dealers said the move reinforces the case for Hong Kong to keep studying phased-in accessibility for global investors.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20SCMP/Hong%20Kong%20faces%20pressure%20to%20speed%20up%20trading%20hours%20review%20after%20South%20Korea's%20move.pdf"}, {"id": "scmp-15sep-12", "title": "Hong Kong's HK$500b silver economy by 2034 offers 'blue ocean' prospects: Paul Chan", "source": "SCMP", "date": "15 Sep 2026", "tags": ["Finance & Markets", "Society"], "summary": "Hong Kong's silver economy is set to become a HK$500 billion (US$63.8 billion) market by 2034, Financial Secretary Paul Chan Mo-po said, urging the elderly care industry to deploy technology and explore cross-border opportunities. Speaking at the 30th anniversary of the Senior Citizen Home Safety Association, Chan said the ageing population presented both a challenge and a 'promising blue ocean' opportunity, with spending by those aged 60 and above potentially growing 47 per cent from about HK$340 billion in 2024 to nearly HK$500 billion by 2034. He said AI and robotics could aid medical diagnosis, daily care and household chores, easing carer burden. Hong Kong's world-class research, funding and talent position it to lead, provided strengths are connected to commercially sustainable services.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20SCMP/Hong%20Kong's%20HK500b%20silver%20economy%20by%202034%20offers%20'blue%20ocean'%20prospects%20Paul%20Chan.pdf"}, {"id": "scmp-15sep-13", "title": "Japan eyes quantum sub-hunting drone sensors as China extends undersea reach", "source": "SCMP", "date": "15 Sep 2026", "tags": ["Defence", "Technology & AI"], "summary": "Japan is looking to develop submarine-detecting quantum sensors for aerial drones, amid a growing undersea competition pitting China against the United States and its allies across the Indo-Pacific. Tokyo's defence budget request for fiscal 2027 includes research into a smaller, more capable quantum magnetic sensor that detects tiny magnetic-field changes revealing a submarine. The Nikkei reported the defence ministry aims to develop the sensor by fiscal 2031, mounted on low-cost drones flying near the sea surface and operating from warships. The move comes as Japan faces cost and personnel pressures. Hudson Institute's Masashi Murano said crewed anti-submarine warfare is extraordinarily expensive, and while such sensors have limited range, deploying many cheap drones around chokepoints Chinese submarines must transit could be far more efficient.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20SCMP/Japan%20eyes%20quantum%20sub-hunting%20drone%20sensors%20as%20China%20extends%20undersea%20reach.pdf"}, {"id": "scmp-15sep-14", "title": "New York City's rich Chinese grapple with Beijing tax rules as enforcement deadline nears", "source": "SCMP", "date": "15 Sep 2026", "tags": ["Finance & Markets", "Society"], "summary": "Beijing's new tax rules for offshore trusts have reached New York City, home to one of the largest concentrations of mainland Chinese wealth outside Asia, after sweeping across Hong Kong and Singapore. Under rules effective July 24, mainland tax residents who transfer property or shares into an offshore trust, or receive distributions, face a 20 per cent tax on realised gains plus annual tax on trust income. A 90-day grace period running to October 22 lets taxpayers settle liabilities dating back to January 2023 without penalties. With the window closing, advisers say affluent families are racing to review cross-border holdings. Larry Ikard of lender Yuvarra reported a clear uptick, noting the greater worry is whether decades-old structures still deliver protection, succession and liquidity as circumstances change.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20SCMP/New%20York%20City's%20rich%20Chinese%20grapple%20with%20Beijing%20tax%20rules%20as%20enforcement%20deadline%20nears.pdf"}, {"id": "scmp-15sep-15", "title": "Oil tanker has exploded in Strait of Hormuz, says Iran's IRGC", "source": "SCMP", "date": "15 Sep 2026", "tags": ["Energy", "Geopolitics"], "summary": "Iran's Islamic Revolutionary Guard Corps said late on Monday that the oil tanker El Gaia struck a sea mine and exploded in the Strait of Hormuz while travelling the southern route, which Iran had mined, according to state broadcaster IRIB. The US military rejected the account, with CENTCOM saying the Panama-flagged tanker had been hit by an Iranian missile last month and struck again by a drone off Oman this weekend, and was being towed by a regional partner. The IRGC's naval command claimed the strait is 'closed and remains under our control', declaring only a northern coastal route safe and charging passage fees. Before the war, about a fifth of the world's oil supply passed through the strait. A Gulf ministers' meeting on the issue was cancelled.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20SCMP/Oil%20tanker%20has%20exploded%20in%20Strait%20of%20Hormuz,%20says%20Iran's%20IRGC.pdf"}, {"id": "scmp-15sep-16", "title": "Qatar seeks stronger logistics ties with China as war disrupts trade routes", "source": "SCMP", "date": "15 Sep 2026", "tags": ["Trade", "Geopolitics"], "summary": "Qatar is stepping up efforts to attract Chinese companies as the US-Israel war on Iran disrupts Gulf trade routes, adding urgency to Chinese firms' push to diversify supply chains and operate closer to customers. Sheikh Khalifa bin Salman al-Thani, chief executive of Qatar-based logistics firm WareOne, said supply-chain diversification is proceeding worldwide. Chinese platforms such as Shein, Temu and AliExpress have expanded across the Middle East alongside EV, tech and consumer businesses. As firms shift from shipping goods to holding inventory and selling locally, they face complex environments across six GCC markets with differing regulations, taxes and registration rules. WareOne offers warehousing, customs clearance, fulfilment and last-mile delivery, connecting merchants with existing capacity rather than requiring them to build their own networks.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20SCMP/Qatar%20seeks%20stronger%20logistics%20ties%20with%20China%20as%20war%20disrupts%20trade%20routes.pdf"}, {"id": "scmp-15sep-17", "title": "Singapore's Chan Chun Sing to visit China, speak at defence forum", "source": "SCMP", "date": "15 Sep 2026", "tags": ["Defence", "Southeast Asia"], "summary": "Singapore's Defence Minister Chan Chun Sing is set to visit China from Tuesday to Thursday at the invitation of his counterpart Dong Jun, and will speak at the Beijing Xiangshan Forum for the second consecutive year. He will meet Dong and other senior Chinese and People's Liberation Army leaders. Defence analysts say ties with Beijing are important for the city state's balancing strategy with Washington, a close strategic partner. This year's forum theme is 'Build Consensus on Stability, Advance Security Governance Together'. Singapore's defence ministry said the visit underscores the 'warm and friendly' bilateral relationship. Analyst Abdul Rahman Yaacob noted that while the US is a critical security partner, a defence partnership with China matters given its global role, with talks and joint exercises building trust.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20SCMP/Singapore's%20Chan%20Chun%20Sing%20to%20visit%20China,%20speak%20at%20defence%20forum.pdf"}, {"id": "scmp-15sep-18", "title": "Southeast Asia weighs energy transition amid LNG supply crunch", "source": "SCMP", "date": "15 Sep 2026", "tags": ["Energy", "Southeast Asia"], "summary": "Energy ministers and executives met in Bangkok for Gastech 2026 to address a prolonged LNG price increase triggered by the Iran war, with Southeast Asia's growth ambitions and climate goals at stake as AI-driven power demand soars. Policymakers implored pragmatism over net-zero targets and closer cooperation to ensure affordable supplies. The region's energy security has been exposed since the US and Israel attacked Iran in late February, closing the Strait of Hormuz and disrupting a fifth of the world's gas supplies, as Petronas CEO Tengku Mohammad Taufik described. Singapore is almost entirely powered by natural gas imported from Malaysia and Indonesia. Host Thailand, facing dwindling reserves, aims to boost LNG handling capacity by 40 per cent, with PM Anutin Charnvirakul calling gas an important foundation while gradually increasing renewables.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20SCMP/Southeast%20Asia%20weighs%20energy%20transition%20amid%20LNG%20supply%20crunch.pdf"}, {"id": "scmp-15sep-19", "title": "Taiwan defence logistics under fire over missing chargers for US drones", "source": "SCMP", "date": "15 Sep 2026", "tags": ["Defence", "Geopolitics"], "summary": "Taiwan's military has taken delivery of 291 one-way attack drones from US maker Anduril Industries, only to find they came without chargers and require American assistance to recharge. The revelation involving the Altius-600M loitering munitions has prompted opposition lawmakers to question procurement and logistics, days before the drones join a live-fire exercise. The controversy comes as Trump is expected to host Xi Jinping in Washington on September 24, with Taiwan arms sales a potential irritant. Reports said chargers were excluded from the US Letter of Offer because original equipment contained mainland Chinese components, failing 'non-red' supply-chain requirements. The army discovered the omission after delivery and asked for an alternative supplier; as of April none had been found. KMT legislator Ma Wen-chun questioned the reliability of such logistics in wartime.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20SCMP/Taiwan%20defence%20logistics%20under%20fire%20over%20missing%20chargers%20for%20US%20drones.pdf"}, {"id": "scmp-15sep-20", "title": "UK's unity threatened by pact between Wales, Scotland and Northern Ireland", "source": "SCMP", "date": "15 Sep 2026", "tags": ["Politics", "Geopolitics"], "summary": "The leaders of Wales, Scotland and Northern Ireland signed a pact on Monday that threatens to lead to the break-up of the United Kingdom. The first ministers of the three semi-autonomous regions told Prime Minister Andy Burnham to prepare for constitutional change and said their future lies with the European Union, declaring in a memorandum of understanding that 'Westminster's time is coming to an end'. The announcement came about 48 hours after Donald Trump said he would 'love to see' a reunified Ireland during a visit to his golf course. It is the first time all three leaders are from pro-independence or, in Northern Ireland's case, pro-unification parties. Burnham's spokesman brushed aside the threat, and Glasgow academic Nicola McEwen said the summit was symbolically important but had no legal significance.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20SCMP/UK's%20unity%20threatened%20by%20pact%20between%20Wales,%20Scotland%20and%20Northern%20Ireland.pdf"}, {"id": "scmp-15sep-21", "title": "US blocks Iran's nuclear chief from Vienna meeting", "source": "SCMP", "date": "15 Sep 2026", "tags": ["Geopolitics", "Politics"], "summary": "Iran's nuclear chief Mohammad Eslami was blocked from attending an annual International Atomic Energy Agency conference in Vienna after US pressure, both Washington and Tehran said. US Energy Secretary Chris Wright confirmed the US applied pressure to stop Eslami, calling him a 'sanctioned individual' whose waiver request was denied. Iranian state TV said Eslami and a delegation took a flight on Saturday but were blocked due to US obstruction. Iranian official Behrouz Kamalvandi accused the US of 'bullying political pressure' and warned it set a precedent affecting everybody. Austria said it requested an exemption for Eslami, who is under a UN travel ban, but the Security Council rejected it over a lack of consensus. Tehran summoned Austria's charge d'affaires, calling the visa refusal unjustified.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20SCMP/US%20blocks%20Iran's%20nuclear%20chief%20from%20Vienna%20meeting.pdf"}, {"id": "scmp-15sep-22", "title": "US has weapons deployed in orbit, Space Force says, for 'offensive and defensive' use", "source": "SCMP", "date": "15 Sep 2026", "tags": ["Defence", "Geopolitics"], "summary": "The United States has weapons deployed in space, the US Space Force said on Monday, confirming the presence of such capabilities in orbit for the first time. A spokesperson said the US has 'on-orbit space control weapons' capable of defending the Joint Force against hostile action, employing kinetic and non-kinetic means for offensive and defensive purposes, without specifying the weapons. Both Russia and China are cited as potential threats to US interests in space, with China developing counter-space capabilities and Russia viewing space as a warfighting domain. The militarisation of space dates to Sputnik's 1957 launch; the 1967 Outer Space Treaty banned weapons of mass destruction in orbit, but the US, Russia, China and India have since explored ways to fight in space, including targeting rivals' satellites.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20SCMP/US%20has%20weapons%20deployed%20in%20orbit,%20Space%20Force%20says,%20for%20'offensive%20and%20defensive'%20use.pdf"}, {"id": "scmp-15sep-23", "title": "Why Shanghai offers hope for China's ailing real estate market", "source": "SCMP", "date": "15 Sep 2026", "tags": ["Finance & Markets"], "summary": "Pockets of resilience in Shanghai's property market could signal a broader recovery across China, even as bearish analysts highlight weak demand. Societe Generale's Albert Edwards flagged the collapse in China's credit impulse and called housing data 'hopeless', with home sales by value in 70 cities contracting 13.2 per cent and property investment plunging 19.2 per cent in the first half. Yet Shanghai stands out: new-home prices rose monthly for 12 of the last 13 months, the longest streak among first-tier cities, and second-hand flat prices have risen for six straight months. Bank of America said the hub is leading the secondary-market recovery. With second-hand listings down 28 per cent from their peak, inventory is being absorbed in a more genuine move toward rebalancing than late 2024's policy-driven bounce.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/15%20Sep%202026/15%20Sep%20SCMP/Why%20Shanghai%20offers%20hope%20for%20China's%20ailing%20real%20estate%20market.pdf"}]}, "2026-09-16": {"date": "2026-09-16", "dayOfWeek": "Wednesday", "totalArticles": 88, "sourceCounts": {"WSJ": 23, "ST": 23, "BT": 24, "SCMP": 18}, "executiveDigest": "Central banks moved to the fore on the eve of decisions: WSJ said 'the Bank of Japan is set to deliver the fastest hike of the cycle as pressure mounts', while 'Fed chief Warsh faces the fight Trump hoped to avoid' before an expected first hike - 'the US dollar ticked up as oil climbed and rate-hike chances firmed', and 'gold held ground awaiting cues'. The Iran war deepened its grip on oil: WSJ called it 'America's must-win Battle of Hormuz' after 'a lightning Houthi offensive grabbed a crucial oil corridor', 'Saudi cancelled cargoes' and 'oil settled US$3 higher', with 'tankers earning US$1 million a day' amid a ship shortage and the war cost 'hitting US$38 billion'. The AI-slowdown split sharpened - 'AI leaders call for a slowdown, but Wall Street keeps buying', and 'OpenAI, Anthropic and Google are working on an AI standards body'. For Singapore, Google is 'ramping up engineering hiring' as AI drives talent demand.", "briefingCards": [{"title": "Lead story - Central-bank super-week: BOJ and Fed poised to hike", "body": "The rate-decision eve dominated: WSJ reported 'the Bank of Japan is set to deliver the fastest hike of the cycle as pressure mounts', and 'Fed leader Kevin Warsh is facing the fight President Trump hoped he would avoid' when he picked him - an expected first hike under his watch. Markets positioned accordingly: BT said 'the US dollar ticked up as oil prices climbed and Fed rate-hike chances firmed', 'gold held ground awaiting policy cues', and flagged that 'junk debt from Asia is beating bonds almost everywhere in 2026'. The data was mixed - 'US incomes hit a record high last year', but 'New York manufacturing decelerated', 'UK payrolls dropped more than expected', and 'the UK labour market stayed soft as a BOE decision looms'. Trump dangled 'US$5,000 for every American adult if Republicans hold Congress'."}, {"title": "Markets & finance", "body": "Beyond the central banks, trade and property framed the tape: BT reported 'China and the US discussed cutting tariffs on agriculture and energy' and 'Bessent defended Trump's policies while revealing plans to meet a Chinese official', even as WSJ said 'the global trading system faces fragmentation at a critical juncture' (WTO). China's economy wobbled - 'new home prices fell for a third straight month', and 'consumption faltered and the investment slump deepened despite a factory rebound'. Corporate signals were firmer: 'Citigroup's CFO expects an equity return above 11% this year', and 'Musk's X Corp and SpaceX resolved an antitrust suit against Apple'. Goldman projected 'Chinese firms' export share reaching 31% by 2035', while SCMP noted 'tighter Hong Kong IPO scrutiny could slow deal flow'."}, {"title": "Asia realignment", "body": "US-China dynamics tilted: SCMP said 'the world is not so much embracing China as recoiling from Trump's US', 'Canada's Trump headache is fuelling a China trade boom', and 'US-China ties remain haunted by a lack of mutual trust' (Xiangshan Forum). Beijing pressed its tech drive - 'China bets on chips and AI in a new five-year road map to challenge US dominance', 'is beating the US in consumer AI adoption thanks to super apps' (Morgan Stanley) - while 'tightening exit restrictions as the tech race intensifies' (WSJ) and 'targeting brokerages' offshore pay loopholes'. Diplomacy churned: 'China urged constructive dialogue with the EU', 'Iran's top diplomat headed to China as Middle East diplomacy falters', and on defence, 'Germany and the US signed an industry pact', 'Japan may spend 3.5% of GDP on defence', and 'Taiwan tested US MQ-9B drones'."}, {"title": "Energy & climate", "body": "The Battle of Hormuz escalated: WSJ framed 'America's must-win Battle of Hormuz' and detailed 'the lightning offensive that saw the Houthis grab a crucial oil corridor', asking 'who will stop the Houthis'. Supply took real hits - 'Saudi cancelled some oil cargoes after a pipeline hit', 'oil settled US$3 higher on the Yanbu disruption', and 'tankers now earn US$1 million a day amid a ship shortage' - though 'the US energy chief said the Saudi pipeline should be back online within days' and 'a US task force is aiding the Saudis with intel'. The war's cost mounted: BT put it at 'US$38 billion, rising US$3 billion a month'. On policy, 'the EPA moved to roll back power-plant emission rules', and 'AWS said it can't restore some data from Mideast facilities struck by Iran'."}, {"title": "Technology & AI", "body": "The slowdown debate turned bitter even as money flowed: WSJ said 'AI leaders are calling for a slowdown, but Wall Street keeps on buying', and 'Steve Bannon and Bernie Sanders agree AI could kill us all'. The industry moved to self-govern - ST reported 'OpenAI, Anthropic and Google are working to create an AI standards body' - but China pushed back hard: BT said 'Chinese state media dismissed the self-serving AI slowdown call' and SCMP reported 'a DeepSeek engineer slammed the pacing calls, invoking Nazi Germany'. Trump weighed in that 'the only guardrail AI needs is a high-IQ president'. Commercial moves continued: 'Inside OpenAI's ad rush', 'the Gates Foundation will spend US$1.27 billion to expand AI access', 'Anthropic launched a Claude tool for financial advisers', and 'Waymo will start a Tokyo robotaxi service'."}, {"title": "Singapore & SEA focus", "body": "AI talent and property led locally: ST reported 'Google is ramping up hiring for its Singapore engineering centre as AI drives demand for tech talent', and BT argued 'as AI firms call for accountability and limits, an opportunity beckons for Singapore'. Property stayed active - 'Malaysian developer Eco World topped bids for a Sin Ming housing plot at S$1,612 psf ppr'. Infrastructure had a wobble as 'NetLink Trust restored internet for about 2,000 in Bishan and Thomson' after an outage. Regionally, BT flagged that 'Asean is disproportionately affected by climate change, which also presents opportunities', 'Micron's Taiwan union pressed profit-sharing demands', and 'South Korea will announce US investment details on Friday' while signing 'an atomic-energy MoU with Kazakhstan'. Anthropic's new adviser tool and Waymo's Tokyo push underscored the region's AI build-out."}], "keyMetrics": [{"value": "88", "label": "Articles curated today", "sub": "WSJ 23 · ST 23 · BT 24 · SCMP 18"}, {"value": "BOJ + Fed", "label": "Hikes on the eve", "sub": "BOJ fastest of cycle; Warsh's fight"}, {"value": "Hormuz", "label": "Houthis grab oil corridor", "sub": "'Must-win' battle; Saudi cargoes cut"}, {"value": "US$38b", "label": "Iran war cost", "sub": "+US$3b a month"}, {"value": "US$1m/day", "label": "Tanker earnings", "sub": "Ship shortage from war"}, {"value": "31% by 2035", "label": "China export share", "sub": "Goldman Sachs"}], "articles": [{"id": "wsj-16sep-01", "title": "A broad measure of American incomes reached a record high last year as upper-income households fared well and women's pay gained ground compared with men", "source": "WSJ", "date": "16 Sep 2026", "tags": ["Society", "Finance & Markets"], "summary": "A Census Bureau report showed a broad measure of American incomes reached a record high in 2025, with median household income rising 2.6% after inflation to $87,460, topping the pre-pandemic peak. Gains skewed toward upper-income households, widening the divide as high earners drive most spending. Women who worked full-time year-round earned about 84 cents for every dollar men earned, up from 81 cents, aided by growth in female-dominated healthcare jobs. Black households saw the largest income gains at 4.8%. The broad poverty measure was 13.1%, little changed, while the official measure fell to 10.2%. About 7.9% lacked health insurance all year, a final reading before ACA subsidy withdrawals took effect in 2026.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20WSJ/A%20broad%20measure%20of%20American%20incomes%20reached%20a%20record%20high%20last%20year%20as%20upper-income%20househ.pdf"}, {"id": "wsj-16sep-02", "title": "AI Leaders Are Calling for a Slowdown, but Wall Street Keeps on Buying", "source": "WSJ", "date": "16 Sep 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Despite warnings from AI leaders Dario Amodei, Sam Altman, Elon Musk and Demis Hassabis about the technology's dangers, Wall Street kept buying AI stocks. Shares of hyperscalers Microsoft, Alphabet and Meta each rose 2% or more Monday as investors rotated out of chipmakers like Micron and Intel toward the customers building data centers. The market bet the hyperscalers would remain highly profitable even if AI spending slowed. President Trump dismissed calls for restraint, calling warnings a 'hoax' and a conspiracy benefiting China. Major indexes fell modestly, with the S&P 500 down 0.5%. Analysts said the technology race with China makes abandoning the AI trade unlikely, even amid extinction-risk warnings.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20WSJ/AI%20Leaders%20Are%20Calling%20for%20a%20Slowdown,%20but%20Wall%20Street%20Keeps%20on%20Buying.pdf"}, {"id": "wsj-16sep-03", "title": "AWS Says It Can't Restore Some Data From Mideast Facilities Struck by Iran", "source": "WSJ", "date": "16 Sep 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "Amazon Web Services said it cannot restore some customer data hosted in Persian Gulf data centers struck by Iranian drones in the spring. Facilities in the United Arab Emirates and Bahrain have been mostly offline since Iran launched drone swarms during the opening days of the U.S. war. Data stored exclusively in Bahrain, and in one U.A.E. availability zone, is beyond restoration. Experts said a cloud region losing customer data to an airstrike is unprecedented. The permanent loss and prolonged blackouts pose a setback for Gulf states seeking to become AI data-processing hubs and add risk for U.S. firms weighing multibillion-dollar investments. Amazon had earlier urged customers to migrate data to other regions.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20WSJ/AWS%20Says%20It%20Can't%20Restore%20Some%20Data%20From%20Mideast%20Facilities%20Struck%20by%20Iran.pdf"}, {"id": "wsj-16sep-04", "title": "America's Must-Win Battle of Hormuz", "source": "WSJ", "date": "16 Sep 2026", "tags": ["Geopolitics", "Energy"], "summary": "In an opinion piece, Reuel Marc Gerecht and Ray Takeyh argue the U.S. faces a must-win struggle over the Strait of Hormuz amid its continuing war with Iran. They warn the U.S. Navy may have only six more months of effective blockade before maintenance shortfalls force compromises. Recent Iran-allied Houthi advances along the Red Sea and a drone strike on Saudi Arabia's East-West pipeline, coupled with Trump's hesitancy, suggest American confusion and Iranian advantage. The authors say economic coercion cannot substitute for war if Tehran escalates militarily, noting Iran's world-class sanctions-evasion network. Without more effective military action or an Iranian economic collapse, they contend, a U.S. victory looks elusive.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20WSJ/America's%20Must-Win%20Battle%20of%20Hormuz.pdf"}, {"id": "wsj-16sep-05", "title": "Bank of Japan Set to Deliver Fastest Hike of Cycle as Pressure Mounts", "source": "WSJ", "date": "16 Sep 2026", "tags": ["Finance & Markets"], "summary": "The Bank of Japan is widely expected to raise its policy rate by a quarter point to 1.25% from 1% this week, marking its fastest hike of the current cycle and the shortest interval since exiting negative rates in March 2024. The move, coming just after a Federal Reserve decision, reflects growing worry that inflation could overshoot the 2% target, with underlying inflation tracking near 2%. Officials cited the Middle East conflict, yen volatility, higher bond yields and AI-related demand. Markets are almost fully pricing the increase. The yen, hovering around 154.80, has been volatile; the BOJ's guidance will be scrutinized for signals on whether tightening will accelerate further.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20WSJ/Bank%20of%20Japan%20Set%20to%20Deliver%20Fastest%20Hike%20of%20Cycle%20as%20Pressure%20Mounts.pdf"}, {"id": "wsj-16sep-06", "title": "Canada Looks to Lure New Investment With Aggressive, Broad Tax Writeoff Terms", "source": "WSJ", "date": "16 Sep 2026", "tags": ["Finance & Markets", "Trade"], "summary": "Canada is implementing an aggressive tax change tied to accelerated write-offs of capital equipment, aiming to advance Prime Minister Mark Carney's goal of attracting nearly $1 trillion of new investment. Dubbed the 'productivity super deduction,' the measure allows immediate, permanent expensing of a broad range of depreciable property, letting businesses fully write off investment costs in the year assets become available. Officials expanded eligibility beyond manufacturing to energy, mining and broadband, covering about two-thirds of capital investment. Analysts called it the most substantial change to Canada's tax code in decades, helping it compete after Trump's tax revamp. Carney said it would give Canada the lowest marginal effective tax rate among G-7 nations.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20WSJ/Canada%20Looks%20to%20Lure%20New%20Investment%20With%20Aggressive,%20Broad%20Tax%20Writeoff%20Terms.pdf"}, {"id": "wsj-16sep-07", "title": "China Tightens Exit Restrictions as Tech Race With U.S. Intensifies", "source": "WSJ", "date": "16 Sep 2026", "tags": ["Geopolitics", "Technology & AI"], "summary": "China imposed sweeping exit restrictions on its citizens and new entry rules for foreigners, tightening scrutiny of individuals deemed to endanger national security, including through violating technology export controls. The measures let the government bar citizens from leaving for months or years for 'criminal activities abroad' threatening national interests. Announced in July by the State Council, the rules reflect Xi Jinping's focus on national security and Beijing's effort to curb the flow of talent and know-how in areas like AI amid an intensifying tech race with Washington. For foreigners, the rules punish false visa information and threaten denials to those on sanctions lists. It marks the first explicit link between export-control violations and exit bans.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20WSJ/China%20Tightens%20Exit%20Restrictions%20as%20Tech%20Race%20With%20U.S.%20Intensifies.pdf"}, {"id": "wsj-16sep-08", "title": "EPA to Roll Back Power-Plant Emission Rules", "source": "WSJ", "date": "16 Sep 2026", "tags": ["Environment", "Energy"], "summary": "The Environmental Protection Agency said it will repeal some carbon-dioxide emission rules for power plants, part of a broader effort to curtail its role in regulating climate change. The move would unwind two key Obama- and Biden-era policies: one cracking down on pollution from coal and newly built natural-gas plants, and another concerning the EPA's authority to regulate climate pollution under the Clean Air Act. Administrator Lee Zeldin called it the largest deregulatory action for the U.S. power sector in American history. Critics, including the World Resources Institute, called it a major retreat and a free ride for fossil-fuel generators, noting the power sector produces roughly a quarter of U.S. climate pollution. Legal challenges are expected.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20WSJ/EPA%20to%20Roll%20Back%20Power-Plant%20Emission%20Rules.pdf"}, {"id": "wsj-16sep-09", "title": "Eurozone Trade Surplus Widened in July", "source": "WSJ", "date": "16 Sep 2026", "tags": ["Trade", "Finance & Markets"], "summary": "The eurozone's adjusted trade surplus widened in July, signaling a boost to the economy from trade at the start of the third quarter despite geopolitical uncertainty. The 21-nation currency area's goods surplus was 5.0 billion euros ($5.77 billion), up from 1.0 billion euros in June, according to Eurostat. Adjusted exports rose 1.2% while imports fell 0.4%, with the gain driven mainly by chemicals, other manufactured goods, and food and drink. Exports from the EU to the U.S. rose 10.7% year-on-year, suggesting resilient American demand despite tariff uncertainty. The bloc's energy trade deficit continued to narrow, though sustaining the improvement could prove difficult with oil prices back above $100 a barrel ahead of winter.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20WSJ/Eurozone%20Trade%20Surplus%20Widened%20in%20July.pdf"}, {"id": "wsj-16sep-10", "title": "Fed leader Kevin Warsh is facing the fight President Trump hoped he would avoid when he selected Warsh as the new central-bank chairman", "source": "WSJ", "date": "16 Sep 2026", "tags": ["Finance & Markets", "Politics"], "summary": "New Federal Reserve Chairman Kevin Warsh, appointed by President Trump in May, faces the fight Trump had hoped to avoid: investors expect the Fed to raise rates this week for the first time in over three years. The outlook has shifted as the war with Iran dragged on and pushed energy prices higher, new tariffs took effect, and the AI build-out strained electricity and equipment supply chains. White House adviser Kevin Hassett said inflation is improving and the Fed need not hike, while conceding Trump wouldn't be 'super happy' about an increase. Standing pat could feed suspicions Warsh is accommodating the president; raising rates before the midterms tests Trump's stated trust in him.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20WSJ/Fed%20leader%20Kevin%20Warsh%20is%20facing%20the%20fight%20President%20Trump%20hoped%20he%20would%20avoid%20when%20he%20se.pdf"}, {"id": "wsj-16sep-11", "title": "Global Trading System Facing Fragmentation or Revamp At 'Critical Juncture,' WTO Says", "source": "WSJ", "date": "16 Sep 2026", "tags": ["Trade", "Geopolitics"], "summary": "The World Trade Organization warned the global trading system is at a 'critical juncture,' saying fragmentation into geopolitical blocs or regional groupings would sharply reduce economic activity by mid-century. In its annual report, the WTO estimated 72% of world goods trade still occurs on non-discriminatory terms, down from 80%, though trade flows grew rapidly, boosted by the AI investment boom. A split into two blocs centered on the U.S. and China would cut global exports 18.6% and output 5.1% by 2050; a free-trade-agreement scenario would cut exports 26.9%. Conversely, 'enhanced cooperation' with lower tariffs could raise exports 17.9% and GDP 2.9%. Chief economist Robert Staiger said the status quo is unsustainable and reform is needed.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20WSJ/Global%20Trading%20System%20Facing%20Fragmentation%20or%20Revamp%20At%20'Critical%20Juncture,'%20WTO%20Says.pdf"}, {"id": "wsj-16sep-12", "title": "Inside OpenAI's Ad Rush", "source": "WSJ", "date": "16 Sep 2026", "tags": ["Technology & AI"], "summary": "OpenAI is rapidly building an advertising business, despite CEO Sam Altman once calling the mix of ads and AI 'uniquely unsettling.' The company aims to create a revenue stream to sustain its free ChatGPT tier and offset soaring computing costs ahead of a planned IPO, and said last month it was on pace for $1 billion in annualized ad revenue. Starting with U.S. tests in February, ads now appear as labeled boxes below AI answers in more than 50 countries. But the fast rollout has produced mixed results, administrative headaches and glitches. NewStreet Research cut its forecast; some advertisers, including Rocket's marketing chief, called performance 'underwhelming.' Early rates of about $60 per 1,000 views have since fallen.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20WSJ/Inside%20OpenAI's%20Ad%20Rush.pdf"}, {"id": "wsj-16sep-13", "title": "New York Manufacturing Activity Decelerated in September", "source": "WSJ", "date": "16 Sep 2026", "tags": ["Finance & Markets"], "summary": "Factory activity in New York State rose only modestly in September after strong August growth, according to the New York Fed's Empire State Manufacturing Survey. The headline index of business conditions came in at 7.6, pulling back sharply from a four-year high of 20.6 in August and below the 15 reading economists polled by The Wall Street Journal had expected. New orders rose slightly while shipments dipped. The number of employees index was 10.6, little changed, but the average workweek index jumped 10 points to 17, suggesting solid growth in hours worked. Pricing pressures intensified, with both prices-paid and prices-received indexes rising five points. Unfilled orders, delivery times and inventories all increased.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20WSJ/New%20York%20Manufacturing%20Activity%20Decelerated%20in%20September.pdf"}, {"id": "wsj-16sep-14", "title": "Officials said the U.S. military has deployed weapons in space, acknowledging for the first time a closely held government secret", "source": "WSJ", "date": "16 Sep 2026", "tags": ["Defence", "Geopolitics"], "summary": "Pentagon leaders said this week the U.S. military has deployed weapons in space, acknowledging for the first time a closely held government secret. For years officials declined to discuss space-based weapons, but Space Force officials say openly acknowledging such capabilities is increasingly important as China and Russia seek to erode America's advantage in orbit. Officials said the decision to discuss the weapons wasn't tied to any specific event. Gen. Douglas Schiess said the military has orbital weapons that can defend against 'space-enabled attacks' but gave no specifics, citing Chinese spacecraft with robotic arms that could grab satellites. Air Force Secretary Troy Meink described U.S. 'on-orbit space control weapons,' part of an effort to normalize military use of space.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20WSJ/Officials%20said%20the%20U.S.%20military%20has%20deployed%20weapons%20in%20space,%20acknowledging%20for%20the%20firs.pdf"}, {"id": "wsj-16sep-15", "title": "President Trump promised $5,000 to every American adult citizen if Republicans hold the House and Senate in the midterms; but the Republicans who would actually need to vote for that aren't sold", "source": "WSJ", "date": "16 Sep 2026", "tags": ["Politics", "Finance & Markets"], "summary": "President Trump promised $5,000 to every American adult citizen if Republicans hold the House and Senate in the midterms, but the Republican lawmakers who would need to approve it aren't sold. The plan, which Trump unveiled at a Dallas GOP convention, would cost more than $1 trillion. Some lawmakers were open to the idea but wanted details on funding; others said it would balloon deficits and fuel inflation. Sen. John Kennedy said he wouldn't vote to borrow $1.2 trillion for checks, and Sen. Lisa Murkowski gave a thumbs down, citing the $40 trillion debt. The White House labeled it a 'Trump dividend' from tariff revenue, but the U.S. still runs deficits near 6% of GDP.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20WSJ/President%20Trump%20promised%205,000%20to%20every%20American%20adult%20citizen%20if%20Republicans%20hold%20the%20Hou.pdf"}, {"id": "wsj-16sep-16", "title": "Russia's Shadow Fleet Is Sailing in NATO's Blind Spot: Irish Waters", "source": "WSJ", "date": "16 Sep 2026", "tags": ["Geopolitics", "Defence"], "summary": "Russia's shadow fleet is increasingly sailing through Irish waters, a NATO blind spot, raising fears about the security of critical undersea infrastructure. About 75% of trans-Atlantic subsea cables carrying data for internet and banking pass through or near waters around Ireland, where suspected Russian shadow-fleet vessels now sail nearly every day. Ireland's defenses are scant: eight patrol ships to cover an area the size of California, no long-range military radar, no combat aircraft, no air defenses and no ability to detect submarines. It allocates just 0.2% of GDP to defense, the EU's lowest, and isn't a NATO member. Officials warn infrastructure vital to Europe and the U.S. is dangerously exposed to Russian interference and sabotage.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20WSJ/Russia's%20Shadow%20Fleet%20Is%20Sailing%20in%20NATO's%20Blind%20Spot%20Irish%20Waters.pdf"}, {"id": "wsj-16sep-17", "title": "Russia, Ukraine Trade Aerial Strikes After Trump's Claim of Truce", "source": "WSJ", "date": "16 Sep 2026", "tags": ["Geopolitics", "Energy"], "summary": "Russia and Ukraine carried out overnight aerial strikes on each other's infrastructure, despite President Trump's announcement that both had agreed to stop hitting energy targets. Ukrainian President Volodymyr Zelensky said Russia continues to attack energy, logistics and critical infrastructure, with targets including gas stations in Kyiv, while Ukraine struck the Syzran oil refinery and a drone production facility in Russia. Partial power cuts hit five Ukrainian regions. Ukraine has offered to halt strikes on Russian oil facilities if Russia stops its bombing campaign. Trump, pressured by rising fuel prices at home, said he told Zelensky to stop hitting Russian diesel. Zelensky gave a more muted account, saying Ukraine would halt strikes only if a mutual agreement is secured.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20WSJ/Russia,%20Ukraine%20Trade%20Aerial%20Strikes%20After%20Trump's%20Claim%20of%20Truce.pdf"}, {"id": "wsj-16sep-18", "title": "Steve Bannon and Bernie Sanders Don't Agree on Much. They Agree AI Could Kill Us All.", "source": "WSJ", "date": "16 Sep 2026", "tags": ["Technology & AI", "Politics"], "summary": "Left-wing Sen. Bernie Sanders and former Trump strategist Steve Bannon, unusual allies, jointly warned that artificial intelligence could destroy humanity without government intervention, urging urgent regulation. Speaking at a 'Pro-Human Assembly' rally, Sanders said regulating AI is neither progressive nor conservative but 'as American as apple pie,' calling Trump's ignorance on the issue embarrassing and Congress asleep at the wheel. Bannon said AI critics had been dismissed as 'bad, dumb and evil.' The comments came a day after Trump called warnings about AI destroying humanity a hoax. Lawmakers and a top OpenAI official said momentum is building for the first federal AI regulations, but Trump's opposition, disagreements over rules and a tight pre-midterm calendar limit prospects.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20WSJ/Steve%20Bannon%20and%20Bernie%20Sanders%20Don't%20Agree%20on%20Much.%20They%20Agree%20AI%20Could%20Kill%20Us%20All..pdf"}, {"id": "wsj-16sep-19", "title": "The Lightning Offensive That Saw the Houthis Grab a Crucial Oil Corridor", "source": "WSJ", "date": "16 Sep 2026", "tags": ["Geopolitics", "Energy"], "summary": "Yemen's Tehran-backed Houthi rebels seized a crucial maritime chokepoint in a weekend lightning offensive, further imperiling global energy supplies and injecting the group into the Iran war. On Friday they took Perim Island in the 18-mile-wide Bab al-Mandeb Strait, the Red Sea's equivalent of the Strait of Hormuz. The group had prepared for months, moving weapons and thousands of troops near the port of Mokha and exploiting control of Yemeni telecoms to spy on rivals. The offensive reflects the ambition of leader Abdulmalik Al-Houthi's 350,000-strong army and its prowess with missiles and drones. Having survived last year's American bombing campaign, the Houthis now hold one of the world's most important energy corridors and must be reckoned with.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20WSJ/The%20Lightning%20Offensive%20That%20Saw%20the%20Houthis%20Grab%20a%20Crucial%20Oil%20Corridor.pdf"}, {"id": "wsj-16sep-20", "title": "The U.S. is pressuring Mexico to accept new rules for exports of AI hardware to prevent Chinese companies and other foreign firms from circumventing tariffs", "source": "WSJ", "date": "16 Sep 2026", "tags": ["Trade", "Technology & AI"], "summary": "The U.S. is pressuring Mexico to accept new rules for exports of AI hardware to prevent Chinese and other foreign firms from circumventing tariffs, people familiar with the negotiations said. The proposal would limit non-North American components in AI hardware such as chips and servers, which have become Mexico's top export to the U.S., surpassing automobiles this year. The talks are part of revising the U.S.-Mexico-Canada Agreement, which Trump has threatened to abandon. A new round of talks is expected in Washington as soon as next week, also covering possible reductions in steel, aluminum and auto tariffs. Sen. Bernie Moreno said the aim is to stop China from using Mexico as a gateway to bypass trade restrictions.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20WSJ/The%20U.S.%20is%20pressuring%20Mexico%20to%20accept%20new%20rules%20for%20exports%20of%20AI%20hardware%20to%20prevent%20Ch.pdf"}, {"id": "wsj-16sep-21", "title": "The housing market is approaching the highest mortgage rate since January 2025, likely spooking home buyers and home builders even more", "source": "WSJ", "date": "16 Sep 2026", "tags": ["Finance & Markets"], "summary": "The U.S. housing market is nearing its highest mortgage rate since January 2025, likely spooking buyers and builders. Thirty-year fixed rates averaged 6.76% last week per Freddie Mac, but daily rates have since surpassed 7% according to Mortgage News Daily. Economists say the 7% milestone, while not itself decisive for affordability, will further deter buyers already facing record home prices. The 30-year rate tracks the 10-year Treasury yield, which briefly broke 5% Monday. The Federal Reserve is expected to raise rates Wednesday for the first time in three years. This year's run-up, driven mainly by the war in Iran, has hurt a market in its fourth year of stagnant sales; existing-home sales fell 2% in August to the lowest since June 2024.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20WSJ/The%20housing%20market%20is%20approaching%20the%20highest%20mortgage%20rate%20since%20January%202025,%20likely%20spo.pdf"}, {"id": "wsj-16sep-22", "title": "U.K. Labor Market Remains Soft as BOE Rate Decision Looms", "source": "WSJ", "date": "16 Sep 2026", "tags": ["Finance & Markets"], "summary": "The U.K. labor market remained soft in the three months through July, with unemployment near a five-year high at 4.9%, unchanged from the prior period and in line with economists' expectations, the Office for National Statistics said. Payrolled employees continued to fall, particularly in retail and hospitality, while vacancies stayed at their lowest outside the pandemic in more than a decade. Annual wage growth excluding bonuses was 3.5%. The data come ahead of the Bank of England's rate decision Thursday, with labor-market weakness reinforcing expectations the bank will hold its key rate at 3.75%. August inflation, due Wednesday, is expected above 3%. Economists said soft wage growth and hiring reluctance amid geopolitical uncertainty could rein in expectations for further rate hikes.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20WSJ/U.K.%20Labor%20Market%20Remains%20Soft%20as%20BOE%20Rate%20Decision%20Looms.pdf"}, {"id": "wsj-16sep-23", "title": "Who Will Stop the Houthis?", "source": "WSJ", "date": "16 Sep 2026", "tags": ["Geopolitics", "Defence"], "summary": "In an editorial, The Wall Street Journal's board argues that Houthi advances in Yemen and the Red Sea are raising the stakes of the Iran war beyond the Strait of Hormuz and asks who will stop them. The Tehran-backed group captured a pair of islands near the Bab al-Mandab Strait after seizing Perim Island and the port of Mokha, threatening Saudi Arabia's strategy of exporting oil via its East-West pipeline to the Red Sea. That pipeline was closed after an Iraqi militia drone attack, helping push Brent crude above $108 a barrel. The board warns of risks to Saudi Arabia, Israel and Egypt, and argues a regional military response requiring ground troops is needed, though it is unclear who would lead it.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/16%20Sep%202026/16%20Sep%20WSJ/Who%20Will%20Stop%20the%20Houthis.pdf"}, {"id": "st-16sep-01", "title": "AI Armageddon looks different from China", "source": "ST", "date": "16 Sep 2026", "tags": ["Techno
