 its own Storm Shadow missiles. Zakharova also threatened France and criticised UK PM Andy Burnham. The warning followed Russia's accusation that Ukraine hit a Donetsk shopping centre; a monitoring group estimates 327 civilians were killed inside Russia in seven months, a war-high rate.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20ST/Russia%20says%20it%20could%20strike%20UK%20military%20targets%20in%20response%20to%20Kyiv's%20use%20of%20British%20missi.pdf"},{"id":"st-16","title":"Russia's foreign spy chief confirms he held talks with CIA director in Moscow","source":"ST","date":"28 Aug 2026","tags":["Geopolitics"],"summary":"Sergei Naryshkin, head of Russia's SVR foreign intelligence service, confirmed on Aug 27 he held a \"working-level meeting\" with CIA director John Ratcliffe in Moscow earlier in the week, discussing sensitive matters within their agencies' remit, and called the encounter \"nothing unusual.\" US President Donald Trump described Ratcliffe's visit — coming as the Ukraine war drags on and US-Iran peace efforts stall — as \"semi-routine,\" while the Kremlin stayed tight-lipped about the substance. At least two US media outlets, citing their own sources, reported Ratcliffe warned Russia not to attack any NATO member state, though neither Washington nor Moscow has confirmed that account.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20ST/Russia's%20foreign%20spy%20chief%20confirms%20he%20held%20talks%20with%20CIA%20director%20in%20Moscow.pdf"},{"id":"st-17","title":"S'pore does not support 'cheating' on tariffs, in talks with US on trade probes: DPM Gan","source":"ST","date":"28 Aug 2026","tags":["Trade","Southeast Asia"],"summary":"Singapore raised concerns over recent US trade probes in talks with US Trade Representative Jamieson Greer, DPM and Trade Minister Gan Kim Yong said on Aug 27 after his US trip. Since July 24 the US has imposed a 12.5 per cent tariff on some Singapore exports, alleging failure to enforce a forced-labour import ban, which Singapore denies; a Section 301 probe into \"structural excess capacity\" continues, and Washington flagged Singapore as a transhipment risk. Gan said Singapore does not use forced labour and opposes \"cheating\" on rules of origin, citing an Aug 14 charge against a firm mislabelling China-made mattresses. Both sides seek a \"practical solution\" preserving preferential tariffs. He also addressed AI's impact on jobs and Singapore's need to stay relevant as a trade hub.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20ST/S'pore%20does%20not%20support%20'cheating'%20on%20tariffs,%20in%20talks%20with%20US%20on%20trade%20probes%20DPM%20Gan.pdf"},{"id":"st-18","title":"S'pore-based Apex Logistics 'fully cooperating' in US probe into alleged smuggling of Nvidia chips","source":"ST","date":"28 Aug 2026","tags":["Technology & AI","Trade"],"summary":"Singapore-based Apex Logistics is \"fully cooperating\" with US authorities probing its alleged role in smuggling Nvidia AI chips to China, owner Kuehne+Nagel told The Straits Times on Aug 27. The Swiss group, which fully acquired Apex in October 2025, said it had not been contacted and called it an \"isolated matter\" within a wider US investigation. Bloomberg reported the probe could yield the first US action against a transport firm over illegal semiconductor trade, involving Nvidia-powered servers routed from Taiwan via the US and Southeast Asia to Hong Kong, then driven into mainland China. Apex said it was aware of US concerns over 2024 shipments forwarded to prohibited locations. Washington has restricted high-end AI chip sales to China since 2022, amid a wider transhipment crackdown.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20ST/S'pore-based%20Apex%20Logistics%20'fully%20cooperating'%20in%20US%20probe%20into%20alleged%20smuggling%20of%20Nvid.pdf"},{"id":"st-19","title":"Singapore has to keep reinventing itself as global environment changes: SM Lee","source":"ST","date":"28 Aug 2026","tags":["Southeast Asia","Politics"],"summary":"Singapore must keep reinventing itself amid an uncertain global environment, Senior Minister Lee Hsien Loong said on Aug 27 in a lecture at Nazarbayev University in Astana, Kazakhstan, where he received an Honorary Professorship. Lee said Singapore has \"repeatedly had to reinvent\" itself to overcome setbacks and now faces \"another turning point\" as major-power rivalry intensifies, the US reassesses its global role and \"multilateralism is breaking down.\" He outlined five priorities: staying open and outward-looking, supporting multilateralism via \"coalitions of the willing,\" combining market discipline with an activist state, remaking the economy including AI adoption, and, most critically, keeping Singaporeans united through inclusive growth. He traced Singapore's economic pivots since the 1950s, cautioning its model cannot simply be copied elsewhere.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20ST/Singapore%20has%20to%20keep%20reinventing%20itself%20as%20global%20environment%20changes%20SM%20Lee.pdf"},{"id":"st-20","title":"Taiwan parliament rejects government military drone plan, passes own version","source":"ST","date":"28 Aug 2026","tags":["Defence","Politics"],"summary":"Taiwan's opposition-controlled parliament on Aug 27 rejected a T$210 billion ($6.6 billion) special-budget government plan to buy about 210,000 military drones by 2031, passing its own version instead. The opposition's proposal totals T$240 billion over six years from the annual budget, capping annual spending at T$40 billion in principle. The government argued the wars in Ukraine and Iran show uncrewed weapons' importance amid rising Chinese pressure and warned the plan could not wait; the defence ministry expressed regret, noting US backing. Kuomintang lawmaker Hsu Chiao-hsin said the government \"cannot simply come asking for money without oversight.\" Defence Minister Wellington Koo said the T$40 billion cap is too low, as the ministry planned to spend T$42.1 billion on drones in 2027 alone.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20ST/Taiwan%20parliament%20rejects%20government%20military%20drone%20plan,%20passes%20own%20version.pdf"},{"id":"st-21","title":"Thailand to shift from LNG towards renewables in wake of Iran war","source":"ST","date":"28 Aug 2026","tags":["Energy","Southeast Asia"],"summary":"Thailand plans to shift away from imported gas toward renewables and nuclear power to build an energy system less exposed to shocks like the Iran war, Energy Minister Akanat Promphan said. In an updated 25-year national power plan due in October, Thailand aims to generate 60 per cent of electricity from clean sources such as solar, wind and hydro within 25 years, double the previous goal and up from about 15 per cent today. It currently draws over 60 per cent from mostly imported natural gas, leaving it exposed to LNG price surges. The plan includes nuclear for the first time, studying small modular reactors, as power demand rises from data-centre and manufacturing investment. Akanat defended a 200 billion baht (S$7.7 billion) renewable spending proposal, including rooftop solar for villages.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20ST/Thailand%20to%20shift%20from%20LNG%20towards%20renewables%20in%20wake%20of%20Iran%20war.pdf"},{"id":"st-22","title":"Trump says Russia's Putin will not attack NATO territory, downplays Ratcliffe trip","source":"ST","date":"28 Aug 2026","tags":["Geopolitics"],"summary":"US President Donald Trump said on Aug 27 that Russian President Vladimir Putin \"is not going to attack a NATO territory,\" playing down media reports that CIA director John Ratcliffe had warned Russian officials against such an attack during a Moscow visit. Speaking in the Oval Office and to Axios, Trump said there would be no attack and that Ratcliffe carried no particular message, describing routine six-monthly contacts and a \"very good relationship\" between the CIA chief and his Russian counterpart. European and US intelligence officials have long tracked Russian sabotage and grey-zone activity in Europe that falls below the threshold of war and aims to weaken NATO unity and support for Ukraine.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20ST/Trump%20says%20Russia's%20Putin%20will%20not%20attack%20NATO%20territory,%20downplays%20Ratcliffe%20trip.pdf"},{"id":"st-23","title":"Trump says US is not talking to Iran with economic war in focus","source":"ST","date":"28 Aug 2026","tags":["Geopolitics","Energy"],"summary":"US President Donald Trump said on Aug 27 that Washington is not talking to Iran as it focuses on economic pressure, vowing to penalise countries doing business with Tehran. \"We don't want to speak to them,\" he told reporters. Press secretary Karoline Leavitt said \"Operation Economic Outcast\" would continue until Iran negotiates meaningfully, while Treasury Secretary Scott Bessent had warned on Aug 24 of secondary sanctions on \"Economic D-Day,\" though no penalties were imposed. Asked about Russia, Trump said Moscow \"behaved quite well\" over the Strait of Hormuz; on sanctioning Chinese banks he said \"I don't have to announce everything.\" Qatar's PM visited Tehran the same day to relaunch diplomacy after the standoff Iran called \"all-out economic war.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20ST/Trump%20says%20US%20is%20not%20talking%20to%20Iran%20with%20economic%20war%20in%20focus.pdf"},{"id":"st-24","title":"Trump signs order to rename Lake Ontario as Lake America, escalating Canada feud","source":"ST","date":"28 Aug 2026","tags":["Politics","Geopolitics"],"summary":"US President Donald Trump signed an order on Aug 27 renaming Lake Ontario \"Lake America,\" escalating his feud with Canada after trade talks collapsed and tariffs hit tens of billions in cross-border trade. Trump, who earlier renamed the Gulf of Mexico the \"Gulf of America,\" said the change was effective immediately and something he had long considered. Lake Ontario, one of the five Great Lakes, borders both Canada's Ontario province and New York, with about 52 per cent of its surface in Canada under a 1909 treaty. Canadian PM Mark Carney dismissed the move on X, noting the 400-year-old name predates both Canadian Confederation and US independence. A May Reuters/Ipsos poll found 72 per cent of Americans view Canada favourably, twice Trump's own approval rating.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20ST/Trump%20signs%20order%20to%20rename%20Lake%20Ontario%20as%20Lake%20America,%20escalating%20Canada%20feud.pdf"},{"id":"st-25","title":"Zelenskiy's top aide says Ukraine-Russia talks may be possible in September","source":"ST","date":"28 Aug 2026","tags":["Geopolitics"],"summary":"Talks between Ukrainian and Russian teams, possibly including US representatives, could be held in September, Ukrainian president's chief of staff Kyrylo Budanov said on Aug 27. Budanov said Kyiv was aiming to revive negotiations, with developments likely next month, adding American involvement was essential: \"We can't do without them.\" US-led peace talks stalled this year as Ukraine refused Russian demands to cede more territory and Washington grew preoccupied with the Iran conflict. President Volodymyr Zelenskiy recently said Ukraine saw a window for US mediation until the end of next summer and had drafted a one-page set of ideas with US and European officials to present to Moscow. The last trilateral Ukraine-Russia talks with US representatives were in February.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20ST/Zelenskiy's%20top%20aide%20says%20Ukraine-Russia%20talks%20may%20be%20possible%20in%20September.pdf"},{"id":"bt-01","title":"China's industrial profit growth cools as AI-linked sectors outpace others","source":"BT","date":"28 Aug 2026","tags":["Finance & Markets","Technology & AI"],"summary":"Profit at China's industrial firms grew 11.2 per cent year-on-year in July, down from 15.1 per cent in June, while January-July profit slowed to 17.6 per cent from 18.7 per cent in the first half, NBS data showed on Aug 27. Rising input costs squeezed margins even as revenue stayed stable, said ANZ's Zhaopeng Xing. Export-linked, high-tech sectors were bright spots: computer, communication and electronic equipment jumped 110 per cent, non-ferrous metal smelting 91.8 per cent, and fibre optics soared 468.4 per cent. Consumer-facing and property-related industries suffered from subdued domestic demand; Kweichow Moutai posted a 2 per cent H1 net-profit fall. China's vice-finance-minister pledged additional fiscal support after third-quarter momentum faded.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20BT/China's%20industrial%20profit%20growth%20cools%20as%20AI-linked%20sectors%20outpace%20others.pdf"},{"id":"bt-02","title":"Dollar recoups some losses as focus shifts to Fed remarks at Jackson Hole","source":"BT","date":"28 Aug 2026","tags":["Finance & Markets"],"summary":"The US dollar recovered some of last week's losses on Aug 27 as investors awaited Fed policy signals at the Jackson Hole symposium, after data showed July inflation stickier than expected. The euro slipped 0.1 per cent to US$1.1639, sterling dipped to US$1.3577 and the yen eased to 159.45 per dollar. The dollar index sat at 99.158, up 0.3 per cent on the week after last week's 0.8 per cent drop. Brown Brothers Harriman's Elias Haddad said US economic outperformance supports the dollar but expects rates unchanged this year. Traders price no September change but a 74 per cent chance of a 25bp-plus hike by December. Chair Kevin Warsh's Friday remarks are the key focus; the Canadian dollar held steady amid US-Canada trade tension.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20BT/Dollar%20recoups%20some%20losses%20as%20focus%20shifts%20to%20Fed%20remarks%20at%20Jackson%20Hole.pdf"},{"id":"bt-03","title":"ECB officials discussed need for 'mildly restrictive' policy","source":"BT","date":"28 Aug 2026","tags":["Finance & Markets"],"summary":"ECB officials discussed whether \"mildly restrictive\" monetary policy could be needed to return inflation to the 2 per cent target, according to the account of the July 22-23 meeting published on Aug 27. Some would have backed a July rate increase, but all members rallied behind keeping rates unchanged. With euro-area inflation near 3 per cent, well above target, and growth stronger than expected, officials are widely expected to raise borrowing costs in two weeks, following June's initial hike. Hawkish board member Isabel Schnabel said rates must rise further amid the Middle East conflict and robust growth; dovish colleague Piero Cipollone warned against excessive tightening. The deposit rate stands at 2.25 per cent, with chief economist Philip Lane indicating 2.5 per cent is the upper neutral limit.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20BT/ECB%20officials%20discussed%20need%20for%20'mildly%20restrictive'%20policy.pdf"},{"id":"bt-04","title":"Economists see RBA rate hike as early as September after hot CPI","source":"BT","date":"28 Aug 2026","tags":["Finance & Markets"],"summary":"Australia's hot inflation spurred economists at Goldman Sachs and Commonwealth Bank to predict another RBA rate hike as early as September, abandoning no-change calls. CBA forecast a quarter-point hike to 4.6 per cent in November with a September risk, saying data would make the RBA \"lose patience.\" ANZ and Goldman also see November; Deutsche Bank's Phil Odonaghoe and NAB's Sally Auld shifted to September, citing \"intolerably high\" underlying inflation. Australian bonds slid for three days, with three-year yields up seven basis points to 4.67 per cent as traders fully priced a November hike and roughly 50-50 odds for September. The RBA raised rates at its first three 2026 meetings to 4.35 per cent. Westpac and HSBC kept hold calls; Q2 GDP and labour data are next.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20BT/Economists%20see%20RBA%20rate%20hike%20as%20early%20as%20September%20after%20hot%20CPI.pdf"},{"id":"bt-05","title":"Energy security cannot be the forgotten pillar of the energy transition","source":"BT","date":"28 Aug 2026","tags":["Energy","Environment"],"summary":"In a commentary, the CEO of Yinson Production argues energy security must not become the \"forgotten pillar\" of the energy transition. While developed economies focus on how quickly to decarbonise, many developing nations across Africa, Latin America and South-east Asia first need reliable, affordable power. Around 655 million people still lack electricity and roughly two billion rely on polluting cooking fuels, per the WHO and IEA. Rising demand from electrification, AI and data centres means the world faces an era of \"energy addition,\" requiring a mix of sources. Oil and gas, including offshore, still power industries and fund development in countries such as Ghana. A successful transition balances affordability, sustainability and security; Yinson invests in emissions reduction and carbon capture and storage.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20BT/Energy%20security%20cannot%20be%20the%20forgotten%20pillar%20of%20the%20energy%20transition.pdf"},{"id":"bt-06","title":"Gold drifts higher as investors weigh Fed rate path","source":"BT","date":"28 Aug 2026","tags":["Finance & Markets"],"summary":"Gold drifted higher on Aug 27 as currency-debasement fears lingered and attention turned to Fed chair Kevin Warsh's Jackson Hole remarks. Spot gold rose 0.8 per cent to US$4,630.09 an ounce and US futures gained 0.7 per cent to US$4,685.50. Oanda's Kelvin Wong said the debasement narrative plus US budget-deficit concerns support gold medium-term; prices rose more than 5 per cent last week after the US Treasury expanded purchases of older long-dated bonds. Markets price a 36.5 per cent chance of a September US rate hike and 72.7 per cent by December. July inflation held steady, above the Fed's 2 per cent target for a 65th straight month. Silver gained 1.7 per cent to US$69.28, platinum rose to US$1,848.57 and palladium firmed to US$1,334.49.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20BT/Gold%20drifts%20higher%20as%20investors%20weigh%20Fed%20rate%20path.pdf"},{"id":"bt-07","title":"HSBC mulls restructuring Singapore units to simplify operations","source":"BT","date":"28 Aug 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"HSBC is planning to overhaul its Singapore operations by combining wholesale, retail and private banking under one entity to streamline its structure, according to people familiar. The move is part of CEO Georges Elhedery's two-year restructuring drive; in July HSBC agreed to sell its Singapore insurance unit for US$2.1 billion. The bank said it continues reviewing its structure for simplification, with all Asia-Pacific entities remaining under The Hongkong and Shanghai Banking Corporation. HSBC incorporated its Singapore retail and wealth business in 2016 and also runs a separate branch. It plans a global AI centre and more than 100 AI hires. Singapore generated US$774 million in H1 pre-tax profit versus Hong Kong's US$7.8 billion. Rival Standard Chartered made a similar consolidation in 2019.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20BT/HSBC%20mulls%20restructuring%20Singapore%20units%20to%20simplify%20operations.pdf"},{"id":"bt-08","title":"Hormuz oil flows rising as Gulf giants' ramp up gathers pace","source":"BT","date":"28 Aug 2026","tags":["Energy","Geopolitics"],"summary":"Crude flows through the Strait of Hormuz are creeping higher, to about six million to eight million barrels a day, as Middle East producers boost exports despite Iran's lingering threat to shipping, keeping global prices in check. Flows slipped in July after Iranian tanker attacks broke an interim ceasefire, and remain roughly half pre-war levels. Trump said 24 boats crossed Hormuz overnight. Record supertanker earnings incentivise crossings, with tankers doing shuttle runs and transferring cargoes outside the Gulf; every major regional supplier bar Iran now sells for collection outside Hormuz. Saudi Arabia, Iraq, Qatar and Kuwait are ramping up, while Iran's exports stay halted by a US blockade. Brent traded near US$88. About 1.6 million bpd of regional refining capacity remains offline.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20BT/Hormuz%20oil%20flows%20rising%20as%20Gulf%20giants'%20ramp%20up%20gathers%20pace.pdf"},{"id":"bt-09","title":"Iran sets conditions for reopening Strait of Hormuz, top official Rezaei says","source":"BT","date":"28 Aug 2026","tags":["Geopolitics","Energy"],"summary":"Iran is preparing a list of conditions for reopening the Strait of Hormuz after mediators asked Teheran to set them out, said Supreme National Security Council secretary Mohsen Rezaei, with ending the regional war among them. Rezaei said Iran and Oman agreed on a shipping corridor split between Omani and Iranian waters, with ships using a designated central channel if the US meets Iran's conditions. Iran's Revolutionary Guards said the two countries agreed to share control and revenues; a spokesperson said Iran will not reopen it unless Washington lifts its port blockade, pays compensation and removes sanctions. Before the war began in February, the strait carried roughly a fifth of global oil and LNG shipments; traffic has largely stopped. April and June ceasefires failed.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20BT/Iran%20sets%20conditions%20for%20reopening%20Strait%20of%20Hormuz,%20top%20official%20Rezaei%20says.pdf"},{"id":"bt-10","title":"Meta took aim at Anthropic. It's also one of the AI firm's largest customers","source":"BT","date":"28 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Meta CEO Mark Zuckerberg recently criticised rival Anthropic, warning in a 6,500-word Aug 10 essay that leading AI labs seek to consolidate power while painting the future as \"filled with doom.\" Yet Meta is privately one of Anthropic's largest customers, per five people; it internally projected spending as much as US$10 billion annually on Anthropic's models. Meta uses those models to power and test a coming AI product, Hatch, described by Zuckerberg as a personal \"agent.\" Meta has cut some spending but still spends hundreds of millions monthly. Leaders know their spending could affect Anthropic ahead of an IPO that could value it at US$2 trillion; AI head Nat Friedman noted using rival tools could lower Anthropic's pre-IPO revenue. Both firms declined to comment.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20BT/Meta%20took%20aim%20at%20Anthropic.%20It's%20also%20one%20of%20the%20AI%20firm's%20largest%20customers.pdf"},{"id":"bt-11","title":"Nvidia adds US$442 billion after robust forecast sparks second-biggest stock surge ever","source":"BT","date":"28 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Nvidia added US$442 billion to its market value on Aug 27, the second-largest one-day gain by any stock in history. Shares jumped 8.7 per cent, their biggest advance since April 2025, after a robust forecast that revenue will expand about 70 per cent next fiscal year, well above expectations of around 45 per cent. Nvidia, the world's largest company, is valued around US$5.5 trillion; the gain trails only Microsoft's US$450 billion surge a month earlier. Bloomberg Intelligence called the \"jaw-dropping\" guide worth more than US$100 billion of potential upside; JPMorgan said the supply-constrained outlook is likely still conservative. Nvidia previously held the record with a US$440 billion gain after Trump's April 2025 tariff pause, and also holds the largest one-day loss, nearly US$600 billion amid DeepSeek concerns.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20BT/Nvidia%20adds%20US442%20billion%20after%20robust%20forecast%20sparks%20second-biggest%20stock%20surge%20ever.pdf"},{"id":"bt-12","title":"Oil rises on fresh doubts over outlook for US-Iran diplomacy","source":"BT","date":"28 Aug 2026","tags":["Energy","Geopolitics"],"summary":"Oil rose on signs that diplomatic efforts over the Strait of Hormuz hit stumbling blocks, casting doubt on a sustained increase in energy flows. West Texas Intermediate rose 1.6 per cent to settle near US$84 a barrel, while Brent for October was near US$90 and the November contract closed under US$89. Prices gained after Trump was reported to have told mediators he is uninterested in returning to a June ceasefire with Iran, dashing hopes an Iran-Oman revenue-sharing deal would pave a broader agreement. Qatar's PM met Iran's negotiator Mohammad Bagher Ghalibaf; White House press secretary Karoline Leavitt said the US is not negotiating and the blockade stays. Oil is up more than 45 per cent in 2026. A tanker was hit by a projectile in Hormuz this week.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20BT/Oil%20rises%20on%20fresh%20doubts%20over%20outlook%20for%20US-Iran%20diplomacy.pdf"},{"id":"bt-13","title":"Seatrium, Petrobras eye potential natural gas collaboration to meet growing Asian demand","source":"BT","date":"28 Aug 2026","tags":["Energy","Southeast Asia"],"summary":"Brazil's Petrobras and Singapore offshore-and-marine player Seatrium are discussing a potential natural gas tie-up to meet growing Asian demand, CEOs Magda Chambriard and Chris Ong said on Aug 27 at a christening ceremony for two FPSO vessels bound for Brazil's Buzios field. Chambriard is exploring how Seatrium can help liquefy gas offshore for export to Asia, the fastest-growing gas market. Ong said Seatrium is very focused on LNG beyond FPSOs, eyeing floating LNG platforms and FSRUs. Seatrium is pursuing S$7 billion of African FLNG opportunities and S$2 billion of Asia-Pacific FSRU and powership projects. FPSOs Petrobras 80 and 82 will sail in September and October, lifting Brazil's output. Seatrium recently resolved a Car Wash-linked case, paying US$57 million under a deferred prosecution agreement.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20BT/Seatrium,%20Petrobras%20eye%20potential%20natural%20gas%20collaboration%20to%20meet%20growing%20Asian%20demand.pdf"},{"id":"bt-14","title":"Singapore cannot assume economic growth will create as many jobs amid AI shift: Gan Kim Yong","source":"BT","date":"28 Aug 2026","tags":["Southeast Asia","Technology & AI","Trade"],"summary":"Singapore cannot assume economic growth will translate into the same level of job creation as AI transforms work, said Deputy Prime Minister and Trade Minister Gan Kim Yong on Aug 27 at the Economic Society of Singapore's 70th anniversary dinner. AI may let firms produce more with fewer workers, and some roles will change, shrink or disappear, though he warned against alarmism and immediate economy-wide losses. He urged job redesign, training and \"career bridges,\" with faster labour-market response via tripartite partners. Roles in care, health and skilled trades remain valuable. Gan said Singapore must move \"from being open to being relevant,\" building hard-to-replicate advantages and shifting \"from moving things to determining how things move.\" He also updated on US talks covering forced labour, excess capacity, transhipment and tariffs.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20BT/Singapore%20cannot%20assume%20economic%20growth%20will%20create%20as%20many%20jobs%20amid%20AI%20shift%20Gan%20Kim%20Yon.pdf"},{"id":"bt-15","title":"Singapore plays premium data centre game as Johor, Batam take on scale","source":"BT","date":"28 Aug 2026","tags":["Technology & AI","Southeast Asia","Energy"],"summary":"Singapore is carving out a premium role in the region's data centre boom, prioritising higher-value, resource-efficient workloads rather than competing with Johor and Batam on capacity, analysts said. With land and power scarce, it targets data-sovereignty and latency-sensitive workloads. DC Byte's Vivian Wong estimated space-only co-location rates of US$300 to US$400 per kilowatt monthly, triple those in Johor and Batam. Singapore's second Data Centre Call for Application drew more than 20 applicants for four 50MW allocations, won by Digital Realty, Keppel, ST Telemedia and Equinix. Operators must power at least half of new capacity from green sources via renewable-energy certificates, virtual power purchase agreements or alternative energy. Analysts see complementary rather than directly competing regional roles.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20BT/Singapore%20plays%20premium%20data%20centre%20game%20as%20Johor,%20Batam%20take%20on%20scale.pdf"},{"id":"bt-16","title":"SoftBank in talks to buy stake in humanoid developer 1X at US$6 billion valuation: report","source":"BT","date":"28 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"SoftBank is in talks to buy a majority stake in OpenAI-backed humanoid robot developer 1X Technologies in a deal that would value the startup at about US$6 billion, The Information reported on Aug 26, citing people with knowledge of the deal. Reuters could not immediately confirm the report; SoftBank declined to comment and 1X did not respond. The talks are ongoing and terms could change. OpenAI and 1X discussed a possible acquisition last year, and OpenAI invested in 1X in 2023 through its OpenAI Startup Fund, alongside Tiger Global and Norway-based investors. The deal builds on SoftBank's broader push into robotics, following its agreement last year to acquire Swiss engineering group ABB's robotics business for US$5.4 billion.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20BT/SoftBank%20in%20talks%20to%20buy%20stake%20in%20humanoid%20developer%201X%20at%20US6%20billion%20valuation%20report.pdf"},{"id":"bt-17","title":"UOB prices landmark US$1.2 billion dual-tranche euro covered bond offering","source":"BT","date":"28 Aug 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"UOB priced a one-billion-euro (US$1.2 billion) dual-tranche covered bond, the first executed by an Asian issuer, the bank said on Aug 27. Offered under its US$15 billion Global Covered Bond Programme with two- and five-year tenors, it marked the first two-year euro covered bond from an Asia-Pacific issuer since 2023. Demand was \"exceptionally strong\": peak combined order books topped 4.25 billion euros within four hours, closing near 3.9 billion, about four times oversubscribed, letting UOB tighten pricing. The 500-million-euro two-year tranche carries a 3.118 per cent coupon at mid-swaps plus seven basis points; the five-year at 3.342 per cent, plus 24 basis points. The bonds expect Aaa and AAA ratings, an issue date of Sep 8, and are guaranteed by Glacier Eighty.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20BT/UOB%20prices%20landmark%20US1.2%20billion%20dual-tranche%20euro%20covered%20bond%20offering.pdf"},{"id":"bt-18","title":"US goods-trade deficit widens to largest since March 2025","source":"BT","date":"28 Aug 2026","tags":["Trade","Finance & Markets"],"summary":"The US merchandise-trade deficit widened 17.2 per cent in July to US$118.8 billion, the largest since March 2025, on a multi-decade surge in capital-equipment imports, Commerce Department data showed on Aug 27, far above the US$100.5 billion forecast. Merchandise imports climbed 3.7 per cent, driven by the largest increase in capital goods, a category including computers, semiconductors and telecom equipment, since 1993; exports fell 2.9 per cent. The deficit has fluctuated as the Iran war boosted US petroleum demand and firms stockpiled amid tariff changes, while AI-linked equipment imports stayed healthy. Industrial-supply shipments declined; retail inventories rose 0.7 per cent. The data feeds the Q3 GDP estimate due in October; net exports subtracted 1.14 percentage points from Q2 GDP. Fuller July figures are due Sept 3.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20BT/US%20goods-trade%20deficit%20widens%20to%20largest%20since%20March%202025.pdf"},{"id":"bt-19","title":"US jobless claims dip, pointing to continued labour-market stability","source":"BT","date":"28 Aug 2026","tags":["Finance & Markets"],"summary":"US initial jobless claims fell 4,000 to a seasonally adjusted 203,000 for the week ended August 22, below the 208,000 forecast, suggesting the labour market remains stable despite a surprise July employment drop, the Labor Department said on Aug 27. Claims are hovering at the lower end of this year's 189,000-230,000 range, indicating layoffs remain low even as hiring is soft; the jobless rate ticked down to a historically low 4.1 per cent. Sustained stability could let the Federal Reserve keep its focus on containing inflation, which has run above its 2 per cent target for 65 straight months. Continuing claims, a proxy for hiring, fell 18,000 to 1.778 million for the week ended August 15, covering the August payrolls reference week.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20BT/US%20jobless%20claims%20dip,%20pointing%20to%20continued%20labour-market%20stability.pdf"},{"id":"bt-20","title":"US weighs a new round of tariffs on semiconductors, Politico reports","source":"BT","date":"28 Aug 2026","tags":["Trade","Technology & AI"],"summary":"The Trump administration is considering a new round of sweeping tariffs on semiconductors, Politico reported on Aug 27, citing eight people familiar with discussions. The proposal could tax a wider range of tech goods, not just microchips but products that use them such as laptops, gaming consoles and data centre servers. Commerce Secretary Howard Lutnick favours tying foreign companies' tariff relief to investment in US chip manufacturing to boost local production. Washington is also mulling a phase-in period, and the framework could still be substantially revised. Reuters could not verify the report; a White House official called unofficial tariff reporting \"baseless speculation\" while touting reshoring. US Trade Representative Jamieson Greer said in May that no imminent chip tariffs were expected but duties were important to facilitate reshoring.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20BT/US%20weighs%20a%20new%20round%20of%20tariffs%20on%20semiconductors,%20Politico%20reports.pdf"},{"id":"scmp-01","title":"'Strong signal': South Korea raises rates again to fight inflation, rising home prices","source":"SCMP","date":"28 Aug 2026","tags":["Finance & Markets"],"summary":"The Bank of Korea raised its benchmark rate 0.25 point to 3.0 per cent, a second straight monthly hike and its highest level since February 2025, to counter inflation, a weak won and rising Seoul home prices. Governor Shin Hyun-song called the back-to-back July-August moves \"a step outside convention\" sending \"a strong signal\" on financial stability, accepting a squeeze on indebted households and small businesses. A semiconductor boom gave room: the BOK upgraded 2026 growth to 3.3 per cent and logged a record US$191.01 billion half-year current-account surplus. July inflation eased to 2.8 per cent, still above the 2 per cent target. Household credit topped 2,000 trillion won. Economists expect another quarter-point hike within six months.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20SCMP/'Strong%20signal'%20South%20Korea%20raises%20rates%20again%20to%20fight%20inflation,%20rising%20home%20prices.pdf"},{"id":"scmp-02","title":"Alibaba pushes into South America's AI market with launch of Brazil data centres","source":"SCMP","date":"28 Aug 2026","tags":["Technology & AI"],"summary":"Alibaba Group launched its first South American data centres, opening two facilities in Brazil offering local enterprises secure cloud infrastructure and \"agentic AI services\" as it ramps up AI buildout in emerging markets amid US-China rivalry. Alibaba Cloud now spans 106 availability zones across 31 regions, following its 2025 Mexico entry and recent centres in France and South Korea. Local partners include Insi and 4Linux. The Hangzhou firm, which owns the South China Morning Post, has committed 380 billion yuan (US$56.5 billion) over three years to AI infrastructure, half already spent by end-June. The move came a day after Alibaba unveiled Qwen3.8-Flash-Next, a preview of Qwen4 with 125 billion parameters. AI cloud and compute revenue hit 48.4 billion yuan in Q2.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20SCMP/Alibaba%20pushes%20into%20South%20America's%20AI%20market%20with%20launch%20of%20Brazil%20data%20centres.pdf"},{"id":"scmp-03","title":"Bond market revolt signals fading confidence in US economic leadership","source":"SCMP","date":"28 Aug 2026","tags":["Finance & Markets","Politics"],"summary":"This opinion piece argues bond markets are revolting against US economic mismanagement under Trump. Last week's collapse of US-Canada trade talks triggered 50 per cent tariffs on Canadian goods, with Ottawa retaliating in kind after Washington demanded Canada drop French as a coequal language. The 30-year Treasury yield rose from 4.8 per cent on June 24 to 5.3 per cent on August 17, its highest since 2007, prompting Treasury Secretary Scott Bessent to double planned purchases of 10-to-30-year debt on August 19 to suppress yields. US public debt hit a record US$40 trillion. Critics including Paul Krugman and Stanley Druckenmiller condemned Bessent's intervention, which puts new Fed chair Kevin Warsh, who welcomes higher yields, in a tighter spot.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20SCMP/Bond%20market%20revolt%20signals%20fading%20confidence%20in%20US%20economic%20leadership.pdf"},{"id":"scmp-04","title":"Brazil's rare earths will not loosen China's magnet grip this decade, researchers say","source":"SCMP","date":"28 Aug 2026","tags":["Trade","Geopolitics"],"summary":"Brazil cannot make rare earth magnets from its own raw materials before 2032, the coordinator of its main magnet pilot plant said, leaving China's near-monopoly intact. Andre Luis Pimenta de Faria said first batches could come by end-2028 but only using imported inputs, with a full domestic supply chain a 2032-2035 horizon. Despite holding the world's second-largest reserves, Brazil refines almost nothing and has no commercial magnet plant; China produces roughly 90 per cent of the world's rare earth permanent magnets and imposed export controls on seven rare earths in April 2025. USA Rare Earth agreed to buy Goias miner Serra Verde for US$2.8 billion. A critical minerals bill establishing a policy framework and financing fund remains stalled in the Senate.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20SCMP/Brazil's%20rare%20earths%20will%20not%20loosen%20China's%20magnet%20grip%20this%20decade,%20researchers%20say.pdf"},{"id":"scmp-05","title":"China and Iran sanctions: what US moves mean for Beijing, and its retaliation options","source":"SCMP","date":"28 Aug 2026","tags":["Geopolitics","Trade"],"summary":"The US imposed sweeping sanctions on nearly 60 Iran-linked entities spanning digital assets, technology, gold, aviation and shipping, seeking to \"sever every economic lifeline\" sustaining Tehran. More than a dozen Hong Kong and mainland entities were named, including Sweet Ocean, accused of procuring sensitive laser optics, and firms owning ships carrying Iranian crude to China, Tehran's biggest oil buyer. Beijing denounced the \"illegal unilateral sanctions.\" Analysts said Washington remains wary of jeopardising detente before Xi Jinping's planned US trip, but Beijing's red lines are defined: targeting large Chinese banks would invite harsher responses. China could enforce blocking orders, tighten rare earth export controls, and expand its Cross-border Interbank Payment System to cut reliance on US dollar clearing.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20SCMP/China%20and%20Iran%20sanctions%20what%20US%20moves%20mean%20for%20Beijing,%20and%20its%20retaliation%20options.pdf"},{"id":"scmp-06","title":"Chinese executives may join Xi's US trip, as trade truce extension 'almost certain'","source":"SCMP","date":"28 Aug 2026","tags":["Trade","Geopolitics"],"summary":"Chinese and US officials are discussing whether business leaders will join President Xi Jinping's delegation to Washington, where he is expected to meet Trump on September 24, mirroring the CEOs who joined Trump's May Beijing visit. Sources say an extension of the one-year Busan trade truce reached in October 2025 is likely or \"almost certain,\" though the two sides disagree on duration: Beijing wants coverage through Trump's presidency while Washington seeks another one-year deal. The Busan pact cut some US tariffs, paused certain rare earth controls, and secured Chinese soybean and fentanyl-precursor commitments. Efforts to launch a Board of Trade capping tariff-reduced trade at US$30 billion each side are in final stages. Low-level tit-for-tat measures are expected to continue.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20SCMP/Chinese%20executives%20may%20join%20Xi's%20US%20trip,%20as%20trade%20truce%20extension%20'almost%20certain'.pdf"},{"id":"scmp-07","title":"Dovish or Hawkish? Markets await Warsh's Jackson Hole debut for rate, policy clues","source":"SCMP","date":"28 Aug 2026","tags":["Finance & Markets"],"summary":"Investors await Kevin Warsh's first speech as US Federal Reserve chair at Friday's Jackson Hole symposium, seeking clues on interest-rate and monetary policy amid rising Treasury yields and Washington's intervention to cap long-end yields. Dovish rhetoric would boost stocks and short-dated bonds and keep AI infrastructure funding cheap; a hawkish stance would weigh on richly valued AI stocks. A subdued reaction to Nvidia's strong results showed traders sidelined ahead of the speech. Goldman Sachs and Citigroup expect a dovish tone given moderate inflation, with core PCE up 0.2 per cent in July. CME Group put the odds of the Fed holding rates next month at about 62 per cent, up from 18 per cent a month ago. Warsh has dropped forward guidance, favouring markets shaping expectations.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20SCMP/Dovish%20or%20Hawkish%20Markets%20await%20Warsh's%20Jackson%20Hole%20debut%20for%20rate,%20policy%20clues.pdf"},{"id":"scmp-08","title":"Harvard and MIT scholars head to Canada, as Carney offers millions","source":"SCMP","date":"28 Aug 2026","tags":["Society","Politics"],"summary":"Canada awarded 64 global scholars C$504 million (US$362 million) to relocate their research to Canadian universities in fields like health and AI. Some 48 researchers were poached from the US, including from Harvard and MIT, with 16 more from 12 other countries and 23 being returning Canadians. Industry Minister Melanie Joly said Canada is \"doubling down on science\" as US federal funding cuts, tighter immigration and clashes between the Trump administration and universities push scholars abroad. The recruitment is part of Prime Minister Mark Carney's C$1.7 billion, 12-year plan to attract over 1,000 researchers. Recruits include planetary scientist Sara Seager and Harvard's Curtis Huttenhower. Canada also promised an accelerated pathway for H-1B holders after the US imposed a US$100,000 visa fee. The EU launched a rival €500 million initiative.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20SCMP/Harvard%20and%20MIT%20scholars%20head%20to%20Canada,%20as%20Carney%20offers%20millions.pdf"},{"id":"scmp-09","title":"Himalayan glacier collapse hits crucial China-Nepal trade route as casualties mount","source":"SCMP","date":"28 Aug 2026","tags":["Environment","Geopolitics"],"summary":"Catastrophic flash floods and a mudslide devastated the Gyirong Port crossing on the China-Nepal border on Wednesday, triggered by a high-altitude glacier collapse inside Nepal that evolved into a high-velocity debris flow. China confirmed three deaths with over 500 people, including 260 foreign nationals, missing; Nepal reported over 900 missing and a death toll of 359, including some 280 Indian pilgrims. Gyirong handled nearly 30 per cent of China-Nepal trade in 2024. Analysts said the disaster would hit trade hard and disrupt feasibility work on the proposed China-Nepal railway, but not alter the direction of connectivity that could reduce Nepal's reliance on Indian transit. India opposes the railway over Siliguri Corridor security. The UN says Nepal has lost nearly a third of its ice cover in 30 years.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20SCMP/Himalayan%20glacier%20collapse%20hits%20crucial%20China-Nepal%20trade%20route%20as%20casualties%20mount.pdf"},{"id":"scmp-10","title":"Hong Kong Exchanges and Clearing explores merging GEM with main board, source says","source":"SCMP","date":"28 Aug 2026","tags":["Finance & Markets"],"summary":"Hong Kong Exchanges and Clearing is exploring merging its poorly performing GEM board with the main board by creating a new Chapter 18D listing rule, subject to public consultation by year-end. The proposal would let newly established small companies that cannot meet the profit requirement list, and grandfather in the roughly 300 existing GEM firms. GEM, established in 1999, held 306 firms with a combined HK$78 billion market cap versus the main board's 2,455 companies at HK$47.05 trillion; Thursday turnover was just HK$125 million, about 0.05 per cent of the main board's. GEM saw only one new listing in the first half, raising US$9.62 million, against 79 main-board listings raising US$26 billion. Analysts warned relocation alone would not fix liquidity and coverage problems.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20SCMP/Hong%20Kong%20Exchanges%20and%20Clearing%20explores%20merging%20GEM%20with%20main%20board,%20source%20says.pdf"},{"id":"scmp-11","title":"Hong Kong expands AI sandbox with projects that include banks, securities and insurance","source":"SCMP","date":"28 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Hong Kong's financial regulators selected 36 use cases for the first cohort of the expanded GenAI Sandbox++ programme, spanning banking, securities, insurance and pensions, as the city explores more autonomous AI agents in financial services. The projects involve 30 financial institutions and 27 technology partners, including Ant Bank (Hong Kong), WeChat Pay Hong Kong and HSBC Life. Technical trials begin later this year on a platform run by Cyberport's AI Supercomputing Centre. The joint statement came from the HKMA, Securities and Futures Commission, Insurance Authority and Mandatory Provident Fund Schemes Authority. The cohort focuses on \"agentic AI\" for customer onboarding, payments, insurance claims and customer interactions. Sandbox++ launched in March, expanding the 2024 GenAI Sandbox, focusing on risk management, fraud prevention and customer experience.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20SCMP/Hong%20Kong%20expands%20AI%20sandbox%20with%20projects%20that%20include%20banks,%20securities%20and%20insurance.pdf"},{"id":"scmp-12","title":"Iran endures 6 months of US strikes as Trump's war goals hit 'dangerous impasse'","source":"SCMP","date":"28 Aug 2026","tags":["Geopolitics","Defence"],"summary":"Six months after US and Israeli forces attacked Iran, killing its supreme leader, the conflict has reached a costly stalemate, with Tehran under economic siege but still holding power and betting time is on its side. Washington's latest measures, announced Monday, shift the fight to Iran's oil revenues, banks and trading partners, with Bessent vowing to cut financial lifelines and a naval blockade restricting exports. Tehran bets Trump will not aggressively enforce secondary sanctions on China and India. Former diplomat Aaron David Miller called it \"Desperation Day.\" Analysts warned Iran could adopt a Houthi-style disruption model. Annual inflation reached 66 per cent in July, food prices up 128 per cent, raising fears that hardship could spill into mass unrest. Iran retains leverage over the Strait of Hormuz.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20SCMP/Iran%20endures%206%20months%20of%20US%20strikes%20as%20Trump's%20war%20goals%20hit%20'dangerous%20impasse'.pdf"},{"id":"scmp-13","title":"Nvidia ships first H200 chips to China, but forecasts no data-centre computing revenue","source":"SCMP","date":"28 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Nvidia confirmed its first shipments of H200 data-centre processors to China under a new US licensing scheme, ending a months-long lockout, though sales were under 1 per cent of its US$89 billion data-centre revenue for the quarter ended July 26. Its US$108 billion third-quarter forecast assumes no China data-centre computing revenue. Nvidia struck an upbeat global tone, expecting revenue to grow about 70 per cent in fiscal 2028, with CEO Jensen Huang saying actual demand was \"much greater.\" It reported record Q2 revenue of US$96.2 billion, up 106 per cent year on year. Nvidia has invested nearly US$50 billion in AI labs and partnered on platforms to mobilise over US$500 billion, defending \"circular financing.\" AWS will deploy 2 million more GPUs; the Vera Rubin platform is ramping up.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20SCMP/Nvidia%20ships%20first%20H200%20chips%20to%20China,%20but%20forecasts%20no%20data-centre%20computing%20revenue.pdf"},{"id":"scmp-14","title":"Russia lashes out at UK, France over Ukraine missile technology transfer","source":"SCMP","date":"28 Aug 2026","tags":["Geopolitics","Defence"],"summary":"Russian foreign ministry spokeswoman Maria Zakharova said Moscow could strike British military targets inside and outside Ukraine in response to Ukrainian strikes on Russia using British missiles, warning Britain and France were \"playing with fire\" by supplying sensitive missile technology to Kyiv. Britain announced Monday it would grant Kyiv classified technology to start its own production of Storm Shadow long-range cruise missiles, with France also assenting to licence the European missile. The Kremlin dismissed US media reports that Russia could attack a Nato member and that CIA Director John Ratcliffe's Moscow visit aimed to warn against it. Ukraine's Kyrylo Budanov said talks between Ukrainian and Russian teams, including US representatives, could resume in September; the last trilateral talks were in February.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20SCMP/Russia%20lashes%20out%20at%20UK,%20France%20over%20Ukraine%20missile%20technology%20transfer.pdf"},{"id":"scmp-15","title":"Singapore MP opposes Temasek funding for Air India amid US$1.5 billion plea","source":"SCMP","date":"28 Aug 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"A Singapore opposition lawmaker urged that state investor Temasek's money not be used to shore up Air India, after the Indian carrier asked owners Tata Sons and Singapore Airlines for US$1.5 billion. Workers' Party MP Kenneth Tiong said that because Singapore Airlines owns about 25 per cent of Air India and Temasek majority-owns SIA, the request was \"not only a question for private shareholders,\" adding SIA should back its bet \"on its own two feet, and not on Temasek's.\" He filed a parliamentary question for September 8. SIA said its board would carefully weigh any capital requests. Air India and Air India Express posted combined losses of US$2.33 billion in the year to March, more than double the prior year. The carrier faces Pakistan's airspace ban and last year's crash that killed 260.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20SCMP/Singapore%20MP%20opposes%20Temasek%20funding%20for%20Air%20India%20amid%20US1.5%20billion%20plea.pdf"},{"id":"scmp-16","title":"Trump hints at sanctions on Chinese banks over Iran ties before Xi's expected US visit","source":"SCMP","date":"28 Aug 2026","tags":["Geopolitics","Finance & Markets"],"summary":"Trump on Thursday hinted at sanctioning Chinese banks over their commercial links with Iran, weeks before Xi Jinping is expected to visit Washington. Asked why the US had not acted, Trump replied \"Who said I'm not?\" His remarks followed Bessent's new sanctions on 60 entities, including some in mainland China and Hong Kong, dubbed \"Economic D-Day,\" demanding immediate action from nations tied to Iran. Washington stopped short of blacklisting major Chinese banks and refiners. Pressure is building in Congress, with hawks favouring bank sanctions while others warn of Beijing's rare earth retaliation. Dennis Wilder said sanctioning Bank of China would be a \"nuclear economic weapon.\" China buys over 80 per cent of Iran's oil exports. Beijing called the measures illegal and said economic pressure was \"not the solution.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20SCMP/Trump%20hints%20at%20sanctions%20on%20Chinese%20banks%20over%20Iran%20ties%20before%20Xi's%20expected%20US%20visit.pdf"},{"id":"scmp-17","title":"US Patriot missile shortage in Europe 'beyond critical' due to Iran war, officials say","source":"SCMP","date":"28 Aug 2026","tags":["Defence","Geopolitics"],"summary":"The US military faces a \"beyond critical\" shortage of Patriot missile interceptors in Europe, largely driven by Trump's war with Iran, a US defence official and a Nato official said, raising fears about Nato vulnerability to a potential Russian attack. US missile stocks were moved to the Middle East, where US and Gulf allies fired large numbers of interceptors against Iran. The Iran conflict has used up 65 per cent of US Patriots, roughly 1,500 of 2,330 interceptors, per CSIS. Officials say Russia could be able to attack a Nato country by 2030, when stockpiles rebound. Europe's first Patriot production facility opens in Germany in September. Pentagon and Nato spokesmen disputed the claims, calling them \"false.\" ATACMS supplies are also critically short.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20SCMP/US%20Patriot%20missile%20shortage%20in%20Europe%20'beyond%20critical'%20due%20to%20Iran%20war,%20officials%20say.pdf"},{"id":"scmp-18","title":"US urged to use Beijing playbook to secure Chinese tech transfers","source":"SCMP","date":"28 Aug 2026","tags":["Technology & AI","Trade"],"summary":"US industrial policy and supply chain experts said Washington should take a leaf from Beijing's playbook by strategically opening specific sectors to Chinese investment while ensuring technology transfers occur, rather than broadly shutting out Chinese technology. The advice comes as Washington mulls bans on connected-vehicle technology linked to China and on imports of Chinese humanoid robots and power inverters. At a Quincy Institute panel, Jake Werner noted China incorporated American business and technology into its advanced sectors. Experts including former Commerce chief economist Susan Helper and Johns Hopkins' Jonas Nahm suggested joint ventures, technology licences, local supplier requirements and regulatory walls. A key uncertainty is whether Beijing would allow it, given tightening export controls and new exit bans on Chinese citizens taking effect next month.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20SCMP/US%20urged%20to%20use%20Beijing%20playbook%20to%20secure%20Chinese%20tech%20transfers.pdf"},{"id":"scmp-19","title":"Wang Yi calls on US to 'overcome obstacles' ahead of Xi-Trump meeting","source":"SCMP","date":"28 Aug 2026","tags":["Geopolitics","Politics"],"summary":"Chinese Foreign Minister Wang Yi urged Washington to help \"remove interference and overcome obstacles\" to high-level exchanges as the two sides prepare for President Xi Jinping's expected US visit next month. Meeting US ambassador David Perdue in Beijing on Wednesday, Wang said both sides should implement the Xi-Trump consensus, focus on a positive agenda and manage differences to keep ties \"stable, healthy and sustainable.\" Perdue called Trump's May China visit \"very successful\" and described the talks as preparation for Xi's reciprocal Washington trip, expected September 24. Since the Busan meeting in October, ties have held a fragile trade truce amid disputes over Iran sanctions, visas, technology and forced labour. This week the US Treasury launched \"Operation Economic Outcast,\" hitting about 60 Iran-linked entities; Beijing called the measures illegal.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20SCMP/Wang%20Yi%20calls%20on%20US%20to%20'overcome%20obstacles'%20ahead%20of%20Xi-Trump%20meeting.pdf"},{"id":"scmp-20","title":"Why Southeast Asia isn't buying the US' offer of 'flexible realism'","source":"SCMP","date":"28 Aug 2026","tags":["Southeast Asia","Geopolitics"],"summary":"This analysis argues Southeast Asia remains sceptical of US strategic commitment despite Pentagon policy chief Elbridge Colby's tour of key regional capitals. In a Manila speech, Colby extolled America's \"flexible realism\" and called the Philippines a \"model ally,\" pushing burden-sharing and highlighting coastguard deployments amid South China Sea tensions. But Washington's actions contradict its \"Asia first\" rhetoric: military adventurism in Latin America, the Iran war, a Ukraine quagmire, and the redeployment of the USS George Washington to the Middle East. Battered by US tariffs and the energy shock, regional states have deepened ties with China; Indonesia drilled with Beijing near Taiwan and Malaysia backs Beijing on Taiwan. The Philippines still lacks high-grade weapons and fighter jets and faces double-digit tariffs, undercutting Colby's realism.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20SCMP/Why%20Southeast%20Asia%20isn't%20buying%20the%20US'%20offer%20of%20'flexible%20realism'.pdf"},{"id":"scmp-21","title":"Why climate extremes will not stop expansion of China's nuclear power industry","source":"SCMP","date":"28 Aug 2026","tags":["Energy","Environment"],"summary":"Extreme weather is unlikely to derail China's rapid nuclear expansion, an industry specialist said, even as heat and drought forced reactor shutdowns across Europe, including a record shortfall of over 20 per cent in France's nuclear capacity. Unlike Europe's river-based reactors, China's plants are built along the coast and use open seawater for cooling, making them less vulnerable to droughts and heatwaves, said Francois Morin of the World Nuclear Association. The Lufeng project in Guangdong, with six third-generation units, is designed to withstand a 10,000-year earthquake and Force 17 super-typhoon winds, and has already endured Typhoon Ragasa. China is also promoting next-generation reactors using less water. China is set to overtake the US as the world's largest nuclear operator within five years, approving 10-plus reactors annually since 2022.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20SCMP/Why%20climate%20extremes%20will%20not%20stop%20expansion%20of%20China's%20nuclear%20power%20industry.pdf"},{"id":"scmp-22","title":"Zhipu AI shares jump as viral Ox Alpha model revealed as GLM-5.3-Flash on Chinese chips","source":"SCMP","date":"28 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"China's Zhipu AI launched its open-weight GLM-5.3-Flash model, previously code-named Ox Alpha, saying it ran entirely on a cluster of 100,000 domestically produced chips during a stealth trial, a significant test of scaling AI on home-grown hardware amid US export controls. The model processed 62 trillion tokens before its Wednesday release and became AI marketplace OpenRouter's biggest launch to date, ranking first among coding systems. Zhipu's Hong Kong shares closed more than 12 per cent higher at HK$1,160. The model has 320 billion total parameters, activating just 18 billion per request. Benchmarking firm Artificial Analysis scored it 57, 10th globally and third among open-weight models. Zhipu prices it aggressively, claiming it costs about 1/40th of Anthropic's Opus 4.8. Cambricon and Moore Threads announced \"Day 0\" compatibility.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/28%20Aug%202026/28%20Aug%20SCMP/Zhipu%20AI%20shares%20jump%20as%20viral%20Ox%20Alpha%20model%20revealed%20as%20GLM-5.3-Flash%20on%20Chinese%20chips.pdf"}]},"2026-08-31":{"date":"2026-08-31","dayOfWeek":"Monday","totalArticles":90,"sourceCounts":{"WSJ":23,"ST":17,"BT":22,"SCMP":28},"executiveDigest":"Fed chair Warsh delivered a hawkish Jackson Hole turn, signalling the central bank 'may not be done fighting inflation' - a stance BT said 'favours soaring banks over struggling S-Reits' - even as the US struck Iranian rocket launchers in its first attack in weeks and Trump moved to take partial control of Venezuela's oil reserves. Oil jumped at the open then settled lower on Fed clues and Hormuz-deal rumours as strait traffic thinned. Trump's new Iran sanctions 'put China on notice', ensnaring Egyptian and Hong Kong firms. Nvidia's soaring valuation sparked a tech rally, but Singapore-listed names lost out, while OCBC said mega-projects on Singapore's road map could 'unlock a multi-decade investment story'.","briefingCards":[{"title":"Lead story - Warsh turns hawkish as US re-strikes Iran","body":"Two forces jolted the week's open. On policy, WSJ reported 'Fed chairman Kevin Warsh signalled the central bank may not be done fighting inflation', a hawkish Jackson Hole turn BT said 'favours soaring banks over struggling S-Reits' and left Warsh with a 'no-win inflation dilemma' - hold rates or defy Trump. On the war, BT reported 'US strikes Iranian rocket launchers in its first attack in weeks', sending oil up at the open before it 'settled lower on Fed clues and Hormuz-deal rumours'. SCMP said a 'Hormuz deal presses pause on the conflict but fears of a forever war remain', Trump said he's 'not in a hurry' at the six-month mark, and his 'new Iran sanctions put China on notice', pulling in Egyptian and Hong Kong firms."},{"title":"Markets & finance","body":"The hawkish shift reset positioning: US consumer sentiment weakened, job growth was revised 'slightly weaker' across 2025, and attention turned to US jobs data and a Bank of Canada decision. WSJ marveled the global economy has 'taken the US-Canada trade war, the Iran war and surging bond yields in its stride', but pressure points multiplied - Japan 'spent a record US$96.5 billion to support the yen', Australia's dollar forecasters see the 'winning run over', and WSJ argued 'the world needs to force China's yuan to revalue'. China's five largest banks posted their 'strongest first-half profit since the property crash', and Glencore booked a US$480 million provision 'covering its entire Radiant World exposure', a name previously tied to Singapore account freezes."},{"title":"Asia realignment","body":"US-China tension sharpened around Iran: SCMP asked whether 'US threats over Iran could be the last straw for Beijing', reported 'CXMT joined Chinese tech firms suing the Pentagon over blacklists', and said China's 'chip supply chain is safer as self-sufficiency gains traction'. Trump's sanctions and a Venezuela oil grab reordered energy geopolitics - WSJ detailed 'Xi turning oil from a weakness into a geopolitical weapon' and 'Putin turning again to Xi as Russia's clout crumbles', with the two set to meet in Bishkek for 'Power of Siberia 2' pipeline talks. Security realigned too: a Turkey-Saudi-Pakistan defence pact holds its first meeting, South Korea's Lee reshuffled his cabinet with 'key AI roles', and experts warned a 'PLA shift to systems warfare means Taiwan's defences must change'."},{"title":"Energy & climate","body":"Venezuela moved to center stage: BT reported 'Trump says the US is taking partial control of Venezuela's vast oil reserves', WSJ went 'inside Trump's plan to give the Pentagon a stake', Chevron and US firms 'near a deal to invest billions', and Caracas said a '25-year deal could generate US$209 billion' - even as Venezuelans decried 'a new form of US colonialism'. Iran/Hormuz stayed pivotal: oil whipsawed on the US strike and deal rumours, strait traffic 'slipped below its 10-day average', and Panama Canal congestion 'drove gas tankers to unusual routes'. Xi and Putin will discuss the 'Power of Siberia 2' pipeline, while WSJ warned 'the strongest El Nino in a generation is wreaking havoc on the global economy'."},{"title":"Technology & AI","body":"Nvidia set the tone - WSJ said it 'insists it can keep printing money to fund the AI boom' and 'wants to run the world's robots, with China an eager customer' - even as 'China's AI catch-up is forcing Silicon Valley to cut prices'. The memory build-out accelerated: SK Hynix 'started work on a US$4 billion Indiana AI-memory hub, expecting a shortage through 2030' and weighs closer ties with Japan, while SoftBank 'seeks another US$10 billion loan for its OpenAI stake'. China's CXMT posted an '870% revenue surge', HKEX's Tech 100 'added Pony AI and WeRide', and MiniMax expanded its Alibaba cloud pact. Copyright risk grew as 'Sony Music and Warner accused Anthropic of blatant theft', and WSJ chronicled 'how Big Tech blinded itself to the grassroots AI revolt'."},{"title":"Singapore & SEA focus","body":"Singapore markets got a mixed read: ST said 'Nvidia's valuation sparked a tech rally but Singapore companies lost out', and BT noted Warsh's hawkish turn 'favours soaring banks over struggling S-Reits'. The bright spot was structural - OCBC said 'mega-projects on Singapore's road map could unlock a multi-decade investment story'. On corporates, Frasers Property shareholders 'approved a S$2.1 billion hospitality-portfolio revamp', and Glencore's US$480 million Radiant World provision kept a Singapore-linked saga in view. Regionally, Malaysia's PM Anwar 'unveiled measures to tackle living costs and support local businesses', BYD posted a US$1.2 billion quarterly profit, and JD.com's US$1.3 billion expansion could 'test Hong Kong's footfall-driven retail-property model'."}],"keyMetrics":[{"value":"90","label":"Articles curated today","sub":"WSJ 23 · ST 17 · BT 22 · SCMP 28"},{"value":"Hawkish","label":"Warsh at Jackson Hole","sub":"Favours banks over S-Reits"},{"value":"US strikes","label":"Iranian rocket launchers","sub":"First attack in weeks; oil swings"},{"value":"US$209b","label":"Venezuela oil takeover","sub":"Trump: partial US control"},{"value":"Rally, SG out","label":"Nvidia valuation surge","sub":"S'pore-listed names lose out"},{"value":"US$96.5b","label":"Japan's yen defence","sub":"Record monthly intervention"}],"articles":[{"id":"wsj-01","title":"A Core Egyptian Bank Gets Caught Up in Treasury's Iran Crackdown","source":"WSJ","date":"31 Aug 2026","tags":["Finance & Markets","Geopolitics"],"summary":"The U.S. Treasury targeted the United Arab Emirates branch of Banque Misr, one of Egypt's most important banks, in its tightening economic squeeze on Iran. Treasury said Friday the branch processed $1.8 billion for 103 companies over 2.5 years that could form part of Iran's shadow banking network, calling it a critical node. Iran, cut off from dollar dealings, relies on such counterparts. Analyst Rachel Ziemba said financial sanctions work through a private-sector \"chilling effect.\" Egypt's Foreign Ministry, communicating with Washington, said the measures don't affect banks inside Egypt and that its banks are \"solid and strong.\" State-owned Banque Misr, founded 1920 and nationalized 1960, is Egypt's second-largest bank, raising fears other institutions curb dealings.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/A%20Core%20Egyptian%20Bank%20Gets%20Caught%20Up%20in%20Treasury's%20Iran%20Crackdown.pdf"},{"id":"wsj-02","title":"Canadian Small Businesses to Bear Brunt of New U.S. Tariffs","source":"WSJ","date":"31 Aug 2026","tags":["Trade","Politics"],"summary":"Canadian honey producers, plus exporters of artwork, wool, cosmetics and flowers, are reeling from President Trump's new 50% tariffs on $20 billion of Canadian goods, about 5% of Canada's U.S.-bound exports. Canada's overall economy should withstand them, but small and medium businesses will bear the brunt, some fearing closure. A CFIB survey found 40% of exporters sold targeted products; nearly 80% expected revenue losses, and over one-third estimated losses of at least 50%. Alberta's Lorne Prins warned honey prices could enter \"a free fall\"; Canada shipped 56% of its 2025 honey exports to the U.S. Producers rushed shipments before the tariffs took effect. Trump has also imposed duties up to 50% on steel, aluminum, lumber and autos.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/Canadian%20Small%20Businesses%20to%20Bear%20Brunt%20of%20New%20U.S.%20Tariffs.pdf"},{"id":"wsj-03","title":"Chevron, Other U.S. Firms Near Deal to Invest Billions in Venezuelan Oil Fields","source":"WSJ","date":"31 Aug 2026","tags":["Energy","Geopolitics"],"summary":"Chevron and other U.S. energy companies are nearing deals to invest billions in Venezuela's oil fields, positioning President Trump for a win after slow negotiations. Chevron, the only major U.S. firm active there with three PdVSA joint ventures, is close to adding two heavy-oil fields. Halliburton is in talks to supply oil-field equipment. Executives are set to sign production deals in Caracas next week, with Energy Secretary Chris Wright expected to travel there. Many offered fields are \"greenfields\" lacking infrastructure, requiring billions to develop. Rivals ExxonMobil and ConocoPhillips will stay on the sidelines, still seeking restitution after Hugo Chavez nationalized their assets in 2007. Since ousting Nicolas Maduro in January, Trump has pushed firms to boost Western Hemisphere output.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/Chevron,%20Other%20U.S.%20Firms%20Near%20Deal%20to%20Invest%20Billions%20in%20Venezuelan%20Oil%20Fields.pdf"},{"id":"wsj-04","title":"Consumer Sentiment Was Weaker in August, per Michigan Survey","source":"WSJ","date":"31 Aug 2026","tags":["Finance & Markets"],"summary":"U.S. consumer sentiment worsened in August, confirming the preliminary reading, per the University of Michigan's final survey. The sentiment index fell to 51.7 from 55.2 in July, roughly matching economists' expectations of 51. That leaves sentiment above the mid-40s historic lows touched earlier this year, but down about 6% month-on-month and about 11% below a year ago amid worries inflation will stay elevated. Survey director Joanne Hsu said that with ongoing policy uncertainty including the Iran conflict, \"consumers anticipate further increases in gasoline prices.\" Sentiment declined across all political groups, particularly among Republicans. Long-run inflation expectations held steady at 3.3% for a third straight month, a measure Fed officials watch to prevent price pressures becoming self-fulfilling.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/Consumer%20Sentiment%20Was%20Weaker%20in%20August,%20per%20Michigan%20Survey.pdf"},{"id":"wsj-05","title":"Drain on U.S. Munitions From Iran War Raises Fears Over Ability to Deter China, Russia","source":"WSJ","date":"31 Aug 2026","tags":["Defence","Geopolitics"],"summary":"The U.S. has rushed so many munitions to the Middle East to fight Iran that military planners fear the loss of firepower is diminishing America's ability to deter China and Russia, officials said. European inventories of PAC-3 Patriot interceptors and Atacms missiles are deemed \"beyond critical.\" Refilling stocks moved from Japan, South Korea and Germany could take years. Thaad interceptors and Merops counterdrone systems were also sent from Europe. Shrinking supplies led U.S. European Command to adjust operational plans, and officials assess America couldn't fully execute contingency plans to defend Taiwan near-term. Each move required Defense Secretary Pete Hegseth's approval. The White House insisted the U.S. has enough munitions, citing \"Operation Epic Fury\" against Iran.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/Drain%20on%20U.S.%20Munitions%20From%20Iran%20War%20Raises%20Fears%20Over%20Ability%20to%20Deter%20China,%20Russia.pdf"},{"id":"wsj-06","title":"Federal Reserve Chairman Kevin Warsh Signaled the U.S. Central Bank May Not Be Done Fighting Inflation","source":"WSJ","date":"31 Aug 2026","tags":["Finance & Markets","Politics"],"summary":"Federal Reserve Chairman Kevin Warsh signaled the central bank may not be done fighting inflation with higher rates, in his most substantive remarks since taking over this spring. Investors read his Jackson Hole debut as hawkish, raising odds of a September rate increase to around 60% from 35%. Warsh said he saw little sign borrowing conditions were restraining the economy and that better summer inflation readings hadn't convinced him the trend was improving. He said \"we must be confident that underlying inflation is moving to our objective.\" At the current roughly 3.6% rate, he found it hard to call conditions restrictive. Three officials voted last month to raise rates; the bank remains split over tariff and Iran-war shocks.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/31%20Aug%202026/31%20Aug%20WSJ/Federal%20Reserve%20Chairman%20Kevin%20Warsh%20signaled%20the%20U.S.%20central%20bank%20may%20not%20be%20done%20fighti.pdf"},{"id":"wsj-07","title":"How Big Tech Blinded Itself to the Grassroots
