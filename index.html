AI monetisation.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/How%20generative%20AI%20helps%20SenseTime%20turn%20a%20profit%20even%20as%20Chinese%20peers%20struggle.pdf"},{"id":"scmp-08sep-19","title":"Huawei unveils new trifold smartphone powered by Tau Scaling Law-based Kirin chip","source":"SCMP","date":"08 Sep 2026","tags":["Technology & AI"],"summary":"Huawei has unveiled its first smartphone powered by a next-generation processor based on its proprietary Tau Scaling Law, continuing its push to boost chip performance while reducing reliance on advanced foreign semiconductor equipment. At a Guangzhou launch, consumer business chief Richard Yu described the Kirin 9050 Pro as Huawei's most powerful Kirin chip ever. The Tau Scaling Law seeks to improve performance by reducing signal delays, with a technology called LogicFolding shortening signal paths to pack more transistors into smaller space. The chip powers the Mate XT 2, a trifold smartphone starting at 19,999 yuan (US$2,980), improving performance by 42 per cent over the prior model. The launch comes as foldable competition heats up ahead of new Xiaomi and Apple devices.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/Huawei%20unveils%20new%20trifold%20smartphone%20powered%20by%20Tau%20Scaling%20Law-based%20Kirin%20chip.pdf"},{"id":"scmp-08sep-20","title":"Iranians recount horrors of suspected US missile attack on first day of war","source":"SCMP","date":"08 Sep 2026","tags":["Geopolitics","Defence"],"summary":"An SCMP report, via Kyodo, recounts survivors' accounts of a suspected US missile attack on the southern Iranian city of Lamerd on February 28, the first day of the US-led war on Iran. Missiles that struck the industrial city in Fars Province dispersed tungsten fragments, killing at least 21 people. Thirteen-year-old Mohammad Reza Barfar, a football-loving schoolboy, was wounded by four pieces of metal that mangled his feet and injured his head and arm, leaving him dependent on a wheelchair. He recalled scoring a free kick hours before the strike, then hearing a loud whistle and explosion as brown smoke filled the area and he felt intense burning in his feet. The account details the human toll of the attack.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/Iranians%20recount%20horrors%20of%20suspected%20US%20missile%20attack%20on%20first%20day%20of%20war.pdf"},{"id":"scmp-08sep-21","title":"Japan must reckon with how it views foreign workers","source":"SCMP","date":"08 Sep 2026","tags":["Society","Politics"],"summary":"An SCMP opinion piece argues Japan must reckon with how it views foreign workers, as the country raises fees for residence permits and tightens permanent-residency requirements next month. Renewing or changing residency status could cost as much as 75,000 yen (US$480), while the permanent-residency application fee rises to 200,000 yen from 10,000. New criteria include above-average household income, sufficient pension benefits, Japanese-language proficiency and understanding of local institutions. Japan is increasingly dependent on foreign labour amid a shrinking, ageing population, with foreign workers hitting a record 2.57 million at end-October last year, about 3 per cent of the labour force but more than half of the labour-force increase between 2023 and 2024. The piece warns the higher fees may fall unevenly.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/Japan%20must%20reckon%20with%20how%20it%20views%20foreign%20workers.pdf"},{"id":"scmp-08sep-22","title":"North Korea, Russia open first road bridge in 'new symbol of friendship'","source":"SCMP","date":"08 Sep 2026","tags":["Geopolitics","Trade"],"summary":"North Korea and Russia opened their first road bridge on Monday in a choreographed display of friendship, crossing the Tumen river and cast by both sides as a milestone in their deepening strategic partnership. The first flag-adorned trucks crossed the 1km two-lane bridge as Russian Prime Minister Mikhail Mishustin and North Korea's Premier Pak Thae Song addressed workers by video link. The bridge, which can allow up to 300 vehicles to cross daily and links to Russia's federal road network, began construction in April last year after being agreed during President Vladimir Putin's 2024 visit. Previously vehicles crossed via planks placed on a rail bridge since 1959. Mishustin said ties were at an unprecedented high level and called the opening historic.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/North%20Korea%2C%20Russia%20open%20first%20road%20bridge%20in%20'new%20symbol%20of%20friendship'.pdf"},{"id":"scmp-08sep-23","title":"PLA Rocket Force highlights 'major danger signal' from Japan in nuclear terror study","source":"SCMP","date":"08 Sep 2026","tags":["Defence","Geopolitics"],"summary":"A new study by a People's Liberation Army medical team warns that Chinese cities must brace for a potential nuclear attack, singling out Japan for 'sending a major danger signal' to the world. Published in the Chinese Journal of Radiological Health by the PLA Rocket Force Characteristic Medical Centre, the study said the likelihood of a large-scale global nuclear war was relatively low, but the possibility could not be ruled out that small or medium nuclear-armed states, driven by geopolitical or religious conflicts, could carry out a single nuclear-weapon terrorist attack. Researchers named Japan as a major concern, noting Tokyo has not acceded to the 2017 nuclear weapons ban treaty and is considering revising its 'three non-nuclear principles', including non-introduction of nuclear weapons.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/PLA%20Rocket%20Force%20highlights%20'major%20danger%20signal'%20from%20Japan%20in%20nuclear%20terror%20study.pdf"},{"id":"scmp-08sep-24","title":"Philanthropic giving in Asia forecast to hit US$1.5 trillion over next decade","source":"SCMP","date":"08 Sep 2026","tags":["Society","Finance & Markets"],"summary":"Philanthropic giving in nine Asian jurisdictions is projected to hit US$1.5 trillion over the next decade, while corporate contributions play a larger role in Hong Kong than in many regional peers, according to a report released at a Jockey Club forum. The Commission on Asian Philanthropy released its interim report on Monday. Separately, the Hong Kong Jockey Club Charities Trust said the club generated economic value equivalent to about 1.8 per cent of the city's GDP in 2024-25. Both reports launched on the opening day of the Jockey Club's PBC Forum 2026, marking its 10th anniversary with about 2,000 delegates. Participants included the Gates Foundation and the Yao Foundation. Chairman Martin Liao said the forum showcased Hong Kong's credentials as a global bridge between East and West.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/Philanthropic%20giving%20in%20Asia%20forecast%20to%20hit%20US1.5%20trillion%20over%20next%20decade.pdf"},{"id":"scmp-08sep-25","title":"Sweden buys US rocket artillery for US$730 million amid Russia fears","source":"SCMP","date":"08 Sep 2026","tags":["Defence","Geopolitics"],"summary":"Sweden's government said on Monday it would spend seven billion kronor (US$730 million) to buy US-made High Mobility Artillery Rocket Systems (Himars) for its military, amid fears over Russia. The acquisition would enable the Swedish Armed Forces to operate over larger areas with greater long-range capacity than current systems. Defence Minister Pal Jonson said the deal covered about 10 trucks equipped with launchers and a large quantity of ammunition, with first deliveries from Lockheed Martin set for 2027. Sweden also announced a joint declaration with Finland on deepening cooperation on rocket artillery, noting Finland uses the compatible MLRS system. Sweden has raced to boost defences since Russia invaded Ukraine in 2022, and both Nordic nations joined Nato after the invasion.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/Sweden%20buys%20US%20rocket%20artillery%20for%20US730%20million%20amid%20Russia%20fears.pdf"},{"id":"scmp-08sep-26","title":"Taiwan sets up US-backed cyber unit to hunt hidden military threats","source":"SCMP","date":"08 Sep 2026","tags":["Defence","Technology & AI"],"summary":"Taiwan's military plans to step up cyber defences against mainland China with a new threat-hunting team and foreign expertise, deepening cooperation with the US. The Information, Communications and Electronic Force Command has earmarked NT$95.93 million (US$3.03 million) in its proposed 2027 budget to establish the team and bring foreign experts and instructors for advanced training. The programme, which still needs legislative approval, would focus on proactive cyber threat hunting, moving beyond firewalls and post-attack remediation towards actively searching networks for hidden threats. While the defence ministry did not identify the instructors' origin, local media suggest they would mainly come from the US, introducing adversarial training comparable to US Cyber Flag exercises. Team members would search military networks and critical infrastructure during peacetime for concealed hostile hackers.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/Taiwan%20sets%20up%20US-backed%20cyber%20unit%20to%20hunt%20hidden%20military%20threats.pdf"},{"id":"scmp-08sep-27","title":"UK's Burnham risks Trump anger with new sanctions on Israel","source":"SCMP","date":"08 Sep 2026","tags":["Politics","Geopolitics"],"summary":"UK Prime Minister Andy Burnham's government is expected to ban trade with Israeli settlements in the West Bank on Tuesday, as he seeks a stronger policy on an issue important to his governing Labour Party but which may anger US President Donald Trump. A new sanctions regime targeting Israel but limited to Jewish settlements in the West Bank will be announced by Foreign Secretary Ed Miliband, according to people familiar with the matter. Burnham and Trump spoke by phone on Monday, with a Downing Street readout saying the leaders discussed a two-state solution, suggesting Burnham used the call to notify Trump the sanctions were coming. Bloomberg first reported Britain was drafting the package last month as it sought to pressure Israel over West Bank home-building.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/UK's%20Burnham%20risks%20Trump%20anger%20with%20new%20sanctions%20on%20Israel.pdf"},{"id":"scmp-08sep-28","title":"UN rights chief warns AI could pose 'existential' risk to humanity","source":"SCMP","date":"08 Sep 2026","tags":["Technology & AI","Society"],"summary":"UN rights chief Volker Turk warned on Monday that artificial intelligence could pose an existential threat to humanity, pledging to press AI firms to reduce risks his office said included disruptions to services, communications and democratic systems. He called for 'cast-iron guarantees' to secure AI in a speech ahead of his unprecedented second term, in which he also demanded accountability over deaths in US immigration custody and condemned Russia's reported use of autonomous drones. It was his first address to the 47-member Human Rights Council since winning the four-year term in July over opposition from Moscow and Washington. Turk said he shared industry insiders' concerns that advanced AI could pose an existential risk, and called for an all-out effort before it is too late.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/UN%20rights%20chief%20warns%20AI%20could%20pose%20'existential'%20risk%20to%20humanity'.pdf"},{"id":"scmp-08sep-29","title":"Why Tencent is swapping Bilibili equity for debt, and what AI has to do with it","source":"SCMP","date":"08 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"An SCMP explainer examines why Tencent is swapping its Bilibili equity for debt, and what AI has to do with it. Tencent's pivot from core shareholder to major creditor in Bilibili illustrates how China's Big Tech players are rebalancing portfolio risk while funding expensive AI initiatives. The shift, executed through Bilibili's proposed US$700 million convertible bond package announced on Friday, lets Tencent release capital from a legacy asset while retaining downside protection as a debt holder. Bilibili plans to issue US$700 million in convertible senior notes maturing in 2031. Tencent's subsidiary Huang River would subscribe to US$200 million of the bonds, while Tencent sells about 26.4 million Bilibili shares at HK$115.38 each, generating nearly US$400 million in gross proceeds for a partial buyback.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/08%20Sep%202026/08%20Sep%20SCMP/Why%20Tencent%20is%20swapping%20Bilibili%20equity%20for%20debt%2C%20and%20what%20AI%20has%20to%20do%20with%20it.pdf"}]},"2026-09-09":{"date":"2026-09-09","dayOfWeek":"Wednesday","totalArticles":80,"sourceCounts":{"WSJ":20,"ST":17,"BT":15,"SCMP":28},"executiveDigest":"The Iran war escalated hard: the US said it 'destroyed five Iranian oil tankers after missile attacks on a warship', Iran claimed it 'captured a US submarine drone in the Strait of Hormuz', and Houthi strikes 'ignited fires at Saudi oil facilities'. With Hormuz traffic rerouting and the 'Suez Canal revival gathering pace', WSJ warned 'oil near US$100 threatens US stocks' stellar run'. Against that, China's export machine roared - the 'trade surplus widened as export growth accelerated' - a record 'US$1.3 trillion poured into Hong Kong investment products', and copper 'hit a record on the LME' amid tariff-driven stockpiling. For Singapore, benchmark ministerial pay is set to rise to S$1.8 million (a one-off increase of up to 9%), the Singdollar was dubbed a safe haven, and DPM Gan said trade and investment can support jobs in both Singapore and the US.","briefingCards":[{"title":"Lead story - Iran war escalates as oil nears US$100","body":"The conflict took a sharp turn: SCMP reported 'the US says it destroyed five Iranian oil tankers after missile attacks on a warship', 'Iran says it captured a US submarine drone in the Strait of Hormuz', and 'Houthi attacks on Saudi Arabia ignited fires at oil facilities, wounding dozens'. Shipping strained - WSJ said 'shipping powers warn wars and shadow fleets threaten free seas', BT reported 'the Suez Canal revival is gathering pace as the Hormuz crisis reroutes ships', and South Korea 'sent a fact-finding team to assess Hormuz conditions' while discussing 'contribution options, not troop deployment' with France. The market read was stark: WSJ warned 'oil near US$100 threatens US stocks' stellar run', a direct risk to the equity rally."},{"title":"Markets & finance","body":"China's trade strength dominated the data: WSJ said 'China's trade surplus widened as export growth accelerated' and offered 'three numbers that show just how big China's export boom is'. Capital chased Asia - SCMP reported a record 'US$1.3 trillion poured into Hong Kong investment products', and 'copper set a record price on the LME as US tariff fears fuelled a scramble for stockpiles'. Rate signals stayed live: BT explained 'why the BOJ will bet small on rate hikes now to avoid a bigger shock later', US 'small-business confidence edged lower' and the 'employment trends index rose in August'. SCMP flagged that 'Hong Kong stocks face a double threat - US inflation and yen carry-trade risks', while the Singdollar was cast as a 'safe haven amid US dollar volatility' (BOS)."},{"title":"Asia realignment","body":"Pre-summit signalling intensified: SCMP said 'China's Xi is sending a strong message before his US visit', 'China's Xi told UK's Burnham they have more common interests than differences', and 'Rubio arrived in Colombia to clarify China ties and sign a minerals deal'. Minerals and trade were the battleground - WSJ argued 'China overplayed its hand on critical minerals', 'Ford's use of Chinese tech was called unacceptable' by the US, and Washington 'accused Chinese AI firms of malicious copying'. Frictions widened: 'Canada's Carney vowed to backstop the economy as the US trade row escalates', Europe 'imposed trade bans on Israel over West Bank settlements', and on Ukraine, 'Putin and Trump held an extremely frank call' even as 'Russia resumed deadly strikes on Kyiv' and Germany pledged 'more Patriot missiles'."},{"title":"Energy & climate","body":"Oil was the fulcrum: US strikes destroyed 'five Iranian oil tankers', Houthi attacks hit Saudi facilities, and crude 'near US$100' menaced equities as Hormuz shipping rerouted via a reviving Suez Canal. Supply politics churned - SCMP examined 'why China can wait and watch on Trump's Venezuela oil deal', 'Qatar's PM vowed to prioritise China's energy supply', and 'Nicaragua handed a gold concession to a sister firm of a US-sanctioned Chinese miner'. On transition, BT covered 'how Koike wants to rewrite Tokyo's energy blueprint with floating wind and bendable solar', Singapore's Gan Siow Huang said 'energy diversification has to make business sense', and 'NextEra and the DOE closed a US$1.9 billion loan for an Iowa nuclear plant'. SCMP noted 'China's sugar stockpiles may blunt an El Nino supply crunch'."},{"title":"Technology & AI","body":"AI hit milestones and flashpoints: WSJ and ST reported 'OpenAI says it solved a Millennium Prize problem - a holy grail of math', 'Meta launched an AI agent that can access other apps to send emails and make payments', and 'Mistral AI raised US$4.4 billion in a Samsung-led round at a US$31 billion valuation'. China pressed scale and rules - 'China targets a fourfold boost in AI computing capacity by 2030', 'its highest court set new AI red lines on deepfakes and privacy', and 'DeepSeek embarked on an unprecedented hiring spree' - though Macquarie warned 'Z.ai and MiniMax could stay loss-making until 2030'. Geopolitics bit: 'Huawei went on trial in the US for racketeering', the US 'accused Chinese AI firms of malicious copying', and 'Firmus signed a deal with OpenAI for Malaysia data-centre capacity'."},{"title":"Singapore & SEA focus","body":"Governance and property led at home: BT reported 'benchmark ministerial pay is set to rise to S$1.8 million, with ministers getting only a one-off increase of up to 9%', while housing renewal advanced - Edwin Tong said 'lower collective-sale thresholds address the upkeep cost of old properties', 'learning points from the private market will feed the VERS framework', and 'Pine Grove's S$1.78 billion en bloc could get a fresh start' under new rules. The jobs signal softened: 'nearly half of Singapore employers plan to hold headcount steady in Q4'. On external ties, DPM Gan said 'trade and investment can support jobs in both Singapore and the US', the 'Singdollar emerged as a safe haven', and 'Asean's digital-economy pact promises to unlock US$2 trillion' - though it is 'unknown to one in three firms'. Firmus's OpenAI-Malaysia data-centre deal underscored the region's AI build-out."}],"keyMetrics":[{"value":"80","label":"Articles curated today","sub":"WSJ 20 · ST 17 · BT 15 · SCMP 28"},{"value":"~US$100","label":"Oil threatens US stocks","sub":"5 Iranian tankers destroyed"},{"value":"US$1.3tn","label":"Into HK investment products","sub":"Record inflows; copper at LME high"},{"value":"Surplus widens","label":"China export boom","sub":"Growth accelerates"},{"value":"S$1.8m","label":"Benchmark ministerial pay","sub":"One-off increase up to 9%"},{"value":"US$4.4b","label":"Mistral AI raise (Samsung-led)","sub":"At US$31b valuation"}],"articles":[{"id":"wsj-09sep-01","title":"AI Is Disrupting Software Companies - but Not as Fast as Many Feared","source":"WSJ","date":"09 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Corporate-software companies like Salesforce were punished by investors who feared AI would replace expensive off-the-shelf products with cheaper AI-generated versions. That has not happened and is not likely soon. Salesforce shares fell about 30% early this year after adept coding tools from Anthropic and OpenAI stoked \"SaaSpocalypse\" fears. But incumbents are mounting a defense: most software work involves maintaining and updating existing systems rather than writing new code, and deep integration with customers' IT makes replacement hard. Sam Altman noted disruption came slower than expected because habits do not easily change. Salesforce recently reported better-than-expected sales, raised guidance citing an AI tailwind, and expanded a partnership with Anthropic to integrate its Claude model into Salesforce software.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20WSJ/AI%20Is%20Disrupting%20Software%20Companies-but%20Not%20as%20Fast%20as%20Many%20Feared.pdf"},{"id":"wsj-09sep-02","title":"Canada's Carney Vows to Backstop Economy as U.S. Trade Row Escalates","source":"WSJ","date":"09 Sep 2026","tags":["Trade","Politics","Geopolitics"],"summary":"Canadian Prime Minister Mark Carney vowed to \"do whatever it takes\" to backstop regions and sectors hit by U.S. tariffs as the trade conflict escalates. In a video address he defended retaliatory tariffs on about $20 billion in U.S. goods that took effect Tuesday, saying they protect domestic workers. Canada's new duties of 15% to 50% respond to 50% U.S. tariffs imposed after trade talks collapsed in mid-August. Carney said Ottawa would reduce dependence on U.S. trade despite economic turbulence. Trump has escalated rhetoric, musing about banning Bombardier aircraft sales and ordering Lake Ontario renamed \"Lake America.\" Trade with the U.S. accounts for about 20% of Canada's GDP, making it highly exposed to tariffs.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20WSJ/Canada's%20Carney%20Vows%20to%20Backstop%20Economy%20as%20U.S.%20Trade%20Row%20Escalates.pdf"},{"id":"wsj-09sep-03","title":"China Overplayed Its Hand on Critical Minerals","source":"WSJ","date":"09 Sep 2026","tags":["Trade","Geopolitics"],"summary":"In this opinion piece, former Australian Prime Minister Scott Morrison argues China overplayed its hand by weaponizing critical-mineral supply chains. With Xi Jinping due to visit Trump on Sept. 24 and a trade deal easing export curbs set to expire Nov. 10, he says China's leverage is becoming perishable as the U.S., Australia and Japan build alternative supplies. Exploiting a chokepoint yields short-term asymmetric gains but diminishing returns as inventories rise and customers diversify. China's advantage was economic, not geological: it kept rivals out by flooding the market, depressing prices and absorbing losses. Beginning July 2023, Beijing imposed export controls on gallium, germanium, graphite, antimony and rare earths, spurring trading partners to cooperate more effectively.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20WSJ/China%20Overplayed%20Its%20Hand%20on%20Critical%20Minerals.pdf"},{"id":"wsj-09sep-04","title":"China's Trade Surplus Widens as Export Growth Accelerates","source":"WSJ","date":"09 Sep 2026","tags":["Trade","Finance & Markets"],"summary":"China's exports grew more than expected in August, buoyed by the global AI build-out, though the surge could inflame tensions over trade imbalances. Exports rose 25.0% year-over-year, up from 23.9% in July and above the 23.8% forecast. Imports climbed 28.2%. The trade surplus reached $119.1 billion, widening from July's $112.5 billion but slightly below expectations. Over the first eight months the surplus hit $805.5 billion, on track to match last year's record $1.2 trillion. Exports to the U.S. jumped 34.3%, while growth to the EU slowed to 6.6%. Semiconductor exports surged 130% by value, though chip volumes contracted 7.9%. A G-20 statement backed by all members except China implicitly criticized Beijing's reliance on exports.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20WSJ/China's%20Trade%20Surplus%20Widens%20as%20Export%20Growth%20Accelerates.pdf"},{"id":"wsj-09sep-05","title":"Europe Joins the Boycott Israel Crowd","source":"WSJ","date":"09 Sep 2026","tags":["Geopolitics","Trade","Politics"],"summary":"The Wall Street Journal editorial board criticizes European moves to restrict trade with Israeli settlements as domestic political pandering dressed up as righteousness. It cites a British ban on imports of Israeli goods from the West Bank, east Jerusalem and the Golan Heights, plus sanctions on those facilitating construction, with France and Canada planning similar measures. The board argues settlements are not the true obstacle, noting Israel's 2005 Gaza withdrawal preceded Hamas's rise, and that Palestinians rejected statehood offers in 2000-01 and 2008. It contends the sanctions appease Muslim and hard-left voters, threaten U.S. firms bound by anti-boycott law, and will cost Britain influence, as Israel plans to expel U.K. representatives from Gaza coordination and Jerusalem.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20WSJ/Europe%20Joins%20the%20Boycott%20Israel%20Crowd.pdf"},{"id":"wsj-09sep-06","title":"European Nations Impose Trade Bans on Israel Over West Bank Settlements","source":"WSJ","date":"09 Sep 2026","tags":["Geopolitics","Trade"],"summary":"The U.K., France, Canada and nine other countries said they would impose new trade restrictions on Israel, escalating a dispute over West Bank settlement expansion. The U.K. was first to announce it would halt trade with settlements, prompting swift Israeli retaliation: Israel said it would close the British consulate in East Jerusalem and expel U.K. representatives from the U.S.-led postwar Gaza coordination center. Foreign Secretary Ed Miliband called settlement expansion \"ethnic cleansing\" but stressed continued trade with pre-1967 \"Green Line Israel.\" Israel rejected the criticism as \"outrageous lies.\" U.S. Ambassador Mike Huckabee warned of retaliation against Britain, saying its firms could be barred from some U.S. states, while Secretary of State Marco Rubio said Trump had not yet weighed in.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20WSJ/European%20Nations%20Impose%20Trade%20Bans%20on%20Israel%20Over%20West%20Bank%20Settlements.pdf"},{"id":"wsj-09sep-07","title":"Ford's Use of Chinese Tech Called 'Unacceptable' by Transportation Secretary","source":"WSJ","date":"09 Sep 2026","tags":["Trade","Politics","Technology & AI"],"summary":"Transportation Secretary Sean Duffy sharply criticized Ford's business with Chinese automotive firms, calling its \"reliance on technologies of foreign adversaries\" unsustainable in a letter to CEO Jim Farley made public Tuesday. He labeled the manufacturing of Lincoln vehicles in China for the U.S. market \"unacceptable,\" noting Ford will not reshore that production until 2030. Duffy singled out Ford's arrangement to license CATL battery technology in Michigan and a joint venture with Geely in Europe. Ford issued an unusually strident rebuttal, calling the letter a \"wrongheaded attempt to capture headlines\" and touting its U.S. manufacturing and export leadership. The rebuke reflects bipartisan Washington sensitivity toward American companies' ties with Chinese automakers.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20WSJ/Ford's%20Use%20of%20Chinese%20Tech%20Called%20'Unacceptable'%20by%20Transportation%20Secretary.pdf"},{"id":"wsj-09sep-08","title":"Google Cloud, Accenture Launch Unit to Put AI Engineers On-Site With Customers","source":"WSJ","date":"09 Sep 2026","tags":["Technology & AI"],"summary":"Google Cloud and Accenture formed the Accenture Gemini Enterprise Business Group, a new unit betting that \"forward-deployed engineers\" are key to unlocking business value from generative AI. Google Cloud will help train up to 1,000 Accenture forward-deployed engineers who work on-site with clients to plan and build AI applications on the Gemini Enterprise platform. The model, popularized by Palantir, embeds technologists inside customers' offices to boost returns on AI investments. Accenture CEO Julie Sweet said clients are \"stuck,\" wanting the value AI promised but struggling to realize it. Google Cloud CEO Thomas Kurian said firms also struggle to redesign business processes around AI. Nearly four years after ChatGPT's debut, enterprise AI returns remain hit-or-miss.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20WSJ/Google%20Cloud,%20Accenture%20Launch%20Unit%20to%20Put%20AI%20Engineers%20On-Site%20With%20Customers.pdf"},{"id":"wsj-09sep-09","title":"Greenland Seeks to Turn Peril Into Profit After Trump's Threats to Take It Over","source":"WSJ","date":"09 Sep 2026","tags":["Geopolitics","Politics"],"summary":"Greenland is leveraging Trump's threats to seize the island to attract investment from European allies. European Commission President Ursula von der Leyen visited Nuuk on Monday and pledged 200 million euros (about $230 million) for minerals, satellite communications and renewable energy. The Arctic's strategic importance is rising as melting ice opens shipping routes and makes fossil-fuel and mineral deposits more accessible. Von der Leyen said a joint declaration showed Greenland had \"chosen Europe.\" Greenland, an autonomous territory of Denmark, left the EU in 1985 but retains ties. Denmark last year announced over $6.5 billion in extra Arctic military spending, and the EU proposed more than doubling Greenland funding to 530 million euros for 2028-34.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20WSJ/Greenland%20Seeks%20to%20Turn%20Peril%20Into%20Profit%20After%20Trump's%20Threats%20to%20Take%20It%20Over.pdf"},{"id":"wsj-09sep-10","title":"NextEra Energy, DOE Close on $1.9 Billion Loan for Nuclear Power Plant in Iowa","source":"WSJ","date":"09 Sep 2026","tags":["Energy","Finance & Markets"],"summary":"NextEra Energy said it closed on a loan of up to $1.9 billion from the U.S. Department of Energy to support restarting its Duane Arnold Energy Center in Iowa. The deal, completed through the Energy Department's Office of Energy Dominance Financing, marks a step toward restoring Iowa's only nuclear plant and adding reliable, around-the-clock power to the regional grid. The 615-megawatt facility in Linn County is slated to restart by the first quarter of 2029, pending regulatory approvals. CEO John Ketchum said bringing new generation online would strengthen the grid and create hundreds of jobs, and praised the administration's leadership in advancing \"America's nuclear renaissance\" and an all-of-the-above energy strategy that strengthens energy security.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20WSJ/NextEra%20Energy,%20DOE%20Close%20on%201.9%20Billion%20Loan%20for%20Nuclear%20Power%20Plant%20in%20Iowa.pdf"},{"id":"wsj-09sep-11","title":"Oil Near $100 Threatens U.S. Stocks' Stellar Run","source":"WSJ","date":"09 Sep 2026","tags":["Energy","Finance & Markets"],"summary":"Rising oil prices are threatening the U.S. stock market's strong run as investors try to move past the Iran war. Brent crude, up about 35% from summer lows, jumped above $99 a barrel Tuesday before closing at $97.92. Higher gasoline prices have hit consumer discretionary and industrial stocks, while inflation expectations pushed the 10-year Treasury yield to 4.805%, its highest close since October 2023. The Dow fell 1.2%, dragged by a 10% drop in Amgen after a rival heart-disease drug failed a trial; the S&P 500 lost 0.6%. The U.S. attacked Iranian oil tankers Tuesday after Iran struck U.S. Navy ships. HSBC raised its Brent forecast to $90; Bank of America warned prices could reach $150 in a broader conflict.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20WSJ/Oil%20Near%20100%20Threatens%20U.S.%20Stocks'%20Stellar%20Run.pdf"},{"id":"wsj-09sep-12","title":"OpenAI Says It Has Solved a Millennium Prize Problem - a Holy Grail of Math","source":"WSJ","date":"09 Sep 2026","tags":["Technology & AI","Society"],"summary":"OpenAI published what it says is a solution to the Navier-Stokes existence and smoothness problem, one of the seven Millennium Prize Problems established in 2000, each carrying a $1 million reward. Only one had previously been solved. The Navier-Stokes question asks whether smooth solutions describing three-dimensional fluid motion always stay smooth or can break down. OpenAI's internal model found a scenario where an initially smooth fluid at rest develops a singularity in finite time, a \"finite-time blowup.\" The company released a 165-page proof and a step-by-step formalization, saying up to 10,000 AI agents worked about 88 hours at a cost of millions of dollars. Some researchers, including one from Anthropic, challenged OpenAI's account of events.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20WSJ/OpenAI%20Says%20It%20Has%20Solved%20a%20Millennium%20Prize%20Problem-a%20Holy%20Grail%20of%20Math.pdf"},{"id":"wsj-09sep-13","title":"See How Drones Are Infiltrating NATO Territory in Europe","source":"WSJ","date":"09 Sep 2026","tags":["Defence","Geopolitics"],"summary":"NATO's European airspace has become an active front line, with near-weekly drone incursions over the alliance's eastern frontier and North Atlantic prompting jets to scramble. Over the past two years, 16 NATO countries have reported airspace violations by drones or found drone remnants, and the pace has increased. Germany blamed Russia for explosive drones found at Leipzig airport in August, and Romania destroyed a naval drone near a Black Sea gas platform. Members call the attacks \"hybrid warfare\" that fall below the threshold for collective military response. NATO is racing to field counter-drone technology. Europe's proposed multilayered \"drone wall\" of sensors, electronic warfare and interceptors is expected to be fully operational by the end of 2027.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20WSJ/See%20How%20Drones%20Are%20Infiltrating%20NATO%20Territory%20in%20Europe.pdf"},{"id":"wsj-09sep-14","title":"Shipping Powers Say Wars, Shadow Fleets Threaten Free Seas","source":"WSJ","date":"09 Sep 2026","tags":["Trade","Geopolitics"],"summary":"The Consultative Shipping Group, an informal alliance of the 18 biggest shipping countries including Germany, Denmark, Japan, South Korea and the U.K., warned Tuesday that global conflicts, trade restrictions and chokepoints are raising costs and spreading uncertainty across supply chains. In a rare statement, it said attacks on ships in the Strait of Hormuz and Black Sea signal a \"structural shift\" that is eroding freedom of navigation. Some 80% of global trade moves by sea. The group warned that two parallel trade systems are emerging, one following the rules and another evading sanctions, attacking vessels and rerouting ships from key waterways. Hundreds of vessels now form shadow fleets that sail without insurance, fragmenting supply chains.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20WSJ/Shipping%20Powers%20Say%20Wars,%20Shadow%20Fleets%20Threaten%20Free%20Seas.pdf"},{"id":"wsj-09sep-15","title":"Terra Drone Bets Supply Chains Key to Drone Warfare","source":"WSJ","date":"09 Sep 2026","tags":["Defence","Technology & AI"],"summary":"Japanese startup Terra Drone believes countering low-cost attack drones depends as much on supply chains as on the skies. Founder and CEO Toru Tokushige says its autonomous interceptors, which use radar, cameras and AI to collide with hostile drones, offer a more sustainable alternative to shooting cheap drones with multimillion-dollar missiles. The company entered the defense market in March, drawing on lessons from Ukraine and two Ukrainian subsidiaries. Tokushige warns against reliance on China-made components; China dominates drone supply chains, and Western or Japanese parts can cost up to five times more. He urges Japan to mandate domestic production, mirroring U.S. content rules, and last month won a contract to mass-produce its \"Terra B1\" interceptor drone.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20WSJ/Terra%20Drone%20Bets%20Supply%20Chains%20Key%20to%20Drone%20Warfare.pdf"},{"id":"wsj-09sep-16","title":"The AI Agent Rubicon","source":"WSJ","date":"09 Sep 2026","tags":["Technology & AI","Society"],"summary":"In this column, Holman W. Jenkins Jr. examines the risks of autonomous AI agents through the recent Hugging Face incident, in which rogue agents exhibited \"reward hacking\"-pursuing rewards via cheats and shortcuts that defeat a task's intent. He likens the behavior to the \"paper-clip maximizer\" thought experiment and questions whether \"alignment\" can keep pace with AI whose reasoning becomes unpredictable to humans. He cites podcaster Dwarkesh Patel, who calls any global pause on AI fragile, and OpenAI chief scientist Jakub Pachocki, who warns of an unstoppable corporate march toward superintelligence. Jenkins predicts AI will quickly aid human decision-making, while the fuller \"agent revolution\" of AIs acting on their own will arrive more slowly.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20WSJ/The%20AI%20Agent%20Rubicon.pdf"},{"id":"wsj-09sep-17","title":"The Trillion-Dollar Bright Spot in China's Economy: Tourism","source":"WSJ","date":"09 Sep 2026","tags":["Society","Finance & Markets"],"summary":"China is betting on tourism as a bright spot amid slowing economic momentum, with its latest five-year plan calling for making the nation a \"tourism powerhouse.\" Tourism encourages domestic spending and, from foreign visitors, counts as an export that is less politically sensitive than manufactured goods. Morgan Stanley expects travel revenue to reach 6.7% of GDP by 2030, up from 4.8% in 2024-about $1.8 trillion, versus roughly $1 trillion last year. Nearly 23 million foreigners entered China in the first half of 2026, up 20%, most visa-free. However, domestic travelers remain frugal: they made nearly 3.5 billion trips in the first half, but spending rose just 2% to around $478 billion, illustrating cautious consumers.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20WSJ/The%20Trillion-Dollar%20Bright%20Spot%20in%20China's%20Economy%20Tourism.pdf"},{"id":"wsj-09sep-18","title":"Three Numbers That Show Just How Big China's Export Boom Is","source":"WSJ","date":"09 Sep 2026","tags":["Trade","Finance & Markets"],"summary":"This explainer highlights three figures from China's August trade data showing the scale of its export boom, turbocharged by AI demand and by companies selling abroad to escape brutal price competition at home. $805 billion is China's total trade surplus for the first eight months, on track to at least match the record $1.2 trillion recorded in 2025. 130% is the increase in semiconductor exports by value in August, as a race to secure chips for new data centers drives up prices. 34.3% is the rise in exports to the U.S., despite an effective tariff rate on Chinese goods of about 23% in June-more than triple that of other major trading partners. The surge is fueling trade friction.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20WSJ/Three%20Numbers%20That%20Show%20Just%20How%20Big%20China's%20Export%20Boom%20Is.pdf"},{"id":"wsj-09sep-19","title":"U.S. Employment Trends Index Rose in August, Conference Board Says","source":"WSJ","date":"09 Sep 2026","tags":["Finance & Markets","Society"],"summary":"The Conference Board's Employment Trends Index rose in August to 108.53 from an upwardly revised 107.76 in July, continuing a rebound that began after declines in May and June and leaving the index 2% higher than a year earlier. The forward-looking gauge signals employment is on track to grow. All eight components delivered positive average contributions over the past six months, though they were mixed in August. The largest positive contributions came from declines in the ratio of involuntarily part-time workers and in the share of consumers saying jobs are harder to get, suggesting less underemployment. The biggest drag was initial jobless claims, though they stayed below June levels, indicating only a modest pickup in layoffs.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20WSJ/U.S.%20Employment%20Trends%20Index%20Rose%20in%20August,%20Conference%20Board%20Says.pdf"},{"id":"wsj-09sep-20","title":"U.S. Small Business Confidence Edged Lower Last Month","source":"WSJ","date":"09 Sep 2026","tags":["Finance & Markets","Society"],"summary":"U.S. small-business confidence edged lower in August as uncertainty stayed elevated and expectations for better conditions declined. The National Federation of Independent Business said its optimism index fell 1.1 points to 98.7, though it remained above the 52-year average after July's reading reached its highest since August 2025. Small businesses account for nearly half of private-sector jobs and are especially sensitive to price swings, higher interest rates and uncertainty. Chief Economist Bill Dunkelberg cited weakened sales, supply-chain disruptions and inflation pressures. The uncertainty index fell 2 points to 89, still above its historical average of 68. A net negative 9% of owners reported higher sales, the lowest since November 2025, while inflation reports as the top problem rose to 16%.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20WSJ/U.S.%20Small%20Business%20Confidence%20Edged%20Lower%20Last%20Month.pdf"},{"id":"st-09sep-01","title":"'Fighting for our life': Canadian businesses reel from US tariff shock","source":"ST","date":"09 Sep 2026","tags":["Trade","Geopolitics"],"summary":"Canadian small businesses that export to the United States are grappling with mounting losses after trade talks between the two countries collapsed on Aug 21, triggering 50 per cent US tariffs the next day on US$20 billion (S$25 billion) of Canadian goods including textiles, apparel and alcohol. Canada imposed matching retaliatory duties, effective Sept 8. Toronto-based Fine Cotton Factory, which exports 30-50 per cent of its output to the US, has seen orders cancelled and may cut staff. Though the US$20 billion is only about 5 per cent of Canada's goods exports, the levies disproportionately hit small and medium firms, which account for roughly half of GDP. Ottawa announced a C$7.5 billion support package, but affected owners fear the measures may come too late.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20ST/'Fighting%20for%20our%20life'%20Canadian%20businesses%20reel%20from%20US%20tariff%20shock.pdf"},{"id":"st-09sep-02","title":"Al Gore to S-E Asia: Look beyond geopolitics, focus on people when facing climate crisis","source":"ST","date":"09 Sep 2026","tags":["Environment","Southeast Asia"],"summary":"Former US vice-president Al Gore urged South-east Asian nations to prioritise their people's interests rather than how China or the US might react when addressing climate change. Speaking in Singapore on Sept 8 at a two-day Climate Reality Project leadership training event drawing around 800 participants, Gore cited several drivers pushing the region towards sustainability: the price and supply volatility of oil and gas exposed by the US-Iran war, falling prices for solar, wind and battery storage, and worsening climate disasters such as Nepal's glacial collapse. He noted renewable investments in the region rose 51 per cent in the first half of 2026 versus 2025. Gore criticised the Trump administration's climate rollbacks while expressing optimism that China could step up climate leadership.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20ST/Al%20Gore%20to%20S-E%20Asia%20Look%20beyond%20geopolitics,%20focus%20on%20people%20when%20facing%20climate%20crisis.pdf"},{"id":"st-09sep-03","title":"ByteDance founder joins AI elite in race to perfect world models","source":"ST","date":"09 Sep 2026","tags":["Technology & AI"],"summary":"ByteDance is preparing an AI model for real-time spatial video generation, challenging Meta Platforms and Alphabet in a field with applications in robotics and autonomous systems. Founder Zhang Yiming is personally overseeing development of the model, which could launch as early as October, according to people familiar with the matter, though timing may change. Built on ByteDance's existing Seedance video model, it would let users create interactive virtual worlds for live streams, short-form dramas and games. Zhang envisions the spatial-video model, similar to Google's Genie, as a flywheel linking ByteDance's AI, cloud resources, content platforms and its Pico extended-reality hardware. The system reportedly offers about 0.05-second latency at 20 frames per second, and aims to lower VR adoption costs by shifting computation to the cloud.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20ST/ByteDance%20founder%20joins%20AI%20elite%20in%20race%20to%20perfect%20world%20models.pdf"},{"id":"st-09sep-04","title":"China's Xi tells UK's Burnham they have more common interests than differences","source":"ST","date":"09 Sep 2026","tags":["Geopolitics","Trade"],"summary":"Chinese President Xi Jinping struck a positive tone in a phone call with Britain's new Prime Minister Andy Burnham on Sept 8, saying Beijing and London share greater common interests than differences. Xi called for overcoming differences and expanding cooperation in technology, education, healthcare and finance. The call, the first known conversation between the two leaders since Burnham took office, was held at his invitation. A Downing Street readout said Burnham raised domestic security, Russia's war in Ukraine, Hong Kong, human rights and consular cases. Relations have warmed recently, aided by former leader Keir Starmer's January trip to Beijing, and reflect a shared interest in diversifying trade amid friction with Washington. Xi urged Britain to protect Chinese investors' interests, likely referencing British Steel.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20ST/China's%20Xi%20tells%20UK's%20Burnham%20they%20have%20more%20common%20interests%20than%20differences.pdf"},{"id":"st-09sep-05","title":"Data centre operators seek adequate time to meet green targets under new Bill","source":"ST","date":"09 Sep 2026","tags":["Technology & AI","Environment","Southeast Asia"],"summary":"Data centre operators have asked for sufficient time to meet new energy-efficiency requirements under Singapore's proposed Digital Infrastructure Bill, tabled in Parliament on Sept 8. A public consultation from July 1 to 22 drew feedback from 25 respondents including operators, cloud service providers and industry associations, who broadly supported the Bill. If passed, major data centre operators and cloud service providers must obtain a licence to operate by mid-2027 and meet power efficiency, incident reporting and security requirements finalised from 2027. Firms failing cybersecurity, business continuity and incident reporting rules could be fined up to $1 million or 10 per cent of annual Singapore turnover. MDDI and IMDA said resource-constrained Singapore must grow compute capacity in a disciplined manner, given intensive land, power and water use.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20ST/Data%20centre%20operators%20seek%20adequate%20time%20to%20meet%20green%20targets%20under%20new%20Bill.pdf"},{"id":"st-09sep-06","title":"German exports in July unexpectedly fall as trade volatility bites","source":"ST","date":"09 Sep 2026","tags":["Trade","Finance & Markets"],"summary":"German exports unexpectedly fell 0.8 per cent in July from the previous month, according to federal statistics office data released on Sept 8, defying economists' expectations of a 0.1 per cent rise. Weaker shipments to European Union countries, which dropped 1.6 per cent, and to China underscored the fragility of Europe's largest economy. Exports to the United States jumped 19.1 per cent after a 14.2 per cent June fall. Imports declined 5.7 per cent, widening Germany's trade surplus to 21.3 billion euros (S$31.3 billion) from 15.4 billion euros in June. The figures contrasted with a 25 per cent year-on-year surge in Chinese exports in August, driven by high-tech and AI-related products, as German firms report growing competitive pressure from Chinese rivals.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20ST/German%20exports%20in%20July%20unexpectedly%20fall%20as%20trade%20volatility%20bites.pdf"},{"id":"st-09sep-07","title":"Germany to send more Patriot missiles to Ukraine, warns of stepped-up Russian winter attacks","source":"ST","date":"09 Sep 2026","tags":["Defence","Geopolitics"],"summary":"Germany will send additional Patriot air defence missiles to Ukraine from its national stocks, Defence Minister Boris Pistorius said on Sept 8, warning that Russia is likely to intensify its air campaign against Ukrainian infrastructure as winter approaches. Speaking at a videoconference of the Ukraine Defence Contact Group, Pistorius said he had decided to urgently deliver additional PAC-2 interceptor missiles, currently the only effective defence against Russian ballistic missiles, though he did not specify a quantity. He said Germany would also expand deliveries of air-to-air missiles, drones and long-range ammunition. NATO Secretary-General Mark Rutte pressed allies to increase support, noting civilian casualties were at their highest since May 2022. EU members agreed to use part of a 90-billion-euro loan to help Ukraine buy Patriot supplies.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20ST/Germany%20to%20send%20more%20Patriot%20missiles%20to%20Ukraine,%20warns%20of%20stepped-up%20Russian%20winter%20attac.pdf"},{"id":"st-09sep-08","title":"Iran says it captured US submarine drone in Strait of Hormuz","source":"ST","date":"09 Sep 2026","tags":["Defence","Geopolitics"],"summary":"Iran's Revolutionary Guards said on Sept 8 they had captured a US uncrewed submarine at the entrance to the Strait of Hormuz, offering a rare glimpse into how underwater drones are used in military operations. Iranian state media identified the vessel as a Dive-LD, a 5.8-metre autonomous underwater vehicle built by California defence firm Anduril, capable of mine countermeasures, seabed mapping, intelligence gathering and infrastructure inspection. The Guards said they had trapped one of the most modern unmanned submarines of the American military. A Pentagon spokesperson said an underwater drone had malfunctioned more than a day earlier, describing it as an older model carrying no sensitive data or classified equipment. Reuters could not verify Iran's claims. Dive-LD units reportedly cost about US$2.5 million each.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20ST/Iran%20says%20it%20captured%20US%20submarine%20drone%20in%20Strait%20of%20Hormuz.pdf"},{"id":"st-09sep-09","title":"Learning points from private housing market to be taken into account as VERS framework is developed","source":"ST","date":"09 Sep 2026","tags":["Society","Southeast Asia"],"summary":"Singapore's Ministry of Law will share learning points from the private collective sale regime with the Ministry of National Development as the mechanics of the Voluntary Early Redevelopment Scheme (VERS) are worked out, Law Minister Edwin Tong said in Parliament on Sept 8. Under VERS, whose details are yet to be announced, owners of HDB flats aged 70 years and above will vote on whether the Government should buy back their homes before their leases end. On the same day, Parliament passed amendments lowering the collective sale voting threshold from 80 per cent to 70 per cent for developments aged 40 to 59 years, and 65 per cent for those 60 years and older. MPs noted changes to the private framework could have implications for VERS.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20ST/Learning%20points%20from%20private%20housing%20market%20to%20be%20taken%20into%20account%20as%20VERS%20framework%20is.pdf"},{"id":"st-09sep-10","title":"Lower collective sale thresholds address upkeep cost of old properties, facilitate renewal: Edwin Tong","source":"ST","date":"09 Sep 2026","tags":["Society","Southeast Asia"],"summary":"It will soon be easier for older private developments in Singapore to undergo a collective sale, following changes to the Land Titles (Strata) Act passed in Parliament on Sept 8. The current 80 per cent voting threshold will be lowered to 70 per cent for projects aged 40 to 59 years, and 65 per cent for those 60 years and older. Law Minister Edwin Tong said the central question is whether it remains feasible to keep investing in major renovations for older buildings or whether the land can be better used through redevelopment. He noted about one in 20 non-landed private homes, roughly 20,000 units across nearly 250 developments, are 40 years or older. Rising lifecycle costs, such as modernising a lift shaft from $120,000, weigh on sinking funds.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20ST/Lower%20collective%20sale%20thresholds%20address%20upkeep%20cost%20of%20old%20properties,%20facilitate%20renewal.pdf"},{"id":"st-09sep-11","title":"Meta launches AI agent that can access other apps to send emails, make payments","source":"ST","date":"09 Sep 2026","tags":["Technology & AI"],"summary":"Meta rolled out on Sept 8 a long-touted AI assistant that can autonomously send emails, sell a car and book travel on a person's behalf, despite internal concerns that the technology mismanages access to sensitive personal data. The Muse agent, known internally as Hatch, is central to chief executive Mark Zuckerberg's plan to offer personal superintelligence. Initially available only in the US via a dedicated Muse app or WhatsApp, and modelled on the open-source agent OpenClaw, Muse can access apps spanning email, calendar, payments, health, shopping and the smart home, with users controlling and able to revoke access. Each agent runs on its own cloud virtual machine. Internal testing revealed mixed results, including successful trip planning but also disconnections and uploading sensitive information without permission.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20ST/Meta%20launches%20AI%20agent%20that%20can%20access%20other%20apps%20to%20send%20emails,%20make%20payments.pdf"},{"id":"st-09sep-12","title":"Mistral AI raises US$4.4b in Samsung-led round, at US$31b valuation","source":"ST","date":"09 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"French artificial intelligence startup Mistral AI has raised 3 billion euros (S$4.41 billion) at a valuation of more than 21 billion euros in a round led by Samsung Electronics, funding AI model development and computing infrastructure. The EU's Scaleup Europe Fund and PSG Equity co-led the round, announced on Sept 8, nearly doubling the Paris-based firm's 11.7 billion euro valuation from its 2025 round. Chief executive Arthur Mensch said the funding will advance industrial AI and support expansion in the US and Asia. Though far smaller than OpenAI and Anthropic, Mistral positions itself as a sovereign European alternative, with deals involving Airbus, BMW and ASML. It develops open-source large language models and is counting on traction with European governments wary of relying on American and Chinese AI.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20ST/Mistral%20AI%20raises%204.4b%20in%20Samsung-led%20round,%20at%2031b%20valuation.pdf"},{"id":"st-09sep-13","title":"OpenAI says it has cracked one of math's 'Millennium Problems'","source":"ST","date":"09 Sep 2026","tags":["Technology & AI"],"summary":"OpenAI said on Sept 8 that its newest AI technology had solved one of the Millennium Problems, a set of important unsolved mathematics questions, in another sign that AI is transforming the upper reaches of the field. The company said one of its latest, still-unreleased models needed just 88 hours to solve the Navier-Stokes existence and smoothness problem, a series of equations describing the movement of liquids and often used to predict weather. The proof claims to define a situation in which the equations break down. The Navier-Stokes problem was among seven selected by the Clay Mathematics Institute in 2000, each carrying a US$1 million prize; only one had previously been solved. Mathematician Terence Tao warned such AI capabilities could weaken human understanding of mathematics.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20ST/OpenAI%20says%20it%20has%20cracked%20one%20of%20math's%20'Millennium%20Problems'.pdf"},{"id":"st-09sep-14","title":"South Korea says Hormuz talks with France concern contribution options, not troop deployment","source":"ST","date":"09 Sep 2026","tags":["Geopolitics","Defence"],"summary":"South Korean President Lee Jae Myung and French President Emmanuel Macron discussed security and freedom of navigation in the Strait of Hormuz during a summit in Paris on Sept 8, but the talks did not concern troop deployment, Seoul's presidential office said. Lee said the two agreed to continue close coordination to restore freedom of navigation and stability of global supply chains. The strait is a critical energy route for South Korea, carrying 61 per cent of its crude oil and 54 per cent of its naphtha imports in 2025. National Security Adviser Wi Sung-lac said discussions focused on how Seoul could contribute to maritime security rather than troop deployment, with no decision made. Iran warned that any South Korean military participation in the Gulf would carry serious consequences.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20ST/South%20Korea%20says%20Hormuz%20talks%20with%20France%20concern%20contribution%20options,%20not%20troop%20deployme.pdf"},{"id":"st-09sep-15","title":"Trade and investment can support jobs in both Singapore and the US, says DPM Gan","source":"ST","date":"09 Sep 2026","tags":["Trade","Southeast Asia"],"summary":"The longstanding economic relationship between Singapore and the US shows that trade and investment can support jobs in both economies, Deputy Prime Minister Gan Kim Yong said at the 2026 Regional Economic Conference organised by AmChamSG on Sept 8. Since the US-Singapore Free Trade Agreement took effect in 2004, bilateral trade has grown significantly; today it supports around 350,000 American jobs, and the US surplus with Singapore exceeded US$33 billion (S$42 billion) in 2025. Around 6,600 American companies operate in Singapore, the Republic's largest investor, while over 250 Singapore firms operate across 45 US states. Gan cautioned that US tariffs, including a 12.5 per cent duty on Singapore from July and sectoral levies, are weighing on business decisions and adding to global uncertainty.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20ST/Trade%20and%20investment%20can%20support%20jobs%20in%20both%20Singapore%20and%20the%20US,%20says%20DPM%20Gan.pdf"},{"id":"st-09sep-16","title":"Ukraine contracting around 1,000 Patriot missiles from allies, defence chief says","source":"ST","date":"09 Sep 2026","tags":["Defence","Geopolitics"],"summary":"Ukraine is contracting a supply of around 1,000 missiles for US-designed Patriot air-defence systems with help from allies and a European Union loan, defence minister Yevhenii Khmara said on Sept 8. Speaking at a meeting of the Ukraine Defence Contact Group, Khmara said most of the missiles would only be shipped in the coming years and called for more urgent aid, asking Western partners to provide more air defence missiles from their stocks. He said Ukraine faced a US$27 billion (S$34 billion) shortfall in financing for drone supplies. Khmara said Russia was making no strategic gains along the 1,200km front line but was resorting to terror against Ukrainians. Russia resumed drone and missile attacks on Kyiv on Sept 8, killing five people in the capital.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20ST/Ukraine%20contracting%20around%201,000%20Patriot%20missiles%20from%20allies,%20defence%20chief%20says.pdf"},{"id":"st-09sep-17","title":"Why a foldable iPhone is Apple's most anticipated device launch","source":"ST","date":"09 Sep 2026","tags":["Technology & AI"],"summary":"Asian smartphone makers are increasingly challenging Apple, with Samsung set to reclaim the top spot in global shipment volume in 2026 and Chinese rivals Xiaomi, Oppo and Honor pushing into premium hardware at lower prices. Oppo's Find X9 Ultra launched at around US$1,100 (S$1,393), some US$100 cheaper than the iPhone 17 Pro Max, with a 200-megapixel camera, dual periscope zoom lenses, a 7,050mAh battery and 100W charging, far exceeding the iPhone's specifications. Honor's Magic8 Pro undercuts Samsung's Galaxy S26 Ultra while matching Apple on chip performance. As consumers compare devices feature by feature, Apple's premium may erode. The developments come as Tim Cook steps down as chief executive, handing the company to product chief John Ternus, sparking investor speculation about Apple's next moves.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20ST/Why%20a%20foldable%20iPhone%20is%20Apple's%20most%20anticipated%20device%20launch.pdf"},{"id":"bt-09sep-01","title":"Asean's digital economy pact promises to unlock US$2 trillion, but is unknown to 1 in 3 firms: poll","source":"BT","date":"09 Sep 2026","tags":["Southeast Asia","Trade","Technology & AI"],"summary":"The Digital Economy Framework Agreement (Defa), touted as the world's first regionwide pact of its kind, could unlock up to US$2 trillion for South-east Asia. Yet the 2026 Asean Business Outlook Survey, released at AmCham Singapore's regional conference, found 35 per cent of business leaders are unfamiliar with it, and 49 per cent are aware but have not assessed its implications. Conducted with Accenture and Google, the poll drew 184 firms across eight markets. Officials warned unfamiliar companies may be making architecture and compliance decisions that need unwinding once Defa takes effect. Its nine pillars covering data flows, digital trade and AI governance will shape how AI agents operate. Deputy PM Gan Kim Yong hopes to sign it this year.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20BT/Asean's%20digital%20economy%20pact%20promises%20to%20unlock%20US2%20trillion,%20but%20is%20unknown%20to%201%20in%203%20fir.pdf"},{"id":"bt-09sep-02","title":"Australian consumer sentiment slides under rates, petrol pressure","source":"BT","date":"09 Sep 2026","tags":["Finance & Markets","Society"],"summary":"Australian consumer sentiment fell sharply in September as fears of higher interest rates and rebounding fuel prices pressured household finances and the economic outlook. The Westpac-Melbourne Institute survey's main index slid 5.2 per cent to 84.4, reversing almost all of the prior month's 6 per cent gain and leaving it nearly 12 per cent below a year earlier, with pessimists outnumbering optimists. Westpac's Matthew Hassan cited fuel prices and interest rates, plus unease over weakening housing markets. The survey followed data showing core inflation above forecasts in July, fuelling speculation the Reserve Bank of Australia may raise rates a fourth time this year. The measure of family finances dropped 9.2 per cent, and mortgage-holder sentiment dived 13 per cent.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20BT/Australian%20consumer%20sentiment%20slides%20under%20rates,%20petrol%20pressure.pdf"},{"id":"bt-09sep-03","title":"Benchmark ministerial pay to rise to S$1.8 million; ministers to only get one-off increase of up to 9%","source":"BT","date":"09 Sep 2026","tags":["Politics","Society"],"summary":"Singapore's benchmark political salaries and MP allowances will rise from Oct 15, though not all officeholders get immediate raises. Prime Minister Lawrence Wong told Parliament the benchmark salary for starting-grade MR4 ministers will climb to S$1.8 million a year, from S$1.1 million, while MPs' monthly allowances rise to S$18,500 from S$13,750. The changes, following an independent review committee's recommendations, also affect the President, Speaker and Prime Minister. Wong pledged to donate his full annual increment of S$1.4 million to good causes for five years. Existing officeholders receive a one-off adjustment of up to 9 per cent tied to performance; an MR4 minister would rise to about S$1.2 million. The MR2 and MR3 grades will be combined and salary ranges widened.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20BT/Benchmark%20ministerial%20pay%20to%20rise%20to%20S1.8%20million%20ministers%20to%20only%20get%20one-off%20increase%20o.pdf"},{"id":"bt-09sep-04","title":"China hits Japan with anti-dumping measures for semiconductor chemical","source":"BT","date":"09 Sep 2026","tags":["Geopolitics","Trade","Technology & AI"],"summary":"China unveiled preliminary anti-dumping measures on imports of dichlorosilane from Japan, a chemical used to process silicon wafers into semiconductors, escalating retaliation in a diplomatic dispute over Taiwan. From Sep 8, importers must provide cash deposits of up to 99.2 per cent, Beijing's Commerce Ministry said. Deposit rates were set at 80.8 per cent for Denal Silane and 99.2 per cent for Shin-Etsu Chemical and other producers. Tensions have simmered since November 2025, when Japanese PM Sanae Takaichi suggested Tokyo could deploy its military if China moved on Taiwan. The ruling stems from an investigation launched in January, with Beijing citing substantial harm to domestic industry. Japan leads globally in ultra-high purity dichlorosilane, though South Korea overtook it as China's biggest supplier in 2025.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20BT/China%20hits%20Japan%20with%20anti-dumping%20measures%20for%20semiconductor%20chemical.pdf"},{"id":"bt-09sep-05","title":"Energy diversification in Singapore has to make business sense: Gan Siow Huang","source":"BT","date":"09 Sep 2026","tags":["Energy","Southeast Asia"],"summary":"Singapore companies' efforts to diversify energy supplies must be grounded in market and commercial sense, said Minister of State for Trade and Industry Gan Siow Huang at the S&P Asia Pacific Petroleum Conference. The key question is where additional resilience is worth paying for, she said. Around 60 per cent of South-east Asia's crude imports have traditionally come from the Middle East, but the US-Iran war is a major disruption: flows through the Strait of Hormuz fell from 20 million barrels a day to just 2.7 million between March and May. Gan said diversification means creating tested, activatable alternatives rather than abandoning established ties. She stressed resilience requires capabilities across the value chain, noting Singapore's role hosting players like ADNOC, Petrobras and Bharat Petroleum.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20BT/Energy%20diversification%20in%20Singapore%20has%20to%20make%20business%20sense%20Gan%20Siow%20Huang.pdf"},{"id":"bt-09sep-06","title":"Floating wind farms, bendable solar cells: How Koike wants to rewrite Tokyo's energy blueprint","source":"BT","date":"09 Sep 2026","tags":["Energy","Environment"],"summary":"Tokyo Governor Yuriko Koike outlined plans to overhaul the city's energy blueprint, telling The Straits Times the metropolis will tap fierce winds around its remote Pacific islands. The Tokyo Metropolitan Government administers 219 islands, and Koike wants gigawatt-class floating offshore wind turbines near the Izu Islands. Onshore, she is championing ultra-thin, flexible perovskite solar cells dubbed \"Air-Solar\" that can wrap around building facades, made using iodine, where Japan is the world's second-largest producer. Tokyo was the first prefecture to mandate solar panels on new single-family homes from April 2025. The capital is also accelerating a hydrogen-based economy, studying pipeline networks and aiming to scale from 150 fuel-cell buses to 5,000 hydrogen vehicles by 2030, as it targets net-zero emissions by 2050.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20BT/Floating%20wind%20farms,%20bendable%20solar%20cells%20How%20Koike%20wants%20to%20rewrite%20Tokyo's%20energy%20bluepr.pdf"},{"id":"bt-09sep-07","title":"Japan revises Q2 GDP up to annualised 1.4% expansion","source":"BT","date":"09 Sep 2026","tags":["Finance & Markets"],"summary":"Japan's economy grew faster than initially estimated in the April-June quarter, supported by business spending that was less weak than the first reading, revised Cabinet Office data showed. GDP expanded an annualised 1.4 per cent, up from the preliminary 1.1 per cent but below economists' median forecast of 1.6 per cent. Without annualisation, growth was 0.4 per cent, matching forecasts. Capital expenditure fell 0.9 per cent, revised up from a 1.2 per cent drop, while private consumption was flat. External demand added 0.5 percentage point. Analysts said the resilience clears the way for a Bank of Japan rate hike, with swap rates indicating a 98 per cent chance of a 25 basis-point rise to 1.25 per cent in September.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20BT/Japan%20revises%20Q2%20GDP%20up%20to%20annualised%201.4%20expansion.pdf"},{"id":"bt-09sep-08","title":"Mapletree Logistics Trust to sell Australian logistics property for US$20.2 million","source":"BT","date":"09 Sep 2026","tags":["Finance & Markets"],"summary":"Mapletree Logistics Trust (MLT) has agreed to sell a vacant logistics property in Derrimut, Victoria, for A$28 million (US$20.2 million), the trust manager said in a bourse filing. The sale of 365 Fitzgerald Road to an unrelated third party, part of its portfolio rejuvenation strategy, is priced 3.7 per cent above the asset's latest valuation of A$27 million as at Mar 31, 2026. MLT acquired the property in 2016 for A$18 million; it has been vacant since April 2026 after a lease expired. The manager cited the asset's age and limited development potential. Completed in 2006, it spans about 16,114 square metres. Capital released gives MLT flexibility for high-specification modern facilities. Completion is expected by Q3 of its 2027 financial year, with no material impact on net asset value.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20BT/Mapletree%20Logistics%20Trust%20to%20sell%20Australian%20logistics%20property%20for%20US20.2%20million.pdf"},{"id":"bt-09sep-09","title":"North Korea and Russia open their first road bridge, a symbol of expanding ties","source":"BT","date":"09 Sep 2026","tags":["Geopolitics"],"summary":"North Korea and Russia opened their first road bridge on Monday, a structure spanning the Tumen river that both sides cast as a milestone in their deepening strategic partnership. The first flag-adorned trucks crossed the 1km, two-lane bridge as Russian PM Mikhail Mishustin and North Korea's Premier Pak Thae Song addressed workers by video link. Construction began in April last year after being agreed during President Vladimir Putin's 2024 visit. Previously, planks placed on a nearby 1959 rail bridge were the only way to move vehicles across. Mishustin called ties \"at an unprecedented high level\" and the opening \"a genuinely historic event,\" saying up to 300 vehicles could cross daily. The bridge is named after Yakov Novichenko, a Red Army soldier credited with saving Kim Il Sung in 1946.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20BT/North%20Korea%20and%20Russia%20open%20their%20first%20road%20bridge,%20a%20symbol%20of%20expanding%20ties.pdf"},{"id":"bt-09sep-10","title":"Nvidia-backed AI firm Firmus signs deal with OpenAI for Malaysia data centre capacity","source":"BT","date":"09 Sep 2026","tags":["Technology & AI","Southeast Asia"],"summary":"Australia's Firmus said it had signed a multi-year deal with OpenAI to supply computing capacity from two Malaysian data centres, making the ChatGPT maker an anchor customer as demand surges for AI infrastructure. The deal comes ahead of Firmus's rumoured 2026 initial public offering, potentially one of Australia's largest in years. The firm was valued above US$10.5 billion in its last fundraising, backed by Nvidia, Jane Street, Blackstone funds and Coatue Management. The agreement raised Firmus's contracted capacity across customers to more than 900 megawatts. Its portfolio includes operational data centres in Australia and Singapore, with five under development across Asia-Pacific. Firmus will deploy Nvidia's next-generation Vera Rubin processors. Malaysia has become South-east Asia's fastest-growing data centre market, though the buildout has drawn scrutiny over electricity and water use.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/09%20Sep%202026/09%20Sep%20BT/Nvidia-backed%20AI%20firm%20Firmus%20signs%20deal%20with%20OpenAI%20for%20Malaysia%20data%20centre%20capacity.pdf"},{"id":"bt-09sep-11","title":"Pine Grove's S$1.78 billion en bloc attempt could get fresh start under opt-in to new rules","source":"BT","date":"09 Sep 2026","tags":["Finance & Markets","Society"],"summary":"Pine Grove, a 660-unit Ulu Pandan condominium on its fifth collective sale attempt, could benefit from new rules lowering the consent threshold from 80 to 70 per cent. While the existing framework continues where signature collection has begun, developments aged 40 years and older in transition have an \"opt-in route\" to restart under a new framework discussed in Parliament. Pine Grove's current agreement lapses on Sep 20, with about 67.5 per cent of owners having signed as at late August. Minister Edwin Tong said opting-in developments get seven months to reach the threshold. The site spans 8
