 at a Ford plant in Spain. BYD's overseas shipments lifted global sales; margin pressure may persist in H2.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/China's%20car%20sales%20extend%20slide%20as%20shift%20accelerates%20to%20overseas%20markets.pdf"}, {"id": "bt-07", "title": "Has the Iran war damaged US economic credibility?", "source": "BT", "date": "12 Aug 2026", "tags": ["Geopolitics", "Finance & Markets"], "summary": "Evidence from 2026 suggests US economic credibility is strained rather than broken after the Iran war, which began on Feb 28. Growth had already slowed, expanding just 1.4% annualised in Q4 2025, and analysts estimate the conflict could shave 0.3 percentage point off 2026 GDP, cutting growth to 1.8%. Petrol prices have risen over US$1 a gallon, and spending has held up mainly because wealthier households keep consuming. Economists warned the deeper risk lies in tariff policy, assertive foreign policy and fiscal pressures rather than the war itself. Counter-intuitively, the war reinforced the US dollar's safe-haven role as gold, the franc, yen and bonds stumbled; foreign Treasury demand held up. Structural advantages persist, though fiscal strain and Fed pressure will outlast the ceasefire.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Has%20the%20Iran%20war%20damaged%20US%20economic%20credibility.pdf"}, {"id": "bt-08", "title": "Hong Kong's low-tax lure is getting a reality check", "source": "BT", "date": "12 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "Hong Kong's competitiveness as a financial centre faces two opposing forces reshaping its US$5.4 trillion asset-management industry, now the world's largest cross-border wealth hub. The city is expected to approve landmark tax reform wiping effective taxes on qualified carried interest and performance fees to zero, applied retroactively from April 2025 and covering commodities and crypto. That is accelerating hedge-fund expansion, lifting office rents and luxury retail. But Beijing's cross-border tax crackdown, enforcing a 20% overseas capital-gains levy via CRS and taxing offshore trusts, threatens private wealth managers as mainland clients may face bills or pull money. Investment banking and prime brokerage could benefit while private wealth suffers. Mainland flows still make up 59% of cross-border wealth, making the tax reform crucial.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Hong%20Kong's%20low-tax%20lure%20is%20getting%20a%20reality%20check.pdf"}, {"id": "bt-09", "title": "Keppel unit's telco subsea cable network receives facilities-based operator licence from IMDA", "source": "BT", "date": "12 Aug 2026", "tags": ["Technology & AI", "Southeast Asia"], "summary": "Keppel Kruger Holdings, a wholly owned subsidiary of Keppel's connectivity division, has been granted a facilities-based operator licence by Singapore's Infocomm Media Development Authority, allowing it to own, operate and maintain telecommunications infrastructure and provide services tied to the Kruger Cable System. The international subsea fibre-optic network, developed by Keppel, is expected to connect Singapore, Malaysia, Bangladesh, India and Oman (Salalah), with branches across South Asia. It will land at Tuas on Singapore's western side, sharing the beach manhole used by Keppel's Bifrost Cable System. Connectivity CEO Manjot Singh Mann said the system furthers Keppel's subsea strategy as AI drives \"unprecedented demand\" for resilient international connectivity. Keppel plans to mobilise third-party capital through its private infrastructure fund, with an investment decision expected by end-2026.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Keppel%20unit's%20telco%20subsea%20cable%20network%20receives%20facilities-based%20operator%20licence%20from%20IMDA.pdf"}, {"id": "bt-10", "title": "Kioxia says investment vehicle for SK Hynix is top shareholder", "source": "BT", "date": "12 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Kioxia's biggest shareholder is now an investment vehicle holding shares claimed by rival SK Hynix. The flash-memory maker's former parent Toshiba trimmed its stake to about 14.12%, from 14.48%, as at Aug 3, Kioxia said. That makes BCPE Pangea Cayman2, set up by Bain Capital, the top shareholder with 14.19%. South Korea's SK Hynix holds bonds convertible into \"substantially all\" of BCPE Pangea Cayman2's voting rights, according to Kioxia's annual report, which explicitly lists SK Hynix's claim as a risk factor representing a possible conflict of interest. SK Hynix joined the Bain Capital-led consortium that acquired Kioxia in 2018 and pledged to keep its stake at or below 15% of voting rights until 2028, unless Kioxia agrees to a larger holding.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Kioxia%20says%20investment%20vehicle%20for%20SK%20Hynix%20is%20top%20shareholder.pdf"}, {"id": "bt-11", "title": "Malaysia's June industrial production up 6.5%, below forecast", "source": "BT", "date": "12 Aug 2026", "tags": ["Southeast Asia", "Trade"], "summary": "Malaysia's industrial production index rose 6.5% year on year in June, below expectations, government data showed. Economists in a Reuters poll of 11 respondents had forecast a 7% expansion in factory output. May's reading was revised slightly upwards to 8.5%, from an originally reported 8.4%.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Malaysia's%20June%20industrial%20production%20up%206.5,%20below%20forecast.pdf"}, {"id": "bt-12", "title": "Malaysia's SD Guthrie sees El Niño impacting 2027-28 palm oil output", "source": "BT", "date": "12 Aug 2026", "tags": ["Environment", "Southeast Asia", "Energy"], "summary": "Malaysia's SD Guthrie, one of the world's largest palm oil producers, expects production to be hit in 2027 and 2028 as El Niño brings drier, hotter weather, though 2026 output should stay largely unaffected given a 12-to-16-month lag, CEO Mohd Haris Mohd Arshad said. The company posted April-June net profit of RM987 million, nearly double a year earlier, though revenue fell to RM4.94 billion from RM5.17 billion. Performance was underpinned by industrial development and downstream gains offsetting a weaker upstream business, cushioned by higher crude palm oil and palm kernel prices. Tightening supplies and resilient demand, boosted by Indonesia's B50 biodiesel mandate and firm crude prices, should keep CPO elevated. Benchmark CPO has climbed 18% to RM4,723 a ton this year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Malaysia's%20SD%20Guthrie%20sees%20El%20Nino%20impacting%202027-28%20palm%20oil%20output.pdf"}, {"id": "bt-13", "title": "Non-stop flights to emerging markets would boost Singapore economy: MTI report", "source": "BT", "date": "12 Aug 2026", "tags": ["Southeast Asia", "Trade"], "summary": "Stronger air links to developing markets could add a healthy tailwind to Singapore's economy, according to simulations in a Ministry of Trade and Industry report. Introducing non-stop flights to regions such as Latin America, Africa and Central Asia would boost investment and trade access, and improve Singapore's hub status via more passenger and cargo transfers. Changi Airport aims to connect to 200 cities by the mid-2030s, up from 170. Economists estimated that axing a stopover to a similar-sized economy within 7,500 km could yield S$200 million more in annual foreign direct investment, S$520 million in investment abroad, and S$225 million in economic value added, with wider gains in productivity, employment and wages. New links to North America and Europe would also yield significant gains, subject to aircraft availability and commercial viability.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Non-stop%20flights%20to%20emerging%20markets%20would%20boost%20Singapore%20economy%20MTI%20report.pdf"}, {"id": "bt-14", "title": "Oil prices continue climb on US-Iran deal doubts; stocks retreat", "source": "BT", "date": "12 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "Oil prices rose on Wednesday morning as doubts over a US-Iran peace deal and fresh ship attacks fuelled Middle East supply concerns, even as industry data showed US crude inventories expanding. Brent gained 0.81% to US$89.63 a barrel while WTI climbed 0.85% to US$83.91, both after settling more than US$1 higher on Tuesday at their highest since Jul 31. The US and Yemen's Houthis reported separate attacks in the Strait of Hormuz and Bab el-Mandeb. Iranian security official Mohsen Rezaei said Hormuz would stay closed unless the US met Iran's conditions. Hormuz traffic dropped to six vessels on Monday versus a pre-war average of 125 to 140. API data reportedly showed crude stocks rose 9.1 million barrels. The EIA expects 600,000 bpd of disruptions through end-2027.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Oil%20prices%20continue%20climb%20on%20US-Iran%20deal%20doubts%20stocks%20retreat.pdf"}, {"id": "bt-15", "title": "Resilient Europe turns into a winning bet for money managers", "source": "BT", "date": "12 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "European markets are charging ahead in 2026, defying forecasts that the Iran war would tip the region into stagflation. The Stoxx Europe 600 has rallied about 12%, with German, Italian and French benchmarks at records, German bonds outperforming Treasuries and the euro near a two-month high. Investors are drawn by the best earnings season in nearly four years, MSCI Europe posting a 17% jump in Q2 profits, and momentum cool enough not to trouble the ECB. A basket of European AI adopters rose 14% versus 4% for US hyperscalers. European equities saw their strongest inflows in a decade excluding 2021. Bond investors favour the ECB's more predictable path over the Fed's. Skeptics cite 26% higher oil, elusive Hormuz reopening and French and Italian election risks next year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Resilient%20Europe%20turns%20into%20a%20winning%20bet%20for%20money%20managers.pdf"}, {"id": "bt-16", "title": "Revenue, employment improve with business AI use: MTI report", "source": "BT", "date": "12 Aug 2026", "tags": ["Technology & AI", "Society"], "summary": "Workplace AI adoption is linked to quick revenue and employment gains but not yet higher productivity and profit, a Ministry of Trade and Industry study found. Singapore businesses saw revenue rise 16% and employment 8% one year after adopting AI, with net job growth offsetting some losses, said IMDA senior economist Sarah Liu, the report's author. Gains mainly benefited higher-income, mid-career workers earning S$7,000-S$10,000 monthly and aged 35 to 44, plus higher-skilled Employment Pass holders. Roughly 8% of firms were identified as AI users, concentrated in infocomm, electronics, professional services and finance. Finance and insurance posted the largest gains, revenue up 21% and profit up 73%. No statistically significant productivity or profit lift emerged in the first four years, likely pending complementary investments. Experts see medium-term uplift as agentic AI spreads.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Revenue,%20employment%20improve%20with%20business%20AI%20use%20MTI%20report.pdf"}, {"id": "bt-17", "title": "ST Engineering shares fall as much as 4.7% after reporting softer Q2 orders", "source": "BT", "date": "12 Aug 2026", "tags": ["Defence", "Finance & Markets"], "summary": "Shares of ST Engineering fell as much as 4.7% on Tuesday after the defence and engineering group reported a year-on-year drop in Q2 order wins. It secured S$2.9 billion in new contracts in Q2 2026, a 38.3% drop from S$4.7 billion a year earlier, with commercial aerospace at S$1.2 billion, defence and public security S$1.2 billion, and urban solutions and satcom S$500 million, all down from year-ago levels. The counter fell to S$9.83 early on before ending 1.2% lower at S$10.20. Citi analyst Luis Hilado attributed the softness to contract-completion timing, said underlying demand remained healthy, and kept a S$10.65 target. Singapore's High Court separately rejected a bid to bring unit ST Engineering Aerospace Systems into a trademark infringement suit over allegedly counterfeit aircraft components.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/ST%20Engineering%20shares%20fall%20as%20much%20as%204.7%20after%20reporting%20softer%20Q2%20orders.pdf"}, {"id": "bt-18", "title": "Swiss parliament panel fails to reach deal on UBS capital rules", "source": "BT", "date": "12 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "A Swiss parliamentary committee failed on Tuesday to agree on proposed new banking regulations for UBS, as some lawmakers pushed to soften tougher rules drafted after Credit Suisse's collapse. The draft Bill would require UBS to hold about US$20 billion in additional Common Equity Tier-1 capital to help prevent another crisis and protect taxpayers, but UBS argues the requirement is excessive and would undermine competitiveness. At its heart is a proposal for UBS to fully capitalise foreign subsidiaries, up from 60% currently, using CET1 alone. The upper-house committee discussed allowing cheaper Additional Tier 1 capital and strengthening AT1 instruments with a higher trigger point. No deal was reached; it reconvenes on Aug 31, aiming for an upper-house vote in September.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Swiss%20parliament%20panel%20fails%20to%20reach%20deal%20on%20UBS%20capital%20rules.pdf"}, {"id": "bt-19", "title": "US existing home sales post second straight monthly decline in July", "source": "BT", "date": "12 Aug 2026", "tags": ["Finance & Markets"], "summary": "US existing home sales fell for a second straight month in July, with any rebound likely limited by higher mortgage rates and tight supply. Sales dropped 1.7% to a seasonally adjusted annual rate of 4.06 million units, slightly above the 4.05 million forecast. Last month's closings reflected contracts signed in May and June as mortgage rates resumed rising; the 30-year fixed rate has jumped 71 basis points since the war began in February, averaging 6.69% last week, the highest since July 2025. Higher rates also deter homeowners with sub-5% mortgages from selling. Inventory fell 1.9% to 1.54 million units, a 4.6-month supply. The median price rose 2% to US$434,100; first-time buyers made up 29% of sales, below the 40% seen as healthy.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/US%20existing%20home%20sales%20post%20second%20straight%20monthly%20decline%20in%20July.pdf"}, {"id": "bt-20", "title": "US officials work to close supply chain gaps as foreign investment grows", "source": "BT", "date": "12 Aug 2026", "tags": ["Trade", "Politics"], "summary": "US officials said they are working closely with foreign investors to identify gaps in the manufacturing supply chain and help small and medium businesses scale up as foreign investment surges. Treasury Assistant Secretary Chris Pilkerton and Small Business Administrator Kelly Loeffler said President Trump's tariffs and deregulation were fuelling investment, but components must also be available. Speaking at a Philadelphia shipyard acquired by Hanwha, whose CEO David Kim pledged US$5 billion and up to 10,000 jobs, Pilkerton described a new pilot \"Strategic Vendor Programme\" to strengthen domestic supply chains. Treasury also launched a website and \"Known Investor Programme\" to make CFIUS reviews faster and more transparent. Loeffler said the SBA provided about US$3 billion for manufacturers in 2025, including US$32 million for shipbuilders.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/US%20officials%20work%20to%20close%20supply%20chain%20gaps%20as%20foreign%20investment%20grows.pdf"}, {"id": "bt-21", "title": "Who is Destry Damayanti, the first woman set to lead Indonesia's central bank?", "source": "BT", "date": "12 Aug 2026", "tags": ["Southeast Asia", "Finance & Markets", "Politics"], "summary": "President Prabowo Subianto nominated Bank Indonesia senior deputy governor Destry Damayanti to lead the central bank, the sole candidate to succeed Perry Warjiyo, whose sudden July resignation rattled markets. If confirmed after parliamentary scrutiny, she would be the first woman to head BI. Destry, 63, is a veteran economist and central banker with an economics degree from the University of Indonesia and a master's from Cornell, prior roles as chief economist at Bank Mandiri and at the Deposit Insurance Corporation, and BI experience since 2019. Her nomination was submitted on Aug 10, with a fit-and-proper test on Aug 13 and plenary vote expected Aug 14. The rupiah strengthened 0.75% to 17,750 per dollar. Analysts see policy continuity; her priorities include supporting the rupiah amid Prabowo's 8% growth target.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Who%20is%20Destry%20Damayanti,%20the%20first%20woman%20set%20to%20lead%20Indonesia's%20central%20bank.pdf"}, {"id": "bt-22", "title": "Yen inches towards key level of 160 per US dollar as intervention concerns mount", "source": "BT", "date": "12 Aug 2026", "tags": ["Finance & Markets"], "summary": "The yen edged closer to a key level against the US dollar, raising concerns over renewed Japanese intervention. It ended little changed after falling as much as 0.1% to touch 159.39 per dollar on Tuesday, with traders bracing for the 160 level that has historically capped yen weakness. Mizuho's Masayuki Nakajima warned a decisive break above 160 could intensify intervention concerns. The yen had its worst day since mid-February on Monday, weakening 1%, walking back gains from Japan and the US's first coordinated intervention since 1998, which had lifted it from near 164 to a peak of 155. Wide US-Japan rate differentials, fiscal worries and geopolitical uncertainty continue to weigh. Analysts said sustained strength ultimately requires a more hawkish BOJ.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20BT/Yen%20inches%20towards%20key%20level%20of%20160%20per%20US%20dollar%20as%20intervention%20concerns%20mount.pdf"}, {"id": "scmp-01", "title": "'Islamic Nato'? Why Pakistan's new defence pact has India on edge", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "A tripartite Mecca Joint Defence Agreement signed Friday by Pakistan, Saudi Arabia and Turkey treats an armed attack on one signatory as an attack on all, following a September Saudi-Pakistan bilateral pact. Pakistani Defence Minister Khawaja Muhammad Asif floated it as a model for a wider Nato-like Islamic alliance, unsettling New Delhi. Analysts say the bloc could evolve incrementally into an identity-based grouping extending into the Indian Ocean, especially if Bangladesh, exploring JF-17 jet purchases, or the Maldives aligns. Former Indian army vice-chief Satinder Kumar Saini called it \"more about political signalling.\" Others note Pakistan's reliance on IMF bailouts, where the US is the largest contributor, will make Islamabad cautious about upsetting Washington.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/'Islamic%20Nato'%20Why%20Pakistan's%20new%20defence%20pact%20has%20India%20on%20edge.pdf"}, {"id": "scmp-02", "title": "Alibaba says modular design delivers AI data centres in 100 days at 10% lower cost", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Technology & AI"], "summary": "Alibaba says its proprietary CUBE 5.0 modular architecture can deliver large-scale AI data centres in just 100 days, versus standard domestic timelines of six to 12 months and 12 to 18 months in the US, while cutting construction costs 10 per cent, state-backed China Securities Journal reported. Alibaba Cloud expects to more than double modular delivery efficiency this year. Unveiled in 2024, CUBE 5.0 lifted modularity across power, cooling, security, management and fire protection from 30 to 90 per cent, with components prefabricated in factories and assembled on-site. Piloted in Ulanqab and Zhongwei, it is certified for European and Southeast Asian roll-out. The push forms part of Alibaba's 380 billion yuan (US$56.3 billion) AI capex commitment; it recently opened data centres in France. Alibaba owns the SCMP.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/Alibaba%20says%20modular%20design%20delivers%20AI%20data%20centres%20in%20100%20days%20at%2010%20lower%20cost.pdf"}, {"id": "scmp-03", "title": "Alibaba tests paid AI appetite with US$30 annual office-assistant subscription", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Technology & AI"], "summary": "Alibaba is testing willingness to pay for AI, launching three paid membership tiers for the office assistant in its Qwen app, with annual plans ranging from 200 yuan (US$29.60) to 1,499 yuan for the flagship version, per Apple's App Store. Users can buy extra video-generation credits priced between 26 and 968 yuan; the core Qwen chatbot stays free. Running large language models and multi-modal agents at scale demands vast computing resources, making monetisation critical to offsetting rising infrastructure costs. Alibaba is expanding Qwen into a broader agent ecosystem, letting third-party developers integrate tools across phones, PCs and smart glasses spanning over 10 sectors. The strategy mirrors OpenAI and Anthropic, plus domestic rivals Moonshot AI and Z.ai. Alibaba owns the SCMP.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/Alibaba%20tests%20paid%20AI%20appetite%20with%20US30%20annual%20office-assistant%20subscription.pdf"}, {"id": "scmp-04", "title": "Beyond the numbers: why China's carrier force won't copy the US model", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Defence experts argue China's carrier force is developing a doctrine distinct from the US model, complementing land-based air power, anti-ship missiles and rocket forces rather than projecting power far from home. The Pentagon last year estimated Beijing would field nine carriers by 2035, but the IISS says quieter shifts in pilot recruitment, command and fleet integration matter more. All known Chinese carrier commanders come from surface warfare, not naval aviation, and share authority with political commissars. Strike power is spread across escorts, submarines and missile forces rather than concentrated in the air wing. Analysts Brendan Mulvaney and Christopher Sharman expect carriers deployed on a conflict's periphery, supporting counter-intervention deep in the western Pacific and Indian Ocean, not spearheading a Taiwan assault.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/Beyond%20the%20numbers%20why%20China's%20carrier%20force%20won't%20copy%20the%20US%20model.pdf"}, {"id": "scmp-05", "title": "China detains Japanese executives in dual-use technology export probe: report", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Geopolitics", "Trade"], "summary": "China has detained several Japanese nationals, including executives of firms with China offices, for allegedly violating export restrictions on dual-use goods, Japanese newspaper The Mainichi reported, citing sources. Some were held on entry to secure cooperation with inquiries. Dual-use items span goods with civilian and military applications, including critical minerals for drones and semiconductors. The detentions follow earlier crackdowns, including two workers seized in Dalian in May over rare-earth allegations. Beijing's foreign ministry did not confirm the cases but said authorities \"handled criminal cases in accordance with the law.\" Ties worsened after Japanese PM Sanae Takaichi said a Taiwan attack could prompt military intervention. China has added Japanese entities to export-control lists; its rare-earth exports to Japan fell 51 per cent in the first half.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/China%20detains%20Japanese%20executives%20in%20dual-use%20technology%20export%20probe%20report.pdf"}, {"id": "scmp-06", "title": "China is pitching its AI models to Europe, but is it enough to avoid 2-horse race with US?", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "As the US and China consolidate AI dominance, attention turns to whether Europe can form a distinct third pole, or \"G3,\" or stay in Washington's orbit. The 2026 Global AI Innovation Index put the US at 78.44 points and China at 60.49, with third-placed Britain far behind on 39.99. Beijing is pitching open-source models like DeepSeek to European capitals as cost-effective alternatives to US tech, with ambassadors courting Britain and the EU. Analyst Cui Hongjian sees a forming \"G2\" but longer-term room for a G3, urging Europe to adopt China-compatible infrastructure. Siemens already uses DeepSeek and Z.ai. Skeptics say a genuine third pole requires owning the full stack of chips, cloud and energy; without faster compute investment, Europe risks becoming a passenger.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/China%20is%20pitching%20its%20AI%20models%20to%20Europe,%20but%20is%20it%20enough%20to%20avoid%202-horse%20race%20with%20US.pdf"}, {"id": "scmp-07", "title": "China says US tried to buy its super magnet that has '40% higher' performance", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "Chinese state media says the US Department of Energy's Brookhaven National Laboratory, which once \"monopolised\" superconducting-magnet technology, contacted the Institute of High Energy Physics in May last year hoping to buy a Chinese-made combined superconducting magnet used in the Beijing Electron-Positron Collider's latest upgrade. Researcher Zhu Yingshun said the device, developed over 13 years, performs \"40 per cent higher\" than American products. There is no indication the US lab acquired it. Combined magnets perform multiple magnetic functions simultaneously; collider magnets use niobium and titanium rather than export-controlled rare earths. The 2021-completed upgrade achieved full equipment localisation and tripled peak luminosity. The collider recently offered the strongest evidence yet for the glueball particle and has found 32 new particles since 2009.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/China%20says%20US%20tried%20to%20buy%20its%20super%20magnet%20that%20has%20'40%20higher'%20performance.pdf"}, {"id": "scmp-08", "title": "China's economic problems have been diagnosed. Will policymakers act?", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "Two establishment economists argue China's economy has been \"running cold\" for three years, rejecting the popular \"K-shaped\" framing of strong tech offsetting weak demand. At Renmin University forums, Tsinghua's Li Daokui put real unemployment at 10.2 per cent, or 24 million chronically underemployed, and noted fixed-asset investment fell 4.1 per cent early this year, a contraction previously seen only in 1961 and 1967. Former official Liu Shijin urged transferring 20 trillion yuan (US$3 trillion) of state capital to social security and lifting consumption above 60 per cent. Second-quarter GDP grew just 4.3 per cent, below target. The July 30 Politburo acknowledged difficulties but kept large-scale stimulus off the table, relying on \"AI Plus\" initiatives while firms build capacity abroad.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/China's%20economic%20problems%20have%20been%20diagnosed.%20Will%20policymakers%20act.pdf"}, {"id": "scmp-09", "title": "China's hypersonic weapons can be guided by the stars if GPS fails: report", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Defence", "Technology & AI"], "summary": "A project led by the Guangdong Aerospace Research Academy, which passed final expert review Monday, has developed celestial navigation letting hypersonic weapons steer by the stars when GPS or BeiDou is jammed or fails. Celestial navigation is self-contained and immune to electromagnetic interference, serving as a final backup paired with inertial systems. The challenge: at Mach 5-plus, friction creates a plasma sheath exceeding 1,000 degrees Celsius that bends starlight and emits blinding infrared. Researchers built radiation databases and simulation software with spectral resolution of 0.12 nanometres, enabling a prototype star sensor. Star-pattern recognition exceeded 99 per cent in clean conditions and stayed above 80 per cent under interference, with accuracy better than 5 arcseconds. The technology also has civilian combustion-diagnostics uses.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/China's%20hypersonic%20weapons%20can%20be%20guided%20by%20the%20stars%20if%20GPS%20fails%20report.pdf"}, {"id": "scmp-10", "title": "Facebook parent Meta to unwind US$2 billion Manus AI deal after Beijing block", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "Meta Platforms is fully unwinding its roughly US$2 billion acquisition of Chinese-founded AI agent platform Manus, more than three months after Beijing blocked the deal on national-security grounds, marking another US-China tech decoupling. On Tuesday Manus told users it would delete data generated by certain users on or after December 29, when Meta acquired it, as it returns to independent operations; affected users must back up by August 23. Manus, built by 2022-founded Butterfly Effect, had rebranded as a Singapore company, shedding China staff to access US models and Nvidia chips before Meta's late-December purchase. Beijing's probe concluded in April ordering the unwind. Tencent was reportedly in talks to become the largest shareholder. User data will stay stored in the US and Singapore.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/Facebook%20parent%20Meta%20to%20unwind%20US2%20billion%20Manus%20AI%20deal%20after%20Beijing%20block.pdf"}, {"id": "scmp-11", "title": "Gold breakout rally sends Chinese bullion stocks near highs as central banks keep buying", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Finance & Markets"], "summary": "Rebounding gold prices have lifted shares of Chinese producers Zijin Mining and Chifeng Jilong Gold at least 40 per cent from July lows, near record highs, with a mainland gold-stock gauge up about 25 per cent. Bullion rose 1.3 per cent to US$4,479 an ounce Tuesday as weak US jobs data eased rate-hike fears, though it remains 18 per cent below January's US$5,447 peak after an oil-driven selloff. Gold broke above its 50-day moving average this month. Central banks bought a record 289 tonnes in the second quarter, up 62 per cent, led by Poland (51 tonnes) and China (33 tonnes). State Street forecasts US$5,000 by early 2027 and Deutsche Bank US$4,700 by year-end, citing sovereign-debt risks and reserve diversification.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/Gold%20breakout%20rally%20sends%20Chinese%20bullion%20stocks%20near%20highs%20as%20central%20banks%20keep%20buying.pdf"}, {"id": "scmp-12", "title": "Hong Kong property recovery faces new risk as China widens offshore tax net", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Finance & Markets", "Society"], "summary": "Hong Kong's property recovery could face a fresh test if China's crackdown on offshore wealth extends from insurance returns to property income, curbing mainland demand and pressuring decentralised office markets, analysts say. Beijing reportedly imposes a 20 per cent personal income tax on certain offshore returns by mainland residents, including Hong Kong insurance gains; property is not yet covered but scrutiny may broaden. UBS estimates a 20 per cent tax would cut net residential yields from 2.2 to 1.8 per cent. Insurers occupy about 6 per cent of grade-A office stock, concentrated in Kowloon East and Island East. Mainland buyers account for 7 to 33 per cent of residential transaction value. First-half transactions hit 48,458 units, 72.5 per cent of 2025's total.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/Hong%20Kong%20property%20recovery%20faces%20new%20risk%20as%20China%20widens%20offshore%20tax%20net.pdf"}, {"id": "scmp-13", "title": "Jellyfish force shutdown of 3 reactors at French nuclear power plant", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Energy", "Environment"], "summary": "EDF shut three reactors at France's Gravelines nuclear plant near Dunkirk after a swarm of jellyfish clogged the seawater pumps used to cool the units, the utility said Tuesday. Three reactors went offline Monday and a fourth's output was halved, leaving one at full capacity; a sixth was already down for maintenance. EDF said the incident posed no risk to safety, personnel or the environment. Gravelines, western Europe's largest plant with six 900-megawatt reactors, was similarly halted by jellyfish a year ago. France's nuclear output has been repeatedly disrupted this year by heatwaves and droughts, with a 15.6 per cent shortfall recorded Sunday. Experts blame overfishing, plastic pollution and warming seas for surging jellyfish populations. Similar shutdowns hit Sweden in 2013 and Japan in 1999.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/Jellyfish%20force%20shutdown%20of%203%20reactors%20at%20French%20nuclear%20power%20plant.pdf"}, {"id": "scmp-14", "title": "Meta to challenge China's open-weight AI dominance amid US regulatory fears", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Technology & AI"], "summary": "Meta Platforms is renewing its open-source AI push to challenge China's dominance in open-weight models and lure US customers wary of looming Washington restrictions on Chinese AI. On Monday it launched Muse Glimmer, a 30-billion-parameter model light enough to run locally, and said it would release weights of its flagship Muse Spark 1.2. CEO Mark Zuckerberg pledged \"personal superintelligence to billions of people.\" Analysts say Spark 1.2 ranks between Claude Sonnet 5 and GPT-5.6 Terra, trailing Moonshot's Kimi K3 but beating Zhipu's GLM-5.2, with the advantage of being \"not Chinese.\" Washington reportedly weighs curbs on foreign open-weight models. Analysts warn adoption ultimately hinges on performance; Meta cites a compute advantage over hardware-constrained Chinese labs.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/Meta%20to%20challenge%20China's%20open-weight%20AI%20dominance%20amid%20US%20regulatory%20fears.pdf"}, {"id": "scmp-15", "title": "New Hong Kong trade office in Malaysia a bridge to Greater Bay Area: minister", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Trade", "Southeast Asia"], "summary": "Hong Kong has opened an Economic and Trade Office in Kuala Lumpur, which Commerce Secretary Algernon Yau called a \"highly strategic move\" to deepen regional ties and position the city as a bridge to the Greater Bay Area. The office will oversee Malaysia, Brunei, Pakistan and Laos, supporting a two-way strategy helping Hong Kong firms enter Malaysia and Malaysian enterprises access the bay area via Hong Kong's professional services. Asean is Hong Kong's second-largest merchandise trading partner; two-way Hong Kong-Malaysia trade was HK$220 billion (US$28.2 billion) in 2022. Yau led a 200-strong delegation, with over 1,600 executives at a business dialogue and 300-plus matching sessions. It is Hong Kong's 15th overseas ETO. Yau said the city is pushing to join RCEP.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/New%20Hong%20Kong%20trade%20office%20in%20Malaysia%20a%20bridge%20to%20Greater%20Bay%20Area%20minister.pdf"}, {"id": "scmp-16", "title": "US export controls achieving no strategic gain but hurting American firms, survey finds", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Trade", "Geopolitics"], "summary": "US export-control licensing is achieving little strategic benefit while costing billions in lost exports and eroding American firms' global market share, a US-China Business Council flash survey of 31 companies in July found. Most pending licences cover items already available in China from Chinese or international suppliers, USCBC president Sean Stein said, arguing controls \"undermine US competitiveness\" without protecting security. Lengthy reviews were cited by 95 per cent; two-thirds waited over three months, exceeding the statutory 90-day rule, and 31 per cent waited one to two years. Some 73 per cent reported lost sales to Chinese rivals. US goods exports to China fell over a quarter in 2025 to US$106.3 billion. Stein called next month's expected Trump-Xi meeting \"enormously important.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/US%20export%20controls%20achieving%20no%20strategic%20gain%20but%20hurting%20American%20firms,%20survey%20finds.pdf"}, {"id": "scmp-17", "title": "US faults China over opaque overseas lending, warns of emerging-market debt risks", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Geopolitics", "Finance & Markets"], "summary": "The US State Department's 2026 Fiscal Transparency Report says China failed minimum transparency requirements, warning that opacity around its overseas lending raises the risk of unexpected defaults and debt restructuring in emerging markets. It faulted undisclosed foreign claims held by Chinese state-owned and commercial banks and enterprises, which \"obscures the scale and terms of many sovereign liabilities.\" The department added a requirement that governments publish terms of sovereign loans, including collateral, though it did not say the rule specifically targeted China. Of 139 countries reviewed, 73 met requirements and 67 did not. The report also cited domestic deficiencies: off-budget accounts lacking audit, incomplete debt data, and a supreme audit institution failing independence standards. Beijing rejects \"debt trap\" accusations.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/US%20faults%20China%20over%20opaque%20overseas%20lending,%20warns%20of%20emerging-market%20debt%20risks.pdf"}, {"id": "scmp-18", "title": "Ukraine says Russia fired North Korean missiles in deadly attack", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Ukraine said Russian attacks killed at least 10 people overnight and wounded dozens, accusing Moscow of firing North Korean ballistic missiles. President Volodymyr Zelensky said Zaporizhzhia \"was struck with North Korean ballistic missiles, Zircons,\" killing seven Zaporizhstal steelworkers heading to shelter. Three more died in Dnipropetrovsk, with further deaths in Sumy and Odesa. A Kyiv children's hospital was hit but staff sheltered safely. Zelensky said Ukraine gave the US proposals to end the war and appealed for air defence, alleging Russia received more North Korean missiles and that 30,000 to 50,000 troops may deploy. Seoul said it was watching \"closely.\" Ukraine faces a Patriot-interceptor shortage since February's US-Israeli war in Iran; civilian deaths are the highest since 2022.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/Ukraine%20says%20Russia%20fired%20North%20Korean%20missiles%20in%20deadly%20attack.pdf"}, {"id": "scmp-19", "title": "Wharf firms up balance sheet as Hong Kong home sales cushion profit slump", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Finance & Markets"], "summary": "Hong Kong developer Wharf (Holdings) is leaning on the city's luxury-home market to offset mainland weakness, paring investment and building cash. First-half Hong Kong development revenue nearly tripled to HK$1.35 billion (US$172 million), with operating profit up more than fivefold, offsetting a 54 per cent drop in mainland development revenue, where a HK$547 million impairment was booked. It sold its first house at 1 Plantation Road for HK$558 million. Group profit plunged 91 per cent to HK$48 million on investment-property revaluation deficits; underlying profit fell 17 per cent. Net cash rose to HK$6.2 billion from HK$2 billion, funding a doubled HK$0.40 interim dividend. Chairman Stephen Ng said Hong Kong property is Wharf's \"first choice,\" citing few good mainland opportunities. Logistics profit fell 19 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/Wharf%20firms%20up%20balance%20sheet%20as%20Hong%20Kong%20home%20sales%20cushion%20profit%20slump.pdf"}, {"id": "scmp-20", "title": "Why submarine attacks may prove to be the Achilles' heel for China's new carrier fleet", "source": "SCMP", "date": "12 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "China's rapidly expanding aircraft-carrier fleet may be vulnerable to submarine attack, an area where its defences lag the US, a new Centre for Strategic and International Studies report says. The \"cost-imposition\" strategy proposes land-based strikes, long-range air strikes, cyber and electromagnetic attacks and drone swarms, but submarine ambushes at first-island-chain chokepoints are seen as China's weakest point. Christopher Sharman said the undersea vulnerability \"remains significant today\" though not static, as PLAN meteorological and oceanographic capabilities still trail the US Navy. Beijing's Transparent Ocean programme deploys satellites, buoys, gliders and seabed sensors, and it is expanding patrol aircraft and Type 927 surveillance ships. Analyst Timothy Heath said land-based missiles remain China's best option, calling carriers too valuable to expose.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20SCMP/Why%20submarine%20attacks%20may%20prove%20to%20be%20the%20Achilles'%20heel%20for%20China's%20new%20carrier%20fleet.pdf"}]}, "2026-08-13": {"date": "2026-08-13", "dayOfWeek": "Thursday", "totalArticles": 82, "sourceCounts": {"WSJ": 12, "ST": 17, "BT": 29, "SCMP": 24}, "executiveDigest": "US inflation cooled in July - 'disinflation returns' - giving the Fed room to breathe, lifting gold to a two-month high and the S&P as CoreWeave's results fuelled AI optimism. But the Hormuz standoff ground on: Trump declared the strait 'under U.S. control', yet WSJ noted 'few ships are listening' as OPEC cut its demand forecast and the 2026 supply shortfall deepened. Singapore's markets ran hot - DBS price targets were raised to S$81 after a record Q2, JPMorgan floated an STI '7,000' bull case, and MAS eased family-office tax rules to court global wealth.", "briefingCards": [{"title": "Lead story - Disinflation gives the Fed room", "body": "The data turned the Fed's way: ST reported 'US consumer inflation slows in July, giving the Fed room to breathe', and WSJ declared 'disinflation returns, Kevin Warsh's critics hardest hit'. Markets rallied - gold rose to a two-month high as the print 'dampened rate-hike bets', and the S&P 500 'ended higher as CoreWeave results fuelled AI optimism'. The soft landing narrative competed with an unresolved oil picture: OPEC 'cut its oil-demand forecast again as Hormuz talks stall', US crude stockpiles posted an unexpected build, and BT warned the 'global 2026 oil supply shortfall will deepen as a Hormuz reopening remains elusive'. The dollar ticked up on Iran tension even as the yen's intervention put China's renminbi under fresh pressure."}, {"title": "Markets & finance", "body": "It was a blockbuster Singapore markets day: analysts raised DBS price targets 'to as high as S$81' after a record Q2, saw DBS and OCBC 'ahead on wealth', and JPMorgan floated an 'STI 7,000' bull case over 12 months, while SGX's July securities turnover jumped 37% to S$46.2 billion (even as 'SGX's record year masks Singapore's equities challenge'). MAS eased family-office tax rules and widened AML checks to court global wealth. Globally, Norway's wealth fund posted a record US$184 billion H1 profit, Jane Street is repaying a US$5.5 billion loan, Bank of America launched a US$250 billion tech-and-energy infrastructure push, and Switzerland moved on stricter bank-bonus rules. UOL (+23%), CICT (+7.1% DPU) and AEM (profit up tenfold on AI chips) rounded out earnings."}, {"title": "Asia realignment", "body": "The US-China track stalled: SCMP said the 'Board of Investment' mechanism 'stalls before an expected Trump-Xi meeting', a US congressional panel judged China 'projects outward confidence amid economic anxiety', and Singapore and South Korea are eyeing science tie-ups 'as the last main US-China link shatters'. Beijing extended its reach - sending scientists to Iran for rare-earth 'exploration and processing' and pushing a 'Go Global 3.0' era from solar to AI. Security frictions grew: after China's missile test the US and allies 'demanded 24-hour warning next time', the PLA held its first joint naval drill with Indonesia east of Taiwan (Jakarta called it 'routine'), and Erdogan pushed a Turkey-Saudi-Pakistan defence pact."}, {"title": "Energy & climate", "body": "Oil stayed torn between weak demand and Hormuz risk: OPEC cut its demand forecast as talks stalled, US crude stockpiles unexpectedly built, and prices only edged up, yet BT warned the 2026 supply shortfall will deepen while a ship paid a near-record US$4 million to skip the Panama Canal queue amid Hormuz-driven congestion. WSJ flagged the Black Sea as 'another global chokepoint' being squeezed by war, and 'red-hot power stocks are losing steam'. Malaysia is exploring using palm oil to cool data centres as water demand surges, and US soybean growers are pivoting to new buyers and biofuel 'fearing deflated China demand'."}, {"title": "Technology & AI", "body": "AI earnings and plumbing dominated: Cisco's profit jumped 'as AI orders roll in', CoreWeave boosted its 2026 spending and beat estimates, Super Micro guided sales up to US$15.5 billion, and Foxconn is ramping global AI-server production (its Taiwan arm posted a 35% profit rise). WSJ detailed 'why Wall Street and Nvidia are building an exotic money pipeline for the AI boom', and projected data-centre insurance premiums topping US$24 billion by 2030. The model race sharpened - Apple is in talks to pay publishers to improve an AI-powered Siri, and DeepSeek 'publicised efforts to challenge Anthropic's Claude Code' - even as Tencent's Q2 profit fell 'as its AI push builds' and Cerebras swung to a loss while lifting its outlook."}, {"title": "Singapore & SEA focus", "body": "Singapore's financial hub was in the spotlight: DBS targets were raised to S$81 on a record Q2, JPMorgan sees the STI potentially hitting 7,000, SGX July turnover rose 37% to S$46.2 billion, life insurers grew H1 premiums 21.4%, and MAS eased family-office tax rules while widening AML checks 'as Singapore vies for global wealth'. AEM's profit rose tenfold on AI-chip demand, and SK Hynix and Samsung shares rallied on reports of Temasek investment plans. Property sent mixed signals - UOL's H1 profit rose 23%, but two-thirds of Sentosa Cove homes resold at a loss (average loss topping $1 million since 2023) - while a proposed one-north rezoning would double space for start-ups. Regionally, Malaysia's PM Anwar was discharged after surgery ahead of a pivotal PKR-DAP week."}], "keyMetrics": [{"value": "82", "label": "Articles curated today", "sub": "WSJ 12 · ST 17 · BT 29 · SCMP 24"}, {"value": "Disinflation", "label": "US July inflation cools", "sub": "Fed 'room to breathe'"}, {"value": "2-mo high", "label": "Gold rises", "sub": "Rate-hike bets dampened"}, {"value": "S$81 / 7,000", "label": "DBS target; STI bull case", "sub": "Record Q2; JPMorgan"}, {"value": "'Few listening'", "label": "Trump claims Hormuz control", "sub": "OPEC cuts demand forecast"}, {"value": "US$15.5b", "label": "Super Micro guidance", "sub": "CoreWeave, Cisco ride AI"}], "articles": [{"id": "wsj-01", "title": "Apple in Talks to Pay Publishers to Improve AI-Powered Siri", "source": "WSJ", "date": "13 Aug 2026", "tags": ["Technology & AI"], "summary": "Apple is negotiating multiyear deals with publishers to license content for delivering current news through its AI-powered Siri voice assistant, expected to launch later this year, people familiar said. Unlike standard licensing tied to guaranteed fees and broad access, Apple proposed a variable, pay-as-you-go plan paying partners when their content is used, discussing a possible nine-figure budget. Apple declined to comment. The push comes as the iPhone maker upgrades Siri, long criticized for weak utility, to integrate AI more deeply. Apple previously paid publishers for AI training rights and launched Apple News+ in 2019. News Corp, owner of The Wall Street Journal, supplies news via Apple. A late-2024 AI news-roundup experiment published erroneous headlines and was quickly disabled.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20WSJ/Apple%20in%20Talks%20to%20Pay%20Publishers%20to%20Improve%20AI-Powered%20Siri.pdf"}, {"id": "wsj-02", "title": "Cerebras Swings to Second-Quarter Loss, Lifts Full-Year Outlook", "source": "WSJ", "date": "13 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Cerebras Systems swung to a second-quarter loss of $450.5 million, or $2.98 a share, versus a $309.5 million profit a year earlier, while revenue rose to $180.1 million from $103.3 million. Core revenue more than doubled to $209.9 million, beating the $190.6 million expected, with a 41% core gross margin. Shares slid 16% after hours to $220.38 despite a 12% regular-session gain. The chip company cited margin pressure from renting back its own systems to meet inference demand. CFO Bob Komin said margins hit a low in the current quarter before improving, with over 600 megawatts of capacity contracted. Cerebras lifted full-year core-revenue guidance to $880 million-$890 million and forecast a tripling of core revenue in 2027.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20WSJ/Cerebras%20Swings%20to%20Second-Quarter%20Loss,%20Lifts%20Full-Year%20Outlook.pdf"}, {"id": "wsj-03", "title": "Cisco Reports Sharp Jump in Profit as AI Orders Roll In", "source": "WSJ", "date": "13 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Cisco Systems reported a July-quarter profit of $3.86 billion, or 97 cents a share, up from $2.55 billion a year earlier, as artificial-intelligence hyperscalers kept placing large orders. Adjusted earnings of $1.22 beat the $1.17 expected; revenue grew to $17.25 billion from $14.67 billion, topping forecasts. Product revenue rose 24%. The company took $4 billion in AI infrastructure orders from hyperscalers in the fourth quarter, reaching $9.3 billion for the fiscal year. CEO Chuck Robbins called it \"the fastest-moving technology transition\" ever seen and said demand across the portfolio is the most consistent in 30 years. Cisco guided fiscal 2027 adjusted earnings of $5.05-$5.11 on revenue of $72.2 billion-$73.4 billion, above analyst estimates.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20WSJ/Cisco%20Reports%20Sharp%20Jump%20in%20Profit%20as%20AI%20Orders%20Roll%20In.pdf"}, {"id": "wsj-04", "title": "Disinflation Returns, Kevin Warsh's Critics Hardest Hit", "source": "WSJ", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "The Wall Street Journal editorial board defends new Fed Chair Kevin Warsh after July's consumer-price index rose just 0.1%, disappointing critics who questioned his credibility after three months. Warsh rejects \"forward guidance,\" promising to meet the Fed's 2% inflation target without it; the board applauds. July's rise followed a minus-0.4% June reading; core prices rose 0.2%, with the 12-month core at 2.5%, down from 2.9% in May. Headline CPI remains elevated at 3.4%, lifted by energy-driven spring increases tied to the Iran war. The board says underlying inflation is moderating, vindicating July's decision not to raise rates. Real hourly earnings fell 0.1%, pressuring Republicans before November. The FOMC meets in September and could tighten if inflation reaccelerates.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20WSJ/Disinflation%20Returns,%20Kevin%20Warsh's%20Critics%20Hardest%20Hit.pdf"}, {"id": "wsj-05", "title": "Foxconn Ramping Up Global AI Server Production to Ride Booming Cloud Investment", "source": "WSJ", "date": "13 Aug 2026", "tags": ["Technology & AI", "Trade"], "summary": "Foxconn Technology Group is expanding global production of AI servers to capture surging cloud-infrastructure investment, having become a critical supplier to leaders such as Nvidia. Second-quarter net profit climbed a better-than-expected 35% to NT$59.97 billion (US$1.86 billion) as revenue surged 41% to NT$2.526 trillion, with server-related revenue exceeding half of total sales. Rotating CEO Michael Chiang said U.S. cloud providers' capital expenditure will fuel growth this year and next, with demand steadier than consumer electronics. Foxconn is expanding to hundreds of sites across 24 countries under a \"local for local\" strategy spanning Taiwan, Mexico, Vietnam and the U.S. Morgan Stanley projects its high-end rack share falling to 39% this year from 51%, as buyers diversify suppliers.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20WSJ/Foxconn%20Ramping%20Up%20Global%20AI%20Server%20Production%20to%20Ride%20Booming%20Cloud%20Investment.pdf"}, {"id": "wsj-06", "title": "OPEC Cuts Oil-Demand Forecast Again as Hormuz Talks Stall", "source": "WSJ", "date": "13 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "OPEC again cut its 2026 global oil-demand growth forecast to 580,000 barrels a day from 780,000, citing stalled talks to reopen the Strait of Hormuz and Red Sea risks that prolong supply disruptions. It raised next year's growth estimate to 2.16 million barrels a day. OPEC remains far more optimistic than the International Energy Agency, which expects demand to fall 1.6 million barrels a day this year. OPEC members' output rose 1.66 million barrels a day to 23.63 million in July, led by Kuwait, Iraq and Saudi Arabia. Hormuz talks hit an impasse; President Trump has turned to economic pressure via sanctions and a naval blockade. Brent traded near $89 a barrel and WTI above $83.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20WSJ/OPEC%20Cuts%20Oil-Demand%20Forecast%20Again%20as%20Hormuz%20Talks%20Stall.pdf"}, {"id": "wsj-07", "title": "Red-Hot Power Stocks Are Losing Steam", "source": "WSJ", "date": "13 Aug 2026", "tags": ["Energy", "Finance & Markets"], "summary": "Shares of U.S. power-plant owners have slumped in 2026-Constellation Energy down 21%, Vistra 10%, NRG 25%-while equipment makers surged, with GE Vernova up 55% and Caterpillar 47%, as regulatory shifts reshape the AI power race. In Texas, Governor Greg Abbott ordered a halt on data-center grid connections pending an audit, denting Vistra and NRG. At mid-Atlantic grid operator PJM, a failed capacity auction left a 6.8-gigawatt shortfall; planned extra procurement and data-center matchmaking are expected to lower future capacity prices, hurting incumbents that profited from tightening markets. Bulls argue existing generators can still sign data-center contracts more cheaply than new builds. Analysts say the direction favors new generation, on and off the grid, widening competition.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20WSJ/Red-Hot%20Power%20Stocks%20Are%20Losing%20Steam.pdf"}, {"id": "wsj-08", "title": "Trump Says Hormuz Is Under U.S. Control. Few Ships Are Listening.", "source": "WSJ", "date": "13 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "President Trump claimed Wednesday the U.S. has \"total control\" of the Strait of Hormuz, but ship-tracking data shows only 14 vessels crossed on Tuesday, versus over 130 daily before the war; 11 used Iran's route. Analysts say Tehran has squelched traffic with only sporadic drone and missile attacks by making shippers, captains and insurers fear reprisal. War-risk insurance has risen to as much as 10% of a ship's value, from 0.25% before the war. The IEA said Hormuz is effectively closed again since June's deal collapsed. Iran's grip has cost 2.6 billion barrels of oil since February, Aramco's chief said. Houthi attacks at Bab al-Mandeb killed four sailors aboard the Tihamah, the first such deaths.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20WSJ/Trump%20Says%20Hormuz%20Is%20Under%20U.S.%20Control.%20Few%20Ships%20Are%20Listening..pdf"}, {"id": "wsj-09", "title": "Trump Secretly Flown Out of Turkey on Military Jet Amid Iran Threat", "source": "WSJ", "date": "13 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "President Trump was secretly flown out of Turkey last month on a military jet after U.S. officials were warned of an Iranian threat involving shoulder-fired missiles targeting Air Force One, according to a U.S. official. Trump boarded Air Force One after an Ankara leaders' meeting, then was moved to the military jet via an airport catering truck; aides including Secretary of State Marco Rubio stayed aboard. No missiles were fired. Israel provided the intelligence. Trump publicly said he followed Secret Service advice, noting \"I get a lot of threats.\" The decoy, the first such in his presidency, raises questions about White House transparency and the Qatari-donated 747's defensive capabilities. Iran has vowed revenge for Qassem Soleimani's killing.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20WSJ/Trump%20secretly%20flown%20out%20of%20Turkey%20on%20military%20jet%20amid%20Iran%20threat.pdf"}, {"id": "wsj-10", "title": "U.S. Crude Oil Stockpiles Post Unexpected Build", "source": "WSJ", "date": "13 Aug 2026", "tags": ["Energy"], "summary": "U.S. commercial crude oil inventories rose unexpectedly by 17.4 million barrels to 424.4 million in the week ended Aug. 7, as imports increased and exports fell, the Energy Information Administration said; analysts had expected a 600,000-barrel decline. Strategic Petroleum Reserve stocks fell 6.1 million barrels to 298.7 million, the lowest in over four decades amid continued emergency releases. Cushing stocks rose 1.6 million barrels. Crude imports jumped 1.1 million barrels a day to 7.3 million, while exports fell 627,000 to 3.1 million; production held at 13.8 million barrels a day. Refineries ran at 96.2% of capacity. Gasoline inventories fell 1 million barrels; distillate stocks were roughly flat, 12% below the five-year average.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20WSJ/U.S.%20Crude%20Oil%20Stockpiles%20Post%20Unexpected%20Build.pdf"}, {"id": "wsj-12", "title": "War Is Squeezing Another Global Chokepoint: The Black Sea", "source": "WSJ", "date": "13 Aug 2026", "tags": ["Geopolitics", "Trade", "Energy"], "summary": "The Black Sea, a hub for global grain trade and Ukraine's economic lifeline, has become a war zone, with Russia and now Ukraine setting ships and ports ablaze at both ends. Ukraine struck the Russian port of Novorossiysk on Tuesday, hitting air-defense positions and infrastructure. Russian drones and missiles have struck 57 vessels since June 20, killing at least 21 people, while Ukrainian drones claim strikes on over 200 Russian \"shadow fleet\" ships. Attacks near Novorossiysk crimp the Caspian Pipeline Consortium, carrying nearly 2% of world oil. Maersk and Kernel halted operations at Chornomorsk. Chicago wheat futures topped $7 a bushel in July. Analysts warn of higher food prices across Africa, Asia and the Middle East.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20WSJ/War%20Is%20Squeezing%20Another%20Global%20Chokepoint%20The%20Black%20Sea.pdf"}, {"id": "wsj-13", "title": "Why Wall Street and Nvidia Are Building an Exotic Money Pipeline for the AI Boom", "source": "WSJ", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Nvidia CEO Jensen Huang unveiled a $500 billion plan with Wall Street firms-Apollo, BlackRock, Blackstone, Brookfield, Goldman Sachs and KKR-to standardize AI-chip financing through asset-backed pools, leaving Nvidia partly on the hook if deals fail. The effort targets smaller AI labs, cloud firms and enterprises that crave Nvidia chips but face high borrowing costs, unlike cash-rich Meta, Microsoft and Google. No money has been raised yet; backers aim to sell debt to pension funds, insurers and sovereign-wealth funds. Critics warn chips depreciate fast-one likened compute collateral to \"the shelf life of lettuce.\" Huang said Nvidia might backstop up to 25% of project costs. AI-related bond issuance reached $344 billion by early August, up over $200 billion from 2025.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20WSJ/Why%20Wall%20Street%20and%20Nvidia%20Are%20Building%20an%20Exotic%20Money%20Pipeline%20for%20the%20AI%20Boom.pdf"}, {"id": "st-01", "title": "China races to solve $190 billion property threat as leases end", "source": "ST", "date": "13 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "China is confronting a wave of expiring land leases threatening its commercial property sector, with more than one trillion yuan (S$190 billion) of non-residential assets now holding 20 years or less of tenure, estimates Cushman and Wakefield. Almost all urban land is state-owned; leases run 40 to 70 years. Dwindling terms have scuttled deals for developers including Parkview Group and New World Development, as banks refuse refinancing and buyers submit low-ball bids. Office values in some cities fell over 40 per cent from peaks. Shanghai and Guangzhou recently circulated renewal guidelines proposing extension costs of at least 70 per cent of a benchmark. CapitaLand and Brookfield have raised concerns; investors await a nationwide policy.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/China%20races%20to%20solve%20190%20billion%20property%20threat%20as%20leases%20end.pdf"}, {"id": "st-02", "title": "China tech giant Tencent's Q2 profit down as AI push builds", "source": "ST", "date": "13 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Tencent reported second-quarter 2026 net profit of 56 billion renminbi (S$10.6 billion), up just 0.7 per cent year on year but a 4 per cent fall from the first quarter, missing a Bloomberg forecast of 58.4 billion renminbi. Revenue jumped 11 per cent to 204.8 billion renminbi, slightly beating estimates, as the WeChat operator monetises heavy AI investment. WeChat users await a potential in-app AI agent. Tencent said it is \"building a new, AI-empowered Tencent.\" Founder Pony Ma earlier likened past AI efforts to a \"leaky\" ship. Tencent is reportedly in talks to retake a stake in start-up Manus, and is among firms racing to capitalise on the OpenClaw AI agent platform surge.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/China%20tech%20giant%20Tencent's%20Q2%20profit%20down%20as%20AI%20push%20builds.pdf"}, {"id": "st-03", "title": "China's C919 jet makes first international commercial flight", "source": "ST", "date": "13 Aug 2026", "tags": ["Technology & AI", "Trade"], "summary": "China's homegrown C919 narrow-body jet completed its first international commercial flight on Aug 12, a symbolic step toward challenging Boeing and Airbus. Produced by state-owned COMAC and operated by Air China, the aircraft departed Beijing and landed in Mongolia's capital Ulaanbaatar, a route running one round-trip daily. Billed as a rival to the Boeing 737 and Airbus A320, the jet has yet to win US or European regulatory approval and still sources components from countries including the United States. Beijing hopes it will cut reliance on foreign technology. The C919 flew its first commercial route in May 2023 and has since served domestic and Hong Kong routes. COMAC's smaller C909 already flies foreign markets.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/China's%20C919%20jet%20makes%20first%20international%20commercial%20flight.pdf"}, {"id": "st-04", "title": "DeepSeek publicises efforts to challenge Anthropic's Claude Code", "source": "ST", "date": "13 Aug 2026", "tags": ["Technology & AI"], "summary": "Chinese AI start-up DeepSeek has set up an official WeChat account for its \"DeepSeek Harness Team\" and posted job listings for a group developing AI agents to rival services like Anthropic's Claude Code. A harness is the software scaffolding wrapped around a large language model that lets agents manage complex tasks, such as streamlining coding. The Beijing-based entity is identified by corporate database Qichacha as controlled by DeepSeek and verified by Tencent. The company said it aims to turn its models into cutting-edge agentic products, and separately updated its flagship V4 Pro model with better agentic capabilities on Aug 11. Chinese firms are locked in a race with US developers to build advanced, affordable AI agents for business professionals.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/DeepSeek%20publicises%20efforts%20to%20challenge%20Anthropic's%20Claude%20code.pdf"}, {"id": "st-05", "title": "How China's big push to win back tourists is paying off", "source": "ST", "date": "13 Aug 2026", "tags": ["Society", "Finance & Markets"], "summary": "China's campaign to revive inbound tourism is gaining momentum, with around 35 million foreign visitors arriving in 2025, when arrivals and spending surpassed pre-pandemic levels for the first time. Since 2023 China rolled out visa-free travel for citizens of 50 countries, ramped up online promotion, including on banned Western platforms, and funded local tourism offices. In the first half of 2026, 18 million people arrived from visa-free countries, lifting overall foreign arrivals 20 per cent, led by South Korea, Russia, Malaysia and Thailand. Trends like \"Chinamaxxing\" went viral. Still, tourism generates under 0.5 per cent of GDP, far below Spain and Thailand, and cashless payments, language gaps and app restrictions remain hurdles for visitors.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/How%20China's%20big%20push%20to%20win%20back%20tourists%20is%20paying%20off.pdf"}, {"id": "st-06", "title": "Indonesia says navy drill with China that angered Taiwan was routine", "source": "ST", "date": "13 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Indonesia's navy said on Aug 12 that joint exercises with China in waters east of Taiwan were routine \"passing exercises\" not related to \"war fighting,\" after Taipei branded them a dangerous \"military provocation.\" China's military said the two navies concluded the drill, which included communication, formation manoeuvring and replenishment, the first such operation with a foreign military in those waters. Indonesia said its ship, the I Gusti Ngurah Rai, conducted the exercises while returning from a Russia visit, also engaging Japan and the US Seventh Fleet. Taiwan's Mainland Affairs Council called it \"exercises in name, expansion in fact.\" An intelligence official said the ship, 70-80 nautical miles off Taiwan's east, posed no direct military impact but carried geopolitical significance.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/Indonesia%20says%20navy%20drill%20with%20China%20that%20angered%20Taiwan%20was%20routine.pdf"}, {"id": "st-07", "title": "Iranian factions squabble over war aims with Khamenei absent", "source": "ST", "date": "13 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "Public infighting has erupted in Tehran over the conduct of the US-Israel war, with new Supreme Leader Mojtaba Khamenei unseen since taking power in March after a Feb 28 Israeli strike killed his father and predecessor. President Masoud Pezeshkian, backing a beleaguered peace deal, faces hardliner calls to resign but says he will not budge; he reported a recent \"seven or eight hours\" meeting with Khamenei. Pragmatists like Pezeshkian and Foreign Minister Abbas Araghchi seek negotiations and sanctions relief, while ultra-conservatives oppose engagement with Trump. A military reshuffle installed hardliner Mohsen Rezaei atop the security council, signalling a more \"offensive\" doctrine. Analysts say factional disputes are more visible, though decision-makers retain broad consensus around leveraging the Strait of Hormuz.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/Iranian%20factions%20squabble%20over%20war%20aims%20with%20Khamenei%20absent.pdf"}, {"id": "st-08", "title": "Malaysian PM Anwar discharged from hospital after surgery", "source": "ST", "date": "13 Aug 2026", "tags": ["Politics", "Southeast Asia"], "summary": "Malaysian Prime Minister Anwar Ibrahim was discharged from hospital on Aug 12 after undergoing surgery. \"Alhamdulillah, back home,\" he posted across his social media accounts. On Aug 10, his 79th birthday, Anwar successfully underwent an elective laparoscopic procedure to treat a para-umbilical hernia. The head of his medical team, Dr Asri Ranga Abdullah Ramaiah, said the procedure was carried out smoothly under a team of specialists. Earlier that day his aide said Anwar was undergoing tests and was expected to be under observation for two days. Anwar, in office since 2022, has had recurrent shoulder and back issues and was hospitalised in 2018 for shoulder and back pain, according to Reuters.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/Malaysian%20PM%20Anwar%20discharged%20from%20hospital%20after%20surgery.pdf"}, {"id": "st-09", "title": "North Korea resumes naval base construction as it modernises fleet", "source": "ST", "date": "13 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "North Korea appears to have resumed construction of a long-delayed naval base at Tapchon Bay in Munchon on its east coast, with new worker housing appearing between Aug 6 and Aug 9, according to NK News analysis of Planet Labs satellite imagery. The renewed work coincides with Pyongyang's push to modernise its fleet, having unveiled two 5,000-ton destroyers, the Choe Hyon and Kang Kon, while pursuing a nuclear-powered submarine and a 10,000-ton cruiser. Kim Jong Un called the base's completion an \"urgent task\" and cited a shortage of berths for large warships. Separately, North Korea fired a ballistic missile about 700km into the East Sea on Aug 12, its 11th launch event of 2026, days before US-South Korea Ulchi Freedom Shield drills.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/North%20Korea%20resumes%20naval%20base%20construction%20as%20it%20modernises%20fleet.pdf"}, {"id": "st-10", "title": "PKR and DAP faithful meet this week with Anwar's fate on the line. Here's what to watch", "source": "ST", "date": "13 Aug 2026", "tags": ["Politics", "Southeast Asia"], "summary": "Anwar Ibrahim's PKR and ally DAP hold party gatherings this week after three straight state-poll defeats, with the Aug 1 Negeri Sembilan loss following July's Johor drubbing as the UMNO-PAS pact swept two-thirds supermajorities. PKR's national assembly opens Aug 13 in Melaka, the next state to vote by November; DAP's congress on Aug 16 will vote on relinquishing government positions in protest, though insiders expect loyalty to Anwar. PKR faces a leadership vacuum after Anwar's daughter Nurul Izzah quit as deputy president, while Rafizi Ramli's breakaway Parti Bersama Malaysia courts reform voters. Some in Pakatan Harapan urge exploratory cooperation with Bersatu. Anwar, recovering from hernia surgery, meets divisional chiefs Aug 14 before an Aug 15 address.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/PKR%20and%20DAP%20faithful%20meet%20this%20week%20with%20Anwar's%20fate%20on%20the%20line.%20Here's%20what%20to%20watch.pdf"}, {"id": "st-11", "title": "Proposed rezoning in one-north to double space for start-up facilities", "source": "ST", "date": "13 Aug 2026", "tags": ["Technology & AI", "Society"], "summary": "Proposed zoning changes will roughly double the floor space available for Singapore's start-up ecosystem at LaunchPad @ One-North, assigning the 9.82ha site a gross plot ratio of 2.5, up from just over 1.0 today. JTC, which launched LaunchPad in 2015, said the change lets it rejuvenate the estate as one integrated development, including adaptive reuse of two flatted factories as the AI block and accommodation block of the new Kampong AI park. LaunchPad has housed over 2,400 start-ups including Carousell, Patsnap and Nium. The AI block will offer 14,500 sq m for up to 70 companies; Kampong AI is slated for 2028. A related tender for Block 47 closes Aug 24. Singapore's start-up ecosystem ranks fourth globally.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/13%20Aug%202026/13%20Aug%20ST/Proposed%20rezoning%20in%20one-north%20to%20double%20space%20for%20start-up%20facilities.pdf"}, {"id": "st-13", "title": "Senators press Rubio, Bessent on lack of counter-evasion sanctions on Russia", "source": "ST", "date": "13 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "Two senior Democratic senators, Elizabeth Warren and Christopher Coons, pressed Trump administration officials on Aug 12 over why fresh counter-evasion san
