Technology & AI"],"summary":"A group of 21 financial institutions, including Goldman Sachs, Bank of America, Citi and Deutsche Bank, plans to create a company in 2026 to issue a dollar-pegged cryptocurrency in the first half of 2027, it said on Sept 1. First announced in October 2025 with 10 banks, the group also aims to issue stablecoins pegged to other G7 currencies, prioritising the euro. It will compete with a 37-member consortium, Qivalis, planning a euro stablecoin in 2026. Demand for bank-issued stablecoins remains scant; the market is dominated by Tether, which has issued over US$180 billion. Societe Generale's 2025 dollar token has just US$12.5 million in circulation. ECB President Christine Lagarde has warned private stablecoins pose monetary and financial-stability risks.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/Goldman%20Sachs,%20BofA%20and%20others%20plan%20to%20issue%20dollar%20stablecoin%20together%20in%202027.pdf"},{"id":"st-08","title":"Haze caused by many factors, but repeat of 2015 crisis unlikely due to later onset of El Nino: Experts","source":"ST","date":"3 Sep 2026","tags":["Environment","Southeast Asia"],"summary":"Since August, South-east Asia including Indonesia and Malaysia has been choking in persistent haze from raging Indonesian fires, worsened by a \"Godzilla\" El Nino. Dense smoke has covered Sumatra and Kalimantan since Aug 21, evoking the 2015 crisis when Singapore's PSI soared above 300. But experts told The Straits Times a repeat seems unlikely in 2026 because El Nino began around June, later than April in 2015, giving a shorter overlap with the dry season. By end-July over 202,000ha had burned, versus 2.6 million ha in 2015. NEA warned haze periods remain possible during dry spells. Experts stressed the fires are a man-made disaster from land clearing on drained peatlands; Indonesia arrested 89 suspects and faces a shrunken firefighting budget.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/Haze%20caused%20by%20many%20factors,%20but%20repeat%20of%202015%20crisis%20unlikely%20due%20to%20later%20onset%20of%20El%20N.pdf"},{"id":"st-09","title":"How Japan's bond rout is turning the tide of global capital","source":"ST","date":"3 Sep 2026","tags":["Finance & Markets"],"summary":"With Japanese 10-year bond yields breaking 3 per cent on Sept 1 for the first time since 1996, higher domestic returns are luring capital home and reversing a dependable flow into global bond markets. Japan is the biggest owner of US Treasuries; Japanese investors have already sold a net 3 trillion yen (S$24 billion) in overseas debt through Aug 22, the largest year-to-date outflow since 2022. Fund managers in Sydney, London and Singapore report a pullback, with a home-market bias emerging. A JP Morgan survey of 82 corporate pension funds showed the highest net share planning to boost domestic bonds since 2008. Yields have been pushed up by PM Sanae Takaichi's fiscal spending. Analysts say Japan is gradually ceasing to be the marginal buyer of foreign bonds, lifting global term premiums.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/How%20Japan's%20bond%20rout%20is%20turning%20the%20tide%20of%20global%20capital.pdf"},{"id":"st-10","title":"If S'pore decides on nuclear power, major grid changes may not be required","source":"ST","date":"3 Sep 2026","tags":["Energy","Society"],"summary":"Nuclear power plants provide a stable electricity supply similar to Singapore's current fossil-fuel plants, so tapping the source may not require major grid changes, SP PowerGrid chief executive Jimmy Khoo said on Sept 2. Singapore has not decided on nuclear but is studying its feasibility while pursuing imports and renewables. Khoo noted nuclear reactors drive steam engines like existing gas turbines and behave like any other generator, unlike intermittent solar. Speaking during a tour of the Ayer Rajah control centre, he stressed the grid must be finely balanced between demand and supply across 28,000km of underground cables, citing the 2025 Spain-Portugal outage. As Singapore raises its solar target from 2 to 3 GWp by 2030, SP Group is deploying batteries, including a 9.6MW storage system, to integrate renewables. The nation targets net-zero emissions by 2050.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/If%20S'pore%20decides%20on%20nuclear%20power,%20major%20grid%20changes%20may%20not%20be%20required.pdf"},{"id":"st-11","title":"MPs to push for food resilience in Parliament as prices rise due to climate, geopolitical crises","source":"ST","date":"3 Sep 2026","tags":["Society","Politics"],"summary":"Four PAP MPs will table a private member's motion on food resilience in Parliament next week, urging the Government to strengthen support for local farmers and cut food waste amid rising prices from hotter weather and Middle East conflicts. The MPs, from the GPC for Sustainability and the Environment, are Poh Li San, Nadia Ahmad Samdin, Valerie Lee and Ng Shi Xuan. Poh noted Singapore imports over 90 per cent of its food yet generated 800,000 tonnes of food waste in 2025, about 130kg per person, with only 0.3 per cent rescued. Grace Fu earlier warned Strait of Hormuz disruptions could raise fertiliser and logistics costs. The motion follows the dropped \"30 by 30\" goal; some grant-backed farms have closed. Food resilience is eyed for Singapore's 2027 ASEAN chairmanship agenda.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/MPs%20to%20push%20for%20food%20resilience%20in%20Parliament%20as%20prices%20rise%20due%20to%20climate,%20geopolitical.pdf"},{"id":"st-12","title":"Moscow vows to avoid airspace disruption despite Zelenskiy's warning","source":"ST","date":"3 Sep 2026","tags":["Geopolitics","Defence"],"summary":"Russia vowed on Sept 2 to head off disruption to civil aviation after Ukrainian President Volodymyr Zelenskiy warned that Ukrainian drones had made Russian airspace dangerous, saying \"the war started by Russia is closing its own skies.\" Ukraine officially notified the ICAO that Russian airspace was not safe. While Western carriers avoid Russia, airlines from China, Turkey, the UAE and Gulf states still use it. Transport minister Andrei Nikitin said Russia would not allow significant disruption, and aviation authority Rosaviatsia dismissed Ukraine's approaches as having \"no legal force.\" Flightradar24 showed cancellations and delays at Moscow's airports; flydubai and Pegasus Airlines cancelled flights. Russia has intensified strikes on Kyiv, while Ukraine hits Russian oil targets. Osprey Flight Solutions warned daily deep-strike attacks are likely through 2026.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/Moscow%20vows%20to%20avoid%20airspace%20disruption%20despite%20Zelenskiy's%20warning.pdf"},{"id":"st-13","title":"Netanyahu says Israel 'not retreating' during Gaza visit","source":"ST","date":"3 Sep 2026","tags":["Geopolitics","Defence"],"summary":"Prime Minister Benjamin Netanyahu visited Israeli forces in Gaza on Sept 2, vowing not to pull back troops despite a mediator push to advance a US-backed ceasefire calling for withdrawal. It was his first visit since the October 2025 ceasefire. \"We control the area. We are not retreating,\" he said near the Yellow Line, claiming control of 60 per cent of the Strip and vowing no pullout until Hamas is \"genuinely\" disarmed. Facing October elections, Netanyahu in August rejected advancing the plan. Israel said it captured a Hamas internal-security figure. Defence Minister Israel Katz said Israel has plans to remove Palestinians from Gaza, awaiting a US destination, drawing concern over forced displacement. Israeli operations have killed at least 1,334 people since the ceasefire, per Gaza's health ministry.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/Netanyahu%20says%20Israel%20'not%20retreating'%20during%20Gaza%20visit.pdf"},{"id":"st-14","title":"Ships adopt makeshift anti-drone defences as Black Sea attacks intensify","source":"ST","date":"3 Sep 2026","tags":["Geopolitics","Trade"],"summary":"Tankers and cargo ships are transiting the Bosphorus fitted with nets, water tanks and tyres to fend off growing Russian and Ukrainian drone strikes in the Black Sea, security experts and Reuters video showed. The abandoned Russian-flagged Omskiy-107, its deck burned out, drifted to an Istanbul beach. Ukraine has stepped up attacks on ships and infrastructure facilitating Russian oil and grain exports since July, when Russia intensified strikes on Odesa and other hubs. Increasingly common \"cope cages\" protect superstructures, but experts say such measures fail against larger military drones. Turkey summoned Ukraine's ambassador after attacks near Tuapse; President Erdogan warned the strikes renewed global grain shortages. Russia said on Sept 2 it sees no grounds to resume the Black Sea grain deal.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/Ships%20adopt%20makeshift%20anti-drone%20defences%20as%20Black%20Sea%20attacks%20intensify.pdf"},{"id":"st-15","title":"Singapore factory activity expands in August, even as supply chain crisis from Iran war deepens","source":"ST","date":"3 Sep 2026","tags":["Finance & Markets","Technology & AI"],"summary":"Lifted by AI demand, Singapore's factory activity expanded in August for the 13th straight month, reaching its highest in nearly eight years, despite a deepening Middle East supply chain crisis. The PMI rose to 51.5 from 51.4 in July, its highest since November 2018; the electronics PMI hit 52.6 in its 15th month of expansion. Officials cited an AI-driven semiconductor super-cycle driving record order backlogs, echoed by regional expansions in China, Japan and South Korea. But supplier deliveries contracted for an eighth month as ships reroute around the Cape of Good Hope to avoid the Strait of Hormuz, and energy-driven input prices surged. The Sept 2 MAS survey raised the manufacturing forecast to 8.4 per cent; OCBC's Selena Ling sees around 9 per cent.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/Singapore%20factory%20activity%20expands%20in%20August,%20even%20as%20supply%20chain%20crisis%20from%20Iran%20war%20de.pdf"},{"id":"st-16","title":"Singapore, Indonesia business chambers push ahead with AI trade platform, eye 2027 Jakarta forum","source":"ST","date":"3 Sep 2026","tags":["Trade","Southeast Asia"],"summary":"An AI-powered platform guiding Indonesian exporters on trade requirements is on track for launch, with a full roll-out expected to coincide with the Singapore Regional Business Forum in Jakarta in 2027. The Singapore Business Federation and Indonesia's Kadin said on Sept 2 that TAIA-ID, an Indonesian version of SBF's Trade AI Advisor, will offer guidance on tariffs and free trade agreements in Bahasa Indonesia, targeting a Q4 2026 launch. The two-year MOU, signed July 6 at the Leaders' Retreat, anchors the Indonesia Global Trading Initiative. Kadin chairman Anindya Bakrie said Indonesia exports about US$300 billion of goods annually and wants to grow its US$240 billion in diversified exports. Both sides will jointly organise the 10th SRBF in mid-2027, timed to the 60th anniversary of ties and Singapore's ASEAN chairmanship.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/Singapore,%20Indonesia%20business%20chambers%20push%20ahead%20with%20AI%20trade%20platform,%20eye%202027%20Jakarta.pdf"},{"id":"st-17","title":"South Korea's Lee calls for conditions to resume US-North Korea dialogue","source":"ST","date":"3 Sep 2026","tags":["Geopolitics","Politics"],"summary":"South Korean President Lee Jae Myung said on Sept 2 that conditions should be created to resume dialogue between the United States and North Korea, according to the presidential Blue House. Speaking to overseas advisers on Korean Peninsula peace, Lee said the armistice system should be transformed into a peace system based on cooperation, urging an end to confrontation. The two Koreas remain technically at war since the 1950-53 conflict ended without a peace treaty. Lee also pledged to complete the return of wartime operational control from the US before his term ends in 2030. He has consistently pushed engagement despite Pyongyang designating the South a hostile state. Seoul's intelligence agency said the US and North Korea show signs of resuming dialogue, though no contacts are confirmed.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/South%20Korea's%20Lee%20calls%20for%20conditions%20to%20resume%20US-North%20Korea%20dialogue.pdf"},{"id":"st-18","title":"Taiwan's defence spending plan shows determination to protect itself: President Lai","source":"ST","date":"3 Sep 2026","tags":["Defence","Geopolitics"],"summary":"Taiwan's plan for 2027 defence spending to exceed NT$1 trillion (S$40 billion) for the first time shows the international community the island's determination to strengthen its defences, President Lai Ching-te said on Sept 2. Speaking to military officers on Armed Forces Day, Lai said only continuously enhancing defence and deterrent power can better ensure national security and regional peace. The government will pursue defence self-reliance, develop the military-industrial sector, artificial intelligence and unmanned vehicles. Beijing, which views democratically governed Taiwan as its territory, has ramped up military and political pressure. China's Taiwan Affairs Office accused Lai of inciting cross-strait confrontation and \"squandering the people's hard-earned money,\" warning his resistance to reunification would bring disaster. Lai maintains only Taiwan's people can decide their future.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/Taiwan's%20defence%20spending%20plan%20shows%20determination%20to%20protect%20itself%20President%20Lai.pdf"},{"id":"st-19","title":"Trump aides, fearing a midterm rout, push to keep Iran war 'quiet' for now","source":"ST","date":"3 Sep 2026","tags":["Geopolitics","Politics"],"summary":"Top aides to US President Donald Trump are pushing to keep the Iran war from escalating before November's midterms to limit Republican losses, four people familiar said, a strategy already strained as both sides resume attacks. Officials will weigh ramping up military action after the Nov 3 vote, focusing for now on economic pressure. Only 31 per cent of Americans approve of the war, with voters unhappy over high petrol prices; Trump's approval has fallen from 40 to 33 per cent. A pause could also let the military replenish depleted precision-missile stocks. Over the weekend the US struck Iran's Larak Island, prompting Iranian missiles towards Jordan and the UAE. Vance and Rubio back keeping the conflict \"quiet.\" Bessent warned the pressure campaign could itself stoke escalation; China has declined to isolate Iran.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/Trump%20aides,%20fearing%20a%20midterm%20rout,%20push%20to%20keep%20Iran%20war%20'quiet'%20for%20now.pdf"},{"id":"st-20","title":"UN agency urges civilian aircraft safety after Zelensky warns Russian airspace 'not safe'","source":"ST","date":"3 Sep 2026","tags":["Geopolitics","Defence"],"summary":"The UN's International Civil Aviation Organization called on members on Sept 2 to ensure the safety of civilian aircraft, shortly after Ukraine formally told the body that Russian airspace was \"not safe\" amid the war. The Montreal-based agency said long-range weapons, unmanned aircraft systems, satellite navigation interference and advanced air defences are among military technologies jeopardising civilian aviation, without naming any country. It reiterated calls for stronger commitments to protect aircraft from conflict-zone risks as the danger of being targeted or caught in crossfire increases. Ukrainian President Volodymyr Zelensky warned on Sept 1 that skies over Russia were becoming \"extremely dangerous\" due to Kyiv's drones, saying \"the safe days in the Russian sky are over,\" while insisting civilian flights are not being targeted.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/UN%20agency%20urges%20civilian%20aircraft%20safety%20after%20Zelensky%20warns%20Russian%20airspace%20'not%20safe'.pdf"},{"id":"st-21","title":"US dollar hits 7-week high; Middle East conflict and rate paths in focus","source":"ST","date":"3 Sep 2026","tags":["Finance & Markets","Energy"],"summary":"The US dollar hit a seven-week high on Sept 2 as investors sought the currency amid concerns over the energy shock and diverging monetary policy paths. The US and Iran returned to a war footing after the most significant exchange of fire in weeks. The greenback benefits from higher oil prices as the US economy is less exposed to energy shocks. The dollar index rose to 99.808, its highest since Aug 17, while the euro fell to US$1.1570. The US 10-year yield reached 4.812 per cent, its firmest since November 2023, and Japan's 10-year yield extended past the three-decade 3 per cent milestone. Markets price a 70 per cent chance of a September Fed hike. The yen rose to 159.50 per dollar; the New Zealand dollar slumped after a less hawkish-than-expected rate rise.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/US%20dollar%20hits%207-week%20high%20Middle%20East%20conflict%20and%20rate%20paths%20in%20focus.pdf"},{"id":"st-22","title":"US urges G-20 countries to allow AI training on creators' work","source":"ST","date":"3 Sep 2026","tags":["Technology & AI","Trade"],"summary":"The US urged G-20 countries on Sept 2 to develop rules letting AI companies train systems on copyrighted material, as American tech firms face mounting lawsuits. Companies including Anthropic, OpenAI, Google and Meta have been sued by authors, publishers and creators alleging misuse of their work. Commerce Secretary Howard Lutnick told a tech-focused meeting in North Carolina that countries should embrace \"fair use\" while finding ways to \"protect artists,\" offering no specifics. The Justice Department filed a brief backing OpenAI against the New York Times. Nvidia CEO Jensen Huang urged officials to avoid regulating \"theoretical harms.\" A US-released joint statement said G-20 nations will avoid new AI-specific rules, addressing only \"novel considerations.\" China, which already has broad AI rules, was a signatory.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/US%20urges%20G-20%20countries%20to%20allow%20AI%20training%20on%20creators'%20work.pdf"},{"id":"st-23","title":"US, China arm for space warfare: hunter satellites and orbital weapons","source":"ST","date":"3 Sep 2026","tags":["Defence","Technology & AI"],"summary":"The US and China are arming for possible conflict in space, a Reuters review of documents and tracking data found. In June a secretive Chinese spaceplane released a small satellite that looped around another Chinese satellite before returning, echoing a similarly secretive US spaceplane. Chinese military-linked researchers are developing satellites to pursue, capture and refuel spacecraft, while the US and Britain conducted their first joint military space operation near a suspected Chinese spy satellite. Space Force's Gen Chance Saltzman called China's threat \"substantial.\" Militaries increasingly view satellites as weapons platforms capable of jamming, dazzling or capturing rivals. Trump's Golden Dome envisions space-based interceptors. China has shown orbital \"dogfighting\" and refuelling attempts; the US unveiled an L3Harris electromagnetic weapon. Beijing says it opposes space weaponisation and accuses Washington of an arms race.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/US,%20China%20arm%20for%20space%20warfare%20hunter%20satellites%20and%20orbital%20weapons.pdf"},{"id":"st-24","title":"Ukraine is finalising drone deal with Germany, Zelenskiy says","source":"ST","date":"3 Sep 2026","tags":["Defence","Geopolitics"],"summary":"Ukraine is finalising a drone deal with Germany, President Volodymyr Zelenskiy said on Sept 2 after a call with Chancellor Friedrich Merz. The agreement, proposed by Ukraine several months ago, is expected to cover joint development of various drones, missiles and related software, providing both countries additional defence capabilities. It builds on existing German-Ukrainian cooperation, including a multi-million-euro programme to supply Kyiv 15,000 Strila interceptor drones designed to counter Shahed-type attack drones. In April, Germany's Quantum Systems and Ukraine's WIY Drones formed Quantum WIY Industries to boost interceptor-drone production. Germany is also funding an order for 50,000 Shrike attack drones from Ukrainian manufacturer SkyFall, one of the largest known drone purchases for Kyiv by a Western government. Zelenskiy said he and Merz also discussed air-defence support and an in-person meeting.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20ST/Ukraine%20is%20finalising%20drone%20deal%20with%20Germany,%20Zelenskiy%20says.pdf"},{"id":"bt-01","title":"'Xiplomacy': China's Xi begins busiest travel month since 2019 in diplomatic push before Trump talks","source":"BT","date":"3 Sep 2026","tags":["Geopolitics","Politics","Technology & AI"],"summary":"Chinese leader Xi Jinping is embarking on his busiest foreign travel schedule in more than seven years, seeking to convince nations that Beijing offers better global leadership than Washington. Xi visits Kyrgyzstan and Egypt, is expected at a Brics summit hosted by India's Narendra Modi, and plans a late-September Washington stop to meet Donald Trump to preserve the trade truce. In Bishkek for the Shanghai Cooperation Organization, Xi took a veiled swipe at the US, urging major powers to observe international rules, and will meet Vladimir Putin and Iran's Masoud Pezeshkian. Analysts say the tour lets Xi arrive in DC showing diplomatic breadth. The itinerary also lets Xi promote China's cheaper AI technology and tokens; Huawei is bidding to build AI data centres in Cairo.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/'Xiplomacy'%20China's%20Xi%20begins%20busiest%20travel%20month%20since%202019%20in%20diplomatic%20push%20before%20Tr.pdf"},{"id":"bt-02","title":"European shares hit by rising bond yields, energy-driven inflation concerns","source":"BT","date":"3 Sep 2026","tags":["Finance & Markets","Energy"],"summary":"European shares edged lower on Wednesday (Sep 2), pressured by elevated bond yields as escalating Middle East tensions stoked energy-induced inflation worries. The pan-European Stoxx 600 closed down 0.2 per cent at 645.94, with retailers leading a 2.3 per cent drop after hitting one-month lows. Brent crude traded above US$95 a barrel as the US and Iran traded fresh strikes. Germany's 10-year bond yield hit its highest since April 2011; markets see near-certain ECB rate hikes ahead. Germany's DAX fell 0.5 per cent and France's CAC 40 dropped 0.3 per cent on fiscal concerns. Banking stocks limited losses, jumping 0.6 per cent, led by ING after a Morgan Stanley upgrade. Volkswagen fell 3.2 per cent after being replaced by Nokia in the Euro Stoxx 50.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/European%20shares%20hit%20by%20rising%20bond%20yields,%20energy-driven%20inflation%20concerns.pdf"},{"id":"bt-03","title":"Falling AI token costs could fuel next leg of Singapore semiconductor rally: analysts","source":"BT","date":"3 Sep 2026","tags":["Technology & AI","Finance & Markets","Southeast Asia"],"summary":"Falling AI token costs could spur wider use of AI models and drive a fresh wave of infrastructure spending benefiting Singapore-listed chip equipment suppliers, analysts say. Silicon Data's LLM Token Expenditure index stood at US$0.9665 on Aug 31, less than half its May peak. DBS said broader open-weight adoption should widen semiconductor beneficiaries. AEM, UMS Integration and Frencken are positioned to capture profits; their shares are up 403.5 per cent, 123.6 per cent and 64.5 per cent year-to-date respectively. AEM raised 2026 revenue guidance to S$630 million-S$680 million; UMS lifted H1 net profit 66 per cent to S$33.4 million; Frencken saw H1 profit dip 3.4 per cent. Analysts flag capacity constraints, skilled-manpower bottlenecks in Penang and stretched valuations as key risks.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Falling%20AI%20token%20costs%20could%20fuel%20next%20leg%20of%20Singapore%20semiconductor%20rally%20analysts.pdf"},{"id":"bt-04","title":"G20 finance chiefs back action against trade-distorting policies; China holds out","source":"BT","date":"3 Sep 2026","tags":["Trade","Geopolitics","Finance & Markets"],"summary":"The Trump administration won backing from all G20 financial leaders except China's on Tuesday (Sep 1) to act against non-market policies and distortions causing over-reliance on exports. US Treasury Secretary Scott Bessent said 19 countries wanting to address the issue showed its enormity. A chair's statement urged countries with excessive external surpluses to remove distortions constraining domestic consumption. China, with weak domestic demand, has doubled down on exports, which rose 23.9 per cent in July year on year; its goods surplus with the EU hit 360.6 billion euros in 2025. The meeting came amid a global bond sell-off, with Japan's 10-year yield hitting 3 per cent for the first time since 1996. Russia attended for the first time since invading Ukraine, drawing European and Canadian dismay.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/G20%20finance%20chiefs%20back%20action%20against%20trade-distorting%20policies%20China%20holds%20out.pdf"},{"id":"bt-05","title":"Global bond rout deepens as oil-fuelled inflation fears drive yields to multi-decade highs","source":"BT","date":"3 Sep 2026","tags":["Finance & Markets","Energy"],"summary":"Global bonds sold off sharply on Wednesday (Sep 2), extending a rout lifting borrowing costs to multi-decade highs as the Middle East conflict pushed energy prices up, feeding fears about inflation and swelling government debt. The 10-year US Treasury yield hit a near three-year high of 4.81 per cent, with 5 per cent seen as plausible. Japan's 10-year yield held above 3 per cent, a 30-year high; Australia's hit a 15-year high; French OAT futures fell to a record low. Big-tech bond issuance to fund the AI boom added pressure. Analysts invoked 'bond vigilantes' demanding fiscal discipline. Brent crude rose 1 per cent to US$95.61. Traders priced a Sep 10 ECB hike and a 68 per cent chance of a US hike on Sep 16.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Global%20bond%20rout%20deepens%20as%20oil-fuelled%20inflation%20fears%20drive%20yields%20to%20multi-decade%20highs.pdf"},{"id":"bt-06","title":"Global data centre spending to reach US$31.6 trillion by 2050 on AI boom: PwC","source":"BT","date":"3 Sep 2026","tags":["Technology & AI","Finance & Markets","Environment"],"summary":"Global data centre spending is set to reach US$31.6 trillion through 2050 to meet surging AI demand, an investment boom with no historical precedent, PwC said in its inaugural Global Data Center Outlook. Spending could hit US$50 trillion if AI adoption accelerates; for comparison, US GDP is roughly US$30 trillion. The US will capture nearly half at US$15.1 trillion, followed by Asia-Pacific (US$8.2 trillion), Europe (US$5.6 trillion), the Middle East (US$1.1 trillion) and Africa (US$255 billion). Recurring chip upgrades, resetting every four to six years, will dominate outlays. Annual spending rises from about US$800 billion in 2026 to US$1.8 trillion by 2050, with China and India leading demand growth. Power availability is the key constraint; a backlash blocked or delayed 75 projects worth US$130 billion in early 2026.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Global%20data%20centre%20spending%20to%20reach%20US31.6%20trillion%20by%202050%20on%20AI%20boom%20PwC.pdf"},{"id":"bt-07","title":"Heavy EV incentive cut will slow adoption but could ease COE premiums: observers","source":"BT","date":"3 Sep 2026","tags":["Southeast Asia","Environment","Society"],"summary":"Singapore's Land Transport Authority announced on Wednesday (Sep 2) that incentives for electric heavy vehicles with a maximum laden weight of 3,501 to 7,000 kg will be cut sharply to S$15,000 from S$40,000, effective Thursday, as more lower-emission models become available. Vehicles above 7,000 kg keep the S$40,000 incentive. Observers said the move, targeting the largest EHV segment, will slow adoption but could ease record Category C COE premiums, which hit S$95,000 in July. EHVs made up 30 per cent of heavy-vehicle registrations in July, up from under 1 per cent in 2025. Industry players said the previous scheme was gamed by dealers adding weight to light vehicles to qualify for larger rebates. Some called the change too sudden, preferring a tiered system.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Heavy%20EV%20incentive%20cut%20will%20slow%20adoption%20but%20could%20ease%20COE%20premiums%20observers.pdf"},{"id":"bt-08","title":"Hunting for yield? DBS analysts bet on S-Reits over bank dividends","source":"BT","date":"3 Sep 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"Investors chasing dividend income should look beyond Singapore banks towards real estate investment trusts, DBS Research Group said, as the yield gap between the two hits a multi-year high. S-Reits yield about 6.2 per cent on average versus around 4 per cent for DBS, OCBC and UOB, a 2.2 percentage-point spread exceeding 2022-2024 levels. Falling short-term rates give Reits an earnings buffer as they refinance cheaply, with DPUs seen growing about 3 per cent in FY2026. Small and mid-cap Reits are expected to lead DPU growth. DBS prefers office Reits given record-low CBD Grade A vacancy of 3.3 per cent, followed by industrials, retail and hotels. Top picks include CICT, Parkway Life, Centurion Accommodation, NTT DC and Lendlease Global Commercial. Rising US Treasury yields remain a risk.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Hunting%20for%20yield%20DBS%20analysts%20bet%20on%20S-Reits%20over%20bank%20dividends.pdf"},{"id":"bt-09","title":"Iraq's oil exports rose to around 2.34 million bpd in August","source":"BT","date":"3 Sep 2026","tags":["Energy","Geopolitics"],"summary":"Iraq's oil exports rose to around 2.34 million barrels per day in August, up from about 1.35 million bpd in July, two Iraqi energy officials said. The recovery came after Opec's second-largest producer had been severely curtailed by the near-closure of the Strait of Hormuz since the Iran war began on February 28. One official said an increase in the number of tankers reaching Iraq's export terminals and loading crude helped boost shipments. Iraq has been granted permission by Teheran for a number of its tankers to pass through the strait, Iran's IRNA reported. September shipments are set to climb further, industry sources told Reuters, as buyers have been encouraged by the Iranian approval and by Baghdad offering attractive discounts.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Iraq's%20oil%20exports%20rose%20to%20around%202.34%20million%20bpd%20in%20August.pdf"},{"id":"bt-10","title":"Keppel DC Reit's private placement upsized to S$625 million after 'strong demand'","source":"BT","date":"3 Sep 2026","tags":["Finance & Markets","Technology & AI","Southeast Asia"],"summary":"Keppel DC Reit's private placement to partially fund the majority acquisitions of two Japan data centres was upsized to S$625 million from S$600 million on strong investor demand, its manager said on Wednesday (Sep 2). DBS, OCBC, Jefferies Singapore and UOB were joint bookrunners; the placement was about 3.4 times covered, mostly allocated to long-only investors and real estate specialists. The issue price was fixed at S$2.10 per new unit, a 4.4 per cent discount, with 297.6 million new units to be issued. About S$615.8 million will help fund 90 per cent stakes in Tokyo Data Centre 4 and 5 in Inzai City for about 171 billion yen (US$1.1 billion). New units trade from Sep 10. The counter closed 0.5 per cent lower at S$2.19.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Keppel%20DC%20Reit's%20private%20placement%20upsized%20to%20S625%20million%20after%20'strong%20demand'.pdf"},{"id":"bt-11","title":"Microsoft reveals Azure cloud sales in financial reporting shift","source":"BT","date":"3 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Microsoft on Wednesday (Sep 2) reported Azure cloud sales on a quarterly basis for the first time, enabling direct comparison with rivals Amazon and Google amid an AI data centre boom. Azure had US$29.4 billion in sales in its most recent quarter and US$101.9 billion for the fiscal year ended Jun 30. That places Microsoft behind Amazon, whose cloud sales were US$42.2 billion in its latest quarter, but ahead of Google's US$24.8 billion. Microsoft will move from three reporting segments to two: 'Agents and Infra', covering cloud and AI software, and 'Devices and Consumer', covering Windows, Xbox and advertising. CEO Satya Nadella said AI is reshaping the business. Microsoft slightly trimmed its Azure revenue forecast, reflecting a reclassification of GitHub sales. Shares rose about 1.4 per cent after-hours.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Microsoft%20reveals%20Azure%20cloud%20sales%20in%20financial%20reporting%20shift.pdf"},{"id":"bt-12","title":"Nokia set to rejoin Euro Stoxx 50, Volkswagen dropped","source":"BT","date":"3 Sep 2026","tags":["Finance & Markets","Technology & AI"],"summary":"Finnish telecom equipment maker Nokia Oyj is set to rejoin the blue-chip Euro Stoxx 50 index a year after being dropped, while Volkswagen will be removed, index provider Stoxx said in its annual review on Tuesday (Sep 1). Nokia shares hit a near-18-year high in June, more than double their year-earlier price, helped by its shift towards selling fibre-optic equipment to companies building AI data centres. Volkswagen shares have dropped nearly 27 per cent this year as Europe's largest automaker struggles against Chinese competition and pursues restructuring. French utility Engie will also join, while Wolters Kluwer is removed; changes take effect Sep 21. In the broader Stoxx 600, Greek banks join after a reclassification to developed-market status, while JD Sports, Thule Group and Fraport exit.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Nokia%20set%20to%20rejoin%20Euro%20Stoxx%2050,%20Volkswagen%20dropped.pdf"},{"id":"bt-13","title":"Oil settles 1% higher, as US-Iran strikes threaten supplies","source":"BT","date":"3 Sep 2026","tags":["Energy","Geopolitics"],"summary":"Brent crude settled 1 per cent higher in a volatile session on Wednesday (Sep 2), driven by renewed military strikes between the US and Iran that have restricted world oil supply. The war is now in its seventh month, with the latest attacks the biggest exchange since July as US forces struck Iran's southern coast and Iran fired on American bases. Brent settled up 98 cents at US$95.63; WTI rose 79 cents to US$91.01, with session highs the loftiest since Jul 24. Iran has largely shut Hormuz shipping since late February; only four commodity vessels transited on Wednesday versus a 10-day average near 13, and two tankers hit sea mines. Opec+ is likely to keep October output policy unchanged. US crude inventories fell 4.5 million barrels last week.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Oil%20settles%201%20higher,%20as%20US-Iran%20strikes%20threaten%20supplies.pdf"},{"id":"bt-14","title":"Putin says Russia seeks to end, not freeze, Ukraine conflict and is ready for talks","source":"BT","date":"3 Sep 2026","tags":["Geopolitics","Defence","Politics"],"summary":"Russian President Vladimir Putin said on Tuesday (Sep 2) that Russia wants to end, rather than freeze, the conflict in Ukraine and is ready to hold talks. Speaking after the Shanghai Cooperation Organisation summit in Bishkek, he said Moscow remained open to negotiations to achieve lasting peace across Ukraine and Europe with anyone willing. Yet he portrayed Ukraine's leadership as 'terrorists' with whom talks were not possible, while claiming Russia was winning and advancing on the battlefield. Putin acknowledged Ukrainian attacks had inflicted real damage, with drones posing a particular challenge, but dismissed mobilisation rumours as nonsense. He said Russian troops captured 270 sq km of Donetsk in August and are advancing on Sloviansk and Kramatorsk, preparing massive strikes on Ukrainian energy infrastructure.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Putin%20says%20Russia%20seeks%20to%20end,%20not%20freeze,%20Ukraine%20conflict%20and%20is%20ready%20for%20talks.pdf"},{"id":"bt-15","title":"Rise in US factory orders beats expectations in July","source":"BT","date":"3 Sep 2026","tags":["Finance & Markets","Trade"],"summary":"New orders for US factory goods increased more than expected in July amid a rebound in aircraft demand. Factory orders rose 0.9 per cent after a revised 0.2 per cent drop in June, the Commerce Department's Census Bureau said on Wednesday (Sep 2), beating economists' forecast of a 0.6 per cent gain. Orders advanced 6.5 per cent year-over-year. Manufacturing, 9.4 per cent of the economy, is getting a tailwind from the AI buildout, though the US-Israeli war with Iran is straining supply chains and keeping input prices high. The rebound was led by a 12.7 per cent surge in civilian aircraft orders. Non-defence capital goods orders excluding aircraft, a proxy for business spending, were unchanged rather than up 0.2 per cent. The core slowdown is seen as temporary.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Rise%20in%20US%20factory%20orders%20beats%20expectations%20in%20July.pdf"},{"id":"bt-16","title":"Singapore, Thailand to develop multi-year agenda for successive Asean chairmanships","source":"BT","date":"3 Sep 2026","tags":["Southeast Asia","Trade","Politics"],"summary":"Singapore and Thailand agreed on Wednesday (Sep 2) to cooperate closely on a multi-year Asean agenda focused on continuity and momentum, as Singapore prepares to chair the bloc in 2027 before Thailand takes over. PM Lawrence Wong and PM Anutin Charnvirakul held their first Leaders' Retreat in Bangkok, the fifth edition after an 11-year hiatus. They agreed to identify collaboration in fintech and the digital economy, building on the 2021 PayNow-PromptPay linkage, and in physical connectivity, semiconductors and AI. On food security, Thailand pledged to supply 100,000 tonnes of rice over five years, building on a rice trade pact. Both leaders reaffirmed Asean's role supporting Myanmar and discussed Thailand-Cambodia relations, energy resilience via the Asean Power Grid, and carbon-credit cooperation.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Singapore,%20Thailand%20to%20develop%20multi-year%20agenda%20for%20successive%20Asean%20chairmanships.pdf"},{"id":"bt-17","title":"Taiwan says its companies plan to invest another US$20 billion in US","source":"BT","date":"3 Sep 2026","tags":["Technology & AI","Trade","Geopolitics"],"summary":"Taiwanese companies are planning another US$20 billion of investments in the US, driven by demand for AI applications, the island's economy minister said on Wednesday (Sep 2), without naming firms. The US, Taiwan's key backer despite lacking formal ties, has pushed Taiwanese tech companies to expand US investment to boost domestic chip manufacturing. Economy Minister Kung Ming-hsin said companies were investing 'very actively' and that a new assessment since May's SelectUSA summit, excluding TSMC, yielded the extra US$20 billion, spurred by lively AI and chip orders. TSMC in July announced a further US$100 billion Arizona investment, bringing its total to US$265 billion. A US Commerce Department official welcomed the move. Trump has at times accused Taiwan of 'stealing' American semiconductor business, a charge Taipei calls unfair.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Taiwan%20says%20its%20companies%20plan%20to%20invest%20another%20US20%20billion%20in%20US.pdf"},{"id":"bt-18","title":"UK fines Citibank London US$6 million over Russia sanctions breaches","source":"BT","date":"3 Sep 2026","tags":["Finance & Markets","Geopolitics"],"summary":"Britain on Wednesday (Sep 2) fined Citibank 4.7 million pounds (US$6.35 million) under its Russia sanctions regime, saying the US bank's CBNA London unit had made funds available for the benefit of sanctioned parties. The Office of Financial Sanctions Implementation said the majority of breaches occurred between February and November 2022, and that CBNA London had voluntarily disclosed most of them. Since Russia's February 2022 invasion of Ukraine, Britain, the US and the EU have imposed thousands of sanctions on individuals, entities and ships. OFSI said many breaches arose amid strain on the bank's alert-handling and investigation processes after sanctions were first imposed. It found no intent to breach, but said the errors were, in aggregate, material and significant across many business areas. Citi did not immediately comment.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/UK%20fines%20Citibank%20London%20US6%20million%20over%20Russia%20sanctions%20breaches.pdf"},{"id":"bt-19","title":"US House passes funding Bill to avert government shutdown before midterm elections","source":"BT","date":"3 Sep 2026","tags":["Politics","Finance & Markets"],"summary":"The US House of Representatives on Tuesday (Sep 1) overwhelmingly approved legislation, by 370-48, to keep federal agencies operating beyond October 1, extending current spending through December 11 and sending it to President Donald Trump. The Senate passed the measure on August 8. The stopgap was needed because Congress has failed to finish any of the 12 full-year spending Bills. Since Trump's second term began, contentious fights have produced three partial shutdowns totalling an unprecedented 161 days. Neither party wanted a fourth shutdown before the November 3 midterms, amid voter anger over food and housing costs, the Iran war and tariffs. The Bill leaves major fiscal problems unaddressed as national debt crossed US$40 trillion, and sets up an arduous December spending fight.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/US%20House%20passes%20funding%20Bill%20to%20avert%20government%20shutdown%20before%20midterm%20elections.pdf"},{"id":"bt-20","title":"US dollar rises to 2-week high; Middle East conflict and rate paths in focus","source":"BT","date":"3 Sep 2026","tags":["Finance & Markets","Energy"],"summary":"The US dollar hit a two-week high on Wednesday (Sep 2) as investors sought safety amid the energy shock and weighed diverging monetary policy paths. Iran and its Arab neighbours were plunged back into war by the biggest US-Iran exchange of fire since July, and the greenback tends to benefit from higher oil prices given America's lower energy exposure. Economists expect the ECB near the end of its tightening cycle while the Fed may only be starting to raise rates, favouring the dollar. The dollar index rose 0.20 per cent to 99.865; the euro fell to US$1.1575. The 10-year Treasury yield reached 4.8182 per cent, its firmest since November 2023, and Japan's hit 3.01 per cent. Markets price a 68 per cent chance of a September Fed hike. The New Zealand dollar slumped 1.01 per cent.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/US%20dollar%20rises%20to%202-week%20high%20Middle%20East%20conflict%20and%20rate%20paths%20in%20focus.pdf"},{"id":"bt-21","title":"US private payrolls growth slows in August, ADP says","source":"BT","date":"3 Sep 2026","tags":["Finance & Markets","Society"],"summary":"US private payrolls increased moderately in August, the ADP National Employment Report showed on Wednesday (Sep 2). Private employment rose by 38,000 jobs last month after an upwardly revised 46,000 in July. Economists polled by Reuters had forecast a 48,000 gain, after a previously reported 44,000 July rise. The ADP report, jointly developed with the Stanford Digital Economy Lab, was published ahead of the Bureau of Labor Statistics' more comprehensive employment report for August due Friday; ADP has been a poor gauge of the BLS estimate. The BLS reported 1.05 open jobs per unemployed person in July, consistent with stable labour conditions. Private payrolls were expected to rise 45,000 in August and nonfarm payrolls to rebound 56,000 after a surprise July decline, with unemployment steady at 4.1 per cent.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/US%20private%20payrolls%20growth%20slows%20in%20August,%20ADP%20says.pdf"},{"id":"bt-22","title":"Yen surges with traders on high alert for further intervention","source":"BT","date":"3 Sep 2026","tags":["Finance & Markets","Politics"],"summary":"The Japanese yen strengthened sharply against the US dollar on Wednesday (Sep 2), leaving traders hyper-vigilant for signs of fresh intervention. The currency rallied as much as 1.2 per cent to 158.22 per dollar, having gained after hawkish BOJ board member Hajime Takata left the door open to an outsized rate move and back-to-back hikes. The Bloomberg Dollar Spot Index fell 0.3 per cent, its biggest intraday drop since Aug 21. The move fell short of a month earlier, when Tokyo and Washington's first coordinated yen-buying since 1998 sparked a 5 per cent rally from a four-decade low near 164. Japan spent a record US$96.4 billion over the past month supporting the yen. PM Takaichi's government reportedly backs a near-term BOJ hike; Treasury's Scott Bessent expects Governor Ueda to 'do the right thing'.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20BT/Yen%20surges%20with%20traders%20on%20high%20alert%20for%20further%20intervention.pdf"},{"id":"scmp-01","title":"Can Singapore be the 'natural choice' to bridge Asean and Central Asia?","source":"SCMP","date":"3 Sep 2026","tags":["Southeast Asia","Trade","Geopolitics"],"summary":"Singapore is positioning itself as a bridge between Central Asia and Asean amid trade disruption and superpower rivalry, Senior Minister Lee Hsien Loong told Uzbekistan's parliament during an August 24-31 visit to Kazakhstan and Uzbekistan. Set to chair Asean next year, Singapore will explore cooperation in transport, connectivity and energy, and has agreed to begin free-trade talks with Tashkent. Analysts including Nazarbayev University's Sabina Insebayeva call Singapore a \"natural choice\" given institutional credibility and technical expertise, though geography, landlocked routes, regulatory gaps and weak connectivity remain constraints. ISEAS's Joanne Lin says Singapore should be a facilitator, not sole gateway, with success dependent on commercially viable opportunities and participation from Indonesia, Vietnam and Malaysia.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/Can%20Singapore%20be%20the%20'natural%20choice'%20to%20bridge%20Asean%20and%20Central%20Asia.pdf"},{"id":"scmp-02","title":"China cracks down on AI 'slop', clearing out clutter from WeChat, RedNote, Douyin","source":"SCMP","date":"3 Sep 2026","tags":["Technology & AI","Society","Politics"],"summary":"China's Cyberspace Administration (CAC) said on Wednesday it scrubbed more than 5.61 million pieces of harmful or illegal content and removed some 49,000 accounts in its latest drive against AI-generated \"slop\" - low-grade, mass-produced synthetic content. The clampdown swept 2,400 websites and apps including Douyin, Kuaishou, RedNote and Tencent's WeChat, targeting AI-driven fake news, explicit material, impersonation and minor-safety violations. Creators had turned classics like Romance of the Three Kingdoms into sensationalised \"digital swill,\" while AI \"digital humans\" ran deceptive marketing at elderly users. Developers behind ByteDance's Doubao and Alibaba's Qwen tightened training-data reviews and synthetic-content labelling. Alibaba owns the Post. The CAC pledged continued monitoring while supporting the technology's development.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/China%20cracks%20down%20on%20AI%20'slop',%20clearing%20out%20clutter%20from%20WeChat,%20RedNote,%20Douyin.pdf"},{"id":"scmp-03","title":"China urges global AI cooperation, not rivalry, ahead of Xi-Trump summit","source":"SCMP","date":"3 Sep 2026","tags":["Technology & AI","Geopolitics","Politics"],"summary":"China's science and technology minister Yin Hejun called for global cooperation to manage AI's opportunities and risks at the G20 Innovation Ministerial Meeting held in the US on Monday and Tuesday, saying countries urgently need to work together. The appeal came amid renewed US-China trade and tech tensions ahead of Xi Jinping's planned September 24 visit to Washington. The US has restricted foreign-made advanced drones, robots and connected power inverters, and is weighing curbs on Chinese data-centre equipment and open-weight models; Beijing tightened dual-use drone export controls. Citi analysts said the flare-up was unlikely to materially disrupt China's AI exports. US host Michael Kratsios urged a hands-off \"Carolina Principles\" approach, highlighting divergent US-China governance stances.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/China%20urges%20global%20AI%20cooperation,%20not%20rivalry,%20ahead%20of%20Xi-Trump%20summit.pdf"},{"id":"scmp-04","title":"China widens access to overseas stocks, handing out nearly US$7b in QDII quotas","source":"SCMP","date":"3 Sep 2026","tags":["Finance & Markets"],"summary":"China's foreign-exchange regulator granted US$6.84 billion of qualified domestic institutional investor (QDII) quotas to mutual funds, insurers and banks' wealth-management units by end-August, easing tight supply of cross-border investment products. Eighteen managers, including China Asset Management and GF Fund Management, received US$100 million each, while over 20 banks' wealth arms won quotas for the first time. The move follows a crackdown on non-compliant offshore stock accounts and rising demand for diversification amid falling home prices and fixed-income returns. China has approved US$183 billion in QDII quotas for 196 institutions since 2006. A South Korea semiconductor ETF is this year's best QDII performer, up 76 per cent; Hong Kong tech funds are worst, down nearly 30 per cent.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/China%20widens%20access%20to%20overseas%20stocks,%20handing%20out%20nearly%20US7b%20in%20QDII%20quotas.pdf"},{"id":"scmp-05","title":"China's AMEC unveils 6 chip-making machines in a day, boosting self-reliance ambitions","source":"SCMP","date":"3 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Chinese chip-equipment maker Advanced Micro-Fabrication Equipment (AMEC) unveiled six new machines in a single day at a Wuxi conference on Tuesday, spanning etching, deposition and silicon-carbide power-chip tools, as it transforms from etching specialist to all-around supplier. Four of the six are deposition tools, markets dominated by Lam Research, Applied Materials and Tokyo Electron. AMEC cut its development cycle to under two years and spent 2.04 billion yuan (US$303.5 million) on R&D in the first half, up 36.9 per cent. It has developed 54 equipment types and aims to cover over 60 per cent of high-end IC equipment within five years. Bernstein estimates Chinese suppliers held 31 per cent of China's dry-etch market in 2025; Goldman sees 38 per cent of wafer-fab equipment revenue by 2028.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/China's%20AMEC%20unveils%206%20chip-making%20machines%20in%20a%20day,%20boosting%20self-reliance%20ambitions.pdf"},{"id":"scmp-06","title":"China's No 2 foundry Hua Hong invests US$2b in new fab to meet surging AI-driven demand","source":"SCMP","date":"3 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"China's second-largest contract chipmaker Hua Hong Grace Semiconductor is investing US$2 billion in a new 12-inch speciality line in Wuxi, its third facility there, to meet surging AI-infrastructure demand and bypass US tech curbs, per a Hong Kong exchange filing Tuesday. The plant, dubbed Fab 9B, will add 55,000 wafers monthly, a roughly 30 per cent capacity increase in Wuxi. Carried out via a joint venture with state-backed entities including the \"Big Fund\" vehicle Hua Xin Fund, total project funding reaches US$4.2 billion, with Hua Hong holding a 51 per cent controlling stake. Existing Shanghai and Jiangsu plants ran at 103 per cent utilisation in Q2. Second-quarter net profit jumped 385.9 per cent to US$38.6 million on record revenue of US$717.5 million.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/China's%20No%202%20foundry%20Hua%20Hong%20invests%20US2b%20in%20new%20fab%20to%20meet%20surging%20AI-driven%20demand.pdf"},{"id":"scmp-07","title":"China's US$10.8b trade short cut: new Pinglu Canal prepares to supercharge Asean shipments","source":"SCMP","date":"3 Sep 2026","tags":["Trade","Southeast Asia"],"summary":"China delivered the Pinglu 001, the first command and management vessel for the Pinglu Canal, on Monday, marking a final step before the 72.7 billion yuan (US$10.8 billion) megaproject opens later this month, likely aligned with the September 17-21 China-Asean Expo in Nanning. The 134km canal, China's first river-to-sea waterway, links Nanning to the Gulf of Tonkin near Vietnam, cutting the inland Guangxi-to-ocean route by 560km and accommodating 5,000-tonne vessels. It gives landlocked Yunnan, Guizhou and Sichuan faster access to Asean shipping lanes for textiles, timber, electronics and steel. China-Asean trade rose 24.7 per cent to US$744.4 billion in seven months; Vietnam trade surged 33.7 per cent to US$215.1 billion. The first route serves Hainan.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/China's%20US10.8b%20trade%20short%20cut%20new%20Pinglu%20Canal%20prepares%20to%20supercharge%20Asean%20shipments.pdf"},{"id":"scmp-08","title":"China's pension fund doubles offshore investments to new high in quest for higher returns","source":"SCMP","date":"3 Sep 2026","tags":["Finance & Markets"],"summary":"China's National Social Security Fund (NSSF) more than doubled offshore investments over three years to a record 580.02 billion yuan (US$86 billion) by end-2025, a record 15.23 per cent of total assets, up from 9.8 per cent in 2022, as it seeks higher returns amid lower domestic growth and rates. Hong Kong is a key beneficiary, with PBOC governor Pan Gongsheng pledging in July to increase reserve allocations there. Analysts cite the Stock Connect scheme, deep US-dollar bond pools, and access to tech firms absent from A shares. Hong Kong IPOs raised HK$209.9 billion in the first half, up 92 per cent. The NSSF generated 390.7 billion yuan in investment income last year, a 13.2 per cent return, with total assets reaching 3.8 trillion yuan.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/China's%20pension%20fund%20doubles%20offshore%20investments%20to%20new%20high%20in%20quest%20for%20higher%20returns.pdf"},{"id":"scmp-09","title":"China's tech push fuels fastest profit growth in 4 years amid signs of economic divide","source":"SCMP","date":"3 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"AI demand and domestic chip substitution drove profit growth for Chinese listed companies to its fastest pace in four years in the first half of 2026, underscoring a \"K-shaped\" economy. Profit on Shanghai's chip-heavy Star Market surged more than fourfold year on year, while Shenzhen's ChiNext rose 33 per cent, outpacing the 19.5 per cent gain for all 5,557 mainland-listed firms. Memory maker CXMT, the Star Market's most valuable at 3.8 trillion yuan, posted a 77.6 billion yuan profit, swinging from a loss; Cambricon more than doubled net income and Zhongji Innolight jumped 241 per cent. About one-fifth of firms unveiled buy-backs worth over 200 billion yuan. Investors expect Beijing to bolster tech rather than broad stimulus.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/China's%20tech%20push%20fuels%20fastest%20profit%20growth%20in%204%20years%20amid%20signs%20of%20economic%20divide.pdf"},{"id":"scmp-10","title":"China-Egypt joint drills a show of Beijing's military reach","source":"SCMP","date":"3 Sep 2026","tags":["Defence","Geopolitics"],"summary":"China is matching its overseas economic presence with military reach, as shown by recent air drills in Egypt where Chinese J-16 fighters, refuelled mid-air by YU-20 tankers, joined Egypt's \"Eagles of Civilisation\" exercise alongside Rafales and MiG-29s - the first time China sent the jets to Africa. The drills coincide with Xi Jinping's visit marking 70 years of ties. Chinese firms are embedded around the Suez Canal; Beijing's first-half 2026 investment is estimated up to US$2 billion, though Egypt's trade deficit with China exceeded US$18 billion. Huawei has bid to build AI data centres using Ascend chips against a US Nvidia-AMD-Microsoft proposal. Cairo balances China with US military aid, French and Russian aircraft, and Brics membership, extracting leverage from great-power competition.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/China-Egypt%20joint%20drills%20a%20show%20of%20Beijing's%20military%20reach.pdf"},{"id":"scmp-11","title":"Denmark sends conscripts to Greenland, signalling aim to boost Arctic defences","source":"SCMP","date":"3 Sep 2026","tags":["Defence","Geopolitics"],"summary":"For the first time in recent history, Danish conscripts have been deployed to Greenland as Denmark bolsters its Arctic presence following US demands to acquire the semi-autonomous territory. President Donald Trump has repeatedly sought the island, citing national security and accusing Copenhagen of neglecting Arctic defence; Denmark and Greenland firmly reject the idea. The conscripts, the first cohort under Denmark's extended conscription programme, are taking part in Arctic Endurance, a cold-weather combat and survival exercise, itself part of Arctic Sentry, a Nato mission launched this year to strengthen the alliance's Arctic presence. Copenhagen has pledged billions after acknowledging years of underinvestment. Russia, which holds the Arctic's largest military footprint, criticised Nato's growing activity as a security threat; China has increased regional activity, mostly with Moscow.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/Denmark%20sends%20conscripts%20to%20Greenland,%20signalling%20aim%20to%20boost%20Arctic%20defences.pdf"},{"id":"scmp-12","title":"Dutch shift 86 tonnes of gold from US and Canada to UK over 'geopolitical unrest'","source":"SCMP","date":"3 Sep 2026","tags":["Finance & Markets","Geopolitics"],"summary":"The Dutch central bank (DNB) said Wednesday it moved 86 tonnes of gold reserves out of the US and Canada to London, citing \"increasing geopolitical unrest\" and noting London holdings can be traded and deployed more easily in a crisis. The Netherlands' total gold stock was 612.4 tonnes, valued at 72.2 billion euros (US$83.7 billion) at end-2025. New York and Ottawa each fell to 18.5 per cent of reserves, while London's share rose from 18.1 to 32.1 per cent. The operation ran from March to August, combining buying, selling and physical transport via Zeist. Analyst John Plassard called it a \"fairly one-off move\" but warned that if other central banks followed, it could damage confidence in the US. Germany's Bundesbank has kept its reserves in New York.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/Dutch%20shift%2086%20tonnes%20of%20gold%20from%20US%20and%20Canada%20to%20UK%20over%20'geopolitical%20unrest'.pdf"},{"id":"scmp-13","title":"EU trade enforcers descend on Beijing demanding China fix 'untenable' imbalances","source":"SCMP","date":"3 Sep 2026","tags":["Trade","Geopolitics"],"summary":"A European Commission delegation led by top trade enforcement officer Denis Redonnet held talks in Beijing seeking a diplomatic off-ramp from a looming trade war before an October deadline. The EU wants China to commit to reducing surging exports; in July alone China widened its surplus over all but three EU members. Trade official Ditte Juul Jorgensen, who will follow to Beijing this month, called the deficit an \"untenable situation,\" citing suspected undeclared subsidies, an undervalued currency and industrial overcapacity. Brussels is developing a \"diversification instrument\" to compel supplier diversification. Von der Leyen's September 16 State of the Union will set tone for an October Sefcovic-Wang Wentao meeting. Germany's Merz and the Dutch government have shifted toward tougher measures on Chinese goods.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/EU%20trade%20enforcers%20descend%20on%20Beijing%20demanding%20China%20fix%20'untenable'%20imbalances.pdf"},{"id":"scmp-14","title":"Frontier AI at a cost: what Anthropic's Fable 5.1 means for the US-China model race","source":"SCMP","date":"3 Sep 2026","tags":["Technology & AI","Geopolitics"],"summary":"Anthropic's new Claude Fable 5.1, with a restricted-access version Mythos 5.1, widened the US lead over Chinese rivals, scoring 66 on Artificial Analysis' Intelligence Index - top globally, six points clear of Moonshot's Kimi K3 and Z.ai's GLM-5.3 - and first on Vals AI's index. But a stark price gap persists: despite cache-read cuts, Fable 5.1 costs US$3.69 per task versus US$0.84 for Kimi K3 and US$0.68 for GLM-5.3, splitting the market between cheap open models and premium frontier work. Alibaba, the Post's owner, released Qwen3.8-Max-0902, topping Arena AI's front-end benchmark. Z.ai's coming GLM-6.0 targets recursive self-improvement. OpenAI teased its Astra model with \"critical\" cybersecurity capability, alarming safety researchers over its opaque \"recurrent depth\" architecture.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/Frontier%20AI%20at%20a%20cost%20what%20Anthropic's%20Fable%205.1%20means%20for%20the%20US-China%20model%20race.pdf"},{"id":"scmp-15","title":"How Japan aims to convert ageing warships into leverage to counter China","source":"SCMP","date":"3 Sep 2026","tags":["Defence","Geopolitics","Southeast Asia"],"summary":"Japan's plans to transfer ageing warships to the Philippines and Indonesia could turn older hardware into geopolitical leverage, deepening security ties and counterbalancing China without demanding alignment, observers say. Manila expects five Abukuma-class destroyer escorts within two to three years; Tokyo and Jakarta are discussing Asagiri-class destroyers. A National Institute for Defence Studies analysis suggests Japan could retire equipment early to expand the transfer pool. Central to the push is the Official Security Assistance framework, a grant-based aid programme whose budget rose from 2 billion yen in 2023 to a record 18.1 billion yen. Analysts describe the approach toward Indonesia as \"influence without demanding alignment,\" with Japan moving from building production networks to establishing defence networks across the Indo-Pacific.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/How%20Japan%20aims%20to%20convert%20ageing%20warships%20into%20leverage%20to%20counter%20China.pdf"},{"id":"scmp-16","title":"How the SCO chips away at US power without an alliance system","source":"SCMP","date":"3 Sep 2026","tags":["Geopolitics","Politics"],"summary":"The Shanghai Cooperation Organisation (SCO), born 25 years ago to manage borders among China, Russia and four Central Asian states, looked more consequential at its Bishkek anniversary summit amid the unresolved Ukraine war and the Iran-US conflict. Its 10 full members represent more than 3.4 billion people and roughly a quarter of global GDP. Xi Jinping presented it as a model of cooperation without formal alliances, though members' interests diverge - India and China compete, India and Pakistan clash. Lacking Nato's command or the EU's institutions, the SCO's significance is practical: giving states that resist Washington's dominance a forum to coordinate and hedge. Members discuss national-currency use and an SCO development bank. The article argues US tariff and technology pressure encourages exactly such hedging.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/How%20the%20SCO%20chips%20away%20at%20US%20power%20without%20an%20alliance%20system.pdf"},{"id":"scmp-17","title":"In Bishkek, US envoys shadow the SCO summit in challenge on Beijing and Moscow's turf","source":"SCMP","date":"3 Sep 2026","tags":["Geopolitics","Politics"],"summary":"As China and Russia rallied dozens of countries at the SCO summit in Bishkek, US Senator Steve Daines and special envoy Sergio Gor met Kyrgyzstan's Sadyr Japarov, Tajikistan's Emomali Rahmon and Uzbekistan's Shavkat Mirziyoyev separately on Monday, seeking to blunt Beijing's influence. Xi Jinping and Vladimir Putin held their own talks with the Central Asian leaders. Washington emphasises the \"C5+1\" framework and covets the region's tungsten, uranium, antimony, molybdenum and rare earths for a China-alternative supply chain. Kazakhstan has joined both Beijing's World AI Cooperation Organisation and the US-led Pax Silica, which reportedly warned members against dual membership. Fudan's Wu Xinbo called forcing Central Asia to choose an \"unrealistic goal,\" noting economic ties with China far exceed those with the US.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/In%20Bishkek,%20US%20envoys%20shadow%20the%20SCO%20summit%20in%20challenge%20on%20Beijing%20and%20Moscow's%20turf.pdf"},{"id":"scmp-18","title":"Iran war: Trump floats renaming Strait of Hormuz as 'Trump Strait'","source":"SCMP","date":"3 Sep 2026","tags":["Geopolitics","Energy","Politics"],"summary":"US President Donald Trump on Wednesday suggested renaming the Strait of Hormuz as \"Trump Strait,\" asserting US control of the waterway even as fighting with Iran raged there. The White House posted a Gulf map marking \"Trump Strait,\" adding it \"got a nice ring to it.\" It is the latest in a series of renamings, following Lake Ontario to \"Lake America\" and the Gulf of Mexico to \"Gulf of America\"; neither Mexico nor Canada accepted the changes. Iran has effectively shut the chokepoint, through which a fifth of the world's oil passes, for six months in retaliation for the war Trump began with Israel in late February. Oil prices rose after fresh US strikes near the strait on Tuesday; Trump said the renewed campaign would not last \"too long.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/Iran%20war%20Trump%20floats%20renaming%20Strait%20of%20Hormuz%20as%20'Trump%20Strait'.pdf"},{"id":"scmp-19","title":"Iran wins SCO backing against US strikes. Will it be enough?","source":"SCMP","date":"3 Sep 2026","tags":["Geopolitics","Politics"],"summary":"As the US resumed strikes to force an end to the six-month war, Iran turned to the SCO and Brics for diplomatic cover. The Bishkek Declaration explicitly condemned military strikes on Iranian territory as violations of international law and backed Iran's sovereignty, though analysts say support may prove more symbolic than substantial. President Masoud Pezeshkian held sideline talks with Putin, Pakistan's Shehbaz Sharif and India's Narendra Modi. Xi Jinping indirectly criticised the US, warning against \"external forces\" undermining stability. Fudan's Sun Degang said sanctions would not end China's resilient trade and energy cooperation with Iran and might backfire on Washington. Griffith University's Ian Hall said Iran gained diplomatically but the SCO and Brics, not military alliances, are unlikely to provide material support or peacemaking.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/Iran%20wins%20SCO%20backing%20against%20US%20strikes.%20Will%20it%20be%20enough.pdf"},{"id":"scmp-20","title":"SCO takes landmark stand on nuclear security as Iran comes under renewed attack","source":"SCMP","date":"3 Sep 2026","tags":["Geopolitics","Defence","Politics"],"summary":"The Shanghai Cooperation Organisation issued its first dedicated declaration on nuclear safety and security at its 25th anniversary Bishkek summit on Tuesday, adopted by all 10 members, condemning attacks on peaceful nuclear facilities and outlining cooperation on regulation, emergency response and anti-trafficking while affirming each state's sovereign responsibility. Without naming Iran, it condemned attacks on peaceful nuclear facilities as violations of international law amid US-Israeli strikes. Xi Jinping linked it to his Global Security Initiative; Putin denounced Western \"double standards.\" The proposal was first raised at the 2025 Tianjin summit by Uzbekistan's Mirziyoyev. The declaration comes amid stalled US-Russia arms control after New Start expired in February. Analyst Zhu Yongbiao cautioned its intent \"lies more in asserting autonomy than direct rivalry.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/SCO%20takes%20landmark%20stand%20on%20nuclear%20security%20as%20Iran%20comes%20under%20renewed%20attack.pdf"},{"id":"scmp-21","title":"South China Sea island build-up heightens Vietnam's security concerns","source":"SCMP","date":"3 Sep 2026","tags":["Geopolitics","Defence","Southeast Asia"],"summary":"Vietnam faces heightened South China Sea tensions after reports of Chinese construction in the Paracels (Xisha Islands), which analysts say could alter the strategic balance. Hanoi strongly objected after satellite imagery showed new infrastructure on Yagong (Ba Ba) Island; the Asia Maritime Transparency Initiative reported completed land reclamation and a \"likely airstrip\" at Antelope Reef. Foreign Ministry spokeswoman Pham Thu Hang called the activities \"completely illegal and null and void.\" China controls seven fortified Spratly outposts on roughly 1,300 hectares and has held the Paracels since seizing them from South Vietnam in 1974. Analysts say new installations tighten Vietnam's operating environment and risk escalation. Hanoi, expanding its own Spratly bases to about 1,100 hectares, signals willingness to internationalise the dispute under Unclos.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/South%20China%20Sea%20island%20build-up%20heightens%20Vietnam's%20security%20concerns.pdf"},{"id":"scmp-22","title":"Tencent's Hy4 model gains in open-source AI rankings after ecosystem-driven training","source":"SCMP","date":"3 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Tencent's new Hy4 preview model, trained on data from its vast product ecosystem, returns its Hunyuan suite to the top tier of open-source offerings, analysts say. Goldman Sachs highlighted a \"differentiated product-plus-model strategy\" deploying preview models across Tencent products to gather user data for retraining. Released Friday, Hy4 ranked eighth globally on Code Arena's WebDev leaderboard, just behind Anthropic's Claude Fable 5, and scored 64.3 on DeepSWE, surpassing Alibaba's Qwen-3.8 Max (56.6) and DeepSeek-V4 Pro (62.7). Alibaba owns the Post. Hy4 features 770 billion parameters, a 2.6-fold increase over Hy3, and a 1-million-token context window. Tencent compressed the 1.5-terabyte model to 214 gigabytes. Second-quarter capital expenditure surged 176 per cent to 52.8 billion yuan (US$7.8 billion).","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/Tencent's%20Hy4%20model%20gains%20in%20open-source%20AI%20rankings%20after%20ecosystem-driven%20training.pdf"},{"id":"scmp-23","title":"Trump puts pressure on squeezed US oil refiners to ease pump prices","source":"SCMP","date":"3 Sep 2026","tags":["Energy","Politics"],"summary":"President Donald Trump pressed US oil refiners to boost petrol and diesel output during a closed-door White House meeting Tuesday, contending with high prices before November's midterms. US fuel prices are at record seasonal levels, with petrol above US$4 a gallon and diesel near US$6. Roughly a dozen executives from firms including Delek, PBF Energy, Marathon and Valero attended; discussion touched regulatory changes, faster permitting and Venezuelan crude processing. Refiners pushed back on the Renewable Fuel Standard's record-high biofuel-blending quotas as driving up costs, after the EPA granted small-refinery exemptions Monday. Trump is seeking more Venezuelan crude via North American Blue Energy Partners. Prices remain about US$1 above the February 28 war start; Trump could not guarantee they would drop before the election.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/03%20Sep%202026/03%20Sep%20SCMP/Trump%20puts%20pressure%20
