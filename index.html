te": "14 Aug 2026", "tags": ["Technology & AI", "Trade", "Politics"], "summary": "In one of his last public appearances as CEO, Tim Cook toured a Texas Foxconn plant with Commerce Secretary Howard Lutnick, unveiling a Mac Mini assembly line starting later this year and a hands-on manufacturing school for small and midsize firms. The visit spotlighted Apple's close ties with the Trump administration, which has touted Apple's pledge to invest $600 billion domestically over four years and granted it relief from the heaviest tariffs. Most of Apple's supply chain remains overseas; it is expanding iPhone assembly in India. Apple has committed to buy chips from TSMC's Arizona plant, struck deals with Intel and Broadcom, and Foxconn is funding the assembly lines. Cook becomes chairman next month; John Ternus takes over.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/Apple%20Showcases%20Texas%20Mac%20Mini%20Factory,%20New%20Manufacturing%20School.pdf"}, {"id": "wsj-02", "title": "Applied Materials Eyes Capacity Expansion as Profit, Revenue Grow", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Applied Materials plans to roughly double quarterly semiconductor-system output by 2028 and is planning another expansion for 2030, responding to AI-driven demand, CFO Brice Hill told analysts. Fiscal third-quarter net income rose to $2.54 billion, or $3.17 a share, from $1.78 billion a year earlier; adjusted earnings of $3.50 beat the $3.40 consensus. Revenue climbed to $9.12 billion from $7.3 billion, topping estimates, with semiconductor-systems revenue at $7.04 billion. CEO Gary Dickerson raised calendar-2026 expectations, citing DRAM, foundry-logic and advanced packaging. Fourth-quarter guidance is $3.82-$4.22 a share on $9.75-$10.75 billion revenue. Shares fell 5% after hours to $507.97 despite more than doubling this year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/Applied%20Materials%20Eyes%20Capacity%20Expansion%20as%20Profit,%20Revenue%20Grow.pdf"}, {"id": "wsj-03", "title": "China's SMIC Posts Earnings Beat as Mature-Node Orders Surge", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "SMIC, China's biggest chip foundry, more than tripled second-quarter net profit to $479.2 million, far above the $283.1 million analysts expected, as AI-driven capacity squeezes pushed clients to shift mature-node and specialty orders to China. Revenue rose 36% to $3.01 billion and gross margin hit 25.3%, topping guidance and reaching a multi-quarter high. Smartphone wafers made up 25.2% of revenue, up from 18.9%. Co-CEO Zhao Haijun said the firm negotiated higher prices on scarce products. SMIC guided third-quarter gross margin to 26%-28% and revenue up 2%-4% sequentially, with wafer utilization at 93.7%. It pledged to \"flexibly allocate\" capacity to ease industrywide shortages.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/China's%20SMIC%20Posts%20Earnings%20Beat%20as%20Mature-Node%20Orders%20Surge.pdf"}, {"id": "wsj-04", "title": "Chinese Censorship Is Leaking Into Answers From American AI", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "New studies find American AI models unwittingly echo Chinese censorship, absorbing state-controlled media during training. Meta's oversight board research showed models from OpenAI, Anthropic, Google and Meta were less likely to criticize repressive governments. In tests, Anthropic's Claude Sonnet 4 created fliers criticizing Trump and King Charles III but refused ones targeting Xi Jinping or Thailand's king, citing safety; Google's Gemini 3 Pro and Meta's Llama 4 Maverick sometimes declined too. Researcher Nicolas Suzor cited safety features and neglect of unequal responses. A separate Nature study found Chinese-language prompts more likely to yield pro-Beijing answers because state-scripted sources dominate that data. Researchers urge transparency about state-sourced content; Anthropic and OpenAI cited balance efforts.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/Chinese%20Censorship%20Is%20Leaking%20Into%20Answers%20From%20American%20AI.pdf"}, {"id": "wsj-05", "title": "DeepMind's Hassabis Pitched AI-Oversight Body Before Shake-Up", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Technology & AI", "Politics"], "summary": "Alphabet scientist Demis Hassabis held talks with government officials and rival AI-lab leaders about forming an independent industry safety entity in the weeks before stepping down as Google DeepMind CEO, people familiar said. He likened it to the International Atomic Energy Agency and, in a mid-July essay, proposed an industry-funded \"standards body\" modeled on FINRA, with national labs testing models for national-security risks. He previewed the idea to Treasury Secretary Scott Bessent and adviser Michael Kratsios. OpenAI's Sam Altman and Anthropic have floated similar coordination mechanisms. Hassabis, a Nobel laureate, becomes DeepMind chairman and Alphabet chief scientist, replaced as CEO by Koray Kavukcuoglu. Critics say voluntary self-regulation is inadequate.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/DeepMind's%20Hassabis%20Pitched%20AI-Oversight%20Body%20Before%20Shake-Up.pdf"}, {"id": "wsj-06", "title": "Elon Musk, the World's Most Famous EV Pioneer, Is Now Leaning Into Fossil Fuels", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Energy", "Technology & AI"], "summary": "Elon Musk, once an evangelist against fossil fuels, is turning to natural gas to power SpaceX's AI ambitions. SpaceX disclosed plans for a gas plant at its $16.8 billion \"Terafab\" chip project in Grimes County, Texas, and relies on dozens of gas turbines at data centers in Tennessee and Mississippi; Musk personally bought a turbine maker. Its data centers already supply three-quarters of 2 gigawatts of behind-the-meter power, and Musk says capacity could reach 10-15 gigawatts by end-2027, surpassing Amazon's 13. The \"Bring Your Own Power\" trend lets projects bypass slow grid connections. SpaceX struck cloud deals with Anthropic ($1.25 billion monthly) and Google ($920 million). Cleanview tracks 59 off-grid centers totaling roughly 90 gigawatts.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/Elon%20Musk,%20the%20World's%20Most%20Famous%20EV%20Pioneer,%20Is%20Now%20Leaning%20Into%20Fossil%20Fuels.pdf"}, {"id": "wsj-07", "title": "The stock market thinks the economy is accelerating. Don't expect jobs to follow, writes the WSJ's Greg Ip.", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Society"], "summary": "Greg Ip argues the U.S. is in a \"jobless boom.\" Stocks are up 13% this year despite lackluster 1.5% annualized second-quarter GDP, and the rally reflects earnings, not a bubble: excluding Amazon and Alphabet, second-quarter earnings jumped 32%, so multiples fell. Median S&P 500 earnings growth accelerated to 13% from 8% two years ago, broad-based beyond AI, with banks and small caps outpacing the Magnificent Seven. Yet hiring is stalling: total payrolls shrank in July, the fifth time in 12 months, while unemployment stays near 4% only because the labor force is shrinking amid retirements and reduced immigration. Wage growth of 3.2% is the lowest since before the pandemic. Consumer saving and debt-funded data centers can't sustain forever.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/Greg%20Ip%20-%20stock%20market%20says%20economy%20accelerating,%20jobs%20won't%20follow.pdf"}, {"id": "wsj-08", "title": "How to Lose Friends and Alienate Allies", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Geopolitics", "Trade"], "summary": "In an opinion piece, Rahm Emanuel argues both Washington and Beijing are using other nations as dumping grounds for domestic dysfunction, whipsawing middle powers between Chinese economic coercion and American political intervention. China exports excess capacity, killing Chile's Huachipato steelworks and Indonesian garment jobs; Trump exports cultural divisions, sanctioning a Brazilian judge, tariffing Brazil 50%, and courting Germany's far-right AfD. Emanuel urges Democrats to \"isolate the isolator\" via three steps: replace tariff walls with an \"economic bloc of common interest\" setting one external tariff on subsidized overcapacity; compete in markets by helping allies find alternatives to Chinese coercion; and treat allies' industrial bases as U.S. security assets. He says Trump's boorishness squanders chances to exploit China's vulnerabilities.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/How%20to%20Lose%20Friends%20and%20Alienate%20Allies.pdf"}, {"id": "wsj-09", "title": "JD.com Profit, Revenue Beat Expectations as Food-Delivery Losses Narrow", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "JD.com beat second-quarter expectations as losses narrowed at its costly food-delivery business, entered 18 months ago. Net profit rose 15% from a year earlier and 40% from the prior quarter to 7.13 billion yuan ($1.06 billion); adjusted net profit climbed 21% to 8.93 billion yuan. Revenue fell 2.9% to 346.40 billion yuan but beat the 339.93 billion yuan consensus. CEO Sandy Xu cited \"resilient and high-quality operations\" and a \"clear inflection\" in profit driven by core JD Retail and narrowing delivery losses. HSBC analysts expect further improvement as promotions ease. China's weak consumption remains a drag, with slower growth at the \"618\" shopping festival signaling persistent softness, per Syntun data.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/JD.com%20Profit,%20Revenue%20Beat%20Expectations%20as%20Food-Delivery%20Losses%20Narrow.pdf"}, {"id": "wsj-10", "title": "Lenovo Posts Record Revenue, Expects to Hit $100 Billion Goal This Year", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Lenovo posted record quarterly revenue of $26.94 billion for the three months ended June, up 43% and beating the $22.33 billion consensus, and now expects to hit its $100 billion annual revenue goal ahead of schedule. Its infrastructure-solutions business nearly doubled revenue on surging AI-server demand, producing $777 million operating profit, with a $54 billion AI-server pipeline. AI-related revenue was 35% of the total. Adjusted net profit nearly tripled to $1.075 billion, though the company swung to a $609 million net loss on a warrant-revaluation charge. Intelligent devices rose 27%; worldwide PC shipments fell 4.9% amid memory-driven price rises, yet Lenovo held 24.2% market share. Hong Kong shares jumped 20%, up over 275% year-to-date.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/Lenovo%20Posts%20Record%20Revenue,%20Expects%20to%20Hit%20100%20Billion%20Goal%20This%20Year.pdf"}, {"id": "wsj-11", "title": "Mexico Presses U.S. to Cut Auto Tariffs", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Trade", "Energy"], "summary": "Mexico is pressing the U.S. to lower North American auto tariffs as part of talks to rework the USMCA, countering Washington's push for more U.S.-made parts. The U.S. currently charges 25% on non-U.S. content from Canada and Mexico; Mexico's plan would let Mexican and Canadian parts qualify duty-free and drop the top-line rate to roughly 5%-10% for non-compliant North American cars. The bundled news brief also covers AI-driven warehouse demand (Link Logistics ties 15% of new leasing to data centers); Black Sea maritime attacks by Russia and Ukraine threatening grain and oil flows; Iran's near-halt of Strait of Hormuz traffic; OPEC cutting 2026 demand-growth forecasts to 580,000 barrels a day; and Bank of America's $250 billion infrastructure push.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/Mexico%20Presses%20U.S.%20to%20Cut%20Auto%20Tariffs.pdf"}, {"id": "wsj-12", "title": "Putin's Visit to Disputed Island Adds to Pressure on Japan", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Vladimir Putin made his first visit to the southern Kuril Islands, a chilly archipelago Russia seized from Japan in 1945 that Tokyo still claims, adding to mounting pressure on Japan from China, Russia and North Korea. Prime Minister Sanae Takaichi called the visit to Iturup \"absolutely unacceptable.\" It followed a North Korean ballistic-missile launch and months of Chinese friction after Takaichi suggested Japan could be drawn into a Taiwan conflict, prompting Beijing to cancel tourist flights and restrict critical-mineral access. China, North Korea and Russia have accused Japan of reviving militarism. Analyst James Brown said Moscow appears to be \"deliberately making common cause with China.\" Japan's defense ministry calls the environment its most severe in 80 years.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/Putin's%20Visit%20to%20Disputed%20Island%20Adds%20to%20Pressure%20on%20Japan.pdf"}, {"id": "wsj-13", "title": "Rick Perry's Fermi Finally Finds a Customer for Its Giant Texas AI Power Bet", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Energy", "Technology & AI"], "summary": "Fermi, the data-center and power startup co-founded by former Energy Secretary Rick Perry, landed its first customer and named a new CEO, aiming to turn a corner after a legal fight with ousted co-founder Toby Neugebauer. AI cloud provider TensorWave leased 222 megawatts at Fermi's Texas \"Project Matador\" campus, worth about $6.5 billion over 15 years. Board member Lee McIntire became CEO. The startup has booked no revenue and its net loss widened to $25.8 million; its market value has fallen from roughly $19 billion at October's IPO to under $5 billion. Hillcore Energy Capital will build 2.6 gigawatts of mostly gas generation. Fermi projects 4.8 gigawatts within 30 months, eventually 17 gigawatts, riding the \"Bring Your Own Power\" trend.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/Rick%20Perry's%20Fermi%20Finally%20Finds%20a%20Customer%20for%20Its%20Giant%20Texas%20AI%20Power%20Bet.pdf"}, {"id": "wsj-14", "title": "Taiwan Weaponizes Coast Guard to Prepare for Battle With China", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Taiwan is giving its coast guard an expanded national-security role, integrating it with the navy to counter a possible Chinese amphibious invasion. In recent drills near Kaohsiung, a coast guard cutter led missile boats, and the antiship-missile-armed cutter Bali escorted a commercial ship through a mock blockade, part of 33 exercises during this year's 10-day \"Han Kuang\" maneuvers. China has bulked up its own coast guard, using it to pressure Taipei with \"gray-zone\" operations. Taiwan's cutters can load Hsiung Feng II and III missiles and would fall under navy command in wartime. A 2018 plan aims to add 141 ships. Officials stress keeping sea lanes open for energy imports. The U.S. operates fast-response cutters from Singapore and the Philippines.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/Taiwan%20Weaponizes%20Coast%20Guard%20to%20Prepare%20for%20Battle%20With%20China.pdf"}, {"id": "wsj-15", "title": "Tariff Refunds Are Here—and Turbocharging Earnings", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Trade", "Finance & Markets"], "summary": "Tariff refunds are flowing to big U.S. companies with surprising speed after the Supreme Court invalidated a cornerstone of Trump's tariffs. Over 40 S&P 500 companies reported roughly $9.6 billion in refunds, including $2.1 billion in cash. Largest: Apple (nearly $2.2 billion), Nike ($986 million), FedEx (~$800 million), Amazon ($640 million) and GM ($500 million). Customs accepted $128.7 billion in refund submissions as of July 31. Apple said refunds added 11 cents to per-share earnings, about 5% of the quarter. Some firms, including FedEx and Costco, plan to pass refunds to customers. Yet many still pay far more in ongoing tariffs: Caterpillar booked $392 million in recoveries but expects $2.2 billion in total tariff costs this year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/Tariff%20Refunds%20Are%20Here-and%20Turbocharging%20Earnings.pdf"}, {"id": "wsj-16", "title": "Trump Is Starting to Look Precarious", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Politics", "Geopolitics"], "summary": "In an opinion column, Peggy Noonan argues Donald Trump's political position is eroding into new precarity amid the Iran war, economic anxiety and a resurgent left. RealClearPolitics puts his job approval at 39% against 59% disapproval; an Economist poll had him at 34%-61%. Noonan says Iran, a \"war of choice\" contradicting his anti-adventurism brand, makes him look out of his depth and less competent. On the economy, Reuters/Ipsos and Fox polls show Democrats edging or leading Republicans, denting Trump's businessman image. She warns of competitive House races in the midterms, an \"Incumbent Problem\" of accumulating bad news, and a fading mystique. She cites his remark to Tucker Carlson that things would be OK \"Because it always is,\" calling his need for drama a weakness.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/Trump%20Is%20Starting%20to%20Look%20Precarious.pdf"}, {"id": "wsj-17", "title": "U.K. Economy Continues Robust Performance in Second Quarter", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Energy"], "summary": "The U.K. economy grew 0.4% in the second quarter, matching consensus and outpacing the U.S., after a G7-leading 0.6% first-quarter rise. On an annualized basis, growth was 1.7%, above the U.S.'s 1.5% and near the eurozone's 1.8%, even as Iran's closure of the Strait of Hormuz lifted fuel prices. Services led growth; retail was buoyed by World Cup merchandise and England's hottest June on record, which boosted air-conditioning sales. The Bank of England, which held rates, is expected to hold in September but raise at least once by year-end, with inflation seen climbing to 3.2%. A 13% July energy price-cap rise threatens purchasing power. Prime Minister Andy Burnham, in office since July, has yet to detail a growth agenda.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/U.K.%20Economy%20Continues%20Robust%20Performance%20in%20Second%20Quarter.pdf"}, {"id": "wsj-18", "title": "U.S. Sending Fresh Aircraft Carrier to Middle East Amid Iran War Strain", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "The U.S. military is preparing to replace the USS Abraham Lincoln with the USS George Washington in the Middle East amid concerns over crew conditions during the Iran war. The Lincoln has been deployed over 250 days without a port call in 200, setting a record, with Senator Richard Blumenthal citing reports of supply shortages, water contamination, plumbing issues and lost mail. A sailor went overboard in early August but was rescued. Defense Secretary Pete Hegseth said the concerns were \"completely misrepresented\" and that the U.S. can sustain its blockade of Iranian ports indefinitely. The Lincoln aided Operation Epic Fury. Shifting the Japan-based George Washington leaves a Pacific void versus China; analysts warn readiness could take three years to restore.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/U.S.%20Sending%20Fresh%20Aircraft%20Carrier%20to%20Middle%20East%20Amid%20Iran%20War%20Strain.pdf"}, {"id": "wsj-19", "title": "U.S. and Ukrainian Forces Went Head-to-Head in an Exercise. Ukraine's Drones Won.", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Defence", "Technology & AI"], "summary": "At the Combined Resolve exercise in Germany in April and May, Ukrainian drone operators easily spotted and defeated U.S. troops and armored vehicles rotating from Fort Hood, eliminating a U.S. armored brigade, people familiar said. The drubbing, alongside U.S. casualties in Iran, exposes American vulnerabilities to drones years after the U.S. pioneered long-range uncrewed warfare and despite billions spent on counterdrone technology. Roughly 3,500 personnel from the 3rd Armored Brigade Combat Team faced a force reinforced by Ukraine's 412th \"Nemesis\" regiment; heavy vehicles threw up dust that reconnaissance drones easily tracked. NATO's top commander said \"You can't get training like this in the United States.\" Newer Mobile Brigade Combat Teams fared better. Scholar Eliot Cohen called mastering drones vital.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/U.S.%20and%20Ukrainian%20Forces%20Went%20Head-to-Head%20in%20an%20Exercise.%20Ukraine's%20Drones%20Won..pdf"}, {"id": "wsj-20", "title": "Washington's Four Wrong Assumptions About the Iran War", "source": "WSJ", "date": "14 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "In an opinion piece, Nazee Moinian argues Washington keeps making four false assumptions about Iran. First, that the regime is a purely rational actor, ignoring its revolutionary self-image as leader of an \"axis of resistance.\" Second, that a fixed pain threshold exists, undercut by U.S. impatience—the April 13 oil blockade cost Tehran an estimated $500 million a day but was paused in June before concessions. Third, that battlefield losses become negotiating losses, though air campaigns alone rarely force surrender. Fourth, that domestic unrest weakens Iran abroad, when the regime treats dissent as capital \"moharebeh.\" Moinian backs resuming the financial blockade while empowering dissidents, noting Trump said he is \"only seminegotiating.\" Tehran, she writes, is wounded but not exhausted, playing a weak hand strongly.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20WSJ/Washington's%20Four%20Wrong%20Assumptions%20About%20the%20Iran%20War.pdf"}, {"id": "st-01", "title": "'We don't need to hold 100%': CapitaLand Investment weighs partial sale of Ascott stake", "source": "ST", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "CapitaLand Investment (CLI) is considering divesting a stake in its hospitality arm, The Ascott Limited, to accelerate growth, chief executive Lee Chee Koon said at an Aug 13 results briefing. \"We don't need to hold 100 per cent of Ascott,\" Lee said, adding CLI is open to an investor that aids M&A ambitions but has not decided how much to sell. The move is separate from a plan to divest $7 billion to $9 billion in legacy funds and non-core holdings. CLI's first-half net profit rose 13.9 per cent to $327 million, driven by fund-management fee income up 20 per cent to $687 million, though total revenue slipped 2 per cent to about $1 billion. Some 96 per cent of Ascott's portfolio is asset-light.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/'We%20don't%20need%20to%20hold%20100'%20CapitaLand%20Investment%20weighs%20partial%20sale%20of%20Ascott%20stake.pdf"}, {"id": "st-02", "title": "Australia's Albanese says AUKUS remains 'full steam ahead' after Trump call", "source": "ST", "date": "14 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Australian Prime Minister Anthony Albanese said on Aug 14 the AUKUS defence pact remained \"full steam ahead\" after an overnight phone call with US President Donald Trump, and that he urged a full tariff exemption for Australia. Both leaders agreed the pact, which will deliver nuclear-powered submarines, would benefit Australia, the US and Britain. AUKUS, Australia's largest-ever defence project, will see US-commanded Virginia-class submarines based there from next year, and Canberra has committed A$368 billion ($259.7 billion) over three decades. Albanese called the talk \"very productive\" and said Trump agreed to consider exempting Australia from its flat 12.5 per cent tariffs. The leaders also discussed the Iran conflict and new Australian defence ties with Papua New Guinea and Fiji.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/Australia's%20Albanese%20says%20AUKUS%20remains%20'full%20steam%20ahead'%20after%20Trump%20call.pdf"}, {"id": "st-03", "title": "CDL triples first-half profit to $300m on strong residential property performance", "source": "ST", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "City Developments Limited (CDL) more than tripled first-half net profit to $301.6 million, up 230.7 per cent from $91.2 million a year earlier, as revenue jumped 61.1 per cent to $2.72 billion. Key contributors were the fully sold Lumina Grand executive condominium in Bukit Batok and strong take-up at Newport Residences. An interim dividend of six cents per share, double a year earlier, was declared, and shares briefly rose above 8 per cent. The hotel business returned to a $42 million pre-tax profit. CEO Sherman Kwek said the outcome of CDL's strategic review will be announced by end-September, that divestments will accelerate, and that Singapore property prices should end 2026 up 2 to 3 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/CDL%20triples%20first-half%20profit%20to%20300m%20on%20strong%20residential%20property%20performance.pdf"}, {"id": "st-04", "title": "China to tighten entry and exit controls from Sept 15", "source": "ST", "date": "14 Aug 2026", "tags": ["Politics", "Geopolitics"], "summary": "China will introduce stricter controls on people entering and leaving the country from Sept 15 under new 19-article State Council regulations signed by Premier Li Qiang on July 22. Applicants must state a truthful, lawful purpose, and authorities may question them and demand documents, materials and electronic data. Citizens who fraudulently obtain documents or commit crimes overseas harming national security may be barred from leaving for six months to three years, and those violating export-control rules may also be blocked. Foreigners using false documents face entry bans of one to five years. Immigration intermediaries must register within set deadlines. The rules do not establish blanket phone searches, nor revoke visa-free schemes covering 50 countries and a 240-hour transit policy for 55 nations.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/China%20to%20tighten%20entry%20and%20exit%20controls%20from%20Sept%2015.pdf"}, {"id": "st-05", "title": "Genting Singapore H1 profit falls 33.54% to $156.5 million despite stable revenue", "source": "ST", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Resort and casino operator Genting Singapore reported a 33.5 per cent drop in first-half net profit to $156.1 million from $234.7 million a year earlier, hit by higher depreciation, lower interest income and asset-refresh works. It cited a \"softer operating environment\" with lower second-quarter demand and moderating tourism arrivals. Revenue was largely stable, down 0.9 per cent at $1.2 billion, supported by non-gaming revenue up about 6 per cent to $388.6 million; gaming revenue fell about 4 per cent to $804.4 million. Adjusted Ebitda declined 8.4 per cent to $389.8 million. An unchanged interim dividend of $0.02 was declared. Resorts World Sentosa's Q2 Ebitda rose 12 per cent year on year, and the RWS 2.0 transformation remains on track for 2030.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/Genting%20Singapore%20H1%20profit%20falls%2033.54%20to%20156.5%20million%20despite%20stable%20revenue.pdf"}, {"id": "st-06", "title": "Japan's nuclear doublethink is getting harder to defend", "source": "ST", "date": "14 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "This Bloomberg Opinion column by Gearoid Reidy argues Japan's defence posture relies on \"doublethink\": opposing atomic weapons while sheltering under the US nuclear umbrella. Defence Minister Shinjiro Koizumi drew condemnation from China, Russia, North Korea and atomic-bomb survivors for saying Tokyo must \"discuss all policies, without any taboos\". The piece contends discussion does not mean adoption, and that Japan's three non-nuclear principles, adopted in 1967, are non-binding yet politically potent. It notes US plans to deploy nuclear-armed sea-launched cruise missiles on Virginia-class submarines that call at Japanese ports. Prime Minister Sanae Takaichi maintains the principles but may open debate on the third in an update of Japan's defence documents. The author says the debate's outcome should be won through discussion, not declared off-limits.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/Japan's%20nuclear%20doublethink%20is%20getting%20harder%20to%20defend.pdf"}, {"id": "st-07", "title": "Large explosion rips through Italian munitions factory", "source": "ST", "date": "14 Aug 2026", "tags": ["Defence", "Society"], "summary": "A powerful explosion tore through a munitions factory near Colleferro, south-east of Rome, on Aug 13, with the blast heard for kilometres. It occurred as firefighters and police were already at the site responding to a fire. No injuries were reported, said Franco-German defence group KNDS, whose subsidiary KNDS Ammo Italy operates the plant. Colleferro mayor Giulio Calamita said it \"would have been a tragedy\" had the blast not struck during the summer holiday when the plant was closed. The plant makes medium- and large-calibre ammunition for land and naval defence systems and solid propellants for aerospace launch vehicles. The company is among contractors on European Defence Agency 155mm ammunition framework agreements concluded in 2023. Large plumes of smoke rose as emergency crews worked.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/Large%20explosion%20rips%20through%20Italian%20munitions%20factory.pdf"}, {"id": "st-08", "title": "Lower mortgage rates, policy changes to support Singapore property market in 2026: PropNex", "source": "ST", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "PropNex expects lower mortgage rates, population growth and recent policy changes to support Singapore's residential market in the second half of 2026, even as price growth moderates. It forecasts private home prices rising 3 to 4 per cent for 2026, with about 9,000 new private homes sold, and 14,000 to 15,000 resale deals. Fixed two-year loan rates now range 1.4 to 1.7 per cent. CEO Kelvin Fong said buying is \"mainly led by locals with genuine housing needs\". Removal of the 15-month wait-out period and eased ABSD remission rules should aid movement between markets. PropNex forecasts 26,000 to 27,000 HDB resale deals. First-half revenue edged up 0.7 per cent to $603 million, while net profit fell 3.1 per cent to $40.9 million.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/Lower%20mortgage%20rates,%20policy%20changes%20to%20support%20Singapore%20property%20market%20in%202026%20PropNex.pdf"}, {"id": "st-09", "title": "North Korea may increase western Russia deployment to 50,000 troops", "source": "ST", "date": "14 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Russia and North Korea are considering deploying additional North Korean troops to three western Russian regions bordering Ukraine, freeing Russian units for the front, Ukraine's military intelligence said on Aug 12. Under a provisional Russian plan obtained by Kyiv, Pyongyang's deployment would rise to 50,000 troops by end-November to help seize Ukraine's Donbas region by end-2026. Ukraine says more than 42,000 Russian soldiers were killed or wounded in July, driving Moscow to seek reinforcements. More than 10,000 North Korean troops have already fought in western Russia, mostly in Kursk, with the plan envisioning duties in Bryansk and Belgorod. Around 9,500 ground troops are currently in Russia. Pyongyang has also sent about 90 missile troops to Voronezh and supplied 40 more ballistic missiles.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/North%20Korea%20may%20increase%20western%20Russia%20deployment%20to%2050,000%20troops.pdf"}, {"id": "st-10", "title": "North Korea warns of new 'deterrent' ahead of US-South Korea drills", "source": "ST", "date": "14 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "North Korea denounced upcoming joint US-South Korea military drills and warned it could respond with stronger deterrence measures, in a Foreign Ministry statement published on Aug 14. The 11-day \"Ulchi Freedom Shield\" exercises, beginning Aug 17, will involve 18,000 South Korean troops and part of the 28,500-strong US contingent. Pyongyang, which calls the drills a rehearsal for invasion, earlier fired a ballistic missile over the Sea of Japan. \"It is our consistent principle... to respond to a new level of a threat with a new level of a deterrent,\" a spokesperson said, adding the North would not tolerate the \"confrontational situation\". A spokesman said the drills prepare troops to face North Korean forces battle-hardened from deployment alongside Russia in Ukraine.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/North%20Korea%20warns%20of%20new%20'deterrent'%20ahead%20of%20US-South%20Korea%20drills.pdf"}, {"id": "st-11", "title": "Romania shuts down nuclear plant as Danube water level drops", "source": "ST", "date": "14 Aug 2026", "tags": ["Energy", "Environment"], "summary": "Romania halted its only nuclear plant on Aug 13, a rare shutdown caused by a drought that dropped the Danube, whose waters cool the plant, to record lows. The Cernavoda plant, which usually generates a fifth of national electricity, had one of its two reactors shut in July; operator Nuclearelectrica closed the second, seeing no restart within 10 days. Romania budgeted over €2 million to divert the river's flow, including sinking barges filled with rocks. Wind power and imports are expected to cover supply, though industrial restrictions may follow, and carmakers Dacia and Ford paused production. Nearly two-thirds of the Danube saw record-low July flows in 34 years, per Copernicus. Neighbouring Hungary is trying to keep its Paks plant running.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/Romania%20shuts%20down%20nuclear%20plant%20as%20Danube%20water%20level%20drops.pdf"}, {"id": "st-12", "title": "Singtel's Q1 profit falls 72% on absence of exceptional gains", "source": "ST", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Singtel reported a 71.6 per cent drop in first-quarter net profit to $818 million from $2.88 billion, reflecting the absence of prior-year exceptional gains from an Airtel stake sale and the Intouch-Gulf Energy merger. Underlying net profit rose 21 per cent to $831 million, driven by Airtel, AIS, NCS, Optus and Digital InfraCo. Operating revenue and Ebitda grew 4.9 and 8.7 per cent. Singtel Singapore's revenue fell 3.1 per cent to $901 million amid \"continued intense price competition\", with mobile revenue down 4 per cent. Regional associate contributions rose 16.1 per cent to $543 million. Digital InfraCo revenue jumped 18.9 per cent on data-centre arm Nxera, which management may dual-list. Shares closed at $4.25, down nearly 1 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/Singtel's%20Q1%20profit%20falls%2072%20on%20absence%20of%20exceptional%20gains.pdf"}, {"id": "st-13", "title": "South Korea unveils package to boost housing supply, support young buyers", "source": "ST", "date": "14 Aug 2026", "tags": ["Politics", "Finance & Markets"], "summary": "South Korea said on Aug 13 it would raise financial support for construction and ease regulations for young homebuyers to stabilise a red-hot housing market, after earlier proposing higher taxes on wealthy homeowners. President Lee Jae Myung, whose approval has fallen on rising prices, warned the \"real estate bubble has reached a level that can no longer be left unchecked\", citing the risk of \"lost decades\". The Financial Services Commission said it would lift policy support for construction financing to at least 47.8 trillion won ($43.22 billion) from 26.3 trillion won, and add loans for young people and newlyweds while tightening speculative-demand curbs. It will manage debt growth at around 3 per cent. Lee's approval hit a one-month low of 51 per cent in late July.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/South%20Korea%20unveils%20package%20to%20boost%20housing%20supply,%20support%20young%20buyers.pdf"}, {"id": "st-14", "title": "South Korea's SK Shipping, H-Line swop tankers to create LNG giant", "source": "ST", "date": "14 Aug 2026", "tags": ["Energy", "Finance & Markets"], "summary": "South Korean shipping firms SK Shipping and H-Line Shipping, both owned by private equity firm Hahn & Co, will swop tankers and contracts to create one of the world's largest LNG carrier operators. SK Shipping will receive 16 LNG vessels and their long-term contracts from H-Line in exchange for 12 tankers, their contracts and about US$300 million ($384 million) in cash, Hahn & Co said on Aug 13. The deal makes SK Shipping the world's third-largest and Asia's biggest LNG carrier operator, while H-Line becomes a leading regional tanker and bulk-shipping company. The swop comes as months of Persian Gulf conflict upend energy trade and create opportunities for shipowners. Hahn & Co created H-Line in 2014 and bought most of SK Shipping in 2018.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/South%20Korea's%20SK%20Shipping,%20H-Line%20swop%20tankers%20to%20create%20LNG%20giant.pdf"}, {"id": "st-15", "title": "Taiwan military drills clear streets, slow internet in Taipei", "source": "ST", "date": "14 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Air raid sirens rang out and streets emptied in Taipei on Aug 13 during annual drills that included the government deliberately slowing mobile internet to simulate a Chinese attack. Taiwan is nearing the end of its 10-day Han Kuang war games, combining military exercises with civil defence. The 30-minute internet \"throttling\" exercise, first held Aug 10 in central Taiwan, slowed mobile speeds dramatically while leaving fixed-line and Wi-Fi untouched. President Lai Ching-te visited an emergency ward and supermarket accompanied by senior foreign diplomats, including the de facto US, Israeli and Canadian envoys. On Aug 12, Taiwan's armed forces held their first anti-blockade drill, using the navy and coast guard to escort a simulated merchant ship, amid fears Beijing could try to choke off the island.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/Taiwan%20military%20drills%20clear%20streets,%20slow%20internet%20in%20Taipei.pdf"}, {"id": "st-16", "title": "Taiwan throttles mobile internet speeds in defence drill", "source": "ST", "date": "14 Aug 2026", "tags": ["Defence", "Technology & AI"], "summary": "In this first-person account, ST correspondent Yip Wai Yee describes Taiwan's debut mobile-internet throttling exercise during the annual Han Kuang war games. For 30 minutes on Aug 13 in Taipei and northern Taiwan, public 4G and 5G download speeds plunged to 1 per cent of normal capacity, halting streaming and gaming, though calls and SMS worked. The drill tested public readiness for an information blockade, but many residents appeared unfazed, waiting it out in underground malls. Taiwan relies on 14 submarine cables vulnerable to sabotage; in 2023 its Matsu islands were cut off for weeks after cables were severed. Taiwan faced 2.63 million daily intrusion attempts in 2025. The author calls the flawed drill a step toward a whole-of-society defence model.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/Taiwan%20throttles%20mobile%20internet%20speeds%20in%20defence%20drill.pdf"}, {"id": "st-17", "title": "The China discount now carries a premium", "source": "ST", "date": "14 Aug 2026", "tags": ["Trade", "Southeast Asia"], "summary": "This commentary by NUS professor Ramkishen Rajan argues Chinese goods remain competitive despite geopolitical tension, with China's exports up 23.9 per cent in July and high-tech exports up 40.7 per cent. The longstanding \"China discount\" persists because of China's unbalanced growth model and an undervalued renminbi, a surge Fed researchers call China Shock 2.0. Singapore has a stake, as Chinese inputs helped its manufacturing grow 12.5 per cent in Q2. Intermediate inputs make up 60 per cent of ASEAN's imports from China. But firms serving markets under different technology rules face compliance costs from US and Chinese export controls, a \"geoeconomic premium\". The author urges preserving supplier choice while helping firms navigate fragmented rules, noting MAS tightened policy twice and Singapore offered SME support.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/The%20China%20discount%20now%20carries%20a%20premium.pdf"}, {"id": "st-18", "title": "Trump announces tariffs of up to 100% on imported drones", "source": "ST", "date": "14 Aug 2026", "tags": ["Trade", "Defence"], "summary": "US President Donald Trump announced on Aug 13 tariffs of up to 100 per cent on imports of unmanned drones and their components, aiming to cut US reliance on an industry dominated by China. Justified on national security grounds, the White House detailed a 100 per cent duty on certain unmanned aircraft systems, including those over 25kg with capabilities such as thermal imagers and docking stations, while smaller drones face a 25 per cent tariff. The measures, mostly effective Sept 3, are meant to encourage domestic production. Chinese firm DJI has captured more than two-thirds of the global drone market. Last week China restricted drone exports to the US and blacklisted six companies, days after Washington imposed fresh tariffs on China and 59 countries.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/Trump%20announces%20tariffs%20of%20up%20to%20100%20on%20imported%20drones.pdf"}, {"id": "st-19", "title": "Twitch sparks gamers' wrath with Amazon AI sharing deal", "source": "ST", "date": "14 Aug 2026", "tags": ["Technology & AI", "Society"], "summary": "Live-stream gaming platform Twitch has angered millions of users by declaring it will share their data with parent company Amazon to train the retailer's AI models. In a post on X, Twitch said users could opt out, but otherwise live audio, text, images and other channel content would be used for AI training across Amazon's platforms. Chief product officer Mike Minton said on Aug 12: \"if it was opt-in, nobody would opt in,\" adding it would be on by default. Gamers slammed the policy as a privacy incursion, with one saying \"opting people in by default is not consent\". The move is the latest front in the fight over online privacy as AI firms seek data. In 2025 Meta said public comments on its platforms would train its AI unless users opted out.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/Twitch%20sparks%20gamers'%20wrath%20with%20Amazon%20AI%20sharing%20deal.pdf"}, {"id": "st-20", "title": "US court rules Trump can end tariff exemption for small parcels", "source": "ST", "date": "14 Aug 2026", "tags": ["Trade", "Politics"], "summary": "A US trade court ruled on Aug 13 that President Donald Trump could halt the \"de minimis\" tariff exemption for small packages, rejecting a legal challenge. Trump had acted last year to end the exemption for parcels valued at US$800 ($1,024.64) or less, citing use of low-value shipments to dodge tariffs and smuggle drugs. The change had worried small businesses with less buffer than larger platforms such as Shein and Temu, both hit when Washington earlier closed the exception for Chinese products. The Court of International Trade ruled the rescission was allowed. Trump touted the \"big win\", calling the provision a \"giant loophole for tariff cheats\". His tariff agenda has faced legal pushbacks, including a February Supreme Court ruling against his global tariffs.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/US%20court%20rules%20Trump%20can%20end%20tariff%20exemption%20for%20small%20parcels.pdf"}, {"id": "st-21", "title": "US eyes indefinite Iran naval blockade as oil supply shortfall deepens", "source": "ST", "date": "14 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "The US on Aug 13 threatened to maintain a naval blockade of Iran indefinitely as ceasefire talks floundered and global oil supply dropped. Defence Secretary Pete Hegseth said the Navy could sustain it by rotating ships. With a tentative June deal in tatters, Iran has sought to control the Strait of Hormuz and attacked vessels, including two Abu Dhabi National Oil Company ships on Aug 13. Shipping through the strait fell to eight vessels on Aug 11, versus 130-140 before the war. Iran said the strait remains blocked until sanctions are lifted. The IEA forecast global oil supply falling 4.3 million barrels per day, or about 4 per cent, in 2026. Oil settled down over 2 per cent, though a reported Houthi drone strike on a Saudi Aramco refinery unsettled markets.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/US%20eyes%20indefinite%20Iran%20naval%20blockade%20as%20oil%20supply%20shortfall%20deepens.pdf"}, {"id": "st-22", "title": "US flags dozens of trade partners as risks for aiding tariff evasion", "source": "ST", "date": "14 Aug 2026", "tags": ["Trade", "Geopolitics"], "summary": "The Trump administration on Aug 13 flagged dozens of US trading partners as potential risks for aiding Chinese tariff evasion, vowing to use artificial intelligence to detect illegal practices. Those named include the European Union, Taiwan, Mexico, Canada, India, Japan, South Korea and Vietnam. The White House report targets \"illegal transshipment\", where goods are routed through third countries facing lower US tariffs. Trade adviser Peter Navarro said \"the great transshipment scam\" has let China launder exports through more than 40 countries. The report cited over 40 nations with elevated risk, grouping them by embedded trade flows, China-linked supply chains, or preferential US access. Navarro said the White House is building an AI-enabled \"detective border\" with Customs and Border Protection to assess shipments.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/US%20flags%20dozens%20of%20trade%20partners%20as%20risks%20for%20aiding%20tariff%20evasion.pdf"}, {"id": "st-23", "title": "US semiconductor equipment firm Lam Research to add 200 jobs in Singapore amid AI boom", "source": "ST", "date": "14 Aug 2026", "tags": ["Technology & AI", "Southeast Asia"], "summary": "US chip-equipment maker Lam Research will hire about 200 new employees in Singapore for roles focused on advanced technologies used in making AI chips. The Fremont, California-based firm, which runs a services hub here, said nearly 90 per cent of the positions will be specialised engineering and technical roles, mostly for local hires. \"The demand for deep engineering talent has never been greater,\" said South-east Asia general manager Andrew Goh. New roles cover high-bandwidth memory, 2.5D and 3D integration, silicon photonics and co-packaged optics. Singapore accounts for one in 10 chips and a fifth of global semiconductor equipment, with the industry near 6 per cent of GDP and over 35,000 jobs. Lam joins Micron, Applied Materials and UMC in expanding local footprints amid AI-driven demand.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/US%20semiconductor%20equipment%20firm%20Lam%20Research%20to%20add%20200%20jobs%20in%20Singapore%20amid%20AI%20boom.pdf"}, {"id": "st-24", "title": "Ukraine offers Russia truce in Black Sea as food supply fears mount, source says", "source": "ST", "date": "14 Aug 2026", "tags": ["Geopolitics", "Trade"], "summary": "Ukraine has sent Russia an offer to halt attacks on civilian targets in the Black Sea after mounting strikes on vessels and ports raised fears over global food supplies, a source told Reuters. The offer was transmitted via a third party, with Kyiv awaiting a response. Both major agricultural exporters have accused each other of intensified attacks. Kyiv turned to alternative routes after shipowners halted stops at Odesa ports in late July, while Russia suspended operations at all three Novorossiysk terminals on Aug 12-13 after a Ukrainian attack. Deputy Russian Foreign Minister Alexander Grushko said Moscow had received no formal proposal. Turkey urged a moratorium on Aug 9. The de facto blockade has sent Ukrainian grain exports tumbling 76 per cent year on year so far in August.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/Ukraine%20offers%20Russia%20truce%20in%20Black%20Sea%20as%20food%20supply%20fears%20mount,%20source%20says.pdf"}, {"id": "st-25", "title": "Yemen at highest risk of major conflict since 2022 truce, UN warns", "source": "ST", "date": "14 Aug 2026", "tags": ["Geopolitics", "Society"], "summary": "Yemen faces its most serious threat of a return to large-scale war since a UN-brokered 2022 truce, UN envoy Hans Grundberg warned on Aug 13, as the world body said more than half the population faced acute food insecurity. Fighting has escalated between the Iran-aligned Houthis and the Saudi-backed government, with Houthi attacks in Marib, Hadramawt and Mocha causing casualties. Grundberg said renewed Houthi attacks on Red Sea and Gulf of Aden shipping risk drawing Yemen into wider regional confrontation amid the Strait of Hormuz crisis. UN aid chief Tom Fletcher said 6 million people neared famine. Both called for the release of 73 detained UN personnel. The Houthis declared a naval blockade on Saudi Arabia on July 20, drawing coalition air strikes on Hodeidah.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20ST/Yemen%20at%20highest%20risk%20of%20major%20conflict%20since%202022%20truce,%20UN%20warns.pdf"}, {"id": "bt-01", "title": "AMD looks to raise US$4 billion to US$5 billion in debt offering: source", "source": "BT", "date": "14 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Advanced Micro Devices on Aug 13 launched a four-part debt offering that could raise US$4 billion to US$5 billion, according to a source and terms reviewed by Reuters, as chipmakers turn to capital markets to fund AI-related investments. The senior unsecured notes are due in 2029, 2031, 2033 and 2036, with initial pricing discussions ranging from about 70 basis points over US Treasuries for the three-year tranche to 115 basis points for the 10-year. Proceeds are earmarked for general corporate purposes, possibly debt repayment. Bank of America, JPMorgan, Barclays and Wells Fargo are leading the sale, expected to settle Aug 17. Earlier in the week, Intel raised US$20 billion in an upsized stock offering.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/AMD%20looks%20to%20raise%20US4%20billion%20to%20US5%20billion%20in%20debt%20offering%20source.pdf"}, {"id": "bt-02", "title": "Australia housing prices drop slows economy", "source": "BT", "date": "14 Aug 2026", "tags": ["Finance & Markets"], "summary": "A fall in Australian home prices is tightening financial conditions and helping cool the economy, Reserve Bank of Australia assistant governor Chris Kent said in Sydney on Aug 13. He attributed the drop to interest rate hikes, a reaction to rapid prior-year growth and May budget changes to housing tax breaks, alongside higher living costs and heavy household debt. Values fell 0.7 per cent nationwide in July from June, led by a 1.4 per cent decline in Sydney, the steepest fall since December 2022, Cotality data showed. The RBA has hiked three times this year before pausing. Kent said inflation risks remain \"very much to the upside,\" citing the Strait of Hormuz's reopening as a key uncertainty.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Australia%20housing%20prices%20drop%20slows%20economy.pdf"}, {"id": "bt-03", "title": "CapitaLand Investment to restructure portfolio, recycle up to S$9 billion", "source": "BT", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "CapitaLand Investment is restructuring its portfolio, earmarking up to S$9 billion of non-core and legacy assets for capital recycling as it focuses on listed and private funds and lightens its balance sheet, group CEO Lee Chee Koon said on Aug 13. CFO Paul Tham said the S$7 billion to S$9 billion targeted comprises mostly balance-sheet and legacy fund investments, largely from China, with some in Singapore, India and Europe. CLI will pare \"excess holdings\" in bigger Reits including CICT and Clar toward a 15 per cent sponsor stake. For H1, net profit rose 14 per cent to S$327 million, though revenue fell 2 per cent to S$1.02 billion. Shares closed 0.7 per cent higher at S$2.75.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/CapitaLand%20Investment%20to%20restructure%20portfolio,%20recycle%20up%20to%20S9%20billion.pdf"}, {"id": "bt-04", "title": "ChatGPT maker OpenAI's revenue run rate tops US$40 billion ahead of IPO", "source": "BT", "date": "14 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "OpenAI is on track to generate annualised revenue of more than US$40 billion, roughly double its end-2025 run rate of over US$20 billion, people familiar said, bolstering its Wall Street debut plans. Growth was driven partly by its AI coding software, plus subscriptions, a nascent advertising business and its core consumer arm. OpenAI is battling Claude maker Anthropic, whose run-rate revenue crossed US$47 billion in May, though the firms may measure differently. Both have filed confidential IPO paperwork, with Anthropic expected to list as soon as this fall, ahead of OpenAI. On Aug 13, OpenAI named its second chief revenue officer in under a year. President Greg Brockman said the run rate rose over 20 per cent month-over-month in July.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/ChatGPT%20maker%20OpenAI's%20revenue%20run%20rate%20tops%20US40%20billion%20ahead%20of%20IPO.pdf"}, {"id": "bt-05", "title": "DBS names new heads for Hong Kong, Taiwan and Indonesia markets", "source": "BT", "date": "14 Aug 2026", "tags": ["Finance & Markets"], "summary": "DBS on Aug 13 announced a series of senior leadership appointments across its Hong Kong, Indonesia and Taiwan markets, effective over the coming months. Ng Sier Han, current CEO of DBS Taiwan, becomes CEO of DBS Bank (Hong Kong) from Mar 1, 2027. Lim Chu Chong, president-director of DBS Indonesia, will be CEO of DBS Taiwan from Jan 1, 2027. Adrian Chai, a managing director in DBS's Institutional Banking Group, becomes president-director of DBS Indonesia from Dec 1, 2026. The reshuffle follows Sebastian Paredes, head of North Asia and CEO of DBS Bank (Hong Kong), stepping down from executive duties on Mar 1, 2027 to become a senior adviser. Shares closed 0.9 per cent higher at S$76.50 before the news.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/DBS%20names%20new%20heads%20for%20Hong%20Kong,%20Taiwan%20and%20Indonesia%20markets.pdf"}, {"id": "bt-06", "title": "Fitch keeps United States at 'AA+', cites economic resilience amid fiscal risks", "source": "BT", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "Fitch on Aug 13 affirmed the US sovereign credit rating at \"AA+\" with a stable outlook, citing the large economy, high per-capita income and the dollar's reserve-currency status. The agency said the economy stayed resilient despite higher tariffs, spending cuts, tighter border controls and policy uncertainty, but estimated growth slowing to 1.9 per cent in 2026-2027 from 2.8 per cent in 2025, with weakening labour demand. Inflation is expected to average 3.4 per cent in 2026, above the Fed's 2 per cent target. Fitch sees the general government deficit widening to 7.4 per cent of GDP, the highest among \"AA\"-rated peers. S&P also kept its \"AA+\" rating in June; Fitch downgraded the US from triple-A in 2023, and Moody's cut its last triple-A last year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Fitch%20keeps%20United%20States%20at%20'AA',%20cites%20economic%20resilience%20amid%20fiscal%20risks.pdf"}, {"id": "bt-07", "title": "Frencken H1 net profit falls 3.4% to S$19.3 million", "source": "BT", "date": "14 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Tech solutions provider Frencken Group on Aug 13 reported a 3.4 per cent decline in H1 net profit to S$19.3 million, from S$19.9 million a year earlier, as administrative and general expenses rose 9.9 per cent to S$32.6 million and income tax expenses grew 12.4 per cent. Revenue dipped 0.8 per cent to S$427.8 million. Mechatronics revenue eased 1.5 per cent to S$383.4 million, with semiconductor down 1.1 per cent and analytical life-sciences off 13.7 per cent, partially offset by gains in medical and industrial automation. EPS was S$0.045. Frencken expects higher H2 revenue and full-year revenue and net profit above FY2025, and envisages crossing the S$1 billion annual revenue mark by 2028. Shares closed 4.1 per cent higher at S$2.79.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Frencken%20H1%20net%20profit%20falls%203.4%20to%20S19.3%20million.pdf"}, {"id": "bt-08", "title": "Gold declines as sliding US inflation reinforces Fed hold bets", "source": "BT", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Energy"], "summary": "Gold was little changed after retreating below US$4,400 an ounce, as traders weighed the Fed's rate path and prospects for a deal to reopen the Strait of Hormuz, but remained on track for a second weekly gain. A subdued US July inflation print suggested energy-price shocks from the Iran war faded, easing pressure on the Fed; money markets price a roughly one-in-three chance of a September hike. Investors await employment data and chairman Kevin Warsh's Jackson Hole remarks. Gold's recovery above US$4,000 reflected renewed investor appetite and central bank buying, notably from China. OCBC strategist Christopher Wong called the macro setup \"more constructive\" but flagged consolidation risks. Spot gold edged up 0.2 per cent to US$4,359.73; silver was flat at US$64.55.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Gold%20declines%20as%20sliding%20US%20inflation%20reinforces%20Fed%20hold%20bets.pdf"}, {"id": "bt-09", "title": "Google unveils Gemini 3.7 Flash AI model for coding and agent workflows, but top AI model still delayed", "source": "BT", "date": "14 Aug 2026", "tags": ["Technology & AI"], "summary": "Alphabet's Google released another Gemini Flash installment on Aug 13 but did not say when it would ship its most powerful model, Gemini 3.5 Pro, which has been hampered by delays. The new Gemini 3.7 Flash outperforms its predecessor on coding tasks like debugging, generates more production-ready code on the first try, completes app production in fewer prompts and lowers token prices, Google said. Its Gemini Spark productivity agent will run on 3.7 Flash. The company added stronger safety features blocking malicious hacking and CBRN misuse. Google has struggled to keep pace with OpenAI and Anthropic, and delays to Gemini 3.5 Pro have raised questions about its roadmap. CEO Sundar Pichai said Google aims to ship faster and is training its upcoming Gemini 4 model.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Google%20unveils%20Gemini%203.7%20Flash,%20top%20AI%20model%20still%20delayed.pdf"}, {"id": "bt-10", "title": "Greenback steadies after benign US inflation curbs Fed rate hike bets", "source": "BT", "date": "14 Aug 2026", "tags": ["Finance & Markets"], "summary": "The US dollar drifted on Aug 13 after a benign US consumer inflation reading led traders to pare bets on a September Fed rate hike, though the currency was still up 0.4 per cent on the week, heading for its first weekly gain in three. July CPI rose 0.1 per cent, in line with forecasts, cutting September hike odds to 40 per cent from 54 per cent a week earlier per CME FedWatch. Attention turns to producer prices and the Aug 26 core PCE. Under chair Kevin Warsh, analysts expect a broader inflation approach. The dollar eased to around 159.3 yen, about 2.7 per cent below late July's 40-year highs that sparked joint US-Japan intervention. The euro firmed to US$1.1537; sterling steadied at US$1.349 after surprise UK GDP growth.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Greenback%20steadies%20after%20benign%20US%20inflation%20curbs%20Fed%20rate%20hike%20bets.pdf"}, {"id": "bt-11", "title": "Houthis hit Aramco Jazan refinery for second time in a week", "source": "BT", "date": "14 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "Yemen's Houthis said they targeted Saudi Aramco's oil refinery in Jazan on the Red Sea coast, the second attack on the facility in less than a week. The group's forces fired two drones and hit the refinery, Houthi-controlled Saba news agency reported, citing a military source; a person familiar said the strike caused negligible damage to a tank. Saudi Arabia and Aramco did not immediately comment. The Houthis said the attack responded to the kingdom's alleged violation of Yemeni airspace and sovereignty in Sa'dah and Hajjah. On Sunday Aug 9, the group hit the refinery and set it ablaze before authorities extinguished it, with no injuries. In July, the Houthis threatened to blockade Saudi oil flows in response to a Saudi blockade of Yemeni territory.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Houthis%20hit%20Aramco%20Jazan%20refinery%20for%20second%20time%20in%20a%20week.pdf"}, {"id": "bt-12", "title": "JD.com expects second-half electronics sales to improve after quarterly revenue falls", "source": "BT", "date": "14 Aug 2026", "tags": ["Technology & AI", "Trade"], "summary": "JD.com, a major Chinese consumer-electronics platform, expects home-appliance sales to improve in the second half after reporting its first quarterly revenue decline in more than a decade. CEO Sandy Xu said electronics and home appliances suffered from a high year-earlier base and rising raw-material costs, but momentum picked up in June and growth should improve \"meaningfully.\" Total revenue fell 2.9 per cent to 346.4 billion yuan (US$51.37 billion) in the quarter ended June, beating estimates helped by a longer 618 shopping festival. US-listed shares fell 3.5 per cent. The decline underscores the challenge of reviving spending amid weak confidence tied to China's property downturn. Net profit was 7.1 billion yuan versus 6.2 billion a year earlier; non-GAAP net profit rose 20 per cent to 8.9 billion yuan.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/JD.com%20expects%20second-half%20electronics%20sales%20to%20improve%20after%20quarterly%20revenue%20falls.pdf"}, {"id": "bt-13", "title": "Japan's wholesale inflation remains high, bolstering odds of September BOJ hike", "source": "BT", "date": "14 Aug 2026", "tags": ["Finance & Markets"], "summary": "Japan's annual wholesale inflation stayed elevated in July, reinforcing market expectations of a September rate hike, data showed on Aug 13. The producer price index rose 7.2 per cent, slower than the 7.4 per cent forecast but near June's 7.3 per cent, and edged up 0.1 per cent month-on-month. Strong AI-driven demand, elevated global metal prices and Middle East conflict costs drove broad gains; non-ferrous metals surged 40.6 per cent and yen-based import prices rose 29.1 per cent. The BOJ kept policy steady in July but warned underlying inflation could exceed its target. Tokyo core inflation hit 1.9 per cent. Analysts forecast a move to 1.25 per cent from 1 per cent at the Sep 17-18 meeting, with a recent joint Japan-US yen intervention all but locking in the hike.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Japan's%20wholesale%20inflation%20remains%20high,%20bolstering%20odds%20of%20September%20BOJ%20hike.pdf"}, {"id": "bt-14", "title": "Likely that 2026 will be the hottest year on record, experts say", "source": "BT", "date": "14 Aug 2026", "tags": ["Environment", "Society"], "summary": "An unusually powerful El Nino is raising the odds that 2026 will surpass 2024 as the world's hottest year on record, with 2027 also expected to set a new high, according to a Berkeley Earth analysis. Chief scientist Robert Rohde said conditions could resemble weather \"a decade or more away.\" Projections suggest sea-surface temperatures rising 4 deg C above normal in the Eastern tropical Pacific, versus 2.75 deg C in 2015-2016. The El Nino, which began in June, has lifted the odds of 2026 becoming the hottest year from 12 per cent in July to 69 per cent in August. Last month brought heat waves and wildfires in France and Spain and a US heat dome. Scientist Zeke Hausfather called El Nino \"a giant hammer.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Likely%20that%202026%20will%20be%20the%20hottest%20year%20on%20record,%20experts%20say.pdf"}, {"id": "bt-15", "title": "MSCI drops S-E Asian heavyweights Sembcorp, GoTo and Ayala Land from global benchmarks", "source": "BT", "date": "14 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "South-east Asia had no additions to MSCI's Global Standard Indexes in its latest quarterly review, while four regional stocks were removed: Singapore's Sembcorp Industries, the Philippines' Ayala Land, and Indonesia's GoTo and Charoen Pokphand Indonesia. The changes take effect after Aug 31. Sembcorp is valued at about US$7.8 billion, Ayala Land US$3.6 billion, and GoTo has fallen to about US$3 billion from a US$29 billion peak in 2022, dropped on liquidity concerns. Indonesia keeps its Emerging Market status. Three of the four move to small-cap indexes; GoTo does not. Across Asia-Pacific, 45 stocks joined and 55 left, with Taiwan's Nanya Technology the largest addition at US$39 billion. Sembcorp's removal reshapes the MSCI Singapore Index top 10.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/MSCI%20drops%20S-E%20Asian%20heavyweights%20Sembcorp,%20GoTo%20and%20Ayala%20Land%20from%20global%20benchmarks.pdf"}, {"id": "bt-16", "title": "Maersk's Q2 profit smashes forecasts amid global trade turbulence, raises 2026 outlook again", "source": "BT", "date": "14 Aug 2026", "tags": ["Trade", "Finance & Markets"], "summary": "Danish shipping group Maersk on Aug 13 beat profit forecasts and raised full-year earnings guidance for a second time in 2026, as the Middle East conflict and strong demand pushed freight rates higher. April-June Ebitda hit US$3 billion, above a US$2.12 billion median forecast and up from US$2.3 billion a year ago. The world's second-largest container shipper now expects underlying Ebitda of US$10.5 billion to US$12.5 billion, up from US$8 billion to US$10 billion. Turbulence including the US-Iran war, which disrupted Strait of Hormuz traffic, and Red Sea Houthi attacks has lifted rates. Some analysts warn the freight strength is a short-term tailwind, and that normalising Red Sea traffic would pressure rates. Maersk and Hapag-Lloyd have begun resuming some Suez Canal services.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Maersk's%20Q2%20profit%20smashes%20forecasts%20amid%20global%20trade%20turbulence,%20raises%202026%20outlook%20again.pdf"}, {"id": "bt-17", "title": "Oil settles down 2% on weak demand outlook, hefty US crude build", "source": "BT", "date": "14 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "Oil settled down more than 2 per cent on Aug 13, reversing a week of gains as investors focused on weaker global demand and a sharp US crude build. Brent finished US$1.91 lower at US$87.07, while WTI closed down US$2.02 at US$81.25, paring steeper losses after reports Houthis targeted Saudi Aramco's Jazan refinery. US crude inventories rose 17.4 million barrels to 424.4 million, the biggest weekly gain since January 2023. Opec cut its 2026 world demand growth forecast to 580,000 bpd, and the IEA expects a 1.6 million bpd contraction. The US and Iran made competing claims over the Strait of Hormuz, with Trump asserting \"total control\" and Iran calling it under its \"control and management.\" Russia's product exports also fell after Ukrainian drone strikes.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Oil%20settles%20down%202%20on%20weak%20demand%20outlook,%20hefty%20US%20crude%20build.pdf"}, {"id": "bt-18", "title": "Race to regain AI model supremacy: Why Google shifted power in its top ranks", "source": "BT", "date": "14 Aug 2026", "tags": ["Technology & AI"], "summary": "Google co-founder Sergey Brin has urged key AI staff to go all in on Gemini as Alphabet seeks to close the gap with rivals, sources told Reuters. After Anthropic previewed its powerful Claude Mythos model, Brin pressed Google DeepMind to move faster. By August, Google had delayed Gemini's new flagship by two months as internal tests showed it lagging on coding. On Aug 5, Google overhauled DeepMind's leadership: chief Demis Hassabis became chair while deputy Koray Kavukcuoglu took charge, and Gemini's original technical co-leads Jeff Dean and Oriol Vinyals quit to found a startup, Discovery Loop. The news sent Google's stock down 4 per cent. Sources cite constrained computing, bureaucracy and disagreements among project leaders as reasons Google keeps falling behind despite Gemini 3's November 2025 catch-up.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Race%20to%20regain%20AI%20model%20supremacy%20Why%20Google%20shifted%20power%20in%20its%20top%20ranks.pdf"}, {"id": "bt-19", "title": "ST Engineering H1 net profit rises 27.1% to S$512.1 million on strong segment growth", "source": "BT", "date": "14 Aug 2026", "tags": ["Defence", "Finance & Markets"], "summary": "ST Engineering on Aug 13 posted a 27.1 per cent rise in H1 net profit to S$512.1 million, from S$402.8 million, driven by underlying performance and cost savings across all three business segments. CEO Vincent Chong called it \"the strongest first-half results\" on record. Revenue rose 11.1 per cent to S$6.57 billion, up 14 per cent on a rebased basis. Unit opex margin fell to 9.1 per cent, aided by AI-enabled efficiency, with procurement and productivity savings exceeding S$150 million. EPS was S$0.1643; an interim dividend of S$0.05 was declared, up from S$0.04. The order book stood at S$35.7 billion, with an US$11 billion international defence pipeline on track. Counter-drone demand is rising from Middle East and Ukraine fighting. Shares closed 0.78 per cent higher at S$10.28.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/ST%20Engineering%20H1%20net%20profit%20rises%2027.1%20to%20S512.1%20million%20on%20strong%20segment%20growth.pdf"}, {"id": "bt-20", "title": "Sembcorp raises interim dividend despite 72% H1 profit slide to S$150 million on Alinta deal costs", "source": "BT", "date": "14 Aug 2026", "tags": ["Energy", "Finance & Markets"], "summary": "Sembcorp Industries' H1 earnings fell 72 per cent to S$150 million, hit by S$155 million in Alinta acquisition costs, an S$57 million forex loss and lower contributions from gas, renewables and urban solutions. EPS dropped to 8.43 cents from 30.13 cents. Turnover rose 28 per cent to S$3.8 billion on higher Singapore energy prices and Alinta's June inclusion. Excluding exceptionals, underlying net profit fell 25 per cent to S$369 million. Renewables profit nearly halved to S$69 million on weaker wind and solar and China curtailment. Despite the slide, Sembcorp raised its interim dividend 22 per cent to S$0.11. CEO Wong Kim Yin cited a \"tsunami of AI and data centre demand.\" Shares fell 2.3 per cent to S$5.59; MSCI also dropped it from its Singapore index.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/14%20Aug%202026/14%20Aug%20BT/Sembcorp%20raises%20interim%20dividend%20despite%2072%20H1%20profit%20slide%20to%20S150%20million%20on%20Alinta%20deal%20costs.pdf"}, {"id": "bt-21", "title": "UAE says Iran attacked two ADNOC vessels in Strait of Hormuz; no injuries", "source": "BT", "date": "14 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "Abu Dhabi National Oil Company said two of its vessels were attacked while transiting the Strait of Hormuz on the evening of Aug 13, with no injuries, as the UAE accused Iran of carrying out the attack. It was the second such incident involving ADNOC vessels in under a week, after the UAE condemned a Saturday attack on a company-linked vessel. ADNOC said the situation was under control. The UAE For
