0 per cent in its debut. The gauge trades at a lofty 57 times forward earnings versus 14 for the CSI 300, drawing state-fund support.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/Move%20over,%20CSI%20300%20Why%20the%20Star%2050%20is%20the%20index%20that%20matters%20amid%20China's%20AI%20boom.pdf"},{"id":"bt-12","title":"North Korea appears to show interest in Trump's overtures for talks, Seoul says","source":"BT","date":"21 Aug 2026","tags":["Geopolitics","Defence"],"summary":"South Korea assesses that North Korea has between 80 and 120 nuclear warheads and believes Pyongyang is interested in US President Donald Trump's overtures for dialogue, South Korea's Defence Minister Ahn Gyu Back said on Thursday. Ahn declined to answer parliamentary questions on whether Seoul was aware of any behind-the-scenes discussions between Pyongyang and Washington for a possible meeting. He also noted that Trump's comment that North Korea had built 57 nuclear weapons differs from South Korea's own assessment of between 80 and 120 warheads, highlighting a gap in intelligence estimates between the allies over the scale of Pyongyang's arsenal.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/North%20Korea%20appears%20to%20show%20interest%20in%20Trump's%20overtures%20for%20talks,%20Seoul%20says.pdf"},{"id":"bt-13","title":"Nvidia denies report it is rolling out China AI chip by year-end","source":"BT","date":"21 Aug 2026","tags":["Technology & AI","Geopolitics"],"summary":"Nvidia denied a report by The Information that it plans to begin shipping a language processing unit (LPU) tailored for Chinese customers by year-end, saying it has no China-specific version on its roadmap. \"The reporting... is incorrect. We have no LPU sales in the China market today, and no China-specific LPU product in our roadmap,\" a spokesperson said. The Information, citing two employees, had reported small-batch shipments by year-end with orders already placed, describing an LPU using Groq-licensed technology that works alongside GPUs to speed AI chatbot responses. Washington in May approved H200 sales to Alibaba, Tencent and ByteDance. CEO Jensen Huang said in May that Nvidia had \"largely conceded\" China's AI chip market to Huawei, its main domestic rival.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/Nvidia%20denies%20report%20it%20is%20rolling%20out%20China%20AI%20chip%20by%20year-end.pdf"},{"id":"bt-14","title":"Oil settles up more than 2% after Trump threatens countries supporting Iran","source":"BT","date":"21 Aug 2026","tags":["Energy","Geopolitics"],"summary":"Oil prices jumped more than 2 per cent on Thursday to settle at the highest in nearly a month after Trump warned of retaliation against nations supporting Iran. Brent settled up US$2.16, or 2.4 per cent, at US$93.78 a barrel; WTI gained US$2 to US$87.83, both the highest since Jul 24. Trump threatened \"economic warfare and isolation on an unprecedented scale\" against Teheran, warning against any \"lifeline\" to Iran; Bessent will detail measures Monday. The Iran war, which began Feb 28 with US-Israeli strikes, has stranded oil via Teheran's Strait of Hormuz blockade. Analysts said the threats are unlikely to sway Iran absent major concessions. The UAE suspended all financial ties with Iran, and Trump's stance could strain US-China relations, given China is Iran's biggest oil buyer.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/Oil%20settles%20up%20more%20than%202%20after%20Trump%20threatens%20countries%20supporting%20Iran.pdf"},{"id":"bt-15","title":"Ping An's profit rises as stock market rally boosts returns","source":"BT","date":"21 Aug 2026","tags":["Finance & Markets"],"summary":"Ping An Insurance (Group)'s profit rose 36 per cent in the first half as China's stock-market rally bolstered investment returns. Net income climbed to 92.6 billion yuan (US$13.8 billion) in the six months ended June 30. Operating profit, which strips out short-term volatility, rose 8.3 per cent. China's CSI 300 gained 8 per cent in the first half as AI-related stocks surged, lifting insurers' portfolios. Total investment income expanded 42 per cent to 136.9 billion yuan, with net realised and unrealised gains jumping about 20 times to 60.4 billion yuan. Rival China Life flagged net income may jump as much as 235 per cent. Ping An holds a bigger share of equities under OCI accounting, cushioning profit sensitivity. Its Hong Kong shares are down 17 per cent this year.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/Ping%20An's%20profit%20rises%20as%20stock%20market%20rally%20boosts%20returns.pdf"},{"id":"bt-16","title":"Rising bond yields are triggering a tech sell-off, but S-Reits could be the casualty nobody notices","source":"BT","date":"21 Aug 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"While Wall Street's tech tumble grabs headlines amid rising yields and climbing oil, a quieter casualty is unfolding: the yield-linked decline of Singapore-listed Reits. S-Reits have fallen 7.1 per cent this year while the Straits Times Index climbed 22.1 per cent, an astounding 29-percentage-point underperformance. As Treasury yields climb, the spread between Reit payouts and government bonds narrows, driving money to safer assets, while refinancing at higher rates erodes distributions per unit. A healthy S-Reit spread over the 10-year Singapore bond sits at three to four points. Ironically, Singapore's own 10-year yield has barely budged near 2 per cent, and Sora has drifted toward 1.3 per cent, easing funding costs. The derating reflects US Treasury moves and Middle East geopolitics rather than domestic cash-flow stress.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/Rising%20bond%20yields%20are%20triggering%20a%20tech%20sell-off,%20but%20S-Reits%20could%20be%20the%20casualty%20nobod.pdf"},{"id":"bt-17","title":"Robots poised for 'ChatGPT moment': Unitree CEO","source":"BT","date":"21 Aug 2026","tags":["Technology & AI"],"summary":"The industry is edging toward a \"ChatGPT moment\" for robot brains, said Unitree CEO Wang Xingxing, after the Chinese humanoid maker's blockbuster Shanghai listing. Shares fell 11 per cent on Thursday, a day after soaring nearly sixfold in their debut. Wang said robots are nearing a breakthrough enabling them to complete around 80 per cent of tasks in unfamiliar homes via voice or text commands, though a major software leap could take two to 10 years. Unitree is the world's largest robot-dog maker and second-biggest humanoid producer, but says it is \"lagging behind\" in world models. China delivered over 40,000 humanoids in the first half, accounting for 97 per cent of global shipments. The US recently banned imports of Chinese humanoid and quadruped robots on security grounds.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/Robots%20poised%20for%20'ChatGPT%20moment'%20Unitree%20CEO.pdf"},{"id":"bt-18","title":"SCS launches AI skills pathway; IMDA introduces legal sector AI fluency programmes, more tech jobs","source":"BT","date":"21 Aug 2026","tags":["Technology & AI","Society"],"summary":"The Singapore Computer Society launched a cross-industry AI skills pathway aligning learning routes, certifications and workplace experience, announced by president Lim Bee Kwan at the Tech3 Forum. Backed by 15 founding employers, the Skills Pathway for AI has two tracks: an AI Bilingual Pathway for non-tech professionals and an AI Technical Specialist Pathway covering five entry roles including AI platform engineer and AI ethics officer. SCS also unveiled an AI Verify Workshop with NTUC LearningHub and a new AI Ethics and Governance Body of Knowledge for agentic AI. Digital Development Minister Josephine Teo announced IMDA initiatives: nearly 2,000 place-and-train opportunities under an expanded TechSkills Accelerator, plus AI fluency programmes for lawyers with the Singapore Academy of Law and the Singapore Corporate Counsel Association.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/SCS%20launches%20AI%20skills%20pathway%20IMDA%20introduces%20legal%20sector%20AI%20fluency%20programmes,%20more%20te.pdf"},{"id":"bt-19","title":"SK Hynix moves to calm market with US$29 billion share buyback","source":"BT","date":"21 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"SK Hynix unveiled plans to buy back 40 trillion won (US$29 billion) of stock and return more profits, moving to stabilise shares that fell more than 50 per cent in two months. The South Korean memory chipmaker will repurchase up to 24 million shares between Aug 20 and Nov 19 and cancel them, and raised its shareholder-return pledge to more than 50 per cent of cumulative 2025-2027 free cash flow. Shares rose as much as 9 per cent in Seoul. The buyback follows the US$26.5 billion raised in an August US listing, amid investor concern over AI hardware spending. Analysts said it partly aims to appease retail investors upset by dilution from new shares issued for the listing, whose ADRs trade at a 40 per cent premium.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/SK%20Hynix%20moves%20to%20calm%20market%20with%20US29%20billion%20share%20buyback.pdf"},{"id":"bt-20","title":"SK Hynix to pay 60% of bonuses in shares under tentative wage deal with union: report","source":"BT","date":"21 Aug 2026","tags":["Technology & AI","Society"],"summary":"SK Hynix and its labour union reached a tentative wage and collective bargaining agreement featuring a 6.3 per cent salary increase and a significant shift in how performance bonuses are paid, according to Yonhap News. Under the deal, profit-sharing bonuses will be paid 40 per cent in cash and 60 per cent in company shares, replacing the previous all-cash structure. Union officials did not comment and SK Hynix declined to comment. The agreement caps weeks of negotiations as the chipmaker reaps surging demand for high-bandwidth memory used in AI. A sticking point was management's push to shift bonuses toward shares, including restricted stock, which the union initially opposed as undermining a 2025 profit-sharing framework. It awaits member approval.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/SK%20Hynix%20to%20pay%2060%20of%20bonuses%20in%20shares%20under%20tentative%20wage%20deal%20with%20union%20report.pdf"},{"id":"bt-21","title":"Samsung plans up to US$79 billion in shareholder returns","source":"BT","date":"21 Aug 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Samsung Electronics plans to announce on Friday a new shareholder return package worth as much as 110 trillion won (US$79 billion), according to a person familiar with the matter. A board meeting is scheduled around 4pm local time after the Korean market close, with details disclosed shortly afterward. The package is expected to range between 90 trillion won (US$65 billion) and 110 trillion won, making it one of the company's most significant capital return initiatives. Investors are closely watching how Samsung allocates funds between dividends and buybacks, and the programme's time frame. The decision, first reported by Nikkei, is expected to clarify Samsung's capital allocation strategy and cash flow outlook, as investors clamour for greater returns following frenzied global demand for AI semiconductors.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/Samsung%20plans%20up%20to%20US79%20billion%20in%20shareholder%20returns.pdf"},{"id":"bt-22","title":"Singapore's AI boom is lifting GDP. Who gets carried along?","source":"BT","date":"21 Aug 2026","tags":["Southeast Asia","Technology & AI"],"summary":"Singapore is selling the \"picks and shovels\" of the global AI boom, with first-half growth of 6.1 per cent and the full-year forecast raised to 4.5-5.5 per cent. Yet the economy shows clear signs of K-shaped divergence: AI, electronics, finance and large firms climb while domestically oriented sectors expand slowly under tighter margins. Electronic exports surged 88.1 per cent in Q2 versus 8 per cent for non-electronics. Outward-oriented productivity rose 6.9 per cent while domestic sectors fell 0.1 per cent; F&B services contracted 1.5 per cent. An SCCCI survey found 40 per cent of firms pessimistic and 80 per cent expecting higher costs. The government has pledged about S$2 billion in support. The authors warn a widening GDP-GNI gap signals income flowing abroad, urging targeted grants and procurement reform.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/Singapore's%20AI%20boom%20is%20lifting%20GDP.%20Who%20gets%20carried%20along.pdf"},{"id":"bt-23","title":"Singapore, India agree to deepen cooperation in telecommunications, food safety","source":"BT","date":"21 Aug 2026","tags":["Southeast Asia","Trade"],"summary":"Singapore and India agreed to cooperate more closely in telecommunications and broadcasting and to exchange best practices on food safety, via two MOUs and a letter of intent exchanged at the fourth India-Singapore Ministerial Roundtable at Shangri-La Hotel on Thursday. DPM Gan Kim Yong called the talks productive, covering all six ISMR pillars including advanced manufacturing and digitalisation. Skills upgrading of India's workforce was a focus, with Singapore hoping to establish training centres and ITE setting up a Chennai advanced-manufacturing centre. IMDA and India's telecom regulator will deepen cooperation on spectrum management, while the Singapore Food Agency and its Indian counterpart will strengthen food-safety technical cooperation and agri-food trade resilience. The Indian ministers, led by Nirmala Sitharaman, called on PM Lawrence Wong.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/Singapore,%20India%20agree%20to%20deepen%20cooperation%20in%20telecommunications,%20food%20safety.pdf"},{"id":"bt-24","title":"US dollar at three-month low as Treasury moves to soothe bond jitters","source":"BT","date":"21 Aug 2026","tags":["Finance & Markets"],"summary":"The US dollar was pinned near a three-month low on Thursday after the Treasury moved to calm a bond sell-off that pushed long-end yields to their highest since 2007, lifting risk sentiment. The dollar index fell to 98.558, its lowest since May 14, while the euro rose to US$1.1710. ING's Chris Turner said the Treasury's buybacks of 10- to 30-year securities should reassure markets against a disorderly sell-off. The 30-year yield hit a 19-year high of 5.337 per cent earlier this week before easing to 5.22 per cent. Scotiabank's Shaun Osborne said the \"dollar debasement trade is making a comeback\". Attention turns to the Jackson Hole Symposium, the first under new Fed chair Kevin Warsh. The yen pulled away from 160, last at 158.51; sterling hit a six-month high.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/US%20dollar%20at%20three-month%20low%20as%20Treasury%20moves%20to%20soothe%20bond%20jitters.pdf"},{"id":"bt-25","title":"US jobless claims edge lower in sign of steady job market","source":"BT","date":"21 Aug 2026","tags":["Finance & Markets","Society"],"summary":"Applications for US unemployment benefits edged lower last week, staying near historically low levels and suggesting few layoffs across the labour market. Initial claims decreased by 6,000 to 206,000 in the week ended Aug 15, according to Labor Department data, below the 210,000 median forecast in a Bloomberg survey. Continuing claims, a proxy for people receiving benefits, rose to 1.80 million the prior week. The reading follows initial claims dipping to 189,000 in mid-July, the lowest since 1969. US employers have been slow to fire but also slow to hire this year, leaving the market steady for those employed but challenging for job seekers. The four-week moving average rose to 204,000. Unadjusted claims declined, reflecting fewer applications in states including Michigan, South Carolina and California.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/US%20jobless%20claims%20edge%20lower%20in%20sign%20of%20steady%20job%20market.pdf"},{"id":"bt-26","title":"US vows 'toughest sanctions in history' on Iran as Bessent prepares new measures","source":"BT","date":"21 Aug 2026","tags":["Geopolitics","Energy"],"summary":"US Treasury chief Scott Bessent said the US will impose \"the toughest sanctions in history\" on Iran, a move he suggested would reduce the need for major military operations, after Trump threatened Teheran with \"an ECONOMIC D-DAY\". Bessent will detail measures at a Monday press conference and pressed allies to join \"the greatest coordinated economic isolation in the history of the world\". The warnings focus on China, which buys the bulk of Iran's oil. Brent rose a fifth day to about US$94. Beijing said sanctions would not work and urged diplomacy, while Iran called the threats a \"diversion\". The UAE severed economic ties after alleged Iranian missile fire. The war has spurred nearly 80 per cent inflation in Iran.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/US%20vows%20'toughest%20sanctions%20in%20history'%20on%20Iran%20as%20Bessent%20prepares%20new%20measures.pdf"},{"id":"bt-27","title":"Will Lagarde exit the ECB early amid rate hikes and French elections?","source":"BT","date":"21 Aug 2026","tags":["Geopolitics","Finance & Markets"],"summary":"Speculation over ECB president Christine Lagarde's future is mounting as a less benign economic landscape raises the premium on leadership stability. After June's rate increase, the ECB's first since 2023 and driven by Middle East energy shocks, investors bet on two or three more hikes this year. Signals point to a possible exit before her term ends in October 2027; WEF founder Klaus Schwab had discussed her becoming its CEO in early 2027. The French political calculus adds weight: President Macron reportedly wants a centrist successor secured before he leaves in May 2027, with National Rally's Marine Le Pen leading polls after an appeal court let her run in April 2027. European governments are lining up replacements including Spain's Pablo Hernandez de Cos, Germany's Joachim Nagel and Italy's Fabio Panetta.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20BT/Will%20Lagarde%20exit%20the%20ECB%20early%20amid%20rate%20hikes%20and%20French%20elections.pdf"},{"id":"scmp-01","title":"Anwar's Taiwan remarks put Malaysia's Beijing calculus in focus","source":"SCMP","date":"21 Aug 2026","tags":["Geopolitics","Southeast Asia","Trade"],"summary":"Malaysian Prime Minister Anwar Ibrahim's emphatic backing of Beijing's Taiwan position, telling Al Jazeera \"I see Taiwan as part of China, period\" and appearing to endorse using force against secession, won praise from mainland China but drew condemnation from Taipei. Analysts said the categorical tone went beyond Malaysia's long-standing one-China policy and risked narrowing its diplomatic space, feeding perceptions of alignment rather than neutrality. The more tangible cost may be commercial: Malaysia competes with Vietnam and the Philippines for Taiwanese semiconductor investment. Malaysia-Taiwan trade surged 34.7 per cent year on year to 147.75 billion ringgit (US$36 billion) in the first half of 2026. Taipei warned the remarks could dent Taiwanese investor confidence.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20SCMP/Anwar's%20Taiwan%20remarks%20put%20Malaysia's%20Beijing%20calculus%20in%20focus.pdf"},{"id":"scmp-02","title":"Armed with funding boost, SpaceSail accelerates China's push to rival Elon Musk's Starlink","source":"SCMP","date":"21 Aug 2026","tags":["Technology & AI","Geopolitics"],"summary":"Chinese start-up SpaceSail, operator of the Qianfan constellation, raised about 7 billion yuan (US$1 billion) in a record Series B round for the country's satellite internet sector, lifting its valuation to roughly 50 billion yuan. Eighteen investors joined, including state-backed Shanghai Alliance Investment and CAS Star, for about 13.94 per cent equity. Officially Shanghai Spacecom Satellite Technology and founded in 2018, SpaceSail operated 238 satellites after its July deployment, up from 108 in 2025, and plans a global constellation of more than 14,000. It remains far behind SpaceX's Starlink, which runs over 10,000 satellites and serves 12 million subscribers. SpaceSail has won Brazilian regulatory approval and is exploring deals in Malaysia, Thailand and Kazakhstan.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20SCMP/Armed%20with%20funding%20boost,%20SpaceSail%20accelerates%20China's%20push%20to%20rival%20Elon%20Musk's%20Starlink.pdf"},{"id":"scmp-03","title":"As China shows, liberal capitalism is not the only path","source":"SCMP","date":"21 Aug 2026","tags":["Politics","Geopolitics"],"summary":"This opinion piece argues China has disproved the post-Cold War assumption that liberal politics and market capitalism are the only route to modernity. It frames modern China not as a monolithic command economy but as a mixed, state-led system where private enterprise, foreign investment and competitive markets coexist with public ownership and state control of strategic sectors such as credit, land and infrastructure. Over four decades China lifted nearly 800 million people from extreme poverty and became a leader in EVs, batteries, solar, robotics and AI. It acknowledges challenges including local government debt, a property downturn and demographic decline, but contrasts China's state-set boundaries on private wealth with concentrated private power in the United States.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20SCMP/As%20China%20shows,%20liberal%20capitalism%20is%20not%20the%20only%20path.pdf"},{"id":"scmp-04","title":"As the space race heats up, China's momentum is undeniable","source":"SCMP","date":"21 Aug 2026","tags":["Technology & AI","Defence","Geopolitics"],"summary":"LandSpace's recovery of its Zhuque-3 rocket's first stage in Gansu marks China's entry into reusable spaceflight, one of two breakthroughs within a month alongside CASC capturing a booster at sea. The milestones follow a rare Long March-7A explosion that destroyed a communications satellite, though China has conducted 56 launches this year with a high success rate. LandSpace plans to relaunch the recovered booster within six months. Reusable rockets are the \"logjam breaker\" for China's satellite-cluster ambitions to rival Starlink and cut launch costs, currently far higher than in the US. The push blends state support with private \"patient capital\" and fast-tracked Star Market IPOs. SpaceX still ran more missions last year than the rest of the world combined.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20SCMP/As%20the%20space%20race%20heats%20up,%20China's%20momentum%20is%20undeniable.pdf"},{"id":"scmp-05","title":"Beijing calls US tariff report 'false narrative' as named hub Mexico plans new China curbs","source":"SCMP","date":"21 Aug 2026","tags":["Trade","Geopolitics"],"summary":"China rejected a White House report accusing its exporters of routing goods through Mexico and other countries to evade US tariffs, with commerce spokesman He Yadong calling it \"unilateralism and protectionism\" that distorted normal trade as fraud. The 25-page document, titled \"The Great Transshipment Scam\" and produced by Peter Navarro's office, named more than 40 countries and put the annual trade value between US$40 billion and US$303 billion, citing up to 450,000 lost US jobs. Mexico, ranked a top hub alongside India and Vietnam, is simultaneously preparing to restrict selected Chinese goods and raise duties, with Washington pushing for Section 232 mirror tariffs. The friction precedes Xi Jinping's planned September 24 state visit to Washington.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20SCMP/Beijing%20calls%20US%20tariff%20report%20'false%20narrative'%20as%20named%20hub%20Mexico%20plans%20new%20China%20curbs.pdf"},{"id":"scmp-06","title":"China urges US to drop sweeping drone tariffs, warns of global supply chain fallout","source":"SCMP","date":"21 Aug 2026","tags":["Trade","Technology & AI","Geopolitics"],"summary":"Beijing urged Washington to scrap planned tariffs of up to 100 per cent on imported drones, with commerce spokesman He Yadong opposing use of Section 232 national-security powers and warning of harm to Chinese firms and global supply chains. The tariffs, signed by Trump on August 13 and effective September 3, hit drones over 25kg, thermal-imaging models and those with certain critical components at 100 per cent, with smaller drones at 25 per cent and EU, Japan and Britain at lower rates. Chinese firms control an estimated 80 to 90 per cent of the global market, yet US-bound shipments of 250g-7kg drones fell 82 per cent by volume in July, while 7-25kg models plunged 99.1 per cent. Beijing tightened its own drone export controls on August 5.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20SCMP/China%20urges%20US%20to%20drop%20sweeping%20drone%20tariffs,%20warns%20of%20global%20supply%20chain%20fallout.pdf"},{"id":"scmp-07","title":"China's top diplomat Wang Yi seeks to improve Seoul ties amid US-South Korea friction","source":"SCMP","date":"21 Aug 2026","tags":["Geopolitics","Politics"],"summary":"Chinese Foreign Minister Wang Yi urged South Korea to exercise \"genuine strategic autonomy\" and develop ties with Beijing and Washington in parallel, during his first solo ministerial trip to Seoul since September 2021. He called for ending Washington's hostile stance toward North Korea and accelerating phase-two China-South Korea free-trade talks. President Lee Jae Myung said he would use November's Apec summit in Shenzhen to elevate bilateral ties, and Beijing is \"actively considering\" a Xi-Lee meeting there. The visit coincided with friction in the US-South Korea alliance: joint drills were cut short six days at Trump's request as he seeks a summit with Kim Jong-un. Pyongyang responded skeptically, with Kim Yo-jong denying recent contact.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20SCMP/China's%20top%20diplomat%20Wang%20Yi%20seeks%20to%20improve%20Seoul%20ties%20amid%20US-South%20Korea%20friction.pdf"},{"id":"scmp-08","title":"Chinese AI chips fall short on coding, forcing firms to stretch scarce Nvidia supply","source":"SCMP","date":"21 Aug 2026","tags":["Technology & AI","Trade"],"summary":"Chinese AI firms are optimising software to cope with surging inference demand, as complex tasks like coding still require Nvidia chips amid restricted access. Approaching.AI's Guan Jiawei said demand for high-quality tokens far outstrips supply and domestic processors can only handle low-value tiers with weak monetisation. China's daily token calls exceeded 140 trillion in March, up more than 1,000-fold since early 2024, pushing monthly rental prices for Nvidia H200 chips above 100,000 yuan (US$14,857). Guan estimated China could need 300,000 high-end inference chips in 2026, rising to 300 million by 2030. Firms are adopting heterogeneous approaches: Moonshot and Approaching.AI split tasks between Huawei Ascend 910B and Nvidia H20 chips, cutting model-running costs 10 to 20 times.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20SCMP/Chinese%20AI%20chips%20fall%20short%20on%20coding,%20forcing%20firms%20to%20stretch%20scarce%20Nvidia%20supply.pdf"},{"id":"scmp-09","title":"Chinese banks embrace cheaper short-term loan rates despite margin risks","source":"SCMP","date":"21 Aug 2026","tags":["Finance & Markets"],"summary":"Chinese commercial banks have begun pricing corporate loans against the short-term depository institutional repo rate (DR) rather than the benchmark loan prime rate, drawing scrutiny over already thin profitability. The industry's average net interest margin slid to a record low near 1.4 per cent in the first quarter, below the 1.8 per cent regulators deem healthy. Overnight and seven-day repo rates traded around 1.38 per cent, well under the 3 per cent one-year LPR. Economist Dong Ximiao warned yields could fall further, though a multi-benchmark system may improve risk pricing over time. Standard Chartered's Ding Shuang said the impact hinges on PBOC liquidity management and expects a 0.25-point reserve requirement cut. Adoption is concentrated among the big-four state lenders, including Bank of China.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20SCMP/Chinese%20banks%20embrace%20cheaper%20short-term%20loan%20rates%20despite%20margin%20risks.pdf"},{"id":"scmp-10","title":"Despite US sanctions on Xinjiang cotton, China's textile industry weathers the storm","source":"SCMP","date":"21 Aug 2026","tags":["Trade","Geopolitics"],"summary":"Chinese textile firms reacted calmly to the late-July addition of 43 companies to the US import blacklist under the Uygur Forced Labour Prevention Act, a 30 per cent expansion, the largest ever, bringing the total to 187. Household names including Henan Tongzhou Cotton and Fujian Septwolves were added. After years of diversification, insiders say the industry has weathered the storm, with Xinjiang cotton output up 20.2 per cent since 2021 to 6.17 million tonnes in 2024. US cotton apparel from China fell to a record-low 6.4 per cent by value in early 2026, down from 21.9 per cent in 2019. Workarounds involve foreign cotton for traceable orders; more than 24,300 shipments worth nearly US$1 billion have been blocked. Some fear a broader textile ban ahead.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20SCMP/Despite%20US%20sanctions%20on%20Xinjiang%20cotton,%20China's%20textile%20industry%20weathers%20the%20storm.pdf"},{"id":"scmp-11","title":"From travel warnings to visa fees: why Chinese tourism to Japan is in free fall","source":"SCMP","date":"21 Aug 2026","tags":["Society","Geopolitics"],"summary":"Mainland Chinese tourist arrivals in Japan fell for an eighth straight month in July, plunging 56.1 per cent year on year, as group tours collapsed and visa costs rose amid deteriorating Beijing-Tokyo ties. Overall foreign arrivals edged up 0.1 per cent, supported by South Korea, Taiwan, Hong Kong, Malaysia and the Middle East. The chill followed Japanese PM Sanae Takaichi's November Taiwan remarks, after which Beijing issued travel warnings and Chinese airlines slashed flights. Analyst Li Hanming cited the group-tour freeze as the main driver. Japan raised foreign-visitor visa fees fivefold on July 1, to 15,000 yen for single entry. Flight capacity on the China route recovered to just 46.5 per cent of 2019 levels.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20SCMP/From%20travel%20warnings%20to%20visa%20fees%20why%20Chinese%20tourism%20to%20Japan%20is%20in%20free%20fall.pdf"},{"id":"scmp-12","title":"Henderson Land posts 66% profit surge after run of strong sales","source":"SCMP","date":"21 Aug 2026","tags":["Finance & Markets"],"summary":"Henderson Land Development reported a 66 per cent rise in interim underlying profit to HK$5.07 billion (US$646 million) for the first half of 2026, up HK$2.02 billion year on year, after a strong run of property sales. The developer, controlled by the family of late founder Lee Shau-kee, declared an unchanged interim dividend of 50 HK cents. Attributable contracted Hong Kong sales surged 188 per cent to HK$18.11 billion, led by Chester, One Victoria Cove, Highwood and Victoria Voyage; HK$17.06 billion remains unrecognised. It plans eight projects with 3,400 homes in the second half. Its Central offices benefited from a flight-to-quality trend, with The Henderson over 90 per cent leased and Jane Street Asia anchoring Central Yards.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20SCMP/Henderson%20Land%20posts%2066%20profit%20surge%20after%20run%20of%20strong%20sales.pdf"},{"id":"scmp-13","title":"Hong Kong buyers hunt for bargains in city's battered noncore office market","source":"SCMP","date":"21 Aug 2026","tags":["Finance & Markets"],"summary":"Hong Kong's noncore office market remains plagued by high vacancy and weak investor demand, but owner-occupiers are buying space at steep discounts. The latest example is the Estate Agents Authority, which agreed to buy a 7,343 sq ft unit at the OTB Building in Wan Chai for HK$70 million (US$8.93 million), or HK$9,533 per square foot, replacing leased premises at Hopewell Centre. Some non-core districts record vacancy rates around 30 per cent, with values down more than half from their 2018 peak. Occupiers made up 24.8 per cent of commercial investment buyers in the first half. JLL said grade A office capital values had fallen 51.1 per cent from their late-2018 peak, while CBRE cited distressed sales creating attractive entry points.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20SCMP/Hong%20Kong%20buyers%20hunt%20for%20bargains%20in%20city's%20battered%20noncore%20office%20market.pdf"},{"id":"scmp-14","title":"Hong Kong jobless rate steady at 3.7% since start of 2026 but pressure mounting","source":"SCMP","date":"21 Aug 2026","tags":["Society","Finance & Markets"],"summary":"Hong Kong's seasonally adjusted unemployment rate held at 3.7 per cent for the May-July period, unchanged on a rolling three-month basis since the start of 2026, though the labour chief warned of mounting pressure as fresh graduates enter the workforce. Underemployment rose to 1.7 per cent, and about 145,700 people were jobless, up from 139,700. Joblessness eased in construction but worsened in retail (4.6 per cent) and transport. The government recently raised its 2026 growth forecast to 3.5-4.5 per cent on strong exports and tourism. Consultant Alexa Chow warned AI adoption is eliminating low-skilled graduate roles, while lawmaker Peter Shiu cited cross-border spending and e-commerce squeezing bricks-and-mortar retail. Welfare (CSSA) cases rose 225 to 194,773.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20SCMP/Hong%20Kong%20jobless%20rate%20steady%20at%203.7%20since%20start%20of%202026%20but%20pressure%20mounting.pdf"},{"id":"scmp-15","title":"Hong Kong's rare plot incentive will help resurrect decaying districts, analysts say","source":"SCMP","date":"21 Aug 2026","tags":["Finance & Markets","Society"],"summary":"A rare Hong Kong government incentive, the bonus plot ratio pilot scheme launching September 1, will help revive decaying old districts such as Sham Shui Po where redevelopment has stalled, analysts said. Developers demolishing residential buildings aged 50 or above on sites of at least 700 square metres in seven districts gain an extra 20 per cent premium-free gross floor area, convertible into a 10-year land premium value usable elsewhere. The five-year scheme runs to August 2031. Lawmaker Augustine Wong called it a viability boost for borderline cases; surveyor Tony Wan dubbed it an \"olive branch,\" urging expansion. Officials note 68.1 per cent of private buildings are aged 30 or above, with 50-plus-year blocks rising more than 500 annually.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20SCMP/Hong%20Kong's%20rare%20plot%20incentive%20will%20help%20resurrect%20decaying%20districts,%20analysts%20say.pdf"},{"id":"scmp-16","title":"Iran goes on the offensive as diplomacy with US stalls","source":"SCMP","date":"21 Aug 2026","tags":["Geopolitics","Defence","Energy"],"summary":"Six months into its war with the United States, Iran's military is signalling a shift from retaliation to offence, which analysts say reflects Tehran's belief it holds leverage. Supreme Leader Mojtaba Khamenei called for \"large-scale offensive operations,\" and Revolutionary Guards revised doctrine to prioritise them. Diplomacy has stalled since a June 17 truce collapsed and Washington reimposed oil sanctions and a naval blockade. Tehran retains control of the Strait of Hormuz, requiring vessels to seek permission and pay fees, disrupting energy routes and lifting prices. US Vice-President J.D. Vance said keeping energy prices low was \"goal number one.\" Analysts including Sina Toossi warn of a \"reciprocal deterrence trap\" that could make future crises escalate faster, with catastrophic risks.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20SCMP/Iran%20goes%20on%20the%20offensive%20as%20diplomacy%20with%20US%20stalls.pdf"},{"id":"scmp-17","title":"Japan faces a tough inflation-growth trade-off - and it's not alone","source":"SCMP","date":"21 Aug 2026","tags":["Finance & Markets","Southeast Asia"],"summary":"Global bond markets are convulsing: on August 17 the 30-year US Treasury yield hit 5.3 per cent, its highest since 2007, with G7 long-term yields the highest since 2008, driven by AI-related tech debt issuance, ballooning public debts and the Iran-war energy shock. This column argues Japan faces an acute inflation-growth trade-off after Q2 GDP grew a weak 1.1 per cent annualised, complicating BOJ tightening even as markets price an 80 per cent chance of a September rate rise following US-Japan yen intervention. PM Sanae Takaichi's fiscal stimulus and flat consumption cloud the picture. The Philippines, Indonesia and South Korea face similar dilemmas, with high inflation, weak governance credibility, or K-shaped growth constraining their central banks.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20SCMP/Japan%20faces%20a%20tough%20inflation-growth%20trade-off%20-%20and%20it's%20not%20alone.pdf"},{"id":"scmp-18","title":"Malaysia's Anwar to visit China next month with an eye on building trade ties","source":"SCMP","date":"21 Aug 2026","tags":["Southeast Asia","Trade","Geopolitics"],"summary":"Malaysian Prime Minister Anwar Ibrahim is planning a three-day visit to China in late September, his first in over a year, at Premier Li Qiang's invitation, with stops in Shanghai and Hangzhou but not Beijing. He is expected to attend the Global Digital Trade Expo in Hangzhou (September 23-27) and hold talks with Li, deepening ties with Malaysia's largest trading partner. The trip builds on Xi Jinping's April 2024 Malaysia visit and Anwar's attendance at Beijing's WWII anniversary parade. His Al Jazeera remarks calling Taiwan \"part of China, period\" and refusing to condemn Beijing's use of force drew Beijing's commendation and Taipei's rejection. Anwar defended the comments, saying Malaysia maintained its one-China policy while seeking a peaceful path.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20SCMP/Malaysia's%20Anwar%20to%20visit%20China%20next%20month%20with%20an%20eye%20on%20building%20trade%20ties.pdf"},{"id":"scmp-19","title":"Netanyahu casts Turkey as Israel's new villain amid tough re-election fight","source":"SCMP","date":"21 Aug 2026","tags":["Geopolitics","Defence","Politics"],"summary":"Facing a tough October 27 re-election fight, Israeli Prime Minister Benjamin Netanyahu is casting Turkey as a new villain, after warplanes bombed a base in northern Syria near the Turkish border on Tuesday, saying Turkey sought a military presence there. His campaign billboards feature Turkish President Recep Tayyip Erdogan, a virulent Gaza-war critic. Unlike Iran, Turkey has powerful allies: it is a Nato member and Erdogan enjoys warm ties with Trump, whose ambassador condemned the strikes. Israeli opposition figures called the attack \"provocative and dangerous.\" Analysts said Netanyahu is playing an anti-Turkish card to unify his base, but risks looking reckless and losing Trump's support. Turkey, which champions Syrian President Ahmed al-Sharaa, denied the allegations to dial down tensions.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20SCMP/Netanyahu%20casts%20Turkey%20as%20Israel's%20new%20villain%20amid%20tough%20re-election%20fight.pdf"},{"id":"scmp-20","title":"North Korea answers US olive branch with missile launch","source":"SCMP","date":"21 Aug 2026","tags":["Defence","Geopolitics"],"summary":"North Korea fired around 10 short-range ballistic missiles from the Pyongyang area toward the East Sea on Thursday, Seoul's military said, hours after US President Donald Trump said he would meet Kim Jong-un this year. The launches came as South Korea and the US held a shortened edition of their Ulchi Freedom Shield exercises, scaled back on Trump's order. Trump, seeking to revive his first-term bond with Kim, said Pyongyang now had 57 \"very powerful\" nuclear weapons; Seoul estimates 80 to 120. Kim Yo-jong dismissed Trump's overture as not worthy of comment and demanded a full halt to drills, but kept rhetoric restrained, calling the leaders' personal relations \"still excellent\" while denying her brother had responded to Trump.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20SCMP/North%20Korea%20answers%20US%20olive%20branch%20with%20missile%20launch.pdf"},{"id":"scmp-21","title":"Saga of China Evergrande founder Hui Ka-yan ends with life sentence","source":"SCMP","date":"21 Aug 2026","tags":["Finance & Markets","Politics"],"summary":"A Shenzhen court sentenced China Evergrande founder and former chairman Hui Ka-yan (Xu Jiayin), 67, to life imprisonment for \"multiple combined crimes,\" confiscating all his property and stripping his political rights for life. Evergrande was fined 8.82 billion yuan (US$1.31 billion) and unit Hengda Real Estate 7 billion yuan, among the biggest such penalties. The court cited sustained large-scale financial fraud between 2016 and 2021, including inflated assets, concealed liabilities, fundraising fraud and bribery; 56 people, including Hui's two sons, received terms of 22 months to 18 years. Once the world's most indebted developer with US$332 billion in liabilities, Evergrande was ordered liquidated in 2024. Analysts said the ruling marks the end of an old-era property growth model but limited market impact.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20SCMP/Saga%20of%20China%20Evergrande%20founder%20Hui%20Ka-yan%20ends%20with%20life%20sentence.pdf"},{"id":"scmp-22","title":"Taiwan proposes record US$35b defence budget for 2027 as PLA's pressure grows","source":"SCMP","date":"21 Aug 2026","tags":["Defence","Geopolitics"],"summary":"Taiwan unveiled a record NT$1.12 trillion (US$35 billion) defence budget for 2027, the first above the NT$1 trillion threshold, up 18.2 per cent, or NT$173 billion, on this year and about 28.6 per cent of total government spending. Military investment rises NT$97.5 billion to NT$259.1 billion, largely to fund US arms including F-16V Block 70 fighters and Himars. Priorities include the \"T-Dome\" missile shield, uncrewed combat capabilities and indigenous naval programmes. President William Lai Ching-te aims for 5 per cent of GDP by 2030, but analysts warned AI-driven GDP growth, up about 30 per cent to NT$37.3 trillion, would push the ratio down to about 3.01 per cent, making the target nearly impossible without roughly doubling spending.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20SCMP/Taiwan%20proposes%20record%20US35b%20defence%20budget%20for%202027%20as%20PLA's%20pressure%20grows.pdf"},{"id":"scmp-23","title":"US Treasuries in driver's seat for risky AI stocks as investors grapple with elevated yields","source":"SCMP","date":"21 Aug 2026","tags":["Finance & Markets","Technology & AI"],"summary":"Stock traders in mainland China and Hong Kong are watching the US bond market for clues on the AI trade's sustainability after rising Treasury yields jolted global markets. Fears of an issuance glut drove the 30-year yield to a near two-decade high of 5.32 per cent and the 10-year to a level unseen since early 2025, pressuring stretched tech valuations that increasingly rely on debt financing. Shanghai's Star Market 50 trades at 124.6 times earnings; the Hang Seng Tech index at 23 times but exposed to US flows. Total US federal debt topped US$40 trillion, and hyperscalers like Amazon and Alphabet may sell up to US$250 billion in bonds this year. Bessent's buy-back plan briefly eased yields but was seen as insufficient.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20SCMP/US%20Treasuries%20in%20driver's%20seat%20for%20risky%20AI%20stocks%20as%20investors%20grapple%20with%20elevated%20yiel.pdf"},{"id":"scmp-24","title":"USS Nimitz soldiers on but 'glory days are over': CCTV report","source":"SCMP","date":"21 Aug 2026","tags":["Defence","Geopolitics"],"summary":"Chinese state broadcaster CCTV said the \"glory days\" of the USS Nimitz, the world's longest-serving aircraft carrier, are over, reflecting fatigue across the US fleet and a decline in American shipbuilding. Commissioned in 1975, the Nimitz saw two aircraft crash in the South China Sea last October; its retirement was pushed to March next year to align with delivery of the second Ford-class carrier, the USS John F. Kennedy. Commentators warned any delay could drop the fleet below the legally required 11 carriers, existing \"largely on paper\" given Ford-class problems and the undeployed F-35C. A December 2024 Pentagon report said China's navy, the world's largest at over 370 ships, would reach 435 by 2030, versus a shrinking US fleet of 296.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20SCMP/USS%20Nimitz%20soldiers%20on%20but%20'glory%20days%20are%20over'%20CCTV%20report.pdf"},{"id":"scmp-25","title":"Why North Korea is 'keeping the door open for dialogue' with Trump","source":"SCMP","date":"21 Aug 2026","tags":["Geopolitics","Defence"],"summary":"Analysts said Kim Yo-jong's latest statement, though dismissing Trump's scaling-back of US-South Korea drills as meaningless, stopped short of rejecting his outreach, leaving room for summit diplomacy while setting Pyongyang's terms. She neither confirmed nor denied Trump's claim that Kim Jong-un responded positively, and stressed the leaders' \"excellent\" personal ties. Experts said North Korea seeks a higher entry price: US acceptance as a nuclear-armed state, exclusion of denuclearisation and a Pyongyang-shaped framework. Trump said he would meet Kim this year, likely around November's Apec summit in Shenzhen, citing 57 North Korean nuclear weapons. Analysts linked Trump's push to a desired foreign-policy coup ahead of midterms, but noted North Korea's Russia and China ties reduce its need for Washington.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/21%20Aug%202026/21%20Aug%20SCMP/Why%20North%20Korea%20is%20'keeping%20the%20door%20open%20for%20dialogue'%20with%20Trump.pdf"}]},"2026-08-24":{"executiveDigest":"At the National Day Rally, PM Wong announced a major reset in Singapore's family-support and baby policy - shifting 'from incentivising births to supporting parenthood' - pledged the country 'won't be a conduit for illegal trade' amid US tariff pressure, and unveiled a new Western island from merging Semakau, Bukom and others. On the war, Iran's own top politicians 'urged an end' as its president said it was time to close it 'from a position of strength', while Trump's 'Iran credibility problem' grew and oil swung on looming sanctions. Markets fixated on a US Treasury buyback that revived 'debasement' trades, lifting gold before Warsh's Jackson Hole speech.","briefingCards":[{"title":"Lead story - National Day Rally resets family policy","body":"PM Wong made the National Day Rally a domestic-policy centrepiece: he announced 'a major reset in family support', reframing Singapore's baby push 'from incentivising births to supporting parenthood', with analysts expecting higher BTO and resale-flat demand after an income-ceiling increase. He pledged Singaporeans 'will remain the majority' while the government keeps 'managing the size of the foreign workforce', promised the state 'won't leave workers to fend for themselves when embracing new tech', and unveiled a new Western island by merging Semakau, Bukom and other islands 'for new industries'. On trade, he said it is 'not realistic to trace every shipment' to satisfy US tariff demands, but Singapore 'will not allow itself to be used as a conduit for illegal trade practices'."},{"title":"Markets & finance","body":"A US Treasury buyback dominated: it 'offered fleeting relief as debt worries persist', the dollar 'wobbled', and gold jumped as the manoeuvres 'revived debasement concerns' and gave 'the global debasement trade new life'. Attention turned to Jackson Hole - Warsh's speech and US PCE data lead the week. Deals were large: Italy's Monte dei Paschi made a US$40 billion move to buy rival banks, Alibaba planned a US$10 billion Hong Kong placement to fund AI, and Hugging Face is exploring a sale valuing it at US$13 billion. Goldman said 'China's easing hopes revive with the economy growing 4%', Europe and Asia saw an activity pickup, and Samsung guided to up to US$80 billion in shareholder returns."},{"title":"Asia realignment","body":"US-China friction framed the pre-summit stretch: Washington 'pushed an America First agenda in APEC talks ahead of the Chinese leader's visit', 'China's trade grip tightened in Europe as the clock ticks toward an October deadline', and SCMP asked whether 'Wall Street, which helped build modern China, is now being cast aside'. The Evergrande reckoning widened - a court accepted its liquidation petition a day after the founder's life sentence - as 'China's property crisis grinds on'. Security tensions flared: 'Russian missile drills stoked tensions with Japan', Russia 'tested readiness for a new round of mobilization', and Israel-Turkey tensions rose after Netanyahu 'ordered strikes on a Syrian airbase'."},{"title":"Energy & climate","body":"The Iran war neared an inflection: Iran's 'top politicians urged an end', its president said it was 'time to end the war while Tehran is in a position of strength', and Iran claimed the discovery of 'more than 200 billion cubic metres of gas'. Oil whipsawed - falling 1% ahead of a US sanctions announcement, then rising as Trump threatened Iran's partners - while WSJ showed 'how China weathered the Iran oil shock' and Sinopec's half-year profit still grew 19.3%. Trump wants to 'revive Keystone XL' (industry has other plans), Europe's EV market share topped 25% in July, and the Panama Canal will cut shipping over an El Nino-fuelled drought."},{"title":"Technology & AI","body":"AI's 'next big leap is into the real world', WSJ said, as Amazon's 'toaster-shaped robotaxis hit the road' and Chinese robots 'smashed records at the World Humanoid Robot Games'. The chip-nationalism contest sharpened: Nvidia is 'spending US$6 billion to build a US alternative to Chinese AI' and is in talks to invest in data-centre power developer Cloverleaf, even as it notified customers of AI price hikes 'above 15%'. Alibaba 'signalled a faster AI payoff halfway through its US$56 billion capex plan', Hugging Face weighed a US$13 billion sale, and Samsung is 'set to overtake Apple in 2026' on the memory crunch - while a 'Mistral paradox' showed Europe's tech-sovereignty push leaning on China's Z.ai."},{"title":"Singapore & SEA focus","body":"Beyond the Rally, Singapore's markets and infrastructure advanced: SGX is 'seeking to shake off its boring image and draw younger investors' as trading hit a 12-year high, Digital Realty and STT GDC were 'among data-centre operators awarded 50 MW of new capacity', and DBS expects 'tokenised finance to catch up with traditional payments and custody in 2-3 years'. PM Wong's new Western island targets 'new industries'. ST explored why 'Singapore's singles have a stake in its new baby push' and the shift 'from incentivising births to supporting parenthood', while BT weighed Japan's rare-earth breakthrough - part of the region's push to rewire critical-mineral supply chains."}],"keyMetrics":[{"value":"94","label":"Articles curated today","sub":"WSJ 20 · ST 26 · BT 25 · SCMP 23"},{"value":"Family reset","label":"NDR 2026: PM Wong","sub":"Births to parenthood; new island"},{"value":"'Not a conduit'","label":"SG on US tariffs","sub":"Won't enable illegal trade"},{"value":"Debasement","label":"Treasury buyback","sub":"Gold jumps; Jackson Hole ahead"},{"value":"Urge to end","label":"Iran's own politicians","sub":"'End war from strength'"},{"value":"US$6b","label":"Nvidia US AI alternative","sub":"To rival Chinese AI"}],"date":"2026-08-24","dayOfWeek":"Monday","totalArticles":94,"sourceCounts":{"WSJ":20,"ST":26,"BT":25,"SCMP":23},"articles":[{"id":"wsj-01","title":"AI's Next Big Leap Is Into the Real World","source":"WSJ","date":"24 Aug 2026","tags":["Technology & AI"],"summary":"Proponents argue the next AI frontier lies in \"world models,\" or large action models, trained on videogames and simulations rather than text, code and images. Designed to pilot robots, they can navigate three-dimensional space and manipulate objects autonomously from simple instructions. Investor Moritz Baier-Lentz likens the technology's maturity to OpenAI's GPT-2 from 2019, calling it early days. Backers including General Intuition's Kent Rollins, a former Fortnite ecosystem director at Epic Games, contend text is a \"lossy representation of the real world.\" Today's sophisticated robots rely on painstakingly coded, highly specialized physics-based simulations that don't transfer between machines. Startups aim to build versatile control systems, and tech luminaries are piling into the bet that a new architecture could take AI where LLMs cannot.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20WSJ/AI's%20Next%20Big%20Leap%20Is%20Into%20the%20Real%20World.pdf"},{"id":"wsj-02","title":"Amazon's Toaster-Shaped Robotaxis Are Hitting the Road","source":"WSJ","date":"24 Aug 2026","tags":["Technology & AI"],"summary":"Amazon's Zoox robotaxis, toaster-shaped all-electric vehicles without steering wheels or pedals, have begun charging for rides in Las Vegas and rolling across San Francisco. Holding four passengers facing each other, they are the first robotaxis on public roads lacking standard driver controls. Amazon is betting on a market Goldman Sachs expects to reach nearly $19 billion in sales by 2030, from $376 million last year, but faces Alphabet's Waymo, which runs roughly 4,000 vehicles, and Tesla's Cybercab. Regulators are cautious: the NHTSA allowed charging for rides in up to 5,000 vehicles over two years but barred operation in heavy rain, snow or above 45 mph. Zoox's fleet numbers about 100 vehicles, assembled at a Hayward, California plant.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20WSJ/Amazon's%20Toaster-Shaped%20Robotaxis%20Are%20Hitting%20the%20Road.pdf"},{"id":"wsj-03","title":"Boeing Engineers, Technical Workers Reject Four-Year Contract Offer","source":"WSJ","date":"24 Aug 2026","tags":["Society"],"summary":"Boeing engineers and technical workers rejected the jetmaker's proposed four-year collective bargaining agreements and voted to authorize a potential strike. The Society of Professional Engineering Employees in Aerospace, Boeing's biggest white-collar union, represents about 17,000 aerospace professionals across a professional unit of engineers and scientists and a technical unit of technicians, analysts and planners. About 64% of the engineering unit and 72% of the technical unit voted to reject the offer, which the union's negotiating team had endorsed and said could compound to roughly 32% in wage increases over the contract. Boeing stood by the offer and said it is implementing its strike contingency plan, diverting money from its SPEEA-represented team. No further talks are scheduled; the earliest a strike could occur is Oct. 7.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20WSJ/Boeing%20Engineers,%20Technical%20Workers%20Reject%20Four-Year%20Contract%20Offer.pdf"},{"id":"wsj-04","title":"Europe and Asia See Pickup in Activity Despite Headwinds","source":"WSJ","date":"24 Aug 2026","tags":["Finance & Markets"],"summary":"Business activity in the U.S., Europe and parts of Asia picked up in August despite headwinds from the nearly six-month Middle East war, purchasing-manager surveys released Friday showed. A lack of progress reopening the Strait of Hormuz has kept energy prices high while rising bond yields lift borrowing costs. S&P Global's U.S. PMI rose to 56 from 54.5 in July, with firms reporting the fastest output growth in over four years and a sharp payroll increase. The eurozone PMI edged up to 52.1 from 52.0, a nine-month high led by German manufacturing's strongest growth since January 2022, supported by AI and military-equipment demand. France remained the weakest eurozone economy. The U.K. also gained, driven by services, while Japan and India accelerated.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20WSJ/Europe%20and%20Asia%20See%20Pickup%20in%20Activity%20Despite%20Headwinds.pdf"},{"id":"wsj-05","title":"Greg Mankiw, Thomas Sargent and William White all have strong ideas about why prices rise. Their work could guide how the Fed fights inflation.","source":"WSJ","date":"24 Aug 2026","tags":["Finance & Markets"],"summary":"New Federal Reserve Chairman Kevin Warsh, a harsh critic of the central bank's inflation record of more than five years above the 2% target, has convened task forces, one examining how the Fed \"understands and responds to the drivers of inflation.\" Its three leaders, economists Greg Mankiw, Thomas Sargent and William White, could reshape Fed thinking. Their past work suggests recommending larger roles for fiscal policy, fighting financial bubbles and tracking the money supply. Mankiw, a Harvard professor, former Bush Council of Economic Advisers chairman who worked with a young Warsh, leads New Keynesianism. The article traces how postwar Keynesian fine-tuning was discredited by 1970s stagflation. The ideologically diverse panelists must persuade each other before the Fed's policy committee, with findings possible by year-end.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20WSJ/Greg%20Mankiw,%20Thomas%20Sargent%20and%20William%20White%20all%20have%20strong%20ideas%20about%20why%20prices%20rise..pdf"},{"id":"wsj-06","title":"Iran's Top Politicians Urge an End to the War","source":"WSJ","date":"24 Aug 2026","tags":["Geopolitics"],"summary":"Iran's top politicians said the country must focus on ending the six-month-old war and shoring up its crippled economy, publicly pushing back against defiant hardliners. President Masoud Pezeshkian and parliamentary speaker Mohammad Bagher Ghalibaf spoke as diplomacy stalled and the Trump administration escalated economic pressure via sanctions and a naval blockade of Iran's ports, sinking the currency further. \"The war must come to an end at some point,\" Pezeshkian said Friday. Ghalibaf warned there will be no security if the economic crisis is ignored. Hardliners recently levied tough demands for reopening the Strait of Hormuz, while Washington seeks deep concessions and again called for the regime's collapse. Analysts saw the comments as signs of economic distress but judged further escalation more likely than a deal.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20WSJ/Iran's%20Top%20Politicians%20Urge%20an%20End%20to%20the%20War.pdf"},{"id":"wsj-07","title":"Is America Still Capable of Enforcing the World Order?","source":"WSJ","date":"24 Aug 2026","tags":["Geopolitics","Defence"],"summary":"After the inconclusive war against Iran eroded U.S. weapons stockpiles and exposed the limits of American hard power, allies and adversaries are questioning whether Washington can still defend its friends. Officials worry industrial decline, strategic incoherence and political dysfunction have weakened the U.S. to the point it could not wield decisive force in a multi-front conflict spanning Europe, the Middle East and Asia. Strategist Matthew Kroenig of the Atlantic Council said deterrence requires both capability and credibility, and munitions depletion makes adversaries assume reduced capability. Trump scaled back South Korea exercises, called North Korea \"unthreatening and respectful,\" and froze $14 billion in Taiwan arms sales. Key U.S. assets, including missile-defense batteries and the sole Pacific carrier, were shifted from Asia to the Middle East.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20WSJ/Is%20America%20Still%20Capable%20of%20Enforcing%20the%20World%20Order.pdf"},{"id":"wsj-08","title":"Italy's Monte dei Paschi Makes $40 Billion Move to Buy Rival Banks","source":"WSJ","date":"24 Aug 2026","tags":["Finance & Markets"],"summary":"Banca Monte dei Paschi di Siena launched all-share bids for peers Banco BPM and Banca Generali, valued together at nearly $40 billion, escalating the battle for control of Italy's biggest banks. The world's oldest operating bank made the move even as it fends off a cash-and-stock takeover offer launched in June by larger rival Intesa Sanpaolo. Italy's government wants a third national banking champion after Intesa and UniCredit and opposes breaking up Monte dei Paschi. The enlarged group would become Italy's third-largest by assets, with a pro forma balance sheet around 466 billion euros ($545 billion) and more than 810 billion euros in total financial assets, spanning banking, advisory and wealth management. The deal is the latest twist in a consolidation wave following Italy's decade-ago bailouts.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20WSJ/Italy's%20Monte%20dei%20Paschi%20Makes%2040%20Billion%20Move%20to%20Buy%20Rival%20Banks.pdf"},{"id":"wsj-09","title":"Nvidia Is Spending $6 Billion to Build a Powerful U.S. Alternative to Chinese AI","source":"WSJ","date":"24 Aug 2026","tags":["Technology & AI"],"summary":"Nvidia plans to use a $6 billion deal struck this week to build one of the world's most powerful open-weight AI models, competing with Chinese heavyweights like DeepSeek and Kimi K3. The licensing deal with startup Poolside also challenges frontier U.S. labs OpenAI and Anthropic, since open-weight models are cheaper to run and easily customized. Nvidia will invest $1 billion at a $12 billion pre-money valuation and pay $6 billion to license Poolside's technology and hire the bulk of its engineers. More than 100 Poolside employees will join Nvidia's Nemotron open-weight project. Founders Eiso Kant, Jason Warner and Margarida Garcia won't join. The move reflects CEO Jensen Huang's strategy to compete across multiple AI battlegrounds and protect Nvidia's dominant market position.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20WSJ/Nvidia%20Is%20Spending%206%20Billion%20to%20Build%20a%20Powerful%20U.S.%20Alternative%20to%20Chinese%20AI.pdf"},{"id":"wsj-10","title":"Nvidia in Talks to Invest in Data-Center Power Developer Cloverleaf Infrastructure","source":"WSJ","date":"24 Aug 2026","tags":["Technology & AI","Energy"],"summary":"Nvidia is in advanced talks to invest in Cloverleaf Infrastructure, which arranges power for data-center projects, with a deal potentially announced as soon as Friday morning. Nvidia is expected to invest several hundred million dollars. Cloverleaf, founded in 2024 with $300 million from energy investors NGP and Sandbrook Capital, had been working with JPMorgan Chase on strategic options including a possible sale. It signs power agreements with utilities and has sold more than 7 gigawatts of powered land to developers, including Wisconsin sites for Oracle and OpenAI, with a pipeline exceeding 10 gigawatts. The deal cements Nvidia's growing role in the data-center ecosystem. This week Nvidia took a stake in SoftBank's SB Energy, and earlier invested $2 billion in Lancium, now owning 20%.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20WSJ/Nvidia%20in%20Talks%20to%20Invest%20in%20Data-Center%20Power%20Developer%20Cloverleaf%20Infrastructure.pdf"},{"id":"wsj-12","title":"Russian Missile Drills Stoke Tensions With Japan","source":"WSJ","date":"24 Aug 2026","tags":["Geopolitics","Defence"],"summary":"Russia held live missile drills near the southern Kuril Islands claimed by Japan, further straining relations after President Putin visited the disputed archipelago earlier this month. The Russian Pacific Fleet said a submarine, warship and coastal defense system fired missiles at mock enemy vessels, according to state agency Interfax. The islands, known in Japan as the Northern Territories, were seized by Russia in the final days of World War II. Japanese Foreign Minister Toshimitsu Motegi said the buildup \"runs counter to Japan's position,\" and U.S. Ambassador George Glass criticized the drills. Analyst James Brown said the exercises rehearse defense of the Sea of Okhotsk, vital for Russia's ballistic-missile submarines, with the hypothetical enemy being the United States, not Japan, while signaling strength to China.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20WSJ/Russian%20Missile%20Drills%20Stoke%20Tensions%20With%20Japan.pdf"},{"id":"wsj-13","title":"See How China Weathered the Iran Oil Shock","source":"WSJ","date":"24 Aug 2026","tags":["Energy","Geopolitics"],"summary":"A sharp drop in China's oil imports has been pivotal to keeping prices down since the war in Iran began, helping curb inflation and support the global economy. China, the world's largest oil importer, bought around 11 million barrels a day in 2025, half from Middle East suppliers including Iran, per Vortexa. From February to June, it slashed imports by 5.8 million barrels a day, a 48.9% drop, leaving purchases at their lowest in nearly a decade. Beijing restricted fuel exports, pushing refiners to cut crude processing; the average run rate across 49 state refineries fell to 71.6% by May, the lowest since Covid. Reduced air travel, a shift toward coal, and tapping pre-war oil reserves also helped China withstand the shock.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20WSJ/See%20How%20China%20Weathered%20the%20Iran%20Oil%20Shock.pdf"},{"id":"wsj-14","title":"State governors on both sides of the aisle are slowing development of data centers as anger over artificial intelligence spreads","source":"WSJ","date":"24 Aug 2026","tags":["Technology & AI","Politics","Energy"],"summary":"Voter anger over data centers that strain power and water and fuel job-threatening AI is becoming a liability for Republicans and some Democrats ahead of fall elections. Texas Gov. Greg Abbott, who declared his state the \"epicenter of AI development,\" halted approvals of some 1,800 new data centers, drawing Trump's ire as his Democratic challenger Gina Hinojosa gained ground. Candidates in Michigan, Ohio, Nevada and Wisconsin are deploying similar attacks, while Pennsylvania Gov. Josh Shapiro signed an order enabling the state to block centers. More than 60% of Americans now oppose new local data centers, up from 49% in March, a University of Pennsylvania poll found. The Senate GOP campaign committee warned the industry has become a \"toxic brand,\" putting the party at odds with Trump.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20WSJ/State%20governors%20on%20both%20sides%20of%20the%20aisle%20are%20slowing%20development%20of%20data%20centers%20as%20ange.pdf"},{"id":"wsj-15","title":"The Brains Who Powered China's Surprising AI Leap","source":"WSJ","date":"24 Aug 2026","tags":["Technology & AI","Geopolitics"],"summary":"Tsinghua professor Tang Jie and former student Yang Zhilin, founders of Z.AI and Moonshot AI respectively, exemplify how Chinese AI labs closed the gap with OpenAI and Anthropic. Rooted in Tsinghua's data-mining and computer-vision talent and an open-source culture, Chinese developers combined ingenuity, imitation and controversial \"distillation\" of U.S. models, which Anthropic has accused Z.AI and Moonshot of doing. DeepSeek's Liang Wenfeng pioneered efficiency workarounds like multihead latent attention and mixture-of-experts, triggering the January 2025 \"DeepSeek shock.\" State-backed funds poured in; nearly half of China's equity-capital investment flowed to AI this year. Z.AI listed in Hong Kong and reached $1 billion in annual recurring revenue, still trailing Anthropic's $65 billion. Chip access, not talent, remains the critical constraint.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20WSJ/The%20Brains%20Who%20Powered%20China's%20Surprising%20AI%20Leap.pdf"},{"id":"wsj-16","title":"The Dumbest Trade War Revisited","source":"WSJ","date":"24 Aug 2026","tags":["Trade","Politics"],"summary":"The Journal's editorial board criticizes Trump's escalation of tariffs on Canada 10 weeks before midterm elections. Using never-before-invoked Section 338 of the 1930 Tariff Act, which permits tariffs up to 50% on countries deemed to discriminate against U.S. commerce, Trump set a Friday deadline for a deal on $20 billion of goods. Talks collapsed and 50% tariffs took effect Saturday; Prime Minister Mark Carney threatened dollar-for-dollar retaliation from Sept. 8. A near-deal would have cut U.S. auto tariffs to 15% and steel and aluminum to 25%; those metals' prices rose 22.5% and 40.5% over the past year, and GM projected a $2.5-$3.5 billion tariff hit. The board says voters rightly believe Trump wages \"blunderbuss wars without a strategy.\"","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20WSJ/The%20Dumbest%20Trade%20War%20Revisited.pdf"},{"id":"wsj-17","title":"Trump Seeks a Tariff Do-Over in Court","source":"WSJ","date":"24 Aug 2026","tags":["Trade","Politics"],"summary":"In this op-ed, J. Marc Wheat and Richard Stern argue the Trump administration is improperly seeking a legal do-over after courts rejected its tariffs. Following a Supreme Court loss, the administration reimposed sweeping tariffs under the never-tested Section 122 of the Trade Act of 1974; the Court of International Trade rejected that theory and ordered the tariffs removed. Rather than comply, the administration is appealing and refusing refunds until appeals are exhausted. It also conjured a new rationale, reviving an obscure \"basic balance\" statistic the government abandoned in 1976 as unreliable. The authors say lawyers owe a duty of candor and shouldn't invent new theories after losing, warning of abuse of executive power. They urge the Court of Appeals to side with the Liberty Justice Center in Burlap and Barrel v. Trump.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20WSJ/Trump%20Seeks%20a%20Tariff%20Do-Over%20in%20Court.pdf"},{"id":"wsj-18","title":"Trump Wants to Revive Keystone XL. The Industry Has a Different Plan.","source":"WSJ","date":"24 Aug 2026","tags":["Energy"],"summary":"Trump suggested reviving the long-contested Keystone XL pipeline as the U.S. nears a trade deal with Canada, but developers are already assembling an alternative that avoids the hot-button name. Trump issued an April permit for a border crossing in Montana, part of a trio of proposed pipelines to carry heavy Canadian crude to Gulf Coast refineries. The original 1,200-mile, 830,000-barrel-a-day expansion was killed in 2021 after Biden revoked a key permit amid legal challenges and environmental protests over spills and oil-sands emissions. TC Energy spun off its liquids business into Calgary-based South Bow in 2024. South Bow plans a final investment decision by mid-2026 on the Prairie Connector, feeding a South Bow-Bridger venture to Cushing. Analysts say Montana regulators, not Washington, are the pressure point.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20WSJ/Trump%20Wants%20to%20Revive%20Keystone%20XL.%20The%20Industry%20Has%20a%20Different%20Plan..pdf"},{"id":"wsj-19","title":"Trump's Iran Credibility Problem","source":"WSJ","date":"24 Aug 2026","tags":["Geopolitics"],"summary":"The Journal's editorial board argues that after six months of war, Trump faces a credibility problem as blustering threats alternating with peace claims are doubted by friends and foes. His Truth Social threat of the \"MOST CRUSHING ECONOMIC OPERATION EVER\" will have to be seen to be believed. No president has yet climbed the sanctions ladder to target China's state-owned firms or forced Dubai to shut Iran's illicit financial network. The United Arab Emirates pre-empted Trump, announcing all trade and financial transactions with Iran are halted until further notice. The board says only a real policy, which Treasury Secretary Scott Bessent promises to lay out, would frighten Tehran. Iran depends on the UAE for up to 80% of its foreign-currency inflows and about a third of imports.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/24%20Aug%202026/24%20Aug%20WSJ/Trump's%20Iran%20Credibility%20Problem.pdf"},{"id":"wsj-20","title":"U.K. Government Borrowing Rose Despite Record Income Tax Revenue","source":"WSJ","date":"24 Aug 2026","tags":["Finance & Markets"],"summary":"The U.K. government borrowed more in July than a year earlier as higher spending offset record income-tax revenue, though the fiscal-year deficit for the first four months fell. The Office for National Statistics reported a July budget deficit of 1.8 billion pounds ($2.45 billion), up 700 million pounds from July 2025. Fiscal-year borrowing totaled 56.7 billion pounds, down 6 billion from last year but 2.3 billion above Office for Budget Responsibility projections. Record self-assessed income-tax receipts of 17.1 billion pounds were offset by a 2 billion-pound rise in social benefits. The OBR expects the deficit to fall to 3.6% of GDP, but economists see over 4%. Ten-year yields rose about half a point, with investors wary of new Prime Minister Andy Burnham's spending plans.","url":"https://stcsg-my.sharepoint.com/personal/bloomber
