0to%20reverse-engineer%20captured%20US%20underwater%20drone.pdf"}, {"id": "st-10sep-12", "title": "Iran strikes ships, expands no-go zone outside Hormuz strait", "source": "ST", "date": "10 Sep 2026", "tags": ["Geopolitics", "Energy", "Defence"], "summary": "Iran said it attacked more than a dozen vessels trying to pass through the Strait of Hormuz on Sept 9 and expanded a no-go zone outside the waterway it has blockaded for months. Its Revolutionary Guards said they struck two US vessels, eight oil tankers and 10 non-compliant vessels, while the UKMTO reported ships subject to disabling fire. New prohibited zones now include parts of the Gulf of Oman and Arabian Sea. The attacks pushed oil above US$100 a barrel. The Guards said they hit a US base in Jordan in retaliation for the destruction of five Iranian tankers; Jordan said it shot down 18 missiles. The IAEA also voted to refer Iran to the Security Council.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20ST/Iran%20strikes%20ships,%20expands%20no-go%20zone%20outside%20Hormuz%20strait.pdf"}, {"id": "st-10sep-13", "title": "Japan's main opposition party collapses after eight months", "source": "ST", "date": "10 Sep 2026", "tags": ["Politics"], "summary": "Japan's fragmented opposition sank into deeper disarray on Sept 9 as its main party, the Centrist Reform Alliance, announced it would disband after eight months, following a failed effort to counter Prime Minister Sanae Takaichi's popular administration. Chief Junya Ogawa said the party would dissolve once payments were settled. Formed hastily in January by merging the Komeito and the Constitutional Democratic Party of Japan, it suffered a crushing defeat in February's general election, winning only 49 of 465 Lower House seats and unseating more than 100 of its own incumbents. The LDP added over 100 seats to reach 316. Some members may return to old parties, while others plan a caucus to keep pushing for an alternative.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20ST/Japan's%20main%20opposition%20party%20collapses%20after%20eight%20months.pdf"}, {"id": "st-10sep-14", "title": "North Korea builds new Yongbyon uranium enrichment facility, IAEA says", "source": "ST", "date": "10 Sep 2026", "tags": ["Defence", "Geopolitics"], "summary": "North Korea has built a new uranium enrichment facility at its main Yongbyon nuclear complex that could house up to 28 centrifuge cascades, and has started operating an expanded annex at its Kangson site, the IAEA said. In a report dated Aug 28, the Vienna-based watchdog relied on satellite imagery and open-source material, including North Korean state media photos, as it has had no inspectors in the country since 2009. It identified the new two-storey Yongbyon building by comparing images from a June visit by Kim Jong Un. Director general Rafael Grossi called the expansion of weapons-grade material production a cause for serious concern and said it violated UN resolutions. Pyongyang has repeatedly rejected the agency's authority.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20ST/North%20Korea%20builds%20new%20Yongbyon%20uranium%20enrichment%20facility,%20IAEA%20says.pdf"}, {"id": "st-10sep-15", "title": "North Korea nears completion of bridge with China, analytics firm says", "source": "ST", "date": "10 Sep 2026", "tags": ["Geopolitics", "Southeast Asia"], "summary": "North Korea is completing its section of the long-stalled New Yalu River bridge with China, suggesting an imminent opening after more than a decade of delays, South Korean analytics firm SI Analytics said on Wednesday. The work follows Beijing's efforts since late 2025 to draw Pyongyang back into its fold after the pandemic and Kim Jong Un's deepening ties with Moscow. Structural work on a customs and immigration facility on the North Korean side of the 3-km bridge was set to be nearly complete in early September, executed in four months after a 12-year stall. China finished the dual-carriageway bridge in 2014 to link Dandong and Sinuiju. Work resumed after Xi Jinping visited in June; the North also opened its first road bridge with Russia.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20ST/North%20Korea%20nears%20completion%20of%20bridge%20with%20China,%20analytics%20firm%20says.pdf"}, {"id": "st-10sep-16", "title": "North Korea's Kim thanks troops on overseas operations on founding anniversary", "source": "ST", "date": "10 Sep 2026", "tags": ["Defence", "Geopolitics"], "summary": "North Korean leader Kim Jong Un used celebrations marking the 78th anniversary of the country's founding to praise troops engaged in overseas military operations, state media KCNA said. In a Sept 9 speech at Pyongyang's assembly hall, Kim thanked workers and soldiers and extended special gratitude to commanders and soldiers participating in overseas operations, likely referring to North Korean troops deployed for Russia's war in Ukraine. North Korea has sent an estimated 14,000 to 15,000 troops to fight alongside Russian forces since late 2024, with South Korea's spy agency estimating around 6,000 killed or wounded by February 2026. Pyongyang was preparing an additional deployment, and has received economic and military technology assistance from Russia in return.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20ST/North%20Korea's%20Kim%20thanks%20troops%20on%20overseas%20operations%20on%20founding%20anniversary.pdf"}, {"id": "st-10sep-17", "title": "OpenAI offers AI for chip design, touts cost advantage over open-source, CFO says", "source": "ST", "date": "10 Sep 2026", "tags": ["Technology & AI"], "summary": "OpenAI is pushing its AI into specialised industries and undercutting open-source rivals on cost, chief financial officer Sarah Friar said on Sept 7 as the ChatGPT maker sees accelerating enterprise growth. Speaking at Goldman Sachs' Communacopia + Technology Conference, she said OpenAI is focusing on sectors including chip design, life sciences and financial services, and is experimenting with outcome-based pricing. Friar said OpenAI used its own models to develop its Jalapeno chip, taped out within nine months, and recently cut its lower-cost Luna model's price by 80 per cent, driving a roughly tenfold usage increase. Its Codex coding tool has 25 million users. Enterprise revenue grew 32 per cent from June to July, with enterprise and consumer businesses reaching an even split.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20ST/OpenAI%20offers%20AI%20for%20chip%20design,%20touts%20cost%20advantage%20over%20open-source,%20CFO%20says.pdf"}, {"id": "st-10sep-18", "title": "Pakistan warns Iran to rein in Houthis as Riyadh strikes back", "source": "ST", "date": "10 Sep 2026", "tags": ["Geopolitics", "Defence"], "summary": "Pakistan has delivered a Saudi warning to Iran to rein in its Yemeni Houthi allies after they stepped up attacks on the kingdom, in a coordinated effort to prevent the crisis from spiralling, sources said. The Houthis struck an airbase in Khamis Mushait and oil infrastructure on Tuesday, wounding 73, while Saudi warplanes carried out dozens of airstrikes across Yemen. Pakistan's warning carries weight given its defence pact with Saudi Arabia and Turkey; Defence Minister Khawaja Asif said aggression on one would be considered aggression on all three. A senior Iranian official said Tehran responded that it does not control the Houthis, though two sources said Iran had told them to attack. Analysts warned of a widening regional crisis.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20ST/Pakistan%20warns%20Iran%20to%20rein%20in%20Houthis%20as%20Riyadh%20strikes%20back.pdf"}, {"id": "st-10sep-19", "title": "Protesters urge South Korea to stay out of Iran war", "source": "ST", "date": "10 Sep 2026", "tags": ["Geopolitics", "Society"], "summary": "Dozens of South Koreans urged their government on Sept 9 not to deploy troops to the Strait of Hormuz, condemning what they called Washington's illegal war. About 60 protesters waved signs outside the US embassy compound in Seoul as authorities weigh a contribution to the waterway's security. President Donald Trump has pressed ally South Korea to help in the Middle East war, in which Iran has taken a stranglehold on the strait key to global oil supplies. Defence authorities sent a fact-finding mission to assess the situation while stressing no decision had been made. Iran warned that any deployment would be regarded as direct support for the aggressor. Any deployment would require parliamentary approval by a majority vote.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20ST/Protesters%20urge%20South%20Korea%20to%20stay%20out%20of%20Iran%20war.pdf"}, {"id": "st-10sep-20", "title": "Russia says it hopes US-mediated talks with Ukraine will resume soon", "source": "ST", "date": "10 Sep 2026", "tags": ["Geopolitics"], "summary": "Russia hopes that US-mediated peace talks on ending the war in Ukraine will resume soon, Kremlin spokesman Dmitry Peskov said on Wednesday. No direct Russia-Ukraine talks have taken place since February, but President Donald Trump sent negotiators to Moscow and Kyiv at the weekend to relaunch the stalled process. Peskov was responding to US Secretary of State Marco Rubio's comment that a roadmap to restart talks might be possible. A huge gulf remains, with Kyiv rejecting Moscow's demands to cede more territory. Peskov cited a confirmed political will to resume talks, a day after Trump and Putin spoke by phone. He said prisoner exchanges remained a constant agenda item, noting Russia recently released American Robert Gilman.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20ST/Russia%20says%20it%20hopes%20US-mediated%20talks%20with%20Ukraine%20will%20resume%20soon.pdf"}, {"id": "st-10sep-21", "title": "Singapore businesses to get easier access to government support through AI-powered BizSG portal", "source": "ST", "date": "10 Sep 2026", "tags": ["Southeast Asia", "Technology & AI", "Trade"], "summary": "Singapore businesses will soon have a simpler way to find government grants and services through a new AI-powered portal that recommends support based on their needs and growth plans, the BizSG portal going live on Sept 30. Senior Minister of State for Trade and Industry Low Yen Ling announced the whole-of-government initiative at the SME Centre Conference on Sept 9. Developed with trade associations and nearly 200 companies, the portal includes an AI-powered grant recommender and initial eligibility indications, starting with the EDGE scheme covering over 150 activities. Low cited a survey finding 77 per cent of SMEs have adopted AI, and said BizSG aims to become a trusted digital concierge, freeing time for business growth. More grants will be added in 2027.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20ST/Singapore%20businesses%20to%20get%20easier%20access%20to%20government%20support%20through%20AI-powered%20BizSG%20p.pdf"}, {"id": "st-10sep-22", "title": "Singapore considering invitation to join China-led AI bloc", "source": "ST", "date": "10 Sep 2026", "tags": ["Technology & AI", "Southeast Asia", "Geopolitics"], "summary": "Singapore is considering an invitation to join a China-led artificial intelligence bloc, as it navigates a growing US-China contest to shape the technology's global landscape, Minister for Digital Development and Information Josephine Teo told Parliament on Sept 9. China's World Artificial Intelligence Cooperation Organization (WAICO), formally established on July 16 with 29 founding members including ASEAN states, is seen as a counterpoint to the US-led Pax Silica, which Singapore joined in December 2025. Teo said there was no ASEAN position on either and that participation depends on objectives and interests, making one-to-one comparisons less meaningful. Media reports say both powers are lobbying countries to pick sides. She stressed Singapore engages partners through multiple platforms to advance its interests.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20ST/Singapore%20considering%20invitation%20to%20join%20China-led%20AI%20bloc.pdf"}, {"id": "st-10sep-23", "title": "Singapore will have to carefully assess any action aimed at easing US tariff rates: DPM Gan", "source": "ST", "date": "10 Sep 2026", "tags": ["Trade", "Southeast Asia"], "summary": "Singapore will continue to engage the US on lowering tariffs and help businesses and workers adapt, but will assess any steps carefully, Deputy Prime Minister Gan Kim Yong said. About a third of Singapore's domestic exports to the US, worth about $9.5 billion annually, became subject to a 12.5 per cent tariff on July 24 amid US forced-labour allegations. Gan said there is no evidence Singapore trades such goods, but the higher rate was imposed because it lacks a prohibiting law. He warned an import prohibition could impose heavy compliance costs on the major trading hub and affect other trade ties. The Government is helping firms via the Singapore Economic Resilience Taskforce and grants, having engaged the US Trade Representative actively.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20ST/Singapore%20will%20have%20to%20carefully%20assess%20any%20action%20aimed%20at%20easing%20US%20tariff%20rates%20DPM%20Gan.pdf"}, {"id": "st-10sep-24", "title": "Singapore's food resilience not about guaranteeing every food product remains available: Grace Fu", "source": "ST", "date": "10 Sep 2026", "tags": ["Southeast Asia", "Society", "Environment"], "summary": "During a crisis, food resilience is not about guaranteeing that every preferred food product remains available in every form at low prices, Minister for Sustainability and the Environment Grace Fu told Parliament on Sept 9. Her ministry's objective is to ensure Singaporeans retain reliable access to essential food types even during disruptions. Responding to a PAP MPs' motion, Fu said measures include diversifying imports from over 20 sources, stockpiling, local production and international partnerships, noting geopolitical tensions and El Nino threaten rice supply. She said trade-offs exist between availability, assurance and affordability. Fu detailed over $240 million in support since 2019 and productivity gains, but rejected mandating procurement or indefinitely subsidising costs, favouring helping farms become viable.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20ST/Singapore's%20food%20resilience%20not%20about%20guaranteeing%20every%20food%20product%20remains%20available%20Gr.pdf"}, {"id": "st-10sep-25", "title": "South Korea says monitoring North Korea border incursions, maintains readiness", "source": "ST", "date": "10 Sep 2026", "tags": ["Defence", "Geopolitics"], "summary": "South Korea's military said on Sept 9 it was closely monitoring North Korean activity, including incursions across the military demarcation line separating the two Koreas, and maintaining a firm state of readiness. The statement responded to a Chosun Ilbo report that North Korean troops were sighted crossing the line more than 20 times in August, exceeding the total recorded in 2025. The report, citing unnamed military sources, said the crossings occurred as North Korean forces resumed fortification work near the border, including mine-laying and fence construction. The Joint Chiefs of Staff said it was taking principled measures in accordance with operational procedures and would continue to strengthen capabilities, but did not provide details on the number, locations or timing of the crossings.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20ST/South%20Korea%20says%20monitoring%20North%20Korea%20border%20incursions,%20maintains%20readiness.pdf"}, {"id": "st-10sep-26", "title": "The Chinese cook, Xi Jinping and a different vision for the Middle East", "source": "ST", "date": "10 Sep 2026", "tags": ["Geopolitics"], "summary": "In a commentary, the writer draws a parallel between China's biggest August film, Once Upon A Time In The Middle East, about a Chinese cook caught in a US-invaded Middle Eastern country, and Xi Jinping's Sept 1 visit to Cairo. During his first regional visit in four years, Xi pitched a new security architecture built on sovereignty, comprehensive solutions, development-led security and respect for international law, echoing China's self-image as a non-interfering great power favouring economic exchange. He made a similar pitch at the Shanghai Cooperation Organisation summit. The piece notes China buys Iranian oil while courting Gulf states and brokered the 2023 Saudi-Iran deal, but argues Beijing is not disinterested, with growing interests in oil, trade routes and influence.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20ST/The%20Chinese%20cook,%20Xi%20Jinping%20and%20a%20different%20vision%20for%20the%20Middle%20East.pdf"}, {"id": "st-10sep-27", "title": "Trump says Putin wants to make a deal in Ukraine", "source": "ST", "date": "10 Sep 2026", "tags": ["Geopolitics"], "summary": "US President Donald Trump said on Wednesday he had a great conversation with Russian President Vladimir Putin earlier in the week and that the Russian leader wanted to make a deal to end the war in Ukraine. Speaking to reporters before flying to Dallas, Trump said it would be very nice if Ukrainian President Volodymyr Zelensky also wanted a deal. He spoke by phone with Putin on Tuesday, shortly after US special envoy Steve Witkoff and son-in-law Jared Kushner returned from Moscow and Kyiv, where they discussed potential proposals. Despite the efforts, intelligence officials in the US, Ukraine and Europe continue to doubt Putin is seriously interested in ending the war, now in its fourth year. Trump called the holdup two people who hate each other.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20ST/Trump%20says%20Putin%20wants%20to%20make%20a%20deal%20in%20Ukraine.pdf"}, {"id": "st-10sep-28", "title": "Ukraine drone hits Russia's Arctic region, almost 3,000km from border", "source": "ST", "date": "10 Sep 2026", "tags": ["Defence", "Geopolitics"], "summary": "A Ukrainian drone sparked a fire at an industrial facility in Russia's Arctic Yamalia region on Sept 9, some 2,800km from the Ukrainian border, officials said. The Mediazona news outlet reported it was the longest-range attack on Russia since Moscow's 2022 full-scale invasion. The governor of the Yamalo-Nenets region, Dmitry Artyukhov, said a drone attack on an industrial facility in Novy Urengoy was repelled and falling debris caused a fire, with no deaths or injuries. Ukraine's FirePoint arms company said the drone travelled over 3,300km and successfully hit its target. Novy Urengoy, home to around 100,000 people, lies just south of the Arctic circle. Zelensky said in early September that Ukrainian drones would make Russian airspace completely unsafe.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20ST/Ukraine%20drone%20hits%20Russia's%20Arctic%20region,%20almost%203,000km%20from%20border.pdf"}, {"id": "st-10sep-29", "title": "Why are bond yields rising and how does it affect me?", "source": "ST", "date": "10 Sep 2026", "tags": ["Finance & Markets"], "summary": "Long-term government bond yields worldwide have climbed to multi-year highs, raising borrowing costs and pressuring other investments, this explainer notes. The 30-year US Treasury yield closed above 5.3 per cent in August, its highest since 2007, with Britain, Germany and Japan also rising. Drivers include higher inflation from the energy crisis tied to the Middle East conflict, with Brent crude hitting US$100 amid the Hormuz blockade, plus US borrowing to finance its war with Iran, a US$1.78 trillion deficit and national debt above US$40 trillion. Analysts say higher yields may pressure the US dollar, Singapore Savings Bonds, REITs and stocks, though Singapore government yields have stayed relatively stable. Financials dominating the STI could benefit from rising rates.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20ST/Why%20are%20bond%20yields%20rising%20and%20how%20does%20it%20affect%20me.pdf"}, {"id": "st-10sep-30", "title": "Zelensky's plane almost hit by drone en route to Oslo, says Norway's PM", "source": "ST", "date": "10 Sep 2026", "tags": ["Geopolitics", "Defence"], "summary": "Ukraine and Moldova on Sept 9 played down claims by Norway's prime minister that a plane carrying President Volodymyr Zelensky was almost hit by a drone en route to Oslo. Jonas Gahr Store told broadcaster NRK the plane was almost hit as it took off from Moldova, but a Ukrainian presidency source called the claim exaggerated, saying it was an alert when a Russian drone entered Moldovan and Romanian airspace. A Moldovan government spokesman said the country closed its airspace on the afternoon of Sept 8 due to a Russian drone, delaying several flights, before the drone came down about 160km from Chisinau. Zelensky arrived in Oslo that evening for talks on military aid and attended King Harald's funeral on Sept 9.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20ST/Zelensky's%20plane%20almost%20hit%20by%20drone%20en%20route%20to%20Oslo,%20says%20Norway's%20PM.pdf"}, {"id": "bt-10sep-01", "title": "Apple joins foldable phone race with US$1,999 passport-shaped iPhone Duo", "source": "BT", "date": "10 Sep 2026", "tags": ["Technology & AI"], "summary": "Apple on Sep 9 unveiled the Duo, a folding US$1,999 iPhone shaped like a passport, entering a foldable category long dominated by Samsung and Chinese rivals such as Huawei. Led by new CEO John Ternus, the launch is the most notable overhaul of Apple's flagship since the iPhone X in 2017. The Duo opens into a 19-cm-diagonal horizontal screen, has a titanium body and custom hinge, and is billed as Apple's thinnest phone, though thicker than Chinese foldables. Analysts have said Apple's entry could push foldables mainstream. In 2025, fewer than 20 million foldables shipped, under 2 per cent of smartphones. The iPhone generated US$209.6 billion, over half of Apple's annual sales.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20BT/Apple%20joins%20foldable%20phone%20race%20with%20US1%2C999%20passport-shaped%20iPhone%20Duo.pdf"}, {"id": "bt-10sep-02", "title": "Are China's rare earths really a potent weapon?", "source": "BT", "date": "10 Sep 2026", "tags": ["Geopolitics", "Trade"], "summary": "The article questions whether China's dominance in rare earths and permanent magnets gives it strong geopolitical leverage. Although China introduced export licensing in early 2025 and later relaxed it after Trump cut tariffs, the numbers suggest limited impact. The EU and US each import only about US$500 million to US$1 billion of magnets annually, a negligible share of GDP. An IMF paper estimates losing 80 per cent of supplies would cut US GDP by 1.5 per cent, while a US Geological Survey report puts total losses at just US$15 billion. Past experience, including China's 2010 export cuts that hurt Japan after the Senkaku Islands incident, shows sharp price spikes but modest lasting economic damage, supporting lower-cost estimates.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20BT/Are%20China's%20rare%20earths%20really%20a%20potent%20weapon.pdf"}, {"id": "bt-10sep-03", "title": "Brent settles at over US$100 a barrel as Middle East conflict intensifies", "source": "BT", "date": "10 Sep 2026", "tags": ["Energy", "Geopolitics"], "summary": "Brent crude futures breached US$100 a barrel on Sep 9, settling up US$3.29, or 3.4 per cent, at US$101.21, the highest close since May 22, after Iran and the US struck tankers in the biggest wave of attacks on shipping since the war began. US West Texas Intermediate rose 3.25 per cent to US$96.05. Iran said it attacked 10 ships near the Strait of Hormuz and the US sank five Iranian oil tankers, escalating the six-month conflict. Analysts said the market is revising how long the crisis will curb regional supply. Shipping through Hormuz, which carries about a fifth of the world's oil and gas, remains far below pre-war levels, with flows falling below 2 million barrels per day.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20BT/Brent%20settles%20at%20over%20US100%20a%20barrel%20as%20Middle%20East%20conflict%20intensifies.pdf"}, {"id": "bt-10sep-04", "title": "China curbs humanoid IPOs after Unitree's volatile debut", "source": "BT", "date": "10 Sep 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Chinese regulators are tightening approvals for humanoid robot startups planning initial public offerings after a volatile debut by industry leader Unitree Robotics, The Information reported. The China Securities Regulatory Commission has given informal window guidance to some investment banks, raising the bar for approving humanoid startups seeking to list. Companies must prove they can generate recurring revenue and narrow losses or achieve real innovation before approvals are considered. The shift was reportedly prompted by a private-market funding frenzy, a long queue of IPO filings, and falling share prices of recently listed firms. Unitree's shares have slumped roughly 45 per cent since jumping more than fivefold in its Shanghai debut, raising concerns about a bubble and retail investor losses.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20BT/China%20curbs%20humanoid%20IPOs%20after%20Unitree's%20volatile%20debut.pdf"}, {"id": "bt-10sep-05", "title": "China sours on debt-to-equity tool that helped property firms overhaul debt", "source": "BT", "date": "10 Sep 2026", "tags": ["Finance & Markets"], "summary": "China is casting doubt on mandatory convertible bonds (MCBs), a debt-to-equity tool that helped keep major developers including Country Garden out of liquidation. The China Securities Regulatory Commission has declined to accept registration of a swathe of these instruments, which were central to developers' restructuring talks with foreign investors. Country Garden, which has issued part of a planned US$13 billion in offshore MCBs, was told its filing was rejected due to its status as a discredited entity. Sino-Ocean was also told the CSRC would not support its registration. The move could undermine negotiated restructurings and limit tools for an industry that defaulted on about US$130 billion of debt. Property shares fell, with Country Garden down as much as 6 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20BT/China%20sours%20on%20debt-to-equity%20tool%20that%20helped%20property%20firms%20overhaul%20debt.pdf"}, {"id": "bt-10sep-06", "title": "Fertility rates, pollution, income inequality: What could a 'quality of life' target mean for ministers' bonuses?", "source": "BT", "date": "10 Sep 2026", "tags": ["Politics", "Society"], "summary": "Analysts say fertility rates, pollution levels and income inequality could be among the metrics a proposed quality-of-life target might measure when deciding Singapore ministerial bonuses. The discussion follows a move to revise ministerial salaries, with the reference salary for a starting-grade minister rising from S$1.1 million to S$1.8 million, announced by PM Lawrence Wong. Coordinating Minister Chan Chun Sing said National Bonus indicators would be tightened, and the government is exploring adding a quality-of-life measure as recommended by an independent review committee. Analysts welcomed the shift beyond pure economic performance towards people-centred outcomes but warned it is hard to settle on indicators that are both meaningful and measurable. Parliament was set to debate the salary review on Sep 10.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20BT/Fertility%20rates%2C%20pollution%2C%20income%20inequality%20What%20could%20a%20'quality%20of%20life'%20target%20mean%20f.pdf"}, {"id": "bt-10sep-07", "title": "Google to invest €13 billion in AI infrastructure in Finland", "source": "BT", "date": "10 Sep 2026", "tags": ["Technology & AI", "Energy"], "summary": "Alphabet's Google is planning its biggest European investment, an AI infrastructure build-out worth at least 13 billion euros (US$15.1 billion) in Finland. Over the next two years it will build at least three new data centres and expand its existing site in Hamina. The move adds to an estimated 43 billion euros of projects planned or under way in the country, which offers a cold climate, abundant fresh water and 96 per cent carbon-free electricity. Shares in utility Fortum, which will supply half its Loviisa nuclear output, rose more than 11 per cent, while Nokia and Elisa also gained. New data centres will be built in Kajaani, Muhos and Vaala, employing an estimated 16,000 construction workers, with a 94-megawatt battery system planned at Kajaani.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20BT/Google%20to%20invest%2013%20billion%20euros%20in%20AI%20infrastructure%20in%20Finland.pdf"}, {"id": "bt-10sep-08", "title": "Google, Blackstone cloud venture faces delays at data centre sites", "source": "BT", "date": "10 Sep 2026", "tags": ["Technology & AI"], "summary": "Alphabet and Blackstone's new cloud venture, known internally as Project Braid, has hit delays at major data centre sites meant to run Google's AI chips, underscoring obstacles to Big Tech's AI ambitions. Launched with US$5 billion from Blackstone, the neocloud aims to rent Google AI processors to customers in 2027. It faced an early snag when Google scrapped a plan for developer Crusoe to build sites in Cheyenne, Wyoming, and took over the project after losing confidence in Crusoe. Another site lacked the right transformers amid equipment shortages, and Texas froze new projects. CEO Benjamin Treynor Sloss said the venture is unfazed, has diversified options and remains on track to deliver 500 megawatts in 2027. Over 60 per cent of capacity planned for 2027 has yet to begin construction.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20BT/Google%2C%20Blackstone%20cloud%20venture%20faces%20delays%20at%20data%20centre%20sites.pdf"}, {"id": "bt-10sep-09", "title": "Kioxia dismisses SK Hynix tie-up, vows to ease chip price rises", "source": "BT", "date": "10 Sep 2026", "tags": ["Technology & AI"], "summary": "Kioxia CEO Hiroo Ota brushed aside the likelihood of deeper ties with rival and stakeholder SK Hynix, while pledging to keep surging memory prices in check to avoid denting long-term AI demand. Memory chipmakers are ramping up costly capacity to meet soaring AI orders that are fuelling double- and triple-digit price rises. Ota said closer ties with SK Hynix would face antitrust hurdles and clash with Kioxia's jointly owned facilities with Sandisk, adding prices have already risen enough. SK chairman Chey Tae-won had floated a manufacturing tie-up, but SK Hynix said no talks are ongoing. Kioxia and Sandisk plan more than 5 trillion yen (US$33 billion) of spending, while SK Hynix, which holds convertible bonds for a 14.19 per cent Kioxia stake, plans a 54 trillion won expansion.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20BT/Kioxia%20dismisses%20SK%20Hynix%20tie-up%2C%20vows%20to%20ease%20chip%20price%20rises.pdf"}, {"id": "bt-10sep-10", "title": "Manufacturers turn to Johor-Singapore corridor as supply chains diversify", "source": "BT", "date": "10 Sep 2026", "tags": ["Southeast Asia", "Trade"], "summary": "Manufacturers expanding into Malaysia are seeking advice on connecting new plants to global markets as tariff pressures and China-plus-N strategies reshape South-east Asian supply chains. FedEx Malaysia has received enquiries about shipment cut-off times, cross-border transit and customs documentation, said managing director Woon Tien Long. Executives describe an emerging division of labour in which manufacturers use Johor's lower costs and industrial capacity while relying on Singapore's infrastructure and connectivity to reach global markets. Goods move by road into Singapore and onto FedEx's air network, with about four to five truck movements daily across the border. A shipment takes roughly five hours from FedEx's Johor station to its Singapore hub, which connects to about 60 FedEx flights weekly, 40 per cent of it transhipment cargo.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20BT/Manufacturers%20turn%20to%20Johor-Singapore%20corridor%20as%20supply%20chains%20diversify.pdf"}, {"id": "bt-10sep-11", "title": "Mapletree Logistics Trust issues inaugural US$74.5 million dim sum bond", "source": "BT", "date": "10 Sep 2026", "tags": ["Finance & Markets"], "summary": "The manager of Mapletree Logistics Trust (MLT) has priced 500 million yuan (US$74.5 million) of offshore renminbi debt, its first foray into dim sum bonds. The three-year bond carries a 2.1 per cent annual coupon, with proceeds funding general corporate purposes including refinancing existing borrowings. Fitch assigned it a BBB+ long-term rating, in line with MLT's issuer rating, and it was issued under MLT's S$3 billion Euro Medium Term Securities Programme. CEO Jean Kam said tapping the offshore renminbi market secured competitive financing while diversifying funding sources. HSBC was sole lead manager and the issuance drew strong institutional interest. MLT follows Singapore Airlines into the market and separately agreed to sell a vacant Australian logistics property for A$28 million. Units closed at S$1.15.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20BT/Mapletree%20Logistics%20Trust%20issues%20inaugural%20US74.5%20million%20dim%20sum%20bond.pdf"}, {"id": "bt-10sep-12", "title": "Sembcorp axes S$105 million deal to buy Philippine solar farm developer", "source": "BT", "date": "10 Sep 2026", "tags": ["Energy", "Southeast Asia"], "summary": "Sembcorp Industries has scrapped a deal to acquire full ownership of Philippine solar farm developer Puente Al Sol, the Singapore-based energy player announced on Sep 9. Sembcorp had agreed in January 2025 to buy the developer from CleanCurrent Renewable Energy for S$105 million but reached a mutual agreement to terminate the deal, citing prevailing market conditions and evolving strategic priorities. Puente Al Sol is developing a 96-megawatt solar farm in the Philippine city of Cadiz. Sembcorp said it remains committed to its disciplined investment approach and renewables pipeline, holding 21.8 gigawatts of gross renewable capacity and targeting 25 gigawatts of installed capacity by 2028. The termination is not expected to materially affect FY2026 earnings. Shares closed at S$6.19.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20BT/Sembcorp%20axes%20S105%20million%20deal%20to%20buy%20Philippine%20solar%20farm%20developer.pdf"}, {"id": "bt-10sep-13", "title": "Singdollar hits 10-month high against ringgit as investors take refuge in traditional safe haven", "source": "BT", "date": "10 Sep 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "The Singapore dollar rose to a 10-month high against the ringgit on Sep 9, hitting RM3.2207, its highest since Oct 31, 2025, as rising US Treasury yields and risk-off sentiment drove investors towards the city-state's currency as a regional safe haven. It rose further to RM3.2215 on Thursday. Analysts said the Singdollar's strength is anchored by the Monetary Authority of Singapore's exchange-rate framework, which manages the currency against a basket of trading partners, along with strength in the yen and positive sentiment towards Singapore equities. The ringgit, by contrast, faces a broader regional FX sell-off amid firming US yields, rising oil prices and weak Malaysian government securities. Global funds pulled US$122 million from Malaysian stocks in early September, following a US$486 million August outflow.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20BT/Singdollar%20hits%2010-month%20high%20against%20ringgit%20as%20investors%20take%20refuge%20in%20traditional%20safe.pdf"}, {"id": "bt-10sep-14", "title": "TUV SUD launches S$30 million Singapore decarbonisation centre to boost carbon market trust", "source": "BT", "date": "10 Sep 2026", "tags": ["Environment", "Southeast Asia"], "summary": "German testing and certification group TUV SUD launched a S$30 million Global Decarbonisation Centre of Excellence in Singapore on Sep 9 to help companies measure and verify emissions and other carbon data. Supported by the Economic Development Board, it will serve firms in Singapore and across South-east Asia as regional carbon markets expand, with cumulative Asean opportunity estimated at up to US$3 trillion by 2050. Minister Grace Fu said carbon markets can channel financing to emissions reductions but only scale if credible and trusted, requiring rigorous standards and robust verification. The centre will cover five areas including carbon markets, energy transition and industrial decarbonisation, support Article 6 of the Paris Agreement, and employ more than 20 experts. About 160 carbon services firms are based in Singapore.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20BT/TUV%20SUD%20launches%20S30%20million%20Singapore%20decarbonisation%20centre%20to%20boost%20carbon%20market%20trust.pdf"}, {"id": "bt-10sep-15", "title": "UK food inflation will hit 6% on El Nino and drought, firms warn", "source": "BT", "date": "10 Sep 2026", "tags": ["Environment", "Society"], "summary": "A string of shocks from El Nino, summer droughts and the war in Iran will push UK food inflation above 6 per cent next year, according to the Food and Drink Federation. The trade body warned food inflation will reach almost 4 per cent by Christmas, before peaking at 6.4 per cent in July 2027, the highest annual increase since early 2024. It said a £100 weekly shop in 2020 would cost almost £150 by next summer, intensifying cost-of-living pressures topping PM Andy Burnham's agenda. Britain imports around 40 per cent of its food, leaving it exposed to weather abroad. Bank of England Governor Andrew Bailey warned shoppers to brace for faster price rises, noting lower cereal yields and El Nino risks to rice, coffee and cocoa.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20BT/UK%20food%20inflation%20will%20hit%206%20on%20El%20Nino%20and%20drought%2C%20firms%20warn.pdf"}, {"id": "bt-10sep-16", "title": "US mortgage rates rise to 6.85%, highest in more than a year", "source": "BT", "date": "10 Sep 2026", "tags": ["Finance & Markets"], "summary": "US mortgage rates climbed to a more than one-year high last week, extending a steady rise in borrowing costs since the start of the Iran war. The contract rate on a 30-year mortgage rose 6 basis points to 6.85 per cent in the week ended Sept 4, according to Mortgage Bankers Association data, while the five-year adjustable rate dropped to 6.13 per cent. Before the war began in late February, rates had fallen to their lowest since 2022, but have since risen about three-quarters of a percentage point as the conflict pushed up energy prices and inflation concerns. Higher costs have dampened loan demand, with the refinance index down 6.2 per cent to its lowest since May 2025. US consumer prices were expected to show 3.4 per cent August inflation.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20BT/US%20mortgage%20rates%20rise%20to%206.85%2C%20highest%20in%20more%20than%20a%20year.pdf"}, {"id": "bt-10sep-17", "title": "US to ban Canadian motorcycle, dairy, alcohol imports as trade war sizzles", "source": "BT", "date": "10 Sep 2026", "tags": ["Trade", "Politics"], "summary": "The United States banned a broad range of Canadian alcoholic beverages, motorcycles and dairy products on Sep 8, sharply escalating an acrimonious trade dispute. The bans, effective Sep 29, followed Canada's retaliatory tariffs that took effect after midnight, themselves a response to 50 per cent US tariffs on about US$20 billion of Canadian goods last month after negotiations collapsed. The bans cover most alcohol, including beer, wine and spirits, plus dairy items such as whey protein and molasses; various cheeses, aluminium, wood and furniture were added to a 50 per cent tariff list. PM Mark Carney urged a pivot away from Canada's biggest trading partner. Trade officials Jamieson Greer and Dominic LeBlanc were expected to speak again, as analysts warned the standoff could destabilise the US-Mexico-Canada Agreement.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20BT/US%20to%20ban%20Canadian%20motorcycle%2C%20dairy%2C%20alcohol%20imports%20as%20trade%20war%20sizzles.pdf"}, {"id": "bt-10sep-18", "title": "US' Bessent warns 'nothing would matter' if China wins the AI race", "source": "BT", "date": "10 Sep 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "US Treasury Secretary Scott Bessent warned the US faces dire consequences if it loses the AI race with China, saying there is no day after tomorrow if China wins and that even a large defence budget would fail to protect it. Speaking at a Breitbart News event on Sep 8, his comments appeared aimed at Americans upset over large data centre projects nearby; President Trump had similarly warned public backlash risks giving China the AI edge. Bessent also flagged worries about powerful, cheap open-weight Chinese models. US agencies said Alibaba, DeepSeek, Moonshot AI and others extracted billions of tokens from US frontier models including Anthropic's Claude and Alphabet's Gemini, potentially with Chinese government awareness. The two countries were preparing to discuss AI safety before a Trump-Xi meeting on Sep 24.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20BT/US'%20Bessent%20warns%20'nothing%20would%20matter'%20if%20China%20wins%20the%20AI%20race.pdf"}, {"id": "bt-10sep-19", "title": "What is causing the global bond sell-off?", "source": "BT", "date": "10 Sep 2026", "tags": ["Finance & Markets"], "summary": "The article examines the global surge in bond yields, contrasting two explanations. Pessimists blame feckless politicians, pointing to large US deficits under President Trump and his pressure on the Federal Reserve, arguing higher yields reflect inflation fears. Treasury Secretary Scott Bessent's more optimistic view holds that markets are pricing faster long-term growth, as the AI revolution demands heavy present-day capital for data centres and power, putting the public sector in competition with the private sector for money. India offers a test case: its 10-year yield rose just 0.37 point to 7 per cent, versus a 0.67-point rise to 4.8 per cent for US Treasuries, keeping the spread near historic lows despite blistering growth of 7.8 per cent, aided by disciplined inflation targeting.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20BT/What%20is%20causing%20the%20global%20bond%20sell-off.pdf"}, {"id": "bt-10sep-20", "title": "Yen rallies as over-US$100 oil rattles greenback", "source": "BT", "date": "10 Sep 2026", "tags": ["Finance & Markets", "Energy"], "summary": "The Japanese yen traded at seven-month highs on Sep 9, keeping the US dollar under pressure as oil prices broke above US$100 a barrel amid a widening Middle East war. Iranian-backed Houthis struck Saudi cities, US forces hit Iranian oil tankers, and Tehran struck a US base in Jordan. Brent rose nearly 3 per cent, weighing on markets ahead of US inflation data. The euro rose 0.18 per cent to US$1.1641 ahead of an expected European Central Bank rate rise, while the dollar fell 0.4 per cent to 153.38 yen. The yen's roughly 4 per cent September rise has shifted the carry-trade calculus, driven by expectations of faster Bank of Japan tightening, repatriation flows and US pressure. Traders expect a 25-basis-point hike on Sep 17-18.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20BT/Yen%20rallies%20as%20over-US100%20oil%20rattles%20greenback.pdf"}, {"id": "scmp-10sep-01", "title": "Alibaba sends AI 'digital employees' to work in rival apps from ByteDance, Tencent", "source": "SCMP", "date": "10 Sep 2026", "tags": ["Technology & AI"], "summary": "Alibaba Group Holding is letting users deploy AI-powered \"digital employees\" inside rival office platforms, opening a new competitive front against ByteDance and Tencent in enterprise AI. The latest version of Alibaba Cloud's QoderWake tool, launched on Tuesday, lets users generate fully functioning workers from a single-line description of the required role. These digital workers can then operate within any of China's three major workplace communication platforms: Alibaba's DingTalk, ByteDance's Feishu and Tencent's WeCom, autonomously absorbing context from documents, calendars and group chats. QoderWake offers 10 ready-to-use roles, including product manager and data analyst. Since its April release, it had deployed nearly 100,000 digital employees executing around 2 million tasks, reflecting a shift toward business-facing AI applications.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20SCMP/Alibaba%20sends%20AI%20'digital%20employees'%20to%20work%20in%20rival%20apps%20from%20ByteDance,%20Tencent.pdf"}, {"id": "scmp-10sep-02", "title": "Amid China's AI shift, JD.com bets on 3 million robots to automate logistics", "source": "SCMP", "date": "10 Sep 2026", "tags": ["Technology & AI"], "summary": "Chinese e-commerce giant JD.com is accelerating its push into robotics with a plan to automate its nationwide logistics network while promising to retrain couriers for technical roles. At a Beijing event on Wednesday, its logistics arm unveiled the industrial Wolf Robot series. Over the next five years, JD Logistics aims to procure 3 million robots, 1 million unstaffed vehicles and 100,000 delivery drones to build a fully automated supply chain, according to Cao Peng, technology committee chairman. The Wolf Robot system will pick, sort, transport and deliver goods with minimal human intervention, including units operating in cold environments. JD and its ecosystem employ some 700,000 logistics personnel; its Nirvana Plan aims to retrain them for robot servicing as automation spreads.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20SCMP/Amid%20China's%20AI%20shift,%20JD.com%20bets%20on%203%20million%20robots%20to%20automate%20logistics.pdf"}, {"id": "scmp-10sep-03", "title": "As China embraces AI, only 24% of US pharmaceutical execs bet on it for innovation", "source": "SCMP", "date": "10 Sep 2026", "tags": ["Technology & AI"], "summary": "Pharmaceutical companies have embraced AI in drug research almost universally, yet few executives expect it to actually make drugs succeed, according to a Citi survey released Tuesday. Some 72 per cent of respondents said their companies were either \"scaling\" or had \"fully scaled\" AI across research and development, with no company reporting no plans to adopt it. Citi Research polled 50 US-based executives responsible for technology strategy in pharmaceutical R&D in June 2026. However, only 24 per cent expected AI to deliver a significant improvement in drug success probability, while 56 per cent expected only a moderate uplift. Another 34 per cent said human biology, clinical judgment and execution would remain bottlenecks. Executives saw the biggest near-term payoff in early-stage discovery.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20SCMP/As%20China%20embraces%20AI,%20only%2024%20of%20US%20pharmaceutical%20execs%20bet%20on%20it%20for%20innovation.pdf"}, {"id": "scmp-10sep-04", "title": "Beijing tells Manila to 'stop lying' after minister exposes South China Sea note", "source": "SCMP", "date": "10 Sep 2026", "tags": ["Geopolitics", "Southeast Asia"], "summary": "China accused Philippine officials of \"grandstanding and lying\" after Manila's defence secretary Gilberto Teodoro Jnr publicly read aloud a Chinese diplomat's handwritten note on the South China Sea, which he described as \"coercion, bullying and aggression\". Foreign ministry spokeswoman Mao Ning urged \"certain people in the Philippines to stop this grandstanding and lying\". Teodoro, speaking at a Seoul Defence Dialogue session on Tuesday, received a note reiterating Beijing's rejection of the 2016 arbitration ruling that denied most of China's claims, calling the award \"illegal, null and void\". The forum organiser said the note came from a military attache at the Chinese embassy in Seoul. Teodoro said he would keep it as a \"memento of how desperate China is\".", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20SCMP/Beijing%20tells%20Manila%20to%20'stop%20lying'%20after%20minister%20exposes%20South%20China%20Sea%20note.pdf"}, {"id": "scmp-10sep-05", "title": "Chinese AI firm DeepSeek taps underwriters including Citic Securities for IPO: sources", "source": "SCMP", "date": "10 Sep 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Chinese frontier AI lab DeepSeek has hired underwriters including Citic Securities in preparation for a domestic initial public offering, according to two people familiar with the matter. Citic was one of four underwriters tapped by the Hangzhou-based firm, which aims to begin the IPO process this year to list on the Shanghai Stock Exchange's Nasdaq-like Star market. The move comes as DeepSeek completes a pre-IPO financing round that could value it at about 500 billion yuan (US$74 billion). DeepSeek is pursuing its listing alongside Beijing-based Moonshot AI, which confidentially filed for a Hong Kong IPO. The firms follow Z.ai and MiniMax, which went public in Hong Kong earlier this year, though their valuations lag US counterparts like OpenAI and Anthropic.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20SCMP/Chinese%20AI%20firm%20DeepSeek%20taps%20underwriters%20including%20Citic%20Securities%20for%20IPO%20sources.pdf"}, {"id": "scmp-10sep-06", "title": "Chinese court guidance aims to smooth developer bankruptcies, reassure creditors", "source": "SCMP", "date": "10 Sep 2026", "tags": ["Finance & Markets", "Politics"], "summary": "China's Supreme People's Court has issued the country's first systematic judicial guidance governing bankruptcy proceedings for property developers, aiming to end regional inconsistencies that have slowed asset disposals and deterred capital. The framework calls for timely reorganisations of viable developers and prompt liquidations of those lacking sustainable value, according to a statement on Monday. It says asset-management companies and institutional investors should receive higher priority for continuation-of-construction repayment. Five years into the Evergrande crisis, the property downturn has spurred regulators to stabilise the market. The guidance follows the acceptance of a liquidation petition against Evergrande's main onshore unit Hengda Real Estate. It prioritises repayment to homebuyers when delivery becomes impossible and lets courts approve construction plans before the first creditors' meeting.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20SCMP/Chinese%20court%20guidance%20aims%20to%20smooth%20developer%20bankruptcies,%20reassure%20creditors.pdf"}, {"id": "scmp-10sep-07", "title": "Chinese stock recovery faces US Fed and oil pressures in September, says top fund manager", "source": "SCMP", "date": "10 Sep 2026", "tags": ["Finance & Markets"], "summary": "Chinese stocks are likely to trade sideways through September as resilient earnings growth is weighed down by concerns over potential US monetary tightening, according to a strategy report by China Asset Management, the country's second-largest mutual fund firm. Mainland-listed companies posted double-digit profit growth in the first half, providing a floor under prices, but a hawkish US Federal Reserve and elevated oil prices are likely to cap gains, said the manager, which oversees 2.2 trillion yuan (US$328 billion). Faster IPOs in the third quarter could squeeze liquidity. The Star Market 50 gauge rebounded 3 per cent in August after plunging 26 per cent. Traders priced a 58 per cent chance of a 25 basis-point Fed hike, with oil nearing US$100 a barrel amid US-Iran strikes.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20SCMP/Chinese%20stock%20recovery%20faces%20US%20Fed%20and%20oil%20pressures%20in%20September,%20says%20top%20fund%20manager.pdf"}, {"id": "scmp-10sep-08", "title": "Deutsche Bank sees supply chains driving yuan's rise in global trade", "source": "SCMP", "date": "10 Sep 2026", "tags": ["Finance & Markets", "Trade"], "summary": "The global rise of the renminbi is being driven by shifting supply chains rather than a campaign against the US dollar, according to a senior Deutsche Bank executive, following the German lender's appointment as Europe's first non-Chinese renminbi clearing house. Konrad Haunit, Deutsche Bank's head of multinational corporate coverage for Asia-Pacific, Middle East and Africa, said the yuan's use had grown steadily over five years as clients diversified operations. The People's Bank of China named Deutsche Bank as Europe's first foreign yuan clearing bank last month, giving it direct clearing and settlement capability in Frankfurt. Asked if the yuan could replace the dollar, Haunit urged caution, tracing the shift to the Covid-19 pandemic's disruption of cost-minimising supply chains rather than geopolitics.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20SCMP/Deutsche%20Bank%20sees%20supply%20chains%20driving%20yuan's%20rise%20in%20global%20trade.pdf"}, {"id": "scmp-10sep-09", "title": "Hong Kong must plan for the population it wants to have", "source": "SCMP", "date": "10 Sep 2026", "tags": ["Society", "Politics"], "summary": "This opinion piece argues that Hong Kong must adopt data-based population planning as the chief executive prepares the policy address and the Northern Metropolis takes shape. Expected to house 2.5 million residents and provide 650,000 jobs, the Northern Metropolis will be deeply integrated with Shenzhen and the Greater Bay Area, with residents living, working and accessing services across the border. Hong Kong's demographics are shifting: fertility remains at 0.7 to 0.8 births per woman, residents aged 65 and older account for about 24 per cent of the population, and those aged 15 to 34 fell 16.4 per cent in seven years. Talent schemes since 2022 have approved over 410,000 applications. The article urges policies aligned with a cross-boundary lifestyle to retain new Hongkongers.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20SCMP/Hong%20Kong%20must%20plan%20for%20the%20population%20it%20wants%20to%20have.pdf"}, {"id": "scmp-10sep-10", "title": "Hong Kong targets biomedicine powerhouse status in debut 5-year plan", "source": "SCMP", "date": "10 Sep 2026", "tags": ["Society", "Politics"], "summary": "Biomedicine is set to feature in Hong Kong's first five-year plan, due to be unveiled next week, as top officials signal closer medical cooperation across the Greater Bay Area. Global pharmaceutical company GSK emphasised interest in expanding its regional role at the fifth Hong Kong International Biotechnology Conference. Secretary for Health Lo Chung-mau said the plan would align with the national blueprint, which designated biomedicine as a strategic emerging industry, describing Hong Kong as a \"superconnector\" hub for the Greater Bay Area. The region, home to 88 million people, generated GDP of over 15 trillion yuan (US$2.23 trillion) in 2025. The plan is expected on September 16, followed by Chief Executive John Lee's policy address. Hong Kong will establish a Centre for Medical Product Regulation by year-end.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20SCMP/Hong%20Kong%20targets%20biomedicine%20powerhouse%20status%20in%20debut%205-year%20plan.pdf"}, {"id": "scmp-10sep-11", "title": "Houthi offensive on Bab el-Mandeb Strait threatens new Red Sea shipping crisis", "source": "SCMP", "date": "10 Sep 2026", "tags": ["Defence", "Energy"], "summary": "A battle for control of Yemen's coastal plains overlooking the strategic Bab el-Mandeb Strait, launched on Friday by Iran-aligned Houthi rebels, is intensifying into an all-out war with Saudi-backed government forces. A wave of Houthi missile and drone strikes on four southern Saudi cities early Tuesday injured 73 civilians, potentially a tipping point. Coinciding with a US-Iran battle for control of the Strait of Hormuz, the strikes are viewed as a precursor to a parallel conflict for dominance over the Red Sea. Intense fighting in Taiz and Hodeidah is expected to strangle maritime traffic through the strait, which links the Indian Ocean to Europe via the Suez Canal. A July Houthi embargo has already forced Saudi Arabia to divert oil exports around Africa, raising costs.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20SCMP/Houthi%20offensive%20on%20Bab%20el-Mandeb%20Strait%20threatens%20new%20Red%20Sea%20shipping%20crisis.pdf"}, {"id": "scmp-10sep-12", "title": "Insurers Prudential, Manulife seal tech alliances amid Beijing's tightened tax rules", "source": "SCMP", "date": "10 Sep 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Several Hong Kong insurers, including Prudential, Manulife and BOC Life, are racing into cross-sector alliances spanning AI underwriting and healthcare tie-ups to strengthen capabilities amid China's tightened cross-border tax rules. Prudential announced a partnership with Alibaba Cloud to launch an AI underwriter that helps financial consultants make preliminary decisions based on a client's financial situation, medical record, occupation and residential profile. Prudential Hong Kong CEO Lawrence Lam said collaboration would be a trend as insurers alone could not cope with new technology, noting AI underwriting delivers preliminary results within minutes instead of days. Alibaba Cloud also signed a partnership with Manulife Hong Kong in June, while Manulife and AHA Healthcare Technology signed an MOU on cross-border healthcare and insurance technology.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20SCMP/Insurers%20Prudential,%20Manulife%20seal%20tech%20alliances%20amid%20Beijing's%20tightened%20tax%20rules.pdf"}, {"id": "scmp-10sep-13", "title": "Japan's China-facing military build-up confronts labour, budget and political limits", "source": "SCMP", "date": "10 Sep 2026", "tags": ["Defence", "Geopolitics"], "summary": "The risk of a conflict over Taiwan is shaping Japanese defence planning, but economic, demographic and political constraints limit how far Tokyo's military transformation can go, analysts say in the third of a three-part series. Driven by the risk of being drawn into a high-intensity confrontation with Beijing, Japan is pursuing its most ambitious military transformation since World War II, acquiring long-range missiles, embracing drones and expanding partnerships from Canberra to London. Yet the toughest obstacles may lie at home: a shrinking pool of military recruits, an ageing population, mounting fiscal pressures, an industrial base struggling to expand, and questions over public support. Analysts note acquiring sophisticated hardware is only one part of building an effective force capable of sustaining a prolonged conflict.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20SCMP/Japan's%20China-facing%20military%20build-up%20confronts%20labour,%20budget%20and%20political%20limits.pdf"}, {"id": "scmp-10sep-14", "title": "Merging air, land and sea swarms - the next frontier in China's drone technology", "source": "SCMP", "date": "10 Sep 2026", "tags": ["Defence", "Technology & AI"], "summary": "China is tackling the complex task of integrating uncrewed land, sea and air platforms after mastering drone-swarm technology, according to the country's leading developer in the field. In an article posted on China Electronics Technology Group Corporation's (CETC) social media on Sunday, its Intelligent Technology Research Institute said drone-swarm technology was not merely \"many drones flying together\" but an intelligent, distributed combat system in which aircraft communicate, coordinate and make local decisions. China's longer-term goal is a combat network coordinating different uncrewed platforms across domains. In January, state media showed a single soldier reportedly controlling up to 200 drones. Field tests showed swarms could autonomously reconfigure networks, close formation gaps and continue missions under electromagnetic interference and unit losses in combat.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20SCMP/Merging%20air,%20land%20and%20sea%20swarms%20-%20the%20next%20frontier%20in%20China's%20drone%20technology.pdf"}, {"id": "scmp-10sep-15", "title": "Once sidelined, China stands ready to broker 4th Trump-Kim handshake", "source": "SCMP", "date": "10 Sep 2026", "tags": ["Geopolitics", "Politics"], "summary": "China is willing to help broker a possible meeting between US President Donald Trump and North Korean leader Kim Jong-un, sources said, just weeks before Chinese President Xi Jinping is expected in Washington for a bilateral summit. People familiar with the matter told the South China Morning Post that Beijing was stepping up to play an \"active\" and \"constructive\" role in reviving US-North Korea diplomacy, underscoring its resolve to remain central to Korean peninsula negotiations. Two sources said Beijing would support all credible efforts leading to renewed dialogue, but Kim was likely to demand a high price, including sanctions relief and recognition of nuclear status, given strengthened ties with Russia. There has been discussion of a Trump-Kim meeting on the sidelines of the Apec summit in Shenzhen in November.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20SCMP/Once%20sidelined,%20China%20stands%20ready%20to%20broker%204th%20Trump-Kim%20handshake.pdf"}, {"id": "scmp-10sep-16", "title": "Power of Siberia 2 pipeline talks stall over China-Russia price dispute: sources", "source": "SCMP", "date": "10 Sep 2026", "tags": ["Energy", "Geopolitics"], "summary": "Negotiations between China and Russia over construction of the Power of Siberia 2 pipeline have stalled because both sides cannot bridge a large gap over gas price expectations, according to multiple sources. China hopes to secure a price comparable to Russia's subsidised residential rate of around US$50 per thousand cubic metres, or at least the domestic industrial rate of about US$120-130, while Russia wants to reference the existing Power of Siberia 1 price of about US$250-260. China's current average import price via Power of Siberia 1 is about US$258. The planned 2,600km pipeline is expected to carry 50 billion cubic metres of gas per year to China via Mongolia from the Arctic Yamal gas fields. Sources said both sides halted the decades-long negotiations over \"no progress on price\".", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20SCMP/Power%20of%20Siberia%202%20pipeline%20talks%20stall%20over%20China-Russia%20price%20dispute%20sources.pdf"}, {"id": "scmp-10sep-17", "title": "Purity of China quartz deposit 'highly similar' to US Spruce Pine standard: study", "source": "SCMP", "date": "10 Sep 2026", "tags": ["Technology & AI", "Trade"], "summary": "Geologists say they have identified a new deposit in central China that can yield high-purity quartz comparable to the quality produced at a world-leading mine in the United States. The Chinese quartz is described as having \"highly similar\" properties to resources from North Carolina's Spruce Pine, which is crucial to global production of solar panels and semiconductors. In the US, industry voices increasingly call for using high-purity quartz as a weapon against China's rare earths export ban. Chinese researchers say the newly explored Xiaohuaguo deposit near Shiyan in Hubei province could help cut reliance on US imports. The team, from institutions including the China University of Geosciences, published findings in the journal Earth Science, noting the purified sand was highly similar to Unimin's IOTA-CG type high-purity quartz sand.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20SCMP/Purity%20of%20China%20quartz%20deposit%20'highly%20similar'%20to%20US%20Spruce%20Pine%20standard%20study.pdf"}, {"id": "scmp-10sep-18", "title": "Singapore's DBS sued for US$1 billion in alleged 1MDB-linked claim", "source": "SCMP", "date": "10 Sep 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Singapore's DBS Bank is being sued for an estimated S$1.298 billion (US$1.03 billion) in damages linked to the multibillion-dollar 1MDB scandal, Southeast Asia's largest lender DBS Group said. The claimants include the liquidators of four companies: BlackRock Commodities (Global), Platinum Global Luxury Services, Affinity Equity International Partners and TKIL Global Investments. DBS on Wednesday rejected the claim and said it would fight it vigorously, adding it had made no provision for the lawsuit and offered no further details. The suit is the latest effort to recover money belonging to 1Malaysia Development Berhad, from which US investigators say about US$4.5 billion was stolen between 2009 and 2014. Liquidators previously sued Standard Chartered over related losses. DBS shares closed 0.8 per cent lower at S$77.50.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20SCMP/Singapore's%20DBS%20sued%20for%20US1%20billion%20in%20alleged%201MDB-linked%20claim.pdf"}, {"id": "scmp-10sep-19", "title": "Trump bans some Canadian goods, raises tariffs on others as trade war escalates", "source": "SCMP", "date": "10 Sep 2026", "tags": ["Trade", "Politics"], "summary": "US President Donald Trump on Tuesday escalated his trade war against Canada, banning imports of alcohol and various products and raising tariffs on others, with the conflict showing no sign of abating. Canadian Prime Minister Mark Carney stood firm, saying reducing economic ties with the US would come at a cost but the benefits would outweigh the pain. A range of Canadian products, from mattresses to motorboats and golf carts, will face a 50 per cent surcharge from September 15, while an import ban on alcoholic beverages and some dairy takes effect September 29. Canada's retaliatory tariffs, applying to C$27.6 billion (US$20 billion) in US imports including steel and aluminium, took effect earlier Tuesday. Trump pledged to restrict Canadian companies from securing US government contracts.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20SCMP/Trump%20bans%20some%20Canadian%20goods,%20raises%20tariffs%20on%20others%20as%20trade%20war%20escalates.pdf"}, {"id": "scmp-10sep-20", "title": "Trump says Iran war will end right after US midterm elections", "source": "SCMP", "date": "10 Sep 2026", "tags": ["Geopolitics", "Energy"], "summary": "US President Donald Trump on Wednesday predicted the war with Iran will end \"immediately after\" the American midterm elections in November, saying Tehran was trying to influence the vote but would not be able to hold out against US economic pressure. Trump's war with Iran has recently entered its seventh month with no immediate end in sight. On Wednesday, Iran said it attacked 10 ships near the Strait of Hormuz after the US sank five Iranian oil tankers. The renewed fighting sent benchmark Brent crude futures breaching US$100 a barrel for the first time since July. Trump's approval ratings recently sank to a record low amid frustration over the war and cost-of-living crisis. Midterm elections are due November 3. Trump said oil prices would fall after the election.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20SCMP/Trump%20says%20Iran%20war%20will%20end%20right%20after%20US%20midterm%20elections.pdf"}, {"id": "scmp-10sep-21", "title": "US drone ban proposal to combat China's dominance concerns American police, farmers", "source": "SCMP", "date": "10 Sep 2026", "tags": ["Technology & AI", "Politics"], "summary": "A US government proposal to restrict foreign-made drones has drawn rare bipartisan opposition, with law enforcement, farmers and utilities warning of significant consequences. Greg Reverdiau, an Arizona-based drone trainer and founder of Pilot Institute, said he reviewed over 3,800 comments submitted to the Federal Communications Commission and estimated about 98 per cent opposed the proposal or raised concerns. In July, the FCC outlined a plan prohibiting the importation and marketing of previously authorised foreign-produced drones and critical components meeting a new \"military-grade\" definition, citing national security risks amid efforts to reduce reliance on Chinese drone technology. The key conflict is the breadth of the definition, which covers drones with thermal imaging or Lidar widely used for search and rescue, factory inspections, mapping and farming.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20SCMP/US%20drone%20ban%20proposal%20to%20combat%20China's%20dominance%20concerns%20American%20police,%20farmers.pdf"}, {"id": "scmp-10sep-22", "title": "US sanctions Chinese-language Xinbi Guarantee marketplace over cyber scams", "source": "SCMP", "date": "10 Sep 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "The Trump administration sanctioned Chinese-language marketplace Xinbi Guarantee on Wednesday, along with two affiliated organisations, as part of a wider crackdown on transnational cybercrime. The US Department of Justice also seized Telegram channels and cryptocurrency wallets tied to the platform, which has over 650,000 users, freezing more than US$52 million in potentially laundered funds in a single day. Xinbi, which runs on Telegram, is accused of enabling scam centres to buy and sell illicit services targeting Americans. Singapore-based SafeW Technology and Cambodia-based Anwen Technology were also sanctioned for providing supporting applications. The Treasury said Xinbi's marketplace has processed the equivalent of over US$24 billion in digital assets and fiat currency since around 2022, primarily facilitating transactions in Southeast Asia.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/10%20Sep%202026/10%20Sep%20SCMP/US%20sanctions%20Chinese-language%20Xinbi%20Guarantee%20marketplace%20over%20cyber%20scams.pdf"}]}, "2026-09-11": {"date": "2026-09-11", "dayOfWeek": "Friday", "totalArticles": 94, "sourceCounts": {"WSJ": 25, "ST": 24, "BT": 21, "SCMP": 24}, "executiveDigest": "Oil broke out and dragged markets with it: BT reported 'oil surged 6%, with Brent and US crude both surpassing US$100 on more tanker attacks', as 'Saudi output slumped' and 'Houthis seized a strategic Yemeni port, threatening Red Sea exports'. The energy shock fed inflation - 'US producer prices topped expectations as energy costs jumped' - and rates followed: 'US mortgage rates topped 7% for the first time in 15 months', 'the ECB raised rates for a second time this year' (Lagarde called it a 'no brainer'), and 'stocks sank as the oil rally fanned inflation and rate-hike fears'. Iran showed 'a new appetite for escalation', producing ballistic missiles again and damaging US aircraft in Jordan. For Singapore, US bond turmoil 'could keep the Singdollar strong', the ringgit hit a 10-month low against it, and Grab is 'in talks to buy fintech Atome'.", "briefingCards": [{"title": "Lead story - Oil surges 6% past US$100 as Iran war escalates", "body": "The energy shock intensified: BT reported 'oil surged 6%, with Brent and US crude both surpassing US$100 on more tanker attacks', WSJ said 'Saudi oil output slumped as the Iran war and Houthi threats disrupted vital export routes', and 'Houthis seized a strategic Yemeni port, threatening Saudi oil exports through the Red Sea'. Iran hardened: WSJ said it 'shows a new appetite for escalation' with 'close calls on US warships', 'is producing ballistic missiles again', and an 'attack on a base in Jordan damaged American military aircraft'. Washington braced for a long war - 'Trump's top advisers confront the possibility the Iran war lasts through the end of his term' - and 'slapped new sanctions on networks aiding Iran's proxies'. US crude stockpiles fell even as 'production hit a record'."}, {"title": "Markets & finance", "body": "The oil spike rippled straight into rates: WSJ reported 'US mortgage rates topped 7% for the first time in 15 months', 'the ECB raised rates for the second time this year as resurgent energy prices reignited inflation concerns' (Lagarde called the hike a 'no brainer', with markets betting on more), and 'US producer prices increased as expected' - though SCMP noted PPI 'topped expectations as energy costs jumped'. Equities buckled: ST said 'stocks sank as the oil rally fanned inflation and rate-hike fears', and 'US existing-home sales hit their weakest pace in over a year'. All eyes turned to Friday's CPI, which 'could hinge the Fed's next move', while 'Warsh is talking like a hawk but may not be ready to deliver a hike'. Oracle's cloud sales 'beat on surging AI demand'."}, {"title": "Asia realignment", "body": "Pre-summit choreography advanced: SCMP reported 'tech, EV and aerospace executives will likely join Xi's US trip to mirror Trump's team', 'the US says China is on track to fulfil farm purchases ahead of Xi
