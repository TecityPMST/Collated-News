2026", "tags": ["Technology & AI", "Society"], "summary": "A US appeals court on Aug 10 allowed thousands of lawsuits to proceed against Meta, Google, TikTok and Snapchat over claims they designed products to be addictive to young users. The 9th US Circuit rejected an appeal by Meta and TikTok seeking to overturn a ruling requiring them to face over 3,000 federal lawsuits, saying the appeal was premature and that Section 230 provides a defence to liability, not immunity from suit. The court also denied Meta's bid to delay an Aug 12 trial brought by 29 state attorneys-general. The ruling follows a New Mexico judge ordering Meta to pay US$567 million into a teen mental health fund. Plaintiffs' attorneys called it Meta's last \"procedural off-ramp\". About 3,300 similar cases are consolidated in California state court.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/US%20court%20rules%20Meta,%20other%20tech%20firms%20must%20face%20thousands%20of%20lawsuits%20over%20social%20media%20addiction.pdf"}, {"id": "st-19", "title": "Ukraine's Zelensky says Russia readying more North Korean troops, missiles", "source": "ST", "date": "11 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Ukrainian President Volodymyr Zelensky said on Aug 10 that Russia was preparing to station more North Korean troops on its territory and had received additional ballistic missiles from Pyongyang. \"This is the first time they cannot wage war without supplements from North Korea,\" he said in his nightly address. Zelensky, who provided no evidence or timeframe, urged Japan and South Korea to supply air defence aid, saying Pyongyang's force grows stronger through combat experience. At the weekend he said a decision had been taken to deploy 30,000 to 50,000 North Koreans on Russian soil. North Korea has become a close Russian military partner since Putin and Kim Jong Un signed a mutual defence pact in June 2024, later using troops in the Kursk counteroffensive.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Ukraine's%20Zelensky%20says%20Russia%20readying%20more%20North%20Korean%20troops,%20missiles.pdf"}, {"id": "st-20", "title": "Ukraine, Moldova consider shipping grain by rail through Moldova, sources say", "source": "ST", "date": "11 Aug 2026", "tags": ["Trade", "Geopolitics"], "summary": "Ukraine is considering shipping grain by rail through Moldova as a more secure alternative to sea exports and has asked Chisinau for a low freight tariff, sources said on Aug 10. Black Sea exports via a security corridor to Romania have faced increased Russian attacks on ports and shipping. Kyiv is seeking a 50 per cent discount to route grain to Romania's Constanta port; Moldova countered by asking for volume guarantees. A former Moldovan Railways head said the corridor could carry 4.5 million tonnes annually, about 10 per cent of Ukraine's exports. Ukraine cut its 2026-27 grain export forecast to 38-40 million tonnes from 43 million due to port attacks. Moldova's premier said his country should not miss the transit revenue opportunity.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Ukraine,%20Moldova%20consider%20shipping%20grain%20by%20rail%20through%20Moldova,%20sources%20say.pdf"}, {"id": "st-21", "title": "What is Unitree and why are China's humanoid robot makers racing to list?", "source": "ST", "date": "11 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Chinese robot maker Unitree priced its Shanghai IPO at 150.8 yuan per share, with subscriptions from Aug 10, seeking to raise 6.1 billion yuan (S$1.2 billion) to become the first mainland-listed humanoid robot manufacturer. Founded in 2016 by Wang Xingxing, Hangzhou-based Unitree first became known for cheap quadruped robot dogs; its G1, H1 and R1 humanoids drew attention via viral demonstrations. Revenue rose more than fourfold to nearly 1.7 billion yuan in 2025, and it is profitable, with over 40 per cent of sales overseas. It competes with Tesla and Boston Dynamics and symbolises Beijing's push to dominate embodied intelligence. Rivals Leju Robotics and AgiBot are also pursuing listings, as heavy development spending drives makers to public markets.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/What%20is%20Unitree%20and%20why%20are%20China's%20humanoid%20robot%20makers%20racing%20to%20list.pdf"}, {"id": "st-22", "title": "Who is Iran's Mohsen Rezaei, the hardliner appointed to key security role?", "source": "ST", "date": "11 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "Iran appointed hardliner Mohsen Rezaei as secretary of its Supreme National Security Council, more than five months into the conflict with the United States, promoting a close ally of Supreme Leader Ayatollah Mojtaba Khamenei. Rezaei, 71, replaces Mohammad Baqer Zolqadr as second-in-command of the body chaired by President Masoud Pezeshkian. He commanded the Islamic Revolutionary Guard Corps from age 27 for 16 years, including most of the Iran-Iraq war, and served as vice president for economic affairs under Ebrahim Raisi. Appointed Khamenei's military adviser in March, Rezaei has voiced deep skepticism of negotiations and threatened the US, and accused Washington of violating the war-ending deal by creating Strait of Hormuz tensions. His Iran-Iraq war record remains controversial.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20ST/Who%20is%20Iran's%20Mohsen%20Rezaei,%20the%20hardliner%20appointed%20to%20key%20security%20role.pdf"}, {"id": "bt-01", "title": "Anthropic, Macquarie and GIC form venture for AI data centres", "source": "BT", "date": "11 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Anthropic has formed a strategic partnership with Macquarie Asset Management and Singapore's GIC to build data centres for the Claude developer. The new entity, Theseus Infrastructure, will develop AI computing sites \"with an initial focus\" in the US, the companies said on Aug 10. Macquarie and GIC pledged to fund the bulk of equity for each project, while Anthropic committed to covering any consumer electricity price hikes from the facilities. No spending or project-size details were shared. Anthropic has made relatively few splashy data-centre partnerships compared with rival OpenAI's Stargate venture. In 2025 it said it would spend US$50 billion on custom US data centres, and recently obtained a US$35 billion loan to lease chips at five sites, backstopped by Google.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/Anthropic,%20Macquarie%20and%20GIC%20form%20venture%20for%20AI%20data%20centres.pdf"}, {"id": "bt-02", "title": "BOJ flags upside price risks and possible faster interest rate hikes", "source": "BT", "date": "11 Aug 2026", "tags": ["Finance & Markets"], "summary": "The Bank of Japan flagged rising inflation risks in a summary of opinions from its Jul 30-31 meeting, with one of nine board members warning the pace of rate hikes could be \"faster than market expectations\". Another urged the BOJ to demonstrate determination to prevent upward inflation deviations, potentially with larger hikes. The bank held its policy rate at 1 per cent in July and signalled a possible September move, watching the weak yen's impact on prices and growth. The yen weakened to around 158.05 per dollar after the release. Overnight swaps show a two-thirds chance of a September move, and 96 per cent by October. Only Hajime Takata sought a back-to-back raise; governor Kazuo Ueda struck a hawkish tone.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/BOJ%20flags%20upside%20price%20risks%20and%20possible%20faster%20interest%20rate%20hikes.pdf"}, {"id": "bt-03", "title": "From shopping belt to business address - Orchard Road's corporate appeal is growing", "source": "BT", "date": "11 Aug 2026", "tags": ["Southeast Asia", "Finance & Markets"], "summary": "Orchard Road is developing a second identity as a business address, with a growing roster of corporate occupiers. Deloitte Singapore will relocate from Shenton Way's OUE Downtown to Orchard Central from 2027, joining firms such as UBS, which moved 3,000 staff to 9 Penang Road in 2021. Consultants say such moves are company-specific rather than a broad CBD exodus, but tight Grade A supply and firm rents are widening searches. Core CBD Grade A rents rose 0.8 per cent to S$12.50 psf in Q2, the sixth straight quarterly gain. Orchard holds about 5.2 million sq ft of office stock, one-sixth of the core CBD's 33 million. One Comcentre, redeveloping Singtel's headquarters, begins marketing in Q3 2026.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/From%20shopping%20belt%20to%20business%20address%20-%20Orchard%20Road's%20corporate%20appeal%20is%20growing.pdf"}, {"id": "bt-04", "title": "Gold touches US$4,400 as traders turn focus to US inflation data", "source": "BT", "date": "11 Aug 2026", "tags": ["Finance & Markets", "Energy"], "summary": "Gold advanced through US$4,400 an ounce ahead of a key US inflation report, after adding 3.6 per cent over the previous two sessions. Technical buying was spurred by the metal's ascent through the 100-day moving average on Aug 10, alongside dip-buying and stronger inflows from China's gold-backed ETFs. The consumer price index is seen rising 0.1 per cent in July after a 0.4 per cent June decline. Following Friday's weak jobs report, moderating prices could ease Fed inflation anxiety, though high energy prices may build pressure to raise rates. Oil held a three-day gain after Trump's new demands on Iran clouded a Hormuz deal. Spot gold rose 0.1 per cent to US$4,395.64; bullion remains about 17 per cent below pre-Iran-war levels.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/Gold%20touches%20US4,400%20as%20traders%20turn%20focus%20to%20US%20inflation%20data.pdf"}, {"id": "bt-05", "title": "How BYD disrupted Singapore's car market - and why the strategy is turning on itself", "source": "BT", "date": "11 Aug 2026", "tags": ["Southeast Asia", "Technology & AI"], "summary": "BYD's rise to Singapore's No 1 passenger-car seller was explosive, climbing from three registrations in 2020 to 11,184 in 2025, giving it 21.2 per cent of the market ahead of Toyota's 14.2 per cent. The writer, an NUS Business School vice-dean, uses the four-firm concentration ratio (C4) to argue BYD exploited a comfortable, high-C4 South-east Asian market long dominated by Japanese and German brands, pricing aggressively and selling from many suburban showrooms. Its proven in-house battery tech underpins 10-year warranties rivals struggle to match. But aggressive pricing lowers C4 and thins margins for all, including BYD, whose net profit fell 19 per cent in 2025. Chinese brands took 18.2 per cent of registrations in 2024, up from 5.9 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/How%20BYD%20disrupted%20Singapore's%20car%20market%20-%20and%20why%20the%20strategy%20is%20turning%20on%20itself.pdf"}, {"id": "bt-06", "title": "Meta loses last minute bid to pause landmark state AGs trial", "source": "BT", "date": "11 Aug 2026", "tags": ["Technology & AI", "Society"], "summary": "Meta Platforms failed to obtain an emergency order pausing a landmark trial involving claims from dozens of state attorneys general that the social media giant addicts children and fuels a youth mental health crisis. A Ninth Circuit panel ruled on Aug 10 it lacked jurisdiction to review Meta's early appeal and dismissed it. Meta must now defend against a possible US$1.4 trillion penalty request, with jury selection set for Wednesday in Oakland federal court and opening arguments on Aug 18. Meta had argued Section 230 shields it from addiction lawsuits. The company faces mounting legal attacks: it owes almost US$950 million in a New Mexico case and is midway through a Tennessee trial. School district trials begin February 2027.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/Meta%20loses%20last%20minute%20bid%20to%20pause%20landmark%20state%20AGs%20trial.pdf"}, {"id": "bt-07", "title": "Meta releases scaled-down AI model that consumers can use at home", "source": "BT", "date": "11 Aug 2026", "tags": ["Technology & AI"], "summary": "Meta Platforms introduced Muse Glimmer, a new AI model light enough to run on a single computer, letting users download and customise the technology. A distilled version of Muse Spark 1.2, the 30-billion-parameter model is \"small enough\" to need only one graphics card, handling agent-like tasks such as schedule management and file organisation. Its weights will be available on Hugging Face, with a Muse Spark version to follow. The permissive-licence move mirrors Chinese rivals such as DeepSeek, Moonshot and Alibaba. Meta, which with Amazon, Alphabet and Microsoft has committed more than US$2 trillion to AI capacity, is planning a cloud infrastructure business akin to AWS. It also said it will set up a US$1 billion fund for US communities hosting its data centres.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/Meta%20releases%20scaled-down%20AI%20model%20that%20consumers%20can%20use%20at%20home.pdf"}, {"id": "bt-08", "title": "Microsoft plans to unveil next-gen AI chip in September: report", "source": "BT", "date": "11 Aug 2026", "tags": ["Technology & AI"], "summary": "Microsoft plans to unveil its new Maia 300 AI chip this fall, potentially as soon as September, The Information reported on Aug 10. Having introduced its first Maia chip in November 2023, Microsoft has lagged Alphabet and Amazon in scaling in-house silicon as it seeks to cut reliance on Nvidia's costly processors. The company has been in talks with TSMC to secure capacity for more than 300,000 units for delivery in 2027, and ultimately aims for over one million chips, though supplies and negotiations could constrain plans. It also hopes to persuade major cloud customers such as Anthropic to adopt the chip. Microsoft unveiled its second-generation Maia 200 in January, built by TSMC on three-nanometer technology and packed with SRAM for speed.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/Microsoft%20plans%20to%20unveil%20next-gen%20AI%20chip%20in%20September%20report.pdf"}, {"id": "bt-09", "title": "Oil climbs 5% as Iran, US both demand compensation and Hormuz hopes fade", "source": "BT", "date": "11 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "Oil settled 5 per cent higher on Aug 10 after Iran and the US traded demands for compensation, dimming prospects for a deal to reopen the Strait of Hormuz. Iran also insists the US lift sanctions, while Trump said Iran must pay for \"all of the people that they have killed\". Brent settled up 4.99 per cent at US$87.72 a barrel and WTI up 5.05 per cent at US$82.13, the biggest percentage gains since Jul 29. Both benchmarks had fallen more than 7 per cent last week on hopes of an Iran-Oman deal. Houthis said they struck Saudi Aramco's Jazan refinery, whose 400,000-bpd restart was delayed to Aug 30. US Strategic Petroleum Reserve stocks fell to 298.7 million barrels, the lowest since January 1983.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/Oil%20climbs%205%20as%20Iran,%20US%20both%20demand%20compensation%20and%20Hormuz%20hopes%20fade.pdf"}, {"id": "bt-10", "title": "Prabowo taps Destry Damayanti as chief of Bank Indonesia to calm markets", "source": "BT", "date": "11 Aug 2026", "tags": ["Southeast Asia", "Finance & Markets"], "summary": "Indonesian President Prabowo Subianto nominated Destry Damayanti as sole candidate to head Bank Indonesia, a move to calm markets after Perry Warjiyo unexpectedly resigned in late July amid friction with the president. The rupiah extended gains after the Aug 10 announcement, strengthening 0.7 per cent against the US dollar to a one-month high and outperforming Asian peers. Destry, 62, the current acting governor and a senior deputy governor since 2019, was considered a front runner for her market credibility. Parliament, controlled by Prabowo's coalition, could consider candidates from Friday and is expected to approve swiftly. Analysts said the pick ensures policy continuity and eases central-bank independence concerns, with some expecting more dovish, liquidity-supportive policy under her.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/Prabowo%20taps%20Destry%20Damayanti%20as%20chief%20of%20Bank%20Indonesia%20to%20calm%20markets.pdf"}, {"id": "bt-11", "title": "Singapore raises 2026 growth forecast to 4.5-5.5%; Q2 growth revised up to 5.9%", "source": "BT", "date": "11 Aug 2026", "tags": ["Southeast Asia", "Technology & AI"], "summary": "Singapore's government upgraded its 2026 growth forecast to 4.5-5.5 per cent, up from 2-4 per cent, as an accelerating global AI investment boom lifts the trade-reliant economy. The Ministry of Trade and Industry said on Aug 11 the economy grew 6.1 per cent in the first half, with Q2 GDP revised up to 5.9 per cent from an advance 5.7 per cent estimate. Manufacturing surged 12.5 per cent on AI-related semiconductor demand; wholesale trade rose 8.3 per cent and finance 6.2 per cent, while F&B services contracted 1.5 per cent. MTI said fallout from the US-Israel-Iran conflict proved less severe than feared. Permanent secretary Beh Swan Gin dismissed over-reliance on AI and said the 12.5 per cent US tariff would not significantly hit Singapore.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/Singapore%20raises%202026%20growth%20forecast%20to%204.5-5.5%20Q2%20growth%20revised%20up%20to%205.9.pdf"}, {"id": "bt-12", "title": "Singapore's sovereign wealth funds are betting big on AI, but the central bank isn't so sure", "source": "BT", "date": "11 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Within three weeks in July, Temasek, GIC and MAS delivered divergent verdicts on AI. Temasek posted a record S$518 billion portfolio and 10.5 per cent return, planning to more than double AI exposure to up to 15 per cent by 2031 while building cash-yielding infrastructure and private credit. GIC lifted equities weighting to 56 per cent, named AI a core theme spanning enablers, monetisers and adopters, and backed Anthropic, Ramp and Eli Lilly while parking US$30 billion in hedge funds. MAS managing director Chia Der Jiun flagged the AI boom's sustainability as the biggest uncertainty facing an otherwise calm financial system. Up to 50 per cent of the three funds' returns flow to the budget via the NIRC, the government's largest revenue source.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/Singapore's%20sovereign%20wealth%20funds%20are%20betting%20big%20on%20AI,%20but%20the%20central%20bank%20isn't%20so%20sure.pdf"}, {"id": "bt-13", "title": "Sony, TSMC to invest US$6.4 billion in Japanese sensor plant: source", "source": "BT", "date": "11 Aug 2026", "tags": ["Technology & AI"], "summary": "Sony Group and TSMC are in talks to spend a combined one trillion yen (US$6.4 billion) on their planned image sensor factory in Japan, a person familiar said. The partners aim to begin production in 2029, though no time frame was given for the investment. TSMC and Sony Semiconductor Solutions are targeting demand for AI-wielding robots and self-driving cars, which need more sensors; in May they announced preliminary talks to add production lines within Sony's existing Kumamoto factory. An analyst called it a \"virtually risk-free investment\" that lowers Sony's capital burden while securing steady revenue for TSMC. Sony's shares rose as much as 2.2 per cent and TSMC's 1.7 per cent. Sony will control the new venture, with Japan's government considering financial support.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/Sony,%20TSMC%20to%20invest%20US6.4%20billion%20in%20Japanese%20sensor%20plant%20source.pdf"}, {"id": "bt-14", "title": "To avoid a 'graveyard of pilots', Seatrium gives AI projects 3 months to deliver", "source": "BT", "date": "11 Aug 2026", "tags": ["Technology & AI", "Southeast Asia"], "summary": "Seatrium gives selected AI proof-of-concepts just three months to show measurable business value before they are advanced to deployment or discontinued, an approach designed to avoid becoming a \"graveyard of pilots\", said digital SVP Lee Wey Lii. Success is measured not by pilots launched but by projects reaching live operations; pilots do not count toward the digital team's KPI. One workflow using OCR and AI to match equipment tags against engineering diagrams cut a 50-man-day task to two. Seatrium runs an AI council chaired by CEO Chris Ong, a shipyard \"digital twin\" on on-premise GPUs, and works with about 100 people on digital initiatives. Cybersecurity remains Lee's biggest concern. First-half net profit surged 158.3 per cent to S$372.9 million.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/To%20avoid%20a%20'graveyard%20of%20pilots',%20Seatrium%20gives%20AI%20projects%203%20months%20to%20deliver.pdf"}, {"id": "bt-15", "title": "Trump downplays talks with Warsh amid Fed independence doubts", "source": "BT", "date": "11 Aug 2026", "tags": ["Politics", "Finance & Markets"], "summary": "President Donald Trump played down the frequency of his conversations with Federal Reserve Chairman Kevin Warsh, raising fresh questions about whether he is seeking to directly influence the central bank. Trump insisted on Aug 10 he had spoken to Warsh only once \"briefly\" since Warsh joined the Fed, despite his own advisers and people familiar saying the talks occurred more often. National Economic Council director Kevin Hassett said last week the pair discuss the economy \"all the time\", though others described the calls as irregular. Trump hinted at his long-running desire for lower interest rates but said he backs Warsh \"100 per cent\", chalking up policy decisions to the Fed's board. Warsh was confirmed in May.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/Trump%20downplays%20talks%20with%20Warsh%20amid%20Fed%20independence%20doubts.pdf"}, {"id": "bt-16", "title": "Trump makes sweeping new demands on Iran as deal hopes dim", "source": "BT", "date": "11 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "President Trump made sweeping new demands on Iran after Teheran reiterated requests for reparations, dimming hopes of a quick deal to reopen the Strait of Hormuz as oil surged. Trump said he is \"demanding compensation from Iran\" for people killed and wounded, later expanding it to damages in Lebanon, Syria, Yemen and Gaza. The demands, almost certain to be rejected, come despite a June 14-point MOU that detailed a US$300 billion fund for Iran's post-war rehabilitation. Brent rose about 5 per cent to near US$88 a barrel; European diesel surged more than 10 per cent. Iran named hard-liner Mohsen Rezaee to head its Supreme National Security Council. Iran ties Hormuz's reopening to lifting the US naval blockade and compensation.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/Trump%20makes%20sweeping%20new%20demands%20on%20Iran%20as%20deal%20hopes%20dim.pdf"}, {"id": "bt-17", "title": "UK announces nearly £130 million funding for zero-emission vehicle technology", "source": "BT", "date": "11 Aug 2026", "tags": ["Environment", "Technology & AI"], "summary": "The British government announced nearly £130 million (US$175 million) in funding for zero-emission vehicle technologies on Aug 10, with almost £65 million in public money and the rest from industry. Nearly £50 million in government funding will go to auto firms and research partners to develop and scale zero-emission vehicle technologies, while a further £17 million is being injected into nine connected and automated mobility projects covering sensors, brake-by-wire systems and AI simulation. \"Britain invented the modern motor industry,\" Industry Minister Blair McDougall said, vowing the next generation of vehicles is designed and built there. Britain is committed to ending sales of new petrol- or diesel-only cars from 2030, with all new cars zero-emission by 2035.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/UK%20announces%20nearly%20130%20million%20funding%20for%20zero-emission%20vehicle%20technology.pdf"}, {"id": "bt-18", "title": "US dollar steadies after payrolls drop, yen falls", "source": "BT", "date": "11 Aug 2026", "tags": ["Finance & Markets"], "summary": "The US dollar steadied at a near two-month low on Aug 10 following Friday's soft jobs data, as investors awaited this week's inflation report for Fed clues. July data showed the US unexpectedly shed jobs with prior months revised sharply lower, cooling rate-hike expectations; futures put the chance of a September move at about 48 per cent, down from 67 per cent a week earlier. The euro was little changed at US$1.1555 and sterling steady at US$1.3501. The yen weakened 0.6 per cent to 158.89 per dollar, near its biggest daily drop in five months, after speculators slashed bearish bets by the most in over 12 years amid Japan-US intervention. The dollar index held at 99.70; Brent rose above US$85.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/US%20dollar%20steadies%20after%20payrolls%20drop,%20yen%20falls.pdf"}, {"id": "bt-19", "title": "Why Asean matters more than ever to the UK and Singapore", "source": "BT", "date": "11 Aug 2026", "tags": ["Trade", "Geopolitics"], "summary": "In this commentary marking Asean Day, the Acting British High Commissioner to Singapore argues the bloc matters more than ever to UK-Singapore ties. Three years after the UK-Singapore Strategic Partnership and five years as an Asean Dialogue Partner, bilateral trade tops S$48 billion and Singaporean investment in the UK nears S$590 billion. Singapore serves as a gateway to Asean's 680-million-person market, amplified by the UK's CPTPP accession; UK-Asean trade grew more than 17 per cent in a year. Cooperation spans defence via the Five Power Defence Arrangements, cyber defence, and green finance, including the Financing Asia's Transition Partnership aiming to mobilise up to S$7 billion. Singapore assumes the Asean chairmanship in 2027.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20BT/Why%20Asean%20matters%20more%20than%20ever%20to%20the%20UK%20and%20Singapore.pdf"}, {"id": "scmp-01", "title": "AgiBot overtakes Unitree as top global humanoid robot vendor in first half amid IPO push", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Research firm Smart Analytics Global says China's AgiBot overtook Unitree to become the world's largest humanoid robot vendor in the first half of 2026, capturing 44 per cent of the market after shipping roughly 8,400 units, a 562 per cent year-on-year surge. Hangzhou's Unitree slipped to second with 5,900 units and 31 per cent share, concentrated in its G1 model. Both firms are racing to list: Unitree priced its Shanghai Star Market IPO at 150.8 yuan to raise about 6.1 billion yuan (US$904 million), while AgiBot pursues a Hong Kong listing. Global humanoid shipments jumped 272 per cent to about 19,100 units, with Chinese makers supplying over 97 per cent. Industrial and commercial uses drove more than 70 per cent of demand.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/AgiBot%20overtakes%20Unitree%20as%20top%20global%20humanoid%20robot%20vendor%20in%20first%20half%20amid%20IPO%20push.pdf"}, {"id": "scmp-02", "title": "As China ups its basic research game, the US will have to look sharp", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "This opinion piece argues the Beidaihe summer retreat's guest list of scientists signals Beijing's strategic focus on basic research amid intensifying competition with the US. Party secretariat member Cai Qi greeted invited academics working in cutting-edge fields, while Premier Li Qiang signed revised intellectual property rules targeting chip design security. Nominal figures show the US spent US$993 billion on R&D in 2024 versus China's US$551 billion in 2025, but on purchasing-power-parity terms China reached parity in 2024 at about US$1.03 trillion. The White House's 2027 budget proposes a 4 per cent cut to non-defence R&D while raising defence R&D nearly 80 per cent. China produces 3.57 million STEM graduates annually against fewer than 820,000 in the US, and returning Chinese talent increasingly benefits Beijing.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/As%20China%20ups%20its%20basic%20research%20game,%20the%20US%20will%20have%20to%20look%20sharp.pdf"}, {"id": "scmp-03", "title": "As mainland China tightens its tax rules, can Hong Kong remain a magnet for billionaires?", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "As Beijing tightens offshore tax rules, analysts weigh whether Hong Kong can remain a magnet for the wealthy. In late July China said offshore trusts with mainland beneficiaries would face a 20 per cent personal income tax on gains dating to 2023, with a 90-day grace period for voluntary reporting. The city last year overtook Switzerland as the world's largest cross-border wealth hub, holding US$2.95 trillion, with over 60 per cent from mainland flows. Some fear disrupted capital flows, but Peking University's Tian Xuan said compliance would enhance long-term credibility. Hong Kong housed 76 billionaires worth US$328 billion in 2025 versus the mainland's 470 worth US$1.77 trillion. AI-driven IPOs are minting new tech fortunes the city hopes to keep serving.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/As%20mainland%20China%20tightens%20its%20tax%20rules,%20can%20Hong%20Kong%20remain%20a%20magnet%20for%20billionaires.pdf"}, {"id": "scmp-04", "title": "Can CATL's battery breakthrough push flying cars closer to a commercial reality in China?", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Technology & AI", "Energy"], "summary": "CATL, the world's largest EV battery maker, has backed flying cars after its aviation battery system cleared a major safety test verified by the Civil Aviation Administration of China. The Fujian-based firm said the pack is ready for mass production and will first power its Autoflight vehicles, using prismatic cells that isolate individual cells to stop heat spreading, with an energy density of 350 watt-hours per kilogram, 50 per cent above typical car batteries. China leads the eVTOL and \"low-altitude economy\" push, with seven manufacturers expected to begin deliveries this year. CATL led the global EV battery market with a 40.2 per cent share in early 2026, while Chinese firms held 72.6 per cent of the market between January and May, according to SNE Research.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/Can%20CATL's%20battery%20breakthrough%20push%20flying%20cars%20closer%20to%20a%20commercial%20reality%20in%20China.pdf"}, {"id": "scmp-05", "title": "China hits US, Mexican pecans with preliminary anti-dumping curbs", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Trade", "Geopolitics"], "summary": "China's Ministry of Commerce issued a preliminary ruling that the US and Mexico dumped pecans into its market, harming domestic producers. It set provisional cash deposits of 54.3 per cent on American firms and 51.6 per cent on Mexican firms, with six cooperating Mexican companies receiving lower rates of 17.8 to 23 per cent; no US producer participated. Dumped imports rose a cumulative 104.56 per cent over the injury period while their price fell 9.15 per cent. Measures take effect Tuesday, with 10 days for comments. The probe, launched in September 2025, was widely seen as retaliation for Mexico's tariff hikes of up to 50 per cent on about 1,400 product categories, imposed under US pressure to curb Chinese goods entering via the back door.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/China%20hits%20US,%20Mexican%20pecans%20with%20preliminary%20anti-dumping%20curbs.pdf"}, {"id": "scmp-06", "title": "China is building nuclear reactors faster than the West. Can it keep up the pace?", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Energy", "Environment"], "summary": "China is building nuclear reactors far faster and cheaper than Western rivals, adding 27 operational units since 2016 versus just two in the US, aided by standardised Hualong One and CAP1000 designs and state-backed loans as low as 1.5 per cent that roughly halve the levelised cost to about US$42 per megawatt-hour. It operates 62 units (66.1GW) with 58 more under construction, targeting 110GW by 2030 and on track to overtake US capacity. Yet nuclear supplies only about 5 per cent of electricity, and coastal sites face physical limits. Beijing is pursuing next-generation fast-neutron and thorium molten-salt reactors for inland use, while remaining 80 to 90 per cent reliant on uranium imports. Analysts remain divided on fusion's distant commercial viability.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/China%20is%20building%20nuclear%20reactors%20faster%20than%20the%20West.%20Can%20it%20keep%20up%20the%20pace.pdf"}, {"id": "scmp-07", "title": "China moves to join Brazil's WTO fight over Trump's forced labour tariffs", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Trade", "Geopolitics"], "summary": "China has asked to join WTO consultations Brazil opened against US tariffs of up to 37.5 per cent, telling the trade body in Geneva it holds a substantial commercial interest. Beijing argued Washington could apply comparable measures to Chinese goods and reiterated its long-running challenge to Section 301 of the US Trade Act. Brazil requested consultations on July 27 (case DS646) over a 25 per cent duty tied to digital-trade and Pix payment probes and a 12.5 per cent duty from a forced-labour inquiry covering 60 economies including China. The duties hit more than 23 per cent of Brazil's US exports. A Brazilian source called China's move \"a signal of support,\" but noted the dispute stays largely political while the WTO appellate body remains paralysed.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/China%20moves%20to%20join%20Brazil's%20WTO%20fight%20over%20Trump's%20forced%20labour%20tariffs.pdf"}, {"id": "scmp-08", "title": "China's banks look to unload more than US$8.2b in bad credit-card loans", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Finance & Markets"], "summary": "China's commercial banks have accelerated disposals of non-performing credit-card loans, with about 130 notices this year seeking buyers for more than 55 billion yuan (US$8.2 billion) of troubled debt as the slowing economy squeezes asset quality and margins. GDP growth fell to 4.3 per cent in the second quarter from 5 per cent. Between July 2 and August 5, lenders including China Everbright, Shanghai Pudong Development and Ping An Bank announced 20 disposal projects worth about 20.9 billion yuan. Everbright's 10.82 billion yuan portfolio held 443,019 written-off loans. Platinum-card holders made up over 80 per cent of principal in some batches, which a researcher attributed to diluted card tiers rather than wealthy defaults. Bank non-performing loans reached 3.7 trillion yuan, a 1.51 per cent ratio.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/China's%20banks%20look%20to%20unload%20more%20than%20US8.2b%20in%20bad%20credit-card%20loans.pdf"}, {"id": "scmp-09", "title": "China's top AI is still trained on Nvidia chips. What is delaying a switch to local tech?", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "China's most advanced AI models are still trained on Nvidia chips because switching to domestic semiconductors remains prohibitively costly, industry sources say, undermining Beijing's self-sufficiency drive. Nvidia's CUDA platform is the industry standard, while Huawei's rival CANN architecture requires extensive code rewriting; one researcher estimated migrating to Ascend chips would add at least 50 per cent in time and cost. For open-source models like DeepSeek, moving to Ascend might take a few engineers an extra month, but a weights-only model such as Moonshot's Kimi K3 could need ten engineers over six months. Kimi K3 was reportedly trained on Nvidia Blackwell chips. Some teams use local silicon: Meituan's 1.6-trillion-parameter LongCat-2.0 ran on a 50,000-card domestic cluster.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/China's%20top%20AI%20is%20still%20trained%20on%20Nvidia%20chips.%20What%20is%20delaying%20a%20switch%20to%20local%20tech.pdf"}, {"id": "scmp-10", "title": "China, India and Pakistan's dangerous nuclear triangle just became more complicated", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Analysts say the new Mecca defence pact among Pakistan, Turkey and Saudi Arabia complicates the volatile China-India-Pakistan nuclear triangle, chiefly by strengthening Islamabad's strategic position. The deal treats an attack on one as an attack on all. Strategist Brahma Chellaney said it institutionalises Saudi capital, Turkish defence technology and Pakistani geography, adding uncertainty to India's crisis planning. A stronger Pakistan, China's closest partner, keeps Indian attention split between western and northern fronts, suiting Beijing. Farwa Aamer said a stable Pakistan serves China's economic and geopolitical interests. Former Indian foreign secretary Kanwal Sibal warned Pakistan may grow more emboldened. Others, including Husain Haqqani, called the pact \"more symbolic than substantive,\" noting the absence of a shared enemy among the signatories.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/China,%20India%20and%20Pakistan's%20dangerous%20nuclear%20triangle%20just%20became%20more%20complicated.pdf"}, {"id": "scmp-11", "title": "Despite geopolitical tensions, China's rare earth producers have profitable first half", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "China's rare earth producers reported strong first-half profits despite Beijing's use of the minerals as trade leverage against the US and Japan. Shenzhen-listed China Rare Earth Resources and Technology's net profit surged 46.53 per cent to 237 million yuan (US$35.1 million), while China Northern Rare Earth expects profit growth of 112.74 to 121.33 per cent. Trump announced more than US$2 billion in domestic mining investment to diversify supply and signed a July 20 order limiting defence procurement waivers for Chinese minerals, but prices kept climbing, with an industry index up 31.7 per cent since August 2025 on AI-driven demand. Daiwa's Dennis Ip said Western de-risking is not eroding Chinese earnings and may reinforce Beijing's pricing power given its processing and magnet dominance.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/Despite%20geopolitical%20tensions,%20China's%20rare%20earth%20producers%20have%20profitable%20first%20half.pdf"}, {"id": "scmp-12", "title": "Enterprise AI costs hit 2026 low driven by price wars, Chinese open-source models: research", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Business costs to run AI models fell to a 2026 low, Jefferies said, citing Silicon Data's index showing average inference prices of US$1.16 to US$1.18 per million tokens from August 6-8, down from US$2.04 in May. A global price war and cheap Chinese open-source tools drove the drop. OpenAI cut GPT-5.6 rates by up to 80 per cent, while DeepSeek's V4-Flash-0731 costs US$0.03 per task and captured over 27 per cent of OpenRouter volume, overtaking Google. Yet sustaining low prices is hard: newer models from DeepSeek, Zhipu, MiniMax and Moonshot cost more than earlier ones, Zhipu's GLM-5.2 now charges US$1.40 input and US$4.40 output, and DeepSeek warned of a \"significant\" enterprise price hike as its V4-Flash strains server capacity.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/Enterprise%20AI%20costs%20hit%202026%20low%20driven%20by%20price%20wars,%20Chinese%20open-source%20models%20research.pdf"}, {"id": "scmp-13", "title": "Hong Kong's commercial property investment growth beats peer Asia-Pacific markets", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Finance & Markets"], "summary": "Hong Kong's commercial property investment more than doubled to US$3.1 billion in the second quarter, a 129 per cent year-on-year jump that made it Asia-Pacific's fastest-growing market, beating Singapore (108 per cent) and Australia (82 per cent), JLL said. A low base, receivership sales and strong retail and office deals drove the rebound, lifting first-half growth to 90 per cent. Deals included the HK$611.4 million sale of 299 Queen's Road Central and Wee Hur Holdings' HK$748.8 million purchase of One Bedford Place. Prime office rents, down over 40 per cent from 2019 peaks, are edging up. Region-wide investment rose 38 per cent to US$45.5 billion. But higher rates loom: the one-month Hibor hit 2.61 per cent versus 0.95 per cent a year earlier.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/Hong%20Kong's%20commercial%20property%20investment%20growth%20beats%20peer%20Asia-Pacific%20markets.pdf"}, {"id": "scmp-14", "title": "How China DRAM champion CXMT's MSCI entry could lure fund inflows, cement its top ranking", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "ChangXin Memory Technologies (CXMT), China's biggest DRAM maker, joined the MSCI China All Shares Index on Monday, a move analysts said would spur passive-fund buying and could make it the mainland's most valuable stock and the index's second-largest constituent behind Tencent. MSCI fast-tracked the mega-IPO ten days after CXMT's July 27 debut, when shares jumped 466 per cent, valuing it at 3.4 trillion yuan (US$504 billion). Shares fell 4 per cent to 50.40 yuan on Monday. VanEck could add CXMT to its semiconductor ETF as early as September. UBS, initiating coverage, expects CXMT's global DRAM bit-supply share to rise to about 10 per cent by 2028 from 7 per cent, with data-centre revenue eventually exceeding half of total sales.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/How%20China%20DRAM%20champion%20CXMT's%20MSCI%20entry%20could%20lure%20fund%20inflows,%20cement%20its%20top%20ranking.pdf"}, {"id": "scmp-15", "title": "How long can the AI memory price boom last? Research suggests not much longer", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "A run-up in memory-chip stocks is faltering as price growth cools, raising doubts over the boom's durability even with robust AI demand. Morgan Stanley warned the memory cycle enters its late stage in the fourth quarter as increases moderate and inventories build; shares of Micron, SK Hynix and SanDisk have retreated. Bernstein said conventional DRAM contract prices may rise about 17 per cent in the third quarter, down sharply from roughly 65 per cent in April-June. Chinese producers add supply: CXMT plans to nearly double DRAM capacity to 466,000 wafer starts by 2028, while YMTC gains NAND share. Still, JPMorgan expects shortages to persist two more years, and UBS sees DRAM undersupplied until at least the second quarter of 2028.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/How%20long%20can%20the%20AI%20memory%20price%20boom%20last%20Research%20suggests%20not%20much%20longer.pdf"}, {"id": "scmp-16", "title": "How the guest list for Beijing's summer retreat reveals its tech priorities", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Politics", "Technology & AI"], "summary": "China invited 60 scientific and academic experts to the annual Beidaihe retreat from August 1-7, and the 15 named by Xinhua reveal Beijing's tech priorities amid competition with the US. They span defence engineering, semiconductors, deep-sea equipment, AI, particle astrophysics and more, reflecting the 15th five-year plan's goal of \"self-reliance and strength in science and technology.\" Chip scientist Cai Shujun called the coming years critical for overcoming integrated-circuit \"chokepoints.\" Other invitees included protective-engineering pioneer Qian Qihu, deep-ocean drillship designer Zhang Haibin, and Tsinghua AI theorist Yuan Yang. On August 3, party fifth-ranking official Cai Qi urged them to secure \"decisive progress\" toward socialist modernisation by 2035. Xi Jinping has pushed for more spending on basic research.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/How%20the%20guest%20list%20for%20Beijing's%20summer%20retreat%20reveals%20its%20tech%20priorities.pdf"}, {"id": "scmp-17", "title": "Pakistan says 'purely defensive' Mecca accord is open to others", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Pakistan's Foreign Minister Ishaq Dar said the new Mecca Joint Defence Agreement with Saudi Arabia and Turkey is \"purely defensive in nature\" and open to other regional states, not directed at any country. Signed Friday by Crown Prince Mohammed bin Salman, President Erdogan and Prime Minister Shehbaz Sharif, it treats an armed attack on one as an attack on all, which Dar tied to Article 51 of the UN Charter. Turkish Foreign Minister Hakan Fidan said Egypt would likely join next, pending technical matters, adding one of the region's biggest militaries. The three bring differing strengths: Pakistan's nuclear arsenal, Saudi wealth and Turkey's defence industry. Islamabad analysts cautioned against equating the pact with Nato despite its collective-defence clause.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/Pakistan%20says%20'purely%20defensive'%20Mecca%20accord%20is%20open%20to%20others.pdf"}, {"id": "scmp-18", "title": "Powerful anti-drone laser spotted on PLA amphibious ship in South China Sea", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "China's most advanced laser weapon, the Liaoyuan-1 (LY-1), was spotted aboard the Type 071 amphibious ship Qilianshan during an August 1 PLA drill at Scarborough Shoal, analysts said, adding near-shore anti-drone defence. The directed-energy weapon, which debuted at last September's Victory Day parade, intercepts incoming missiles and drones as a last line of defence. Analyst Collin Koh said deploying the vessel on the PLA's founding anniversary sent a \"more forceful message\" to Manila and Washington, whose carrier USS George Washington is in the South China Sea. Tensions have flared, with China-Philippine vessels clashing three times in a week. Similar weapons appear on Type 075 and the new Type 076 \"drone carrier\" Sichuan. The drill also showcased H-6J bombers carrying YJ-12 anti-ship missiles.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/Powerful%20anti-drone%20laser%20spotted%20on%20PLA%20amphibious%20ship%20in%20South%20China%20Sea.pdf"}, {"id": "scmp-19", "title": "Russia says 13 killed in Ukraine drone attack on oil-refining city 900km from Moscow", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "Russian authorities said a Ukrainian drone attack on Nizhnekamsk, an oil-refining and petrochemical hub in Tatarstan about 900km from Moscow, killed at least 13 people, including a child, and injured 39, one of the heaviest civilian tolls in months. Ukraine's military said it struck the Taneco refinery, which processed 17 million tonnes of crude in 2024, and Nasa satellite imagery showed heat anomalies at the Nizhnekamskneftekhim plant. Kyiv has intensified strikes on Russia's oil-processing industry, hitting five refineries last week to bring the war's cost home to Russians and strain fuel supplies. Both sides reported deadly attacks over the weekend, with three killed in Kharkiv and five in Belgorod. Both deny targeting civilians. The war began in February 2022.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/Russia%20says%2013%20killed%20in%20Ukraine%20drone%20attack%20on%20oil-refining%20city%20900km%20from%20Moscow.pdf"}, {"id": "scmp-20", "title": "South Korea faces quandary over Ukraine's air defence system request", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "South Korea faces a dilemma over Ukrainian President Zelensky's request for air defence systems, which analysts say could strain ties with Russia and hurt Seoul's own defence. Zelensky warned that 30,000 to 50,000 North Koreans may be deployed to Russia, higher than his earlier estimate, and offered drone technology in return. Seoul cited legal limits on arms transfers to warring states and production constraints; its Cheongung-II system reportedly intercepted 96 per cent of missiles and drones for the UAE. Analyst Doo Jin-ho questioned the trade-off given strained Russia ties. Ukraine faces a critical shortage of US Patriot interceptors. About 6,000 North Korean troops sent to Russia have been killed or wounded, and analysts see friction between Kim Jong-un and Putin over further deployments.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/South%20Korea%20faces%20quandary%20over%20Ukraine's%20air%20defence%20system%20request.pdf"}, {"id": "scmp-21", "title": "The race for critical minerals is clearing the path for deep-sea mining", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Environment", "Geopolitics"], "summary": "This opinion piece warns the race for critical minerals is clearing the path for environmentally damaging deep-sea mining as US-China competition and corporate pressure stall safeguards. The International Seabed Authority's council ended two weeks of talks on July 31 without agreeing a \"mining code,\" pushing negotiations to March. More than 40 nations back a moratorium, with Vanuatu urging a pause until risks are understood. Canada-based The Metals Company is pushing to start commercial extraction in the Clarion-Clipperton zone, turning to US regulators since Washington rejects UNCLOS. Pacific islands, whose seabed minerals may be worth up to US$16 trillion, face conflict risks over fishing grounds, while Kiribati explores mining ties with China. The author calls the ISA a \"toothless tiger.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/The%20race%20for%20critical%20minerals%20is%20clearing%20the%20path%20for%20deep-sea%20mining.pdf"}, {"id": "scmp-22", "title": "Trump demands Iran pay compensation as hopes fade for Hormuz agreement", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "US President Trump demanded Iran compensate victims of attacks he blamed on Tehran, adding a condition to negotiations over reopening the Strait of Hormuz, after Iran sought damages for more than five months of US and Israeli strikes. Trump said he would put the demand \"into any, and all, future negotiations,\" citing victims of protests and the 2000 USS Cole bombing, though the FBI attributed that to al-Qaeda. He claimed US forces control the strait \"100 per cent\" and had mine-swept it. Iran's foreign ministry said Washington must compensate Tehran, lift sanctions, withdraw forces and release frozen assets before reopening. A ceasefire was agreed in April, but the US maintains a counter-blockade on Iranian ports. The two agreed a 14-point memorandum in June.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/Trump%20demands%20Iran%20pay%20compensation%20as%20hopes%20fade%20for%20Hormuz%20agreement.pdf"}, {"id": "scmp-23", "title": "Trump extends Jones Act waiver for 90 days, narrows scope", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Trade", "Energy"], "summary": "President Trump extended for 90 days a waiver letting foreign-flagged ships move oil and commodities between US ports, but narrowed it to require case-by-case review rather than blanket exemptions after shipbuilders and Congress complained the policy undermined the domestic maritime industry. The White House said the waiver, the longest suspension of the century-old Jones Act, ensures uninterrupted fuel access amid war-disrupted crude flows, having boosted domestic gasoline, diesel and jet-fuel deliveries. The law requires inter-port cargo on US-built, US-owned, US-crewed ships. Analysts said the waiver likely cuts petrol prices only pennies per gallon. The American Maritime Partnership welcomed the tighter review; about 208 exemptions were granted in roughly four and a half months. The Cato Institute urged permanent reform.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/Trump%20extends%20Jones%20Act%20waiver%20for%2090%20days,%20narrows%20scope.pdf"}, {"id": "scmp-24", "title": "US 'digging in' to Asia but wants 'partners not dependency': Pentagon", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Geopolitics", "Defence", "Southeast Asia"], "summary": "The US is not disengaging from Asia but \"digging in\" to keep a favourable balance of power in the Indo-Pacific, while wanting allies to shoulder more defence, Pentagon policy chief Elbridge Colby said in Manila. Seeking to counter doubts about Washington's reliability, he called for \"partnership, not dependency\" and \"partners, not protectorates.\" Colby said deterrence required a \"posture of deterrence by denial\" along the first island chain running from the Kuril Islands through Japan, Taiwan and the Philippines to Borneo, and pointed to growing US commitment. The Philippines, America's oldest Asian treaty ally, was the first stop on a trip also covering Indonesia, Thailand and Cambodia. He argued strong partners make deterrence strong.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/US%20'digging%20in'%20to%20Asia%20but%20wants%20'partners%20not%20dependency'%20Pentagon.pdf"}, {"id": "scmp-25", "title": "US does its robotics industry no favours by fencing it off from China", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Technology & AI", "Trade"], "summary": "This opinion piece argues Washington harms its own robotics industry by fencing it off from China. FCC chairman Brendan Carr added Chinese humanoid robots, quadrupeds and power inverters to the agency's Covered List, denying them US sales authorisation on cybersecurity grounds, though the order exempts the federal government. Chinese makers hold about 85 per cent of the global humanoid market, so there is little domestic industry to protect. The author contrasts China's protection-with-competition model, which built dominant EV and solar sectors, with sheltered, stagnant import-substitution economies. Chinese robot exports hit nearly 20 billion yuan (US$2.96 billion) in five months across 150 countries, with Unitree and AgiBot targeting Europe. US firms like Figure are capital-rich but production-poor. The piece files the ban under \"concessions.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/US%20does%20its%20robotics%20industry%20no%20favours%20by%20fencing%20it%20off%20from%20China.pdf"}, {"id": "scmp-26", "title": "Wave of US tariff refunds flows back to Chinese firms, buoying profits by millions", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Trade", "Finance & Markets"], "summary": "A wave of US tariff refunds is reaching Chinese companies, with over US$38 million plus interest paid to five listed firms in automotive and healthcare since last month, each averaging US$7.64 million, or 13 to 54 per cent of 2025 net profit. Zhejiang's Huahai Pharmaceutical received over US$14.2 million and Guizhou Tyre over US$11.98 million; more than a dozen mainland firms have applied. The refunds follow the US Supreme Court striking down Trump's sweeping duties in February; CBP had disbursed US$100 billion by end-July, about 60 per cent of US$166 billion collected. The payouts are straining US fiscal revenue, turning June net customs revenue to negative US$25.56 billion. Analysts expect Trump to roll out additional tariff measures.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/Wave%20of%20US%20tariff%20refunds%20flows%20back%20to%20Chinese%20firms,%20buoying%20profits%20by%20millions.pdf"}, {"id": "scmp-27", "title": "Why Taiwan is conducting its first-ever mobile network throttling exercise", "source": "SCMP", "date": "11 Aug 2026", "tags": ["Defence", "Society"], "summary": "Taiwan is conducting its first-ever mobile network throttling exercise to test public response to wartime communications disruptions, reducing 4G and 5G bandwidth for 30 minutes in central Taiwan on Monday and the north on Thursday, affecting about 17 million people, or 73 per cent of the population. Voice calls, SMS and emergency broadcasts continue, but data services like mobile payments and streaming may fail. Users complained it felt like a full blackout, and opposition KMT legislators said cutting bandwidth to 1 per cent amounted to a shutdown, disputing claims it followed international practice. Premier Cho Jung-tai called it \"network throttling, not an internet shutdown.\" Analysts urged greater use of LEO satellites. Beijing dismissed the drill as \"political theatre.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/11%20Aug%202026/11%20Aug%20SCMP/Why%20Taiwan%20is%20conducting%20its%20first-ever%20mobile%20network%20throttling%20exercise.pdf"}]}, "2026-08-12": {"date": "2026-08-12", "dayOfWeek": "Wednesday", "totalArticles": 85, "sourceCounts": {"WSJ": 20, "ST": 23, "BT": 22, "SCMP": 20}, "executiveDigest": "The Iran standoff turned kinetic: the US fired on a ship breaking its blockade, Iran vowed the Strait of Hormuz would 'stay closed' unless Washington met its terms, and WSJ said Iran is now defying pressure as a 'survival economy' - keeping oil climbing and the refinery squeeze acute. Singapore's momentum built: economists lifted 2026 growth forecasts beyond MTI's upgraded 4.5-5.5% range as MTI reports showed business AI use boosting revenue and jobs. The AI open-weight contest sharpened - Nvidia released a new open model and Meta moved to challenge China's lead - while the yen slid toward 160 per dollar.", "briefingCards": [{"title": "Lead story - US-Iran standoff turns kinetic", "body": "The blockade drew fire: WSJ reported the 'U.S. fires on a ship breaking its blockade of Iran', and an Iranian official said the Strait of Hormuz will 'stay closed unless the US meets Iran's conditions'. WSJ portrayed Iran defying pressure as a 'survival economy' under a 'mysterious ruler' signalling a hard line, and asked whether its 'Trump strategy' is 'dead or alive'; Pakistan, by contrast, said the US and Iran are 'close to a deal despite Trump rhetoric'. Markets kept pricing risk - oil 'continued to climb on US-Iran deal doubts' as stocks retreated, WSJ flagged 'the real oil squeeze is in refineries', and BT asked whether 'the Iran war has damaged US economic credibility'. Abu Dhabi's Adnoc L&S still posted record profit 'despite regional disruption'."}, {"title": "Markets & finance", "body": "Currencies and central banks dominated: the yen inched toward the key 160-per-dollar level as intervention concerns mounted, and WSJ asked 'will the yen need saving again soon?'. The RBA held rates but stayed 'worried about inflation', the Bank of Korea signalled more hikes, and US small-business confidence rose even as existing-home sales fell for a second month. Gold's breakout rally lifted Chinese bullion stocks as central banks kept buying, and 'resilient Europe' became a winning bet for money managers, though a Norway wealth-fund manager warned a 'fund collapse is not impossible'. In Singapore, DBS and OCBC shares could rise on Q2 while UOB drew asset-quality concerns, and Hsieh Fu Hua was named CapitaLand Investment deputy chairman."}, {"title": "Asia realignment", "body": "Friction hardened before a Xi-Trump summit: China hit US pecans with 54% levies, detained Japanese executives in a dual-use export probe, and a survey found US export controls are 'achieving no strategic gain but hurting American firms'. The US faulted China over 'opaque overseas lending' and emerging-market debt risk. Middle powers hedged - Australia and Vietnam boosted ties 'in a world becoming more uncertain', Thailand prepared to use military ties as leverage in US talks, and a new Hong Kong trade office in Malaysia was pitched as a Greater Bay Area bridge. Security signals grew: a China missile test 'deepened the Pacific divide', and Pakistan's 'Islamic Nato' pact put India 'on edge'."}, {"title": "Energy & climate", "body": "The Iran blockade kept crude bid and spotlighted refining - WSJ said 'the real oil squeeze is happening in refineries' - as ST profiled 'how China became the world's great oil power' and Adnoc L&S posted record profit. Samsung SDI bought GM's stake in a US battery JV, and Malaysia renewed a 10-year energy plan targeting about $27.5 billion in savings. Climate stress mounted: jellyfish forced three reactors offline at a French nuclear plant, low water on the Rhine began disrupting German industry, Europe's hot summer stunted Austrian crops, and SD Guthrie flagged El Nino hitting 2027-28 palm-oil output."}, {"title": "Technology & AI", "body": "The open-weight contest intensified: Nvidia released a new open model, WSJ explained 'why open-weight AI models matter and Meta benefits', and SCMP said Meta will 'challenge China's open-weight AI dominance amid US regulatory fears' - even as Meta moved to unwind a US$2 billion Manus AI deal after a Beijing block. Infrastructure names ran hot - CoreWeave's revenue doubled and Super Micro's profit surged - while Alibaba touted AI data centres 'built in 100 days at 10% lower cost' and a US$30 annual AI subscription. Leadership shifted as longtime OpenAI exec Brad Lightcap prepared to step down, and ST framed the tech sell-off as 'testing AI hype, but not the end of the infrastructure story'."}, {"title": "Singapore & SEA focus", "body": "Growth optimism firmed: BT reported 'economists are lifting 2026 forecasts beyond MTI's upgraded 4.5-5.5% range' on the AI boom, and MTI studies showed business AI use improving revenue and employment - and that non-stop flights to emerging markets could further boost the economy. Markets and policy were active: DBS and OCBC could climb on Q2 (UOB asset-quality watch), SGX is eyeing single-stock ETFs and tie-ups, OCBC opened retail platinum and palladium trading, and Keppel's telco unit won an IMDA subsea-cable licence. On the watch list, Beijing's offshore trust-tax changes 'could affect wealth hubs including Singapore', and talk of private and resale HDB markets 'decoupling' could spark a buyer frenzy."}], "keyMetrics": [{"value": "85", "label": "Articles curated today", "sub": "WSJ 20 · ST 23 · BT 22 · SCMP 20"}, {"value": "US fires on ship", "label": "Iran blockade turns kinetic", "sub": "Hormuz to 'stay closed'"}, {"value": "Climbing", "label": "Oil on deal doubts", "sub": "Squeeze hits refineries"}, {"value": ">4.5-5.5%", "label": "Economists lift SG 2026", "sub": "AI boom beyond MTI upgrade"}, {"value": "~160", "label": "Yen per US dollar", "sub": "Intervention concerns mount"}, {"value": "Open model", "label": "Nvidia releases; Meta pushes", "sub": "Challenging China's open weights"}], "articles": [{"id": "wsj-01", "title": "Abu Dhabi's Adnoc L&S Posts Record Quarterly Profit Despite Regional Disruption", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Finance & Markets", "Energy", "Geopolitics"], "summary": "Abu Dhabi-based maritime logistics firm Adnoc L&S, part of state oil giant Adnoc, reported record second-quarter net profit of $917 million for the three months ended June 30, up from $229 million a year earlier, despite the six-month Iran war disrupting Strait of Hormuz trade. Strong shipping rates, higher chartering activity and an expanded fleet drove earnings, aided by diversified operations and long-term Adnoc Group contracts. The company committed about $2.3 billion to vessel acquisitions and newbuilds this year within $5.7 billion of capital commitments. Lower utilization and reduced day rates hit its jack-up barge fleet. It raised full-year guidance a third time while warning results remain highly dependent on regional developments.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Abu%20Dhabi's%20Adnoc%20LS%20Posts%20Record%20Quarterly%20Profit%20Despite%20Regional%20Disruption.pdf"}, {"id": "wsj-02", "title": "CoreWeave Shares Jump as Revenue Doubles From Year Earlier", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Cloud-computing firm CoreWeave posted a fifth straight quarter of record revenue, reporting $2.58 billion for the June quarter, beating a $2.55 billion forecast, and a sales backlog of $104 billion, nearly double its November order book. Shares rose about 13% after hours from a $90.32 close. CoreWeave, 12.8% owned by Nvidia, buys Nvidia GPUs and leases them to Microsoft and OpenAI. It reported a net loss of $626 million, better than the $677 million expected, lifting cumulative losses near $2.3 billion. Investors focus on capacity constraints, heavy capital spending and construction delays. Executive Brannin McBee said, \"We're executing better than expected,\" adding capacity is effectively sold out this year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/CoreWeave%20Shares%20Jump%20as%20Revenue%20Doubles%20From%20Year%20Earlier.pdf"}, {"id": "wsj-03", "title": "Hanwha Offers to Buy Builder of U.S. Navy Ships", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Defence", "Trade"], "summary": "South Korea's Hanwha has made a nonbinding offer valued at more than $1 billion to buy Austal USA, a Mobile, Alabama builder of ships and submarine parts for the U.S. Navy and Coast Guard. Austal supplies submarine modules to General Dynamics Electric Boat for Virginia- and Columbia-class submarines, employs about 3,500 workers, and includes repair facilities in San Diego. Hanwha is expanding its U.S. commercial and military shipbuilding ambitions as President Trump seeks to revitalize domestic shipbuilding. The article also notes Trump extended for 90 days a waiver of the century-old Jones Act, which requires inter-port U.S. shipments use American-made vessels; 212 foreign-ship voyages have occurred since March 17.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Hanwha%20Offers%20to%20Buy%20Builder%20of%20U.S.%20Navy%20Ships.pdf"}, {"id": "wsj-04", "title": "Insurance Risks Remain High as Wildfire Threat Rises, Swiss Re Institute Says", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Environment", "Finance & Markets"], "summary": "The Swiss Re Institute said insured natural-catastrophe losses fell sharply to an estimated $42 billion in the first half of 2026, down from $91 billion a year earlier and the lowest first-half total since 2020, also 16% below the ten-year average. Total economic losses dropped to $100 billion from $152 billion. However, it warned wildfire is the fastest-growing weather peril globally, with record June heat raising European wildfire risk; European insured wildfire losses have risen 8% to 11% annually in real terms since 1970. Severe convective storms remained the biggest loss driver. It cautioned the long-term upward trend in insured losses is intact and second-half hurricane season could lift totals.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Insurance%20Risks%20Remain%20High%20as%20Wildfire%20Threat%20Rises,%20Swiss%20Re%20Institute%20Says.pdf"}, {"id": "wsj-05", "title": "Iran Is Defying U.S. Pressure by Becoming a 'Survival Economy'", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "President Trump is betting sanctions and a naval blockade will force Iran to concede, but Tehran is adopting time-tested survival measures: rationing goods, limiting foreign currency, slashing investment and shifting burdens onto households while preserving strategic imports. Analysts warn making Iran poorer is easier than changing its leaders' decisions, and that Tehran may keep escalating to raise costs over the Strait of Hormuz. Iran's oil exports fell to near zero in July after the blockade resumed, down from $4.5 billion in June; no tankers loaded at Kharg Island. Annual inflation exceeds 80%, with chicken up 190%. The IMF expects the economy to shrink 5.4% this year, risking millions of jobs.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Iran%20Is%20Defying%20U.S.%20Pressure%20by%20Becoming%20a%20'Survival%20Economy'.pdf"}, {"id": "wsj-06", "title": "Iran's Mysterious Ruler Signals a Hard Line on Trump With New Leadership", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "Iran's new supreme leader Mojtaba Khamenei, son of Ali Khamenei who was killed with security chiefs in February U.S.-Israeli strikes, signaled a hard line on Trump through a sweeping leadership overhaul on Sunday and Monday. Unseen publicly since the war began and reportedly injured, he named seasoned hard-liners to security posts. Mohsen Rezaei, former Revolutionary Guard commander, becomes secretary of the Supreme National Security Council and Khamenei's personal representative; Brig. Gen. Ahmad Vahidi leads the Guard and Hossein Taeb the Basij. Analysts said appointments reflect determination to resist concessions on Iran's nuclear program and the Strait of Hormuz. Rezaei, 71, rejects any Hormuz corridor Iran doesn't control; the council remains split on a deal.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Iran's%20Mysterious%20Ruler%20Signals%20a%20Hard%20Line%20on%20Trump%20With%20New%20Leadership.pdf"}, {"id": "wsj-07", "title": "Iran's Trump Strategy—Dead or Alive", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "The WSJ editorial board argues Iran's efforts to kill President Trump help explain why the U.S. is fighting. Officials now say Trump was smuggled off a plane in a catering container in July to avoid an Iranian threat, flown secretly out of Turkey on a military jet while reporters remained on a decoy presidential plane. The board recounts Tehran billboards depicting Trump in a coffin, clerical labels demanding his death, and a fatwa echoing the one against Salman Rushdie. It notes broken-up murder-for-hire plots by the Revolutionary Guard and a Pakistani national's March conviction. The board says Iran wants to run out the clock on Trump's presidency or hasten it with violence.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Iran's%20Trump%20Strategy-Dead%20or%20Alive.pdf"}, {"id": "wsj-08", "title": "Longtime OpenAI Exec Brad Lightcap to Step Down", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Technology & AI"], "summary": "Brad Lightcap, OpenAI's former chief operating officer, is stepping down, the latest leadership change at the artificial-intelligence lab. In a note to staff posted on X, Lightcap said he was leaving to \"start something new,\" adding he believes in OpenAI more than ever and will help advance its mission from a different vantage point. Lightcap joined OpenAI in 2018 and served as operating chief from 2022 before transitioning to a special-projects role in the spring, the Journal reported. His exit follows the departure of product and business chief Fidji Simo, OpenAI's second-ranking executive, who said last month she was stepping aside after taking medical leave in the spring.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Longtime%20OpenAI%20Exec%20Brad%20Lightcap%20to%20Step%20Down.pdf"}, {"id": "wsj-09", "title": "Mamdani Takes on Amazon in New Battle Over New York's Delivery Workers", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Society", "Politics"], "summary": "New York Mayor Zohran Mamdani on Monday backed a City Council bill, the Delivery Protection Act, that would force Amazon, FedEx and others to directly employ delivery workers instead of using subcontractors. Warehouse operators would need city licenses meeting new safety, training and employment rules, requiring thousands of contract couriers be hired. Mamdani cited a 2025 comptroller report finding injury-causing crashes rose in 78% of neighborhoods near last-mile facilities, and accused corporations of \"exploitative subcontracting.\" Amazon warned it could relocate warehouses and put over 5,000 subcontractor jobs at risk, citing average pay near $24 an hour and safety investments. New York could become the first city mandating such direct employment; New Jersey recently sued Amazon.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/12%20Aug%202026/12%20Aug%20WSJ/Mamdani%20Takes%20on%20Amazon%20in%20New%20Battle%20Over%20New%20York's%20Delivery%20Workers.pdf"}, {"id": "wsj-10", "title": "Nvidia Releases New Open Model", "source": "WSJ", "date": "12 Aug 2026", "tags": ["Technology & AI"], "summary": "Nvidia, a leading backer of open AI, released a new open model called Nemotron 3.5 Lightning on Tuesday, alongside Nemo Switchyard,
