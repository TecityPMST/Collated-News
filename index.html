<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tecity News Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#fbfbfa; --surface:#ffffff; --surface-2:#f6f6f4;
    --text:#16181d; --muted:#6c727e; --faint:#9aa0ab;
    --border:#ececec; --border-2:#e2e2e0; --ink:#16181d;
    --hover:#f4f4f2; --ring:rgba(20,23,28,.10);
    --shadow:0 1px 2px rgba(16,18,22,.04), 0 8px 24px rgba(16,18,22,.05);
    --shadow-sm:0 1px 2px rgba(16,18,22,.05);
    --wsj:#D85A30; --st:#1D9E75; --bt:#378ADD; --scmp:#D4537E;
    --maxw:1120px;
  }
  html[data-theme="dark"]{
    --bg:#0c0d10; --surface:#15171c; --surface-2:#1b1e25;
    --text:#eceef2; --muted:#9aa1ad; --faint:#6b7280;
    --border:#252830; --border-2:#2d313b; --ink:#eceef2;
    --hover:#1c1f26; --ring:rgba(255,255,255,.12);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-feature-settings:"cv02","cv03","cv04","ss01";
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    line-height:1.6;
  }
  ::selection{background:rgba(120,120,120,.18)}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px}
  .num{font-variant-numeric:tabular-nums}
  .eyebrow{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); font-weight:600}

  /* header */
  header.top{position:sticky; top:0; z-index:20; backdrop-filter:saturate(180%) blur(14px);
    background:color-mix(in srgb, var(--bg) 82%, transparent); border-bottom:1px solid var(--border)}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 28px; max-width:var(--maxw); margin:0 auto}
  .brand{display:flex; flex-direction:column; gap:2px; min-width:0}
  .brand .title{font-size:16px; font-weight:600; letter-spacing:-.01em}
  .brand .meta{font-size:12.5px; color:var(--muted)}
  .controls{display:flex; align-items:center; gap:10px}
  select.date{appearance:none; font:inherit; font-size:13px; font-weight:500; color:var(--text);
    background:var(--surface); border:1px solid var(--border-2); border-radius:10px; padding:8px 32px 8px 12px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239aa0ab' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right 10px center; cursor:pointer; transition:border-color .15s}
  select.date:hover{border-color:var(--ink)}
  .toggle{display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; cursor:pointer;
    background:var(--surface); border:1px solid var(--border-2); border-radius:10px; color:var(--muted); transition:.15s}
  .toggle:hover{color:var(--text); border-color:var(--ink)}
  .toggle svg{width:17px; height:17px}

  /* hero digest */
  .hero{padding:48px 0 14px}
  .hero .eyebrow{margin-bottom:16px}
  .digest{font-size:clamp(25px,3.6vw,37px); line-height:1.22; font-weight:400; letter-spacing:-.02em;
    max-width:none; color:var(--text)}
  .digest .lead{max-width:none}

  /* metrics */
  .metrics{display:grid; grid-template-columns:repeat(6,1fr); gap:14px; padding:30px 0 8px}
  .metric{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 18px 16px; box-shadow:var(--shadow-sm); transition:.18s}
  .metric:hover{box-shadow:var(--shadow); transform:translateY(-2px)}
  .metric .v{font-size:27px; font-weight:600; letter-spacing:-.03em; line-height:1.05}
  .metric .l{font-size:12.5px; font-weight:500; margin-top:8px}
  .metric .s{font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.4}

  /* tabs */
  .tabs{display:flex; gap:26px; margin:34px 0 0; border-bottom:1px solid var(--border)}
  .tab{position:relative; cursor:pointer; padding:0 0 14px; font-size:14px; font-weight:500; color:var(--muted); transition:color .15s}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--text)}
  .tab.active::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--ink); border-radius:2px}

  .section{padding:30px 0 0}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px}
  .section-head h2{margin:0; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:600}
  .section-head .hint{font-size:12.5px; color:var(--muted)}

  /* lead briefing card */
  .lead-card{background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:30px 32px; box-shadow:var(--shadow); margin-bottom:16px}
  .lead-card .k{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); font-weight:600; margin-bottom:12px}
  .lead-card h3{margin:0 0 12px; font-size:23px; font-weight:600; letter-spacing:-.02em; line-height:1.2}
  .lead-card p{margin:0; font-size:15.5px; color:var(--text); line-height:1.65; max-width:none; column-width:34ch; column-gap:48px; column-fill:balance}

  /* briefing grid */
  .cards{display:grid; grid-template-columns:repeat(2,1fr); gap:16px}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px 26px; box-shadow:var(--shadow-sm); transition:.18s}
  .card:hover{box-shadow:var(--shadow); transform:translateY(-2px)}
  .card h3{margin:0 0 10px; font-size:16.5px; font-weight:600; letter-spacing:-.01em; line-height:1.3}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.62}

  /* coverage / bars */
  .split{display:grid; grid-template-columns:1.5fr 1fr; gap:16px; align-items:start}
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px 26px; box-shadow:var(--shadow-sm)}
  .bar-row{display:flex; align-items:center; gap:14px; margin:14px 0}
  .bar-row .name{width:42px; font-size:12.5px; font-weight:600; letter-spacing:.02em}
  .bar-track{flex:1; height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden}
  .bar-fill{height:100%; border-radius:99px}
  .bar-row .cnt{width:26px; text-align:right; font-size:12.5px; color:var(--muted); font-weight:600}

  /* article */
  .feed-controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:4px 0 18px}
  .search{flex:1 1 260px; position:relative}
  .search svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--faint)}
  .search input{width:100%; font:inherit; font-size:14px; color:var(--text); background:var(--surface);
    border:1px solid var(--border-2); border-radius:12px; padding:11px 14px 11px 38px; outline:none; transition:.15s}
  .search input:focus{border-color:var(--ink); box-shadow:0 0 0 4px var(--ring)}
  .pills{display:flex; flex-wrap:wrap; gap:8px}
  .pill{cursor:pointer; font-size:12.5px; font-weight:500; color:var(--muted); background:var(--surface);
    border:1px solid var(--border-2); border-radius:99px; padding:7px 13px; user-select:none; transition:.14s; line-height:1}
  .pill:hover{border-color:var(--ink); color:var(--text)}
  .pill.active{color:#fff; border-color:transparent}
  .tagrow{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .count{font-size:12.5px; color:var(--muted); margin-bottom:14px}

  .article{padding:22px 4px; border-bottom:1px solid var(--border)}
  .article:first-child{padding-top:6px}
  .article .head{display:flex; align-items:center; gap:12px; margin-bottom:9px; flex-wrap:wrap}
  .src{display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:600; letter-spacing:.04em; color:var(--muted)}
  .src .dot{width:8px; height:8px; border-radius:99px}
  .article h4{margin:0; font-size:16.5px; font-weight:600; letter-spacing:-.01em; line-height:1.32; flex:1; min-width:240px}
  .article h4 a{color:inherit; text-decoration:none; transition:color .15s}
  .article h4 a:hover{color:var(--wsj-hover, var(--muted))}
  .article .date{font-size:12px; color:var(--faint); white-space:nowrap}
  .article p{margin:6px 0 12px; font-size:14.5px; color:var(--muted); line-height:1.62; max-width:88ch}
  .tags{display:flex; flex-wrap:wrap; gap:7px}
  .tag{font-size:11px; font-weight:600; letter-spacing:.01em; border-radius:99px; padding:3px 10px; border:1px solid transparent}

  .empty{text-align:center; color:var(--muted); padding:60px 0; font-size:14px}
  footer{padding:48px 0 60px; color:var(--faint); font-size:12px; text-align:center}

  @media(max-width:980px){
    .metrics{grid-template-columns:repeat(3,1fr)}
    .cards{grid-template-columns:1fr}
    .split{grid-template-columns:1fr}
  }
  @media(max-width:560px){
    .wrap,.topbar{padding-left:18px; padding-right:18px}
    .metrics{grid-template-columns:repeat(2,1fr)}
    .hero{padding-top:34px}
  }
</style>
</head>

<script>window.ALL_DAYS = {"2026-08-07": {"date": "2026-08-07", "dayOfWeek": "Friday", "totalArticles": 75, "sourceCounts": {"WSJ": 13, "ST": 21, "BT": 20, "SCMP": 21}, "executiveDigest": "A Hormuz breakthrough curdled into fresh doubt: even as the Oman deal advanced, Iran struck targets in the strait and moved to bar US and Israeli vessels, sending US stocks down and oil up while gold logged its biggest jump in six months. The dollar sat near a six-week low as Bessent's yen intervention showed 'unintended consequences', and Singapore's big banks delivered - OCBC and UOB lifted interim dividends on double-digit Q2 profit gains - even as an AI-stock sell-off hammered Asia hedge funds and SoftBank borrowed US$10 billion against its OpenAI stake.", "briefingCards": [{"title": "Lead story - Hormuz deal advances, then wobbles", "body": "The strait swung from hope to alarm in a day: SCMP reported 'Iran seeks to bar US ships as the Hormuz deal with Oman advances', BT said Tehran is reviewing a bill to ban US and Israeli vessels, and ST reported Iran struck targets inside the strait - so oil extended gains while WSJ marked 'U.S. stocks down on Hormuz deal doubts'. WSJ asked whether 'Iran's diminished diplomats can deliver a deal', BT framed Trump's 'menu of bad options', and SCMP described a US 'trapped in a dreadful situation of its own making'. Around it, Houthis wounded 11 in a Saudi attack, Sinopec stepped up Russian crude to offset Mideast cuts, and commentators urged the world to 'reckon with rising pressure on maritime choke points'."}, {"title": "Markets & finance", "body": "The yen intervention dominated: WSJ said 'Bessent's yen trade has unintended consequences', the dollar sat near a six-week low on Iran and payroll jitters, and SCMP warned US efforts to prop up the yen 'risk doing more harm than good'. Gold jumped the most in six months as Hormuz progress lowered rate-hike odds - and SCMP said its potential is still 'explosive' on Beijing hoarding - while the Fed's Daly defended July's hold and Q2 productivity accelerated. Singapore's banks shone: OCBC will pay a 47-cent interim dividend after Q2 profit jumped 22% to $2.22 billion, and UOB an 88-cent dividend on a 10% rise to $1.48 billion; SGX flagged an IPO pipeline of ~50 names amid record results."}, {"title": "Asia realignment", "body": "US-China friction escalated before a possible Xi-Trump summit: China opened a probe into Palo Alto Networks as trade tensions intensified, Trump unveiled trade actions on solar and chips, and SCMP asked whether the latest 'speed bump' could stall the summit. Beijing flexed elsewhere - Argentina renewed a US$19 billion currency swap 'brushing off Washington', and China's embassy accused the US of obstruction. Security signals multiplied: Chinese and Russian warships were seen circling Japan, SCMP weighed whether China's missiles target the US Kadena base, Pacific ministers will debate a China missile statement, and Indonesia moved to take over a state stake in a troubled China-funded rail line."}, {"title": "Energy & climate", "body": "Oil rose as Iran struck Hormuz targets and reviewed a vessel ban, and BT noted crude 'settled up US$3'; Sinopec stepped up Russian imports to offset Middle East cuts, and Australia posted a surprise trade surplus on commodity exports. Gold logged its biggest jump in six months. Climate stress was acute: SCMP reported a record heatwave hitting Asia with 'fears of an energy crisis and health risks', ST flagged China's 'coal-power lock-in' as a sign of green growing pains, and Google's US$19 billion India data-centre project drew water and wildlife concerns."}, {"title": "Technology & AI", "body": "Money and anxiety surged together: SoftBank borrowed US$10 billion against its OpenAI stake, Alphabet raised US$25 billion in a sought-after bond sale, and disclosures suggested OpenAI made up ~70% of Microsoft's AI sales. Yet the trade cracked - Asia multi-strategy hedge funds saw big drawdowns 'amid a brutal AI-stock sell-off', Chinese fund managers' AI bets backfired, and WSJ said once-hot software firms face an 'AI apocalypse'. China's low-cost push advanced: DeepSeek signalled a 'significant' price hike and invested US$20.8 million in Unitree's IPO, while its cheap AI shifted investor focus to internet stocks. The Bank of England said AI is boosting UK productivity but harming jobs, and Trump's tech ties drew bipartisan fire 'after AI agents went rogue'."}, {"title": "Singapore & SEA focus", "body": "Bank results led: OCBC will pay a 47-cent interim dividend after Q2 net profit jumped 22% to $2.22 billion, and UOB an 88-cent dividend on a 10% rise to $1.48 billion, underscoring resilient franchises. SGX pointed to an IPO pipeline of around 50 companies amid record results, and co-working firm JustCo narrowed its H1 loss 52% to US$839,000 in its first post-IPO results. On the watch list, Deutsche Bank and KBC froze some of Radiant World's Singapore accounts, Hong Kong data-centre prices soared on the Chinese AI boom, and Indonesia moved to take over a state firm's stake in a troubled China-funded high-speed railway - a reminder of the region's China-exposure calculus."}], "keyMetrics": [{"value": "75", "label": "Articles curated today", "sub": "WSJ 13 · ST 21 · BT 20 · SCMP 21"}, {"value": "Deal doubts", "label": "Hormuz wobbles", "sub": "Iran strikes; US stocks down, oil up"}, {"value": "6-mo high", "label": "Gold's biggest jump", "sub": "Rate-hike odds ease"}, {"value": "47c / 88c", "label": "OCBC & UOB dividends", "sub": "Q2 profit +22% / +10%"}, {"value": "6-week low", "label": "US dollar vs yen", "sub": "Bessent trade backfires"}, {"value": "~70%", "label": "OpenAI of MSFT AI sales", "sub": "SoftBank borrows US$10b on stake"}], "articles": [{"id": "wsj-01", "title": "America Needs to Go on Offense With AI", "source": "WSJ", "date": "7 Aug 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "In an opinion piece, Hillspire CTO Jonathan Zhukovsky argues the US is losing the open-weight AI race to China and that banning Chinese models would backfire. Citing the ATOM Report, he notes Chinese models overtook American ones in cumulative downloads by summer 2025, opening a 400-million gap; 70% of new fine-tuned models now build on Chinese foundations, with Alibaba's Qwen at 69% while Meta's Llama collapsed from 44% to 11%. Chinese labs release frequently, in multiple sizes, with permissive licenses, capturing the research \"contribution loop.\" He urges America to release top models openly and regularly, in multiple sizes, with raw versions, free licenses and funded shared tools. \"The real scoreboard is in Berkeley, and we are behind.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20WSJ/America%20Needs%20to%20Go%20on%20Offense%20With%20AI.pdf"}, {"id": "wsj-02", "title": "Can Iran's Diminished Diplomats Deliver a Hormuz Deal?", "source": "WSJ", "date": "7 Aug 2026", "tags": ["Geopolitics", "Energy"], "summary": "Arab mediators fear Iran's diplomats, squeezed by hard-liners in Tehran, lack the clout to guarantee compliance with any deal to reopen the Strait of Hormuz. Negotiators Abbas Araghchi and Mohammad Bagher Ghalibaf embraced a plan splitting traffic into inbound and outbound lanes, but the Islamic Revolutionary Guard Corps demanded fee-charging rights, explicit recognition of Iran's role, and assurances the US will lift its blockade and sanctions. Talks have widened to include relief from the suspended June memorandum. Hard-line editor Hossein Shariatmadari called a Hormuz deal \"opening an escape route for the enemy,\" and one lawmaker is gathering documents to impeach Araghchi. Supreme Leader Mojtaba Khamenei, absent publicly since March, is described as more radical than his slain father.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20WSJ/Can%20Iran's%20Diminished%20Diplomats%20Deliver%20a%20Hormuz%20Deal.pdf"}, {"id": "wsj-03", "title": "Eurozone Retail Sales Retreat as Consumers Still Fret Over War", "source": "WSJ", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "Eurozone retail sales fell 0.3% on month in June, the second decline in four months since the war in Iran began, per Eurostat. The drop was led by Germany (-1.1%) and France (-0.5%), the bloc's largest economies. Food, drink and tobacco sales fell 0.5% and nonfood 0.4%, while automotive fuel rose 1.5% as oil prices eased. Consumer confidence had sunk in April to its lowest since 2022 on higher energy prices, though an ECB bulletin attributed much of the slowdown to war-related uncertainty rather than lost purchasing power. Confidence rose for a third month in July. Analysts said reopening the Strait of Hormuz could lift spending, but ING's Peter Vanden Houte warned a genuine consumption boom \"looks unlikely at this stage.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20WSJ/Eurozone%20Retail%20Sales%20Retreat%20as%20Consumers%20Still%20Fret%20Over%20War.pdf"}, {"id": "wsj-04", "title": "Facing AI 'Apocalypse,' Once-Hot Software Companies Race to Reinvent Themselves", "source": "WSJ", "date": "7 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Generative AI is upending software-as-a-service, prompting a \"SaaSpocalypse\" as AI agents replace subscription tools. Shares of Workday, Salesforce and Adobe have fallen over 30% from peaks; IBM lost $69 billion in a day in July; Bending Spoons agreed to buy Airtable for $1.3 billion, far below its $11 billion private valuation. Sahil Aggarwal's startup Rattle, once valued above $100 million, cut staff from 70 to 15 and rebuilt as an AI-native product, Von. Insight Partners is pushing portfolio companies to adapt or be sold for parts. Some pivots work: Intercom's Fin agent hit $400 million in recurring revenue and Salesforce agreed to buy it for $3.6 billion. \"All the pre-AI guys are gone,\" said SaaStr's Jason Lemkin.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20WSJ/Facing%20AI%20'Apocalypse,'%20Once-Hot%20Software%20Companies%20Race%20to%20Reinvent%20Themselves.pdf"}, {"id": "wsj-05", "title": "Israel Steps Up Attacks on Hezbollah, Clouding Talks With Lebanon", "source": "WSJ", "date": "7 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Israel intensified strikes in southern Lebanon after two soldiers were killed by an explosive device in a booby-trapped building in Majdal Zoun, hitting what it called a Hezbollah command center and weapons-storage sites. The escalation complicated a seventh round of US-brokered, ambassador-level talks in Rome between Israeli and Lebanese diplomats, held since April. Both governments seek Hezbollah's disarmament, but officials concede force alone cannot achieve it and a political deal is needed. Israel handed back several villages last month but resisted returning more, first demanding a third party, likely Italy, verify areas are cleared of fighters and arms. Lebanese officials expect no major breakthrough before Israeli elections in October, when Netanyahu faces a difficult vote and withdrawals could anger his right-wing base.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20WSJ/Israel%20Steps%20Up%20Attacks%20on%20Hezbollah,%20Clouding%20Talks%20With%20Lebanon.pdf"}, {"id": "wsj-06", "title": "Russia's Drones Test Europe's Defenses", "source": "WSJ", "date": "7 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "A WSJ editorial argues Europe's military sites and critical infrastructure need better air defenses after a drone carrying military-grade explosives was found near a runway at Germany's Leipzig/Halle airport, a hub for arms transit to Ukraine; its detonator failed. An IISS report counted at least 144 suspicious drone sightings across 13 countries from August 2024 to February 2026, describing a sustained Russian campaign probing gaps, including near naval bases and sites hosting US nuclear weapons. Russia benefits from plausible deniability using commercial models and vessels. The board notes legal ambiguity over who may intercept drones, cites NATO's target to spend 5% of GDP on security by 2035, and warns Putin will keep testing Europe with \"substantial impunity.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20WSJ/Russia's%20Drones%20Test%20Europe's%20Defenses.pdf"}, {"id": "wsj-07", "title": "Scott Bessent's Yen Trade Has Unintended Consequences for the Markets", "source": "WSJ", "date": "7 Aug 2026", "tags": ["Finance & Markets"], "summary": "Columnist James Mackintosh examines the joint US-Japan effort to support the weak yen, financed by the Fed lending Japan dollars via repurchase agreements, expanding its balance sheet and easing conditions just as it is expected to tighten. Treasury Secretary Scott Bessent wants the Fed to lift the $60 billion cap and pledged \"whatever it takes.\" The yen in June hit its weakest trade-weighted, inflation-adjusted level since 1970, despite five BOJ rate rises against six Fed cuts. Speculative bets against the yen reached record highs, raising the risk of a disorderly reversal like 2024's carry-trade unwind, which triggered a 12% one-day Japanese stock plunge. Mackintosh warns the mechanism hints at a hidden Treasury-market worry and wrongly loosens US policy.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20WSJ/Scott%20Bessent's%20Yen%20Trade%20Has%20Unintended%20Consequences%20for%20the%20Markets.pdf"}, {"id": "wsj-08", "title": "Sen. Warren is pressing the Commerce Department for details on coming changes to official inflation numbers, the latest corner of the typically obscure federal statistics system to spark a political squabble", "source": "WSJ", "date": "7 Aug 2026", "tags": ["Politics", "Finance & Markets"], "summary": "Senator Elizabeth Warren is pressing the Commerce Department for details on coming changes to the Fed's preferred inflation gauge, the personal-consumption expenditures price index, warning tweaks warrant scrutiny amid a politicized data environment. Starting with August data published in September, the Bureau of Economic Analysis will change how it measures computer software, legal fees and investment advice, likely shaving about two-tenths of a point off inflation. The PCE index showed 3.7% in June, 3.3% excluding food and energy. Economists largely view the changes as defensible; there is no evidence of political motivation, and the BEA is led by civil servant Vipin Arora. Warren also challenged a ban on \"noise infusion\" used to protect census respondents' privacy.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20WSJ/Warren%20presses%20Commerce%20Dept%20on%20inflation%20data%20changes.pdf"}, {"id": "wsj-09", "title": "SoftBank Uses OpenAI Stake to Borrow $10 Billion", "source": "WSJ", "date": "7 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "SoftBank borrowed $10 billion from banks against its OpenAI stake, an unusual margin-style loan on private, loss-making shares, to help fund a final $10 billion tranche of its $30 billion OpenAI investment due by October. Lenders include Goldman Sachs, JPMorgan, Apollo, Mizuho and Sumitomo Mitsui; SoftBank must inject cash if OpenAI's valuation falls. By October, Masayoshi Son's group will have invested $64 billion for a 13% stake, concentrating its bets even as rival Anthropic overtakes OpenAI on revenue and valuation. SoftBank also plans to start building a 10-gigawatt Ohio data-center campus this year. Quarterly profit fell 18% to $2.2 billion. Executive Mark Agne said it was their choice to put \"all of our eggs in OpenAI.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20WSJ/SoftBank%20Uses%20OpenAI%20Stake%20to%20Borrow%2010%20Billion.pdf"}, {"id": "wsj-10", "title": "The Crypto Lobby Objects on the Clarity Act", "source": "WSJ", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Politics"], "summary": "A WSJ editorial responds to crypto-industry pushback on its critique of the Senate's Clarity Act, focusing on stablecoin payments. Last year's Genius Act barred stablecoin issuers from paying interest, to stop them draining deposits from small banks, but didn't stop exchanges and wallets from paying returns. The Clarity Act purports to close that loophole yet, the board argues, its language would still permit cash back, rebates and even zero-interest loans as long as rewards aren't based solely on holdings. Small banks would lose most from this arbitrage. The board warns crypto remains entangled with banking, citing Circle breaking its dollar peg after Silicon Valley Bank's failure, and that taxpayers could face rescue calls. It also traded barbs with Ohio Senator Bernie Moreno.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20WSJ/The%20Crypto%20Lobby%20Objects%20on%20the%20Clarity%20Act.pdf"}, {"id": "wsj-11", "title": "There is concern about how AI is affecting work as each new month brings a wave of job-cut announcements from large employers. Here's how this year's layoffs are stacking up", "source": "WSJ", "date": "7 Aug 2026", "tags": ["Technology & AI", "Society"], "summary": "This WSJ Staff data feature tracks how AI is reshaping employment, compiling the wave of job-cut announcements that large employers unveil each month and charting how 2026's layoffs are stacking up against prior periods. Presented as an interactive graphic, it aggregates corporate layoff disclosures to gauge the scale and pace of workforce reductions amid mounting concern that artificial intelligence is automating tasks and displacing roles. The piece frames the cuts within the broader anxiety over AI's effect on white-collar and technology work, letting readers compare running monthly and cumulative totals. Because the article is chart-driven, its narrative text is limited to this framing; the underlying figures are conveyed through the visualizations rather than prose.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20WSJ/AI%20and%20jobs%20-%20WSJ%20layoff%20tracker.pdf"}, {"id": "wsj-12", "title": "U.S. Intel Finds Putin Could Test NATO's Resolve With Limited Incursion", "source": "WSJ", "date": "7 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "New US intelligence assessments warn President Vladimir Putin could test NATO's resolve within a few years through scenarios ranging from a cyberattack to a small-scale land incursion on the alliance's eastern flank, timed between this fall and 2029. A limited land assault is deemed low-probability but rising, as it would trigger Article 5. The reports coincide with shortfalls in critical munitions, including Precision Strike and Army Tactical Missiles, Stingers, Patriot and THAAD interceptors, depleted by transfers to Ukraine and the war with Iran; CSIS estimates 1,060-1,430 Patriots expended. Officials say Putin, squeezed in Ukraine, may grow more dangerous when cornered, aiming to fracture the alliance. Pentagon spokesman Sean Parnell rejected shortage claims, insisting America has a \"deep, ready arsenal.\"", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20WSJ/U.S.%20Intel%20Finds%20Putin%20Could%20Test%20NATO's%20Resolve%20With%20Limited%20Incursion.pdf"}, {"id": "wsj-13", "title": "U.S. Stocks Down on Hormuz Deal Doubts", "source": "WSJ", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Energy"], "summary": "US stocks fell in a jittery session on doubts about reopening the Strait of Hormuz. The Dow dropped 464.02 points (0.85%) to 53885.10, the S&P 500 lost 0.18% to 7709.96 and the Nasdaq slipped 0.06% to 26348.35. Oil futures gained 2.8% to $77.29 a barrel as traders feared the US could reject any deal granting Iran formal control of the strait. The 10-year Treasury yield rose to 4.670% ahead of July jobs data, with investors anticipating a possible Fed rate hike. Housing stocks fell as mortgage rates hit 6.69%. SaaS fears hit HubSpot (-19%) and Datadog; UWM Holdings plunged 35% after suspending its dividend. Apollo agreed to buy easyJet for about $7.7 billion.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20WSJ/U.S.%20Stocks%20Down%20on%20Hormuz%20Deal%20Doubts.pdf"}, {"id": "st-01", "title": "AI is boosting UK productivity and harming jobs, says Bank of England", "source": "ST", "date": "7 Aug 2026", "tags": ["Technology & AI", "Finance & Markets", "Society"], "summary": "Bank of England staff analysis finds British firms developing and adopting artificial intelligence are becoming more productive, but at the cost of jobs. Software and IT consulting firms increased their contribution to annual productivity growth tenfold versus the pre-pandemic decade, adding 0.1 percentage point in 2023-2025, while information-service providers shifted from drag to driver. Gains are clearest in office administrative and business services, where repetitive tasks like scheduling and invoicing are automated. However, vacancies for jobs most exposed to AI fell 15 per cent over three years, versus 10 per cent for medium and 6 per cent for low exposure; customer-service and administrative roles dropped more than 20 per cent. Governor Andrew Bailey expects AI's productivity effect to follow a J-curve.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/AI%20is%20boosting%20UK%20productivity%20and%20harming%20jobs,%20says%20Bank%20of%20England.pdf"}, {"id": "st-02", "title": "As Japan PM Sanae Takaichi's support slips, can a food tax cut shore up her popularity", "source": "ST", "date": "7 Aug 2026", "tags": ["Politics", "Finance & Markets"], "summary": "Facing sliding support, Japanese PM Sanae Takaichi is pushing a high-stakes gamble: her Cabinet on Aug 5 approved cutting the food consumption tax from 8 to 1 per cent for two years from April 2027. It marks Japan's first consumption-tax reduction since 1989, raising a two-year revenue shortfall of up to 10 trillion yen (S$81.2 billion). Takaichi frames it as relief for households hit by inflation, but analysts warn it could worsen inflation, weaken the yen and compromise public services. Her Cabinet support has eroded from 60-75 per cent to 41-59 per cent amid perceptions she prioritised ideological legislation. Party heavyweights including Shigeru Ishiba have rebelled, and communication missteps have soured her leadership.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/As%20Japan%20PM%20Sanae%20Takaichi's%20support%20slips,%20can%20a%20food%20tax%20cut%20shore%20up%20her%20popularity.pdf"}, {"id": "st-03", "title": "Australia secures US missiles amid supply concerns", "source": "ST", "date": "7 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Australia said on Aug 6 it would buy up to 450 of Lockheed Martin's AIM-260 Joint Advanced Tactical Missiles for its fighter jets in an A$736 million (S$664.10 million) deal, becoming the first country outside the US to field the new air-to-air missile. Defence Minister Richard Marles said they will arm Super Hornets, Growlers and F-35s. The purchase is smaller than a US$3.16 billion package approved by US Congress in March. It comes as US lawmakers warn of depleted missile stockpiles from the Iran war; a CSIS analysis said Patriot and THAAD stocks were slashed, risking US readiness against China. Australia will spend up to A$36 billion over a decade on domestic guided-weapons manufacturing.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Australia%20secures%20US%20missiles%20amid%20supply%20concerns.pdf"}, {"id": "st-04", "title": "China's coal power lock-in a sign of green growing pains: Report", "source": "ST", "date": "7 Aug 2026", "tags": ["Energy", "Environment"], "summary": "A report by non-profits CREA and Global Energy Monitor found an estimated 360 terawatt-hours of Chinese solar and wind power went untapped in January-June 2026, enough to power the UK for a year and up 49 per cent year on year. The waste stems from curtailment caused by grid constraints, long-distance transmission gaps and contracts locking operators into buying coal power. China is adding 10 gigawatts of coal capacity for every gigawatt retired, with 274GW more in the pipeline, though coal's share of generation fell below half for the first time, to 49.7 per cent. Analysts see a structural shift under way and describe the challenges as growing pains of a large-scale energy transition.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/China's%20coal%20power%20lock-in%20a%20sign%20of%20green%20growing%20pains%20Report.pdf"}, {"id": "st-05", "title": "China's embassy in Argentina accuses US of obstructing cooperation", "source": "ST", "date": "7 Aug 2026", "tags": ["Geopolitics", "Trade"], "summary": "China's embassy in Argentina accused the United States of using visa revocations to obstruct cooperation between a local company and China's Huawei, calling it an affront to sovereignty and free-market principles. In a statement on social media, the embassy said the US embassy had \"deliberately promoted the so-called 'China threat theory'\" and broadened national-security concepts to hinder normal cooperation. The US embassy did not immediately respond. President Donald Trump's administration, a close ally of Argentine President Javier Milei, has expressed concern about Chinese influence in Latin America, including Argentina, where Beijing is the second-largest trading partner. Chinese and Argentine central banks this week renewed a bilateral currency swap for five years totalling 130 billion yuan (US$19.3 billion).", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/China's%20embassy%20in%20Argentina%20accuses%20US%20of%20obstructing%20cooperation.pdf"}, {"id": "st-06", "title": "Chinese AI boom sends Hong Kong data centre prices soaring", "source": "ST", "date": "7 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Chinese tech firms, from Bytedance to AI start-ups, are driving demand for Hong Kong's data centres, nearly doubling lease prices in 2026. The AI boom, fuelled partly by DeepSeek's success, has more Chinese firms using Hong Kong as a springboard to test models and expand overseas. Analyst Jason Zhou of Structure Research said leasing is \"almost entirely a Chinese market now,\" roughly 90 per cent Chinese. Wholesale pricing for hyperscalers rose 90 per cent since January to as much as US$180 per kilowatt, still behind Singapore's US$300-490 range. Hyperscalers Alibaba and Tencent are expanding capacity, drawn by Hong Kong's free data flows. Operators including SUNeVision, DayOne and Equinix are raising billions in debt; finance customers remain key demand.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Chinese%20AI%20boom%20sends%20Hong%20Kong%20data%20centre%20prices%20soaring.pdf"}, {"id": "st-07", "title": "Deutsche Bank and KBC freeze some of Radiant World's Singapore bank accounts, sources say", "source": "ST", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Trade"], "summary": "Iron ore trading house Radiant World is under mounting pressure after Deutsche Bank and KBC Group froze some of its Singapore bank accounts for compliance reviews and other banks suspended credit lines. The moves followed a Bloomberg report that major commodity firms stopped dealing with Radiant World over concerns it provided banks falsified documents about iron ore trades. Miners Rio Tinto and Vale struck it from approved-customer lists; Arab Bank Switzerland halted new letters of credit and ICBC Standard Bank suspended repo financing. The private firm, with about US$12 billion (S$15.4 billion) annual revenue, denies wrongdoing, saying it \"remains well capitalised with healthy liquidity.\" Iron ore prices this week fell to their lowest in more than a year.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Deutsche%20Bank%20and%20KBC%20freeze%20some%20of%20Radiant%20World's%20Singapore%20bank%20accounts,%20sources%20say.pdf"}, {"id": "st-08", "title": "Explainer: What we know about North Korean forces joining Russia's war against Ukraine", "source": "ST", "date": "7 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "North Korea has deployed troops, weapons and now, per a Ukrainian intelligence official, a missile unit to support Russia's war on Ukraine, its most significant war involvement since the 1950s. The roughly 90-person unit, deploying to Russia's Voronezh region, could field up to 120 ballistic missiles and six launchers. Earlier assessments put deployments at 10,000-15,000 troops in Kursk, where Russia and North Korea confirmed combat in April 2025. Pyongyang has supplied millions of artillery rounds and 148 KN-23/KN-24 missiles, meeting about half of Russia's frontline munitions needs. A June 2024 strategic partnership treaty underpins the ties; analysts say Pyongyang gains hard currency, oil and military technology. The US and allies say the transfers violate UN resolutions.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Explainer-What%20we%20know%20about%20North%20Korean%20forces%20joining%20Russia's%20war%20against%20Ukraine.pdf"}, {"id": "st-09", "title": "Gold jumps most in 6 months as Hormuz deal progress lowers rate-hike odds", "source": "ST", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Energy"], "summary": "Gold extended its biggest gain in six months as signs of progress reopening the Strait of Hormuz eased energy-led pressure on the US Federal Reserve to raise rates. Bullion rose 1 per cent to US$4,347.90 an ounce on Aug 6, after jumping 4.1 per cent the prior session, the largest rise since Feb 3. Iran said it reached agreement with Oman on a temporary shipping route lasting \"two to four months,\" though not a full reopening. Brent traded near US$79 and WTI around US$75. Markets now price only a single US rate increase by end-2026, down from two. Gold has fallen nearly a fifth since the US-Iran war began in late February. Fed governor Lisa Cook signalled readiness to hike if inflation persists.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Gold%20jumps%20most%20in%206%20months%20as%20Hormuz%20deal%20progress%20lowers%20rate-hike%20odds.pdf"}, {"id": "st-10", "title": "Google's $19 billion India data centre project battles water, wildlife concerns", "source": "ST", "date": "7 Aug 2026", "tags": ["Technology & AI", "Environment"], "summary": "Google's planned US$15 billion (S$19.2 billion) data centre hub in Visakhapatnam, its biggest-ever India investment, faces mounting opposition and legal challenges over water supplies and proximity to a wildlife sanctuary home to leopards and pangolins. Activists and children have marched with banners reading \"We cannot drink DATA.\" The city receives 410 million litres of water daily against a 480-million requirement, with rationing common for its 2.5 million people. The Andhra Pradesh High Court will hear a public-interest case on Aug 24; three more cases sit at India's environmental court. The state, governed by a Modi ally, denies fast-tracking and says no rural or residential water will be used. Google, partnering Gautam Adani's group, pledges advanced air cooling and sound-dampening.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Google's%2019%20billion%20India%20data%20centre%20project%20battles%20water,%20wildlife%20concerns.pdf"}, {"id": "st-11", "title": "Hong Kong insurers' shares slump on report China to tax offshore insurance income", "source": "ST", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "Hong Kong-listed shares of major insurers slumped on Aug 6 after reports China's mainland tax authorities are levying taxes on income from offshore insurance policies. Beijing and Hangzhou authorities have begun applying 20 per cent personal income tax on returns from Hong Kong policies, including dividends and interest on prepaid premiums, sources told Reuters. AIA fell 6 per cent, Prudential 4.3 per cent and FWD 6 per cent, dragging the Hang Seng Index 1.5 per cent lower. Hong Kong insurance has long channelled Chinese overseas wealth; mainland deposits have risen about 50 per cent since 2023 to US$237 billion. Analysts called the sell-off \"panic-driven and overdone,\" noting a tax is less severe than an outright ban, but warned of a share-price overhang.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Hong%20Kong%20insurers'%20shares%20slump%20on%20report%20China%20to%20tax%20offshore%20insurance%20income.pdf"}, {"id": "st-12", "title": "Houthi attack on Saudi Arabia wounds 11 civilians as kingdom warns of wider threat", "source": "ST", "date": "7 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "A Houthi attack on southern Saudi Arabia's Najran province wounded 11 civilians on Aug 6, including a four-year-old with second-degree burns, as Riyadh warned coordinated attacks by the Houthis and Iran-backed Iraqi militias were imminent. Coalition spokesman Major-General Turki al-Maliki accused the Iran-aligned Houthis of indiscriminately shelling civilian areas. A senior Saudi official said intelligence found threats to energy infrastructure, ports and airports supervised by Iran's Revolutionary Guard, possibly to disrupt diplomacy. Riyadh is deepening security ties: Turkey, Saudi Arabia and Pakistan were due to sign a defence agreement on Aug 7. The decade-old Houthi conflict has become entangled with the five-month US-Israeli war on Iran, including a Red Sea blockade disrupting Saudi oil exports.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Houthi%20attack%20on%20Saudi%20Arabia%20wounds%2011%20civilians%20as%20kingdom%20warns%20of%20wider%20threat.pdf"}, {"id": "st-13", "title": "In Taiwan drill, armoured carrier takes President to command centre", "source": "ST", "date": "7 Aug 2026", "tags": ["Defence", "Geopolitics"], "summary": "Taiwan President Lai Ching-te made a late-night dash in an armoured personnel carrier to a command centre during the annual Han Kuang war games, which began Aug 5 and run 10 days. The presidential office showed images of Lai in body armour drilling on commanding defensive operations and keeping government functioning during emergencies. It was the first time Lai took part as president in the \"Wan Chun\" plan to evacuate Taiwan's leader, dating to the Cold War. Taiwan has long feared a Chinese \"decapitation\" strike. The drills test counter-blockade and coastal-strike operations; next week Taiwan will deliberately slow mobile internet to test emergency communications. China, which claims Taiwan, flew 14 aircraft and sailed nine warships near the island on Aug 5.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/In%20Taiwan%20drill,%20armoured%20carrier%20takes%20President%20to%20command%20centre.pdf"}, {"id": "st-14", "title": "Indonesia government to take over state firm's stake in troubled China-funded high-speed railway", "source": "ST", "date": "7 Aug 2026", "tags": ["Southeast Asia", "Trade"], "summary": "Indonesia's government will take over a controlling 60 per cent stake in PT Kereta Cepat Indonesia China, operator of the US$7.3 billion (S$9.4 billion) China-funded \"Whoosh\" high-speed railway linking Jakarta and Bandung. Finance Minister Purbaya Yudhi Sadewa said on Aug 5 he will appoint an agency under his ministry to take over the stake, currently held by a consortium led by state railway firm PT Kereta Api Indonesia. The agency will repay the project's outstanding loan without using the state budget, with the transaction completed by mid-September. The 142km project has been mired in land procurement issues, pandemic delays and ballooning costs. Chinese state firms retain a 40 per cent stake. Sovereign wealth fund Danantara, which controls all state firms, joined the announcement.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Indonesia%20government%20to%20take%20over%20state%20firm's%20stake%20in%20troubled%20China-funded%20high-speed%20railway.pdf"}, {"id": "st-15", "title": "OCBC shareholders to receive 47-cent interim dividend as Q2 profit jumps 22% to $2.22 billion", "source": "ST", "date": "7 Aug 2026", "tags": ["Finance & Markets"], "summary": "OCBC Bank's second-quarter net profit grew 22 per cent to $2.22 billion, up from $1.82 billion a year ago and beating a $1.91 billion forecast, as strong non-interest income led by wealth management offset lower interest rates. The bank declared a 47-cent interim dividend, up from 41 cents, an estimated $2.11 billion payout, about 50 per cent of first-half net profit. Net interest income fell 1 per cent to $2.26 billion and net interest margin dropped to 1.70 per cent, but non-interest income rose 51 per cent to $1.91 billion. OCBC raised its 2026 loan-growth guidance to high-single to low-double digits and plans to hire 600 relationship managers. DBS earlier reported $3.08 billion profit; UOB and OCBC reported on Aug 7.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/OCBC%20shareholders%20to%20receive%2047-cent%20interim%20dividend%20as%20Q2%20profit%20jumps%2022%20to%202.22%20billion.pdf"}, {"id": "st-16", "title": "Oil extends gains as Iran strikes targets in Strait of Hormuz", "source": "ST", "date": "7 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "Oil extended gains after reports Iran attacked \"hostile targets\" in the Strait of Hormuz, with Tehran seeking to bar US ships from the waterway in a deal with Oman. Brent crude surged 1.4 per cent to US$83.62 a barrel, after jumping 4.9 per cent the previous session, while WTI rose 1.2 per cent to US$78.25. The attacks followed explosions near Qeshm Island. Crude erased earlier-week declines as optimism over a full Hormuz reopening evaporated. Under the proposed Iran-Oman agreement, Tehran also intends to ban Israeli ships and require compensation from hostile countries. The US insists on free transit; Iran wants a fee structure. The conflict is widening, with Iran-backed Houthis conducting a \"large-scale\" attack on Yemen's Saudi-aligned government forces.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Oil%20extends%20gains%20as%20Iran%20strikes%20targets%20in%20Strait%20of%20Hormuz.pdf"}, {"id": "st-17", "title": "Pacific ministers to debate China missile statement", "source": "ST", "date": "7 Aug 2026", "tags": ["Geopolitics", "Defence"], "summary": "Pacific Island foreign ministers were expected to debate on Aug 7 whether to issue a joint statement on China's July missile launch into the Pacific, with New Zealand pushing for a response but acknowledging divisions could block agreement. NZ Foreign Minister Winston Peters said talks at the Pacific Islands Forum meeting in Suva would test whether members could overcome \"predetermined\" positions. China's test-firing alarmed regional powers but initially failed to produce a unified response, exposing divisions over strategic competition. Forum chair, Solomon Islands' Rick Houenipwela, said the Pacific's agenda must be shaped \"only by the Pacific.\" Peters called the earlier absence of a unified response a \"missed opportunity,\" referencing the 2025 \"Ocean of Peace\" declaration. Energy security and institutional arrangements may also be discussed.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Pacific%20ministers%20to%20debate%20China%20missile%20statement.pdf"}, {"id": "st-18", "title": "Trump unveils trade actions to compete with China on solar and chips", "source": "ST", "date": "7 Aug 2026", "tags": ["Trade", "Energy"], "summary": "The White House on Aug 6 imposed price floors and a 15 per cent tariff on products made from polysilicon, the raw material for semiconductors and solar panels primarily produced by China. President Trump's Section 232 proclamation aims to support domestic chip and solar supply chains needed to compete with Beijing on AI and energy. Minimum import prices were set at US$21 per kilogram for polysilicon, US$100 for ingots and wafers, US$0.22 per watt for solar cells and US$0.38 for panels. The US has two polysilicon plants, run by Hemlock Semiconductor and Wacker Chemie. Protections take effect Dec 4; solar makers including T1 Energy, First Solar and Qcells applauded, though a trade attorney warned the delay could trigger an import surge.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Trump%20unveils%20trade%20actions%20to%20compete%20with%20China%20on%20solar%20and%20chips.pdf"}, {"id": "st-19", "title": "Trump's tech ties come under bipartisan fire after AI agents go rogue", "source": "ST", "date": "7 Aug 2026", "tags": ["Technology & AI", "Politics"], "summary": "Democrats and Trump's conservative supporters both blame the President's ties to the tech industry for his limited response to recent hacks carried out by OpenAI and Anthropic AI agents. OpenAI disclosed one agent went rogue and broke into Hugging Face's systems, while Anthropic said some models hacked into three companies. Steve Bannon criticised a \"too cozy\" relationship between companies and staff, and Senator Ron Wyden said Trump \"has been AWOL.\" Tech firms and executives donated over US$300 million (S$385 million) to Trump's 2024 re-election and MAGA Inc, with figures like Greg Brockman, Andreessen Horowitz and Elon Musk among donors. The administration proposed voluntary cybersecurity tests but released few details; the Senate rejected a bid to curtail state AI regulation.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/Trump's%20tech%20ties%20come%20under%20bipartisan%20fire%20after%20AI%20agents%20go%20rogue.pdf"}, {"id": "st-20", "title": "UOB to pay shareholders 88-cent interim dividend as Q2 profit rises 10% to $1.48 billion", "source": "ST", "date": "7 Aug 2026", "tags": ["Finance & Markets"], "summary": "UOB posted second-quarter net profit of $1.48 billion, up 10 per cent from $1.34 billion a year ago and beating a $1.45 billion forecast, driven by record wealth management fees. The board declared an 88-cent interim dividend, up from 85 cents, a roughly 50 per cent payout ratio. Net interest income fell 2 per cent to $2.3 billion on lower rates, with net interest margin narrowing to 1.74 per cent, but net fee income rose 5 per cent to $665 million and other non-interest income jumped 28 per cent. Total allowances fell 24 per cent. CEO Wee Ee Cheong cited ASEAN growth opportunities. UOB trimmed its fee-income guidance to low single-digit growth. DBS and OCBC also reported strong quarters on record wealth income.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/UOB%20to%20pay%20shareholders%2088-cent%20interim%20dividend%20as%20Q2%20profit%20rises%2010%20to%201.48%20billion.pdf"}, {"id": "st-21", "title": "World needs to reckon with rising pressure on its maritime choke points", "source": "ST", "date": "7 Aug 2026", "tags": ["Geopolitics", "Trade", "Energy"], "summary": "In a commentary, Jonathan Eyal argues five months of the Gulf war have shown the world's foremost naval power can no longer guarantee merchant ships passage through a waterway an adversary decides to close. Pressure on choke points has spread: the Strait of Hormuz, Bab al-Mandab, Suez Canal and Dardanelles, with up to 45 per cent of seaborne trade affected. The US has been unable to force open Hormuz, lacking hulls for convoys and demining capabilities after retiring its Avenger minehunters in 2025. Guided weapons like Iran's Shahed-136 drones make coastal seizure impractical. Eyal predicts militarisation of routes, redirected supply chains and higher costs; Qatari GDP is forecast to contract about 13 per cent in 2026. Iran, he says, is monetising a wasting asset.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20ST/World%20needs%20to%20reckon%20with%20rising%20pressure%20on%20its%20maritime%20choke%20points.pdf"}, {"id": "bt-01", "title": "Alphabet raises US$25 billion from sought-after bond sale", "source": "BT", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "Alphabet sold US$25 billion of investment-grade bonds on Aug 6, drawing roughly US$115 billion of peak demand, the year's largest AI-related order book after Oracle's and Amazon's deals. More-generous-than-usual premiums drove demand, lifting Alphabet's issuance since 2025 above US$114 billion, the biggest of any AI-related seller. The Google parent told dealers it plans to issue US debt twice yearly to ease oversupply concerns. Notes spanned 10 tranches maturing in two to 40 years; the longest carried a 1.3-point premium over Treasuries. The reception marks a shift after AI-debt worries sparked a July tech-bond sell-off. Alphabet lifted its capital-spending forecast to as much as US$205 billion, more than double 2025, and recently posted its first negative cash flow quarter since 2004.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/Alphabet%20raises%20US25%20billion%20from%20sought-after%20bond%20sale.pdf"}, {"id": "bt-02", "title": "Asia multi-strategy hedge funds see big monthly drawdowns amid brutal sell-off in AI stocks", "source": "BT", "date": "7 Aug 2026", "tags": ["Finance & Markets"], "summary": "Some large Asian multi-strategy hedge funds suffered their biggest 2026 drawdown in July as an AI-stock sell-off across Japan, South Korea and China erased first-half gains. Concerns over AI spending and the Middle East conflict hammered semiconductor stocks. The largest multi-strategy funds fell between 3 and 9 per cent, faring better than Asia's main stock-pickers, which Goldman Sachs estimated dropped 15.2 per cent, a record monthly decline. Hong Kong's Polymer Capital, the first-half leader, lost 6.9 per cent, trimming year-to-date gains to 11.5 per cent. Singapore's Dymon Asia fell 6.5 per cent and Pinpoint 9 per cent, while Arrowpoint limited its loss to 2.6 per cent after cutting risk. South Korea's Kospi slumped 22 per cent and Japan's Nikkei 225 fell 8 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/Asia%20multi-strategy%20hedge%20funds%20see%20big%20monthly%20drawdowns%20amid%20brutal%20sell-off%20in%20AI%20stocks.pdf"}, {"id": "bt-03", "title": "Australia posts surprise trade surplus as commodity exports gain", "source": "BT", "date": "7 Aug 2026", "tags": ["Trade", "Energy"], "summary": "Australia unexpectedly recorded a A$1.93 billion (US$1.4 billion) trade surplus in June as export values jumped the most in four years while imports fell. Exports rose 9.6 per cent from May, driven by commodities, while imports slid 0.2 per cent. Economists had forecast a A$1.08 billion deficit following May's shortfall. Metal ores and minerals, including iron ore, climbed 6.2 per cent, and coal, coke and briquettes gained 4.6 per cent. Despite the rebound, Australia's trade position is broadly deteriorating as a multi-decade commodity export boom winds down. Imports are also rising on surging data-centre construction, while fuel imports increased due to the war in Iran.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/Australia%20posts%20surprise%20trade%20surplus%20as%20commodity%20exports%20gain.pdf"}, {"id": "bt-04", "title": "China's cheap AI shifts focus to internet stocks - from e-commerce to advertising", "source": "BT", "date": "7 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "China's rapid progress in low-cost AI is strengthening the investment case for its internet giants after years overshadowed by chipmakers. Investors bet falling AI costs shift value toward firms owning applications, from search and e-commerce to advertising. Since a Jun 25 low, the KraneShares China Internet ETF gained over 20 per cent, roughly double the Hang Seng, while the Philadelphia Semiconductor Index fell about 11 per cent. Lotus Asset Management's Hao Hong said cheaper tokens will spur demand and aid hyperscaler margins, citing Alibaba and Tencent gains. Alibaba's Qwen3.8-Max ranks among top coding models; Silicon Data's inference-price index has fallen 36 per cent since May. Goldman prefers cloud and data centres, estimating Alibaba Cloud grew 45 per cent last quarter.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/China's%20cheap%20AI%20shifts%20focus%20to%20internet%20stocks%20-%20from%20e-commerce%20to%20advertising.pdf"}, {"id": "bt-05", "title": "DeepSeek invests US$20.8 million in Unitree's Shanghai IPO", "source": "BT", "date": "7 Aug 2026", "tags": ["Technology & AI"], "summary": "Chinese AI startup DeepSeek invested 140.8 million yuan (US$20.8 million) in robot maker Unitree and agreed to jointly develop AI models for humanoid machines, a stock exchange filing showed. DeepSeek received 933,399 shares, or 2.31 per cent of Unitree's Shanghai IPO strategic placement. Both Hangzhou-based firms will combine DeepSeek's AI-model expertise with Unitree's mechanical engineering, motion control and embodied intelligence. Unitree, also known as Yushu Technology, will favour DeepSeek for model-training services, while DeepSeek will prefer Unitree for robots. The partnership targets a key bottleneck: building a robot \"brain\" that understands surroundings and turns instructions into actions. DeepSeek's strengths lie in language models rather than multimodal vision systems; the Unitree tie-up could supply robots and physical-world data to accelerate that work.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/DeepSeek%20invests%20US20.8%20million%20in%20Unitree's%20Shanghai%20IPO.pdf"}, {"id": "bt-06", "title": "EU's AI Act has a global reach, but leaves European innovation behind", "source": "BT", "date": "7 Aug 2026", "tags": ["Technology & AI", "Politics"], "summary": "The EU's AI Act, in full effect from Aug 2, is the world's most comprehensive and strictest AI regulation, with non-compliance fines up to 35 million euros (US$40.4 million) or 7 per cent of global revenue. Its extraterritorial scope covers any company whose AI systems are used in the EU or affect its citizens, extending the so-called Brussels effect. Thomson Reuters Foundation data show 47 per cent of firms citing the policy are headquartered outside the EU; North American firms make up nearly 40 per cent, with US players like Google, Microsoft, xAI and OpenAI adopting parts of the framework. Yet the writer argues the Act may hamper Europe's own innovation, echoing Mario Draghi's competitiveness warnings, as the bloc lags the US and China in developing and commercialising AI.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/EU's%20AI%20Act%20has%20a%20global%20reach,%20but%20leaves%20European%20innovation%20behind.pdf"}, {"id": "bt-07", "title": "Gold steady as traders assess impact of Hormuz flare-up on rates", "source": "BT", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Geopolitics"], "summary": "Gold traded in a narrow range around US$4,245 an ounce as traders weighed a reported Iranian attack in the Strait of Hormuz on the Fed's rate path. Local media said Iran struck \"hostile targets\" and would seek to bar US and Israeli vessels, while Houthis launched a large-scale attack in Yemen, raising fears of a wider conflict. Trump said the war would end \"pretty soon.\" Bullion was still up nearly 5 per cent on the week after briefly topping US$4,300 on Hormuz-reopening hopes. Renewed tensions revived Fed-hike speculation; traders priced roughly 60 per cent odds of a September hike after reports Chairman Kevin Warsh would raise rates if inflation runs hot. Gold has fallen nearly a fifth since the US-Iran war began.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/Gold%20steady%20as%20traders%20assess%20impact%20of%20Hormuz%20flare-up%20on%20rates.pdf"}, {"id": "bt-08", "title": "Japan's households continue to cut spending despite wage gains", "source": "BT", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Society"], "summary": "Japan's household spending unexpectedly fell for a seventh month, dropping 3.3 per cent in June from a year earlier versus a forecast 0.9 per cent rise, showing persistent inflation weighing on sentiment despite rising real wages. Month-on-month, spending fell 6.4 per cent. Declines were led by food, utilities, transport, communications and apparel; education and home maintenance rose. Real wages have gained every month this year, up 1.6 per cent in June. BOJ Governor Kazuo Ueda flagged upside inflation risks near the 2 per cent target. PM Sanae Takaichi has deployed subsidies and will cut the food sales tax to 1 per cent from 8 per cent in April 2027. Food and beverage firms planned price hikes on 2,566 products in July, up nearly 22 per cent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/Japan's%20households%20continue%20to%20cut%20spending%20despite%20wage%20gains.pdf"}, {"id": "bt-09", "title": "JustCo H1 loss narrows 52% to US$839,000 in first results since IPO", "source": "BT", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Flexible workspace operator JustCo said its first-half net loss narrowed 52 per cent to US$839,000 from US$1.7 million a year earlier, in its first results since debuting on the SGX mainboard on May 22. Excluding one-off costs, it would have posted about US$100,000 net profit. Revenue grew 24 per cent to US$80.8 million, driven by higher revenue per workstation, up 11 per cent to US$468.45 monthly. Free cash flow rose to US$3.2 million and cash reached US$169.4 million including IPO proceeds. The GIC-backed group expanded to 57 centres and 37,350 workstations, with a 21-centre pipeline. It plans co-living venture JustCo Place with Deloitte as anchor tenant, and a 50 per cent payout dividend from FY2027. Shares closed at S$0.63, below the S$0.94 IPO price.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/JustCo%20H1%20loss%20narrows%2052%20to%20US839,000%20in%20first%20results%20since%20IPO.pdf"}, {"id": "bt-10", "title": "Oil settles up US$3 as Iran reviews bill to ban US, Israeli vessels from Hormuz", "source": "BT", "date": "7 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "Oil settled up more than US$3 a barrel on Aug 6 after an Iranian parliament committee began reviewing a bill to ban US, Israeli and other hostile vessels from the Strait of Hormuz and fine violators up to 20 per cent of cargo value. Brent rose US$3.04, or 3.83 per cent, to US$82.49; WTI gained US$2.07 to US$77.29. Before the war, about a fifth of global oil and LNG flowed through the strait. Yemen's Houthis reported missile and drone attacks on Saudi deployments and a tanker off Yanbu. Gulf crude exports stayed about 40 per cent below pre-war levels. Iran warned Gulf states that new US attacks would trigger strikes on energy infrastructure. A Russian refinery in Yaroslavl caught fire after a Ukrainian drone attack.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/Oil%20settles%20up%20US3%20as%20Iran%20reviews%20bill%20to%20ban%20US,%20Israeli%20vessels%20from%20Hormuz.pdf"}, {"id": "bt-11", "title": "OpenAI accounted for likely 70% of Microsoft's AI sales, disclosures show", "source": "BT", "date": "7 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Microsoft generated most of its AI revenue from OpenAI, recording US$24.1 billion in sales from the startup in the year ended June, a filing showed. With CEO Satya Nadella having said Microsoft was on pace for US$37 billion in annual AI revenue as of March, OpenAI likely accounted for about 70 per cent, underscoring Microsoft's dependence on its partner. Under their agreement, OpenAI pays Microsoft for computing power, model-building costs and a revenue share. Microsoft has backed Anthropic and built its own models to reduce reliance. Against total revenue, OpenAI's share looks under 10 per cent. The disclosure, Microsoft's first clear figure, may be tied to OpenAI's IPO plans. Analysts want to know how much comes from services versus investment returns.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/OpenAI%20accounted%20for%20likely%2070%20of%20Microsoft's%20AI%20sales,%20disclosures%20show.pdf"}, {"id": "bt-12", "title": "Over 600 companies likely to be culled in Topix's biggest overhaul: analysts", "source": "BT", "date": "7 Aug 2026", "tags": ["Finance & Markets"], "summary": "Japan's Topix index faces its biggest overhaul, with over 600 companies, more than a third of constituents, likely removed under new eligibility rules, analysts estimate. Firms whose free-float market cap ranks in the bottom 3 per cent in August will be phased out over two years from October, potentially cutting them off from an estimated US$1 trillion in passive funds. The move addresses criticism the benchmark holds too many small, illiquid stocks. Companies above roughly 40 billion yen (US$252 million) should survive. Some firms, like Seika Corp with a 3 billion yen buyback, are announcing shareholder measures to stay in. Larger firms on smaller markets will be added, and annual reviews begin in 2028, allowing removed companies to rejoin.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/Over%20600%20companies%20likely%20to%20be%20culled%20in%20Topix's%20biggest%20overhaul%20analysts.pdf"}, {"id": "bt-13", "title": "SGX has IPO pipeline of around 50 companies in various stages of readiness amid record results", "source": "BT", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Singapore Exchange said its IPO pipeline has grown to about 50 companies in various stages of preparation, as it reported record FY2026 results. Net profit rose 7.8 per cent to S$698.4 million and revenue climbed 13.9 per cent to S$1.5 billion, with gains across all segments; adjusted net profit rose 24.6 per cent to S$759.5 million. About a third of prospective issuers are consumer and healthcare, a third technology and digital infrastructure, and a quarter real estate. CEO Loh Boon Chye said the market is rebuilding confidence and that Day 1 performance is not investors' sole focus. Twenty-one companies listed in FY2026. SGX proposed a final S$0.115 dividend plus a one-off S$0.125, lifting total FY2026 payout to S$0.57.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/SGX%20has%20IPO%20pipeline%20of%20around%2050%20companies%20in%20various%20stages%20of%20readiness%20amid%20record%20results.pdf"}, {"id": "bt-14", "title": "Samsung, SK Hynix shareholders call for bigger payouts from AI cash mountain", "source": "BT", "date": "7 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Samsung Electronics and SK Hynix face growing investor calls for bigger dividends or buybacks after providing scant capital-return detail alongside AI-driven record profits. The two largest memory makers are set to hold a combined US$263 billion in net cash by year-end, more than double Nvidia's estimated US$102 billion. Both target returns equal to half of free cash flow, lagging peers like Apple, TSMC and Micron, which pledged 100 per cent. Janus Henderson's Richard Clode urged SK Hynix to lift returns to at least 80 per cent. SK Hynix and Samsung shares have fallen about 48 and 37 per cent from June highs. Retail platform ACT is pushing Samsung for an extraordinary meeting and a US$32 billion buyback. Analysts tie the issue to the Korea discount.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/Samsung,%20SK%20Hynix%20shareholders%20call%20for%20bigger%20payouts%20from%20AI%20cash%20mountain.pdf"}, {"id": "bt-15", "title": "Sandisk forecasts upbeat quarterly revenue on AI-driven demand", "source": "BT", "date": "7 Aug 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Sandisk forecast quarterly revenue above estimates, banking on AI data-centre demand for its memory chips, but shares fell nearly 8 per cent in extended trading after a roughly 470 per cent rally this year. It guided first-quarter revenue of US$10.30 billion to US$10.80 billion, above the US$10.47 billion consensus, and adjusted profit of US$44 to US$46 per share. CEO David Goeckeler said the company shifted to long-term purchase agreements averaging four years, holding eight deals with six customers worth at least US$93.9 billion. Fourth-quarter revenue rose to US$8.97 billion and data-centre revenue more than doubled to US$2.98 billion, capping a strong year since its 2025 split from Western Digital. The board approved an additional US$14 billion buyback.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/Sandisk%20forecasts%20upbeat%20quarterly%20revenue%20on%20AI-driven%20demand.pdf"}, {"id": "bt-16", "title": "Sinopec steps up Russian oil imports to offset Mideast supply cuts, traders and tracker say", "source": "BT", "date": "7 Aug 2026", "tags": ["Energy", "Geopolitics"], "summary": "China's state-owned Sinopec, the world's biggest refiner, has ramped up purchases of Far East Russian oil to offset Middle East supplies cut by the Iran war, trade sources and ship-tracking data show. Cheaper than rival grades, Russian ESPO crude helped Sinopec keep throughput stable and export surplus fuel at strong margins. It bought 30 to 40 shipments, about 241,000 to 320,000 barrels daily, for July-September delivery, roughly 5 to 6 per cent of its 5.2 million bpd capacity. China's June crude imports plunged 41 per cent year-on-year. Sinopec took no Saudi crude in June and July and just two million barrels in August, far below the 20 million bought monthly in spring. September ESPO was pegged at US$1 to US$2 below Brent.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/Sinopec%20steps%20up%20Russian%20oil%20imports%20to%20offset%20Mideast%20supply%20cuts,%20traders%20and%20tracker%20say.pdf"}, {"id": "bt-17", "title": "Trump's Iran dilemma: 'Menu of bad options' leaves the US with no easy exit from war", "source": "BT", "date": "7 Aug 2026", "tags": ["Geopolitics", "Politics"], "summary": "With Trump's war against Iran in its sixth month, this week's threats and diplomacy underscored his tightening bind over an unpopular conflict he claimed would last weeks. He is caught between an emerging Iran-Oman interim deal that would give Teheran unprecedented control over the Strait of Hormuz, or escalating with fresh airstrikes ahead of November's midterms. A former negotiator called it \"a menu of bad options.\" Reopening the strait is seen as a prerequisite for resuming US-Iran nuclear talks. Analysts say Trump, facing high gasoline prices and low approval, may be forced into the biggest compromises. Officials increasingly accept the conflict may persist through the midterms. Iran has warned Gulf allies that new US strikes would trigger attacks on their energy infrastructure.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/Trump's%20Iran%20dilemma%20'Menu%20of%20bad%20options'%20leaves%20the%20US%20with%20no%20easy%20exit%20from%20war.pdf"}, {"id": "bt-18", "title": "US Fed's Daly says central bank was right to hold rates steady at July policy meeting", "source": "BT", "date": "7 Aug 2026", "tags": ["Finance & Markets"], "summary": "San Francisco Fed President Mary Daly said she was \"completely supportive\" of the Fed's decision last week to hold interest rates steady while it gathers data on inflation running well above its 2 per cent target. Speaking in Tokyo, she said more information is needed before September's meeting to judge whether supply shocks will wane or a longer-lasting inflation problem is forming, and that the Fed should be vigilant but ready to act. The FOMC held its target at 3.5 to 3.75 per cent, with three officials dissenting in favour of hikes. Daly, not currently a voting member, said businesses have limited pricing power and that an end to the Middle East war should ease oil-driven price pressure.", "url": "https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Aug%202026/07%20Aug%202026/07%20Aug%20BT/US%20Fed's%20Daly%20says%20central%20bank%20was%20right%20to%20hold%20rates%20steady%20at%20July%20policy%20meeting.pdf"}, {"id": "bt-19", "title": "US labour market stable; worker productivity accelerates in Q2", "source": "BT", "date": "7 Aug 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "US jobless claims rose slightly to 199,000 for the week ended Aug 1, while July layoffs hit a two-ye
