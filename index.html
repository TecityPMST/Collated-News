 listing of a Malaysian Reit with a RM7.66 billion portfolio and is in a joint bid with CapitaLand Investment for One Raffles Place (BT). Thailand spent nearly US$35 million hosting the IMF-World Bank meetings (SCMP)."}], "keyMetrics": [{"value": "98", "label": "Articles curated today", "sub": "WSJ 14 · ST 19 · BT 19 · SCMP 16 · TASS 20 · Xinhua 10"}, {"value": "1.5%", "label": "Expected S$NEER slope after MAS, Oct 14", "sub": "Up from an estimated 1.25%, per UOB, Barclays and BofA (BT)"}, {"value": "350,000", "label": "Proposed EU cap on Chinese hybrids a year", "sub": "Against about 302,000 imported in 2025 (WSJ)"}, {"value": "US$6.27", "label": "US retail diesel, per gallon", "sub": "Down from a record US$6.53; up 71% on a year earlier (WSJ)"}, {"value": "-20%", "label": "Global smartphone shipments, Q3", "sub": "Lowest third quarter since 2012 as AI absorbs memory chips (ST)"}, {"value": "5.440%", "label": "UK 10-year gilt yield", "sub": "After a 19-year high of 5.527% last week; budget due Oct 28 (WSJ)"}], "articles": [{"id": "wsj-13oct-01", "title": "A Credit-Score Shift at Fannie and Freddie Is Shaking Up the Mortgage Market", "source": "WSJ", "date": "13 Oct 2026", "tags": ["Finance & Markets", "Society"], "summary": "Regulators and lenders have opened the US$13 trillion US mortgage market to VantageScore, the joint venture of Equifax, Experian and TransUnion, eroding Fair Isaac's near-monopoly; Fair Isaac's stock is down about 60% this year. FHFA chief Bill Pulte last month directed Fannie Mae and Freddie Mac to approve all lenders to use VantageScore 4.0, and at the end of September merged the pricing grids so both scores are treated equally, letting lenders choose the higher score. Rocket Mortgage now prefers VantageScore, which ran 11 to 12 points above FICO Classic on its loans. Milliman found VantageScore loans were charged up to 0.2 percentage point more during the pilot, and its principal Jonathan Glowacki expects mortgage prices to rise.", "url": "https://www.wsj.com/finance/regulation/fannie-freddie-vantagescore-mortgages-85b41d3f"}, {"id": "wsj-13oct-02", "title": "China’s Auto Sales Fall Despite Traditional Peak Season", "source": "WSJ", "date": "13 Oct 2026", "tags": ["Finance & Markets", "Trade"], "summary": "China's retail passenger-car sales fell 28.0% year on year to 1.62 million units in September, though they rose 5.0% from August, the China Passenger Car Association said on Oct 12, as the traditional peak season failed to revive a market that had declined for 12 consecutive months. The CPCA blamed shrinking demand for fuel-powered cars amid high oil prices and weak consumer sentiment, plus higher memory-chip costs slowing new launches. New-energy vehicles took a record 67% of sales, though NEV retail sales fell 17% to 1.08 million units, while passenger-car exports jumped 74% to 917,000 units. The CPCA does not expect a strong recovery in October and sees exports slowing on EU trade pressure.", "url": "https://www.wsj.com/business/autos/chinas-auto-sales-fall-despite-traditional-peak-season-bfbe9b1a"}, {"id": "wsj-13oct-03", "title": "EU Aims to Put Brakes on Chinese Hybrid-Vehicle Market Share With Import Cap", "source": "WSJ", "date": "13 Oct 2026", "tags": ["Trade", "Geopolitics"], "summary": "The EU plans to cap imports of Chinese hybrid and plug-in hybrid cars at 350,000 units a year over the next four years, with a fixed 6% annual increase limit, a senior EU official said on Oct 12, aiming to more than halve China's projected shipments to the bloc. The safeguard measure could take effect in early December. EU imports of Chinese hybrids rose from roughly 107,000 in 2024 to around 302,000 in 2025, according to Eurostat, and the official said they could reach up to 800,000 in 2026. The plan follows talks in Beijing earlier this month between EU trade chief Maros Sefcovic and Chinese Commerce Minister Wang Wentao; the official said China agreed to cut tariffs on roughly €4 billion of EU goods.", "url": "https://www.wsj.com/business/eu-to-cap-chinese-hybrid-vehicle-imports-at-350-000-units-annually-official-says-2198522f"}, {"id": "wsj-13oct-04", "title": "FTX’s Old Bitcoin-Mining Assets Are Now Part of the AI Boom", "source": "WSJ", "date": "13 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "SWI Group, an Amsterdam-listed, Singapore-incorporated data-centre company, said on Oct 12 it had raised €800 million (about US$900 million) to upgrade and expand data centres, including those acquired with Genesis Digital Assets, the bitcoin miner long snarled in FTX's bankruptcy. SWI's shares rose 16%, giving it a market capitalisation of around US$6.9 billion. Co-founder and CEO Max-Hervé George said he had \"zero interest\" in bitcoin mining and aims to serve hyperscalers from sites in Texas, North Carolina, South Carolina and Sweden, while selling the last three small Kazakh mining sites. Alameda Research had spent US$1.15 billion on Genesis Digital; FTX dropped its clawback suit on June 15, the day SWI announced a US$500 million stake, since raised to majority control.", "url": "https://www.wsj.com/finance/currencies/ftxs-old-bitcoin-mining-assets-are-now-part-of-the-ai-boom-76fe9037"}, {"id": "wsj-13oct-05", "title": "Frenzied Stock-Options Trading Shows Individual Investors Are Still Hungry for Risk", "source": "WSJ", "date": "13 Oct 2026", "tags": ["Finance & Markets"], "summary": "Single-stock options volumes have reached meme-stock-era levels of about US$700 billion in notional volume a day, according to options manager Carrick Lane, and call-option prices have eclipsed 2021 levels, as individual investors look past rising interest rates, US$100 oil and war in the Middle East. The AAII bullish reading hit 40.3% for the week ended Oct 7, the highest since mid-July. Carrick Lane partner John Marshall says more than half of single-stock options volume is in contracts expiring within two weeks. The optimism rests on earnings: FactSet expects S&P 500 third-quarter earnings growth of about 30% and 33% profit growth for 2026, and Citadel Securities data show the summer retail cool-down historically tends to reverse in October.", "url": "https://www.wsj.com/finance/stocks/frenzied-stock-options-trading-shows-individual-investors-are-still-hungry-for-risk-89ed24e5"}, {"id": "wsj-13oct-06", "title": "From Iowa Steel to Philly Ships, Trump’s Industrial Promises Face Big Tests", "source": "WSJ", "date": "13 Oct 2026", "tags": ["Trade", "Politics"], "summary": "Two flagship projects in President Trump's push to revive heavy industry face the same hurdles that drove it offshore: scarce workers, high wages, uncompetitive pricing and tight space. Mesabi Metallics, whose parent is India's Essar Group and which has never made steel in the US, plans a US$15 billion Iowa mill adding up to 10 million tons a year from 2030; CRU analyst Josh Spoores warns excess capacity would drive down prices. Hanwha's US$5 billion Philadelphia Shipyard project aims to lift output from two ships a year to 20, but beyond Hanwha its order book is three Matson containerships at US$330 million each, twice the price of a mega vessel built in South Korea or China. Critics say the Iowa project was rushed to aid Republicans before next month's midterms.", "url": "https://www.wsj.com/business/from-iowa-steel-to-philly-ships-trumps-industrial-promises-face-big-tests-537cc173"}, {"id": "wsj-13oct-07", "title": "Iran-Backed Militants Are Tightening the Screws on Saudi Arabia’s Crown Prince", "source": "WSJ", "date": "13 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "Escalating attacks by Yemen's Iran-backed Houthis are threatening Saudi security and Crown Prince Mohammed bin Salman's economic-diversification plans. A Houthi missile hit Riyadh's King Khalid International Airport on Oct 10, killing at least 13 people and injuring hundreds, the deadliest attack on the US or its Gulf allies in conflicts related to the Iran war; authorities reported a further strike on Oct 11 that killed one. The Houthis have also hit the East-West pipeline and declared a maritime blockade in July, and Saudi officials say interceptors are running low. The Finance Ministry expects GDP to shrink 3.6% in 2026; the US has resisted requests for military help, and people familiar say Riyadh has sought help from Pakistan and is exploring a diplomatic solution.", "url": "https://www.wsj.com/world/middle-east/iran-backed-militants-are-tightening-the-screws-on-saudi-arabias-crown-prince-e7b9e789"}, {"id": "wsj-13oct-08", "title": "Quantum-Computing Company IonQ to Buy Cybersecurity Firm for Up to $1.3 Billion", "source": "WSJ", "date": "13 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Quantum-computing company IonQ has struck an all-stock deal to buy cybersecurity firm Elisity at a valuation of up to US$1.3 billion, including up to US$150 million in performance-based earnouts, executives told the WSJ, with an announcement set for Oct 12. IonQ shares will be issued at a price between US$33.07 and US$49.61; the stock closed at US$39.89 on Oct 9, for a market value close to US$16 billion. Chairman and CEO Niccolo de Masi said cybersecurity will become more critical as quantum computing and AI advance, including AI-agent threats and Q-Day, when quantum computers can crack public-key cryptography. The deal follows IonQ's US$1.8 billion takeover of chip maker SkyWater Technology earlier this year; Elisity CEO James Winebrenner is expected to stay.", "url": "https://www.wsj.com/business/deals/quantum-computing-company-ionq-to-buy-cybersecurity-firm-for-up-to-1-3-billion-65af65bd"}, {"id": "wsj-13oct-09", "title": "Russia Pounds Ukrainian Energy Despite Trump’s Ceasefire Announcement", "source": "WSJ", "date": "13 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "Ukrainian President Volodymyr Zelensky said Russian strikes hit energy infrastructure, including gas infrastructure, a power plant and a substation, hours after President Trump declared an energy ceasefire, as Washington presses Kyiv to stop striking Russian oil refineries. Naftogaz said a jet-powered drone damaged a gas facility in the Kharkiv region overnight, and Foreign Minister Andrii Sybiha said a substation in Zhytomyr was hit. Addressing the Warsaw Security Forum on Oct 12, Zelensky reiterated that Ukraine would halt refinery strikes if Russia stops attacking its energy system; Kremlin spokesman Dmitry Peskov declined to comment as contacts continued, according to TASS. Trump, who on Oct 10 said Ukraine should get a new president, insisted the ceasefire would hold, while Zelensky asked for a 60-day total ceasefire to organise elections.", "url": "https://www.wsj.com/world/europe/russia-pounds-ukrainian-energy-despite-trumps-ceasefire-announcement-f5d4779d"}, {"id": "wsj-13oct-10", "title": "The Welfare State Is Crushing Britain", "source": "WSJ", "date": "13 Oct 2026", "tags": ["Society", "Politics"], "summary": "A WSJ feature argues that Britain's sickness and disability benefits have become a financial crutch for a large swath of the population, swelling the welfare bill and imperilling fiscal stability. Some seven million people, more than 10% of the population, claim at least one such benefit; working-age claimants rose more than 60% since 2019 to 4.7 million, and spending will top £100 billion this year, heading for £130 billion in the next four years on government forecasts. Psychiatric claims surged fourfold between 2017 and 2025, and the Motability car-lease scheme accounts for about one in seven new UK car sales. Keir Starmer abandoned plans announced in 2025 to cut £5 billion a year by 2030 after a backlash; his successor Andy Burnham unveils his first budget later this month, widely expected to include tax hikes.", "url": "https://www.wsj.com/world/uk/united-kingdom-welfare-disability-payouts-737d77a0"}, {"id": "wsj-13oct-11", "title": "U.K. Assets Could Underperform in Lead-Up to Budget", "source": "WSJ", "date": "13 Oct 2026", "tags": ["Finance & Markets"], "summary": "WSJ Market Talk items from Oct 12 focus on bond markets: Ebury's Enrique Diaz-Alvarez says UK assets could face downward pressure ahead of the Oct 28 budget, calling it a critical risk for gilts and the pound, with investors looking to Treasury chief John Healey for reassurance on debt. Ten-year gilt yields eased to 5.440% after a 19-year high of 5.527% last week, helped by lower oil after Trump's Russian diesel deal, and Barclays' Moyeen Islam sees international factors as the bigger risk for gilts. With US and Japanese bond markets shut for holidays, money markets price an 18% chance of a Fed rate hike this month, per LSEG, and Jefferies' Mohit Kumar calls a 5% five-year Treasury yield attractive for long-term buyers.", "url": "https://www.wsj.com/finance/ecb-unlikely-to-intervene-in-french-bond-selloff-ab7ca520"}, {"id": "wsj-13oct-12", "title": "U.K. Government Faces Test of Budget Credibility", "source": "WSJ", "date": "13 Oct 2026", "tags": ["Finance & Markets", "Politics"], "summary": "The UK government may struggle to reassure bond investors at its Oct 28 budget even if the Office for Budget Responsibility judges it on track to meet its fiscal rules. Higher energy costs since the US-Iran war began pushed spending in the first five months of the fiscal year £7.4 billion (US$9.79 billion) above the OBR's March forecast, leaving borrowing £8.1 billion over target. The IFS estimates headroom against the rule of funding day-to-day spending from taxes by the fiscal year ending April 2030 at about £20 billion, little changed from £24 billion in March, as war-boosted tax revenues offset higher costs. But implied service cuts timed before an election due by late 2029 may not be credible, with IFS director Helen Miller warning against \"a work of fiction\".", "url": "https://www.wsj.com/economy/u-k-government-faces-test-of-budget-credibility-b5ce5fc9"}, {"id": "wsj-13oct-13", "title": "Why Trump’s Diesel-Supply Deal With Russia Won’t Ease Fuel Prices Much", "source": "WSJ", "date": "13 Oct 2026", "tags": ["Energy", "Geopolitics"], "summary": "President Trump's announced deal for Russia to lift its July diesel export ban and ship fuel to global markets is unlikely to ease US prices much before next month's midterm elections, energy analysts and traders say. The volumes Trump outlined work out to a little over 100,000 barrels a day this month and about 125,000 in November, against roughly 800,000 barrels a day Russia shipped last year. New York diesel futures were little changed on Oct 12, and US retail diesel averaged about US$6.27 a gallon, down from a record US$6.53 last month but 71% higher than a year earlier. Senators from both parties question the deal's legality, citing a 2022 law banning Russian energy imports.", "url": "https://www.wsj.com/business/energy-oil/why-trumps-diesel-supply-deal-with-russia-wont-ease-fuel-prices-much-a8b0b3f5"}, {"id": "wsj-13oct-14", "title": "Xi’s Superpower Ambitions Fuel a Dangerous Debt Spiral in China", "source": "WSJ", "date": "13 Oct 2026", "tags": ["Finance & Markets", "Trade"], "summary": "A WSJ analysis argues that Xi Jinping, pouring trillions into making China a technological and military superpower, is presiding over a dangerous debt spiral that is strangling the domestic economy and damaging trade partners. Credit to China's nonfinancial sector topped 300% of GDP last year, 60 percentage points above end-2019, and has risen by more than US$43 trillion since Xi took office in late 2012, per the BIS. The IMF estimates broad government debt including local financing vehicles at 127% of GDP last year, up from 98% in 2020, and McKinsey puts corporate debt at double the global average relative to GDP. Overcapacity is pushing goods abroad for a trillion-dollar annual surplus, and Rhodium's Camille Boullenois expects slow decay rather than reform.", "url": "https://www.wsj.com/world/china/xis-superpower-ambitions-fuel-a-dangerous-debt-spiral-in-china-edad4f9f"}, {"id": "st-13oct-01", "title": "BYD plans hiring spree to bolster European workforce to 40,000", "source": "ST", "date": "13 Oct 2026", "tags": ["Finance & Markets", "Trade"], "summary": "BYD plans to lift its European workforce to \"absolutely over 40,000 in 2030\", executive vice-president Stella Li, who heads its overseas business, said at the Paris Motor Show on Oct 12, as the world's largest EV maker shifts from exporter to major producer in the region. Li said BYD will soon have more than 10,000 staff in Europe and will recruit from the auto industry and beyond, including workers potentially laid off by European firms. Its first European factory, in Hungary, is in final preparations for mass production in the fourth quarter, with France and Spain shortlisted for the next couple of plants. Li said BYD is still assessing new EU curbs on Chinese hybrid imports agreed in China-EU talks last week.", "url": "https://www.straitstimes.com/business/byd-plans-hiring-spree-to-bolster-european-workforce-to-40000"}, {"id": "st-13oct-02", "title": "Europe still divided on buying locally for defence, MBDA CEO says", "source": "ST", "date": "13 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "MBDA CEO Eric Beranger told the Warsaw Security Forum on Oct 12 that efforts to steer more European defence spending towards European suppliers face political hurdles, with EU governments still divided over how far to rely on US security guarantees. \"I think the jury is still out,\" said Beranger, who steps down next month, while arguing Europe already has the industrial base it needs. Poland, Germany and the Netherlands have bought US equipment such as F-35 jets, and the US mission to the EU warned in February that limiting American industry in European procurement threatens the partnership. Speakers including former British defence minister Ben Wallace and the German Marshall Fund's Claudia Major also debated nuclear and conventional deterrence, as Russia renews nuclear warnings.", "url": "https://www.straitstimes.com/world/europe/europe-still-divided-on-buying-locally-for-defence-mbda-ceo-says"}, {"id": "st-13oct-03", "title": "Global smartphone shipments record worst third quarter in 14 years amid memory shortage", "source": "ST", "date": "13 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Global smartphone shipments fell 20% on-year in the third quarter to their lowest Q3 level since 2012, preliminary Counterpoint Research estimates showed on Oct 12, as AI infrastructure projects cornered memory chip supplies and drove up costs and retail prices. Samsung kept the top spot with a 23% share, its shipments down 3%, while Apple's share reached 22%, above 20% in a third quarter for the first time despite lower shipments; the absence of a base iPhone 18 model meant a smaller launch-month channel fill. OPPO and vivo shipments fell more than 20% and Xiaomi's more than 30%, cutting its share to 10%. Counterpoint called the outlook for the rest of 2026 challenging, expecting production cuts and a premium focus to continue.", "url": "https://www.straitstimes.com/business/global-smartphone-shipments-record-worst-third-quarter-in-14-years-amid-memory-shortage"}, {"id": "st-13oct-04", "title": "Greenland lawmakers signal support for Trump security deal", "source": "ST", "date": "13 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "A majority of Greenland's lawmakers signalled support in a parliamentary debate in Nuuk on Oct 12 for the security agreement the US, Denmark and Greenland signed last month to end tensions over US President Donald Trump's repeated threats to take control of the island. The deal expands the US military's role, paving the way for two new military bases and Trump's \"Golden Dome\" missile defence system, while reaffirming Danish sovereignty and Greenlanders' right to self-determination. Opposition Naleraq chair Pele Broberg said Greenlanders are guaranteed no fixed payment for the extensive rights granted to the US, while Foreign Minister Mute Egede called the deal a huge step forward. The agreement faces a second reading before a vote, and lawmakers are expected to pass it.", "url": "https://www.straitstimes.com/world/europe/greenland-lawmakers-signal-support-for-trump-security-deal"}, {"id": "st-13oct-05", "title": "Houthi official warns of ‘swift, painful response’ if US enters Yemen war", "source": "ST", "date": "13 Oct 2026", "tags": ["Geopolitics", "Defence", "Energy"], "summary": "Houthi political bureau member Mohammed Al Bukhaiti told AFP on Oct 12 that US involvement in Yemen's war would bring \"a swift and painful response targeting the US\" and its regional interests, after President Donald Trump said he was considering joining Saudi strikes on the group. Saudi Arabia has reportedly sought US help against the group, and Yemen's civil war reignited in July; a Houthi strike on Riyadh's King Khalid International Airport on Oct 10 killed 13 people, the deadliest attack on Saudi soil in more than a decade, and operations there remained suspended on Oct 12. The Saudi-led coalition said it intercepted a missile over Riyadh and two ballistic missiles fired towards Khamis Mushait on Oct 12. Etihad and Gulf Air cancelled Riyadh flights, and Delta delayed its Atlanta-Riyadh launch set for Oct 23.", "url": "https://www.straitstimes.com/world/middle-east/houthi-official-warns-of-swift-painful-response-if-us-enters-yemen-war"}, {"id": "st-13oct-06", "title": "Iran offers to mediate between its Houthi allies and Saudi Arabia", "source": "ST", "date": "13 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "Iranian Foreign Minister Abbas Araghchi offered to mediate between Saudi Arabia and the Iran-backed Houthis in an Oct 11 call with Saudi counterpart Faisal bin Farhan, according to a statement from his office, saying Iran was ready to help initiate a dialogue; Riyadh confirmed the call but did not mention any mediation offer. The call followed an Oct 10 Houthi strike on Riyadh's airport that killed at least 12 people, which Houthi-affiliated media said sparked Saudi-led strikes on Sanaa's airport. Fighting escalated in September when Houthi forces seized Yemen's Red Sea coast, as a fragile 2022 truce unravelled. Iran's national security adviser Mohsen Rezaei threatened on Oct 11 that Iranian forces would target Gulf digital infrastructure, including data centres, if fighting resumed.", "url": "https://www.straitstimes.com/world/middle-east/iran-offers-to-mediate-between-its-houthi-allies-and-saudi-arabia"}, {"id": "st-13oct-07", "title": "Iran’s Islamic Revolutionary Guards likely behind Fairford airbase incident, says British PM Burnham", "source": "ST", "date": "13 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "British Prime Minister Andy Burnham told Parliament on Oct 12 that a suspected plot targeting RAF Fairford, a base used by US bombers for strikes on Iran, was \"highly likely\" coordinated in Iran and almost certainly directed by the IRGC. Five British men arrested near the base on Sept 27 on suspected terrorism and explosive offences were released on bail without charge, two others were also released, and detectives found petrol but no viable explosive. US officials told Reuters of a suspected Iran-linked drone attack plot, while Iran's ambassador Seyed Ali Mousavi denied any involvement. Britain sanctioned two Iranian nationals, foreign minister Ed Miliband summoned the ambassador, and almost 30 countries condemned Iran's use of violent attacks.", "url": "https://www.straitstimes.com/world/europe/uk-pm-burnham-says-irans-irgc-likely-behind-raf-fairford-incident"}, {"id": "st-13oct-08", "title": "Meta says its new AI models on par with OpenAI, Anthropic", "source": "ST", "date": "13 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Meta unveiled two \"frontier\" AI models, Wonder and Wonder Full, on Oct 12, claiming performance comparable to OpenAI's ChatGPT and Anthropic's Claude; CEO Mark Zuckerberg said the Muse Wonder class brings Meta to the frontier after its first Muse Spark family, launched in April. Meta cited benchmarking by independent firm Artificial Analysis showing Wonder outperforming models from Anthropic, OpenAI and Google, though the firm's own website shows Wonder is among the most expensive models. The models will soon be available to paid subscribers in Meta's Muse personal agent app. Meta said in July its AI-related investment could reach US$145 billion in 2026, and the New York Times reported Zuckerberg sped up Muse's launch due to startup Instinct's popularity.", "url": "https://www.straitstimes.com/world/united-states/meta-says-its-new-ai-models-on-par-with-openai-anthropic"}, {"id": "st-13oct-09", "title": "Microsoft bets on home-grown AI chip to challenge Nvidia", "source": "ST", "date": "13 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Microsoft said on Oct 12 it will roll out its in-house Maia AI chips at massive scale from 2027 as the main hardware for running AI across its products, a move that could reduce its reliance on Nvidia. The Maia 200 is already operational, including for Microsoft 365 Copilot, in the US, Europe and Australia, and delivers up to 1.7 times more output per watt than leading GPU-based systems for Teams and Copilot features, the company says. The Maia 300, launching in 2027 with computing components made by TSMC, will deliver 40% more AI work per unit of electricity than leading systems and more than twice its predecessor. Each server rack will hold 96 chips, twice as many as before, handling up to seven times the workload.", "url": "https://www.straitstimes.com/business/microsoft-bets-on-homegrown-ai-chip-to-challenge-nvidia"}, {"id": "st-13oct-10", "title": "NATO general sets out tough military response to any ‘foolish’ Russian attack", "source": "ST", "date": "13 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "NATO's top commander, US Air Force General Alexus Grynkewich, told the Warsaw Security Forum on Oct 12 that \"If someone is foolish enough to attack us, we will fight\", outlining a three-pronged approach of blocking, blunting and breaking enemy forces. He said NATO's response would extend beyond the attacking force to anything that supports, sustains and controls it, and that he spoke publicly to reassure the alliance's one billion citizens after recent sabotage and arson. Grynkewich did not name Russia, which European governments accuse of sabotage, drone incursions and cyberattacks, and which warned last month it could use nuclear weapons if NATO tried to cut off Kaliningrad. He played down concerns over Trump's commitment to the alliance, recalling Trump spoke of love at the July Ankara summit.", "url": "https://www.straitstimes.com/world/europe/nato-general-sets-out-tough-military-response-to-any-foolish-russian-attack"}, {"id": "st-13oct-11", "title": "Patriot interceptor deliveries to Poland will be delayed, top general says", "source": "ST", "date": "13 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "Deliveries of some US weapons systems to Poland, including interceptors for the Patriot air defence system, are set to be delayed, Polish army operational commander General Ireneusz Nowak said on Oct 12. Speaking on a panel at the Warsaw Security Forum, Nowak said the impact is \"very visible\" for PAC-3 MSE Patriot missiles, which will be delayed for sure, and warned of additional delays to deliveries already scheduled or under contract. Reuters reported in April that US officials had told some European counterparts that previously contracted weapons deliveries were likely to slip as the Iran war draws on weapons stocks.", "url": "https://www.straitstimes.com/world/europe/patriot-interceptor-deliveries-to-poland-will-be-delayed-top-general-says"}, {"id": "st-13oct-12", "title": "Russia says it struck vessels carrying military cargo to Ukraine's ports", "source": "ST", "date": "13 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "Russia's Defence Ministry said it carried out drone strikes on various targets in Ukraine on Oct 12, including three cargo vessels it said were being used to carry military cargo to Ukraine's Black Sea ports. According to the ministry, two of the vessels were bound for Odesa and one for Mykolaiv. The ministry also reported a strike on a logistics centre in the Mykolaiv region. Reuters said it could not independently verify the ministry's assertions.", "url": "https://www.straitstimes.com/world/europe/russia-says-it-struck-vessels-carrying-military-cargo-to-ukraines-ports"}, {"id": "st-13oct-13", "title": "Russia says its diesel exports may exceed volumes announced by Trump", "source": "ST", "date": "13 Oct 2026", "tags": ["Energy", "Geopolitics"], "summary": "Russian Deputy Prime Minister Alexander Novak said on Oct 12 that Russia can lift diesel exports above the volumes US President Donald Trump outlined under their deal, with exports possibly reaching 3.0–3.5 million tonnes per month by year-end, back to pre-crisis levels. Trump said on Oct 9 Russia would immediately supply more than 300,000 tonnes (2.25 million barrels), 500,000 tonnes in November and 1 million tonnes after that, as Washington temporarily lifted sanctions on Russian fuel. Novak said global diesel prices had already fallen around 5% to 6%, and put Russian energy sold to the EU since 2022 at US$320.7 billion, above the US figure of US$250 billion. The deal has drawn criticism from Ukraine and some US lawmakers.", "url": "https://www.straitstimes.com/world/europe/russia-says-its-diesel-exports-may-exceed-volumes-announced-by-trump"}, {"id": "st-13oct-14", "title": "Saudi Arabia faces new missile and drone fire after major attacks on airports", "source": "ST", "date": "13 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "Saudi Arabia said it faced a new barrage of incoming drones and missiles on Oct 12 and that Riyadh airport would stay shut for now, days after an Oct 10 missile strike on a departure terminal claimed by Yemen's Iran-allied Houthis. The Houthis have attacked Saudi airports and oil facilities since last week in a conflict that has spilled over from the wider US-Iran war, after Riyadh re-entered Yemen's civil war to push the group from the Bab el-Mandeb Strait oil route. Iran offered to mediate, while UAE presidential adviser Anwar Gargash called for reviving joint Gulf security and defence action. Trump said on Oct 10 the US was considering joining Saudi strikes on the Houthis, but there has been no sign of US action yet.", "url": "https://www.straitstimes.com/world/middle-east/saudi-arabia-faces-new-missile-and-drone-fire-after-major-attacks-on-airports"}, {"id": "st-13oct-15", "title": "Saudi capital’s airport to remain shut this week as airlines cancel services", "source": "ST", "date": "13 Oct 2026", "tags": ["Geopolitics", "Finance & Markets"], "summary": "Saudi authorities extended the closure of Riyadh's King Khalid International Airport until Oct 17 after continuing attacks by Yemen's Iran-aligned Houthis, who said late on Oct 12 they had fired a ballistic missile at the airport; Saudi Arabia said it intercepted a missile fired towards Riyadh. The airport has been shut since an Oct 10 attack that killed 13 people and wounded more than 300, and cancellations across all Saudi airports reached 46.4%, according to Cirium. Lufthansa Group cancelled Riyadh flights until Oct 16, Air France-KLM until end-October and Etihad Abu Dhabi-Riyadh flights until Oct 19, while Delta pushed its Atlanta-Riyadh launch to March 2027. Saudi real GDP is projected to contract 3.6% in 2026.", "url": "https://www.straitstimes.com/world/middle-east/skies-over-saudi-capital-riyadh-largely-empty-after-deadly-houthi-strikes-on-airport"}, {"id": "st-13oct-16", "title": "Sheng Siong, OCBC, SGX receive analysts’ downgrades", "source": "ST", "date": "13 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Maybank analyst Hussaini Saifee downgraded Sheng Siong to hold and cut his target price to S$3.12 from S$3.22, sending the stock down more than 2% to S$2.86 on Oct 12, citing fading voucher support, low single-digit supermarket growth, cross-border shopping and online grocery competition. Citi's Tan Yong Hong downgraded OCBC to sell, reiterated a sell on UOB and kept DBS at buy, warning of third-quarter earnings downside and mispriced net interest income. JP Morgan recommended trimming OCBC and DBS, preferring UOB, yet all three banks rose on Oct 12. Macquarie downgraded SGX to underperform a week earlier, though SGX closed 3% higher at S$21.35.", "url": "https://www.straitstimes.com/business/companies-markets/sheng-siong-ocbc-sgx-face-analysts-downgrades"}, {"id": "st-13oct-17", "title": "Taiwan says it is closely monitoring series of Chinese live-fire drills", "source": "ST", "date": "13 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "Taiwan's Defence Minister Wellington Koo said on Oct 12 the military is closely monitoring a week of Chinese live-fire drills along China's coast, which a preliminary assessment found were coastal artillery firing exercises. China's Maritime Safety Administration issued no-sail notices from Oct 8 for five areas from the South China Sea to Liaoning, none around Taiwan, with the closest off Zhejiang. China has not linked the drills to President Lai Ching-te's Oct 10 national day speech, though its Defence Ministry accused him on Oct 11 of exaggerating the threat from China. China has not held full war games around Taiwan since late December, after a record US$11 billion US arms sale.", "url": "https://www.straitstimes.com/asia/east-asia/taiwan-says-it-is-closely-monitoring-series-of-chinese-live-fire-drills"}, {"id": "st-13oct-18", "title": "US hopes diesel deal can ‘soften’ Moscow on peace talks, sources say", "source": "ST", "date": "13 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "US envoys Steve Witkoff and Jared Kushner told Ukrainian officials in Miami on Oct 9 that a deal allowing Russian diesel exports is meant to draw Russia back to peace talks, three people familiar with the meeting told Reuters. According to two of them, the envoys said Putin was not prepared to negotiate an end to the war, and Kushner reiterated Trump's request that Ukraine stop striking Russian refineries, though no threat to cut US support was made. Under the deal, Russia will supply more than 2.25 million barrels of diesel, which Trump defended on Oct 12 as \"the right choice for the American people.\" Ukrainian officials were sceptical but signalled willingness to agree an energy ceasefire if Russia did.", "url": "https://www.straitstimes.com/world/europe/us-hopes-diesel-deal-can-soften-moscow-on-peace-talks-sources-say"}, {"id": "st-13oct-19", "title": "Ukraine says EU set to open next accession stages after Kyiv passes minority rights law", "source": "ST", "date": "13 Oct 2026", "tags": ["Geopolitics", "Politics"], "summary": "Ukrainian Foreign Minister Andrii Sybiha said on Oct 12 that Ukraine expects the EU to approve opening the second and third stages of its accession talks on Oct 13. Earlier on Oct 12, Ukraine's parliament passed a law expanding the rights of Hungarian speakers and other minorities to native-language education, part of an agreement with Hungary's new government to drop objections that had blocked Kyiv's EU bid. Sybiha met Hungarian counterpart Anita Orban on the sidelines of a Foreign Affairs Council meeting in Luxembourg, and President Volodymyr Zelenskiy signed the bill into law later that day.", "url": "https://www.straitstimes.com/world/europe/ukraine-says-eu-set-to-open-next-accession-stages-after-kyiv-passes-minority-rights-law"}, {"id": "bt-13oct-01", "title": "‘Bringing Asean together as a single market’: PM Wong", "source": "BT", "date": "13 Oct 2026", "tags": ["Southeast Asia", "Trade", "Technology & AI"], "summary": "Prime Minister Lawrence Wong said South-east Asia's challenge in continuing to attract investment is bringing Asean together as a single market, which it does not have today, speaking in a dialogue with DBS CEO Tan Su Shan at the DBS Asia Future Forward Conference on Oct 12. He said operating in the region is more complex than in Europe, and called the Asean Digital Economy Framework Agreement (Defa), due to be signed in November at the 49th Asean Summit, \"a first but important step\" rather than a magic switch. Singapore will look at giving some priority to such initiatives when it chairs Asean next year. On AI, Wong said Singapore is not promising zero retrenchments but urged firms to give workers advance notice, and said resilience buffers must now be factored into business costs.", "url": "https://www.businesstimes.com.sg/companies-markets/bringing-asean-together-single-market-pm-wong"}, {"id": "bt-13oct-02", "title": "‘The market has spoken’: DBS CEO Tan Su Shan says market is repricing AI financing risks", "source": "BT", "date": "13 Oct 2026", "tags": ["Finance & Markets", "Technology & AI", "Southeast Asia"], "summary": "DBS chief executive Tan Su Shan told Bloomberg Television on Oct 12 that the market is repricing the risks of AI-related investment, which could bring more discipline to financing. She said investors are now demanding higher returns and scrutinising structures to ensure AI capex yields long-term returns that can repay debt, bond and equity holders. Weaker firms may see their credit ratings cut, though she called the repricing healthy. DBS has originated about US$20 billion (S$25 billion) of AI deals in 2026 so far, often as lead manager on syndicated loans, holding only a fraction, mostly for hardware such as chips and data centres.", "url": "https://www.businesstimes.com.sg/startups-tech/technology/market-has-spoken-dbs-ceo-tan-su-shan-says-market-repricing-ai-financing-risks"}, {"id": "bt-13oct-03", "title": "‘Wasting money, spending tokens’: Companies still in search of AI use cases with worthwhile ROI, says Broadcom’s Hock Tan", "source": "BT", "date": "13 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "Broadcom CEO Hock Tan said on Oct 12 that most companies still cannot find AI use cases that generate a return on investment, saying \"people are just wasting money, spending tokens\", at a DBS Asia Future Forward Conference panel with Intel CEO Tan Lip-Bu moderated by DBS CEO Tan Su Shan. Hock Tan said the boom centres on picks-and-shovels hardware, but future value likely lies with frontier model builders, making capital the industry's likely next bottleneck. He called OpenAI's annualised revenue of US$50 billion not bad for a startup despite investor disappointment. Intel's Tan expects AI to have a bigger impact than the Internet, and neither chip chief sees signs of a slowdown.", "url": "https://www.businesstimes.com.sg/companies-markets/wasting-money-spending-tokens-companies-still-search-ai-use-cases-worthwhile-roi-says-broadcoms-hock"}, {"id": "bt-13oct-04", "title": "Applied Materials will double sales, not headcount, thanks to AI", "source": "BT", "date": "13 Oct 2026", "tags": ["Technology & AI", "Finance & Markets", "Society"], "summary": "Applied Materials CEO Gary Dickerson said the chip-equipment maker expects to double revenue over the next few years without doubling headcount, as it relies more on AI tools for product development, quality control and improving chip yields. He spoke ahead of the opening of its EPIC Center in Sunnyvale, California, a US$5 billion facility built with customers including TSMC, Intel, Samsung Electronics, Micron Technology and SK Hynix. The company, the biggest US producer of chipmaking machinery, had about 38,900 employees as of late July, and Dickerson declined to give headcount forecasts. He said financing, supply, energy and capacity shortfalls could slow the AI build-out short term, but growth will be significant in any scenario.", "url": "https://www.businesstimes.com.sg/companies-markets/applied-materials-will-double-sales-not-headcount-thanks-ai"}, {"id": "bt-13oct-05", "title": "Bain’s Bridge Data Centres seeks to upsize loan to US$6.6 billion", "source": "BT", "date": "13 Oct 2026", "tags": ["Finance & Markets", "Technology & AI", "Southeast Asia"], "summary": "Bain Capital-owned Bridge Data Centres is in talks with banks to more than double an existing loan for its Malaysian operations to about US$6.6 billion, people familiar with the matter said, in what would be one of Asia's largest data centre deals. The loan was originally US$2.8 billion last year, with an earlier effort to raise it to at least US$5 billion; the expanded deal could launch as early as November, according to the people. Plans for a loan of up to US$6 billion for a Thailand data centre have stalled, the people said, around when Thailand suspended construction of 49 data centres last month over energy concerns. Bridge declined to comment on market speculation.", "url": "https://www.businesstimes.com.sg/startups-tech/technology/bains-bridge-data-centres-seeks-upsize-loan-us6-6-billion"}, {"id": "bt-13oct-06", "title": "EU deal hastens need for BYD, Chery to build Chinese cars in Europe", "source": "BT", "date": "13 Oct 2026", "tags": ["Trade", "Finance & Markets", "Geopolitics"], "summary": "Chinese carmakers led by BYD are showcasing new plug-in hybrids at the Paris car show running from Oct 12, as analysts say an EU move to cap hybrid imports from China will slow but not stop their expansion and speed up local production in Europe. It remains unclear whether the EU and China agreed a hard cap of 350,000 units or one that triggers tariffs if breached; Bernstein estimates Chinese hybrid sales in the EU at 435,000 units in 2026, based on about 290,000 through August. Chinese brands held about 26% of Western Europe's plug-in hybrid market in Q2, up from 2.2% two years earlier. Leapmotor is due to ship cars from a Stellantis plant in Spain in October, and Renault's CEO called the deal \"good news\".", "url": "https://www.businesstimes.com.sg/international/eu-deal-hastens-need-byd-chery-build-chinese-cars-europe"}, {"id": "bt-13oct-07", "title": "Economists expect MAS to tighten monetary policy again in October, though some see room for a pause", "source": "BT", "date": "13 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "The Monetary Authority of Singapore is widely expected to tighten for a third straight time when it announces its decision on Oct 14, with UOB, Barclays and Bank of America each forecasting a 25-basis-point steepening of the S$NEER slope to 1.5% a year from an estimated 1.25%. MAS tightened in April, its first move since October 2022, as the Middle East conflict lifted energy prices, and again in July. Some see a pause: Barclays notes core inflation was 2.2% in August against the roughly 2.5% it thinks MAS expected for Q3, and an August MAS survey showed 55% of forecasters expecting no change. DBS forecasts Q3 growth of 5.4%, Barclays 6%.", "url": "https://www.businesstimes.com.sg/singapore/economy-policy/economists-expect-mas-tighten-monetary-policy-again-october-though-some-see-room-pause"}, {"id": "bt-13oct-08", "title": "HSBC moves to Wall Street bonus model, cuts fixed-pay deals", "source": "BT", "date": "13 Oct 2026", "tags": ["Finance & Markets", "Society"], "summary": "HSBC will phase out fixed-pay allowances for senior staff and pay a greater share of compensation as bonuses from the start of 2028, according to a memo seen by Bloomberg News. The move follows Barclays, which said in July it would shift more pay to bonuses after the UK changed compensation rules last year to allow higher variable pay. HSBC's allowances, introduced after EU bonus caps and paid in immediately vested shares, have been capped at 150% of base salary. HSBC spent US$3.93 billion on variable pay in 2025, up 10%, out of US$21.5 billion in gross compensation, and the overhaul is part of CEO Georges Elhedery's restructuring since September 2024.", "url": "https://www.businesstimes.com.sg/international/global/hsbc-moves-wall-street-bonus-model-cuts-fixed-pay-deals"}, {"id": "bt-13oct-09", "title": "IMF says AI investment keeps global growth around 3% but brings massive disruption", "source": "BT", "date": "13 Oct 2026", "tags": ["Finance & Markets", "Technology & AI", "Society"], "summary": "IMF managing director Kristalina Georgieva said in Bangkok on Oct 12 that AI infrastructure investment is keeping global growth at around 3% despite the energy supply shock, but foreshadows a \"slow-moving tsunami\" for jobs, taxation and education. She said the boom could lift growth in advanced Asian economies by 0.5 to 1 percentage point and in emerging Asia by 0.2 to 0.8 point, and that IMF research shows about 40% of jobs, and up to 60% in advanced economies, will be augmented, downgraded or eliminated. The IMF releases an updated outlook on Oct 13 at the IMF-World Bank meetings. Singapore President Tharman Shanmugaratnam warned AI is reducing demand for graduates' first jobs.", "url": "https://www.businesstimes.com.sg/international/global/imf-says-ai-investment-keeps-global-growth-around-3-brings-massive-disruption"}, {"id": "bt-13oct-10", "title": "IOI Properties advances Reit listing, backed by US$1.8 billion portfolio", "source": "BT", "date": "13 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "Malaysian developer IOI Properties Group has signed an underwriting agreement with six financial institutions for the listing of IOIPG Malaysia Reit, whose initial nine-property portfolio is valued at RM7.66 billion (US$1.8 billion). The Reit plans to launch its prospectus in Q4 2026 and list on Bursa Malaysia's Main Market, offering up to 2.2 billion units, or 40% of its 5.5 billion units, with the underwriters covering 165 million units. The portfolio is anchored by IOI City Mall, six hotels under Marriott International brands and two office towers. Analysts see the listing as a catalyst for capital recycling, while IOI is also in a 50-50 joint bid with CapitaLand Investment for Singapore's One Raffles Place.", "url": "https://www.businesstimes.com.sg/international/asean/ioi-properties-advances-reit-listing-backed-us1-8-billion-portfolio"}, {"id": "bt-13oct-11", "title": "More family offices are turning to Asia-Pacific private credit: Lighthouse Canton", "source": "BT", "date": "13 Oct 2026", "tags": ["Finance & Markets"], "summary": "In an interview with The Business Times, Sanket Sinha, CEO of global asset management at Lighthouse Canton, said family offices' share of Asia-Pacific private-credit assets under management has risen to nearly 30% from 23-24% three years ago, citing an Alternative Investment Management Association report. Sinha said Asia contributes nearly 35% of global GDP but private-credit penetration is only around 5-10%, with US$31 of private equity deployed for every US$1 of private debt, versus about six times in the US and four times in Europe. He blamed a lack of sponsored deals (under 10% of deals in Asia, versus 70% in the US and 85% in Europe) and fragmented markets, and named India, Australia and Japan as markets with strong deal flow. He said family offices' due diligence is fast catching up with institutions'.", "url": "https://www.businesstimes.com.sg/companies-markets/more-family-offices-are-turning-asia-pacific-private-credit-lighthouse-canton"}, {"id": "bt-13oct-12", "title": "SGX securities trading value up 27% in September as derivatives volume rebounds", "source": "BT", "date": "13 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "SGX's securities daily average value rose 27% year on year in September to S$1.9 billion but fell 11% from August as the Straits Times Index paused after August's record rally, the bourse operator said on Oct 12. Total securities turnover rose 27% year on year to S$42.2 billion over 22 trading days, down 2.5% from S$43.3 billion in August. Derivatives volume rebounded 10% month on month to 29.8 million contracts, though down 2% year on year, while FX derivatives volume jumped 53% year on year to 9.6 million contracts, led by renminbi, rupee and won contracts. The STI closed September at 5,675.88, down 1% on the month but up 32% on the year; SGX shares closed up 0.4% at S$20.73.", "url": "https://www.businesstimes.com.sg/companies-markets/sgx-securities-trading-value-27-september-derivatives-volume-rebounds"}, {"id": "bt-13oct-13", "title": "SGX woos European traders with new futures window", "source": "BT", "date": "13 Oct 2026", "tags": ["Finance & Markets", "Southeast Asia"], "summary": "SGX will open a one-hour liquidity window for its bond futures from Oct 13 at 10 am London time (5 pm in Singapore), aiming to let European market makers and asset managers trade Asian bonds during their working day. The exchange has struggled to broaden its rates franchise beyond its fast-growing Japanese government bond futures, with volumes in all its new Asia-Pacific contracts except India at zero through August. SGX launched government bond futures for India, Indonesia, Thailand, Malaysia and the Philippines earlier in 2026, alongside 20-year Japanese futures. It will also open a window for Indian investors from 11 am to 12.30 pm Singapore time from Oct 13, which head of rates and derivatives William Chin said aims to break a \"chicken-and-egg cycle\" between pricing and demand.", "url": "https://www.businesstimes.com.sg/companies-markets/sgx-woos-european-traders-new-futures-window"}, {"id": "bt-13oct-14", "title": "Saudi Arabia eyes raising its pipeline oil export capacity to 10 million bpd: energy minister", "source": "BT", "date": "13 Oct 2026", "tags": ["Energy"], "summary": "Saudi Energy Minister Prince Abdulaziz bin Salman said on Oct 12 the kingdom aims to expand pipeline crude export capacity to as much as 10 million barrels per day by repurposing a domestic gas pipeline and investing in its East-West network. Temporarily converting the gas pipeline could add up to 1.2 million bpd within seven to eight weeks, and up to 3 million bpd in total with further investment, he told the World Petroleum Congress in Riyadh. Saudi Aramco may use the pipeline for oil until May, after which it must be cleaned and returned to gas service before summer. Pumping-station upgrades on the East-West pipeline could lift capacity to divert shipments from Gulf and Red Sea routes to around 10 million bpd over two to three years.", "url": "https://www.businesstimes.com.sg/companies-markets/energy-commodities/saudi-arabia-eyes-raising-its-pipeline-oil-export-capacity-10-million-bpd-energy-minister"}, {"id": "bt-13oct-15", "title": "Saudi airport carnage puts Trump in ‘difficult position’ amid pressure to boost US role in Yemen", "source": "BT", "date": "13 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "Houthi drone and missile strikes on Riyadh's main airport over the weekend killed at least 16 people, including a US citizen, and wounded roughly 300 in the deadliest attack on Saudi Arabia in decades, raising pressure on Washington to help its ally against the Iran-backed group in Yemen. The US already provides intelligence, targeting and aerial refuelling but has resisted direct involvement; President Donald Trump said over the weekend he would look into joining Saudi-backed strikes. The flare-up comes as his Republicans face tough midterms after the Iran war raised oil prices, and aiding strikes could jeopardise the US ceasefire with the Houthis. People familiar say Riyadh is frustrated with limited Western help, while Middle East Institute's Karen Young expects US help to stop at more intelligence.", "url": "https://www.businesstimes.com.sg/international/saudi-airport-carnage-puts-trump-difficult-position-amid-pressure-boost-us-role-yemen"}, {"id": "bt-13oct-16", "title": "Singapore workers embrace AI faster than global peers, but fewer feel secure in their jobs: PwC survey", "source": "BT", "date": "13 Oct 2026", "tags": ["Technology & AI", "Society", "Southeast Asia"], "summary": "PwC's Global Workforce Hopes and Fears Survey 2026 found 69% of Singapore respondents moderately to extremely confident about their job security over the next 12 months, down from 72% in 2025 and 84% in 2024, while the global figure was 84% (85% in 2025). Singapore leads on adoption: 74% used AI at work in the past year versus 64% globally, and 28% use gen AI daily versus 22%, with job confidence higher among daily gen AI users (75%) than non-users (61%). Economic volatility (60%) and AI taking on more tasks (53%, versus 44% globally) were the top perceived threats, and 36% cited fatigue or burnout as the main productivity limiter. PwC Singapore also signed an MOU to join NTUC's AI-Ready SG initiative.", "url": "https://www.businesstimes.com.sg/singapore/singapore-workers-embrace-ai-faster-global-peers-fewer-feel-secure-their-jobs-pwc-survey"}, {"id": "bt-13oct-17", "title": "Singapore’s low-carbon electricity 2035 target is ‘aspirational’: EMA", "source": "BT", "date": "13 Oct 2026", "tags": ["Energy", "Southeast Asia"], "summary": "Singapore's target of importing 6 GW of low-carbon electricity by 2035 is aspirational, an Energy Market Authority spokesperson told BT on Oct 12, saying delivery depends on source- and transit-country approvals and commercial demand from Singapore consumers. BT sought comment after Wood MacKenzie said last week imports would likely reach only half the target, or 15% of the generation mix. EMA has given conditional licences and approvals for 9.25 GW from Malaysia, Indonesia, Vietnam, Cambodia and Australia, but Wood MacKenzie says none has begun construction; the two Malaysian projects are most viable, while Indonesian projects have stalled over five-yearly export permit renewals. Singapore generates 95% of its electricity from natural gas and will keep building gas import infrastructure.", "url": "https://www.businesstimes.com.sg/esg/singapores-low-carbon-electricity-2035-target-aspirational-ema"}, {"id": "bt-13oct-18", "title": "The huge lurking leverage of AI hyperscalers", "source": "BT", "date": "13 Oct 2026", "tags": ["Finance & Markets", "Technology & AI"], "summary": "In an FT column carried by BT, a bond portfolio manager at Barksdale Investment Management argues creditors are scrutinising AI hyperscalers' off-balance-sheet lease obligations that equity investors overlook. The writer notes Meta disclosed some US$347 billion in future lease obligations on projects not yet commenced, against US$84 billion of on-balance-sheet debt at end-2025, and says only a double-digit discount rate would bring their present value below US$100 billion. With sell-side capex estimates above US$500 billion through 2028 exceeding forecast operating cash flow, the writer says Meta's double A-rated bonds trade more like high-BBB Verizon debt, though its P/E is more than twice Verizon's. The column warns hyperscaler bond prices and P/E ratios may be much lower once leases come into focus.", "url": "https://www.businesstimes.com.sg/opinion-features/huge-lurking-leverage-ai-hyperscalers"}, {"id": "bt-13oct-19", "title": "US reverses course on request that AI developers not share models for UK testing: Telegraph", "source": "BT", "date": "13 Oct 2026", "tags": ["Technology & AI", "Geopolitics"], "summary": "The Trump administration has reversed a request that US AI developers such as OpenAI and Anthropic not share new models with Britain's AI Security Institute before release, the Telegraph reported on Oct 11, according to Reuters. American developers can now give the British government early access to models for safety testing without running afoul of the administration, the newspaper said. Reuters says the change signals a softer US stance on international AI safety efforts; Trump has repeatedly dismissed binding safety requirements, and his newly launched AI task force said on Oct 9 developers must report security incidents with their models. Spokespersons for Trump, OpenAI and Anthropic did not immediately respond to Reuters.", "url": "https://www.businesstimes.com.sg/international/us-reverses-course-request-ai-developers-not-share-models-uk-testing-telegraph"}, {"id": "scmp-13oct-01", "title": "AI fuelling growth while putting Asia’s young workers at risk, IMF meeting hears", "source": "SCMP", "date": "13 Oct 2026", "tags": ["Technology & AI", "Society", "Southeast Asia"], "summary": "IMF Managing Director Kristalina Georgieva told the IMF–World Bank annual meetings in Bangkok on Oct 12 that the multi-trillion-dollar AI investment surge is keeping global growth at 3% despite the energy shock, but warned of a \"slow-moving tsunami\" for jobs. The IMF estimates 40% of jobs will be augmented, downgraded or eliminated, rising to 60% in advanced economies and about 23% in low-income countries. Advanced Asian economies could gain up to 1 percentage point of annual growth from AI adoption, slower adopters 0.2–0.8 points. Singapore President Tharman Shanmugaratnam urged urgent education reform, warning AI will widen the divergence between growth and job creation if governments are too passive; Thailand spent nearly US$35 million hosting the meetings.", "url": "https://www.scmp.com/week-asia/economics/article/3370618/ai-fuelling-growth-while-putting-asias-young-workers-risk-imf-meeting-hears"}, {"id": "scmp-13oct-02", "title": "As AI and the Iran war loom, China’s energy technocrats are on the fast track", "source": "SCMP", "date": "13 Oct 2026", "tags": ["Politics", "Energy"], "summary": "In a special contribution from the University of Hong Kong's Centre on Contemporary China and the World, Li Cheng argues that energy technocrats on the Communist Party's 20th Central Committee are well placed to manage China's energy security and AI build-out. His data set counts 34 members with energy backgrounds – 21 full members and 13 alternates, 9% of combined membership – including three Politburo members, 12.5% of its 24 seats; 29 had at least 10 years of energy experience by October 2022. He profiles Zhang Yuzhuo, Liu Ning and Yang Jinbai as cases of deep specialisation followed by broader governing roles. He cites a Guizhou substation finished three months early and, per the IEA, pre-war oil stockpiles that helped China weather Hormuz disruptions.", "url": "https://www.scmp.com/news/china/politics/article/3370383/ai-and-iran-war-loom-chinas-energy-technocrats-are-fast-track"}, {"id": "scmp-13oct-03", "title": "Beijing is right to reserve its fiscal firepower", "source": "SCMP", "date": "13 Oct 2026", "tags": ["Finance & Markets", "Politics"], "summary": "An unsigned SCMP opinion piece argues Beijing is right to favour targeted stimulus over a repeat of September 2024's broad expansion, as Finance Minister Lan Foan's latest article stresses precision and effectiveness ahead of the fifth plenum in late October. Lan reports about 5.8 trillion yuan (US$865 billion) of a 6 trillion yuan programme to swap local hidden debt has been issued, and warns new hidden debt will be punished. The piece says the harder task is local finances: central spending rose 6% in the first eight months against 0.3% for local governments, and the general budget deficit is budgeted at a record 5.89 trillion yuan this year. It backs giving local governments wider tax sources, noting fixed-asset investment has fallen 7.2% this year.", "url": "https://www.scmp.com/opinion/comment/article/3370467/beijing-right-reserve-its-fiscal-firepower"}, {"id": "scmp-13oct-04", "title": "Beijing moves to steady A-share market after sharp tech sell-off", "source": "SCMP", "date": "13 Oct 2026", "tags": ["Finance & Markets"], "summary": "China Securities Regulatory Commission (CSRC) head Wu Qing chaired a symposium with listed companies, securities firms and fund managers in Beijing on Oct 10 to shore up A-share sentiment after a tech sell-off driven by concerns over US sanctions. The CSI 300 fell 12% in the third quarter as the Star Market 50 slumped 31%; on Oct 9 the ChiNext briefly fell below 3,000 points and the Star 50 dropped more than 4% intraday before heavy buying that some participants linked to government-backed funds. No new policy measures were announced; experts proposed stronger stabilisation mechanisms, more medium- and long-term funds, and higher dividends and buy-backs. CCB International and Zheshang Securities warned of a challenging fourth quarter.", "url": "https://www.scmp.com/business/banking-finance/article/3370506/beijing-moves-steady-share-market-after-sharp-tech-sell"}, {"id": "scmp-13oct-05", "title": "Beijing sanctions Paraguayan and Belizean ministers over support for Taiwan", "source": "SCMP", "date": "13 Oct 2026", "tags": ["Geopolitics"], "summary": "China's foreign ministry on Oct 12 sanctioned Paraguay's information and communication technologies minister Gustavo Villate and Belize's foreign minister Francis Fonseca under its anti-foreign sanction law over their support for Taiwan, freezing their assets in China and barring them from entering China, including Hong Kong and Macau. Spokeswoman Mao Ning accused the pair of acting as \"pawns for the Taiwan authorities\" and accused officials of spreading false claims of Chinese cyberattacks, after Paraguay and the US embassy said in July that China-linked actors had breached state systems. Belize signed a diplomatic training deal with Taiwan in late September, and Taiwan plans a US$200 million data centre in Paraguay. Both are among 12 countries with diplomatic ties to Taipei.", "url": "https://www.scmp.com/news/china/diplomacy/article/3370553/beijing-sanctions-paraguayan-and-belizean-ministers-over-support-taiwan"}, {"id": "scmp-13oct-06", "title": "Cheap debt is not enough to get China’s homebuyers spending again", "source": "SCMP", "date": "13 Oct 2026", "tags": ["Finance & Markets", "Society"], "summary": "An SCMP editorial argues Beijing's new mortgage interest subsidy – one percentage point for up to five years for eligible first-time buyers who borrow within the next 12 months – will not revive housing demand because households are shunning debt. Outstanding household mortgages had fallen year on year for 13 consecutive quarters by end-June, and more than a quarter of Shenzhen existing-home deals in the first half were paid fully in cash. Consumer loan balances fell by more than 1 trillion yuan (US$149.4 billion) in the first half despite interest subsidies, and only 9% of China Index Academy respondents in August expected home prices to rise. The editorial urges Beijing to use central funds to buy up excess housing supply instead.", "url": "https://www.scmp.com/opinion/china-opinion/article/3370325/cheap-debt-not-enough-get-chinas-homebuyers-spending-again"}, {"id": "scmp-13oct-07", "title": "China’s CXMT unveils ‘key progress’ on chip structure pursued by Samsung, SK Hynix", "source": "SCMP", "date": "13 Oct 2026", "tags": ["Technology & AI", "Finance & Markets"], "summary": "ChangXin Memory Technologies (CXMT) says it has made \"key progress\" on a 4F square memory cell architecture, which fits more cells on a chip than the 6F square structure used in mainstream DRAM, and plans a server-memory product based on it by end-2026. President Cao Kanyu outlined the plan at an industrial event in Shanghai over the weekend, according to a company statement. The design rests on CXMT's proprietary Vertical Surrounding Gate (VSG) transistor, and the Hefei-based firm expects to release a new-generation DDR5 RDIMM for enterprise servers by year-end, without giving specifications or a launch date. SK Hynix unveiled a 4F square road map in 2025, and Samsung plans sub-10-nanometre DRAM on the design by 2028, according to The Elec.", "url": "https://www.scmp.com/tech/big-tech/article/3370505/chinas-cxmt-unveils-key-progress-chip-structure-pursued-samsung-sk-hynix"}, {"id": "scmp-13oct-08", "title": "DeepSeek’s cost-saving AI may lead to inaccuracy in model performance: research", "source": "SCMP", "date": "13 Oct 2026", "tags": ["Technology & AI"], "summary": "A paper led by ByteDance researchers with co-authors affiliated with Princeton, Stanford and UC Berkeley, published late last month and not peer-reviewed, says the memory-saving compression behind DeepSeek's models can undermine reliability. Testing retrieval over contexts of about 128,000 tokens, the researchers found accuracy of the flagship DeepSeek-V4 family can vary by up to 40 percentage points depending on where information falls within compressed segments. The effect appeared in DeepSeek-V4, V4.1 and all compressed models the researchers pretrained, and adding irrelevant text before the same code impaired answers. The authors cautioned the results come from controlled experiments with limited coding examples; DeepSeek and ByteDance did not respond to requests for comment.", "url": "https://www.scmp.com/tech/tech-trends/article/3370550/deepseeks-cost-saving-ai-may-lead-inaccuracy-model-performance-research"}, {"id": "scmp-13oct-09", "title": "Don’t leave Asia’s ageing debate until it’s too late", "source": "SCMP", "date": "13 Oct 2026", "tags": ["Society", "Southeast Asia"], "summary": "In an SCMP opinion piece, a Bangkok-based writer who ended up in intensive care at 37 argues that Asia's ageing makes health a business issue and that conversations about ageing should start at 40. The writer notes Japan's over-65s are a record 29.6% of the population, and 9.43 million workers aged 65 or older made up about 13.8% of the employed last year. Citing Mayo Clinic research on WHO data, the piece says the gap between lifespan and healthspan reached 9.6 years by 2019, while the World Bank projects Thailand's over-65 share rising from 13% in 2020 to 31% in 2060. The writer urges boards to treat key-person health like succession risk, ahead of an Asia-Pacific ageing conference in Hangzhou later this month.", "url": "https://www.scmp.com/opinion/asia-opinion/article/3370071/dont-leave-asias-ageing-debate-until-its-too-late"}, {"id": "scmp-13oct-10", "title": "Elon Musk becomes biggest known donor in midterm elections in bid to save Republicans", "source": "SCMP", "date": "13 Oct 2026", "tags": ["Politics"], "summary": "Elon Musk has given more than US$276 million since July to support Republican majorities in Congress, making him the biggest known donor in the midterm elections, according to figures first reported by the New York Times and confirmed by Andrew Romeo, a spokesman for Musk's super PAC, AP reports. The total includes US$158 million to the Senate Leadership Fund, US$76 million to Musk's America PAC and US$10 million to Lone Star Liberty PAC, which backs Texas Senate nominee Ken Paxton. The spending reverses Musk's statement last May that he would cut back, and gives Republicans a large financial advantage as they brace for potential losses. Democrats' Senate Majority PAC accused Republicans of trying to \"buy these elections\".", "url": "https://www.scmp.com/news/world/united-states-canada/article/3370645/elon-musk-becomes-biggest-known-donor-midterm-elections-bid-save-republicans"}, {"id": "scmp-13oct-11", "title": "Global diesel shortage: why Gulf refined fuel exports lag crude oil shipments", "source": "SCMP", "date": "13 Oct 2026", "tags": ["Energy", "Finance & Markets"], "summary": "Global diesel prices remain near record highs as Gulf net diesel exports averaged 390,000 barrels per day in August, just over a quarter of pre-war levels, according to IEA data, even as crude shipments recovered via ship-to-ship transfers. Analysts say Gulf infrastructure is geared to crude, and Guotai Junan Futures analyst Zhao Xuyi said the G7's planned 100 million-barrel release announced on Oct 2 can only ease the short-term shortage. SCMP calculates diesel prices have risen more than 66% since the Iran war began in late February, and the IEA says observed inventories have fallen 507 million barrels. Trump said on Oct 9 that Russia agreed to supply more than 300,000 tonnes of diesel; analyst Rory Johnston called it \"a nothing burger\".", "url": "https://www.scmp.com/economy/global-economy/article/3370606/global-diesel-shortage-why-gulf-refined-fuel-exports-lag-crude-oil-shipments"}, {"id": "scmp-13oct-12", "title": "Hong Kong to expand indices, derivatives and yuan-denominated products: HKEX CEO", "source": "SCMP", "date": "13 Oct 2026", "tags": ["Finance & Markets"], "summary": "HKEX CEO Bonnie Chan Yiting said in an Oct 12 blog post that the bourse plans a redesigned yuan-denominated gold futures contract, more indices, bond futures and equity derivatives as it seeks to boost liquidity and yuan internationalisation. HKEX will work with mainland partners to add Reits to the connect schemes and include yuan counters in southbound Stock Connect. Issuance of HKEX-listed dim sum bonds rose 14% year on year to 266.9 billion yuan (US$39.9 billion) as of Sept 24, on track for a record year, while US dollar gold futures relaunched in July have hit record volume and open interest. An additional 12 single-stock option classes will launch in November, adding to 38 weekly stock options launched this year.", "url": "https://www.scmp.com/business/markets/article/3370617/hong-kong-expand-indices-derivatives-and-yuan-denominated-products-hkex-ceo"}, {"id": "scmp-13oct-13", "title": "Mapping US chip supply chain: China accounts for far more than it appears, report says", "source": "SCMP", "date": "13 Oct 2026", "tags": ["Technology & AI", "Trade"], "summary": "A Semiconductor Industry Association (SIA) report published on Oct 9 says China supplies about 5% of the equipment and materials bought directly by the US chip industry by country of manufacture, up from about 1% by supplier headquarters, but controls over 90% of some rare earths used in chipmaking. While 95% of the nearly US$27 billion US chipmakers spend annually is sourced from US, European and Japanese firms, that falls to 68% by country of origin, and Southeast Asia's share rises from under 1% to 10%. China accounts for about 95% of gallium, 85% of tungsten and about 95% of neodymium-praseodymium and terbium supply. The SIA urges stockpiling and allied alternatives, warning some capacity could take a decade or more to build.", "url": "https://www.scmp.com/tech/tech-trends/article/3370581/mapping-us-chip-supply-chain-china-accounts-far-more-it-appears-report-says"}, {"id": "scmp-13oct-14", "title": "OpenAI’s GPT-6 may lead to robotics breakthrough as soon as next year: Unitree founder", "source": "SCMP", "date": "13 Oct 2026", "tags": ["Technology & AI"], "summary": "Unitree Robotics founder and CEO Wang Xingxing said on Oct 12 that OpenAI's recently released GPT-6 has raised expectations of a robotics breakthrough \"within one or two years\", and that a GPT-7 released next year could crack embodied intelligence. Speaking on the opening day of the 26th China International Industry Fair in Shanghai, Wang said Unitree had tested the GPT-6 Astra model, unveiled in September, on its own robots with good results. In August he had said the industry's ChatGPT moment – robots completing around 80% of tasks in 80% of unfamiliar environments – could take two to three years or up to a decade. Unitree plans to put about half its IPO proceeds into robotic-model R&D and is running factory trials.", "url": "https://www.scmp.com/tech/big-tech/article/3370603/openais-gpt-6-may-lead-robotics-breakthrough-soon-next-year-unitree-founder"}, {"id": "scmp-13oct-15", "title": "US turns to low-cost Blackbeard hypersonic missiles to overwhelm Chinese defences", "source": "SCMP", "date": "13 Oct 2026", "tags": ["Defence", "Geopolitics"], "summary": "The US Navy aims to field Castelion's Blackbeard, a low-cost hypersonic missile designed to fly at more than five times the speed of sound, on carrier-based fighters, which experts say could challenge air defences protecting Chinese warships and coastal sites. The Pentagon sought in May to buy more than 12,000 Blackbeards over five years, with navy projections putting the average unit cost at about US$385,000, versus about US$3.25 million for Lockheed Martin's LRASM; the navy ordered 50 pre-production missiles in June and 444 in September, according to USNI. Experts say cheap mass salvoes could exhaust Chinese interceptors, but Timothy Heath and Lyle Goldstein flagged the vulnerability of US carriers and aircraft as a major limitation near Taiwan. The missile's range and ability to hit moving ships remain undemonstrated.", "url": "https://www.scmp.com/news/china/military/article/3370598/us-turns-low-cost-blackbeard-hypersonic-missiles-overwhelm-chinese-defences"}, {"id": "scmp-13oct-16", "title": "Why China is likely to be cautious about recent Trump-Putin diesel deal", "source": "SCMP", "date": "13 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "Chinese analysts quoted by SCMP say Beijing is likely to view Donald Trump's diesel deal with Vladimir Putin as \"transactional\" and to wait and see, given the risk he changes course. Trump said Russia would immediately supply more than 300,000 tonnes of diesel, with 500,000 tonnes in November and a further 1 million tonnes later, three weeks after he signed the Lindsey O. Graham Sanctioning Russia and Iran Act allowing penalties on major buyers of Russian energy. Cui Hongjian of Beijing Foreign Studies University expects little impact on China's energy trade with Russia, while HKU's Zhang Chi said the act's secondary sanctions could still target other importers. Nanjing University's Ma Bo called it a possible one-time offer ahead of the Nov 3 midterms.", "url": "https://www.scmp.com/news/china/diplomacy/article/3370620/why-china-likely-be-cautious-about-recent-trump-putin-diesel-deal"}, {"id": "tass-13oct-01", "title": "China, Russia hold similar views on Northern Sea Route — Chinese foreign minister", "source": "TASS", "date": "13 Oct 2026", "tags": ["Geopolitics", "Trade"], "summary": "Chinese Foreign Minister Wang Yi said China and Russia share similar views on developing the Northern Sea Route, TASS reports, citing the Chinese Foreign Ministry website. Wang made the remarks in Beijing at a meeting with Nikolay Patrushev, an aide to the Russian president and chairman of the Maritime Collegium. According to the ministry, Wang said China's Ice Silk Road efforts and Russia's development of the route are \"fully aligned\" and that maritime cooperation within the two countries' comprehensive strategic partnership is growing in importance. He said both, as permanent UN Security Council members and maritime powers, bear significant responsibility for international maritime affairs.", "url": "https://tass.com/world/2201041"}, {"id": "tass-13oct-02", "title": "EU criticism of US-Russia diesel deal hypocritical — presidential envoy", "source": "TASS", "date": "13 Oct 2026", "tags": ["Energy", "Geopolitics"], "summary": "Kirill Dmitriev, Russia's presidential special envoy for investment and economic cooperation and RDIF CEO, called European officials' criticism of the US-Russia diesel deal hypocritical in a post on X, TASS reports. He was commenting on Deputy Prime Minister Alexander Novak's statement that Europe has received US$320.7 billion of Russian energy supplies since 2022. TASS says Vladimir Putin and Donald Trump discussed oil product supplies in an Oct 9 phone call, and that the US is exempting Russian diesel supplies to global markets from US sanctions until April 7, 2027. Novak said Russia is beginning to lift its diesel export ban ahead of schedule and is ready to supply 300,000 tonnes in October, 500,000 in November and 1 million in December.", "url": "https://tass.com/politics/2201147"}, {"id": "tass-13oct-03", "title": "EU imposes sanctions on 26 Russian shipyards and their heads", "source": "TASS", "date": "13 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "The EU has added 26 Russian shipbuilding enterprises and their executives to its 22nd sanctions package, TASS reports, citing a Council of the EU regulation in the Official Journal of the European Union. Targets include United Shipbuilding Corporation subsidiaries such as Admiralty Shipyards and CEO Andrey Veselov, Sredne-Nevsky Shipyard and CEO Sergey Karachkov, Amur Shipyard and head Mikhail Borovsky, and the Nevsky Shipyard and Ship-Repair Plant. The list also covers the Ship-Repair and Shipbuilding Corporation, Baltic Shipyard No. 33, the Black Sea Fleet's 13th Shipyard and Rybinsk Shipyard. According to the EU, all are part of Russia's defence-industrial base and their executives support its military-industrial complex.", "url": "https://tass.com/world/2201053"}, {"id": "tass-13oct-04", "title": "France detains tanker DF Peak off coast of Reunion — Macron", "source": "TASS", "date": "13 Oct 2026", "tags": ["Geopolitics", "Energy"], "summary": "The French Navy detained the oil tanker DF Peak more than 450 nautical miles south of Reunion Island in the Indian Ocean on suspicion of sailing under a false flag, President Emmanuel Macron said on X, TASS reports. Macron said the action was part of the fight against the so-called shadow fleet. According to TASS, he said the operation complied with international law and showed Paris's intention to combat all types of what it considers illegal trade.", "url": "https://tass.com/world/2201109"}, {"id": "tass-13oct-05", "title": "Global oil demand to grow by 0.4 mln barrels daily in 2026 — OPEC Secretary General", "source": "TASS", "date": "13 Oct 2026", "tags": ["Energy", "Finance & Markets"], "summary": "OPEC now expects global oil demand to grow by 400,000 barrels per day in 2026, down from the 1.4 million bpd it forecast at the start of the year, Secretary General Haitham Al-Ghais said at the WPC Energy congress, TASS reports. Al-Ghais said the forecast was revised down in tandem with the unfolding of events. He said the demand has been deferred to 2027, when OPEC expects pent-up demand and now forecasts growth of 1.7 million bpd.", "url": "https://tass.com/economy/2200903"}, {"id": "tass-13oct-06", "title": "Hormuz clogging stop 6-7 million bpd of oil from reaching markets — Russian deputy PM", "source": "TASS", "date": "13 Oct 2026", "tags": ["Energy", "Geopolitics"], "summary": "Russian Deputy Prime Minister Alexander Novak said about 6-7 million barrels per day of oil is not reaching world markets through the Strait of Hormuz, TASS reports, citing his interview with Vesti. Novak said the figure was noted at a meeting of ministers, including those of OPEC+ countries, on the sidelines of the World Petroleum Congress in Riyadh, which discussed the global oil market and implementation of the agreement. He said the shortfall significantly unbalances supply and demand and is creating \"serious volatility in the market today\".", "url": "https://tass.com/economy/2201117"}, {"id": "tass-13oct-07", "title": "Houthis say they attacked Riyadh airport with ballistic missile", "source": "TASS", "date": "13 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "Yemen's Houthi movement Ansar Allah says it struck King Khalid International Airport in Riyadh with a ballistic missile, TASS reports, citing Houthi spokesman Yahya Saria on Telegram. Saria called the strike precise, said a Houthi drone also hit an airbase in the Saudi city of Khamis Mushait, and warned international airlines and passengers that all Saudi airports except those in Mecca and Medina are \"unsafe\". TASS notes that the Saudi-led coalition said earlier it had repelled a Houthi missile attack on Riyadh.", "url": "https://tass.com/world/2201133"}, {"id": "tass-13oct-08", "title": "IN BRIEF: EU adds about 1,600 companies, individuals to anti-Russian sanction list", "source": "TASS", "date": "13 Oct 2026", "tags": ["Geopolitics", "Defence"], "summary": "The EU app
