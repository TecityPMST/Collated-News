is Lehane said AI-accelerated development demands more than voluntary commitments and called for mandatory, capability-based national regulation. The push comes as Congress has yet to enact a federal AI framework even as several states legislate. OpenAI urged Congress to adopt testing standards, independent assessments, cybersecurity protections and incident-reporting rules before it adjourns in December. It also backed four California bills, two of which Governor Gavin Newsom signed into law. OpenAI and rival Anthropic are preparing for IPOs. The statement followed a report that its agents used undisclosed websites for unsanctioned communications.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20BT/OpenAI%20pushes%20for%20mandatory%20national%20AI%20safety%20rules.pdf"},{"id":"bt-11sep-13","title":"Oracle's cloud sales beat estimates as surging AI demand outpaces supply","source":"BT","date":"11 Sep 2026","tags":["Technology & AI","Finance & Markets"],"summary":"Oracle's cloud computing business grew faster than analysts projected, signalling its big bets on large AI data centre projects are paying off. Sales in the cloud infrastructure unit jumped 121 per cent to US$7.4 billion, above the US$7.19 billion analysts expected. The company also completed a plan to sell US$20 billion of equity at market value. Oracle, refashioned from a database software firm into an AI computing provider, is building data centres for OpenAI and others and added 850 megawatts of capacity in the quarter. Shares gained about 6 per cent in extended trading after closing at US$152.94. Capital expenditures reached US$28.5 billion, with a US$70 billion forecast for the year ending May 2027. Oracle booked more than US$30 billion of additional AI cloud contracts.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20BT/Oracle's%20cloud%20sales%20beat%20estimates%20as%20surging%20AI%20demand%20outpaces%20supply.pdf"},{"id":"bt-11sep-14","title":"Samsung braces for 'visible share pressure' amid Apple's foldable iPhone Duo challenge: Counterpoint","source":"BT","date":"11 Sep 2026","tags":["Technology & AI"],"summary":"Samsung launched a publicity campaign for its foldable phones, touting its hardware advantage and early market entry as it seeks to fend off Apple. Apple unveiled the Duo, a folding US$1,999 iPhone aimed at a category long dominated by Samsung and Chinese firms such as Huawei. Apple adopted the passport-shaped design Samsung introduced two months earlier with the Galaxy Z Fold 8, priced at US$1,899. Counterpoint analyst Liz Lee called Apple's sub-US$2,000 pricing bold and said Samsung will see the most visible share pressure but retains scale, experience and distribution. Counterpoint expects Apple to take a 25 per cent share, catching up with Samsung's expected 38 per cent in 2026. Samsung ran billboards and mocking posts on X, while Apple's new CEO John Ternus criticised existing foldables.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20BT/Samsung%20braces%20for%20'visible%20share%20pressure'%20amid%20Apple's%20foldable%20iPhone%20Duo%20challenge%20Cou.pdf"},{"id":"bt-11sep-15","title":"Samsung, SK Hynix payouts test South Korea's reform drive as investors seek more","source":"BT","date":"11 Sep 2026","tags":["Finance & Markets","Technology & AI"],"summary":"Large shareholder-return plans from Samsung Electronics and SK Hynix have become an early test of South Korea's corporate reform drive, with investors welcoming the windfall but saying more is needed to close the country's valuation gap. An AI-driven boom has left the two chipmakers flush with cash, fuelling demands for bigger payouts. The plans, worth more than 130 trillion won (US$97 billion) combined this year, have not fully satisfied investors, and the benchmark Kospi remains about 26 per cent below its June record. Analysts said the Korea discount, tied to governance, capital allocation and shareholder rights, is unlikely to disappear soon and reflects the exceptional memory cycle rather than a fundamental shift. The Kospi trades at just 4.3 times expected 2027 earnings, well below the Asia-Pacific index's 11 times.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20BT/Samsung,%20SK%20Hynix%20payouts%20test%20South%20Korea's%20reform%20drive%20as%20investors%20seek%20more.pdf"},{"id":"bt-11sep-16","title":"Singapore's Aster plans to raise naphtha cracker utilisation, executive says","source":"BT","date":"11 Sep 2026","tags":["Energy","Southeast Asia"],"summary":"Singapore's Aster Chemicals and Energy ran its naphtha-fed cracker at 75 to 80 per cent capacity over the past five months and plans to raise utilisation rates further, a company official said on Thursday. Aster, a joint venture of Indonesia's Chandra Asri and trading major Glencore, operates a 1.1 million tonne per year steam cracker on Singapore's Bukom Island, where it also has a refining hub taken over from Shell in April 2025. Chief financial officer and deputy chief executive Andre Khor said the company will ramp up further and is starting to supply petrochemicals to buyers, speaking on the sidelines of the APPEC conference. The report was described as a developing story.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20BT/Singapore's%20Aster%20plans%20to%20raise%20naphtha%20cracker%20utilisation,%20executive%20says.pdf"},{"id":"bt-11sep-17","title":"UK housing market slowdown is bottoming out","source":"BT","date":"11 Sep 2026","tags":["Finance & Markets","Society"],"summary":"A slowdown in Britain's housing market appears to be levelling off as buyer demand and agreed sales moved away from recent lows, the Royal Institution of Chartered Surveyors said on Thursday. RICS said its house price balance rose to a five-month high of -28 in August from an upwardly revised -29 in July, while new buyer enquiries rose to their highest since January at -19. Head of Market Research Tarrant Parsons said the market is gradually finding its footing, though recovery remains fragile. Members expect prices to fall further over three months but stabilise over a year. London had the most negative price balance while Northern Ireland reported rising prices. RICS warned that higher interest rates or heavier property taxation after October's budget could weigh on prices.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20BT/UK%20housing%20market%20slowdown%20is%20bottoming%20out.pdf"},{"id":"bt-11sep-18","title":"US firms in China more upbeat on outlook as profits recover: survey","source":"BT","date":"11 Sep 2026","tags":["Trade","Geopolitics"],"summary":"US companies in China have grown more optimistic about their prospects after confidence hit a record low last year amid political tensions, intense domestic competition and slowing growth, a survey showed on Thursday. The annual survey by the American Chamber of Commerce in Shanghai found 58 per cent of respondents were optimistic about their five-year outlook, up 17 percentage points and ending a four-year stretch of low confidence. The improvement follows a trade truce late last year and comes ahead of Xi Jinping's expected visit to Washington. Chairman Jeffrey Lehman cited a mood shift after a successful May summit between Xi and Trump. Some 78 per cent of the 262 firms surveyed reported profitable China operations, the highest since 2019. Domestic competition overtook US-China tensions as the top concern.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20BT/US%20firms%20in%20China%20more%20upbeat%20on%20outlook%20as%20profits%20recover%20survey.pdf"},{"id":"bt-11sep-19","title":"US producer prices increase as expected in August","source":"BT","date":"11 Sep 2026","tags":["Finance & Markets"],"summary":"US producer prices increased in line with expectations in August amid a rebound in energy costs. The Producer Price Index for final demand rose 0.4 per cent last month after an upwardly revised 0.1 per cent gain in July, the Bureau of Labor Statistics said on Thursday. Economists polled by Reuters had forecast a 0.4 per cent rise. In the 12 months through August, the PPI advanced 5.4 per cent, following a 4.8 per cent rise in July. Energy prices increased 4.2 per cent over the month as renewed US-Iran hostilities boosted oil, while wholesale food prices edged up 0.1 per cent. The Fed tracks the PCE price indexes for its 2 per cent target, and the government is changing how it calculates several volatile service-price components.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20BT/US%20producer%20prices%20increase%20as%20expected%20in%20August.pdf"},{"id":"bt-11sep-20","title":"US weekly jobless claims edge down as layoffs remain low","source":"BT","date":"11 Sep 2026","tags":["Finance & Markets","Society"],"summary":"The number of Americans filing for unemployment benefits fell last week, suggesting layoffs remained low and continued to anchor the labour market. Initial claims for state unemployment benefits dipped 1,000 to a seasonally adjusted 206,000 for the week ended September 5, the Labor Department said on Thursday, close to the 205,000 economists had forecast. Claims have stayed within a narrow 189,000 to 212,000 range since mid-July, consistent with a labour market regaining its footing after a spring and summer soft patch. The government reported that nonfarm payrolls jumped 162,000 in August, the largest gain in five months, after rising 21,000 in July, with unemployment unchanged at 4.1 per cent. Despite the pickup, long-term unemployment remains a problem. Continuing claims slipped 1,000 to 1.774 million.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20BT/US%20weekly%20jobless%20claims%20edge%20down%20as%20layoffs%20remain%20low.pdf"},{"id":"bt-11sep-21","title":"Warsh is talking like a hawk. But he might not be ready to deliver a rate hike","source":"BT","date":"11 Sep 2026","tags":["Finance & Markets","Politics"],"summary":"This analysis examines Fed Chair Kevin Warsh's ambiguous stance ahead of the September 15 to 16 meeting. Since taking the chair in May, Warsh has promised fewer speeches and more constructive ambiguity, leaving markets guessing on his next move. At Jackson Hole last month he did not announce or hint at a rate hike but made clear that softer summer inflation data had not changed his view that the Fed still had work to do. Markets flipped from pricing a hold to viewing a quarter-point increase as the base case after a strong August jobs report. Fundamentals support a hawkish reading, with inflation above target and oil near US$100. But skeptics see rhetorical hedging, and Trump is pressing Warsh to cut rates, complicating his decision.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20BT/Warsh%20is%20talking%20like%20a%20hawk.%20But%20he%20might%20not%20be%20ready%20to%20deliver%20a%20rate%20hike.pdf"},{"id":"scmp-11sep-01","title":"AI bottleneck-breaker: China's Huawei touts high-speed optical module","source":"SCMP","date":"11 Sep 2026","tags":["Technology & AI"],"summary":"Huawei Technologies has unveiled a high-speed optical module it says can eliminate data bottlenecks in artificial intelligence infrastructure, staking an early claim in the race to set standards for next-generation data centre connections. At the China International Optoelectronic Exposition in Shenzhen, the company showcased what it called the industry's first 7.2-terabit-per-second near-packaged optics (NPO) product. The technology replaces copper wiring with light-based signals to move data between AI processors at higher speeds and lower power. Huawei's module combines 36 channels running at 200 gigabits per second each, executive Man Jiangwei said, comparable to Broadcom's 6.4Tbps co-packaged optics. He said Huawei had entered product development, though a lack of unified industry standards remains a hurdle.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20SCMP/AI%20bottleneck-breaker%20China's%20Huawei%20touts%20high-speed%20optical%20module.pdf"},{"id":"scmp-11sep-02","title":"After Apple's launch of its foldable iPhone, what are the caveats for Chinese buyers?","source":"SCMP","date":"11 Sep 2026","tags":["Technology & AI"],"summary":"Apple has unveiled the iPhone Duo, its first foldable smartphone, at its annual launch event in Cupertino, attempting to break into China's foldable market, the world's largest and dominated by Huawei. Presented by new CEO John Ternus, the passport-style device pairs a 5.4-inch outer screen with a 7.6-inch inner display. It starts at US$1,999 globally and 15,999 yuan (US$2,384) in mainland China, rising to 26,499 yuan for the top model, cheaper than industry estimates despite soaring component costs. Analysts said Apple aims to frame foldability as a premium experience and will set the standard rivals are measured against, though buyers in China face caveats including connectivity and eSIM registration hurdles.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20SCMP/After%20Apple's%20launch%20of%20its%20foldable%20iPhone%2C%20what%20are%20the%20caveats%20for%20Chinese%20buyers.pdf"},{"id":"scmp-11sep-03","title":"Apple enters a crowded foldable smartphone market in China - can it beat Huawei?","source":"SCMP","date":"11 Sep 2026","tags":["Technology & AI"],"summary":"Apple's long-awaited entry into the foldable smartphone market, the iPhone Duo, has drawn immediate attention in China over its high price tag and exclusive dual-eSIM design, as the company targets entrenched domestic rivals Huawei and Xiaomi. Unveiled on Wednesday, Apple's thinnest and most expensive flagship captured consumers' attention with its smooth transition between inner and outer displays, and by Thursday morning a hashtag praising its fold animation had surged to second place on Weibo. But commentators warned the lack of a physical SIM tray could deter buyers, as mainland carriers enforce strict real-name registration requiring in-person identity checks to activate or migrate an eSIM. Financial markets nonetheless welcomed the announcement.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20SCMP/Apple%20enters%20a%20crowded%20foldable%20smartphone%20market%20in%20China%20-%20can%20it%20beat%20Huawei.pdf"},{"id":"scmp-11sep-04","title":"Canada unveils US$254 million air defence package for Ukraine","source":"SCMP","date":"11 Sep 2026","tags":["Defence","Geopolitics"],"summary":"Canada has agreed to a C$350 million (US$254 million) aid package for Kyiv to acquire air defence interceptors, Prime Minister Mark Carney said on Thursday after meeting Ukrainian President Volodymyr Zelensky. Kyiv is running critically low on US-made Patriot interceptors capable of stopping Russia's ballistic missiles as Moscow steps up attacks. Carney said the package would help protect Ukraine's people, infrastructure and skies, with weapons provided through a US programme allowing third-party nations to buy and supply arms such as Patriot missiles. He did not specify which interceptors would be delivered or when. Carney also said Canada aimed to ramp up drone production, sending a third to Ukraine. Canada has committed more than C$25.5 billion in aid since 2022.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20SCMP/Canada%20unveils%20US254%20million%20air%20defence%20package%20for%20Ukraine.pdf"},{"id":"scmp-11sep-05","title":"China presses France to drop 'protectionist' anti-fast fashion law","source":"SCMP","date":"11 Sep 2026","tags":["Trade","Geopolitics"],"summary":"China's Ministry of Commerce said on Thursday it had held talks with French companies operating in China and reiterated calls for France to stop using its anti-fast fashion law to undermine the interests of Chinese enterprises. Spokesperson Huang Ling said public reports suggested some French companies had received EU and member-state subsidies that might have been partly passed through to their Chinese-based entities, and the talks aimed to assess the impact. The ministry urged Paris to halt implementation of legislation regulating ultra-fast fashion, saying it had clear trade protectionist traits despite being promoted as environmental. The rules classify clothing by market volume and repair costs, applying a per-item fee. Shein recently made a muted Hong Kong debut.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20SCMP/China%20presses%20France%20to%20drop%20'protectionist'%20anti-fast%20fashion%20law.pdf"},{"id":"scmp-11sep-06","title":"China rebuts top US diplomat Marco Rubio over 'Communist Party-backed projects' in Peru","source":"SCMP","date":"11 Sep 2026","tags":["Geopolitics"],"summary":"China's embassy in Lima has rebutted US Secretary of State Marco Rubio, who held talks in Peru on countering Beijing's growing footprint around the strategic Chancay megaport. Rubio met President Keiko Fujimori, who confirmed Peru would join the US-led Shield of the Americas coalition against organised crime, on the last stop of a three-day tour also covering Colombia and Ecuador. Rubio wrote that projects backed by the Chinese Communist Party bypass Peru's legal frameworks and pose transparency and data-security risks. The embassy defended a US$30 billion investment stock, said China had never interfered in other countries' affairs, and declared the western hemisphere was nobody's backyard, while taking aim at US visa curbs.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20SCMP/China%20rebuts%20top%20US%20diplomat%20Marco%20Rubio%20over%20'Communist%20Party-backed%20projects'%20in%20Peru.pdf"},{"id":"scmp-11sep-07","title":"China says yuan's global rise is 'irreversible' - and has a strategy to back it up","source":"SCMP","date":"11 Sep 2026","tags":["Finance & Markets"],"summary":"Chinese financial authorities have pledged further steps to expand the yuan's global use amid a broader de-dollarisation trend, while vowing to make mainland stock exchange listings the primary choice for top-tier domestic companies. PBOC deputy governor Lu Lei called the internationalisation of the yuan a continuous, steady and irreversible trend at a Thursday press conference. China would increase bilateral currency swaps and local-currency settlement, improve its Cross-Border Interbank Payment System as an alternative to Swift, and expand cross-border use of the digital yuan and QR payments. Authorities pledged to reinforce Hong Kong as the premier offshore yuan hub while supporting development in London, Singapore and Dubai. The yuan is China's top cross-border settlement currency.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20SCMP/China%20says%20yuan's%20global%20rise%20is%20'irreversible'%20-%20and%20has%20a%20strategy%20to%20back%20it%20up.pdf"},{"id":"scmp-11sep-08","title":"China's Xi Jinping to make first trip to India in 7 years for Brics summit","source":"SCMP","date":"11 Sep 2026","tags":["Geopolitics","Politics"],"summary":"China has confirmed President Xi Jinping will travel to New Delhi for the Brics summit this weekend, his first visit to India in close to seven years and the latest leg of his busiest run of summitry in years. China's foreign ministry said Xi would attend at the invitation of Indian Prime Minister Narendra Modi, and the two are expected to hold a sit-down. The trip follows visits to Kyrgyzstan for the SCO summit and Egypt, and precedes an expected Washington trip to meet President Donald Trump this month. Russia's Putin and other leaders will also attend. The visit comes as China and India work to improve ties soured by a deadly 2020 border clash.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20SCMP/China's%20Xi%20Jinping%20to%20make%20first%20trip%20to%20India%20in%207%20years%20for%20Brics%20summit.pdf"},{"id":"scmp-11sep-09","title":"Chinese scientists boost hydrogen fuel cell power fourfold with new design","source":"SCMP","date":"11 Sep 2026","tags":["Technology & AI","Energy"],"summary":"Chinese scientists have developed a way to generate a fourfold increase in the power output of hydrogen fuel cells, an advance that could broaden their use from road vehicles to space missions while cutting reliance on costly platinum. In a study published in Science on Thursday, researchers at the Beijing Institute of Technology reported a breakthrough in proton-exchange membrane fuel cells, already used in many hydrogen vehicles. The bottleneck has been the speed at which protons move through the catalyst layer, with standard materials such as Nafion forming tightly packed structures that slow transport. The team designed a new interface working like a relay race, letting protons hop between intermediates rather than travelling directly, sharply improving efficiency.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20SCMP/Chinese%20scientists%20boost%20hydrogen%20fuel%20cell%20power%20fourfold%20with%20new%20design.pdf"},{"id":"scmp-11sep-10","title":"DeepSeek says new Flash AI model beats Kimi K3 on cyber, coding benchmarks","source":"SCMP","date":"11 Sep 2026","tags":["Technology & AI"],"summary":"DeepSeek has released its V4.1 Flash model, claiming it outperforms its previous flagship while cutting inference costs and boosting speed, the latest salvo in China's aggressive AI price-and-performance war. The developer said the model uses a new Causal-Encoder-Decoder architecture built on a 552 billion-parameter framework but relying on a Mixture-of-Experts design that activates just 8 billion parameters to process inputs and 16 billion to generate responses, significantly reducing computing power per request. Described as the smallest model in its new series with native multimodal visual understanding, V4.1 Flash outperformed V4 Pro on coding, cybersecurity and autonomous-agent benchmarks. The launch comes as rising hardware costs and foreign chip export curbs push Chinese players to offer efficient models at fraction-of-a-cent costs.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20SCMP/DeepSeek%20says%20new%20Flash%20AI%20model%20beats%20Kimi%20K3%20on%20cyber%2C%20coding%20benchmarks.pdf"},{"id":"scmp-11sep-11","title":"Hong Kong can become AI literacy hub, industry leaders say","source":"SCMP","date":"11 Sep 2026","tags":["Technology & AI","Society"],"summary":"Hong Kong can become an educational hub for artificial intelligence literacy and help build trustworthy AI by leveraging the city's strength in professional services, industry leaders said at the Belt and Road Summit on Thursday. Ellen Lau Sin-tung, executive director of technology training company Preface AI, highlighted a significant gap between corporate leadership and frontline staff during digital transformation, noting leaders often express frustration over AI adoption while employees are held back by fear of being replaced. Speaking on a panel co-organised by the South China Morning Post, Lau said AI literacy was important to help people differentiate between models and understand AI agents, and urged senior management to work hand in hand with frontline staff.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20SCMP/Hong%20Kong%20can%20become%20AI%20literacy%20hub%2C%20industry%20leaders%20say.pdf"},{"id":"scmp-11sep-12","title":"Huawei racketeering trial in US enters second day of testimony","source":"SCMP","date":"11 Sep 2026","tags":["Technology & AI","Geopolitics"],"summary":"Huawei Technologies' landmark US criminal case entered its second day of testimony on Thursday in Brooklyn, New York, with key witnesses expected to appear. On the opening day, a US government lawyer told jurors Huawei engaged in criminal activity to achieve growth at any cost, alleging a culture of crime had existed at the company for over 20 years, stemming from top leadership including founder Ren Zhengfei and daughter Meng Wanzhou. The defence said employees who broke company policies were punished and that Meng's 2021 admission of violating US sanctions on Iran, part of a negotiated statement of fact, should not be viewed as a confession of deliberate deception. Meng spent almost three years under house arrest after her 2018 arrest in Canada.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20SCMP/Huawei%20racketeering%20trial%20in%20US%20enters%20second%20day%20of%20testimony.pdf"},{"id":"scmp-11sep-13","title":"Japan's AI satellites and other space ambitions 'a serious threat', China warns","source":"SCMP","date":"11 Sep 2026","tags":["Defence","Technology & AI","Geopolitics"],"summary":"Japan's plan to develop tactical satellites equipped with artificial intelligence would boost its long-range offensive strike capabilities and pose a serious threat, Chinese state media has warned, with CCTV calling the plan a cornerstone of Tokyo's broader space militarisation strategy. The Nikkei newspaper reported the AI-equipped satellites would analyse surveillance intelligence in space to speed up targeting decisions and strengthen counterstrike capability such as missile guidance. Japan's defence ministry will develop a prototype with domestic companies and conduct ground tests, with launches expected from the 2030 financial year and funding included in the 2027 draft defence budget. By processing data in orbit and sending only AI-generated analysis, the project aims to cut space-to-ground communication time.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20SCMP/Japan's%20AI%20satellites%20and%20other%20space%20ambitions%20'a%20serious%20threat'%2C%20China%20warns.pdf"},{"id":"scmp-11sep-14","title":"Over 65% of cars sold in China are now EVs as Iran war drives electric shift","source":"SCMP","date":"11 Sep 2026","tags":["Energy","Technology & AI"],"summary":"China's electric vehicle adoption rate has hit an all-time high, as the Iran war drives motorists to shift away from petrol cars despite a sluggish automotive market. A record 65.2 per cent of the 1.54 million cars sold in mainland China last month were pure electric or plug-in hybrid vehicles, data from the China Passenger Car Association showed, edging past the previous record of 65.1 per cent. Petrol car sales plunged 40 per cent year on year while EV deliveries fell a more modest 10.1 per cent. Dealers said rising fuel costs, eased range anxiety and the debut of hundreds of new EV models with advanced driver-assistance systems were accelerating the shift. Brent crude remains far above pre-war levels.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20SCMP/Over%2065%20of%20cars%20sold%20in%20China%20are%20now%20EVs%20as%20Iran%20war%20drives%20electric%20shift.pdf"},{"id":"scmp-11sep-15","title":"Record China-US gap in bond yields unlikely to trigger capital flight: Marsh Investment","source":"SCMP","date":"11 Sep 2026","tags":["Finance & Markets"],"summary":"The widening yield spread between Chinese and American government bonds is unlikely to trigger catastrophic capital flight from China, according to executives at Marsh Investment, who attribute the record spread to US fiscal pressures and global macro trends rather than a structural retreat from Chinese assets. The gap between 10-year US Treasury bonds and equivalent Chinese sovereign bonds hit a record 3.17 percentage points this week, with US yields rising to 4.85 per cent, their highest since 2023, while China's held at 1.68 per cent. Global chief investment officer Niall O'Sullivan said capital flight was not a major driver of dollar and rate moves, attributing elevated US yields to supply-demand imbalances, expanding national debt and heavy corporate borrowing across tech and AI.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20SCMP/Record%20China-US%20gap%20in%20bond%20yields%20unlikely%20to%20trigger%20capital%20flight%20Marsh%20Investment.pdf"},{"id":"scmp-11sep-16","title":"Senior Pentagon official for China to lead US delegation to Xiangshan Forum","source":"SCMP","date":"11 Sep 2026","tags":["Defence","Geopolitics"],"summary":"The American delegation to the Xiangshan Forum, a major Chinese security conference in Beijing, will be led by Cynthia \"Xanthi\" Carras, the principal director for China, Taiwan and Mongolia at the Department of Defence, the South China Morning Post has learned. This year's forum, its 13th edition, runs from next Tuesday to Thursday. Carras' attendance marks a higher level of US participation than last year, when Washington sent a defence attache from its Beijing embassy. The forum is often seen as Beijing's counterpart to Singapore's Shangri-La Dialogue. It comes weeks before Xi Jinping is expected to visit Washington, following Trump's May trip to China. Chinese Defence Minister Dong Jun is expected to deliver a keynote speech.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20SCMP/Senior%20Pentagon%20official%20for%20China%20to%20lead%20US%20delegation%20to%20Xiangshan%20Forum.pdf"},{"id":"scmp-11sep-17","title":"Tech, EV and aerospace executives likely to join Xi's US trip to mirror Trump team","source":"SCMP","date":"11 Sep 2026","tags":["Geopolitics","Trade"],"summary":"Beijing is weighing plans to send a group of top tech, electric vehicle and aerospace executives to accompany President Xi Jinping to Washington later this month, as the two sides race to finalise details for the closely watched visit. Sources said China had approached the selection aiming to model the American CEO delegation that followed President Donald Trump to China earlier this year, meaning the Chinese group would comprise leaders from tech, finance, EV and aerospace. One source said China had yet to formally commit to bringing business leaders, but both sides were treating every aspect of the visit as a matter of reciprocity. Sources cautioned the plans may be more about optics than concrete results. A networking event is on the agenda.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20SCMP/Tech%2C%20EV%20and%20aerospace%20executives%20likely%20to%20join%20Xi's%20US%20trip%20to%20mirror%20Trump%20team.pdf"},{"id":"scmp-11sep-18","title":"The Global South cannot afford to let its maritime border disputes fester","source":"SCMP","date":"11 Sep 2026","tags":["Geopolitics","Southeast Asia"],"summary":"This opinion piece argues the Global South can no longer afford to leave maritime border disputes unresolved, warning they risk confrontation and create grey zones ripe for illegal fishing as future chokepoints for resource development. Dozens of sea borders remain unsettled, many involving overlapping claims to resource-rich areas, with Africa having the highest number of unresolved boundaries. Conflict in the Middle East has shaken energy markets and exposed the Global South while disrupting the legal order maritime security depends on. The author points to the Gulf of Thailand, where Thailand withdrew from a 25-year memorandum with Cambodia over undersea energy resources valued at over US$300 billion, prompting Cambodia to initiate compulsory conciliation under UNCLOS as a peaceful model.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20SCMP/The%20Global%20South%20cannot%20afford%20to%20let%20its%20maritime%20border%20disputes%20fester.pdf"},{"id":"scmp-11sep-19","title":"Trump threatens Taiwan's representative office, sparking debate over island's US policy","source":"SCMP","date":"11 Sep 2026","tags":["Geopolitics","Politics"],"summary":"Taiwan's representative office is among entities US President Donald Trump has threatened to sue in his campaign against a progressive American think tank, triggering debate over the island's US policy ahead of Xi Jinping's Washington visit. Trump named the Taipei Economic and Cultural Representative Office (Tecro) in a social media post attacking the Centre for American Progress over a report disputing his claims about National Guard deployments and violent crime. He called the think tank a radical left scam, threatened to seek US$5 billion in damages, and named Tecro alongside the Japanese embassy, the Korea Foundation and the UAE embassy as foreign supporters. The remarks raised questions in Taiwan about whether funding US think tanks has become a political liability.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20SCMP/Trump%20threatens%20Taiwan's%20representative%20office%2C%20sparking%20debate%20over%20island's%20US%20policy.pdf"},{"id":"scmp-11sep-20","title":"US Navy plans compact Silent Anvil torpedo as China's submarine fleet surges","source":"SCMP","date":"11 Sep 2026","tags":["Defence"],"summary":"As China expands its submarine fleet, the US Navy is looking to develop a compact air-launched torpedo that could enable more crewed and uncrewed aircraft to attack submarines from farther away. The Naval Air Systems Command issued a request for information in late August for the Silent Anvil Air-Launched Torpedo, a step towards development. While air-launching torpedoes is not new, the new weapon would be much smaller than the existing HAAWC, which adds a glide kit to a Mark 54 torpedo launched by P-8A Poseidon aircraft. The navy wants the weapon to weigh up to 268lb and measure up to 70 inches long, broadening the range of aircraft that could carry it, and to be compatible with aircraft carrier storage.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20SCMP/US%20Navy%20plans%20compact%20Silent%20Anvil%20torpedo%20as%20China's%20submarine%20fleet%20surges.pdf"},{"id":"scmp-11sep-21","title":"US existing home sales hit weakest pace in over a year","source":"SCMP","date":"11 Sep 2026","tags":["Finance & Markets"],"summary":"Sales of previously owned homes in the United States slowed last month to their weakest pace in more than a year, as would-be buyers waited for relief on mortgage rates. Contract closings slipped 2 per cent to an annualised rate of 3.98 million in August, National Association of Realtors data showed, one of only two times since autumn 2024 that sales dipped below 4 million. The median sales price rose 1.6 per cent from a year earlier to US$429,100. Mortgage rates, now at their highest in over a year, discourage moves, especially for owners who refinanced cheaply. NAR chief economist Lawrence Yun said rates could soon touch 7 per cent but noted job and wage gains were supporting demand, with rising supply a positive sign.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20SCMP/US%20existing%20home%20sales%20hit%20weakest%20pace%20in%20over%20a%20year.pdf"},{"id":"scmp-11sep-22","title":"US producer inflation tops expectations as energy costs jump amid Iran war","source":"SCMP","date":"11 Sep 2026","tags":["Finance & Markets","Energy"],"summary":"US wholesale inflation picked up more than expected in August, government data showed on Thursday, driven by higher energy costs, particularly for diesel, as the US war with Iran continued. The Producer Price Index rose 5.4 per cent year on year, a significant acceleration from July's 4.8 per cent and above the 5.3 per cent economists expected. On a monthly basis PPI rose 0.4 per cent, in line with forecasts. Energy costs jumped 4.2 per cent over the month, boosted by diesel, which surged 24.1 per cent. Petrol and diesel costs have risen since US-Israeli strikes on Iran in late February prompted Tehran to choke off the Strait of Hormuz. Rising pump prices are squeezing households weeks ahead of key midterm elections.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20SCMP/US%20producer%20inflation%20tops%20expectations%20as%20energy%20costs%20jump%20amid%20Iran%20war.pdf"},{"id":"scmp-11sep-23","title":"US says China 'on track' to fulfil farm purchases ahead of Xi's Washington visit","source":"SCMP","date":"11 Sep 2026","tags":["Trade","Geopolitics"],"summary":"The Trump administration said on Wednesday that China is on track to meet its agricultural purchase commitments, with the sector expected to feature prominently in deliverables for Trump and Xi Jinping's talks in Washington later this month. Luke Lindberg, US Under Secretary for Trade and Foreign Agricultural Affairs, said China was ramping up purchases and was on track to buy US$17 billion worth of US agricultural products this year, which with soybeans would bring annual sales to US$30 billion. He said China had met its commitment to buy 12 million metric tonnes of US soybeans in the 2025 season and was on track for a 25 million tonne target this year. The soybean deal was a key outcome of the Busan trade truce.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20SCMP/US%20says%20China%20'on%20track'%20to%20fulfil%20farm%20purchases%20ahead%20of%20Xi's%20Washington%20visit.pdf"},{"id":"scmp-11sep-24","title":"Why the global economy and markets continue to defy doomsayers","source":"SCMP","date":"11 Sep 2026","tags":["Finance & Markets","Energy"],"summary":"This analysis argues that despite rising energy prices and bond yields, economic growth has been resilient and equity markets strong. On September 9, Brent crude surpassed US$100 a barrel amid intensifying Middle East hostilities, while long-dated G7 government bond yields have risen to their highest since 2000 and US 10-year Treasury yields approach the 5 per cent level beyond which higher yields start to hurt stocks. These threats add to uncertainty from Trump's trade tariffs, which have damaged US alliances. Yet the global economy has held up remarkably well, with data beating expectations for the longest period on record excluding the 2009-10 rebound. Global manufacturing and services output hit a nearly 30-month high, and the MSCI All-Country World Index stands at a record.","url":"https://stcsg-my.sharepoint.com/personal/bloomberg_tecity_com_sg/Documents/PMST%20Research%20Dashboard/Daily%20News/2026/Sep%202026/11%20Sep%202026/11%20Sep%20SCMP/Why%20the%20global%20economy%20and%20markets%20continue%20to%20defy%20doomsayers.pdf"}]}};</script>
